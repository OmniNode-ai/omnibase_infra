# OMN-26732: every configuration value in this repository, its kind, its home and the order it moves in
# Kept as YAML: the kb-doc-gate refuses tracked markdown here. Values are never printed here, only file and line.
ticket: OMN-26732
base_sha: af942f0388495323afbb1d8dd744f2f7dfb51b74
scope: every tracked non-test file under this repository at base_sha whose lines match the kind patterns in tests/ci/test_config_value_audit_omn26732.py
homes: [overlay, settings-store, contract-shape]
rules:
  R_EVIDENCE: {home: contract-shape, reason: "Ticket evidence contracts are frozen records of past checks; the value is data in a record, not a runtime read, and the contract format stays."}
  R_GRANT_SHAPE: {home: contract-shape, reason: "Which role may touch which table is the authorization contract: it is derived from migrations and checked by the topology validators, so it stays in this repository."}
  R_VALIDATOR: {home: contract-shape, reason: "The value is a pattern a validator matches (private ranges, URL shapes), not an address any lane reads."}
  R_ADDR_OVERLAY: {home: overlay, reason: "A lab or lane address changes per host and per lane, so the value belongs in the lane overlay repository and this repository names only the slot."}
  R_SRC_SHAPE: {home: contract-shape, reason: "Library code names a default, enum member or example that is a typed shape; the live value is read from the overlay or store at runtime."}
  R_HOST_OVERLAY: {home: overlay, reason: "A host name or slot-to-host binding is lab topology and moves with the lab, so overlay hold it."}
  R_PORT_SHAPE: {home: contract-shape, reason: "A protocol default or contract-declared port is part of the declared shape and is read by the loader, not chosen per lane."}
  R_PORT_CONTAINER: {home: contract-shape, reason: "Container-to-container ports in service definitions, deploy and CI are hardcoded_env by repo rule; they do not vary per host."}
  R_PORT_OVERLAY: {home: overlay, reason: "A published port that differs per lab host or lane belongs with the host address in overlay."}
  R_MODEL_SHAPE: {home: contract-shape, reason: "Library code carries model-id enums and pricing keys as typed shape; which model a lane serves is not decided here."}
  R_MODEL_OVERLAY: {home: overlay, reason: "Which model a lane or slot serves changes with the lab and is declared per lane, so overlay hold it."}
  R_HW_SHAPE: {home: contract-shape, reason: "A capability enum or dependency pin names hardware as a type, not as a fact about one host."}
  R_HW_OVERLAY: {home: overlay, reason: "A fact about one host (card, memory, core count) is lab inventory and belongs with the host in overlay."}
  R_ENV_STORE: {home: settings-store, reason: "A per-environment value read by CI (repository variables, runner labels) is a setting an operator changes without a code change, so the settings store holds it."}
  R_ENV_OVERLAY: {home: overlay, reason: "A per-environment or per-lane value used by a lane or script is a lane overlay value, not a contract."}
  R_GRANT_CRED: {home: settings-store, reason: "A credential for a granted role is a secret and lives in the store."}
  R_LANE_OVERLAY: {home: overlay, reason: "The file binds a lane or lab host to addresses, models or capacity, so it is lane overlay content and moves with the lab."}
  R_OVERLAY_SHAPE: {home: contract-shape, reason: "A shipped example of the overlay file format per environment type; it documents the shape and holds no live lab value."}
  R_LANE_COMPOSE: {home: contract-shape, reason: "A generated service topology for a lane class; its service definitions are the shape, and the values inside it are counted under the other kinds."}
