runtime_account_grants:
  answer: contract-shape
  home: contract-shape
  where:
    - src/omnibase_infra/topology/instances/
  kind: the PR 6337 grant of the lane_work_workflow table to the runtime account, written into every topology instance file in the directory named under where
  reason: "A grant says which role may read or write which table. It is identical in meaning across lanes, is derived from the vendored migrations and ownership declarations by the grant generator and checked by its --check mode and the migration integration test, and carries no address, host, secret or per-lane value. It therefore stays in this repository as a contract shape and never moves to overlay. What is configuration is the credential that logs in as the granted role: the topology instances hold only the environment variable name or the secret reference, and the value belongs in the settings store."
  not_moved:
    - the role name and the table list (shape)
    - the choice of which instance a profile resolves to, in src/omnibase_infra/topology/application_database_profiles.yaml (shape)
  moved_to_store:
    - the database login value behind each dsn_env or secret_ref binding
move_plan:
  principle: A value is moved in this order only. The value lands in overlay or the settings store and is read back there; then this repository switches to read it; then the literal is deleted in the same change as the switch. No step switches a reader before the value is held.
  steps:
    - {id: S1, group: lab-addresses-hosts-ports-hardware-models, kind: land, action: "Add each value of the addresses, host_names, ports (overlay rule), hardware_facts (overlay rule) and model_ids (overlay rule) kinds to the lane overlay repository, one key per slot or lane, with the endpoint_urls shape the slot loader already reads.", requires: []}
    - {id: S2, group: lab-addresses-hosts-ports-hardware-models, kind: verify, action: "Read every landed key back through the real overlay source with the endpoint overlay main check (tests/integration/models/test_llm_endpoint_overlay_main_check_omn26709.py), with no fixture overlay, and confirm the repository variable OMNI_CI_ENDPOINT_OVERLAY_REPO names the lane overlay repository.", requires: [S1]}
    - {id: S3, group: lab-addresses-hosts-ports-hardware-models, kind: switch, action: "Switch the loader, the compose generator and the deploy agent to read each key from the overlay, one kind per change, running compose_gen against the real overlay.", requires: [S2]}
    - {id: S4, group: lab-addresses-hosts-ports-hardware-models, kind: delete, action: "Delete the literal from this repository in the same change as its S3 switch.", requires: [S3]}
    - {id: S5, group: lane-overlay-files, kind: land, action: "Add the contents of the lane_overlay files under rule R_LANE_OVERLAY (per-host lane routing, runner fleet, lab proof profiles, machines, per-host compose, the model registry) to the lane overlay repository.", requires: [S2]}
    - {id: S6, group: lane-overlay-files, kind: switch, action: "Switch the deploy agent and the generators to read those files from overlay.", requires: [S5]}
    - {id: S7, group: lane-overlay-files, kind: delete, action: "Delete the files from this repository in the same change as S6.", requires: [S6]}
    - {id: S8, group: per-environment-ci-values, kind: land, action: "Seed each per_environment_values entry under rule R_ENV_STORE into the settings store (seed-infisical dry run first), then read it back.", requires: []}
    - {id: S9, group: per-environment-ci-values, kind: switch, action: "Switch the workflow or script to read the setting from the store or the repository variable.", requires: [S8]}
    - {id: S10, group: per-environment-ci-values, kind: delete, action: "Delete the literal in the same change as S9.", requires: [S9]}
    - {id: S11, group: topology-grants-and-contract-shape, kind: keep, action: "Move nothing for the contract-shape rows, including topology grants. Guard the shape with the existing topology tests.", requires: []}
