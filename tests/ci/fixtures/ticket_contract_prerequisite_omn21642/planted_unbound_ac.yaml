    description: "The discovery shim returns the unfiltered manifest and a node exclusion does not make the health check raise."
    source: generated
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/services/test_service_runtime_health_monitor.py tests/unit/services/test_runtime_health_monitor_profile_read.py -q -p no:cacheprovider'
  - id: dod-002
    description: "A projection whose topics all wait for a first record is out of the attachment scope, and the demand source keeps the idle set."
    source: generated
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/handlers/test_omn18087_handler_kafka_topic_demand_source.py tests/unit/runtime/health/test_omn16994_projection_liveness.py -q -p no:cacheprovider'
