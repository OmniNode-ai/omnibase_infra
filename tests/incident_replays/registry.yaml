    test: tests/ci/test_runner_broker_dispatch_wedge_rerun.py::TestOmn15776IncidentReplay::test_real_wedge_job_is_rejected_ie_flagged_for_rerun
    why: >-
      GitHub's Actions broker dispatched job 93294479341 ("No Divergent Automation PRs (OMN-14778)", onex_change_control run 31333147268) to omninode-runner-17 within seconds of that same runner finishing its prior job, exactly while the runner's Runner.Listener was mid-reconnect on its broker long-poll after the retry/backoff storm every job completion triggers on that connection. The dispatch was never delivered to the runner's local message loop -- the runner's own _diag log has zero "Running job" entry for it, confirmed independently across 4 runners in the 2026-08-09 investigation -- so GitHub's server-side clock ran alone and orphaned the assignment at exactly 600s (started_at 20:06:56Z, completed_at 20:16:56Z), recording steps=[] because no Runner.Worker ever spawned. Direction is false_green: before this guard existed, that was the entire lifecycle -- a real, unrecoverable red that no local process (not the OMN-14564 heartbeat watchdog, which never saw a listener go silent or a Worker exist to guard) could observe or act on, so it sat there until a human happened to notice across several 2026-08-09 ledger passes and diagnosed it without being able to fix it ("not fixable via rerun or from this session's access level" -- see the mergesweep-0809-runnerfix ledger entry). The replay drives the real script against the verbatim captured job and requires it to REJECT the artifact: recognize the structural signature (runner assigned, conclusion=failure, steps=[], duration in the tight 595-605s band around the proven fixed ~10m0-1s server-side timeout) and reissue exactly that job -- proving the guard actually closes the gap on the real incident bytes, not a hand-typed approximation of them.
