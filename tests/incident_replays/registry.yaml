# INCIDENT REPLAY REGISTRY (OMN-15547)
#
# Enforced by `scripts/ci/check_incident_replay_coverage.py`. Read that module's
# docstring for rules R1-R5 and why they are worded the way they are.
#
# The one-line version: a guard that has never been run against the real thing
# it exists to catch is decorative. On 2026-07-30 three separate guards were
# green while enforcing nothing, each because its tests fed it a synthetic input
# that could not exhibit the failure.
#
# HOW TO ADD A CASE (the honest bar)
#   1. Get the real bytes. Fetch them from the surface that actually failed --
#      `gh api` a run/PR, `git cat-file` the object, `curl` the live endpoint,
#      `scp` the host file. Do NOT retype them from memory or from a report; a
#      plausible-looking reconstruction is the defect, not the fix.
#   2. Commit them verbatim under `tests/fixtures/<incident>/`. Use a
#      `.captured` infix so header/format hooks leave the bytes alone -- a
#      reformatted artifact is no longer the artifact that failed.
#   3. Record the sha256 and a `capture.source` locator someone else can
#      re-fetch. Free-text provenance is rejected on purpose: a hand-typed
#      fixture has no locator that resolves, and that is the only difference a
#      machine can see between a capture and an invention.
#   4. Write the test that drives the REAL guard with those bytes and asserts
#      the verdict the buggy guard got wrong.
version: 1
