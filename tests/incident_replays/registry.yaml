cases:
  - id: omn15525-health-body-truncation
    guard: deploy/maintenance/omninode-system-slack-report.sh
    incident: OMN-15525
    regression_class: false_red
    guard_verdict_on_artifact: accept
    artifact:
      fixture: tests/fixtures/omn15547/health-dev-8085.json.captured
      sha256: 240178e33079f76b38f4995c39b7a90da68c37d4f08365c13752411a9da6050a
    capture:
      method: live-fetch
      source: live-http:omni-201-ts:8085/health
      captured_at: 2026-07-31T00:03:06Z
      captured_by: lane replay (OMN-15547)
    test: tests/unit/scripts/test_omninode_system_slack_report.py::test_healthy_lane_with_a_realistic_body_is_not_critical
    discriminator: tests/unit/scripts/test_omninode_system_slack_report.py::test_unreachable_runtime_endpoint_is_critical_not_skipped
    why: >-
      The reporter truncated the /health body to 180 bytes before handing it to jq. Every real body on .201 is 2079-2644 bytes, so jq died on every lane ("Unfinished string at EOF"), the verdict fell through to `unresolvable`, and the alert paged CRITICAL for all three lanes against a fully healthy fleet. The suite could not see any of it because HEALTHY_BODY was 63 bytes -- under the cut. The OMN-15525 repair made the literal bigger but kept it hand-typed ("Shape mirrors the live body"); this case replaces it with the 2644 bytes the endpoint actually returned, so the fixture can exhibit failure modes nobody anticipated. Direction is false_red, so the `discriminator` is required: it proves the same reporter still says CRITICAL when an endpoint is genuinely unreachable, which is what stops an accept-only proof from passing a stuck-open guard.
  - id: omn15547-handtyped-fixture-passed-as-proof
    guard: scripts/ci/check_incident_replay_coverage.py
    incident: OMN-15547
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/test_omninode_system_slack_report.handtyped-fixture.py.captured
      sha256: 10cfdc48ef1a80dbc10f2c9cf1a84cfc20a68877111e15b5cbe1e56c428c5a0c
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@0f05039434996594000db85cd8d3947523bfebcf:tests/unit/scripts/test_omninode_system_slack_report.py
      captured_at: "2026-07-31T00:12:00Z"
      captured_by: lane replay (OMN-15547)
    test: tests/ci/test_incident_replay_coverage_omn15547.py::test_the_shipped_handtyped_fixture_fails_r1_and_r2
    why: >-
      This lint is itself a new guard, so its own default-deny rule demands a real regression case rather than a baseline exemption -- and it fired on itself the first time it was wired, which is how this case came to exist. The artifact is the verbatim blob that shipped on dev at 0f050394 as the REPAIR for OMN-15525: a hand-typed HEALTHY_BODY literal defended by the comment "Shape mirrors the live body". It was accepted as proof, and it was not proof -- the key names, nesting and value shapes were guesses, so the fixture could only ever exhibit failure modes its author had already imagined. The case drives the real R1/R2 predicates over those bytes and requires BOTH to say no: R1 because the body is a literal inside the test rather than a committed capture, R2 because "Shape mirrors the live body" is the strongest provenance the file offers and it resolves to nothing. A world with this lint could not have shipped that blob; a world without it did, twice.
