cases:
  - id: omn17335-uv-resolved-from-path-only
    guard: scripts/check_reconciler_privilege.py
    incident: OMN-17335
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn17335/reconcile-workspace-venvs.path-only-uv.sh.captured
      sha256: 8d01a361fe794465792239a2bc1857265dada918f73b3a8bd0204354bf716142
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@1b66d58f920c1b75de23fab085c55252540f0b7f:scripts/reconcile-workspace-venvs.sh
      captured_at: '2026-08-31T15:40:00Z'
      captured_by: lane replay (OMN-17335)
    test: tests/scripts/test_reconcile_uv_privilege_omn17335.py::test_the_shipped_reconciler_that_resolved_uv_from_path_only_is_rejected
    why: 'The artifact is the verbatim venv reconciler as it shipped on dev at 1b66d58f -- the code the `.201` maintenance cron actually ran. Line 210 is the whole defect: `UV_BIN="$(command -v uv 2>/dev/null || true)"`, then INDETERMINATE on an empty result. The cron.d unit pins PATH to /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin, which cannot reach a user-local install by construction, so the reconciler refused every hour on a host where uv 0.11.5 was installed the whole time at ~/.local/bin/uv (verified live: `sudo /home/<owner>/.local/bin/uv --version` -> uv 0.11.5, and the venv''s own pyvenv.cfg records `uv = 0.11.5`). The ticket filed against the refusal then re-ran the same PATH-shaped probe over ssh, got the same empty answer, and concluded the tool was not installed on the machine at all -- an empty result promoted to evidence of absence, twice, inside the family of scripts built to stop exactly that. This file was reviewed, merged and scheduled with nothing objecting. The case drives the real gate over these exact bytes and requires it to say no.'
  - id: omn17307-reconciler-judged-by-exit-code
    guard: scripts/check_reconciler_movement_proof.py
    incident: OMN-17307
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn17307/reconcile-workspace-venvs.no-movement-proof.sh.captured
      sha256: 0804b196a851180fe5d14a7306fdd41b63d28f1404f5e2f5e75632a5a93a9dd8
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@196cdaef91b58aecf9c31495c14ef9cf4db9e777:scripts/reconcile-workspace-venvs.sh
      captured_at: '2026-08-31T10:55:00Z'
      captured_by: lane replay (OMN-17307)
    test: tests/scripts/test_check_reconciler_movement_proof_omn17307.py::test_the_shipped_reconciler_that_judged_by_exit_code_is_rejected
    why: 'The artifact is the verbatim workspace venv reconciler as it shipped on dev at 196cdaef, the wired repair path for every local venv. Read its repair function: it runs install-node-skill-package.sh and `uv sync --frozen --inexact` and then `exit 0` on their exit STATUS. It never re-reads the venv. That is not a theoretical gap -- the provider co-install carries a hardcoded COMPAT_PIN that downgrades omnibase-compat 0.5.6 to 0.5.5 (OMN-16262) and broke the `occ` CLI extension badly enough that the `onex` binary would not start, and no exit code can see a content change like that. The same shape on the clone surface is what let a `.201` clone with core.bare=true report as synced forever, because `git fetch` exits 0 while `git checkout` exits 128 (OMN-17291). Nothing in the repo flagged this file: it was reviewed, merged and scheduled. The case drives the real gate over a tree containing these exact bytes and requires it to say no, which is the verdict that did not exist when they shipped.'
  - id: omn15525-health-body-truncation
    guard: deploy/maintenance/omninode-system-slack-report.sh
    incident: OMN-15525
    regression_class: false_red
    guard_verdict_on_artifact: accept
    artifact:
      fixture: tests/fixtures/omn15547/health-dev-8085.json.captured
      sha256: 240178e33079f76b38f4995c39b7a90da68c37d4f08365c13752411a9da6050a
    capture:
      method: live-fetch
      source: live-http:omni-201-ts:8085/health
      captured_at: 2026-07-31T00:03:06Z
      captured_by: lane replay (OMN-15547)
    test: tests/unit/scripts/test_omninode_system_slack_report.py::test_healthy_lane_with_a_realistic_body_is_not_critical
    discriminator: tests/unit/scripts/test_omninode_system_slack_report.py::test_unreachable_runtime_endpoint_is_critical_not_skipped
    why: >-
      The reporter truncated the /health body to 180 bytes before handing it to jq. Every real body on .201 is 2079-2644 bytes, so jq died on every lane ("Unfinished string at EOF"), the verdict fell through to `unresolvable`, and the alert paged CRITICAL for all three lanes against a fully healthy fleet. The suite could not see any of it because HEALTHY_BODY was 63 bytes -- under the cut. The OMN-15525 repair made the literal bigger but kept it hand-typed ("Shape mirrors the live body"); this case replaces it with the 2644 bytes the endpoint actually returned, so the fixture can exhibit failure modes nobody anticipated. Direction is false_red, so the `discriminator` is required: it proves the same reporter still says CRITICAL when an endpoint is genuinely unreachable, which is what stops an accept-only proof from passing a stuck-open guard.
