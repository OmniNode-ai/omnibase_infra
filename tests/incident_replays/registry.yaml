cases:
  - id: omn15525-health-body-truncation
    guard: deploy/maintenance/omninode-system-slack-report.sh
    incident: OMN-15525
    regression_class: false_red
    guard_verdict_on_artifact: accept
    artifact:
      fixture: tests/fixtures/omn15547/health-dev-8085.json.captured
      sha256: 240178e33079f76b38f4995c39b7a90da68c37d4f08365c13752411a9da6050a
    capture:
      method: live-fetch
      source: live-http:omni-201-ts:8085/health
      captured_at: 2026-07-31T00:03:06Z
      captured_by: lane replay (OMN-15547)
    test: tests/unit/scripts/test_omninode_system_slack_report.py::test_healthy_lane_with_a_realistic_body_is_not_critical
    discriminator: tests/unit/scripts/test_omninode_system_slack_report.py::test_unreachable_runtime_endpoint_is_critical_not_skipped
    why: >-
      The reporter truncated the /health body to 180 bytes before handing it to jq. Every real body on .201 is 2079-2644 bytes, so jq died on every lane ("Unfinished string at EOF"), the verdict fell through to `unresolvable`, and the alert paged CRITICAL for all three lanes against a fully healthy fleet. The suite could not see any of it because HEALTHY_BODY was 63 bytes -- under the cut. The OMN-15525 repair made the literal bigger but kept it hand-typed ("Shape mirrors the live body"); this case replaces it with the 2644 bytes the endpoint actually returned, so the fixture can exhibit failure modes nobody anticipated. Direction is false_red, so the `discriminator` is required: it proves the same reporter still says CRITICAL when an endpoint is genuinely unreachable, which is what stops an accept-only proof from passing a stuck-open guard.
  - id: omn15547-handtyped-fixture-passed-as-proof
    guard: scripts/ci/check_incident_replay_coverage.py
    incident: OMN-15547
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/test_omninode_system_slack_report.handtyped-fixture.py.captured
      sha256: 10cfdc48ef1a80dbc10f2c9cf1a84cfc20a68877111e15b5cbe1e56c428c5a0c
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@0f05039434996594000db85cd8d3947523bfebcf:tests/unit/scripts/test_omninode_system_slack_report.py
      captured_at: "2026-07-31T00:12:00Z"
      captured_by: lane replay (OMN-15547)
    test: tests/ci/test_incident_replay_coverage_omn15547.py::test_the_shipped_handtyped_fixture_fails_r1_and_r2
    why: >-
      This lint is itself a new guard, so its own default-deny rule demands a real regression case rather than a baseline exemption -- and it fired on itself the first time it was wired, which is how this case came to exist. The artifact is the verbatim blob that shipped on dev at 0f050394 as the REPAIR for OMN-15525: a hand-typed HEALTHY_BODY literal defended by the comment "Shape mirrors the live body". It was accepted as proof, and it was not proof -- the key names, nesting and value shapes were guesses, so the fixture could only ever exhibit failure modes its author had already imagined. The case drives the real R1/R2 predicates over those bytes and requires BOTH to say no: R1 because the body is a literal inside the test rather than a committed capture, R2 because "Shape mirrors the live body" is the strongest provenance the file offers and it resolves to nothing. A world with this lint could not have shipped that blob; a world without it did, twice.
  - id: omn15536-unreachable-pin-outage
    guard: scripts/ci/check_pin_reachability.py
    incident: OMN-15536
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/omnimarket-compare-dev-879d6fc6.gh-api.json.captured
      sha256: 4e957324574cf01581701cc662adba35cb092670ee67db48f31118f17239f3b5
    capture:
      method: live-fetch
      source: gh-api:repos/OmniNode-ai/omnimarket/compare/dev...879d6fc6825f876458c6d45ed670c8715de8ac95
      captured_at: "2026-07-31T00:18:28Z"
      captured_by: lane replay (OMN-15547)
    test: tests/ci/test_incident_replay_coverage_omn15547.py::test_the_omn15536_outage_pin_is_unreachable_by_the_real_predicate
    why: >-
      omnibase_infra#2570 pinned the merge-hold reusable workflow at omnimarket@879d6fc6 -- the pre-squash head of omnimarket#1976, whose branch GitHub deleted when it squash-merged as 454c429f. The ref then resolved to nothing, so ci.yml failed to LOAD (0 jobs, conclusion=failure) and the sole required context CI Summary went ABSENT rather than red: all seven open infra PRs blocked for ~2.5h with no failing check to point at. Both repos already shipped pin validators and both PASSED the dead pin, because both only checked that it looked like 40 hex characters. The captured artifact is GitHub answering the question those validators never asked -- `status: diverged`, i.e. unreachable from the protected branch. OMN-15538 (#2583) built the predicate; this case pins it against the real response rather than a hardcoded string, and its `behind` sibling (omnimarket-compare-dev-454c429f, the squash that actually landed) is the control that stops a blanket-reject implementation looking correct.
  - id: omn15355-acl-generator-source-lock-missing-roots
    guard: scripts/generate_application_database_acl.py
    incident: OMN-15355
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/application-acl-source-lock.yaml.captured
      sha256: 79d329c20554dcd4508322dc9f0d73630464e20e2f84dd712e8584a7caea0a97
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@b65dd286f373c3363e14066e0bbf272ddbc0aec6:docker/application-acl-proof/source-lock.yaml
      captured_at: "2026-07-31T05:55:00Z"
      captured_by: Codex merge sweep (OMN-15418 repair)
    test: tests/unit/scripts/test_prove_application_database_acl.py::test_generator_rejects_source_lock_without_repository_roots
    why: >-
      The ACL matrix generator is an enforcement guard only if it refuses to render from a source lock whose repository roots are not explicitly supplied. A missing-root run can otherwise produce proof-shaped output divorced from the immutable Git objects named by the lock. This fixture is the real source lock from the rebased #2548 head; the replay drives the actual generator entrypoint with no repository roots and requires the fail-closed missing-root verdict.
  - id: omn15355-acl-proof-prechange-drift
    guard: scripts/ci/prove_application_database_acl.py
    incident: OMN-15355
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/application-acl-prechange-fixture.json.captured
      sha256: a38988de6a5f7927491bb36c47e45202577b254db4b60731f0b1d24cfad235d5
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@b65dd286f373c3363e14066e0bbf272ddbc0aec6:docker/application-acl-proof/generated/prechange-fixture-acl.json
      captured_at: "2026-07-31T05:55:00Z"
      captured_by: Codex merge sweep (OMN-15418 repair)
    test: tests/unit/scripts/test_prove_application_database_acl.py::test_prechange_capture_pins_durable_acl_drift_predicate
    why: >-
      The PostgreSQL ACL proof is only durable if its pre-change rollback artifact is exact. A proof that accepts drift in that artifact can pass while rollback no longer restores the real pre-change graph. This fixture is the real generated pre-change artifact from the rebased #2548 head; the replay loads it through the proof module's EXPECTED_PRECHANGE path and requires the same durable-prechange equality predicate to reject a one-row drift.
  - id: omn15361-application-sql-unqualified-node-migration
    guard: scripts/ci/check_application_database_sql.py
    incident: OMN-15361
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/node-service-registry-tenant-rls-unqualified.sql.captured
      sha256: 3e8a3c12dbefc4432262a1c2533667f4a5f342c39149915bd80b45241c182e98
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@5d845c16c348e5c1e337dfd56f7f452f5547235a:docker/migrations/forward/nodes/node_projection_registration/0002_node_service_registry_tenant_rls.sql
      captured_at: "2026-07-31T06:49:00Z"
      captured_by: Codex merge sweep (OMN-15361 repair)
    test: tests/ci/test_application_database_sql_gate.py::test_omn15361_replay_rejects_real_unqualified_application_migration
    why: >-
      The changed-SQL gate is load-bearing only if it rejects deployable application migrations exactly as they appear in the migration tree, not only small SQL literals assembled inside unit tests. This fixture captures the real node_service_registry tenant-RLS migration bytes from the #2590 head: it targets application relations with unqualified names and no authoritative ownership manifest, the shape OMN-15361 exists to stop from silently extending the application authority surface. The replay stages those captured bytes as an actual changed .sql path in a Git repository and drives the real scripts/ci/check_application_database_sql.py validator through validate_changed_sql, requiring the schema-qualification rejection.
  - id: omn15422-run-forward-legacy-ledger-fixture
    guard: scripts/run-forward-migrations.sh
    incident: OMN-15422
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/legacy-rds-fixture-prove.sh.captured
      sha256: dbaa9701ceaa9fbdc3a7d011f82d6931f4714c6b6574b322b8d7e46b513f168c
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@60f542619f2df5db9c173982f3a06bd1dc4134b8:docker/legacy-rds-fixture/prove.sh
      captured_at: "2026-07-31T07:35:00Z"
      captured_by: Codex merge sweep (OMN-15422 repair)
    test: tests/ci/test_legacy_rds_fixture_contract.py::test_proof_runs_real_migrations_twice_and_pins_the_blocked_upgrade
    why: >-
      The forward migration runner became newly wired enforcement when the OMN-15422 rebuilt legacy-RDS proof workflow started invoking it against both fresh and legacy PostgreSQL 16 histories. The incident was a false-green upgrade proof: a runner could pass a fresh path while legacy ledger shapes, duplicate checksums, and the unresolved OMN-15423 node migration wall were never exercised together. This captured proof script is the committed artifact that drives the real runner twice through the synthetic legacy ledger corpus and requires the blocked-upgrade signature, so the runner cannot be counted as wired enforcement without the regression surface it exists to catch.
  - id: omn15656-topology-zero-table-grants
    guard: scripts/generate_application_database_table_grants.py
    incident: OMN-15656
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn15547/onex-dev-topology-zero-table-grants.yaml.captured
      sha256: b34206e7512eca5eba1502e969fea52c641b4b5eda4eff538ba5c7a459e7b07d
    capture:
      method: git-object
      source: git-object:OmniNode-ai/omnibase_infra@27630ec1be051faaef0a9f61a59615af11b28a39:src/omnibase_infra/topology/instances/onex-dev.yaml
      captured_at: "2026-08-02T10:40:00Z"
      captured_by: lane replay (OMN-15656)
    test: tests/unit/topology/test_application_database_table_grants.py::test_replay_derivation_rejects_the_captured_topology_as_drifted
    why: >-
      The onex-dev runtime plane failed to boot on deploy run 30737415706 because every topology instance declared ZERO `object_type: TABLE` grants, so the OMN-15418 privilege validator refused all 43 contract-declared projections on all 7 profiles. This artifact is the exact instance the cluster consumed -- its sha256 b34206e7 is the same digest recorded in the rendered catalogs' `source.sha256` and in omninode_infra's k8s source-lock, so it is the deployed bytes rather than a reconstruction. Direction is false_green: nothing was red. CI passed, the ACL matrix had already serialized the finding as a BLOCKED blocker two days earlier, and the wiring tests were green because `_with_projection_fixture_grants` manufactured the missing grants at test time and loaded a fixture topology instead of the shipped one. The replay drives the real derivation over the captured bytes and requires the guard to reject them, and its sibling `test_replay_captured_topology_reproduces_the_deploy_failure_verbatim` pins the resolver's error string character-for-character against the pod log, so a future change that merely reshapes the message cannot quietly satisfy this case.
