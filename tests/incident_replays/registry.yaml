      This ratchet is newly wired enforcement, so default-deny demands a real regression case rather than a baseline exemption. The false_green was total and silent for two days. The artifact is the verbatim blob PR #2912 (64ffb5a15) merged when it made this workflow callable: a `no-cache` input declared `type: boolean` with `default: "false"` -- a YAML string. GitHub type-checks a callee's workflow_call input defaults while compiling the CALLER's graph, so deliver-dev-candidate-to-staging.yml returned `startup_failure` on all four of its runs (33077062502, 33091593742, 33106694579, 33169436998) while this file's own workflow_dispatch runs stayed green (33107333244), which is exactly what made the outage invisible -- `startup_failure` creates no job, no step and no annotation, so every omnibase_infra dev merge went out merged-but-undelivered with nothing red anywhere. Every gate on #2912 passed, and `actionlint` reports the file clean today: it does not model GitHub's caller-side input type check, so no static tool in the repo could see it. Root cause was isolated by single-variable bisect on a scratch branch, dispatching the delivery workflow with both `uses:` jobs stubbed `if: false` so a valid graph cost nothing -- control run 33224162317 `startup_failure`, the same tree with that one scalar unquoted run 33224392268 `skipped`, i.e. the graph compiled. The replay drives the real scan_document() over the captured bytes and requires it to reject BOTH occurrences: the workflow_call one that was fatal, and the workflow_dispatch twin that GitHub tolerates and that the fatal one was copied from -- a ratchet that only covered workflow_call would leave the seed of the next recurrence in the tree. Its accept control in the same module drives the repaired file and requires zero violations, which is what stops a blanket-reject implementation from replaying the incident perfectly while failing every healthy workflow in the repo.
