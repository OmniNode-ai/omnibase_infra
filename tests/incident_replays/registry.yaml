cases:
  - id: omn18942-fleet-failure-findings-delivered-to-nowhere
    guard: scripts/omninode-fleet-failure-probe.py
    incident: OMN-18942
    regression_class: false_green
    guard_verdict_on_artifact: reject
    discriminator: tests/ci/test_incident_replay_omn18942.py::test_the_same_probe_stays_silent_on_the_workflows_that_are_fine
    artifact:
      fixture: tests/fixtures/omn18942/fleet-scheduled-sweep-201-2026-09-20.json.captured
      sha256: 5dff47a214fdef2d90276986dcee3265e7e584be8006e0c0d862f9a05ee7cf4e
    capture:
      method: host-file
      source: host-file:192.168.86.201:/tmp/omn18942-verify/capture-report.json
      captured_at: '2026-09-20T22:53:00Z'
      captured_by: lane replay (OMN-18942)
    test: tests/ci/test_incident_replay_omn18942.py::test_the_real_probe_names_every_never_green_surface_on_the_captured_fleet
    why: >-
      Newly wired enforcement, so default-deny demands a real regression case rather than a baseline exemption. The false_green is A FLEET OF RED VERIFICATION SURFACES THAT REACHES NOBODY. The evaluator behind these bytes has been correct and running every ten minutes since OMN-18322; its last log line on every run is that chat is not configured, and the 2026-09-20 silent-gates review measured why -- no chat secret of any name exists at GitHub Actions organisation scope or in any repository scope, ten org secrets and eight in this repository and not a bot token, a channel identifier or a webhook among them. So twenty-nine above-threshold scheduled workflows, five of which have not succeeded ONCE in the trailing seven-day window, were named into an annotation on a job nobody opens. The detection was never the defect; the hop was, and this probe is the hop. THE ARTIFACT IS NOT A RECONSTRUCTION -- it is the byte-for-byte report the shared evaluator wrote on the .201 host at 22:53Z, as root, out of the host env file, over the thirteen-repository fleet list declared in config/runner_routing_policy.yaml, re-fetchable by re-running the same command there. It carries repository names, workflow paths, run counts and public run URLs only; no token, no identity and no address appear in it. THE SAME CAPTURE PROVES A SECOND INCIDENT, which is why one fixture is enough for both. OmniNode-ai/omni_home is present with an error rather than a result, because the host token reads twelve of the thirteen fleet repositories and returns HTTP 404 on the registry repository -- the one whose scheduled-gap detector had failed 12 of 12 daily runs since 2026-09-09 and which this ticket names by hand. Before the per-repository split, that single 404 aborted the whole sweep and the first live run on .201 produced NO rows for ANY repository, recorded verbatim in that run's refresh log as a RuntimeError naming the workflows endpoint and the 404. That is the OMN-18254 failure recurring on a second surface, in its own words -- the repo loop hits omniweb second, so omnimarket was never reached either, one private repo took the whole sweep down. THE DISCRIMINATOR IS LOAD-BEARING AND NOT A FORMALITY: a probe that emitted a row for every workflow it saw would replay this incident perfectly and be useless, because seventy-four rows every fifteen minutes is a channel nobody reads, which is this ticket own third defect -- roughly 2,160 annotations a day, muted on day one. The same function is therefore driven over the SAME bytes and required to produce exactly thirty rows, twenty-nine findings plus the one unreadable repository, and nothing for the other forty-five workflows that ran and were fine; the test asserts 74 > 29 in the fixture itself so the comparison cannot be vacuous. A second narrow assertion pins the other direction from the same bytes: the capture contains a workflow that fired once in the window and failed, and it must stay a WARNING, because a rate with no denominator is not evidence of a dead surface and escalating it would page on a workflow that has run once all week. A third pins the fixture sha256, since a reformatted artifact is no longer the artifact that failed. NO MODIFICATIONS: the file is the exact bytes scp'd off the host, 23441 bytes.
  - id: omn18781-two-integration-suites-collected-and-never-executed
    guard: scripts/ci/skip_count_ratchet.py
    incident: OMN-18781
    regression_class: false_green
    guard_verdict_on_artifact: reject
    discriminator: tests/ci/test_incident_replay_omn18776.py::test_the_same_ratchet_accepts_the_same_bytes_against_the_shipped_baseline
    artifact:
      fixture: tests/fixtures/omn18776/run-35402899669-split-2-junit.xml.captured
      sha256: 381ab4f1e089784e3bdf184fbdf7b47ce0a1727e3270742320ae8c669f393728
    capture:
      method: ci-artifact
      source: ci-artifact:35402899669/test-results-attempt-1-2
      captured_at: '2026-09-18T23:37:00Z'
      captured_by: lane replay (OMN-18776)
    test: tests/ci/test_incident_replay_omn18776.py::test_the_real_ratchet_refuses_the_report_that_grew_the_never_run_set
    why: >-
      Newly wired enforcement, so default-deny demands a real regression case rather than a baseline exemption. The false_green is a SUITE THAT CANNOT RUN CONTRIBUTING TO A GREEN JOB. Two integration modules in this repo carry a module-level pytestmark gated on an environment variable no workflow here sets -- KAFKA_INTEGRATION_TESTS for tests/integration/event_bus/test_kafka_event_bus_integration.py and QDRANT_URL for tests/integration/handlers/test_handler_qdrant_integration.py -- and neither carries a marker the Tests job deselects nor sits in its --ignore list, so both are collected on every pull request, skip in full, and the split reports success. The event-bus one is the load-bearing case: the bus is the transport the whole platform rests on and its integration proof has never executed in CI. NOT A HYPOTHESIS AND NOT A RECONSTRUCTION -- the artifact is the byte-for-byte JUnit report GitHub Actions served for split 2 of run 35402899669, re-fetchable at the recorded locator, and it carries all 27 of those cases, 19 kafka and 8 qdrant, every one of them with a skipped element. THE MEASURED REASON NOTHING CAUGHT THIS is that no surface on the fleet reads a skip count at all: the OMN-14172 silent-skip guard reads only the curated integration-guard junit and never the test-parallel splits, which is the same blindness that let 91 PostgreSQL-16 cutover cases skip on every full-matrix run for 49 days (omnibase_infra#2547 through OMN-18762) with zero guard fires. Driving the REAL ratchet over the captured bytes against the baseline as it stood before those two suites existed returns exit 1 naming both modules and a delta of +27, which is the refusal that never happened. THE DISCRIMINATOR IS LOAD-BEARING, not a formality: a gate that refused every report would replay this incident perfectly and block every pull request in the repository forever, and the failure would look like strictness rather than breakage. The same function is therefore driven over the SAME bytes against the shipped baseline and required to accept, and required to say NARROWED SELECTION while doing so, because one split of a fifteen-split run is a partial view and a gate that read its lower count as progress would ratchet the baseline down to whatever the selector happened to pick that day. A third assertion pins the fixture itself -- 27 ids from the two named modules, present in the committed bytes -- so neither verdict can be vacuous. NO MODIFICATIONS: the fixture is the artifact as downloaded, 465686 bytes, and it carries test identifiers only; the words secret, token and password appear in it exclusively as parts of test function names, never as values.
  - id: omn18595-release-train-cut-on-its-own-bookkeeping
    guard: scripts/ci/release_train.py
    incident: OMN-13912
    regression_class: false_green
    guard_verdict_on_artifact: reject
    artifact:
      fixture: tests/fixtures/omn18595/pull-3693-post-release-bump.json.captured
      sha256: 69201b8dba8502e27ba420d84c8293bae490db8cdbdaa85377e68d074053d431
    capture:
      method: gh-api
      source: gh-api:repos/OmniNode-ai/omnibase_infra/pulls/3693
      captured_at: '2026-09-17T15:00:00Z'
      captured_by: lane replay (OMN-18595)
    test: tests/ci/test_incident_replay_omn18595.py::test_the_real_guard_rejects_the_post_release_bump_as_releasable_work
    why: >-
      Newly wired enforcement, so default-deny demands a real regression case rather than a baseline exemption. The false_green being replaced is a RELEASE THAT CONTAINS NOTHING: the OMN-13912 post-release bump edits pyproject.toml, pyproject.toml is a release-relevant path because it carries the dependency floor that ships with the wheel, and a decision surface that counts commits over release-relevant paths therefore sees exactly one the morning after every release -- the machinery's own bookkeeping. Cut on that count, the train publishes a version with no product change, its own post-release bump lands, and the count is one again; once per release, forever. This is not a hypothesis. It is the state origin/dev was in when the guard was written: `git rev-list --count v0.38.30..origin/dev -- src pyproject.toml` returned 1 and `git log --no-merges --format=%s` over the same range returned exactly one line, `chore(OMN-13912): post-release dev version bump to 0.38.31 (#3693)`, while the shipped classifier returned 0 unreleased commits for the same range. The sibling decision surface in omnimarket had to grow its own marker for the identical reason, which decide_release_on_merge.py's docstring records in its own words: without one the post-release commit re-triggers the workflow and releases an empty version, once per merge, forever. THE ARTIFACT IS THE PULL REQUEST, NOT A COMMIT OBJECT, and the reason is that the guard decides on a commit SUBJECT: every repo in this registry is squash-only with no merge queue, so a merged pull request's title IS the subject of the commit it produces plus the suffix git appends, and pulls/3693's merge_commit_sha 695305b303dfd1e1d1b68a2885ea34641cd251ea is the head of origin/dev, which the test reads out of the captured bytes rather than from this paragraph. A commit-object capture would have carried author emails into a PUBLIC repository for no gain; the pulls API carries logins only, and the only address string in either fixture is the standard github.com clone URL. THE DISCRIMINATOR IS MANDATORY AND NOT A FORMALITY - a classifier that called every subject bookkeeping would replay this incident perfectly and make the train cut nothing ever, which is equally broken and far harder to notice because a train that never cuts looks like a quiet week. test_the_same_guard_accepts_real_runtime_work drives the SAME function over a second captured pull request, pulls/3683 (feat(OMN-18567), merge commit 2a4e49511d421c368adb5097131c5d1b985272c3, sha256 0ca7e74942e7ae25160fe2555e9805ee9ec3695c725e2dd7ba1140760937c3ec), and requires the opposite verdict; a third test requires the two fixtures not to be byte-identical and both to be merged into dev, so neither assertion can be vacuous. A fourth pins the narrow half - the patterns anchor at the conventional-commit prefix, so a subject that merely MENTIONS a release is still work, which is the failure mode where a guard written to stop one empty release stops every release. NO MODIFICATIONS: both fixtures are the exact bytes the REST API returned, unedited.
