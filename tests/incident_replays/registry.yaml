      This guard is newly wired enforcement, so its own default-deny rule demands a real regression case. Before it existed, the only remedy for a wedged PR concurrency group was a human noticing and hand-running `POST .../actions/runs/{run_id}/force-cancel` -- false_green in the strongest sense: CI Summary went MISSING rather than red, so nothing paged and nothing retried. omnimarket#2106 is one of three instances hit in a single lane on 2026-08-24 (OMN-15683 closeout comment `606563b3`): undraft fired a `ready_for_review` run on old head 1ac4fc40 (run 32750189057, created 16:19:46Z); a branch refresh 9s later created the new-head run 32750203422 (created 16:19:55Z) on the same shared `pull_request` concurrency group. This fixture is the real run-level object for the old-head run, still fetchable at the cited locator (its overall `status` has since settled to `completed`, which is why the sibling `-jobs` fixtures, not this run's own `status` field, are what the replay test actually keys its `in_progress`/`queued` reconstruction on -- see that test's module docstring for why a settled incident cannot be replayed off a `status` field that only ever reports the present). The companion `-jobs`/`-attempt1-jobs` fixtures (same directory) prove the wedge mechanically: the old run's last job did not complete until 16:26:25Z and the new run's first job did not start until 16:26:29Z -- 6m34s after the new run was created, for a run whose jobs normally start within seconds. The replay drives the real `determine_zombie_cancellations()` with facts sourced from these captured, immutable job timestamps and requires it to flag the old run for force-cancellation, unblocking the new one -- exactly the manual remedy this incident needed and did not have. Building this replay also surfaced an independent defect in the detector's first implementation: the run-level fixture's own `pull_requests` field is `[]` for both runs despite neither being a fork PR, which is why the shipped detect