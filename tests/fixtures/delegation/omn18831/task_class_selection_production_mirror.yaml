#
# A MIRROR of the production task-class selection projection (OMN-18831).
#
# Why it exists. The falsifier pair in OMN-18831 is a statement about the
# LIVE vocabulary -- that this exact prompt lands on a prose class -- and a
# routing answer depends on every class's predicate and priority, not just
# the one that used to win. The hand-written probe contract next door pins
# the evaluator's RULES; this pins the production PREDICATES so the
# falsifier table cannot quietly go vacuous.
#
# THE OTHER HALF OF THIS ASSERTION LIVES IN OMNIMARKET:
# tests/unit/inference/test_task_class_selection_omn18831.py hashes the live
# contract's selection projection to the same constant this repo's
# test_task_class_selection_omn18831.py hashes this file to. Neither suite
# can import the other's half (repo layering one way, a registry pin the
# other, and this repo's venv-purity gate refuses to run with omnimarket
# installed), so the seam is two pinned halves of one constant. Editing the
# contract turns omnimarket red and prints the new digest; update both.
#
# GENERATED from src/omnimarket/configs/task_class_contracts.v1.yaml. Only
# the public projection and only the `selection` block; nothing else in the
# contract affects routing. The contract declares no `selection_fallback`,
# so an unclaimed prompt takes the evaluator's own DEFAULT_TASK_TYPE -- and
# this file declares none either, for the same reason.
