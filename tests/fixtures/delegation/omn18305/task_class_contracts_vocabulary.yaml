  reasoning: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  refactor: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  research: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  review: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  summarization: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  test: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  agent_delegation: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
