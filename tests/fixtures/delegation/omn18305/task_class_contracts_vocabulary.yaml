# A STAND-IN task-class contract for the ordinary omnibase_infra test
# environment, which has no omnimarket installed (repo layering forbids the
# dependency, so the real contract is simply absent here).
#
# Its ONLY job is to carry the real public class VOCABULARY so the CLI's
# plumbing tests -- bus resolution, correlation threading, timeouts -- can
# run a delegation end to end without the production predicates. The
# predicates below are deliberately inert: every class declares a phrase
# nothing matches, so every prompt lands on the declared fallback and no
# test here can accidentally depend on a production selection rule.
# Its execution budgets mirror the production declarations for this fixture's
# public vocabulary, so every CLI path resolves a typed boundary.
#
# OMN-13966: it also carries the four INTERNAL classes, so the stand-in holds
# the contract's whole class universe, not just its public projection. The
# CLI admits every declared class by explicit name except one the contract
# declares unroutable (agent_delegation's routing_availability block, copied
# verbatim from production). tests/unit/cli/test_task_class_admission_omn13966.py
# pins that partition, and omnimarket pins the LIVE contract to the same one.
#
# DRIFT GUARD: TestTaskTypeVocabulary asserts these names equal
# cli_delegate.TASK_TYPE_CHOICES, which is itself asserted against the LIVE
# contract whenever omnimarket is resolvable. Adding a class to the
# contract without adding it here is a red test, not a silent divergence.
version: "stand-in"
execution_budgets:
  code_generation: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  code_review: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
