#
# A VERBATIM EXTRACT of two things from omnimarket's production
# task_class_contracts.v1.yaml: every quality rule's `enforcement`, and
# every PUBLIC task class's definition_of_done.heuristic list. Nothing
# else, and nothing hand-written.
#
# WHY IT IS COMMITTED HERE. omnibase_infra's OMN-15620 venv-purity gate
# refuses to run this suite with omnimarket installed, and repo layering
# (compat -> core -> spi -> infra) forbids the import outright, so the
# production contract is simply absent in this environment. Choosing the
# CLI's fallback class is a decision ABOUT these floors, so the floors
# have to be readable here to pin it.
#
# EXTRACTED FROM omnimarket commit 1ae66ce15a41dada95a533d1228fcbd724c12fb2
# REGENERATE: see the module docstring of
#   tests/unit/cli/test_delegate_caller_criteria.py
# DRIFT GUARD: TestFixtureMatchesTheLiveContract in that module compares
# this file to the live contract whenever omnimarket is resolvable, and
# says so rather than passing silently when it is not.
quality_rules:
  accurate:
    enforcement: blocking
  cites_sources:
    enforcement: blocking
  cites_specific_lines:
    enforcement: blocking
  concise:
    enforcement: scored
  covers_args_returns_raises:
    enforcement: blocking
  covers_dependencies:
    enforcement: blocking
  covers_edge_cases:
    enforcement: blocking
  covers_error_paths:
    enforcement: blocking
  follows_codebase_conventions:
    enforcement: blocking
  follows_google_style:
    enforcement: blocking
  methodical_analysis:
    enforcement: blocking
  no_obvious_regressions:
    enforcement: blocking
  no_refusal:
    enforcement: blocking
  semantic_adequacy:
    enforcement: blocking
  short_form_adequacy:
    enforcement: blocking
  step_by_step_explanation:
    enforcement: blocking
  structured_output:
    enforcement: blocking
task_classes:
  code_generation:
    definition_of_done:
      heuristic:
      - no_refusal
      - follows_codebase_conventions
      - no_obvious_regressions
    gateway_exposure: public
  code_review:
    definition_of_done:
      heuristic:
      - cites_specific_lines
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  complex_reasoning:
    definition_of_done:
      heuristic:
      - step_by_step_explanation
      - methodical_analysis
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  document:
    definition_of_done:
      heuristic:
      - no_refusal
      - accurate
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  planning:
    definition_of_done:
      heuristic:
      - structured_output
      - covers_dependencies
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  reasoning:
    definition_of_done:
      heuristic:
      - no_refusal
      - step_by_step_explanation
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  refactor:
    definition_of_done:
      heuristic:
      - no_refusal
      - follows_codebase_conventions
      - no_obvious_regressions
    gateway_exposure: public
  research:
    definition_of_done:
      heuristic:
      - no_refusal
      - cites_sources
      - methodical_analysis
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  review:
    definition_of_done:
      heuristic:
      - cites_specific_lines
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  summarization:
    definition_of_done:
      heuristic:
      - no_refusal
      - concise
      - accurate
      - semantic_adequacy
      - identifiers_grounded
    gateway_exposure: public
  test:
    definition_of_done:
      heuristic:
      - no_refusal
      - covers_edge_cases
      - covers_error_paths
    gateway_exposure: public
