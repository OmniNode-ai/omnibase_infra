# A HAND-WRITTEN probe contract, not a copy of the production one.
#
# It exists so the OMN-18305 selection evaluator's RULES — word boundaries,
# presence-not-frequency, shape gating, priority ordering — are pinned in an
# environment that has no omnimarket installed (the ordinary omnibase_infra CI
# env). The PRODUCTION vocabulary and predicates are asserted separately,
# against the live contract, by the drift guard.
version: "probe"
task_classes:
  long_prose:
    gateway_exposure: public
    selection:
      priority: 80
      min_words: 10
      phrases:
        - "summarise"
        - "standup"
  short_keyword:
    gateway_exposure: public
    selection:
      priority: 40
      max_words: 9
      phrases:
        - "test"
        - "write a test"
  fallback_class:
    gateway_exposure: public
    selection:
      priority: 10
      phrases:
        - "investigate"
  never_from_a_prompt:
    gateway_exposure: internal
    selection:
      priority: 99
      phrases:
        - "summarise"
  no_prompt_selects_this:
    gateway_exposure: public
    selection:
      priority: 95
      phrases: []
  # OMN-13966: a class the contract declares but cannot route yet. The CLI
  # admits every declared class by explicit name EXCEPT one carrying a
  # routing_availability block, and refuses that one with the block's own
  # words. Shaped like the production agent_delegation declaration.
  cannot_route_yet:
    gateway_exposure: internal
    selection:
      priority: 0
      phrases: []
    routing_availability:
      status: pending_capability
      missing_capability: probe_capability
      tracking: "PROBE-1 WS-0"
      reason: >-
        No probe tier can serve this class.

# OMN-18305 residual: the fallback is a CONTRACT decision, not a CLI constant.
# `fallback_class` is the probe's shape-free class, so an unclaimed prompt in
# these tests lands somewhere its floors can actually be met.
selection_fallback:
  task_class: fallback_class
