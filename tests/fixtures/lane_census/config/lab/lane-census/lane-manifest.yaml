#
# A NEUTRAL lane manifest for tests (OMN-20934). It describes no real lab.
#
# The real lane manifest and committed census are private deployment config
# (operator RULING 2026-10-10T21:57:38Z): they live in config/lab/lane-census
# under the workspace config root and this repository ships neither. Tests that
# exercise the census tools point ONEX_WORKSPACE_CONFIG_ROOT (or LANE_MANIFEST)
# at tests/fixtures/lane_census, whose layout mirrors that root. Hosts and
# containers are placeholders; the lane names are keys the CLAUDE.md lane
# block generator already declares, so a clean census of this file is clean
# for every checker.
#
# Shape: host-a runs `dogfood` (required) and `dev` (optional, with declared
# restart bounds, the lane the lab alarm reads); host-b runs `principal-issuer`
# (optional), which is therefore not applicable on host-a.
schema_version: "1.0.0"
default_image_tag_pattern: '.+'

hosts:
  host-a:
    aliases: [box-a]
  host-b:
    aliases: [box-b]

lanes:
  dogfood:
    hosts: [host-a]
    compose_file: docker/docker-compose.example-dogfood.yml
    compose_project: example-dogfood
    network: example-dogfood-network
    image_tag_pattern: '.+'
    services:
      - name: example-dogfood-postgres
        kind: service
        replicas: 1
      - name: example-dogfood-redpanda
        kind: service
        replicas: 1
      - name: example-dogfood-forward-migration
        kind: oneshot
      - name: example-dogfood-migration-gate
        kind: keepalive
      - name: example-dogfood-runtime
        kind: service
        replicas: 1
      - name: example-dogfood-runtime-effects
        kind: service
        replicas: 1
      - name: example-dogfood-agent-actions-consumer
        kind: profile_gated
  dev:
    optional: true
    hosts: [host-a]
    compose_file: docker/docker-compose.example-dev.yml
    compose_project: example-dev
    network: example-dev-network
    image_tag_pattern: '.+'
    services:
      - name: example-dev-redpanda
        kind: service
        replicas: 1
        restart_bound: 1
      - name: example-dev-runtime
        kind: service
        replicas: 1
        restart_bound: 3
  principal-issuer:
    optional: true
    hosts: [host-b]
    compose_file: docker/docker-compose.example-principal-issuer.yml
    compose_project: example-principal-issuer
    network: example-principal-issuer-network
    image_tag_pattern: '.+'
    services:
      - name: example-principal-issuer-runtime
        kind: service
        replicas: 1
