schema_version: "2.0"
services: {}
presets: {}
active_preset: null
databases:
  application:
    physical_name: omnidash_analytics
    schemas:
      tenant: {domain: TENANT, owner: owner_onex_tenant}
      omninode_internal: {domain: OMNINODE_INTERNAL, owner: owner_omninode_internal}
      platform_catalog: {domain: PLATFORM_CATALOG, owner: owner_platform_catalog}
    owners:
      owner_onex_tenant: {login: false}
      owner_omninode_internal: {login: false}
      owner_platform_catalog: {login: false}
    principals:
      onex_api:
        login: true
        bypass_rls: false
        grants:
          - {object_type: DATABASE, privileges: [CONNECT]}
          - {object_type: SCHEMA, schema: tenant, privileges: [USAGE]}
          - {object_type: SCHEMA, schema: platform_catalog, privileges: [USAGE]}
          - object_type: TABLE
            schema: tenant
            objects: [tenant_accounts]
            privileges: [SELECT, INSERT, UPDATE]
          - object_type: TYPE
            schema: tenant
            objects: [account_id_span, account_id_span_set, account_ref]
            privileges: [USAGE]
          - object_type: TABLE
            schema: platform_catalog
            objects: [plan_tiers]
            privileges: [SELECT]
      tenant_projection_writer:
        login: true
        bypass_rls: false
        grants:
          - {object_type: DATABASE, privileges: [CONNECT]}
          - {object_type: SCHEMA, schema: tenant, privileges: [USAGE]}
          - object_type: TABLE
            schema: tenant
            objects: [delegation_events]
            privileges: [SELECT, INSERT, UPDATE]
          - object_type: SEQUENCE
            schema: tenant
            objects: [delegation_events_id_seq]
            privileges: [USAGE]
          - object_type: FUNCTION
            schema: tenant
            objects: [record_delegation]
            privileges: [EXECUTE]
      app_dashboard:
        login: true
        bypass_rls: false
        grants:
          - {object_type: DATABASE, privileges: [CONNECT]}
          - {object_type: SCHEMA, schema: tenant, privileges: [USAGE]}
          - {object_type: SCHEMA, schema: platform_catalog, privileges: [USAGE]}
          - object_type: TABLE
            schema: tenant
            objects: [delegation_events, tenant_account_names]
            privileges: [SELECT]
          - object_type: TABLE
            schema: platform_catalog
            objects: [plan_tier_snapshot, plan_tiers]
            privileges: [SELECT]
          - object_type: FUNCTION
            schema: tenant
            objects: [delegation_event_count]
            privileges: [EXECUTE]
      omninode_runtime:
        login: true
        bypass_rls: false
        grants:
          - {object_type: DATABASE, privileges: [CONNECT]}
          - {object_type: SCHEMA, schema: omninode_internal, privileges: [USAGE]}
          - object_type: TABLE
            schema: omninode_internal
            objects: [runtime_state]
            privileges: [SELECT, INSERT, UPDATE]
          - object_type: TYPE
            schema: omninode_internal
            objects: [runtime_code, runtime_status]
            privileges: [USAGE]
    bindings:
      onex_api:
        database_ref: application
        principal: onex_api
        dsn_env: OMNINODE_CLOUD_DB_URL
      tenant_projection:
        database_ref: application
        principal: tenant_projection_writer
        dsn_env: OMNIDASH_ANALYTICS_DB_URL
      app_dashboard:
        database_ref: application
        principal: app_dashboard
        dsn_env: DATABASE_URL
      omninode_runtime_service:
        database_ref: application
        principal: omninode_runtime
        dsn_env: OMNINODE_INTERNAL_DB_URL
    migration_stream: omnibase_infra.application
    checksum_ledgers:
      canonical:
        schema: platform_catalog
        relation: schema_migrations
        stream_column: migration_stream
        domain_column: domain
        version_column: version
        checksum_column: checksum
    checksum_ledger: canonical
