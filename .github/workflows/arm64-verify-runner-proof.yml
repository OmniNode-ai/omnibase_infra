#
# OMN-17477 — proof that the arm64 verify-class host can actually execute a
# verify-class job.
#
# WHY A NEW WORKFLOW RATHER THAN MOVING AN EXISTING JOB. Moving a job's
# `runs-on` to a brand-new host is a bet that the host works, settled only when
# that job next runs -- and if it does not work, the cost is a broken gate on
# someone else's PR. This job asserts the same four things a verify-class job
# depends on, on a schedule and on demand, and moving real work follows from a
# green reading rather than preceding it.
#
# It is deliberately NOT a required check. Its purpose is to answer "is the
# arm64 host fit for verify work", and a gate that blocks merges on a lab
# host's availability would make every PR depend on one Mac being awake.

name: ARM64 Verify Runner Proof

on:
  # PATH-SCOPED, and the scope is the point. A change to the runner image, the
  # host inventory or a host's compose file is exactly the change whose author
  # should learn immediately that the arm64 host is not actually able to run a
  # job -- that is the defect class this whole change exists to remove, and
  # learning it at provisioning time rather than at merge time is the lab-first
  # rule applied to the fleet itself. No other PR triggers this, so no unrelated
  # change depends on one desk machine being awake.
  pull_request:
    branches: [main, dev, develop]
    paths:
      - 'docker/runners/**'
      - 'docker/docker-compose.runners*.yml'
      - 'config/runner_fleet.yaml'
      - '.github/workflows/arm64-verify-runner-proof.yml'
  workflow_dispatch:
  schedule:
    # Once a day. The host is a desk machine, not a datacentre: a frequent poll
    # buys nothing and a daily reading is enough to notice it has gone away.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: arm64-verify-runner-proof
  cancel-in-progress: false

jobs:
  arm64-verify-proof:
    name: arm64-verify-proof (${{ matrix.host }})
    # ONE LEG PER ARM64 VERIFY HOST. A single job pinned to the class label
    # would be satisfied by whichever arm64 host happened to be idle, so a
    # second host could sit broken behind a green check indefinitely -- the
    # undocumented-but-running failure in its other direction. The host label
    # is what makes each leg a statement about a machine.
    #
    # Read from the declared inventory when you add a host: a row in
    # config/runner_fleet.yaml with arch arm64 and the verify class needs a leg
    # here, and tests/integration/observability/
    # test_runner_fleet_multihost_contract.py is where that correspondence is
    # asserted rather than remembered.
    strategy:
      fail-fast: false
      matrix:
        host: [host-101, host-105, host-200]
    # Pinned to the architecture AND the class, in the fleet's own vocabulary.
    # Both labels are load-bearing: `omnibase-verify` alone would also match an
    # amd64 verify runner on the primary host, and this job's whole subject is
    # the arm64 one.
    # A FORK pull request must never land on a host holding real lab
    # credentials. Same fork-isolation posture the trusted-CI seam takes, stated
    # here because this job pins a literal runner set and so cannot inherit it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - omnibase-verify
      - arch-arm64
      - ${{ matrix.host }}
    timeout-minutes: 10

    steps:
      - name: Assert the runner really is arm64
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: ${arch}"
          if [[ "${arch}" != "aarch64" && "${arch}" != "arm64" ]]; then
            echo "::error::job landed on ${arch}; the arch-arm64 label did not constrain placement"
            exit 1
          fi
          echo "runner name: ${RUNNER_NAME:-<unset>}"
          echo "declared host label: ${{ matrix.host }}"

      # The four binaries a cloud-touching verify job uses. Each is checked for
      # its ARCHITECTURE, not merely its presence: an amd64 binary under
      # emulation would "work" here and then be slow and unreproducible in a
      # way nobody would trace back to this host.
      - name: Assert the verify toolchain is native arm64
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" got="$2"
            printf '%-8s %s\n' "${name}:" "${got}"
            case "${got}" in
              *aarch64*|*arm64*) ;;
              *) echo "::error::${name} is not arm64 (${got})"; fail=1 ;;
            esac
          }
          # `gh` and `uv` print no architecture in --version, and the runner
          # image carries no file(1) -- measured, not assumed: the first run of
          # this job on the arm64 host failed with `file: command not found`.
          # Read the ELF header instead. Byte 18 of an ELF file is e_machine:
          # 0xB7 AArch64, 0x3E x86-64. python3 is in the image by construction
          # (the prebuilt CI env is built on it), so this needs no new package
          # and, unlike file(1), it cannot be fooled by a wrapper script.
          elf_arch() {
            python3 - "$1" <<'PY'
          import sys, pathlib
          MACHINE = {0xB7: "arm64", 0x3E: "amd64", 0x28: "arm", 0x00: "none"}
          data = pathlib.Path(sys.argv[1]).read_bytes()[:20]
          if data[:4] != b"\x7fELF":
              print(f"not-an-elf({sys.argv[1]})")
              raise SystemExit(0)
          print(MACHINE.get(data[18], f"unknown-e_machine-0x{data[18]:02x}"))
          PY
          }
          check kubectl "$(kubectl version --client=true -o json | python3 -c 'import sys,json;print(json.load(sys.stdin)["clientVersion"]["platform"])')"
          check aws     "$(aws --version 2>&1)"
          check gh      "$(elf_arch "$(command -v gh)")"
          check uv      "$(elf_arch "$(command -v uv)")"
          [[ "${fail}" -eq 0 ]]

      # The credential half. Named, hashed and length-checked -- never printed.
      # A verify job that cannot read the lab kubeconfig fails at its first
      # cluster call with an error that looks like a cluster problem.
      #
      # SKIPPED on host-200 (OMN-19657), deliberately: that runner is pinned to
      # one lane's per-merge verify job, the same shape as host-202's, and
      # reads the dev-200 compose lane's docker daemon through the
      # host-gateway alias -- it carries no lab kubeconfig or operator-env
      # mount by design (see docker-compose.runners-omninode-studio-runner.yml,
      # "WHAT IS DELIBERATELY ABSENT"). host-202 is out of this workflow only
      # because it is amd64, not because it is exempt from this rule; a future
      # arm64 lane-pinned runner should skip this step the same way.
      - name: Assert the lab credentials are readable by the job user
        if: matrix.host != 'host-200'
        run: |
          set -euo pipefail
          : "${KUBECONFIG:?KUBECONFIG must be set on a verify-class runner}"
          if [[ ! -r "${KUBECONFIG}" ]]; then
            echo "::error::KUBECONFIG at ${KUBECONFIG} is not readable as $(id -un) (uid $(id -u))"
            ls -la "$(dirname "${KUBECONFIG}")" || true
            exit 1
          fi
          printf 'kubeconfig bytes=%s sha256-12=%s\n' \
            "$(wc -c < "${KUBECONFIG}")" "$(sha256sum "${KUBECONFIG}" | cut -c1-12)"
          echo "kube context: $(kubectl config current-context)"

      - name: Assert the Docker socket is usable after the GID fix
        run: |
          set -euo pipefail
          # OMN-17477: on this host the socket's GID is already claimed, so the
          # entrypoint grants group membership rather than renumbering. That
          # path has exactly one observable consequence and this is it.
          echo "groups: $(id -Gn)"
          docker info --format 'docker daemon: {{.ServerVersion}} {{.OSType}}/{{.Architecture}}'
