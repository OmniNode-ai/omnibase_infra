# r1-front-door-probe.yml — OMN-19445
#
# WHAT THIS IS
#   "PLAN-R1 / MD-14: a good local answer ends the chain, and the decision is
#   in the log." The probe text carried in knowledge-base-internal's beta
#   rebaseline and GOAL documents was wrong for months -- `onex delegate ...
#   --bus kafka --kafka-bootstrap <lab broker literal host:port>`, which the dev-lane
#   broker refuses (SASL required since OMN-18012 Phase B) -- and NOTHING ran
#   it on a schedule, so a front-door regression could sit undetected for
#   days. The corrected form (`--lane dev`, resolved through the checked-in
#   `config/ci_bus_lanes.yaml`) was proven once by hand on 2026-09-21 and the
#   next three daily rebaseline snapshots silently reverted to citing the
#   stale, refused form again. This workflow is what makes the corrected form
#   a standing regression signal instead of a one-off manual proof.
#
#   The job's EXIT CODE is the probe's verdict (scripts/ci/r1_front_door_probe.py
#   docstring has the full 0/1/2 table and the named failing legs). This
#   workflow schedules it, composes the environment the CLI needs, publishes
#   the terminal and the exit code to the job summary, asserts the record
#   artifact is present and non-empty, and uploads it.
#
# WHY THE JOB COMPOSES AN OMNIMARKET CO-INSTALL (OMN-19445 AC2)
#   Every scheduled run from 2026-09-28 to 2026-10-02 (36382284153,
#   36526484866, 36673726469, 36820075353, 36969176190) exited 1 at the probe
#   step in under ten seconds, before any broker was dialled: `onex delegate`
#   reads its task-class contract from an installed omnimarket
#   (`onex.contracts:task_class_authority`), and `uv sync --locked` never
#   installs omnimarket (it sits above infra in the layer graph, so it is a
#   provider and not a dependency). The same command exits 0 from the lab host,
#   whose dispatch venv carries the co-install. So the failure was this job's
#   environment, not the front door -- and the old FAIL line did not say so.
#   The job now checks omnimarket out at the sibling pin
#   (.github/sibling-pins.yaml, never live dev), installs it from that commit
#   into the job venv the way evidence-autoclose-sweep composes its dispatch
#   venv, lays the checkout out as the workspace root the CLI reads the lane
#   declaration from (OMNIBASE_PATH), and injects the dev-lane SCRAM secrets as
#   environment, exactly as chain-canary does. The probe then names the leg
#   that failed: runner-env, lane-declaration, lane-login, broker-route or
#   front-door.
#
# WHY A LAB-POOL RUNNER, AND WHY OUTSIDE THE RUNTIME CONTAINER
#   The lab lane's broker has no route from a GitHub-hosted runner, so the job
#   runs on the overlay's lab pool (vars.LAB_PROBE_RUNS_ON_JSON, OMN-19894),
#   any host of which reaches the declared broker. This
#   probe deliberately runs the CLI DIRECTLY on the runner host rather than
#   `docker exec`-ing into omninode-runtime-effects (provider-rung-canary's
#   pattern): AC2 measures the FRONT DOOR -- the command a lane operator runs
#   on their own machine -- not whether the runtime can reach itself.
#
# WHY THERE IS NO pull_request TRIGGER
#   Same reason as provider-rung-canary.yml: a path-scoped pull-request job
#   sits in neither required_status_checks nor EXPECTED_EXTERNAL_CONTEXTS, and
#   the advisory-job gate refuses it. workflow_dispatch re-runs it on demand.
#
# CRON PLACEMENT
#   05:19 UTC daily. Clear of the 07:30Z nightly delegation-regression window,
#   clear of C15 (:41 every other hour; the ledger's HARD RULES ask lanes to
#   stay clear of :25-:55 of those hours -- 05:19 is neither an odd hour's C15
#   slot nor inside that window), and distinct from provider-rung-canary's
#   :47 slots and dev-lane-liveness's :07/:22/:37/:52 slots.

name: R1 front-door probe (daily)

on:
  schedule:
    - cron: '19 5 * * *'
  workflow_dispatch:

concurrency:
  group: r1-front-door-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  r1-front-door-probe:
    name: R1 front-door probe (dev lane, outside the runtime container)
    # OMN-19894 (operator rulings 2026-09-28T01:58:06Z and 01:58:17Z: a check
    # must not rely on one machine). Any runner of the overlay's pool
    # (vars.LAB_PROBE_RUNS_ON_JSON): this job reads the lane over the network
    # only (the broker declared in omnimarket config/ci_bus_lanes.yaml), and a
    # runner on any lab host reaches it. No host label is written here.
    runs-on: ${{ fromJSON(vars.LAB_PROBE_RUNS_ON_JSON) }}
    timeout-minutes: 15

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # The pinned omnimarket: the task-class contract provider AND the owner of
      # the lane declaration the CLI resolves `--lane dev` from. Laid out as a
      # workspace root (`<root>/omnimarket/config/ci_bus_lanes.yaml`) because
      # that is the path the CLI reads (OMNIBASE_PATH, below).
      - name: Checkout omnimarket (pinned provider and lane declaration)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: 91b8bb1b8c7f35bc502ae1dc126eb95d4916c0ef # .github/sibling-pins.yaml
          path: .probe-workspace/omnimarket
          persist-credentials: false
          fetch-depth: 1

      # Layered on top of the synced venv, never resolved into it (omnibase-*
      # is the layer beneath infra and infra's lock owns it; omninode-* siblings
      # install --no-deps so their metadata cannot re-resolve that layer; the
      # pure-PyPI leaves resolve normally). omnimarket itself installs from the
      # checkout's own commit as a git requirement so the install records
      # `vcs_info.commit_id` and the omnimarket drift guard reads
      # installed == canonical.
      - name: Co-install omnimarket into the job venv
        run: |
          set -euo pipefail
          PYTHON_BIN="${GITHUB_WORKSPACE}/.venv/bin/python"
          test -x "${PYTHON_BIN}"
          OMNIMARKET_SHA="$(git -C .probe-workspace/omnimarket rev-parse HEAD)"
          # actions/checkout at a sha leaves a detached HEAD, which the
          # omnimarket drift guard refuses for a canonical clone ("it tracks no
          # branch"). Attach the same commit to a local branch; the commit, and
          # so installed == canonical, is unchanged.
          git -C .probe-workspace/omnimarket checkout -q -B dev
          python3 - "${RUNNER_TEMP}" <<'PYEOF'
          import re
          import sys
          import tomllib
          from pathlib import Path

          out_dir = Path(sys.argv[1])
          with open(".probe-workspace/omnimarket/pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          no_deps = []
          leaves = []
          for dep in data["project"]["dependencies"]:
              name = re.split(r"[<>=!~\[;\s]", dep, maxsplit=1)[0].strip().lower()
              if name.startswith("omnibase-"):
                  continue
              if name.startswith("omninode-"):
                  no_deps.append(dep)
              else:
                  leaves.append(dep)
          if not no_deps and not leaves:
              print(
                  "FAIL: omnimarket declares no installable dependencies; the "
                  "checkout or the parse is wrong.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          (out_dir / "omnimarket-no-deps.txt").write_text("\n".join(no_deps) + "\n")
          (out_dir / "omnimarket-leaves.txt").write_text("\n".join(leaves) + "\n")
          PYEOF
          mapfile -t NO_DEPS < <(grep -v '^$' "${RUNNER_TEMP}/omnimarket-no-deps.txt" || true)
          mapfile -t LEAVES < <(grep -v '^$' "${RUNNER_TEMP}/omnimarket-leaves.txt" || true)
          if [ "${#LEAVES[@]}" -gt 0 ]; then
            uv pip install --python "${PYTHON_BIN}" "${LEAVES[@]}"
          fi
          uv pip install --python "${PYTHON_BIN}" --no-deps ${NO_DEPS[@]+"${NO_DEPS[@]}"} \
            "omnimarket @ git+https://github.com/OmniNode-ai/omnimarket@${OMNIMARKET_SHA}"
          echo "omnimarket co-installed at ${OMNIMARKET_SHA}"

      # The non-secret half of the dev lane's declared transport, from the same
      # declaration and the same reader the CLI resolves `--lane` through, so
      # the credential injected below is offered to the protocol the broker
      # speaks. The credentials themselves never pass through this step.
      - name: Resolve the declared lane transport
        run: |
          set -euo pipefail
          .venv/bin/python -c "
          import os, pathlib
          from omnibase_infra.nodes.node_chain_canary_effect.lane_transport import (
              lane_transport_env, load_lane_transport,
          )
          from scripts.ci.r1_front_door_probe import PROBE_LANE
          transport = load_lane_transport(
              pathlib.Path('.probe-workspace/omnimarket/config/ci_bus_lanes.yaml'),
              PROBE_LANE,
          )
          print(f'lane {PROBE_LANE!r} declares {transport.bootstrap_servers} '
                f'({transport.security_protocol}/{transport.sasl_mechanism})')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in lane_transport_env(transport).items():
                  handle.write(f'{key}={value}\n')
          "

      - name: Run the R1 front-door probe and grade it
        id: probe
        env:
          # The workspace root the CLI reads `omnimarket/config/ci_bus_lanes.yaml`
          # under (the sanctioned wrapper binds the same variable on a lab host).
          OMNIBASE_PATH: ${{ github.workspace }}/.probe-workspace
          # The org-wide dev-lane SCRAM secrets chain-canary.yml already uses,
          # as ENVIRONMENT so no credential reaches argv or this log.
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
        run: |
          set -uo pipefail
          # NOT `set -e`: a non-zero probe is the verdict and must still write
          # its record before the job ends.
          .venv/bin/python scripts/ci/r1_front_door_probe.py \
            --onex-bin .venv/bin/onex \
            --record r1-front-door-probe.json \
            --summary-file "${GITHUB_STEP_SUMMARY}"
          status=$?
          echo "probe exit status: ${status}"
          exit "${status}"

      - name: Assert the probe record is present and non-empty
        if: always()
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ci/assert_evidence_artifact.py \
            --artifact r1-front-door-probe \
            --require r1-front-door-probe.json

      - name: Upload the probe record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-front-door-probe
          path: r1-front-door-probe.json
          if-no-files-found: error
          retention-days: 30
