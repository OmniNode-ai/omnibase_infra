# runner-fleet-canary.yml — scheduled fleet-status canary (OMN-13915)
#
# Compares GitHub's org self-hosted runner registry (authoritative) against the
# expected fleet size in config/runner_fleet.yaml every 15 minutes and fails
# the run when the offline count crosses the threshold. This catches the
# silent-zombie fleet mode (37/48 listeners dead-in-container while every
# Docker healthcheck stayed green, 2026-07-03) BEFORE queued CI piles up.
#
# HARD REQUIREMENT: this job runs on GitHub-hosted compute (ubuntu-latest),
# NEVER on self-hosted — the canary must not share fate with the fleet it
# watches. Do not change runs-on.
name: runner-fleet-canary

on:
  schedule:
    # OMN-18031: */15 -> */5. The saturation monitor below counts CONSECUTIVE
    # breaching samples, and sustained_samples: 4 at this cadence is a
    # 20-minute sustain -- long enough to ride out the volatility measured on
    # 2026-09-07 (busy swung 65 -> 10 of 88 inside two minutes), short enough
    # to notice a real pile-up. This is deliberately the EXISTING scheduler
    # rather than a third one.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fleet-status:
    name: fleet-status
    # Canary MUST NOT depend on the self-hosted fleet it monitors.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (fleet config + canary script)
        uses: actions/checkout@v4
        with:
          # No git operations after checkout — do not leave the Actions token
          # in local git config (zizmor artipacked).
          persist-credentials: false

      - name: Compare org runner registry vs expected fleet size
        env:
          # Preferred: dedicated secret with org self-hosted-runner read scope.
          # Fallback: CROSS_REPO_PAT (org-wide PAT already used by CI).
          # The script fails loudly if neither is present or the scope is
          # insufficient — a canary that cannot see the fleet is a red run,
          # never a silent skip (fail-closed).
          RUNNER_FLEET_STATUS_TOKEN: ${{ secrets.RUNNER_FLEET_STATUS_TOKEN }}
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          RUNNER_CANARY_MAX_OFFLINE: "5"
        run: bash scripts/ci/runner_fleet_canary.sh

      # OMN-18031: publish the raw counts for the saturation monitor below.
      # `if: always()` because a canary FAILURE is exactly when the saturation
      # record matters most -- a monitor that only records on green runs is
      # blind to the outage it exists to describe.
      - name: Publish fleet counts for the saturation monitor
        if: always()
        env:
          RUNNER_FLEET_STATUS_TOKEN: ${{ secrets.RUNNER_FLEET_STATUS_TOKEN }}
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set -uo pipefail
          python3 - <<'PYEOF' > fleet-status.json
          import json, os, sys
          sys.path.insert(0, "scripts/ci")
          from runner_route_decision import probe_fleet, load_route_policy
          policy = load_route_policy(__import__("pathlib").Path("config/runner_routing_policy.yaml"))
          token = os.environ.get("RUNNER_FLEET_STATUS_TOKEN") or os.environ.get("CROSS_REPO_PAT")
          print(json.dumps(probe_fleet(token, str(policy["runner_group"]), "https://api.github.com")))
          PYEOF
          cat fleet-status.json

      - name: Upload fleet counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-status
          path: fleet-status.json
          if-no-files-found: warn
          retention-days: 7

  # --- OMN-18031 G7: the lab half of the saturation record -----------------
  #
  # DELIBERATELY SELF-HOSTED, and therefore deliberately fate-shared with the
  # fleet. A hosted runner cannot read lab load at all: the pre-push picker
  # reaches lab hosts over ssh to tailnet/RFC1918 addresses that GitHub-hosted
  # compute has no route to. So the only way to measure the lab is to run ON it.
  #
  # The cost is named rather than hidden: the lab half of the record is missing
  # exactly when the lab is busiest. That is why its ABSENCE is itself one of
  # the four alert conditions (`lab_probe_unavailable_sustained`) -- the one
  # reason a 3-minute self-hosted job cannot start is that no runner is free.
  lab-load-probe:
    name: lab-load-probe
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Never blocks the canary: this job failing IS a data point, not an outage.
    continue-on-error: true
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe this host's load and free memory
        run: |
          set -uo pipefail
          python3 - <<'PYEOF' > lab-load.json
          import json, sys, datetime
          sys.path.insert(0, "scripts/ci")
          from runner_route_decision import probe_local_lab_load
          record = probe_local_lab_load()
          record["sampled_at"] = datetime.datetime.now(datetime.UTC).isoformat()
          print(json.dumps(record))
          PYEOF
          cat lab-load.json
      - name: Upload lab load record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-load
          path: lab-load.json
          if-no-files-found: warn
          retention-days: 7

  # --- OMN-18031 G7: merge, evaluate, alert --------------------------------
  saturation-record:
    name: saturation-record
    needs: [fleet-status, lab-load-probe]
    # `always()` is load-bearing: a red fleet-status or an absent lab probe are
    # the two states this monitor most needs to record.
    if: always()
    # Hosted for the same reason as fleet-status: the monitor must survive the
    # saturation it reports on.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download this run's halves
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: ./.sat-current

      - name: Download prior records for the sustain window
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p ./.sat-history
          # The sustain window is read from this workflow's own previous record
          # artifacts -- no new datastore, and nothing to keep in sync.
          gh run list --workflow runner-fleet-canary.yml --repo "${GITHUB_REPOSITORY}"             --status completed --limit 8 --json databaseId --jq '.[].databaseId'             > ./.sat-runs.txt || true
          # zsh/bash note: read the ids into an explicit loop; an unquoted
          # variable does not word-split under every shell (CLAUDE.md rule 16).
          while IFS= read -r run_id; do
            [ -n "${run_id}" ] || continue
            gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}"               --name saturation-record --dir "./.sat-history/${run_id}" || true
          done < ./.sat-runs.txt
          find ./.sat-history -name '*.json' | head -20 || true

      - name: Build the record and evaluate sustained saturation
        id: evaluate
        run: |
          set -uo pipefail
          python3 scripts/ci/runner_saturation_record.py             --policy config/runner_routing_policy.yaml             --fleet-json ./.sat-current/fleet-status/fleet-status.json             --lab-json ./.sat-current/lab-load/lab-load.json             --route-reason "${ROUTE_REASON:-unknown}"             --history ./.sat-history             --out runner-saturation-record.json
        env:
          # Until the seam is flipped every run decides `seam_ceiling_hosted`,
          # which condition 3 deliberately does NOT treat as saturation.
          ROUTE_REASON: seam_ceiling_hosted
          # Same channel the fleet canary already alerts to -- inherited, not
          # chosen here. Absent tokens degrade to annotation + artifact only.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Upload the saturation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturation-record
          path: |
            runner-saturation-record.json
            runner-saturation-alerts.json
          if-no-files-found: warn
          retention-days: 7
