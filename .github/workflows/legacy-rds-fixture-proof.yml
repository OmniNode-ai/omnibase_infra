name: Sanitized Legacy RDS Fixture Proof

# OMN-16511 (Stage 0a canary): comment-only touch to qualify this file's own
# pull_request path filter (`.github/workflows/legacy-rds-fixture-proof.yml`)
# so the repo-scoped OMNI_DOCKER_CI_RUNS_ON_JSON hosted-runner seam can be
# exercised without editing any docker/** fixture content. No functional
# change.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/legacy-rds-fixture-proof.yml"
      - "docker/legacy-rds-fixture/**"
      - "docker/migrations/**"
      - "scripts/run-forward-migrations.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-rds-fixture-proof.yml"
      - "docker/legacy-rds-fixture/**"
      - "docker/migrations/**"
      - "scripts/run-forward-migrations.sh"
  workflow_dispatch:

concurrency:
  group: legacy-rds-fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixture-proof:
    name: PostgreSQL 16 Fresh + Legacy Fixture
    # OMNI_RUNNER_SELECTOR_V1 - trusted Docker proofs default to self-hosted omnibase-ci; public forks default to ubuntu-latest.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_DOCKER_CI_RUNS_ON_JSON || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # This proof is intentionally independent of OCC preflight. It validates
      # sanitized fixture behavior on draft PRs; it grants no release or merge
      # authorization, and the repository's OCC gates remain fail-closed.
      - name: Sanitized legacy-RDS Docker proof
        run: |
          docker compose \
            --project-name "omn15422-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker/legacy-rds-fixture/compose.yml \
            up --build --abort-on-container-exit --exit-code-from proof

      - name: Clean sanitized legacy-RDS Docker proof
        if: always()
        run: |
          docker compose \
            --project-name "omn15422-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker/legacy-rds-fixture/compose.yml \
            down --volumes --remove-orphans
