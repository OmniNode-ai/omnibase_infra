#
# OMN-12243: Block PRs targeting main.
#
# OMN-17427: no exception is left. `main` is release-synced: the release
# workflow (release.yml, "Sync main to release tag") advances it by a
# fast-forward over the REST API and opens no pull request against it, and the
# operator ruling of 2026-10-10T16:52:56Z re-affirms that dev is the default
# branch and a PR that targets main violates the rule. The promotion-receipt
# and hotfix shapes this guard used to admit exist nowhere in that workflow.
# The release train opens its release PR from `automation/release-<version>-omn-18595`
# and the post-release version bump comes from
# `automation/post-release-dev-bump-<version>`; both target dev, where this
# guard does not apply.
#
# Required through the CI Summary poller (EXPECTED_EXTERNAL_CONTEXTS in
# scripts/ci/ci_summary_gate.py) and mirrored locally by the pre-push hook
# `main-target-guard` in .pre-commit-config.yaml.
# Pinned by tests/ci/test_main_target_guard_omn17427.py.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  # OMN-13949: cancel superseded PR runs to free saturated runners. merge_group
  # entries carry a unique github.ref, so queue entries never cross-cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-target-guard:
    name: main-target-guard
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "::error::PR from '${HEAD_REF}' targets main, which is release-synced and never a pull-request target."
          echo "::error::The release workflow moves main by fast-forwarding it to the published tag; it opens no PR against main."
          echo "::error::Release PRs (automation/release-<version>-omn-18595) and the post-release bump (automation/post-release-dev-bump-<version>) target dev."
          echo "::error::Retarget this PR to dev."
          exit 1
