#
# OMN-12243: Block PRs targeting main.
#
# OMN-17427: operator RULING 2026-10-10T16:52:56Z (lane dev-default-9f8a):
# "Dev as a default branch has been the rule for months anything targeting
# Main has been violating that rule." main is release-synced: release.yml
# fast-forwards it to each release tag and promotion PRs to main are retired,
# so the dev-to-main promotion PR and the hotfix PR this guard used to admit
# are refused like any feature PR. The one exemption is the release PR that
# release-train-nightly.yml opens: head `automation/release-<X.Y.Z>-omn-18595`
# (the `branch=` line of its "Open the release pull request" step), authored by
# the release App, which GitHub reports as user type Bot.
#
# Local twin: the `main-target-guard` pre-push hook in .pre-commit-config.yaml
# warns when a push lands on main or the branch tracks main.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  # OMN-13949: cancel superseded PR runs to free saturated runners. merge_group
  # entries carry a unique github.ref, so queue entries never cross-cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-target-guard:
    name: main-target-guard
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "PR targets main. Checking head ref: '${HEAD_REF}'"

          release_head='^automation/release-[0-9]+\.[0-9]+\.[0-9]+-omn-18595$'
          if [[ "${HEAD_REF}" =~ ${release_head} && "${PR_AUTHOR_TYPE}" == "Bot" ]]; then
            echo "::notice::Release PR opened by the release workflow from '${HEAD_REF}'. Allowed."
            exit 0
          fi

          echo "::error::Dev is the default branch; a PR whose base is main violates that rule."
          echo "::error::main accepts only the release PR release-train-nightly.yml opens"
          echo "::error::(head automation/release-<X.Y.Z>-omn-18595, authored by the release App)."
          echo "::error::Head ref '${HEAD_REF}' by a '${PR_AUTHOR_TYPE}' author is not it."
          echo "::error::Retarget this PR to dev; main is fast-forwarded by the release workflow."
          exit 1
