---
# hostile-reviewer.yml
#
# Adversarial multi-model code review gate on every pull request (OMN-8468).
#
# Invokes omniintelligence.review_pairing.cli_review directly (a standalone
# module calling model endpoints over HTTP; it does not import or route
# through any omnibase_infra handler -- OMN-15959) with the voters declared in
# a review voters overlay (review_voters_overlay.v1, OMN-20910) that THIS
# REPOSITORY DOES NOT CARRY. Operator RULING 2026-10-10T21:57:38Z (OMN-20923),
# re-affirming 2026-09-26 and 2026-09-30: no lab or deployment configuration
# lives in a shipped repository, and CI is configured by an overlay supplied by
# whoever runs it. The org Actions variable OMNI_CI_OVERLAY_REPO names a private
# repository of that owner; its node overlay for omniintelligence's
# node_review_voters_overlay_compute (config/onex/overlays/
# node_review_voters_overlay_compute/overlay.yaml) is fetched at run time and
# validated by that node's resolver. With the
# variable unset (a fork, a customer, any deployment that has not configured
# voters) the neutral default applies: no voter is configured, and the gate
# fails closed saying so and naming how to supply an overlay. THIS FILE NAMES NO
# VOTER, ENDPOINT, MODEL OR NETWORK: the transport's CIDR allowlist is derived
# from the resolved voters' hosts, never written here.
# Private diffs go only to lab models (OPERATOR-CONSENT, rolling ledger row
# 4842). A required voter that is unreachable or fails is named, one voter is
# no quorum, and the job fails closed (omnibase_infra#4119). Codex is not a
# voter (OMN-8524); a voter of any kind is added in the overlay.
#
# Semantics (OMN-17492 -- the model is the FINDER, never the gate):
#   - Findings post as resolvable PR review threads
#     (scripts/ci/post_hostile_review_threads.py; REQUEST_CHANGES posture
#     when critical/major findings exist).
#   - The DETERMINISTIC merge surface is "Hostile Review Thread Gate": it
#     fails while unresolved hostile-reviewer threads exist and passes when
#     they are resolved. No job exits nonzero on a model's opinion.
#   - degraded — fewer than 2 models succeeded (infra) → the reviewer job
#     FAILS with a named reason (OMN-17492 follow-up, 2026-09-25). It was
#     informational, and 28 of the 32 PRs merged 2026-09-24T23:18Z..
#     2026-09-25T11:10Z went green on a DEGRADED run that reviewed nothing:
#     the job ran hosted, where no local key is reachable, so glm-review
#     (then on the roster) alone succeeded and the two-model quorum
#     (OMN-18479) never formed.
#   The pre-OMN-17492 "blocked on critical findings → exit 1" path was DEAD
#   CODE: it parsed merged_findings / total_input_findings, fields
#   ModelMultiReviewResult never had, so blocking was always 0 and finding
#   content was discarded entirely. Replaced, not regressed.
#
# Status check names added by this workflow: "Hostile Review Gate"
# (pipeline-ran integrity) and "Hostile Review Thread Gate" (thread
# resolution). NEITHER is a required context in this pass (OMN-17492
# canary; promote-to-required is a recorded follow-up on the ticket).
#
# Credential: LOCAL_LLM_SHARED_SECRET is the only reviewer secret (a repo
# Actions secret, OMN-14176); never committed, never printed. No cloud
# reviewer credential is wired: the roster is lab-only (OMN-17492).
#
# Reference: OMN-8468 (W6.1 mandatory CI gate), OMN-8524 (pilot rollout),
# OMN-14176 (model fix), OMN-17492 (lab-only roster + thread gate)

name: Hostile Reviewer

on:
  pull_request:
    branches: [main, dev]
    # OMN-16216: labeled/unlabeled/ready_for_review so applying/removing
    # ci:ready or a draft->ready flip retriggers this workflow's evaluation
    # of the hostile-review job's if:. `edited` is absent: no job here reads
    # the pull request's title or body.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hostile-review:
    # OMN-16216 draft-state CI admission gate (mirrors onex_change_control
    # PR #6686 / OMN-15731): "Hostile Review Gate" does not gate merge today
    # (absent from STRICT_GATE_JOBS/SKIPPABLE_GATE_JOBS/
    # EXPECTED_EXTERNAL_CONTEXTS in scripts/ci/ci_summary_gate.py, and not a
    # direct required context on dev or main) -- gating it off draft/ci:ready
    # is a pure runner-cost win with no fail-closed exposure to design
    # around. Main-boundary carve-out unchanged.
    # OMN-17492 noise/cost control: bot PRs (dependabot, the OCC writer app)
    # are skipped outright -- dependabot PRs cannot see the reviewer secret
    # anyway, and adversarial review of automated lock/evidence bumps is
    # pure lab-GPU burn.
    if: >-
      (github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:ready'))
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'onexbot-occ-writer[bot]'
    name: Hostile Reviewer (adversarial gate)
    # RUNNER CARVE-OUT (OMN-17492 follow-up; same shape as omniclaude
    # OMN-18415). The reviewers are LAN-only, so the trusted branch reads a
    # DEDICATED variable whose fallback is the LAN-attached omnibase-ci fleet,
    # NOT the shared OMNI_TRUSTED_CI_RUNS_ON_JSON seam: that seam is
    # ["ubuntu-latest"] at org and repo scope, and while this job read it
    # every trusted run landed hosted, failed 3 of 3 TCP connects to the lab
    # endpoint for each local key, and left glm-review (then on the roster)
    # as the only model (run 36111018598, omnibase_infra#4110). OMNI_HOSTILE_REVIEW_RUNS_ON_JSON
    # is deliberately left UNSET: setting it is an operator kill switch that
    # must cite a reachability proof, never a side effect of a seam migration.
    # Nothing here writes an Actions variable (CLAUDE.md rule 14). Fork PRs
    # keep the public path first and never reach the LAN fleet.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_HOSTILE_REVIEW_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 35

    # Job-level so the preflight and the review step read the SAME values.
    # The voters come only from REVIEW_VOTERS_OVERLAY (OMN-20910), a file of the
    # private CI overlay (OMN-20923) and never of this repository. The
    # transport's trust boundary, LLM_ENDPOINT_CIDR_ALLOWLIST (it fail-closes if
    # unset), is set by the preflight from the resolved voters' hosts.
    env:
      REVIEW_VOTERS_OVERLAY: ${{ github.workspace }}/../ci-overlay/config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Clean stale dependency clones
        working-directory: ${{ github.workspace }}
        run: rm -rf ../omniintelligence ../omnibase_core_dep ../omnibase_compat ../ci-overlay

      # OMN-20923: the review voters are a deployment fact, supplied by an
      # overlay this repository does not carry. OMNI_CI_OVERLAY_REPO (an org
      # Actions variable, a bare repository name under this owner) names it.
      # Unset: the neutral default, no voters configured; the preflight fails
      # the gate closed with that reason. Set but unreadable: this step fails,
      # because a configured deployment that silently fell back to "no voters"
      # would report the wrong cause.
      - name: Resolve the CI overlay
        id: ci-overlay
        env:
          CI_OVERLAY_REPO: ${{ vars.OMNI_CI_OVERLAY_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${CI_OVERLAY_REPO}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::no review voters configured: OMNI_CI_OVERLAY_REPO is unset, so no CI overlay supplies config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml (review_voters_overlay.v1). The gate fails closed. To run it, put your voters in a repository of your own and set OMNI_CI_OVERLAY_REPO to its name."
            exit 0
          fi
          if [[ ! "${CI_OVERLAY_REPO}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::OMNI_CI_OVERLAY_REPO must be a bare repository name, got '${CI_OVERLAY_REPO}'"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "name=${CI_OVERLAY_REPO}" >> "$GITHUB_OUTPUT"

      - name: Mint a read-only CI overlay token
        if: steps.ci-overlay.outputs.configured == 'true'
        id: ci-overlay-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.ci-overlay.outputs.name }}
          permission-contents: read

      # The CI overlay is DATA (the voter roster), read unpinned from its
      # default branch so a voter change needs no pull request here, and
      # validated by omniintelligence's resolver on every run; nothing from it
      # is executed (OMN-20923).
      - name: Fetch the CI overlay
        if: steps.ci-overlay.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository_owner }}/${{ steps.ci-overlay.outputs.name }}
          token: ${{ steps.ci-overlay-token.outputs.token }}
          path: .ci-overlay-checkout
          persist-credentials: false
          sparse-checkout: |
            config/onex/overlays/node_review_voters_overlay_compute
          sparse-checkout-cone-mode: false

      - name: Place the CI overlay outside the workspace
        if: steps.ci-overlay.outputs.configured == 'true'
        run: |
          set -euo pipefail
          rm -rf ../ci-overlay
          mv .ci-overlay-checkout ../ci-overlay
          echo "CI overlay read from ${{ github.repository_owner }}/${{ steps.ci-overlay.outputs.name }} at $(git -C ../ci-overlay rev-parse HEAD)"
          if [ ! -s "$REVIEW_VOTERS_OVERLAY" ]; then
            echo "::error::the CI overlay carries no config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml; no voter can be resolved"
            exit 1
          fi

      - name: Clone omniintelligence
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omniintelligence
            if git clone --filter=blob:none --no-checkout \
              https://github.com/OmniNode-ai/omniintelligence.git ../omniintelligence \
              && git -C ../omniintelligence checkout --quiet 64b950973a5686d33e0b439fb80749d66362d06d; then # .github/sibling-pins.yaml
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Clone omnibase_core (omniintelligence dependency)
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omnibase_core_dep
            if git clone --filter=blob:none --no-checkout \
              https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core_dep \
              && git -C ../omnibase_core_dep checkout --quiet f43f97629182f463d233b564b19a2b27d4fc4888; then # .github/sibling-pins.yaml
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Clone omnibase_compat
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omnibase_compat
            if git clone --filter=blob:none --no-checkout \
              https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat \
              && git -C ../omnibase_compat checkout --quiet 65aed95fa710748654e37d5c15c5446e779fdf52; then # .github/sibling-pins.yaml
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        working-directory: ${{ github.workspace }}
        run: uv python install 3.12

      - name: Install omniintelligence dependencies
        # OMN-20910: the install runs before the voter preflight, because the
        # overlay reader is imported from omniintelligence.review_pairing, whose
        # package __init__ needs numpy. Run from a bare clone, the preflight died
        # on ModuleNotFoundError, resolved no voter and reported DEGRADED.
        # No continue-on-error: a failed install fails this job here, and the
        # always() enforce and comment steps report it; nothing downstream can
        # read a verdict from an environment that was never built.
        id: install-omniintelligence
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: "cpu"
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Preflight — probe review endpoint reachability
        id: preflight
        working-directory: ../omniintelligence
        env:
          # Wired from a GitHub Actions secret (OMN-14176): the LLM HTTP transport
          # HMAC-signs every call with LOCAL_LLM_SHARED_SECRET and fail-closes if it
          # is absent.
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          CI_OVERLAY_CONFIGURED: ${{ steps.ci-overlay.outputs.configured }}
        run: |
          # -e is intentionally OMITTED: an unreachable endpoint must never fail
          # this step; it records a DEGRADED verdict and the enforce step fails
          # the job. The targets come from the voters overlay through the same
          # loader and node the review uses (OMN-20910), from the environment
          # the install step built. An invalid overlay, or an install that left
          # the reader unimportable, is DEGRADED with the reason; an overlay
          # refusal names the voter.
          set -o pipefail

          # OMN-20923 neutral default: no CI overlay, no voters. Fail closed
          # with that reason rather than a missing-file message.
          if [ "${CI_OVERLAY_CONFIGURED}" != "true" ]; then
            REASON="no review voters configured (OMNI_CI_OVERLAY_REPO is unset; supply a review_voters_overlay.v1 file through a CI overlay)"
            echo "::error::${REASON}"
            {
              echo "reachable=false"
              echo "verdict=degraded"
              echo "blocking_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=${REASON}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROBE_TARGETS="$(uv run --no-sync python -I - "$REVIEW_VOTERS_OVERLAY" <<'PYEOF'
          import sys

          from omniintelligence.nodes.node_review_voters_overlay_compute.handlers.handler_review_voters_overlay import (
              probe_target_lines,
          )
          from omniintelligence.review_pairing.model_registry_loader import load_review_voters

          roster = load_review_voters(sys.argv[1])
          if not roster.ok:
              print(f"REFUSED|{roster.error_message}")
          else:
              for voter in roster.voters:
                  print(f"VOTER|{voter.describe()}")
              print("\n".join(probe_target_lines(roster)))
          PYEOF
          )"
          printf '%s\n' "$PROBE_TARGETS" | sed -n 's/^VOTER|/review voter: /p'

          REFUSED="$(printf '%s\n' "$PROBE_TARGETS" | sed -n 's/^REFUSED|//p' | head -n1)"
          TARGETS="$(printf '%s\n' "$PROBE_TARGETS" | grep '^TARGET' || true)"

          if [ -n "$REFUSED" ] || [ -z "$TARGETS" ]; then
            REASON="${REFUSED:-the review voters overlay resolved no voter}"
            echo "::error::review voters overlay refused: ${REASON}"
            {
              echo "reachable=false"
              echo "verdict=degraded"
              echo "blocking_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=review voters overlay refused: ${REASON}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # OMN-20923: the transport's trust boundary is the resolved voters'
          # hosts, one /32 each, so no network is written in this file. The
          # roster comes from the private CI overlay at its default branch,
          # never from this pull request's checkout.
          ALLOWLIST=""
          while IFS='|' read -r _tag _voter HOST _port _url; do
            [ "$_tag" = "TARGET" ] || continue
            ADDR="$(python3 -c 'import socket, sys; print(socket.gethostbyname(sys.argv[1]))' "$HOST" 2>/dev/null || true)"
            if [ -n "$ADDR" ]; then
              ALLOWLIST="${ALLOWLIST:+${ALLOWLIST},}${ADDR}/32"
            fi
          done < <(printf '%s\n' "$TARGETS")
          if [ -n "$ALLOWLIST" ]; then
            echo "LLM_ENDPOINT_CIDR_ALLOWLIST=${ALLOWLIST}" >> "$GITHUB_ENV"
          fi

          # TCP-connect probe, 3 attempts per voter, the same tolerance as the
          # reviewer's own probe. If ANY voter is reachable, the review runs and
          # decides (it names every unreachable required voter itself).
          UNREACHABLE=""
          while IFS='|' read -r _tag VOTER HOST PORT URL; do
            [ "$_tag" = "TARGET" ] || continue
            voter_reachable="false"
            for attempt in 1 2 3; do
              if timeout 5 bash -c "exec 3<>/dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
                echo "TCP connect to voter ${VOTER} at ${HOST}:${PORT} (${URL}) succeeded (attempt ${attempt})."
                voter_reachable="true"
                break
              fi
              echo "TCP connect to voter ${VOTER} at ${HOST}:${PORT} (${URL}) failed (attempt ${attempt}/3)."
              [ "$attempt" -lt 3 ] && sleep 2
            done
            if [ "$voter_reachable" = "true" ]; then
              echo "At least one review voter is reachable; proceeding with full review."
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            UNREACHABLE="${UNREACHABLE}${VOTER}@${HOST}:${PORT} "
          done < <(printf '%s\n' "$TARGETS")

          # EVERY voter is unreachable; the overlay names no fallback, so the
          # reviewer would call nobody. Short-circuit with the same DEGRADED
          # verdict and skip the review.
          echo "::warning::All review voters [${UNREACHABLE}] unreachable after 3 attempts; short-circuiting to DEGRADED and skipping the review."
          {
            echo "reachable=false"
            echo "verdict=degraded"
            echo "blocking_count=0"
            echo "total_findings=0"
            echo "models_succeeded="
            echo "error=all review voters [${UNREACHABLE}] unreachable — preflight short-circuit"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run adversarial review
        if: steps.preflight.outputs.reachable != 'false'
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The pull request's head commit, never the merge ref this job checks
          # out: a signed off-CI review receipt is bound to the head its
          # reviewer read, and cli_review lets one stand in for a timed-out or
          # unavailable voter only for exactly this commit, and only when the
          # voters overlay declares substitute_votes (OMN-20947).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          REVIEW_JSON_PATH: ${{ github.workspace }}/hostile-review-result.json
        working-directory: ../omniintelligence
        run: |
          set -euo pipefail

          # The voters, their endpoints, models, sampling and focus come from
          # the overlay (OMN-20910); the log names each voter and the model
          # its endpoint serves. A voter the reachability probe drops is
          # recorded in the result as failed with an "unreachable" error,
          # the summary below names it, and a required voter that does not
          # vote exits 2 and fails the job (omnibase_infra#4119).
          #
          # OMN-18479: those models are also the quorum. cli_review now
          # resolves cross-model agreement and only a finding at least two
          # distinct models raised is treated as blocking; below-quorum
          # findings are reported in the review body without a thread.
          uv run python -m omniintelligence.review_pairing.cli_review \
            --pr "$PR_NUMBER" \
            --repo "$REPO" \
            --head-sha "$HEAD_SHA" \
            --voters-overlay "$REVIEW_VOTERS_OVERLAY" \
            --output "$REVIEW_JSON_PATH" \
            2> >(tee hostile-reviewer-stderr.log >&2) || REVIEW_EXIT=$?

          # cli_review writes the JSON before computing its exit code, so a
          # degraded run (exit 2: one model) and even a total outage (exit 1)
          # still leave a parseable result when the file exists.
          if [ ! -s "$REVIEW_JSON_PATH" ]; then
            {
              echo "verdict=degraded"
              echo "error_count=0"
              echo "warning_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=cli_review produced no result JSON (exit ${REVIEW_EXIT:-0} — binary error before review)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # OMN-17492: read the REAL ModelMultiReviewResult fields. The
          # previous parser read merged_findings / total_input_findings —
          # fields that model never had — so blocking was always 0 and the
          # "blocked" exit-1 was dead code. Per the finder-never-gate
          # doctrine this step now ALWAYS exits 0 on a completed pipeline;
          # findings surface as review threads and the deterministic
          # "Hostile Review Thread Gate" owns blocking.
          VERDICT_DATA=$(python3 - "$REVIEW_JSON_PATH" <<'PYEOF'
          import json, sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)

          models_succeeded = list(data.get("models_succeeded", []))
          total_findings = int(data.get("total_findings", 0))

          severity_counts: dict[str, int] = {}
          for model_result in data.get("results", []):
              if not model_result.get("success"):
                  continue
              for finding in model_result.get("findings", []):
                  sev = str(finding.get("severity", "info"))
                  severity_counts[sev] = severity_counts.get(sev, 0) + 1

          # OMN-18479: the reviewer resolves cross-model agreement itself and
          # ships the verdict in `quorum`. Read it -- never re-derive one
          # here. `degraded_quorum` means fewer models succeeded than
          # agreement requires, so there is NO verdict: it must not report
          # `passed`. A result with no quorum block is a reviewer predating
          # OMN-18479; fall back to the model count that rule replaced.
          quorum = data.get("quorum") or {}
          quorum_verdict = str(quorum.get("verdict", ""))
          if not quorum_verdict:
              verdict = "passed" if len(models_succeeded) >= 2 else "degraded"
          elif quorum_verdict in ("degraded_quorum", "no_models"):
              verdict = "degraded"
          else:
              verdict = "passed"

          print(f"verdict={verdict}")
          print(f"quorum_verdict={quorum_verdict or 'absent'}")
          print(f"quorum_blocking={int(quorum.get('blocking_count', 0))}")
          print(f"quorum_below={int(quorum.get('warning_count', 0))}")
          print(f"error_count={severity_counts.get('error', 0)}")
          print(f"warning_count={severity_counts.get('warning', 0)}")
          print(f"total_findings={total_findings}")
          print(f"models_succeeded={','.join(models_succeeded)}")
          # OMN-17492: name every reviewer that did not answer, with its
          # reason, so a run that lost one says which and why.
          failed = [
              f"{r.get('model')} ({str(r.get('error') or 'failed').splitlines()[0][:160]})"
              for r in data.get("results", [])
              if not r.get("success")
          ]
          print(f"models_failed={'; '.join(failed)}")
          PYEOF
          )

          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          if [ "${REVIEW_EXIT:-0}" -ne 0 ]; then
            echo "error=cli_review exit ${REVIEW_EXIT} (fewer than 2 models succeeded — partial/total outage)" >> "$GITHUB_OUTPUT"
          else
            echo "error=" >> "$GITHUB_OUTPUT"
          fi

      # OMN-17492: publish findings as resolvable PR review threads. This is
      # the surface the deterministic thread gate reads. Same-repo PRs only —
      # fork PRs get a read-only GITHUB_TOKEN (OMN-16235), which the script
      # detects via HOSTILE_REVIEW_IS_FORK and skips cleanly. Uses the infra
      # checkout's own script (stdlib-only; no uv env needed).
      - name: Post findings as PR review threads
        if: >-
          steps.preflight.outputs.reachable != 'false' &&
          steps.review.outcome == 'success' &&
          github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_JSON_PATH: ${{ github.workspace }}/hostile-review-result.json
          HOSTILE_REVIEW_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/post_hostile_review_threads.py

      - name: Post review summary as PR comment
        if: always()
        uses: actions/github-script@v9
        env:
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict || steps.preflight.outputs.verdict }}
          REVIEW_ERRORS: ${{ steps.review.outputs.error_count || '0' }}
          REVIEW_WARNINGS: ${{ steps.review.outputs.warning_count || '0' }}
          REVIEW_TOTAL: ${{ steps.review.outputs.total_findings || steps.preflight.outputs.total_findings }}
          REVIEW_MODELS: ${{ steps.review.outputs.models_succeeded || steps.preflight.outputs.models_succeeded }}
          REVIEW_MODELS_FAILED: ${{ steps.review.outputs.models_failed || '' }}
          REVIEW_ERROR: ${{ steps.review.outputs.error || steps.preflight.outputs.error }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verdict = process.env.REVIEW_VERDICT || 'unknown';
            const errors = parseInt(process.env.REVIEW_ERRORS || '0');
            const warnings = parseInt(process.env.REVIEW_WARNINGS || '0');
            const total = parseInt(process.env.REVIEW_TOTAL || '0');
            const models = process.env.REVIEW_MODELS || '';
            const modelsFailed = process.env.REVIEW_MODELS_FAILED || '';
            const error = process.env.REVIEW_ERROR || '';

            const icon = {
              passed: '✅',
              degraded: '⚠️',
            }[verdict] || '❓';

            const label = {
              passed: 'REVIEWED',
              degraded: 'DEGRADED (no verdict, job failed)',
            }[verdict] || verdict.toUpperCase();

            let note = '';
            if (verdict === 'degraded') {
              note = '\n\n> **No review verdict**: fewer than 2 reviewer models succeeded, ' +
                'so no finding could reach quorum. This run FAILS the reviewer job (OMN-17492): ' +
                'a review that established nothing is not a pass. Re-run once the endpoint is back.';
              if (error) note += ` Error: \`${error}\``;
            } else if (errors + warnings > 0) {
              note = '\n\n> **Action required**: findings were posted as review threads. ' +
                'Address or reject each one, then resolve its thread — the ' +
                '`Hostile Review Thread Gate` fails while hostile-reviewer threads are unresolved (OMN-17492).';
            }

            const body = [
              `## ${icon} Hostile Reviewer — ${label}`,
              '',
              `**Critical findings**: ${errors}  `,
              `**Major findings**: ${warnings}  `,
              `**Total findings**: ${total}  `,
              `**Models succeeded**: ${models || 'none'}  `,
              `**Models unavailable**: ${modelsFailed || 'none'}`,
              note,
              '',
              '---',
              '',
              '**Semantics (OMN-17492 — the model finds, thread resolution gates)**',
              '',
              '| Surface | Meaning | Blocks merge? |',
              '|---------|---------|---------------|',
              '| Review threads | Per-finding, posted by the reviewer | No (informational) |',
              '| `Hostile Review Thread Gate` | Deterministic: unresolved hostile-reviewer threads exist | Fails until resolved (not yet a required context) |',
              '| `degraded` verdict | Fewer than 2 models succeeded (infra) | Fails this job with a named reason |',
              '',
              '_Powered by [omniintelligence.review_pairing.cli_review](https://github.com/OmniNode-ai/omniintelligence) — multi-model adversarial review; voters from the private CI overlay (OMN-8468/OMN-17492/OMN-20910/OMN-20923)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Hostile Reviewer')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # OMN-17492 follow-up (2026-09-25), same rule as omnimarket OMN-15110:
      # a run that established no verdict is a NAMED failure, never a green
      # check. Every producer above (the preflight short-circuit, the missing
      # result JSON branch, and the quorum parse) still exits 0 so the summary
      # comment can explain itself; this last step is the single point that
      # turns anything other than `passed` into a job failure, which the
      # Hostile Review Gate below then reports.
      - name: Enforce hostile-review verdict (no verdict is not a pass)
        if: always()
        env:
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict || steps.preflight.outputs.verdict }}
          REVIEW_ERROR: ${{ steps.review.outputs.error || steps.preflight.outputs.error }}
        run: |
          echo "Resolved verdict: ${REVIEW_VERDICT:-unknown}"
          if [ "${REVIEW_VERDICT:-}" != "passed" ]; then
            echo "::error::Hostile Reviewer established no review verdict (verdict '${REVIEW_VERDICT:-unknown}'; reason: ${REVIEW_ERROR:-none reported}). Fewer than two reviewer models succeeded, so no finding could reach quorum. This is an infrastructure failure, not a pass: re-run once the review endpoints are reachable (OMN-17492)."
            exit 1
          fi

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: hostile-review
    # OMN-18793: `!cancelled()`, never bare `always()`. This workflow declares
    # `concurrency.cancel-in-progress: true`, so every re-push cancels the run
    # already in flight. `always()` is TRUE on a cancelled run, so the gate
    # executed there too, read a `cancelled` upstream result, and posted a hard
    # `failure` against the pull-request head for a run that was never allowed
    # to produce a verdict -- 9 of the 10 most recent heads when the OMN-18254
    # failure-rate alert first fired (run 35412814968).
    #
    # `!cancelled()` changes WHEN this job runs, never WHAT it refuses: a
    # skipped or failed upstream still evaluates here (a draft/bot-skipped
    # reviewer must not needs-cascade the gate into a vacuous skip), and both
    # fail-closed branches below are unchanged. Only a cancelled run is silent,
    # which is correct -- a superseded run has no verdict to report.
    if: ${{ !cancelled() }}
    steps:
      - name: Evaluate gate
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Hostile Review Gate ==="
          RESULT="${{ needs.hostile-review.result }}"
          echo "hostile-review: $RESULT"

          if [ "$RESULT" = "failure" ]; then
            # OMN-17492: hostile-review no longer exits nonzero on findings
            # (finder-never-gate) — a failure here is a pipeline/infra error
            # (install, script, or posting failure), not a model opinion.
            echo "::error::hostile-review job failed: either no review verdict was established (fewer than two models succeeded) or the pipeline errored. Findings never fail it (OMN-17492); read the job's own error line for which."
            exit 1
          fi
          echo "Hostile Review Gate PASSED"

  # OMN-17492: the DETERMINISTIC merge surface for hostile-review findings.
  # post_hostile_review_threads.py publishes findings as resolvable review
  # threads; this job fails while unresolved hostile-reviewer threads exist
  # and passes when they are resolved. It consults ONLY GitHub thread state —
  # never a model verdict. Runs even when the reviewer itself was skipped
  # (draft) or degraded: threads from earlier runs still deserve the gate.
  # NOT a required context in this pass (canary; promote-to-required is a
  # recorded follow-up on OMN-17492).
  hostile-review-thread-gate:
    name: Hostile Review Thread Gate
    # OMN-18799: `!cancelled()`, never bare `always()`. The workflow declares
    # `concurrency.cancel-in-progress: true`, so every re-push cancels the run
    # already in flight, and `always()` is TRUE on a cancelled run. This job
    # then started, and — unlike its sibling gate, which reads a `cancelled`
    # predecessor and goes red — it has no needs-result triage at all: the step
    # below shells the thread checker, which finds no threads from a reviewer
    # that was cancelled before it could post any, exits 0, and publishes a
    # GREEN verdict for a run that evaluated nothing. Four consecutive sampled
    # cancelled runs (35415401505, 35414662126, 35413698388, 35412846604) all
    # concluded `success` here. A false green is the worse direction: a false
    # red is loud, a success that established nothing is indistinguishable
    # from a real one.
    #
    # `!cancelled()` changes WHEN this job runs, never WHAT it checks: a
    # skipped (draft/bot) or failed reviewer job still evaluates here, because
    # existing unresolved threads outlive any single run and a skipped check
    # does not block a merge the way a failed one does. The event guard stays
    # for the same reason it was written: off a pull request there is no
    # PR_NUMBER for the checker to read.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [hostile-review]
    # The property the condition above preserves: a skipped/degraded reviewer
    # must not vacuously skip the thread check (OMN-15315 lineage: the absence
    # of a verdict is not a passing one — and existing unresolved threads
    # outlive any single run). OMN-18799 adds the converse for a CANCELLED
    # run, where the absence of a verdict must not be a passing one either.
    timeout-minutes: 10
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check unresolved hostile-reviewer threads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/check_hostile_review_threads.py
