---
# hostile-reviewer.yml
#
# Adversarial multi-model code review gate on every pull request (OMN-8468).
#
# Invokes omniintelligence.review_pairing.cli_review directly (a standalone
# module calling model endpoints over HTTP; it does not import or route
# through any omnibase_infra handler -- OMN-15959 corrected this stale
# doc-comment, which named a since-deleted HandlerLlmCliSubprocess class that
# omniintelligence.review_pairing.cli_review never actually imported) with
# three models (OMN-17492): the two local keys (qwen3-review /
# qwen3-review-b -- both currently resolve to the ONE remaining GPU on
# .201:8000 since the 4090 RMA, see OMN-16481) plus glm-review, an
# authenticated cloud reviewer on the z.ai GLM Coding Plan -- an
# independent quota domain AND independent hardware, so the roster
# survives a total local-fleet outage. Codex is excluded from the initial
# pilot -- add --model codex once non-interactive OAuth auth is confirmed
# on the omnibase-ci runner (OMN-8524).
#
# Semantics (OMN-17492 -- the model is the FINDER, never the gate):
#   - Findings post as resolvable PR review threads
#     (scripts/ci/post_hostile_review_threads.py; REQUEST_CHANGES posture
#     when critical/major findings exist).
#   - The DETERMINISTIC merge surface is "Hostile Review Thread Gate": it
#     fails while unresolved hostile-reviewer threads exist and passes when
#     they are resolved. No job exits nonzero on a model's opinion.
#   - degraded — fewer than 2 models succeeded (infra) → informational.
#   The pre-OMN-17492 "blocked on critical findings → exit 1" path was DEAD
#   CODE: it parsed merged_findings / total_input_findings, fields
#   ModelMultiReviewResult never had, so blocking was always 0 and finding
#   content was discarded entirely. Replaced, not regressed.
#
# Status check names added by this workflow: "Hostile Review Gate"
# (pipeline-ran integrity) and "Hostile Review Thread Gate" (thread
# resolution). NEITHER is a required context in this pass (OMN-17492
# canary; promote-to-required is a recorded follow-up on the ticket).
#
# Credential: LLM_GLM_API_KEY is a repo Actions secret (same sanctioned
# pattern as LOCAL_LLM_SHARED_SECRET, OMN-14176) resolved from the platform
# secret store; never committed, never printed. Fork PRs get no secrets --
# glm-review fails closed per-model and the local models still review.
#
# Reference: OMN-8468 (W6.1 mandatory CI gate), OMN-8524 (pilot rollout),
# OMN-14176 (model fix), OMN-17492 (GLM reviewer + thread gate)

name: Hostile Reviewer

on:
  pull_request:
    branches: [main, dev]
    # OMN-14241: `edited` added so a PR-body-only edit (e.g. stamping
    # `Evidence-Source: OCC#<n>`) retriggers this workflow's own
    # `occ-preflight` job -- see ci.yml's identical trigger for the full
    # rationale. Without it, `occ-preflight / eligibility` (workflowName
    # "Hostile Reviewer") sits at a stale pre-stamp FAILURE forever.
    #
    # OMN-16216: labeled/unlabeled/ready_for_review so applying/removing
    # ci:ready or a draft->ready flip retriggers this workflow's evaluation
    # of the hostile-review job's if:.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    # omnibase_infra has no local occ-preflight.yml (unlike omnibase_core, which
    # hosts the reusable) -- reference it remotely, matching the pinned SHA
    # already used by this repo's own call-occ-preflight.yml / auto-merge.yml.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@fc20d08690f03593eb8c55fd2c02c5f0f75f2b68
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts
      core-ref: dev

  hostile-review:
    needs: occ-preflight
    # OMN-16216 draft-state CI admission gate (mirrors onex_change_control
    # PR #6686 / OMN-15731): "Hostile Review Gate" does not gate merge today
    # (absent from STRICT_GATE_JOBS/SKIPPABLE_GATE_JOBS/
    # EXPECTED_EXTERNAL_CONTEXTS in scripts/ci/ci_summary_gate.py, and not a
    # direct required context on dev or main) -- gating it off draft/ci:ready
    # is a pure runner-cost win with no fail-closed exposure to design
    # around. Main-boundary carve-out unchanged.
    # OMN-17492 noise/cost control: bot PRs (dependabot, the OCC writer app)
    # are skipped outright -- dependabot PRs cannot see the LLM_GLM_API_KEY
    # secret anyway, and adversarial review of automated lock/evidence bumps
    # is pure token burn.
    if: >-
      (github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:ready'))
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'onexbot-occ-writer[bot]'
    name: Hostile Reviewer (adversarial gate)
    # self-hosted runner on .201 required -- qwen3-review(-b) are LAN-only  # onex-allow-internal-ip
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 35

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Clean stale dependency clones
        working-directory: ${{ github.workspace }}
        run: rm -rf ../omniintelligence ../omnibase_core_dep ../omnibase_compat

      - name: Clone omniintelligence
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omniintelligence
            if git clone --depth=1 --filter=blob:none --branch dev \
              https://github.com/OmniNode-ai/omniintelligence.git ../omniintelligence; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Clone omnibase_core (omniintelligence dependency)
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omnibase_core_dep
            if git clone --depth=1 --filter=blob:none --branch dev \
              https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core_dep; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Clone omnibase_compat
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omnibase_compat
            if git clone --depth=1 --filter=blob:none --branch dev \
              https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        working-directory: ${{ github.workspace }}
        run: uv python install 3.12

      - name: Preflight — probe review endpoint reachability
        id: preflight
        working-directory: ../omniintelligence
        env:
          # Resolve the SAME registry the reviewer loads (model_registry_loader)
          # for the SAME models the review step runs
          # (`--model qwen3-review --model qwen3-review-b --model glm-review`).
          # We flip reachable=false ONLY when EVERY requested model is
          # unreachable AND the codex api-fallback is unavailable — the exact
          # condition under which the reviewer itself yields verdict=degraded
          # + exit 0. glm-review (OMN-17492) is an HTTPS cloud endpoint —
          # probed as api.z.ai:443 (scheme-aware port default below).
          REVIEW_MODEL_KEYS: "qwen3-review qwen3-review-b glm-review"
          REGISTRY_PATH: "src/omniintelligence/review_pairing/model_registry.yaml"
          # Wired from a GitHub Actions secret (mirrors OMN-14176): the LLM HTTP
          # transport HMAC-signs every call with LOCAL_LLM_SHARED_SECRET and
          # fail-closes if it is absent.
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          LLM_ENDPOINT_CIDR_ALLOWLIST: "192.168.86.0/24"  # onex-allow-internal-ip OMN-8468 reason="LAN subnet allowlist for the review LLM endpoint host 192.168.86.201"
        run: |
          # -e is intentionally OMITTED: this probe must NEVER fail the job. Every
          # uncertain/ambiguous outcome FAILS OPEN to the full install + review.
          set -o pipefail

          PROBE_TARGETS="$(uv run --no-project --with pyyaml python - <<'PYEOF'
          import os
          import shutil
          import urllib.parse

          import yaml

          registry_path = os.environ["REGISTRY_PATH"]
          model_keys = os.environ["REVIEW_MODEL_KEYS"].split()
          with open(registry_path, encoding="utf-8") as fh:
              registry = yaml.safe_load(fh)


          def _codex_resolvable() -> bool:
              env_override = os.environ.get("CODEX_BINARY")
              if (
                  env_override
                  and os.path.isfile(env_override)
                  and os.access(env_override, os.X_OK)
              ):
                  return True
              if shutil.which("codex") is not None:
                  return True
              for directory in (
                  "/opt/homebrew/bin",
                  "/usr/local/bin",
                  os.path.expanduser("~/.local/bin"),
              ):
                  candidate = os.path.join(directory, "codex")
                  if os.path.isfile(candidate) and os.access(candidate, os.X_OK):
                      return True
              return False


          fallback_keys = list(registry.get("api_fallback_keys", []))
          if not fallback_keys:
              fallback_blocks = False
          elif any(k != "codex" for k in fallback_keys):
              fallback_blocks = True
          else:
              fallback_blocks = _codex_resolvable()

          print(f"FALLBACK|{'true' if fallback_blocks else 'false'}")

          for model_key in model_keys:
              cfg = registry["models"].get(model_key)
              if not cfg:
                  continue
              url = os.environ.get(cfg["env_var"], cfg["default_url"]).strip()
              parsed = urllib.parse.urlparse(url)
              host = parsed.hostname or ""
              # OMN-17492: scheme-aware port default — the cloud reviewer's
              # registry URL is https with no explicit port; the old
              # `or 80` default would TCP-probe api.z.ai:80 instead of 443.
              port = parsed.port or (443 if parsed.scheme == "https" else 80)
              if url and host:
                  print(f"TARGET|{host}|{port}|{url}")
          PYEOF
          )"

          FALLBACK_BLOCKS="$(printf '%s\n' "$PROBE_TARGETS" | sed -n 's/^FALLBACK|//p' | head -n1)"
          TARGETS="$(printf '%s\n' "$PROBE_TARGETS" | grep '^TARGET' || true)"

          if [ -z "$TARGETS" ]; then
            echo "Could not statically resolve any of [${REVIEW_MODEL_KEYS}]; proceeding with full review (fail-open)."
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UNREACHABLE=""
          while IFS='|' read -r _tag HOST PORT URL; do
            [ "$_tag" = "TARGET" ] || continue
            model_reachable="false"
            for attempt in 1 2 3; do
              if timeout 5 bash -c "exec 3<>/dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
                echo "TCP connect to ${HOST}:${PORT} (${URL}) succeeded (attempt ${attempt})."
                model_reachable="true"
                break
              fi
              echo "TCP connect to ${HOST}:${PORT} (${URL}) failed (attempt ${attempt}/3)."
              [ "$attempt" -lt 3 ] && sleep 2
            done
            if [ "$model_reachable" = "true" ]; then
              echo "At least one review endpoint is reachable; proceeding with full review."
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            UNREACHABLE="${UNREACHABLE}${HOST}:${PORT} "
          done < <(printf '%s\n' "$TARGETS")

          if [ "$FALLBACK_BLOCKS" = "true" ]; then
            echo "All review endpoints unreachable, but the codex api-fallback may be available; proceeding to the full review (reviewer decides)."
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::All review endpoints [${UNREACHABLE}] unreachable after 3 attempts and no codex api-fallback available; short-circuiting to DEGRADED and skipping the heavy install + review."
          {
            echo "reachable=false"
            echo "verdict=degraded"
            echo "blocking_count=0"
            echo "total_findings=0"
            echo "models_succeeded="
            echo "error=all review endpoints [${UNREACHABLE}] unreachable — preflight short-circuit (no models available)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install omniintelligence dependencies
        if: steps.preflight.outputs.reachable != 'false'
        id: install-omniintelligence
        continue-on-error: true
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: "cpu"
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Run adversarial review
        if: steps.preflight.outputs.reachable != 'false'
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          LLM_ENDPOINT_CIDR_ALLOWLIST: "192.168.86.0/24"  # onex-allow-internal-ip OMN-8468 reason="LAN subnet allowlist for the review LLM endpoint host 192.168.86.201; transport fail-closes if unset"
          # OMN-17492: glm-review — authenticated cloud reviewer on the z.ai
          # GLM Coding Plan. The Bearer key is a repo Actions secret (same
          # sanctioned pattern as LOCAL_LLM_SHARED_SECRET); the transport
          # additionally requires the HTTPS host to be declared here. On
          # fork PRs the secret is absent → glm-review fails closed
          # per-model and the local models still review.
          LLM_GLM_API_KEY: ${{ secrets.LLM_GLM_API_KEY }}
          LLM_CLOUD_ENDPOINT_HOST_ALLOWLIST: "api.z.ai"
          REVIEW_JSON_PATH: ${{ github.workspace }}/hostile-review-result.json
        working-directory: ../omniintelligence
        run: |
          set -euo pipefail

          # Three models (OMN-17492): qwen3-review + qwen3-review-b (both on
          # the one remaining .201 GPU — OMN-16481) + glm-review (z.ai GLM
          # Coding Plan; independent hardware AND quota domain). Running >=2
          # models keeps cli_review's exit-0 "at least 2 succeeded" path
          # reachable even when the whole local fleet is down.
          uv run python -m omniintelligence.review_pairing.cli_review \
            --pr "$PR_NUMBER" \
            --repo "$REPO" \
            --model qwen3-review \
            --model qwen3-review-b \
            --model glm-review \
            --output "$REVIEW_JSON_PATH" \
            2> >(tee hostile-reviewer-stderr.log >&2) || REVIEW_EXIT=$?

          # cli_review writes the JSON before computing its exit code, so a
          # degraded run (exit 2: one model) and even a total outage (exit 1)
          # still leave a parseable result when the file exists.
          if [ ! -s "$REVIEW_JSON_PATH" ]; then
            {
              echo "verdict=degraded"
              echo "error_count=0"
              echo "warning_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=cli_review produced no result JSON (exit ${REVIEW_EXIT:-0} — binary error before review)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # OMN-17492: read the REAL ModelMultiReviewResult fields. The
          # previous parser read merged_findings / total_input_findings —
          # fields that model never had — so blocking was always 0 and the
          # "blocked" exit-1 was dead code. Per the finder-never-gate
          # doctrine this step now ALWAYS exits 0 on a completed pipeline;
          # findings surface as review threads and the deterministic
          # "Hostile Review Thread Gate" owns blocking.
          VERDICT_DATA=$(python3 - "$REVIEW_JSON_PATH" <<'PYEOF'
          import json, sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)

          models_succeeded = list(data.get("models_succeeded", []))
          total_findings = int(data.get("total_findings", 0))

          severity_counts: dict[str, int] = {}
          for model_result in data.get("results", []):
              if not model_result.get("success"):
                  continue
              for finding in model_result.get("findings", []):
                  sev = str(finding.get("severity", "info"))
                  severity_counts[sev] = severity_counts.get(sev, 0) + 1

          verdict = "passed" if len(models_succeeded) >= 2 else "degraded"

          print(f"verdict={verdict}")
          print(f"error_count={severity_counts.get('error', 0)}")
          print(f"warning_count={severity_counts.get('warning', 0)}")
          print(f"total_findings={total_findings}")
          print(f"models_succeeded={','.join(models_succeeded)}")
          PYEOF
          )

          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          if [ "${REVIEW_EXIT:-0}" -ne 0 ]; then
            echo "error=cli_review exit ${REVIEW_EXIT} (fewer than 2 models succeeded — partial/total outage)" >> "$GITHUB_OUTPUT"
          else
            echo "error=" >> "$GITHUB_OUTPUT"
          fi

      # OMN-17492: publish findings as resolvable PR review threads. This is
      # the surface the deterministic thread gate reads. Same-repo PRs only —
      # fork PRs get a read-only GITHUB_TOKEN (OMN-16235), which the script
      # detects via HOSTILE_REVIEW_IS_FORK and skips cleanly. Uses the infra
      # checkout's own script (stdlib-only; no uv env needed).
      - name: Post findings as PR review threads
        if: >-
          steps.preflight.outputs.reachable != 'false' &&
          steps.review.outcome == 'success' &&
          github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_JSON_PATH: ${{ github.workspace }}/hostile-review-result.json
          HOSTILE_REVIEW_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/post_hostile_review_threads.py

      - name: Post review summary as PR comment
        if: always()
        uses: actions/github-script@v9
        env:
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict || steps.preflight.outputs.verdict }}
          REVIEW_ERRORS: ${{ steps.review.outputs.error_count || '0' }}
          REVIEW_WARNINGS: ${{ steps.review.outputs.warning_count || '0' }}
          REVIEW_TOTAL: ${{ steps.review.outputs.total_findings || steps.preflight.outputs.total_findings }}
          REVIEW_MODELS: ${{ steps.review.outputs.models_succeeded || steps.preflight.outputs.models_succeeded }}
          REVIEW_ERROR: ${{ steps.review.outputs.error || steps.preflight.outputs.error }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verdict = process.env.REVIEW_VERDICT || 'unknown';
            const errors = parseInt(process.env.REVIEW_ERRORS || '0');
            const warnings = parseInt(process.env.REVIEW_WARNINGS || '0');
            const total = parseInt(process.env.REVIEW_TOTAL || '0');
            const models = process.env.REVIEW_MODELS || '';
            const error = process.env.REVIEW_ERROR || '';

            const icon = {
              passed: '✅',
              degraded: '⚠️',
            }[verdict] || '❓';

            const label = {
              passed: 'REVIEWED',
              degraded: 'DEGRADED (informational)',
            }[verdict] || verdict.toUpperCase();

            let note = '';
            if (verdict === 'degraded') {
              note = '\n\n> **Note**: Fewer than 2 reviewer models succeeded. ' +
                'Degraded results are informational (OMN-8468/OMN-8524) and do not block merge.';
              if (error) note += ` Error: \`${error}\``;
            } else if (errors + warnings > 0) {
              note = '\n\n> **Action required**: findings were posted as review threads. ' +
                'Address or reject each one, then resolve its thread — the ' +
                '`Hostile Review Thread Gate` fails while hostile-reviewer threads are unresolved (OMN-17492).';
            }

            const body = [
              `## ${icon} Hostile Reviewer — ${label}`,
              '',
              `**Critical findings**: ${errors}  `,
              `**Major findings**: ${warnings}  `,
              `**Total findings**: ${total}  `,
              `**Models succeeded**: ${models || 'none'}`,
              note,
              '',
              '---',
              '',
              '**Semantics (OMN-17492 — the model finds, thread resolution gates)**',
              '',
              '| Surface | Meaning | Blocks merge? |',
              '|---------|---------|---------------|',
              '| Review threads | Per-finding, posted by the reviewer | No (informational) |',
              '| `Hostile Review Thread Gate` | Deterministic: unresolved hostile-reviewer threads exist | Fails until resolved (not yet a required context) |',
              '| `degraded` verdict | Fewer than 2 models succeeded (infra) | No |',
              '',
              '_Powered by [omniintelligence.review_pairing.cli_review](https://github.com/OmniNode-ai/omniintelligence) — multi-model adversarial review: qwen3-review, qwen3-review-b, glm-review (OMN-8468/OMN-8524/OMN-17492)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Hostile Reviewer')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [occ-preflight, hostile-review]
    if: always()
    steps:
      - name: Evaluate gate
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Hostile Review Gate ==="
          PREFLIGHT="${{ needs.occ-preflight.result }}"
          RESULT="${{ needs.hostile-review.result }}"
          echo "occ-preflight: $PREFLIGHT"
          echo "hostile-review: $RESULT"

          if [ "$PREFLIGHT" != "success" ]; then
            echo "::error::OCC preflight failed or did not complete (result: $PREFLIGHT)."
            exit 1
          fi
          if [ "$RESULT" = "failure" ]; then
            # OMN-17492: hostile-review no longer exits nonzero on findings
            # (finder-never-gate) — a failure here is a pipeline/infra error
            # (install, script, or posting failure), not a model opinion.
            echo "::error::hostile-review job failed (pipeline error — findings never fail it since OMN-17492)."
            exit 1
          fi
          echo "Hostile Review Gate PASSED"

  # OMN-17492: the DETERMINISTIC merge surface for hostile-review findings.
  # post_hostile_review_threads.py publishes findings as resolvable review
  # threads; this job fails while unresolved hostile-reviewer threads exist
  # and passes when they are resolved. It consults ONLY GitHub thread state —
  # never a model verdict. Runs even when the reviewer itself was skipped
  # (draft) or degraded: threads from earlier runs still deserve the gate.
  # NOT a required context in this pass (canary; promote-to-required is a
  # recorded follow-up on OMN-17492).
  hostile-review-thread-gate:
    name: Hostile Review Thread Gate
    # always() so a skipped (draft/bot) or failed reviewer job does not
    # needs-cascade this into a skip — existing unresolved threads outlive
    # any single run and still deserve the deterministic check.
    if: always() && github.event_name == 'pull_request'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [hostile-review]
    # always(): a skipped/degraded reviewer must not vacuously skip the
    # thread check (OMN-15315 lineage: the absence of a verdict is not a
    # passing one — and existing unresolved threads outlive any single run).
    timeout-minutes: 10
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check unresolved hostile-reviewer threads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/check_hostile_review_threads.py
