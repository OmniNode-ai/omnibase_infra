# runner-route-reusable.yml — per-run runner routing decision (OMN-18031)
#
# Called as a `uses:` job at the top of a consuming workflow. It probes live
# org-runner capacity plus the most recent lab-load record and emits a
# `runs-on` label set that the heavy jobs consume:
#
#   jobs:
#     route:
#       uses: ./.github/workflows/runner-route-reusable.yml
#       secrets: inherit
#     lint:
#       needs: route
#       runs-on: ${{ fromJSON(needs.route.outputs.labels) }}
#
# HARD REQUIREMENT: this job runs on GitHub-hosted compute, NEVER self-hosted.
# A router that queues behind the fleet it is routing away from cannot report on
# saturation -- the same isolation rationale runner-fleet-canary.yml carries.
# It is allowlisted in config/runner_routing_policy.yaml for exactly that reason.
#
# THE SEAM IS A CEILING, READ AND NEVER WRITTEN (CLAUDE.md rule 14). Routing can
# only ever DOWNGRADE from what OMNI_TRUSTED_CI_RUNS_ON_JSON already allows.
# With that variable at its current live value of '["ubuntu-latest"]' this job
# decides `seam_ceiling_hosted` on every run and placement is byte-identical to
# today -- the mechanism is deliberately inert until a separate single-owner
# claim flips the seam (OMN-16682).
#
# FAIL-CLOSED: any probe error, missing token, malformed payload or internal
# fault yields GitHub-hosted. The step cannot fail the calling run.
#
# WHERE THIS LIVES. During the omnibase_infra pilot the decision module and this
# workflow are co-located here, beside the policy file, the routing audit and
# the CI Summary umbrella that already live in this repo. At fan-out both MOVE
# to omniclaude alongside the other cross-repo reusable gates
# (deploy-gate-reusable.yml) and this copy is DELETED -- no re-export, no shim.
name: runner-route-reusable

on:
  workflow_call:
    inputs:
      workflow_path:
        description: "Path of the CALLING workflow, checked against the hosted allowlist."
        required: true
        type: string
      dry_run:
        description: "Compute and report the decision but gate nothing; always succeeds."
        required: false
        default: false
        type: boolean
      force:
        description: >-
          Operator override: auto (decide), fleet, or hosted. Subject to every
          safety rule rather than a bypass of them -- fleet still cannot widen
          past the seam ceiling and still cannot take a fork pull request, and
          hosted is still refused for a private repository. It exists so the
          kill switch a static seam value provided survives per-run routing.
        required: false
        default: auto
        type: string
    outputs:
      labels:
        description: "runs-on label set, as a JSON array for fromJSON()."
        value: ${{ jobs.route.outputs.labels }}
      runs_on:
        description: >-
          The same label set under the name a consumer reads it by:
          `runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}`.
        value: ${{ jobs.route.outputs.runs_on }}
      decision:
        description: "hosted | self_hosted"
        value: ${{ jobs.route.outputs.decision }}
      reason:
        description: "Why. e.g. seam_ceiling_hosted, capacity_available, fleet_saturated."
        value: ${{ jobs.route.outputs.reason }}
    secrets:
      RUNNER_FLEET_STATUS_TOKEN:
        required: false
      CROSS_REPO_PAT:
        required: false

permissions:
  contents: read

jobs:
  route:
    name: route
    # MUST NOT share fate with the fleet it routes onto. Allowlisted in
    # config/runner_routing_policy.yaml (OMN-18031). Do not change runs-on.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.decide.outputs.labels }}
      runs_on: ${{ steps.decide.outputs.runs_on }}
      decision: ${{ steps.decide.outputs.decision }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout (routing node + policy)
        uses: actions/checkout@v4
        with:
          # No git operations after checkout — do not leave the Actions token
          # in local git config (zizmor artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TWO PINNED PACKAGES, NOT THE PROJECT ENVIRONMENT. The decision needs
      # the typed models and a YAML parser and nothing else -- it performs no
      # database, broker or container work -- so this installs exactly that in
      # seconds rather than syncing the repository's full dependency set on the
      # critical path of every consuming run. The node's handler is imported
      # from the checked-out tree, so the decision executing here is the same
      # code the tests bind to.
      - name: Install the decision's dependencies
        run: pip install "pydantic==2.13.4" "PyYAML==6.0.2"

      - name: Download the most recent lab-load record
        id: lab
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Best-effort: the record is published by the saturation monitor's
          # self-hosted lab-load probe. Its ABSENCE is not an error here -- the
          # decision module treats a missing or stale record as `lab_unknown`
          # and routes hosted, which is the fail-closed answer.
          run_id="$(gh run list --workflow dev-lane-liveness.yml \
            --repo "${GITHUB_REPOSITORY}" --status completed --limit 1 \
            --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "${run_id:-}" ]; then
            gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
              --name lab-load --dir ./.route-lab || true
          fi
          if [ -f ./.route-lab/lab-load.json ]; then
            echo "path=./.route-lab/lab-load.json" >> "${GITHUB_OUTPUT}"
          else
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Decide runs-on
        id: decide
        env:
          # Preferred: dedicated secret with org self-hosted-runner read scope.
          # Fallback: CROSS_REPO_PAT. Absent BOTH is not a crash -- the probe
          # returns `missing_token` and the decision is hosted.
          RUNNER_FLEET_STATUS_TOKEN: ${{ secrets.RUNNER_FLEET_STATUS_TOKEN }}
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
          # OMN-18412: the module reads this repository's visibility itself, so
          # a private repository is never downgraded onto a hosted runner by a
          # capacity signal. The JOB TOKEN is sufficient -- repository metadata
          # is readable under the `metadata: read` every Actions token carries --
          # so this adds no new credential and no new scope. Visibility is read
          # live rather than declared anywhere, because a declared list of
          # private repositories goes stale silently.
          GITHUB_TOKEN: ${{ github.token }}
          RUNNER_ROUTE_ARTIFACT: runner-route-decision.json
          # EVERY VALUE THE COMMAND READS ARRIVES HERE, NOT INLINE IN THE BODY.
          # Actions substitutes an expression into the run script as RAW TEXT
          # before the shell parses it, so `["self-hosted","omnibase-ci"]`
          # interpolated inside double quotes renders as
          # `--seam-json "["self-hosted","omnibase-ci"]"`; the shell strips the
          # inner quotes and the module receives `[self-hosted,omnibase-ci]`,
          # which is not JSON. Measured on run 34131479134, the merged pilot's
          # own first live decision: `reason: probe_error:seam_unparseable`.
          # Env values are passed as data and never re-parsed by the shell,
          # which also closes the Actions template-injection class on
          # head.repo.full_name in the same stroke.
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: ${{ inputs.workflow_path }}
          # The seam the CALLER's event would have resolved under
          # OMNI_RUNNER_SELECTOR_V1, including the merge_group carve-out, so the
          # ceiling this reads is the same one the V1 expression would apply.
          SEAM_JSON: >-
            ${{ (github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON)
                || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON }}
          PUBLIC_JSON: ${{ vars.OMNI_PUBLIC_PR_RUNS_ON_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          LAB_RECORD: ${{ steps.lab.outputs.path }}
        run: |
          set -uo pipefail
          rc=0
          args=(
            --event-name "${EVENT_NAME}"
            --head-repo "${HEAD_REPO}"
            --repository "${REPOSITORY}"
            --workflow-path "${WORKFLOW_PATH}"
            --seam-json "${SEAM_JSON}"
            --public-json "${PUBLIC_JSON}"
            --policy config/runner_routing_policy.yaml
            --force "${FORCE}"
          )
          [ "${DRY_RUN}" = "true" ] && args+=(--dry-run)
          [ -n "${LAB_RECORD}" ] && args+=(--lab-record "${LAB_RECORD}")
          # THE DECISION IS THE NODE'S. This script is the I/O boundary: it
          # probes, assembles the node's typed request, and invokes
          # `node_ci_runner_route_compute`'s handler, whose contract declares
          # the thresholds, the label sets and the private-repository refusal.
          #
          # WHY NOT `onex node <name>`, the sanctioned local node CLI. Measured
          # 2026-09-15: that path refuses to dispatch unless the workspace venv
          # carries every sibling package installed from git, which on a hosted
          # runner means minutes of install on the critical path of every run
          # for a decision that takes milliseconds. The same handler executes
          # either way; only the dispatch machinery differs.
          python3 scripts/ci/runner_route_decision.py "${args[@]}" || rc=$?
          # FAIL-CLOSED FLOOR. The module already catches everything internally,
          # but if the interpreter itself could not run, the calling workflow
          # must still receive a usable runs-on rather than an empty string that
          # would make every consuming job fail to schedule.
          if [ ! -s "${GITHUB_OUTPUT}" ] || ! grep -q '^labels=' "${GITHUB_OUTPUT}"; then
            echo 'labels=["ubuntu-latest"]' >> "${GITHUB_OUTPUT}"
            echo 'runs_on=["ubuntu-latest"]' >> "${GITHUB_OUTPUT}"
            echo 'decision=hosted' >> "${GITHUB_OUTPUT}"
            echo 'reason=probe_error:module_unavailable' >> "${GITHUB_OUTPUT}"
          fi
          # OMN-18412 REFUSAL. Exit 3 means the module decided this placement is
          # forbidden -- a PRIVATE repository whose only allowed placement is a
          # GitHub-hosted runner. It is NOT a crash, and the floor above must not
          # convert it into one: the module has already written a `labels=` line
          # and its decision record, so the floor is a no-op on this path by
          # construction. Failing here is the point. A refused run stops, loudly,
          # with the reason in the record, rather than scheduling jobs onto a
          # runner class the 2026-09-14 operator ruling forbids -- where they
          # would sit queued against capacity the repository may not use.
          if [ "${rc}" = "3" ]; then
            echo "::error title=Runner route refused::the decision record names the reason; this run is not placed"
            exit 1
          fi

      - name: Upload the decision record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-route-decision-${{ github.run_id }}-${{ github.job }}
          path: runner-route-decision.json
          if-no-files-found: ignore
          retention-days: 7
