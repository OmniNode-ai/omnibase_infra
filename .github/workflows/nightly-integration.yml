# OMN-8731: Nightly integration test suite against dockerized e2e stack
#
# Runs the full integration test suite nightly against docker-compose.e2e.yml.
# Must NOT target the live .201 instance — all services are containerized.
#
# Constraint check: workflow asserts INTEGRATION_POSTGRES_HOST != 192.168.86.201.

name: Nightly Integration Tests

on:
  schedule:
    # Off-peak, not :00/:30 per cron convention
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      success_threshold:
        description: 'Minimum consecutive green runs to declare stable (overrides env default)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.6.14"
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "0.4.0"
  # Contract-declared success threshold — number of consecutive green runs for stability
  SUCCESS_THRESHOLD: "3"
  # All host vars pinned to localhost — the .201 guard below rejects any value
  # that resolves to the live instance.
  INTEGRATION_POSTGRES_HOST: "localhost"
  OMNI_INFRA_HOST: "localhost"
  POSTGRES_HOST: "localhost"
  REDPANDA_ADVERTISE_HOST: "localhost"
  INTEGRATION_POSTGRES_USER: "postgres"
  # NB: "test-password" is the default in docker/docker-compose.e2e.yml
  # (POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test-password}) — this is NOT a
  # production credential. The secret-scanner false-positive here is
  # acknowledged (see checkov CKV_SECRET_4 + gitleaks allowlist). Override via
  # repo secret only if a different password is desired for the e2e stack.
  # checkov:skip=CKV_SECRET_4:Test-only ephemeral docker-compose.e2e.yml password
  INTEGRATION_POSTGRES_PASSWORD: ${{ secrets.INTEGRATION_POSTGRES_PASSWORD || 'test-password' }}
  INTEGRATION_POSTGRES_DB: "omnibase_infra"
  # OMN-15565: INTEGRATION_POSTGRES_PORT / KAFKA_BOOTSTRAP_SERVERS /
  # OMNIBASE_INFRA_DB_URL are deliberately NOT pinned here. The e2e stack's
  # former defaults (5433 / 19092) collide with live .201 lane bindings on this
  # shared self-hosted runner host, so the ports are allocated free at run time
  # by the "Derive isolated e2e namespace" step below and exported via
  # $GITHUB_ENV. Re-pinning them here would be shadowed by that step and would
  # only mislead a reader into thinking the ports are fixed.
  ONEX_EVENT_BUS_TYPE: "kafka"
  ONEX_ENVIRONMENT: "test"
  LLM_ENDPOINT_CIDR_ALLOWLIST: "10.0.0.0/8"

jobs:
  guard-live-host:
    timeout-minutes: 30
    name: Assert not targeting live .201
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Reject if ANY host variable targets .201
        # Broadened guard (per CR review): check all host vars the runtime
        # might pick up, not just INTEGRATION_POSTGRES_HOST. If any evaluates
        # to 192.168.86.201 the e2e workflow fails closed.
        run: |
          fail=0
          for HOST_VAR in INTEGRATION_POSTGRES_HOST OMNI_INFRA_HOST POSTGRES_HOST REDPANDA_ADVERTISE_HOST; do
            HOST="${!HOST_VAR:-}"
            if [[ "$HOST" == "192.168.86.201" ]]; then
              echo "::error::${HOST_VAR}=$HOST targets the live .201 instance. This workflow must use the containerized e2e stack only."
              fail=1
            else
              echo "${HOST_VAR}=${HOST:-<unset>} (ok)"
            fi
          done
          [[ $fail -eq 0 ]] || exit 1
          echo "Host checks passed: no host variable points to live .201"

  integration-tests:
    name: Integration Test Suite (e2e stack)
    needs: guard-live-host
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Load cached uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}-${{ env.CACHE_VERSION }}

      - name: Install dependencies
        run: uv sync --reinstall-package omnibase-core --reinstall-package omnibase-spi

      # OMN-15565: this workflow runs on a self-hosted runner that shares the
      # .201 Docker daemon with the live lab/dev lane. Before this step existed,
      # the compose invocations below carried no project name, so they resolved
      # to docker-compose.e2e.yml's default project -- which WAS the lab lane's
      # own project `omnibase-infra`. The teardown's `down -v --remove-orphans`
      # then deleted the lane's containers and its data volumes, nightly.
      #
      # Everything the Docker daemon namespaces globally (project, container
      # names, volume names, network name) is derived from a run-scoped id here,
      # mirroring .github/workflows/reusable-runtime-boot.yml. Host ports are
      # allocated free because the e2e defaults (19092/18082/...) are bound by
      # the live lane.
      - name: Derive isolated e2e namespace
        env:
          DB_URL_SECRET: ${{ secrets.OMNIBASE_INFRA_DB_URL }}
        run: |
          set -euo pipefail
          e2e_id="e2e-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          e2e_id="$(echo "$e2e_id" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_-' '-')"
          project="omnibase-infra-${e2e_id}"

          pick_free_port() {
            python3 - <<'PY'
          import socket

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          }

          postgres_port="$(pick_free_port)"
          kafka_port="$(pick_free_port)"

          db_url="${DB_URL_SECRET:-}"
          if [[ -z "$db_url" ]]; then
            db_url="postgresql://postgres:${INTEGRATION_POSTGRES_PASSWORD}@localhost:${postgres_port}/omnibase_infra"
          fi

          {
            echo "OMNIBASE_INFRA_COMPOSE_PROJECT=${project}"
            echo "OMNIBASE_INFRA_POSTGRES_CONTAINER=${project}-postgres"
            echo "OMNIBASE_INFRA_REDPANDA_CONTAINER=${project}-redpanda"
            echo "OMNIBASE_INFRA_TOPIC_MANAGER_CONTAINER=${project}-topic-manager"
            echo "OMNIBASE_INFRA_VALKEY_CONTAINER=${project}-valkey"
            echo "OMNIBASE_INFRA_INFISICAL_CONTAINER=${project}-infisical"
            echo "OMNIBASE_INFRA_RUNTIME_CONTAINER=${project}-runtime"
            echo "OMNIBASE_INFRA_NETWORK=${project}-network"
            echo "OMNIBASE_INFRA_POSTGRES_VOLUME=${project}-postgres-data"
            echo "OMNIBASE_INFRA_REDPANDA_VOLUME=${project}-redpanda-data"
            echo "OMNIBASE_INFRA_VALKEY_VOLUME=${project}-valkey-data"
            echo "OMNIBASE_INFRA_RUNTIME_LOG_VOLUME=${project}-runtime-logs"
            echo "POSTGRES_PORT=${postgres_port}"
            echo "KAFKA_PORT=${kafka_port}"
            echo "REDPANDA_ADMIN_PORT=$(pick_free_port)"
            echo "REDPANDA_SCHEMA_REGISTRY_PORT=$(pick_free_port)"
            echo "REDPANDA_PANDAPROXY_PORT=$(pick_free_port)"
            echo "VALKEY_PORT=$(pick_free_port)"
            echo "INTEGRATION_POSTGRES_PORT=${postgres_port}"
            echo "KAFKA_BOOTSTRAP_SERVERS=localhost:${kafka_port}"
            echo "OMNIBASE_INFRA_DB_URL=${db_url}"
          } >> "$GITHUB_ENV"

          echo "e2e compose project: ${project}"
          echo "e2e postgres port: ${postgres_port}, kafka port: ${kafka_port}"

      # Fail closed at run time, not just at review time: the protected set is
      # read from the lane census manifest, so a lane added later is covered
      # without editing this workflow.
      - name: Assert e2e project is not a live lane
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          import sys

          import yaml

          project = os.environ["OMNIBASE_INFRA_COMPOSE_PROJECT"]
          manifest = yaml.safe_load(open("deploy/lane-census/lane-manifest.yaml", encoding="utf-8"))
          protected = {
              lane["compose_project"]
              for lane in manifest["lanes"].values()
              if lane.get("compose_project")
          }
          if project in protected:
              sys.exit(
                  f"::error::refusing to run the e2e stack in live lane project "
                  f"{project!r} (censused lanes: {sorted(protected)})"
              )
          print(f"e2e project {project!r} is not a censused lane (checked {sorted(protected)})")
          PY

      - name: Spin up e2e stack
        run: |
          docker compose -p "${OMNIBASE_INFRA_COMPOSE_PROJECT}" \
            -f docker/docker-compose.e2e.yml up -d \
            postgres redpanda valkey redpanda-topic-manager

      - name: Wait for health checks
        run: |
          echo "Waiting for postgres..."
          timeout 120 bash -c 'until docker exec "$OMNIBASE_INFRA_POSTGRES_CONTAINER" pg_isready -U postgres -d omnibase_infra; do sleep 2; done'

          echo "Waiting for redpanda..."
          timeout 120 bash -c 'until docker exec "$OMNIBASE_INFRA_REDPANDA_CONTAINER" rpk cluster health 2>/dev/null | grep -q "Healthy:.*true"; do sleep 2; done'

          echo "Waiting for valkey..."
          timeout 60 bash -c 'until docker exec "$OMNIBASE_INFRA_VALKEY_CONTAINER" valkey-cli ping | grep -q PONG; do sleep 2; done'

          echo "Waiting for topic manager to complete..."
          timeout 60 bash -c 'until [ "$(docker inspect -f "{{.State.Status}}" "$OMNIBASE_INFRA_TOPIC_MANAGER_CONTAINER" 2>/dev/null)" = "exited" ]; do sleep 2; done'

          echo "All services healthy"

      - name: Run integration tests
        run: |
          THRESHOLD="${{ github.event.inputs.success_threshold || env.SUCCESS_THRESHOLD }}"
          echo "Success threshold: $THRESHOLD consecutive green runs"
          uv run pytest tests/integration/ \
            -m integration \
            -v \
            --tb=short \
            --junitxml=nightly-integration-junit.xml \
            --timeout=300 \
            --timeout-method=thread

      # OMN-15565: the explicit -p is load-bearing. `-v --remove-orphans` against
      # the default project is exactly what deleted the lab lane's containers and
      # data volumes every night; scoped to the run-scoped project it can only
      # delete this run's own resources. Because this step uses `if: always()`, it
      # independently re-derives this run's immutable project and rejects empty,
      # unexpected, or censused live-lane targets before the destructive down.
      - name: Tear down e2e stack
        if: always()
        run: |
          set -euo pipefail
          project="${OMNIBASE_INFRA_COMPOSE_PROJECT:-}"
          e2e_id="e2e-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          e2e_id="$(echo "$e2e_id" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_-' '-')"
          expected_project="omnibase-infra-${e2e_id}"
          if [[ -z "$project" ]]; then
            echo "::error::OMNIBASE_INFRA_COMPOSE_PROJECT is unset - refusing to run a project-less teardown"
            exit 1
          fi
          if [[ "$project" != "$expected_project" ]]; then
            echo "::error::refusing to tear down unexpected compose project '$project' (expected '$expected_project' for this run)"
            exit 1
          fi
          uv run python - "$project" <<'PY'
          import sys

          import yaml

          project = sys.argv[1]
          manifest = yaml.safe_load(open("deploy/lane-census/lane-manifest.yaml", encoding="utf-8"))
          protected = {
              lane["compose_project"]
              for lane in manifest["lanes"].values()
              if lane.get("compose_project")
          }
          if project in protected:
              sys.exit(
                  f"::error::refusing to tear down live lane project {project!r} "
                  f"(censused lanes: {sorted(protected)})"
              )
          PY
          docker compose -p "$project" -f docker/docker-compose.e2e.yml down -v --remove-orphans

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-integration-results-${{ github.run_id }}
          path: nightly-integration-junit.xml
          retention-days: 30

  notify-on-failure:
    timeout-minutes: 30
    name: Failure Alert
    needs: [guard-live-host, integration-tests]
    if: failure()
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci.
    runs-on: >-
      ${{
        fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}

    steps:
      - name: Post Slack alert
        if: ${{ env.SLACK_BOT_TOKEN != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "#ci-alerts",
              "text": ":red_circle: *Nightly Integration Tests failed* on `omnibase_infra`\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }' || echo "Slack notify failed (non-fatal)"

      - name: Post GitHub summary on failure
        run: |
          echo "## Nightly Integration Test Failure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Jobs failed:**" >> $GITHUB_STEP_SUMMARY
          echo "- guard-live-host: ${{ needs.guard-live-host.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- integration-tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review test artifacts and stack logs. Re-run with workflow_dispatch to confirm fix." >> $GITHUB_STEP_SUMMARY
