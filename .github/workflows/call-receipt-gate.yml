#
# Caller workflow that invokes the omnibase_core-hosted receipt-gate on every
# PR targeting main in omnibase_infra.
#
# Receipt-gate enforces "Enforcement by Receipt": every PR must cite a Linear
# ticket whose dod_evidence items all have PASS ModelDodReceipt artifacts at
# the canonical path under onex_change_control/drift/dod_receipts/. Missing
# or failing receipts block merge.
#
# The reusable workflow is hosted centrally in omnibase_core (one source of
# truth). Each downstream repo wires
# its own caller that references the central workflow by remote path.
#
# Required-status-check name (for branch-protection): `Receipt Gate / verify`.

name: Receipt Gate

on:
  pull_request:
    # OMN-19512: ready_for_review re-runs the gate on the draft flip, so a
    # draft-era red (companion declined while the PR is a draft) is refreshed.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, dev]
  merge_group:

concurrency:
  # OMN-13949: cancel superseded PR runs to free saturated runners. merge_group
  # entries carry a unique github.ref, so queue entries never cross-cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@9cc9f035465266442df542d345cde621c9c3b0d5 # OMN-19149: immutable SHA pin, advanced from aeaf3b16 (OMN-18882). Provenance: the squash commit of omnibase_core#1740 on that repo's dev branch, the same pin omnimarket carries since omnimarket#2769. This line selects which copy of receipt-gate.yml runs, and that file carries a SECOND hardcoded ref that supplies the validator SOURCE: at aeaf3b16 it still read 37bd8519 (2026-08-24), where the supersede-suffix pattern excludes a dot, so an attempt-scoped record (<check>.supersede.<pr>.<n>.yaml) is invisible to the resolver rather than outranked. At 9cc9f035 that inner ref is a03b1072, which carries the OMN-19050 supersede-latch fix. Blast radius, measured: receipt-gate.yml differs between aeaf3b16 and 9cc9f035 only in that inner validator ref and its comment, and 9cc9f035 descends from both aeaf3b16 and 76532c20, so the OMN-18882 pin-only exemption is retained. NO PUBLISHED RELEASE CONTAINS THIS: re-point at the first release that carries omnibase_core#1740. A 40-hex pin remains the intended long-term form here, not a placeholder for a branch ref: it is immutable, so the gate this repo runs cannot change under it without a reviewed edit to this line
    with:
      branch-policy-mode: >-
        ${{
          github.event.pull_request.base.ref == 'main'
          && 'main-release'
          || github.event.merge_group.base_ref == 'refs/heads/main'
          && 'main-release'
          || github.event.pull_request.base.ref == 'dev'
          && 'dev-preflight'
          || github.event.merge_group.base_ref == 'refs/heads/dev'
          && 'dev-preflight'
          || 'legacy'
        }}
