# Nightly test suite for slow and chaos tests
# These tests are too slow for regular CI but essential for resilience validation
#
# Runs:
# - Daily at 2:00 AM UTC
# - On manual workflow dispatch
#
# Test categories included:
# - @pytest.mark.slow: Performance tests (>1s runtime)
# - @pytest.mark.chaos: Chaos engineering tests (fault injection, resilience)
# - @pytest.mark.replay: Event replay and recovery tests
# - @pytest.mark.performance: microbenchmarks (OMN-18162; see below)
#
# OMN-18162 — why the performance job exists and is separate.
#
#   ci.yml runs `-m "not slow and not chaos and not kafka and not performance
#   and not live_github_api"`. The `slow` and `chaos` halves of that exclusion
#   have always landed here. The `performance` half never did: 25 tests under
#   tests/unit carry that marker, no workflow selected it positively, and the
#   only surface that ever ran them was the pre-push test leg -- which
#   OMN-18162 retired. Retiring it without this job would have removed their
#   last execution path with nobody noticing.
#
#   It is a separate job rather than a widened filter on the one above for two
#   reasons. These assert wall-clock thresholds, so they run serially and on
#   the lab fleet, where a nearly idle 88-runner pool gives steadier timings
#   than a hosted runner; the slow/chaos job keeps its own placement and its
#   `-n 2` parallelism unchanged. And a red benchmark stays attributable to the
#   benchmark rather than merging into the slow/chaos result.
#
#   Both jobs feed the same summary and the same failure notification, so
#   there is one alert path, not two.
#
# Related: OMN-955 (Chaos and replay testing), OMN-18162 (performance job)

name: Nightly Tests

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test marker filter (e.g., "slow", "chaos", "slow or chaos")'
        required: false
        default: 'slow or chaos'

env:
  UV_VERSION: "0.6.14"
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "0.4.0"
  # Force inmemory event bus for CI tests (no Kafka infrastructure available)
  # This overrides the default "kafka" in contracts/runtime/runtime_config.yaml
  ONEX_EVENT_BUS_TYPE: "inmemory"
  # Explicit database name for integration tests (see test.yml for details).
  POSTGRES_DATABASE: "omnibase_infra"

jobs:
  slow-tests:
    name: Slow & Chaos Tests
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 60  # Extended timeout for slow tests

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Load cached uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}-${{ env.CACHE_VERSION }}

      - name: Install dependencies
        run: uv sync --reinstall-package omnibase-core --reinstall-package omnibase-spi

      # Run slow and chaos tests with extended timeout
      # These tests validate resilience and performance characteristics
      - name: Run slow and chaos tests
        run: |
          FILTER="${{ github.event.inputs.test_filter || 'slow or chaos' }}"
          uv run pytest tests/ \
            --ignore=tests/integration/docker \
            -m "$FILTER" \
            -n 2 \
            --timeout=600 \
            --timeout-method=signal \
            --tb=short \
            --junitxml=nightly-junit.xml \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results
          path: nightly-junit.xml
          retention-days: 14

  # OMN-18162: the execution path for the `performance` marker, which ci.yml
  # deselects and which no other workflow selected. See the header.
  performance-tests:
    name: Performance Microbenchmarks
    # Pinned to the lab fleet rather than read from the routing seam. These
    # assert wall-clock thresholds and the seam currently resolves to a hosted
    # runner; the fleet was measured at 88 online with 2 busy, which is the
    # steadier of the two. This is a deliberate placement for timing
    # sensitivity, not a general routing change -- the job above is untouched.
    runs-on: [self-hosted, omnibase-ci]
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Load cached uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}-${{ env.CACHE_VERSION }}

      - name: Install dependencies
        run: uv sync --reinstall-package omnibase-core --reinstall-package omnibase-spi

      - name: Run performance microbenchmarks
        run: |
          # Serial by design. These measure wall-clock time, so running them
          # under xdist alongside each other measures contention instead.
          uv run pytest tests/ \
            --ignore=tests/integration/docker \
            -m "performance" \
            -n 0 \
            -p no:randomly \
            --timeout=600 \
            --timeout-method=signal \
            --tb=short \
            --junitxml=performance-junit.xml \
            -v

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-performance-results
          path: performance-junit.xml
          retention-days: 14

  # Summary job to report overall status
  nightly-summary:
    timeout-minutes: 30
    name: Nightly Summary
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [slow-tests, performance-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          slow="${{ needs.slow-tests.result }}"
          perf="${{ needs.performance-tests.result }}"

          echo "Slow & Chaos Tests:         $slow"
          echo "Performance Microbenchmarks: $perf"

          # Both must succeed. A skipped or cancelled job is not a pass: it is
          # indistinguishable from a job that never ran, and telling those
          # apart is the whole reason OMN-18162 added the second job.
          if [[ "$slow" == "success" && "$perf" == "success" ]]; then
            echo "All nightly tests passed successfully"
            exit 0
          else
            echo "Nightly tests failed"
            exit 1
          fi

      - name: Post failure notification
        if: failure()
        run: |
          echo "::warning::Nightly tests failed! Review test results for details."
          echo "Run manually with: gh workflow run nightly-tests.yml"
