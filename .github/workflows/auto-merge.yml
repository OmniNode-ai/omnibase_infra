#
# OMN-6571: Automatically enable auto-merge (squash) on every PR opened
# by jonahgabriel. Ensures PRs do not sit idle in the merge queue waiting
# for manual enrollment.
#
# OMN-7786: Re-trigger on review and check_suite events so the workflow
# re-attempts auto-merge after review finishes and branch
# protection gates clear. Silent continue-on-error removed; "already
# enqueued" races are tolerated but real failures surface.
#
# Stacked PRs target feature branches that do not have protected-branch
# auto-merge rules. Treat those as an expected no-op instead of failing
# the required auto-merge enrollment check.
#
# OMN-13214: Arming auto-merge is NOT the same as enqueuing. During the
# 2026-06-17 dev merge wave, CLEAN + all-required-green + armed PRs sat
# OUTSIDE the merge queue for hours and each needed a manual
# enqueuePullRequest to land. The previous "--auto --squash" arming is also
# REJECTED on the queue-controlled dev branch ("The merge strategy for dev is
# set by the merge queue") so the PR never even armed. This workflow now
# (a) arms bare --auto, (b) runs gh pr update-branch first on strict-update
# repos when the PR is BEHIND, (c) explicitly calls enqueuePullRequest, and
# (d) VERIFIES the PR actually entered the queue — failing loudly if a
# green+armed PR is not enqueued, so the gap surfaces instead of stalling
# silently. The classify/verify decision logic is unit-tested in
# scripts/ci/merge_queue_enqueue.py.
#
# OMN-14777 (F-24): DROP `reopened` and `ready_for_review` from the
# pull_request trigger, mirroring OMN-14763 (seed fix landed in
# omninode_infra). Marking a draft ready-for-review used to force-arm
# auto-merge, forcing manual draft-holds on evidence-stamped PRs during the
# 2026-07-16 sweep. This aligns with OMN-14151 (default = do NOT auto-arm on
# open/ready). An actually-ready green PR is still armed by the
# pull_request_review / check_suite re-attempt paths below and by
# workflow_dispatch -- just not by the draft->ready transition itself. This
# workflow is NOT a required status check on dev, so narrowing it cannot
# wedge branch protection (verified live via required_status_checks readback
# before landing).
#
# OMN-17875 (2026-09-04): THE ARMING TOKEN MUST BE `secrets.CROSS_REPO_PAT`,
# NOT `secrets.GITHUB_TOKEN`. GitHub's auto-merge system performs the eventual
# squash merge as whatever identity ARMED it; when that identity is the default
# `GITHUB_TOKEN`, GitHub's documented Actions-recursion prevention fires no
# `push` event for the resulting commit on `dev`. Every push-triggered dev
# workflow was therefore silently starved on every PR that landed through this
# job.
#
#   Measured 2026-09-04T10:55-11:05Z on this repo. Bot-merged dev commits got
#   ZERO push-event runs; human-merged ones got 4-7:
#     9d273373f (#3171, github-actions[bot]) -> 0 push runs
#     f0ac90d9f (#3172, bot)                 -> 0
#     fd99e7228 (#3174, bot)                 -> 0
#     cc8fbe412 (#3170, bot)                 -> 0
#     9ac332d44 (#3168, bot)                 -> 0
#     8b8fd8966 (#3167, bot)                 -> 0
#     92c397643 (#3173, jonahgabriel)        -> 4
#   Query:
#     gh api "repos/OmniNode-ai/omnibase_infra/actions/runs?head_sha=<sha>&event=push" --jq .total_count
#   Blast radius over the sampled window: 101 bot-armed dev merges, 97 with
#   zero push runs. Since 2026-09-01 alone, 31 of 59 dev merges were bot merges.
#
# WHAT WAS SKIPPED (push-on-dev workflows in this repo):
#   deliver-dev-candidate-to-staging.yml (the staging-candidate image build and
#   delivery — the highest-severity loss: every bot-merged dev PR produced no
#   new staging candidate), prod-promotion-lineage.yml,
#   lane-census-staleness.yml, compose-config-lint.yml,
#   no-bare-compose-teardown.yml, runner-disk-preflight.yml,
#   shellcheck-gate.yml.
#
# ALREADY DETECTED, NEVER ROOT-CAUSED: the OMN-16906 dev-candidate-delivery
# liveness guard run 33859940620 reported NOT_FIRED for 9d273373f at
# 2026-09-04T09:45Z. The monitor was correct; this workflow was the cause.
#
# WHY A PAT AND NOT A GITHUB APP TOKEN (OMN-16373): the org-wide CROSS_REPO_PAT
# retirement moved other call sites to a short-lived `onexbot-occ-writer` App
# installation token. That substitution does NOT work here. A controlled probe
# on 2026-08-22 (branch test/omn16373-suppression-probe-1, since deleted)
# isolated the identities against a push-triggered marker workflow:
#   - CONTROL (ambient `jonahgabriel` auth): commit fd534b2a -> marker workflow
#     FIRED (run 32562988366, event=push, conclusion=success).
#   - APP TOKEN (onexbot-occ-writer[bot]): commit 38ffe1f4 on the same branch
#     -> marker workflow did NOT fire; zero event=push runs at that head_sha.
# App-token-authored pushes suppress push-triggered runs on this org exactly
# like GITHUB_TOKEN-authored ones, so migrating this site to the App token
# would reintroduce this defect on a different credential. omninode_infra's
# own auto-merge.yml is the precedent: it kept CROSS_REPO_PAT for this exact
# reason (OMN-15769, then re-affirmed by OMN-16373) and its dev merges have
# never suffered this suppression.
#
# NO NEW CREDENTIAL IS MINTED. `CROSS_REPO_PAT` is an existing org secret with
# `visibility: all` (readback 2026-09-04T11:26Z:
# `gh api orgs/OmniNode-ai/actions/secrets/CROSS_REPO_PAT` ->
# {"name":"CROSS_REPO_PAT","visibility":"all"}), and this repo already consumes
# it in branch-protection-audit.yml, merge-queue-bypass-audit.yml,
# runner-fleet-canary.yml and runner-broker-dispatch-wedge-rerun.yml.
#
# SCOPE OF THE SWAP: only the two steps that MUTATE merge state carry the PAT
# (`Enable auto-merge`, which arms the squash merge, and `Enqueue armed PR and
# verify`, which both pushes a branch update and hands the merge to a queue via
# enqueuePullRequest). The read-only `Resolve PR and author` step stays on
# `GITHUB_TOKEN` — it only runs `gh pr view` / `gh repo view` and creates no
# commit, so the suppression mechanism cannot apply to it. Enforced by
# tests/ci/test_auto_merge_arming_token_omn17875.py.
name: Auto-Merge

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to enable auto-merge on"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # OMN-15730 / CodeRabbit: check_suite runs do not populate
  # github.event.pull_request, so the || github.ref fallback resolves to the
  # default branch ref for EVERY check_suite-triggered run regardless of
  # which PR's checks completed -- unrelated PRs' auto-merge attempts landed
  # in one shared group and cancelled each other. Use the check_suite PR
  # list explicitly before falling back to the run id.
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      github.event.inputs.pr_number ||
      (github.event.check_suite.pull_requests[0].number) ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  auto-merge:
    timeout-minutes: 30
    name: Enable Auto-Merge
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Resolve PR and author
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PAYLOAD: ${{ github.event.pull_request.number }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
          PR_AUTHOR_FROM_PAYLOAD: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              PR="$PR_FROM_PAYLOAD"
              ACTOR="$PR_AUTHOR_FROM_PAYLOAD"
              ;;
            workflow_dispatch)
              PR="$PR_FROM_DISPATCH"
              ACTOR="$(gh pr view "$PR" --json author --jq '.author.login')"
              ;;
            check_suite)
              PR="$(echo "$CHECK_SUITE_PRS" | jq -r 'if type == "array" and length > 0 then .[0].number else empty end')"
              if [ -z "$PR" ]; then
                echo "check_suite had no associated PRs; nothing to do"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ACTOR="$(gh pr view "$PR" --json author --jq '.author.login')"
              ;;
            *)
              echo "unsupported event: $EVENT_NAME"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          BASE_REF="$(gh pr view "$PR" --repo "$GH_REPO" --json baseRefName --jq '.baseRefName')"
          DEFAULT_BRANCH="$(gh repo view "$GH_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "PR #$PR targets '$BASE_REF', not default '$DEFAULT_BRANCH'; skipping auto-merge enrollment for stacked PR"
            {
              echo "pr=$PR"
              echo "actor=$ACTOR"
              echo "skip=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "pr=$PR"
            echo "actor=$ACTOR"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Enable auto-merge
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'
        env:
          # OMN-17875: MUST be CROSS_REPO_PAT. GitHub completes an armed
          # auto-merge as the arming identity, and GITHUB_TOKEN-authored
          # commits fire no `push` event — that starved every push-on-dev
          # workflow (deliver-dev-candidate-to-staging.yml chief among them)
          # on 97 of 101 bot-armed merges. An onexbot-occ-writer App token is
          # NOT a substitute: it suppresses identically (OMN-16373 probe).
          # Do not "modernise" this back to GITHUB_TOKEN or an App token.
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          # OMN-16300: all OmniNode dev merge queues (including this repo's) were
          # disabled org-wide on 2026-07-10 (omni_home/CLAUDE.md "Merge Queue Policy").
          # omnibase_infra is squash-only with no queue, so a bare `--auto` is rejected
          # non-interactively ("--merge, --rebase, or --squash required") and this step
          # failed on every single PR. Pass --squash explicitly, matching the repo's
          # live merge policy. (Superseded OMN-13214 rationale: when dev WAS
          # queue-controlled, an explicit --squash was rejected because the queue set
          # the method — that no longer applies now that no queue exists.) Arming alone
          # does not enqueue on a repo that DOES have a queue — the explicit enqueue +
          # verify step below closes that gap for such repos. Do NOT exit here on success.
          if output=$(gh pr merge "$PR" --repo "$GH_REPO" --squash --auto 2>&1); then
            echo "auto-merge enabled: $output"
          elif echo "$output" | grep -qiE "already enqueued|already queued|auto-merge already enabled"; then
            echo "auto-merge not newly enabled (expected): $output"
          else
            echo "auto-merge failed: $output"
            exit 1
          fi

      - name: Enqueue armed PR and verify it entered the queue
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'
        env:
          # OMN-17875: this step MUTATES merge state twice — `gh pr
          # update-branch` pushes a merge commit onto the PR head branch, and
          # `enqueuePullRequest` hands the eventual merge to a merge queue. Both
          # land commits attributed to this token, so it carries the same
          # non-suppressing identity as the arming step above. (This repo has no
          # merge queue on dev today, so the enqueue path exits early — the PAT
          # here is for the update-branch push and for the day a queue returns.)
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          OWNER="${GH_REPO%/*}"
          NAME="${GH_REPO#*/}"

          classify() {
            python3 scripts/ci/merge_queue_enqueue.py classify \
              --pr-json "$1" --strict-update "$2"
          }

          # Is the target (default) branch strict-update? On strict repos a BEHIND
          # PR cannot enqueue until its branch is updated.
          DEFAULT_BRANCH="$(gh repo view "$GH_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          STRICT="$(gh api "repos/${GH_REPO}/branches/${DEFAULT_BRANCH}/protection/required_status_checks" \
            --jq '.strict' 2>/dev/null || echo "false")"
          [ "$STRICT" = "true" ] || STRICT="false"
          echo "strict-update on '${DEFAULT_BRANCH}': ${STRICT}"

          fetch_pr() {
            # isInMergeQueue is only on the GraphQL PullRequest object, NOT a
            # `gh pr view --json` field, so fetch PR state via GraphQL.
            # shellcheck disable=SC2016  # $owner/$name/$number are GraphQL vars, not shell vars
            gh api graphql \
              -f owner="$OWNER" \
              -f name="$NAME" \
              -F number="$PR" \
              -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      isInMergeQueue
                      mergeStateStatus
                      mergeable
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }' \
              --jq '.data.repository.pullRequest'
          }

          PR_JSON="$(fetch_pr)"
          ACTION="$(classify "$PR_JSON" "$STRICT")"
          echo "classified action: ${ACTION}"

          case "$ACTION" in
            already_queued)
              echo "PR #${PR} already in the merge queue — nothing to do."
              exit 0
              ;;
            wait)
              echo "PR #${PR} is not enqueueable yet (BLOCKED/DIRTY/DRAFT/UNKNOWN); will re-fire on next event."
              exit 0
              ;;
            blocked)
              echo "::warning::PR #${PR} in an unrecognised merge state: $(printf '%s' "$PR_JSON" | jq -r '.mergeStateStatus'). Not enqueuing."
              exit 0
              ;;
            update_branch_then_enqueue)
              echo "PR #${PR} is BEHIND on a strict-update repo — updating branch before enqueue (OMN-13214 branch-behind case)."
              if ! gh pr update-branch "$PR" --repo "$GH_REPO" 2>&1; then
                echo "::warning::update-branch reported no change or a benign error; continuing."
              fi
              echo "update-branch issued; the resulting check run re-fires this workflow when CI is green."
              exit 0
              ;;
            enqueue)
              : # fall through to enqueue below
              ;;
            *)
              echo "::error::unexpected action '${ACTION}' from classifier"
              exit 1
              ;;
          esac

          PR_ID="$(gh api graphql -f query='{repository(owner:"'"$OWNER"'",name:"'"$NAME"'"){pullRequest(number:'"$PR"'){id}}}' --jq '.data.repository.pullRequest.id')"
          if [ -z "$PR_ID" ] || [ "$PR_ID" = "null" ]; then
            echo "::error::could not resolve PR node id for #${PR}"
            exit 1
          fi

          # shellcheck disable=SC2016  # $prId is a GraphQL variable, not a shell var
          if enq_out=$(gh api graphql -f query='mutation($prId:ID!){enqueuePullRequest(input:{pullRequestId:$prId}){mergeQueueEntry{position}}}' -f prId="$PR_ID" 2>&1); then
            echo "enqueue issued: ${enq_out}"
          else
            if echo "$enq_out" | grep -qiE "merge queue (is )?not enabled|does not have a merge queue|merge_queue_not_enabled"; then
              echo "repo has no merge queue — arming auto-merge is sufficient: ${enq_out}"
              exit 0
            fi
            if echo "$enq_out" | grep -qiE "already (in|enqueued|queued)|in the merge queue"; then
              echo "benign enqueue race (already queued): ${enq_out}"
            else
              echo "::error::enqueuePullRequest failed for #${PR}: ${enq_out}"
              exit 1
            fi
          fi

          # OMN-13214 ENFORCEMENT: verify the PR actually entered the queue.
          # Poll briefly — GitHub may take a few seconds to reflect the entry.
          for attempt in 1 2 3 4 5; do
            sleep 6
            PR_AFTER="$(fetch_pr)"
            if python3 scripts/ci/merge_queue_enqueue.py verify --pr-json "$PR_AFTER"; then
              echo "VERIFIED: PR #${PR} is in the merge queue."
              exit 0
            fi
            echo "not yet in queue (attempt ${attempt}/5); state=$(printf '%s' "$PR_AFTER" | jq -r '.mergeStateStatus')"
          done

          echo "::error::PR #${PR} is green + armed but did NOT enter the merge queue after enqueue (OMN-13214 armed-but-not-enqueued). Manual intervention required."
          exit 1
