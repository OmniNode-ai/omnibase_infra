#
# Periodic audit of branch protection settings across all OmniNode-ai repos.
#
# NO SHARED AUDIT RUNS HERE (OMN-18346, OMN-20955). The shared branch-protection
# checks -- review enforcement with the OMN-18287 code-owner carve-out, the
# release-synced-main pair, enforce_admins, the Receipt Gate, delete_branch_on_merge
# and the Merge Queue ruleset -- have one auditor of record: the handler script
# handler_audit_branch_protection.sh in the private tooling repository, which runs
# on a schedule against the whole organisation. It moved there from onex_change_control as
# part of the OCC retirement, and this workflow used to fetch it from there at a
# pinned sha. This repo also used to carry a second, diverged copy of the same
# audit; OMN-18287 added a code-owner review carve-out to the other copy and
# proved it green (0 failures across 102 checks) while the local copy, which never
# received it, kept reporting onex_change_control as a review violation on both
# branches. That disagreement is why this workflow failed 47 of 47 scheduled runs
# in seven days. tests/ci/test_branch_protection_single_auditor.py keeps a second
# copy, and the old fetch, from regrowing.
#
# WHAT THIS REPO OWNS: the ORPHANED-CONTEXT check (the old "Check B"). The shared
# auditor has no equivalent, so retiring this workflow would lose the observation
# entirely. It runs here as scripts/audit_orphan_required_contexts.py, corrected by
# OMN-18346 to resolve required contexts against check-runs on merged PR head SHAs
# -- the only surface a PR-time gate ever reports on -- rather than against
# default-branch push check-runs, which structurally cannot carry them. The
# required-context parity report below is the other check kept here.
#
# Every audit step is read-only. Nothing here mutates branch protection, and the
# orphan auditor has no --fix path at all: removing a stale required context is an
# operator branch-protection change, not something a scheduled job should do.
#
# OMN-9034 (original gate), OMN-14696 (dev coverage), OMN-14683, OMN-14288
# (parity ratchet), OMN-18287 (review-gated carve-out), OMN-18346 (dedupe),
# OMN-20955 (the shared auditor leaves this repo)
#
# Token (OMN-19852): mints a read-only `onexbot` App installation token instead
# of running on the operator's personal CROSS_REPO_PAT. Same App, same
# permission set, as the `evidence-autoclose-sweep.yml` job in this repo
# (app_id 3342522, installation 123040063, `repository_selection: all`), which
# already proved administration:read across the org for a cross-repo audit.
# The old fallback chain (CROSS_REPO_PAT with a partial, GITHUB_TOKEN-only
# degrade) is gone: `administration:read` is not a grantable scope for
# GITHUB_TOKEN at all, so that fallback always produced a silently-partial
# audit rather than an error, and CROSS_REPO_PAT put a personal credential on
# a scheduled job's critical path. Minting fails loudly if the App secrets are
# ever missing, matching the OMN-16832 precedent in evidence-autoclose-sweep.yml.

name: Branch Protection Audit

on:
  schedule:
    # Every 4 hours at minute 23 (offset to avoid thundering herd)
    - cron: "23 */4 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: Audit Branch Protection
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      # THE credential this job runs under (OMN-19852). Everything below that
      # touches the GitHub API uses this token and nothing else — no
      # CROSS_REPO_PAT, no GITHUB_TOKEN fallback. Same App and permission set
      # as `evidence-autoclose-sweep.yml`'s "Mint onexbot App token" step
      # (OMN-16832) in this same repo.
      - name: Mint onexbot App token (OMN-19852)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: OmniNode-ai
          permission-administration: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: read
          permission-checks: read

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The shared auditor lives in the private tooling repository and does not carry this
      # check. Read-only, no --fix.
      - name: Orphaned required-context audit
        id: orphans
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          rc=0
          python3 scripts/audit_orphan_required_contexts.py --owner OmniNode-ai || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "orphan auditor exit=${rc}"

      # The audit step has no continue-on-error: the step below hard-fails on a
      # non-zero exit. tests/ci/test_branch_protection_single_auditor.py pins that,
      # so re-adding one is a red test rather than a review catch.
      - name: Fail if the audit reported violations
        run: |
          orphans="${{ steps.orphans.outputs.rc }}"
          echo "orphans=${orphans}"
          if [ "$orphans" != "0" ]; then
            echo "::error::orphaned required-context audit reported violations"
            exit 1
          fi

      # OMN-14288 — required-context parity ratchet, REPORT-ONLY.
      # Checks the MISSING direction (a claimed load-bearing gate absent from
      # required_status_checks) and needs:-closure coverage — the hole the
      # orphan audit above does not cover (it only checks the ORPHANED direction).
      # Findings never fail it: the CLI exits 0 on findings (report-then-enforce
      # rollout; the enforcing per-PR gate lands separately). It carries no
      # continue-on-error, so a report that cannot run at all fails the job.
      # NEVER mutates branch protection.
      - name: Required-context parity report (REPORT-ONLY)
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uv run python scripts/audit_required_context_parity_cli.py report --owner OmniNode-ai
