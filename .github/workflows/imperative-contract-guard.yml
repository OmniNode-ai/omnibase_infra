name: Imperative Contract Guard

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # OMN-13949: cancel superseded PR runs to free saturated runners. merge_group
  # entries carry a unique github.ref, so queue entries never cross-cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  imperative-contract-guard:
    # OMN-21004: the caller owns its unchanged, shrink-only allowlist.
    # self-gating-ok: central guard is intentionally shared across repos; caller PRs do not modify the referenced workflow.
    uses: OmniNode-ai/omnibase_core/.github/workflows/imperative-contract-guard.yml@dev-20261103173624-74e0b0f12767
    with:
      allowlist-path: imperative-contract-allowlist.yaml
