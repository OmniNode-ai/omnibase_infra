#
# Dependency Cascade Workflow (OMN-2751)
#
# Opens dependency-bump PRs in downstream repos when a foundation package is
# released. Each downstream repo gets a PR that runs `uv lock --upgrade-package`
# to pick up the new version.
#
# Downstream mapping:
#   omnibase_core  -> omnibase_infra, omniintelligence, omnimemory, omniclaude
#   omnibase_spi   -> omnibase_infra, omniintelligence, omnimemory, omniclaude
#   omnibase_infra -> omniintelligence, omnimemory, omniclaude
#
# This workflow is reusable so that omnibase_core and omnibase_spi can also call
# it from their own release workflows.
name: Dependency Cascade

on:
  workflow_call:
    inputs:
      package:
        description: 'Released package name (e.g. omnibase_infra)'
        required: true
        type: string
      version:
        description: 'Released version tag (e.g. v0.11.0)'
        required: true
        type: string
    secrets:
      # OMN-16373: CROSS_REPO_PAT retired. The caller now passes through the
      # onexbot-occ-writer GitHub App credentials (org secrets
      # ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY); this workflow mints a
      # short-lived installation token per downstream repo instead of using
      # a long-lived PAT.
      onexbot-occ-app-id:
        description: "onexbot-occ-writer GitHub App id (org secret ONEXBOT_OCC_APP_ID)"
        required: false
      onexbot-occ-private-key:
        description: "onexbot-occ-writer GitHub App private key (org secret ONEXBOT_OCC_PRIVATE_KEY)"
        required: false
  workflow_dispatch:
    inputs:
      package:
        description: 'Released package name (e.g. omnibase_infra)'
        required: true
        type: string
      version:
        description: 'Released version tag (e.g. v0.11.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  compute-matrix:
    timeout-minutes: 30
    name: Compute Downstream Matrix
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    outputs:
      repos: ${{ steps.matrix.outputs.repos }}
    steps:
      - name: Determine downstream repos
        id: matrix
        run: |
          PACKAGE="${{ inputs.package }}"

          case "$PACKAGE" in
            omnibase_core)
              REPOS='["omnibase_infra", "omniintelligence", "omnimemory", "omniclaude"]'
              ;;
            omnibase_spi)
              REPOS='["omnibase_infra", "omniintelligence", "omnimemory", "omniclaude"]'
              ;;
            omnibase_infra)
              REPOS='["omniintelligence", "omnimemory", "omniclaude"]'
              ;;
            *)
              echo "ERROR: Unknown foundation package: $PACKAGE"
              echo "Expected one of: omnibase_core, omnibase_spi, omnibase_infra"
              exit 1
              ;;
          esac

          echo "repos=$REPOS" >> $GITHUB_OUTPUT
          echo "Downstream repos for $PACKAGE: $REPOS"

  open-bump-pr:
    timeout-minutes: 30
    name: Bump ${{ matrix.repo }}
    needs: compute-matrix
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.compute-matrix.outputs.repos) }}
    steps:
      - name: Check onexbot-occ-writer App credentials are configured
        id: token_check
        env:
          # Read from BOTH sources, because the two triggers populate different
          # ones and neither name alone serves both (OMN-18596).
          #
          # On workflow_call, release.yml passes these explicitly and only the
          # declared inputs are populated. On workflow_dispatch those input
          # names do not exist at all, so reading only them resolved empty,
          # has_token went false, every later step's `if:` was false, and the
          # job exited 0 having done nothing. Run 35260585795 dispatched this
          # workflow against the released v0.38.30 while all three targets were
          # behind it, and reported four green jobs and zero pull requests.
          #
          # The fallback stays INSIDE the App's own identity. Substituting the
          # default workflow token would suppress the downstream workflows of
          # anything it pushed, which is the confound OMN-18273 corrected.
          APP_ID: ${{ secrets.onexbot-occ-app-id || secrets.ONEXBOT_OCC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.onexbot-occ-private-key || secrets.ONEXBOT_OCC_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            # FAIL, never skip. A cascade that cannot authenticate has not
            # skipped a bump; it has failed to perform one, and a green job is
            # indistinguishable from a cascade that had nothing to do. Same
            # reasoning the lab-pass receipt is built on: a result that appears
            # only when things worked cannot tell "it failed" apart from
            # "nobody ran it".
            echo "::error::onexbot-occ-writer App identity did not resolve for ${{ matrix.repo }}. On workflow_call the caller must pass onexbot-occ-app-id and onexbot-occ-private-key; on workflow_dispatch the org-level values must be readable. Refusing to report success for a bump that was never attempted."
            exit 1
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"

      # OMN-16373: mint a short-lived onexbot-occ-writer App installation
      # token, scoped to the one downstream repo this matrix leg touches.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.onexbot-occ-app-id }}
          private-key: ${{ secrets.onexbot-occ-private-key }}
          owner: OmniNode-ai
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout downstream repo
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      # OMN-15604 AC4: `uv lock --upgrade-package` cannot move a
      # [tool.uv.sources] git pin -- checked out into a side directory (the
      # downstream-repo checkout above overwrote the job's default
      # workspace, so this repo's own scripts/ are not otherwise present)
      # so the "Create branch and upgrade lockfile" step below can fail loud
      # BEFORE attempting a lock that is guaranteed to be a silent no-op.
      # Same OMN-18200 invariant as runtime-rebuild-trigger-reusable.yml: with no
      # `ref:` this resolved to the default branch at run time, so a caller's
      # `uses: ...@<sha>` pin governed the YAML while check_dep_provenance.py
      # came from wherever dev happened to be. `github.job_workflow_sha` is the
      # commit this workflow file was loaded from, which puts the two on one
      # commit behind one pin.
      - name: Checkout omnibase_infra dep-provenance script
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_infra
          ref: ${{ github.job_workflow_sha }}
          path: _dep_provenance_gate
          sparse-checkout: |
            scripts/check_dep_provenance.py
          sparse-checkout-cone-mode: false

      - name: Set up uv
        if: steps.token_check.outputs.has_token == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Set branch and PR variables
        if: steps.token_check.outputs.has_token == 'true'
        id: vars
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          # >>> OMN-18596 bump branch >>>
          # The branch carries a ticket because that is the ONLY arm of the
          # autobind condition a dependency bump can satisfy.
          #
          # Every repo's call-occ-autobind.yml gates its job on
          #   contains(pull_request.title, 'OMN-') || contains(head.ref, 'OMN-')
          # and this cascade generated neither. So autobind never ran on a bump
          # PR at all -- it did not decline one on the merits, the job simply
          # reported `skipping` -- and a person hand-wrote the companion
          # instead (onex_change_control#10026, human-authored 2026-09-17T15:04:42Z
          # for omnimemory#511's bump).
          #
          # The title arm is not available: the pr-title gate exempts the
          # `chore(deps` prefix precisely so dependency bumps need no ticket,
          # so putting one in the title would fight a deliberate exemption.
          #
          # Ported from omnimarket#2395, which fixed exactly this for that
          # repo's own post-release bump and generates
          # automation/omn-18010-post-release-dev-bump-<version>. GitHub's
          # expression `contains()` is case-insensitive, so the lowercase
          # ticket satisfies the uppercase literal in the condition.
          VERSION="${VERSION#v}"
          # Use hyphenated package name for the branch (PyPI convention)
          PKG_HYPHEN="${PACKAGE//_/-}"
          BRANCH="automation/omn-18596-bump-${PKG_HYPHEN}-${VERSION}"
          # The shape this cascade generated until OMN-18596. Any bump PR
          # opened before that change merged still carries it, and the
          # already-open check below must see those too: a rename whose dedupe
          # knows only the new shape opens a SECOND bump PR beside an in-flight
          # one. That is the defect omnimarket#2366 fixed, not a hypothetical.
          LEGACY_BRANCH="automation/bump-${PKG_HYPHEN}-${VERSION}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "legacy_branch=$LEGACY_BRANCH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pkg_hyphen=$PKG_HYPHEN" >> $GITHUB_OUTPUT
          # <<< OMN-18596 bump branch <<<
          # >>> OMN-18596 base-branch resolver >>>
          # The base is the ref this job's checkout actually landed on, read
          # BEFORE the bump branch is cut from it. "Checkout downstream repo"
          # above passes no `ref:`, so that ref IS the downstream repository's
          # own default branch, resolved at run time by the checkout itself.
          # Reading it here binds base to head: the PR is opened against the
          # exact ref its commit sits on top of, which a literal cannot do.
          #
          # This job previously passed the release branch as a literal base while
          # cutting the branch from a default branch of `dev`. On 2026-09-17 that opened
          # omniclaude#2215 against a release-synced main, presenting a 3-line
          # lockfile bump as a 16,201-addition diff; it had to be retargeted by
          # hand. `main` is the last release on these repos and is advanced only
          # by an automated fast-forward, so it is never a pull-request target.
          #
          # An unresolvable ref REFUSES. A cascade that guesses its own base is
          # how a wrong branch becomes a wrong diff, and a bump PR against a
          # branch nobody chose is worse than no bump PR.
          BASE_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ -z "${BASE_BRANCH}" ] || [ "${BASE_BRANCH}" = "HEAD" ]; then
            echo "::error::refusing to open a dependency-bump PR for ${{ matrix.repo }}: the checkout is detached or its branch could not be read, so the base cannot be bound to the commit's own parent. Resolve the repository's default branch rather than assuming one."
            exit 1
          fi
          echo "base=$BASE_BRANCH" >> $GITHUB_OUTPUT
          # <<< OMN-18596 base-branch resolver <<<

      - name: Create branch and upgrade lockfile
        if: steps.token_check.outputs.has_token == 'true'
        run: |
          git checkout -b "${{ steps.vars.outputs.branch }}"

          PKG_HYPHEN="${{ steps.vars.outputs.pkg_hyphen }}"
          VER="${{ steps.vars.outputs.version }}"

          # OMN-15604 AC4: `uv lock --upgrade-package` cannot move a
          # [tool.uv.sources] git pin -- uv always prefers an explicit
          # source override over registry resolution, so re-locking against
          # the SAME override typically re-resolves to a byte-identical
          # uv.lock. Left unchecked, the SKIP branch below would misreport
          # that as "already on latest" when this repo is actually still
          # stuck on the git pin. Fail loud and explicit BEFORE attempting
          # the (guaranteed no-op) lock, instead of after.
          if ! python3 "${GITHUB_WORKSPACE}/_dep_provenance_gate/scripts/check_dep_provenance.py" \
            --pyproject pyproject.toml \
            --check-movable "$PKG_HYPHEN"; then
            echo "::error::Dependency cascade cannot move ${PKG_HYPHEN} in ${{ matrix.repo }} -- it is pinned via a [tool.uv.sources] git override. 'uv lock --upgrade-package' will silently re-resolve against the SAME override and report no lockfile change, masking a no-op cascade (OMN-15604). Remove the [tool.uv.sources] override for ${PKG_HYPHEN} in ${{ matrix.repo }}'s pyproject.toml first, then re-run this cascade."
            exit 1
          fi

          # PyPI's upload -> public-index propagation can lag several minutes.
          # The old 12x10s (=120s) retry ceiling was too short and silently
          # failed the cascade (OMN-14468). Poll the PyPI JSON API until the
          # released version is actually visible, with a REAL ceiling
          # (default 15 min), before attempting the lock.
          CEILING="${CASCADE_PROPAGATION_CEILING_SECONDS:-900}"
          POLL="${CASCADE_PROPAGATION_POLL_SECONDS:-15}"
          deadline=$(( $(date +%s) + CEILING ))
          until curl -fsSL "https://pypi.org/pypi/${PKG_HYPHEN}/${VER}/json" -o /dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::${PKG_HYPHEN}==${VER} not visible on PyPI after ${CEILING}s"
              exit 1
            fi
            echo "Waiting for ${PKG_HYPHEN}==${VER} to appear on PyPI (poll ${POLL}s, ceiling ${CEILING}s)..."
            sleep "$POLL"
          done
          echo "${PKG_HYPHEN}==${VER} is visible on PyPI; upgrading lockfile."

          # Upgrade the lockfile to the released version. Passing the explicit
          # package spec prevents uv from selecting a different latest version.
          # A short retry absorbs simple-index CDN lag after JSON visibility.
          SPEC="${PKG_HYPHEN}==${VER}"
          for attempt in $(seq 1 6); do
            if uv lock \
              --refresh-package "${PKG_HYPHEN}" \
              --upgrade-package "$SPEC"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::failed to resolve $SPEC after $attempt attempts (post-visibility)"
              exit 1
            fi
            sleep 10
          done

          # Check if anything changed
          if git diff --quiet uv.lock; then
            echo "SKIP=true" >> $GITHUB_ENV
            echo "No lockfile changes -- ${{ matrix.repo }} already on latest ${{ inputs.package }}"
          else
            echo "SKIP=false" >> $GITHUB_ENV
            echo "Lockfile updated with new ${{ inputs.package }} version"
          fi

      - name: Update pyproject.toml pin
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'false'
        env:
          BUMP_PACKAGE: ${{ inputs.package }}
        run: |
          PKG_HYPHEN="${BUMP_PACKAGE//_/-}"
          RESOLVED="${{ steps.vars.outputs.version }}"
          export PKG_HYPHEN RESOLVED
          echo "Pinned version for ${PKG_HYPHEN}: ${RESOLVED}"

          python3 - <<'PYEOF'
          import re, os
          pkg = os.environ["PKG_HYPHEN"]
          version = os.environ["RESOLVED"]
          content = open("pyproject.toml").read()
          updated = re.sub(
              r'"' + re.escape(pkg) + r'==[0-9]+\.[0-9]+\.[0-9]+"',
              f'"{pkg}=={version}"',
              content,
          )
          open("pyproject.toml", "w").write(updated)
          PYEOF

      - name: Commit and push
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'false'
        run: |
          # OMN-18273: commit as the App this job already authenticates as, not
          # as github-actions[bot] — the push is an App-token push, so the two
          # disagreeing was itself misleading about who made the change.
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"
          git add uv.lock pyproject.toml
          git commit -m "chore(deps): bump ${{ inputs.package }} to ${{ steps.vars.outputs.version }}" \
            -m "Automated dependency cascade — updates uv.lock and pyproject.toml pins." \
            --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
            --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "${{ steps.vars.outputs.branch }}"

      - name: Open pull request
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Check whether a PR is already open for this bump, under EITHER
          # branch shape. Querying only the current shape is how a rename
          # opens a duplicate beside an in-flight PR (omnimarket#2366).
          EXISTING=$(gh pr list \
            --repo "OmniNode-ai/${{ matrix.repo }}" \
            --head "${{ steps.vars.outputs.branch }}" \
            --state open \
            --json number \
            --jq 'length')
          LEGACY_EXISTING=$(gh pr list \
            --repo "OmniNode-ai/${{ matrix.repo }}" \
            --head "${{ steps.vars.outputs.legacy_branch }}" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "PR already exists for branch ${{ steps.vars.outputs.branch }} -- skipping"
            exit 0
          fi

          if [ "$LEGACY_EXISTING" -gt 0 ]; then
            echo "PR already exists for the pre-OMN-18596 branch ${{ steps.vars.outputs.legacy_branch }} -- skipping rather than opening a duplicate"
            exit 0
          fi

          gh pr create \
            --repo "OmniNode-ai/${{ matrix.repo }}" \
            --title "chore(deps): bump ${{ steps.vars.outputs.pkg_hyphen }} to ${{ steps.vars.outputs.version }}" \
            --body "$(cat <<'PREOF'
          ## Summary

          Automated dependency bump triggered by a new release of `${{ inputs.package }}` (${{ inputs.version }}).

          - Updates `uv.lock` via `uv lock --upgrade-package ${{ inputs.package }}`
          - Updates `pyproject.toml` exact pins (`==X.Y.Z`) to match resolved version

          ## Triggered by

          Release workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Test plan

          - [ ] CI passes (lockfile resolution is valid)
          - [ ] Downstream tests pass with the new dependency version
          PREOF
          )" \
            --head "${{ steps.vars.outputs.branch }}" \
            --base "${{ steps.vars.outputs.base }}"

      - name: Skip summary
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'true'
        run: |
          echo "### Skipped: ${{ matrix.repo }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ matrix.repo }} already uses the latest version of ${{ inputs.package }}." >> $GITHUB_STEP_SUMMARY
          echo "No lockfile changes needed." >> $GITHUB_STEP_SUMMARY
