---
# SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
#
# THE PRE-MERGE TWIN OF THE OMN-14631 WORKSPACE CONTENT-PARITY GATE.
#
# The image build already proves that the installed package tree is
# byte-for-byte the staged source tree plus declared force-includes. That
# proof is correct and late: it runs on the lab, after the change has merged
# in the package's own repository. Twice on 2026-09-19 a change that was
# green in its own repository broke it and cost hours of dev-lane downtime
# before anyone saw the failure. This reusable runs the SAME comparison, in
# the package repository, against the pull request's own head.
#
# This file is a thin caller of a script. Every comparison primitive lives in
# scripts/runtime_build/compute_workspace_provenance.py -- the image gate
# itself -- and is imported, never reimplemented and never copied into a
# package repository. A second copy of this comparison is the failure this
# check exists to prevent: the 2026-09-19 window found three copies of one
# wrong assumption about the staged tree.
#
# THE INFRA CHECKOUT IS PINNED TO `github.job_workflow_sha`, NOT A BRANCH.
# That is this workflow's own commit, which is whatever the caller pinned in
# its `uses:` line, so ONE pin in the caller fixes the workflow AND the three
# script files together. A branch pin would let a re-run of an
# already-reviewed run resolve a different comparison.
#
# A CI-TIME CHECKOUT IS NOT A RUNTIME DEPENDENCY. omnibase_core calling this
# does NOT make core depend on omnibase_infra: nothing is added to core's
# pyproject, uv.lock, or import graph, and the fetched files are deleted with
# the runner. Rule 7's layering (compat -> core -> spi -> infra) constrains
# the RUNTIME dependency direction; it does not forbid a lower layer from
# reading a higher layer's verification tooling in CI, the same way core
# already calls omniclaude's deploy-gate and advisory-job-gate reusables.
#
# NO `paths:` AND NO `branches:` FILTER IN THE CALLERS, deliberately. This
# context is asserted on each repository's enforcement surface, and an
# asserted context that can be legitimately absent on some pull-request shape
# does not fail that shape -- it wedges it.

name: Wheel Content Parity (reusable)

on:
  workflow_call:
    inputs:
      package:
        description: >
          The package's IMPORT name, e.g. omnibase_core. The source tree is
          read from src/<package> and the wheel's <package>/ entries are
          compared against it.
        type: string
        required: true

permissions:
  contents: read

jobs:
  wheel-content-parity:
    name: wheel-content-parity
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci;
    # public forks default to ubuntu-latest. The untrusted test is the FORK
    # test and only the fork test (OMN-18205). Read live from the routing
    # seam; this workflow never writes a routing variable.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # reusable-checkout-sparse-ok: wheel-content-parity — the existence of
      # every fetched path is asserted by the next step, which fails closed.
      - name: Fetch the parity comparison (omnibase_infra, at this workflow's own commit)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_infra
          ref: ${{ github.job_workflow_sha }}
          path: .omnibase-infra-parity
          persist-credentials: false
          # The comparison module and its own imports are fetched as a
          # directory rather than by name. Only ONE script here is wired as
          # enforcement -- the one the run step below invokes; the rest are
          # its library, and naming a library module in a workflow file makes
          # the incident-replay coverage checker read it as a guard of its
          # own (it matches script paths textually, which it cannot help).
          sparse-checkout: |
            scripts/ci/check_wheel_content_parity.py
            scripts/runtime_build/*.py
          sparse-checkout-cone-mode: false

      - name: Assert the fetched comparison is present and importable
        shell: bash
        run: |
          set -euo pipefail
          # A sparse checkout that matches nothing SUCCEEDS and leaves an
          # empty tree, so absence has to be asserted rather than assumed.
          # `--help` is the assertion: it executes the module's whole import
          # chain, so a missing comparison module fails here, named, instead
          # of surfacing later as a confusing ModuleNotFoundError.
          python3 .omnibase-infra-parity/scripts/ci/check_wheel_content_parity.py --help \
            > /dev/null \
            || { echo "::error::omnibase_infra@${{ github.job_workflow_sha }} did not yield a runnable content-parity comparison"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Judge wheel content parity
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          python3 .omnibase-infra-parity/scripts/ci/check_wheel_content_parity.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --package "$PACKAGE" \
            --json "$RUNNER_TEMP/wheel-content-parity.json"

      - name: Upload the parity result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-content-parity-${{ inputs.package }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/wheel-content-parity.json
          if-no-files-found: ignore
          retention-days: 14
