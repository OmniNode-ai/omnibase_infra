#
# dlq-depth-monitor.yml — OMN-16769
#
# Scheduled read-only sweep of every onex.dlq.* topic on the dev lane broker.
# Measures retained depth and arrivals-in-window per topic, evaluates them
# against the contract-pinned bounds in node_dlq_depth_evaluate_compute, and
# EXITS NON-ZERO when a sink takes more than its declared bound allows. A red
# run is the alert surface — there is no separate notification channel, and
# none was added (OMN-16769 scopes the alert to "a failing scheduled-workflow
# run (red is visible)").
#
# WHY THIS EXISTS: onex.dlq.omnibase-infra.quarantine.v1 reached ~8.88M records
# with zero projection and zero alerting, and a total delegation outage
# (OMN-16767) hid inside it silently until someone went looking by hand.
#
# WHAT OMN-17163 CHANGED — THE RUNNER AND THE BROKER WERE BOTH WRONG
#   This workflow had never passed. 545 runs from 2026-08-28T05:17:29Z: 543
#   failure, 2 cancelled, 0 success, every one of them the same
#   `KafkaConnectionError: Unable to bootstrap from [('localhost', 19092,
#   AF_UNSPEC)]`. There was no regression to find — it shipped broken and the
#   red never carried information, so the sink this monitor exists to watch
#   has been unmeasured for the monitor's entire existence.
#
#   Four defects, compounding. The fourth was invisible until the first
#   three were fixed: with the runner, the address and the transport all
#   correct, the probe still never opened a socket, because the omnimarket
#   drift guard refused the dispatch before the broker was ever contacted.
#   See "(4) THE GUARD" on the probe step below.
#
#   (1) THE RUNNER. `runs-on` read the trusted-CI routing variable, which
#       resolves to `ubuntu-latest` (asserted intent — `config/
#       runner_routing_policy.yaml` `expected_json`, OMN-16682 single-owner —
#       not drift). An Azure-hosted runner cannot reach a .201 host-published
#       port. But the `omnibase-ci` label the old comment named would NOT have
#       fixed it either: those runners are containers with no host networking
#       and no `extra_hosts`, so `localhost` inside one is the container's own
#       loopback. `omnibase-deploy` is the ONE runner carrying
#       `extra_hosts: host.docker.internal:host-gateway`
#       (docker/docker-compose.runners.yml), which is what puts it in the
#       lane's reachability domain. That is a NETWORK-NAMESPACE fact, not a
#       trust fact, and it is why this job now pins the label literally rather
#       than reading a variable a routing flip can move underneath it.
#
#   (2) THE ADDRESS. `KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.… || 'localhost:19092' }}`
#       resolved to the literal every single run: no secret of that name
#       exists at repo or org scope, and `source ~/.omnibase/.env` is a no-op
#       on a hosted runner AND on the deploy runner, whose operator env is
#       mounted at /home/runner/.runner-creds/operator.env instead. The node
#       applies no default and fails closed on an unset broker — and the
#       workflow defeated that by supplying one the node then trusted. The
#       header comment claiming otherwise was true of the node and false of
#       this file.
#
#   (3) THE TRANSPORT. OMN-18012 Phase B enabled SASL/SCRAM-SHA-256 on the
#       .201 dev-lane Redpanda EXTERNAL listener at ~2026-09-07T16:40Z. The
#       handler already reads KAFKA_SECURITY_PROTOCOL / KAFKA_SASL_MECHANISM /
#       KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD through
#       build_aiokafka_auth_kwargs_from_env; this workflow injected none of
#       the four. Fixing only the runner would have moved the failure from
#       Errno 111 to an auth failure.
#
#   All three are one fix, and chain-canary.yml already carries it: the lane's
#   ADDRESS and its TRANSPORT are declared together in omnimarket's
#   config/ci_bus_lanes.yaml, and `load_lane_transport` RAISES on a missing
#   lane, an in-memory lane, an undeclared protocol, or a host-alias broker.
#   It never returns a default, which is the fail-closed behaviour this
#   header used to claim and did not have. Credentials are not in that overlay
#   and never reach argv: only the protocol NAMES are config; the SCRAM
#   principal arrives as job environment from the org secrets.
#
# READ-ONLY BY CONSTRUCTION, not by convention. The backing node's only broker
# surface is ProtocolDlqAdminTransport — five methods, all reads — and the live
# adapter backs it with a GROUP-LESS AIOKafkaConsumer that joins no consumer
# group and commits nothing. There is no --apply flag here because there is
# nothing this workflow could apply. That is a stronger guarantee than the
# DRY-RUN defaults on the sibling sweeps (sync-revert-watchdog.yml,
# evidence-autoclose-sweep.yml) this workflow is modeled on, which DO have a
# live mutation path deliberately left unarmed.
#
# The kill switch (ONEX_DLQ_MONITOR_DISABLED) is honored by the node itself
# unconditionally, independent of this workflow's config, so it is not (and
# must not be) surfaced as an input here — set it as a repo/environment
# variable to halt every run without touching this file.
#
# WINDOW SIZING — window_seconds=1800 deliberately EQUALS the 30-minute cron
# interval. Unlike the lookback windows on the sibling sweeps (which
# intentionally exceed their interval so a missed run never drops an event),
# this measurement is a RATE, not a backlog scan: overlapping windows would
# double-count arrivals across consecutive runs and inflate the apparent rate.
# A missed run therefore leaves a genuine gap rather than being re-covered —
# an acceptable trade for a monitor whose signal is "is this sink taking
# traffic right now", and the standing depth column still reflects anything
# that landed during a gap.
#
# No new scripts/** file: scripts/** is DEFAULT-DENY for new files (OMN-14475
# canonical-form guard). The step below is a direct `uv run onex ...`
# invocation of code that already lives under src/.

name: DLQ Depth Monitor

on:
  schedule:
    # Every 30 minutes; window_seconds below matches exactly (see WINDOW SIZING).
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      window_seconds:
        description: 'Arrival-measurement window in seconds. Keep equal to the cron interval for scheduled runs.'
        required: false
        default: '1800'
      topic_prefix:
        description: 'Only topics with this prefix are probed.'
        required: false
        default: 'onex.dlq.'
      bus_lane:
        description: 'CI bus lane whose DECLARED broker + transport this probe reads (omnimarket config/ci_bus_lanes.yaml).'
        required: false
        default: 'dev'
      suppress_alert_exit:
        description: 'Set true for a characterization run: collect the histogram WITHOUT failing the run on a breach. Leave false so a breach goes red.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  UV_VERSION: "0.8.3"
  PYTHON_VERSION: "3.12"

# Never let two probes overlap: a delayed run plus the next scheduled tick
# would measure overlapping windows and report inflated arrival counts.
concurrency:
  group: dlq-depth-monitor
  cancel-in-progress: false

jobs:
  dlq-depth-monitor:
    name: DLQ Depth Monitor (read-only)
    # See "(1) THE RUNNER" above before changing this. Pinned literally, not
    # read from a routing variable: the constraint is that this job must sit in
    # the .201 host's network namespace, which no org-wide routing decision can
    # satisfy and a routing flip must not be able to silently revoke.
    runs-on: [self-hosted, omnibase-deploy]
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          # No git operations after checkout — do not leave the Actions
          # token in local git config (zizmor artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      # The SAME declaration chain-canary.yml and runtime-rebuild-trigger.yml
      # already read. One declaration, read by every CI client of this bus, is
      # the whole point: an address that lives in two places drifts in one of
      # them silently (OMN-14800).
      - name: Fetch the declared CI bus lanes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: dev
          path: .ci-bus-overlay
          persist-credentials: false
          sparse-checkout: |
            config/ci_bus_lanes.yaml
          sparse-checkout-cone-mode: false

      - name: Resolve the declared lane transport
        id: transport
        env:
          BUS_LANE: ${{ github.event.inputs.bus_lane || 'dev' }}
        run: |
          set -euo pipefail
          # Fail-closed by construction: load_lane_transport RAISES on a
          # missing lane, an in-memory lane, an undeclared protocol, or a
          # broker that is itself a host alias. It never returns a default, so
          # a broken overlay stops the run HERE — before any probe — instead of
          # producing a sweep that read the wrong lane and reported it clean.
          #
          # Only the non-secret half is exported. The SCRAM credentials are
          # injected as secrets on the probe step below and never pass through
          # an output, a log line, or a command line.
          uv run python -c "
          import os, pathlib
          from omnibase_infra.nodes.node_chain_canary_effect.lane_transport import (
              lane_transport_env, load_lane_transport,
          )
          lane = os.environ['BUS_LANE']
          transport = load_lane_transport(
              pathlib.Path('.ci-bus-overlay/config/ci_bus_lanes.yaml'), lane
          )
          print(f'lane {lane!r} declares {transport.bootstrap_servers} '
                f'({transport.security_protocol}/{transport.sasl_mechanism})')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in lane_transport_env(transport).items():
                  handle.write(f'{key}={value}\n')
          "

      - name: Probe DLQ depth (read-only; the alert is a field, not an exception)
        env:
          TOPIC_PREFIX: ${{ github.event.inputs.topic_prefix || 'onex.dlq.' }}
          WINDOW_SECONDS: ${{ github.event.inputs.window_seconds || '1800' }}
          SUPPRESS_ALERT_EXIT: ${{ github.event.inputs.suppress_alert_exit || 'false' }}
          # No KAFKA_BOOTSTRAP_SERVERS line and no `|| '<host:port>'` default:
          # the address arrives from the resolve step through $GITHUB_ENV, and
          # an unresolved value means that step did not run, which the node
          # fails closed on rather than probing a guess.
          #
          # OMN-17163: the lane declares SASL_PLAINTEXT / SCRAM-SHA-256 since
          # OMN-18012 Phase B. These are the org-wide dev-lane SCRAM secrets
          # chain-canary.yml and runtime-rebuild-trigger.yml already use,
          # injected as ENVIRONMENT so that no credential reaches argv, the
          # process list, or this log. build_aiokafka_auth_kwargs_from_env
          # reads them together with the KAFKA_SECURITY_PROTOCOL /
          # KAFKA_SASL_MECHANISM the resolve step exported.
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          # (4) THE GUARD — the fourth defect, found only after the first three
          # were fixed and the probe still never reached the broker.
          #
          # The omnimarket drift guard (OMN-14060) refuses `onex skill`
          # whenever $OMNI_HOME/omnimarket exists and the running
          # interpreter's omnimarket is not a git co-install. The deploy
          # runner sets OMNI_HOME to its private clone tree
          # (DEPLOY_RUNNER_OMNI_HOME, docker/docker-compose.runners.yml),
          # which DOES contain omnimarket, so the guard fires here on a
          # dispatch it has no bearing on: node_dlq_depth_monitor_effect is
          # provided by omnibase_infra itself (pyproject.toml `onex.nodes`
          # entry point) and invokes no omnimarket node in-process.
          #
          # It cannot be satisfied rather than overridden. This job's
          # interpreter is the ephemeral `uv sync` venv under _work, and
          # omnimarket is DELIBERATELY absent from this repo's pyproject.toml
          # and uv.lock — it sits above infra in the compat -> core -> spi ->
          # infra graph, so declaring it would publish a cycle (the workspace-
          # venv reconciler's own header states this). `uv sync` therefore can
          # never install it here, and the guard's OMN-17190 self-heal cannot
          # close the gap either: that reconciler repairs
          # $OMNI_HOME/omnibase_infra/.venv, which is neither this interpreter
          # nor a venv the runner workspace has ever had.
          #
          # NOTE — the reconciler's path is named by family, not spelled, on
          # purpose. check_incident_replay_coverage.py regex-scans the FULL
          # text of every workflow file (comments included) for
          # `scripts/**.sh`, so spelling it here registers it as a newly wired
          # enforcement guard and fails that gate on a prose mention. Same
          # family of trap as omni_home CLAUDE.md rule 15.
          #
          # The guard's own docstring names this variable as the sanctioned
          # way past a refusal and calls unsetting OMNI_HOME "strictly worse
          # ... silently". The override downgrades to a logged WARNING, so
          # genuine drift stays visible in this run's log. chain-canary.yml
          # carries the identical override for the identical reason.
          ONEX_ALLOW_OMNIMARKET_DRIFT: "1"
        run: |
          set -euo pipefail
          if [ -z "${KAFKA_BOOTSTRAP_SERVERS:-}" ]; then
            echo "::error::KAFKA_BOOTSTRAP_SERVERS is unset — the lane-transport resolve step did not export it. Refusing to probe an unspecified broker."
            exit 1
          fi
          # Safe to print and worth printing: this is the declared address, not
          # a credential, and it is the one value a reader needs to check the
          # run against the lane declaration.
          echo "declared broker: ${KAFKA_BOOTSTRAP_SERVERS}"
          echo "declared transport: ${KAFKA_SECURITY_PROTOCOL:-<unset>}/${KAFKA_SASL_MECHANISM:-<none>}"
          suppress_flag=()
          if [ "$SUPPRESS_ALERT_EXIT" = "true" ]; then
            suppress_flag=(--suppress-alert-exit)
          fi
          uv run onex skill dlq_depth_monitor \
            --topic-prefix "$TOPIC_PREFIX" \
            --window-seconds "$WINDOW_SECONDS" \
            "${suppress_flag[@]}" \
            | tee dlq-monitor-result.json

      # OMN-18088 — THE RED RUN HAS TO SAY WHY IT IS RED.
      #
      # This step is BOTH the alert gate and the summary, and it is the only
      # place either one happens. That is deliberate: while the gate lived in
      # the node (as a raise) and the summary lived in a separate step (as
      # prose), the summary asserted "the failing step's log names each
      # offending topic with its arrival count, its bound, and its retained
      # depth" and that sentence was FALSE on every alerting run — the raise
      # was swallowed between RuntimeLocal and receipt mode and the run emitted
      # handler_result=null / terminal_payload=null / error="" (run
      # 34399417506, 67 topics measured, none named).
      #
      # Now the node returns the histogram and the derived gating decision, and
      # this step renders the offenders it is about to go red for. The claim
      # and the evidence are produced by the same code, so they cannot drift.
      #
      # `always()` because a probe that died BEFORE writing a result must still
      # produce a summary saying so. Every unreadable case below fails closed
      # with a named reason: an absent file, an unparseable one, and a payload
      # that is not a monitor result all exit non-zero rather than reporting a
      # clean bill of health for a sweep that never happened.
      - name: Name the offenders and gate the run
        if: always()
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          RESULT_PATH = pathlib.Path("dlq-monitor-result.json")
          MONITOR_MODEL = "ModelDlqDepthMonitorResult"
          OK_VERDICT = "ok"
          # A histogram of 67 topics does not need 67 rows to make its point,
          # and an unbounded splice is how a summary hits GitHub's size cap.
          MAX_ROWS = 40

          lines = [
              "## DLQ Depth Monitor (OMN-16769, read-only)",
              "",
              "Probed every `onex.dlq.*` topic on the dev lane broker for retained",
              "depth and arrivals-in-window. No writes of any kind were performed:",
              "the node's only broker surface is read-only and its consumer is",
              "group-less, so it commits nothing.",
              "",
              "The broker address and its transport both come from the lane",
              "declaration in omnimarket `config/ci_bus_lanes.yaml` (OMN-17163);",
              "an unresolvable lane stops the run before the probe.",
              "",
          ]

          def finish(exit_code):
              text = "\n".join(lines) + "\n"
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      handle.write(text)
              sys.stdout.write(text)
              raise SystemExit(exit_code)

          def row(verdict):
              return (
                  f"| `{verdict.get('topic', '<unnamed>')}` "
                  f"| {verdict.get('verdict', '?')} "
                  f"| {verdict.get('arrivals_in_window', '?')} "
                  f"| {verdict.get('max_arrivals_per_window', '?')} "
                  f"| {verdict.get('retained_depth', '?')} |"
              )

          if not RESULT_PATH.exists() or not RESULT_PATH.read_text(
              encoding="utf-8"
          ).strip():
              lines += [
                  "**NO RESULT — the probe wrote nothing.**",
                  "",
                  f"`{RESULT_PATH}` is absent or empty, so this run measured no sink",
                  "and its red says nothing about DLQ depth. Read the probe step's log.",
              ]
              finish(1)

          raw = [
              line
              for line in RESULT_PATH.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ][-1]
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              lines += [
                  "**UNREADABLE RESULT — the probe's output is not JSON.**",
                  "",
                  f"`{exc}`",
                  "",
                  "```",
                  raw[:500],
                  "```",
              ]
              finish(1)

          if not str(payload.get("result_model", "")).endswith(MONITOR_MODEL):
              inner = payload.get("result")
              inner = inner if isinstance(inner, dict) else {}
              lines += [
                  "**THE PROBE DID NOT COMPLETE — no histogram was produced.**",
                  "",
                  "This red is a malfunction, not a DLQ alert. No sink was measured.",
                  "",
                  f"- status: `{payload.get('status', '?')}`",
                  f"- exit code: `{payload.get('exit_code', '?')}`",
                  f"- error: `{inner.get('error') or '(none recorded)'}`",
                  "",
                  "Capture log:",
                  "",
                  "```",
                  str(inner.get("capture_log") or "(empty)")[:4000],
                  "```",
              ]
              finish(1)

          result = payload["result"]
          evaluation = result["evaluation"]
          verdicts = list(evaluation.get("verdicts", []))
          offenders = [v for v in verdicts if v.get("verdict") != OK_VERDICT]

          lines += [
              f"Observed **{evaluation.get('topics_observed', 0)}** topic(s) "
              f"({result.get('topics_matched', 0)} matched the prefix) over a "
              f"{result.get('window_seconds', '?')}s window: "
              f"**{evaluation.get('total_arrivals_in_window', 0)}** arrival(s), "
              f"**{evaluation.get('total_retained_depth', 0)}** retained.",
              "",
          ]

          if offenders:
              lines += [
                  f"**{len(offenders)} DLQ sink(s) exceeded a declared bound.**",
                  "",
                  "| topic | verdict | arrivals in window | bound | retained depth |",
                  "| -- | -- | --: | --: | --: |",
              ]
              lines += [row(v) for v in offenders[:MAX_ROWS]]
              if len(offenders) > MAX_ROWS:
                  lines.append(
                      f"| _+{len(offenders) - MAX_ROWS} more — see "
                      f"`{RESULT_PATH}`_ | | | | |"
                  )
              lines.append("")
          else:
              lines += ["No DLQ sink exceeded its bound this window.", ""]

          if result.get("suppress_alert_exit"):
              lines += [
                  "Characterization run (`suppress_alert_exit=true`): a breach is",
                  "reported above but does NOT gate this run.",
                  "",
              ]

          lines += [
              "Standing depth is REPORTED but does not gate the run — see the",
              "`alert_policy` block in node_dlq_depth_evaluate_compute/contract.yaml",
              "for why a depth bound cannot be the primary signal on a topic",
              "already holding ~8.88M records (OMN-16769 AC4).",
          ]

          gate = result.get("alert_exit_requested")
          if not isinstance(gate, bool):
              lines += [
                  "",
                  "**MALFORMED RESULT — `alert_exit_requested` is missing or not a",
                  "boolean, so this run cannot state whether it should gate.**",
              ]
              finish(1)

          finish(1 if gate else 0)
          PY
