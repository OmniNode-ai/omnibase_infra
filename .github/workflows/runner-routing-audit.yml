---
name: Runner Routing Audit

on:
  # OMN-18780: CI calls this workflow for PRs, so its verdict belongs to the
  # required CI Summary run rather than a path-filtered advisory run.
  workflow_call:
    secrets:
      CROSS_REPO_PAT:
        required: true
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A reusable workflow inherits github.workflow from its caller. Using the
  # caller's concurrency key here would cancel the CI run that invokes us.
  group: runner-routing-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Runner Routing Audit
    timeout-minutes: 20
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          cache-enabled: "false"
          install-args: "--frozen"

      - name: Verify runner audit controls
        run: uv run pytest tests/ci/test_runner_routing_audit.py -q

      # OMN-18780: retain failures on both passes. always() on the second
      # pass preserves the existing protection against first-pass masking.
      - name: Audit local workflow routing
        id: local_workflows
        if: always()
        run: uv run python scripts/audit-runner-routing.py --local-workflows

      # OMN-18780: PRs and scheduled runs read the same live state. A missing
      # cross-repository credential refuses the read, never reports clean.
      - name: Audit GitHub runner variables
        id: github_vars
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Runner audit unreadable::CROSS_REPO_PAT is required for the live routing assertions"
            exit 1
          fi
          uv run python scripts/audit-runner-routing.py --github-vars

      # OMN-18780: require actual success from both passes, including after a
      # setup failure. Missing/skipped outcomes cannot stand in for a read.
      - name: Evaluate combined runner routing audit result
        if: always()
        run: |
          echo "local_workflows outcome: ${{ steps.local_workflows.outcome }}"
          echo "github_vars outcome: ${{ steps.github_vars.outcome }}"
          if [ "${{ steps.local_workflows.outcome }}" != "success" ] || [ "${{ steps.github_vars.outcome }}" != "success" ]; then
            echo "::error title=Runner routing drift::at least one audit pass reported findings; see the step logs above for every surface, not just the first"
            exit 1
          fi
          echo "Runner routing audit: all executed passes reported clean."
