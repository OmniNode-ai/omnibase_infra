#
# runtime-rebuild-trigger.yml
#
# Triggers a runtime redeploy when a PR that touches runtime code merges to
# dev or main. Closes the 6-day deploy gap (OMN-7963 / pr_review_bot failure
# class).
#
# CI publishes onex.cmd.omnimarket.redeploy-start.v1 (consumed by node_redeploy),
# NOT onex.cmd.deploy.rebuild-requested.v1 directly. node_redeploy owns the
# deploy lifecycle (lane policy, digest pinning, readiness, rollback) and is the
# sole emitter of the deploy-agent rebuild command (OMN-12573, blocker B1).
#
# The triggering base branch decides the runtime lane (dev -> dev lane, main ->
# stability-test lane) and the merge commit SHA is the ref node_redeploy
# rebuilds — there is no hardcoded origin/main.
#
# Trigger conditions (evaluated by scripts/trigger_rebuild_on_merge.py):
#   - PR had the "runtime_change" label, OR
#   - omniclaude's canonical deploy-gate classifier identifies a runtime path, OR
#   - the merge touches a LANE-STATE path (OMN-18072): the forward-migration
#     runner, the docker/migrations corpus it applies, the compose model or the
#     runtime policy env. The canonical classifier answers "does this PR need
#     deploy EVIDENCE" and is right to miss these; this trigger answers the
#     wider "does this merge change what the lane RUNS". omnibase_infra#3352
#     changed the migration runner and produced NO trigger (run 34330947198),
#     so the seam never executed on the lane. The list is unioned with the
#     canonical result, never replacing it — see LANE_STATE_PATH_PATTERNS.
#     OMN-18671 added the repo-root dependency manifest and lock to that same
#     list: the runtime image is BUILT from them, so a floor bump IS the change.
#     omnimarket#2629 raised the omnibase-infra floor 0.38.30 -> 0.38.31, which
#     swapped the installed lab binding table, and run 35323097013 classified it
#     inert — no rebuild, no verify, no announce, no receipt.
#
# Control-bus routing is independent of the requested runtime lane. Both dev
# and stability-test commands enter through the dev control bus where
# node_redeploy_orchestrator consumes them; runtime_lane in the signed payload
# decides the deployment target. The broker comes from omnimarket's checked-in
# config/ci_bus_lanes.yaml overlay, not an opaque Actions secret (OMN-15009).
#
# Required GitHub Secrets: none. The deploy-agent HMAC belongs to the runtime
# deploy EFFECT that emits rebuild-requested, not this upstream start command.
#
# RUNNER ROUTING (OMN-17888) — this job is LAN-BOUND and must not ride the
# shared trusted-CI seam. The dev control-bus broker declared by the overlay is
# a tailnet host:port. OMN-16682 retargeted OMNI_TRUSTED_CI_RUNS_ON_JSON to
# ["ubuntu-latest"] at BOTH org and repo scope on 2026-08-26, which relocated
# this publisher onto GitHub-hosted compute that cannot resolve that name. Every
# run since that had a runtime change to publish has failed on a DNS error after
# a 30-second flush; the runs that "passed" were no-ops with nothing to send.
#
# The remedy is the same carve-out already applied to call-occ-autobind.yml
# (OMN-16691) and to omnimarket's pr-merged-publisher.yml (OMN-17378): a
# DEDICATED runs-on variable, deliberately left UNSET so the self-hosted literal
# operates. Fork PRs still route to hosted compute — untrusted code never
# reaches the fleet — and the script refuses to attempt a LAN publish from a
# github-hosted runner instead of timing out against an unresolvable name.
#
# Tickets: OMN-8917, OMN-12573, OMN-15009, OMN-17888

name: Runtime Rebuild Trigger

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trigger-rebuild:
    name: Trigger node_redeploy Start
    if: github.event.pull_request.merged == true
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_RUNTIME_REBUILD_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-18200 AC3 -- 5 -> 15, and the number comes from a measurement rather
    # than from rounding up.
    #
    # WHAT WAS MEASURED. Step 7, "Set up CI Python environment", is BIMODAL, and
    # the ceiling was set as though it were always warm:
    #
    #   run 34673385741   4s      warm
    #   run 34669945527   4m01s   cold; job total 4m20s, i.e. 40s of headroom
    #   run 34669847808   3m56s   cold and CANCELLED at the ceiling with the step
    #                             still running, so its true cost is >= 3m56s and
    #                             was never observed
    #
    # WHY COLD IS NOT RARE. This job resolves Python through the shared CI env
    # (`shared-env-enabled: true`), whose directory is keyed by a digest that
    # includes the lockfile (`scripts/ci/ensure_ci_env.sh` -> `ci_env_digest.py`)
    # and which lives INSIDE each runner container at
    # `/home/runner/.cache/omni/ci-envs`. So every change to `uv.lock` invalidates
    # it on all 88 containers at once, and the first job on each container then
    # pays the full build. A release version bump does exactly that -- #3449 bumped
    # `dev` to 0.38.24 -- which is why the two cold runs above are adjacent in
    # time. Cold is therefore guaranteed after every bump, not an outlier.
    #
    # WHY NOT NARROW THE ENV INSTEAD, which is the obvious alternative and is
    # measured rather than dismissed. The publisher imports only `click`, `yaml`,
    # `pydantic` and `confluent_kafka`, all four in the main dependency group, so
    # passing `shared-env-install-args: --frozen --no-default-groups
    # --no-install-project` is available. Measured locally: it takes the
    # environment from 196 installed packages to 138, a 30% cut and nowhere near
    # enough to make a cold build fast, because the main group alone resolves to
    # those 138. And it would make the COMMON case worse: the digest keys on the
    # install args, so a narrower set is a DIFFERENT env directory that no other
    # job warms, converting today's 4s warm hit into a cold build on most runs.
    # Rejected on that basis.
    #
    # WHY 15. It covers the measured cold build with roughly 3x margin, which the
    # 5-minute ceiling did not cover at all. The cost of the larger number is
    # bounded and small: this job publishes one command and does no long-running
    # work, so when the env is warm it still finishes in seconds, and the only
    # case that holds a runner slot longer is the one that previously produced a
    # cancelled run and no classification at all.
    timeout-minutes: 15
    # Consumed by verify-lane-converged below: AC4 requires a
    # delivered-but-not-applied redeploy to surface on the SAME run that
    # published it, and only this job knows whether a command was published.
    outputs:
      published: ${{ steps.publish.outputs.published }}
      source_sha: ${{ steps.publish.outputs.source_sha }}
      runtime_lane: ${{ steps.publish.outputs.runtime_lane }}
      # OMN-18573. The convergence guard below resolves the deploy agent's
      # ACCEPTANCE of this exact command and measures the lane's budget from
      # that moment, so a queue upstream of the agent is no longer spent out of
      # the lane's clock. Empty when nothing was published; the guard reports
      # INDETERMINATE on an empty id rather than inventing a start time.
      correlation_id: ${{ steps.publish.outputs.correlation_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          separator: ","

      - name: Fetch authoritative CI bus lane overlay
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: dev
          path: .ci-bus-overlay
          persist-credentials: false
          sparse-checkout: |
            config/ci_bus_lanes.yaml
            src/omnimarket/nodes/node_redeploy_orchestrator/models/model_redeploy_start_command.py
          sparse-checkout-cone-mode: false

      - name: Fetch canonical deploy-path classifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omniclaude
          ref: main
          path: .deploy-gate-source
          persist-credentials: false
          sparse-checkout: |
            .github/actions/deploy-gate/validate_pr_deploy_required.py
          sparse-checkout-cone-mode: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          cache-key-prefix: uv-runtime-rebuild-trigger
          cache-enabled: "false"
          install-args: --frozen
          shared-env-enabled: "true"

      - name: Trigger node_redeploy if runtime change detected
        id: publish
        # All potentially attacker-controlled inputs (labels, base_ref, sha) are
        # passed through environment variables to prevent shell injection.
        env:
          # OMN-18012 — the dev control-bus lane declares
          # `security_protocol: SASL_PLAINTEXT` / `sasl_mechanism: SCRAM-SHA-256`
          # in omnimarket's config/ci_bus_lanes.yaml, which this job sparse-checks
          # out above. The publisher READS that declaration and refuses to
          # downgrade it, so a SASL lane with no credentials in the job env is a
          # hard failure rather than a silent plaintext publish. These are org
          # secrets with ALL visibility; they are the dev-lane SCRAM principal.
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          PR_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The triggering base branch decides the runtime lane; the merge
          # commit SHA is the exact ref node_redeploy rebuilds.
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          # Runner class is forwarded so the publisher can refuse a LAN publish
          # from GitHub-hosted compute by name, rather than failing 30 seconds
          # later on an unresolvable bootstrap host (OMN-17888).
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          uv run python scripts/trigger_rebuild_on_merge.py \
            --changed-files "$PR_CHANGED_FILES" \
            --labels "$PR_LABELS" \
            --base-branch "$PR_BASE_BRANCH" \
            --source-sha "$PR_MERGE_SHA" \
            --bus-lane "dev" \
            --bus-overlay ".ci-bus-overlay/config/ci_bus_lanes.yaml" \
            --consumer-model ".ci-bus-overlay/src/omnimarket/nodes/node_redeploy_orchestrator/models/model_redeploy_start_command.py" \
            --runtime-path-validator ".deploy-gate-source/.github/actions/deploy-gate/validate_pr_deploy_required.py" \
            --runner-environment "$CI_RUNNER_ENVIRONMENT" \
            --requested-by "gha/omnibase_infra/pr-$PR_NUMBER"

  # OMN-17888 AC4 — publication is not application.
  #
  # The publisher above proves a command reached the broker. It cannot prove the
  # lane ran it, and on 2026-09-06 that difference was the whole outage: five
  # commands were delivered and consumed (redeploy-start watermark 63 -> 68,
  # orchestrator consumer group LAG 0) while omninode-runtime-effects
  # dead-lettered the downstream prod-promotion-gate-evaluated event with
  # failure_class=no_dispatcher, and the dev lane never moved. Nothing went red.
  #
  # This job closes that gap on the same run: it waits a bounded window for the
  # lane to report the merge SHA as its running image revision, and fails when
  # it does not. The hourly dev-lane-staleness.yml is the standing surface; this
  # is the per-merge one.
  verify-lane-converged:
    name: Verify dev lane applied the redeploy
    needs: trigger-rebuild
    # Only when a command was actually published, and only for the dev lane. A
    # no-op trigger run has nothing to wait for, and merges to main target the
    # stability-test lane, which this guard deliberately does not read.
    if: >-
      needs.trigger-rebuild.outputs.published == 'true' &&
      needs.trigger-rebuild.outputs.runtime_lane == 'dev'
    # The lane's docker daemon is on the LAN; hosted compute cannot see it.
    # Unconditional self-hosted rather than the fork fallback the publisher
    # uses, because the checkout below is pinned to the trusted base ref, so no
    # fork-authored code executes on the fleet.
    #
    # OMN-18602: moved off `omnibase-deploy`. OMN-18408 split five probes onto
    # the verify class and deliberately left this one behind, "pending a
    # follow-up decision on the remainder". This is that decision, and the
    # measurement it was missing: over the 38 non-skipped executions between
    # 2026-09-15T22:49Z and 2026-09-17T15:39Z this job QUEUED a median 29.1
    # min, p90 75.8, max 101.3, with 18 of 38 over half an hour. Job
    # `created_at` is stamped when `needs` completes -- run 35223485518 has
    # `trigger-rebuild` finishing at 12:51:27Z, this job created at 12:51:28Z
    # and started at 13:42:01Z -- so that is runner queue, not dependency wait.
    #
    # The queue is spent BEFORE the derived budget below starts, so it never
    # corrupted a verdict. What it delayed was delivery: rule 24(b) fails
    # closed without a PASS receipt for the exact sha, so a 101-minute queue is
    # a 101-minute staging stall.
    #
    # THIS JOB WRITES NOTHING. It polls `check_dev_lane_staleness.py`, which
    # reads a `docker inspect` of the lane container and the deploy agent's
    # HTTP surface, then probes readiness. It needs the host's docker socket
    # and its `host.docker.internal` gateway, both of which the verify runners
    # carry; it never needed the private OMNI_HOME clone tree that is the
    # deploy runner's reason to exist.
    #
    # A SECOND `omnibase-deploy` RUNNER WAS REFUSED, not overlooked. That would
    # let two lane-mutating release-train jobs run at once, and a `concurrency`
    # group cannot prevent it: a concurrency group is scoped to ONE repository,
    # and the sibling reusable's copy of this job is called from omnimarket.
    # The single physical deploy runner is the only serialisation guard that
    # holds across repositories, so it keeps the two DEPLOY jobs and nothing
    # else.
    #
    # `host-201` is not decoration. `omnibase-verify` names a CLASS, and
    # omninode-mini-runner-1 and omninode-air-runner-1 carry it on other lab
    # hosts. A run placed there would not fail to schedule; it would report
    # this lane unreachable, which reads as a lane outage. Pinned by
    # tests/ci/test_verify_runner_runs_on_omn18408.py.
    runs-on: [self-hosted, omnibase-verify, host-201]
    # 25-minute convergence wait + margin.
    #
    # WHAT THAT 25 MINUTES COVERS, stated honestly rather than derived from a
    # number that measures something else. node_redeploy_orchestrator and
    # node_redeploy_deploy_effect each declare timeout_ms: 660000 (11 min).
    # That bounds ONE correlation's execution. It is NOT the end-to-end latency
    # from merge to lane, because the deploy effect is serial: it publishes one
    # rebuild-requested, then polls for completion until that same timeout, so N
    # correlations queued ahead of this merge cost at least N x 11 min before
    # this merge's command is even published to the agent.
    #
    # So this bound covers a lane whose effect queue is EMPTY, and cannot cover
    # a backlogged one. Measured 2026-09-10 (peer lane reading the control topic
    # offsets 95..125 against the agent's own job store): five stale
    # correlations occupied the effect from 07:06Z to 11:08Z, and the command
    # for a 07:37:40Z merge did not reach the agent's topic until 11:08:23Z --
    # 3h31m after this job's window had closed. Publish-to-accept, once a
    # command existed, was 268ms.
    #
    # The bound is deliberately NOT widened to chase that: no wall clock short
    # of hours would have caught it, and a longer wait holds the single
    # omnibase-deploy runner slot longer, which serializes the NEXT merge's
    # guard behind this one. The right fix is for the guard to read queue
    # position rather than wall clock, and the queue it needs to read is the
    # effect's. That is a design change, not a constant.
    # DERIVED, not chosen: converge --wait-timeout 25m + the declared
    # compose-dev settle budget (900s, config/lab_pass_settle_budget.yaml)
    # + RESERVED_TAIL_SECONDS 120s = 2520s = 42m. Asserted by
    # tests/ci/test_lab_pass_settle_budget.py, which also keeps it bounded
    # above so a wedged job is still visible (OMN-18436).
    timeout-minutes: 45
    steps:
      - name: Checkout the guard from the trusted base ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # NEVER the merge ref: a merged fork PR would put fork-authored code
          # on the self-hosted fleet. The base branch is repo-owned code.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # Repo invariant (tests/ci/test_ci_workflow_resilience.py): every job in
      # this workflow resolves Python through the shared CI env action, never
      # ad hoc. The guard itself is stdlib-only, but the invariant is about the
      # environment, not the dependency count.
      - name: Set up CI Python environment
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          cache-key-prefix: uv-dev-lane-staleness
          cache-enabled: "false"
          install-args: --frozen
          shared-env-enabled: "true"

      # OMN-17530 rule 24(a): the receipt carries the window it measured, so
      # the start is recorded before the convergence wait, not after it.
      - name: Record the lab-pass window start and claim a private receipt directory
        run: |
          set -euo pipefail
          echo "LAB_PASS_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          # OMN-18420. Every lab-pass path below used to be a FIXED absolute
          # path under /tmp, and every emitting job in this repository and in
          # the sibling reusable runs on the SAME `omnibase-deploy` host. A
          # `mkdir -p` on a directory that already exists is a no-op, so a
          # receipt.json left behind by an earlier job survived into the next
          # one. When that next job's emit did not overwrite it -- because the
          # probe feeding it failed, or the emit itself did -- the presence
          # assertion found the STALE file, passed, and upload-artifact
          # published it under THIS job's sha-keyed name.
          #
          # Measured: omnimarket run 35035178406 uploaded artifact 10424013456
          # named lab-pass-receipt-compose-dev-bc21f733... (an omnimarket
          # commit) whose payload declared sha a7ea64f5... -- an omnibase_infra
          # commit -- with a `deployed_revision` check citing
          # check_dev_lane_staleness.py, which is THIS workflow's emitter shape
          # and not the sibling one's. The delivery gate's name/payload
          # cross-check caught it, so the direction was safe; the cost is that
          # the sibling sha could never receipt PASS, and rule 24(b) then
          # refuses that sha for staging.
          #
          # RUNNER_TEMP alone is not enough: a self-hosted runner reuses it
          # across jobs. The run id, the attempt and the job name together name
          # exactly one execution, and the `rm -rf` is what makes the claim
          # true rather than merely likely.
          LAB_PASS_WORK="${RUNNER_TEMP}/lab-pass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "${LAB_PASS_WORK}"
          mkdir -p "${LAB_PASS_WORK}/receipt"
          echo "LAB_PASS_DIR=${LAB_PASS_WORK}/receipt" >> "$GITHUB_ENV"
          echo "LAB_PASS_CHECKS=${LAB_PASS_WORK}/checks.json" >> "$GITHUB_ENV"

      # OMN-18388: this waits for the lane to report a revision that CONTAINS
      # the merge sha, not one byte-equal to it. The deploy agent rebuilds from
      # whatever dev head is current when it gets to the job, so on a busy
      # branch the lane converges onto a DESCENDANT and byte equality reported
      # that as never-applied. The stale direction (an ancestor) is unchanged
      # and still fails, and so does a revision dev does not contain.
      # OMN-18573: the 25 minutes below is the LANE's budget and is measured
      # from the moment the deploy agent ACCEPTS the rebuild command, not from
      # when this step starts. The redeploy-start effect is serial, so the wait
      # between the merge and the agent taking the command is a queue the lane
      # is not responsible for; spending the lane's budget on it produced a
      # FAIL receipt for a lane that converged three minutes later, twice
      # (OMN-17214, 2026-09-16 and 2026-09-17, receipt artifact 10496150688).
      #
      # `--wall-clock-seconds` is a BOUND on how long THIS step may watch, not
      # the budget: the ceiling less the elapsed time, the lane's declared
      # settle budget and the reserved tail, derived by the same fail-closed
      # reader the probe uses. When the bound is what stops the wait, or when
      # the acceptance cannot be established at all, the guard reports
      # INDETERMINATE and says which -- never a FAIL asserting the lane
      # misbehaved. The receipt is still non-PASS either way, so rule 24(b)
      # stays closed. Nothing here widens the ceiling.
      - name: Wait for the dev lane to report a revision containing the merge SHA
        id: converge
        # The guard exits 3 for INDETERMINATE, which is non-zero and must not
        # abort the job before the receipt is written. The emit step below
        # reads this step's `verdict` OUTPUT, which carries all three values;
        # `continue-on-error` keeps the run alive to produce the artifact and
        # the verdict is what decides the check.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ needs.trigger-rebuild.outputs.source_sha }}
          CORRELATION_ID: ${{ needs.trigger-rebuild.outputs.correlation_id }}
          # The deploy agent's own HTTP surface on this host, the same one
          # `fetch_lab_overlay_record.py` already reads from this runner class.
          # Its /job/<correlation_id> endpoint serves the acceptance timestamp.
          DEPLOY_AGENT_URL: http://host.docker.internal:8098
          JOB_TIMEOUT_MINUTES: 45
          RESERVED_TAIL_SECONDS: 120
        run: |
          set -euo pipefail
          STARTED_EPOCH=$(date -u -d "${LAB_PASS_STARTED_AT}" +%s 2>/dev/null \
            || python3 -c "import datetime,os;print(int(datetime.datetime.strptime(os.environ['LAB_PASS_STARTED_AT'],'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.UTC).timestamp()))")
          ELAPSED=$(( $(date -u +%s) - STARTED_EPOCH ))

          # Derived by a tested Python step, never shell arithmetic, and
          # fail-closed: an unresolvable declaration exits non-zero and prints
          # nothing, so a partial capture cannot become a guessed bound.
          CONVERGE_WALL_CLOCK=$(uv run python scripts/ci/lane_settle_budget.py \
            --lane compose-dev \
            --converge-wall-clock \
            --job-ceiling-seconds "$(( JOB_TIMEOUT_MINUTES * 60 ))" \
            --elapsed-seconds "$ELAPSED" \
            --reserved-tail-seconds "$RESERVED_TAIL_SECONDS")
          echo "converge wall clock: ${CONVERGE_WALL_CLOCK}s"

          uv run python scripts/ci/check_dev_lane_staleness.py \
            --expect-revision "$MERGE_SHA" \
            --wait-timeout 25m \
            --poll-interval 60s \
            --agent-url "$DEPLOY_AGENT_URL" \
            --correlation-id "$CORRELATION_ID" \
            --wall-clock-seconds "$CONVERGE_WALL_CLOCK"

      # OMN-17530 rule 24(a) -- the .201 compose dev lane's half of the
      # automatic lab pass.
      #
      # The convergence guard above proves the lane is RUNNING the merge sha.
      # That is the deployed-revision check and nothing more; it says nothing
      # about whether what is running works. These probes add the readiness and
      # health-dimension reads an integration pass makes by hand, and the
      # receipt records both together, keyed by the sha, so the fact survives
      # the run.
      #
      # WHAT THIS RECEIPT COVERS, corrected 2026-09-20 (OMN-18866). Until then
      # this comment said migrations applied, consumer-group lag and a
      # delegation golden chain "all need database or broker access this job
      # does not have". That was true of the `omnibase-deploy` runner and is
      # false of the `omnibase-verify` runner OMN-18602 moved this job to, so
      # all three are wired in the steps above and
      # scripts/ci/lab_pass_receipt.py's PROBES_NOT_YET_WIRED is now empty.
      #
      # It is still not a hand-run integration pass. Rule 24(d) applies: the
      # lag check covers the lane's STANDALONE writer groups, derived from its
      # compose file, and not the contract auto-wired groups, which need a live
      # manifest read this job does not do. The delegation check is bound to
      # "a delegation reached a terminal for its own correlation", NOT to a
      # complete five-link chain proof, because link 5 has no leg in any probe
      # today (OMN-16964). Widening either means adding the probe AND the check
      # name in one change -- never the name alone.
      #
      # Rule 24(d) also applies and is not worked around here: the compose dev
      # lane has no onex-api and no RLS, so it cannot exercise tenant-scoped
      # paths at all, and no check below claims otherwise.
      # --- OMN-18866: the three integration subjects ------------------------
      #
      # The premise this job used to carry -- that these three probes need
      # database or broker access it does not have -- was TRUE of the
      # `omnibase-deploy` runner and is FALSE of the `omnibase-verify` runner
      # OMN-18602 moved it to. Re-measured 2026-09-20 from inside
      # `omninode-verify-runner-1`, with the control pair rule 16 asks for:
      # the lane's postgres and broker ports CONNECT (curl exit 52) while the
      # then-down runtime port REFUSES (curl exit 7), so "unreachable" has a
      # distinguishable signature and neither dependency produced it.
      #
      # Everything below is READ-ONLY. Nothing starts, stops or recreates.

      - name: Derive this lane's declared writer consumer groups
        id: groups
        if: always()
        run: |
          set -euo pipefail
          # Derived from the lane's OWN compose file, which is the minting
          # authority for a standalone writer's group id, by the module that
          # already owns that derivation. A second derivation here would be a
          # second declaration free to disagree with the first, which is the
          # whole of the OMN-15837 defect that module exists to end.
          #
          # It exits 2 on an empty result rather than printing nothing: an
          # empty group list read as "no lag to check" is how a probe reports
          # green on a lane it never looked at.
          GROUPS=$(cd scripts/runtime_build && uv run python declared_consumer_groups.py \
            --compose ../../docker/docker-compose.dev-lane.yml \
            --env local | paste -sd, -)
          echo "declared writer groups: ${GROUPS}"
          echo "groups=${GROUPS}" >> "$GITHUB_OUTPUT"

      - name: Take the earlier consumer-lag sample
        if: always()
        env:
          DEV_LANE_BROKER_CONTAINER: omnibase-infra-redpanda
          # The broker's INTERNAL listener, addressed from inside its own
          # container -- the same form `verify_stability_refresh.py` already
          # uses for `rpk cluster health`, not the published host port.
          DEV_LANE_BROKER_ADDRESS: redpanda:9092
          # The lane declares SASL_PLAINTEXT / SCRAM-SHA-256 (OMN-18012), so a
          # group read needs a credential. These are the SAME org secrets the
          # sibling `trigger-rebuild` job above already uses, so no new
          # credential surface is created here. They are passed by VARIABLE
          # NAME to the probe, never on a command line: a credential in argv is
          # a credential in the process listing.
          KAFKA_SASL_MECHANISM: SCRAM-SHA-256
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          DECLARED_GROUPS: ${{ steps.groups.outputs.groups }}
        run: |
          set -euo pipefail
          # BEFORE the convergence wait would be better still, but the lane is
          # mid-recreate then and a reading taken against a restarting consumer
          # is not a baseline. Taken here instead, before the settle wait, so
          # the two samples straddle the lane's boot rather than being two
          # reads a millisecond apart.
          #
          # This never fails the job. A baseline that could not be taken means
          # the growth arm has nothing to compare against, and the check SAYS
          # it did not measure growth. Failing here would turn a missing
          # baseline into a missing RECEIPT, which is strictly worse.
          uv run python scripts/ci/lab_pass_receipt.py sample-lag \
            --broker-container "$DEV_LANE_BROKER_CONTAINER" \
            --broker-address "$DEV_LANE_BROKER_ADDRESS" \
            --consumer-groups "$DECLARED_GROUPS" \
            --out "${LAB_PASS_DIR}/lag-sample.json"

      - name: Fetch the declared CI bus lanes
        if: always()
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: dev
          path: .ci-bus-overlay
          persist-credentials: false
          sparse-checkout: |
            config/ci_bus_lanes.yaml
          sparse-checkout-cone-mode: false

      - name: Fire one live delegation through the deployed lane ingress
        if: always()
        continue-on-error: true
        env:
          # 8090, the lane's onex-api, NOT 8085. That route carries a tenant;
          # the tenant-less ingress produced chains whose every event the
          # delegation projection writer refused fail-closed (OMN-18421).
          GATEWAY_URL: http://host.docker.internal:8090
          CHAIN_CANARY_GATEWAY_API_KEY: ${{ secrets.CHAIN_CANARY_GATEWAY_API_KEY }}
          BUS_LANE: dev
          # This job's runner carries no OMNI_HOME clone, so the omnimarket
          # drift guard the canary workflow has to override cannot fire here.
          # The override is deliberately NOT copied: adding it would suppress a
          # real warning on a path that does not need it.
        run: |
          set -uo pipefail
          # NOT `set -e`. A non-zero dispatch is itself a finding and must
          # still leave a receipt for the probe to grade; an absent receipt is
          # reported as INDETERMINATE (a fact about this step) rather than as a
          # lane failure, which is a different claim.
          #
          # Fail-closed by construction: load_lane_transport RAISES on a
          # missing lane, an in-memory lane, an undeclared protocol or a broker
          # that is itself a host alias. It never returns a default.
          uv run python -c "
          import os, pathlib
          from omnibase_infra.nodes.node_chain_canary_effect.lane_transport import (
              lane_transport_env, load_lane_transport,
          )
          transport = load_lane_transport(
              pathlib.Path('.ci-bus-overlay/config/ci_bus_lanes.yaml'),
              os.environ['BUS_LANE'],
          )
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in lane_transport_env(transport).items():
                  handle.write(f'{key}={value}\n')
          " || {
            echo "::warning::lane transport unresolved; the delegation check will report INDETERMINATE"
            exit 0
          }
          # The NAME is safe to print and is the one thing worth printing.
          echo "gateway key var: CHAIN_CANARY_GATEWAY_API_KEY"
          uv run onex skill chain_canary \
            --gateway-url "${GATEWAY_URL}" \
            --gateway-api-key-env CHAIN_CANARY_GATEWAY_API_KEY \
            --task-type test \
            --budget-ms 120000 \
            --terminal-bootstrap-servers "${KAFKA_BOOTSTRAP_SERVERS:-}" \
            --quarantine-bootstrap-servers "${KAFKA_BOOTSTRAP_SERVERS:-}" \
            > "${LAB_PASS_DIR}/chain-canary-receipt.json"

      - name: Probe the dev lane
        id: probe
        if: always()
        env:
          # Must equal this job's own `timeout-minutes`, and the settle budget
          # below is derived from it. A tail is reserved for the three probe
          # reads, the emit step and the artifact upload, so the settle wait can
          # never consume the time the receipt needs to be WRITTEN -- an
          # unwritten receipt is the one outcome worse than a failing one.
          # Must equal this job's own `timeout-minutes`, which is DERIVED from the
          # declared parts (converge 25m + declared settle 900s + this tail) and
          # asserted by tests/ci/test_lab_pass_settle_budget.py.
          JOB_TIMEOUT_MINUTES: 45
          RESERVED_TAIL_SECONDS: 120
          # The container whose generation binds these HTTP reads to the one the
          # convergence guard verified. Empty CONVERGE_GENERATION means the
          # guard published none, which FAILS the binding check rather than
          # skipping it.
          DEV_LANE_CONTAINER: omninode-runtime
          CONVERGE_GENERATION: ${{ steps.converge.outputs.generation }}
          # `host.docker.internal`, NOT `localhost`. This job runs on the
          # lane's host's docker DAEMON, not in the host's network namespace:
          # the `omnibase-deploy` runner is a container
          # (`omninode-deploy-runner`, `NetworkMode=docker_default`) with
          # `/var/run/docker.sock` bind-mounted. The socket is why the
          # `docker inspect` revision read above works; the bridge network is
          # why an HTTP probe of `localhost` reaches the runner container and
          # nothing else.
          #
          # Measured 2026-09-10 with a positive control on both halves: from
          # the .201 host shell both `:8085/ready` and `:8086/ready` answer
          # 200; from inside `omninode-deploy-runner` the same two URLs answer
          # 000 (Errno 111, connection refused) while the
          # `host.docker.internal` forms answer 200. Every compose-dev receipt
          # emitted before this change carried three identical Errno 111
          # failures and none was ever a PASS.
          #
          # `omnibase-deploy` is the one runner carrying the host-gateway
          # alias (`docker/docker-compose.runners.yml` `extra_hosts`), which is
          # the same reason `chain-canary.yml` — same runner label — probes the
          # lane ingress at `http://host.docker.internal:8085`. Still no LAN
          # address committed: the alias resolves to the docker bridge gateway,
          # where the lane's ports are published.
          DEV_LANE_MAIN_URL: http://host.docker.internal:8085
          DEV_LANE_EFFECTS_URL: http://host.docker.internal:8086
          # OMN-18387: the omnimarket-projection-api container, published on
          # the same host as main/effects above via the same mechanism.
          # Reachability confirmed live 2026-09-15 from inside this same
          # runner image with the same positive control used above:
          # `curl http://host.docker.internal:3002/projections` -> HTTP_200.
          DEV_LANE_PROJECTION_URL: http://host.docker.internal:3002
          # OMN-18866. The three integration subjects.
          #
          # The database is read through the DOCKER SOCKET (`docker exec ...
          # psql`), not over TCP, so this needs no network credential at all --
          # inside the container the connection is trusted. That is the
          # smallest authority that answers the question, and it is the same
          # mechanism the generation read above already uses for
          # `docker inspect`.
          DEV_LANE_POSTGRES_CONTAINER: omnibase-infra-postgres
          DEV_LANE_POSTGRES_DATABASE: omnibase_infra
          DEV_LANE_BROKER_CONTAINER: omnibase-infra-redpanda
          DEV_LANE_BROKER_ADDRESS: redpanda:9092
          # A BOUND, and deliberately a generous one, because the bound is the
          # weaker of the lag check's two arms. OMN-18851's writer sat at 498
          # for nine days: a bound tight enough to have flagged that would also
          # flag every healthy busy group, and an alarm that fires on healthy
          # groups is an alarm that gets muted. The arm that catches a stopped
          # consumer is GROWTH across the two samples, which is scale-free and
          # needs no number here at all. This bound exists to catch the
          # different failure of a group that is enormously behind and stays
          # there across both reads.
          DEV_LANE_MAX_CONSUMER_LAG: "10000"
          DECLARED_GROUPS: ${{ steps.groups.outputs.groups }}
          KAFKA_SASL_MECHANISM: SCRAM-SHA-256
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "${LAB_PASS_DIR}"

          # SETTLE BUDGET = THE LANE'S DECLARED BOOT BUDGET (OMN-18436).
          #
          # A convergence success hands this step a lane that has JUST been
          # recreated: check_dev_lane_staleness.py returns the moment the
          # RUNNING container carries the expected revision LABEL, and that
          # label is set at create time, not when the runtime has bound its
          # port. Measured on run 34478680748 -- convergence 13:12:28.544Z,
          # probe 13:12:28.718Z, first Errno 111 at 13:12:28.826Z. 174ms.
          #
          # The budget WAS this job's ceiling minus elapsed, and that was wrong
          # in a way that cost real deliveries. The three constants this job
          # declares could not all hold: a 30-minute ceiling, a 25-minute
          # convergence wait and a 120-second tail leave 180 seconds against a
          # lane boot measured at 463-668 seconds, so every convergence slower
          # than about twenty minutes FAILED the receipt on timing alone -- on a
          # healthy lane running the merged sha -- and rule 24(b) then refused
          # that sha for staging.
          #
          # The budget is now DECLARED per lane in
          # config/lab_pass_settle_budget.yaml, bounded below by the worst boot
          # observed on this lane and above by the lane's own compose
          # start_period, and THIS JOB'S CEILING IS DERIVED FROM IT
          # (converge + settle + tail), asserted by
          # tests/ci/test_lab_pass_settle_budget.py. The ceiling below is a
          # consequence of that arithmetic, not a knob.
          #
          # This step passes the ceiling and the elapsed time so the probe can
          # say whether the job could AFFORD the declared budget. It never
          # passes a remainder, and there is no fallback to one: an unresolved
          # declaration exits non-zero.
          STARTED_EPOCH=$(date -u -d "${LAB_PASS_STARTED_AT}" +%s 2>/dev/null \
            || python3 -c "import datetime,os;print(int(datetime.datetime.strptime(os.environ['LAB_PASS_STARTED_AT'],'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.UTC).timestamp()))")
          ELAPSED=$(( $(date -u +%s) - STARTED_EPOCH ))

          # The derivation is a tested Python step, not shell arithmetic. It
          # exits non-zero and prints nothing on stdout when the declaration
          # cannot be resolved, so a partial capture cannot become a guessed
          # budget.
          SETTLE_BUDGET_JSON=$(uv run python scripts/ci/lane_settle_budget.py \
            --lane compose-dev \
            --job-ceiling-seconds "$(( JOB_TIMEOUT_MINUTES * 60 ))" \
            --elapsed-seconds "$ELAPSED" \
            --reserved-tail-seconds "$RESERVED_TAIL_SECONDS")
          echo "settle budget: ${SETTLE_BUDGET_JSON}"

          # OMN-18866. Each of the three integration subjects below is
          # supplied, and supplying it IS the claim: the probe emits the check
          # and is held to it. There is no flag that names a subject and then
          # skips its check.
          uv run python scripts/ci/lab_pass_receipt.py probe-lane \
            --lane compose-dev \
            --main-url "$DEV_LANE_MAIN_URL" \
            --effects-url "$DEV_LANE_EFFECTS_URL" \
            --projection-url "$DEV_LANE_PROJECTION_URL" \
            --settle-budget-json "$SETTLE_BUDGET_JSON" \
            --generation-container "$DEV_LANE_CONTAINER" \
            --expect-generation "$CONVERGE_GENERATION" \
            --migration-container "$DEV_LANE_POSTGRES_CONTAINER" \
            --migration-database "$DEV_LANE_POSTGRES_DATABASE" \
            --forward-migrations-dir docker/migrations/forward \
            --broker-container "$DEV_LANE_BROKER_CONTAINER" \
            --broker-address "$DEV_LANE_BROKER_ADDRESS" \
            --consumer-groups "$DECLARED_GROUPS" \
            --max-consumer-lag "$DEV_LANE_MAX_CONSUMER_LAG" \
            --first-lag-sample-json "${LAB_PASS_DIR}/lag-sample.json" \
            --chain-canary-receipt "${LAB_PASS_DIR}/chain-canary-receipt.json" \
            > "${LAB_PASS_CHECKS}"
          cat "${LAB_PASS_CHECKS}"

      # if: always() on emit and upload for the same reason the boot gate does
      # it: a FAILED lab pass is the record the gate needs in order to tell
      # "it failed" apart from "nobody ran it". The emit step exits non-zero on
      # a FAIL receipt, so the failure stays visible on this run.
      - name: Emit the compose-dev lab-pass receipt
        if: always()
        env:
          MERGE_SHA: ${{ needs.trigger-rebuild.outputs.source_sha }}
          # OMN-18573. The receipt's typed agent_command_id, which every
          # compose-dev receipt carried as null because no emitter passed it.
          # The id was knowable the whole time; the readback that found this had
          # it legible in the deployed_revision evidence string while the field
          # a machine reads sat empty. Empty here means no command was
          # published, which the emitter records as null rather than as "".
          CORRELATION_ID: ${{ needs.trigger-rebuild.outputs.correlation_id }}
          CONVERGE_OUTCOME: ${{ steps.converge.outcome }}
          # OMN-18573. The guard's own three-valued verdict -- pass, fail or
          # indeterminate. It is an OUTPUT rather than the step's status
          # because the status has two values and this has three, and the
          # difference is the whole ticket: "the lane did not converge" and "we
          # could not establish whether it had a chance to" are different
          # findings and a fail-closed gate must say which it refused on. The
          # status remains the fallback for a step that died before writing
          # anything.
          CONVERGE_VERDICT: ${{ steps.converge.outputs.verdict }}
          # OMN-18388 AC2. The guard writes one line naming the revision the lane
          # was actually observed at and how it relates to the merge sha
          # ("lane at 0d0250a6c31f, which contains merge sha 18b539f0f76f, 6
          # commit(s) ahead on dev"). The static string it replaces was identical
          # on every run and named neither, so a reader of a FAIL receipt could
          # not tell a lane that had run a newer dev head containing the change
          # from one that never applied it -- which is exactly the confusion that
          # produced this ticket.
          #
          # Passed through env and dereferenced in the shell, never interpolated
          # into the run block: an expression-substituted value in a script body
          # is the workflow script-injection shape.
          CONVERGE_EVIDENCE: ${{ steps.converge.outputs.evidence }}
          # OMN-18143. The deploy agent now runs the NEWEST foldable rebuild
          # command for the lane and records the ones it replaced. Convergence
          # is containment (OMN-18388), so a superseded sha's guard sees the
          # lane running a descendant and reports `ok` -- a true statement
          # about the LANE, and not a statement that THIS sha's tree was ever
          # built. Without this check that difference reaches no receipt, and
          # rule 24(b) would deliver a commit whose compose content the lane
          # never generated on the strength of a pass earned by another
          # commit. The guard writes all three outputs on every run; an empty
          # outcome means it died before deciding.
          SUPERSEDED_OUTCOME: ${{ steps.converge.outputs.superseded_outcome }}
          SUPERSEDED_EVIDENCE: ${{ steps.converge.outputs.superseded_evidence }}
        run: |
          set -euo pipefail
          # The fallback covers the step dying before it could write its output
          # (a crash, or the job being cancelled mid-poll). A receipt check with
          # an empty evidence field is refused by ModelLabPassCheck, so the
          # receipt would not be written at all -- and an unwritten receipt is
          # the one outcome worse than a failing one.
          if [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            SAFE_MERGE_SHA="$MERGE_SHA"
          else
            SAFE_MERGE_SHA="<invalid-merge-sha>"
          fi
          case "$CONVERGE_VERDICT" in
            pass|fail|indeterminate)
              DEPLOYED_REVISION_VERDICT="$CONVERGE_VERDICT"
              ;;
            *)
              # The guard wrote no verdict, so it died before reaching its own
              # decision -- a crash, or the job being cancelled mid-poll. That
              # is not a statement about the lane either, so it is
              # INDETERMINATE rather than a FAIL, and the evidence says the
              # guard never got to a verdict. The receipt is still non-PASS.
              DEPLOYED_REVISION_VERDICT=indeterminate
              CONVERGE_EVIDENCE="INDETERMINATE: the convergence guard ended ${CONVERGE_OUTCOME} without writing a verdict, so no deployed-revision fact was established for ${SAFE_MERGE_SHA}"
              ;;
          esac
          # The receipt vocabulary spells a passing check 'ok'; the guard's own
          # vocabulary spells it 'pass'. One translation, here, rather than two
          # enums that can drift.
          if [[ "$DEPLOYED_REVISION_VERDICT" == "pass" ]]; then
            DEPLOYED_REVISION_VERDICT=ok
          fi
          EVIDENCE="${CONVERGE_EVIDENCE:-check_dev_lane_staleness.py --expect-revision ${SAFE_MERGE_SHA} against the omnibase-infra compose project (the guard wrote no evidence)}"
          # The same fallback the deployed-revision check takes, and for the
          # same reason: a guard that died before writing its verdict
          # established nothing, which is INDETERMINATE rather than a pass.
          # An empty evidence field is refused by ModelLabPassCheck, so the
          # receipt would not be written at all.
          case "$SUPERSEDED_OUTCOME" in
            ok|fail|indeterminate) ;;
            *)
              SUPERSEDED_OUTCOME=indeterminate
              SUPERSEDED_EVIDENCE="INDETERMINATE: the convergence guard ended ${CONVERGE_OUTCOME} without saying whether ${SAFE_MERGE_SHA} was superseded by a newer rebuild"
              ;;
          esac
          uv run python scripts/ci/lab_pass_receipt.py emit \
            --sha "$MERGE_SHA" \
            --lane compose-dev \
            --started-at "${LAB_PASS_STARTED_AT}" \
            --finished-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --check "deployed_revision:${DEPLOYED_REVISION_VERDICT}:${EVIDENCE}" \
            --check "superseded_by_newer_rebuild:${SUPERSEDED_OUTCOME}:${SUPERSEDED_EVIDENCE}" \
            --checks-json "${LAB_PASS_CHECKS}" \
            --agent-command-id "${CORRELATION_ID}" \
            --out "${LAB_PASS_DIR}/receipt.json"

      # OMN-18247: the zero-byte case `if-no-files-found: error` cannot see,
      # since the directory matches whether or not the receipt carries bytes.
      - name: Assert the compose-dev lab-pass receipt is present and non-empty
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/ci/assert_evidence_artifact.py \
            --artifact lab-pass-receipt-compose-dev \
            --require "${LAB_PASS_DIR}/receipt.json"

      # OMN-18420: presence is not identity. A receipt left on this host by an
      # earlier job satisfies the assertion above exactly as well as a fresh
      # one, and the upload below keys the artifact by THIS job's sha -- so a
      # stale file is published under a sha it says nothing about. The
      # consuming gate in the delivering repository catches the disagreement,
      # but an hour later and in another repo's logs. This asserts it here.
      - name: Assert the compose-dev receipt on disk is this job's own
        if: always()
        env:
          MERGE_SHA: ${{ needs.trigger-rebuild.outputs.source_sha }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/lab_pass_receipt.py verify \
            --path "${LAB_PASS_DIR}/receipt.json" \
            --sha "$MERGE_SHA" \
            --lane compose-dev
      - name: Upload the compose-dev lab-pass receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The NAME is the key scripts/ci/lab_pass_receipt.py's gate queries
          # by; it must match artifact_name() exactly.
          name: lab-pass-receipt-compose-dev-${{ needs.trigger-rebuild.outputs.source_sha }}
          path: ${{ env.LAB_PASS_DIR }}
          retention-days: 90
          if-no-files-found: error

  # OMN-18200 AC5/AC6/AC7 -- the k3s onex-lab overlay's half of rule 24(a).
  #
  # THE DEFECT THIS CLOSES. Rule 24(a) states that every runtime-affecting merge
  # re-applies the k3s `onex-lab` overlay from the merged head and emits a
  # lab-pass receipt for it. Measured 2026-09-11, that half had no implementation
  # at all: omninode_infra's k8s/onex-lab/apply_lab_lane.sh had ZERO callers
  # anywhere in the org. The persistent lab lane -- the one provider_key_chain.sh
  # and the three m3 chain runners grade against -- was pinned to an image stamped
  # 2026-09-08 running omnimarket==0.4.30 while dev was at 0.4.61, and this
  # workflow reported green over it the whole time.
  #
  # WHERE THE WORK HAPPENS, AND WHY NOT HERE. The apply needs host root on the lab
  # host: the k3s admin kubeconfig is 0600 root and pinning an image into the
  # `onex-lab/` name space means importing it into a root-owned containerd. The
  # runner fleet holds a READ-ONLY lab-ci-reader ServiceAccount kubeconfig
  # (OMN-18188) -- enough to read the lane, not to apply to it -- and could reach
  # host root only by launching a privileged container through the Docker socket,
  # which is a worse blast radius than using the process that already owns host
  # root by design. So deploy-agent-dev.service performs the apply, immediately
  # after the compose lane it just rebuilt is verified, and writes a sha-keyed
  # record (deploy_agent/lab_overlay.py).
  #
  # That also answers AC3's asynchronous gap for this lane without a wall clock:
  # the agent's own completion is the signal, not a timer started at publish.
  #
  # WHY THIS JOB EXISTS AT ALL, then: a GitHub Actions artifact can only be
  # created by a job inside a run, and the lab-pass surface is an artifact by
  # deliberate design (scripts/ci/lab_pass_receipt.py's header: no new credential,
  # no bucket, no cluster access). One writer of facts, one publisher of receipts.
  #
  # THE LANE VALUE IS `onex-lab-k3s`, NOT `onex-lab`. `onex-lab` is ALREADY the
  # ephemeral kind cluster the candidate-boot-gate job creates in
  # deliver-dev-candidate-to-staging.yml, which emits
  # lab-pass-receipt-onex-lab-<sha> for the same sha on this same repository.
  # evaluate_gate reads the NEWEST artifact per name, on the premise that a name
  # has one emitter; a second emitter on that name would silently supersede the
  # boot gate's verdict. They are also different claims -- a throwaway node with
  # one side-loaded image and an inert credential store, against the persistent
  # lane with the host's own secret store bound and the lane's tenant minted.
  verify-lab-overlay-converged:
    name: Verify the k3s onex-lab overlay applied the merged sha
    needs: [trigger-rebuild, verify-lane-converged]
    # `always()` so this runs even when the compose convergence guard FAILED. A
    # failed compose lane is exactly when the lab lane's state most needs
    # recording: "the lab apply failed" and "nobody ran it" are the two states
    # the receipt exists to tell apart, and skipping here produces the second
    # while meaning the first.
    if: >-
      always() &&
      needs.trigger-rebuild.outputs.published == 'true' &&
      needs.trigger-rebuild.outputs.runtime_lane == 'dev'
    # The agent's HTTP surface is on the lab host's LAN; hosted compute cannot
    # see it. Same reasoning as the convergence guard above -- the checkout is
    # pinned to the trusted base ref, so no fork-authored code runs on the
    # fleet -- but NOT the same label any more.
    #
    # OMN-18408: `omnibase-verify`. The convergence guard above stays on
    # `omnibase-deploy` by explicit operator scope; this job moved because its
    # 35-minute ceiling is the budget AC1 of OMN-18200 reads as the difference
    # between "converged" and "not verified", and queue time on a label whose
    # single member is also running the release-train deploy comes straight out
    # of it. The verify runner carries the same docker socket and the same
    # `host.docker.internal` gateway and no OMNI_HOME write mount, which is all
    # this job needs.
    # OMN-18408: `host-201` is REQUIRED alongside `omnibase-verify`, and is not
    # decoration. `omnibase-verify` names a runner CLASS (read-only probe
    # runner); it does not name a HOST. On 2026-09-16 a second verify-class
    # runner, omninode-mini-runner-1, came online on another lab host carrying
    # `self-hosted,omnibase-verify,arch-arm64` -- which makes it a legal match
    # for a bare `[self-hosted, omnibase-verify]`. This job probes the .201
    # lane's own docker daemon through that host's gateway alias, so a run
    # placed anywhere else cannot see the lane and reports it unreachable: a
    # permanently-red check is a disabled check. `host-201` is carried only by
    # the .201 verify runner, so the pair fails SAFE -- if that runner is down
    # the job queues rather than running somewhere it cannot observe anything.
    runs-on: [self-hosted, omnibase-verify, host-201]
    # The agent's apply carries its own 1500s budget (DEFAULT_APPLY_BUDGET_SECONDS)
    # and begins only after the compose rebuild it follows, so the poll window
    # below is the one that matters and this ceiling is that window plus a tail
    # for the emit and the upload. A job killed by timeout uploads NO receipt,
    # which is the single outcome worse than a failing one.
    timeout-minutes: 35
    steps:
      - name: Checkout the reader from the trusted base ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # NEVER the merge ref -- a merged fork PR would put fork-authored code
          # on the self-hosted fleet.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # Repo invariant (tests/ci/test_ci_workflow_resilience.py): every job in
      # this workflow resolves Python through the shared CI env action.
      - name: Set up CI Python environment
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          cache-key-prefix: uv-lab-overlay-receipt
          cache-enabled: "false"
          install-args: --frozen
          shared-env-enabled: "true"

      - name: Record the lab-pass window start and claim a private receipt directory
        run: |
          set -euo pipefail
          echo "LAB_PASS_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          # OMN-18420. Every lab-pass path below used to be a FIXED absolute
          # path under /tmp, and every emitting job in this repository and in
          # the sibling reusable runs on the SAME `omnibase-deploy` host. A
          # `mkdir -p` on a directory that already exists is a no-op, so a
          # receipt.json left behind by an earlier job survived into the next
          # one. When that next job's emit did not overwrite it -- because the
          # probe feeding it failed, or the emit itself did -- the presence
          # assertion found the STALE file, passed, and upload-artifact
          # published it under THIS job's sha-keyed name.
          #
          # Measured: omnimarket run 35035178406 uploaded artifact 10424013456
          # named lab-pass-receipt-compose-dev-bc21f733... (an omnimarket
          # commit) whose payload declared sha a7ea64f5... -- an omnibase_infra
          # commit -- with a `deployed_revision` check citing
          # check_dev_lane_staleness.py, which is THIS workflow's emitter shape
          # and not the sibling one's. The delivery gate's name/payload
          # cross-check caught it, so the direction was safe; the cost is that
          # the sibling sha could never receipt PASS, and rule 24(b) then
          # refuses that sha for staging.
          #
          # RUNNER_TEMP alone is not enough: a self-hosted runner reuses it
          # across jobs. The run id, the attempt and the job name together name
          # exactly one execution, and the `rm -rf` is what makes the claim
          # true rather than merely likely.
          LAB_PASS_WORK="${RUNNER_TEMP}/lab-pass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "${LAB_PASS_WORK}"
          mkdir -p "${LAB_PASS_WORK}/receipt"
          echo "LAB_PASS_DIR=${LAB_PASS_WORK}/receipt" >> "$GITHUB_ENV"
          echo "LAB_PASS_CHECKS=${LAB_PASS_WORK}/checks.json" >> "$GITHUB_ENV"

      - name: Read the deploy agent's onex-lab overlay record
        id: record
        if: always()
        env:
          MERGE_SHA: ${{ needs.trigger-rebuild.outputs.source_sha }}
          # `host.docker.internal`, NOT `localhost`. This job runs in the
          # omninode-verify-runner-1 CONTAINER on the lab host (OMN-18408; it
          # was the deploy runner before the split), not in the host's network
          # namespace, and that runner carries the host-gateway alias
          # (docker/docker-compose.runners.yml extra_hosts) --
          # the same reason the compose-dev probe above and chain-canary.yml use
          # this form. The dev-lane deploy agent listens on 0.0.0.0:8098; the
          # prod-pinned unit holds 8099 and is deliberately not read here.
          # No LAN address is committed: the alias resolves to the docker bridge
          # gateway.
          LAB_AGENT_URL: http://host.docker.internal:8098
          # OMN-18399: the descendant-tolerance fallback's `gh api compare`
          # calls, same token and same pattern as the compose-dev guard above
          # (verify-lane-converged's "Wait for the dev lane..." step) -- no new
          # credential.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${LAB_PASS_DIR}"
          uv run python scripts/ci/fetch_lab_overlay_record.py \
            --sha "$MERGE_SHA" \
            --agent-url "$LAB_AGENT_URL" \
            --repo "${{ github.repository }}" \
            --wait-seconds 1800 \
            --poll-interval-seconds 30 \
            --out "${LAB_PASS_CHECKS}"
          cat "${LAB_PASS_CHECKS}"

      # if: always() on emit and upload, for the reason both other emitters state:
      # a FAILED lab pass is exactly as worth recording as a passing one. The emit
      # step exits non-zero on a FAIL receipt, so AC6's red signal lands on this
      # run rather than waiting for somebody to probe a pod.
      - name: Emit the onex-lab-k3s lab-pass receipt
        if: always()
        env:
          MERGE_SHA: ${{ needs.trigger-rebuild.outputs.source_sha }}
          # OMN-18573. This lane's apply IS performed by the deploy agent as
          # part of ONE rebuild correlation (OMN-18200), which is what the
          # receipt model's own docstring says distinguishes it from the
          # `onex-lab` boot gate — and the boot gate is the emitter that
          # correctly carries none. So this receipt owes the id too.
          CORRELATION_ID: ${{ needs.trigger-rebuild.outputs.correlation_id }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/lab_pass_receipt.py emit \
            --sha "$MERGE_SHA" \
            --lane onex-lab-k3s \
            --started-at "${LAB_PASS_STARTED_AT}" \
            --finished-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --checks-json "${LAB_PASS_CHECKS}" \
            --agent-command-id "${CORRELATION_ID}" \
            --out "${LAB_PASS_DIR}/receipt.json"

      # OMN-18247: same zero-byte gap as the compose-dev receipt above.
      - name: Assert the onex-lab-k3s lab-pass receipt is present and non-empty
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/ci/assert_evidence_artifact.py \
            --artifact lab-pass-receipt-onex-lab-k3s \
            --require "${LAB_PASS_DIR}/receipt.json"

      # OMN-18420: the same identity assertion the compose-dev emitter above
      # carries, for the same reason -- this job shares a host with that one.
      - name: Assert the onex-lab-k3s receipt on disk is this job's own
        if: always()
        env:
          MERGE_SHA: ${{ needs.trigger-rebuild.outputs.source_sha }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/lab_pass_receipt.py verify \
            --path "${LAB_PASS_DIR}/receipt.json" \
            --sha "$MERGE_SHA" \
            --lane onex-lab-k3s
      - name: Upload the onex-lab-k3s lab-pass receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The NAME is the key scripts/ci/lab_pass_receipt.py's gate queries by;
          # it must match artifact_name(EnumLabLane.ONEX_LAB_K3S, sha) exactly.
          name: lab-pass-receipt-onex-lab-k3s-${{ needs.trigger-rebuild.outputs.source_sha }}
          path: ${{ env.LAB_PASS_DIR }}
          retention-days: 90
          if-no-files-found: error
