      - name: Check compose :? env var fixture coverage
        run: |
          echo "================================================================"
          echo "Compose Required-Env Coverage Guard (OMN-5439)"
          echo "Every :?-required var in compose must be in test fixture dict"
          echo "================================================================"
          uv run pytest tests/ci/test_compose_required_env_coverage.py -v --tb=short

  # Contract path pre-flight: verify all referenced module paths exist before expensive test splits (F8/OMN-6478)
  contract-path-preflight:
    needs: occ-preflight
    timeout-minutes: 30
    name: Contract Path Pre-Flight
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify all referenced contract paths exist
        run: |
          WARNINGS=0
          SKIPPED=0
          CHECKED=0
          # Find all contract.yaml files and verify referenced module paths
          for contract in $(find src/ -name "contract.yaml" -o -name "*.contract.yaml" 2>/dev/null); do
            # Extract module paths from contract YAML (lines like "  module: some.module.path")
            MODULES=$(grep -E '^\s+module:' "$contract" | sed 's/.*module:\s*"\?\([^"]*\)"\?/\1/' || true)
            for mod in $MODULES; do
              # Only validate modules within this repo (omnibase_infra).
              # Cross-repo references (omnibase_core, omnibase_spi, etc.) are
              # external dependencies and cannot be validated locally.
              case "$mod" in
                omnibase_infra.*)
                  CHECKED=$((CHECKED + 1))
                  MOD_PATH=$(echo "$mod" | tr '.' '/')
                  if [ ! -f "src/${MOD_PATH}.py" ] && [ ! -f "src/${MOD_PATH}/__init__.py" ]; then
                    echo "::error file=${contract}::Contract references module '${mod}' but neither src/${MOD_PATH}.py nor src/${MOD_PATH}/__init__.py exists"
                    WARNINGS=$((WARNINGS + 1))
                  fi
                  ;;
                *)
                  SKIPPED=$((SKIPPED + 1))
                  ;;
              esac
            done
          done
          echo "Contract path pre-flight: ${CHECKED} local modules checked, ${WARNINGS} dead references, ${SKIPPED} cross-repo references skipped"
          if [ "$WARNINGS" -gt "0" ]; then
            echo "Contract path pre-flight FAILED: ${WARNINGS} dead module reference(s)"
            exit 1
          fi

  contract-sync-gate:
    needs: occ-preflight
    timeout-minutes: 30
    name: Contract Sync Gate (Wave C) [OMN-8915]
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    if: needs.occ-preflight.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install gh CLI
        run: |
          type gh || (apt-get update -qq && apt-get install -y -qq gh)

      - name: Run contract-sync gate
        run: |
          PR="${{ github.event.pull_request.number || github.event.merge_group.head_sha }}"
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            echo "No PR number available — skipping in merge_group context"
            exit 0
          fi
          bash scripts/validate-pr-contract-sync.sh "$PR"
        env:
          GH_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------------------
  # Phase 1.6 - Detect Changes (OMN-10715)
  # ---------------------------------------------------------------------------
  # Runs detect_test_paths and emits outputs for dynamic matrix shaping.
  # When ENABLE_SMART_TESTS is off (default), emits a 15-shard matrix with
  # full_suite_reason=FEATURE_FLAG_OFF so the full-suite pytest step runs.
  # When the flag is on and the change set is small, emits a smaller matrix
  # and selected_paths, activating the smart-selection pytest step instead.

  detect-changes:
    timeout-minutes: 30
    name: Detect Changes
    needs: [occ-preflight, lint, onex-validation, infra-node-handler-ownership, migration-freeze, fingerprint-check, demo-loop-gate, topic-enum-drift, topic-naming-lint, topic-drift-check, arch-invariants, schema-handshake, plugin-env-service-completeness, compose-required-env-coverage, contract-path-preflight, contract-sync-gate]
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    outputs:
      is_full_suite: ${{ steps.detect.outputs.is_full_suite }}
      full_suite_reason: ${{ steps.detect.outputs.full_suite_reason }}
      split_count: ${{ steps.detect.outputs.split_count }}
      matrix: ${{ steps.detect.outputs.matrix }}
      selected_paths: ${{ steps.detect.outputs.selected_paths }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Compute changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base" || true
            git diff --name-only "$base"...HEAD > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || echo "" > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt

      - name: Resolve test selection
        id: detect
        env:
          FLAG: ${{ vars.ENABLE_SMART_TESTS == 'true' && 'on' || 'off' }}
        run: |
          uv run python -m scripts.ci.detect_test_paths \
            --changed-files-from changed.txt \
            --ref-name "${{ github.ref_name }}" \
            --event-name "${{ github.event_name }}" \
            --feature-flag "$FLAG" \
            > selection.json
          cat selection.json
          is_full=$(jq -r '.is_full_suite' selection.json)
          reason=$(jq -r '.full_suite_reason // ""' selection.json)
          split_count=$(jq -r '.split_count' selection.json)
          matrix=$(jq -c '.matrix' selection.json)
          paths=$(jq -c '.selected_paths' selection.json)
          echo "is_full_suite=$is_full" >> "$GITHUB_OUTPUT"
          echo "full_suite_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "split_count=$split_count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected_paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Upload selection artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-selection
          path: selection.json
          retention-days: 7

  # Parallel test execution — matrix shape driven by detect-changes output (OMN-10715).
  # When ENABLE_SMART_TESTS is off (default), detect-changes emits a 15-shard matrix
  # with full_suite_reason=FEATURE_FLAG_OFF so the full-suite pytest step runs.
  # When the flag is on and the change set is small, detect-changes emits a smaller
  # matrix and selected_paths, activating the smart-selection pytest step instead.
  #
  # Split strategy: 9265 tests / 15 = ~618 tests per split (~2-3 min each)
  # Reduced from 10 splits + -n auto after repeated xdist OOM crashes on shard 3
  test-parallel:
    name: Tests (Split ${{ matrix.split }}/${{ needs.detect-changes.outputs.split_count }})
    needs: [occ-preflight, zone-filter, lint, onex-validation, migration-freeze, fingerprint-check, demo-loop-gate, topic-enum-drift, topic-naming-lint, topic-drift-check, arch-invariants, schema-handshake, plugin-env-service-completeness, compose-required-env-coverage, contract-path-preflight, contract-sync-gate, detect-changes]
    # OMN-16216: draft-state CI admission gate (mirrors onex_change_control
    # PR #6686 / OMN-15731). The heavy split-matrix test run only dispatches
    # once the PR is out of draft; `contains(...'ci:ready')` is retained as a
    # transition-window dual-accept fallback (never remove in this PR -- a
    # follow-up retires it once open ci:ready-labeled PRs have drained).
    # Non-`pull_request` events (push, merge_group, workflow_dispatch) are
    # unaffected -- they carry no PR draft/label state to gate on. Main-
    # boundary carve-out (CLAUDE.md rule 4) is unchanged: any PR targeting
    # main always runs the full fleet regardless of draft/label state.
    # tests-gate (below) distinguishes this admission-skip from the
    # pre-existing docs-only skip and fails closed rather than passing it
    # through as a legitimate exemption.
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true') && (github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:ready'))
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        split: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Ensure shellcheck is installed
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64 | amd64) sc_arch="x86_64" ;;
            aarch64 | arm64) sc_arch="aarch64" ;;
            *) echo "unsupported arch $(uname -m) for shellcheck install" >&2; exit 2 ;;
          esac
          echo "shellcheck not found; installing ${SHELLCHECK_VERSION} (${sc_arch}) to ~/.local/bin"
          mkdir -p "${HOME}/.local/bin"
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${sc_arch}.tar.xz"
          curl -fsSL "${url}" -o /tmp/shellcheck.tar.xz
          python3 -c "import tarfile; tarfile.open('/tmp/shellcheck.tar.xz','r:xz').extractall('/tmp')"
          cp "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "${HOME}/.local/bin/shellcheck"
          chmod +x "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/shellcheck" --version

      - name: Run pytest (smart selection)
        if: vars.ENABLE_SMART_TESTS == 'true' && needs.detect-changes.outputs.is_full_suite == 'false'
        # OMN-15233: tests/integration/ci/test_workflow_uses_refs_resolve_live.py
        # resolves every cross-repo `uses:` pin against the GitHub contents API
        # and FAILS CLOSED when a pin is unverifiable. Without a token those
        # requests are unauthenticated and share the runner egress IP's 60/hr
        # budget, so they return HTTP 403 "API rate limit exceeded" and the
        # whole split goes red for a reason that has nothing to do with the
        # pins. The test's own failure message prescribes this fix ("thread
        # GH_TOKEN into the test step"); it reads GH_TOKEN or GITHUB_TOKEN. No
        # test in this suite skips on token presence, so this only authenticates
        # existing requests — it does not activate new ones.
        #
        # OMN-16096: `not live_github_api` excludes
        # tests/integration/ci/test_dep_provenance_lineage_live_omn15604.py,
        # which resolves dep-provenance lineage through the live GitHub REST
        # API by design (proving the REST resolver against real commits) and
        # burned two canary attempts on `transport error: The read operation
        # timed out` during an egress-degraded window. It still runs,
        # unmodified, on the scheduled non-required
        # dep-provenance-lineage-live-canary.yml workflow. The
        # merge-required equivalent (dep-provenance-lineage-gate below) now
        # resolves through the OMN-16053 host-level git mirror instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths=$(echo '${{ needs.detect-changes.outputs.selected_paths }}' | jq -r '.[]')
          if [ -z "$paths" ]; then
            # OMN-14753: an empty selection (e.g. the docs-only exemption) is a
            # legitimate "provably zero impact" result, not an error. Without
            # this guard, passing no positional paths to pytest falls back to
            # `testpaths = ["tests"]` from pyproject.toml -- i.e. close to the
            # full suite -- silently defeating the selector.
            echo "No impacted tests for this change set; nothing to run."
            cat > "junit-${{ matrix.split }}.xml" << 'JUNIT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <testsuites><testsuite name="pytest" errors="0" failures="0" skipped="0" tests="0" time="0"></testsuite></testsuites>
          JUNIT_EOF
            exit 0
          fi
          uv run pytest $paths \
            --ignore=tests/integration/docker \
            -m "not slow and not chaos and not kafka and not performance and not live_github_api" \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            -n 2 --dist loadgroup \
            --timeout=60 \
            --timeout-method=signal \
            --tb=short \
            --junitxml=junit-${{ matrix.split }}.xml

      - name: Run pytest (full suite)
        if: vars.ENABLE_SMART_TESTS != 'true' || needs.detect-changes.outputs.is_full_suite == 'true'
        # OMN-15233: see the smart-selection step above — the live `uses:` pin
        # resolution test needs an authenticated token or it fails closed on
        # HTTP 403 rate limiting. This step is the one that surfaced it.
        #
        # OMN-15410: NO positional path is passed to pytest here, deliberately.
        # This step used to say `uv run pytest tests/`, which silently made
        # this workflow — not pyproject.toml — the real definition of "the full
        # suite": four collocated test roots (scripts/ci/tests, scripts/tests,
        # scripts/runtime_build/tests, and the agent_actions root) existed on
        # disk and were collectable, but no CI job ever named them, so 366
        # tests never ran and 4 of them had been RED since 2026-04-02
        # undetected. With no positional argument pytest inherits
        # `testpaths` from pyproject.toml verbatim, so there is exactly one
        # place to add a root. scripts/validation/validate_test_root_collection.py
        # fails closed if a positional path is re-introduced here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run pytest \
            --ignore=tests/integration/docker \
            -m "not slow and not chaos and not kafka and not performance and not live_github_api" \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            -n 2 --dist loadgroup \
            --timeout=60 \
            --timeout-method=signal \
            --tb=short \
            --store-durations \
            --junitxml=junit-${{ matrix.split }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-attempt-${{ github.run_attempt }}-${{ matrix.split }}
          path: junit-${{ matrix.split }}.xml
          overwrite: true
          retention-days: 7

      - name: Upload test durations (for split rebalancing)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-attempt-${{ github.run_attempt }}-${{ matrix.split }}
          path: .test_durations
          overwrite: true
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Version Pin Compliance Check (OMN-4807)
  # ---------------------------------------------------------------------------
  # Verifies that this repo's dependency pins are compliant with the shared
  # version matrix defined in omni_home/standards/version-matrix.yaml.
  # Depends on OMN-4803 (check_version_pins.py must exist in omni_home main).
  version-pin-check:
    needs: occ-preflight
    name: Version Pin Compliance
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # OMN-16373: CROSS_REPO_PAT retirement — mint a short-lived
      # onexbot-occ-writer App installation token, scoped to the one
      # sibling repo this job reads.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: onex_change_control
          permission-contents: write

      - name: Checkout onex_change_control standards
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        continue-on-error: true
        with:
          repository: OmniNode-ai/onex_change_control
          token: ${{ steps.app-token.outputs.token }}
          path: onex_change_control
          sparse-checkout: |
            standards/
            scripts/
          sparse-checkout-cone-mode: false

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Check version pin compliance
        run: |
          SCRIPT="onex_change_control/scripts/check_version_pins.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "::warning::$SCRIPT not found — skipping version pin check"
            exit 0
          fi
          # The script scans root/*/pyproject.toml — create a temp workspace
          # with a symlink so the scanner can find this repo's pyproject.toml.
          WORKSPACE=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$WORKSPACE/omnibase_infra"
          python "$SCRIPT" --root "$WORKSPACE"

      - name: Check Dockerfile.runtime plugin pins
        run: |
          echo "================================================================"
          echo "Dockerfile.runtime Plugin Pin Check (OMN-5108)"
          echo "================================================================"
          uv run python scripts/check_dockerfile_pins.py

      - name: Check runtime image identity stamping
        run: |
          echo "================================================================"
          echo "Runtime Image Identity Check (OMN-12965)"
          echo "================================================================"
          uv run python scripts/check_runtime_image_identity.py

  # ============================================================================
  # ONEX Compliance Check
  # Runs `onex compliance check` to validate contracts, handlers, and schemas.
  # External-service checks WARN only (not FAIL) — structural failures remain FAIL.
  # Conditional: only runs if the `onex compliance` command is available.
  # ============================================================================
  compliance:
    needs: occ-preflight
    name: Contract Compliance
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Check if onex compliance command exists
        id: check-command
        run: |
          if uv run onex compliance check --help >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::onex compliance check command not available yet — skipping"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run onex compliance check
        id: compliance
        if: steps.check-command.outputs.available == 'true'
        run: |
          mkdir -p .onex_state/compliance
          if uv run onex compliance check --repo-root . --output .onex_state/compliance/report.yaml; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "::warning::ONEX compliance check reported failures (warn-only for external-service checks)"
          fi

      - name: Upload compliance report
        if: always() && steps.check-command.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: compliance-report
          path: .onex_state/compliance/report.yaml
          retention-days: 30

  # ============================================================================
  # CI Tests Gate (aggregator for branch protection)
  # Required check: "CI Tests Gate" -- do not rename without updating
  # branch protection AND .github/required-checks.yaml
  # ============================================================================
  tests-gate:
    timeout-minutes: 30
    name: CI Tests Gate
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [occ-preflight, zone-filter, test-parallel, detect-changes]
    if:  needs.occ-preflight.result == 'success' && (always())
    steps:
      # OMN-16216: `test-parallel` now legitimately skips for TWO different
      # reasons -- a docs-only diff (pre-existing exemption) or a draft PR
      # with no `ci:ready` fallback label (new admission gate). A docs-only
      # skip stays a pass. An admission-skip must NOT be treated the same
      # way, or a draft, non-docs-only PR would read "CI Tests Gate =
      # success" via the exact skip-is-pass loophole this poller exists to
      # close (STRICT_GATE_JOBS entry "CI Tests Gate" in
      # scripts/ci/ci_summary_gate.py) -- this is the AC(b) trap named on
      # OMN-16216. The admission check is re-evaluated here (not trusted from
      # test-parallel's `if:`) so a single source of truth in this job's own
      # env drives the verdict.
      - name: Check test matrix results
        env:
          TESTS_RESULT: ${{ needs.test-parallel.result }}
          SPLIT_COUNT: ${{ needs.detect-changes.outputs.split_count }}
          DOCS_ONLY: ${{ needs.zone-filter.outputs.docs_only }}
          ADMITTED: ${{ github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:ready') }}
        run: |
          if [ "$TESTS_RESULT" = "skipped" ]; then
            if [ "$DOCS_ONLY" = "true" ]; then
              echo "Test matrix skipped - docs-only / declarative-evidence diff (legitimate exemption)"
            elif [ "$ADMITTED" != "true" ]; then
              echo "::error::Test matrix skipped - PR is draft and missing the 'ci:ready' fallback label (OMN-16216 draft-state CI admission gate). Mark the PR ready for review (or apply 'ci:ready' during the transition window) to run the full test matrix."
              exit 1
            else
              echo "::error::Test matrix skipped despite admitted PR / non-PR event (result: $TESTS_RESULT) -- unexpected, treating as failure"
              exit 1
            fi
          elif [ "$TESTS_RESULT" != "success" ]; then
            echo "::error::Test matrix failed (result: $TESTS_RESULT)"
            exit 1
          else
            echo "All ${SPLIT_COUNT} test splits passed"
          fi

  # ============================================================================
  # CROSS-REPO MIGRATION CONFLICT CHECK (OMN-5772)
  # Validates migration schema conflicts against onex_change_control.
  # ============================================================================

  migration-conflict-check:
    needs: occ-preflight
    timeout-minutes: 30
    name: Cross-Repo Migration Conflicts
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      # OMN-16373: CROSS_REPO_PAT retirement — mint a short-lived
      # onexbot-occ-writer App installation token for the multi-repo
      # sibling reads this boundary check performs.
      #
      # OMN-16414: continue-on-error is REQUIRED here, not optional polish.
      # Fork-triggered pull_request runs receive no org secrets (app-id/
      # private-key resolve empty), and create-github-app-token hard-fails
      # the step ("Input required and not supplied: app-id") when that
      # happens. Falling back to github.token below is sufficient because
      # every repo in `repos:` (omniclaude, omnidash, omniintelligence,
      # omnibase_core, omnimemory) is PUBLIC (verified via
      # `gh api repos/OmniNode-ai/<repo> --jq .private`) -- reading them
      # needs no elevated scope.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          permission-contents: write
      - uses: OmniNode-ai/onex_change_control/.github/actions/validate-boundaries@main
        id: migration_conflicts
        env:
          OMNI_REPO_CLONE_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          checks: "migration-conflicts"
          repos: "omniclaude,omnidash,omniintelligence,omnibase_core,omnimemory"
          warn-only: "false"


  contract-compliance:
    needs: occ-preflight
    name: Contract Compliance Check
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 20
    if: needs.occ-preflight.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # OMN-16373: CROSS_REPO_PAT retirement — mint a short-lived
      # onexbot-occ-writer App installation token, scoped to the one
      # sibling repo this job reads.
      #
      # OMN-16414: continue-on-error is REQUIRED here, not optional polish.
      # Fork-triggered pull_request runs receive no org secrets (app-id/
      # private-key resolve empty), and create-github-app-token hard-fails
      # the step ("Input required and not supplied: app-id") when that
      # happens. Without this guard the job died right here even though the
      # checkout step below already had a `|| github.token` fallback -- dead
      # code until this line let the step fail soft. onex_change_control is
      # PUBLIC (verified via `gh api repos/OmniNode-ai/onex_change_control
      # --jq .private`), so github.token is sufficient to read it.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: onex_change_control
          permission-contents: write
      - name: Checkout onex_change_control
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/onex_change_control
          # OMN-14436: PINNED. The unpinned default-branch clone is what caused the
          # original incident (the executor was "missing" only because the repo's
          # default branch lagged behind the branch that had it). An unpinned OCC
          # checkout makes this gate a function of whatever OCC's dev happens to be.
          ref: 7352cb2dc634a7223877bfbbf3498303c9662700
          path: onex_change_control
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install onex_change_control
        working-directory: onex_change_control
        run: |
          set -euo pipefail
          export UV_HTTP_TIMEOUT="${UV_HTTP_TIMEOUT:-600}"
          attempt=1
          max_attempts=3
          delay=10
          until uv sync --no-cache --all-extras; do
            status=$?
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "::error::uv sync onex_change_control failed after ${attempt} attempt(s)"
              exit "$status"
            fi
            echo "::warning::uv sync onex_change_control attempt ${attempt}/${max_attempts} failed with exit ${status}; retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      # OMN-14436: EXECUTE the DoD check_values against the PRODUCT tree.
      #
      # What was here before -- `uv run validate-yaml $CONTRACTS` -- never ran a single
      # check_value. It only parsed OCC's YAML, so a green "Contract Compliance Check"
      # meant exactly "OCC's 6,900 files are valid YAML" and nothing about this PR.
      # The DoD gate has been dead platform-wide for ~3 months behind that green check.
      #
      # --workspace is the load-bearing argument. It must be the PRODUCT checkout
      # ($GITHUB_WORKSPACE), not the OCC clone. Pointing it at OCC is the original
      # defect: a check_value's cwd became the receipt store, so the only file an author
      # could reach was their own receipt -- which is why ~32% of the corpus greps itself.
      - name: Run DoD contract compliance against the product tree (OMN-14436)
        working-directory: onex_change_control
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::notice::No PR number (event=${{ github.event_name }}); DoD check_values are PR-scoped. Skipping."
            exit 0
          fi
          uv run python scripts/ci/run_contract_compliance_check.py \
            --pr "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --contracts-dir "$GITHUB_WORKSPACE/onex_change_control/contracts" \
            --workspace "$GITHUB_WORKSPACE" \
            --legacy-allowlist "$GITHUB_WORKSPACE/onex_change_control/scripts/ci/dod_runner_legacy_allowlist.txt"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # ============================================================================
  # Test-Failure Ratchet Gate (OMN-13027, retro A-8)
  #
  # After the test matrix finishes, download all JUnit XML shards, merge them,
  # and compare against the dev-branch baseline.  Any failure cluster NOT in the
  # baseline surfaces here as a ratchet regression.
  #
  # The baseline is updated nightly by the dev-baseline-publisher workflow.
  # Expired entries (> 7 days old) also fail the gate to force renewal.
  #
  # ADVISORY (OMN-13867): this gate is NOT a required status check and is
  # intentionally excluded from the CI Summary pass/fail condition. Real test
  # pass/fail is strictly enforced by the CI Tests Gate (`tests-gate`). A ratchet
  # hiccup or a transient JUnit-artifact download flake must not block merges.
  # ============================================================================
  test-failure-ratchet:
    name: Test-Failure Ratchet Gate
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [occ-preflight, test-parallel, detect-changes]
    # Run on PRs and merge_group events whenever there were actual test runs.
    # Also run when docs-only so we detect ratchet-baseline staleness.
    if:  needs.occ-preflight.result == 'success' && (always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group'))
    timeout-minutes: 15

    steps:
      - name: Checkout code (dev branch baseline)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: dev
          sparse-checkout: |
            config/validation/test-failure-baseline.yaml
            scripts/check_test_failure_ratchet.py
          sparse-checkout-cone-mode: false

      - name: Checkout PR HEAD (for scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: false
          path: pr-head
          sparse-checkout: |
            scripts/check_test_failure_ratchet.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install PyYAML (minimal dep for ratchet script)
        run: python3 -m pip install --quiet --user pyyaml

      # ------------------------------------------------------------------
      # Artifact download resilience (OMN-13867)
      #
      # The JUnit-shard download reaches artifact/blob storage and can fail
      # with a transient network error (observed: `ECONNRESET` from
      # GetSignedArtifactURL on Azure blob) even though every test passed.
      # That is an INFRA/download flake, NOT a test-ratchet regression, so:
      #   1. Retry the download with backoff (3 attempts).
      #   2. If all attempts still fail, treat it as a non-fatal infra skip
      #      (see "Skip ratchet" step below) rather than reporting a false
      #      ratchet failure. Test pass/fail is independently and strictly
      #      enforced by the CI Tests Gate, so skipping the advisory ratchet
      #      on a download flake does not weaken any real gate.
      # ------------------------------------------------------------------
      - name: Download all JUnit XML shards (attempt 1)
        id: dl_shards_1
        if: needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-attempt-${{ github.run_attempt }}-*
          path: junit-shards
          merge-multiple: false

      - name: Backoff before shard download retry 2
        if: |
          (needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure')
          && steps.dl_shards_1.outcome == 'failure'
        run: sleep 10

      - name: Download all JUnit XML shards (attempt 2)
        id: dl_shards_2
        if: |
          (needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure')
          && steps.dl_shards_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-attempt-${{ github.run_attempt }}-*
          path: junit-shards
          merge-multiple: false

      - name: Backoff before shard download retry 3
        if: |
          (needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure')
          && steps.dl_shards_1.outcome == 'failure'
          && steps.dl_shards_2.outcome == 'failure'
        run: sleep 30

      - name: Download all JUnit XML shards (attempt 3)
        id: dl_shards_3
        if: |
          (needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure')
          && steps.dl_shards_1.outcome == 'failure'
          && steps.dl_shards_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-attempt-${{ github.run_attempt }}-*
          path: junit-shards
          merge-multiple: false

      - name: Determine JUnit shard availability
        id: shard_status
        if: needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure'
        run: |
          if find junit-shards -name '*.xml' -type f 2>/dev/null | grep -q .; then
            echo "downloaded=true" >> "${GITHUB_OUTPUT}"
            echo "JUnit shards downloaded successfully."
          else
            echo "downloaded=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::No JUnit XML shards present after 3 download attempts (transient infra/network error)."
          fi

      - name: Merge JUnit shards into single XML
        if: |
          (needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure')
          && steps.shard_status.outputs.downloaded == 'true'
        run: |
          python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          shards_dir = Path("junit-shards")
          if not shards_dir.exists():
              print("No JUnit shard directory found — writing empty XML")
              root = ET.Element("testsuite", tests="0")
              ET.ElementTree(root).write("merged-junit.xml")
              exit(0)

          merged_root = ET.Element("testsuite", name="merged", tests="0")
          total = 0
          for shard_dir in sorted(shards_dir.iterdir()):
              xml_files = list(shard_dir.glob("*.xml"))
              for xml_file in xml_files:
                  try:
                      tree = ET.parse(xml_file)
                      shard_root = tree.getroot()
                      suites = shard_root.findall(".//testsuite") or [shard_root]
                      for suite in suites:
                          for tc in suite.findall("testcase"):
                              merged_root.append(tc)
                              if tc.find("failure") is not None or tc.find("error") is not None:
                                  total += 1
                  except ET.ParseError as e:
                      print(f"Warning: could not parse {xml_file}: {e}")

          merged_root.set("tests", str(total))
          ET.ElementTree(merged_root).write("merged-junit.xml")
          print(f"Merged {total} failed test cases into merged-junit.xml")
          PYEOF

      - name: Write empty JUnit if test-parallel was skipped
        if: needs.test-parallel.result == 'skipped'
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.Element('testsuite', tests='0')
          ET.ElementTree(root).write('merged-junit.xml')
          print('Test matrix was skipped (docs-only diff) — empty JUnit written.')
          "

      - name: Skip ratchet — JUnit artifact download failed (infra, non-fatal)
        if: |
          (needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure')
          && steps.shard_status.outputs.downloaded != 'true'
        run: |
          echo "::warning::JUnit shard artifact download failed after 3 attempts (transient infra/network error, e.g. ECONNRESET from artifact storage). Skipping the Test-Failure Ratchet check as non-fatal — test pass/fail is independently enforced by the CI Tests Gate. See OMN-13867."
          {
            echo "## Test-Failure Ratchet Gate (OMN-13027)"
            echo ""
            echo ":warning: **Skipped (non-fatal)** — JUnit shard artifact download failed after 3 retries due to a transient infra/network error (e.g. \`ECONNRESET\` from artifact storage). This is an infrastructure flake, not a test-ratchet regression. Test pass/fail is independently enforced by the CI Tests Gate. See OMN-13867."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run test-failure ratchet check
        if: |
          needs.test-parallel.result == 'skipped'
          || (
            (needs.test-parallel.result == 'success' || needs.test-parallel.result == 'failure')
            && steps.shard_status.outputs.downloaded == 'true'
          )
        run: |
          python3 pr-head/scripts/check_test_failure_ratchet.py \
            --junit-xml merged-junit.xml \
            --baseline config/validation/test-failure-baseline.yaml

      - name: Post ratchet summary
        if: always()
        run: |
          echo "## Test-Failure Ratchet Gate (OMN-13027)" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Baseline: \`config/validation/test-failure-baseline.yaml\` (from dev branch)" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          if [ -f config/validation/test-failure-baseline.yaml ]; then
            CLUSTER_COUNT=$(python3 -c "
          import yaml
          with open('config/validation/test-failure-baseline.yaml') as f:
              d = yaml.safe_load(f) or {}
          print(len(d.get('clusters', {})))
          " 2>/dev/null || echo "?")
            echo "Baseline clusters: **${CLUSTER_COUNT}**" >> "${GITHUB_STEP_SUMMARY}"
          fi

  # ============================================================================
  # Runtime Boot Smoke Test (OMN-9120)
  # Calls the reusable reusable-runtime-boot.yml workflow in compose mode.
  # Runs after the full test suite passes so a boot regression doesn't compete
  # with flaky unit tests for signal. Self-hosted runners have Docker available;
  # public-fork runs fall back to ubuntu-latest which also has Docker.
  # ============================================================================
  runtime-boot-smoke:
    name: Runtime Boot Smoke (compose)
    needs: [occ-preflight, tests-gate]
    if: github.event_name != 'pull_request' && needs.occ-preflight.result == 'success' && needs.tests-gate.result == 'success'
    uses: ./.github/workflows/reusable-runtime-boot.yml
    with:
      mode: compose

  # ===========================================================================
  # OMN-15108 fan-out of OMN-14877 (omnibase_core#1478 pattern) / OMN-14430
  # ---------------------------------------------------------------------------
  # Both standalone workflows below triggered on push/pull_request with their
  # OWN github.run_id, making them structurally invisible to this ci-summary
  # job's poll of `actions/runs/${RUN_ID}/jobs` (the exact OMN-14430 mechanism,
  # confirmed live here: omnibase_infra/dev's ONLY required_status_checks
  # context is "CI Summary" — neither standalone workflow was ever a required
  # context, so a red run never blocked a merge). Ported here as unconditional
  # jobs (no `if:`/`needs:`) under the required "CI Summary" default-deny
  # rollup (ci_summary_gate.py's sweep fails on ANY non-allowlisted job
  # failure, so no allowlist edit is needed). Both standalone files are
  # retired to workflow_dispatch-only in this same PR.
  # ===========================================================================
  # Migrated from validate-validator-requirements.yml (OMN-15108, OMN-14877
  # pattern). Enforces architecture-handshakes/validator-requirements.yaml
  # (OMN-13291 fleet gate) against this repo's own baseline.
  validate-validator-requirements:
    name: Enforce validator-requirements.yaml (OMN-13291)
    # OMNI_RUNNER_SELECTOR_V1 — runners are resolved from centralized selector variables.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-14017: sibling checkout plus uv sync can consume the default budget
    # while retrying transient GitHub/PyPI fetch failures.
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout omnibase_core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_core
          # Pinned to the commit that exports the validate-validator-requirements hook (OMN-13291).
          # Update by running: gh api repos/OmniNode-ai/omnibase_core/commits/dev --jq '.sha'
          ref: d163312724489f10f58ffdf8115ba1fa9d5783e8
          path: omnibase_core
          token: ${{ secrets.OMNIBASE_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Enforce validator-requirements.yaml
        run: |
          cd omnibase_core
          for attempt in 1 2 3; do
            uv sync --all-extras && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          uv run python -m omnibase_core.validation.validator_requirements_consumer \
            --repo omnibase_infra \
            --repo-root .. \
            --spec ../architecture-handshakes/validator-requirements.yaml \
            --baseline ../architecture-handshakes/validator-requirements-baseline.yaml

  # Migrated from validator-runtime-profiles.yml (OMN-15108, OMN-14877
  # pattern). Enforces runtime_profiles on command-consuming contracts
  # (OMN-9886 / OMN-12957) against the frozen allowlist.
  runtime-profiles-validator:
    name: Runtime Profiles / validate
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to self-hosted omnibase-ci; pull_request defaults to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            uv sync --all-extras && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Validate runtime_profiles on omnibase_infra contracts
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from omnibase_core.validation.validator_runtime_profiles import (
              ValidatorRuntimeProfiles,
          )

          result = ValidatorRuntimeProfiles(
              allowlist_path=Path("config/validation/runtime_profiles_allowlist.yaml")
          ).validate(Path("src"))
          for issue in result.issues:
              print(f"[{issue.severity.value}] {issue.file_path}:{issue.line_number}: {issue.message}")
          raise SystemExit(0 if result.is_valid else 1)
          PY

  no-noncanonical-lifecycle-classes:
    name: no-noncanonical-lifecycle-classes
    # OMN-14350: non-canonical lifecycle-class ratchet — a STRICT CI Summary gate
    # (registered in scripts/ci/ci_summary_gate.py STRICT_GATE_JOBS). Unconditional
    # (no needs/if) so CI Summary always WAITS for it and requires success — a red
    # ratchet fails the required "CI Summary" check (no default-deny race). Installs
    # the omnibase_core validator from the pinned core dev SHA and ratchets
    # src/omnibase_infra's frozen allowlist DOWN toward zero.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.3"
      - name: Ratchet non-canonical lifecycle-word classes against frozen allowlist (OMN-14350)
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@63635097705d832e0ee9c4811093efb31349105c' \
            python -m omnibase_core.validators.no_noncanonical_lifecycle_classes \
            --check-stale \
            --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml \
            src/omnibase_infra

  occ-companion-merged:
    name: OCC Companion Merged Gate (OMN-15214)
    # OMN-15214: makes the 2026-07-26 OCC hygiene-sweep trigger state — an OPEN
    # onex_change_control evidence companion whose product PR already MERGED —
    # unreachable via the merge path on this repo. The sweep closed five open
    # companions (OCC#5012–#5016) whose product PRs had merged, destroying three
    # evidence chains; the durable fix is ordering: the companion must MERGE
    # BEFORE the product PR can. This job polls the PR's live Evidence-Source
    # (live body, not event payload — occ-autobind PATCHes it in after open) and
    # greens ONLY when the cited OCC companion PR is MERGED or the cited OCC
    # commit SHA is an ancestor of onex_change_control dev/main. A companion
    # CLOSED without merging fails immediately (that IS the incident state).
    #
    # STRICT CI Summary gate (registered in scripts/ci/ci_summary_gate.py
    # STRICT_GATE_JOBS) — deliberately NOT a new top-level required context: a
    # context that does not report on every PR shape wedges merges indefinitely
    # under branch protection, and occ-autobind itself is network-flaky
    # (omninode_infra#679, 2026-07-26). Unconditional (no needs/if) so CI
    # Summary always WAITS for it and a skip fails closed; internal event
    # scoping no-ops on push/workflow_dispatch (mirrors occ-preflight).
    # The poller is read-only, but must follow the fork-safe selector used by
    # the rest of CI rather than pinning all internal PRs to hosted compute.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
      # Poll window (seconds) — bounded well under ci-summary's 90m deadline so
      # this gate reaches a terminal state first; PENDING converts to FAIL.
      DEADLINE_SECONDS: "1500"
      POLL_INTERVAL_SECONDS: "30"
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require cited OCC evidence to be merged/durable before product merge
        run: python3 scripts/ci/check_occ_companion_merged.py

  # OMN-15378 AC3: scripts/deploy-agent's own pytest root (201 tests) ran in a
  # SEPARATELY-TRIGGERED workflow, so the CI Summary poller — which reads
  # `actions/runs/${RUN_ID}/jobs` for its own run only — structurally could not
  # observe it: a RED deploy-agent run left the sole required context on this
  # branch ("CI Summary") green. Visibility without enforcement. Calling the
  # same workflow from HERE puts its job in ci.yml's own run as the check-run
  # "Deploy Agent Tests (OMN-15378) / deploy-agent-tests", which is registered
  # in scripts/ci/ci_summary_gate.py STRICT_GATE_JOBS (pinned by
  # tests/ci/test_ci_summary_gate.py) — so absent/red/skipped now fails the
  # required context. Unconditional (no needs/if) exactly as a STRICT gate
  # requires, which also closes the old path-filter hole where a breaking
  # change outside scripts/deploy-agent/** produced no signal at all.
  # DO NOT rename this job — the display name is the first segment of the
  # STRICT_GATE_JOBS entry; a rename makes the gate permanently PENDING.
  deploy-agent-tests:
    name: Deploy Agent Tests (OMN-15378)
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-agent-tests.yml

  # OMN-15484 (fan-out of OMN-15483). The merge sweep lands PRs while
  # adversarial verification is still running against them. OMN-15483 built the
  # fix — a required check that fails while a PR carries a hold marker in its
  # title or labels, so a held PR can never be required-green for ANY consumer
  # (the Codex controller, `gh pr merge`, auto-merge, a merge queue, or the ONEX
  # merge node) — but shipped it in omnimarket ONLY. omnibase_infra carries
  # incident §C (#2560) in that ticket's table and had zero coverage.
  #
  # NO VOCABULARY IS DECLARED HERE, deliberately. The hold tokens live in
  # exactly one place fleet-wide — omnimarket's
  # src/omnimarket/merge_control/hold_marker.py — and the reusable workflow
  # reads that module at run time. Copying it here would rebuild across repos
  # the bug OMN-15483 round 1 found inside omnimarket: two divergent
  # `_DO_NOT_MERGE_RE` definitions, neither a superset of the other. The shared
  # workflow scans THIS repo on every run and fails if a second vocabulary
  # appears (AC1), proves the gate actually fires here by driving a held vector
  # through it (AC3), and checks the context name is not itself a hold token
  # (AC5).
  #
  # UNCONDITIONAL BY DESIGN (AC4) — no `needs:`, no `if:`, no paths filter, same
  # posture as `deploy-agent-tests` above and for the same reason. A hold gate
  # an unrelated upstream failure can cascade-skip is not a gate.
  #
  # DO NOT rename this job, and do not add a `name:` — the check-run is
  # "<caller job display name> / <inner job display name>", i.e.
  # "merge-hold-gate / evaluate", which is the exact string registered in
  # scripts/ci/ci_summary_gate.py STRICT_GATE_JOBS. A rename on either side
  # makes the required CI Summary context permanently PENDING (the same trap
  # documented on deploy-agent-tests). tests/ci/test_merge_hold_gate_omn15484.py
  # pins both halves and the STRICT registration itself.
  #
  # `vocabulary_ref` MUST equal the ref in `uses:`: the first selects the
  # workflow file, the second selects the source it reads, and drifting them
  # would run one vintage of the gate against another vintage of the tokens.
  #
  # PIN AN ANCESTOR OF omnimarket `dev`, NEVER A PR-HEAD SHA (OMN-15484 step 6).
  # The original fan-out pinned 879d6fc6 — the PR HEAD of omnimarket#1976. That
  # SHA was 40-hex and therefore satisfied every local check, but it lived only
  # on the PR branch. When #1976 squash-merged at 2026-07-30T18:29:59Z the branch
  # was deleted and the ref stopped resolving for Actions, so THIS ENTIRE
  # WORKFLOW FILE failed to load: runs after 18:59Z reported `conclusion=failure`
  # with 0 jobs and `name` degraded to the raw path. That takes down the required
  # `CI Summary` context by ABSENCE rather than by failure, which branch
  # protection treats as never-satisfied — every omnibase_infra dev PR based on
  # 27478af4 or later was unmergeable until this repin.
  #
  # d3182b6f is the current reusable workflow's pinned dev commit, reachable from
  # `dev` forever.
  merge-hold-gate:
    permissions:
      contents: read
      pull-requests: read
    uses: OmniNode-ai/omnimarket/.github/workflows/merge-hold-gate-reusable.yml@d3182b6fb59b421383c793fcfea86a46b06b7b43
    with:
      vocabulary_ref: d3182b6fb59b421383c793fcfea86a46b06b7b43
      context_name: merge-hold-gate / evaluate
  # OMN-15361: P0/P8 fail-closed application database domain enforcement.
  # Unconditional after OCC eligibility and STRICT in ci_summary_gate.py: validators,
  # seeded counterexamples, and rebuilt PostgreSQL 16 proofs report in this
  # workflow's run and therefore gate the sole required CI Summary context.
  # Deployment activation remains separately BLOCKED in the typed contract;
  # this job performs no live database, secret, grant, deploy, or runtime action.
  application-database-domain-enforcement:
    name: Application Database Domain Enforcement (OMN-15361)
    needs: occ-preflight
    permissions:
      contents: read
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_DOCKER_CI_RUNS_ON_JSON || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 60
    steps:
      - name: Checkout enforcement source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # OMN-16373: CROSS_REPO_PAT retirement. continue-on-error because
      # fork-triggered pull_request runs receive no org secrets (App id/key
      # are empty), and the live-resolve step below already has a
      # github.token fallback for exactly that case.
      - name: Mint onexbot-occ-writer app token
        id: app-token-proof
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          permission-contents: write

      - name: Checkout exact sanitized legacy fixture dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_infra
          ref: 95351f5d8e806fcf7fa2c276d9065df93ccf92b9
          path: .proof-dependencies/legacy-fixture
          persist-credentials: false

      - name: Checkout exact authenticated domain-adapter dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_infra
          ref: 2a2cfb275810b34197d4d5baf55bdcddc443e6dc
          path: .proof-dependencies/domain-adapter
          persist-credentials: false

      - name: Resolve omnimarket migration source ref
        id: resolve-omnimarket-ref
        shell: bash
        run: python3 scripts/resolve_node_migration_source_ref.py

      - name: Live-resolve omnimarket dev HEAD
        # OMN-15703: no hardcoded fallback SHA. When the trailer is absent
        # (resolve-omnimarket-ref emits the literal "dev"), resolve
        # omnimarket's live dev HEAD via the GitHub API at run time instead
        # of pinning to a snapshot that goes stale the moment omnimarket
        # dev moves again (the OMN-15701 incident). Fails loudly (non-zero
        # exit) rather than silently falling back to a stale pin.
        #
        # Token: fork-triggered pull_request runs receive no org secrets, so
        # the minted onexbot-occ-writer App token is empty there and this
        # step must not hard-depend on it (OMN-16373: CROSS_REPO_PAT
        # retired). omnimarket is a PUBLIC repo, so reading its
        # commits API needs no elevated scope -- github.token (always present,
        # including on fork PRs) is sufficient. Prefer the App token when
        # present (same-repo/trusted runs) to stay on the higher, shared
        # cross-repo rate-limit budget those runs already use elsewhere in
        # this workflow (see lines ~1508/1665/1696); fall back to
        # github.token so the fork lane keeps functioning rather than
        # aborting before its fork-lane proof steps below.
        id: resolve-omnimarket-live-head
        if: steps.resolve-omnimarket-ref.outputs.ref == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token-proof.outputs.token || github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/OmniNode-ai/omnimarket/commits/dev --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::live omnimarket dev HEAD resolution returned an invalid sha: '${sha}'" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact typed registry dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ steps.resolve-omnimarket-ref.outputs.ref == 'dev' && steps.resolve-omnimarket-live-head.outputs.sha || steps.resolve-omnimarket-ref.outputs.ref }}
          path: .proof-dependencies/omnimarket
          persist-credentials: false

      # OMN-16152: GitHub withholds ALL repo secrets from dependabot-triggered
      # pull_request runs even when the head branch is same-repo, not a fork
      # -- the fork check alone let dependabot through into a checkout whose
      # only token source (the minted App token, OMN-16373) is
      # unconditionally empty there. actions/checkout treats an
      # explicitly-passed empty token as "unset and required", so it
      # hard-failed instead of falling back to github.token. Route
      # dependabot into the same narrow fail-closed lane already proven for
      # forks below.
      - name: Checkout exact service ownership dependency
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omninode_infra
          ref: db90c19241eb2b58779e18a1ddf7b9a0e11c9c7c
          path: .proof-dependencies/omninode-infra
          token: ${{ steps.app-token-proof.outputs.token }}
          persist-credentials: false

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Execute mandatory source assertions and seeded RED controls
        run: >-
          uv run pytest -q
          tests/unit/validation/test_application_relation_ownership.py
          tests/unit/validation/test_application_database_acl.py
          tests/unit/validation/test_application_database_domain_enforcement.py
          tests/unit/validation/test_application_database_sql_enforcement_regressions.py
          tests/unit/topology/test_application_database_topology.py
          tests/unit/topology/test_application_database_table_grants.py
          tests/unit/runtime/auto_wiring/test_projection_domain_adapters.py
          tests/ci/test_application_database_domain_enforcement_contract.py
          tests/ci/test_application_database_sql_authority_isolation.py
          tests/ci/test_application_database_sql_gate.py

      # OMN-15656: the shipped topology's TABLE grants are a projection of node
      # contract db_io.db_tables. --check fails on drift in either direction (a
      # declared table with no grant, or a grant no contract declares); --prove
      # resolves every declaration through the real wiring validator against
      # every shipped profile. A contract added upstream without a matching
      # grant now fails here instead of failing a deploy.
      - name: Enforce contract-derived application-database TABLE grants
        run: >-
          uv run python scripts/generate_application_database_table_grants.py
          --contracts-root .proof-dependencies/omnimarket/src/omnimarket/nodes
          --check --prove

      - name: Enforce schema qualification in changed SQL (trusted)
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        env:
          # OMN-16076: no hardcoded fallback SHA. The old pin was a squash
          # commit reachable only through a since-deleted stacked branch, so
          # the first push-event run of this step (post-merge on main, which
          # never has a pull_request/merge_group base) could not resolve it
          # and crashed. push event.before is the previous main tip -- for a
          # promotion merge that is exactly the promotion PR's base, so the
          # push verdict reproduces the proven PR verdict. An empty or
          # unreachable base fails loudly inside the script with remediation.
          APPLICATION_SQL_BASE_REVISION: >-
            ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: >-
          uv run python scripts/ci/check_application_database_sql.py
          --base-revision "$APPLICATION_SQL_BASE_REVISION"
          --head-revision HEAD
          --ownership-manifest .proof-dependencies/omnimarket/scripts/application-relation-ownership.yaml
          --ownership-manifest .proof-dependencies/omninode-infra/db/migrations/application-relation-ownership.yaml
          --ownership-manifest .proof-dependencies/omninode-infra/k8s/migrations/application-relation-ownership.yaml

      # Public-fork pull_request jobs cannot receive organization secrets, and
      # (OMN-16152) neither can dependabot-triggered pull_request jobs even
      # on a same-repo branch -- GitHub withholds repo secrets from
      # dependabot by design, independent of the fork check. Both lanes
      # deliberately omit the private manifest authority: any changed SQL
      # targeting one of those objects is rejected as undeclared. The
      # synthetic Docker-proof authority is also isolated from both production
      # lanes and is proved independently by mandatory source and Docker gates.
      - name: Enforce schema qualification in changed SQL (public fork, fail closed)
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
           github.actor == 'dependabot[bot]')
        env:
          APPLICATION_SQL_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: >-
          uv run python scripts/ci/check_application_database_sql.py
          --base-revision "$APPLICATION_SQL_BASE_REVISION"
          --head-revision HEAD
          --ownership-manifest .proof-dependencies/omnimarket/scripts/application-relation-ownership.yaml

      - name: Verify Docker engine
        run: docker info

      - name: Rebuild and prove application-domain catalog gates
        env:
          COMPOSE_PROJECT_NAME: omn15361-domain-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/application-domain-enforcement/compose.yml
          up --build --abort-on-container-exit --exit-code-from proof

      - name: Clean application-domain proof
        if: always()
        env:
          COMPOSE_PROJECT_NAME: omn15361-domain-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/application-domain-enforcement/compose.yml
          down --volumes --remove-orphans

      - name: Rebuild and prove authenticated domain adapters
        working-directory: .proof-dependencies/domain-adapter
        env:
          COMPOSE_PROJECT_NAME: omn15361-adapter-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/domain-adapter-proof/compose.yml
          up --build --abort-on-container-exit --exit-code-from proof

      - name: Clean domain-adapter proof
        if: always()
        working-directory: .proof-dependencies/domain-adapter
        env:
          COMPOSE_PROJECT_NAME: omn15361-adapter-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/domain-adapter-proof/compose.yml
          down --volumes --remove-orphans

      - name: Rebuild and prove generated role and default-privilege gates
        env:
          COMPOSE_PROJECT_NAME: omn15361-acl-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/application-acl-proof/compose.yml
          up --build --abort-on-container-exit --exit-code-from proof

      - name: Clean generated ACL proof
        if: always()
        env:
          COMPOSE_PROJECT_NAME: omn15361-acl-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/application-acl-proof/compose.yml
          down --volumes --remove-orphans

      - name: Rebuild and prove exact sanitized fresh and legacy fixture
        working-directory: .proof-dependencies/legacy-fixture
        env:
          COMPOSE_PROJECT_NAME: omn15361-legacy-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/legacy-rds-fixture/compose.yml
          up --build --abort-on-container-exit --exit-code-from proof

      - name: Clean sanitized fresh and legacy fixture proof
        if: always()
        working-directory: .proof-dependencies/legacy-fixture
        env:
          COMPOSE_PROJECT_NAME: omn15361-legacy-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          docker compose
          -f docker/legacy-rds-fixture/compose.yml
          down --volumes --remove-orphans

  ci-summary:
    name: CI Summary
    # OMN-14127: REQUIRED branch-protection context — the single umbrella gate for
    # omnibase_infra (OMN-4497), implemented as a NO-`needs`, GitHub-hosted,
    # FAIL-CLOSED poller. A `needs`-gated job gets no check-run until its `needs`
    # terminalize, so under self-hosted fleet saturation the old needs-based CI
    # Summary was ABSENT forever and the PR wedged BLOCKED with 0 failing / 0
    # pending checks and no auto-recovery. With NO `needs` this job's check-run
    # instantiates immediately (the required context can never be absent); it
    # polls the current run's job conclusions and posts a terminal
    # success/failure within a bounded deadline.
    #
    # DEFAULT-DENY, FAIL-CLOSED: green ONLY when every strict + skippable
    # aggregate gate is present+good, no non-allowlisted job failed, AND every
    # declared EXTERNAL context on the PR head is present+success. The auditable
    # gating set + soft-allowlist live in scripts/ci/ci_summary_gate.py
    # (unit-tested in tests/ci/test_ci_summary_gate.py); it reproduces the exact
    # strictness of the old needs-based condition (13 strict `== success` gates,
    # 4 `success||skipped` gates) and adds a strictly-stronger default-deny sweep.
    #
    # OMN-15496: the job-list poll below only ever sees THIS run. Checks emitted
    # by other workflow files are invisible to it and are ALSO absent from branch
    # protection (dev requires exactly ["CI Summary"], strict=false), so they were
    # enforced by neither layer — 59 such contexts on a real merged PR head, incl.
    # deploy-gate, Receipt Gate, CodeRabbit Thread Check and pr-title. #2555 merged
    # with this context GREEN while `deploy-gate / deploy-gate` was RED on the same
    # SHA. The poll step now also asserts EXPECTED_EXTERNAL_CONTEXTS against
    # commits/<head>/check-runs, fail-closed. That tuple is measured, not guessed:
    # a context is admitted only at 100% merge-time report rate over recent merged
    # dev PRs, because a context that does not report on every PR shape wedges the
    # branch. Do NOT add names to it from a workflow file alone.
    # Public fork PRs run on hosted compute; trusted events use the CI selector
    # so internal PRs are not silently routed to hosted minutes.
    #
    # DO NOT rename — the job name IS the required context; a rename re-wedges
    # every PR.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    if: always()
    permissions:
      actions: read
      contents: read
      # OMN-14909 (CI-01): read the head SHA's cross-workflow check-runs for the
      # REPORT-ONLY cascade projection step below. Read scope only — no verdict
      # authority; the poll step above owns pass/fail.
      checks: read
    # Hard backstop above the internal poll deadline (DEADLINE_MINUTES below).
    # Kept under any run-cancellation window so the required context ALWAYS posts
    # a terminal state first, and comfortably above the tests-gate 30m budget plus
    # self-hosted queueing so a slow-but-valid matrix is not failed prematurely.
    timeout-minutes: 100
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Poll run jobs and compute fail-closed CI Summary verdict
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # OMN-15496: the PR head SHA whose CROSS-WORKFLOW check-runs are asserted
          # against EXPECTED_EXTERNAL_CONTEXTS. The jobs API above only ever sees
          # THIS run; every other workflow file's context is invisible to it and is
          # also absent from branch protection (dev requires exactly "CI Summary"),
          # so those checks previously blocked nothing.
          EVENT_NAME: ${{ github.event_name }}
          # OMN-15532 — PR author login. Drops ONLY the contexts that this
          # author's PRs structurally cannot produce (ACTOR_CONDITIONAL_CONTEXTS:
          # cr-thread-gate-caller.yml skips dependabot[bot], so
          # "gate / CodeRabbit Thread Check" is never created on its PRs and
          # would otherwise burn the full deadline then fail closed). Empty on
          # non-PR events, which drops nothing.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha
              || github.event.merge_group.head_sha
              || github.sha }}
          # Bounded poll window (minutes) — kept under the run-cancel window so
          # the required context always reaches a terminal state first. Measured
          # headroom for the external wait (OMN-15496): over the 16 dev PRs merged
          # 2026-07-29→30, the slowest asserted external context terminalized
          # 24.9 min after this job started, so 90 min is not a new timeout risk.
          DEADLINE_MINUTES: "90"
          POLL_INTERVAL_SECONDS: "45"
        run: |
          # GitHub invokes this step as `bash -e {0}`; disable errexit because the
          # gate script's non-zero exit codes are handled explicitly below
          # (2 = PENDING must NOT terminate the poll loop).
          set +e
          set -uo pipefail
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          attempt=0
          while true; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::CI Summary poll deadline (${DEADLINE_MINUTES}m) reached with gating jobs or external contexts still pending, or the API unreachable — failing closed"
              python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}" --report-only 2>/dev/null || true
              exit 1
            fi
            attempt=$((attempt + 1))
            if ! gh api --paginate \
                "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
                --jq '.jobs[]' | jq -s '.' > jobs.json; then
              echo "gh api fetch failed (attempt ${attempt}); retrying after ${POLL_INTERVAL_SECONDS}s"
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi
            # Cross-workflow check-runs for the exact head. On a failed fetch the
            # file is REMOVED, not left stale: the gate reads an absent file as
            # "no external context observed" → PENDING → fail-closed at the
            # deadline. It must never resolve green off a stale or partial file.
            rm -f check_runs.json
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              if ! gh api --paginate \
                  "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
                  --jq '.check_runs[]' | jq -s '.' > check_runs.json; then
                echo "check-runs fetch failed (attempt ${attempt}); retrying after ${POLL_INTERVAL_SECONDS}s"
                rm -f check_runs.json
                sleep "${POLL_INTERVAL_SECONDS}"
                continue
              fi
            fi
            python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}" \
              --check-runs-file check_runs.json --event-name "${EVENT_NAME}" \
              --pr-author "${PR_AUTHOR:-}"
            rc=$?
            case "${rc}" in
              0) echo "::notice::CI Summary = SUCCESS (all gating jobs and asserted external contexts provably passed)"; exit 0 ;;
              1) echo "::error::CI Summary = FAILURE (fail-closed: a gating job or an asserted external context failed/cancelled)"; exit 1 ;;
              2) : ;;  # PENDING — gating jobs or external contexts still running; keep polling
              *) echo "::error::ci_summary_gate.py returned unexpected code ${rc}; failing closed"; exit 1 ;;
            esac
            sleep "${POLL_INTERVAL_SECONDS}"
          done

      # OMN-14909 (CI-01, plan §3.C5) — REPORT-ONLY cascade reason-graph.
      # Collapses the head SHA's full cross-workflow check-run list into ONE
      # typed root + BLOCKED_UPSTREAM dependents so a single upstream defect
      # (e.g. a missing Evidence-Source making occ-preflight red) is presented
      # as ONE rerunnable root instead of the ~37 independently-rerunnable red
      # checks that provoke the rerun reflex. This step:
      #   * runs `if: always()` so it renders even when the poll above FAILED,
      #   * is `continue-on-error: true` and ends every command with `|| true`,
      #     so it can NEVER change the CI Summary verdict — the poll step above
      #     is the sole pass/fail authority (gate not weakened), and
      #   * writes only to $GITHUB_STEP_SUMMARY.
      - name: CI cascade reason-graph (report-only, counts roots not checks)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha
              || github.event.merge_group.head_sha
              || github.sha }}
        run: |
          set +e
          set -uo pipefail
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "cascade reason-graph: no head SHA resolved; skipping report" >&2
            exit 0
          fi
          # Cross-workflow check-runs for the exact head (NDJSON, one per line).
          gh api --paginate \
            "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion, html_url}' \
            > cascade_check_runs.ndjson || true
          if [ ! -s cascade_check_runs.ndjson ]; then
            echo "cascade reason-graph: no check-runs fetched (report-only, non-fatal)" >&2
            exit 0
          fi
          # Invoke via `-m` from the repo root (working-directory default) so the
          # `scripts.ci.*` package imports resolve, matching product-readiness-
          # shadow.yml's `python -m scripts.ci.product_reason_graph`.
          python3 -m scripts.ci.ci_cascade_graph classify \
            --check-runs-file cascade_check_runs.ndjson \
            --head-sha "${HEAD_SHA}" \
            --summary 1>/dev/null 2>>"${GITHUB_STEP_SUMMARY}" || true
          exit 0

  # Cross-repo Kafka boundary compatibility test (OMN-3256)
  # Verifies that producer and consumer Pydantic models can round-trip across
  # the Kafka wire format.  Requires sibling repos omniintelligence + omnimemory.
  # Pairs with known drift are marked xfail — they pass as XFAIL until the
  # upstream fix (e.g. OMN-3248) lands, at which point xfail is removed.
  kafka-boundary-compat:
    needs: occ-preflight
    name: Kafka Boundary Compat (OMN-3256)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: omnibase_infra

      - name: Checkout omniintelligence (sibling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omniintelligence
          path: omniintelligence
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout omnimemory (sibling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimemory
          path: omnimemory
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout omnibase_compat (sibling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_compat
          path: omnibase_compat
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python and uv
        uses: ./omnibase_infra/.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"
          cache-key-prefix: uv-boundary
          lock-file-path: 'omnibase_infra/**/uv.lock'
          working-directory: omnibase_infra
          shared-env-enabled: "false"

      - name: Preinstall CPU-only torch for sibling deps
        working-directory: omnibase_infra
        run: |
          set -eu
          export UV_HTTP_TIMEOUT="${UV_HTTP_TIMEOUT:-600}"
          attempt=1
          max_attempts=5
          until uv pip install "torch>=2.6.0,<3.0.0" --index-url https://download.pytorch.org/whl/cpu; do
            status=$?
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::uv pip install kafka-boundary torch CPU wheel failed after ${attempt} attempt(s)"
              exit "${status}"
            fi
            delay=$((attempt * 10))
            echo "::warning::uv pip install kafka-boundary torch CPU wheel attempt ${attempt}/${max_attempts} failed with exit ${status}; retrying in ${delay}s"
            attempt=$((attempt + 1))
            sleep "${delay}"
          done

      - name: Install sibling repos as editable (boundary test deps)
        working-directory: omnibase_infra
        # Use --overrides to install siblings with their full transitive deps while
        # forcing omnibase-infra to the locally-installed editable version from uv sync.
        # Same rationale as schema-handshake job above.
        run: |
          INFRA_VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          echo "omnibase-infra==${INFRA_VERSION}" > /tmp/sibling-overrides.txt
          echo "omnibase-compat @ file://$(pwd)/../omnibase_compat" >> /tmp/sibling-overrides.txt
          attempt=1
          max_attempts=5
          until uv pip install --overrides /tmp/sibling-overrides.txt -e ../omniintelligence; do
            status=$?
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::uv pip install sibling deps failed after ${attempt} attempt(s)"
              exit "${status}"
            fi
            echo "::warning::uv pip install sibling deps attempt ${attempt}/${max_attempts} failed with exit ${status}; retrying in 10s"
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Run Kafka boundary compatibility tests
        working-directory: omnibase_infra
        # ONEX_ALLOW_VENV_IMPURITY (OMN-15620): this job DELIBERATELY installs
        # omniintelligence (and its transitive onex.nodes providers) editable
        # into this venv, above, to run genuine cross-boundary compat tests --
        # that is not the undeclared/hand-installed pollution the venv-purity
        # gate (tests/conftest.py::pytest_configure) exists to catch, so this
        # job opts out by name rather than the gate silently allowlisting it.
        env:
          ONEX_ALLOW_VENV_IMPURITY: "1"
        run: |
          echo "================================================================"
          echo "Kafka Boundary Compat Tests (OMN-3256)"
          echo "xfail pairs = known drift tracked in open tickets (still PASS)"
          echo "================================================================"
          uv run pytest tests/integration/event_bus/test_kafka_boundary_compat.py \
            -v --tb=short || { code=$?; [ $code -eq 5 ] && echo "All tests skipped (omnimemory not installed) — OK for release chain" && exit 0 || exit $code; }

  # Writer-migration coupling check -- ensures any PR touching writer_postgres.py
  # or handler_*_postgres.py includes a migration file or explicit bypass comment (OMN-3530)
  migration-required-check:
    needs: occ-preflight
    timeout-minutes: 30
    name: Writer-Migration Coupling Check
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"
          install-args: '--reinstall-package omnibase-core --reinstall-package omnibase-spi --frozen'

      - name: Check writer-migration coupling
        run: uv run python scripts/check_migration_required.py --ci

  # Node migration declaration check -- every vendored node migration under
  # docker/migrations/forward/nodes/ must carry a checked-in stream/domain
  # declaration (application-migrations.tsv), explicit block
  # (application-migration-blocks.tsv), or audited historical declaration
  # (legacy-node-migrations.tsv) BEFORE it can reach a runtime.
  # scripts/validation/validate_application_migration_manifest.py already
  # implemented this exact check (plus checksum + duplicate + shape
  # validation) but was never wired anywhere -- only its own test file
  # exercised it directly. OMN-15717: node_pr_review_bot's
  # 001_create_review_bot_bypass_log.sql shipped undeclared and this
  # pre-existing, unwired validator would have caught it; it only failed
  # closed at a live bootstrap.sql deploy, weeks after merge.
  node-migration-declaration-check:
    needs: occ-preflight
    timeout-minutes: 30
    name: Node Migration Declaration Check
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"
          install-args: '--reinstall-package omnibase-core --reinstall-package omnibase-spi --frozen'

      - name: Check node migration declarations
        run: uv run python scripts/validation/validate_application_migration_manifest.py

  # Migration integration test -- spins up real Postgres, applies all migrations,
  # and asserts every manifest table exists (OMN-3529)
  migration-integration:
    name: Migration Integration Test
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnibase_infra
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"
          install-args: '--reinstall-package omnibase-core --reinstall-package omnibase-spi --frozen'

      - name: Verify Python Postgres client
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import asyncpg

          print(f"asyncpg {asyncpg.__version__}")
          PY

      - name: Resolve Postgres service host
        id: postgres_host
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import socket

          port = int(os.environ["POSTGRES_PORT"])

          def can_connect(host: str) -> bool:
              try:
                  with socket.create_connection((host, port), timeout=1.0):
                      return True
              except OSError:
                  return False

          if can_connect("127.0.0.1"):
              print("host=127.0.0.1")
              raise SystemExit(0)

          with open("/proc/net/route", encoding="utf-8") as routes:
              for line in routes.readlines()[1:]:
                  fields = line.split()
                  if len(fields) >= 3 and fields[1] == "00000000":
                      gateway_hex = fields[2]
                      gateway = ".".join(
                          str(int(gateway_hex[i : i + 2], 16))
                          for i in (6, 4, 2, 0)
                      )
                      if can_connect(gateway):
                          print(f"host={gateway}")
                          raise SystemExit(0)

          raise SystemExit(
              f"could not reach Postgres service on localhost or default gateway port {port}"
          )
          PY

      - name: Apply all migrations
        env:
          OMNIBASE_INFRA_DB_URL: postgresql://postgres:test_password@${{ steps.postgres_host.outputs.host }}:${{ job.services.postgres.ports['5432'] }}/omnibase_infra
        run: |
          uv run python scripts/run-migrations.py

      # OMN-15376: node-migration shape drift. Runs HERE, in the one job that
      # already owns a real Postgres, because the class is only observable by
      # EXECUTING the SQL against a pre-existing table of the wrong shape --
      # a CREATE TABLE IF NOT EXISTS silently no-ops and the next
      # column-dependent statement kills the deploy. The suite creates and drops
      # its own throwaway databases on this service; it never touches
      # omnibase_infra. The static half of the gate runs in the main test job.
      #
      # psql is required because the proof must use the SAME invocation the
      # deploy runners use (psql -v ON_ERROR_STOP=1 -f). Container runners may
      # lack it and may lack sudo (same constraint reusable-runtime-boot.yml
      # documents), so the client install is best-effort and the pytest step is
      # gated on the result -- an unobtainable psql degrades this to the static
      # gate rather than wedging a required job on a missing package.
      - name: Ensure psql client (best effort)
        id: ensure_psql
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -qq \
                && sudo apt-get install -y -qq --no-install-recommends postgresql-client \
                || true
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq \
                && apt-get install -y -qq --no-install-recommends postgresql-client \
                || true
            fi
          fi
          if command -v psql >/dev/null 2>&1 || ls /opt/homebrew/opt/postgresql@*/bin/psql >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::psql client unavailable — the OMN-15376 shape-drift EXECUTION proof cannot run on this runner; the static gate in tests/ci/test_node_migration_shape_reconciliation.py still applies."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node migration shape-drift proof (RED/GREEN + convergence)
        if: steps.ensure_psql.outputs.available == 'true'
        env:
          OMNIBASE_INFRA_DB_URL: postgresql://postgres:test_password@${{ steps.postgres_host.outputs.host }}:${{ job.services.postgres.ports['5432'] }}/omnibase_infra
          # Fail-closed inside the suite: with a Postgres in hand, a SKIP is a
          # vacuous green and is treated as an error.
          OMN15376_REQUIRE_PG: "1"
          # OMN-16412: the fixture hard-rejects a non-loopback ambient DSN
          # unless explicitly opted in. On this fleet's self-hosted runners
          # the job itself executes inside a container, so the "Resolve
          # Postgres service host" step above falls through past 127.0.0.1 to
          # the Docker bridge gateway (observed live: 172.18.0.1) -- that's
          # this job's OWN freshly-provisioned `services.postgres` container,
          # not a stray ambient var, so it gets the explicit opt-in here.
          OMN15376_ALLOW_REMOTE_PG: "1"
        run: |
          uv run pytest \
            tests/integration/migrations/test_node_migration_shape_drift_omn15376.py \
            -v --tb=short -p no:randomly

      - name: Assert manifest tables exist
        env:
          POSTGRES_HOST: ${{ steps.postgres_host.outputs.host }}
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          import asyncpg

          EXPECTED_TABLES = {
              "agent_actions",
              "agent_detection_failures",
              "agent_execution_logs",
              "agent_routing_decisions",
              "agent_status_events",
              "agent_transformation_events",
              "baselines_breakdown",
              "baselines_comparisons",
              "baselines_trend",
              "contracts",
              "db_error_tickets",
              "db_metadata",
              "gmail_intent_evaluations",
              "injection_effectiveness",
              "latency_breakdowns",
              "llm_call_metrics",
              "llm_cost_aggregates",
              "manifest_injection_lifecycle",
              "pattern_hit_rates",
              "registration_projections",
              "router_performance_metrics",
              "skill_executions",
              "topics",
              "schema_migrations",
          }


          async def main() -> None:
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  user="postgres",
                  password="test_password",
                  database="omnibase_infra",
              )
              try:
                  rows = await conn.fetch(
                      """
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                      ORDER BY table_name
                      """
                  )
              finally:
                  await conn.close()

              tables = {row["table_name"] for row in rows}
              for table in sorted(tables):
                  print(table)

              missing = sorted(EXPECTED_TABLES - tables)
              if missing:
                  raise SystemExit(
                      "FAIL: expected table(s) not found in database: "
                      + ", ".join(missing)
                  )


          asyncio.run(main())
          PY
          echo "All 24 tables present."

  # ============================================================================
  # Integration Silent-Skip Guard (OMN-14172)
  # An @pytest.mark.integration real-DB test that self-skips because Postgres
  # looks absent is a FALSE-GREEN: the required Tests job goes green while the
  # real-DB assertion never ran (the exact class of gap that let the omnimarket
  # OMN-14058 missing-column defect and the OMN-9041 UUID-cast crash reach dev
  # via a silent skip). Detection-only sweeps get ignored, so this ships as a
  # mechanical CI gate + pre-commit hook in the same PR (Operating Rule #5).
  #
  # This job PROVISIONS Postgres (explicit pull + run steps — see OMN-15249 note
  # on the job below for why NOT a `services:` block), applies all migrations,
  # exports the connection env, and runs a CURATED set of
  # Postgres-only integration proofs, then asserts via check_integration_skips.py
  # that (1) none skipped citing a *provisioned* service's absence and (2) at
  # least one integration test actually executed (zero-collection is itself a
  # false-green). Legitimately-optional skips (Kafka/Redpanda broker not
  # provisioned by design, live-LLM opt-in flags, catalog-data conditions) remain
  # allowed — the gate is keyed to the services this job actually provisions
  # (scripts/ci/integration_skip_guard.yaml).
  #
  # Wired as BLOCKING via the CI Summary umbrella context: this job's display
  # name is in ci_summary_gate.py SKIPPABLE_GATE_JOBS (present + success/skipped
  # required, same tier as migration-integration) AND the default-deny sweep
  # fails CI Summary on any non-success/skipped conclusion. No NEW
  # branch-protection required context is registered here — that is deferred to
  # the operator/Codex once the job proves green on real PRs.
  # SYNC: scripts/ci/check_integration_skips.py + pre-commit hook
  # 'integration-skip-guard'. Update both when the config changes.
  # ============================================================================
  integration-guard:
    name: Integration Silent-Skip Guard (OMN-14172)
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    # OMN-15249: Postgres is provisioned by EXPLICIT steps below, NOT a
    # GitHub-managed `services:` block. On #2492 (heads 1729c7c3 / dbfc0c98) the
    # services image pull timed out against registry-1.docker.io; that pull runs
    # inside GitHub's own "Initialize containers" step, which this repo cannot
    # name, cannot bound, and — critically — which steps carrying `if: always()`
    # still run past. The job therefore reached the silent-skip enforcement step
    # with no toolchain installed and terminated on `uv: command not found` /
    # `exit 127`, several steps removed from the registry timeout that caused it.
    # Owning the pull makes the failure fatal AT the pull, with the registry,
    # image, and timeout named in the annotation.
    # Proof: tests/ci/test_integration_guard_pull_fatality.py.
    env:
      GUARD_PG_IMAGE: postgres:16-alpine
      GUARD_PG_REGISTRY: registry-1.docker.io
      GUARD_PG_PULL_ATTEMPTS: "3"
      GUARD_PG_PULL_TIMEOUT_SECONDS: "120"
      GUARD_PG_PULL_BACKOFF_SECONDS: "8"
      GUARD_PG_READY_TIMEOUT_SECONDS: "120"
      GUARD_PG_CONTAINER: omn14172-guard-pg-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # FIRST step by design: nothing after a failed image pull can be trusted,
      # so the pull runs before checkout/toolchain setup are even attempted.
      # Bounded retry, fail-closed on exhaustion — never fall through.
      - name: Pull Postgres image (fail-closed, OMN-15249)
        id: pull_postgres
        run: |
          set -euo pipefail

          attempt=0
          while [ "${attempt}" -lt "${GUARD_PG_PULL_ATTEMPTS}" ]; do
            attempt=$((attempt + 1))
            echo "Pull attempt ${attempt}/${GUARD_PG_PULL_ATTEMPTS}: ${GUARD_PG_IMAGE} from ${GUARD_PG_REGISTRY} (per-attempt timeout ${GUARD_PG_PULL_TIMEOUT_SECONDS}s)"
            if timeout "${GUARD_PG_PULL_TIMEOUT_SECONDS}" docker pull "${GUARD_PG_IMAGE}"; then
              echo "Pulled ${GUARD_PG_IMAGE} on attempt ${attempt}/${GUARD_PG_PULL_ATTEMPTS}."
              exit 0
            fi
            echo "Attempt ${attempt}/${GUARD_PG_PULL_ATTEMPTS} failed."
            if [ "${attempt}" -lt "${GUARD_PG_PULL_ATTEMPTS}" ]; then
              sleep $((attempt * GUARD_PG_PULL_BACKOFF_SECONDS))
            fi
          done

          echo "::error title=Postgres image pull failed (OMN-15249)::Could not pull image ${GUARD_PG_IMAGE} from registry ${GUARD_PG_REGISTRY} after ${GUARD_PG_PULL_ATTEMPTS} bounded attempts (per-attempt timeout ${GUARD_PG_PULL_TIMEOUT_SECONDS}s). Failing closed AT the pull: the Integration Silent-Skip Guard emits no verdict for a run whose Postgres container never materialized. This is a registry/network failure, not a missing binary and not a test failure."
          exit 1

      # Replaces the `services:` health/port wiring: same image, same health
      # probe, same ephemeral published port. Fails closed if the container never
      # reports healthy, again with a named annotation.
      - name: Start Postgres container (fail-closed, OMN-15249)
        id: start_postgres
        run: |
          set -euo pipefail

          docker rm -f "${GUARD_PG_CONTAINER}" >/dev/null 2>&1 || true
          docker run --detach \
            --name "${GUARD_PG_CONTAINER}" \
            --env POSTGRES_PASSWORD=test_password \
            --env POSTGRES_DB=omnibase_infra \
            --health-cmd pg_isready \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            --publish 5432 \
            "${GUARD_PG_IMAGE}"

          deadline=$(( $(date +%s) + GUARD_PG_READY_TIMEOUT_SECONDS ))
          while true; do
            status="$(docker inspect -f '{{.State.Health.Status}}' "${GUARD_PG_CONTAINER}" 2>/dev/null || echo unknown)"
            if [ "${status}" = "healthy" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error title=Postgres container never became healthy (OMN-15249)::Container ${GUARD_PG_CONTAINER} (${GUARD_PG_IMAGE}) was still '${status}' after ${GUARD_PG_READY_TIMEOUT_SECONDS}s. Failing closed: no guard verdict is emitted without a provisioned Postgres."
              docker logs "${GUARD_PG_CONTAINER}" || true
              exit 1
            fi
            sleep 2
          done

          # Docker publishes 5432 on an ephemeral host port, exactly as the
          # `services:` block did; the next step resolves which interface the
          # runner can actually reach it on.
          published="$(docker port "${GUARD_PG_CONTAINER}" 5432/tcp | head -n 1)"
          port="${published##*:}"
          if [ -z "${port}" ]; then
            echo "::error title=Postgres port unresolved (OMN-15249)::docker port ${GUARD_PG_CONTAINER} 5432/tcp returned '${published}'."
            exit 1
          fi
          echo "port=${port}" >> "$GITHUB_OUTPUT"
          echo "Postgres healthy on published host port ${port}."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"
          install-args: '--reinstall-package omnibase-core --reinstall-package omnibase-spi --frozen'

      - name: Resolve Postgres service host
        id: postgres_host
        env:
          POSTGRES_PORT: ${{ steps.start_postgres.outputs.port }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import socket

          port = int(os.environ["POSTGRES_PORT"])

          def can_connect(host: str) -> bool:
              try:
                  with socket.create_connection((host, port), timeout=1.0):
                      return True
              except OSError:
                  return False

          if can_connect("127.0.0.1"):
              print("host=127.0.0.1")
              raise SystemExit(0)

          with open("/proc/net/route", encoding="utf-8") as routes:
              for line in routes.readlines()[1:]:
                  fields = line.split()
                  if len(fields) >= 3 and fields[1] == "00000000":
                      gateway_hex = fields[2]
                      gateway = ".".join(
                          str(int(gateway_hex[i : i + 2], 16))
                          for i in (6, 4, 2, 0)
                      )
                      if can_connect(gateway):
                          print(f"host={gateway}")
                          raise SystemExit(0)

          raise SystemExit(
              f"could not reach Postgres service on localhost or default gateway port {port}"
          )
          PY

      - name: Apply all migrations
        id: apply_migrations
        env:
          OMNIBASE_INFRA_DB_URL: postgresql://postgres:test_password@${{ steps.postgres_host.outputs.host }}:${{ steps.start_postgres.outputs.port }}/omnibase_infra
        run: |
          uv run python scripts/run-migrations.py

      # Export the connection env the curated integration proofs read. The
      # canonical PostgresConfig.from_env() reads ONLY OMNIBASE_INFRA_DB_URL (a
      # full DSN, no POSTGRES_* fallback), so that var is what flips the curated
      # proofs from "skipped" to "executed"; the POSTGRES_* set is exported too so
      # the guard stays correct if the curated set broadens to tests that read
      # discrete vars.
      - name: Export integration Postgres env
        id: export_pg_env
        env:
          RESOLVED_HOST: ${{ steps.postgres_host.outputs.host }}
          RESOLVED_PORT: ${{ steps.start_postgres.outputs.port }}
        run: |
          {
            echo "OMNIBASE_INFRA_DB_URL=postgresql://postgres:test_password@${RESOLVED_HOST}:${RESOLVED_PORT}/omnibase_infra"
            echo "POSTGRES_HOST=${RESOLVED_HOST}"
            echo "POSTGRES_PORT=${RESOLVED_PORT}"
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=test_password"
            echo "POSTGRES_DB=omnibase_infra"
            echo "POSTGRES_DATABASE=omnibase_infra"
          } >> "$GITHUB_ENV"
          echo "Exported integration Postgres env (host=${RESOLVED_HOST} port=${RESOLVED_PORT})"

      # Run ONLY the curated Postgres-only integration proofs (kept in sync with
      # integration_skip_guard.yaml curated_test_paths). The selected proof is
      # Postgres-only and self-contained against the freshly-migrated DB. Real integration
      # FAILURES fail this step directly; the silent-skip enforcement below still
      # runs on that path (that is the whole point of the guard).
      - name: Run curated Postgres integration proofs (Postgres provisioned)
        id: run_curated_proofs
        run: |
          uv run pytest \
            tests/integration/handlers/test_registration_storage_postgres_uuid_cast.py::TestRegistrationStoragePostgresUuidCast::test_query_round_trip_produces_stdlib_uuid \
            -rs -v --tb=short \
            --junitxml=integration-guard.xml

      # Fail-closed silent-skip enforcement. RED if any integration test skipped
      # citing a provisioned service's absence, or if zero integration tests ran.
      #
      # OMN-15249: deliberately NOT a bare `if: always()`. This step must fire when
      # the curated proofs RAN (success or failure) and must NOT fire when they were
      # never reached — a verdict about silent skips is meaningless for a run whose
      # Postgres container never materialized, and on #2492 the bare always() form
      # ran with no toolchain installed and surfaced `exit 127` as the job's terminal
      # error, hiding the registry pull timeout that actually caused the failure.
      - name: Enforce no missing-service silent-skips (OMN-14172)
        id: enforce_no_silent_skips
        if: always() && steps.run_curated_proofs.conclusion != 'skipped'
        run: |
          uv run python scripts/ci/check_integration_skips.py \
            --junit integration-guard.xml

      - name: Upload integration-guard results
        id: upload_guard_results
        if: always() && steps.run_curated_proofs.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: integration-guard-results
          path: integration-guard.xml
          retention-days: 7

      # Unconditional: a container started before a later step failed must never
      # be leaked onto a self-hosted runner. `|| true` keeps teardown from
      # inventing a second, misattributed failure on an already-failing job.
      - name: Stop Postgres container
        id: stop_postgres
        if: always()
        run: |
          docker rm --force "${GUARD_PG_CONTAINER}" >/dev/null 2>&1 || true

  ai-slop-check:
    needs: occ-preflight
    timeout-minutes: 30
    name: AI-Slop Pattern Check (strict, PR diff)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.12'
          skip-install: "true"
          cache-enabled: "false"
          shared-env-enabled: "true"
      - name: Compute changed Python/Markdown files vs PR base
        id: changed
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch origin "$GITHUB_BASE_REF" --no-tags --depth=1
            FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- '*.py' '*.md' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only HEAD~1 -- '*.py' '*.md' 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Check changed files for AI-slop patterns (strict)
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          if [ -z "$CHANGED_FILES" ]; then exit 0; fi
          echo "$CHANGED_FILES" | tr ' ' '\n' | xargs python scripts/validation/check_ai_slop.py --strict
