name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    # OMN-16171: `edited` is NOT in this list, and must not be re-added. The
    # OMN-14241 self-heal it used to provide now lives in
    # .github/workflows/occ-preflight-heal.yml.
    #
    # OMN-14241 was right about the defect: a PR-body-only edit stamping
    # `Evidence-Source: OCC#<n>` has to re-validate, or the pre-stamp
    # `occ-preflight / eligibility` FAILURE stands forever and CI Summary
    # fails closed on it (live cases: #2696, #2694). But paying for it with a
    # trigger type meant a brand-new run of this entire ~48-job matrix on
    # every body edit -- and because the concurrency group below cancels in
    # progress, each edit also killed whatever matrix was mid-flight and
    # restarted it from zero. Measured on #2784, one unchanged head SHA
    # 7993b115: waves at 13:28:50Z (42 workflows), 13:50:09Z (10) and
    # 13:51:33Z (8), while the org-wide backlog stood at 247 queued jobs.
    #
    # The heal workflow re-runs only the FAILED JOBS of this run, in place,
    # keeping the run id -- which is what CI Summary needs, since it polls its
    # own run's job list. Two jobs move instead of forty-eight, and nothing
    # in-flight is cancelled.
    #
    # Skipping the heavy jobs on an edited run was NOT an option: a job
    # skipped by an `if:` still publishes a `skipped` check run, which branch
    # protection counts as passing -- vector 2 of the required-check
    # skip-vector guard, i.e. a body-edit-shaped bypass of a red gate.
    #
    # OMN-16216: the three admission-signal types below are added on top of
    # GitHub's implicit default ([opened, synchronize, reopened]).
    # `ready_for_review` is load-bearing for the PRIMARY arm -- a draft->ready
    # flip must fire a full evaluation on the CURRENT head, because without it
    # the gated jobs' last published conclusion stays `skipped`, which branch
    # protection counts as passing (the same skip-vector shape OMN-16171 cites
    # above, reached by undrafting instead of by editing).
    # `labeled`/`unlabeled` serve the transition-window `ci:ready` fallback
    # arm on the same reasoning. Both are orders of magnitude rarer than the
    # body edits OMN-16171 measured -- label churn and a single undraft per
    # PR, not one per Evidence-Source stamp by an App-token bot -- so the
    # matrix-restart cost that motivated dropping `edited` does not transfer.
    # Pinned by tests/ci/test_ci_summary_gate.py::
    # test_ci_yml_pull_request_trigger_includes_ready_for_review.
    types:
      [
        opened,
        synchronize,
        reopened,
        labeled,
        unlabeled,
        ready_for_review,
      ]
  merge_group:
  workflow_dispatch:

# OMN-6488 / OMN-13949: cancel superseded runs on both PR pushes and merge_group
# re-enqueues. Superseded runs were holding saturated self-hosted runners; the
# fleet-load fix (OMN-13932 §5.2) makes killing them the default. The group keys
# on PR number (falling back to github.ref), and merge_group entries carry a
# unique github.ref so distinct queue entries never cross-cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.6.14"
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: "0.6.0"
  SHELLCHECK_VERSION: "v0.10.0"
  # OMN-12564 canary: trusted self-hosted CI reuses an immutable host-local
  # dependency environment keyed by uv.lock/tool versions instead of resolving
  # dependencies independently in every job. Public fork PRs keep isolated setup.
  # OMN-16073: the expression previously also disabled the shared env for
  # same-repo PRs targeting dev — correct while internal PR CI ran on
  # ubuntu-latest (no host-local env exists there), stale once OMN-15699
  # rerouted internal PRs onto the trusted self-hosted fleet. That leftover
  # forced every dev PR job down the isolated `uv sync --no-cache` path
  # (fleet-measured setup median 317s / max 613s per job, n=38). Trusted
  # same-repo PRs now use the shared env exactly as push/merge_group already
  # do. Lineage stays honest by construction: the env digest
  # (scripts/ci/ci_env_digest.py) includes pyproject.toml + uv.lock, so a
  # dependency-pin move produces a new digest and a cold install of the new
  # pin — a stale env can never mask a pin change.
  OMNI_CI_SHARED_ENV_ENABLED: >-
    ${{
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
      && 'false'
      || 'true'
    }}
  OMNI_CI_ENV_ROOT: "/home/runner/.cache/omni/ci-envs"
  # uv resolves several pinned git dependencies during CI.  The self-hosted
  # runner pool has intermittent HTTP/2 stream resets against GitHub; force git
  # subprocesses spawned by uv onto HTTP/1.1 so dependency installs are stable.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "http.version"
  GIT_CONFIG_VALUE_0: "HTTP/1.1"
  # Large transitive wheels such as torch and CUDA packages can exceed uv's
  # default timeout on self-hosted runners during sibling-boundary jobs.
  UV_HTTP_TIMEOUT: "600"
  # Force inmemory event bus for CI tests (no Kafka infrastructure available)
  # This overrides the default "kafka" in contracts/runtime/runtime_config.yaml
  ONEX_EVENT_BUS_TYPE: "inmemory"
  # Explicit database name for integration tests that pass POSTGRES_DATABASE
  # into Docker containers and for injection_effectiveness conftest.  Production
  # code uses OMNIBASE_INFRA_DB_URL instead (see docs/patterns/db_url_contract.md).
  POSTGRES_DATABASE: "omnibase_infra"
  # LLM endpoint CIDR allowlist — required by MixinLlmHttpTransport.
  # CI uses a dummy value since no LLM calls are made during tests.
  LLM_ENDPOINT_CIDR_ALLOWLIST: "10.0.0.0/8"

jobs:
  # OCC preflight is the first non-OCC CI dependency. If central OCC
  # evidence is missing or red, no runner-heavy validation jobs fan out.
  occ-preflight:
    # self-gating-ok: target is in omnibase_core, not a required check on omnibase_infra main
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@3608b195f9183b03e5dc58b03f325462896f1c0d
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts
      core-ref: dev

  # =============================================================================
  # Phase 0 - Zone filter (OMN-10475)
  # =============================================================================
  # Calls the reusable workflow in omnibase_core. When every changed file is in
  # the DOCS zone (including contracts/, drift/dod_receipts/, allowlists/,
  # .evidence/), heavy jobs (test-parallel, migration-integration) skip, while
  # lint, validators, contract gates, and receipt-gate callers still run.
  zone-filter:
    needs: occ-preflight
    uses: OmniNode-ai/omnibase_core/.github/workflows/zone-filter.yml@35fce1b6ae16a8fefec8996e26c1d66a3fb693c2
    with:
      python-version: "3.12"

  # =============================================================================
  # Phase 1 - Quick Validation (parallel, ~2-3 min)
  # =============================================================================
  # Phase 2 - Parallel Test Suite (after Phase 1 completes)
  #   15 splits of ~618 tests each (~2-3 min per split)
  # Phase 3 - Aggregation
  # =============================================================================

  lint:
    needs: occ-preflight
    name: Lint
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Check ruff formatting
        run: uv run ruff format --check src/ tests/

      - name: Check ruff linting (includes import sorting)
        run: uv run ruff check src/ tests/

      - name: Check shared enum ownership
        run: python scripts/check_shared_enum_ownership.py src/

      - name: Check Kafka bootstrap no localhost fallback (OMN-8783)
        run: uv run python scripts/ci_check_kafka_no_localhost_default.py

      - name: Check no localhost env fallbacks in src/ (OMN-10732)
        run: uv run python scripts/validate_no_env_fallbacks.py

      - name: Check topic suffix exports (F56)
        run: python scripts/validation/check_topic_suffix_exports.py

      - name: Single-canonical in-memory event bus (OMN-13419)
        run: bash scripts/validation/check_no_infra_inmemory_import.sh

      - name: Check Plugin* lifecycle class guard (OMN-13284, relocated to omnibase_core)
        run: uv run pre-commit run no-plugin-daemon-classes --all-files

      # OMN-13030: Deployed-SHA claims in handoff/OCC/evidence docs must carry an
      # adjacent `docker exec <container> cat /app/build-provenance.json` probe.
      # Enforcement, not detection: this runs the same gate as the pre-commit hook
      # over the docs tree so a bypassed local hook fails the PR.
      - name: Evidence provenance-probe gate (OMN-13030)
        run: |
          shopt -s globstar nullglob
          docs_files=(docs/**/*.md)
          if [ ${#docs_files[@]} -gt 0 ]; then
            for f in "${docs_files[@]}"; do
              uv run python scripts/check_evidence_provenance_probe.py --file "$f"
            done
          fi

      # OMN-13530: every operation_match (or absent-strategy) handler_routing
      # entry must declare a non-empty 'operation' field. A missing operation
      # makes the contract fail closed at RuntimeLocal startup ('handlers[i].
      # operation is missing' / result=failed) — the 0.46.0 regression that
      # took down the headless automation fleet. SYNC with pre-commit hook
      # 'operation-match-requires-operation'.
      - name: operation_match operation-field gate (OMN-13530)
        run: uv run python -m omnibase_core.validators.operation_match_requires_operation src/omnibase_infra

      # OMN-14141: every handler_routing.handlers[] entry must carry a nested
      # 'handler: {name, module}' mapping. The flat 'handler_class'/
      # 'handler_module' schema silently parses to ZERO dispatchers and then
      # phantom-wires the subscribed topic (WIRED with no live handler, offsets
      # still committed) — the WI-14 root cause (OMN-14139/OMN-14135). Fail-closed
      # gate paired with the runtime parse guard in
      # auto_wiring/discovery._parse_handler_routing. SYNC with pre-commit hook
      # 'handler-routing-schema-gate'.
      - name: handler_routing flat-schema gate (OMN-14141)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.handler_routing_schema src/omnibase_infra

      # OMN-14360 (OMN-14208 Path A): fail-closed gate on the
      # event_bus.tenant_scoped_ingress opt-in. A flag-true contract must bind
      # at least one tenant-<slug>.-prefixed subscribe_topic, and every other
      # subscribe_topic must be prefixed (so the OMN-14349 stamp covers it — a
      # bare/mixed topic lets a client tenant_id survive unverified) OR be an
      # allowlisted, producer-free trusted_internal topic (OMN-14482 carve-out),
      # AND the contract must be named in
      # config/validation/tenant_scoped_ingress_allowlist.yaml with a proving
      # seam test (no opt-in flip until a real cross-boundary test exists — the
      # OMN-14208 silent-no-op near-miss). SYNC with pre-commit hook
      # 'tenant-scoped-ingress-gate'. Placed alongside the handler_routing gate
      # (not contract-validation.yml, which validates ticket contracts via a
      # reusable action with no uv setup) so it runs in this already-required
      # lint job against the pinned toolchain.
      - name: tenant_scoped_ingress opt-in gate (OMN-14360)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.tenant_scoped_ingress_schema src/omnibase_infra

      - name: Check handler Any signature gate (OMN-10820)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.handler_any_signature --max-violations 0 src/omnibase_infra

      # OMN-14135: a contract-declared handler exposing NEITHER handle() nor
      # handle_async() is bound by auto-wiring to _missing_handle, which raises on
      # EVERY dispatch — while the contract validates, the node boots, and CI stays
      # green (HandlerA2ATask shipped exactly this way). Registration and routing do
      # NOT imply executability, so the OMN-14488 route-coverage gates cannot see it.
      # Runs here (unconditional, already-required lint job) rather than relying on
      # the pytest copy, which the change-aware selector could narrow away on the very
      # PR that adds a bad handler. Ratchet is frozen in
      # config/validation/handler_dispatch_entrypoint_baseline.yaml and is shrink-only.
      # SYNC with pre-commit hook 'handler-dispatch-entrypoint'.
      - name: Check handler dispatch-entrypoint gate (OMN-14135)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.handler_dispatch_entrypoint src/omnibase_infra

      # OMN-14605: a handler_routing entry whose _topics_for_handler_entry-assigned
      # topics span >1 real category (.cmd/.evt/.intent) gets ONE category stamped on
      # every route by handler_wiring, so the off-category topics are permanent
      # NO_DISPATCHER (silent DLQ/drop) while the node boots green — the OMN-14606
      # (node_swarm_fanout_orchestrator) live defect. MixinNodeDispatch (OMN-12549)
      # hard-rejects the same shape at registration; this gate flags it at CI time.
      # Ratchet frozen in config/validation/mixed_category_routing_baseline.yaml
      # (shrink-only). SYNC with pre-commit hook 'mixed-category-routing'.
      - name: Check mixed-category routing gate (OMN-14605)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.mixed_category_routing src/omnibase_infra

      # OMN-16088 (split from OMN-15978 AC4): an operation_match handler_routing entry
      # (carries `operation:`) with no `topic:`/`event_type:` scoping falls through to
      # _topics_for_handler_entry's unscoped branch and is assigned EVERY subscribe
      # topic on the contract, so N operation-scoped handlers each register for all N
      # topics — a message on ANY topic reaches every handler, and the ones whose
      # `operation` does not match crash or misfire (the pre-fix
      # node_gateway_attach_effect shape, OMN-15978). Ratchet frozen in
      # config/validation/operation_match_fanout_baseline.yaml (shrink-only). SYNC with
      # pre-commit hook 'operation-match-fanout'.
      - name: Check operation_match fan-out gate (OMN-16088)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.operation_match_fanout src/omnibase_infra

      - name: Check type-ignore budget gate (OMN-10822)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.type_ignore_budget --max-violations 74 src/omnibase_infra

      - name: LLM topology contract drift validator (OMN-11926)
        run: PYTHONPATH=src uv run python -m omnibase_infra.validators.llm_topology_validator contracts/llm_endpoints.yaml

      # OMN-13026: Transport-mock lint. Bare AsyncMock/MagicMock without
      # spec=/spec_set= on EventBus/transport/kafka surfaces. Ratchet: existing
      # violations frozen in config/validation/transport_mock_baseline.yaml. New
      # violations in any PR are blocked. Drain tracked by per-site tickets.
      # SYNC with pre-commit hook 'transport-mock-lint'.
      # Clone omnibase_core HEAD so the validator is available before the
      # OMN-13026 omnibase_core pin bump lands in the lockfile.
      - name: Checkout omnibase_core validator source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_core
          ref: dev
          path: .ci/omnibase_core
          token: ${{ secrets.OMNIBASE_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Transport-mock lint (OMN-13026)
        run: |
          PYTHONPATH=.ci/omnibase_core/src uv run python \
            -m omnibase_core.validators.transport_mock_lint \
            --baseline config/validation/transport_mock_baseline.yaml \
            tests/

      # Canonical handler-shape GROWTH RATCHET fan-out (OMN-14355/OMN-14368/OMN-14587).
      # compliance_sweep checks handler hygiene but is blind to handler SHAPE, so a
      # non-canonical handler passes green CI. This classifies each omnibase_infra
      # node's contract-declared handler (definition B: typed-payload handle(request)
      # -> response, adapted by the shared runtime, no envelope in the core), WARNs
      # the committed baseline's debt (scripts/ci/canonical_handler_shape_baseline.py,
      # OMN-14587: 92 non-canonical / 115 scanned), and HARD-FAILS a NEW non-canonical
      # node or baseline-count growth. Sourced from the sibling omnibase_core checkout
      # above (.ci/omnibase_core, already cloned for Transport-mock lint) since the
      # classifier lives at omnibase_core's repo-root scripts/ci/, not the installed
      # package. Runs --full (not the default --scope changed): the classifier's
      # diff-scoped git-diff runs with cwd = the classifier's OWN repo
      # (omnibase_core parents[2]), wrong for a fan-out invocation against this
      # sibling checkout — --full is cheap here (~115 nodes, sub-second).
      # No pre-commit mirror yet: same infeasibility already verified for the
      # omnimarket fan-out (OMN-14372) — pre-commit's language:python remote-hook
      # install only ships the installed src/omnibase_core/ package (classifier
      # isn't importable that way) and language:script has no dependency isolation
      # (needs pydantic/pyyaml); real fix is OMN-14563 (relocate the classifier into
      # an installed omnibase_core module). CI-only matches the omnimarket precedent.
      # --receipts-dir is mandatory here (OMN-14633 fix): the classifier's default
      # for a non-core --package is a directory NEXT TO ITS OWN __file__ (i.e.
      # inside the ephemeral .ci/omnibase_core sibling checkout above), which
      # never contains this repo's committed receipts. Without this flag every
      # proven flip (adequacy receipt + equivalence artifact committed under
      # THIS repo's scripts/ci/adequacy_receipts/) reports as unproven and
      # HARD-FAILS CI, defeating the whole flip-gate — caught while proving
      # node_coding_agent_workspace_compute's first flip against this baseline.
      - name: Canonical handler-shape ratchet (OMN-14355 fan-out, OMN-14587)
        run: |
          uv run python .ci/omnibase_core/scripts/ci/canonical_handler_shape.py \
            --package omnibase_infra --src-root src \
            --baseline scripts/ci/canonical_handler_shape_baseline.py \
            --receipts-dir scripts/ci/adequacy_receipts \
            --full

      # Fail-closed flip-bundle SEAM gate fan-out (OMN-14809 / OMN-15340 / OMN-15344).
      # The ratchet above proves a node's SHAPE. It is structurally blind to whether the
      # PROOF a flip carries is coherent, and — since OMN-15340 — to whether the declared
      # hand-flip parity tests are RED-for-the-right-reason at the receipt's own base_ref.
      # A parity test that is ALREADY GREEN on the pre-change tree discriminates nothing,
      # and the flip is credited with a behavior proof it never earned.
      #
      # That mechanism shipped in omnibase_core#1519 but ran in omnibase_core's CI ONLY,
      # while ALL 22 committed hand-flip receipts live in this repo (15) and
      # omnimarket/omnibase_infra — zero coverage over 100% of the population it was
      # built for. This step wires it HERE, in the same job, from the sibling
      # .ci/omnibase_core checkout already cloned above: no new job, no new workflow, no new
      # hook (net-negative-surface). Flags mirror the ratchet's so it reads THIS repo's
      # tree/receipts/baseline, not the ephemeral core checkout's — same --receipts-dir
      # reason as OMN-14633 above.
      #
      # NOT path-filtered, deliberately. The gate self-scopes to nodes NEWLY flipped vs
      # origin/dev and exits 0 when there are none (measured 2.4s on .200), so an
      # everyday PR pays nothing; a path filter on a fail-closed proof gate is a bypass.
      #
      # It also enforces scripts/ci/parity_red_on_base_baseline.py as a SHRINK-ONLY
      # ratchet: growth hard-fails, a stale entry hard-fails, and removing an entry
      # re-arms assertion 7 for that node and EXECUTES it. The inline fetch makes
      # origin/dev's tip available for flip-discovery (this checkout is shallow); the
      # gate NOTEs and exits 0 if it is still unavailable, exactly as in core.
      - name: Canonical-shape flip-bundle seam gate (OMN-15344 fan-out)
        run: |
          git fetch --no-tags --prune origin +refs/heads/dev:refs/remotes/origin/dev || true
          uv run python .ci/omnibase_core/scripts/ci/verify_flip_bundle.py \
            --package omnibase_infra --src-root src \
            --baseline scripts/ci/canonical_handler_shape_baseline.py \
            --receipts-dir scripts/ci/adequacy_receipts

      - name: Run mypy type checking
        run: uv run mypy src/omnibase_infra

  # RT-5 (OMN-14467): the deploy-trigger producer must fail closed on zero
  # output. Its RED-on-zero acceptance test and the anti-regression policy gate
  # live in tests/scripts/, which the change-aware selector does NOT pick for a
  # scripts/ change (empty reverse_deps) — so "CI Tests Gate" would green WITHOUT
  # running them, leaving enforcement only at the dev->main full suite. This
  # dedicated gate runs them IN-PR whenever the producer or the shared assertion
  # changes. It is registered in scripts/ci/ci_summary_gate.py STRICT_GATE_JOBS,
  # so a red result fails the required "CI Summary" context (fail-closed, in-PR).
  # The job always runs (present+success) to satisfy the strict completeness
  # anchor; the expensive setup+pytest runs only when the guarded files change
  # (or on non-PR events), keeping the everyday-PR cost near zero.
  effect-assertion-gate:
    needs: occ-preflight
    name: "Effect-Assertion Gate (RT-5)"
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect deploy-trigger / effect-assertion changes
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: |
            scripts/trigger_rebuild_on_merge.py
            src/omnibase_infra/utils/util_producer_effect_assertion.py
            tests/scripts/test_trigger_producer_effect_assertion.py
            tests/unit/utils/test_util_producer_effect_assertion.py

      - name: Setup Python and uv
        if: steps.changed.outputs.any_changed == 'true' || github.event_name != 'pull_request'
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Run RT-5 effect-assertion acceptance + policy tests
        if: steps.changed.outputs.any_changed == 'true' || github.event_name != 'pull_request'
        run: |
          uv run pytest \
            tests/scripts/test_trigger_producer_effect_assertion.py \
            tests/unit/utils/test_util_producer_effect_assertion.py \
            -v --tb=short

      - name: RT-5 gate not exercised (no producer/assertion change)
        if: steps.changed.outputs.any_changed != 'true' && github.event_name == 'pull_request'
        run: echo "No change to the deploy-trigger producer or the shared effect-assertion; RT-5 gate not exercised (present+green)."

  # ONEX validation - Infrastructure-specific validators
  onex-validation:
    needs: occ-preflight
    name: ONEX Validators
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Run architecture layer check
        run: |
          echo "================================================================"
          echo "Architecture Layer Verification (OMN-255)"
          echo "================================================================"
          uv run python scripts/validate.py architecture_layers --verbose

      - name: Run ONEX validators
        run: |
          uv run python scripts/validate.py all --verbose

      - name: Run I/O Purity Audit
        run: |
          echo "================================================================"
          echo "I/O Purity Audit (OMN-325)"
          echo "================================================================"
          uv run pytest tests/audit/test_io_violations.py::TestCIGateIOPurity -v --tb=short

      # OMN-15547: every enforcement guard must replay a REAL incident.
      # Rides this job on purpose — "ONEX Validators" is already in
      # ci_summary_gate.STRICT_GATE_JOBS, so the check gates merge through the
      # sole required context without adding a workflow, a job, or a required
      # context (net-negative-surface rule). Blocking from the first run: the
      # debt is baselined in the registry, so the only way to fail on day one is
      # to wire a NEW guard with no real regression case — which is the exact
      # behaviour this gate exists to stop.
      - name: Incident-replay coverage (OMN-15547)
        run: |
          echo "================================================================"
          echo "Incident-Replay Coverage (OMN-15547)"
          echo "================================================================"
          uv run python scripts/ci/check_incident_replay_coverage.py

      # ARCH-004 imperative-orchestrator ratchet (OMN-13472).
      # Full report over the repo: surfaces every contract-declared-but-unbound
      # orchestrator FSM driven imperatively by a handler (the delegation-shaped
      # anti-pattern ARCH-003 misses). Non-blocking INITIALLY (continue-on-error)
      # while the baseline is above threshold — the changed-node ratchet
      # (pre-commit, blocking) stops regressions. Promote to a required gate once
      # the baseline is below the agreed threshold; this rides OMN-12550
      # (validator gating) / OMN-13325 (ratchet enforcement), not a fresh hook.
      - name: Run imperative-orchestrator ratchet report (ARCH-004)
        continue-on-error: true
        run: |
          echo "================================================================"
          echo "Imperative-Orchestrator Ratchet Report (ARCH-004, OMN-13472)"
          echo "================================================================"
          uv run python scripts/validate.py imperative_orchestrators --verbose

      # ARCH-004 Signal B orchestration-monolith ratchet (OMN-13486).
      # Full report over the repo: surfaces every Class-B orchestration monolith
      # (oversized + complex + not executor-bound), independent of FSM
      # decorativeness — a DISTINCT signal from Signal A. Non-blocking INITIALLY
      # (continue-on-error) while the baseline is above threshold; the
      # changed-node ratchet (pre-commit, blocking) stops regressions. Rides
      # OMN-12550 / OMN-13325 — same path as Signal A, not a fresh hook.
      - name: Run orchestration-monolith ratchet report (ARCH-004 Signal B)
        continue-on-error: true
        run: |
          echo "================================================================"
          echo "Orchestration-Monolith Ratchet Report (ARCH-004 Signal B, OMN-13486)"
          echo "================================================================"
          uv run python scripts/validate.py orchestration_monoliths --verbose

      # ARCH-005 orchestrator/reducer handler state-invariant (OMN-14222).
      # Full-repo scan, BLOCKING (no continue-on-error): unlike ARCH-004
      # Signal A/B, this rule has ZERO ratchet baseline -- the repo carries
      # no unexempted violations, so a finding here is always a fresh
      # regression, not pre-existing debt working down to threshold.
      - name: Run orchestrator/reducer state-invariant gate (ARCH-005)
        run: |
          echo "================================================================"
          echo "Orchestrator/Reducer State Invariant (ARCH-005, OMN-14222)"
          echo "================================================================"
          uv run python scripts/validate.py orchestrator_reducer_state --verbose

      - name: Run markdown link validation
        run: |
          echo "================================================================"
          echo "Markdown Link Validation"
          echo "================================================================"
          uv run python scripts/validate.py markdown_links --verbose

      - name: Run DB quality gate
        run: |
          echo "================================================================"
          echo "DB Quality Gate - Forbid Domain-Specific Adapters (OMN-1785)"
          echo "================================================================"
          uv run python scripts/validate.py db_quality_gate --verbose

      - name: No Consul references (decommissioned — OMN-4857)
        run: |
          echo "================================================================"
          echo "No Consul references check (OMN-4857)"
          echo "================================================================"
          if grep -rn "CONSUL_HOST" src/; then
            echo "FAIL: CONSUL_HOST references found in src/ — Consul is decommissioned (OMN-4857)"
            exit 1
          fi
          echo "PASS: No CONSUL_HOST references in src/"

      - name: Check published_events consistency (OMN-4885)
        run: uv run python scripts/validation/check_published_events_consistency.py

      - name: Batch-validate all node contracts via model_validate() (OMN-9752)
        run: |
