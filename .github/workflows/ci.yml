  # Pin reachability -- every cross-repo pin (workflow `uses:`/`with:` refs,
  # pyproject [tool.uv.sources] revs, uv.lock git revs) must name a commit
  # reachable from a PROTECTED branch of the target repo (OMN-15538).
  #
  # Why this is a required gate and not a sweep: on 2026-07-30 two pins that
  # every existing validator accepted took production down twice. ci.yml
  # pinned a deleted omnimarket branch head and startup-failed for ~2.5h with
  # every open PR unmergeable (OMN-15536); omnimarket@dev pinned an unlanded
  # omnibase_core branch head straight past a prose comment forbidding it. The
  # pre-existing validators check hex SHAPE (`[0-9a-f]{40}`) and conclude
  # "immutable, therefore safe". Immutable is not reachable.
  pin-reachability:
    needs: occ-preflight
    if: always()
    name: Pin Reachability (OMN-15538)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Raised from 10 to 18 (2026-08-07, PR #2679 comment 5211687650): a
    # 38-run fleet measurement of THIS job found setup time (job start ->
    # script step start) alone had median 317s and max 613s under the
    # existing cache-enabled: "false" -- 6/38 runs were killed by the old
    # timeout-minutes: 10 (600s) DURING setup, before the script step ever
    # ran. ``cache-enabled: "false"`` is intentionally NOT flipped here: this
    # repo's self-hosted-fleet CI already replaced the per-job uv cache with
    # the shared host-local dependency-environment canary (see
    # ``docs/ci/versioned-ci-env-canary.md``), which explicitly says "Do not
    # enable setup-uv cache save for direct jobs that intentionally run
    # ``uv sync --no-cache``; the post-job cache upload can outlive the
    # actual check and cancel merge-group CI while adding no useful reuse" --
    # and ``tests/ci/test_ci_workflow_resilience.py::test_short_gates_can_disable_uv_cache_cleanup``
    # enforces ``cache-enabled: "false"`` on every ci.yml job uniformly for
    # exactly that reason. The fix here is timeout-minutes alone; the
    # derivation below is built on the measured fleet MAX (not an assumed
    # cache improvement) so it is correct with or without any future cache
    # change:
    #   613s (measured max setup, fleet n=38)
    # + 150s (script _RUN_DEADLINE_SECONDS, see check_pin_reachability.py)
    # + 150s (worst-case post-deadline tail: one in-flight rate-limited call,
    #         3 * 30s timeouts + 2 * 30s capped backoffs)
    # = 913s < 1080s, ~167s (~15%) real margin.
    # See scripts/ci/check_pin_reachability.py's _RUN_DEADLINE_SECONDS
    # comment for the full script-side derivation, and
    # tests/ci/test_pin_reachability_omn15538.py::test_pin_reachability_job_timeout_covers_measured_budget
    # for the binding test that parses this value from ci.yml and fails
    # closed if it stops covering the budget (or is gamed absurdly high).
    timeout-minutes: 18

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Every cross-repo pin must be reachable from dev or main
        env:
          # Read-only, public repos: the compare endpoint works unauthenticated
          # (60 req/hr). The ambient token is attached purely for rate-limit
          # headroom so a busy PR queue cannot turn the gate UNDETERMINED.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "================================================================"
          echo "Pin Reachability (OMN-15538)"
          echo "================================================================"
          # --min-pins is the anti-vacuity floor: this tree carries >20 pins, so
          # an extractor that suddenly finds fewer than 5 is broken, not clean.
          # No --allow-undetermined: the script REFUSES that flag when CI is set,
          # so an unresolvable pin fails the gate instead of skipping silently.
          uv run python scripts/ci/check_pin_reachability.py --min-pins 5

  # Expiring-ignore policy for fix-unavailable CVEs in the Trivy image gate
  # (OMN-16229, companion to OMN-16228). The Trivy scan itself only runs at
  # image-build time (push to main / workspace-candidate dispatch), which is
  # too late for PR-time feedback on a stale .trivyignore. This job runs the
  # SAME check (scripts/ci/check_trivyignore_expiry.py) on every PR so an
  # expired or malformed entry is caught before merge, not just at the next
  # build. Unconditional (no job-level `if:`, no path filter) -- the file is
  # tiny and the check is dependency-free stdlib Python, so there is no cost
  # to running it on every PR regardless of what changed.
  trivyignore-expiry-check:
    needs: occ-preflight
    name: Trivyignore Expiry Check (OMN-16229)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate .trivyignore expiry
        run: python3 scripts/ci/check_trivyignore_expiry.py .trivyignore

  # Lockfile CVE scan (OMN-16228) -- born from the 2026-08-18 sqlparse/Trivy
  # incident (OMN-16170): three HIGH sqlparse CVEs (fixed in 0.6.0) were only
  # caught by the Trivy scan on the built runtime IMAGE, deep in the deploy
  # pipeline, with a staging rollout batch queued behind the one-line fix.
  # This shifts detection left to dependency-pin time, on the PR that
  # introduces or keeps the vulnerable pin.
  #
  # Tool: osv-scanner (not pip-audit) -- osv-scanner parses uv.lock natively
  # (confirmed against the upstream supported-lockfiles list: Pipfile.lock,
  # poetry.lock, requirements.txt, pdm.lock, pylock.toml, uv.lock). pip-audit
  # has no uv.lock parser and would need an extra `uv export` translation
  # step. Pinned by ghcr.io digest (not a floating tag) for the same
  # reproducibility reason Trivy is pinned by commit SHA below.
  #
  # STRICT_GATE_JOBS + no job-level `if:` (fail-closed-on-skip): this job
  # always runs and always completes success/failure -- it never reports
  # `skipped`, which is invisible to a poller expecting `success` and reads
  # as SUCCESS when unregistered (the OMN-16225-class fail-open-by-skip
  # trap). Path relevance (does this PR touch pyproject.toml/uv.lock) is
  # decided by scripts/ci/check_lockfile_cve.py's `relevant` subcommand and
  # threaded through step-level `if:` guards via $GITHUB_OUTPUT -- the same
  # shape `detect-changes` already uses below -- so only the STEPS skip, the
  # job conclusion is always a real success/failure. See
  # scripts/ci/check_lockfile_cve.py's module docstring for the full
  # severity-classification + fix-availability + blocking-decision design.
  lockfile-cve-scan:
    needs: occ-preflight
    name: Lockfile CVE Scan (OMN-16228)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Raised from 5 (2026-08-18, live proof run on PR #2793): the DoD's
    # "under ~2 min" budget is about the scan's own runtime, not fleet setup
    # variance. Under contended-fleet conditions the SAME shared
    # setup-python-uv composite this job shares with every other job in this
    # file measured 6m42s before completing on a live run -- the job was
    # cancelled by the old 5-minute ceiling before osv-scanner ever ran, a
    # false-red unrelated to this job's own logic. Same shape as pin-
    # reachability's own timeout history (raised 10->18 for the identical
    # reason, see that job's comment above). 15 minutes matches the baseline
    # every other lightweight gate in this file already uses
    # (fingerprint-check, demo-loop-gate, etc.) for the same setup-variance
    # headroom; the scan itself remains fast.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Compute changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base" || true
            git diff --name-only "$base"...HEAD > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || echo "" > changed.txt
          fi

      - name: Determine scan relevance
        id: relevant
        run: |
          result=$(uv run python -m scripts.ci.check_lockfile_cve relevant \
            --changed-files-from changed.txt \
            --event-name "${{ github.event_name }}")
          echo "relevant=$result" >> "$GITHUB_OUTPUT"
          echo "Scan relevant: $result"

      # Runs the pinned+checksummed linux_amd64 binary directly, NOT via
      # `docker run -v $PWD:/src` (the first cut of this step, live-proof-run
      # defect found 2026-08-18 on PR #2793: self-hosted `omnibase-ci`
      # runners are themselves containerized -- Docker-outside-of-Docker --
      # so `$PWD` inside the runner container does not resolve to a real
      # path the HOST docker daemon can bind-mount. osv-scanner's own error
      # was unambiguous: "failed to resolve path: stat /src/uv.lock: no such
      # file or directory" -- the mount silently pointed at an empty
      # directory. A native binary has no mount boundary to get wrong, and
      # this repo already downloads pinned artifacts by URL+checksum
      # elsewhere rather than assuming Docker is available/DooD-safe on
      # every runner class (ubuntu-latest public-fork runners included).
      # SHA256 pinned from the release's own `osv-scanner_SHA256SUMS` file,
      # verified 2026-08-18 against a fresh download of both files.
      # Single retry on a transport/execution failure only (not on findings --
      # osv-scanner exits non-zero when it finds ANY vulnerability, which is
      # an expected outcome here, not a transient failure). Consistent with
      # the "single retry, then red" network-flakiness norm used elsewhere in
      # this workflow.
      - name: Run osv-scanner
        if: steps.relevant.outputs.relevant == 'true'
        env:
          OSV_SCANNER_URL: "https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64"
          OSV_SCANNER_SHA256: "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"
        run: |
          set -uo pipefail
          curl -sSL --fail "$OSV_SCANNER_URL" -o /tmp/osv-scanner
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          attempt_scan() {
            /tmp/osv-scanner scan --lockfile=uv.lock --format=json > osv-results.json 2> osv-scan.log
          }
          valid_json() {
            python3 -c "import json; json.load(open('osv-results.json'))" 2>/dev/null
          }
          attempt_scan || true
          if ! valid_json; then
            echo "osv-scanner did not produce valid JSON on attempt 1 -- retrying once:"
            cat osv-scan.log || true
            attempt_scan || true
          fi
          if ! valid_json; then
            echo "osv-scanner failed on both attempts -- treating as a real scan failure, not a clean result."
            cat osv-scan.log || true
            exit 1
          fi
          echo "osv-scanner produced valid JSON output."

      - name: Evaluate lockfile CVE findings
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          uv run python -m scripts.ci.check_lockfile_cve evaluate --osv-json osv-results.json

      - name: No relevant lockfile changes
        if: steps.relevant.outputs.relevant != 'true'
        run: echo "pyproject.toml/uv.lock unchanged in this diff -- skipping the substantive scan (job still reports success, not skipped)."

  # Lockfile registry-host allowlist (OMN-16516) -- structural (tomllib, not
  # regex) fail-closed backstop for the 2026-08-23 mirror-leak incident
  # (OMN-16162, docs/plans/2026-08-23-cloud-ci-offload-plan.md Stage 1): a
  # single bot commit baked 783 `source = { registry = ... }` lines into
  # onex_change_control/uv.lock pointing at the Tailscale-only devpi mirror
  # omninode-pc.tail75df5e.ts.net:3141 -- 100% of the file's registry lines,
  # 0 at pypi.org. Any runner without tailnet access hard-fails `uv sync
  # --locked` at resolution, regardless of runner label or cache state.
  #
  # This gate is independent of, and does not substitute for, sanitizing the
  # known lock-generating workflows (OMN-16517) or a repo-level public-index
  # pin (OMN-16518) -- it catches a re-leaked lock from ANY channel,
  # including ones not yet identified. THIS JOB HAS NO job-level `if:`
  # (unconditional, cheap, dependency-free -- a single-file TOML parse), so
  # it always completes success/failure; a skip/absence here is anomalous
  # and correctly fails closed, same STRICT_GATE_JOBS shape as
  # "Pin Reachability (OMN-15538)" and "Lockfile CVE Scan (OMN-16228)" above.
  lockfile-registry-allowlist:
    needs: occ-preflight
    if: always()
    name: Lockfile Registry Allowlist (OMN-16516)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Matches the lightweight-gate baseline used elsewhere in this file
    # (fingerprint-check, demo-loop-gate, lockfile-cve-scan) for setup-variance
    # headroom; the check itself is a single in-process TOML parse.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: Every uv.lock package source must resolve to an allowlisted public host
        run: |
          echo "================================================================"
          echo "Lockfile Registry Allowlist (OMN-16516)"
          echo "================================================================"
          # --min-packages is the anti-vacuity floor (same shape as pin-
          # reachability's --min-pins): this repo's uv.lock carries ~196
          # packages at the time this gate was added, so 20 is a floor far
          # below any plausible legitimate lockfile size, not a live count
          # that needs updating on every dependency bump.
          uv run python scripts/ci/check_lockfile_registry_allowlist.py uv.lock --min-packages 20

  # Dep-provenance content-lineage gate (OMN-15604) -- a [tool.uv.sources]
  # git-pinned rev must build the SAME src/ tree as the released tag its
  # PyPI version string declares, even when the line carries a
  # `# raw-override-ok:` escape token.
  #
  # Why this is a separate gate from `Dep Provenance Gate` (OMN-13873,
  # .github/workflows/dep-provenance-gate.yml): that gate forbids a git
  # source unconditionally but exempts any line with a non-empty escape
  # token -- shape-only, never checked against content. Live incident this
  # closes: omnibase_infra@dev declared omnibase-core==0.46.8 while pinning
  # git rev 3d51b047 (escaped via `# raw-override-ok: OMN-15414`) whose
  # src/ tree measurably DIFFERED from released tag v0.46.8 (9 files,
  # +381/-27 lines) -- invisible to every existing check because the escape
  # token exempted the only gate that looks at this file at all. This job
  # lives in ci.yml (not the standalone dep-provenance-gate.yml workflow)
  # so it is immediately observable by the `CI Summary` STRICT_GATE_JOBS
  # assertion without needing the EXPECTED_EXTERNAL_CONTEXTS admission
  # rule's historical report-rate measurement, which a brand-new context
  # cannot satisfy on day one.
  dep-provenance-lineage-gate:
    needs: occ-preflight
    if: always()
    name: Dep Provenance Lineage Gate (OMN-15604)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"

      - name: A git-pinned override must build the released tree of its declared version
        env:
          # Read-only, public repos: the commits/trees endpoints work
          # unauthenticated (60 req/hr). The ambient token is attached purely
          # for rate-limit headroom so a busy PR queue cannot turn the gate
          # UNDETERMINED.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "================================================================"
          echo "Dep Provenance Lineage Gate (OMN-15604)"
          echo "================================================================"
          # No --allow-undetermined-lineage: the script REFUSES that flag
          # when CI is set, so an unresolvable pin fails the gate instead of
          # skipping silently. --check-lineage runs the network-dependent
          # half in addition to the existing offline forbid-git-source check.
          uv run python scripts/check_dep_provenance.py --check-lineage

      - name: A raw-override-ok escape token must not be expired or cite a closed ticket
        env:
          # Optional: the ticket-status half of this check gracefully
          # degrades (skips, does not fail) when LINEAR_API_KEY is unset --
          # same posture as this org's other already-shipped, LINEAR_API_KEY-
          # gated Linear check (see stale-todo-gate.yml). The until= date
          # half of the check needs no credential and always runs.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          echo "================================================================"
          echo "Dep Provenance Escape-Token Reconciliation (OMN-15604 AC3)"
          echo "================================================================"
          uv run python scripts/check_dep_provenance.py --check-token-expiry

  # Topic drift check -- CI gate validating SUFFIX_* constants against contracts (OMN-5248/OMN-5258)
  # Ensures static topic constants stay in sync with contract.yaml topic declarations.
  # Cross-repo scanning (OMN-5258): checks out sibling repos to resolve topic references.
  topic-drift-check:
    needs: occ-preflight
    if: always()
    name: Topic Drift Check
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # The drift scan is short, but self-hosted post-job cache/archive cleanup
    # has exceeded 5 minutes under runner pressure.
    timeout-minutes: 15

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: omnibase_infra

      - name: Checkout omniintelligence (sibling contracts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omniintelligence
          path: omniintelligence
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout omnimemory (sibling contracts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimemory
          path: omnimemory
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout omniclaude (sibling contracts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omniclaude
          path: omniclaude
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python and uv
        uses: ./omnibase_infra/.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"
          cache-key-prefix: uv-topic-drift
          lock-file-path: 'omnibase_infra/**/uv.lock'
          working-directory: omnibase_infra

      - name: Check topic drift (cross-repo)
        working-directory: omnibase_infra
        run: |
          echo "================================================================"
          echo "Topic Drift Check (OMN-5248/OMN-5258)"
          echo "Cross-repo scanning: omniintelligence, omnimemory, omniclaude"
          echo "================================================================"
          uv run python scripts/check_topic_drift.py \
            --contracts-dir src/omnibase_infra/nodes \
            --extra-contracts-dir ../omniintelligence/src/omniintelligence/nodes \
            --extra-contracts-dir ../omnimemory/src/omnimemory/nodes \
            --extra-contracts-dir ../omniclaude/src/omniclaude/nodes \
            --warn-only

  # Schema handshake gate -- validates producer->consumer Pydantic round-trip
  # across every registered Kafka boundary pair (OMN-3411).
  # Uses --changed-only in CI: only checks pairs whose models were touched by the PR.
  # Requires sibling repos omniintelligence + omnimemory to be checked out.
  schema-handshake:
    needs: occ-preflight
    name: Kafka Schema Handshake (OMN-3411)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: omnibase_infra

      - name: Checkout omniintelligence (sibling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omniintelligence
          path: omniintelligence
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout omnimemory (sibling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimemory
          path: omnimemory
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout omnibase_compat (sibling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnibase_compat
          path: omnibase_compat
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python and uv
        uses: ./omnibase_infra/.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          cache-version: ${{ env.CACHE_VERSION }}
          cache-enabled: "false"
          cache-key-prefix: uv-handshake
          lock-file-path: 'omnibase_infra/**/uv.lock'
          working-directory: omnibase_infra
          shared-env-enabled: "false"

      - name: Preinstall CPU-only torch for sibling deps
        working-directory: omnibase_infra
        run: |
          set -eu
          export UV_HTTP_TIMEOUT="${UV_HTTP_TIMEOUT:-600}"
          attempt=1
          max_attempts=5
          until uv pip install "torch>=2.6.0,<3.0.0" --index-url https://download.pytorch.org/whl/cpu; do
            status=$?
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::uv pip install schema-handshake torch CPU wheel failed after ${attempt} attempt(s)"
              exit "${status}"
            fi
            delay=$((attempt * 10))
            echo "::warning::uv pip install schema-handshake torch CPU wheel attempt ${attempt}/${max_attempts} failed with exit ${status}; retrying in ${delay}s"
            attempt=$((attempt + 1))
            sleep "${delay}"
          done

      - name: Install sibling repos as editable (boundary pair deps)
        working-directory: omnibase_infra
        # Use --overrides to install siblings with their full transitive deps while
        # forcing omnibase-infra to the locally-installed editable version from uv sync.
        # This avoids the cascade-window version conflict (siblings pin a released version
        # of omnibase-infra that may lag behind the current PR) while ensuring transitive
        # deps like adaptive-classifier are properly installed.
        # Prior approach (--no-deps) skipped transitive deps entirely, causing
        # ModuleNotFoundError for packages like adaptive_classifier at collection time.
        run: |
          set -eu
          INFRA_VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          echo "omnibase-infra==${INFRA_VERSION}" > /tmp/sibling-overrides.txt
          echo "omnibase-compat @ file://$(pwd)/../omnibase_compat" >> /tmp/sibling-overrides.txt
          export UV_HTTP_TIMEOUT="${UV_HTTP_TIMEOUT:-600}"
          attempt=1
          max_attempts=5
          until uv pip install --overrides /tmp/sibling-overrides.txt -e ../omniintelligence; do
            status=$?
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::uv pip install schema-handshake sibling deps failed after ${attempt} attempt(s)"
              exit "${status}"
            fi
            delay=$((attempt * 10))
            echo "::warning::uv pip install schema-handshake sibling deps attempt ${attempt}/${max_attempts} failed with exit ${status}; retrying in ${delay}s"
            attempt=$((attempt + 1))
            sleep "${delay}"
          done

      - name: Run schema handshake validation (changed-only)
        working-directory: omnibase_infra
        run: |
          echo "================================================================"
          echo "Kafka Schema Handshake Gate (OMN-3411)"
          echo "Mode: --changed-only (only pairs whose models changed in this PR)"
          echo "================================================================"
          uv run python scripts/validate-kafka-schema-handshake.py --changed-only || { code=$?; [ $code -eq 2 ] && echo "Sibling packages not fully installed — OK for release chain" && exit 0 || exit $code; }

  # Arch invariants: block raw topic literals in production code (OMN-3343)
  # Scans src/**/*.py for onex.(evt|cmd).* string literals outside canonical
  # topic definition files. Pre-existing violations are suppressed via baseline.
  arch-invariants:
    needs: occ-preflight
    name: Arch Invariants (OMN-3343)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
