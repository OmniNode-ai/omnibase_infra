#
# Public Repo Hygiene -- thin caller. OMN-18016, epic OMN-17992.
#
# This repository is PUBLIC. The gate refuses internal operating detail landing
# in it: an undeclared top-level directory, an agent-state or evidence tree, a
# misplaced dated document, a brand asset, an env file, cloud identity, a
# private address, an operator machine path, a private repository name, and
# internal-KB prose in a public README.
#
# mode: report. The gate records every finding and exits 0, so it lands without
# blocking unrelated PRs on a repository that carries pre-existing residue. It
# flips to enforce when that residue is FIXED -- never by moving it into
# .public-repo-hygiene.yaml.
#
# Layer (a) reads .public-repo-hygiene.yaml at this repo's root; the gate
# refuses to run without it rather than treating an absent config as an empty
# allowlist.
#
# `secrets: inherit` IS REQUIRED: the denylist vocabulary lives in a private
# repository and the reusable workflow mints an installation token to read it.
# Without the secrets the gate fails CLOSED, which is the correct behaviour and
# a loud one.
#
# The pin is a SINGLE source of truth: the reusable workflow checks its own
# validator out at github.job_workflow_sha, i.e. this very SHA, so the workflow
# and the script can never drift apart. Pin to an omniclaude commit on `dev`;
# `main` is release-synced and does not carry the gate.

name: Public Repo Hygiene

on:
  pull_request:
    branches: [dev]

# OMN-19640: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  public-repo-hygiene:
    # OMN-19766: bumped from a0142e36 because the gate now refuses without a
    # LAB vocabulary, and a0142e36's workflow neither fetches nor passes one.
    #
    # WHY THE OLD PIN BROKE WITHOUT ANYTHING HERE CHANGING. a0142e36 checks its
    # validator out at `inputs.validator_ref || github.job_workflow_sha`. In the
    # failing runs that context was empty, so `ref:` was empty and
    # actions/checkout fell back to omniclaude's DEFAULT BRANCH -- run
    # 36274095035 fetched `+refs/heads/dev:refs/remotes/origin/dev` for
    # OmniNode-ai/omniclaude, not the pinned sha. So the workflow was pinned and
    # its validator floated: omniclaude's dev grew the lab-vocabulary
    # requirement (9 references at 0d80bf53, 0 at a0142e36) and every PR in this
    # repository began failing closed on a file the pinned workflow never
    # fetches. That floating-ref defect belongs to omniclaude and is filed
    # separately; this bump is what makes THIS repository's gate self-consistent
    # again, and it is the same revision onex_change_control already runs green.
    #
    # `validator_ref` is passed EXPLICITLY rather than left to the fallback, so
    # the validator cannot drift from the workflow again even if that context is
    # empty. A pin that silently degrades to HEAD is not a pin.
    uses: OmniNode-ai/omniclaude/.github/workflows/public-repo-hygiene-reusable.yml@0d80bf531d13d988d0890ba80a1f8cf7f2e1a436
    with:
      mode: report
      validator_ref: 0d80bf531d13d988d0890ba80a1f8cf7f2e1a436
    secrets: inherit
