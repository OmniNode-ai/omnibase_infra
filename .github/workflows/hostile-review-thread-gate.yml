---
# The on-reply gate runs PR-head code with read-only permissions and no secrets.
# It uploads a request for hostile-review-judge.yml, which judges on the base branch.

name: Hostile Review Thread Gate (on reply)

on:
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hostile-review-thread-gate:
    name: Hostile Review Thread Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (gate script and PR history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Find rejections awaiting the review bot
        id: pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HOSTILE_REVIEW_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          JUDGE_STATUS_PATH: ${{ runner.temp }}/hostile-review-judge-status.json
          JUDGE_PENDING_PATH: ${{ runner.temp }}/hostile-review-pending.json
        run: python3 scripts/ci/check_hostile_review_threads.py --pending "$JUDGE_PENDING_PATH"

      - name: Write the judge request
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PENDING_COUNT: ${{ steps.pending.outputs.count || '0' }}
        run: python3 scripts/ci/check_hostile_review_threads.py --write-request "${{ runner.temp }}/hostile-review-judge-request/request.json"

      - name: Upload the judge request
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hostile-review-judge-request
          path: ${{ runner.temp }}/hostile-review-judge-request
          retention-days: 1
          # A missing request fails the judge's download step, which then
          # judges nothing; the gate step below blocks on its own.
          if-no-files-found: warn

      - name: Check hostile-reviewer threads and their dispositions
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DISPOSITION_RECORD_PATH: ${{ runner.temp }}/hostile-review-dispositions.jsonl
          JUDGE_STATUS_PATH: ${{ runner.temp }}/hostile-review-judge-status.json
        run: python3 scripts/ci/check_hostile_review_threads.py
      - name: Upload the disposition record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hostile-review-dispositions-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hostile-review-dispositions.jsonl
            ${{ runner.temp }}/hostile-review-judge-status.json
          if-no-files-found: ignore
          retention-days: 90
