#
# CodeQL security and quality analysis for omnibase_infra.
# Kept repo-local so CodeQL can use the repo config that excludes CI metadata.
# OMN-5425

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    # OMN-16216: labeled/unlabeled/ready_for_review so applying/removing
    # ci:ready or a draft->ready flip retriggers this workflow's evaluation
    # of the codeql job's if:.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  # OMN-13949: cancel superseded PR runs to free saturated runners. merge_group
  # entries carry a unique github.ref, so queue entries never cross-cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # OMN-22896: the TruffleHog scanner the secret scan runs, by immutable digest, the same digest
  # the organization's reference security-scan workflow (omnimarket) pins. Resolved from
  # ghcr.io/trufflesecurity/trufflehog:latest on 2026-11-07, when :latest and :3.99.8 both pointed
  # at this digest. Bump it in a reviewed PR.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a

jobs:
  codeql:
    timeout-minutes: 30
    name: CodeQL
    # OMN-16216 draft-state CI admission gate (mirrors onex_change_control
    # PR #6686 / OMN-15731): "CodeQL" is an EXPECTED_EXTERNAL_CONTEXTS member
    # in scripts/ci/ci_summary_gate.py, where EXTERNAL_GOOD_CONCLUSIONS =
    # {"success"} -- a "skipped" conclusion already fails closed there with
    # no code change needed, so gating this job on draft/ci:ready is safe
    # as-is for pull_request events. push/schedule are unaffected (no PR to
    # gate on). Main-boundary carve-out unchanged.
    if: github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:ready')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          category: /language:python
          # GitHub code-scanning upload/processing returned malformed .github
          # annotations for this PR. Keep the required CodeQL execution check
          # useful without blocking on server-side SARIF processing.
          upload: never
          wait-for-processing: false

  # OMN-22896: secret scanning. This repository is public, so the job runs on a hosted runner and
  # never on an internal one. The action pin is the one the reference security-scan workflow of this
  # organization carries.
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The TruffleHog action is only a wrapper around a `docker run` of
      # ghcr.io/trufflesecurity/trufflehog:latest, so pinning the action pinned nothing that scans.
      # These steps run the image by digest (env.TRUFFLEHOG_IMAGE) and rebuild the arguments the
      # action at 586f66d7886cd0b037c7c245d4a6e34ef357ab10 built, so scope, flags and pass/fail
      # behaviour are unchanged.
      # --exclude-detectors=lob (OMN-16045): Lob detector regex (v3.95.9+) mass-verifies test_-prefixed pytest identifiers as live keys; zero Lob usage in this repo. Dropping it is its own reviewed change, not part of a digest bump.
      - name: TruffleHog Secret Scanning (push diff)
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.event.after }}
        run: |
          # The action's explicit base/head path: resolve both, refuse an empty range.
          git status >/dev/null
          base_commit=$(git rev-parse "$BASE" 2>/dev/null) || true
          head_commit=$(git rev-parse "$HEAD" 2>/dev/null) || true
          if [ "$base_commit" == "$head_commit" ]; then
            echo "::error::BASE and HEAD commits are the same. TruffleHog won't scan anything."
            exit 1
          fi
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --github-actions \
            --only-verified --exclude-detectors=lob

      - name: TruffleHog Secret Scanning (full scan)
        if: github.event_name != 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The action's event path: a pull request scans base..head, a schedule
          # or manual run scans the whole history.
          git status >/dev/null
          BASE=""
          HEAD=""
          if [ "$EVENT_NAME" == "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          fi
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --github-actions \
            --only-verified --exclude-detectors=lob

      # OMN-22896: the planted control. Reads the whole history for the control token declared in
      # .github/trufflehog-control.yml; an added token turns this step red.
      - name: TruffleHog planted control
        run: |
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --config=.github/trufflehog-control.yml \
            --include-detectors=CustomRegex \
            --results=unverified \
            --no-verification \
            --fail \
            --no-update \
            --github-actions
