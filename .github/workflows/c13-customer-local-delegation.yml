# c13-customer-local-delegation.yml — OMN-19179
#
# WHAT THIS IS
#   The PRODUCER for beta criterion C13: "Customer-local delegation on a
#   no-checkout machine: three files, local model named, zero provider calls".
#   This job's EXIT CODE is that criterion's verdict — the shape C11
#   (chain-canary-c11-negative-paths.yml) and C15 (chain-canary.yml) already
#   set, which the board reads without a second grader anywhere.
#
# THE MACHINE IS A FRESH GITHUB-HOSTED VM, AND THAT IS THE POINT
#   "No-checkout" means the customer has no OmniNode repository: they install
#   the published packages and run a delegation. A self-hosted lab runner is the
#   wrong machine for that by construction — every one of them sits beside
#   canonical clones, lab credentials and a lane broker. A hosted runner starts
#   from a stock image every time and carries none of that.
#
#   This repository is PUBLIC, which is why the producer lives here rather than
#   beside the board: hosted minutes in a private repository in this org have
#   not started since 2026-09-02, and a probe that never starts is a disabled
#   probe.
#
# THERE IS NO actions/checkout IN THIS JOB, DELIBERATELY
#   A checkout of this repository is a checkout of omnibase_infra — one of the
#   five distributions the delegation imports. Its presence would contaminate
#   the very clause the job exists to prove. The two scripts the job needs are
#   fetched by curl at THIS run's commit, so the machine never holds a clone,
#   and the probe's source-tree scan would find one if it did.
#
# THE LOCAL MODEL IS PINNED TWICE
#   A llama.cpp release build and a GGUF, each verified against a sha256 below
#   before anything runs. Qwen2.5-3B-Instruct is the smallest model measured to
#   pass the document task class on this platform: 0.5B and 1.5B never emit the
#   answer marker the markdown extraction requires, so extraction refuses and
#   the run climbs (measured 2026-09-22). A model too weak to answer would turn
#   this probe red for a reason that is not C13's.
#
# THE CUSTOMER CONFIGURATION IS UNDOCUMENTED, AND THE RECORD SAYS SO
#   A clean install refuses on the routing-tiers path binding before any model
#   is reached, and no public guide says what to put there (OMN-16200). The
#   probe authors the smallest customer configuration that works — a routing
#   file whose only model is on the local tier, and an overlay pointing the
#   shipped local backend at loopback — and records it verbatim. It does this
#   AFTER a negative control run, so the refusal is observed first.
#
# NO pull_request TRIGGER
#   Same ruling as the C11 producer: the advisory-job-gate (OMN-18775) refuses
#   a job that runs on pull requests without being a required context, and this
#   one downloads two gigabytes. Re-run on demand with workflow_dispatch.

name: C13 customer-local delegation (no-checkout machine)

on:
  schedule:
    # Twice a day at :29, offset from the C11 producer (:17) and the chain
    # canary (:41) so the board's three probes never share a minute.
    - cron: '29 4,16 * * *'
  workflow_dispatch:
  # TEMPORARY, reverted before merge: the one pre-merge run on a hosted machine,
  # scoped to this branch only (workflow_dispatch cannot reach a workflow that
  # is not yet on the default branch).
  push:
    branches:
      - jonah/omn-19179-c13-customer-local-producer

concurrency:
  group: c13-customer-local-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LLAMA_BUILD: b11108
  LLAMA_ASSET: llama-b11108-bin-ubuntu-x64.tar.gz
  LLAMA_SHA256: 24aaa8dfa8ba64a9134e6d18e8b44389414a560a9ea9799b460a9fb5aab97818
  MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
  MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
  MODEL_SHA256: 626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d
  SERVED_MODEL: qwen2.5-3b-instruct
  MODEL_PORT: '18731'

jobs:
  c13-customer-local:
    name: C13 customer-local delegation (hosted clean machine)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Fetch the probe scripts at this commit (no repository checkout)
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/c13-probe"
          for script in c13_customer_local_probe.py assert_evidence_artifact.py; do
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/c13-probe/${script}" \
              "https://raw.githubusercontent.com/${REPO}/${SHA}/scripts/ci/${script}"
          done
          ls -la "${RUNNER_TEMP}/c13-probe"

      - name: Install strace
        run: |
          set -euo pipefail
          command -v strace || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }
          strace -V | head -1

      - name: Restore the pinned model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/c13-model
          key: c13-model-${{ env.MODEL_SHA256 }}

      - name: Fetch and verify the pinned model and server build
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/c13-model" "${RUNNER_TEMP}/c13-llama"
          cd "${RUNNER_TEMP}/c13-model"
          [ -f "${MODEL_FILE}" ] || curl -fsSL --retry 3 -o "${MODEL_FILE}" "${MODEL_URL}"
          echo "${MODEL_SHA256}  ${MODEL_FILE}" | sha256sum -c -
          cd "${RUNNER_TEMP}/c13-llama"
          curl -fsSL --retry 3 -o "${LLAMA_ASSET}" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/${LLAMA_ASSET}"
          echo "${LLAMA_SHA256}  ${LLAMA_ASSET}" | sha256sum -c -
          tar -xzf "${LLAMA_ASSET}"

      - name: Start the local model server on loopback
        run: |
          set -euo pipefail
          server="$(find "${RUNNER_TEMP}/c13-llama" -name llama-server -type f | head -1)"
          test -x "${server}"
          cd "$(dirname "${server}")"
          LD_LIBRARY_PATH=. nohup ./llama-server \
            -m "${RUNNER_TEMP}/c13-model/${MODEL_FILE}" \
            --host 127.0.0.1 --port "${MODEL_PORT}" \
            --alias "${SERVED_MODEL}" -c 8192 --metrics \
            > "${RUNNER_TEMP}/c13-llama-server.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf "http://127.0.0.1:${MODEL_PORT}/health" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:${MODEL_PORT}/v1/models"

      - name: Install the published CLI the way the quickstart says
        # The plugin quickstart's pipx form, into a HOME that has never held
        # anything, under an environment built from nothing.
        run: |
          set -euo pipefail
          customer_home="${RUNNER_TEMP}/c13-customer/home"
          mkdir -p "${customer_home}"
          pipx_bin="$(command -v pipx)"
          customer_pipx() {
            env -i HOME="${customer_home}" PATH=/usr/local/bin:/usr/bin:/bin \
              PIPX_HOME="${customer_home}/.local/pipx" PIPX_BIN_DIR="${customer_home}/.local/bin" \
              "${pipx_bin}" "$@"
          }
          customer_pipx install --python /usr/bin/python3 omnibase-core
          customer_pipx inject omnibase-core omnibase-infra omnimarket
          test -x "${customer_home}/.local/bin/onex"

      - name: Drive one customer delegation and grade it
        run: |
          set -uo pipefail
          # NOT `set -e`: a non-zero probe is the verdict and must still write
          # its record before the job ends.
          python3 "${RUNNER_TEMP}/c13-probe/c13_customer_local_probe.py" run \
            --customer-home "${RUNNER_TEMP}/c13-customer/home" \
            --customer-bin "${RUNNER_TEMP}/c13-customer/home/.local/bin" \
            --workdir "${RUNNER_TEMP}/c13-customer/work" \
            --trace-dir "${RUNNER_TEMP}/c13-customer/traces" \
            --model-port "${MODEL_PORT}" \
            --served-model "${SERVED_MODEL}" \
            --model-file "${MODEL_FILE}" \
            --model-sha256 "${MODEL_SHA256}" \
            --server-build "${LLAMA_BUILD}" \
            --observations-out c13-observations.json \
            --record c13-customer-local.json \
            --summary "${GITHUB_STEP_SUMMARY}"
          status=$?
          echo "probe exit status: ${status}"
          exit "${status}"

      - name: Assert the C13 record is present and non-empty
        if: always()
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/c13-probe/assert_evidence_artifact.py" \
            --artifact c13-customer-local \
            --require c13-customer-local.json

      - name: Upload the C13 record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c13-customer-local
          path: |
            c13-customer-local.json
            c13-observations.json
          if-no-files-found: error
          retention-days: 30
