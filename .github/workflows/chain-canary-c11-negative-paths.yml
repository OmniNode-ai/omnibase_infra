# chain-canary-c11-negative-paths.yml — OMN-19175
#
# WHAT THIS IS
#   The PRODUCER for beta criterion C11: "Negative paths: wrong key, absent
#   key, wrong tenant, malformed — each a typed refusal naming the defect."
#   This job's EXIT CODE is that criterion's verdict, which is the shape C15
#   (chain-canary.yml) already set and the shape the board reads without
#   needing a second grader anywhere.
#
# WHY A SEPARATE WORKFLOW RATHER THAN A JOB IN chain-canary.yml
#   Three reasons, in order of weight.
#
#   1. One job's exit code must answer for exactly ONE criterion. Folding this
#      in would make a single conclusion mean "C15 and C11", and a red would
#      not say which — the failure mode chain-canary.yml's own OMN-16931 note
#      records for a different surface ("a green probe verdict is NOT a
#      five-link chain proof").
#   2. chain-canary PUBLISHES a real delegation. It carries
#      `concurrency: chain-canary, cancel-in-progress: false` precisely so two
#      probes never race and make its quarantine tail scan ambiguous. This
#      probe writes nothing — four reads and one POST that is refused by
#      request validation before the endpoint function runs — so it has no
#      reason to queue behind a delegation, and putting it there would make a
#      cheap read wait on an expensive write.
#   3. Its verdict is C11's and C15's is chain-canary's, and a board that
#      resolves two criteria from one conclusion cannot say which one moved.
#
# WHERE IT RUNS, AND WHICH LANE IT GRADES (OMN-19894)
#   Operator rulings 2026-09-28T01:58:06Z and 01:58:17Z: a check must not rely
#   on one machine, and resolves its target through the chain of responders.
#   So the job runs on any runner of the pool the overlay names
#   (vars.LAB_PROBE_RUNS_ON_JSON), and the lane it grades is the first lane of
#   the overlay's ordered list (vars.LAB_LANES_JSON) whose onex-api answers,
#   reached at the address the overlay declares for it. Neither a host label
#   nor an address appears in this file. No lane answering is RED naming every
#   lane tried (.github/actions/resolve-lab-lane), never a skip. Until
#   OMN-19894 every run was pinned to the .201 verify runner and reached the
#   lane through that host's docker gateway alias, so the probe queued forever
#   whenever .201 was down. A lane listed for this probe must honour the
#   credential below; one that refuses it grades RED with that refusal named.
#
# WHY THERE IS NO pull_request TRIGGER, THOUGH THE FIRST CUT HAD ONE
#   The first cut ran on `pull_request` scoped to this workflow's own four
#   paths, so that the run which can exercise all four arms — the wrong-tenant
#   arm needs a credential that WORKS, and the only one is this repository's
#   own secret — happened before merge. It did: run 35757759333 at commit
#   ca273a8da graded all four arms green on the lab lane.
#
#   The advisory-job-gate (OMN-18775) then refused it, correctly. A job that
#   runs on every pull request and sits in neither `required_status_checks` nor
#   `EXPECTED_EXTERNAL_CONTEXTS` reads as coverage in a CI listing while being
#   unable to fail anything. And the obvious remedy is worse than the finding:
#   every name in `EXPECTED_EXTERNAL_CONTEXTS` is an UNCONDITIONAL job, because
#   that tuple asserts PRESENCE on every head, so registering a path-scoped job
#   would hold CI Summary pending on every pull request that does not touch
#   these four files. Dropping the path filter instead would make every pull
#   request in this repository depend on the lab lane being up — a check that
#   cannot pass does not fail loudly, it stops delivery.
#
#   So the trigger is gone and the pre-merge evidence is cited rather than
#   re-taken. Re-run on demand with `workflow_dispatch`.
#
# THE CREDENTIAL: EXISTING, LANE-LOCAL, REUSED IN ITS OWN REPOSITORY
#   `CHAIN_CANARY_GATEWAY_API_KEY` is already a repository secret HERE, and
#   chain-canary.yml already injects it the same way. It is lane-local: it
#   belongs to the tenant the dev lane's own onex-api issues for itself
#   in-process and it authorises nothing outside that compose project. No
#   credential is created, rotated, re-issued or revoked by this workflow, and
#   nothing is read across a repository boundary.
#
#   It is injected as ENVIRONMENT under its literal name and the probe is given
#   the NAME, never the value: `/proc` is world-readable, so a value on a
#   command line is readable by every process on the host, and this job
#   uploads an artifact, so a value in the record would be a real exposure.
#
# ABSENT CREDENTIAL IS EXIT 2, NOT A VERDICT
#   The probe distinguishes "I could not run" from "the platform refused
#   wrongly". An unresolvable credential is a CONFIGURATION failure and is
#   reported as one — it must never be graded as a product refusal, which is
#   the "configuration failure wearing a product failure's clothes" class.
#   Both are non-zero, so both still fail the job; the difference is what the
#   log and the record say happened.
#
# NO uv sync, DELIBERATELY
#   scripts/ci/c11_negative_paths_probe.py imports the standard library only.
#   A probe whose job is to be readable should not acquire a dependency
#   resolution step that can fail for reasons that have nothing to do with the
#   thing being probed.

name: Chain Canary — C11 negative paths

on:
  schedule:
    # Hourly at :10 (OMN-17427; was 4x/day at :17). Offset from C28 (:03),
    # C12 (:27), chain-canary (:41 odd hours), C16 (:29 at 3,9,15,21),
    # dev-lane-liveness (:07/:22/:37/:52) and sync-revert-watchdog (:00 even
    # hours) so no two scheduled probes contend for the same runner minute.
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      gateway_url:
        description: 'Tenant-bearing API base URL. Empty grades the first lane of vars.LAB_LANES_JSON whose gateway answers.'
        required: false
        default: ''
      other_tenant_slug:
        description: 'A tenant slug the credential does NOT own; drives the wrong-tenant arm.'
        required: false
        default: 'onex-lab-house'

concurrency:
  # Four reads and one refused POST: a second run racing this one changes
  # nothing about either verdict, so unlike chain-canary this group exists only
  # to stop a dispatch stacking on top of a scheduled tick.
  group: chain-canary-c11-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  c11-negative-paths:
    name: C11 negative paths (dev lane)
    runs-on: ${{ fromJSON(vars.LAB_PROBE_RUNS_ON_JSON) }}
    timeout-minutes: 10

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          # No git operations after checkout — do not leave the Actions token
          # in local git config (zizmor artipacked).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve the lab lane through the overlay's chain of responders
        if: ${{ !github.event.inputs.gateway_url }}
        uses: ./.github/actions/resolve-lab-lane
        with:
          lanes-json: ${{ vars.LAB_LANES_JSON }}
          require: gateway_url

      - name: Drive the four negative paths and grade them
        env:
          # The lane's address as the overlay declares it (LANE_GATEWAY_URL,
          # exported by the resolve step), or an explicit dispatch override.
          GATEWAY_URL_OVERRIDE: ${{ github.event.inputs.gateway_url }}
          OTHER_TENANT_SLUG: ${{ github.event.inputs.other_tenant_slug || 'onex-lab-house' }}
          # The NAME is what the probe is told; the VALUE reaches it only here,
          # as environment. See the header note.
          CHAIN_CANARY_GATEWAY_API_KEY: ${{ secrets.CHAIN_CANARY_GATEWAY_API_KEY }}
        run: |
          set -uo pipefail
          # NOT `set -e`: a non-zero probe is the verdict and must still write
          # its record before the job ends.
          GATEWAY_URL="${GATEWAY_URL_OVERRIDE:-${LANE_GATEWAY_URL:-}}"
          echo "lane: ${LANE_NAME:-dispatch override}, gateway ${GATEWAY_URL}"
          python3 scripts/ci/c11_negative_paths_probe.py \
            --base-url "${GATEWAY_URL}" \
            --credential-env CHAIN_CANARY_GATEWAY_API_KEY \
            --other-tenant-slug "${OTHER_TENANT_SLUG}" \
            --record c11-negative-paths.json \
            --summary "${GITHUB_STEP_SUMMARY}"
          status=$?
          echo "probe exit status: ${status}"
          exit "${status}"

      - name: Assert the C11 record is present and non-empty
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/ci/assert_evidence_artifact.py \
            --artifact c11-negative-paths \
            --require c11-negative-paths.json

      - name: Upload the C11 negative-paths record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c11-negative-paths
          path: c11-negative-paths.json
          if-no-files-found: error
          retention-days: 30
