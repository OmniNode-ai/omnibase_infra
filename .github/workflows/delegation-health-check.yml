#
# delegation-health-check.yml -- OMN-19451. omnibase_infra's caller of the
# delegation-health check (see delegation-health-reusable.yml for the design).
#
# A SIGNAL, NOT A GATE (OMN-25514). The check-run this caller produces,
# `delegation-health-check / Delegation Health Check`, is in no required list:
# it reads delegation verdicts from lab and stability runs, and a broken lab
# froze dev merges while dev was healthy. It runs on a schedule and on every
# push to dev and writes its verdict to the job summary.
# scripts/ci/ci_summary_sweep_exclusions.json admits the row a
# head that ran the old pull_request caller still carries, until it expires.
# tests/ci/test_delegation_health_check_omn19451.py pins all of it.
name: Delegation Health Check

on:
  schedule:
    - cron: "23 */4 * * *"
  push:
    branches: [dev]

concurrency:
  # One run per ref at a time; a newer push to dev supersedes an older run.
  group: delegation-health-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # No `name:` on purpose: the check-run is then `<job id> / <called job name>`,
  # `delegation-health-check / Delegation Health Check`, the name the sweep
  # exclusion admits and the prefix the omniclaude advisory-job gate matches a
  # called workflow's job by.
  delegation-health-check:
    uses: ./.github/workflows/delegation-health-reusable.yml
    with:
      repo_key: omnibase_infra
    secrets:
      ONEXBOT_OCC_APP_ID: ${{ secrets.ONEXBOT_OCC_APP_ID }}
      ONEXBOT_OCC_PRIVATE_KEY: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
