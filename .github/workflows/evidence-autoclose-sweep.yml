#
# evidence-autoclose-sweep.yml — OMN-16106 first slice
#
# Scheduled companion-merge -> dod_verify -> governed Done flip sweep.
# Enumerates onex_change_control PRs merged in a lookback window, extracts
# each merged companion's Evidence-Ticket binding, re-runs the EXISTING
# `onex skill dod_verify <ticket>` verifier exactly as the controller does,
# and would flip the bound Linear ticket Done (or post the honest gap) via
# `onex skill evidence_autoclose_sweep`.
#
# DRY-RUN ONLY. `apply` is intentionally NEVER passed here — the sweep logs
# every decision it would make but calls zero Linear mutation. Flipping this
# workflow to `--apply` is a later, deliberate change (a separate PR), not a
# flag flip buried in this file. The kill switch (ONEX_AUTOCLOSE_DISABLED)
# is honored by the node itself unconditionally, independent of this
# workflow's config, so it is not (and must not be) surfaced as an input
# here — set it as a repo/environment secret-free variable to halt every run
# without touching this file.
#
# omnimarket co-install IS wired here (OMN-16736). `onex skill dod_verify`
# dispatches to `node_dod_verify`, which ships in omnimarket and is layered
# into this job's venv at run time — never a build/lock dependency, because
# omnimarket sits ABOVE infra in the layer graph (compat -> core -> spi ->
# infra -> market) and declaring it as an infra dependency would invert that
# graph. The composition rule is OMN-13829's; the steps below apply it to an
# ephemeral job venv rather than shelling out to the operator installer under
# scripts/ (see the step comment for why, and for why that path is written
# without its file extension here).
#
# Before this was wired, EVERY bound ticket in every run of this workflow
# died at `Error: Unknown node 'node_dod_verify'` and was recorded as
# ERROR_VERIFY_NONZERO_EXIT. That was safe and honest, but it meant no flip
# or gap decision was ever REACHED: the sweep proved enumerate -> bind ->
# attempt-verify -> fail-closed and nothing past it. Run 33078686320
# (2026-08-27, lookback 10h) is the last such run: 27 bindings extracted,
# 11 ERROR_VERIFY_NONZERO_EXIT, 0 flipped, 0 gap_posted.
#
# The runner also needs the OCC CONTRACTS, not just the verifier binary —
# dod_verify verifies a ticket against `contracts/<ticket>.yaml` in
# onex_change_control, and with no such checkout it reported a single skipped
# check for EVERY ticket (`0/1 ACs verified, 0 failed`). That is recorded as a
# GAP, i.e. the sweep would state an evidence verdict it never reached. Both
# the checkout and an explicit readability assertion are below.
#
# The co-install is verified, not assumed: the step after it asserts
# `node_dod_verify` is a resolvable `onex.nodes` entry point THROUGH the
# same `uv run` path the sweep's per-ticket subprocess uses. A silently
# reverted or partial install fails the job there, loudly, instead of
# degrading back into N per-ticket ERROR_VERIFY_NONZERO_EXIT outcomes that
# read like ticket problems rather than a runner-configuration problem.
#
# No new scripts/** file: scripts/** is DEFAULT-DENY for new files (OMN-14475
# canonical-form guard). Every step below is a direct `uv run onex ...`
# invocation of code that already lives under src/.

name: Evidence Autoclose Sweep

on:
  schedule:
    # Every 30 minutes. lookback-hours below intentionally exceeds the
    # interval so a missed/failed run never drops a companion merge.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Scan companions merged within this many hours of now.'
        required: false
        default: '2'

env:
  UV_VERSION: "0.8.3"
  PYTHON_VERSION: "3.12"

jobs:
  evidence-autoclose-sweep:
    name: Evidence Autoclose Sweep (DRY-RUN)
    # Trusted runner required: needs LINEAR_API_KEY and an authenticated gh.
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Raised from 20 (OMN-16736): with the co-install wired, `onex skill
    # dod_verify` now actually RUNS per bound ticket instead of aborting in
    # milliseconds on "Unknown node". A window with a dozen bound companions
    # is real verifier work, and the co-install itself adds a git-source
    # install. 20 minutes was budgeted for a sweep that never reached the
    # verifier.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      # OMN-16736 step 1 of 3 (co-install -> AC-coverage guard -> --apply).
      #
      # Resolve the exact omnimarket commit BEFORE checking it out, so the run
      # log records precisely what was composed into this environment and the
      # same environment can be reconstructed later from the log alone. A bare
      # `ref: dev` checkout would leave the installed rev inferable only from
      # actions/checkout's own output.
      #
      # omnimarket is a PUBLIC repo, so github.token suffices (same reasoning
      # as ci.yml's "Live-resolve omnimarket dev HEAD" step). Fails loudly on
      # a non-sha rather than falling back to a stale pin.
      - name: Resolve omnimarket dev HEAD
        id: omnimarket-ref
        env:
          GH_TOKEN: ${{ secrets.OMNI_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/OmniNode-ai/omnimarket/commits/dev --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::omnimarket dev HEAD resolution returned an invalid sha: '${sha}'" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "omnimarket dev HEAD: ${sha}"

      - name: Checkout omnimarket (sibling provider source)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ steps.omnimarket-ref.outputs.sha }}
          path: .omnimarket-src
          token: ${{ secrets.OMNI_GITHUB_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      # The composition rule is OMN-13829's, applied to an EPHEMERAL job venv:
      # omnimarket is a runtime PROVIDER, never a build/lock dependency, because
      # it sits ABOVE infra in the layer graph. So it is layered on top of the
      # already-synced venv rather than resolved into it.
      #
      # Deliberately NOT a shell-out to the operator co-install script under
      # scripts/ — install-node-skill-package. That name is deliberately not
      # joined to its directory prefix and .sh extension anywhere in this file:
      # the OMN-15547 incident-replay inventory greps whole workflow files for
      # scripts/**.{py,sh} literals and would classify a prose mention as newly
      # wired enforcement, which a comment is not. This file's header already
      # used the same convention.
      #
      # Two reasons not to call it: it is operator tooling whose blast radius
      # is a long-lived machine venv, not a throwaway job env; and its sibling
      # pins are hand-maintained literals that have already drifted from what
      # omnimarket@dev actually requires (it pins omnibase-compat==0.5.5 /
      # omninode-memory==0.15.0; omnimarket@dev requires 0.5.6 / 0.17.1 as of
      # this commit). Reading the split out of omnimarket's OWN pyproject makes
      # this job correct by construction and immune to that drift class.
      #
      # Three-way split, by layer position:
      #   omnibase-*  SKIP     — the layer BENEATH infra. omnibase_infra's own
      #                          lock is authoritative for core/spi/compat;
      #                          letting market metadata re-pin them is the
      #                          exact inversion the layer graph forbids.
      #   omninode-*  NO-DEPS  — sibling packages beside/above infra. Install
      #                          the version omnimarket asks for, but never let
      #                          their transitive metadata re-resolve the layer
      #                          beneath.
      #   everything  RESOLVE  — pure-PyPI leaves (anthropic, radon, docker,
      #     else                 python-dateutil, ...). No omni-internal
      #                          metadata, safe to resolve normally.
      - name: Co-install omnimarket (provides node_dod_verify)
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN=".venv/bin/python"
          test -x "$PYTHON_BIN"

          python3 - "${RUNNER_TEMP}" <<'PYEOF'
          import re
          import sys
          import tomllib
          from pathlib import Path

          out_dir = Path(sys.argv[1])
          with open(".omnimarket-src/pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)

          no_deps = []
          leaves = []
          for dep in data["project"]["dependencies"]:
              name = re.split(r"[<>=!~\[;\s]", dep, maxsplit=1)[0].strip().lower()
              if name.startswith("omnibase-"):
                  continue          # layer BENEATH infra — infra's lock is authoritative
              if name.startswith("omninode-"):
                  no_deps.append(dep)
              else:
                  leaves.append(dep)

          if not no_deps and not leaves:
              print(
                  "FAIL: omnimarket declares no installable dependencies — its "
                  "pyproject was read but produced an empty split, which means "
                  "the checkout or the parse is wrong, not that omnimarket is "
                  "dependency-free.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          (out_dir / "omnimarket-no-deps.txt").write_text("\n".join(no_deps) + "\n")
          (out_dir / "omnimarket-leaves.txt").write_text("\n".join(leaves) + "\n")
          print(f"no-deps siblings : {no_deps}")
          print(f"resolved leaves  : {leaves}")
          PYEOF

          mapfile -t NO_DEPS < <(grep -v '^$' "${RUNNER_TEMP}/omnimarket-no-deps.txt" || true)
          mapfile -t LEAVES < <(grep -v '^$' "${RUNNER_TEMP}/omnimarket-leaves.txt" || true)

          if [ "${#LEAVES[@]}" -gt 0 ]; then
            uv pip install --python "$PYTHON_BIN" "${LEAVES[@]}"
          fi
          uv pip install --python "$PYTHON_BIN" --no-deps ${NO_DEPS[@]+"${NO_DEPS[@]}"} ./.omnimarket-src

      # Assert the thing the sweep actually depends on, through the exact
      # invocation path it uses. `uv run` is deliberate here: the sweep shells
      # out to `uv run onex skill dod_verify <ticket>` per ticket, and a
      # project sync on that call is the one thing that could evict a
      # `uv pip install`-ed provider from under it. UV_NO_SYNC (set on this
      # step and on the sweep step below) keeps `uv run` on the environment
      # this job just composed; this step proves that combination resolves
      # node_dod_verify rather than trusting it.
      - name: Verify node_dod_verify resolves through `uv run`
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          uv run python - <<'PYEOF'
          import sys
          from importlib.metadata import entry_points

          eps = {e.name for e in entry_points(group="onex.nodes")}
          if "node_dod_verify" not in eps:
              print(
                  "FAIL: node_dod_verify is not a resolvable onex.nodes entry point "
                  f"after the co-install ({len(eps)} entry points found). Every "
                  "`onex skill dod_verify <ticket>` the sweep spawns would fail "
                  "closed with 'Unknown node', and no flip or gap decision could "
                  "be reached for any ticket.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"OK: node_dod_verify resolved among {len(eps)} onex.nodes entry points")
          PYEOF

      # OMN-16736. node_dod_verify resolving is necessary but not sufficient:
      # it verifies the checks declared in the ticket's OCC CONTRACT, and it
      # finds that contract by searching `${ONEX_CC_REPO_PATH}/contracts` then
      # `${OMNI_HOME}/onex_change_control/contracts`
      # (EvidenceCollector._DEFAULT_CONTRACT_ROOTS). Neither existed in this
      # job, so every ticket resolved to no contract at all and came back as a
      # single skipped check — `0/1 ACs verified, 0 failed`.
      #
      # That reads as "this ticket is not proven" and is recorded as a GAP,
      # which is WRONG in a specific and dangerous way: the sweep would have
      # posted six Linear comments (run 33091828068) stating an evidence
      # verdict it never actually reached. The uniform 0/1 signature across six
      # unrelated tickets is the tell — it is one environment fault, not six
      # ticket verdicts.
      #
      # Ground truth for the same ticket WITH the contracts present:
      #   OMN-16757 in that CI run     -> total_checks=1  verified=0 failed=0
      #   OMN-16757 against a real OCC -> total_checks=14 verified=12 failed=2
      #                                   (superseded=1, occ_refresh=fetched)
      #
      # depth-1 is correct here: the collector reads `contracts/<ticket>.yaml`
      # AT a resolved ref, it does not walk ancestry. (The main-vs-dev ancestry
      # caveat about shallow OCC clones does not apply to this read path.)
      - name: Checkout onex_change_control (the contracts dod_verify verifies against)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/onex_change_control
          ref: dev
          path: .occ-src
          token: ${{ secrets.OMNI_GITHUB_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      # Assert the exact read the collector performs, before the sweep runs.
      # Without this the failure mode is silent and mis-labelled: it does not
      # look like "the runner has no contracts", it looks like "these tickets
      # are unproven", which is the one thing this whole mechanism must never
      # say when it has not actually checked.
      #
      # `origin/dev` is checked because that is the collector's default
      # governance ref (OCC contracts land on dev first and are batched to main
      # later, so a working-tree search alone would miss them).
      - name: Verify the OCC contracts are readable at the governance ref
        shell: bash
        run: |
          set -euo pipefail
          if ! git -C .occ-src rev-parse --verify --quiet origin/dev >/dev/null; then
            echo "::error::.occ-src has no origin/dev remote-tracking ref — dod_verify resolves contracts at origin/dev and would find none, reporting every ticket as 0/1 unproven." >&2
            exit 1
          fi
          sha="$(git -C .occ-src rev-parse origin/dev)"
          count="$(git -C .occ-src ls-tree --name-only "origin/dev" contracts/ | wc -l | tr -d ' ')"
          echo "OCC governance ref origin/dev = ${sha}"
          echo "contracts/ entries at that ref: ${count}"
          # A real OCC dev carries thousands of contracts. A handful means the
          # checkout is wrong (empty, sparse, or the wrong repo) — fail here
          # rather than let the sweep publish verdicts it did not reach.
          if [ "${count}" -lt 100 ]; then
            echo "::error::only ${count} entries under contracts/ at origin/dev — refusing to run the sweep against an OCC checkout this thin." >&2
            exit 1
          fi

      - name: Run evidence autoclose sweep (DRY-RUN — apply is never passed here)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.OMNI_GITHUB_TOKEN || github.token }}
          # Keep `uv run` — this one and the per-ticket `uv run onex skill
          # dod_verify` the sweep spawns — on the environment the co-install
          # step composed, instead of re-syncing it back to the lockfile
          # (which does not, and by the layer graph must not, contain
          # omnimarket).
          UV_NO_SYNC: "1"
          # First entry in EvidenceCollector's contract search path. Without it
          # dod_verify finds no contract for any ticket and every verdict
          # degrades to a single skipped check (OMN-16736).
          ONEX_CC_REPO_PATH: ${{ github.workspace }}/.occ-src
        run: |
          set -euo pipefail
          # Fail fast on a missing secret rather than letting every ticket in
          # the run degrade to a per-ticket ERROR_LINEAR_API outcome, which
          # would silently mask a configuration problem as N unrelated
          # per-ticket failures.
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::error::LINEAR_API_KEY is not set — refusing to run the sweep with a missing secret."
            exit 1
          fi
          uv run onex skill evidence_autoclose_sweep \
            --lookback-hours "${{ github.event.inputs.lookback_hours || '2' }}"

      - name: Post summary
        if: always()
        run: |
          echo "## Evidence Autoclose Sweep (OMN-16106, DRY-RUN)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Enumerated merged onex_change_control companions, re-ran dod_verify," >> "$GITHUB_STEP_SUMMARY"
          echo "and logged every flip/gap decision it WOULD make. No Linear mutation" >> "$GITHUB_STEP_SUMMARY"
          echo "was performed — this workflow never passes --apply." >> "$GITHUB_STEP_SUMMARY"
