#
# evidence-autoclose-sweep.yml — OMN-16106 first slice
#
# Scheduled companion-merge -> dod_verify -> governed Done flip sweep.
# Enumerates onex_change_control PRs merged in a lookback window, extracts
# each merged companion's Evidence-Ticket binding, re-runs the EXISTING
# `onex skill dod_verify <ticket>` verifier exactly as the controller does,
# and would flip the bound Linear ticket Done (or post the honest gap) via
# `onex skill evidence_autoclose_sweep`.
#
# DRY-RUN BY DEFAULT, apply BY EXPLICIT DISPATCH ONLY. The previous revision
# of this paragraph said `apply` "is intentionally NEVER passed here" and
# named the flip to `--apply` as "a later, deliberate change (a separate PR),
# not a flag flip buried in this file". This is that PR, and `deliberate` is
# now a mechanical property rather than a comment:
#
#   * `apply` is a `workflow_dispatch` boolean input, `default: false`. A
#     dispatch that leaves the box alone is a dry run, so the cheap "just
#     re-run it" reflex cannot mutate anything.
#   * The `schedule` path CANNOT reach it. A cron tick carries no
#     `github.event.inputs` at all, and the guard additionally requires
#     `github.event_name == 'workflow_dispatch'` — two independent refusals,
#     because this is the one property whose failure is unattended.
#   * `--apply` never appears on the invocation line. It enters only through
#     the shell array the guard populates, so a guard plus a stray literal
#     flag (which reads identically in a diff) cannot coexist.
#   * The job NAME and the step summary render their mode from the SAME guard
#     expression that gates the flag, so a run cannot label itself DRY-RUN
#     while flipping tickets. Both previously stated "DRY-RUN" as a constant.
#
# All four are pinned by `tests/ci/test_evidence_autoclose_sweep_apply_input.py`
# (CLAUDE.md rule 5 — the check ships wired, not advisory).
#
# The flip PREDICATE is not relaxed by any of this and is not this file's to
# set. It lives in `handler_evidence_autoclose_sweep.py` and a flip requires
# ALL of: dod_verify's own terminal status is `verified`; `total_checks > 0`;
# `failed_count == 0`; `verified_count > 0`; `verified_count +
# non_probative_count == total_checks` (so any `skipped` check still refuses);
# the `behavior_proving_count` key is PRESENT and `> 0` (OMN-15911 — at least
# one check executed the claimed behavior rather than reading merge state);
# and the OMN-16736 AC-coverage re-read of the ticket body finds no criterion
# the checks never covered. `--apply` decides only whether the decision that
# predicate already reached is written to Linear.
#
# The kill switch (ONEX_AUTOCLOSE_DISABLED) is honored by the node itself
# unconditionally, independent of this workflow's config, so it is not (and
# must not be) surfaced as an INPUT here — set it as a repo/environment
# secret-free variable to halt every run without touching this file. That it
# is a variable and not an input matters MORE now: an input is a per-dispatch
# choice, and the operator making the apply choice is the last person who
# should be able to opt out of the halt.
#
# OMN-16792 AC3. That paragraph was true about the NODE and false about the
# JOB, and the gap made the kill switch inert. The node reads the switch from
# its process environment; a GitHub repository variable is NOT exported into a
# step's environment — it is only reachable through the `vars.*` expression
# context. So `gh variable set ONEX_AUTOCLOSE_DISABLED` set a value that the
# sweep process could never see, and the documented way to halt a live sweep
# would have done nothing at all. The one place it can be halted is the sweep
# step's own `env:`, which is why the plumb-through below exists and why it is
# deliberately NOT a workflow input: an input is a per-dispatch choice, and a
# kill switch has to bind every run including the scheduled ones.
#
# Unset renders as the empty string, which the node reads as falsy
# (`bool(os.environ.get(...))`), so the absent-variable case is a normal run —
# the same behaviour as before this line existed.
#
# omnimarket co-install IS wired here (OMN-16736). `onex skill dod_verify`
# dispatches to `node_dod_verify`, which ships in omnimarket and is layered
# into this job at run time — never a build/lock dependency, because
# omnimarket sits ABOVE infra in the layer graph (compat -> core -> spi ->
# infra -> market) and declaring it as an infra dependency would invert that
# graph. The composition rule is OMN-13829's; the steps below apply it to an
# ephemeral job venv rather than shelling out to the operator installer under
# scripts/ (see the step comment for why, and for why that path is written
# without its file extension here).
#
# TWO venvs, not one (OMN-16846). The co-install goes into a DISPATCH venv at
# `$DISPATCH_VENV`; the project's own `.venv` is the GATE venv and stays
# lock-exact. dod_verify's behaviour checks are `uv run pytest` with
# `cwd: "${OMNI_HOME}/omnibase_infra"` — i.e. they run in the gate venv, where
# `tests/conftest.py` calls `assert_venv_purity()` (OMN-15620) and correctly
# refuses any undeclared `onex.nodes` provider. On one venv those two
# requirements contradict each other and the gate wins: run 33194402437
# recorded all three OMN-16759 behaviour checks as `FAILED ... Canonical venv
# is IMPURE`, behavior_proving=0, with no test ever executing. Separating them
# is the fix; the purity of `.venv` is asserted below rather than assumed.
#
# Before this was wired, EVERY bound ticket in every run of this workflow
# died at `Error: Unknown node 'node_dod_verify'` and was recorded as
# ERROR_VERIFY_NONZERO_EXIT. That was safe and honest, but it meant no flip
# or gap decision was ever REACHED: the sweep proved enumerate -> bind ->
# attempt-verify -> fail-closed and nothing past it. Run 33078686320
# (2026-08-27, lookback 10h) is the last such run: 27 bindings extracted,
# 11 ERROR_VERIFY_NONZERO_EXIT, 0 flipped, 0 gap_posted.
#
# The runner also needs the OCC CONTRACTS, not just the verifier binary —
# dod_verify verifies a ticket against `contracts/<ticket>.yaml` in
# onex_change_control, and with no such checkout it reported a single skipped
# check for EVERY ticket (`0/1 ACs verified, 0 failed`). That is recorded as a
# GAP, i.e. the sweep would state an evidence verdict it never reached. Both
# the checkout and an explicit readability assertion are below.
#
# The runner ALSO needs the repos the contracts' behaviour checks name
# (OMN-16902). With OMNI_HOME exported (OMN-16845) and the venvs separated
# (OMN-16846), the remaining false-FAILED door was the checkout SET: only
# `omnibase_infra` existed under OMNI_HOME, so a check pinned
# `cwd: "${OMNI_HOME}/omnimarket"` or `.../omninode_infra` resolved to a path
# that does not exist and was recorded FAILED. Run 33210339910 is the natural
# experiment — same commit, same minute, four seeds:
#
#   OMN-16759 (checks homed in omnibase_infra) -> verified=4  behavior_proving=3
#   OMN-16790 (checks homed in omnimarket)     -> failed=3    behavior_proving=0
#   OMN-16784 (checks homed in omninode_infra) -> failed=9    behavior_proving=0
#   OMN-16785 (checks homed in omninode_infra) -> failed=11   behavior_proving=0
#
# The discriminator is which repo the check's `cwd` names, nothing else. The
# fix DERIVES the set from the scanned contracts rather than hardcoding it: a
# literal repo list reproduces this bug the first time a new repo appears, and
# OMN-16434 now auto-mints `cwd: ${OMNI_HOME}/<repo>` on every new companion
# for whatever repo the work was in, so the population only grows.
#
# And the OCC-homed `test_passes` checks needed an INTERPRETER (OMN-16902 D2).
# `_infer_occ_cwd` does not run those checks in `.occ-src`: it returns
# `_occ_dev_root`, an ephemeral `git worktree` of the governance ref that the
# collector materialises mid-run. `UV_NO_SYNC=1` on the sweep step was
# inherited by that subprocess, so `uv run pytest` there created an EMPTY
# `.venv` and died on `error: Failed to spawn: pytest` — on all four seeds,
# a shared evidence item taxing every ticket that carries it. UV_NO_SYNC is
# therefore gone from the check-bearing steps and the dests are pre-synced
# instead, so the common case is a cache-hot no-op and the one path no step
# can pre-provision can provision itself.
#
# The co-install is verified, not assumed: a step after it asserts
# `node_dod_verify` is a resolvable `onex.nodes` entry point THROUGH the exact
# interpreter the sweep's per-ticket subprocess uses (the dispatch venv's own
# python — see `_dod_verify_argv`). A silently reverted or partial install
# fails the job there, loudly, instead of degrading back into N per-ticket
# ERROR_VERIFY_NONZERO_EXIT outcomes that read like ticket problems rather
# than a runner-configuration problem.
#
# No new scripts/** file: scripts/** is DEFAULT-DENY for new files (OMN-14475
# canonical-form guard). Every step below is a direct invocation of code that
# already lives under src/.

name: Evidence Autoclose Sweep

on:
  schedule:
    # Every 30 minutes. lookback-hours below intentionally exceeds the
    # interval so a missed/failed run never drops a companion merge.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Scan companions merged within this many hours of now.'
        required: false
        # 6h, raised from 2h (OMN-16792, landed with OMN-16808).
        #
        # `schedule` is best-effort: GitHub drops ticks under load rather than
        # queueing them. Measured over 2026-08-22T20:03Z -> 2026-08-27T19:05Z,
        # 194 scheduled runs fired against 238 expected at `*/30` (81%), and
        # the discriminating measurement is createdAt->startedAt = 0s median
        # AND 0s max across all 194: nothing was slow, the missing runs were
        # never created. Observed inter-run gaps: median 30 min, p90 43 min,
        # p100 236 min (3h56m).
        #
        # A 2h lookback is smaller than that p100 gap, so a companion merged
        # inside the uncovered window was scanned by NO run, ever — the sweep
        # only looks backwards a fixed window and never revisits. 6h clears the
        # observed p100 by ~1.5x, so a dropped tick is absorbed rather than
        # lost.
        #
        # The reason this is a safe one-line change NOW and was not before:
        # widening the window widens the OVERLAP between consecutive runs, and
        # before OMN-16808 every overlapping run re-posted an identical gap
        # comment on every gapped ticket it re-saw. The read-before-write dedup
        # in the handler makes re-scanning a companion cost nothing observable,
        # so the lookback can be sized for the worst measured gap instead of
        # for comment noise. That is OMN-16792 option 1, chosen because it
        # removes the data-loss risk without deciding anything architectural;
        # options 2 (event trigger) and 3 (runtime scheduler) stay open on that
        # ticket.
        #
        # Residual, recorded not fixed here: `max_companions` is capped at 50
        # per run. A 10h window hit that cap on 2026-08-28 (run 33128661860,
        # companions_scanned=50), so a window wide enough to truncate would
        # reintroduce the same loss by a different door. At the observed OCC
        # merge rate (~50 per 10h) a 6h window lands around 30 companions,
        # under the cap. Sizing the cap belongs to OMN-16792.
        default: '6'
      diagnose_tickets:
        description: >-
          OMN-16788 diagnostic. Comma-separated ticket ids (e.g.
          "OMN-16682,OMN-16626"). For each one, dump the FULL dod_verify JSON —
          every check id, status and message — into this job log, and probe what
          the run's GitHub credential can actually read. Empty (the default, and
          the value every scheduled run uses) skips the whole step at zero cost.
        required: false
        default: ''
      apply:
        description: >-
          OMN-16106. WRITE MODE. Tick this and the sweep stops previewing and
          actually flips every ticket whose evidence clears the predicate —
          Linear state to Done plus the audit comment carrying the dod_verify
          counters that justified it. Leave it alone (the default, and the
          only value a scheduled run can have) and the run is read-only: it
          reaches exactly the same decisions and writes none of them. This
          does not loosen what counts as proven; it only decides whether the
          verdict is recorded. ONEX_AUTOCLOSE_DISABLED still halts the run.
        required: false
        type: boolean
        default: false

env:
  UV_VERSION: "0.8.3"
  PYTHON_VERSION: "3.12"

jobs:
  evidence-autoclose-sweep:
    # The mode is rendered from the same guard that gates the flag (see
    # SWEEP_APPLY below), so the label cannot drift from the behaviour.
    name: Evidence Autoclose Sweep (${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true') && 'APPLY' || 'DRY-RUN' }})
    # Trusted runner required: needs LINEAR_API_KEY and an authenticated gh.
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Raised from 20 (OMN-16736): with the co-install wired, `onex skill
    # dod_verify` now actually RUNS per bound ticket instead of aborting in
    # milliseconds on "Unknown node". A window with a dozen bound companions
    # is real verifier work, and the co-install itself adds a git-source
    # install. 20 minutes was budgeted for a sweep that never reached the
    # verifier.
    # Raised from 45 (OMN-16902): the job now materialises and pre-syncs one
    # environment per repo the scanned contracts' cwd values name, so that a
    # behaviour check homed outside omnibase_infra can execute at all. Bounded
    # by the derived set (7 dests as of this commit), each repo cloned once.
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      # OMN-16106. THE decision that separates a preview from a mutation,
      # evaluated exactly once, in the expression context, and handed to the
      # shell as data rather than as substituted script text.
      #
      # Both conjuncts are load-bearing and neither is redundant defence:
      #   * `github.event_name == 'workflow_dispatch'` states the intent that
      #     an unattended trigger can never apply, in a form a reader can check
      #     without knowing how `github.event.inputs` renders on other events.
      #   * `github.event.inputs.apply == 'true'` is the operator's actual
      #     choice. A boolean workflow_dispatch input arrives in the `github`
      #     context as the STRING "true"/"false" (the `inputs` context types it
      #     as a real boolean, but `inputs` is not available in a job `name:`,
      #     and the guard has to be one expression usable at every site or the
      #     label can drift from the behaviour).
      #
      # On `schedule`, `github.event.inputs` is null, so the second conjunct is
      # already false on its own — the two refusals are independent.
      SWEEP_APPLY: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true') && 'true' || 'false' }}

    steps:
      # OMN-16832. THE credential this job runs under. Everything below that
      # touches GitHub uses this token and nothing else.
      #
      # What was here before: `${{ secrets.OMNI_GITHUB_TOKEN || github.token }}`
      # at six sites. Proven by live readback (2026-08-29) that no secret named
      # OMNI_GITHUB_TOKEN exists at org, repo, OR environment scope — the three
      # places `secrets.*` can resolve from in this job — so every one of those
      # six sites had ALWAYS evaluated to `github.token`. The `||` read as "a
      # stronger token, if configured"; it was a dead branch over a weaker one,
      # and the fall-through was silent. That is the defect class being fixed
      # here, so there is deliberately no fallback below: if the App token
      # cannot be minted the job fails loudly rather than quietly degrading to
      # a credential that cannot do the work.
      #
      # `github.token` is structurally incapable of two things the sweep needs,
      # regardless of any App-installation setting:
      #   1. `administration: read` (branch protection) is not a grantable
      #      scope for the automatic token at all. Every `::pr-live-state`
      #      sub-check 403'd with exactly that scope named, on every ticket, in
      #      every run — the SKIPs this ticket is about.
      #   2. It is scoped to the triggering repo only, so the private
      #      `OmniNode-ai/omninode_infra` reads 404 and any behaviour check
      #      pinned at that cwd is unexecutable (OMN-16902's
      #      UNAVAILABLE_REPO_NOT_READABLE_BY_TOKEN warning).
      # The `onexbot` installation (app_id 3342522, installation 123040063)
      # carries `administration:read` with `repository_selection: all`, so a
      # token minted from it clears both.
      #
      # Least privilege is applied on the PERMISSION axis, not the repository
      # axis, and that asymmetry is deliberate:
      #   - permissions: narrowed to read-only. The installation grants
      #     checks:write, issues:write and pull_requests:write; this job's
      #     GitHub access is entirely `gh api` GETs (the handler's only writes
      #     go to Linear over LINEAR_API_KEY), so none of those are requested.
      #   - repositories: NOT pinned to a list. The repo set this job reads is
      #     derived at runtime from the `cwd` values the scanned OCC contracts
      #     name (see the materialise step below) — it is data, not a constant,
      #     and a static list would fail-closed the first time a contract named
      #     a repo not on it. `owner:` scopes the token to the installation's
      #     repositories, which is the smallest set that stays correct.
      #
      # TTL note, recorded rather than discovered later: this token expires 1h
      # after minting and this job's timeout-minutes is 60. A sweep that runs
      # to the very top of its budget can outlive its own credential. Today's
      # runs finish in ~8 min so the margin is large, but if the timeout is
      # ever raised, re-mint before the long-running sweep step rather than
      # widening this window.
      - name: Mint onexbot App token (OMN-16832)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: OmniNode-ai
          permission-administration: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: read
          permission-checks: read

      - name: Checkout omnibase_infra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      # OMN-16845. `EvidenceCollector._resolve_cwd` (omnimarket) renders
      # `${OMNI_HOME}` from the process environment and requires the result to
      # exist; this job never exported it, so every check pinned
      # `cwd: "${OMNI_HOME}/omnibase_infra"` rendered to `/omnibase_infra`,
      # which never exists, and was recorded FAILED rather than skipped or
      # unresolved. Proven by execution: `env -u OMNI_HOME` against this
      # job's env shape reproduces `failed: 3, behavior_proving_count: 0`;
      # the identical run with OMNI_HOME set reproduces
      # `verified, failed: 0, behavior_proving_count: 3` — the only variable
      # is the env var.
      #
      # GitHub Actions checks a repo out to
      # `<runner-work-dir>/<repo>/<repo>` (the documented `github.workspace`
      # convention — GitHub's own docs give `/home/runner/work/my-repo-name/
      # my-repo-name` as the canonical example), so `github.workspace`'s OWN
      # PARENT directory already satisfies
      # `${OMNI_HOME}/omnibase_infra == github.workspace` exactly, using the
      # real checkout with no symlink and no second checkout.
      #
      # A symlink farm was considered and rejected: `_resolve_cwd`'s
      # containment check (`candidate.is_relative_to(OMNI_HOME)`, evaluated
      # AFTER `Path.resolve()`) follows a symlink to its real target and
      # rejects it if that target sits outside OMNI_HOME. A fabricated
      # OMNI_HOME containing a symlink pointing at the real checkout (which
      # would live outside it) would fail that check. Pointing OMNI_HOME at
      # the checkout's real parent is the only shape that is both correct and
      # symlink-free.
      #
      # Fail-fast, not a silent default (CLAUDE.md rule 8): assert the
      # derived path actually places omnibase_infra at github.workspace
      # before exporting it, so a runner whose workspace layout ever stops
      # matching that convention breaks the job loudly here instead of
      # silently reintroducing this defect.
      - name: Export OMNI_HOME for cwd-anchored dod_verify checks
        shell: bash
        run: |
          set -euo pipefail
          omni_home="$(dirname "${GITHUB_WORKSPACE}")"
          expected="${omni_home}/omnibase_infra"
          if [ "${expected}" != "${GITHUB_WORKSPACE}" ]; then
            echo "::error::derived OMNI_HOME (${omni_home}) does not place omnibase_infra at github.workspace (${GITHUB_WORKSPACE}) -- the runner's workspace layout does not match the documented <work>/<repo>/<repo> convention this fix depends on." >&2
            exit 1
          fi
          if [ ! -d "${expected}" ]; then
            echo "::error::${expected} does not exist -- refusing to export an OMNI_HOME that dod_verify's cwd-anchored checks would immediately fail resolution against." >&2
            exit 1
          fi
          echo "OMNI_HOME=${omni_home}" >> "$GITHUB_ENV"
          echo "OMNI_HOME resolved to ${omni_home} (omnibase_infra -> ${expected})"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The GATE venv. `uv sync` is exact-mode, so `.venv` contains exactly
      # what uv.lock declares and nothing else. This is the venv every
      # behaviour check resolves: the OCC contracts under adjudication declare
      # `check_type: test_passes` with `check_value: "uv run pytest ..."` and
      # `cwd: "${OMNI_HOME}/omnibase_infra"`, and OMN-16845 wired OMNI_HOME so
      # that path IS this checkout. Nothing may be installed into it after
      # this step (OMN-16846) — see the purity assertion below.
      - name: Install dependencies (GATE venv — stays lock-exact)
        run: uv sync

      # OMN-16846. The DISPATCH venv: a second, separate environment for the
      # verifier itself.
      #
      # Why two. `onex skill dod_verify` is provided by `node_dod_verify`,
      # which ships in omnimarket — a runtime provider that sits ABOVE infra in
      # the layer graph and can never be a lock dependency, so the job has to
      # co-install it (OMN-16736). But dod_verify's behaviour checks are
      # `uv run pytest` inside this very checkout, and `tests/conftest.py`
      # calls `assert_venv_purity()` (OMN-15620), which correctly refuses any
      # venv carrying an `onex.nodes` provider uv.lock does not declare.
      #
      # With one venv those two requirements are directly contradictory, and
      # the gate wins: run 33194402437 recorded all three OMN-16759 behaviour
      # checks as `FAILED ... Canonical venv is IMPURE`, behavior_proving=0,
      # without a single test having executed. That is a false FAILED — it
      # names a venv, not a defect, and it is indistinguishable in the sweep's
      # counts from a ticket that genuinely is not proven.
      #
      # Neither half is wrong. Their collapse onto one venv is. So the
      # provider goes here and `.venv` stays lock-exact.
      #
      # Proven by execution 2026-08-28, same ticket, same contract, only the
      # environment shape differing:
      #   collapsed  -> status=failed   verified=1 failed=3 behavior_proving=0
      #   separated  -> status=verified verified=5 failed=0 behavior_proving=3
      # with no ONEX_ALLOW_VENV_IMPURITY set anywhere. The opt-out is
      # deliberately NOT used: it would suppress a correct signal instead of
      # removing the cause, and the conftest override warns in its own words
      # that results from an overridden run "are NOT gate evidence".
      #
      # `UV_PROJECT_ENVIRONMENT` is uv's own supported way to place a project
      # environment outside the project, so the dispatch venv is still built
      # from this repo's lockfile — same resolution, different location — and
      # then layered with omnimarket by the step below.
      - name: Compose the dispatch venv (separate from the gate venv)
        shell: bash
        run: |
          set -euo pipefail
          dispatch_venv="${RUNNER_TEMP}/dispatch-venv"
          UV_PROJECT_ENVIRONMENT="${dispatch_venv}" uv sync
          if [ ! -x "${dispatch_venv}/bin/onex" ]; then
            echo "::error::${dispatch_venv}/bin/onex is missing after the dispatch-venv sync — every per-ticket verifier dispatch would fail closed at exec time, so refusing to continue." >&2
            exit 1
          fi
          echo "DISPATCH_VENV=${dispatch_venv}" >> "$GITHUB_ENV"
          echo "dispatch venv composed at ${dispatch_venv}"

      # OMN-16736 step 1 of 3 (co-install -> AC-coverage guard -> --apply).
      #
      # Resolve the exact omnimarket commit BEFORE checking it out, so the run
      # log records precisely what was composed into this environment and the
      # same environment can be reconstructed later from the log alone. A bare
      # `ref: dev` checkout would leave the installed rev inferable only from
      # actions/checkout's own output.
      #
      # omnimarket is a PUBLIC repo, so this leg was never the broken one — it
      # worked on the `github.token` the old `||` silently fell through to. It
      # uses the App token anyway (OMN-16832) so this job has exactly ONE
      # GitHub credential: a step that reads fine under a weaker token is how
      # a mixed-credential job hides which token is actually in force.
      # Fails loudly on a non-sha rather than falling back to a stale pin.
      - name: Resolve omnimarket dev HEAD
        id: omnimarket-ref
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/OmniNode-ai/omnimarket/commits/dev --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::omnimarket dev HEAD resolution returned an invalid sha: '${sha}'" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "omnimarket dev HEAD: ${sha}"

      - name: Checkout omnimarket (sibling provider source)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ steps.omnimarket-ref.outputs.sha }}
          path: .omnimarket-src
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      # The composition rule is OMN-13829's, applied to an EPHEMERAL job venv:
      # omnimarket is a runtime PROVIDER, never a build/lock dependency, because
      # it sits ABOVE infra in the layer graph. So it is layered on top of the
      # already-synced venv rather than resolved into it.
      #
      # Deliberately NOT a shell-out to the operator co-install script under
      # scripts/ — install-node-skill-package. That name is deliberately not
      # joined to its directory prefix and .sh extension anywhere in this file:
      # the OMN-15547 incident-replay inventory greps whole workflow files for
      # scripts/**.{py,sh} literals and would classify a prose mention as newly
      # wired enforcement, which a comment is not. This file's header already
      # used the same convention.
      #
      # Two reasons not to call it: it is operator tooling whose blast radius
      # is a long-lived machine venv, not a throwaway job env; and its sibling
      # pins are hand-maintained literals that have already drifted from what
      # omnimarket@dev actually requires (it pins omnibase-compat==0.5.5 /
      # omninode-memory==0.15.0; omnimarket@dev requires 0.5.6 / 0.17.1 as of
      # this commit). Reading the split out of omnimarket's OWN pyproject makes
      # this job correct by construction and immune to that drift class.
      #
      # Three-way split, by layer position:
      #   omnibase-*  SKIP     — the layer BENEATH infra. omnibase_infra's own
      #                          lock is authoritative for core/spi/compat;
      #                          letting market metadata re-pin them is the
      #                          exact inversion the layer graph forbids.
      #   omninode-*  NO-DEPS  — sibling packages beside/above infra. Install
      #                          the version omnimarket asks for, but never let
      #                          their transitive metadata re-resolve the layer
      #                          beneath.
      #   everything  RESOLVE  — pure-PyPI leaves (anthropic, radon, docker,
      #     else                 python-dateutil, ...). No omni-internal
      #                          metadata, safe to resolve normally.
      #
      # omnimarket itself is installed from `git+...@<resolved sha>`, NOT from
      # the local `.omnimarket-src` directory (OMN-16902, second pass). The two
      # are byte-identical — same commit — but they are not interchangeable to
      # the OMN-14060 drift guard, which reads
      # `direct_url.json`'s `vcs_info.commit_id` and treats a directory install
      # as "not installed from git".
      #
      # That guard was inert here until OMN-16902's first pass materialised
      # `${OMNI_HOME}/omnimarket`: `canonical_local_omnimarket_commit` returns
      # None when no canonical clone exists, and the guard deliberately fails
      # OPEN on None so it stays silent on CI runners. Materialising the clone
      # made it determinable, and it correctly refused every dispatch in run
      # 33217990549:
      #
      #   Error: omnimarket is NOT INSTALLED from git in this interpreter
      #   (absent, or installed from PyPI/a non-VCS source), but a canonical
      #   clone exists at $OMNI_HOME/omnimarket (HEAD 00aa538fe247).
      #
      # The guard is right and the install shape was wrong. The override
      # (ONEX_ALLOW_OMNIMARKET_DRIFT) is deliberately NOT used: it says in its
      # own words that results are "NOT evidence", and this job's whole output
      # is evidence. Installing from the pinned git sha makes
      # `installed == canonical` exactly, so the guard passes on the merits.
      - name: Co-install omnimarket into the dispatch venv (provides node_dod_verify)
        shell: bash
        env:
          OMNIMARKET_SHA: ${{ steps.omnimarket-ref.outputs.sha }}
        run: |
          set -euo pipefail
          # OMN-16846: the DISPATCH venv, never `.venv`. Installing an
          # undeclared `onex.nodes` provider into the gate venv is exactly what
          # the OMN-15620 purity gate refuses, and every behaviour check runs
          # `uv run pytest` in the gate venv.
          PYTHON_BIN="${DISPATCH_VENV}/bin/python"
          test -x "$PYTHON_BIN"

          python3 - "${RUNNER_TEMP}" <<'PYEOF'
          import re
          import sys
          import tomllib
          from pathlib import Path

          out_dir = Path(sys.argv[1])
          with open(".omnimarket-src/pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)

          no_deps = []
          leaves = []
          for dep in data["project"]["dependencies"]:
              name = re.split(r"[<>=!~\[;\s]", dep, maxsplit=1)[0].strip().lower()
              if name.startswith("omnibase-"):
                  continue          # layer BENEATH infra — infra's lock is authoritative
              if name.startswith("omninode-"):
                  no_deps.append(dep)
              else:
                  leaves.append(dep)

          if not no_deps and not leaves:
              print(
                  "FAIL: omnimarket declares no installable dependencies — its "
                  "pyproject was read but produced an empty split, which means "
                  "the checkout or the parse is wrong, not that omnimarket is "
                  "dependency-free.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          (out_dir / "omnimarket-no-deps.txt").write_text("\n".join(no_deps) + "\n")
          (out_dir / "omnimarket-leaves.txt").write_text("\n".join(leaves) + "\n")
          print(f"no-deps siblings : {no_deps}")
          print(f"resolved leaves  : {leaves}")
          PYEOF

          mapfile -t NO_DEPS < <(grep -v '^$' "${RUNNER_TEMP}/omnimarket-no-deps.txt" || true)
          mapfile -t LEAVES < <(grep -v '^$' "${RUNNER_TEMP}/omnimarket-leaves.txt" || true)

          if [ "${#LEAVES[@]}" -gt 0 ]; then
            uv pip install --python "$PYTHON_BIN" "${LEAVES[@]}"
          fi
          # The git+ form is load-bearing, not cosmetic — see the step comment.
          # `.omnimarket-src` is still the source of truth for the dependency
          # split above and for the ${OMNI_HOME}/omnimarket materialisation
          # below; only the omnimarket distribution ITSELF moves to the pinned
          # VCS URL, so `direct_url.json` carries vcs_info.commit_id and the
          # OMN-14060 drift guard resolves installed == canonical.
          uv pip install --python "$PYTHON_BIN" --no-deps ${NO_DEPS[@]+"${NO_DEPS[@]}"} \
            "omnimarket @ git+https://github.com/OmniNode-ai/omnimarket@${OMNIMARKET_SHA}"

      # OMN-16846, the other half of the split — and the enforcement half
      # (CLAUDE.md rule 5). The co-install above must have left the GATE venv
      # untouched, because that venv is what every behaviour check's
      # `uv run pytest` resolves and what `assert_venv_purity()` inspects.
      #
      # Without this assertion the separation is an intention, not a
      # mechanism: any later step that pip-installs a sibling into `.venv`
      # silently restores the collision, and the symptom is N per-ticket
      # FAILED checks that read like N unproven tickets rather than one
      # environment fault. That mis-reading is the whole defect this PR
      # closes, so it gets a named refusal here instead.
      #
      # `find_undeclared_onex_providers` is the same function the pytest
      # session-start gate calls, run through the same interpreter pytest will
      # run under, so this is the real predicate and not a restatement of it.
      - name: Assert the gate venv is pure (nothing may install into `.venv`)
        shell: bash
        run: |
          set -euo pipefail
          if ! ./.venv/bin/python - <<'PYEOF'
          import sys

          from omnibase_infra.runtime.venv_purity import find_undeclared_onex_providers

          undeclared = find_undeclared_onex_providers()
          if undeclared:
              print(
                  "gate venv `.venv` carries undeclared onex.nodes provider(s): "
                  + "; ".join(f"{p.name}=={p.version}" for p in undeclared),
                  file=sys.stderr,
              )
              sys.exit(1)
          print("OK: gate venv `.venv` declares every installed onex.nodes provider")
          PYEOF
          then
            # Single-quoted on purpose: this message names shell metacharacters
            # ($DISPATCH_VENV) and a command string, and a double-quoted echo
            # would expand them. It did, in the first draft of this step, and
            # backticks around the pytest invocation caused bash to RUN it.
            echo '::error::the gate venv is IMPURE -- every "uv run pytest" behaviour check dod_verify runs in it would be refused by the OMN-15620 purity gate and recorded FAILED without executing (run 33194402437). The omnimarket co-install belongs in $DISPATCH_VENV, never in .venv (OMN-16846).' >&2
            exit 1
          fi

      # Assert the thing the sweep actually depends on, through the exact
      # interpreter it uses. OMN-16846 replaced `uv run python` here: `uv run`
      # resolves whichever project the cwd names — the GATE venv — which after
      # the split deliberately does NOT carry omnimarket, so asserting through
      # it would now assert the wrong environment and fail on a correct job.
      # The sweep dispatches the verifier from its own `sys.executable`
      # (`_dod_verify_argv`), so the dispatch venv's interpreter is the only
      # honest thing to probe.
      - name: Verify node_dod_verify resolves in the dispatch venv
        shell: bash
        run: |
          set -euo pipefail
          "${DISPATCH_VENV}/bin/python" - <<'PYEOF'
          import sys
          from importlib.metadata import entry_points

          eps = {e.name for e in entry_points(group="onex.nodes")}
          if "node_dod_verify" not in eps:
              print(
                  "FAIL: node_dod_verify is not a resolvable onex.nodes entry point "
                  f"after the co-install ({len(eps)} entry points found). Every "
                  "`onex skill dod_verify <ticket>` the sweep spawns would fail "
                  "closed with 'Unknown node', and no flip or gap decision could "
                  "be reached for any ticket.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"OK: node_dod_verify resolved among {len(eps)} onex.nodes entry points")
          PYEOF

      # OMN-16736. node_dod_verify resolving is necessary but not sufficient:
      # it verifies the checks declared in the ticket's OCC CONTRACT, and it
      # finds that contract by searching `${ONEX_CC_REPO_PATH}/contracts` then
      # `${OMNI_HOME}/onex_change_control/contracts`
      # (EvidenceCollector._DEFAULT_CONTRACT_ROOTS). Neither existed in this
      # job, so every ticket resolved to no contract at all and came back as a
      # single skipped check — `0/1 ACs verified, 0 failed`.
      #
      # That reads as "this ticket is not proven" and is recorded as a GAP,
      # which is WRONG in a specific and dangerous way: the sweep would have
      # posted six Linear comments (run 33091828068) stating an evidence
      # verdict it never actually reached. The uniform 0/1 signature across six
      # unrelated tickets is the tell — it is one environment fault, not six
      # ticket verdicts.
      #
      # Ground truth for the same ticket WITH the contracts present:
      #   OMN-16757 in that CI run     -> total_checks=1  verified=0 failed=0
      #   OMN-16757 against a real OCC -> total_checks=14 verified=12 failed=2
      #                                   (superseded=1, occ_refresh=fetched)
      #
      # depth-1 is correct here: the collector reads `contracts/<ticket>.yaml`
      # AT a resolved ref, it does not walk ancestry. (The main-vs-dev ancestry
      # caveat about shallow OCC clones does not apply to this read path.)
      - name: Checkout onex_change_control (the contracts dod_verify verifies against)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/onex_change_control
          ref: dev
          path: .occ-src
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      # Assert the exact read the collector performs, before the sweep runs.
      # Without this the failure mode is silent and mis-labelled: it does not
      # look like "the runner has no contracts", it looks like "these tickets
      # are unproven", which is the one thing this whole mechanism must never
      # say when it has not actually checked.
      #
      # `origin/dev` is checked because that is the collector's default
      # governance ref (OCC contracts land on dev first and are batched to main
      # later, so a working-tree search alone would miss them).
      - name: Verify the OCC contracts are readable at the governance ref
        shell: bash
        run: |
          set -euo pipefail
          if ! git -C .occ-src rev-parse --verify --quiet origin/dev >/dev/null; then
            echo "::error::.occ-src has no origin/dev remote-tracking ref — dod_verify resolves contracts at origin/dev and would find none, reporting every ticket as 0/1 unproven." >&2
            exit 1
          fi
          sha="$(git -C .occ-src rev-parse origin/dev)"
          count="$(git -C .occ-src ls-tree --name-only "origin/dev" contracts/ | wc -l | tr -d ' ')"
          echo "OCC governance ref origin/dev = ${sha}"
          echo "contracts/ entries at that ref: ${count}"
          # A real OCC dev carries thousands of contracts. A handful means the
          # checkout is wrong (empty, sparse, or the wrong repo) — fail here
          # rather than let the sweep publish verdicts it did not reach.
          if [ "${count}" -lt 100 ]; then
            echo "::error::only ${count} entries under contracts/ at origin/dev — refusing to run the sweep against an OCC checkout this thin." >&2
            exit 1
          fi

      # OMN-16902 D1. The checkout set must be DERIVED from the contracts that
      # are about to be adjudicated, not declared here.
      #
      # A hardcoded repo list would be correct for exactly as long as the
      # registry stands still, and it does not: OMN-16434 (omnimarket#2180)
      # auto-mints `cwd: ${OMNI_HOME}/<repo>` on every new companion for
      # whatever repo the work was in, so a list rots the first time a
      # ticket lands in a repo nobody added here. That is this bug, arriving
      # by a fourth door after OMN-16845 and OMN-16846 closed the first three.
      # `tests/ci/test_evidence_autoclose_sweep_cwd_repos.py` extracts the
      # classifier below out of this file and runs it against a repo name that
      # exists nowhere in the registry, so a list cannot pass that gate.
      #
      # Two cwd shapes exist in the live corpus and both are handled:
      #   ${OMNI_HOME}/<repo>[/<subdir>...]        -> materialise <repo>
      #   ${OMNI_HOME}/omni_worktrees/<T>/<repo>   -> materialise <repo> AT
      #                                               that worktree path
      # The second is an operator-machine path that can never exist on a
      # runner as written; materialising the named repo there is what makes
      # the cwd resolvable at all. It is pinned to dev, the same ref every
      # other dest uses — the check then proves behaviour against dev rather
      # than against a branch that no longer exists, which is the only honest
      # thing a post-merge sweep can do.
      #
      # Anything the classifier cannot place (a traversal, a bare
      # `omni_worktrees` root, a non-OMNI_HOME absolute path) is PRINTED, not
      # dropped. A silently discarded cwd is indistinguishable from a
      # satisfied one, and that indistinguishability is the whole defect class.
      #
      # Cost note, recorded rather than hidden: this adds N shallow clones and
      # N `uv sync`es to every scheduled run. It is bounded by the derived set
      # (7 dests across ~4600 contracts as of this commit), each repo is cloned
      # once and copied to its dests, and worktree-shaped dests are deliberately
      # NOT pre-synced — they are historical, rarely adjudicated, and `uv run`
      # provisions them on demand now that UV_NO_SYNC is gone.
      - name: Derive and materialise the cwd repo set the OCC contracts name (OMN-16902)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          contracts_dir="${GITHUB_WORKSPACE}/.occ-src/contracts"
          if [ ! -d "${contracts_dir}" ]; then
            echo "::error::${contracts_dir} is absent, so the cwd repo set cannot be derived and every non-infra behaviour check would render to a nonexistent path (OMN-16902)." >&2
            exit 1
          fi

          python3 - "${contracts_dir}" \
            > "${RUNNER_TEMP}/cwd-dests.tsv" \
            2> "${RUNNER_TEMP}/cwd-unclassified.tsv" <<'PYEOF'
          # ---8<--- OMN-16902 BEGIN cwd-repo-derivation
          """Classify every ``cwd:`` an OCC contract declares into a
          (destination path under OMNI_HOME, repository to materialise) pair.

          stdout: one ``<dest>\t<repo>`` row per unique destination, sorted.
          stderr: one ``UNCLASSIFIED_CWD\t<raw>`` row per cwd that cannot be
          placed — reported so an unsatisfiable path is never mistaken for a
          satisfied one.

          Line-oriented on purpose. The corpus is thousands of files and a
          malformed one must not abort the derivation for all the others, which
          a whole-document YAML parse would do.
          """
          import re
          import sys
          from pathlib import Path

          _CWD_LINE = re.compile(
              r"""^\s*(?:-\s*)?cwd:\s*(?P<q>["']?)(?P<val>[^"'#\n]+)(?P=q)\s*(?:#.*)?$"""
          )
          _NAME = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]*$")
          _PREFIX = "${OMNI_HOME}/"

          contracts_dir = Path(sys.argv[1])
          dests: dict[str, str] = {}
          unclassified: set[str] = set()

          for path in sorted(contracts_dir.rglob("*.yaml")):
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  print(f"UNREADABLE\t{path}\t{exc}", file=sys.stderr)
                  continue
              for line in text.splitlines():
                  match = _CWD_LINE.match(line)
                  if match is None:
                      continue
                  raw = match.group("val").strip()
                  if not raw.startswith(_PREFIX):
                      unclassified.add(raw)
                      continue
                  segments = [s for s in raw[len(_PREFIX) :].split("/") if s]
                  if not segments or ".." in segments:
                      unclassified.add(raw)
                      continue
                  if segments[0] == "omni_worktrees":
                      if len(segments) < 3:
                          unclassified.add(raw)
                          continue
                      dest, repo = "/".join(segments[:3]), segments[2]
                  else:
                      dest = repo = segments[0]
                  if not all(_NAME.match(s) for s in dest.split("/")):
                      unclassified.add(raw)
                      continue
                  dests[dest] = repo

          for dest in sorted(dests):
              print(f"{dest}\t{dests[dest]}")
          for raw in sorted(unclassified):
              print(f"UNCLASSIFIED_CWD\t{raw}", file=sys.stderr)
          # ---8<--- OMN-16902 END cwd-repo-derivation
          PYEOF

          echo "== cwd destinations derived from ${contracts_dir} =="
          cat "${RUNNER_TEMP}/cwd-dests.tsv"
          if [ -s "${RUNNER_TEMP}/cwd-unclassified.tsv" ]; then
            echo "== cwd values this run could not place (reported, never dropped) =="
            cat "${RUNNER_TEMP}/cwd-unclassified.tsv"
          fi

          # Credentials reach git through GIT_ASKPASS only: never written into
          # a clone's config, never on a command line, never in the log.
          cat > "${RUNNER_TEMP}/git-askpass.sh" <<'EOS'
          #!/usr/bin/env bash
          case "$1" in
            Username*|username*) printf '%s\n' "x-access-token" ;;
            *) printf '%s\n' "${GH_TOKEN}" ;;
          esac
          EOS
          chmod +x "${RUNNER_TEMP}/git-askpass.sh"
          export GIT_ASKPASS="${RUNNER_TEMP}/git-askpass.sh"
          export GIT_TERMINAL_PROMPT=0

          cache="${RUNNER_TEMP}/cwd-repo-cache"
          mkdir -p "${cache}"
          : > "${RUNNER_TEMP}/cwd-materialisation.tsv"

          while IFS=$'\t' read -r dest repo; do
            [ -n "${dest:-}" ] || continue
            target="${OMNI_HOME}/${dest}"

            # The gate checkout is already at ${OMNI_HOME}/omnibase_infra by
            # construction (OMN-16845). Never re-materialise it: its `.venv` is
            # the lock-exact gate venv every behaviour check runs pytest in.
            if [ "${target}" = "${GITHUB_WORKSPACE}" ]; then
              echo "  ${dest}: ALREADY_PRESENT_GATE_CHECKOUT"
              printf '%s\t%s\t%s\n' "${dest}" "${repo}" "ALREADY_PRESENT_GATE_CHECKOUT" \
                >> "${RUNNER_TEMP}/cwd-materialisation.tsv"
              continue
            fi
            # Containment, asserted before anything destructive runs.
            case "${target}" in
              "${OMNI_HOME}"/?*) : ;;
              *)
                echo "::error::refusing to materialise ${dest}: ${target} is not strictly under OMNI_HOME (${OMNI_HOME})." >&2
                exit 1
                ;;
            esac

            src="${cache}/${repo}"
            if [ -d "${src}" ]; then
              status="CACHED"
            elif [ "${repo}" = "onex_change_control" ] && [ -d "${GITHUB_WORKSPACE}/.occ-src" ]; then
              cp -a "${GITHUB_WORKSPACE}/.occ-src" "${src}"
              status="REUSED_OCC_CHECKOUT"
            elif [ "${repo}" = "omnimarket" ] && [ -d "${GITHUB_WORKSPACE}/.omnimarket-src" ]; then
              cp -a "${GITHUB_WORKSPACE}/.omnimarket-src" "${src}"
              status="REUSED_OMNIMARKET_CHECKOUT"
            elif git clone --quiet --depth 1 --branch dev \
                 "https://github.com/OmniNode-ai/${repo}.git" "${src}" \
                 2> "${RUNNER_TEMP}/clone-${repo}.err"; then
              status="CLONED_DEV"
            else
              rm -rf "${src}"
              status="UNAVAILABLE_REPO_NOT_READABLE_BY_TOKEN"
            fi

            if [ ! -d "${src}" ]; then
              # Named, not silent. This run's credential cannot see the repo, so
              # any check pinned there still cannot execute — that is the
              # App-token scope residual tracked on OMN-16832 (an operator-only
              # grant), NOT a product defect and NOT something this job can fix.
              echo "::warning::OMN-16902 ${dest}: ${status} for OmniNode-ai/${repo}. Behaviour checks pinned at this cwd remain unexecutable until the sweep's App token can read it (OMN-16832)."
              printf '%s\t%s\t%s\n' "${dest}" "${repo}" "${status}" \
                >> "${RUNNER_TEMP}/cwd-materialisation.tsv"
              continue
            fi

            # Destructive refresh: a self-hosted runner keeps siblings of
            # GITHUB_WORKSPACE across jobs, and a stale tree would ground a
            # behaviour verdict in code nobody chose.
            rm -rf "${target}"
            mkdir -p "$(dirname "${target}")"
            cp -a "${src}" "${target}"
            echo "  ${dest}: ${status} -> ${target}"
            printf '%s\t%s\t%s\n' "${dest}" "${repo}" "${status}" \
              >> "${RUNNER_TEMP}/cwd-materialisation.tsv"
          done < "${RUNNER_TEMP}/cwd-dests.tsv"

          # One environment per repo, in that repo, built by that repo's own
          # lockfile. Nothing is cross-installed into any other venv — the
          # OMN-16846 separation is a property this step must preserve, not a
          # one-off it may spend.
          echo "== per-dest environments =="
          while IFS=$'\t' read -r dest repo status; do
            case "${status}" in
              CLONED_DEV|CACHED|REUSED_OCC_CHECKOUT|REUSED_OMNIMARKET_CHECKOUT) : ;;
              *) continue ;;
            esac
            case "${dest}" in
              */*) echo "  ${dest}: worktree-shaped dest, provisioned on demand"; continue ;;
            esac
            target="${OMNI_HOME}/${dest}"
            if [ ! -f "${target}/pyproject.toml" ]; then
              echo "  ${dest}: no pyproject.toml, nothing to sync"
              continue
            fi
            if ( cd "${target}" && uv sync --quiet ); then
              echo "  ${dest}: environment ready at ${target}/.venv"
            else
              echo "::warning::OMN-16902 ${dest}: uv sync failed; a check landing here will retry the sync on demand and report a real result either way."
            fi
          done < "${RUNNER_TEMP}/cwd-materialisation.tsv"

          {
            echo "### OMN-16902 cwd destinations"
            echo ""
            echo "| dest | repo | status |"
            echo "| --- | --- | --- |"
            while IFS=$'\t' read -r dest repo status; do
              echo "| \`${dest}\` | ${repo} | ${status} |"
            done < "${RUNNER_TEMP}/cwd-materialisation.tsv"
          } >> "$GITHUB_STEP_SUMMARY"

      # OMN-16902, second pass. Materialising ${OMNI_HOME}/omnimarket ARMS the
      # OMN-14060 drift guard, which until then failed open on this runner
      # because no canonical clone existed. Run 33217990549 proved the
      # consequence: every one of the four diagnosed tickets produced NO
      # stdout at all and died on `omnimarket is NOT INSTALLED from git in
      # this interpreter` — a strictly worse outcome than the false FAILEDs
      # this ticket set out to remove, because it removed the verdict entirely.
      #
      # So the guard is now asserted HERE, right after the clone appears and
      # before anything dispatches, through the dispatch venv's own
      # interpreter — the one the verifier actually runs in. It is the real
      # predicate (`check_omnimarket_drift`), not a restatement, and
      # `allow_drift` is left at its refusing default.
      - name: Assert the omnimarket drift guard resolves in the dispatch venv (OMN-16902)
        shell: bash
        run: |
          set -euo pipefail
          "${DISPATCH_VENV}/bin/python" - "${OMNI_HOME}" <<'PYEOF'
          import sys

          from omnibase_infra.cli.omnimarket_drift_guard import (
              OmnimarketDriftError,
              canonical_local_omnimarket_commit,
              check_omnimarket_drift,
              installed_omnimarket_commit,
          )

          omni_home = sys.argv[1]
          canonical = canonical_local_omnimarket_commit(omni_home=omni_home)
          installed = installed_omnimarket_commit()
          print(f"canonical OMNI_HOME/omnimarket HEAD : {canonical}")
          print(f"dispatch-venv installed commit      : {installed}")
          if canonical is None:
              print(
                  "FAIL: ${OMNI_HOME}/omnimarket was not materialised, so the "
                  "OMN-14060 guard fails open and OMN-16790's omnimarket-homed "
                  "behaviour checks still cannot resolve their cwd.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          try:
              check_omnimarket_drift(omni_home)
          except OmnimarketDriftError as exc:
              print(f"FAIL: {exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          print("OK: installed omnimarket == canonical clone HEAD; dispatch will not be refused")
          PYEOF

      # OMN-16902 D2, as an executable precondition rather than a comment.
      #
      # The OCC-homed `test_passes` checks do NOT run in `.occ-src`.
      # `_infer_occ_cwd` returns `_occ_dev_root` — an ephemeral `git worktree`
      # of the governance ref that the collector materialises mid-run. No step
      # can pre-provision that path, so the only honest proof is: build a
      # worktree the same way and show pytest spawns in it.
      #
      # What failed on run 33210339910, on all four seeds:
      #   [failed] dod-occ-evidence-admissibility-validator: FAILED (12ms):
      #     Creating virtual environment at: .venv
      #     error: Failed to spawn: `pytest`
      #
      # 12ms and a freshly created empty `.venv` is the signature of
      # UV_NO_SYNC=1 inherited into a project that had never been synced: uv
      # made the environment and was forbidden from populating it. This step
      # also warms the uv cache, so the worktree the sweep builds a few minutes
      # later resolves from cache instead of the network.
      - name: Prove an OCC governance worktree can spawn pytest (OMN-16902 D2)
        shell: bash
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/occ-governance-probe"
          rm -rf "${probe}"
          git -C "${GITHUB_WORKSPACE}/.occ-src" worktree add --detach "${probe}" origin/dev
          rc=0
          ( cd "${probe}" && uv run pytest --version ) || rc=$?
          git -C "${GITHUB_WORKSPACE}/.occ-src" worktree remove --force "${probe}" || true
          if [ "${rc}" -ne 0 ]; then
            echo '::error::a fresh onex_change_control worktree at origin/dev cannot spawn pytest. Every OCC-homed test_passes check would be recorded FAILED on "error: Failed to spawn: pytest" with no test having executed (run 33210339910, all four seeds) -- a false FAILED that names the runner, not the product (OMN-16902 D2).' >&2
            exit 1
          fi
          echo "OK: a fresh OCC governance worktree provisions its own interpreter and spawns pytest"

      # OMN-16788. The sweep records only COUNTS per ticket
      # (`dod_verify_total_checks` / `verified` / `failed`); the per-check
      # detail dod_verify produces goes to capture files this job does not
      # publish. So when CI and a local run disagree on the same ticket and the
      # same contract — 2026-08-27: OMN-16682 50/50 local vs 23/52 here,
      # OMN-16626 8/8 vs 3/10, OMN-16690 12/14 vs 5/14, OMN-16761 6/6 vs 3/6 —
      # the run log cannot say WHY, and "which verifier is authoritative" stays
      # undecided. That question gates `--apply`.
      #
      # This step exists to answer it from a single dispatch. It runs ONLY when
      # `diagnose_tickets` is non-empty, so every scheduled run pays nothing,
      # and it runs BEFORE the sweep so a sweep timeout cannot swallow it.
      #
      # It reports two things:
      #   1. What this run's GitHub credential can actually READ — per repo the
      #      bound contracts cite. Contract evidence checks are overwhelmingly
      #      `gh pr view` / `gh pr checks` / `gh api repos/.../pulls/...`, and
      #      `_live_pr_checks_for_item` is fail-closed: unresolvable live PR
      #      state is FAILED, not SKIPPED. A wrongly-scoped token therefore
      #      produces a confident wrong verdict rather than an error.
      #   2. The full per-check table for each named ticket.
      #
      # The ticket list is passed through env, never interpolated into the
      # shell (OMN-16323), and is format-validated before use.
      - name: Diagnose verdict divergence (OMN-16788; opt-in, default off)
        if: ${{ github.event.inputs.diagnose_tickets != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # OMN-16902 D2: no UV_NO_SYNC here. This step spawns the same
          # behaviour checks the sweep does, so it must reproduce the sweep's
          # environment exactly — including the OCC governance worktree's
          # ability to provision its own interpreter. See the sweep step below
          # for the full reasoning; a divergence between these two steps would
          # make the diagnostic lie about the thing it exists to diagnose.
          ONEX_CC_REPO_PATH: ${{ github.workspace }}/.occ-src
          DIAGNOSE_TICKETS: ${{ github.event.inputs.diagnose_tickets }}
        run: |
          set -uo pipefail

          if ! printf '%s' "${DIAGNOSE_TICKETS}" | grep -qE '^OMN-[0-9]+(,OMN-[0-9]+)*$'; then
            echo "::error::diagnose_tickets must be a comma-separated list of OMN-<digits> ids." >&2
            exit 1
          fi

          # Probes capability, never the credential itself — no token value is
          # printed, derived, or written anywhere in this step.
          echo "== credential capability =="
          for repo in \
            OmniNode-ai/omnibase_infra \
            OmniNode-ai/onex_change_control \
            OmniNode-ai/omninode_infra \
            OmniNode-ai/omnimarket \
            OmniNode-ai/omnibase_core
          do
            if out="$(gh api "repos/${repo}/pulls?per_page=1" --jq 'length' 2>&1)"; then
              echo "  READ_PULLS ${repo}: OK (${out} returned)"
            else
              echo "  READ_PULLS ${repo}: DENIED — ${out}"
            fi
          done

          echo "== per-ticket dod_verify detail =="
          IFS=',' read -ra TICKETS <<< "${DIAGNOSE_TICKETS}"
          for ticket in "${TICKETS[@]}"; do
            echo "---- ${ticket} ----"
            # OMN-16846: the DISPATCH venv's own binary, matching exactly what
            # the sweep spawns (`_dod_verify_argv`). Going through `uv run`
            # would resolve the gate venv, which by design carries no
            # node_dod_verify.
            "${DISPATCH_VENV}/bin/onex" skill dod_verify "${ticket}" > "${RUNNER_TEMP}/${ticket}.json" 2> "${RUNNER_TEMP}/${ticket}.err" || true
            python3 - "${RUNNER_TEMP}/${ticket}.json" <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          if not raw:
              print("  (no stdout — see the .err capture in the step above)")
              raise SystemExit(0)
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"  (unparseable dod_verify stdout: {exc})")
              print(raw[:2000])
              raise SystemExit(0)

          # `onex skill dod_verify` emits ONE of TWO ModelSkillResult arms, and
          # `receipt_mode` picks between them on the run's own outcome:
          #   ModelDodVerifyState        -> `result` IS the verdict, flat
          #                                 (success-like runs; a `verified`
          #                                 verdict is always this one)
          #   ModelReceiptRuntimeSummary -> the verdict is nested at
          #                                 `result.terminal_payload`
          # `result_model` is the receipt's own declared type tag, so this
          # dispatches on it and refuses anything else.
          #
          # OMN-16961: a prior revision read `terminal_payload or envelope`.
          # That fallback silently absorbed BOTH arms, which is precisely why
          # this diagnostic printed clean verdicts for the same tickets the
          # sweep — which hardcoded the nested arm — scored
          # `error_verify_unparseable`. The two steps must read the receipt
          # the same way or the diagnostic cannot diagnose the reader.
          SUMMARY_MODEL = (
              "omnibase_infra.cli.model_receipt_runtime_summary."
              "ModelReceiptRuntimeSummary"
          )
          STATE_MODEL = (
              "omnimarket.nodes.node_dod_verify.models.model_dod_verify_state."
              "ModelDodVerifyState"
          )
          envelope = payload.get("result") or {}
          result_model = payload.get("result_model")
          if result_model == SUMMARY_MODEL:
              result = envelope.get("terminal_payload") or {}
          elif result_model == STATE_MODEL:
              result = envelope
          else:
              print(
                  f"  (unrecognised dod_verify result_model {result_model!r} — "
                  f"top-level keys: {sorted(payload)}; result keys: "
                  f"{sorted(envelope)})"
              )
              result = {}
          print(f"  receipt_arm={result_model}")
          if "status" not in result:
              print(
                  "  (no verdict in the declared arm — top-level keys: "
                  f"{sorted(payload)}; result keys: {sorted(envelope)})"
              )
          # OMN-16821: non_probative and behavior_proving are printed because
          # the flip predicate now READS both, and a divergence investigation
          # that cannot see them cannot say why a ticket did or did not flip.
          # The flip equality is `verified + non_probative == total` with
          # `failed == 0`, `verified > 0` and `behavior_proving >= 1`; the line
          # below carries every term of it.
          print(
              "  status={} total={} verified={} failed={} skipped={} superseded={}"
              " non_probative={} behavior_proving={}".format(
                  result.get("status"),
                  result.get("total_checks"),
                  result.get("verified_count"),
                  result.get("failed_count"),
                  result.get("skipped_count"),
                  result.get("superseded_count"),
                  result.get("non_probative_count"),
                  result.get("behavior_proving_count"),
              )
          )
          print(
              "  occ_governance_ref={} refresh={} resolved_sha={}".format(
                  result.get("occ_governance_ref"),
                  result.get("occ_refresh_outcome"),
                  result.get("occ_resolved_sha"),
              )
          )
          for check in result.get("checks") or []:
              message = (check.get("message") or "").replace("\n", " ⏎ ")
              print(f"  [{check.get('status')}] {check.get('evidence_id')}: {message[:600]}")
          PYEOF
            echo "  -- stderr tail --"
            tail -n 15 "${RUNNER_TEMP}/${ticket}.err" || true
          done

      - name: Run evidence autoclose sweep
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # OMN-16106. Passed as env, not interpolated into the run body.
          # `${{ github.event.inputs.lookback_hours }}` pasted into a `run:`
          # is substituted BEFORE bash parses the line, so the input's own
          # characters become shell syntax — a workflow_dispatch string input
          # is attacker-influenced in exactly the way that matters. As an env
          # var referenced `"${LOOKBACK_HOURS}"` it is a value. The apply
          # input reaches the shell the same way, via SWEEP_APPLY at job
          # level.
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '6' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # OMN-16846 changed what UV_NO_SYNC was for; OMN-16902 removed it.
          #
          # The sweep and its per-ticket verifier no longer go through `uv run`
          # at all (they run the dispatch venv's own binaries), so nothing at
          # THIS level needed protecting from a re-sync. What does go through
          # `uv run` is the innermost layer: each behaviour check is
          # `uv run pytest ...` in whatever `cwd` its contract pins, inheriting
          # this step's environment. UV_NO_SYNC was set to keep those on the
          # already-synced gate venv rather than re-resolving per check.
          #
          # That reasoning held for exactly one cwd. `_infer_occ_cwd` runs
          # OCC-homed checks in `_occ_dev_root` — an ephemeral `git worktree`
          # of the governance ref the collector materialises DURING the run, at
          # a path no step can pre-provision. UV_NO_SYNC there meant uv created
          # an empty `.venv` and was then forbidden from populating it:
          # `error: Failed to spawn: pytest` in 12ms, recorded as a substantive
          # FAILED, on all four seeds of run 33210339910.
          #
          # So it is gone, and the cost it was avoiding is paid up-front
          # instead: every repo-root dest is pre-synced by the materialise step
          # above and the gate venv is already lock-exact, which makes each
          # `uv run` a cache-hot no-op rather than a resolve. The safety it was
          # incidentally providing is now asserted directly — `uv sync` is
          # exact-mode, so it cannot make `.venv` impure, and the step after
          # the sweep measures that instead of assuming it.
          # First entry in EvidenceCollector's contract search path. Without it
          # dod_verify finds no contract for any ticket and every verdict
          # degrades to a single skipped check (OMN-16736).
          ONEX_CC_REPO_PATH: ${{ github.workspace }}/.occ-src
          # OMN-16792 AC3 — the kill switch, made reachable.
          #
          # `node_evidence_autoclose_sweep_effect` honours
          # ONEX_AUTOCLOSE_DISABLED unconditionally and does ZERO I/O when it
          # is set: no GitHub enumeration, no dod_verify subprocess, no Linear
          # call. But it reads it from the PROCESS environment, and a GitHub
          # repository variable never reaches a step's environment on its own —
          # it lives in the `vars.*` expression context and nowhere else. This
          # line is the whole wiring; without it `gh variable set
          # ONEX_AUTOCLOSE_DISABLED --body 1` was a no-op and the documented
          # halt procedure would have silently failed at the moment an operator
          # needed it.
          #
          # Unset renders as "" and the node treats that as falsy, so a repo
          # with no such variable behaves exactly as before.
          #
          # To halt:    gh variable set ONEX_AUTOCLOSE_DISABLED --repo OmniNode-ai/omnibase_infra --body 1
          # To release: gh variable delete ONEX_AUTOCLOSE_DISABLED --repo OmniNode-ai/omnibase_infra
          ONEX_AUTOCLOSE_DISABLED: ${{ vars.ONEX_AUTOCLOSE_DISABLED }}
        run: |
          set -euo pipefail
          # Fail fast on a missing secret rather than letting every ticket in
          # the run degrade to a per-ticket ERROR_LINEAR_API outcome, which
          # would silently mask a configuration problem as N unrelated
          # per-ticket failures.
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::error::LINEAR_API_KEY is not set — refusing to run the sweep with a missing secret."
            exit 1
          fi
          # OMN-16846: run from the DISPATCH venv. The sweep dispatches
          # dod_verify from its own `sys.executable` (`_dod_verify_argv`), so
          # launching it here is what decides which environment every
          # per-ticket verifier runs in — and it must be the one carrying the
          # co-installed omnimarket, not the lock-exact gate venv the
          # behaviour checks then run pytest in.
          # OMN-16106. `--apply` enters ONLY here, and only through the array
          # the guard populates. It is deliberately absent from the invocation
          # line itself: a guarded flag and an unconditional one read the same
          # in a diff, so the invocation is asserted (by
          # tests/ci/test_evidence_autoclose_sweep_apply_input.py) to contain
          # no literal `--apply` at all.
          apply_args=()
          if [ "${SWEEP_APPLY}" = "true" ]; then
            apply_args+=(--apply)
            echo "::warning title=APPLY MODE::This dispatch WILL write to Linear. Every ticket whose dod_verify verdict clears the flip predicate is moved to Done and receives the audit comment carrying the counters that justified it. Tickets that do not clear it are commented, never flipped."
            echo "mode: APPLY (operator-dispatched, github.event.inputs.apply=true)"
          else
            echo "mode: DRY-RUN (no Linear mutation; every decision is logged as a preview)"
          fi
          # `${arr[@]+"${arr[@]}"}` rather than a bare `"${arr[@]}"`: under
          # `set -u` an empty array expansion is an unbound-variable error on
          # bash < 4.4, and this must not become the reason a dry run fails.
          "${DISPATCH_VENV}/bin/onex" skill evidence_autoclose_sweep \
            --lookback-hours "${LOOKBACK_HOURS}" \
            ${apply_args[@]+"${apply_args[@]}"}

      # OMN-16902, the enforcement half (CLAUDE.md rule 5). Dropping UV_NO_SYNC
      # lets `uv run` sync projects mid-sweep, including the gate checkout.
      # Exact-mode `uv sync` cannot install anything uv.lock does not declare,
      # so `.venv` cannot become impure that way — but "cannot" is a claim, and
      # OMN-16846 exists because a claim about this exact venv was wrong once.
      # This is the measurement.
      #
      # `if: always()` is load-bearing: a sweep that fails for an unrelated
      # reason must not be able to hide a corrupted gate venv, because the next
      # scheduled run would then record N false FAILEDs and read them as N
      # unproven tickets.
      - name: Assert the gate venv is still pure after the sweep (OMN-16902)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! ./.venv/bin/python - <<'PYEOF'
          import sys

          from omnibase_infra.runtime.venv_purity import find_undeclared_onex_providers

          undeclared = find_undeclared_onex_providers()
          if undeclared:
              print(
                  "gate venv `.venv` carries undeclared onex.nodes provider(s) AFTER "
                  "the sweep: " + "; ".join(f"{p.name}=={p.version}" for p in undeclared),
                  file=sys.stderr,
              )
              sys.exit(1)
          print("OK: gate venv `.venv` is still lock-exact after the sweep")
          PYEOF
          then
            echo '::error::the gate venv became IMPURE during the sweep. Something installed an undeclared onex.nodes provider into .venv while the behaviour checks were running, and every subsequent "uv run pytest" check would be refused by the OMN-15620 purity gate and recorded FAILED without executing (OMN-16846, OMN-16902).' >&2
            exit 1
          fi

      - name: Post summary
        if: always()
        # OMN-16106. The mode comes from the same guard as the flag. This step
        # previously asserted "this workflow never passes --apply" as a
        # constant; left alone it would have kept asserting it while the run
        # flipped tickets.
        env:
          SWEEP_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true') && 'APPLY' || 'DRY-RUN' }}
        run: |
          {
            echo "## Evidence Autoclose Sweep (OMN-16106, ${SWEEP_MODE})"
            echo ""
            echo "Enumerated merged onex_change_control companions, re-ran dod_verify,"
            echo "and reached a flip/gap decision per bound ticket."
            echo ""
            if [ "${SWEEP_MODE}" = "APPLY" ]; then
              echo "**Linear was written.** Every ticket recorded \`flipped\` below was moved"
              echo "to Done and received an audit comment naming its merged evidence"
              echo "companion and the dod_verify counters that justified the flip"
              echo "(verified / non-probative / failed / behavior-proving). Tickets that"
              echo "did not clear the predicate were commented with the honest gap, never"
              echo "flipped. The per-ticket receipt in the sweep step's log is the record."
            else
              echo "No Linear mutation was performed — this dispatch did not pass --apply."
              echo "Every decision in the sweep step's receipt is a preview of what an"
              echo "\`apply=true\` dispatch would have written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
