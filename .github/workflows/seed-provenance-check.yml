# seed-provenance-check.yml
#
# OMN-18786: seed/demo provenance findings fail CI Summary. Run on every PR
# and queue SHA so the registered context cannot disappear behind path filters.
# Both the refusing fixture and its valid control run in this job.

name: Seed Provenance Check

on:
  push:
  pull_request:
  merge_group:

concurrency:
  # OMN-13949: cancel superseded PR runs to free saturated runners. merge_group
  # entries carry a unique github.ref, so queue entries never cross-cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seed-provenance-check:
    timeout-minutes: 30
    name: Seed Provenance Check
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Run refusal fixtures and positive controls
        run: uv run --frozen pytest tests/unit/scripts/test_seed_provenance_check.py -q

      - name: Run seed provenance check
        run: |
          python scripts/check_seed_provenance.py --scripts-dir scripts/
