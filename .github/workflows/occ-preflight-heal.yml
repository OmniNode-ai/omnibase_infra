name: OCC Preflight Heal

# OMN-16171 / OMN-14241, amended by OMN-18352.
#
# THE PROBLEM OMN-14241 SOLVED, AND WHY IT COST SO MUCH
# A PR that gains its `Evidence-Source: OCC#<n>` line by a body edit after
# opening leaves `occ-preflight / eligibility` FAILURE from the pre-stamp run.
# `CI Summary` -- dev's sole required context -- polls `ci.yml`'s OWN run job
# list, so it fails closed on that stale result forever. OMN-14241 fixed it by
# adding `edited` to ci.yml's trigger types, which produced a brand-new run of
# the whole ~48-job matrix on every PR-body edit. Because ci.yml's concurrency
# is `cancel-in-progress: true` keyed on PR number, each such edit also
# CANCELLED whatever matrix was mid-flight and restarted it from zero.
# Measured 2026-08-18 on #2784, one unchanged head SHA 7993b115: waves at
# 13:28:50Z (42 workflows), 13:50:09Z (10, incl. a fresh full CI) and
# 13:51:33Z (8), against an org-wide backlog of 247 queued jobs. The stamps
# are frequent because OCC's own bots author them with a minted App token,
# which does emit `pull_request: edited` (GitHub's recursion guard suppresses
# only edits made by the ambient GITHUB_TOKEN).
#
# WHY NOT JUST SKIP THE HEAVY JOBS ON AN EDITED RUN
# A job skipped by an `if:` still publishes a check run with conclusion
# `skipped`, which GitHub branch protection counts as PASSING -- that would
# turn "edit the PR body" into a way to green a red required context. It is
# also the exact shape vector 2 of the required-check skip-vector guard exists
# to reject. So an edited event may produce a genuinely full run, or no run at
# all. There is no safe middle.
#
# WHAT THIS DOES INSTEAD
# ci.yml goes back to the default trigger types, and the self-heal happens
# here: re-run the FAILED JOBS OF THE EXISTING ci.yml RUN, in place.
# `gh run rerun --failed` keeps the same run id, so `CI Summary` re-polls the
# same job list it always polls and observes occ-preflight's new result. Cost
# is the two jobs that actually need to move rather than ~48, no in-flight
# matrix is cancelled, and every job that already passed keeps its result.
#
# ------------------------------------------------------------------------
# OMN-18352: THE RACE THIS SHIPPED WITH, AND WHERE IT WAS FIXED
# ------------------------------------------------------------------------
# `edited` was the ONLY invocation point, and the guard requires the target CI
# run's own `status` to already read `completed` -- a rerun of a single failed
# job is not possible inside an unfinished run. But the autobind stamp lands
# about a minute after the initiating push, while the ~48-job matrix is still
# `in_progress`. So the heal fired, evaluated its guard cleanly, printed
# "nothing to do", and concluded `success` -- a success meaning "the guard
# ran", not "the preflight was healed". Nothing re-invoked it afterwards: a
# rerun does not emit `edited`, and the run reaching `completed` was not an
# event this workflow listened to.
#
# Live on #3503 (head fe5db385): preflight FAILURE 20:52:09Z, stamp edit
# 20:53:00Z, heal green-but-no-op 20:53:03-20:53:08Z, then `CI Summary` frozen
# fail-closed behind the stale conclusion until a HUMAN ran
# `gh run rerun --failed` on run 34782083407 at 21:21:21Z (run_attempt 2,
# triggering_actor jonahgabriel). Reproduced the same session on #3505.
#
# THE FIX IS AN INVOCATION POINT, NOT A NARROWER WINDOW. "Not yet completed"
# is a *not yet*. This workflow now ALSO fires on the CI run's own
# `workflow_run: completed` -- the exact moment the precondition becomes true
# -- while keeping `edited` for a stamp that lands after the run has already
# finished. Between them the two invocation points cover every ordering of
# (stamp lands) and (run completes); neither alone does.
#
# A bounded in-job poll was the other option and was rejected: the matrix runs
# for tens of minutes, so a poll would hold a runner for the duration of
# someone else's CI and would STILL lose the race whenever the matrix outran
# the ceiling. Waiting for an event GitHub already emits costs nothing and
# cannot time out.
#
# The guard itself moved out of this file into `scripts/ci/occ_preflight_heal.py`
# so it is testable at all -- the same shape `ci_summary_gate.py` already uses.
# Its recursion and waste bounds (a heal-issued rerun completing is itself a
# `workflow_run: completed`) are documented there: a staleness comparison
# against the PR's `updated_at`, plus a hard `run_attempt` ceiling as backstop.
# Behaviour is pinned by tests/ci/test_occ_preflight_heal_omn18352.py and
# tests/ci/test_occ_eval_path_trigger_coverage.py.
#
# This workflow is deliberately NOT a required status check and must never
# become one: it reports on whether a heal was attempted, not on whether the
# PR is good.

on:
  pull_request:
    branches: [main, dev]
    types: [edited]
  # OMN-18352. `workflow_run` listens from the DEFAULT BRANCH copy of this
  # file, which is also why a change to this workflow cannot exercise itself
  # on its own PR -- `workflow_dispatch` below is the lever for proving it
  # against a real run id before it lands.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: CI run id to evaluate for a stale occ-preflight verdict.
        required: true
        type: string
      pr-number:
        description: PR number owning that run (resolved from the run when empty).
        required: false
        default: ""
        type: string

# The pull_request key is empty on a workflow_run event and vice versa, so the
# group must carry a discriminator from whichever event fired. With an empty
# key and `cancel-in-progress: true`, every completion-triggered heal in the
# repo would collapse into one group and cancel its peers.
concurrency:
  group: >-
    occ-preflight-heal-${{
      github.event.pull_request.number
      || github.event.workflow_run.id
      || github.run_id
    }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  heal:
    name: Heal stale occ-preflight
    timeout-minutes: 5
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest.
    # This job is a handful of API calls, so it is cheap on either runner, and
    # it only does work when there is actually a stale preflight to heal.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      # Pinned to the DEFAULT branch, never the PR head. On a `pull_request`
      # event GitHub runs the workflow FILE from the PR's merge ref, so the
      # previous inline-shell guard was PR-authored code executing with an
      # `actions: write` token. Checking the guard out from a trusted ref is
      # what closes that; the default branch rather than `base.ref` so a PR
      # targeting the release-synced `main` does not run a guard that lags it.
      - name: Checkout the guard from the default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The workflow file can be newer than the trusted ref it runs the guard
      # from -- on the PR that introduces the guard, it always is. Say which
      # of the two it is rather than letting the interpreter report a missing
      # file, and fail rather than skip: a heal that cannot run its guard has
      # not healed anything, and reporting that as success is the exact defect
      # OMN-18352 exists to remove.
      - name: Require the guard to exist on the trusted ref
        env:
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/occ_preflight_heal.py ]; then
            echo "::error::scripts/ci/occ_preflight_heal.py is absent on" \
                 "${TRUSTED_REF}, so this heal has no trusted guard to run." \
                 "Expected ONLY on the PR that introduces the guard, until it" \
                 "merges. Anywhere else it means the guard was deleted from" \
                 "${TRUSTED_REF} while this workflow still calls it."
            exit 1
          fi

      - name: Re-run failed jobs of the CI run when occ-preflight is stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # One of these is set per event: the completion path knows the run
          # id directly, the edited path resolves it from the head SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          # Must match ci.yml's `name:` and its occ-preflight job id. Renaming
          # either without updating these silently disables the heal, which is
          # why tests/ci/test_occ_eval_path_trigger_coverage.py pins both.
          CI_WORKFLOW_NAME: CI
          PREFLIGHT_JOB_PREFIX: occ-preflight
        run: |
          set -euo pipefail
          args=(--repo "${REPO}"
                --workflow-name "${CI_WORKFLOW_NAME}"
                --preflight-job-prefix "${PREFLIGHT_JOB_PREFIX}")
          if [ -n "${CI_RUN_ID}" ]; then
            args+=(--run-id "${CI_RUN_ID}")
          fi
          if [ -n "${HEAD_SHA}" ]; then
            args+=(--head-sha "${HEAD_SHA}")
          fi
          if [ -n "${PR_NUMBER}" ]; then
            args+=(--pr-number "${PR_NUMBER}")
          fi
          python3 scripts/ci/occ_preflight_heal.py "${args[@]}"
