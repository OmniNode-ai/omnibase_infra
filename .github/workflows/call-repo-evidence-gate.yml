#
# Repo Evidence Gate caller (OMN-20073, OCC retirement OR.5) verifies
# omnibase_infra's own contracts/<OMN-N>.yaml at the PR head through
# omnibase_core's receipt-gate reusable with evidence-source: caller.
# This is the path omnimarket proved as the canary (OMN-20070, OMN-20072).
#
# Why pull_request_target (OMN-20074): GitHub reads a pull_request_target
# workflow's definition from the base branch, so a pull request cannot edit the
# caller, ci.yml or the CI Summary gate and change what judges it. omnimarket's
# and omnibase_core's callers use the same trigger. scripts/audit-runner-routing.py
# bans it in every workflow (OMN-15699: untrusted fork code must never reach
# self-hosted runners); this file is the single named exception, ruled by the
# operator at 2026-10-08T22:41:24Z and recorded as pull_request_target_exception in
# config/runner_routing_policy.yaml. The audit holds this file to its present
# shape: only this trigger, read-only permissions, one job that calls a
# full-SHA-pinned reusable, no inline steps and no secrets. The reusable refuses
# fork heads before any checkout; for a same-repository head it runs the cited
# contract's checks (its bound tests) at the head and at the merge base on the
# trusted runner fleet, as it did under pull_request. Check-runs of a
# same-repository head attach to the PR head sha, so CI Summary still reads them.
# Residual gap: a required check is matched by name, so a pull request could add
# another workflow reporting the same name; only an org required-workflow rule
# closes that, and the audit refuses any other workflow using this trigger.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# The full-SHA pin makes the reusable immutable; verifier-tag names the
# omnimarket dev-merge tag the verifier that reads the caller's contracts is
# installed from (OMN-21853).
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name.
#
# S6 part 1 (OMN-20074): shadow is "false", and repo-evidence / dod-verify is
# registered in CI Summary's EXPECTED_EXTERNAL_CONTEXTS (ci_summary_gate.py),
# so an absent verdict blocks too, alongside a red or skipped verdict.
# Registration follows pull_request_target runs on merged dev heads.
# S6 part 2 (OMN-20074) removed every OCC caller from this repository, so no
# OCC context is enforced beside it.
# compare-with-occ is "false", so the difference step stops waiting for OCC.
# verifier-tag (OMN-21853, operator ruling 2026-10-31T21:49:54Z, OMN-21676) is the
# omnimarket dev-merge tag the reusable installs the verifier from: it resolves the
# tag to its commit and refuses a tag that was moved, is not on omnimarket dev, or
# does not descend from the floor commit e565ba5ba00c (omnimarket#3511, the first
# verifier that refuses a contract leaving a criterion unbound), so no released
# package version decides what verifies this repository, and verifier-version, the
# reusable's warned migration fallback, is not passed. The pre-push ticket-contract
# leg installs the same tag (scripts/ci/check_deploy_scope_dod.py, OMN-20870), so
# local and hosted share one pin; omnimarket#3563 (the occ-difference classifier)
# and the contract_prerequisite function onex scm pr-create calls (OMN-21642) are
# both in the tag's history. The full-SHA pin is a descendant on dev of the
# merge commit of omnibase_core#2203, whose receipt-gate.yml takes verifier-tag;
# caller-mode verify reports a success no-op, leaving only dod-verify to carry the verdict, a writer-app
# dependency-pin-only head is exempt by a verdict derived in the job
# (omnibase_core#1911), and so is the writer app's release cut that adds only a
# changelog entry for the head's version (omnibase_core#1914).
# scripts/ci/check_pin_reachability.py (OMN-15538) accepts it because dev
# contains it.

# check-timeout-seconds (OMN-21433) is the per-check ceiling the pinned reusable passes to the
# verifier; its 30 s default kills a cold hosted `uv run pytest` before it reports.

# The tag descends from omnimarket#3694, which admits tool.uv.override-dependencies in
# classify_dependency_pin_only (OMN-19998). This repository pins omnibase-core exactly
# there (OMN-19655), so a verifier older than that refuses every writer-app core bump
# the dependency-pin-only exemption (omnibase_infra#5453, #5458).

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@ac2f26e3e5bfd02c92496f7d3a9a14071f2c4432 # dev-20261101005012-ac2f26e3e5bf; an omnibase_core dev-merge tag; carries #2203 (verifier-tag), the fix-parent control fallback (control_uses_fix_parent), #2085 (check-timeout-seconds) and #2079 (verifies only the evidence a pull request adds or changes) (OMN-20134, OMN-21853)
    with:
      evidence-source: caller
      verifier-tag: dev-20261101000200-949993edf3b7
      compare-with-occ: "false"
      shadow: "false"
      check-timeout-seconds: "180"
