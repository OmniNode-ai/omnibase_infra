#
# Wave D CI gate: runtime-change PRs must cite a ticket with deploy evidence.
# Ticket: OMN-8912 | DGM-Phase6 (OMN-9734): thin caller — validator lives in omniclaude.
# Reusable workflow landed in omniclaude PR #1418.
#
# Required status check: "deploy-gate"
# Must pass before merging to main on all repos with runtime code.

name: Deploy Gate

on:
  pull_request:
    branches: [main, dev, develop]
    # OMN-16216: labeled/unlabeled/ready_for_review so applying/removing
    # ci:ready or a draft->ready flip retriggers this workflow's evaluation
    # of the deploy-gate job's if:.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    # OMN-16216 draft-state CI admission gate (mirrors onex_change_control
    # PR #6686 / OMN-15731): "deploy-gate / deploy-gate" is an
    # EXPECTED_EXTERNAL_CONTEXTS member in scripts/ci/ci_summary_gate.py,
    # where EXTERNAL_GOOD_CONCLUSIONS = {"success"} -- a "skipped" conclusion
    # already fails closed there with no poller code change needed.
    # merge_group events carry no PR draft/label state and are unaffected
    # (github.event_name != 'pull_request' short-circuits). Main-boundary
    # carve-out unchanged: any PR targeting main always runs this job.
    if: github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:ready')
    uses: OmniNode-ai/omniclaude/.github/workflows/deploy-gate-reusable.yml@b441ff9d979e248ac20c51a00c135a3ce273cef2
    secrets: inherit
    with:
      contracts-dir: contracts
