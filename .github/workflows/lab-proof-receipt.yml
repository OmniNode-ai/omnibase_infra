#
# lab-proof-receipt.yml: the informational `lab-proof-receipt` check run on a
# PR head (OMN-19566, T2 slice 3 of the lab-proof plan, epic OMN-19564).
#
# WHAT IT DOES. The lab pool driver (prepr_runtime_pool.py run
# (dispatching this workflow by default; --no-dispatch-check-run opts out) mints one pr-head receipt per PR it proves, PASS or
# FAIL, and dispatches this workflow with that receipt. The job reads the PR's
# LIVE head from the API, recomputes the PR's diff digest from a fresh clone
# with the verifier's own command, pins the profile and its mandatory checks
# from config/lab_proof_profiles.yaml (the typed registry's --pin, with the
# PR's own changed paths deciding its conditional checks), runs the
# offline verifier, and posts one check run named `lab-proof-receipt` on the
# PROVEN head: `success` only for the verifier's ACCEPTED, `failure` with the
# token in its title for anything else. A head carries exactly one such run:
# when the onexbot App already posted one there (a rerun, a re-dispatch, a retry
# after a post that landed), it is updated in place, never stacked (OMN-19566).
# The same verdict is then published on the bus as the receipt event the
# lab_proof_receipts projection folds, so a proof needs no operator flag to
# reach the projection. The publish runs after the check run is posted, so a
# broker that is down fails this workflow run, never the check run (OMN-19566).
#
# WHY IT IS NEVER A REQUIRED CONTEXT. A check run posted on the PR head sha
# never appears on a merge_group build, so a required context of this name
# would hold every queued PR until it timed out. The required context, when a
# repository reaches its proof bar, is the separate `lab-proof` job (T20,
# OMN-19584), which re-verifies against the live head. That rollout is the
# operator's; this workflow only makes the proof visible on the PR.
#
# WHY A DISPATCHED WORKFLOW. Check runs can only be created by a GitHub App.
# The onexbot installation (app 3342522) carries checks: write org-wide and
# its key lives only in Actions secrets, so the post happens here, narrowed to
# the one repository the receipt names. Nothing new is granted.
#
# WHAT A DISPATCHER CAN AND CANNOT CLAIM. The receipt is an input, so whoever
# can dispatch this workflow chooses the check rows it carries. What they
# cannot choose: the head (read live), the diff digest and the changed paths
# (recomputed here), the profile and its mandatory checks (read from the
# reviewed registry, resolved against those changed paths), and the
# runner/verifier distinctness and carry-over rules (the verifier's). That is
# acceptable for an informational check and is exactly why it is not the gate.
name: lab-proof-receipt

on:
  workflow_dispatch:
    inputs:
      receipt_gzip_b64:
        description: >-
          The pr-head receipt JSON, gzip-compressed then base64-encoded
          (prepr_runtime_pool.py encodes it; a receipt is a few KB).
        required: true
        type: string
      details_url:
        description: Optional link for the check run (for example, the proof's readback).
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  post:
    name: Post lab-proof-receipt
    runs-on: >-
      ${{
        fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout the verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up CI Python environment
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          cache-key-prefix: uv-lab-proof-receipt
          cache-enabled: "false"

      - name: Decode the receipt and read its subject
        id: receipt
        env:
          RECEIPT_B64: ${{ inputs.receipt_gzip_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "${RECEIPT_B64}" | base64 -d | gunzip >"${RUNNER_TEMP}/receipt.json"
          uv run python - "${RUNNER_TEMP}/receipt.json" >>"${GITHUB_OUTPUT}" <<'PY'
          import json
          import re
          import sys

          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          subject = doc.get("subject") or {}
          repo = str(subject.get("repo", ""))
          pr = str(subject.get("pr_number", ""))
          if doc.get("lane") != "pr-head":
              sys.exit(f"not a pr-head receipt: lane={doc.get('lane')!r}")
          if not re.fullmatch(r"OmniNode-ai/[A-Za-z0-9._-]+", repo):
              sys.exit(f"subject repo {repo!r} is not an OmniNode-ai repository")
          if not re.fullmatch(r"[1-9][0-9]*", pr):
              sys.exit(f"subject pr_number {pr!r} is not a PR number")
          print(f"repo={repo}")
          print(f"name={repo.split('/', 1)[1]}")
          print(f"pr={pr}")
          print(f"kind={subject.get('handler_kind', '')}")
          PY

      # Narrowed to the one repository the receipt names, and to what the steps
      # below call: pulls/{n} (pull-requests), the clone (contents), the POST
      # (checks: write), and metadata, which every installation token carries.
      - name: Mint onexbot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: ${{ steps.receipt.outputs.name }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Read the live head and recompute the diff digest
        id: live
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ steps.receipt.outputs.repo }}
          PR: ${{ steps.receipt.outputs.pr }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)
          base=$(gh api "repos/${REPO}/pulls/${PR}" --jq .base.ref)
          clone="${RUNNER_TEMP}/subject"
          rm -rf "${clone}"
          git clone --quiet --filter=blob:none --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${clone}"
          git -C "${clone}" fetch --quiet origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          git -C "${clone}" cat-file -e "${head}^{commit}"
          merge_base=$(git -C "${clone}" merge-base "origin/${base}" "${head}")
          digest=$(uv run python scripts/ci/lab_pass_receipt.py pr-diff-digest \
            --repo-dir "${clone}" --merge-base "${merge_base}" --head "${head}")
          # The PR's own changed paths, read here and never from the dispatcher:
          # they decide which of the profile's conditional checks the receipt
          # must carry (OMN-19566). An empty list makes every one mandatory.
          git -C "${clone}" diff --name-only --no-renames "${merge_base}" "${head}" \
            >"${RUNNER_TEMP}/changed.txt"
          echo "live head ${head} (base ${base}, merge base ${merge_base}, digest ${digest}, $(wc -l <"${RUNNER_TEMP}/changed.txt") changed paths)"
          {
            echo "head=${head}"
            echo "digest=${digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify at the live head and post the check run
        env:
          LAB_PROOF_CHECK_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_SHA: ${{ steps.live.outputs.head }}
          DIGEST: ${{ steps.live.outputs.digest }}
          DETAILS_URL: ${{ inputs.details_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ steps.receipt.outputs.repo }}
          KIND: ${{ steps.receipt.outputs.kind }}
        run: |
          set -euo pipefail
          # The profile and its mandatory checks come from the reviewed
          # registry, through its typed model, never from the dispatcher.
          uv run python scripts/ci/validate_lab_proof_profiles.py \
            --registry config/lab_proof_profiles.yaml \
            --pin "${REPO}" "${KIND}" \
            --changed-files "${RUNNER_TEMP}/changed.txt" >"${RUNNER_TEMP}/pin.json"
          uv run python scripts/ci/lab_pass_receipt.py post-pr-head-check \
            --receipt "${RUNNER_TEMP}/receipt.json" \
            --head-sha "${HEAD_SHA}" \
            --app-slug "${APP_SLUG}" \
            --profile-pin "${RUNNER_TEMP}/pin.json" \
            --current-pr-diff-digest "${DIGEST}" \
            --details-url "${DETAILS_URL:-${RUN_URL}}" \
            | tee "${RUNNER_TEMP}/posted.json"
          {
            echo "## lab-proof-receipt"
            echo ""
            echo '```json'
            cat "${RUNNER_TEMP}/posted.json"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      # OMN-19566 slice 2. The same verdict, at the same live head, goes on the
      # bus for the lab_proof_receipts projection. The pool driver publishes
      # only when an operator hands it bus flags, so a proof run without them
      # posted a check run and left the projection empty. The event is keyed by
      # repo, PR, head, profile and version, so a pool publish and this one
      # fold onto one row. The check run above is already posted with the
      # verdict, so a broker that is down fails this workflow run and leaves
      # the check run as it is.
      - name: Fetch the bus overlay
        if: ${{ !cancelled() && steps.live.outcome == 'success' }}
        uses: ./.github/actions/fetch-lane-table
        with:
          overlay-repo: ${{ vars.OMNI_CI_OVERLAY_REPO }}
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          dest: omnimarket-bus-lanes/config/ci_bus_lanes.yaml

      - name: Build the bus event
        if: ${{ !cancelled() && steps.live.outcome == 'success' }}
        env:
          HEAD_SHA: ${{ steps.live.outputs.head }}
          DIGEST: ${{ steps.live.outputs.digest }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/lab_pass_receipt.py pr-head-event \
            --receipt "${RUNNER_TEMP}/receipt.json" \
            --head-sha "${HEAD_SHA}" \
            --profile-pin "${RUNNER_TEMP}/pin.json" \
            --current-pr-diff-digest "${DIGEST}" \
            --out "${RUNNER_TEMP}/event.json"

      - name: Publish the receipt event to the bus
        if: ${{ !cancelled() && steps.live.outcome == 'success' }}
        env:
          # The dev control-bus lane declares its SASL transport in the overlay
          # fetched above; the publisher reads that declaration and refuses to
          # downgrade it. Credentials stay in the environment, never in argv.
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
        run: |
          set -uo pipefail
          uv run python scripts/ci/publish_lab_fact_event.py \
            --event "${RUNNER_TEMP}/event.json" \
            --bus-lane "dev" \
            --bus-overlay "omnimarket-bus-lanes/config/ci_bus_lanes.yaml"
