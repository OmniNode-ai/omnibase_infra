# OMN-19998: full contract closure is an unconditional CI Summary member.
# Findings fail the run; no baseline, touched-path filter or suppression.
name: contract-topic-graph

on:
  workflow_call:

# CI owns triggers and concurrency; a called workflow must not cancel its caller.
permissions:
  contents: read

jobs:
  contract-topic-graph:
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to ubuntu-latest; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON((github.event_name == 'merge_group' && vars.OMNI_REQUIRED_CI_RUNS_ON_JSON) || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: omnibase_infra

      # The graph is built over the WHOLE corpus — closure is a cross-repo
      # property, and a partial graph reports every cross-package producer as a
      # phantom orphan (build_graph fails closed on a missing package). These
      # repos sit ABOVE omnibase_infra in the layering (core -> spi ->
      # infra -> omnimarket), so they are resolved from a checkout, never as
      # installed dependencies: parse_contract only ever reads YAML text.
      - uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omnimarket
          ref: c7cd6a481acfe7e8c0821a5d5149d592efa556c0 # .github/sibling-pins.yaml
          path: omnimarket
          token: ${{ secrets.CROSS_REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omnimemory
          ref: c7175878b331628de9be9358cb178547d8247c34 # .github/sibling-pins.yaml
          path: omnimemory
          token: ${{ secrets.CROSS_REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omniclaude
          ref: 3b8addff365b1a53e04106284b9275b6d5fad3c6 # .github/sibling-pins.yaml
          path: omniclaude
          token: ${{ secrets.CROSS_REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omniintelligence
          ref: 3fcbf795087a79081c0ceeb676216bf64c5d49ae # .github/sibling-pins.yaml
          path: omniintelligence
          token: ${{ secrets.CROSS_REPO_PAT }}

      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: omnibase_infra
        run: uv sync --frozen

      # `env -u PYTHONPATH`: discover_contract_roots FAILS CLOSED when a pinned
      # dependency resolves from outside the interpreter's environment, which is
      # what an ambient PYTHONPATH causes. The corpus root is passed on the
      # command line, not through the environment, so the verdict names its own
      # inputs.
      - name: Contract graph regressions
        working-directory: omnibase_infra
        run: env -u PYTHONPATH uv run --frozen pytest tests/integration/ci/test_contract_topic_graph_corpus_omn20074.py -q -n 0 --no-cov

      - name: Contract graph closure (omnibase_infra scope)
        working-directory: omnibase_infra
        run: |
          env -u PYTHONPATH uv run --frozen python -m omnibase_infra.validators.contract_topic_graph \
            --scope omnibase_infra --checkout-root "${{ github.workspace }}" --report
