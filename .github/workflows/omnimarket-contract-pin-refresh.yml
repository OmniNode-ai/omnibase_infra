#
# omnimarket-contract-pin-refresh.yml (OMN-17292)
#
# WHY THIS EXISTS
#   `Application Database Domain Enforcement (OMN-15361)` derives the TABLE
#   grants in src/omnibase_infra/topology/instances/*.yaml from omnimarket's
#   `db_io.db_tables` declarations at .github/omnimarket-contract-pin.yaml. That
#   value is an omnimarket release tag, so an omnimarket dev merge cannot change
#   an infra PR's verdict (the OMN-17141 / OMN-16930 / OMN-17290 org-wide reds).
#
#   This workflow is the only writer of that value. Until OMN-17292 moved it
#   to the train, it opened one PR per omnimarket dev commit, at a commit sha,
#   every six hours. Releases are cut by the overnight train, and the lab deploys from
#   tags, so the contract reference follows the train's tag instead.
#
# WHEN
#   After each scheduled run of release-train-nightly.yml completes, and by hand
#   dispatch. The hourly dispatches release-train-dependency-advance.yml makes of
#   that same workflow do not move it (the job's `if:`).
#
# WHAT IT WRITES
#   The newest strict `v<MAJOR>.<MINOR>.<PATCH>` tag of omnimarket, never a sha,
#   into the pin file, the omnimarket entry of .github/sibling-pins.yaml and the
#   inline workflow refs that read it, with the regenerated grants and rendered
#   catalogs in the same commit. One fixed branch keeps at most one such PR open;
#   a later run refreshes it in place.
#
# STALENESS (OMN-15701)
#   The value can lag omnimarket by one train cycle. That is the budget chosen
#   here. The forward-only guard refuses a move to an ancestor or a diverged
#   tag, which is the direction that silently reverted grants in OMN-15701.
#
# OMN-17156 remains the upstream ordering gate; this keeps infra's verdict a
# function of committed state when that ordering is not perfect.

name: Release Train (omnimarket contract tag)

on:
  workflow_run:
    workflows: ["Release Train (nightly)"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnimarket-contract-pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # The train's own overnight run moves the tag; the hourly dependency-advance
    # dispatches of that workflow do not.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    name: Advance omnimarket contract tag
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to ubuntu-latest.
    runs-on: >-
      ${{ fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      # OMN-16373: CROSS_REPO_PAT retirement -- mint a short-lived
      # onexbot-occ-writer App installation token. A PR authored by an App
      # identity (unlike the default GITHUB_TOKEN) triggers downstream CI,
      # which this PR needs: its whole purpose is to run the enforcement gate
      # against the new pin before a human is asked to land it.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omnibase_infra
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout (app token so the bot PR triggers CI)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: dev
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve the current pin and the train's newest release tag
        id: pins
        shell: bash
        env:
          OMNIMARKET_REMOTE: https://github.com/OmniNode-ai/omnimarket.git
        run: |
          set -euo pipefail
          current="$(python3 scripts/resolve_omnimarket_contract_pin.py)"
          tags="$(git ls-remote --tags --refs "$OMNIMARKET_REMOTE" 'refs/tags/v*')"
          target="$(printf '%s\n' "$tags" | awk '{sub(/^refs\/tags\//, "", $2); print $2}' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V | tail -n 1)" || {
            echo "::error::omnimarket has no strict release tag" >&2
            exit 1
          }
          if [[ -z "$target" ]]; then
            echo "::error::omnimarket has no strict release tag" >&2
            exit 1
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$target" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "contract tag already at ${current} - nothing to advance."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "advancing contract tag ${current} -> ${target}"
          fi

      - name: Checkout omnimarket at the target tag
        if: steps.pins.outputs.changed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ steps.pins.outputs.target }}
          path: .proof-dependencies/omnimarket
          persist-credentials: false

      - name: Prove the advance is forward-only
        # OMN-15701 guard. A backwards pin would make the regeneration below
        # DELETE grants derived from contracts that already merged upstream.
        # Fail here rather than open a PR that silently reverts them.
        if: steps.pins.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT_PIN: ${{ steps.pins.outputs.current }}
          TARGET_TAG: ${{ steps.pins.outputs.target }}
        run: |
          set -euo pipefail
          compare_json="$(mktemp)"
          gh api "repos/OmniNode-ai/omnimarket/compare/${CURRENT_PIN}...${TARGET_TAG}" \
            > "$compare_json"
          python3 scripts/ci/check_omnimarket_contract_pin_advance.py \
            --compare-json "$compare_json" \
            --base-pin "$CURRENT_PIN" \
            --head-pin "$TARGET_TAG"

      - name: Setup Python and uv
        if: steps.pins.outputs.changed == 'true'
        uses: ./.github/actions/setup-python-uv
        with:
          # Python/uv versions intentionally left at the composite action's own
          # pinned defaults -- this workflow has no workflow-level env block, so
          # naming them here would only risk drifting from the versions every
          # other job in the repo builds against.
          cache-enabled: "false"

      - name: Write the tag into the pin files
        if: steps.pins.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_TAG: ${{ steps.pins.outputs.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY_TAG'
          import os
          import re
          from pathlib import Path

          tag_pattern = r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          target = os.environ["TARGET_TAG"]
          if re.fullmatch(tag_pattern, target) is None:
              raise SystemExit("::error::TARGET_TAG must be a strict release tag")

          path = Path(".github/omnimarket-contract-pin.yaml")
          original = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"^omnimarket_release_tag: " + tag_pattern + r"$",
              f"omnimarket_release_tag: {target}",
              original,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("::error::expected exactly one omnimarket_release_tag in the pin file")
          changes = {path: updated}

          path = Path(".github/sibling-pins.yaml")
          original = path.read_text(encoding="utf-8")
          pattern = r"^  omnimarket: (" + tag_pattern + r")$"
          matches = list(re.finditer(pattern, original, flags=re.MULTILINE))
          if len(matches) != 1:
              raise SystemExit("::error::expected exactly one omnimarket entry in .github/sibling-pins.yaml")
          old = matches[0].group(1)
          changes[path] = re.sub(pattern, f"  omnimarket: {target}", original, flags=re.MULTILINE)

          if old != target:
              total = 0
              for workflow in sorted(Path(".github/workflows").glob("*.yml")):
                  original = workflow.read_text(encoding="utf-8")
                  updated, count = re.subn(
                      r"ref: " + re.escape(old) + r" # \.github/sibling-pins\.yaml",
                      f"ref: {target} # .github/sibling-pins.yaml",
                      original,
                  )
                  if count:
                      changes[workflow] = updated
                      print(f"{workflow}: updated {count} omnimarket sibling pin ref(s)")
                      total += count
              if total == 0:
                  raise SystemExit("::error::no workflow ref matched the old omnimarket sibling pin")
          for path, updated in changes.items():
              path.write_text(updated, encoding="utf-8")
          PY_TAG

      - name: Regenerate and prove the derived grants
        # The tag and its derived grants and rendered catalogs move in one commit.
        if: steps.pins.outputs.changed == 'true'
        id: regenerate
        shell: bash
        run: |
          set -euo pipefail
          # --write regenerates the topology instances AND re-renders the
          # docker/catalog/database-topology projections derived from them
          # (OMN-17292), so the pin and every artifact derived from it move in
          # this one commit.
          uv run python scripts/generate_application_database_table_grants.py \
            --contracts-root .proof-dependencies/omnimarket/src/omnimarket/nodes \
            --write
          # Prove the result before proposing it: the same --check --prove the
          # required gate runs. A bot PR that cannot pass its own gate is worse
          # than no bot PR.
          uv run python scripts/generate_application_database_table_grants.py \
            --contracts-root .proof-dependencies/omnimarket/src/omnimarket/nodes \
            --check --prove

      - name: Open or refresh the contract-tag PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT_PIN: ${{ steps.pins.outputs.current }}
          TARGET_TAG: ${{ steps.pins.outputs.target }}
        run: |
          set -euo pipefail
          # The Repo Evidence Gate needs a changed test-side path, a bound check that
          # fails at the merge base with the test side overlaid, and an evidence item
          # that differs from the merge base's: write the target fixture and name the
          # target tag in the item so each refresh carries its own evidence (OMN-20068).
          PATTERN="omnimarket_release_tag: ${TARGET_TAG}"
          grep -qF -- "$PATTERN" .github/omnimarket-contract-pin.yaml
          cat > tests/ci/fixtures/omnimarket_contract_pin_advance_omn17292.yaml <<EOF_FIXTURE
          # SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
          # SPDX-License-Identifier: MIT
          # Written by .github/workflows/omnimarket-contract-pin-refresh.yml on each pin
          # advance: the tag tests/ci/test_omnimarket_contract_pin_advance_omn17292.py
          # expects every omnimarket pin to carry (OMN-17292, OMN-20068).
          omnimarket_release_tag: ${TARGET_TAG}
          EOF_FIXTURE
          CHECK="env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin_advance_omn17292.py -q"
          cat > contracts/OMN-17292.yaml <<EOF_CONTRACT
          schema_version: "1.0.0"
          ticket_id: OMN-17292
          title: "The omnimarket contract tag moves to ${TARGET_TAG}"
          summary: The automated refresh moves .github/omnimarket-contract-pin.yaml to a value the merge base does not carry.
          is_seam_ticket: false
          interface_change: false
          interfaces_touched: []
          requirements:
            - id: req-omn17292
              statement: .github/omnimarket-contract-pin.yaml carries the value this refresh produced.
              acceptance:
                - id: AC1
                  statement: "AC1: the omnimarket contract pin, the omnimarket sibling pin and every inline omnimarket checkout ref carry ${TARGET_TAG} -- falsifier: $CHECK"
          evidence_requirements:
            - kind: tests
              description: The contract pin, sibling pin and every inline omnimarket checkout ref carry ${TARGET_TAG}.
              command: "$CHECK"
          emergency_bypass:
            enabled: false
            justification: ''
            follow_up_ticket_id: ''
          dod_evidence:
            - id: dod-omn-17292-ac1
              description: The contract pin, sibling pin and every inline omnimarket checkout ref carry ${TARGET_TAG}.
              source: manual
              checks:
                - check_type: test_passes
                  check_value: "$CHECK"
                  cwd: \${OMNI_HOME}/omnibase_infra
              binds_ac: [AC1]
          EOF_CONTRACT
          # .proof-dependencies is a CI-only checkout; never let it into a commit.
          git add -- .github/omnimarket-contract-pin.yaml \
                     contracts/OMN-17292.yaml \
                     tests/ci/fixtures/omnimarket_contract_pin_advance_omn17292.yaml \
                     .github/sibling-pins.yaml \
                     .github/workflows \
                     src/omnibase_infra/topology/instances \
                     docker/catalog/database-topology
          if git diff --cached --quiet; then
            echo "pin moved but no derived output changed - nothing to propose."
            exit 0
          fi
          BRANCH="automation/omnimarket-contract-tag-omn-17292"
          remote_sha=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | cut -f1)
          pr_number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          # OMN-18273: authenticate and commit as the App, with both run trailers.
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(OMN-17292): move the omnimarket contract tag to ${TARGET_TAG} [bot]" \
            --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
            --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="${BRANCH}:${remote_sha}" origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
          {
            printf '%s\n' "Opened by the overnight release train follower (OMN-17292)."
            printf '\n'
            printf '%s\n' "Moves the omnimarket contract tag: \`${CURRENT_PIN}\` -> \`${TARGET_TAG}\`. Updates \`.github/omnimarket-contract-pin.yaml\`, the omnimarket sibling pin and its inline workflow refs, and regenerates the derived TABLE grants and rendered catalogs in the same commit."
            printf '\n'
            printf '%s\n' "At most one such PR is open; it is refreshed in place on this fixed branch."
            printf '\n'
            printf '%s\n' "The advance was proven forward-only against omnimarket history and the derived output passes \`--check --prove\`."
            printf '\n'
            printf '%s\n' "Evidence-Ticket: OMN-17292"
          } > /tmp/pin-pr-body.md
          TITLE="chore(OMN-17292): move the omnimarket contract tag to ${TARGET_TAG}"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$TITLE" --body-file /tmp/pin-pr-body.md
          else
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file /tmp/pin-pr-body.md
          fi
