# SPDX-License-Identifier: MIT
#
# OMN-17292: follow omnimarket's newest release tag with the contract pin and
# regenerate the derived application-database TABLE grants, as an actionable bot PR.
#
# THE PIN IS A RELEASE TAG, MOVED ONCE PER OVERNIGHT RELEASE
#   Operator rulings 2026-10-16 and 2026-10-23: the lab deploys from tags, no
#   commit-sha pins, and a release is created overnight by the release train and
#   at no other time. This workflow used to open one PR per omnimarket dev merge
#   ("advance omnimarket contract pin to <sha12>", five open at once, every head
#   costing a full CI run). It now reads the newest omnimarket release tag
#   (vX.Y.Z, the tag auto-tag-on-merge creates when the train's release PR
#   merges) once a day after the train's window, and opens at most ONE PR per new
#   release. A day with no new release opens nothing. The per-merge
#   dev-<UTC>-<sha12> tags are never read here; they move with every merge.
#   No commit sha is written by this workflow: the tag is what lands in the pin
#   file, the sibling pins and every inline checkout ref.
#
# This is the freshness half of the OMN-17292 split, and it is load-bearing.
#
# `Application Database Domain Enforcement (OMN-15361)` derives the TABLE grants
# in src/omnibase_infra/topology/instances/*.yaml from omnimarket node
# `db_io.db_tables` declarations. OMN-15703 made that derivation read
# omnimarket's live `dev` tip at CI-run time. Because omnibase_infra `dev`
# enforces through the single required `CI Summary` umbrella (OMN-4497), an
# omnimarket merge then turned the required check red on every open infra PR at
# once -- three times in 21 hours (OMN-17141, OMN-16930, OMN-17290), each
# costing an unrelated lane a full investigate-fix-merge cycle while every other
# infra PR sat blocked.
#
# OMN-17292 pins the derivation input so an infra PR's verdict depends only on
# committed state. Pinning ALONE would be a straight return to OMN-15701 (a
# stale pin used as a `--write` input silently reverted 8 live grants), so this
# workflow is the other half: it advances the pin on a schedule, updates the
# omnimarket entry in .github/sibling-pins.yaml and its inline workflow refs,
# regenerates the instances AND the rendered catalogs in the same commit, and
# opens a PR. The pin can be briefly behind omnimarket's newest release; it cannot
# sit stale silently, and scripts/ci/check_omnimarket_contract_pin_advance.py
# keeps it forward-only.
#
# Modelled on the sanctioned in-repo precedent for exactly this problem class:
# .github/workflows/sibling-lock-refresh.yml (OMN-13902), which solved stale
# cross-repo sibling pins the same way.
#
# Related: OMN-17156 attacks the same failure from the upstream side (block an
# omnimarket PR until its infra counterpart exists). The two are complementary:
# OMN-17156 keeps the two repos ordered; this keeps infra's CI verdict
# deterministic when that ordering is not perfect.

name: Omnimarket contract pin refresh

on:
  schedule:
    # Once a day, after the release train's window (release-train-nightly.yml
    # cuts at 07:11 UTC and the release PR then merges and tags). Bounds how far
    # the pin can lag omnimarket's newest release to one day, which is the
    # OMN-15701 staleness budget being deliberately chosen here.
    # tests/ci/test_omnimarket_contract_pin.py asserts one daily run after the train.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "omnimarket release tag to pin, vX.Y.Z (default: the newest release tag)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: omnimarket-contract-pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Advance omnimarket contract pin
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to ubuntu-latest.
    runs-on: >-
      ${{ fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      # OMN-16373: CROSS_REPO_PAT retirement -- mint a short-lived
      # onexbot-occ-writer App installation token. A PR authored by an App
      # identity (unlike the default GITHUB_TOKEN) triggers downstream CI,
      # which this PR needs: its whole purpose is to run the enforcement gate
      # against the new pin before a human is asked to land it.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omnibase_infra
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout (app token so the bot PR triggers CI)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: dev
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve the current and target pins
        id: pins
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REF_INPUT: ${{ github.event.inputs.target_ref }}
        run: |
          set -euo pipefail
          current="$(python3 scripts/resolve_omnimarket_contract_pin.py)"
          release_tag='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ -n "$TARGET_REF_INPUT" ]]; then
            target="$TARGET_REF_INPUT"
          else
            # The newest RELEASE tag. Per-merge dev-<UTC>-<sha12> tags and every
            # other ref fail the pattern and are never a pin.
            target="$(gh api --paginate \
                "repos/OmniNode-ai/omnimarket/git/matching-refs/tags/v?per_page=100" \
                --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E "$release_tag" \
              | sort -V \
              | tail -n 1)"
          fi
          if [[ ! "$target" =~ $release_tag ]]; then
            echo "::error::omnimarket target '${target}' is not a release tag (vX.Y.Z)" >&2
            exit 1
          fi
          # A tag typed into the dispatch input must exist on omnimarket.
          if ! gh api "repos/OmniNode-ai/omnimarket/git/ref/tags/${target}" --silent; then
            echo "::error::omnimarket has no release tag ${target}" >&2
            exit 1
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$target" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "contract pin already at ${current} - nothing to advance."
          elif git ls-remote --exit-code --heads origin "bot/omnimarket-contract-pin-${target}" > /dev/null; then
            # One PR per release: the branch is named for the tag, so a rerun, a
            # dispatch or the next day's schedule finds the PR already proposed.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the pin advance to ${target} is already proposed on bot/omnimarket-contract-pin-${target}; nothing to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "advancing contract pin ${current} -> ${target}"
          fi

      - name: Checkout omnimarket at the target release tag
        if: steps.pins.outputs.changed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ steps.pins.outputs.target }}
          path: .proof-dependencies/omnimarket
          persist-credentials: false

      - name: Prove the advance is forward-only
        # OMN-15701 guard. A backwards pin would make the regeneration below
        # DELETE grants derived from contracts that already merged upstream.
        # Fail here rather than open a PR that silently reverts them.
        if: steps.pins.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT_PIN: ${{ steps.pins.outputs.current }}
          TARGET_PIN: ${{ steps.pins.outputs.target }}
        run: |
          set -euo pipefail
          # The guard binds its compare payload to the pair by the payload's own
          # url, so it is handed the two commits the release tags name.
          base_commit="$(gh api "repos/OmniNode-ai/omnimarket/commits/${CURRENT_PIN}" --jq .sha)"
          head_commit="$(gh api "repos/OmniNode-ai/omnimarket/commits/${TARGET_PIN}" --jq .sha)"
          for commit in "$base_commit" "$head_commit"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release tag ${CURRENT_PIN} or ${TARGET_PIN} did not resolve to a commit: '${commit}'" >&2
              exit 1
            fi
          done
          compare_json="$(mktemp)"
          gh api "repos/OmniNode-ai/omnimarket/compare/${base_commit}...${head_commit}" \
            > "$compare_json"
          python3 scripts/ci/check_omnimarket_contract_pin_advance.py \
            --compare-json "$compare_json" \
            --base-pin "$base_commit" \
            --head-pin "$head_commit"

      - name: Setup Python and uv
        if: steps.pins.outputs.changed == 'true'
        uses: ./.github/actions/setup-python-uv
        with:
          # Python/uv versions intentionally left at the composite action's own
          # pinned defaults -- this workflow has no workflow-level env block, so
          # naming them here would only risk drifting from the versions every
          # other job in the repo builds against.
          cache-enabled: "false"

      - name: Advance the pin and regenerate the derived grants
        # The pin and the grants it derives must move in ONE commit. A commit
        # that advanced the pin without regenerating would land a `dev` that
        # fails its own `--check`, which is the org-wide red this ticket exists
        # to remove -- self-inflicted this time.
        if: steps.pins.outputs.changed == 'true'
        id: regenerate
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ steps.pins.outputs.target }}" <<'PY'
          import re
          import sys
          from pathlib import Path

          target = sys.argv[1]
          path = Path(".github/omnimarket-contract-pin.yaml")
          original = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"^omnimarket_contract_ref: v[0-9]+\.[0-9]+\.[0-9]+$",
              f"omnimarket_contract_ref: {target}",
              original,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("::error::could not rewrite omnimarket_contract_ref in the pin file")
          path.write_text(updated, encoding="utf-8")

          path = Path(".github/sibling-pins.yaml")
          original = path.read_text(encoding="utf-8")
          pattern = r"^  omnimarket: (v[0-9]+\.[0-9]+\.[0-9]+)$"
          matches = re.findall(pattern, original, flags=re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit("::error::could not rewrite the omnimarket entry in .github/sibling-pins.yaml")
          old = matches[0]
          updated = re.sub(pattern, f"  omnimarket: {target}", original, flags=re.MULTILINE)
          path.write_text(updated, encoding="utf-8")

          if old != target:
              total = 0
              for workflow in sorted(Path(".github/workflows").glob("*.yml")):
                  original = workflow.read_text(encoding="utf-8")
                  updated, count = re.subn(
                      r"ref: " + re.escape(old) + r" # \.github/sibling-pins\.yaml",
                      f"ref: {target} # .github/sibling-pins.yaml",
                      original,
                  )
                  if count:
                      workflow.write_text(updated, encoding="utf-8")
                      print(f"{workflow}: updated {count} omnimarket sibling pin ref(s)")
                      total += count
              if total == 0:
                  raise SystemExit("::error::no workflow ref matched the old omnimarket sibling pin")
          PY
          # --write regenerates the topology instances AND re-renders the
          # docker/catalog/database-topology projections derived from them
          # (OMN-17292), so the pin and every artifact derived from it move in
          # this one commit.
          uv run python scripts/generate_application_database_table_grants.py \
            --contracts-root .proof-dependencies/omnimarket/src/omnimarket/nodes \
            --write
          # Prove the result before proposing it: the same --check --prove the
          # required gate runs. A bot PR that cannot pass its own gate is worse
          # than no bot PR.
          uv run python scripts/generate_application_database_table_grants.py \
            --contracts-root .proof-dependencies/omnimarket/src/omnimarket/nodes \
            --check --prove

      - name: Open the pin-advance PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT_PIN: ${{ steps.pins.outputs.current }}
          TARGET_PIN: ${{ steps.pins.outputs.target }}
        run: |
          set -euo pipefail
          # The Repo Evidence Gate needs a changed test-side path, a bound check that
          # fails at the merge base with the test side overlaid, and an evidence item
          # that differs from the merge base's: write the target fixture and name the
          # target release tag in the item so each refresh carries its own evidence (OMN-20068).
          PATTERN="omnimarket_contract_ref: ${TARGET_PIN}"
          grep -qF -- "$PATTERN" .github/omnimarket-contract-pin.yaml
          cat > tests/ci/fixtures/omnimarket_contract_pin_advance_omn17292.yaml <<EOF_FIXTURE
          # SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
          # SPDX-License-Identifier: MIT
          # Written by .github/workflows/omnimarket-contract-pin-refresh.yml on each pin
          # advance: the release tag tests/ci/test_omnimarket_contract_pin_advance_omn17292.py
          # expects every omnimarket pin to carry (OMN-17292, OMN-20068).
          omnimarket_contract_ref: ${TARGET_PIN}
          EOF_FIXTURE
          CHECK="env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin_advance_omn17292.py -q"
          cat > contracts/OMN-17292.yaml <<EOF_CONTRACT
          schema_version: "1.0.0"
          ticket_id: OMN-17292
          title: "The omnimarket contract pin advances to ${TARGET_PIN}"
          summary: The automated refresh moves .github/omnimarket-contract-pin.yaml to a value the merge base does not carry.
          is_seam_ticket: false
          interface_change: false
          interfaces_touched: []
          requirements:
            - id: req-omn17292
              statement: .github/omnimarket-contract-pin.yaml carries the value this refresh produced.
              acceptance:
                - id: AC1
                  statement: "AC1: the omnimarket contract pin, the omnimarket sibling pin and every inline omnimarket checkout ref carry ${TARGET_PIN} -- falsifier: $CHECK"
          evidence_requirements:
            - kind: tests
              description: The contract pin, sibling pin and every inline omnimarket checkout ref carry ${TARGET_PIN}.
              command: "$CHECK"
          emergency_bypass:
            enabled: false
            justification: ''
            follow_up_ticket_id: ''
          dod_evidence:
            - id: dod-omn-17292-ac1
              description: The contract pin, sibling pin and every inline omnimarket checkout ref carry ${TARGET_PIN}.
              source: manual
              checks:
                - check_type: test_passes
                  check_value: "$CHECK"
                  cwd: \${OMNI_HOME}/omnibase_infra
              binds_ac: [AC1]
          EOF_CONTRACT
          # .proof-dependencies is a CI-only checkout; never let it into a commit.
          git add -- .github/omnimarket-contract-pin.yaml \
                     contracts/OMN-17292.yaml \
                     tests/ci/fixtures/omnimarket_contract_pin_advance_omn17292.yaml \
                     .github/sibling-pins.yaml \
                     .github/workflows \
                     src/omnibase_infra/topology/instances \
                     docker/catalog/database-topology
          if git diff --cached --quiet; then
            echo "pin moved but no derived output changed - nothing to propose."
            exit 0
          fi
          # One branch per release tag: the resolve step stops before this point
          # when the branch already exists, so a release is proposed once.
          BRANCH="bot/omnimarket-contract-pin-${TARGET_PIN}"
          # OMN-18273: commit as the App this job already authenticates as. The
          # previous "omninode-bot <bot@omninode.ai>" resolved to no GitHub
          # account, so the commit rendered unlinked and named neither a bot nor
          # a run. The numeric prefix on the address is what links it.
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(OMN-17292): advance omnimarket contract pin to ${TARGET_PIN} [bot]" \
            --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
            --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          {
            printf '%s\n' "Automated omnimarket contract-pin advance (OMN-17292)."
            printf '\n'
            printf '%s\n' "\`${TARGET_PIN}\` is omnimarket's newest release tag, the one the overnight release train produced. The pin follows the release, once per release, and no pull request is opened per omnimarket merge."
            printf '\n'
            printf '%s\n' "Advances \`.github/omnimarket-contract-pin.yaml\` from \`${CURRENT_PIN}\` to \`${TARGET_PIN}\`, also moves the omnimarket entry of \`.github/sibling-pins.yaml\` and the inline workflow \`ref:\` values that read it (OMN-20331), and regenerates the derived application-database TABLE grants and rendered catalogs in the same commit."
            printf '\n'
            printf '%s\n' "This PR is the surface upstream contract drift is supposed to land on. Before OMN-17292 this same drift appeared as a red required check on every open omnibase_infra PR simultaneously, with no action available to their authors (OMN-17141, OMN-16930, OMN-17290)."
            printf '\n'
            printf '%s\n' "The advance was proven forward-only against real omnimarket history (\`scripts/ci/check_omnimarket_contract_pin_advance.py\`), so it cannot silently revert grants the way the stale pin in OMN-15701 did, and the regenerated output already passes \`--check --prove\` locally in the bot run."
            printf '\n'
            printf '%s\n' "Evidence-Ticket: OMN-17292"
          } > /tmp/pin-pr-body.md
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore(OMN-17292): advance omnimarket contract pin to ${TARGET_PIN}" \
            --body-file /tmp/pin-pr-body.md
