#
# plugin-pin-cascade.yml
#
# Triggered by repository_dispatch (event-type: plugin-release) from app repos
# (omniclaude, omniintelligence, omnimemory) after each PyPI release.
# Updates Dockerfile.runtime pins for the released plugin and opens a PR.
#
# Ticket: OMN-5375 (origin), OMN-18596 (downstream pin-bump PRs on publish)
#
# OMN-18596: the PR this opens must be attributable and must target the branch
# its commit was cut from. Before this, it opened ticketless (so occ-autobind
# had no ticket to bind a change-control companion to, and the PR stayed red on
# the missing evidence) and against a literal `main` while the checkout cut the
# branch from the default branch `dev` (omnibase_infra#4168: a three-line pin
# change rendered as a 100-file dev..main diff). Both now follow the
# dependency-cascade.yml convention: a validated ticket in the head ref, title
# and body, and a base read from the checkout rather than written here.

name: Plugin Pin Cascade

on:
  repository_dispatch:
    types: [plugin-release]
  workflow_dispatch:
    inputs:
      package:
        description: 'PyPI package name (e.g. omninode-claude)'
        required: true
        type: string
      version:
        description: 'Released version (e.g. 0.5.0)'
        required: true
        type: string
      ticket:
        description: 'OMN ticket the PR cites; defaults to the standing cascade ticket'
        required: false
        type: string

# OMN-18596: the standing ticket every plugin pin cascade PR cites when the
# dispatch names none. Declared here, once, as configuration: occ-autobind reads
# the ticket from the PR title and head ref, and a PR with neither cannot get a
# companion at all.
env:
  PLUGIN_PIN_CASCADE_STANDING_TICKET: OMN-18596

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dockerfile-pins:
    timeout-minutes: 30
    name: Update Dockerfile.runtime pins for ${{ github.event.client_payload.package || inputs.package }}
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Resolve inputs
        id: inputs
        # Inputs arrive through env, never interpolated into the script, and
        # every field that reaches a ref, a PR title or a PR body is validated
        # first (the dependency-cascade.yml OMN-16286 rule).
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PACKAGE: ${{ github.event.client_payload.package }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_TICKET: ${{ github.event.client_payload.ticket }}
          MANUAL_PACKAGE: ${{ inputs.package }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_TICKET: ${{ inputs.ticket }}
        run: |
          # >>> OMN-18596 plugin pin inputs >>>
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            PACKAGE="${DISPATCH_PACKAGE}"
            VERSION="${DISPATCH_VERSION}"
            SOURCE_REPO="${DISPATCH_SOURCE_REPO}"
            TICKET="${DISPATCH_TICKET}"
          else
            PACKAGE="${MANUAL_PACKAGE}"
            VERSION="${MANUAL_VERSION}"
            SOURCE_REPO="manual"
            TICKET="${MANUAL_TICKET}"
          fi
          TICKET="${TICKET:-${PLUGIN_PIN_CASCADE_STANDING_TICKET}}"
          if ! [[ "${PACKAGE}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::OMN-18596: package '${PACKAGE}' does not match ^[A-Za-z0-9_-]+\$."
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.+-]*)?$ ]]; then
            echo "::error::OMN-18596: version '${VERSION}' is not a SemVer-ish release version."
            exit 1
          fi
          if ! [[ "${TICKET}" =~ ^OMN-[0-9]+$ ]]; then
            echo "::error::OMN-18596: ticket '${TICKET}' does not match ^OMN-[0-9]+\$; a pin cascade PR must be attributable."
            exit 1
          fi
          if ! [[ "${SOURCE_REPO}" =~ ^[A-Za-z0-9_./-]*$ ]]; then
            echo "::error::OMN-18596: source_repo '${SOURCE_REPO}' contains characters outside ^[A-Za-z0-9_./-]*\$."
            exit 1
          fi
          {
            echo "package=${PACKAGE}"
            echo "version=${VERSION}"
            echo "source_repo=${SOURCE_REPO}"
            echo "ticket=${TICKET}"
          } >> "$GITHUB_OUTPUT"
          # <<< OMN-18596 plugin pin inputs <<<

      # OMN-18273: this job used to push with the default workflow token, which
      # both mis-attributes the commit to github-actions[bot] and does NOT start
      # push-driven CI, so the PR it opened sat with no checks. Mint the
      # onexbot-occ-writer installation token instead. The mint is deliberately
      # NOT given a `|| secrets.GITHUB_TOKEN` fallback: a fallback restores the
      # old behaviour silently while the job still reports success.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omnibase_infra
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout omnibase_infra (app token so the bot push triggers CI)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set branch name and resolve the base
        id: branch
        env:
          PKG: ${{ steps.inputs.outputs.package }}
          VER: ${{ steps.inputs.outputs.version }}
          TICKET: ${{ steps.inputs.outputs.ticket }}
        run: |
          TICKET_SLUG="$(printf '%s' "${TICKET}" | tr '[:upper:]' '[:lower:]')"
          echo "name=automation/pin-${PKG}-${VER}-${TICKET_SLUG}" >> "$GITHUB_OUTPUT"
          # The pre-OMN-18596 branch shape: a PR still open under it is the
          # same cascade, and the already-open check must see it.
          echo "legacy_name=automation/pin-${PKG}-${VER}" >> "$GITHUB_OUTPUT"
          # >>> OMN-18596 plugin pin base resolver >>>
          # The base is the ref the checkout landed on, read BEFORE the pin
          # branch is cut from it. The checkout passes no `ref:`, so this is
          # the repository's default branch, resolved at run time. A literal
          # base opened omnibase_infra#4168 against a release-synced main.
          BASE_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ -z "${BASE_BRANCH}" ] || [ "${BASE_BRANCH}" = "HEAD" ]; then
            echo "::error::OMN-18596: refusing to open a plugin pin PR: the checkout is detached or its branch could not be read, so the base cannot be bound to the commit's own parent."
            exit 1
          fi
          echo "base=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"
          # <<< OMN-18596 plugin pin base resolver <<<

      - name: Create branch
        run: git checkout -b "${{ steps.branch.outputs.name }}"

      - name: Run update-plugin-pins.py
        # **Reconciliation semantics**: This workflow is a full plugin reconciliation
        # mechanism triggered by one release event. It fetches the latest visible PyPI
        # version for ALL plugins in the PLUGINS list (omninode-claude,
        # omninode-intelligence, omninode-memory) and rewrites Dockerfile.runtime
        # accordingly. The dispatched `version` is enforced as a *minimum postcondition*
        # for the triggering package — not a cap on what other pins may also advance.
        # Any additional plugin pin changes in the same PR reflect reconciliation to the
        # latest visible PyPI state. Reviewers should expect a single PR may advance one,
        # two, or all three plugin pins simultaneously.
        run: |
          python scripts/update-plugin-pins.py \
            --dockerfile docker/Dockerfile.runtime

      - name: Verify pin advanced to expected version
        # Postcondition: the Dockerfile pin for the dispatched package must match
        # the requested version. If PyPI propagation lag caused update-plugin-pins.py
        # to fetch an older version, fail loudly rather than silently succeed with
        # stale data.
        #
        # The dispatched version may carry a 'v' prefix (e.g. v0.15.0 from the
        # release tag) while the Dockerfile pin is bare (0.15.0). Strip the prefix
        # before comparing.
        run: |
          PKG="${{ steps.inputs.outputs.package }}"
          EXPECTED_VER="${{ steps.inputs.outputs.version }}"
          # Strip leading 'v' prefix if present (e.g. v0.15.0 → 0.15.0)
          EXPECTED_VER="${EXPECTED_VER#v}"
          ACTUAL=$(grep -oP "(?<=${PKG}==)[0-9]+\.[0-9]+\.[0-9]+" docker/Dockerfile.runtime || true)
          if [ "$ACTUAL" != "$EXPECTED_VER" ]; then
            echo "ERROR: Dockerfile pin for ${PKG} did not reach expected version ${EXPECTED_VER} (actual: ${ACTUAL}) — PyPI propagation lag. Re-run workflow after 60s." >&2
            exit 1
          fi
          echo "Pin confirmed: ${PKG}==${ACTUAL}"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet docker/Dockerfile.runtime; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Dockerfile.runtime unchanged — pin already up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"
          git add docker/Dockerfile.runtime
          git commit -m "chore(deps): pin ${{ steps.inputs.outputs.package }} to ${{ steps.inputs.outputs.version }}" \
            -m "Automated Dockerfile.runtime pin update triggered by release of ${{ steps.inputs.outputs.package }} ${{ steps.inputs.outputs.version }} from ${{ steps.inputs.outputs.source_repo }}." \
            --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
            --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for HEAD_REF in "${{ steps.branch.outputs.name }}" "${{ steps.branch.outputs.legacy_name }}"; do
            EXISTING=$(gh pr list \
              --head "${HEAD_REF}" \
              --state open \
              --json number \
              --jq 'length')
            if [ "$EXISTING" -gt 0 ]; then
              echo "PR already exists for ${HEAD_REF} — skipping."
              exit 0
            fi
          done
          gh pr create \
            --title "chore(deps): reconcile plugin pins (triggered by ${{ steps.inputs.outputs.package }} ${{ steps.inputs.outputs.version }}) (${{ steps.inputs.outputs.ticket }})" \
            --body "$(cat <<'PREOF'
          ## Summary

          Automated Dockerfile.runtime pin update for `${{ steps.inputs.outputs.package }}` ${{ steps.inputs.outputs.version }}.

          - Updates pin in `docker/Dockerfile.runtime`
          - Triggered by release from `${{ steps.inputs.outputs.source_repo }}`

          ## Test plan

          - [ ] CI passes
          - [ ] Dockerfile.runtime pin reflects correct version
          - [ ] Runtime image builds successfully with new pin

          Evidence-Ticket: ${{ steps.inputs.outputs.ticket }}
          PREOF
          )" \
            --head "${{ steps.branch.outputs.name }}" \
            --base "${{ steps.branch.outputs.base }}"

      - name: Skip summary
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "### Skipped: Dockerfile.runtime already at ${{ steps.inputs.outputs.package }} ${{ steps.inputs.outputs.version }}" >> $GITHUB_STEP_SUMMARY
