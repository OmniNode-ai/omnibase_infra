#
# OMN-20331: the sibling-repo commits every gating omnibase_infra workflow
# reads. A gating check that reads a sibling's live `dev`/`main` tip turns red
# on every open omnibase_infra PR when that sibling merges, and no omnibase_infra
# PR can fix it (the omnimarket-contract-pin.yaml rationale, OMN-17292, applied
# to every sibling).
#
# Each value is the sha written inline as the `ref:` of the sibling checkout, the
# `git clone` checkout, or the `uses: ...@<sha>` in .github/workflows/*.yml.
# tests/ci/test_sibling_reads_pinned_omn20331.py fails when a workflow reads a
# sibling by branch name, by no ref, or at a sha that is not the one below.
#
#   omnibase_core / omnibase_compat  the commits of the uv.lock releases
#                                    (core 0.47.31, compat 0.5.7)
#   omnimarket                       equals .github/omnimarket-contract-pin.yaml
#   the rest                         the `dev` tip when the pin was added
#
# Move a pin only in a PR that also passes the gates reading that sibling at the
# new sha. NON-GATING MONITOR workflows (schedule/dispatch only) read live tips by
# design and are not pinned; they carry the label in their header.
pins:
  omnibase_core: f43f97629182f463d233b564b19a2b27d4fc4888
  omnibase_compat: 65aed95fa710748654e37d5c15c5446e779fdf52
