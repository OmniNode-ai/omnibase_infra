schema_version: "1.0.0"
ticket_id: OMN-22644
title: "The Lab-overlay parity test for the alarm lane's writer restart bound accepts a writer the census declares profile_gated, and still demands the tightest bound from every writer that runs on its own"
summary: "omnibase_infra#5518 folded the savings writer into the dev runtime and the lab manifest declares it profile_gated, so the parity test that read its restart bound raised KeyError on dev and held every pull request. The rule now accepts exactly that declaration and still refuses a missing or looser bound for a writer that runs as a service."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22644-folded-writer-bound
    statement: The alarm lane's crash-looping writer must carry a restart bound tighter than the broker's while it runs as a service, and must be declared profile_gated once the dev runtime runs it, and nothing else passes.
    acceptance:
      - id: AC1
        statement: 'AC1: the parity test against the lab manifest passes at the fix and fails at dev 761e7342c with KeyError for the savings writer, both run on a lab host with the private overlay -- falsifier: uv run pytest tests/ci/test_lab_lane_census_facts_omn20934.py -k tightest_bound -p no:randomly -q --no-cov'
      - id: AC2
        statement: 'AC2: the rule passes a tighter bound and a profile_gated declaration, and fails an equal bound, a looser bound, no bound on a service, a dropped writer and any other kind -- falsifier: uv run pytest tests/ci/test_savings_writer_bound_rule_omn22478.py -q'
evidence_requirements:
  - kind: tests
    description: The rule tests pass at the head, and the parity test passes against the lab manifest on a lab host.
    command: uv run pytest tests/ci/test_savings_writer_bound_rule_omn22478.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22644-rule-tests
    description: The rule tests pass, each refusal named by a manifest built in the test.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_savings_writer_bound_rule_omn22478.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22644-parity-lab
    description: The parity test passes against the lab manifest where the overlay is fetched; it is the Lab-overlay parity tests job on the pull request.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_lab_lane_census_facts_omn20934.py -k tightest_bound -p no:randomly -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
