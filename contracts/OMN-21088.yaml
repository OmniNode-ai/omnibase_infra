schema_version: "1.0.0"
ticket_id: OMN-21088
title: onex delegate --result-only prints the answer and nothing else, or one Error line
summary: A new --result-only flag on onex delegate (mutually exclusive with --json and --human). Success prints result.response exactly on stdout with an empty stderr; any failure, refusals before dispatch included, prints nothing on stdout and exactly one stderr line, Error cause message (receipt path). Every suppressed line goes to runs/run_id/diagnostics.log, and receipt.json, result.txt and run.json are still written. CLI change in cli_delegate.py only; no runtime, contract or topic change.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
evidence_requirements:
  - kind: tests
    description: Success prints the response byte-exact with an empty stderr, each failure class prints exactly one Error line and exits non-zero, and diagnostics.log holds the suppressed lines.
    command: uv run pytest tests/unit/cli/test_delegate_result_only_omn21088.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-result-only-focused-tests
    description: The focused tests prove the success output, the one-line failure for terminal failures, argument-parsing refusals, refusals before dispatch, unhandled errors and timeouts, and the diagnostics log.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_delegate_result_only_omn21088.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-delegate-suite-unchanged
    description: The existing delegate CLI tests still pass, so the default and --json forms are unchanged.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_delegate_output_form_follows_stdout_omn20124.py tests/unit/cli/test_delegate_state_root_omn19232.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
