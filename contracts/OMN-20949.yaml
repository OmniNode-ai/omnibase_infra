schema_version: "1.0.0"
ticket_id: OMN-20949
title: omnibase_infra's Duplication Sweep reads kafka_boundaries.yaml from omnimarket, not onex_change_control
summary: D2 of scripts/ci/run_duplication_sweep.py reads omnimarket/src/omnimarket/nodes/node_duplication_sweep/contracts/kafka_boundaries.yaml, and the Duplication Sweep workflow checks out omnimarket at the sibling pin in place of onex_change_control. The job, its name and its required context are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20949
    statement: The required Duplication Sweep must read the Kafka boundary manifest from omnimarket at the pinned sha and name no onex_change_control path.
    acceptance:
      - id: AC3
        statement: "AC3: omnibase_infra's run_duplication_sweep.py D2 reads the omnimarket path and the Duplication Sweep check run on that PR's head is green. -- falsifier: uv run pytest tests/ci/test_duplication_sweep_manifest_omn20949.py scripts/ci/tests/test_sweep_clis.py -q -p no:randomly"
  - id: req-omn20949-manifest-beside-node
    statement: The Kafka boundary manifest lives in omnimarket beside node_duplication_sweep, at the path the pinned omnimarket ships.
    acceptance:
      - id: AC1
        statement: 'AC1: The manifest lives in omnimarket beside the node -- falsifier: `src/omnimarket/nodes/node_duplication_sweep/kafka_boundaries.yaml` exists on the PR head and is byte-identical to onex_change_control dev''s `src/onex_change_control/boundaries/kafka_boundaries.yaml` at the sha named in the PR body (a test asserts the file parses and carries topic_name/producer_repo entries)'
  - id: req-omn20949-d2-reads-omnimarket
    statement: D2 reads the omnimarket copy and no onex_change_control path.
    acceptance:
      - id: AC2
        statement: 'AC2: D2 reads the omnimarket copy and no onex_change_control path -- falsifier: a test runs \_check_d2_kafka_topics against a workspace with no onex_change_control directory and gets PASS from the bundled manifest, and a planted conflicting producer in a manifest passed explicitly still FAILs (uv run pytest tests/test_golden_chain_duplication_sweep.py)'
evidence_requirements:
  - kind: tests
    description: "D2 passes against the omnimarket manifest with no onex_change_control directory, ignores a conflicting manifest left at the retired path, and the workflow checks out omnimarket at the pin."
    command: "uv run pytest tests/ci/test_duplication_sweep_manifest_omn20949.py scripts/ci/tests/test_sweep_clis.py tests/ci/test_sibling_reads_pinned_omn20331.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
