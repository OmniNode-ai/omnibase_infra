schema_version: 1.0.0
ticket_id: OMN-17101
title: the prod compose lane keeps the Bifrost lane-overlay bind on every runtime service its volume overrides restate
summary: 'docker-compose.prod.yml replaced the volumes list of omninode-runtime, runtime-effects and runtime-worker with !override and dropped the lane-overlay bind the base file mounts, while the entrypoint render still reads BIFROST_LANE_OVERLAY_PATH and fails the container start when the file is missing. The prod recipe now declares x-lane-overlay-mount and lists it in each of the three restated volume lists, so the rendered prod config binds an overlay file at the path the renderer reads.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: The DoD this ticket's author declared, transcribed from the ticket body. The ticket body is the source and this block is the copy.
    acceptance:
      - id: AC1
        statement: 'AC1: docker-compose.prod.yml supplies its own prod-appropriate lane-overlay mount instead of an !override dropping it entirely -- falsifier: uv run pytest tests/unit/docker/test_lane_overlay_dir_resolution.py -q'
      - id: AC2
        statement: 'AC2: a compose-config readback for the prod lane shows a resolvable BIFROST_LANE_OVERLAY_PATH bound by a volume with no !override volume-list collision -- falsifier: uv run pytest tests/integration/infra/test_prod_runtime_compose_render.py -q'
evidence_requirements:
  - kind: tests
    description: The lane-overlay mount recipe suite passes with the prod recipe in the covered set.
    command: uv run pytest tests/unit/docker/test_lane_overlay_dir_resolution.py -q
  - kind: tests
    description: The prod compose render suite passes with the overlay bind on all three restated runtime services.
    command: uv run pytest tests/integration/infra/test_prod_runtime_compose_render.py -q
