schema_version: 1.0.0
ticket_id: OMN-23304
title: Retire the agent-actions-consumer container on dev so the agent actions projection attaches and the dev runtime stops restarting
summary: The still-running omninode-agent-actions-consumer container holds consumer group agent-observability-postgres and fences the runtime's projection_agent_actions (no members, lag 70 to 73), so the runtime health check reads DEGRADED and the dev runtime restarts, and every projection consumer in it lags while it does (projection_savings on the hook-event topic moved from 110 to 1185 in five minutes). The dev runtime policy retires agent-actions-consumer by name, the rendered runtime-policy.env carries it, and the dev-lane stanza starts under no profile a primary-dev bring-up requests. This contract is the child-ticket contract of the same change as contracts/OMN-23043.yaml. No Redpanda restart and no offset reset; the alarm bound is unchanged; containers change only through the deploy agent.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23304-agent-actions-consumer-retired-on-dev
    statement: Primary dev declares no running agent-actions-consumer container, the runtime's projection_agent_actions joins its group, and the dev runtime stays up after a deploy through the deploy agent.
    acceptance:
      - id: AC1
        statement: 'AC1: the dev compose no longer declares the agent-actions-consumer container and the runtime''s projection_agent_actions consumer joins its group -- falsifier: uv run pytest tests/unit/docker/test_dev_agent_actions_fold_omn23043.py -q -k agent_actions_consumer, failing with the service restored'
      - id: AC2
        statement: 'AC2: after a dev deploy through the deploy agent, the dev runtime stays up for an hour and floor row lab:broker_lag reads green -- falsifier: the served floor has no lab:broker_lag cause and the runtime''s restart count is unchanged over the hour'
evidence_requirements:
  - kind: tests
    description: The agent actions fold test with its base-revision control, run against the branch head.
    command: uv run pytest tests/unit/docker/test_dev_agent_actions_fold_omn23043.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23304-compose-no-consumer
    description: The dev stack renders no agent-actions-consumer, and the same test fails when the service is restored (four of the six tests in the file fail on the base revision).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_dev_agent_actions_fold_omn23043.py -q --no-cov --tb=line -k agent_actions_consumer
        cwd: .
  - id: dod-omn23304-deploy-probe
    description: After the deploy agent rolls primary dev with this change, no omninode-agent-actions-consumer container runs on the dev host. The probe fails while the container runs, so it reads the deployed system and not a file this pull request wrote.
    source: manual
    binds_ac:
      - AC2
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" 'test -z "$(docker ps -q --filter name=^omninode-agent-actions-consumer$)"'
        cwd: .
