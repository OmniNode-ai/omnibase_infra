schema_version: "1.0.0"
ticket_id: OMN-20387
title: Fill and verify the pricing manifest's cloud rows, and stop pricing an unknown model as Opus
summary: The pricing manifest carried no claude-haiku-4-5, no claude-sonnet-4-6 and none of the models ChatGPT now serves, and every cloud row read source FALLBACK_PROVIDER_DOCUMENTATION with no citation. This PR adds the missing rows, checks every Anthropic, OpenAI and Gemini row against the provider's published rate read on 2026-10-06, sets source, effective_date and the cited page on each, corrects claude-opus-4-6 to the published $5 / $25, and removes the rows no provider page lists so they resolve unpriced. AC3 and AC4 (the unknown-model Opus fallback) are carried by omniclaude#2566.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20387-infra
    statement: Every Anthropic and OpenAI row of the pricing manifest names a model a current customer uses and carries the provider's published rate with a citation.
    acceptance:
      - id: AC1
        statement: 'AC1: The manifest carries `claude-haiku-4-5`, `claude-sonnet-4-6` and the OpenAI models a current ChatGPT export names -- falsifier: uv run pytest asserts each id resolves a price and one does not'
      - id: AC2
        statement: "AC2: Every Anthropic and OpenAI row's two prices are checked against the provider's published rates at a cited date, with `effective_date` and `source` set accordingly -- falsifier: a row whose price differs from the cited provider page, or a cloud row still reading `source: FALLBACK_PROVIDER_DOCUMENTATION` with no citation"
evidence_requirements:
  - kind: tests
    description: Each required model id, the ChatGPT models included, resolves a price from the manifest.
    command: uv run pytest tests/unit/configs/test_pricing_manifest_verified_omn20387.py -q -k required_models_resolve_a_price
  - kind: tests
    description: Every cloud row's two prices equal the cited provider page's rate, and every cloud row carries the published-pricing source, effective date and citation.
    command: uv run pytest tests/unit/configs/test_pricing_manifest_verified_omn20387.py -q -k cloud_row
  - kind: tests
    description: An unknown id and the rows no provider page lists resolve unpriced.
    command: uv run pytest tests/unit/configs/test_pricing_manifest_verified_omn20387.py -q -k unpriced
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20387-ac1
    description: Each required model id, the ChatGPT models included, resolves a price from the manifest.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/configs/test_pricing_manifest_verified_omn20387.py -q -k required_models_resolve_a_price
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-20387-ac2
    description: Every cloud row's two prices equal the cited provider page's rate, and every cloud row carries the published-pricing source, effective date and citation.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/configs/test_pricing_manifest_verified_omn20387.py -q -k cloud_row
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn-20387-unpriced
    description: An unknown id and the rows no provider page lists resolve unpriced.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/configs/test_pricing_manifest_verified_omn20387.py -q -k unpriced
        cwd: ${OMNI_HOME}/omnibase_infra
