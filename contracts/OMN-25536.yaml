schema_version: "1.0.0"
ticket_id: OMN-25536
title: "The dev branch installer installs a declared overlay destination, so an overlay change from a branch is proven on dev"
summary: "The dev branch installer refused every destination outside /app/, so an overlay change from a branch could not be put on the dev runtime (two lanes were refused with /etc/onex/skill-overlays-store/...). That path is a read-only bind mount the runtime reads, and docker cp cannot write to it. The installer now takes its allowed roots from dev_lane_branch_install_roots.yaml: /app/ and a new overlay root, /etc/onex/skill-overlays-branch/, a directory in the container's writable layer that both dev compose files name first in ONEX_SKILL_OVERLAY_ROOTS. The installer creates the directory before the copy. Any other path outside /app/ is still refused."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25536-declared-overlay-root
    statement: The dev branch installer accepts a destination under a root declared in data, and the runtime reads that root.
    acceptance:
      - id: AC1
        statement: "AC1: the installer accepts an overlay destination under the declared overlay root and still refuses any other path outside /app/, with tests red at the base commit and green at the head -- falsifier: `uv run pytest -q` on the test file the PR names, a destination under the declared root failing at the base commit"
      - id: AC2
        statement: "AC2: the branch is installed on dev with restart false and one overlay file from the branch is read at its destination on the dev host -- falsifier: a read of the destination file on h201 showing the branch's content, absent before the install"
      - id: AC3
        statement: "AC3: the PR body carries a Lab line naming the dev install and its receipt -- falsifier: the guard-create check of landing_text.py refusing a body with no Lab line"
evidence_requirements:
  - kind: tests
    description: The overlay-root tests pass at the pushed head and the accept and apply tests fail at the base commit.
    command: uv run pytest tests/unit/handlers/test_handler_dev_lane_branch_install_overlay_root_omn25536.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25536-ac1
    description: 'AC1: a destination under /etc/onex/skill-overlays-branch/ registers and applies, and the store mount, the frozen mount, /etc/passwd, traversal and look-alike prefixes are refused; at the base commit the accept and apply tests fail.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_dev_lane_branch_install_overlay_root_omn25536.py -q
        cwd: .
  - id: dod-omn25536-ac2
    description: 'hosted proxy for AC2: the apply test reads the installed file back at its destination; the read on h201 after the dev install is posted as a pull request comment naming the head.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_dev_lane_branch_install_overlay_root_omn25536.py -q -k apply
        cwd: .
  - id: dod-omn25536-ac3
    description: 'hosted proxy for AC3: the Lab line is in the pull request body at creation; this check runs the installer tests the Lab line names.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_dev_lane_branch_install_overlay_root_omn25536.py -q
        cwd: .
