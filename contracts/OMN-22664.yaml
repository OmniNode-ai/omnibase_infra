    description: The fold half of T10 in this repository. The fold tests list the delegation writer among the folded writers; at the merge base the committed policy keeps it standalone and the tests fail. The live handover and the delegation_events read are taken on dev after the deploy agent rolls this change.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_dev_tenant_projection_fold_omn21288.py tests/scripts/test_deploy_runtime_folded_services_omn21288.py -q --no-cov --tb=line
        cwd: .
