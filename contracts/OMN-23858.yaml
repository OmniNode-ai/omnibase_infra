schema_version: "1.0.0"
ticket_id: "OMN-23858"
title: "The platform database settings grant the runtime account the four tables of the merge alarm watcher"
summary: "omnibase_infra vendors omnimarket's node_merge_override_alarm_effect migrations and grants omninode_runtime SELECT, INSERT and UPDATE on merge_override_receipts, merge_override_pending, merge_override_verdicts and merge_override_open_findings in every shipped topology profile, ahead of the omnimarket pull request that adds the node. The grants are regenerated by scripts/generate_application_database_table_grants.py and the catalogs by its own render step. Without them the runtime refuses to prepare the node's writer and the omnimarket event chain gate fails at collection."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-merge-override-runtime-grants"
    statement: "Every shipped topology profile grants the runtime role the four merge override tables, the grant derivation reports no drift, and both node migrations are vendored byte-identical."
    acceptance:
      - id: "AC1"
        statement: "AC1: the regenerated platform topology lists the four merge_override tables with select, insert and update for the runtime account in every instance that carries the others -- falsifier: uv run pytest tests/unit/topology/test_application_database_table_grants.py -q in omnibase_infra, red on the base without the grants"
      - id: "AC2"
        statement: "AC2: the grant drift check reports no drift against the watcher's contract tables -- falsifier: uv run python scripts/generate_application_database_table_grants.py --check --prove with --contracts-root naming the watcher's branch, which exits 1 without the change"
      - id: "AC3"
        statement: "AC3: the watcher's four failing checks (event chain gate, product readiness, reason graph, tests with coverage) pass once the omnimarket lock takes the released platform version -- falsifier: uv run pytest tests/chains/test_event_chain_gate_projection_write.py -q in omnimarket, which fails at collection with the lacks-declared-write-privileges error before the release"
      - id: "AC4"
        statement: "AC4: integrated: done only when running and observed where it runs: on the development lane the four tables exist and the runtime account holds the rights, read back from the database's own grant table -- falsifier: the grant read-back rows for the four tables pasted in the pull request, an empty result means not done"
evidence_requirements:
  - kind: "tests"
    description: "The grant tests pass at the head; the drift check fails on the merge base, where no profile grants the four tables."
    command: "uv run pytest tests/unit/topology/test_merge_override_runtime_grants_omn23858.py tests/unit/topology/test_application_database_table_grants.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23858-ac1-topology-grants"
    description: "AC1 hosted probe. Every profile grants the runtime role the four merge override tables and both migrations are vendored."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/topology/test_merge_override_runtime_grants_omn23858.py tests/unit/topology/test_application_database_table_grants.py -q"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn23858-ac2-grant-drift"
    description: "AC2 hosted probe. The vendored migrations are declared and the supplemental table declarations derive the four merge override grants; the new test file is absent at the merge base, so the command fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_merge_override_runtime_grants_omn23858.py -k vendored -q"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn23858-hosted-proxy-ac3-ac4"
    description: "Hosted proxy for AC3 and AC4. The shipped topology grants the runtime role the four tables in every profile the omnimarket gate and the dev lane read; the readings on the omnimarket branch and the dev lane are the unbound local items below, because a hosted runner reaches neither."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_merge_override_runtime_grants_omn23858.py -q"
        cwd: "."
    binds_ac: ["AC3", "AC4"]
  - id: "dod-omn23858-ac3-omnimarket-chain"
    description: "AC3 local Done gate only: the omnimarket event chain gate collects once its lock takes the released platform version. Hosted CI cannot reach the omnimarket branch."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "grep -q '^omnibase_infra_release=' docs/readbacks/OMN-23858_dev_grants.txt"
        cwd: "."
  - id: "dod-omn23858-ac4-dev-lane-grants"
    description: "AC4 local Done gate only: the checked-in readback names the dev-lane host, the revision and the grant rows of the four tables."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "grep -q '^host=' docs/readbacks/OMN-23858_dev_grants.txt"
        cwd: "."
  - id: "dod-omn23858-integration-proof-lab"
    description: "Runs this change's tests at the pushed head on a lab host through the lab work runner; hosted CI cannot reach the lab runner, so only the local Done gate runs this check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23858 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/topology/test_merge_override_runtime_grants_omn23858.py tests/unit/topology/test_application_database_table_grants.py -q --no-cov -n 0 -p no:randomly'
        cwd: "."
