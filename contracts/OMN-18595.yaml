schema_version: "1.0.0"
ticket_id: OMN-18595
title: Scheduled release cut per release-synced Python repo
summary: The release train cuts omnibase_infra releases under this ticket. This in-repo contract is the release evidence release.yml reads for a release cut (OMN-20959), now that no change-control companion is minted after S6. A release cut is content-bound by its changelog; the top CHANGELOG.md section names the version in pyproject.toml at the release head, and does not at its merge base, where pyproject already carries the next version.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18595-release-cut-changelog
    statement: A release cut's head carries a CHANGELOG.md section for the version it releases.
    acceptance:
      - id: AC1
        statement: 'AC1: the first CHANGELOG.md heading names the pyproject.toml version -- falsifier: the check below exits 1 at a release PR''s merge base'
  - id: req-omn18595-cascade-core-pin-followers
    statement: A dependency cascade that moves the exact omnibase-core pin moves every exact-version follower of that pin with it.
    acceptance:
      - id: AC2
        statement: "AC2: at core 0.47.45 the exact-version pin tests, the seam fixture and the runner image identity agree with the pyproject override and uv.lock -- falsifier: the tests below fail at the merge base, whose followers still name 0.47.44"
evidence_requirements:
  - kind: ci
    description: The top changelog heading names the pyproject version.
    command: |-
      python3 -c "import re,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; h=re.search(r'^## v(\S+)', open('CHANGELOG.md').read(), re.M); raise SystemExit(0 if h and h.group(1)==v else 1)"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-18595-release-cut-changelog
    description: The release head's top changelog section names the released version.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          python3 -c "import re,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; h=re.search(r'^## v(\S+)', open('CHANGELOG.md').read(), re.M); raise SystemExit(0 if h and h.group(1)==v else 1)"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-18595-core-0-47-45-pin-followers
    description: The core 0.47.45 cascade (omnibase_infra#5026) moves the exact-version pin tests, the seam fixture and the runner image lock with the override.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_contract_validation_core_validator_omn20074.py tests/ci/test_runner_image_identity.py tests/integration/infra/test_omn_12765_release_backmerge_identity.py tests/unit/runtime/test_seam_released_core_pin.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
