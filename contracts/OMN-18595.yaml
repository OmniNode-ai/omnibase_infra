schema_version: "1.0.0"
ticket_id: OMN-18595
title: Scheduled release cut per release-synced Python repo
summary: The release train cuts omnibase_infra releases under this ticket. This in-repo contract is the release evidence release.yml reads for a release cut (OMN-20959), now that no change-control companion is minted after S6. A release cut is content-bound by its changelog; the top CHANGELOG.md section names the version in pyproject.toml at the release head, and does not at its merge base, where pyproject already carries the next version.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18595-release-cut-changelog
    statement: A release cut's head carries a CHANGELOG.md section for the version it releases; a head that does not change CHANGELOG.md against origin/dev is not a release cut (the dependency cascade carries OMN-18595 into bump PRs that cut nothing).
    acceptance:
      - id: AC1
        statement: 'AC1: when the head changes CHANGELOG.md against its merge base with origin/dev, or that merge base cannot be read, the first CHANGELOG.md heading names the pyproject.toml version -- falsifier: the check below exits 1 at a release PR''s merge base outside a git checkout, and at a head whose added changelog section names another version'
  - id: req-omn18595-cascade-core-pin-followers
    statement: A dependency cascade that moves the exact omnibase-core pin moves every exact-version follower of that pin with it.
    acceptance:
      - id: AC2
        statement: "AC2: at core 0.47.46, the floor omnimarket v0.4.316 declares, the exact-version pin tests, the seam fixture and the runner image identity agree with the pyproject override and uv.lock, and the installed core carries omnibase_core.enums.enum_binding_kind that omnimarket v0.4.316 handlers import -- falsifier: the tests below fail at the merge base, whose followers still name 0.47.44, and the import fails at core 0.47.45"
  - id: req-omn18595-cascade-core-0-47-48-runner-lock
    statement: The core 0.47.48 cascade (omnibase_infra#5110) regenerates the runner image lock so its recorded identity binds the new uv.lock.
    acceptance:
      - id: AC3
        statement: "AC3: the cascade resolves core at least 0.47.48, the installed version matches uv.lock and passes runtime version admission, and the runner image lock identity_digest and shared_env_digest equal the values recomputed from pyproject.toml and uv.lock -- falsifier: tests/unit/runtime/test_core_release_cascade_omn18595.py fails at the merge base, which resolves 0.47.46; tests/ci/test_runner_image_identity.py fails when the runner lock digests do not match the dependency manifests"
  - id: req-omn18595-cascade-core-0-47-50-followers
    statement: The core 0.47.50 cascade (omnibase_infra#5194) moves the infra runtime profile mirror, the dispatch parity oracle and the runner image lock with the new core, which registers the projection-writer-run-trace profile and a shared-token-policy dispatcher.
    acceptance:
      - id: AC4
        statement: "AC4: the cascade resolves core at least 0.47.50, infra's runtime profiles equal core's registry including projection-writer-run-trace and every one boots, the live dispatch snapshot equals the committed oracle and recorded readback, and the runner image lock digests equal the values recomputed from pyproject.toml and uv.lock -- falsifier: tests/unit/runtime/test_core_release_cascade_omn18595.py fails at the merge base, which resolves 0.47.48; the profile and dispatch parity tests fail when core 0.47.50 is installed without these changes"
  - id: req-omn18595-release-pr-refresh-superseded-candidate
    statement: The release train judges an open release PR by the candidate it was cut from, so a PR whose candidate is superseded is rebuilt rather than left open forever.
    acceptance:
      - id: AC5
        statement: "AC5: a run whose decision candidate differs from the candidate recorded in the open release PR's body rebuilds the release branch from the new candidate, force-pushes it with lease and rewrites the PR body to name the new candidate, and the unit test fails on the current workflow logic -- falsifier: uv run pytest tests/scripts -k release_pr_refresh_superseded_candidate"
      - id: AC6
        statement: "AC6: a run whose decision candidate equals the open release PR's recorded candidate pushes nothing and edits nothing -- falsifier: uv run pytest tests/scripts -k release_pr_same_candidate_noop"
      - id: AC7
        statement: "AC7: a run that finds the release branch on the remote with no open PR rebuilds it with a lease push and opens the PR, instead of failing a plain push -- falsifier: uv run pytest tests/scripts -k release_pr_orphan_branch_rebuilt"
      - id: AC8
        statement: "AC8: an open release PR whose body carries no readable candidate line is refused with a named reason and is never force-pushed -- falsifier: uv run pytest tests/scripts -k release_pr_unreadable_candidate_refuses"
evidence_requirements:
  - kind: ci
    description: At a head that changes CHANGELOG.md, the top changelog heading names the pyproject version.
    command: |-
      uv run --frozen python -c "import subprocess,tomllib; from omnibase_infra.models.model_release_cut_changelog import ModelReleaseCutChangelog as M; mb=subprocess.run(['git','merge-base','HEAD','origin/dev'],capture_output=True,text=True); cut=mb.returncode!=0 or subprocess.run(['git','diff','--quiet',mb.stdout.strip(),'HEAD','--','CHANGELOG.md']).returncode!=0; d=M(pyproject_version=tomllib.load(open('pyproject.toml','rb'))['project']['version'], changelog_text=open('CHANGELOG.md').read(), is_release_cut=cut); print(*d.violations); raise SystemExit(d.exit_code)"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-18595-release-cut-changelog
    description: A release head (one that changes CHANGELOG.md against origin/dev) has a top changelog section naming the released version; other heads citing OMN-18595, such as dependency cascades, pass.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          uv run --frozen python -c "import subprocess,tomllib; from omnibase_infra.models.model_release_cut_changelog import ModelReleaseCutChangelog as M; mb=subprocess.run(['git','merge-base','HEAD','origin/dev'],capture_output=True,text=True); cut=mb.returncode!=0 or subprocess.run(['git','diff','--quiet',mb.stdout.strip(),'HEAD','--','CHANGELOG.md']).returncode!=0; d=M(pyproject_version=tomllib.load(open('pyproject.toml','rb'))['project']['version'], changelog_text=open('CHANGELOG.md').read(), is_release_cut=cut); print(*d.violations); raise SystemExit(d.exit_code)"
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/test_model_release_cut_changelog_omn18595.py -q -p no:randomly -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-18595-core-0-47-45-pin-followers
    description: The core 0.47.46 cascade (omnibase_infra#5026) moves the exact-version pin tests, the seam fixture and the runner image lock with the override.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_contract_validation_core_validator_omn20074.py tests/ci/test_runner_image_identity.py tests/integration/infra/test_omn_12765_release_backmerge_identity.py tests/unit/runtime/test_seam_released_core_pin.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: uv run --frozen python -c "import omnibase_core.enums.enum_binding_kind"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn-18595-core-0-47-48-runner-lock
    description: The core 0.47.48 cascade (omnibase_infra#5110) regenerates docker/runners/runner-image.lock.json so the runner image identity matches the bumped uv.lock.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_core_release_cascade_omn18595.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_runner_image_identity.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: uv run --frozen python scripts/ci/runner_image_identity.py --mode verify
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-18595-core-0-47-50-followers
    description: The core 0.47.50 cascade (omnibase_infra#5194) adds projection-writer-run-trace to the infra runtime profiles, recaptures the dispatch parity oracle and readback, and regenerates docker/runners/runner-image.lock.json.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_core_release_cascade_omn18595.py tests/unit/runtime/test_runtime_profile.py tests/unit/runtime/test_runtime_profile_fail_closed.py tests/integration/runtime/test_core_consumer_profiles_boot_omn18595.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/runtime/test_dispatch_selection_parity.py tests/ci/test_dispatch_parity_live_contact_omn20074.py tests/unit/runtime/test_dispatch_parity_dependency_closure_omn20074.py tests/ci/test_runner_image_identity.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: uv run --frozen python scripts/ci/runner_image_identity.py --mode verify
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC4
  - id: dod-deploy
    description: Deploy-scope readback, bound to no criterion; the runtime profile module at the evaluated checkout revision registers projection-writer-run-trace, and the merge base lacks it.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/runtime_profile.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F '"projection-writer-run-trace": ModelRuntimeProfile('
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn-18595-release-pr-refresh
    description: The release train rebuilds an open release PR whose candidate is superseded, leaves one for the same candidate alone, rebuilds an orphan branch with a lease push, and refuses a PR whose candidate cannot be read.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/scripts -k "release_pr_refresh_superseded_candidate or release_pr_same_candidate_noop or release_pr_orphan_branch_rebuilt or release_pr_unreadable_candidate_refuses" -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
      - AC6
      - AC7
      - AC8
  - id: dod-omn-18595-core-0-47-53-runner-lock
    description: The core 0.47.53 cascade (omnibase_infra#5282) pins omnibase-core 0.47.53, relocks with only that package moving, and regenerates docker/runners/runner-image.lock.json so the runner image identity matches the bumped uv.lock.
    source: manual
    checks:
      - check_type: command
        check_value: uv run --frozen python -c "import importlib.metadata as m; assert m.version('omnibase-core') == '0.47.53', m.version('omnibase-core')"
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_runner_image_identity.py tests/unit/runtime/test_core_release_cascade_omn18595.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: uv run --frozen python scripts/ci/runner_image_identity.py --mode verify
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
