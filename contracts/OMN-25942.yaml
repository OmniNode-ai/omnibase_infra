schema_version: 1.0.0
ticket_id: OMN-25942
title: A dev deploy job that passes post-deploy verification keeps the new dev image when the deploy-source clone moves after up
summary: The dev boot guard no longer rolls back a verified dev roll because the deploy-source clone moved after up; it keeps the previous recovery point and writes the drift beside the incidents. The stability compose lines are carried by omnibase_infra#6023 and are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25942-dev-verify
    statement: A dev roll that was replaced, verified and Docker healthy stays running when the post-roll capture finds the compose files other than up read.
    acceptance:
      - id: AC1
        statement: 'AC-V1: the failed dev job 20cf29c6 is traced to its cause from the recorded job record, container readings and log lines, and the fixture that holds them is replayed -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_dev_boot_guard_compose_settings_match_omn25942.py -q -k "recorded or does_not_roll_back" exits non-zero on dev'
      - id: AC2
        statement: 'AC-V2: the dev boot guard keeps a verified, healthy roll when the compose config hash no longer matches, and the regression built from the recorded job 20cf29c6 readings fails on omnibase_infra dev and passes on the fix -- falsifier: uv run pytest scripts/deploy-agent/tests/unit -q -k compose_settings_match exits 0 on omnibase_infra dev or non-zero on the fix branch'
  - id: req-omn25942-post-roll-ledger-proof
    statement: A dev runtime recreate is verified only when one work-ledger query from the agent's lab host answers inside the bound the repository declares; otherwise the roll reports failed and the dev boot guard restores the previous image.
    acceptance:
      - id: AC3
        statement: 'AC3: the dev boot guard of the deploy agent runs the post_roll_proof command of work_ledger_query_client.contract.yaml under its declared bound after every dev runtime recreate, fails the roll when it does not answer, and types neither value -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_post_roll_ledger_proof_omn25942.py -q fails at the merge base, where the dev boot guard runs no ledger read'
  - id: req-omn25942-verification-probe
    statement: Post-deploy verification of one lane probes only that lane's own services and waits for a recreated runtime to answer before it reads a failure.
    acceptance:
      - id: AC4
        statement: 'AC4: the three stability lane jobs recorded on 2026-11-19 (1f7f39c6, 6ff2c3f5, 914b6b79) replay from their fixture; verification of one lane probes only that lane''s own ports and postgres and waits out a runtime that resets the connection while it starts -- falsifier: uv run pytest scripts/deploy-agent/tests/unit -q -k verification_probe exits non-zero on the fix branch'
  - id: req-omn25942-untagged-head-idle-build
    statement: The deploy agent's idle restore and idle converge build the omnibase_infra dev head only once a dev-merge tag on origin names it, so the dev-lane first-party audit accepts the staged tree.
    acceptance:
      - id: AC5
        statement: 'AC5: job 7dfb1bc9 (agent/idle-restore, 2026-11-24T02:46:16Z, head 5cafc841f7de, tag cut by run 45314704581 at 02:48:12Z) replays from its fixture; the idle restore and idle converge start no job for a head no dev tag names, write one build-decision ledger row per head (reason=untagged_head), start the job on the first check after the tag exists, and leave signed requests and the audit untouched -- falsifier: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_untagged_head_idle_build_omn25942.py -q exits non-zero on the fix branch, or exits zero at the merge base'
  - id: req-omn25942-overdue-names-newest-unbuilt
    statement: The overdue dev merge build names the newest runtime merge the running build lacks once the merge it would name is contained in that build, and the build repository's newer dev head is routed to the dev build by an instance that declares a lag bound instead of refused not_routed_elsewhere.
    acceptance:
      - id: AC6
        statement: 'AC6: the rows recorded at 2026-11-26T23:10Z (fixture tests/fixtures/overdue_build_oldest_contained_omn25942/build_decision_rows.json: 9f77818e contained in the 22:01Z build, heads 48ccf8bc, b04b1de3, 02a88529, 2a442a5b, 06ca1e58 refused not_routed_elsewhere) replay; the publisher requests the newest unbuilt runtime merge in place of the contained one and the idle converge of the build repository converges on a newer head inside its bound -- falsifier: uv run --frozen pytest tests/unit/handlers/test_overdue_names_newest_unbuilt_merge_omn25942.py scripts/deploy-agent/tests/unit/test_own_repo_lag_bound_omn26316.py -q exits non-zero on the fix branch, or exits zero at the merge base'
evidence_requirements:
  - kind: tests
    description: Dev boot guard settings-drift tests.
    command: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_dev_boot_guard_compose_settings_match_omn25942.py scripts/deploy-agent/tests/unit/test_dev_boot_guard_omn21279.py scripts/deploy-agent/tests/unit/test_post_roll_ledger_proof_omn25942.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25942-ac1-recorded-jobs
    description: The recorded dev job 20cf29c6 replays from its fixture, and the replayed verified roll is kept; the selection fails on omnibase_infra dev, where the guard still restores it.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_dev_boot_guard_compose_settings_match_omn25942.py -q --no-cov -n 0 -p no:randomly -k "recorded or does_not_roll_back"
        cwd: .
  - id: dod-omn25942-ac2-compose-settings-match
    description: A verified, healthy dev roll is kept and no incident or restore is written when the rendered compose hash differs from the container's; a failed roll is still restored.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit -q --no-cov -n 0 -p no:randomly -k compose_settings_match
        cwd: .
  - id: dod-omn25942-ac3-h201-job-record
    description: 'Unbound local Done gate for the AC2 install proof (not a hosted criterion): reads a dev job record on h201 and exits 0 only when its phase verification reads success and its status reads success.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "python3 -c 'import glob, json, sys; hits = glob.glob(\"/data/omninode/deploy-agent/state/jobs-dev/\" + sys.argv[1] + \"*.json\"); rec = json.load(open(hits[0])) if len(hits) == 1 else {}; sys.exit(0 if rec.get(\"phase_results\", {}).get(\"verification\") == \"success\" and rec.get(\"status\") == \"success\" else 1)' DEV_JOB_ID_PREFIX"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25942-integration-proof
    description: 'The real dev boot guard, driven through a real docker executable on PATH, keeps a verified roll when the rendered compose hash moved after up: no restore, no incident, the drift recorded.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/test_dev_boot_guard_compose_settings_drift_omn25942.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn25942-deploy
    description: Hosted-runner probe that reads the committed boot guard handler from GitHub at the checked-out commit and requires the settings-drift error and the advance helper that keeps a verified roll.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_dev_boot_guard.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; src = sys.stdin.read(); assert "class DevBootSettingsDriftError" in src; assert "def _advance_point" in src'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25942-acf2-post-roll-ledger-proof
    description: The dev boot guard's post-roll ledger proof fails a dev roll whose ledger read does not answer inside the declared bound, passes one that does, runs the declared command, and is not asked for during recovery.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_post_roll_ledger_proof_omn25942.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn25942-acf2-deploy
    description: Hosted-runner probe that reads the committed dev boot guard handler from GitHub at the checked-out commit and requires the post-roll ledger proof and the declaration it reads.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_dev_boot_guard.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; src = sys.stdin.read(); assert "def _prove_work_ledger_answers" in src; assert "post_roll_proof" in src'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25942-ac4-verification-probe
    description: The recorded stability jobs replay from their fixture; verification reads only its own lane's ports and postgres, waits for a runtime that resets the connection while it starts, and still fails a runtime that never answers inside its declared start.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit -q --no-cov -n 0 -p no:randomly -k verification_probe
        cwd: .
  - id: dod-omn25942-ac5-untagged-head-idle-build
    description: The recorded job 7dfb1bc9 replays; an idle restore and an idle converge wait for the dev head's tag, write one row per head, build on the first check after the tag exists, and a signed request still runs.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_untagged_head_idle_build_omn25942.py -q --no-header -p no:cacheprovider
        cwd: .
  - id: dod-omn25942-ac5-deploy
    description: Hosted-runner probe that reads the committed untagged-head gate from GitHub at the checked-out commit and requires the rule, its ledger reason and the agent wiring.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_deploy_job_reading_effect/runtime_untagged_head_gate.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; src = sys.stdin.read(); assert "class UntaggedHeadGate" in src; assert "_idle_read_dev_tags" in src'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25942-ac6-overdue-names-newest-unbuilt
    description: The recorded rows replay; the overdue build names the newest unbuilt runtime merge when the oldest is contained in the running build, and the build repository's newer head converges inside the declared lag bound.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_overdue_names_newest_unbuilt_merge_omn25942.py tests/integration/handlers/test_overdue_names_newest_unbuilt_merge_omn25942.py -q --no-header -p no:cacheprovider --no-cov -n 0
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_own_repo_lag_bound_omn26316.py -q --no-header -p no:cacheprovider --no-cov -n 0
        cwd: .
  - id: dod-omn25942-ac6-deploy
    description: Hosted-runner probe that reads the committed publisher and idle converge at the checked-out commit and requires the newest-unbuilt selection and the lag-bound routing.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_deploy_job_reading_effect/runtime_deploy_job_reading.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; src = sys.stdin.read(); assert "def _newest_unbuilt_decision" in src'
        cwd: ${OMNI_HOME}/omnibase_infra
