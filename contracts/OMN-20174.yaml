schema_version: "1.0.0"
ticket_id: OMN-20174
title: The lockfile pins msgpack and dnspython at releases that carry the reported advisory fixes
summary: The lockfile resolved msgpack 1.2.1 and dnspython 2.8.0, reported under GHSA-j586-36cw-2gc2 and GHSA-45c3-73f7-pv4m. This change bumps them to 1.2.4 and 2.9.0 and regenerates the runner image lock. Bound regression tests read every resolved entry for each package and fail below the fixed version. A separate test verifies the runner image identity against the updated lockfile. These tests do not run the CVE scanner or claim a deployed image was rebuilt.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20174-msgpack-fixed
    statement: The lockfile resolves msgpack at 1.2.3 or later and dnspython at 2.9.0 or later, the fixed versions reported for the two advisories.
    acceptance:
      - id: AC1
        statement: 'AC1: uv.lock resolves msgpack at 1.2.3 or later -- falsifier: a msgpack entry in uv.lock below 1.2.3, as at the merge base where it is 1.2.1'
      - id: AC2
        statement: 'AC2: uv.lock resolves dnspython at 2.9.0 or later -- falsifier: a dnspython entry in uv.lock below 2.9.0, as at the merge base where it is 2.8.0'
evidence_requirements:
  - kind: tests
    description: Both advisory version floors and the regenerated runner image identity are checked without a container daemon or private lane access.
    command: uv run pytest tests/unit/test_lockfile_cve_pins_omn20174.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20174-ac1-msgpack-pin
    description: The msgpack entry in uv.lock is at 1.2.3 or later. Fails at the merge base, where the entry is 1.2.1, and passes at the head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/test_lockfile_cve_pins_omn20174.py -q -k msgpack
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn20174-ac2-dnspython-pin
    description: Every dnspython entry in uv.lock is at 2.9.0 or later. Fails at the merge base, where the entry is 2.8.0, and passes at the head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/test_lockfile_cve_pins_omn20174.py -q -k dnspython
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
