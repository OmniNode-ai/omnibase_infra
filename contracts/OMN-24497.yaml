schema_version: 1.0.0
ticket_id: OMN-24497
title: A node with no work waiting costs nothing at runtime start
summary: >-
  On 2026-11-14 the dev runtime wired 932 contracts in 22.96 s at boot (image b1204d9af94b) for 158 attached. A contract none of whose subscribe topics is in use is now left out of the manifest that is wired: its handler modules are not imported and no dispatcher is registered until the first record reaches one of its topics, which wires it on the frozen dispatch engine and joins its groups from earliest so that record is handled once.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-deferred-handler-wiring
    statement: A demand-deferred contract costs nothing at boot and is wired by its first request.
    acceptance:
      - id: AC1
        statement: "AC1: a boot that defers N nodes imports, builds and registers none of their handlers -- falsifier: the new unit test fails on the merge base, where the handler recorder names a deferred module"
      - id: AC2
        statement: "AC2: the first record on a deferred node's topic wires its handlers once and its group reads that record once from the earliest offset, on the in-memory fake and on a real broker -- falsifier: a second wiring, no join, a join from latest, or a handler not called exactly once in the real-broker test"
      - id: AC3
        statement: "AC3: a first-request wiring that fails or raises attaches nothing and does not stop the runtime, and an unmeasurable broker defers nothing -- falsifier: an exception escaping the start, a join after a failed wiring, or a deferred contract when every topic is unreadable"
      - id: AC4
        statement: "AC4: on a lab boot of the branch the wiring phase is shorter than the 22.96 s measured on the dev runtime -- falsifier: wiring seconds not below 22.96 s for the same image"
      - id: AC5
        statement: "AC5: integrated: after the dev runtime runs the merged revision its Auto-wiring complete line shows fewer wired contracts, /health/detailed shows required_contracts equal to attached_contracts, and one message sent to a deferred node is handled once -- falsifier: wired not lower, required not equal to attached, or the message handled zero or two times when read in the running runtime"
evidence_requirements:
  - kind: tests
    description: The deferral unit tests, the node tests and the real-broker test.
    command: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn21318_deferred_handler_wiring.py tests/unit/nodes/node_boot_wiring_deferral_compute -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-ac1-zero-handlers-at-boot
    description: >-
      Twenty idle contracts defer and only the in-use contract's handler is imported; the test fails when the planner defers nothing (named break: the selection returns no deferred contract).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn21318_deferred_handler_wiring.py -q -p no:cacheprovider -k "zero_handlers"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-ac2-first-record-handled-once
    description: >-
      Fake bus: one wiring, one join from earliest. Real Redpanda: the deferred handler is called once for the first record; with the join from latest it is never called.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn21318_deferred_handler_wiring.py -q -p no:cacheprovider -k "golden or replayed"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-ac3-error-chain
    description: >-
      A FAILED row, a raising wiring step and an unmeasurable broker each attach nothing, escape nothing and defer nothing.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn21318_deferred_handler_wiring.py -q -p no:cacheprovider -k "error_chain or unmeasurable"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-ac4-wiring-phase-falls
    description: >-
      Measured on the dev image: wire_from_manifest over all 1,422 contracts 9.97 s and 9.87 s, with 796 left out 1.47 s and 1.44 s (no container, not a dev boot). Live probe, red before the roll and after it only when the runtime logs the boot split: the running dev runtime logs one Boot wiring split line.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" "docker logs omninode-runtime 2>&1 | grep -c 'Boot wiring split'"
        cwd: .
  - id: dod-ac5-integrated
    description: >-
      After the deploy agent rolls dev from this change, the running omninode-runtime container imports the deferral module and its health port answers; the Auto-wiring complete line and one message to a deferred node are read after the roll. Red before the roll, when the container holds no such module.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC5
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" "docker exec omninode-runtime python -c 'import omnibase_infra.handlers.boot_wiring_deferral' && curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8085/health | grep -x 200"
        cwd: .
