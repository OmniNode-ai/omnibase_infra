schema_version: 1.0.0
ticket_id: OMN-24617
title: The h201 deploy agent publishes each job's terminal outcome as a ledger reading row, and a failed job reads NOT_WORKING with its failing step
summary: >-
  A failed deploy-agent job left no reading anyone acted on: the stability follow job on the lab dev host failed from 09:58Z on 2026-11-15 and no ledger row named it for about four hours. The agent now builds one STATUS reading row (src=reading, verdict, reason, deploy lane, job id, kind, failing step, time) for each terminal dev or stability job through the new node_deploy_job_reading_effect node and its handler and appends it through the append command the reading writer already uses (ONEX_LEDGER_BUS_APPEND_COMMAND). No topic is declared. A failed job reads NOT_WORKING with job-failed:<step>; a successful job reads WORKING with no failing step; prod writes nothing.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24617-job-reading
    statement: Each terminal dev or stability deploy job yields one ledger reading row through the existing reading writer route, and a failed job reads NOT_WORKING with its failing step.
    acceptance:
      - id: AC1
        statement: "AC1: a fixture failed job on the dev lane and one on the stability lane each yield one reading row carrying lane, job id, kind, failing step and time, with verdict NOT_WORKING and the failing step in its reason -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_job_reading_row.py -q fails on the code before the change and passes after it"
      - id: AC2
        statement: "AC2: a fixture successful job yields a WORKING row that names no failing step -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_job_reading_row.py -q (the success case fails on the code before the change)"
      - id: AC3
        statement: "AC3: the row is written through the existing reading writer path and declares no new topic -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_job_reading_row.py -q (a test that compares the row's topic with the topic the reading writer already declares)"
      - id: AC4
        statement: "AC4: the branch is installed on h201 through runtime_code_ref_pin for the dev and stability lanes only, and the reading row of the next real job after the install is read back from the ledger -- falsifier: onex ledger query for the job id of the first job after the install returns no row"
evidence_requirements:
  - kind: tests
    description: The job reading row tests.
    command: uv run --frozen --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_job_reading_row.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24617-ac1-failed-job-row
    description: >-
      A fixture failed job on the dev lane and one on the stability lane each yield one STATUS reading row with verdict NOT_WORKING, reason job-failed:<step>, the failing step, the deploy lane, the job id, the kind and the completion time. On origin/dev the module does not exist, so the test file fails at import there.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_job_reading_row.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24617-ac2-success-row
    description: >-
      A fixture successful job yields a WORKING row with reason job-success and no failing_step cell, and a prod job, a superseded job and a job still running yield none.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_job_reading_row.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24617-ac3-no-new-topic
    description: >-
      The row is appended through the reading writer's append command (the argv and the req cell are asserted against a stand-in command), the handler and its contract hold no topic string, and the agent's topic constants are unchanged and disjoint from the topics the reading writer declares.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_job_reading_row.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24617-ac4-installed-and-read
    description: >-
      Deploy check the hosted runner can run: the agent's terminal publish calls the reading. The runtime read (the branch installed on h201 through runtime_code_ref_pin for the dev and stability lanes, and the reading row of the next real job read back from the ledger with its read time) is posted as a pull request comment naming the head and the revision running; it is not claimed by this check.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: "docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c \"from omnibase_infra.handlers.handler_deploy_job_reading import HandlerDeployJobReading; print('deploy smoke ok', HandlerDeployJobReading.__name__)\""
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: grep -q 'handler_deploy_job_reading' scripts/deploy-agent/deploy_agent/agent.py
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24617-integration-proof
    description: >-
      The handler runs against a real stand-in append executable: a failed dev job's NOT_WORKING row, request id and job id reach the command's argv and stdin, and a prod job writes nothing.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/handlers/test_handler_deploy_job_reading_omn24617.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
