schema_version: 1.0.0
ticket_id: OMN-24854
title: The dev runtime container mounts the folder that holds the lane declaration, so the commitment ledger source resolves on the dev lane
summary: >-
  The dev runtime on the lab host runs omnimarket PR 5347 but every commitment check run ends failed with DelegateLaneSelectionError and the work-state projection reads item_count 0, because config/lab/ci_bus_lanes.yaml is absent in the container. The dev lane compose files mount ${ONEX_LANE_OVERLAY_DIR}/.. at the container's config/lab folder, and the deploy agent rewrites ONEX_LANE_OVERLAY_DIR to its rendered overlay copy under its own state directory, so the parent that is mounted is the agent's job state directory, which holds no lane declaration. This change makes the dev render the agent already applies (render_dev_lane) and the warm refresh export ONEX_LANE_DECLARATION_DIR, computed from the real lane overlay directory before the rewrite, and makes both dev compose files mount ${ONEX_LANE_DECLARATION_DIR:?...}. The change does not run on the lab by itself: the dev runtime reads the lane declaration only after the deploy agent redeploys the dev lane from a revision that carries it, and that redeploy is the step that is not yet done at this head.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24854-ledger-source-mount
    statement: The dev runtime container mounts the real config/lab folder, so the five commitment and work-state nodes can read the ledger and run handled on the dev runtime.
    acceptance:
      - id: AC4
        statement: "AC4: both dev compose files mount ${ONEX_LANE_DECLARATION_DIR} (the folder that holds ci_bus_lanes.yaml) at the runtime container's config/lab, the deploy agent, the warm refresh and the compose file helpers set it, and a folder without ci_bus_lanes.yaml is refused -- falsifier: uv run pytest tests/ci/test_dev_lane_ledger_source_binding.py scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py -q fails when either compose mount reads the overlay directory's parent again or a folder without the declaration file is accepted"
evidence_requirements:
  - kind: tests
    description: The deploy agent and the warm refresh export the declaration folder from the real lane overlay directory, the compose file helpers resolve it for every other caller, and both dev compose files mount it. The agent test file runs in the deploy-agent-tests job; the compose render file runs in the full suite.
    command: uv run --frozen pytest tests/ci/test_dev_lane_ledger_source_binding.py scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24854-ac4-mount-source
    description: >-
      The mount half of the ticket's AC1: the compose render of the dev lane stack and of the folded main service takes the ledger mount source from ONEX_LANE_DECLARATION_DIR and not from the rendered overlay directory, a render with only ONEX_LANE_OVERLAY_DIR set is refused by name, and the deploy agent's compose environment, the warm refresh and the compose file helpers keep that variable on a folder that holds ci_bus_lanes.yaml. This contract binds no check to the ticket's AC1, AC2 or AC3: those are lab observations (the run line naming all five nodes on the h201 dev runtime, the STATUS row, the integration pass line) that exist only after the deploy agent redeploys dev from a revision that carries this change, which is not done at this head, and a check that passes whatever the lab shows is the defect this contract removes. They stay open on the ticket until the h201 run line, the STATUS row and the SEEN RUNNING line are recorded.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_dev_lane_ledger_source_binding.py scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: grep -qE '^\s+- \$\{ONEX_LANE_DECLARATION_DIR:\?[^}]*\}:/etc/onex/workspace-config/config/lab:ro$' docker/docker-compose.dev-lane.yml
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: grep -qE '^\s+- \$\{ONEX_LANE_DECLARATION_DIR:\?[^}]*\}:/etc/onex/workspace-config/config/lab:ro$' docker/docker-compose.dev-tenant-fold.yml
        cwd: ${OMNI_HOME}/omnibase_infra
