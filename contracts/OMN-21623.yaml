schema_version: "1.0.0"
ticket_id: OMN-21623
title: omnibase_infra builds handlers at a binding site or not at all, declares model names in node contracts and injects them into the LLM adapters, reads third-party URLs, bind addresses, local stack endpoints and the runtime health port from declared settings files, and reads sixteen outbound-call timeouts from a declared file (contracts_and_di burn-down)
summary: >-
  Five slices of the contracts_and_di burn-down (omnibase_core#2175) for omnibase_infra. The handler_hand_construction slice deletes 24 node registry factories that nothing called and moves the six handlers that composed a HandlerDb by hand onto a binding site in each of their five nodes, nodes/<node>/container/container_handler_db.py (133 findings to 103). The literal_model_name slice moves the savings estimation and waste detection model policy into their node contracts and makes the LLM adapters and the decision search client take the model from their caller. The contracts_and_di check reported 42 literal_url findings in src/omnibase_infra. This change declares the GitHub, Linear, Slack, Gmail, Claude Code schema and loopback-probe endpoints in models/third_party_endpoints/third_party_endpoints.yaml, loads them through ModelThirdPartyEndpoints (no field defaults, so an omitted value fails to load), and reads them in 11 modules. The check reports no literal_url finding over those modules, which held 16. The contracts_and_di check reported 37 literal_host, literal_ip and literal_port findings in src/omnibase_infra (literal_ip 18, literal_host 10, literal_port 9), among 1228 in src. This change declares the loopback and bind-all addresses, the local host, the PostgreSQL port and the TCP port bounds in models/network_binding/network_binding_settings.yaml, loads them through ModelNetworkBindingSettings (no field defaults, so an omitted value fails to load), and reads them where 17 source files held the literals; nine service configs take their health_check_host field from one of two small mixin models instead of declaring it each. Every fallback keeps its previous value. The check reports 19 fewer findings (1228 to 1209). The 18 findings left in the three rules sit in files whose canonical-file-shape baseline forbids growth or that another change holds. The literal_timeout slice declares 16 outbound-call timeouts of the code-analysis, code-review, documentation and test-boilerplate LLM adapters, the Linear project-tracker and ticket adapters, and the bus audit in models/outbound_timeouts/outbound_timeouts.yaml, loads them through ModelOutboundTimeouts (no field defaults, so an omitted value fails to load; a per-request LLM wait above its transport ceiling fails to load), and binds each call site to the loaded value.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-handler-construction
    statement: No node registry factory that nothing calls remains in the 24 node packages, and the handlers that composed a HandlerDb obtain it from the binding site.
    acceptance:
      - id: AC41
        statement: 'AC41: the 24 node packages hold no registry directory and their package exports name no registry class -- falsifier: a registry directory that is still present in one of the 24 node packages'
      - id: AC42
        statement: 'AC42: the contracts_and_di check reports no handler_hand_construction finding in the six handlers that composed a HandlerDb, reports a planted construction as the positive control, and the binding site builds a HandlerDb -- falsifier: a finding from one of the six handlers, or none from the planted module'
  - id: req-omn21623-model-name-infra
    statement: >-
      The savings estimation node, the waste detection analyzer, the LLM adapters and the decision search client hold no model name in code.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the savings counterfactual rules and fallback model and the waste premium-model markers load from their node contracts, and a contract missing any of them fails to load -- falsifier: uv run pytest tests/unit/nodes/node_savings_estimation_compute tests/unit/nodes/node_waste_detection_compute -q in omnibase_infra, where the contract tests drop each field and expect a validation error
      - id: AC2
        statement: >-
          AC2: the LLM adapters and the decision search client take the model from the caller and refuse construction or use without it -- falsifier: uv run pytest tests/unit/adapters/llm tests/unit/services/session_registry/test_decision_search.py -q in omnibase_infra, where each adapter raises TypeError when built without a model and the search client raises ValueError when asked to embed with none
      - id: AC3
        statement: >-
          AC3: the contracts_and_di check reports no literal_model_name finding in those paths -- falsifier: the runtime_validator_run of ValidatorContractsAndDi over src/omnibase_infra/adapters/llm, src/omnibase_infra/nodes/node_savings_estimation_compute, src/omnibase_infra/nodes/node_waste_detection_compute and src/omnibase_infra/services/session_registry/decision_search.py, filtered for literal_model_name reports no literal_model_name finding where it reported twenty-three before (findings of other rules in those paths are out of this slice)
  - id: req-omn21623-slice-outbound-timeouts
    statement: The LLM, Linear and ticket adapters and the bus audit take sixteen outbound-call timeouts from the declared timeouts file, and a block that omits a value fails to load.
    acceptance:
      - id: AC9
        statement: 'AC9: each edited outbound-call site carries the value declared in outbound_timeouts.yaml and the model refuses a block that omits a value -- falsifier: a site whose default differs from the declared value, or a block missing a value that still loads'
      - id: AC10
        statement: 'AC10: the contracts_and_di literal_timeout rule reports no finding over the seven edited files and models/outbound_timeouts -- falsifier: any literal_timeout line from that run'
      - id: AC11
        statement: 'AC11: adapter imports do not read timeout YAML, missing keys report the missing field, the coder request fits its own transport ceiling, and a built wheel loads the timeout file outside the checkout -- falsifier: any focused timeout or wheel regression fails'
  - id: req-omn21623-slice-service-endpoints
    statement: The modules that call GitHub, Linear, Slack, Gmail or a loopback probe read the URL from the declared endpoints file, and an endpoints block that omits a value fails to load.
    acceptance:
      - id: AC5
        statement: 'AC5: the endpoints load from the declared file, an omitted value is refused, and each consuming module holds the declared value -- falsifier: an endpoints block missing a value that still loads, or a consumer constant that differs from the declared value'
      - id: AC6
        statement: 'AC6: the contracts_and_di check reports no literal_url finding in the 11 consuming modules and reports a planted URL as the positive control -- falsifier: any literal_url issue from those modules, or none from the planted module'
  - id: req-omn21623-slice-network-binding-settings
    statement: Infra services take their fallback bind addresses, loopback host names, local stack endpoints and runtime health port from the declared network binding settings, and a settings block that omits a value fails to load.
    acceptance:
      - id: AC31
        statement: 'AC31: the network binding settings load from the declared file, an omitted or unknown key is refused, and every consumer that held a host, address or port literal reads the declared value -- falsifier: a settings block missing a key that still loads, or a consumer default that differs from the declared value'
      - id: AC32
        statement: 'AC32: the contracts_and_di check reports no literal_host, literal_ip or literal_port finding in the 17 source files this change edited and the three new models -- falsifier: any such finding from the check over those files'
evidence_requirements:
  - kind: tests
    description: The registry directories are gone, the six handlers hold no hand construction, the binding site builds a HandlerDb, and the planted construction is reported.
    command: uv run --frozen pytest tests/unit/handlers/container/test_handler_hand_construction_omn21623.py -q
  - kind: tests
    description: The handlers that compose a HandlerDb keep their behaviour.
    command: uv run --frozen pytest tests/unit/nodes/node_ledger_write_effect tests/unit/nodes/node_validation_ledger_write_effect tests/unit/nodes/node_gateway_link_health_write_effect -q
  - kind: tests
    description: The savings, waste detection, LLM adapter and decision search tests, including the contract completeness tests.
    command: uv run pytest tests/unit/nodes/node_savings_estimation_compute tests/unit/nodes/node_waste_detection_compute tests/unit/adapters/llm tests/unit/services/session_registry/test_decision_search.py -q
  - kind: tests
    description: The loaded timeouts equal the declared file, each omitted value fails to load, and every edited outbound-call site carries the declared value.
    command: uv run --frozen pytest tests/unit/models/outbound_timeouts/test_model_outbound_timeouts.py tests/integration/adapters/test_outbound_timeouts_omn21623.py -q
  - kind: ci
    description: The contracts_and_di check reports no literal_timeout finding over the seven edited files and the settings model; at the merge base the same run reports 16.
    command: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/adapters/llm/adapter_code_analysis_enrichment.py src/omnibase_infra/adapters/llm/adapter_code_review_analysis.py src/omnibase_infra/adapters/llm/adapter_documentation_generation.py src/omnibase_infra/adapters/llm/adapter_test_boilerplate_generation.py src/omnibase_infra/adapters/project_tracker/linear_graphql_project_tracker_adapter.py src/omnibase_infra/adapters/ticket/adapter_ticket_service_linear.py src/omnibase_infra/diagnostics/bus_audit.py src/omnibase_infra/models/outbound_timeouts
  - kind: tests
    description: The loaded endpoints equal the declared file, each omitted value fails to load, the URL builders derive from the declared bases, and every consumer module is free of literal_url.
    command: uv run --frozen pytest tests/unit/models/third_party_endpoints -q
  - kind: tests
    description: The handlers, adapter and probes that read the endpoints keep their behaviour.
    command: uv run --frozen pytest tests/unit/adapters/test_linear_graphql_project_tracker_adapter.py tests/unit/event_bus/test_topic_violation_alerter.py tests/unit/handlers/test_handler_gmail_api.py tests/unit/handlers/test_handler_slack_webhook.py -q
  - kind: tests
    description: The loaded settings equal the declared file, each omitted key fails to load, and the health, MCP, registration storage, kernel and domain-validator consumers carry the declared values.
    command: uv run --frozen pytest tests/unit/models/network_binding tests/integration/test_network_binding_settings_consumers.py -q -p no:cacheprovider
  - kind: tests
    description: The contracts_and_di check reports no host, address or port finding in the edited files, and reports a planted file.
    command: uv run --frozen pytest tests/unit/validation/test_network_binding_contracts_and_di_omn21623.py -q -p no:cacheprovider
