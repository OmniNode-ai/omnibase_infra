schema_version: 1.0.0
ticket_id: OMN-21623
title: omnibase_infra builds handlers at a binding site or not at all, declares model names in node contracts, and injects them into the LLM adapters (contracts_and_di burn-down, handler_hand_construction and literal_model_name slices)
summary: >-
  The literal_model_name slice of the contracts_and_di burn-down (omnibase_core#2175) for omnibase_infra, alongside the handler_hand_construction slice already on dev (24 unused node registry factories deleted; six handlers moved onto a binding site in each of their five nodes). The savings estimation node held a counterfactual model map and a fallback model in its handler and input model; the waste detection analyzer held its premium-model markers; the five LLM enrichment and generation adapters, the OpenAI-compatible provider adapter and the decision search client held default model names. The two nodes now declare their model policy in the contract config block, parsed into frozen models with every field required; the adapters and the search client take the model from their caller, which resolves it from the model-routing policy. Separately, the contracts_and_di check reported 42 literal_url findings in src/omnibase_infra. This change declares the GitHub, Linear, Slack, Gmail, Claude Code schema and loopback-probe endpoints in models/third_party_endpoints/third_party_endpoints.yaml, loads them through ModelThirdPartyEndpoints (no field defaults, so an omitted value fails to load), and reads them in 11 modules. The check reports no literal_url finding over those modules, which held 16. Separately, the unit drift check and the CLAUDE.md reference check parse home-relative paths with Path parts; the literal_path rule reports nothing in those two files.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-handler-construction
    statement: No node registry factory that nothing calls remains in the 24 node packages, and the handlers that composed a HandlerDb obtain it from the binding site.
    acceptance:
      - id: AC41
        statement: 'AC41: the 24 node packages hold no registry directory and their package exports name no registry class -- falsifier: a registry directory that is still present in one of the 24 node packages'
      - id: AC42
        statement: 'AC42: the contracts_and_di check reports no handler_hand_construction finding in the six handlers that composed a HandlerDb, reports a planted construction as the positive control, and the binding site builds a HandlerDb -- falsifier: a finding from one of the six handlers, or none from the planted module'
  - id: req-omn21623-model-name-infra
    statement: >-
      The savings estimation node, the waste detection analyzer, the LLM adapters and the decision search client hold no model name in code.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the savings counterfactual rules and fallback model and the waste premium-model markers load from their node contracts, and a contract missing any of them fails to load -- falsifier: uv run pytest tests/unit/nodes/node_savings_estimation_compute tests/unit/nodes/node_waste_detection_compute -q in omnibase_infra, where the contract tests drop each field and expect a validation error
      - id: AC2
        statement: >-
          AC2: the LLM adapters and the decision search client take the model from the caller and refuse construction or use without it -- falsifier: uv run pytest tests/unit/adapters/llm tests/unit/services/session_registry/test_decision_search.py -q in omnibase_infra, where each adapter raises TypeError when built without a model and the search client raises ValueError when asked to embed with none
      - id: AC3
        statement: >-
          AC3: the contracts_and_di check reports no literal_model_name finding in those paths -- falsifier: the runtime_validator_run of ValidatorContractsAndDi over src/omnibase_infra/adapters/llm, src/omnibase_infra/nodes/node_savings_estimation_compute, src/omnibase_infra/nodes/node_waste_detection_compute and src/omnibase_infra/services/session_registry/decision_search.py, filtered for literal_model_name reports no literal_model_name finding where it reported twenty-three before (findings of other rules in those paths are out of this slice)
  - id: req-omn21623-slice-service-endpoints
    statement: The modules that call GitHub, Linear, Slack, Gmail or a loopback probe read the URL from the declared endpoints file, and an endpoints block that omits a value fails to load.
    acceptance:
      - id: AC5
        statement: 'AC5: the endpoints load from the declared file, an omitted value is refused, and each consuming module holds the declared value -- falsifier: an endpoints block missing a value that still loads, or a consumer constant that differs from the declared value'
      - id: AC6
        statement: 'AC6: the contracts_and_di check reports no literal_url finding in the 11 consuming modules and reports a planted URL as the positive control -- falsifier: any literal_url issue from those modules, or none from the planted module'
  - id: req-omn21623-slice-literal-path
    statement: Home-relative paths in the deploy-agent unit drift check and the CLAUDE.md reference check are parsed with Path parts, not a literal prefix.
    acceptance:
      - id: AC32
        statement: 'AC32: the contracts_and_di literal_path rule reports no finding in unit_drift.py and check_claudemd_references.py, and reports the planted literal in the positive control -- falsifier: any literal_path issue from those files, or none from the planted file'
      - id: AC33
        statement: 'AC33: both path resolvers expand bare and nested home-relative paths, preserve absolute paths and handle non-tilde inputs; reference paths prefer the repository before the workspace root and return None when absent, and installed registry paths obey resolve_registry -- falsifier: any returned path differs from the expected path in the behavioral tests'
evidence_requirements:
  - kind: tests
    description: The registry directories are gone, the six handlers hold no hand construction, the binding site builds a HandlerDb, and the planted construction is reported.
    command: uv run --frozen pytest tests/unit/handlers/container/test_handler_hand_construction_omn21623.py -q
  - kind: tests
    description: The handlers that compose a HandlerDb keep their behaviour.
    command: uv run --frozen pytest tests/unit/nodes/node_ledger_write_effect tests/unit/nodes/node_validation_ledger_write_effect tests/unit/nodes/node_gateway_link_health_write_effect -q
  - kind: tests
    description: The savings, waste detection, LLM adapter and decision search tests, including the contract completeness tests.
    command: uv run pytest tests/unit/nodes/node_savings_estimation_compute tests/unit/nodes/node_waste_detection_compute tests/unit/adapters/llm tests/unit/services/session_registry/test_decision_search.py -q
  - kind: tests
    description: The loaded endpoints equal the declared file, each omitted value fails to load, the URL builders derive from the declared bases, and every consumer module is free of literal_url.
    command: uv run --frozen pytest tests/unit/models/third_party_endpoints -q
  - kind: tests
    description: The handlers, adapter and probes that read the endpoints keep their behaviour.
    command: uv run --frozen pytest tests/unit/adapters/test_linear_graphql_project_tracker_adapter.py tests/unit/event_bus/test_topic_violation_alerter.py tests/unit/handlers/test_handler_gmail_api.py tests/unit/handlers/test_handler_slack_webhook.py -q
  - kind: tests
    description: The literal_path rule finds nothing in the two cleared files and one issue in the planted control.
    command: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q
  - kind: tests
    description: Both resolvers return the expected paths for home, absolute, relative and registry inputs, including missing references and repository precedence.
    command: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q -k 'resolvers or installed_path or reference_path or installed_registry'
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac41-no-dead-registry
    description: The 24 node packages exist, hold no registry directory and have no remaining source importers of the deleted factories. Fails at the merge base, where each held one.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/container/test_handler_hand_construction_omn21623.py -k dead_registry_factory -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC41
  - id: dod-omn21623-ac42-no-hand-construction
    description: The check reports no handler_hand_construction finding in the six handlers and reports the planted construction. Fails at the merge base, where each of the six held one.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/container/test_handler_hand_construction_omn21623.py -k 'planted or binding_site or builds_nothing_by_hand' -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC42
  - id: dod-omn21623-deploy-binding-site
    description: >-
      Deploy probe for hosted CI: discover and wire the five real node contracts, then construct every routed DB-composing handler with a real ModelONEXContainer. Each must call the binding site once, retain that container and leave the database pool uninitialized. This exercises runtime wiring in process without a deployed container or database.
    source: manual
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/runtime/test_handler_db_binding_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_ledger_write_effect/container/container_handler_db.py?ref=omn-21623-cdi-handler-construction-slice" --jq .content | base64 -d | grep -q 'def bind_handler_db'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC42]
  - id: dod-omn21623-model-name-ac1-node-policy-tests
    description: The node model policies load from the contracts and a contract missing a field fails to load.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_savings_estimation_compute/test_counterfactual_policy_contract_omn21623.py tests/unit/nodes/node_waste_detection_compute/test_premium_model_policy_contract_omn21623.py tests/unit/nodes/node_savings_estimation_compute tests/unit/nodes/node_waste_detection_compute -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21623-model-name-ac2-injection-tests
    description: The adapters and the search client refuse to run without an injected model.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/adapters/llm tests/unit/services/session_registry/test_decision_search.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21623-model-name-ac3-check
    description: The contracts_and_di check judges the slice's paths free of literal_model_name findings.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: bash -c "! uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/adapters/llm src/omnibase_infra/nodes/node_savings_estimation_compute src/omnibase_infra/nodes/node_waste_detection_compute src/omnibase_infra/services/session_registry/decision_search.py | grep -q literal_model_name"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21623-ac5-service-endpoints
    description: The endpoints load from the declared file, an omitted value is refused, and the consumer constants equal the declared values. Fails at the merge base, where the endpoints model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/third_party_endpoints/test_model_third_party_endpoints.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-ac6-no-literal-url
    description: The contracts_and_di check reports no literal_url issue in the 11 consuming modules and reports the planted URL. Fails at the merge base, where those modules held 16 literal_url findings.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/third_party_endpoints/test_third_party_endpoint_consumers_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC6
  - id: dod-omn21623-ac5-packaged-file
    description: The packaged endpoints file loads and the Slack and Gmail handler constants equal its values. Fails at the merge base, where the endpoints loader does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/models/test_third_party_endpoints_runtime_file_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-model-name-deploy-policy-on-dev
    description: The deploy-scoped node contracts on the dev branch carry the model policy blocks, so the models the nodes read are declared where the runtime loads them. It reads dev, which holds the blocks only after this change merges, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion (AC1 is bound by the node policy tests).
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_waste_detection_compute/contract.yaml?ref=dev --jq .content | base64 -d | grep -qF 'premium_model_policy'
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_savings_estimation_compute/contract.yaml?ref=dev --jq .content | base64 -d | grep -qF 'counterfactual_policy'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21623-deploy-service-endpoints
    description: 'Post-deploy probe: the runtime container loads the service endpoints from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.third_party_endpoints import load_third_party_endpoints; load_third_party_endpoints()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21623-ac32-literal-path-clean
    description: The literal_path rule reports nothing in unit_drift.py and check_claudemd_references.py and reports the planted literal.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC32
  - id: dod-omn21623-ac33-path-behavior
    description: 'Hosted post-deploy smoke: imports the two path resolvers and asserts returned paths for bare tilde, nested home paths, absolute paths, relative paths, missing references, repository precedence and registry resolution. Runs without containers or external services.'
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q -k 'resolvers or installed_path or reference_path or installed_registry'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC33
