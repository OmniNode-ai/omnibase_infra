dod_evidence:
  - id: dod-omn21623-ac41-no-dead-registry
    description: The 24 node packages exist, hold no registry directory and have no remaining source importers of the deleted factories. Fails at the merge base, where each held one.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/container/test_handler_hand_construction_omn21623.py -k dead_registry_factory -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC41
  - id: dod-omn21623-ac42-no-hand-construction
    description: The check reports no handler_hand_construction finding in the six handlers and reports the planted construction. Fails at the merge base, where each of the six held one.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/container/test_handler_hand_construction_omn21623.py -k 'planted or binding_site or builds_nothing_by_hand' -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC42
  - id: dod-omn21623-deploy-binding-site
    description: >-
      Deploy probe for hosted CI: discover and wire the five real node contracts, then construct every routed DB-composing handler with a real ModelONEXContainer. Each must call the binding site once, retain that container and leave the database pool uninitialized. This exercises runtime wiring in process without a deployed container or database.
    source: manual
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/runtime/test_handler_db_binding_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_ledger_write_effect/container/container_handler_db.py?ref=omn-21623-cdi-handler-construction-slice" --jq .content | base64 -d | grep -q 'def bind_handler_db'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC42]
  - id: dod-omn21623-model-name-ac1-node-policy-tests
    description: The node model policies load from the contracts and a contract missing a field fails to load.
