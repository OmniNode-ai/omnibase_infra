schema_version: "1.0.0"
ticket_id: OMN-21623
title: Seven literal topics in the cost API, board probe, chain canary and developer principal plan are read from contracts and declared files, not held in code
summary: The contracts_and_di check reported 556 literal_topic findings in src/omnibase_infra at dev 07713fa4d; 11 sit outside the generated enums and topics/platform_topic_suffixes.py, and this change clears 7 of them. The board probe's exposure topic and seam DLQ move into its contract's consumer_flow_topics block, the developer principal plan's scoped write topic moves into that node's contract, the cost API's three snapshot topics move into services/cost_api/cost_api_topics.yaml behind ModelCostApiTopics (no field defaults), and the chain canary's quarantine topic default is the generated registry member. The other four findings (cli/infra_test, validation) belong to open PRs.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-literal-topic-a
    statement: The cost API, board probe, chain canary and developer principal plan name no topic literal; each reads its topic from a contract or a declared file, and a declaration that omits a topic fails to load.
    acceptance:
      - id: AC7
        statement: 'AC7: the cost API snapshot topics, the board probe exposure topic and seam DLQ, and the developer principal plan scoped write topics equal what their contract or declared file holds, and a declaration missing a value is refused -- falsifier: a constant that differs from the declaration, or a declaration missing a topic that still loads'
      - id: AC8
        statement: 'AC8: the contracts_and_di check over src/omnibase_infra/services/cost_api, models/cost_api and models/developer_principal reports no finding -- falsifier: any finding from that run'
evidence_requirements:
  - kind: tests
    description: The constants equal the declarations, an omitted or mis-shaped topic is refused, and the canary quarantine default is the registry member.
    command: uv run --frozen pytest tests/unit/models/cost_api/test_model_cost_api_topics.py tests/unit/nodes/node_board_probe_effect/test_consumer_flow_contract_topics_omn21623.py tests/unit/nodes/node_developer_principal_plan_compute/test_scoped_write_topics_contract_omn21623.py tests/unit/nodes/node_chain_canary_effect/test_quarantine_topic_default_omn21623.py -q
  - kind: ci
    description: The contracts_and_di check exits 0 over the cost API, its topics model and the developer principal models; at the merge base the same run reports 4 findings.
    command: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/services/cost_api src/omnibase_infra/models/cost_api src/omnibase_infra/models/developer_principal
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac7-topic-declarations
    description: The constants equal the declarations and an omitted topic is refused. Fails at the merge base, where the cost API topics model and the contract declarations do not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/cost_api/test_model_cost_api_topics.py tests/unit/nodes/node_board_probe_effect/test_consumer_flow_contract_topics_omn21623.py tests/unit/nodes/node_developer_principal_plan_compute/test_scoped_write_topics_contract_omn21623.py tests/unit/nodes/node_chain_canary_effect/test_quarantine_topic_default_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC7
  - id: dod-omn21623-ac8-literal-topic-clean
    description: The contracts_and_di check reports no finding over the cost API, its topics model and the developer principal models. Fails at the merge base, where the same run reports 4 findings.
    source: manual
    checks:
      - check_type: command
        check_value: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/services/cost_api src/omnibase_infra/models/cost_api src/omnibase_infra/models/developer_principal
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC8
  - id: dod-omn21623-deploy-artifact-topic-readback
    description: 'Deploy artifact probe: build the wheel, load its cost, board and plan topic declarations outside the source tree, and read back all three cached snapshots. Fails if a shipped declaration is absent or the cache cannot serve it; runs on the hosted runner without Docker.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/services/test_topic_declarations_wheel_omn21623.py -q -s
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC7
  - id: dod-omn21623-deploy-topic-declarations
    description: >-
      Post-deploy probe: the runtime container loads the cost API topics and the plan's scoped write topics from the files it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.cost_api import load_cost_api_topics; from omnibase_infra.models.developer_principal.topics import SCOPED_WRITE_TOPICS; load_cost_api_topics(); assert SCOPED_WRITE_TOPICS'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
