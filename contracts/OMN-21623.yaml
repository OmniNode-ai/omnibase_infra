schema_version: "1.0.0"
ticket_id: OMN-21623
title: The observability services read their query, circuit-breaker and consumer timeouts from a declared timeouts file, not from literals
summary: The contracts_and_di check reported 33 literal_timeout findings in src/omnibase_infra/services/observability (399 literal_timeout, 1228 in all, over src/omnibase_infra at dev 07713fa4d). This change declares the timeouts in services/observability/observability_timeouts.yaml, loads them through ModelObservabilityTimeouts (no field defaults, so an omitted value fails to load), and has the eight writers and the reader, the consumer-health writer, the two batch compute services, their node handlers and the LLM cost consumer take their values from it. The check reports 11 literal_timeout findings over the observability services, all in the other six consumers, which the file-shape ratchet keeps from growing by the one import line.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-observability-timeouts
    statement: The observability writers, reader, batch compute services and the LLM cost consumer take their query timeouts, circuit-breaker reset timeout, stop wait and poll-warning interval from the declared timeouts file, and a timeouts block that omits a value fails to load.
    acceptance:
      - id: AC11
        statement: 'AC11: the observability services hold no timeout literal and read ModelObservabilityTimeouts -- falsifier: a timeouts block missing a value that still loads, or a writer default that differs from the declared value'
      - id: AC12
        statement: 'AC12: the contracts_and_di check over the writers, the reader, the batch compute services and the LLM cost consumer reports no literal_timeout finding -- falsifier: any literal_timeout finding in those files'
evidence_requirements:
  - kind: tests
    description: The loaded timeouts equal the declared file, each omitted value fails to load, and the writer, reader and batch compute defaults carry the declared values.
    command: uv run --frozen pytest tests/unit/models/observability/test_model_observability_timeouts.py tests/unit/services/observability -q
  - kind: command
    description: The contracts_and_di check exits 0 over the fixed writers, reader, batch compute services and LLM cost consumer; at the merge base the same run reports 22 findings.
    command: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/services/observability/agent_actions/writer_postgres.py src/omnibase_infra/services/observability/context_audit/writer_postgres.py src/omnibase_infra/services/observability/infra_routing_decisions/writer_postgres.py src/omnibase_infra/services/observability/injection_effectiveness/ledger_sink_postgres.py src/omnibase_infra/services/observability/injection_effectiveness/reader_postgres.py src/omnibase_infra/services/observability/injection_effectiveness/writer_postgres.py src/omnibase_infra/services/observability/llm_cost_aggregation/writer_postgres.py src/omnibase_infra/services/observability/skill_lifecycle/writer_postgres.py src/omnibase_infra/services/observability/consumer_health/writer_postgres.py src/omnibase_infra/services/observability/baselines/constants.py src/omnibase_infra/services/observability/baselines/service_batch_compute_baselines.py src/omnibase_infra/services/observability/injection_effectiveness/service_batch_compute_effectiveness.py src/omnibase_infra/services/observability/llm_cost_aggregation/consumer.py src/omnibase_infra/nodes/node_baseline_capture/handlers/handler_baseline_capture.py src/omnibase_infra/nodes/node_baselines_batch_compute/handlers/handler_baselines_batch_compute.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac11-observability-timeouts
    description: The timeouts load from the declared file, an omitted value is refused, and the writer, reader and batch compute defaults carry the declared values. Fails at the merge base, where the timeouts model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/observability/test_model_observability_timeouts.py tests/unit/services/observability -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC11
  - id: dod-omn21623-ac12-observability-check-clean
    description: The contracts_and_di check reports no finding over the fixed writers, reader, batch compute services and LLM cost consumer. Fails at the merge base, where the same run reports 22 findings.
    source: manual
    checks:
      - check_type: command
        check_value: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/services/observability/agent_actions/writer_postgres.py src/omnibase_infra/services/observability/context_audit/writer_postgres.py src/omnibase_infra/services/observability/infra_routing_decisions/writer_postgres.py src/omnibase_infra/services/observability/injection_effectiveness/ledger_sink_postgres.py src/omnibase_infra/services/observability/injection_effectiveness/reader_postgres.py src/omnibase_infra/services/observability/injection_effectiveness/writer_postgres.py src/omnibase_infra/services/observability/llm_cost_aggregation/writer_postgres.py src/omnibase_infra/services/observability/skill_lifecycle/writer_postgres.py src/omnibase_infra/services/observability/consumer_health/writer_postgres.py src/omnibase_infra/services/observability/baselines/constants.py src/omnibase_infra/services/observability/baselines/service_batch_compute_baselines.py src/omnibase_infra/services/observability/injection_effectiveness/service_batch_compute_effectiveness.py src/omnibase_infra/services/observability/llm_cost_aggregation/consumer.py src/omnibase_infra/nodes/node_baseline_capture/handlers/handler_baseline_capture.py src/omnibase_infra/nodes/node_baselines_batch_compute/handlers/handler_baselines_batch_compute.py
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC12
  - id: dod-omn21623-deploy-observability-timeouts
    description: >-
      Post-deploy probe: the runtime container loads the observability timeouts from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.observability import load_observability_timeouts; load_observability_timeouts()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
