schema_version: "1.0.0"
ticket_id: OMN-21623
title: Sixteen outbound-call timeouts in the LLM, Linear and ticket adapters and the bus audit are read from a declared file, not from literals
summary: The contracts_and_di check reported 30 literal_timeout findings in src/omnibase_infra/adapters (21), backends (5), clients (1) and diagnostics (3), among 1228 in src. This change declares 16 of them -- the code-analysis, code-review, documentation and test-boilerplate LLM adapters, the Linear project-tracker and ticket adapters, and the bus audit -- in models/outbound_timeouts/outbound_timeouts.yaml, loads them through ModelOutboundTimeouts (no field defaults, so an omitted value fails to load; a per-request LLM wait above its transport ceiling fails to load), and binds each call site to the loaded value. The literal_timeout rule reports zero findings over the seven edited files and the model.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-outbound-timeouts
    statement: The LLM, Linear and ticket adapters and the bus audit take sixteen outbound-call timeouts from the declared timeouts file, and a block that omits a value fails to load.
    acceptance:
      - id: AC9
        statement: 'AC9: each edited outbound-call site carries the value declared in outbound_timeouts.yaml and the model refuses a block that omits a value -- falsifier: a site whose default differs from the declared value, or a block missing a value that still loads'
      - id: AC10
        statement: 'AC10: the contracts_and_di literal_timeout rule reports no finding over the seven edited files and models/outbound_timeouts -- falsifier: any literal_timeout line from that run'
  - id: req-omn21623-slice-service-endpoints
    statement: The modules that call GitHub, Linear, Slack, Gmail or a loopback probe read the URL from the declared endpoints file, and an endpoints block that omits a value fails to load.
    acceptance:
      - id: AC5
        statement: 'AC5: the endpoints load from the declared file, an omitted value is refused, and each consuming module holds the declared value -- falsifier: an endpoints block missing a value that still loads, or a consumer constant that differs from the declared value'
      - id: AC6
        statement: 'AC6: the contracts_and_di check reports no literal_url finding in the 11 consuming modules and reports a planted URL as the positive control -- falsifier: any literal_url issue from those modules, or none from the planted module'
evidence_requirements:
  - kind: tests
    description: The loaded timeouts equal the declared file, each omitted value fails to load, and every edited outbound-call site carries the declared value.
    command: uv run --frozen pytest tests/unit/models/outbound_timeouts/test_model_outbound_timeouts.py tests/integration/adapters/test_outbound_timeouts_omn21623.py -q
  - kind: ci
    description: The contracts_and_di check reports no literal_timeout finding over the seven edited files and the settings model; at the merge base the same run reports 16.
    command: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/adapters/llm/adapter_code_analysis_enrichment.py src/omnibase_infra/adapters/llm/adapter_code_review_analysis.py src/omnibase_infra/adapters/llm/adapter_documentation_generation.py src/omnibase_infra/adapters/llm/adapter_test_boilerplate_generation.py src/omnibase_infra/adapters/project_tracker/linear_graphql_project_tracker_adapter.py src/omnibase_infra/adapters/ticket/adapter_ticket_service_linear.py src/omnibase_infra/diagnostics/bus_audit.py src/omnibase_infra/models/outbound_timeouts
  - kind: tests
    description: The loaded endpoints equal the declared file, each omitted value fails to load, the URL builders derive from the declared bases, and every consumer module is free of literal_url.
    command: uv run --frozen pytest tests/unit/models/third_party_endpoints -q
  - kind: tests
    description: The handlers, adapter and probes that read the endpoints keep their behaviour.
    command: uv run --frozen pytest tests/unit/adapters/test_linear_graphql_project_tracker_adapter.py tests/unit/event_bus/test_topic_violation_alerter.py tests/unit/handlers/test_handler_gmail_api.py tests/unit/handlers/test_handler_slack_webhook.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac9-outbound-timeouts
    description: The timeouts load from the declared file, an omitted value is refused, and every edited outbound-call site carries the declared value. Fails at the merge base, where the model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/outbound_timeouts/test_model_outbound_timeouts.py tests/integration/adapters/test_outbound_timeouts_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC9
  - id: dod-omn21623-ac10-literal-timeout-clean
    description: The literal_timeout rule reports no finding over the seven edited files and the settings model. Fails at the merge base, where the same run reports 16.
    source: manual
    checks:
      - check_type: command
        check_value: "bash -c '! uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/adapters/llm/adapter_code_analysis_enrichment.py src/omnibase_infra/adapters/llm/adapter_code_review_analysis.py src/omnibase_infra/adapters/llm/adapter_documentation_generation.py src/omnibase_infra/adapters/llm/adapter_test_boilerplate_generation.py src/omnibase_infra/adapters/project_tracker/linear_graphql_project_tracker_adapter.py src/omnibase_infra/adapters/ticket/adapter_ticket_service_linear.py src/omnibase_infra/diagnostics/bus_audit.py src/omnibase_infra/models/outbound_timeouts | grep -q literal_timeout'"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC10
  - id: dod-omn21623-deploy-hosted-outbound-timeouts
    description: Hosted deploy check loads the shipped timeout declaration and sends loopback HTTP requests through the Linear and LLM adapters, asserting the declared waits reach HTTPX without clamping and explicit Linear overrides are retained.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/integration/adapters/test_outbound_timeouts_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21623-ac5-service-endpoints
    description: The endpoints load from the declared file, an omitted value is refused, and the consumer constants equal the declared values. Fails at the merge base, where the endpoints model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/third_party_endpoints/test_model_third_party_endpoints.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-ac6-no-literal-url
    description: The contracts_and_di check reports no literal_url issue in the 11 consuming modules and reports the planted URL. Fails at the merge base, where those modules held 16 literal_url findings.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/third_party_endpoints/test_third_party_endpoint_consumers_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC6
  - id: dod-omn21623-ac5-packaged-file
    description: The packaged endpoints file loads and the Slack and Gmail handler constants equal its values. Fails at the merge base, where the endpoints loader does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/integration/models/test_third_party_endpoints_runtime_file_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-deploy-outbound-timeouts
    description: >-
      Post-deploy probe: the runtime container loads the outbound timeouts from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.outbound_timeouts import load_outbound_timeouts; load_outbound_timeouts()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21623-deploy-service-endpoints
    description: >-
      Post-deploy probe: the runtime container loads the service endpoints from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.third_party_endpoints import load_third_party_endpoints; load_third_party_endpoints()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
