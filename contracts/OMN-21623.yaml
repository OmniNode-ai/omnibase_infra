schema_version: "1.0.0"
ticket_id: OMN-21623
title: Third-party service URLs, fallback bind addresses, local stack endpoints and the runtime health port are declared in settings files, not spelled in code
summary: The contracts_and_di check reported 42 literal_url findings in src/omnibase_infra. This change declares the GitHub, Linear, Slack, Gmail, Claude Code schema and loopback-probe endpoints in models/third_party_endpoints/third_party_endpoints.yaml, loads them through ModelThirdPartyEndpoints (no field defaults, so an omitted value fails to load), and reads them in 11 modules. The check reports no literal_url finding over those modules, which held 16. The contracts_and_di check reported 37 literal_host, literal_ip and literal_port findings in src/omnibase_infra (literal_ip 18, literal_host 10, literal_port 9), among 1228 in src. This change declares the loopback and bind-all addresses, the local host, the PostgreSQL port and the TCP port bounds in models/network_binding/network_binding_settings.yaml, loads them through ModelNetworkBindingSettings (no field defaults, so an omitted value fails to load), and reads them where 17 source files held the literals; nine service configs take their health_check_host field from one of two small mixin models instead of declaring it each. Every fallback keeps its previous value. The check reports 19 fewer findings (1228 to 1209). The 18 findings left in the three rules sit in files whose canonical-file-shape baseline forbids growth or that another change holds.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-service-endpoints
    statement: The modules that call GitHub, Linear, Slack, Gmail or a loopback probe read the URL from the declared endpoints file, and an endpoints block that omits a value fails to load.
    acceptance:
      - id: AC5
        statement: 'AC5: the endpoints load from the declared file, an omitted value is refused, and each consuming module holds the declared value -- falsifier: an endpoints block missing a value that still loads, or a consumer constant that differs from the declared value'
      - id: AC6
        statement: 'AC6: the contracts_and_di check reports no literal_url finding in the 11 consuming modules and reports a planted URL as the positive control -- falsifier: any literal_url issue from those modules, or none from the planted module'
  - id: req-omn21623-slice-network-binding-settings
    statement: Infra services take their fallback bind addresses, loopback host names, local stack endpoints and runtime health port from the declared network binding settings, and a settings block that omits a value fails to load.
    acceptance:
      - id: AC31
        statement: 'AC31: the network binding settings load from the declared file, an omitted or unknown key is refused, and every consumer that held a host, address or port literal reads the declared value -- falsifier: a settings block missing a key that still loads, or a consumer default that differs from the declared value'
      - id: AC32
        statement: 'AC32: the contracts_and_di check reports no literal_host, literal_ip or literal_port finding in the 17 source files this change edited and the three new models -- falsifier: any such finding from the check over those files'
evidence_requirements:
  - kind: tests
    description: The loaded endpoints equal the declared file, each omitted value fails to load, the URL builders derive from the declared bases, and every consumer module is free of literal_url.
    command: uv run --frozen pytest tests/unit/models/third_party_endpoints -q
  - kind: tests
    description: The handlers, adapter and probes that read the endpoints keep their behaviour.
    command: uv run --frozen pytest tests/unit/adapters/test_linear_graphql_project_tracker_adapter.py tests/unit/event_bus/test_topic_violation_alerter.py tests/unit/handlers/test_handler_gmail_api.py tests/unit/handlers/test_handler_slack_webhook.py -q
  - kind: tests
    description: The loaded settings equal the declared file, each omitted key fails to load, and the health, MCP, registration storage, kernel and domain-validator consumers carry the declared values.
    command: uv run --frozen pytest tests/unit/models/network_binding tests/integration/test_network_binding_settings_consumers.py -q -p no:cacheprovider
  - kind: tests
    description: The contracts_and_di check reports no host, address or port finding in the edited files, and reports a planted file.
    command: uv run --frozen pytest tests/unit/validation/test_network_binding_contracts_and_di_omn21623.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac5-service-endpoints
    description: The endpoints load from the declared file, an omitted value is refused, and the consumer constants equal the declared values. Fails at the merge base, where the endpoints model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/third_party_endpoints/test_model_third_party_endpoints.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-ac6-no-literal-url
    description: The contracts_and_di check reports no literal_url issue in the 11 consuming modules and reports the planted URL. Fails at the merge base, where those modules held 16 literal_url findings.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/third_party_endpoints/test_third_party_endpoint_consumers_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC6
  - id: dod-omn21623-ac5-packaged-file
    description: The packaged endpoints file loads and the Slack and Gmail handler constants equal its values. Fails at the merge base, where the endpoints loader does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/integration/models/test_third_party_endpoints_runtime_file_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-deploy-service-endpoints
    description: >-
      Post-deploy probe: the runtime container loads the service endpoints from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.third_party_endpoints import load_third_party_endpoints; load_third_party_endpoints()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21623-ac31-network-binding-settings
    description: The settings load from the declared file, an omitted key is refused, and the consumers carry the declared values. Fails at the merge base, where the settings model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/network_binding tests/integration/test_network_binding_settings_consumers.py -q -p no:cacheprovider"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC31
  - id: dod-omn21623-ac32-binding-check-clean
    description: The contracts_and_di check reports no host, address or port finding in the edited files and reports a planted file. Fails at the merge base, where those files hold 19 such findings.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/validation/test_network_binding_contracts_and_di_omn21623.py -q -p no:cacheprovider"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC32
  - id: dod-omn21623-deploy-network-binding-settings
    description: 'Deploy packaging smoke: build the runtime wheel, import its kernel and settings outside the source checkout, bind a socket to the declared loopback address, and enforce the declared port bounds. Runs on hosted CI without Docker; fails if the shipped YAML is missing or the runtime consumers cannot import it.'
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/test_network_binding_settings_wheel.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: docker run --rm -v ${OMNI_HOME}/omnibase_infra/src/omnibase_infra/models/network_binding:/nb:ro python:3.12-slim python -c "import pathlib; t = pathlib.Path('/nb/network_binding_settings.yaml').read_text(); [t.index(k + ':') for k in ('loopback_address', 'bind_all_address', 'local_host', 'postgres_port', 'tcp_port_min', 'tcp_port_max')]"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC31
