schema_version: "1.0.0"
ticket_id: OMN-21623
title: omnibase_infra lab proof plan reads its step timeouts and bus address from its node contract (contracts_and_di burn-down, slice 1)
summary: >-
  The first omnibase_infra slice of the contracts_and_di burn-down (omnibase_core#2175). HandlerLabProofPlan fixed sixteen step timeouts and the bundle's bus bootstrap address in code. They are now declared in the node's contract bundle block, parsed into ModelLabProofStepTimeouts and ModelLabProofBundlePolicy with every field required, and the handler holds no number. The bundle policy moves from the baselined lab_proof package into the node's models directory, which shrinks the canonical-file-shape baseline by one entry.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-infra-timeouts
    statement: >-
      The lab proof plan handler holds no timeout and no bus address; each is read from the node contract through the bundle policy.
    acceptance:
      - id: AC1
        statement: >-
          AC1: every step of the rendered plan takes its timeout from ModelLabProofStepTimeouts and the delegation step takes its bus address from the bundle policy, and a contract missing any of them fails to load naming it -- falsifier: uv run pytest tests/unit/nodes/node_lab_proof_plan_compute -q in omnibase_infra, where each step is given a distinct policy value and the plan must carry it
      - id: AC2
        statement: >-
          AC2: the contracts_and_di check reports no finding in the handler -- falsifier: uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/nodes/node_lab_proof_plan_compute/handlers/handler_lab_proof_plan.py in omnibase_infra exits 0 where it exited 1 with sixteen literal_timeout findings before
evidence_requirements:
  - kind: tests
    description: The lab proof plan node tests, including the policy-supplied timeouts and the contract completeness tests.
    command: uv run pytest tests/unit/nodes/node_lab_proof_plan_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-infra-ac1-plan-tests
    description: Each step of the plan carries the timeout the bundle policy gives it, the delegation step carries the policy's bus address, and a contract missing any step timeout fails to load.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_lab_proof_plan_compute -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21623-infra-ac2-check
    description: The contracts_and_di check judges the handler clean.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/nodes/node_lab_proof_plan_compute/handlers/handler_lab_proof_plan.py
        cwd: ${OMNI_HOME}/omnibase_infra
