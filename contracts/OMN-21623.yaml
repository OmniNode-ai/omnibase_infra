schema_version: 1.0.0
ticket_id: OMN-21623
title: Third-party service URLs the infra handlers and probes call are declared in third_party_endpoints.yaml, not spelled in code
summary: The contracts_and_di check reported 42 literal_url findings in src/omnibase_infra. This change declares the GitHub, Linear, Slack, Gmail, Claude Code schema and loopback-probe endpoints in models/third_party_endpoints/third_party_endpoints.yaml, loads them through ModelThirdPartyEndpoints (no field defaults, so an omitted value fails to load), and reads them in 11 modules. The check reports no literal_url finding over those modules, which held 16. Separately, the unit drift check and the CLAUDE.md reference check parse home-relative paths with Path parts; the literal_path rule reports nothing in those two files.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-service-endpoints
    statement: The modules that call GitHub, Linear, Slack, Gmail or a loopback probe read the URL from the declared endpoints file, and an endpoints block that omits a value fails to load.
    acceptance:
      - id: AC5
        statement: 'AC5: the endpoints load from the declared file, an omitted value is refused, and each consuming module holds the declared value -- falsifier: an endpoints block missing a value that still loads, or a consumer constant that differs from the declared value'
      - id: AC6
        statement: 'AC6: the contracts_and_di check reports no literal_url finding in the 11 consuming modules and reports a planted URL as the positive control -- falsifier: any literal_url issue from those modules, or none from the planted module'
  - id: req-omn21623-slice-literal-path
    statement: Home-relative paths in the deploy-agent unit drift check and the CLAUDE.md reference check are parsed with Path parts, not a literal prefix.
    acceptance:
      - id: AC32
        statement: 'AC32: the contracts_and_di literal_path rule reports no finding in unit_drift.py and check_claudemd_references.py, and reports the planted literal in the positive control -- falsifier: any literal_path issue from those files, or none from the planted file'
      - id: AC33
        statement: 'AC33: both path resolvers expand bare and nested home-relative paths, preserve absolute paths and handle non-tilde inputs; reference paths prefer the repository before the workspace root and return None when absent, and installed registry paths obey resolve_registry -- falsifier: any returned path differs from the expected path in the behavioral tests'
evidence_requirements:
  - kind: tests
    description: The loaded endpoints equal the declared file, each omitted value fails to load, the URL builders derive from the declared bases, and every consumer module is free of literal_url.
    command: uv run --frozen pytest tests/unit/models/third_party_endpoints -q
  - kind: tests
    description: The handlers, adapter and probes that read the endpoints keep their behaviour.
    command: uv run --frozen pytest tests/unit/adapters/test_linear_graphql_project_tracker_adapter.py tests/unit/event_bus/test_topic_violation_alerter.py tests/unit/handlers/test_handler_gmail_api.py tests/unit/handlers/test_handler_slack_webhook.py -q
  - kind: tests
    description: The literal_path rule finds nothing in the two cleared files and one issue in the planted control.
    command: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q
  - kind: tests
    description: Both resolvers return the expected paths for home, absolute, relative and registry inputs, including missing references and repository precedence.
    command: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q -k 'resolvers or installed_path or reference_path or installed_registry'
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac5-service-endpoints
    description: The endpoints load from the declared file, an omitted value is refused, and the consumer constants equal the declared values. Fails at the merge base, where the endpoints model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/third_party_endpoints/test_model_third_party_endpoints.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-ac6-no-literal-url
    description: The contracts_and_di check reports no literal_url issue in the 11 consuming modules and reports the planted URL. Fails at the merge base, where those modules held 16 literal_url findings.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/third_party_endpoints/test_third_party_endpoint_consumers_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC6
  - id: dod-omn21623-ac5-packaged-file
    description: The packaged endpoints file loads and the Slack and Gmail handler constants equal its values. Fails at the merge base, where the endpoints loader does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/models/test_third_party_endpoints_runtime_file_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn21623-deploy-service-endpoints
    description: 'Post-deploy probe: the runtime container loads the service endpoints from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.third_party_endpoints import load_third_party_endpoints; load_third_party_endpoints()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21623-ac32-literal-path-clean
    description: The literal_path rule reports nothing in unit_drift.py and check_claudemd_references.py and reports the planted literal.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC32
  - id: dod-omn21623-ac33-path-behavior
    description: 'Hosted post-deploy smoke: imports the two path resolvers and asserts returned paths for bare tilde, nested home paths, absolute paths, relative paths, missing references, repository precedence and registry resolution. Runs without containers or external services.'
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_literal_path_slice_omn21623.py -q -k 'resolvers or installed_path or reference_path or installed_registry'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC33
