schema_version: "1.0.0"
ticket_id: OMN-21623
title: Twelve filesystem path literals in runtime defaults and the scope models are read from a declared file, not held in code
summary: The contracts_and_di check reported 38 literal_path findings among 2095 in src and scripts at dev 07713fa4d. This change clears 12 of them, and the total falls to 2083 with every other rule unchanged. The runtime socket, the gateway egress, lane-mirror and canary state files and the scope manifest path move into models/local_state_paths/local_state_paths.yaml behind ModelLocalStatePaths (no field defaults, so an omitted value fails to load); the runtime skill client, the local ingress config, the gateway forwarder and canary probe and five scope models read it. Home-relative paths in the deploy-agent unit drift check and the CLAUDE.md reference check are parsed with Path parts instead of a literal prefix. The other 26 findings are listed on the PR; a baselined script file may not grow, so the scripts need a loader that does not add lines to them.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-slice-literal-path
    statement: The runtime socket, gateway state files and scope manifest path come from a declared file, and a declaration that omits a path fails to load.
    acceptance:
      - id: AC31
        statement: 'AC31: each consumer default equals what the declared file holds, honours its override, and a declaration missing a path is refused -- falsifier: a consumer default that differs from the declaration, or a declaration missing a path that still loads'
      - id: AC32
        statement: 'AC32: the contracts_and_di literal_path rule reports no finding in the 13 files this change cleared, and reports the planted literal in the positive control -- falsifier: any literal_path issue from the cleared files, or none from the planted file'
evidence_requirements:
  - kind: tests
    description: The loaded paths equal the YAML, an omitted path is refused, and the socket client, ingress config, gateway parsers and scope models carry the declared values and honour overrides.
    command: uv run --frozen pytest tests/unit/models/local_state_paths/test_model_local_state_paths.py -q
  - kind: tests
    description: The literal_path rule finds nothing in the cleared files and one issue in the planted control.
    command: uv run --frozen pytest tests/unit/models/local_state_paths/test_literal_path_slice_omn21623.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac31-path-declarations
    description: The consumers' defaults equal the declared file and an omitted path is refused. Fails at the merge base, where the declared file and the model do not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/local_state_paths/test_model_local_state_paths.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC31
  - id: dod-omn21623-ac32-literal-path-clean
    description: The literal_path rule reports nothing in the cleared files and reports the planted literal. Fails at the merge base, where the cleared files hold the literals.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/local_state_paths/test_literal_path_slice_omn21623.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC32
  - id: dod-omn21623-deploy-local-state-paths
    description: >-
      Post-deploy probe: the runtime container loads the local state paths from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.local_state_paths import load_local_state_paths; load_local_state_paths()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
