ticket_id: OMN-18656
title: deploy-runtime.sh RT-6 readback compares each service to its own source ref and never retags a healthy lane
summary: |-
  Evidence for OMN-18656 in the repository that carries the fix (omnibase_infra#3741, squash 2ad774da1). AC1 and AC2 bind to the RT-6 foreign-source-repo tests, which drive the extracted bash functions with only docker stubbed. AC3 and AC4 are not bound here: AC3's reproduction fails at the parent of 2ad774da1 only because the harness cannot extract OWN_SOURCE_REPO, not because the old RT-6 rejected the foreign service, and AC4's proposed readback exits 0 whether or not the two image ids match.
