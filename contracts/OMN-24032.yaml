schema_version: "1.0.0"
ticket_id: OMN-24032
title: "One overlay root resolver: store root, then canonical overlays clone"
summary: "onex run-node finds a node's bus setting through the resolver this package registers with the core library, and that resolver read one frozen folder only, so a node whose setting lives in the settings repository was refused. It now looks first under the folders the settings selector ONEX_SKILL_OVERLAY_ROOTS declares (the one overlay root resolver in the shared market code renders that list: the host's local copy of the settings, then the canonical settings clone, then declared folders) and keeps the frozen folder as the last source."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24032-node-broker-overlay-roots
    statement: The node broker resolver finds a node's event_bus overlay under the declared overlay roots first and the workspace config root last, and refuses with the file it looked for when neither holds it.
    acceptance:
      - id: AC1
        statement: "AC1: one resolver returns the overlay roots in the order store root, then canonical overlays clone, and never the retired working-folder overlays path -- falsifier: uv run pytest src/omnimarket/nodes/node_overlay_roots_resolve_compute/tests -q fails at the merge base"
      - id: AC2
        statement: "AC2: a node's bus overlay is found under the resolved roots, so the broker permission derive request finds the overlay merged in the settings repository -- falsifier: the bus-overlay seam test finds no event_bus for node_broker_acl_overlay_render_compute with only the settings repository root set"
      - id: AC3
        statement: "AC3: the remote-lane runner builds its lane roots from the same resolver and the lane_time_box value reaches a Mac-launched lane -- falsifier: the runner roots test lists the retired working-folder overlays path"
      - id: AC4
        statement: "AC4: integrated: the derive request run through the development runtime over the bus returns derived rows and the coverage check -- falsifier: the run-node request is refused for a missing overlay or the broker is unreadable and is named as such"
evidence_requirements:
  - kind: tests
    description: The node broker resolver tests pass at the pushed head and the roots tests fail at the base commit.
    command: uv run pytest tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py tests/unit/handlers/test_handler_node_broker_resolve.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24032-ac2
    description: 'AC2: the node broker resolver finds the event_bus overlay under the overlay roots with no workspace root set; at the base commit the same call is refused.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py -q
        cwd: .
  - id: dod-omn24032-ac1
    description: 'hosted proxy for AC1: the resolver itself is the node in the omnimarket pull request of this ticket; here the handler reads the folders the selector declares and an unset selector keeps the old refusal.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py -q
        cwd: .
  - id: dod-omn24032-ac3
    description: 'hosted proxy for AC3: the runner side is the draft pull request of this lane against the lane plugin repository.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py -q
        cwd: .
  - id: dod-omn24032-ac4
    description: 'hosted proxy for AC4: the resolver tests pass here; the derive request through the development runtime is read after the merge and posted as a pull request comment naming the running revision.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py -q
        cwd: .
  - id: dod-omn24032-integration-proof
    description: 'Run the resolver tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24032 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py -q -n 0 --no-cov
