schema_version: "1.0.0"
ticket_id: OMN-21719
title: Twenty-nine runtime timeouts in the capability probe, lifecycle executor, request-response wiring, invocation adapter, snapshot publisher and two mixins are read from a declared file, not from literals
summary: The contracts_and_di check reported 399 literal_timeout findings among 1229 in src/omnibase_infra at dev aceff4fb1. This change declares 29 of them in models/runtime_timeouts/runtime_timeouts.yaml, loads them through ModelRuntimeTimeouts (no field defaults, so an omitted value fails to load; a default outside its bounds or a heartbeat at or above the session timeout fails to load), and binds each call site to the loaded value. The literal_timeout rule reports zero findings over the seven edited files and the model, and 370 over src/omnibase_infra.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21719-slice-runtime-timeouts
    statement: The capability probe, lifecycle executor, request-response wiring, node invocation adapter, snapshot publisher, LLM HTTP transport and introspection mixin take 29 timeouts from the declared timeouts file, and a block that omits a value fails to load.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_timeout over the slice paths drops to zero and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over omnibase_infra src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every moved timeout is taken through an injected parameter bound from the node contract or overlay and none remains hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over the touched modules plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through lab-run at the PR head, receipt path in the PR body'
evidence_requirements:
  - kind: tests
    description: The loaded timeouts equal the declared file, each omitted value fails to load, and every edited call site carries the declared value.
    command: uv run --frozen pytest tests/unit/models/runtime_timeouts -q
  - kind: command
    description: The contracts_and_di check reports no literal_timeout finding over the seven edited files and the settings model; at the merge base the same run reports 29.
    command: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/probes/capability_probe.py src/omnibase_infra/runtime/protocol_lifecycle_executor.py src/omnibase_infra/runtime/request_response_wiring.py src/omnibase_infra/runtime/node_invocation_adapter.py src/omnibase_infra/projectors/snapshot_publisher_registration.py src/omnibase_infra/mixins/mixin_llm_http_transport.py src/omnibase_infra/mixins/mixin_node_introspection.py src/omnibase_infra/models/runtime_timeouts
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21719-ac1-literal-timeout-clean
    description: The literal_timeout rule reports no finding over the seven edited files and the settings model. Fails at the merge base, where the same run reports 29.
    source: manual
    checks:
      - check_type: command
        check_value: "bash -c '! uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/probes/capability_probe.py src/omnibase_infra/runtime/protocol_lifecycle_executor.py src/omnibase_infra/runtime/request_response_wiring.py src/omnibase_infra/runtime/node_invocation_adapter.py src/omnibase_infra/projectors/snapshot_publisher_registration.py src/omnibase_infra/mixins/mixin_llm_http_transport.py src/omnibase_infra/mixins/mixin_node_introspection.py src/omnibase_infra/models/runtime_timeouts | grep -q literal_timeout'"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21719-ac2-timeouts-declared
    description: The timeouts load from the declared file, an omitted value is refused, and every edited call site carries the declared value. Fails at the merge base, where the model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/models/runtime_timeouts -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn21719-ac3-touched-module-tests
    description: The unit tests of every touched module and the timeouts model pass at the PR head. Run on the lab through lab-run; the receipt path is in the PR body.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/event_bus/test_msk_auth_direct_clients.py tests/unit/mixins/perf_threshold.py tests/unit/mixins/test_ack_listener_loop.py tests/unit/mixins/test_mixin_introspection_feature_flags.py tests/unit/mixins/test_mixin_llm_http_transport_402.py tests/unit/mixins/test_mixin_llm_http_transport.py tests/unit/mixins/test_mixin_node_introspection_event_bus.py tests/unit/mixins/test_mixin_node_introspection.py tests/unit/nodes/node_llm_inference_effect/handlers/bifrost/test_bifrost_failover.py tests/unit/nodes/node_llm_inference_effect/handlers/bifrost/test_bifrost_routing_callback.py tests/unit/nodes/node_llm_inference_effect/handlers/bifrost/test_bifrost_routing.py tests/unit/nodes/node_llm_inference_effect/handlers/bifrost/test_bifrost_shadow.py tests/unit/nodes/node_llm_inference_effect/handlers/test_gpu_measurement.py tests/unit/nodes/node_llm_inference_effect/handlers/test_handler_llm_openai_compatible_class.py tests/unit/nodes/node_llm_inference_effect/handlers/test_handler_llm_openai_compatible_metrics.py tests/unit/nodes/node_llm_inference_effect/handlers/test_handler_llm_openai_compatible.py tests/unit/nodes/node_llm_inference_effect/services/test_service_llm_metrics_publisher.py tests/unit/nodes/node_llm_inference_effect/test_registry_infra_llm_inference_effect.py tests/unit/probes/test_capability_probe.py tests/unit/projectors/test_snapshot_cache_operations.py tests/unit/projectors/test_snapshot_publisher_registration.py tests/unit/runtime/test_node_invocation_adapter.py tests/unit/runtime/test_protocol_lifecycle_executor.py tests/unit/runtime/test_request_response_wiring.py tests/unit/runtime/test_runtime_host_process.py tests/unit/validation/test_validation_exemptions.py tests/unit/models/runtime_timeouts -q -n 0"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn21719-deploy-runtime-timeouts
    description: >-
      Post-deploy probe: the runtime container loads the runtime timeouts from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.runtime_timeouts import load_runtime_timeouts; load_runtime_timeouts()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
