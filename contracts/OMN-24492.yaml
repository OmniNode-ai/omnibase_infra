schema_version: 1.0.0
ticket_id: OMN-24492
title: The runtime runs blocking job functions on a worker thread so one slow job cannot freeze it
summary: >-
  The runtime's dispatch callback (_make_dispatch_callback in runtime/auto_wiring/handler_wiring.py) called a handler's entry method directly on the asyncio event loop at three call sites. A handler whose entry method is a plain function therefore froze the loop (heartbeats, readiness endpoint) for as long as it ran; on 2026-11-14 two scheduled jobs froze the dev runtime for about 70 seconds every 5 minutes. The entry method is now classified once at wiring time: a plain function runs on a worker thread through asyncio.to_thread (context variables copied, the same exception object propagates), and an async def entry method or handle_async stays on the loop unchanged. No new setting and no new constant; the worker threads are the loop's default executor, the one the dispatch engine already uses for its sync dispatchers.
is_seam_ticket: true
interface_change: false
interfaces_touched:
  - runtime wiring entry point (_make_dispatch_callback) to every auto-wired handler class
requirements:
  - id: req-omn24492-sync-entry-off-loop
    statement: The runtime wiring runs a handler whose entry method is a plain function on a worker thread, so the event loop keeps serving heartbeats and its own endpoints while it runs, and leaves a handler with an async entry method or handle_async on the loop.
    acceptance:
      - id: AC1
        statement: "AC1: the runtime wiring runs a handler whose entry method is a plain function on a worker thread, and leaves a handler with an async entry method or handle_async unchanged -- falsifier: pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py -k entry_method -q"
      - id: AC2
        statement: "AC2: while a plain-function handler blocks for 0.6 seconds, the event loop heartbeat gap stays under 0.25 seconds, and the same test with the old direct call reads a gap of at least 0.48 seconds -- falsifier: pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py -k heartbeat -q"
      - id: AC3
        statement: "AC3: an error raised by a plain-function handler on the worker thread reaches the dispatch path as the same error as before the change -- falsifier: pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py -k error_chain -q"
      - id: AC4
        statement: "AC4: integrated: on the dev runtime on h201 a 20-minute reading of the readiness endpoint every 10 seconds shows no latency above 3 seconds and no heartbeat expiry while the 14 listed scheduled jobs run -- falsifier: any sample in the sampler file with latency above 3 seconds or a non-200 answer, or any heartbeat-session-expired line in the runtime log in the window"
evidence_requirements:
  - kind: tests
    description: The entry method placement, heartbeat (with its failing control) and error chain tests, plus the neighbouring handle_async dispatch tests.
    command: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py tests/unit/runtime/auto_wiring/test_handler_wiring_handle_async_dispatch.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24492-ac1-entry-method
    description: A plain def entry method runs on a thread other than the loop's; handle_async and an async def handle run on the loop thread and the plain handle is not called when handle_async wins; context variables set around the call are visible in the worker thread.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py -k entry_method -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24492-ac2-heartbeat
    description: Through the dispatch callback a 0.6 second blocking plain handle leaves the largest heartbeat gap under 0.25 seconds; the failing control calls the same handle directly on the loop and reads a gap of at least 0.48 seconds. At the merge base the golden test reads a gap of 0.61 seconds and fails.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py -k heartbeat -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24492-ac3-error-chain
    description: An error raised by a plain handle on the worker thread arrives at the caller of the dispatch callback as the same exception object at the first call site and at the fallback envelope call site; an error raised by handle_async is unchanged.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py -k error_chain -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24492-ac4-hosted-neighbours
    description: The hosted half of AC4. The dispatch callback tests that wire handlers of every kind still pass with plain handlers on a worker thread, the same behaviour the running readiness sampler reads on the rolled runtime.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_handler_wiring_sync_off_loop.py tests/unit/runtime/auto_wiring/test_handler_wiring_handle_async_dispatch.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24492-integration-proof
    description: Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The pushed head ran the auto_wiring unit tests on a lab host through the lab work runner and exited 0. The running reading (the rolled dev runtime on h201 and a 20 minute readiness sampler file) is read from the lab receipt comment on the ticket.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-omn24492 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/auto_wiring -q --no-cov -n 0 -p no:randomly
        cwd: .
