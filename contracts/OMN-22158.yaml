schema_version: "1.0.0"
ticket_id: OMN-22158
title: Record the onex-api request and response fixture before the port
summary: >-
  The recorder node and falsifiers are preparatory work. The private service corpus has not been recorded. Private corpus checks remain pending and are not evaluated by hosted CI; passing harness tests do not establish them.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-api-recording
    statement: Record the complete route surface with named masks and cleanup evidence.
    acceptance:
      - id: AC1
        statement: "AC1: the recorded set holds exactly one request and response pair per method-and-path identity of the 63-route fixture, and a route without a pair fails -- falsifier: a pytest that loads the T18a fixture and the recorded set and fails on any identity present in one and absent from the other"
      - id: AC2
        statement: "AC2: every masked field in a recorded pair is covered by a named masking rule and every mutating route's pair names its cleanup -- falsifier: a pytest over the recorded set that fails on a masked value with no rule or a mutating route with no cleanup"
      - id: AC3
        statement: "AC3: the recording leaves no tenant, account or Keycloak user behind -- falsifier: a pytest or onex run-node check that counts the throwaway tenants and accounts before and after the recording run and fails when the count differs"
evidence_requirements:
  - kind: tests
    description: Recorder regression controls and contract dispatch against disposable HTTP resources.
    command: uv run --frozen python -m pytest tests/unit/handlers/test_handler_api_fixture_record.py -q
dod_evidence:
  - id: dod-ac1-private-corpus
    source: manual
    status: pending
    execution_scope: local_done_gate
    description: >-
      The masked corpus is kept in a private repository, never in this public one. AC1 is that repository's corpus checker run at its own pull request head, wired to its existing inventory workflow and pre-commit hook. The acceptance probe below runs the same identity check against private input paths; an empty set fails.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/acceptance/onex_api_recording_acceptance.py::test_ac1_recorded_identities_equal_inventory -q
  - id: dod-ac2-private-corpus
    source: manual
    status: pending
    execution_scope: local_done_gate
    description: >-
      Named masks and declared mutation cleanup over the same private corpus, checked by the AC2 half of that private corpus checker at its pull request head. The acceptance probe below repeats the check against private input paths.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/acceptance/onex_api_recording_acceptance.py::test_ac2_named_masks_and_mutation_cleanup -q
  - id: dod-ac3-private-corpus
    source: manual
    status: pending
    execution_scope: local_done_gate
    description: Pending actual service recording with before/after counts for tenants, accounts and Keycloak users.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/acceptance/onex_api_recording_acceptance.py::test_ac3_count_receipt_has_no_resource_delta -q
  - id: dod-ac1-falsifier-harness
    source: generated
    status: pending
    binds_ac: [AC1]
    description: >-
      Harness falsifier for AC1: corrupt recorded sets (a route without a pair, an extra identity) are rejected by the identity check. Does not establish the private corpus.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/unit/handlers/test_handler_api_fixture_record.py -k test_ac1_ac2_reject_corrupt_recorded_sets -q
  - id: dod-ac2-falsifier-harness
    source: generated
    status: pending
    binds_ac: [AC2]
    description: >-
      Harness falsifier for AC2: a masked value with no rule and a mutating route with no cleanup are rejected, and request queries are masked by named rules. Does not establish the private corpus.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/unit/handlers/test_handler_api_fixture_record.py -k "test_ac1_ac2_reject_corrupt_recorded_sets or test_request_query_is_masked_with_named_rules" -q
  - id: dod-ac3-falsifier-harness
    source: generated
    status: pending
    binds_ac: [AC3]
    description: >-
      Harness falsifier for AC3: a leaked tenant, account or Keycloak user is detected by the before/after count check in each resource. Does not establish the private corpus.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/unit/handlers/test_handler_api_fixture_record.py -k test_ac3_detects_a_leak_in_each_resource -q
  - id: dod-recorder-harness
    source: generated
    status: pending
    description: >-
      Harness evidence only, not an acceptance-criterion completion claim. The focused test runs the contract on the in-memory transport; all failure controls run without service credentials.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/unit/handlers/test_handler_api_fixture_record.py -q
  - id: dod-private-node-readback
    source: manual
    status: pending
    execution_scope: local_done_gate
    description: >-
      Deploy/readback check: dispatch the installed node with a private validation request through its bus contract. ONEX_RECORD_VALIDATION_REQUEST must name a mode=validate request with the original inventory and actual recorded set. This remains pending until that corpus and installed revision exist; hosted CI must report it as not evaluated.
    checks:
      - check_type: command
        check_value: onex node node_api_fixture_record_effect --contract src/omnibase_infra/nodes/node_api_fixture_record_effect/contract.yaml --input ${ONEX_RECORD_VALIDATION_REQUEST} --backend event_bus=inmemory --state-root .onex_state/api-fixture-readback
  - id: dod-recorder-hosted-deploy-readback
    source: generated
    status: pending
    description: >-
      Hosted deploy check for the recorder transport change: load the real node contract, dispatch through RuntimeLocal with the in-memory bus, record 63 routes over real local HTTP sockets, and read the terminal workflow result. Route failure and a leaked account must refuse output while still reading cleanup counts. This synthetic service check does not establish private corpus acceptance.
    checks:
      - check_type: test_passes
        check_value: uv run --frozen python -m pytest tests/integration/handlers/test_api_fixture_record_contract.py -q
