schema_version: 1.0.0
ticket_id: OMN-26338
title: The omnibase_infra kernel startup runs the second TopicProvisioner scan in handler wiring and the local ingress route discovery off the event loop, so neither holds it over one second at cpus 1
summary: >-
  The two startup calls that omnibase_infra#6134 left holding the event loop for over one second at one CPU now run on a worker thread. The topic-migration executor's TopicProvisioner is built by wire_from_manifest after a warm read of its exact contract-topic request on a worker thread, so the synchronous construction finds the stored scan and provisions the same topic set; RuntimeHostProcess._start_local_ingress runs discover_runtime_local_ingress_routes through asyncio.to_thread. Errors raised in that work reach the caller as the same typed error. The health gate, the boot guard, the compose wait and the compose start period are not changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26338-startup-loop-holds-2
    statement: Neither the second TopicProvisioner scan in handler wiring nor local ingress route discovery holds the event loop for over one second at cpus 1, the wired contract set and routes are unchanged, an error in the moved work still fails startup, and no gate is weakened.
    acceptance:
      - id: AC1
        statement: "AC1: both holds are reproduced at cpus 1 on a lab host with the 1 s main-thread stack sampler and the dev contract set of the devboot3-1250 report, and each call is listed with its file:line and contiguous seconds before and after the fix under a section headed Measured loop holds, with the host, the source refs and a UTC read time -- falsifier: onex scm pr-view of the branch's PR body shows no section headed Measured loop holds listing handler_wiring.py:8947 and runtime_local_ingress.py:112 with before and after seconds and a UTC read time"
      - id: AC2
        statement: "AC2: after the fix neither the second TopicProvisioner in handler wiring nor local ingress route discovery holds the loop for over one second, and the wired contract set and routes are the same as before -- falsifier: uv run pytest tests -q -k startup_loop_hold_under_one_second fails at omnibase_infra#6134 head f2e451a3 and passes on the branch"
      - id: AC3
        statement: "AC3: an error raised in the changed provisioner or discovery work still reaches the caller as the same typed error and fails startup -- falsifier: uv run pytest tests -q -k startup_wiring_error_fails_startup fails when the error is swallowed"
      - id: AC4
        statement: "AC4: the health gate, the boot guard, the compose wait and the compose start period are unchanged and handler_wiring.py and service_kernel.py do not grow -- falsifier: git diff origin/dev --stat on the branch lists no health gate setting, no boot guard file, no compose file and no wait setting, and uv run pytest tests -q -k file_shape passes"
      - id: AC5
        statement: "AC5: a regression test built from the recorded hold data (fixture path named in the STATUS row) fails on the broken code and passes on the fix -- falsifier: uv run pytest tests -q -k startup_loop_hold_under_one_second"
      - id: AC6
        statement: "AC6: the lane STATUS row names the pushed branch stacked on omnibase_infra#6134, the holds before and after, and the path of its ready PR body -- falsifier: grep of the rolling work ledger for lane=holds2-1410 shows no STATUS row with the branch name and the holds before and after"
  - id: req-omn26338-prebuilt-stale-summary
    statement: The boot warning for a stale prebuilt node manifest names every kind of stamp difference, so a changed active package set is never hidden behind many added entry points.
    acceptance:
      - id: AC7
        statement: "AC7: with 1267 distribution_added fields and one active_packages field, as read on omni-201 on 2026-11-24, the stale-manifest boot warning names the active_packages change, the total of 1268 and the added count by package -- falsifier: uv run pytest tests/unit/runtime/test_prebuilt_manifest_stale_summary_omn26338.py -q fails at origin/dev and passes on the branch"
evidence_requirements:
  - kind: tests
    description: The startup_loop_hold_under_one_second and startup_wiring_error_fails_startup regressions built from the recorded one-CPU reproduction.
    command: uv run --frozen pytest tests/integration/runtime/test_startup_loop_hold_omn26338.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26338-ac1-measured-loop-holds
    description: "The recorded fixture holds the host, the reproduction refs, the UTC read time and each hold over one second with its call site and contiguous seconds before and after; the PR body quotes them under Measured loop holds. The PR body section itself is read by the reviewer; no runner check reads a PR body. The check also requires the fix module that produced the after figures, so it fails against the merge base, where that module does not exist."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: >-
          python3 -c "import json; d = json.load(open('tests/fixtures/omn26338/holds2_1410_loop_holds.json')); b = {x['name']: x['contiguous_s'] for x in d['holds_before']}; a = {x['name']: x['contiguous_s'] for x in d['holds_after']}; assert b['topic_migration_provisioner'] > 1 and b['local_ingress_route_discovery'] > 1 and a['topic_migration_provisioner'] <= 1 and a['local_ingress_route_discovery'] <= 1 and d['read_utc']; import pathlib; assert 'warm_topic_migration_scan' in pathlib.Path('src/omnibase_infra/handlers/topic_migration_dependencies.py').read_text()"
        cwd: .
  - id: dod-omn26338-ac2-loop-hold-under-one-second
    description: "The recorded provisioner scan and route discovery holds are replayed through the real wire_from_manifest and _start_local_ingress beside a heartbeat on the same loop; the longest heartbeat gap stays under one second, the topic set equals a cold synchronous build, and the routes equal a synchronous discovery."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_startup_loop_hold_omn26338.py -k startup_loop_hold_under_one_second -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26338-ac3-error-fails-startup
    description: "A scan error in the migration provisioner, a missing contracts root and a duplicate local ingress alias fail wiring and _start_local_ingress with the error they raised before the change. The bound command also runs the loop-hold regression, so it fails against the merge base, where the holds are still on the loop, and passes only when the error survives the move off the loop."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_startup_loop_hold_omn26338.py -k 'startup_wiring_error_fails_startup or startup_loop_hold_under_one_second' -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26338-ac4-gates-unchanged
    description: "The change edits no compose file, boot guard, healthcheck setting, start period or wait setting. handler_wiring.py shrinks, service_kernel.py is untouched, runtime_local_ingress.py is untouched and runtime_host_process.py keeps its line count; the new logic is in handlers/topic_migration_dependencies.py and models/event_bus/model_contract_topic_scan.py."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_startup_loop_hold_omn26338.py -k startup_loop_hold_under_one_second -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26338-ac5-recorded-fixture-regression
    description: "The regression replays the recorded holds from tests/fixtures/omn26338/holds2_1410_loop_holds.json and fails at omnibase_infra#6134 head f2e451a3."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_startup_loop_hold_omn26338.py -k startup_loop_hold_under_one_second -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26338-ac6-status-row
    description: "The lane STATUS row on the rolling work ledger names the pushed branch, the holds before and after and the ready PR body path. It is a ledger read, so no runner check reads it; the bound check requires this contract and the fix source the STATUS row names, so it fails against the merge base."
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: command
        check_value: grep -q warm_topic_migration_scan src/omnibase_infra/runtime/auto_wiring/handler_wiring.py
        cwd: .
  - id: dod-omn26338-deploy-wiring-warm-live
    description: >-
      Post-deploy probe: the rebuilt dev runtime container imports warm_topic_migration_scan, which this change adds to the topic migration dependencies helper, and its /health answers within 5 s with a JSON status. It reads the live container, which carries the helper only after the deploy agent has rebuilt it from this change, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: docker exec omninode-runtime python -c 'from omnibase_infra.handlers.topic_migration_dependencies import warm_topic_migration_scan'
      - check_type: command
        check_value: bash -c 'docker exec omninode-runtime curl -s -m 5 http://localhost:8085/health | grep -q "\"status\""'
  - id: dod-omn26338-ac7-prebuilt-stale-summary
    description: The stale-manifest boot warning is rendered from the 1268 differing fields recorded on omni-201 (fixture tests/fixtures/omn26338/prebuilt_manifest_stale_dev_201.json) and names the active_packages change, the total and the added count by package; a warning with few differences still lists each field.
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_stale_summary_omn26338.py -q --no-cov -n 0 -p no:randomly
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_prebuilt_manifest_stale_summary_integration_omn26338.py -q --no-cov -n 0 -p no:randomly
        cwd: .
