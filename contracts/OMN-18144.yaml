    description: "Sibling guard queue-position read for OMN-18144."
    command: "uv run pytest tests/ci/test_sibling_queue_position_omn18144.py tests/ci/test_lane_sibling_revision_omn18268.py tests/ci/test_convergence_acceptance_budget.py -q -n 0"
