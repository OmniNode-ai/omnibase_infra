schema_version: 1.0.0
ticket_id: OMN-21698
title: >-
  Handler shape burn-down in omnibase_infra: the registration orchestrator's handlers take a typed request, not an event envelope
summary: >-
  Core's handler-shape validator (omnibase_core.validation.validator_handler_shape, plan task T2.4a) reported six envelope_in_core findings under src/omnibase_infra/nodes/node_registration_orchestrator at origin/dev a409589629: the six handlers (catalog request, node heartbeat, node introspected, node registration acked, runtime tick, topic catalog query) declared handle(envelope: ModelEventEnvelope[...]) and read envelope_timestamp and envelope_id. Each handle is now handle(request: ModelInjectedRequest[...]): the typed request carries the domain event, the clock reading the runtime injects, the input id and the correlation id. The auto-wiring dispatch callback unwraps the envelope into that request, as do the node's dispatchers, so no per-node unwrapper exists and no handler names the envelope type.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21698-registration-orchestrator-injected-request
    statement: >-
      The six registration orchestrator handlers take one ModelInjectedRequest carrying the event, the injected clock reading and the input id, the runtime builds that request from the dispatch envelope, and core's handler-shape validator reports nothing for the node directory.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the registration orchestrator handlers of omnibase_infra#5497 take a typed request and name no event envelope, and the handler-shape count over them drops as the PR states -- falsifier: uv run pytest tests/unit -q over the touched handlers plus the handler-shape checker re-run on the PR paths
  - id: req-omn21698-contract-location
    statement: >-
      The acceptance items of omnibase_infra#5497 live in contracts/OMN-21698.yaml and the PR leaves contracts/OMN-21536.yaml as the base branch has it.
    acceptance:
      - id: AC2
        statement: >-
          AC2: the PR's acceptance items live in contracts/OMN-21698.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21698.yaml and not contracts/OMN-21536.yaml
evidence_requirements:
  - kind: tests
    description: The registration orchestrator handlers and the dispatch callback use the typed request.
    command: >-
      uv run pytest tests/unit/nodes/node_registration_orchestrator tests/unit/runtime/auto_wiring/test_injected_request_dispatch.py -q -n 0 -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21698-ac3-handlers-typed-request
    description: >-
      The six registration orchestrator handlers and their dispatchers use ModelInjectedRequest.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_registration_orchestrator -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21698-ac4-runtime-unwrap
    description: The auto-wiring dispatch callback builds the typed request from the dispatch envelope.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/runtime/auto_wiring/test_injected_request_dispatch.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21698-ac5-validator-clean
    description: >-
      Core's handler-shape validator reports nothing for the registration orchestrator directory.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape src/omnibase_infra/nodes/node_registration_orchestrator
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21698-deploy-injected-request
    description: >-
      Post-deploy probe: the running runtime image carries the typed request on the heartbeat handler. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          docker exec omninode-runtime python -c "import inspect; from omnibase_infra.nodes.node_registration_orchestrator.handlers.handler_node_heartbeat import HandlerNodeHeartbeat as H; assert list(inspect.signature(H.handle).parameters) == ['self', 'request']"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21698-ac2-contract-location
    description: >-
      The PR diff against origin/dev lists contracts/OMN-21698.yaml and does not list contracts/OMN-21536.yaml.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          sh -c 'files=$(git diff --name-only origin/dev...HEAD) && printf "%s\n" "$files" | grep -Fx contracts/OMN-21698.yaml && ! printf "%s\n" "$files" | grep -Fx contracts/OMN-21536.yaml'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn21698-deploy-dispatch-identity
    description: >-
      Hosted-runner runtime readback: the real dispatch engine materializes the envelope and the callback preserves the input id, timestamp and correlation id across replay. The probe fails if the callback generates metadata or reads only the materialized mapping.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/runtime/auto_wiring/test_injected_request_dispatch.py -k engine_materialization_preserves_injected_identity_on_replay -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21698-dispatch-metadata-boundary
    description: >-
      Invalid dispatch metadata names the failing envelope field and never enters the domain payload-validation fallback or reaches the handler.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/runtime/auto_wiring/test_injected_request_dispatch.py -k dispatch_metadata_failure_bypasses_payload_fallback -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21698-clock-injection
    description: >-
      The registration orchestrator handlers and dispatchers read time only through an injected clock: a fixed clock drives the handler duration and the dispatcher timestamps, and core's no-I/O-outside-effects validator reports nothing for the touched files.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_registration_orchestrator/test_registration_clock_injection_omn21698.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: >-
          uvx pre-commit@4.5.1 run check-no-io-outside-effects --from-ref origin/dev --to-ref HEAD
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21698-settings-injection
    description: >-
      The registration orchestrator's auto-ACK switch and liveness interval are declared in the node contract and reach the dispatcher and the handler module by injection: an injected value is used as given whatever the environment says, and the node package reads no environment variable.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_registration_orchestrator/test_registration_settings_injection_omn21698.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: >-
          sh -c '! grep -rnE "os\.(environ|getenv)|import os" src/omnibase_infra/nodes/node_registration_orchestrator/dispatchers src/omnibase_infra/nodes/node_registration_orchestrator/handlers'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21698-auto-ack-settings-boundary
    description: >-
      Hosted-runner dispatch readback: an empty or invalid liveness interval does not fail introspection dispatch or change its auto-ACK switch. All four cases fail on the parent product source with HANDLER_ERROR instead of SUCCESS.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_registration_orchestrator/test_registration_settings_injection_omn21698.py -k auto_ack_dispatch_does_not_parse_unrelated_liveness_setting -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
