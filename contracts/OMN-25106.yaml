schema_version: 1.0.0
ticket_id: OMN-25106
title: The dlq-replay consumer left ghost members in the onex-dlq-replay group when its start or stop was cancelled, which kept the group in a rebalance storm on the h201 dev runtime
summary: >-
  On the h201 dev runtime (read 2026-11-16, 23:14Z to 23:40Z) the onex-dlq-replay group joined 409 times and logged 308 'Heartbeat failed ... because it is rebalancing' lines, with 8 and 9 members in one generation although the handler runs one consumer at a time. DLQConsumer.start() and stop() are bounded by asyncio.wait_for in the handler; a timeout cancelled them half way and left an AIOKafkaConsumer that had joined the group with no path to stop it (11 start timeouts, 11 'Unclosed AIOKafkaConsumer' errors). DLQConsumer now ends the member it began on every failure or cancellation of start() and finishes a close that a caller stopped waiting for, bounded by member_close_timeout_seconds; a close that outlasts its bound is abandoned and its member can stay in the group until the process ends, and no shutdown drain is wired because the DLQ handler has no shutdown hook that the runtime calls. The same pull request makes the h201 deploy agent's idle restore treat a running container whose health probe failed 20 times in a row as wedged, restart it in the roll before compose waits on it (the rolling compose up recreates only a service whose configuration or image moved), and back off on a repeat wedge.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25106-dlq-ghost-member
    statement: The dev runtime's dlq-replay consumer never leaves a group member behind when its start or stop is cancelled or fails, and the dev runtime reads ready after a redeploy through the dev deploy agent.
    acceptance:
      - id: AC3
        statement: "AC3: a code defect cause, if found, is fixed at its source by a test that fails on the broken code and passes on the fix, in a draft pull request with a Lab: line -- falsifier: uv run pytest on the named test fails at the base commit and passes at the pull request head"
evidence_requirements:
  - kind: tests
    description: The DLQConsumer ghost member tests, plus the neighbouring DLQ replay unit tests.
    command: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect -q -p no:cacheprovider
  - kind: tests
    description: The dev boot guard wedged-runtime presence tests.
    command: uv run --frozen pytest tests/unit/handlers/test_handler_dev_boot_guard_wedged_presence_omn25106.py -q -p no:cacheprovider
  - kind: tests
    description: The deploy agent's wedged restore test, which restarts a running wedged container in the restore's roll and backs off on a repeat wedge.
    command: uv run --project scripts/deploy-agent --extra dev --frozen pytest scripts/deploy-agent/tests/unit/test_wedged_restore_omn25106.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25106-ac3-ghost-member-test
    description: >-
      The DLQConsumer ghost member tests fail on origin/dev (the engine has no detached close) and pass at the pull request head. They cover a cancelled start, a failing start, a start after a cancelled start, a start-start-stop with both members stopped, a cancelled and a failed stop, each arm of the CancelledError absorb and re-raise, the bounded close with its warning, the logged close failure, and a stop() whose close fails, once with a KafkaError (logged, stop returns) and once with a non-Kafka error (re-raised to the caller); the plain start and stop and the empty stop are positive controls.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect/test_dlq_consumer_no_ghost_member_omn25106.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25106-ac3-wedged-runtime-restore
    description: >-
      The h201 dev deploy agent's idle restore reads a dev runtime that is running but docker-unhealthy for 20 consecutive failed probes (10 minutes at the runtime's 30 s interval, 15 at the effects container's 45 s) as down, the restore's roll restarts the wedged container before compose waits on it, and the agent waits out RESTORE_RETRY_AFTER before it restores a repeat wedge, all through its own local path with no bus command. Measured 2026-11-17: omninode-runtime running, unhealthy, FailingStreak 72, and the presence read said running. Both test files fail on the previous pull request head, where the roll has no restart and a paused unhealthy container reads down.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_dev_boot_guard_wedged_presence_omn25106.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev --frozen pytest scripts/deploy-agent/tests/unit/test_wedged_restore_omn25106.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25106-deploy
    description: Hosted-runner probe that reads the committed boot guard handler from GitHub at the checked-out commit and requires the wedged restart and its call in the restore's roll step. The live read on the h201 dev agent follows an install of this branch.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_dev_boot_guard.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; src = sys.stdin.read(); assert "def restart_if_wedged" in src; assert "restart_if_wedged(" in src.split("def run_runtime_roll_step")[1].split("\ndef ")[0]'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25106-ac3-neighbours-hold
    description: >-
      The existing DLQ replay unit tests, including the OMN-17137 lifecycle bound tests, still pass with the consumer's start and stop changed.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
