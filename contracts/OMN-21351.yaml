schema_version: "1.0.0"
ticket_id: OMN-21351
title: Third-party dependency bumps ride the release train; no repository opens its own Dependabot version-update pull requests
summary: omnibase_infra drops its Dependabot version-update schedules, adds the registry-wide ratchet that refuses a schedule in any registry clone's .github/dependabot.yml, and has the release train refresh third-party locked dependencies once per run inside its own release pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-no-dependabot-version-updates
    statement: No registry repository's .github/dependabot.yml declares a version-update schedule, and a ratchet in the repository that owns registry-wide CI ratchets refuses one.
    acceptance:
      - id: AC1
        statement: 'AC1: no registry repository''s .github/dependabot.yml declares a version-update schedule (security alerts stay on) -- falsifier: uv run pytest tests/ci/test_no_dependabot_version_updates_omn21351.py tests/ci/test_dependabot_sibling_pins_omn17427.py, a ratchet over every registry clone''s dependabot.yml seeded with a planted schedule as positive control'
  - id: req-release-train-dependency-refresh
    statement: The release train refreshes third-party locked dependencies once per train run, in the train's own pull request, covered by the lab evidence the train already requires.
    acceptance:
      - id: AC2
        statement: 'AC2: the release train refreshes third-party locked dependencies once per train run, in the train''s own pull request, and its lab evidence covers that refresh -- falsifier: uv run pytest tests -k release_train_dependency_refresh over the train policy and its step'
evidence_requirements:
  - kind: tests
    description: The ratchet over this repository's dependabot.yml and every registry clone, with a planted schedule as positive control.
    command: uv run --frozen pytest tests/ci/test_no_dependabot_version_updates_omn21351.py tests/ci/test_dependabot_sibling_pins_omn17427.py -q
  - kind: tests
    description: The train policy declares the refresh, the step is fenced to third-party packages and runs once in the release pull request's own cut step, and the lock is runtime-affecting for the existing rebuild trigger.
    command: uv run --frozen pytest tests/scripts/test_release_train_dependency_refresh_omn21351.py tests/ci/test_release_train_dependency_refresh_live_omn21351.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-no-dependabot-version-updates-ac1
    description: The ratchet passes with this repository's .github/dependabot.yml removed, and its positive controls show a planted schedule, both ecosystems, a missing file and malformed YAML are each handled as the ratchet says.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_no_dependabot_version_updates_omn21351.py tests/ci/test_dependabot_sibling_pins_omn17427.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-release-train-dependency-refresh-ac2
    description: The refresh tests read the real train policy and the cut step of release-train-nightly.yml, run the refresh against a synthetic lock with an injected uv, and check that uv.lock is runtime-affecting for the existing lab rebuild trigger.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/scripts/test_release_train_dependency_refresh_omn21351.py tests/ci/test_release_train_dependency_refresh_live_omn21351.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
