schema_version: 1.0.0
ticket_id: OMN-26609
title: "an unsequenced live ledger row is dead-lettered once and never replayed"
summary: >-
  The dev runtime's work-ledger projection consumer refused 206 unsequenced adopt-merged STATUS rows (omnimarket's UnsequencedLiveRowError, OMN-23488), dead-lettered each as ProjectionWedgeExhaustedError, and the DLQ replay node replayed each dead letter up to 5 times, so the one-partition consumer stayed at about 7 s per record and STATUS rows were read 1902 s to 2154 s late. The non-retryable category enum now names UnsequencedLiveRowError, so the replay node skips every dead letter that carries it. The omnimarket refusal is not touched. The classifier half (dead-letter at once instead of 6 redeliveries) is not in this change, because the node-boundary import gate refuses an infra string naming the omnimarket node module. This change does not satisfy the ticket's own criteria (the work-ledger answerer, the reader exit 69, pr-create).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26609-unsequenced-row-dead-lettered-once
    statement: The DLQ replay node never replays a dead letter that names omnimarket's UnsequencedLiveRowError.
    acceptance:
      - id: AC6
        statement: "AC6: the dead letter of an UnsequencedLiveRowError refusal is not replayed -- falsifier: uv run pytest tests/unit/runtime/auto_wiring/test_omn26609_unsequenced_live_row_poison.py fails 4 of 5 at origin/dev d91c4be66 and passes 5 of 5 on the PR branch"
evidence_requirements:
  - kind: tests
    description: The enum category and the replay decision for the real dead-letter text of the 2026-11-24 incident, with one positive control.
    command: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn26609_unsequenced_live_row_poison.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26609-ac6-unsequenced-row-poison
    description: The real dead-letter text is non-retryable at retry counts 0, 1 and 2; a transient connection-error dead letter is still replayed.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn26609_unsequenced_live_row_poison.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26609-deploy
    description: Hosted-runner probe that reads the committed non-retryable enum from GitHub at the checked-out commit and requires the UnsequencedLiveRowError member in it.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/enums/enum_non_retryable_error_category.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -q 'UnsequencedLiveRowError'
        cwd: ${OMNI_HOME}/omnibase_infra
