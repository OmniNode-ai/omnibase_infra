schema_version: "1.0.0"
ticket_id: OMN-21611
title: "The stability lane runs a pinned release independent of dev: its refresh refuses every ref that is not a release tag"
summary: >-
  refresh_stability_lane.sh now runs release tags only. Its tag set comes from the committed pin file (config/lab/stability-lane-pin.yaml under ONEX_WORKSPACE_CONFIG_ROOT, or --pin-file), one v<major>.<minor>.<patch> tag each for omnibase_infra, omnibase_core, omnibase_compat and omnimarket, with --ref overriding the infra tag. Before it reads the lane, writes state, takes the lane lock, runs the attribution preflight, tags an image, checks a clone out, builds or restarts anything, each tag must be a release tag of its clone: a dev tag, a bare sha, a branch, a lab tag or a dev omnimarket ref is refused, exit 64, naming release-tag-only. The default ref is no longer origin/dev. Each sibling is staged at its own pinned tag through DEPLOY_SIBLING_REFS (stage_workspace.sh passes it to deploy_source_ref.py as --repo-ref), and the lane no longer follows omnimarket's newest dev-* tag. This PR covers AC2, and AC1's repository side: the refresh deploys exactly the committed pin. The pin file and the stability broker ACL declaration live in the private config repository. AC1's /health readback, AC3 and AC4 need the lane brought up on its lab host and broker logins issued, which this change does not do; they are listed so the criteria match the ticket and are left unbound here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21611-release-only-refresh
    statement: >-
      A stability refresh runs a pinned release set and refuses any other ref before it changes anything.
    # Criterion text is the ticket's, with the lab host's name replaced by "the lab host" and the lane's
    # environment and lab tool names described generically for this public repository; drift is judged by label.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the lab host's stability lane reports the committed release pin and its own environment, with every required contract attached -- falsifier: curl -s of the lane's /health on the lab host piped to jq '.version, .details.event_bus.environment, .details.components.runtime_wiring.status' prints the pin from the committed pin file, the stability lane's environment name and healthy
      - id: AC2
        statement: >-
          AC2: a stability refresh asked for a dev tag, a bare sha or a dev omnimarket ref is refused before it changes anything -- falsifier: uv run pytest tests/unit/scripts/ -k stability_release_only -q in omnibase_infra
      - id: AC3
        statement: >-
          AC3: the cloud owner's and the dashboard owner's machines reach the lane broker with their own per-machine logins, and the cloud owner's two dev-broker logins no longer exist -- falsifier: the lab broker ACL check against the stability ACL file reports zero missing rows, and the dev broker's user list names neither of the cloud owner's dev logins
      - id: AC4
        statement: >-
          AC4: OMN-21605 AC1 holds: a deployed-lane delegation on the lab host's lane returns an accepted answer -- falsifier: onex delegate with --lane naming the lab host's lane and --locus deployed-lane returns status success and quality_gate_passed true
evidence_requirements:
  - kind: tests
    description: >-
      The refresh, run against real fixture clones with docker, curl, jq, git and the deploy command shimmed and recorded, refuses a dev tag, a bare sha, a branch, a lab tag, a dev omnimarket ref, a missing pin and a tag absent from its clone with exit 64 and no docker, deploy or mutating git call, and plans the pinned release set.
    command: uv run --frozen pytest tests/unit/scripts/ -k stability_release_only -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21611-ac2-release-only-refusal
    description: >-
      The ticket's falsifier. Each refusal case runs the real refresh script against fixture clones under PATH shims and asserts exit 64, release-tag-only, the refused ref named, no docker, curl, jq or deploy call, no git checkout, fetch, reset, tag, worktree or clean, and no state directory. At the merge base the script defaults to origin/dev, has no guard and no --pin-file, so the refusal cases fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/ -k stability_release_only -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
  - id: dod-omn21611-ac2-deploy-probe
    description: >-
      Deploy probe. The refresh script GitHub serves at the checked-out commit carries the release-only guard's refusal line. The probe reads the file from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/scripts/runtime_build/refresh_stability_lane.sh?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'is not a v<major>.<minor>.<patch> release tag of' | grep -qx 1"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
  - id: dod-omn21611-ac1-refresh-plans-the-pin
    description: >-
      Hosted stand-in for AC1's repository side: with ONEX_WORKSPACE_CONFIG_ROOT naming a workspace config root that holds config/lab/stability-lane-pin.yaml, the refresh plans exactly the committed pin (the infra tag and each sibling tag), and --ref overrides only the infra tag. The /health readback on the lab host is the lane proof and is not run by the hosted verifier. At the merge base the refresh ignores the pin and plans origin/dev, so both cases fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/test_stability_release_only_omn21611.py -q -n 0 -p no:cacheprovider -k "plans_the_pinned_release_set or ref_overrides_the_pinned_infra_tag"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
