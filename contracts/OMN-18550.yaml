schema_version: "1.0.0"
ticket_id: OMN-18550
title: A runtime that cannot boot stops retrying and records a boot-failed event
summary: The runtime entrypoint counts consecutive failing boots in a durable ledger on the runtime data volume, publishes a runtime-boot-failed event carrying the cause and the count for each, and after the declared bound stops retrying instead of booting again.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18550
    statement: After a declared number of consecutive failing boots the runtime container stops retrying, and each failing boot is recorded as an event with its cause and count, not only as a log line.
    acceptance:
      - id: AC5
        statement: 'AC5: A restart loop on a failing boot is bounded at a declared count and each failing exit is durably recorded as an event with its cause and count -- falsifier: uv run pytest tests/unit/runtime/test_entrypoint_boot_failure_omn18550.py -q'
evidence_requirements:
  - kind: tests
    description: The real entrypoint, relaunched against a malformed runtime contract, records three failing boots and then stops booting.
    command: uv run pytest tests/integration/runtime/test_entrypoint_boot_failure_omn18550.py -q -m integration
  - kind: tests
    description: Unit tests cover the counted streak, the bound that parks the container, the new-image and new-container resets, and the event cause and count.
    command: uv run pytest tests/unit/runtime/test_entrypoint_boot_failure_omn18550.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-18550-ac5
    description: Unit tests cover the counted streak, the bound that parks the container, the new-image and new-container resets, and the event cause and count.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_entrypoint_boot_failure_omn18550.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn-18550-ac5-deploy
    description: The evaluated revision of the runtime entrypoint carries the boot-failure supervisor that bounds the restart loop.
    source: manual
    checks:
      - check_type: command
        # Consume the complete decoded file so pipefail does not report SIGPIPE
        # from base64 after an early successful match.
        check_value: gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/entrypoint_preflight.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F 'RETRIES EXHAUSTED' > /dev/null
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
