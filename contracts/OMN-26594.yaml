schema_version: 1.0.0
ticket_id: OMN-26594
title: 'a lazy start of a db_io contract wires with the boot database topology'
summary: 'On the dev runtime booted 2026-11-23T14:15:39Z, projection_metering_summary and eight more db_io contracts were dormant and failed every lazy start with "declares db_io but wire_from_manifest received no checked-in ModelDeploymentTopology", because LazyStartRuntimeTransaction.build called wire_from_manifest without the topology the kernel loads at boot. The kernel now hands that topology to boot_manifest, the dormant store keeps it, the ingress passes it to the transaction and the transaction passes it to wire_from_manifest.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26594-lazy-start-topology
    statement: A dormant contract that declares db_io is wired by its first-request start with the same checked-in database topology the boot wires with.
    acceptance:
      - id: AC1
        statement: 'AC1: a test fails at origin/dev and passes with the fix: the transaction hands its topology to wire_from_manifest, boot_manifest keeps it with the dormant contracts, and the ingress builds its transaction with it -- falsifier: uv run pytest tests/unit/runtime/test_lazy_start_db_io_topology_omn26594.py -q -n 0 --no-cov -p no:cacheprovider fails at origin/dev and passes at the branch head'
      - id: AC2
        statement: 'AC2: the existing lazy-start tests still pass -- falsifier: uv run pytest tests/unit/runtime/test_lazy_start_first_request.py tests/unit/runtime/test_lazy_start_handover_wake_omn21753.py -q -n 0 --no-cov -p no:cacheprovider reports a failure'
      - id: AC3
        statement: 'AC3: on the running dev runtime after the deploy agent applies the change, the log of omninode-runtime holds no "did not start" line for projection_metering_summary in a 15 minute window after its first refresh request -- falsifier: the probe command exits non-zero'
  - id: req-omn26594-lazy-attach-standalone-runner
    statement: A first-request or first-message wake of a contract whose boot subscription is deliberately skipped for having no live dispatcher completes, as it does at boot, instead of failing with did not attach.
    acceptance:
      - id: AC4
        statement: 'AC4: a test fails at origin/dev and passes with the fix: LazyStartRuntimeTransaction.attach returns for a contract the boot subscribe step excludes as NO_LIVE_DISPATCHER and still raises did not attach for an empty attach with no such exclusion -- falsifier: uv run pytest tests/unit/runtime/test_lazy_start_attach_no_live_dispatcher_omn26594.py -q -n 0 --no-cov -p no:cacheprovider fails at origin/dev and passes at the branch head'
      - id: AC5
        statement: 'AC5: on the running dev runtime after the deploy agent applies the change, the log of omninode-runtime holds no did not attach line for node_projection_skill_executions, projection_llm_cost or node_projection_cost_by_repo in a 15 minute window after a message to their topics -- falsifier: the probe command exits non-zero'
  - id: req-omn26594-lazy-wake-handler-dependencies
    statement: A first-request or first-message wake wires a dormant contract's handler with the constructor dependencies the boot built for the runtime-owned handlers.
    acceptance:
      - id: AC6
        statement: 'AC6: a test fails at origin/dev and passes with the fix: a lazy start of the real node_runtime_manifest_reducer contract wires with the kernel dependency map and is refused without it, the dormant store keeps the map and the ingress hands it to the transaction -- falsifier: uv run pytest tests/unit/runtime/test_lazy_start_handler_dependencies_omn26594.py -q -n 0 --no-cov -p no:cacheprovider fails at origin/dev and passes at the branch head'
      - id: AC7
        statement: 'AC7: on the running dev runtime after the deploy agent applies the change, the log of omninode-runtime holds no requires constructor parameters line for node_dlq_replay_effect or node_runtime_manifest_reducer in a 15 minute window after a message to their topics -- falsifier: the probe command exits non-zero'
evidence_requirements:
  - kind: tests
    description: The OMN-26594 test and the existing lazy-start tests pass at the pushed head.
    command: uv run pytest tests/unit/runtime/test_lazy_start_db_io_topology_omn26594.py tests/unit/runtime/test_lazy_start_first_request.py tests/unit/runtime/test_lazy_start_handover_wake_omn21753.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26594-ac1
    description: 'AC1: the topology reaches wire_from_manifest through boot_manifest, the dormant store, the ingress and the transaction.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_lazy_start_db_io_topology_omn26594.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26594-ac2
    description: 'AC2: the lazy-start first-request and handover-wake tests pass beside the OMN-26594 test, so the check fails at the merge base where that test file is absent (must-fail control).'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_lazy_start_db_io_topology_omn26594.py tests/unit/runtime/test_lazy_start_first_request.py tests/unit/runtime/test_lazy_start_handover_wake_omn21753.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26594-ac3
    description: 'AC3: the test that fails at origin/dev pins the hand-over of the topology; the dev log read below is the deploy-time check.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_lazy_start_db_io_topology_omn26594.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26594-ac3-deploy-probe
    description: 'AC3: read on the dev runtime on omni-201 only after the deploy agent applies the merged change; hosted CI cannot reach it, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          ssh omni-201 '! docker logs --since 15m omninode-runtime 2>&1 | grep -q "Lazy start: contract .projection_metering_summary. did not start"'
        cwd: .
  - id: dod-omn26594-ac4
    description: 'AC4: the attach of a NO_LIVE_DISPATCHER contract returns, and an empty attach with no such exclusion still raises; the test file is absent at the merge base so the check fails there (must-fail control).'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_lazy_start_attach_no_live_dispatcher_omn26594.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26594-ac5-deploy-probe
    description: 'AC5: read on the dev runtime on omni-201 only after the deploy agent applies the merged change; hosted CI cannot reach it, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC5
    checks:
      - check_type: command
        check_value: |-
          ssh omni-201 '! docker logs --since 15m omninode-runtime 2>&1 | grep -qE "contract .(node_projection_skill_executions|projection_llm_cost|node_projection_cost_by_repo). did not attach"'
        cwd: .
  - id: dod-omn26594-ac6
    description: 'AC6: the real node_runtime_manifest_reducer contract wires through the lazy transaction with the kernel dependency map and is refused without it; the test file is absent at the merge base so the check fails there (must-fail control).'
    source: manual
    binds_ac:
      - AC6
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_lazy_start_handler_dependencies_omn26594.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26594-ac7-deploy-probe
    description: 'AC7: read on the dev runtime on omni-201 only after the deploy agent applies the merged change; hosted CI cannot reach it, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC7
    checks:
      - check_type: command
        check_value: |-
          ssh omni-201 '! docker logs --since 15m omninode-runtime 2>&1 | grep -qE "(HandlerDlqReplay|HandlerPostgresRuntimeManifestInsert) requires constructor parameters"'
        cwd: .
  - id: dod-omn26594-integration-proof
    description: 'The real local database topology profile loads at boot and reaches wire_from_manifest through a real lazy-start transaction.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/runtime/test_lazy_start_db_io_topology_omn26594.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26594-handler-deps-integration-proof
    description: 'The real node_runtime_manifest_reducer contract wires through a real lazy-start transaction with the kernel dependency map.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/runtime/test_lazy_start_handler_dependencies_omn26594.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
