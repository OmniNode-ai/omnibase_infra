title: Ownership declarations and vendored migrations for the goal trace projection
summary: >-
  Vendors the node_projection_goal_trace migrations (goal_trace_events and goal_traces, and the omninode_runtime grants) byte for byte from omnimarket. Adds checksum-bound ledger rows and migration classes. This is the infrastructure half of the goal-trace projection; omnimarket's node-migration vendor parity gate needs it before the node lands.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23341-infra-vendor
    statement: >-
      The two vendored migrations retain the source bytes, each has exactly one checksum-bound ledger row and the correct class, and none is fenced.
    acceptance:
      - id: AC1
        statement: "AC1: the ownership declarations and the vendored migrations are merged on dev with their own contract file -- falsifier: uv run pytest tests -q -k ownership against omnimarket dev after the merge"
