schema_version: "1.0.0"
ticket_id: OMN-22123
title: The reserved merge-queue label omnibase-ci-mq has declared runners on h051 and h053
summary: >-
  This contract covers the repository side of giving the merge queue runners. A merge_group job of a private repository asks for the reserved label omnibase-ci-mq; the runners that carried it lived on a host now in repair and the fleet config declared none, so each job waited 14 to 60 minutes. The fleet config now declares a merge-queue pool of four runners on each of h051 and h053, each with its own compose file, labelled omnibase-ci-mq alone. Registering the runners needs an org registration token minted by an org administrator and the installer run on each host; that is a runtime step that follows the merge and is not claimed here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-mq-pool-declared
    statement: The fleet config declares four merge-queue runners on h051 and four on h053, every one labelled with the reserved merge-queue label and no shared label, and no other class count moves.
    acceptance:
      - id: AC1
        statement: The fleet config declares a merge-queue pool of four runners on each of h051 and h053, each compose file names exactly those four runners with the labels self-hosted, omnibase-ci-mq, linux, x64 and arch-amd64 and the scratch directories of their own.
      - id: AC2
        statement: The declaration moves no other class count, so the action count of h051 stays 0 and the action count of h053 stays 8.
  - id: req-mq-pool-timezone-database
    statement: Every merge-queue runner reads the host timezone database read-only, because the runner image carries none and the merge-group tests resolve America/New_York.
    acceptance:
      - id: AC3
        statement: Each of the four runner services in both merge-queue compose files mounts the host /usr/share/zoneinfo at the same path in the container, read-only.
  - id: req-h051-mq-memory-drive
    statement: The four h051 merge-queue runners keep their job directories in container tmpfs mounts and have the memory and CPU capacity required by their jobs.
    acceptance:
      - id: AC4
        statement: Every h051 merge-queue runner mounts its workspace, TMPDIR and six package caches as size-bounded tmpfs entries, with no job directory or cache bound to disk.
      - id: AC5
        statement: All eight tmpfs mounts of every h051 merge-queue runner explicitly allow exec so job interpreters and compiled extensions can load.
      - id: AC6
        statement: Every h051 merge-queue runner declares workspace and TMPDIR tmpfs ceilings of at least 12 GiB to exceed the lane probe's 10 GiB free-space floor.
      - id: AC7
        statement: Every h051 merge-queue runner has a memory limit of at least 10 GiB with memswap_limit equal to mem_limit so its tmpfs pages cannot swap to disk.
      - id: AC8
        statement: Every h051 merge-queue runner has a CPU quota of at least four CPUs for the slower host cores.
  - id: req-lane-tmp-age-bound
    statement: Retired pytest scratch under the host's /tmp is age bound without sweeping live test, lane or service trees; custom TMPDIR, basetemp and PrivateTmp namespaces need their owners' cleanup policies.
    acceptance:
      - id: AC9
        statement: deploy/disk-gc/onex-lane-tmp.tmpfiles.conf bounds retired pytest garbage trees under /tmp at 12h, removes their empty directories and leaves every other entry, including numbered pytest runs, locks, stray files, lane trees and service directories untouched.
evidence_requirements:
  - kind: tests
    description: The merge-queue pool declaration test and the existing pool and fleet tests pass.
    command: uv run pytest tests/ci/test_ci_mq_pool_omn22123.py tests/ci/test_hp053_pool_omn22111.py tests/ci/test_hp051_pool_omn17232.py tests/ci/test_runner_pool_spread_omn19895.py -q -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-mq-pool-declared
    description: The fleet config and both compose files agree on the four merge-queue runners per host and their labels.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-h051-mq-memory-drive
    description: The four h051 runners keep all eight job and cache directories in size-bounded tmpfs mounts and bind no disk-backed job directory.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly -k every_merge_queue_job_directory_is_a_tmpfs
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-h051-mq-tmpfs-exec
    description: Each of the eight in-memory directories explicitly permits execution and none declares noexec.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly -k every_in_memory_directory_allows_exec
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-h051-mq-tmpfs-capacity
    description: Workspace and TMPDIR ceilings exceed the lane probe's free-space floor on every h051 runner.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly -k job_directories_leave_the_free_space
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-h051-mq-memory-limit
    description: The memory limit covers at least 10 GiB and the equal memory-plus-swap limit prevents swapping the in-memory directories.
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly -k memory_limit_covers_the_tmpfs
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-h051-mq-cpu-quota
    description: The h051 CPU quota is at least four CPUs on each merge-queue runner.
    source: manual
    binds_ac: [AC8]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly -k cpu_quota_matches_the_slower_host_cores
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-h051-mq-memory-drive-source-readback
    description: Hosted configuration probe reads the h051 compose file through the GitHub contents API at the evaluated commit and parses the four services, requiring eight executable size-bounded tmpfs entries, no scratch-disk mounts, 10 GiB memory without swap and five CPUs. It fails on the merge base's disk-backed services and requires no Docker daemon or lab access. This checks the published deployment definition only.
    source: manual
    binds_ac: [AC4, AC5, AC7, AC8]
    checks:
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.runners-hp051-ci-mq-runner.yml?ref=$(git rev-parse HEAD)" --jq .content | env PYTHONDONTWRITEBYTECODE=1 uv run python -c '\''import base64, sys, yaml; document = yaml.safe_load(base64.b64decode(sys.stdin.read())); services = document["services"]; assert len(services) == 4; assert all(s["mem_limit"] == "10g" and s["memswap_limit"] == "10g" and float(s["cpus"]) == 5.0 for s in services.values()); assert all(len(s.get("tmpfs", [])) == 8 and all(":exec,mode=1777,size=" in entry for entry in s["tmpfs"]) for s in services.values()); assert all("/data/scratch" not in repr(s["volumes"]) for s in services.values())'\'''
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-no-other-class-moves
    description: The action and verify counts of h051 and h053 read what they read before the declaration.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly -k "other_class"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-mq-pool-timezone-database
    description: Both merge-queue compose files mount the host timezone database read-only in every runner service.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_ci_mq_pool_omn22123.py -q --no-cov -p no:randomly -k "timezone_database"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-mq-pool-source-readback
    description: Hermetic readback of both merge-queue compose files at the evaluated commit; the fourth runner service of each is absent at the merge base.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'for p in hp051 hp053; do gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.runners-${p}-ci-mq-runner.yml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "${p}-ci-mq-runner-4" > /dev/null; done'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-lane-tmp-age-bound
    description: The unit suite pins the exact complement exclusion rules without approximating systemd glob semantics. The Linux integration suite requires systemd-tmpfiles, preserves fresh fixtures with the unchanged 12h rules, then scales only the age to verify retired removal and preservation of numbered runs, dot entries, nested excluded trees, stray names, symlinks and empty parents.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/scripts/test_lane_tmp_sweep.py tests/integration/scripts/test_lane_tmp_sweep.py -q --no-cov -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-lane-tmp-published-definition
    description: Hosted deployment-definition readback fetches the tmpfiles configuration at the evaluated commit through the GitHub contents API. It requires a 12h parent rule, exclusions for numbered runs, locks and stray names, and no exclusion of retired garbage. This probes the published definition only; installation and custom temporary namespaces remain the host owner's responsibility.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnibase_infra/contents/deploy/disk-gc/onex-lane-tmp.tmpfiles.conf?ref=$(git rev-parse HEAD)" --jq .content | env PYTHONDONTWRITEBYTECODE=1 uv run python -c '\''import base64, sys; text = base64.b64decode(sys.stdin.read()).decode(); rows = [line.split() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]; assert all(len(row) == 6 for row in rows); assert [row for row in rows if row[0] == "e"] == [["e", "/tmp/pytest-of-*", "-", "-", "-", "12h"]]; exclusions = [row[1] for row in rows if row[0] == "x"]; prefix = "/tmp/pytest-of-*/"; expected = [prefix + ".*", prefix + "[!g]*"]; [expected.extend((prefix + "garbage-"[:i], prefix + "garbage-"[:i] + "[!" + char + "]*")) for i, char in enumerate("garbage-"[1:], 1)]; assert exclusions == expected'\'''
        cwd: ${OMNI_HOME}/omnibase_infra
