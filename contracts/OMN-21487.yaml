schema_version: 1.0.0
ticket_id: OMN-21487
title: The dev deploy agent builds the estimator page image before recreation
summary: >-
  Deploy-side portion only. The host build effect resolves the web dev head in an isolated checkout and builds its Dockerfile when the tagged image is absent, stale or unstamped. Source labels are verified before the existing recreate. The dev compose declaration passes the runtime gate settings from the host environment. The web repository owns the merge publisher; end-to-end merge delivery, credential materialization and serving-host readback remain live verification obligations and are not represented as unit-test evidence.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21487-estimator-image-delivery
    statement: Deploy-side statements for the ticket acceptance criteria; the ticket's live falsifiers remain unchanged and open until deployment readback.
    acceptance:
      - id: AC1
        statement: 'AC1: the deploy agent builds the newest declared web development branch revision before recreating the estimator page, reusing an image only when its source labels match that revision.'
      - id: AC2
        statement: 'AC2: the deploy agent builds an absent estimator page image before recreation, and a failed source checkout, build or revision readback refuses recreation.'
evidence_requirements:
  - kind: tests
    description: Exercise the real deploy-agent build boundary with controlled Git and Docker responses, including absent images, advanced source revisions and refusal controls.
    command: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_cost_estimator_build_omn21487.py -q --no-cov -p no:randomly
  - kind: tests
    description: Drive the delivery from the shipped node contract against a real Git source repository and a stand-in container engine on PATH.
    command: uv run --frozen pytest tests/integration/docker/test_cost_estimator_build_delivery_omn21487.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21487-ac1-deploy-side-build
    description: >-
      Deploy-side mechanism for AC1: a changed web revision is built and stamped, an unchanged revision is reused, and non-dev or disabled instances do no estimator work. This does not certify the web repository's merge publisher or a live serving container.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_cost_estimator_build_omn21487.py -q --no-cov -p no:randomly
  - id: dod-omn21487-ac2-missing-image
    description: >-
      Deploy-agent build-boundary regression for AC2: an absent local image causes a build, source/build failures abort and mismatched labels refuse progress. All subprocesses are controlled; this hosted-runner check needs no Docker daemon, credential or lab host. Live image removal is not claimed.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_cost_estimator_build_omn21487.py -q --no-cov -p no:randomly
  - id: dod-omn21487-ac1-ac2-delivery-integration
    description: >-
      Integration regression for AC1 and AC2: the shipped node contract supplies the build recipe, a real Git clone resolves the web head, an absent image is built and stamped, an unchanged head is reused, an advanced head rebuilds, and an unreachable source or missing source setting refuses before any engine call. Only the container engine is a stand-in executable; this is not a live build on a lab host.
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/docker/test_cost_estimator_build_delivery_omn21487.py -q --no-cov -p no:randomly
  - id: dod-omn21487-deploy-probe
    description: >-
      Deploy probe for the delivery change: read the build handler and the dev compose declaration from GitHub at the evaluated checkout's commit and require the estimator build entry point and the gate settings the compose passes through. This does not deploy a service or claim a lab host serves the page; the live build, password materialization and serving readback remain separate obligations. The probe fails on the merge base, which has neither the handler nor the setting.
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_cost_estimator_build.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F 'class HandlerCostEstimatorBuild' > /dev/null && gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.dev-lane.yml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F 'ESTIMATOR_GATE_PASSWORD' > /dev/null
        cwd: ${OMNI_HOME}/omnibase_infra
