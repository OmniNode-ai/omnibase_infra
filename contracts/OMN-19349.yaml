schema_version: 1.0.0
ticket_id: OMN-19349
title: The deploy agent recreates onex-api on every dev-lane job, because a re-stamped image of the same source commit counts as a pin advance
summary: omnibase_infra#4029 makes deliver_onex_api_pin treat a newer stamp of the pinned source commit as no pin advance, so it does not recreate onex-api, while a descendant commit still advances the pin and recreates only onex-api. This contract records the acceptance-criterion bindings a second lane accepted.
