evidence_requirements:
  - kind: tests
    description: 'AC1: a newer-stamped resident image of the pinned sha8 driven through deliver_onex_api_pin records tag_advanced false and recreated false. Fails with scripts/runtime_build/repoint_dev_lane_onex_api.py restored from the parent of omnibase_infra#4029.'
    command: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_onex_api_same_commit_restamp_omn19349.py::test_a_newer_stamp_of_the_pinned_commit_does_not_recreate_onex_api -q -p no:cacheprovider
  - kind: tests
    description: 'AC2: a descendant sha8 driven through deliver_onex_api_pin records tag_advanced true and recreated true, through a --no-deps --force-recreate of the onex-api service only. A preservation check: the behaviour predates omnibase_infra#4029 and also passes with its product file reverted.'
    command: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_onex_api_same_commit_restamp_omn19349.py::test_a_descendant_commit_still_advances_and_recreates_only_onex_api -q -p no:cacheprovider
