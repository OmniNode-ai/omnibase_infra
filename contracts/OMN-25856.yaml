  - id: dod-omn25856-contracts-stamp-before-core-overlay
    description: The Dockerfile stamps the checkout's runtime contracts before the packaged runtime_data replaces them, so the checkout's own mounted contracts match the stamp; the stamp taken after that replacement fails this test.
