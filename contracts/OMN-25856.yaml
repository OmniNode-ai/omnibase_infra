schema_version: 1.0.0
ticket_id: OMN-25856
title: "node_dlq_replay_effect never replays a command its publisher malformed"
summary: >-
  should_replay now refuses a dead letter whose failure_class is publisher_malformed, read from the envelope's own failure_class key (a new typed field on the parsed DLQ message) or from the failure_class marker in the reason text. The handler counts the record as quarantined and the quarantine producer keeps it on the quarantine topic with the refusal reason; a transient failure is still replayed. Measured on the dev lane over 24 h to 2026-11-24T17:28Z, 935 of 935 delegate-skill dead letters were this class and 640 extra delegate-skill-failed events came from replaying them; the same read found no billed-twice or answered-twice delegation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25856-publisher-malformed-not-replayed
    statement: A dead letter classified publisher_malformed is never published back to its original topic; it is counted as quarantined and kept on the quarantine topic with its reason, and a transient failure is still replayed.
    acceptance:
      - id: AC25856001
        statement: "AC25856001: should_replay refuses a publisher_malformed dead letter on its first attempt, the handler counts it quarantined with its reason and replays nothing, and a transient failure is still replayed -- falsifier: uv run pytest tests/unit/nodes/node_dlq_replay_effect/test_omn25856_publisher_malformed_not_replayed.py fails at origin/dev and passes on the PR branch"
  - id: req-omn25856-gate-required-boot-set
    statement: The runtime joins at boot only the contracts the readiness gate requires plus the priority contracts, and every other contract starts from earliest on its first record.
    acceptance:
      - id: AC25856002
        statement: "AC25856002: with boot_subscriptions policy gate_required, a contract on a retained non-command topic is not joined at boot and a priority contract, a command contract in use and a contract on an unreadable topic are -- falsifier: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn25856_gate_required_boot_set.py fails at origin/dev (no gate_required policy) and passes on the PR branch"
      - id: AC25856003
        statement: "AC25856003: a deferred contract joins from earliest when the first record reaches one of its topics, so that record is not lost -- falsifier: the test_a_deferred_contract_starts_from_earliest_on_its_first_record case fails at origin/dev and passes on the PR branch"
evidence_requirements:
  - kind: tests
    description: The publisher-malformed refusal, the handler's quarantine count and the transient-failure control.
    command: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect tests/unit/runtime/auto_wiring/test_omn21324_delegate_skill_undecodable_body.py -q --no-cov -n 0 -p no:randomly
  - kind: tests
    description: The gate_required boot set, the unchanged in_use policy and the first-record start from earliest.
    command: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn25856_gate_required_boot_set.py tests/unit/runtime/auto_wiring/test_omn18087_boot_subscribes_only_topics_in_use.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25856-malformed-not-replayed
    description: A publisher_malformed dead letter is refused by should_replay and counted quarantined by the handler with no replay publish; transient failure classes are still replayed.
    source: manual
    binds_ac: [AC25856001]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect/test_omn25856_publisher_malformed_not_replayed.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn25856-deploy-engine-clause
    description: 'Deploy scope: the replay engine at the checked-out commit, read from GitHub at that commit, carries the publisher_malformed refusal that the OMN-25856 clause adds to should_replay.'
    source: manual
    binds_ac: [AC25856001]
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_dlq_replay_effect/engine_dlq_replay.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "Publisher-malformed command: failure_class=" >/dev/null'
        cwd: .
  - id: dod-omn25856-integration-coverage
    description: The real consumer, replay producer, quarantine producer and handler quarantine a publisher_malformed dead letter and still replay a transient one.
    source: manual
    binds_ac: [AC25856001]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/dlq/test_dlq_replay_publisher_malformed_omn25856.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn25856-gate-required-boot-set
    description: A retained projection is deferred under gate_required and joined under in_use; command, priority and unreadable-topic contracts join at boot.
    source: manual
    binds_ac: [AC25856002]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn25856_gate_required_boot_set.py -k "gate_required or in_use or literal" -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn25856-first-record-earliest
    description: The first record on a deferred contract's topic joins its group from earliest.
    source: manual
    binds_ac: [AC25856003]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn25856_gate_required_boot_set.py -k earliest -q --no-cov -n 0 -p no:randomly
        cwd: .
