schema_version: 1.0.0
ticket_id: OMN-22845
title: A dev lane whose effects container is gone while its main runtime runs is restored by the deploy agent
summary: The dev deploy agent restored a lane only when its main runtime container was absent or stopped. The runtime-effects container is the only consumer of the delegate-skill command topic, so a lane with main running and effects absent read NOT_DOWN and every delegation request waited in the topic. After deploy job 3715d9e9 left the effects container absent, 45 requests published 20:01Z to 02:48Z waited until 03:04Z, when an idle converge fired for another reason. The restore now reads every container the lane needs (main, and effects unless the lane folds or disables it) and restores a lane missing its effects container after the converge's own idle bound.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22845-restore-missing-effects
    statement: A dev lane whose effects container is absent while its main runtime runs is restored by one runtime rebuild, once per restore retry bound, and never while frozen, while a job runs, or when docker cannot be read.
    acceptance:
      - id: AC1
        statement: 'AC1: a dev lane with omninode-runtime running and omninode-runtime-effects absent is restored by one agent/idle-restore job after the converge idle bound and by no second job inside the retry bound, in a test that reads docker through the agent default presence seam, with a failing control that shows no restore on the pre-change agent -- falsifier: uv run pytest of the companion restore tests'
      - id: AC2
        statement: 'AC2: a lane with both containers running, a lane that folds or disables the effects service, a frozen lane, a lane with a job in flight, and a lane whose effects container cannot be read behave as before (no restore) -- falsifier: the same test file'
evidence_requirements:
  - kind: tests
    description: The container set a lane needs, the presence read over faked docker, the restore decision with its idle, freeze, job and retry bounds, and the agent replay of the 2026-11-07 outage
    command: cd scripts/deploy-agent && PYTHONPATH=. uv run --frozen pytest tests/unit/test_companion_restore_omn22845.py tests/unit/test_dev_lane_outage_omn20864.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22845-restore-missing-effects
    description: With main running and effects absent the agent default presence seam reads COMPANION_DOWN and one agent/idle-restore job is accepted; the existing restore, converge, lag-bound and web-follow tests still pass.
    source: manual
    binds_ac:
      - AC1
      - AC2
    checks:
      - check_type: test_passes
        check_value: cd scripts/deploy-agent && PYTHONPATH=. uv run --frozen pytest tests/unit/test_companion_restore_omn22845.py tests/unit/test_dev_lane_outage_omn20864.py tests/unit/test_idle_converge_omn19509.py -q --no-cov
        cwd: .
  - id: dod-omn22845-deploy
    description: Deploy-scope probe the hosted runner can run, a read of the changed file at the pushed head. The agent reads the lane's containers through lane_runtime_containers and read_lane_presence, and a missing companion restores through the existing restore path.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: grep -c 'COMPANION_DOWN' scripts/deploy-agent/deploy_agent/idle_converge.py
