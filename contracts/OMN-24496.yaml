schema_version: 1.0.0
ticket_id: OMN-24496
title: Every runtime must send its heartbeat or it does not start
summary: >-
  The runtime kernel built the introspection service inside a try/except, logged "introspection will be disabled" and ran on with introspection_service=None, and HandlerRuntimeIntrospectionStartup.start_heartbeat logged and swallowed a failure to start the heartbeat task. A runtime that did not heartbeat could not be told apart from a dead one. The heartbeat is now mandatory: HandlerRuntimeIntrospectionStartup.build_required_service refuses an empty runtime name or an unbuildable introspection service, start_heartbeat refuses a heartbeat task that cannot start (called inside handle() right after the runtime's own introspection and before any announced node), each refusal is a typed RuntimeHeartbeatRequiredError carrying a ModelRuntimeHeartbeatRefusal with a per-reason counter, and the kernel passes no None service.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - models
requirements:
  - id: req-omn24496-heartbeat-mandatory
    statement: A runtime that cannot build its introspection service or start its heartbeat task refuses to start with a typed counted refusal and announces no node.
    acceptance:
      - id: AC1
        statement: "AC1: a real runtime host on the in-memory bus publishes its own introspection and then two heartbeats for its own id inside the declared window -- falsifier: the golden test fails if no heartbeat or only one is read from the bus"
      - id: AC2
        statement: "AC2: with the introspection service unbuildable, or the heartbeat start raising, or an empty name, the runtime does not start or is not ready and publishes no announcement, and one typed refusal event and counter step appear -- falsifier: on the old code the runtime logs and runs on with no service, which fails the test"
      - id: AC3
        statement: "AC3: integrated: after the dev runtime runs the merged revision, every dev runtime process the registry holds a row for publishes a heartbeat about twice a minute, read per runtime id from the bus over five minutes -- falsifier: a runtime with no heartbeat in five minutes, or a runtime that fails to start, read on the running dev runtime"
evidence_requirements:
  - kind: tests
    description: The handler unit tests, the runtime integration tests on the in-memory bus and the amended announcement tests; the refusal tests fail on the merge base.
    command: uv run --frozen pytest tests/unit/handlers/test_handler_runtime_introspection_startup_heartbeat_required.py tests/integration/runtime/test_runtime_heartbeat_mandatory.py tests/unit/nodes/test_registration_from_announcement.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24496-ac1
    description: 'AC1: a real RuntimeHostProcess with a real ServiceNodeIntrospection on EventBusInmemory publishes its own startup introspection once and at least two node-heartbeat events for its own node id inside 2H plus T (H injected at 0.2 s).'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_runtime_heartbeat_mandatory.py -q --no-cov -p no:cacheprovider -k two_heartbeats
        cwd: .
  - id: dod-omn24496-ac2
    description: 'AC2: an empty runtime name, an unbuildable service and a heartbeat task that cannot start each end in RuntimeHeartbeatRequiredError with a counted ModelRuntimeHeartbeatRefusal and no announced node; the amended announcement tests that used to expect the failure to be logged now expect the refusal and fail at the merge base.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_runtime_introspection_startup_heartbeat_required.py tests/integration/runtime/test_runtime_heartbeat_mandatory.py tests/unit/nodes/test_registration_from_announcement.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24496-ac3
    description: 'hosted proxy for AC3: the tests pass here; the heartbeat rate of every dev runtime process with a registry row is read on the running dev runtime after the deploy and posted as a pull request comment naming the running revision.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_runtime_heartbeat_mandatory.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24496-integration-proof
    description: 'Run the runtime heartbeat tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24496 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/integration/runtime/test_runtime_heartbeat_mandatory.py tests/unit/handlers/test_handler_runtime_introspection_startup_heartbeat_required.py -q -n 0 --no-cov
        cwd: .
