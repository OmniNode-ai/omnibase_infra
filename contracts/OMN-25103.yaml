schema_version: "1.0.0"
ticket_id: "OMN-25103"
title: "The runtime account is granted the floor_integration_rows table in the platform database settings"
summary: "omnibase_infra vendors omnimarket's node_projection_floor_integration migrations (0000_create_floor_integration_rows.sql, 0001_grant_omninode_runtime_floor_integration_rows.sql) into docker/migrations/forward/nodes/node_projection_floor_integration/ and grants omninode_runtime SELECT, INSERT, UPDATE and DELETE on omninode_internal.floor_integration_rows in every shipped topology profile, ahead of the omnimarket pull request that adds the node (the dashboard's Running figure projection). The grants are regenerated by scripts/generate_application_database_table_grants.py, with a bridge entry in src/omnibase_infra/topology/vendored_table_bridges.yaml and an _INTERIM_ENTRIES entry in tests/ci/test_supplemental_declaration_expiry_omn18863.py. Without them the runtime auto-wiring refuses the writer: 'principal omninode_runtime lacks declared SELECT on omninode_internal.floor_integration_rows'. The same route then carries the writer's held-pass marker, omninode_internal.floor_integration_pass (migrations 0002 create and 0003 grant SELECT, INSERT, UPDATE; the marker is only upserted), which keeps an empty pass held so a late older pass changes nothing."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-floor-integration-rows-runtime-grants"
    statement: "Every shipped topology profile grants the runtime role floor_integration_rows, the grant derivation reports no drift against the node's contract, and both node migrations are vendored and declared."
    acceptance:
      - id: "AC5"
        statement: "AC5: omnibase_infra vendors the two floor_integration_rows migrations and grants omninode_runtime the table in every topology profile -- falsifier: uv run pytest tests/unit/topology/test_omn25103_floor_integration_vendor.py -q in omnibase_infra, which fails 14 of 14 on dev 75969ce9"
  - id: "req-floor-integration-pass-runtime-grants"
    statement: "Every shipped topology profile grants the runtime role the floor_integration_pass marker exactly SELECT, INSERT and UPDATE, and both marker migrations are vendored and declared."
evidence_requirements:
  - kind: "tests"
    description: "The vendor tests pass at the head; on the merge base the test file is absent."
    command: "uv run pytest tests/unit/topology/test_omn25103_floor_integration_vendor.py tests/unit/topology/test_omn25103_floor_integration_pass_vendor.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
