schema_version: 1.0.0
ticket_id: OMN-24568
title: Make the installer's removal of old working folders safe and complete
summary: The venv installer's stage sweep takes the venv reconcile lock on every path (script exit, command line, typed operation), refuses a relative path and a folder that is not a venv root, keeps a stage that holds a journal (the previous packages), reports a failed removal as failed instead of counting it as swept, and also runs when an install fails or stops; a commit that restored everything drops its journal so its stage can go.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24568-sweep
    statement: The stage sweep is locked, bounded to a venv root, reports what happened, keeps the only copy of the previous packages and runs on failure too.
    acceptance:
      - id: AC1
        statement: 'AC1: the old-folder removal takes the environment''s install lock on every path (command line, typed operation and script) and removes nothing while another install holds that lock -- falsifier: pytest tests/scripts/test_venv_atomic_stage_sweep.py -k lock -q'
      - id: AC2
        statement: 'AC2: a folder whose removal fails is reported as failed, not counted as swept -- falsifier: pytest tests/scripts/test_venv_atomic_stage_sweep.py -k failed_removal -q'
      - id: AC3
        statement: 'AC3: a failed or stopped install leaves no leftover folder behind except one that holds an unfinished undo, which is kept and named -- falsifier: pytest tests/integration/test_venv_atomic_install_stage_sweep_omn24508.py -k failure -q'
      - id: AC4
        statement: 'AC4: a relative folder path and a folder that is not an environment root are refused by the removal -- falsifier: pytest tests/scripts/test_venv_atomic_stage_sweep.py -k "relative or not_a_venv" -q'
      - id: AC5
        statement: 'AC5: integrated: on h051 one failed run of the real installer script leaves no leftover folder and a concurrent install''s folder is untouched -- falsifier: read the environment directory on h051 after a failed run and after a concurrent held run'
evidence_requirements:
  - kind: tests
    description: The stage sweep tests pass at the pushed head.
    command: uv run pytest tests/scripts/test_venv_atomic_stage_sweep.py tests/integration/test_venv_atomic_install_stage_sweep_omn24508.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24568-tests
    description: AC1 to AC4 proven by the named tests; AC5 is read on h051 after the script runs from the branch and is named in the pull request.
    source: manual
    binds_ac:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_venv_atomic_stage_sweep.py tests/integration/test_venv_atomic_install_stage_sweep_omn24508.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24568-deploy-conditions
    description: 'Deploy probe the hosted runner can run: the engine at the checked-out commit holds the string ''_sweep_and_report''; it does not exist at the merge base, so the probe fails there.'
    source: manual
    checks:
      - check_type: command
        check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/venv_atomic_install/atomic_venv_install.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "_sweep_and_report" > /dev/null'
        cwd: .
  - id: dod-omn24568-integration-proof
    description: AC5 is read on h051 after the script runs from the branch; the host, revision and observation are named in the pull request.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane install-fix-6806 -- uv run pytest tests/integration/test_venv_atomic_install_stage_sweep_omn24508.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
