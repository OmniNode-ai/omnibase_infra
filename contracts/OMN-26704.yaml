schema_version: "1.0.0"
ticket_id: "OMN-26704"
title: "The dev deploy agent never publishes a rebuild-completed event with an empty build sha"
summary: "A deploy job that ends before git_pull resolved no revision; the agent now publishes no rebuild-completed event for it, on the terminal path and on the retry path, and a normal job still publishes the pulled sha."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-no-empty-sha-completed-event"
    statement: "The deploy agent publishes a rebuild-completed event only with the revision its job resolved."
    acceptance:
      - id: "AC1"
        statement: "AC1: a job that ends before git_pull publishes no rebuild-completed event, or one carrying the revision it actually ran, never an empty sha -- falsifier: a unit test drives a job that fails before git_pull and asserts no published event has an empty git_sha"
      - id: "AC2"
        statement: "AC2: a normal job still publishes the pulled sha -- falsifier: a unit test asserts the published git_sha equals the pulled revision"
evidence_requirements:
  - kind: "tests"
    description: "The tests pass at the head; the test file is absent at the merge base."
    command: "uv run --frozen pytest scripts/deploy-agent/tests/unit/test_terminal_event_never_empty_sha_omn26704.py -q -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26704-ac1-no-empty-sha"
    description: "A job failing before git_pull publishes no event with an empty git_sha; fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest scripts/deploy-agent/tests/unit/test_terminal_event_never_empty_sha_omn26704.py -k before_git_pull -q -n 0"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn26704-ac2-pulled-sha"
    description: "A normal job publishes the pulled sha."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest scripts/deploy-agent/tests/unit/test_terminal_event_never_empty_sha_omn26704.py -k pulled_sha -q -n 0"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn26704-ac2-pulled-sha-in-budget"
    description: "The pulled-sha test settles without a real image build, so it finishes inside the verifier's 30 s per-check ceiling and still fails if the published git_sha is not the pulled revision."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest scripts/deploy-agent/tests/unit/test_terminal_event_never_empty_sha_omn26704.py -k pulled_sha -q -n 0"
        cwd: "."
    binds_ac: ["AC2"]
