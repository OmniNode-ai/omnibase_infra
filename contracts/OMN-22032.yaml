schema_version: 1.0.0
ticket_id: OMN-22032
title: The stability lane takes the one-runtime fold (T19) on omnibase_infra
summary: The stability lane's main runtime folds the same role list dev folds (tenant projection, the six projection writers, effects, workers, the projection API), declares the effects and workers consumer-group handovers from the retired instances, and gates each retired service off every bring-up with the profile the runtime policy renders. The stability refresh script and its verifier still gate the worker and the projection API containers (reading the folded set there is a follow-up that needs a node, because the canonical-file-shape ratchet lets a baselined script only shrink). AC1 (the offset-handover ancestry gate before a refresh) and AC3 (the .51 Postgres storage gate) are not part of this change; the lane stays on its current host.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22032-stability-fold
    statement: Every application service but the runtime on the stability lane is retired by a declared policy entry, so a runtime bring-up starts the runtime and its dependencies only.
    acceptance:
      - id: AC2
        statement: 'AC2: every application service but the runtime on the stability lane is retired by a declared overlay entry, and its 16 containers become 6 -- falsifier: the stack shape validator over the stability file set, then the container count'
evidence_requirements:
  - kind: tests
    description: The stability fold tests with their failing controls (the unfolded policy renders the original profiles; the pre-fold env starts every retired service).
    command: uv run pytest tests/unit/docker/test_stability_lane_fold_omn22032.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22032-stability-fold-retires-services
    description: The policy folds the dev role list into the stability main runtime with the effects and workers handovers; the ten retired services start under no profile a runtime or full bring-up requests; a runtime bring-up starts the runtime, postgres, redpanda, valkey and keycloak only; the stack shape check passes over the stability file set.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_stability_lane_fold_omn22032.py tests/unit/docker/test_stability_lane_effects_folded_omn21288.py tests/unit/validation/test_checker_stack_shape.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn22032-fold-live-on-dev
    description: The rendered runtime policy env read from the dev branch of the repository holds the worker profile the stability lane takes from the fold, so the deploy probe goes red before the fold merges and green after.
    source: manual
    binds_ac:
      - AC2
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "gh api -H 'Accept: application/vnd.github.raw' \"repos/OmniNode-ai/omnibase_infra/contents/docker/runtime-policy.env?ref=dev\" | grep -qF 'STABILITY_TEST_RUNTIME_MAIN_RUNTIME_WORKER_RUNTIME_PROFILE=folded-workers-runtime'"
        cwd: .
