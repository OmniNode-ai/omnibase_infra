        statement: "AC3: a failed gateway read is not replayed and its terminal states retryable false -- falsifier: uv run pytest of tests/unit/runtime/auto_wiring/test_omn23058_gateway_read_failure_not_replayed.py and tests/integration/runtime/test_omn23058_gateway_read_boundary_dlq_replay.py on a lab host, red on the base enum and green on this head"
