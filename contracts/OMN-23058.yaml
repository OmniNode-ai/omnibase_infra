  - id: req-omn23058-row10-infra
    statement: The omnibase_infra core bump head reads green on the bus binding check and the runner routing audit, so rebuild step 0 row 10 can read true once the omnimarket generator is out of draft.
    acceptance:
      - id: AC2
        statement: "AC2: omnibase_infra#5707 reads green at its head -- falsifier: uv run pytest of tests/ci/test_runner_routing_audit.py and tests/unit/scripts/test_trigger_learns_secret_namespaces.py on a lab host, red on the base files and green on this head"
  - id: req-omn23058-gateway-read-replay
    statement: A GitHub gateway read that failed is answered once with its failure terminal and is not replayed from the dead-letter topic, so replays stop queueing behind live reads on the one-partition gateway topic and the read-only principal's github channel is not starved.
    acceptance:
