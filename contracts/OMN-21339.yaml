schema_version: "1.0.0"
ticket_id: "OMN-21339"
title: "A developer principal's work-ledger query grants are derived from the grant file, so the ledger read node answers for every team machine"
summary: "The developer principal's wire bindings declared no work-ledger query topic, so the derived grants gave the dev-lane bus principal no WRITE on onex.cmd.omnimarket.work-ledger-query-requested.v1, no READ on onex.evt.omnimarket.work-ledger-query-completed.v1 and no group READ under local.omnimarket.work_ledger_query_client.consume.v1., and the database read node could not serve a developer machine. This change declares those two bindings and one prefixed consumer group in deploy/lab/developer-principal-bindings.yaml and regenerates deploy/lab/developer-principal-derived-grants.json from node_broker_grant_derive_compute: six added grants, none removed. The deriver itself is unchanged. The query client group prefix follows the append client's naming; no query client in the omnimarket clone uses it yet. Applying the grants on the dev lane broker and the live request and ACL readback of AC2 are not part of this change and are not yet done; they follow the issuer image deploy of the merged head."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-work-ledger-query-grants-declared"
    statement: "The developer principal's bindings declare the work-ledger query path, and the grants the issuer applies are the derivation's output for them."
    acceptance:
      - id: "AC1"
        statement: "AC1: the grant derivation adds the work-ledger query grants for a developer principal and removes none -- falsifier: uv run pytest tests -q -k developer_principal_query_acl"
      - id: "AC2"
        statement: "AC2: on the dev lane a developer principal's request to the ledger read node returns rows, and the live ACL list for that principal matches the derived grants -- falsifier: rpk security acl list for the principal shows a row not derived from the grant file, or a derived row missing"
evidence_requirements:
  - kind: "tests"
    description: "The derivation tests pin the six query grants, their absence of removals, the committed derived file and the issuer's writable topic set."
    command: "uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21339-ac1-derived-query-grants"
    description: "The derivation adds exactly the six work-ledger query grants from the bindings and removes none; the committed derived file is its output."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -q -k developer_principal_query_acl"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
  - id: "dod-omn21339-ac2-deploy-derived-grants-shipped"
    description: "The derived grants the issuer image ships at the merged head carry the work-ledger query request topic. This covers the derived-grants half of AC2 only; the live request and the rpk ACL readback on the dev lane need the issuer image deployed and are pending."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/deploy/lab/developer-principal-derived-grants.json?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'onex.cmd.omnimarket.work-ledger-query-requested.v1'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC2"]
