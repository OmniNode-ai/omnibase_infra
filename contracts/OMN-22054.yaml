schema_version: 1.0.0
ticket_id: OMN-22054
title: 'omnibase_infra#5578 (contract resolver served from a contract-declared mount) is current with dev and every required check on its head passes'
summary: Brings the T16 contract-resolver mount branch current with dev and answers its hostile-review threads. Adds tests that a second attach of the same manifest starts no second application (read from the mounted application's own lifespan log) and that a restarted server mounts again, and closes the response in the kernel test's port-closed assertion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22054-checks-green
    statement: The PR head carries no failing required check-run and every fixed test has a test that fails on the base.
    acceptance:
      - id: AC1
        statement: 'AC1: the required check-runs on the PR head after the lane''s last push are all success or neutral, read from the check-run list and not the rollup -- falsifier: gh api repos/OmniNode-ai/omnibase_infra/commits/<head>/check-runs --paginate --jq ''[.check_runs[] | select(.conclusion=="failure")] | length'' prints 0'
      - id: AC2
        statement: 'AC2: every fix to a failing test lands with a test that fails on the base and passes on the branch -- falsifier: uv run pytest <the test paths the lane names in its TERMINAL> -q exits 0 on the branch head'
evidence_requirements:
  - kind: tests
    description: The mount attach lifecycle test and the kernel early-mount tests pass.
    command: uv run --frozen pytest tests/unit/handlers/http_mount/test_asgi_mounts_omn21288.py tests/unit/runtime/test_service_kernel_early_http_mount_omn21288.py -q --no-cov
dod_evidence:
  - id: dod-omn22054-attach-lifecycle
    description: A second attach_manifest of the same manifest starts no second application (the fixture application's lifespan log records one startup), and a restarted server mounts again. Without the attach-once guard in asgi_mounts.py the second attach starts a second application, so the test fails there.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/http_mount/test_asgi_mounts_omn21288.py -k second_attach -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22054-mount-suites
    description: The mount, kernel early-mount and resolver mount tests pass at the head. The head check-run read itself is made by the landing controller after the push.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/http_mount/test_asgi_mounts_omn21288.py tests/unit/runtime/test_service_kernel_early_http_mount_omn21288.py tests/integration/handlers/http_mount/test_contract_resolver_mount_omn21288.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22054-deploy-attach-once-on-dev
    description: 'Post-merge deploy probe: the asgi_mounts.py the runtime image builds from dev carries the attach-once guard, so a repeated attach cannot start a second lifespan task. It reads dev, which holds the guard only after this change merges, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion (AC2 is bound by the attach lifecycle test).'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/http_mount/asgi_mounts.py?ref=dev" --jq .content | base64 -d | grep -qF 'if self._attached:'
        cwd: ${OMNI_HOME}/omnibase_infra
