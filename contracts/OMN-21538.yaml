schema_version: 1.0.0
ticket_id: OMN-21538
title: omnibase_infra consumes the core validators it lacks by hook id, each at a zero-target baseline
summary: >-
  Lane lf-t2-1-omnibase-infra-0250. omnibase_infra wires omnibase_core's check-no-raw-sqlite3, check-local-paths-compute, check-hardcoded-topic-compute, check-hardcoded-model-config-compute, check-no-io-outside-effects and handler-di-gate by hook id from one omnibase_core block of .pre-commit-config.yaml; the ci.yml jobs canonical-file-shape and core-validators read the tag from that block and run the same ids over the files a change touches.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21538-core-validators-by-hook-id
    statement: Declared by this pull request under the factory minting ticket; transcribed from the ticket's five criteria.
    acceptance:
      - id: AC1
        statement: 'AC1: each wired hook id resolves to the omnibase_core repo URL in `.pre-commit-config.yaml` and runs in `ci.yml` -- falsifier: a pytest case parsing both files for the hook ids'
      - id: AC2
        statement: 'AC2: the infra canary defects marked NO-VALIDATOR or MISSED in section A.5 of the plan are CAUGHT locally and in CI -- falsifier: the core-validators job plants a raw sqlite3 call and an absolute local path and fails unless the wired hooks refuse them'
      - id: AC3
        statement: 'AC3: every baseline is per-file, shrink-only to zero, carries no suppression marker, and names no file that findings F44 to F47 name -- falsifier: a pytest case greps each baseline for those files'
      - id: AC4
        statement: 'AC4: each burn-down ticket for a non-empty baseline exists and names its zero date -- falsifier: list_issues by parent returns the burn-down tickets; the baseline reaches zero on that date, read from the file'
      - id: AC5
        statement: 'AC5: hook ids and tags come from the shared hook repo pin (one home), not a second literal -- falsifier: a pytest case finds no dev-merge tag in the core-validators and canonical-file-shape jobs of ci.yml'
  - id: req-omn21538-lab-proof-tests-no-home-path
    statement: The lab proof plan tests hold no home-directory literal, so check-local-paths-compute passes on every change whose range includes them.
    acceptance:
      - id: AC6
        statement: 'AC6: the Core Validators job is green on a head whose range includes the lab proof plan test files -- falsifier: a pytest case finds no home-directory path in tests/unit/nodes/node_lab_proof_plan_compute'
evidence_requirements:
  - kind: "tests"
    description: "The wiring test parses .pre-commit-config.yaml and ci.yml for every wired hook id."
    command: "uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21538-ac1-hook-ids-resolve-to-core
    description: >-
      AC1. The test parses .pre-commit-config.yaml and the core-validators job of ci.yml for every wired hook id and asserts each is declared under the omnibase_core repository URL and not under a local repo.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "resolves_to_the_core_repository or not_defined_locally or executes_exactly_the_wired_hook_ids or runs_the_hooks_of_the_core_block"
    binds_ac:
      - AC1
  - id: dod-omn21538-ac2-planted-defects-refused
    description: >-
      AC2. The core-validators job carries a positive control that plants a raw sqlite3 call, an absolute local path, a hardcoded onex topic and a hardcoded model id, and fails unless check-no-raw-sqlite3, check-local-paths-compute, check-hardcoded-topic-compute and check-hardcoded-model-config-compute refuse them; both steps run under set -euo pipefail. The test parses the step scripts for the control pairs, the fail-closed branch and the shell options.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "positive_control or unconditional_and_hosted or fails_on_the_first_failing_command"
    binds_ac:
      - AC2
  - id: dod-omn21538-ac3-baselines-name-no-finding-file
    description: >-
      AC3. Both baselines are parsed entry by entry: each entry names one repository file (no glob, directory or blanket), the handler-DI baseline lists each file once with a positive count, and no entry names a file findings F44 to F47 name; neither file carries a suppression marker.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "baselines_name_no_finding_file or baselines_are_per_file or reads_its_baseline"
    binds_ac:
      - AC3
  - id: dod-omn21538-ac4-baselines-to-burn-down
    description: >-
      AC4, partial. The check proves the part a file can carry: both non-empty baselines (.onex_ratchets/handler_di_baseline.txt and config/hardcoded_model_config_baseline.yaml) parse per file and are read by their hooks, and the model-config baseline names its zero date in its header. It does not prove that the burn-down tickets exist: that needs a Linear read, which hosted CI has no credential for, and the tickets are minted by the orchestrator from the PR report. The handler-DI baseline names no zero date yet; AC4 stays open on the ticket until each burn-down ticket exists and both baselines name its date.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "names_its_zero_date or baselines_are_per_file or reads_its_baseline"
    binds_ac:
      - AC4
  - id: dod-omn21538-ac5-tag-has-one-home
    description: >-
      AC5. The omnibase_core block of .pre-commit-config.yaml holds the dev-merge tag; the canonical-file-shape and core-validators jobs of ci.yml hold none and read the block.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "tag_has_one_home"
    binds_ac:
      - AC5
  - id: dod-omn21538-ac6-lab-proof-tests-no-home-path
    description: >-
      AC6. The lab proof plan fixtures and tests use a non-home lane root; the test scans the directory for a home-directory literal and fails on the pre-fix tree.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "home_directory"
    binds_ac:
      - AC6
