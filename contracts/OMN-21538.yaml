schema_version: 1.0.0
ticket_id: OMN-21538
title: omnibase_infra consumes the core validators it lacks by hook id, each at a zero-target baseline
summary: >-
  Lane lf-t2-1-omnibase-infra-0250. omnibase_infra wires omnibase_core's check-no-raw-sqlite3, check-local-paths-compute, check-hardcoded-topic-compute, check-hardcoded-model-config-compute, check-no-io-outside-effects and handler-di-gate by hook id from one omnibase_core block of .pre-commit-config.yaml; the ci.yml jobs canonical-file-shape and core-validators read the tag from that block and run the same ids over the files a change touches.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21538-core-validators-by-hook-id
    statement: Declared by this pull request under the factory minting ticket; transcribed from the ticket's five criteria.
    acceptance:
      - id: AC1
        statement: 'AC1: each wired hook id resolves to the omnibase_core repo URL in `.pre-commit-config.yaml` and runs in `ci.yml` -- falsifier: a pytest case parsing both files for the hook ids'
      - id: AC2
        statement: 'AC2: the infra canary defects marked NO-VALIDATOR or MISSED in section A.5 of the plan are CAUGHT locally and in CI -- falsifier: the core-validators job plants a raw sqlite3 call and an absolute local path and fails unless the wired hooks refuse them'
      - id: AC3
        statement: 'AC3: every baseline is per-file, shrink-only to zero, carries no suppression marker, and names no file that findings F44 to F47 name -- falsifier: a pytest case greps each baseline for those files'
      - id: AC4
        statement: 'AC4: each burn-down ticket for a non-empty baseline exists and names its zero date -- falsifier: list_issues by parent returns the burn-down tickets; the baseline reaches zero on that date, read from the file'
      - id: AC5
        statement: 'AC5: hook ids and tags come from the shared hook repo pin (one home), not a second literal -- falsifier: a pytest case finds no dev-merge tag in the core-validators and canonical-file-shape jobs of ci.yml'
evidence_requirements:
  - kind: "tests"
    description: "The wiring test parses .pre-commit-config.yaml and ci.yml for every wired hook id."
    command: "uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21538-ac1-hook-ids-resolve-to-core
    description: >-
      AC1. The test parses .pre-commit-config.yaml and the core-validators job of ci.yml for every wired hook id and asserts each is declared under the omnibase_core repository URL and not under a local repo.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "resolves_to_the_core_repository or not_defined_locally or ci_job_runs_the_hook_id"
    binds_ac:
      - AC1
  - id: dod-omn21538-ac2-planted-defects-refused
    description: >-
      AC2. The core-validators job carries a positive control that plants a raw sqlite3 call and an absolute local path and fails unless check-no-raw-sqlite3 and check-local-paths-compute refuse them; the test asserts the job and its control.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "positive_control or unconditional_and_hosted"
    binds_ac:
      - AC2
  - id: dod-omn21538-ac3-baselines-name-no-finding-file
    description: >-
      AC3. Every baseline a wired hook reads is searched for the files findings F44 to F47 name and for suppression markers.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "baselines_name_no_finding_file"
    binds_ac:
      - AC3
  - id: dod-omn21538-ac4-baselines-to-burn-down
    description: >-
      AC4. The two non-empty baselines (.onex_ratchets/handler_di_baseline.txt and config/hardcoded_model_config_baseline.yaml) are on disk and read by their hooks; the burn-down tickets and zero dates are minted by the orchestrator from the PR report, so this item proves the baselines to burn down, not the tickets.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "baselines_name_no_finding_file"
    binds_ac:
      - AC4
  - id: dod-omn21538-ac5-tag-has-one-home
    description: >-
      AC5. The omnibase_core block of .pre-commit-config.yaml holds the dev-merge tag; the canonical-file-shape and core-validators jobs of ci.yml hold none and read the block.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_core_validators_wired_omn21538.py -q -n 0 --no-cov -k "tag_has_one_home"
    binds_ac:
      - AC5
