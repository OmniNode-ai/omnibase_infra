schema_version: 1.0.0
ticket_id: OMN-24426
title: Dev runtime joins six command-node consumers in its first wave
summary: >-
  On 2026-11-14 after a dev runtime roll (container created 10:42:02Z) the consumers of six lab command nodes joined 141 s to 284 s after the container start (plugin revision compute 141 s, plugin revision orchestrator 141 s, delegated code edit 182 s, delegation routing order 182 s, host role baseline 191 s, start path census 284 s), and an `onex run-node` send made in that window waited unconsumed past its 45 s wait (host role baseline: answered after the sender timed out). The dev main boot priority list in contracts/services/runtime_policy.contract.yaml now names the six nodes and docker/runtime-policy.env is rendered from it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24426-lab-command-nodes-boot-priority
    statement: The dev main runtime joins the six lab command nodes' consumers in the first waves of the boot, ahead of every non-priority contract.
    acceptance:
      - id: AC1
        statement: "AC1: the dev main runtime policy names the six command nodes as priority contracts and the rendered runtime policy env carries the same six names -- falsifier: the new first-wave and policy tests in omnibase_infra fail on origin/dev's copy of the policy and pass on the branch"
      - id: AC2
        statement: "AC2: in a boot where the six nodes are discovered after a dozen other contracts, their command topics are joined in the first wave, ahead of every non-priority contract -- falsifier: the bounded contract attach test with the six names removed from the priority list fails"
      - id: AC3
        statement: "AC3: integrated: after the dev runtime restarts on the merged revision, each of the six command-topic consumer groups has one member within 150 seconds of the container start and a fresh send to each node is answered with a terminal event -- falsifier: read the six consumer groups and the six terminal topics on the dev broker after the roll; a group with 0 members at 150 seconds fails it"
evidence_requirements:
  - kind: tests
    description: The boot policy and the bounded contract attach tests.
    command: uv run --frozen pytest tests/unit/runtime/test_omn18087_boot_bound_and_policy.py tests/unit/runtime/auto_wiring/test_omn18087_bounded_contract_attach.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24426-ac1-policy-names-the-nodes
    description: >-
      The dev main boot priority list in contracts/services/runtime_policy.contract.yaml names the six lab command nodes and ends with node_delegation_routing_order_compute, and the committed docker/runtime-policy.env renders from it. Parent OMN-19998; precedent OMN-23535 made the same change for the work-ledger query node alone. The policy test fails at the merge base, where the list names none of the six.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_omn18087_boot_bound_and_policy.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24426-ac2-first-wave
    description: >-
      With the real dev main boot policy and the six nodes discovered after twelve fillers, their topics are inside the priority waves and ahead of every filler; the test fails at the merge base, where the six are not on the list.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn18087_bounded_contract_attach.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24426-ac3-integrated
    description: >-
      Deploy check the hosted runner can run: the policy env the deploy reads names the six lab command nodes in the dev main boot priority list, and equals the render of the policy contract; the first check fails at the merge base, where the list names none of the six. The runtime read of the consumer joins after the next roll is posted as a pull request comment naming the head and the revision running; it is not claimed by this check.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: grep -qE '^DEV_RUNTIME_MAIN_BOOT_PRIORITY_CONTRACTS=.*,node_delegation_routing_order_compute$' docker/runtime-policy.env
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: uv run --frozen python scripts/render_runtime_policy_env.py --check-env-file docker/runtime-policy.env
        cwd: ${OMNI_HOME}/omnibase_infra
