schema_version: 1.0.0
ticket_id: OMN-24471
title: A failed onex API step of a development update leaves the running runtime alone
summary: >-
  A dev roll rolls one service per compose step. When the onex-api step fails (on 2026-11-14 its image crash-looped on a moved omnimarket module), HandlerDevBootGuard.protect treated the failure as a runtime failure and force-recreated the retained runtime family, three times, at 17:26Z, 17:47Z and 18:03Z. onex-api is not in DEV_BOOT_SERVICES. run_runtime_roll_step now raises DevOnexApiStepFailedError for the onex-api step, protect keeps a runtime that is up and healthy (recording runtime_kept_revision, or runtime_left_running when the family cannot become the recovery point), and the executor no longer verifies or starts onex-api after that failure, so the typed error is not masked by a census error. The job still fails and the incident is still reported. The change follows the OMN-21645 companion-lane carve-out.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24471-onex-api-step
    statement: A failed onex-api step of a dev roll leaves a healthy running runtime untouched and reports the failure.
    acceptance:
