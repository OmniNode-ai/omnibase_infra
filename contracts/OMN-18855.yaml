    description: 'AC1: a create run of 12 specs at wave size 5 runs 3 bounded waves and probes the fleet signal once before each. Fails with the product change of omnibase_infra#3967 reverted.'
    command: uv run pytest "scripts/ci/tests/test_bulk_pr_throttle.py::TestCreatePacesAgainstTheLiveSignal::test_ac1_probes_the_fleet_once_per_wave" -q -n 0 --no-cov
  - kind: tests
    description: 'AC3: a create run that passes no wave size and no threshold is still split into default-size waves with a probe per wave, and the total cap applies to creates. Fails with the product change of omnibase_infra#3967 reverted.'
    command: uv run pytest "scripts/ci/tests/test_bulk_pr_throttle.py::TestCreateIsPacedWithoutOptIn" -q -n 0 --no-cov
