ticket_id: OMN-18855
title: bulk_pr_throttle has no create operation, so fleet-wide PR creation is unpaced while every other bulk operation is throttled
summary: omnibase_infra#3967 (c6f348661) added a create operation to scripts/ci/bulk_pr_throttle.py that paces pull-request creation in bounded waves against the runner-fleet signal the other operations read. This contract records the acceptance-criterion bindings a second lane accepted. AC2 and AC4 are not bound here.
