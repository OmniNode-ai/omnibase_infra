schema_version: 1.0.0
ticket_id: OMN-23967
title: Repo-root tests hand their children an env with no LD_LIBRARY_PATH, so the venv interpreter dies on any runner whose CPython resolves libpython through it
summary: >-
  Tests that build a child process environment from scratch (env={"PATH": ...}) drop LD_LIBRARY_PATH. On runners whose venv interpreter is the Actions tool-cache CPython (a shared-libpython build found only through that variable) every such child dies with exit 127, while runners with a uv-managed interpreter pass. One autouse fixture in tests/conftest.py wraps subprocess.Popen so a child spawned with an explicit env mapping that does not name LD_LIBRARY_PATH receives the session value; the rule is generic, no test file is named, and an explicit value (even empty) or env=None is left alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23967-children-inherit-ld-library-path
    statement: A child process spawned from a test with an explicitly constructed env inherits the session LD_LIBRARY_PATH unless the test set that variable itself.
    acceptance:
      - id: AC1
        statement: 'AC1: a child process spawned from a repo-root test with an explicitly constructed env inherits the session''s LD_LIBRARY_PATH unless the test set that variable itself -- falsifier: tests/ci/test_child_env_ld_library_path_omn23967.py runs a child under env={"PATH": ...} and reads the session value, and an explicit value in the caller''s env is still what the child sees; with the conftest fixture removed the inherit tests fail'
      - id: AC2
        statement: 'AC2: the mechanism is derived, not a list of file names -- falsifier: the fixture is autouse in tests/conftest.py and names no test module; the new test module is covered without being named anywhere'
      - id: AC3
        statement: 'AC3: a focused run of the new test file on a runner host, whose test spawns a child, passes -- falsifier: the run receipt for the pushed head of this branch reads exit 0'
evidence_requirements:
  - kind: tests
    description: The LD_LIBRARY_PATH inheritance tests, which fail against tests/conftest.py at the merge base.
    command: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23967-inherit-tests
    description: The nine inheritance tests pass on the branch; with the autouse fixture removed (tests/conftest.py at the merge base) the session-value, positional-env and asyncio tests fail.
    source: manual
    binds_ac:
      - AC1
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn23967-fixture-is-generic
    description: The fixture is autouse and is written in tests/conftest.py.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: grep -qF 'def _children_inherit_ld_library_path' tests/conftest.py
        cwd: .
  - id: dod-omn23967-run-receipt
    description: A focused run of the new test file on a runner host at the pushed head exits 0; the receipt is read from that run.
    source: manual
    binds_ac:
      - AC3
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov
        cwd: .
