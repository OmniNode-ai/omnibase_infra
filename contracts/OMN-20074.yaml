schema_version: "1.0.0"
ticket_id: OMN-20074
title: Switch omnibase_infra's repo-evidence caller to the base-branch trigger for S6 part 1 of the OCC retirement
summary: Move the repo-evidence caller to the base-branch trigger as the single named exception to the runner-routing ban, ruled by the operator (2026-10-08T22:41:24Z), and register repo-evidence / dod-verify in CI Summary. S6 part 2 then removes every OCC caller, namely the occ-preflight wait in ci.yml, the autobind, companion-effect, companion-merge-heal and preflight-heal workflows, the receipt-gate caller and the OCC companion gate in CI Summary.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-repo-evidence-s6-part1
    statement: omnibase_infra must run the repo-owned evidence caller on the base-branch trigger, as the one audited exception, while retaining every existing OCC gate for the S6 part 1 overlap.
    acceptance:
      - id: AC1
        statement: 'AC1: the caller pins receipt-gate.yml at fb0c6c2117d5868a398b0920cd0048d0824415b1 (omnibase_core#1914), sets shadow to "false" and compare-with-occ to "false" -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow_omn20073.py -q -k s6_part1'
      - id: AC2
        statement: 'AC2: the runner-routing audit admits pull_request_target in exactly one workflow, call-repo-evidence-gate.yml, named in config/runner_routing_policy.yaml with the operator ruling, refuses a pattern or a list in its place and any other workflow using the trigger, and holds that file to a read-only pinned reusable call with no inline steps or secrets -- falsifier: uv run pytest tests/ci/test_runner_routing_audit.py -q -k pull_request_target'
  - id: req-repo-evidence-required-ci-summary
    statement: omnibase_infra's CI Summary must expect repo-evidence / dod-verify on every pull_request run, so an absent repo-owned evidence verdict fails the only required context on dev.
    acceptance:
      - id: AC3
        statement: 'AC3: repo-evidence / dod-verify is a member of EXPECTED_EXTERNAL_CONTEXTS, a pull_request check-run set without it fails the expected-context evaluation naming it, and a green pull_request_target row satisfies it -- falsifier: uv run pytest tests/ci/test_repo_evidence_dod_verify_required_omn20074.py -q fails at the merge base'
  - id: req-no-occ-callers-s6-part2
    statement: omnibase_infra must have no workflow that calls an OCC reusable workflow, waits on occ-preflight or requires an OCC companion context, so pull-request admission needs repo-owned evidence only.
    acceptance:
      - id: AC4
        statement: 'AC4: no omnibase_infra workflow calls or waits on an OCC path, and neither CI Summary nor the required-checks manifest expects an OCC companion context -- falsifier: uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q -k no_occ_callers'
  - id: req-deploy-gate-reads-caller-contracts
    statement: omnibase_infra's deploy gate must read the cited ticket's deploy evidence from this repository's contracts/OMN-<n>.yaml at the pull request head, through the omniclaude reusable's caller contract source.
    acceptance:
      - id: AC5
        statement: 'AC5: deploy-gate.yml calls the omniclaude deploy-gate reusable at the commit that adds contract-source, with contract-source caller and no contracts-dir -- falsifier: uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q -k deploy_gate_reads_caller_contracts fails at the merge base'
  - id: req-precommit-hooks-from-core-s8
    statement: omnibase_infra must consume the no-hardcoded-topics pre-commit hook from omnibase_core, where it moved from onex_change_control under the same hook id, so the hook no longer pins onex_change_control.
    acceptance:
      - id: AC6
        statement: 'AC6: no-hardcoded-topics is listed in .pre-commit-config.yaml only under the omnibase_core repo block, pinned to a full commit sha, with require_serial and its exclude carried over -- falsifier: uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q fails at the merge base'
  - id: req-contract-validation-core-s8
    statement: omnibase_infra's contract-validation workflow must validate the branch ticket's contract with omnibase_core's ModelTicketContract at the locked core version instead of the onex_change_control validators, under unchanged workflow and job names.
    acceptance:
      - id: AC7
        statement: 'AC7: .github/workflows/contract-validation.yml names no onex_change_control (no auth preflight, no validator checkout, no validate-yaml), validates with omnibase_core''s ModelTicketContract at the uv.lock core version that carries the binds_ac rules (0.47.39 or later), and keeps its workflow name Contract Validation and its job name contract-validation -- falsifier: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k test_workflow_'
      - id: AC8
        statement: 'AC8: the contract-validation step''s own run block passes this repository''s branch-ticket contract, skips a branch with no ticket or no contract, and fails a planted binds_ac entry that is not a criterion label, a planted binds_ac item of check_type command_exit_0 and a planted malformed contract, each naming the file, the first two also the rule -- falsifier: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q'
  - id: req-retire-skip-token-approvals
    statement: The local pre-commit hook must reject a skip token even when a receipt-id comment accompanies it, retiring the approvals registry escape hatch.
    acceptance:
      - id: AC9
        statement: 'AC9: the hook rejects a token with or without a receipt-id comment in a file and rejects a commit message with a receipt-id comment, while a comment alone remains inert -- falsifier: uv run pytest tests/unit/test_reject_skip_token_hook_no_escape_hatch.py -q fails at the merge base'
  - id: req-occ-readers-s6-infra
    statement: omnibase_infra's contract-topic-graph, omni-standards-compliance, pr-ci-zombie-detector and release workflows must read no onex_change_control, and the unused onex-change-control dev dependency and sibling pin must be gone.
    acceptance:
      - id: AC10
        statement: 'AC10: contract-topic-graph.yml, omni-standards-compliance.yml, pr-ci-zombie-detector.yml and release.yml name no onex_change_control outside comments, the handler-contract check runs omnibase_core''s handler at a PyPI release that ships it, the zombie detector scans only omnimarket, release evidence is the in-repo contract alone, and neither pyproject.toml, uv.lock nor .github/sibling-pins.yaml carries onex_change_control -- falsifier: uv run pytest tests/ci/test_no_occ_readers_omn20074.py tests/ci/test_release_evidence_omn20959.py -q fails at the merge base'
  - id: req-dispatch-parity-declared-closure
    statement: Dispatch parity must pin both the declared OCC development corpus and the retired OCC corpus without changing any executable selection oracle.
    acceptance:
      - id: AC11
        statement: 'AC11: the manifest selects the committed 153-contract OCC inventory or the captured 149-contract retired inventory, both sharing all 1090 probes, 126 dispatchers and 110 routes; missing declared OCC, core or infra still fails, and inventory, route or selection drift still fails -- falsifier: uv run pytest tests/unit/runtime/test_dispatch_parity_dependency_closure_omn20074.py -q'
  - id: req-occ-residual-s6-infra
    statement: omnibase_infra's branch-protection audit workflow and deploy-scope pre-push hook must read no onex_change_control, and the two scripts that ran out of a change-control clone with no caller must be gone.
    acceptance:
      - id: AC12
        statement: 'AC12: branch-protection-audit.yml fetches and runs no change-control auditor and keeps its orphan and parity checks, check_deploy_scope_dod.py reads this repository''s contracts/ and fails a cited ticket with no contract there, and run_contract_sweep.py and verify_error_triage_e2e.py are deleted -- falsifier: uv run pytest tests/ci/test_no_occ_residual_omn20074.py tests/ci/test_branch_protection_single_auditor.py tests/ci/test_check_deploy_scope_dod.py -q fails at the merge base'
  - id: req-occ-residual-s6-infra-migration-connect
    statement: scripts/run-migrations.py must retry its first postgres connection while a freshly started server resets it, so Runtime Boot Smoke (compose) does not fail on the startup race.
    acceptance:
      - id: AC13
        statement: 'AC13: connect_with_retry retries ConnectionError and CannotConnectNowError up to its attempt limit, re-raises the last error, and does not retry an authentication failure -- falsifier: uv run pytest tests/unit/scripts/test_run_migrations.py -q -k ConnectWithRetry fails at the merge base'
evidence_requirements:
  - kind: tests
    description: No workflow calls an OCC reusable workflow, waits on occ-preflight or requires an OCC companion context.
    command: uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q -k no_occ_callers
  - kind: tests
    description: The caller enforces at the caller-mode success-no-op pin without waiting for OCC comparison.
    command: uv run pytest tests/ci/test_repo_evidence_caller_workflow_omn20073.py -q -k s6_part1
  - kind: tests
    description: The runner-routing audit admits the base-branch trigger in the one named caller and nowhere else.
    command: uv run pytest tests/ci/test_runner_routing_audit.py -q -k pull_request_target
  - kind: tests
    description: CI Summary requires the repo-owned verdict, refuses its absence or failure, and accepts a green base-branch-trigger row.
    command: uv run pytest tests/ci/test_repo_evidence_dod_verify_required_omn20074.py -q
  - kind: tests
    description: no-hardcoded-topics is consumed from the omnibase_core hook block, pinned to a full sha.
    command: uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q
  - kind: tests
    description: The contract-validation workflow reads no onex_change_control, validates with omnibase_core at the locked core and keeps its names.
    command: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k test_workflow_
  - kind: tests
    description: The contract-validation step passes this repository's branch contract and refuses both planted binds_ac shapes and a malformed contract.
    command: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q
  - kind: tests
    description: The four workflows read no onex_change_control, the release resolves evidence from the in-repo contract alone, and the dev dependency and sibling pin are gone.
    command: uv run pytest tests/ci/test_no_occ_readers_omn20074.py tests/ci/test_release_evidence_omn20959.py tests/integration/ci/test_contract_topic_graph_corpus_omn20074.py -q
  - kind: tests
    description: The branch-protection audit and the deploy-scope hook read no onex_change_control, and the two caller-less scripts are deleted.
    command: uv run pytest tests/ci/test_no_occ_residual_omn20074.py tests/ci/test_branch_protection_single_auditor.py tests/ci/test_check_deploy_scope_dod.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
