schema_version: 1.0.0
ticket_id: OMN-21697
title: >-
  Handler shape burn-down in omnibase_infra: contract persistence and session state handlers take one typed request
summary: >-
  Core's handler-shape validator (omnibase_core.validation.validator_handler_shape, plan task T2.4a) reported 11 noncanonical_handle findings in node_contract_persistence_effect (6) and node_session_state_effect (5) at origin/dev a40958962. The six PostgreSQL handlers declared handle(payload, correlation_id) although every payload model already carries correlation_id; each handle is now handle(request: <payload model>) -> ModelBackendResult. The five session-state handlers took scalars or a model next to a correlation id; each handle now takes one new request model (ModelSessionIndexReadRequest, ModelSessionIndexWriteRequest, ModelRunContextReadRequest, ModelRunContextWriteRequest, ModelStaleRunGcRequest) and the node contract names it as the handler's input_model. Both nodes flip to canonical shape for the legacy ratchet, with an adequacy receipt and a hand-flip proof each.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21697-persist-session-handle-shape
    statement: >-
      Every handler of node_contract_persistence_effect and node_session_state_effect takes one typed request and reads the correlation id from it, and core's handler-shape validator reports no noncanonical_handle finding for those two node directories.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the contract persistence and session state handlers of omnibase_infra#5496 take one typed request model and the handler-shape count over them drops as the PR states -- falsifier: uv run pytest tests/unit -q over the touched handlers plus the handler-shape checker re-run on the PR paths
  - id: req-omn21697-contract-location
    statement: >-
      The acceptance items of omnibase_infra#5496 live in contracts/OMN-21697.yaml and the PR leaves contracts/OMN-21536.yaml as the base branch has it.
    acceptance:
      - id: AC2
        statement: >-
          AC2: the PR's acceptance items live in contracts/OMN-21697.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21697.yaml and not contracts/OMN-21536.yaml
evidence_requirements:
  - kind: tests
    description: >-
      The persistence and session-state handlers answer typed requests and the node tests still hold.
    command: >-
      uv run pytest tests/unit/nodes/node_contract_persistence_effect tests/unit/nodes/node_session_state_effect tests/integration/nodes/test_typed_request_handlers_omn21536.py -q -n 0 -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21697-ac3-persistence-typed-request
    description: >-
      The persistence handlers take the payload model alone; the real node contract names the same model as the handler's input_model.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_contract_persistence_effect/handlers/test_handle_typed_request_omn21536.py tests/integration/nodes/test_typed_request_handlers_omn21536.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21697-ac4-session-typed-request
    description: >-
      The session-state handlers take one request model each and round-trip a write, read and garbage collect on a real directory.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_session_state_effect/test_handle_typed_request_omn21536.py tests/integration/nodes/test_typed_request_handlers_omn21536.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21697-ac5-validator-clean
    description: Core's handler-shape validator reports nothing for the two node directories.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape src/omnibase_infra/nodes/node_contract_persistence_effect src/omnibase_infra/nodes/node_session_state_effect --report-json /dev/null
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21697-deploy-persist-session-handle-sig
    description: >-
      Post-deploy probe: the running runtime image carries the one-argument handle on the contract-upsert and run-context-read handlers. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          docker exec omninode-runtime python -c "import inspect; from omnibase_infra.nodes.node_contract_persistence_effect.handlers.handler_postgres_contract_upsert import HandlerPostgresContractUpsert as U; from omnibase_infra.nodes.node_session_state_effect.handlers.handler_run_context_read import HandlerRunContextRead as R; assert list(inspect.signature(U.handle).parameters) == ['self', 'request']; assert list(inspect.signature(R.handle).parameters) == ['self', 'request']"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21697-ac2-contract-location
    description: >-
      The PR diff against origin/dev lists contracts/OMN-21697.yaml and does not list contracts/OMN-21536.yaml.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          sh -c 'files=$(git diff --name-only origin/dev...HEAD) && printf "%s\n" "$files" | grep -Fx contracts/OMN-21697.yaml && ! printf "%s\n" "$files" | grep -Fx contracts/OMN-21536.yaml'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
