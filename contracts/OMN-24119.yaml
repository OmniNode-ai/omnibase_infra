schema_version: "1.0.0"
ticket_id: OMN-24119
title: "Stability lane refresh takes the embedding address from the overlay"
summary: "The stability lane's refresh script (refresh_stability_lane.sh) and the shared deploy handler (handler_runtime_deploy.sh) both source the operator env file, which keeps the removed embedding server's address (port 8002) for the lane's five containers. The stability refresh now takes refresh_exports of the LLM endpoint env render module (nodes/node_setup_local_provision_effect/runtime_llm_endpoint_env.py) after it sources the operator env, before the lane lock and any build: LLM_EMBEDDING_URL, BIFROST_LOCAL_EMBEDDING_ENDPOINT_URL and the rewritten lane overlay directory come from the llm_endpoints overlay, and an unreadable overlay or a missing embedding slot stops the refresh with LANE_ENV_FRAGMENT_REFUSED. Both refresh scripts hand the rendered exports to onex-runtime-deploy in ONEX_DEPLOY_LANE_ENV_EXPORTS, which the handler sources right after the operator env, because the handler's own sourcing of that file overwrote any value a caller had exported (measured with bash -x: the store line is assigned after the caller's export)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24119-stability-refresh-renders-overlay-address
    statement: The stability lane refresh takes the embedding address and the lane bifrost overlay directory from the llm_endpoints overlay, after the operator env, keeps them through the deploy handler, and refuses when the overlay cannot be rendered.
    acceptance:
      - id: AC1
        statement: 'AC1: the stability lane refresh script exports LLM_EMBEDDING_URL and the rewritten lane overlay directory rendered from the llm_endpoints overlay after it sources the operator settings file, ahead of the build -- falsifier: python -m pytest scripts/deploy-agent/tests/unit -k stability_refresh_llm_endpoint -q fails at the merge base'
      - id: AC2
        statement: 'AC2: a stability refresh whose overlay cannot be read or lacks the embedding slot stops with a named refusal before any build -- falsifier: the error-chain test passes with the refusal removed'
      - id: AC3
        statement: 'AC3: the shared deploy step keeps the values the refresh scripts rendered over the settings file it sources, for the stability and the development refresh -- falsifier: python -m pytest tests/scripts -k deploy_runtime_lane_env_exports -q fails at the merge base'
      - id: AC4
        statement: 'AC4: integrated: after the operator''s stability refresh from the merged change, the stability lane''s containers carry the staying helper''s address in LLM_EMBEDDING_URL and an embedding call from inside one returns 1024 numbers -- falsifier: a stability container still shows the removed address or the call fails'
evidence_requirements:
  - kind: tests
    description: The stability render, handler seam and script integration tests pass at the pushed head; they fail at the merge base because the stability script has no render and the handler does not source ONEX_DEPLOY_LANE_ENV_EXPORTS there.
    command: uv run pytest scripts/deploy-agent/tests/unit/test_stability_refresh_llm_endpoint_env_omn24119.py tests/scripts/test_deploy_runtime_lane_env_exports_omn24119.py tests/integration/scripts/test_refresh_stability_lane_overlay_embedding_omn24119.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
