title: Resolve the drain-proof gate's old_topic to its physical name before the lag lookups
summary: ServiceDrainProofGate.evaluate compared the contract-declared canonical old_topic against consumer-group lag keyed by physical topic names, so under a configured topic namespace a completed drain could never be proven. omnibase_infra#4714 applies the namespace at the two lag lookups and keeps the decision record canonical. This contract records the acceptance-criterion bindings a second lane accepted.
