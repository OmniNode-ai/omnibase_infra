schema_version: 1.0.0
ticket_id: OMN-24495
title: Registration rows can name the runtime they belong to (new optional column)
summary: >-
  registration_projections gains runtime_entity_id UUID NULL with a partial index (forward migration 117). The schema file, the projector contract column list, the projection model, the reader mapper and the allowed-column lists of both the update and the upsert intent effects carry it, so a later change can write it. Nothing writes the column yet; every existing row reads None.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn24495-runtime-entity-id-column
    statement: The registration projection has a nullable runtime_entity_id column that every column listing agrees on and no old row is disturbed.
    acceptance:
      - id: AC1
        statement: "AC1: the forward migration adds runtime_entity_id as a nullable UUID with a partial index to a registration table that already holds rows, and old rows read None -- falsifier: the migration test fails if the column or index is absent or an old row reads a value"
      - id: AC2
        statement: "AC2: the table definition, the projector column list and the allowed-column lists of both write paths name the same columns -- falsifier: the schema sync test fails when the column is missing from any one of them"
      - id: AC3
        statement: "AC3: an update or upsert whose runtime_entity_id is a UUID and one whose value is a string both round-trip through the upsert adapter -- falsifier: leaving the column out of the upsert's UUID list makes the string form fail"
      - id: AC4
        statement: "AC4: integrated: after the dev runtime runs the merged revision, the column exists with every row empty, registration rows keep updating, and no registration write error is logged over three heartbeat periods -- falsifier: the column absent, a row holding a value, or a write refusal read on the running dev runtime"
evidence_requirements:
  - kind: tests
    description: The unit tests of the column and, on a real Postgres, the migration test; both fail at the merge base.
    command: uv run --frozen pytest tests/unit/runtime/test_registration_runtime_entity_id_column.py tests/integration/projectors/test_registration_runtime_entity_id_migration.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24495-ac1
    description: 'AC1: migration 117 applied to a pre-117 table that holds rows adds the nullable column and the partial index; old rows read None. Fails at the merge base, where the migration file does not exist.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_registration_runtime_entity_id_column.py -q --no-cov -p no:cacheprovider -k "migration_117 or Reader"
        cwd: .
  - id: dod-omn24495-ac2
    description: 'AC2: the schema sync tests read the DDL, the contract column list, both allowed-column lists and the model; each fails at the merge base.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_registration_runtime_entity_id_column.py -q --no-cov -p no:cacheprovider -k TestSchemaSyncRuntimeEntityId
        cwd: .
  - id: dod-omn24495-ac3
    description: 'AC3: the UUID and the string form of runtime_entity_id both reach the projector as a UUID; the control test shows the string form staying a string when the column is left out of the upsert UUID list.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_registration_runtime_entity_id_column.py -q --no-cov -p no:cacheprovider -k "RoundTripUpsert or UpdateAdapter"
        cwd: .
  - id: dod-omn24495-ac4
    description: 'hosted proxy for AC4: the unit tests pass here; the column and the registration write path on the running dev runtime are read after the deploy and posted as a pull request comment naming the running revision.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_registration_runtime_entity_id_column.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24495-integration-proof
    description: 'Run the migration test on a real Postgres at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24495 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/integration/projectors/test_registration_runtime_entity_id_migration.py -q -n 0 --no-cov
        cwd: .
