schema_version: 1.0.0
ticket_id: OMN-26121
title: A stability roll flips its broker to SASL before it recreates a client, so the tenant-projection writer stops crash-looping on IllegalSaslStateError
summary: >-
  Agent jobs d1d52aac-9cf9-4307-b3dc-c0f8499dc0a0 and 53c37071-39e5-4b3c-a1b2-5dc3c5cc028b failed in the runtime phase with "stability lane writer tenant-projection-writer is not stable after the recreate: status=running health=starting restarts=1". The recreated writer carries KAFKA_SECURITY_PROTOCOL SASL_PLAINTEXT (the stability compose overlay) and logs aiokafka IllegalSaslStateError against redpanda:9092, because the stability broker holds enable_sasl=false, no SCRAM user and no superusers, and the overlay's redpanda-scram-user and redpanda-sasl-enable one-shots were never started: the roll recreates clients with up -d --no-deps, which bypasses their depends_on chain, and the agent's control-plane one-shot list names only redpanda-partition-cap. The roll step handed to the runtime up now runs the lane's declared SASL one-shots in the overlay's order, each to exit 0, before it recreates a writer; a one-shot that does not exit 0 fails the roll with no writer recreated, and a lane whose compose declares neither starts nothing. The step lives in runtime_cost_estimator_build.py, so the baselined executor gains no code line.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26121-stability-sasl-flip
    statement: A stability roll runs redpanda-scram-user and then redpanda-sasl-enable, each to exit 0, before it recreates a writer.
    acceptance:
      - id: AC5
        statement: "AC5: the roll runs the principal one-shot, then the flip one-shot, then recreates the writers, and starts no one-shot on a lane whose compose declares none -- falsifier: `uv run pytest scripts/deploy-agent/tests/unit/test_stability_broker_sasl_flip_omn26121.py -k 'flipped or declares_no' -q --no-cov` exits non-zero"
      - id: AC6
        statement: "AC6: a one-shot that does not exit 0 fails the roll and no writer is recreated -- falsifier: `uv run pytest scripts/deploy-agent/tests/unit/test_stability_broker_sasl_flip_omn26121.py -k 'does_not_exit or failed_principal' -q --no-cov` exits non-zero"
evidence_requirements:
  - kind: tests
    description: The roll order and refusal assertions in the new test file, and the neighbouring roll tests.
    command: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_stability_broker_sasl_flip_omn26121.py scripts/deploy-agent/tests/unit/test_stability_writers_follow_runtime_omn24903.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26121-ac5-flip-order
    description: The roll runs both one-shots in order before any writer and starts none where the compose declares none.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_stability_broker_sasl_flip_omn26121.py -k "flipped or declares_no" -q --no-cov
        cwd: .
  - id: dod-omn26121-ac6-one-shot-failure
    description: A one-shot that does not exit 0 fails the roll before any writer is recreated.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_stability_broker_sasl_flip_omn26121.py -k "does_not_exit or failed_principal" -q --no-cov
        cwd: .
  - id: dod-omn26121-sasl-flip-deploy
    description: Hermetic probe of the landing branch, run by the hosted runner. It reads the roll step from the checked-out tree and the PR branch and requires the SASL one-shot list; the name does not exist on the merge base, so the command exits non-zero before this change.
    source: manual
    binds_ac: [AC5, AC6]
    checks:
      - check_type: command
        check_value: >-
          grep -F 'BROKER_SASL_ONESHOTS' src/omnibase_infra/nodes/node_setup_local_provision_effect/runtime_cost_estimator_build.py > /dev/null && gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_setup_local_provision_effect/runtime_cost_estimator_build.py?ref=omn-26121-stability-sasl-flip-roll' --jq .content | base64 -d | grep 'BROKER_SASL_ONESHOTS' > /dev/null
        cwd: .
  - id: dod-omn26121-integration-proof
    description: The shipped converge_broker_sasl runs against a real docker executable on PATH; both one-shots run in order and wait to exit 0, a non-zero exit raises, and a lane declaring neither starts nothing. It binds no criterion; the hosted proof is dod-omn26121-ac5-flip-order and dod-omn26121-ac6-one-shot-failure.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/docker/test_broker_sasl_converge_omn26121.py -q --no-cov -n 0
        cwd: ${OMNI_HOME}/omnibase_infra
