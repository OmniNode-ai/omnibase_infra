schema_version: 1.0.0
ticket_id: OMN-26121
title: A stability roll flips its broker to SASL before it recreates a client, so the tenant-projection writer stops crash-looping on IllegalSaslStateError
summary: >-
  Agent jobs d1d52aac-9cf9-4307-b3dc-c0f8499dc0a0 and 53c37071-39e5-4b3c-a1b2-5dc3c5cc028b failed in the runtime phase with "stability lane writer tenant-projection-writer is not stable after the recreate: status=running health=starting restarts=1". The recreated writer carries KAFKA_SECURITY_PROTOCOL SASL_PLAINTEXT (the stability compose overlay) and logs aiokafka IllegalSaslStateError against redpanda:9092, because the stability broker holds enable_sasl=false, no SCRAM user and no superusers, and the overlay's redpanda-scram-user and redpanda-sasl-enable one-shots were never started: the roll recreates clients with up -d --no-deps, which bypasses their depends_on chain, and the agent's control-plane one-shot list names only redpanda-partition-cap. The roll step handed to the runtime up now runs the lane's declared SASL one-shots in the overlay's order, each to exit 0, before it recreates a writer; a one-shot that does not exit 0 fails the roll with no writer recreated, and a lane whose compose declares neither starts nothing. The step lives in runtime_cost_estimator_build.py, so the baselined executor gains no code line.

  The C15 chain-canary probe (run 45039982224) and the C16 receipt-identity probe (run 45039078949) submit to the stability gateway and read 503 "authentication is temporarily unavailable". The stability omninode_cloud database holds 0 tables, so the gateway has no identity tables to resolve a key against. T14 of the reviewed runtime tenant and key plan is built here as seam files under docker/migrations/seams/ (tenant_identity_schema.sql creates the eight tables only where absent and never alters one; tenant_identity_schema_readback.sql compares every column, constraint and index with the declared set and raises on any difference). A new entry seam, tenant_identity_gateway_lane.sql, included first by gateway_runtime_grants.sql (which the runner already applies, outside slots), runs them only where the rendered forward-migration carries ONEX_MIGRATION_GATEWAY_LANE; the runner is a baselined file and gains no code line. That indicator and tenant_api_keys_expiry.sql are T6's minimum, carried by this change because T6 is not on dev; no other T6 item is included. The stability and dev lane compose files set the indicator; the base compose file, the catalog and the collaborator lane never do.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26121-stability-sasl-flip
    statement: A stability roll runs redpanda-scram-user and then redpanda-sasl-enable, each to exit 0, before it recreates a writer.
    acceptance:
      - id: AC5
        statement: "AC5: the roll runs the principal one-shot, then the flip one-shot, then recreates the writers, and starts no one-shot on a lane whose compose declares none -- falsifier: `uv run pytest scripts/deploy-agent/tests/unit/test_stability_broker_sasl_flip_omn26121.py -k 'flipped or declares_no' -q --no-cov` exits non-zero"
      - id: AC6
        statement: "AC6: a one-shot that does not exit 0 fails the roll and no writer is recreated -- falsifier: `uv run pytest scripts/deploy-agent/tests/unit/test_stability_broker_sasl_flip_omn26121.py -k 'does_not_exit or failed_principal' -q --no-cov` exits non-zero"
  - id: req-omn26121-identity-schema-seam
    statement: On a lane whose forward-migration carries ONEX_MIGRATION_GATEWAY_LANE (dev, stability_test) the grant seam's entry creates the missing tenant identity tables, adds tenant_api_keys.expires_at and reads the whole schema back; on every other lane it skips by name.
    acceptance:
      - id: AC1
        statement: "AC1: the create step creates each of the eight tables only when it is absent, never alters, drops or deletes, and leaves expires_at to the expiry seam -- falsifier: `uv run pytest tests/unit/test_tenant_identity_schema_seam.py -k 'create_step' -q --no-cov` exits non-zero"
      - id: AC2
        statement: "AC2: the readback declares every column, constraint and index of the eight tables (expires_at and its index included) and raises on a difference -- falsifier: `uv run pytest tests/unit/test_tenant_identity_schema_seam.py -k 'readback' -q --no-cov` exits non-zero"
      - id: AC3
        statement: "AC3: the entry seam runs create, then expiry, then readback for dev and stability_test only, before the gateway grants, skips by name when the indicator is unset or unknown, and the runner gains no code line -- falsifier: `uv run pytest tests/unit/test_tenant_identity_schema_seam.py -k 'runner or entry or grants_seam' -q --no-cov` exits non-zero"
      - id: AC4
        statement: "AC4: the dev and stability compose files carry the indicator with their lane's value and no other compose file and no catalog file carries it -- falsifier: `uv run pytest tests/unit/test_tenant_identity_schema_seam.py -k 'indicator or carries' -q --no-cov` exits non-zero"
  - id: req-omn26121-stability-lane-declaration
    statement: The stability runtime mounts the lane declaration folder at /etc/onex/workspace-config/config/lab, so the gateway batch-ingest door's lifespan resolves its broker and /health no longer answers 503 with DelegateLaneSelectionError after the stability follow.
    acceptance:
      - id: AC7
        statement: "AC7: the stability compose mounts ${ONEX_LANE_DECLARATION_DIR} read-only on omninode-runtime at /etc/onex/workspace-config/config/lab as a required variable, and refresh_stability_lane.sh exports the folder -- falsifier: `uv run pytest tests/ci/test_stability_lane_declaration_mount_omn26121.py -q --no-cov` exits non-zero"
      - id: AC8
        statement: "AC8: a stability job of the deploy agent and the stability warm refresh hold the real folder, refuse a folder with no ci_bus_lanes.yaml, and no other lane than dev and stability gains the variable -- falsifier: `uv run pytest scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py scripts/deploy-agent/tests/unit/test_stability_refresh_llm_endpoint_env_omn24119.py -q --no-cov` exits non-zero"
  - id: req-omn26121-readback-rendering
    statement: The tenant identity readback accepts a check written as TRIM(BOTH FROM x) and one written as btrim(x) as the same constraint, so a volume built by the create seam passes it and the gateway_runtime grants that follow it are applied; every other column, constraint and index difference still raises.
    acceptance:
      - id: AC9
        statement: "AC9: the readback folds TRIM(BOTH FROM x) to btrim(x) on both the declared and the live side and nothing else, and the create seam's btrim rendering is the one it must accept -- falsifier: `uv run pytest tests/unit/test_tenant_identity_schema_seam.py -k 'trim_both or btrim_rendering' -q --no-cov` exits non-zero"
  - id: req-omn26121-stability-readback-lanes
    statement: The chain canary's projection (link 2) and ledger (link 5) readbacks may be declared on a non-dev lane whose block names its authorizing ticket, so the lane the workflow grades resolves to a DSN name instead of raising, while a block with no authorization stays refused.
    acceptance:
      - id: AC10
        statement: "AC10: a projection readback block that names authorized_by resolves to its dsn_env name on a non-dev lane, and one that does not stays refused -- falsifier: `uv run pytest tests/unit/nodes/node_chain_canary_effect/test_projection_dsn_declaration_omn18060.py -k authorization -q --no-cov` exits non-zero"
      - id: AC11
        statement: "AC11: a ledger readback block that names authorized_by resolves to its dsn_env name on a non-dev lane, a projection authorization does not authorize the ledger leg, and every unauthorized non-dev lane stays refused for both legs -- falsifier: `uv run pytest tests/unit/nodes/node_chain_canary_effect/test_lane_ledger_readback.py tests/unit/nodes/node_chain_canary_effect/test_projection_dsn_declaration_omn18060.py -q --no-cov` exits non-zero"
      - id: AC12
        statement: "AC12: the rebuild trigger's strict overlay model accepts authorized_by inside a readback block as a string, refuses it as any other type, and still refuses every other unknown key -- falsifier: `uv run pytest tests/unit/scripts/test_omn_18083_lane_model_tracks_the_live_overlay.py -q --no-cov` exits non-zero"
  - id: req-omn26121-stability-reads-infisical
    statement: The stability probes C15 (chain-canary.yml), C16 (chain-canary-c16-receipt-identity.yml) and C11 (chain-canary-c11-negative-paths.yml) read KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD, CHAIN_CANARY_PROJECTION_DSN and CHAIN_CANARY_GATEWAY_API_KEY from the stability Infisical at run time through the runner's machine identity, never from a repository or environment secret, and a missing value fails the fetch step naming the variable, the Infisical name and the store path.
    acceptance:
      - id: AC13
        statement: "AC13: no stability probe workflow reads secrets.KAFKA_SASL_*, secrets.CHAIN_CANARY_PROJECTION_DSN or secrets.CHAIN_CANARY_GATEWAY_API_KEY, each calls the fetch action before its probe step with exactly the names it needs, and no step re-declares a fetched name -- falsifier: `uv run pytest tests/ci/test_stability_probes_read_infisical_omn26121.py -k 'repository_secret or fetch_precedes or re_declare' -q --no-cov` exits non-zero"
      - id: AC14
        statement: "AC14: the fetch action masks every value before exporting it, prints no value outside the mask command, exports nothing when any name is missing, refused or the identity or login fails, and names the variable, the Infisical name and the store path -- falsifier: `uv run pytest tests/ci/test_stability_probes_read_infisical_omn26121.py -k 'masked or missing_value or refused or identity' -q --no-cov` exits non-zero"
