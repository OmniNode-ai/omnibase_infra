  - kind: tests
    description: The seam, runner and compose assertions in the new test file.
    command: uv run --frozen pytest tests/unit/test_tenant_identity_schema_seam.py -q --no-cov
  - kind: tests
    description: The stability lane declaration mount, the agent render and the stability refresh assertions.
    command: uv run --frozen pytest tests/ci/test_stability_lane_declaration_mount_omn26121.py scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py scripts/deploy-agent/tests/unit/test_stability_refresh_llm_endpoint_env_omn24119.py -q --no-cov
  - kind: tests
    description: The fetch action's behaviour against a loopback store and the three workflows' wiring.
    command: uv run --frozen pytest tests/ci/test_stability_probes_read_infisical_omn26121.py tests/ci/test_chain_canary_workflow.py -q --no-cov
