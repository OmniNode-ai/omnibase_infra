schema_version: "1.0.0"
ticket_id: OMN-19988
title: Infra vendoring of the local_environment node migrations
summary: >-
  Infra half only: vendors omnimarket node migrations 0000-0002 of node_projection_local_environment byte for byte, with their ledger rows and classes, fences the FORCE step, and carries an interim grant declaration until omnimarket's node contract declares the relation. The verdicts, the store and the Environment panel are the omnimarket and omnidash halves. This check proves deployment identity, not acceptance of the criterion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19988-ac1-infra-vendor
    statement: >-
      Migrations 0000-0002 of node_projection_local_environment are deployed byte-identical to the omnimarket source they were copied from, each with one checksum-bound ledger row and the class the migration class checker reads from its statements, and only the FORCE step is fenced.
    acceptance:
      - id: AC1
        statement: "AC1: In mode 2 stopping one compose service turns its row `DOWN` and opens one `SERVICE_DOWN` alert with nobody running a status command; a failing health check turns `UNHEALTHY`; losing the observer or broker turns every row `STALE` after the deadline; a replay of the same health events changes no row -- falsifier: the omnimarket test run with uv run pytest fails any case"
evidence_requirements:
  - kind: tests
    description: Infra deployment half only; the vendored bytes, ledger checksums, classes and fence match the pinned omnimarket source.
    command: uv run pytest tests/unit/migrations/test_omn19988_local_environment_vendor.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19988-ac1-infra-vendor-0000-0002
    description: Infra half only. Pins the source bytes of 0000-0002, their exact ledger checksums and classes, and that only 0002 (FORCE ROW LEVEL SECURITY) is fenced. It does not prove the verdicts, the store or the panel.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn19988_local_environment_vendor.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
