schema_version: 1.0.0
ticket_id: OMN-21864
title: The lab declaration lets one login hold six machine principals instead of five (AC1)
summary: Raises max_devices_per_login in deploy/lab/developer-principal-grants.yaml from 5 to 6 so the h053 machine can be minted a login under the operator's tailnet login. The local declaration for the developer-run broker is untouched. The operator approved the cap change and the issuer recreate on 2026-11-01.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: The lab declaration loads through the issuer's own reader and holds a cap of six, and the plan, parity and issuer suites still pass with it.
    command: uv run --frozen pytest tests/scripts/test_lab_device_cap_omn21864.py tests/scripts/test_developer_principal_grants_parity.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-lab-device-cap-six
    description: The lab declaration, read by the issuer's load_declaration, holds max_devices_per_login of 6. At the merge base it holds 5, so the test fails there.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/scripts/test_lab_device_cap_omn21864.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-lab-local-parity
    description: The lab and local declarations still agree on every grant, so the cap change did not split them.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/scripts/test_developer_principal_grants_parity.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-lab-device-cap-deploy-probe
    description: Hosted-runner deploy probe reads the lab declaration from GitHub at the checked-out commit and requires the cap of six, so a checkout without the change fails it.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: |-
          set -eu;
          doc="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/deploy/lab/developer-principal-grants.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d)";
          grep -q '^max_devices_per_login: 6$' <<<"$doc"
        cwd: ${OMNI_HOME}/omnibase_infra
requirements:
  - id: req-lab-device-cap
    statement: One tailnet login can hold six machine principals on the lab broker.
    acceptance:
      - id: AC1
        statement: The lab declaration's max_devices_per_login is 6, a test reads it through the issuer's own load_declaration, and the lab and local declarations still agree on every grant.
