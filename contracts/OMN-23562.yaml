schema_version: "1.0.0"
ticket_id: OMN-23562
title: "Load topic code only when a command uses it, so the command line starts fast"
summary: "The omnibase_infra.event_bus and omnibase_infra.topics package files imported every export when any submodule was imported, so the credential resolver and the ledger command loaded the generated topic enums (omnibase_infra.topics.platform_topic_suffixes) and omnibase_core.validation before any command ran. Both package files now resolve their exports on first read (the module-level __getattr__ the handlers package already uses), and the topic resolver imports the suffix validator when it first resolves a topic."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23562-lazy-topic-imports
    statement: Importing the CLI's credential resolver or the ledger command module does not import the generated topic module, and every name the two packages export still imports from the package.
    acceptance:
      - id: AC1
        statement: 'AC1: the command line prints its help in under 1.5 s on h053, median of five runs -- falsifier: the same command took 2.4 to 2.7 s before the change'
      - id: AC2
        statement: 'AC2: importing the command module omnibase_infra.cli.delegate_lane_credentials does not import topics.platform_topic_suffixes -- falsifier: a test that lists the modules loaded by that import fails while the topic module is among them'
      - id: AC3
        statement: 'AC3: integrated: after the change merges and a lab host installs it through its declared installer, onex ledger --help on that host prints in under 1.5 s, read from the installed command -- falsifier: the installed command before the change took 2.7 s'
evidence_requirements:
  - kind: tests
    description: The import-list tests and the existing delegate import-cost test pass at the head.
    command: uv run pytest tests/unit/cli/test_cli_startup_lazy_topics_omn23562.py tests/unit/cli/test_cli_delegate_import_cost.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23562-ac1
    description: 'hosted proxy for AC1: the import-list tests pass at the head, and at the merge base the two module-list tests fail because the topic module is loaded; the median-of-five help timing on a lab host is posted as a pull request comment naming the head.'
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_cli_startup_lazy_topics_omn23562.py -q -k ledger_command_module
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23562-ac2
    description: 'AC2: a fresh interpreter importing omnibase_infra.cli.delegate_lane_credentials does not load omnibase_infra.topics.platform_topic_suffixes; a positive control shows the detector reports that module when it is imported.'
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_cli_startup_lazy_topics_omn23562.py -q -k "credential_module or detector_reports"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23562-ac3
    description: 'hosted proxy for AC3: the lazy exports resolve to their defining modules and the topic resolver still refuses a malformed suffix; the installed-command reading on a lab host is posted as a pull request comment naming the head.'
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_cli_startup_lazy_topics_omn23562.py -q -k "lazy_package or topic_resolver_still"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23562-integration-proof
    description: the import-list tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/cli/test_cli_startup_lazy_topics_omn23562.py tests/unit/cli/test_cli_delegate_import_cost.py tests/integration/cli/test_topic_constants_runpy_omn23562.py -q'
        cwd: ${OMNI_HOME}/omnibase_infra
