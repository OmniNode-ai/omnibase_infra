schema_version: "1.0.0"
ticket_id: OMN-25330
title: "The dev lane refresh finds onex-runtime-deploy in whichever manifest clone holds it, so it runs on h201"
summary: "refresh_dev_lane.sh, refresh_stability_lane.sh and cut-lab-ref.sh resolve onex-runtime-deploy through resolve_runtime_deploy, which looked in one fixed clone's venv. That command moved to another first-party clone, so on h201 a refresh run exited 64 with 'onex-runtime-deploy not found' before it rendered the lane env, and the hourly integration pass read omnibase_infra PR 5928 as not running. The resolver now takes the first clone of the sibling clone manifest under the registry root whose venv holds the command (DEPLOY_RUNTIME_HOME names one clone instead), and names no clone in its code."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25330-refresh-finds-the-command
    statement: A lane refresh script run on a host where some manifest clone holds the command finds it without an operator-named DEPLOY_RUNTIME, and a run on h201 is read, with the revision it ran from.
    acceptance:
      - id: AC1
        statement: 'AC1: one run line of the dev lane refresh that renders LLM_EMBEDDING_URL from the overlay is read on h201 by the lane itself, from a named installed revision that contains the merge -- falsifier: the log, job record or health read on h201 holds no refresh line newer than the lane''s CLAIM, or `git merge-base --is-ancestor <merge commit> <installed revision>` exits non-zero'
      - id: AC2
        statement: 'AC2: the merged change is installed through the declared installer (no hand edit of a host file, unit or plist), or the single measured cause that it cannot run is written with who must act -- falsifier: the STATUS row cites no installer receipt and no measured cause with an actor'
      - id: AC3
        statement: 'AC3: a STATUS row reads kv pr=omnibase_infra#5928 installed=<host>:<revision> observed=<what ran> read_at=<UTC>, written after the lane read the run itself -- falsifier: a search of the ledger for ''pr=omnibase_infra#5928'' with ''installed='' finds no row newer than the lane''s CLAIM'
evidence_requirements:
  - kind: tests
    description: The resolver tests pass at the pushed head; the manifest-clone tests fail against the previous resolver.
    command: uv run pytest tests/scripts/test_resolve_runtime_deploy_omn20687.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25330-ac1
    description: 'AC1 hosted part: the resolver finds the command in a later manifest clone under the registry root, the shape h201 has, without DEPLOY_RUNTIME, and searches no directory outside the manifest'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: uv run pytest tests/scripts/test_resolve_runtime_deploy_omn20687.py -q -p no:randomly --no-cov -k "wherever_it_sits or outside_the_manifest or first_manifest"
        cwd: .
  - id: dod-omn25330-ac2
    description: 'AC2: every branch of the resolution order and the loud failure naming each path looked in pass at the head'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: uv run pytest tests/scripts/test_resolve_runtime_deploy_omn20687.py -q -p no:randomly --no-cov
        cwd: .
  - id: dod-omn25330-ac3-ledger-row
    description: 'AC3: the ledger holds a STATUS row for omnibase_infra PR 5928 that names an installed host and revision. Only the local Done gate runs this unbound check; it reads the rolling ledger.'
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: python3 "$OMNI_PLUGIN_ROOT/skills/lane-brief/scripts/lane_brief.py" grep 'pr=omnibase_infra#5928 installed=h201:' | grep -q 'lane=run5928-1139'
        cwd: .
