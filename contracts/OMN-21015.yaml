schema_version: "1.0.0"
ticket_id: OMN-21015
title: Infra vendoring of the tier-mix and usage tier-share node migrations
summary: >-
  Infra half only: vendors omnimarket node migrations 0060 (model-routing tier models, AC2) and 0003 (usage tier share and sent cursor, AC4) byte for byte, each with its ledger row and class. The view, the writer and the pages are the omnimarket and omnidash halves. These checks prove deployment identity, not page acceptance of either criterion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21015-ac2-ac4-infra-vendor
    statement: >-
      Migrations 0060 and 0003 are deployed byte-identical to the omnimarket source they were copied from, each with one checksum-bound ledger row and the class the migration class checker reads from its statements.
    acceptance:
      - id: AC2
        statement: "AC2: Overview's Tier mix lists each model under its tier with its share of runs and its cost -- falsifier: a fixture with two models in one tier renders one row, or model shares that do not sum to the tier's share"
      - id: AC4
        statement: "AC4: Usage shows tokens in and tokens out per day as a stacked series split by model (requirement US-1), and its by-model table shows each model's share of calls and its tier beside the calls column it already has -- falsifier: the window sums differ from `onex metering --json`, or the shares do not sum to 100"
evidence_requirements:
  - kind: tests
    description: Infra deployment half only; the vendored 0060 and 0003 bytes, ledger checksums and forward-only classes match the pinned omnimarket sources.
    command: uv run pytest tests/unit/migrations/test_omn21015_tier_share_vendor.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21015-ac2-infra-vendor-0060
    description: Infra half only. Pins 0060's source bytes, exact ledger checksum and forward-only class. It does not prove the view's figures or the Tier mix page.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn21015_tier_share_vendor.py -q -k 0060
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
  - id: dod-omn21015-ac4-infra-vendor-0003
    description: Infra half only. Pins 0003's source bytes, exact ledger checksum and forward-only class. It does not prove the writer's shares or the Usage page.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn21015_tier_share_vendor.py -q -k 0003
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC4]
