schema_version: "1.0.0"
ticket_id: OMN-21015
title: Infra vendoring of the tier-mix node migration
summary: >-
  Infra half only: vendors omnimarket node migration 0060 (model-routing tier models, AC2) byte for byte, with its ledger row and class. The view and the Tier mix page are the omnimarket and omnidash halves. This check proves deployment identity, not page acceptance of the criterion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21015-ac2-infra-vendor
    statement: >-
      Migration 0060 is deployed byte-identical to the omnimarket source it was copied from, with one checksum-bound ledger row and the class the migration class checker reads from its statements.
    acceptance:
      - id: AC2
        statement: "AC2: Overview's Tier mix lists each model under its tier with its share of runs and its cost -- falsifier: a fixture with two models in one tier renders one row, or model shares that do not sum to the tier's share"
evidence_requirements:
  - kind: tests
    description: Infra deployment half only; the vendored 0060 bytes, ledger checksum and forward-only class match the pinned omnimarket source.
    command: uv run pytest tests/unit/migrations/test_omn21015_tier_models_vendor.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21015-ac2-infra-vendor-0060
    description: Infra half only. Pins 0060's source bytes, exact ledger checksum and forward-only class. It does not prove the view's figures or the Tier mix page.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn21015_tier_models_vendor.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
