schema_version: "1.0.0"
ticket_id: OMN-21015
title: Infra vendoring of the usage tier-share node migration
summary: >-
  Infra half only: vendors omnimarket node migration 0003 (usage tier share, AC4) byte for byte, with its ledger row and class. 0003 is expand-only by Jonah's ruling of 2026-10-15: it keeps the three-column key and adds a four-column unique index, which a later contract migration makes the key. The writer and the Usage page are the omnimarket and omnidash halves. This check proves deployment identity, not page acceptance of the criterion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21015-ac4-infra-vendor
    statement: >-
      Migration 0003 is deployed byte-identical to the omnimarket source it was copied from, with one checksum-bound ledger row and the class the migration class checker reads from its statements.
    acceptance:
      - id: AC4
        statement: "AC4: Usage shows tokens in and tokens out per day as a stacked series split by model (requirement US-1), and its by-model table shows each model's share of calls and its tier beside the calls column it already has -- falsifier: the window sums differ from `onex metering --json`, or the shares do not sum to 100"
evidence_requirements:
  - kind: tests
    description: Infra deployment half only; the vendored 0003 bytes, its kept three-column key, ledger checksum and forward-only class match the pinned omnimarket source.
    command: uv run pytest tests/unit/migrations/test_omn21015_usage_tier_key_vendor.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21015-ac4-infra-vendor-0003
    description: Infra half only. Pins 0003's source bytes, that it keeps the three-column key, its exact ledger checksum and forward-only class. It does not prove the writer's shares or the Usage page.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn21015_usage_tier_key_vendor.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC4]
