    description: "AC1 hosted probe. The migration, its manifest row and its class are present and the grant is SELECT-only behind the role guard."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/migrations/test_omn20737_work_ledger_ro_state_grant.py -q -n 0"
