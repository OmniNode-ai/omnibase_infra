schema_version: 1.0.0
ticket_id: OMN-26650
title: 'the dod_verify and autoclose hosted checks import their scripts module, so a merged ticket reads real evidence at the Done gate'
summary: 'The evidence autoclose sweep reads contracts from a sparse, contracts-only clone (contract-roots/<repo>). The verifier anchors a relative check cwd at the repository that owns the contract file, so a contract saying cwd: . ran uv run pytest in that tree, where the root conftest.py imports scripts.hooks and the tree holds no scripts/. Run 44672842883 recorded 26 checks of 8 omnibase_infra tickets as FAILED with ModuleNotFoundError: No module named scripts (exit 4, no test collected). The sweep now hands the verifier the materialised product clone under OMNI_HOME as its CONTRACT_REPO_DIR.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26650-scripts-import
    statement: A relative-cwd check of a merged ticket runs in the product clone the sweep materialises, so its root conftest.py imports the scripts package and the check reads real evidence.
    acceptance:
      - id: AC1
        statement: 'AC1: a regression test built from the recorded autoclose failure output (fixture path) fails on the broken import and passes on the fix -- falsifier: uv run pytest -k scripts_import in the owning repository'
      - id: AC2
        statement: 'AC2: one dod_verify run on a merged ticket reads real evidence and does not report No module named scripts -- falsifier: onex dod_verify run on OMN-26594 whose output carries no ModuleNotFoundError'
      - id: AC3
        statement: 'AC3: integrated: the dod_verify node running on the dev lane reads a merged ticket''s contract and returns a verdict from real check runs -- falsifier: onex node run of dod_verify on the dev lane against OMN-26594, read back verdict is PASS or a named FAIL, never CHECK_RUN_READ_FAILED'
evidence_requirements:
  - kind: tests
    description: The scripts import regression test passes at the pushed head.
    command: uv run pytest tests/unit/nodes/node_evidence_autoclose_sweep_effect/test_omn_26650_scripts_import_anchor.py -k scripts_import -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26650-ac1
    description: 'AC1: the regression test is built from the recorded sweep failure fixture; its fix-and-no-fix cases fail on the sparse anchor and pass on the materialised clone, and the test file is absent at the merge base so the check fails there (must-fail control).'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_evidence_autoclose_sweep_effect/test_omn_26650_scripts_import_anchor.py -k scripts_import -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26650-ac2-dod-verify-run
    description: 'AC2: one dod_verify run on the merged ticket OMN-26594 reads its checks and the output carries no ModuleNotFoundError; read on the lab host with the contract of the product clone, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          out="$(scripts/onex skill dod_verify OMN-26594 --execution-audience hosted --contract-path contracts/OMN-26594.yaml 2>&1)"; printf '%s' "$out" | grep -q '"ticket_id":"OMN-26594"' && ! printf '%s' "$out" | grep -q ModuleNotFoundError
        cwd: .
  - id: dod-omn26650-ac3-dev-lane-verdict
    description: 'AC3: the dod_verify node publishes its terminal verdict to the dev lane for OMN-26594 and the verdict is a named status read from real check runs, never check_run_read_failed; read on the lab host, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          out="$(scripts/onex skill dod_verify OMN-26594 --execution-audience hosted --contract-path contracts/OMN-26594.yaml 2>&1)"; printf '%s' "$out" | grep -q 'terminal published to lane dev topic' && printf '%s' "$out" | grep -qE '"verified_count":[1-9]' && ! printf '%s' "$out" | grep -qi check_run_read_failed
        cwd: .
