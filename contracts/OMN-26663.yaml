schema_version: "1.0.0"
ticket_id: "OMN-26663"
title: "The runtime account is granted the lab_alerts table in the platform database settings"
summary: "omnibase_infra vendors omnimarket's node_projection_lab_alerts migrations (0000_create_lab_alerts.sql, 0001_grant_omninode_runtime_lab_alerts.sql) into docker/migrations/forward/nodes/node_projection_lab_alerts/ and grants omninode_runtime SELECT, INSERT and UPDATE, and no DELETE, on omninode_internal.lab_alerts in every shipped topology profile, ahead of omnimarket#6788. omninode_internal is a schema the runtime already holds USAGE on; lab_alerts is the table that carried no grant. This change holds the runtime-grant half of the ticket only."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-lab-alerts-runtime-grants"
    statement: "Every shipped topology profile grants the runtime role the lab_alerts table with SELECT, INSERT and UPDATE and no DELETE, the grant derivation reports no drift, and both node migrations are vendored and declared."
    acceptance:
      - id: "AC2666301"
        statement: "AC2666301: the regenerated platform topology lists lab_alerts with select, insert and update for the runtime account in every instance that carries the others -- falsifier: uv run pytest tests/unit/topology/test_omn26663_lab_alerts_vendor.py -q fails on dev, where declared_acl lists no grant for lab_alerts"
      - id: "AC2666302"
        statement: "AC2666302: the two migrations are vendored with their ledger rows and migration classes and the application migration manifest validator prints PASS -- falsifier: uv run python scripts/validation/validate_application_migration_manifest.py exits 1 when a ledger row's sha256 differs from the vendored file"
      - id: "AC2666303"
        statement: "AC2666303: failing control: with the lab_alerts entries removed from a profile's declared grants, the runtime's read of lab_alerts is an empty set -- falsifier: the control case in tests/unit/topology/test_omn26663_lab_alerts_vendor.py first asserts every profile grants lab_alerts, so it fails on dev where no profile does"
evidence_requirements:
  - kind: "tests"
    description: "The vendor tests pass at the head; on the merge base the test file is absent."
    command: "uv run pytest tests/unit/topology/test_omn26663_lab_alerts_vendor.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26663-infra-ac1"
    description: "Hosted probe. Every profile grants the runtime role the lab_alerts table and both migrations are vendored."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_omn26663_lab_alerts_vendor.py -k runtime_role_may_read -q"
        cwd: "."
    binds_ac: ["AC2666301"]
  - id: "dod-omn26663-infra-ac2"
    description: "Hosted probe. The two vendored migrations are present; the new test file is absent at the merge base, so the command fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_omn26663_lab_alerts_vendor.py -k 'vendored or match_omnimarket' -q"
        cwd: "."
    binds_ac: ["AC2666302"]
  - id: "dod-omn26663-infra-ac3"
    description: "Hosted probe. Removing the lab_alerts grant empties the runtime's read; the case fails at the merge base, where no profile grants lab_alerts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_omn26663_lab_alerts_vendor.py -k control -q"
        cwd: "."
    binds_ac: ["AC2666303"]
