schema_version: "1.0.0"
ticket_id: OMN-24017
title: "Move the platform endpoint list's embedding entry to the second graphics card's server"
summary: "The embedding server on the big graphics card shared it with the 27B chat model and pushed it into CUDA out of memory on 2026-11-12; the operator ordered it removed. The endpoint list, the environment template and the shared key registry note named that server. The endpoint list no longer carries the embedding address: its embeddings entry is marked as read from the llm_endpoints overlay (private overlays repository), whose value names the embedding server on the second graphics card (same model, same 1024 dimensions). The deploy guard resolves the address from the overlay and refuses a settings store naming any other address, including the removed one. The dev lane's deploy agent renders the embedding address from that overlay over the host settings store (and rewrites the lane bifrost overlay's local-embedding endpoint the same way), so a normal dev deploy moves the address and no hand edit of the store is needed. A dev deploy whose overlay cannot be read is refused, so this change stays a draft until the overlay is on main of the overlays repository."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24017-embedding-entry-on-4090
    statement: The endpoint list, the environment template and the registry note name the second graphics card's embedding server, and the guard refuses the removed address.
    acceptance:
      - id: AC1
        statement: 'AC1: the endpoint list embedding entry, the environment template and the registry note name the second graphics card server, and the endpoint-list tests refuse any slot naming the removed one -- falsifier: python -m pytest tests/unit/contracts/test_llm_endpoints_contract.py -q fails at the merge base'
      - id: AC2
        statement: 'AC2: the deploy guard accepts a settings store naming the new embedding address and refuses one naming the removed address -- falsifier: python -m pytest tests/scripts/test_check_llm_endpoint_env_contract.py -q -k embedding fails at the merge base'
      - id: AC3
        statement: 'AC3: integrated: with the host settings store line changed to the new address, the dev lane next deploy passes the guard and one embedding request to the endpoint list embedding entry returns 1024 numbers -- falsifier: the guard refuses the deploy or the request fails or returns another length'
  - id: req-omn24017-deploy-renders-overlay-address
    statement: The dev lane deploy agent renders the embedding address and the lane bifrost overlay endpoint from the overlay at its origin/main, over the host settings store.
    acceptance:
      - id: AC4
        statement: 'AC4: the dev-fenced compose environment takes LLM_EMBEDDING_URL, the rewritten lane overlay directory and BIFROST_LOCAL_EMBEDDING_ENDPOINT_URL from the overlay at the clone origin/main and not the clone working tree, an agent not fenced to the dev lane keeps the store value, and an unreadable overlay or a missing slot refuses the deploy -- falsifier: python -m pytest scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py scripts/deploy-agent/tests/unit/test_llm_endpoint_env_render_omn24025.py -q fails at the merge base'
      - id: AC5
        statement: 'AC5: integrated: a dev deploy of this head on the dev host passes the guard with the settings store still naming the removed address, and the running dev runtime carries the overlay address in LLM_EMBEDDING_URL -- falsifier: the guard refuses the deploy or the running container still reads the removed address'
evidence_requirements:
  - kind: tests
    description: The endpoint-list and deploy-guard tests pass at the pushed head; the refusal tests fail at the merge base.
    command: uv run pytest tests/unit/contracts/test_llm_endpoints_contract.py tests/scripts/test_check_llm_endpoint_env_contract.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24017-ac1
    description: 'AC1: the endpoint-list tests pass at the head, including the refusal of a slot naming the removed endpoint'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/contracts/test_llm_endpoints_contract.py -q -p no:randomly --no-cov
        cwd: .
  - id: dod-omn24017-ac2
    description: 'AC2: the deploy-guard tests pass at the head, the removed address is refused and the new address accepted'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: uv run pytest tests/scripts/test_check_llm_endpoint_env_contract.py -q -p no:randomly --no-cov -k embedding
        cwd: .
  - id: dod-omn24017-ac3
    description: 'AC3 hosted part: the guard script run against the contract at the head accepts the new address'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: "sh -c 'mkdir -p /tmp/omn24017/llm_endpoints && printf \"schema_version: 1\\nendpoint_urls:\\n  embeddings-201: http://192.0.2.10:8100\\n\" > /tmp/omn24017/llm_endpoints/overlay.yaml && printf \"LLM_EMBEDDING_URL=http://192.0.2.10:8100\\n\" > /tmp/omn24017-env && ONEX_SKILL_OVERLAY_ROOTS=/tmp/omn24017 python3 scripts/check_llm_endpoint_env_contract.py --env-file /tmp/omn24017-env'"
        cwd: .
  - id: dod-omn24017-ac3-integration-proof
    description: 'AC3 integrated reading: the host settings store line on the dev host names the new address and the guard accepts it. Only the local Done gate runs this unbound check; it needs the dev host.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex scm pr-checks OmniNode-ai/omnibase_infra
        cwd: .
  - id: dod-omn24017-ac4
    description: 'AC4: the dev-fenced compose environment and the render module tests pass at the head'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py scripts/deploy-agent/tests/unit/test_llm_endpoint_env_render_omn24025.py -q -p no:randomly --no-cov
        cwd: .
  - id: dod-omn24017-ac5
    description: 'AC5 hosted part: the dev-fenced compose environment carries the overlay address over a store naming the removed address, and the guard run takes the rendered environment'
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: command
        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py -q -p no:randomly --no-cov -k "golden"
        cwd: .
  - id: dod-omn24017-ac5-integration-proof
    description: 'AC5 integrated reading: a dev deploy of this head passes the guard with the store unchanged and the running container carries the overlay address. Only the local Done gate runs this unbound check; it needs the dev host.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex scm pr-checks OmniNode-ai/omnibase_infra
        cwd: .
