# OMN-21863 contract file for omnibase_infra: the per-repo carrier for the OmniUI parity manifest entry.
schema_version: "1.0.0"
ticket_id: "OMN-21863"
title: "the enforcement parity manifest declares the OmniUI required contexts on main"
summary: "scripts/enforcement_parity_manifest.yaml gains an omniui entry for branch main with two direct required contexts, kb-doc-gate / kb-doc-gate and public-repo-hygiene / public-repo-hygiene, named as the check runs report them. The manifest is read by the report-only parity audit; no branch protection is changed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21863-omniui-contexts-declared
    statement: "The parity manifest declares both OmniUI gates as direct required contexts on main, and the manifest still evaluates."
    acceptance:
      - id: AC1
        statement: "AC1: the manifest lists kb-doc-gate / kb-doc-gate and public-repo-hygiene / public-repo-hygiene under omniui main -- falsifier: at the PR head, loading scripts/enforcement_parity_manifest.yaml and reading repos.omniui.main.load_bearing_gates yields anything other than exactly those two contexts, each with coverage direct"
      - id: AC2
        statement: "AC2: the parity library tests pass with the new entry -- falsifier: uv run pytest tests/ci/test_required_context_parity.py -q fails"
evidence_requirements:
  - kind: tests
    description: "The parity library tests run over the changed manifest."
    command: "uv run pytest tests/ci/test_required_context_parity.py -q -p no:cacheprovider"
dod_evidence:
  - id: dod-001
    description: "Both OmniUI contexts are declared in the manifest."
    source: generated
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: 'python3 -c "import yaml; m=yaml.safe_load(open(\"scripts/enforcement_parity_manifest.yaml\")); g=m[\"repos\"][\"omniui\"][\"main\"][\"load_bearing_gates\"]; assert [(x[\"context\"],x[\"coverage\"]) for x in g]==[(\"kb-doc-gate / kb-doc-gate\",\"direct\"),(\"public-repo-hygiene / public-repo-hygiene\",\"direct\")], g"'
  - id: dod-002
    description: "The parity library tests pass over the changed manifest."
    source: generated
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/ci/test_required_context_parity.py -q -p no:cacheprovider'
