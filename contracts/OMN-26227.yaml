interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26227-core-pin
    statement: The omnibase-core dev merge tag in pyproject.toml, uv.lock and every exact-tag follower name core v0.47.76.
    acceptance:
      - id: AC1
        statement: 'AC1: omnibase_infra pyproject.toml names core tag dev-20261120075721-2a9efbda3548 in [tool.uv.sources] and uv.lock records omnibase-core 0.47.76 at commit 2a9efbda3548 -- falsifier: uv lock --check exits non-zero at the pull request head, or uv run pytest tests/ci/test_core_dev_tag_pin_omn17427.py -q exits non-zero'
      - id: AC2
        statement: 'AC2: every omnibase_infra test the pin move breaks is fixed in the same pull request, with each test change committed together with its fix and no test skipped, xfailed or deleted to pass -- falsifier: uv run pytest tests/ci tests/unit/ci tests/unit/cli tests/unit/runtime -q exits non-zero at the pull request head, or git diff origin/dev --stat shows a removed test file'
      - id: AC3
        statement: 'AC3: a regression test fails when the omnibase-core pin in pyproject.toml and the core version in uv.lock name different core releases, and passes on the pull request head -- falsifier: uv run pytest tests/ci/test_core_dev_tag_pin_omn17427.py -q exits zero with uv.lock edited to core 0.47.75.dev1'
      - id: AC4
        statement: 'AC4: the pull request is ready, handed to landing-controller by one MSG, and one MSG to orchestrator-31d9-swarm names the pull request, its head and the omnibase_infra dev tag that carries the merge (or the exact rule that derives it when the merge has not landed yet) -- falsifier: grep -c ''to=landing-controller'' and grep -c ''to=orchestrator-31d9-swarm'' over the lane''s ledger rows each read 0'
evidence_requirements:
