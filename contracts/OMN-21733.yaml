# OMN-21733 contract file for omnibase_infra: the factory floor page is served from the lab on one tailnet address.
schema_version: "1.0.0"
ticket_id: "OMN-21733"
title: "The factory floor page is served from h051 on the tailnet, with its JSON projection published to it on every tick"
summary: "docker/docker-compose.factory-floor-web.yml runs a read-only static server (nginx, unprivileged, read-only root, no capabilities) whose only published port is bound to the address named by the required FACTORY_FLOOR_BIND_ADDR, and serves the directory named by the required FACTORY_FLOOR_SERVE_DIR read-only. The standalone file is needed because the docker catalog publishes every port on all interfaces. omnimarket's node_factory_floor_publish_effect writes the page and the JSON record into that directory on every tick."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21733-factory-floor-web
    statement: "The factory floor web service publishes one port on one named address, mounts its content read-only, and refuses to render without its deployment values."
    acceptance:
      - id: AC4
        statement: "AC4: the compose file refuses to render without a bind address and binds only that address, mounts the serve directory read-only and publishes no 0.0.0.0 port -- falsifier: uv run pytest tests/unit/docker/test_factory_floor_web_compose.py -q"
      - id: AC5
        statement: "AC5: on the serving host the running container's only port binding is the tailnet address and the port, and the page answers there -- falsifier: ssh h051 docker inspect omninode-factory-floor-web --format '{{json .HostConfig.PortBindings}}'"
  - id: req-omn21733-reports-web
    statement: "The reports site under /reports/ is served by the same read-only server, and only the decision map's directory may load the two pinned scripts it draws its graph with."
    acceptance:
      - id: AC7
        statement: "AC7: the server's default content security policy loads nothing from another host, and only /reports/decision-map/ allows exactly the two pinned CDN script files, keeping the method, cache and dot-file rules -- falsifier: uv run pytest tests/unit/docker/test_factory_floor_web_compose.py -q -k decision_map_directory"
evidence_requirements:
  - kind: tests
    description: "The compose file's port, volume and lock-down properties, and docker compose config refusing each missing deployment value."
    command: "uv run pytest tests/unit/docker/test_factory_floor_web_compose.py -q --no-cov"
  - kind: manual
    description: "Deploy check on the serving host: the container's port bindings name one address, and the page answers on it."
    command: "ssh h051 docker inspect omninode-factory-floor-web --format '{{json .HostConfig.PortBindings}}'"
  - kind: tests
    description: "Deploy check on a hosted Ubuntu runner with Docker: start the candidate in an isolated project, verify nginx syntax, actual port bindings, HTTP policies, dot-file refusal and all six missing-value refusals. Docker absence fails this check."
    command: "deploy: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/docker/test_factory_floor_web_runtime.py -q --no-cov --log-cli-level=INFO"
dod_evidence:
  - id: dod-001
    description: "The compose file binds one named address, mounts the serve directory read-only and requires its deployment values."
    source: generated
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/docker/test_factory_floor_web_compose.py -q --no-cov'
  - id: dod-002
    description: "The rendered compose file publishes exactly one port, bound to the given address and with no default."
    source: generated
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/docker/test_factory_floor_web_compose.py -q --no-cov -k "published_port"'
      - check_type: command
        check_value: "gh api 'repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.factory-floor-web.yml?ref=jonah/omn-21733-reports-web' --jq .content | base64 -d | grep -q 'FACTORY_FLOOR_BIND_ADDR:?set FACTORY_FLOOR_BIND_ADDR'"
  - id: dod-003
    description: "Only the decision map directory may load the two pinned scripts."
    source: generated
    binds_ac: [AC7]
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/docker/test_factory_floor_web_compose.py -q --no-cov -k decision_map_directory'
  - id: dod-004-runtime-readback
    description: "Mandatory behavioral deploy probe for AC4, AC5 and AC7. It runs the digest-pinned candidate on a random loopback port in its own Compose project, checks nginx -t, actual read-only mounts and security settings, GET/HEAD/POST responses, exact CSP and cache headers on successful and error responses, dot files and Compose refusals. It runs on hosted Docker runners without SSH or lab credentials and never skips."
    source: generated
    binds_ac: [AC4, AC5, AC7]
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/docker/test_factory_floor_web_runtime.py -q --no-cov --log-cli-level=INFO'
