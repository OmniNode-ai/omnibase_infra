  - id: "dod-omn20275-dev-broker-deploy-probe"
    description: "Hosted-runner deploy check reads the candidate overlay and generated policy env and exercises the preflight refusal boundary without credentials, SSH, Docker or a running broker. It fails if compose literals replace the required contract variables, on 3G/4g and 6G/8g, or on any value other than the consented 12G/16g. Render tests additionally check Compose merge semantics when the CLI is available."
    source: "manual"
    binds_ac: ["AC13"]
    checks:
      - check_type: "command"
        check_value: 'uv run --frozen pytest tests/unit/infra/test_dev_broker_memory_cap_omn21279.py -q -p no:randomly -n 0 --no-cov -k "checker or deploy_agent_env"'
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac14-runtime-recovery"
    description: "AC14: a failed Kafka start falls back to local delivery and recovers with bounded backoff."
    source: "manual"
    binds_ac: ["AC14"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_runtime_bus_recovery.py tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac15-runtime-recovery"
    description: "AC15: health is degraded, readiness false and one alarm per outage while Kafka is down."
    source: "manual"
    binds_ac: ["AC15"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_runtime_bus_recovery.py tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac16-runtime-recovery"
