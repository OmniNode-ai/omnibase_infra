schema_version: "1.0.0"
ticket_id: "OMN-20275"
title: "Issued developer principals write the work ledger only on their own writer topic"
summary: "The developer principal grant file replaces the shared work-ledger append topic grant with one templated literal topic, onex.cmd.omnimarket.work-ledger-append-from-{principal}.v1, created on issue. The issuer resolves the template per principal, creates that topic, and gains an apply-grants command that re-applies the declared grants to issued principals without setting or rotating a password. The ledger host's own read grants are declared with its login, not in this file."
is_seam_ticket: false
interface_change: true
interfaces_touched: ["public_api"]
requirements:
  - id: "req-per-principal-writer-topic-grants"
    statement: "Each issued principal holds WRITE on its own writer topic only, and grants can be re-applied without a password change."
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: issuance resolves the {principal} template, creates the writer topic and grants WRITE on it to that principal only; a declaration with any other placeholder, a repeated placeholder, a templated non-literal or non-topic grant, or create_topic on an untemplated grant is refused -- falsifier: uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -k "each_principal_can_write_only_its_own_ledger_topic or issuance_creates_the_user or placeholder or create_topic or templated"
      - id: "AC11"
        statement: |-
          AC11: apply-grants re-applies every declared grant to every issued principal in the lane (or the named ones), refuses a principal the broker does not hold, and never sets a password -- falsifier: uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -k "apply_grants or ensuring_an_existing_topic_is_success or other_rpk_failures_are_bad_gateway"
  - id: "req-ci-overlay-binding-shape"
    statement: "The CI publisher accepts the lane's binding fallback and injected secret resolver declarations without changing its transport selection."
    acceptance:
      - id: "AC12"
        statement: "binding_fallback preserves ordered bus names and secret_resolver preserves its convention flag and typed logical-name/source mappings. Both declarations remain optional, unknown keys and malformed shapes are refused, and broker/security selection is unchanged."
  - id: "req-dev-broker-memory-12g"
    statement: "The dev broker on the lab host runs --memory 12G inside an 16g container cap, declared in docker-compose.dev-lane.yml, under the operator consent 2026-10-27T06:37:48Z."
    acceptance:
      - id: "AC13"
        statement: |-
          AC13: the running dev broker container holds a memory cap of 16 GiB and its start command carries --memory 12G, and the deploy preflight accepts exactly that declaration -- falsifier: ssh to the dev lane host and docker inspect omnibase-infra-redpanda reads a Memory other than 17179869184 or a command without --memory 12G
  - id: "req-ledger-stage-b1-ticket-snapshot"
    statement: "Ticket criteria read at dispatch 2026-10-27T07:20:44Z; external ledger behavior is not claimed by this broker-only repair."
    acceptance:
      - id: "AC1"
        statement: "AC1: the serve handler appends a request's rows through the configured append command exactly once: a redelivered request id returns status duplicate with the original line and no second row -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k redelivered_request_appends_once"
      - id: "AC2"
        statement: "AC2: a request whose append command exits 65 yields a receipt with status refused, exit_code 65 and the refusal text, and the ledger file is byte-identical -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k refused_append_leaves_ledger_unchanged"
      - id: "AC3"
        statement: "AC3: a RULING or OPERATOR-CONSENT row in a bus request is refused before the append command runs -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k consent_and_ruling_refused_over_bus"
      - id: "AC4"
        statement: "AC4: onex-ledger with ONEX_LEDGER_WRITE_VIA=bus writes nothing locally, publishes one request carrying req= and via=bus cells, and exits with the receipt exit code; with the publisher missing it refuses with exit 69 and names the variable -- falsifier: uv run pytest tests/ledger -q -k bus_write_mode"
      - id: "AC5"
        statement: "AC5: a remote-lane run on h202 writes its own CLAIM and TERMINAL through the ledger skills, and both rows are in the ledger of record and in omninode_internal.work_ledger_rows with the same row_id -- falsifier: grep -c of the run lane in the ledger file expecting 2, plus psql count(\\*) from omninode_internal.work_ledger_rows where raw_row like the run lane expecting 2"
evidence_requirements:
  - kind: "tests"
    description: "AC10 and AC11: issuer tests."
    command: "uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
