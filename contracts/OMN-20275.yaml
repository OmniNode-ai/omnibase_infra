  - id: "dod-omn20275-ac5-h202-ledger-projection"
    description: "AC5: read-only comparison of a completed h202 run's CLAIM and TERMINAL in the ledger of record and Postgres, including sha256 row identity. Requires the actual run, ledger path and operator's psql connection environment; not claimed by this h200 repair."
    source: "manual"
    binds_ac: ["AC5"]
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          run = os.environ["OMN20275_H202_RUN"]
          assert re.fullmatch(r"[A-Za-z0-9_-]+", run), "invalid h202 run id"
          rows = [line.strip() for line in Path(os.environ["ONEX_LEDGER_PATH"]).read_text().splitlines() if f"run={run}" in line.split(" | ") and line.split(" | ")[1:2] in (["CLAIM"], ["TERMINAL"])]
          assert len(rows) == 2, "expected one CLAIM and one TERMINAL"
          assert {row.split(" | ")[1] for row in rows} == {"CLAIM", "TERMINAL"}
          assert all("host=h202" in row.split(" | ") and "via=bus:h202" in row.split(" | ") for row in rows)
          expected = {hashlib.sha256(row.encode()).hexdigest(): row for row in rows}
          sql = "SELECT json_build_object('row_id', row_id, 'raw_row', raw_row) FROM omninode_internal.work_ledger_rows WHERE raw_row LIKE '%run=" + run + "%' AND (raw_row LIKE '% | CLAIM | %' OR raw_row LIKE '% | TERMINAL | %')"
          result = subprocess.run(["psql", "-XAt", "-v", "ON_ERROR_STOP=1", "-c", sql], check=True, capture_output=True, text=True)
          records = [json.loads(line) for line in result.stdout.splitlines()]
          assert len(records) == 2
          assert {row["row_id"]: row["raw_row"].strip() for row in records} == expected
          PY
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-dev-broker-deploy-probe"
