schema_version: "1.0.0"
ticket_id: "OMN-20275"
title: "Principal writer topics, CI overlay binding shape and runtime event bus recovery"
summary: "Issued principals write only to their own templated writer topics, and apply-grants re-applies grants without changing passwords. CI overlay declarations preserve ordered binding fallbacks and typed secret resolver mappings. The runtime recovers from Kafka startup failures through alarmed local in-memory delivery, bounded reconnect attempts, subscription restoration, degraded health and shared-bus readiness, without restarting the process or replaying local deliveries."
is_seam_ticket: false
interface_change: true
interfaces_touched: ["public_api"]
requirements:
  - id: "req-per-principal-writer-topic-grants"
    statement: "Each issued principal holds WRITE on its own writer topic only, and grants can be re-applied without a password change."
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: issuance resolves the {principal} template, creates the writer topic and grants WRITE on it to that principal only; a declaration with any other placeholder, a repeated placeholder, a templated non-literal or non-topic grant, or create_topic on an untemplated grant is refused -- falsifier: uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -k "each_principal_can_write_only_its_own_ledger_topic or issuance_creates_the_user or placeholder or create_topic or templated"
      - id: "AC11"
        statement: |-
          AC11: apply-grants re-applies every declared grant to every issued principal in the lane (or the named ones), refuses a principal the broker does not hold, and never sets a password -- falsifier: uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -k "apply_grants or ensuring_an_existing_topic_is_success or other_rpk_failures_are_bad_gateway"
  - id: "req-ci-overlay-binding-shape"
    statement: "The CI publisher accepts the lane's binding fallback and injected secret resolver declarations without changing its transport selection."
    acceptance:
      - id: "AC12"
        statement: "binding_fallback preserves ordered bus names and secret_resolver preserves its convention flag and typed logical-name/source mappings. Both declarations remain optional, unknown keys and malformed shapes are refused, and broker/security selection is unchanged."
  - id: "req-dev-broker-memory-12g"
    statement: "The dev broker on the lab host runs --memory 12G inside an 16g container cap, declared in docker-compose.dev-lane.yml, under the operator consent 2026-10-27T06:37:48Z."
    acceptance:
      - id: "AC13"
        statement: |-
          AC13: the running dev broker container holds a memory cap of 16 GiB and its start command carries --memory 12G, and the deploy preflight accepts exactly that declaration -- falsifier: ssh to the dev lane host and docker inspect omnibase-infra-redpanda reads a Memory other than 17179869184 or a command without --memory 12G
  - id: "req-runtime-bus-recovery-ruling"
    statement: "Operator ruling 2026-10-27: Runtime should degraded and fall back to in memory with an alarm so the whole system does not crash."
    acceptance:
      - id: "AC14"
        statement: "A failed runtime Kafka start uses local delivery and retries with contract-declared bounded backoff; it becomes ready when Kafka and all live subscriptions recover, without restarting the runtime."
      - id: "AC15"
        statement: "While Kafka is down, runtime liveness remains operational, health is degraded, readiness is false, and exactly one alarm per outage episode is retained through the existing alarm path."
      - id: "AC16"
        statement: "Recovery preserves live subscription arguments and unsubscribe ownership, does not replay local deliveries, does not block local subscriptions on network I/O, and stops reconnecting on shutdown."
  - id: "req-dev-broker-contract-overlay"
    statement: "Dev deploy refresh renders the broker memory policy from its contract and private overlay, without a settings change or a subsequent repo release."
    acceptance:
      - id: "AC17"
        statement: "The dev broker arena, container limit and partition-cap profile use required contract-rendered variables; each dev-201 compose command reads the private runtime_policy.contract.yaml again; the model and preflight accept exactly the consented 12 GiB arena and 16 GiB cap and refuse any other value. Other lanes and brokers do not read this overlay."
evidence_requirements:
  - kind: "tests"
    description: "AC10 and AC11: issuer tests."
    command: "uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:randomly"
  - kind: "tests"
    description: "AC14 to AC16: retry, fallback, alarm, subscription ownership and shutdown regressions."
    command: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_runtime_bus_recovery.py tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20275-ac10-writer-topic-grant"
    description: "AC10: the templated writer topic grant resolves per principal, is created, and malformed templates are refused."
    source: "manual"
    binds_ac: ["AC10"]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:randomly -k "each_principal_can_write_only_its_own_ledger_topic or issuance_creates_the_user or placeholder or create_topic or templated"'
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac11-apply-grants"
    description: "AC11: apply-grants re-applies grants without a password change and refuses unknown principals."
    source: "manual"
    binds_ac: ["AC11"]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:randomly -k "apply_grants or ensuring_an_existing_topic_is_success or other_rpk_failures_are_bad_gateway"'
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac12-ci-overlay-binding-shape"
    description: "AC12: hermetic publisher overlay regression, runnable on a hosted runner without lab secrets, a live broker or Docker. The new declarations fail validation before this PR's model change."
    source: "manual"
    binds_ac: ["AC12"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/test_trigger_learns_binding_fallback_omn20275.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac13-dev-broker-memory-live"
    description: "Post-deploy: the live dev broker on the lab host holds a 16 GiB container cap and starts with --memory 12G. It reads the lab host's running container, which a hosted runner does not have, so only the local Done gate runs it and it binds no acceptance criterion; AC13 is bound by the hosted preflight and deploy-probe items."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'ssh -o BatchMode=yes -o ConnectTimeout=6 "${DEV_LANE_HOST:?DEV_LANE_HOST names the dev lane host}" "docker inspect omnibase-infra-redpanda --format \"{{.HostConfig.Memory}} {{json .Config.Cmd}}\"" | grep -q "^17179869184 .*--memory 12G"'
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac13-preflight-bound"
    description: "AC13: the deploy preflight accepts the 12G/16g declaration and refuses anything beyond it."
    source: "manual"
    binds_ac: ["AC13"]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/unit/infra/test_dev_broker_memory_cap_omn21279.py -q -p no:randomly'
