schema_version: "1.0.0"
ticket_id: "OMN-20275"
title: "Principal writer topics, CI overlay binding shape and runtime event bus recovery"
summary: "The developer principal grant file replaces the shared work-ledger append topic grant with one templated literal topic, onex.cmd.omnimarket.work-ledger-append-from-{principal}.v1, created on issue. The issuer resolves the template per principal, creates that topic, and gains an apply-grants command that re-applies the declared grants to issued principals without setting or rotating a password. The ledger host's own read grants are declared with its login, not in this file."
is_seam_ticket: false
interface_change: true
interfaces_touched: ["public_api"]
requirements:
  - id: "req-ledger-host-append-over-bus"
    statement: "Live ticket criteria for the cross-repository ledger append path remain required; this runtime PR does not claim their completion."
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the serve handler appends a request's rows through the configured append command exactly once: a redelivered request id returns status duplicate with the original line and no second row -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k redelivered_request_appends_once
      - id: "AC2"
        statement: |-
          AC2: a request whose append command exits 65 yields a receipt with status refused, exit_code 65 and the refusal text, and the ledger file is byte-identical -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k refused_append_leaves_ledger_unchanged
      - id: "AC3"
        statement: |-
          AC3: a RULING or OPERATOR-CONSENT row in a bus request is refused before the append command runs -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k consent_and_ruling_refused_over_bus
      - id: "AC4"
        statement: |-
          AC4: onex-ledger with ONEX_LEDGER_WRITE_VIA=bus writes nothing locally, publishes one request carrying req= and via=bus cells, and exits with the receipt exit code; with the publisher missing it refuses with exit 69 and names the variable -- falsifier: uv run pytest tests/ledger -q -k bus_write_mode
      - id: "AC5"
        statement: |-
          AC5: a remote-lane run on h202 writes its own CLAIM and TERMINAL through the ledger skills, and both rows are in the ledger of record and in omninode_internal.work_ledger_rows with the same row_id -- falsifier: grep -c of the run lane in the ledger file expecting 2, plus psql count(\*) from omninode_internal.work_ledger_rows where raw_row like the run lane expecting 2
  - id: "req-per-principal-writer-topic-grants"
    statement: "Each issued principal holds WRITE on its own writer topic only, and grants can be re-applied without a password change."
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: issuance resolves the {principal} template, creates the writer topic and grants WRITE on it to that principal only; a declaration with any other placeholder, a repeated placeholder, a templated non-literal or non-topic grant, or create_topic on an untemplated grant is refused -- falsifier: uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -k "each_principal_can_write_only_its_own_ledger_topic or issuance_creates_the_user or placeholder or create_topic or templated"
      - id: "AC11"
        statement: |-
          AC11: apply-grants re-applies every declared grant to every issued principal in the lane (or the named ones), refuses a principal the broker does not hold, and never sets a password -- falsifier: uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -k "apply_grants or ensuring_an_existing_topic_is_success or other_rpk_failures_are_bad_gateway"
  - id: "req-ci-overlay-binding-shape"
    statement: "The CI publisher accepts the lane's binding fallback and injected secret resolver declarations without changing its transport selection."
    acceptance:
      - id: "AC12"
        statement: "binding_fallback preserves ordered bus names and secret_resolver preserves its convention flag and typed logical-name/source mappings. Both declarations remain optional, unknown keys and malformed shapes are refused, and broker/security selection is unchanged."
  - id: "req-runtime-bus-recovery-ruling"
    statement: "Operator ruling 2026-10-27: Runtime should degraded and fall back to in memory with an alarm so the whole system does not crash."
    acceptance:
      - id: "AC13"
        statement: "A failed runtime Kafka start uses local delivery and retries with contract-declared bounded backoff; it becomes ready when Kafka and all live subscriptions recover, without restarting the runtime."
      - id: "AC14"
        statement: "While Kafka is down, runtime liveness remains operational, health is degraded, readiness is false, and exactly one alarm per outage episode is retained through the existing alarm path."
      - id: "AC15"
        statement: "Recovery preserves live subscription arguments and unsubscribe ownership, does not replay local deliveries, does not block local subscriptions on network I/O, and stops reconnecting on shutdown."
evidence_requirements:
  - kind: "tests"
    description: "AC10 and AC11: issuer tests."
    command: "uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:randomly"
  - kind: "tests"
    description: "AC13 to AC15: retry, fallback, alarm, subscription ownership and shutdown regressions."
    command: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_runtime_bus_recovery.py tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20275-ac10-writer-topic-grant"
    description: "AC10: the templated writer topic grant resolves per principal, is created, and malformed templates are refused."
    source: "manual"
    binds_ac: ["AC10"]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:randomly -k "each_principal_can_write_only_its_own_ledger_topic or issuance_creates_the_user or placeholder or create_topic or templated"'
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac11-apply-grants"
    description: "AC11: apply-grants re-applies grants without a password change and refuses unknown principals."
    source: "manual"
    binds_ac: ["AC11"]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:randomly -k "apply_grants or ensuring_an_existing_topic_is_success or other_rpk_failures_are_bad_gateway"'
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac12-ci-overlay-binding-shape"
    description: "AC12: hermetic publisher overlay regression, runnable on a hosted runner without lab secrets, a live broker or Docker. The new declarations fail validation before this PR's model change."
    source: "manual"
    binds_ac: ["AC12"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/test_trigger_learns_binding_fallback_omn20275.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac13-runtime-recovery"
    description: "AC13: a failed Kafka start falls back to local delivery and recovers with bounded backoff."
    source: "manual"
    binds_ac: ["AC13"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_runtime_bus_recovery.py tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac14-runtime-recovery"
    description: "AC14: health is degraded, readiness false and one alarm per outage while Kafka is down."
    source: "manual"
    binds_ac: ["AC14"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_runtime_bus_recovery.py tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac15-runtime-recovery"
    description: "AC15: recovery preserves subscriptions and unsubscribe ownership and stops on shutdown."
    source: "manual"
    binds_ac: ["AC15"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_runtime_bus_recovery.py tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-deploy-runtime-bus-recovery"
    description: "Hosted-runner deploy probe: read the recovery-capable bus on the PR branch and exercise a local runtime HTTP server through outage and recovery. The same server stays live and readiness changes from 503 to 200; broker I/O is simulated. No production deployment is claimed."
    source: "manual"
    binds_ac: ["AC13"]
    checks:
      - check_type: "command"
        check_value: "curl --fail --silent --show-error --location https://raw.githubusercontent.com/OmniNode-ai/omnibase_infra/omn-20275-runtime-bus-recovery/src/omnibase_infra/event_bus/event_bus_kafka.py | grep -q 'class EventBusRecovering' && env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/runtime/test_runtime_bus_recovery.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn20275-ac1-ledger-bus"
    description: "AC1: retained live ticket falsifier, owned by omnimarket; not claimed by this runtime PR."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k redelivered_request_appends_once"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20275-ac2-ledger-bus"
    description: "AC2: retained live ticket falsifier, owned by omnimarket; not claimed by this runtime PR."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k refused_append_leaves_ledger_unchanged"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20275-ac3-ledger-bus"
    description: "AC3: retained live ticket falsifier, owned by omnimarket; not claimed by this runtime PR."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k consent_and_ruling_refused_over_bus"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20275-ac4-ledger-bus"
    description: "AC4: retained live ticket falsifier, owned by the private operator-tooling repository; not claimed by this runtime PR."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ledger -q -k bus_write_mode"
        cwd: "${ONEX_WORKSPACE_CONFIG_ROOT}"
  - id: "dod-omn20275-ac5-remote-ledger-witness"
    description: "AC5: read the h202 proof lane's CLAIM and TERMINAL from the ledger and projection, requiring identical raw rows and row IDs. Requires the ledger host's read-only proof environment; pending, not claimed by this runtime PR."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "command"
        check_value: |-
          uv run python - <<'PROOF'
          import hashlib
          import os
          import re
          from pathlib import Path
          import psycopg2
          lane = os.environ["ONEX_LEDGER_PROOF_LANE"]
          assert re.fullmatch(r"[A-Za-z0-9_.-]+", lane), "invalid proof lane"
          rows = [line for line in Path(os.environ["ONEX_LEDGER_PATH"]).read_text().splitlines() if f"lane={lane} |" in line and (" | CLAIM | " in line or " | TERMINAL | " in line)]
          assert len(rows) == 2, "expected exactly one CLAIM and one TERMINAL"
          assert {row.split(" | ")[1] for row in rows} == {"CLAIM", "TERMINAL"}
          assert all("host=h202" in row.split(" | ") for row in rows), "proof must originate on h202"
          expected = {(hashlib.sha256(row.strip().encode("utf-8")).hexdigest(), row.strip()) for row in rows}
          with psycopg2.connect(os.environ["ONEX_LEDGER_READ_DSN"]) as conn:
              conn.set_session(readonly=True)
              with conn.cursor() as cursor:
                  cursor.execute("SELECT row_id::text, raw_row FROM omninode_internal.work_ledger_rows WHERE raw_row = ANY(%s)", (rows,))
                  observed = set(cursor.fetchall())
          assert observed == expected, "ledger and projection row IDs/raw rows differ"
          PROOF
        cwd: "${OMNI_HOME}/omnibase_infra"
