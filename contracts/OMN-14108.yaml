schema_version: "1.0.0"
ticket_id: OMN-14108
title: "Remove the retired repository from infrastructure fleet lists"
summary: >-
  The clone, sweep and audit lists dropped the retired repository. The fleet-list guard rejects its return in any of the four lists.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn14108-infra-fleet-lists
    statement: >-
      No omnibase_infra clone, sweep or audit repository list names the retired shared package.
    acceptance:
      - id: AC2
        statement: >-
          AC2: no first-party repository imports the retired shared package, and the fleet lists that clone, sweep or audit it are refused if they name it -- falsifier: uv run pytest tests/ci/test_no_compat_fleet_lists_omn14108.py fails when the retired shared package is put back in any of the four REPOS lists
evidence_requirements:
  - kind: tests
    description: >-
      The four REPOS lists omit the retired shared package, and each test fails at the merge base, where every list names it.
    command: uv run --frozen pytest tests/ci/test_no_compat_fleet_lists_omn14108.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn14108-ac2-infra-fleet-lists
    description: >-
      The four REPOS lists omit the retired shared package. At the merge base all four tests fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_no_compat_fleet_lists_omn14108.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
