schema_version: 1.0.0
ticket_id: OMN-22151
title: Stage 1 model of the start-first dev runtime redeploy and the first install of the ready-aware front (AC22151901)
summary: Adds formal/runtime_start_first, a TLA+ model of the runtime standby handover (fence, seek, resume, switch, stop), its abort path, and the one declared first-install window of the front on host ports 8085 and 8086, with a mutant per property and the recorded TLC output. The design and the stage-2 build plan are on the ticket. No product code changes in this stage; AC1 to AC4 of the ticket are built and proven in later stages.
