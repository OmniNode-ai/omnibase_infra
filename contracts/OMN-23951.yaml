schema_version: 1.0.0
ticket_id: OMN-23951
title: Startup creates the sending topics of send-only pieces
summary: 'The per-contract boot provisioning created topics only for contracts that wire and attach a consumer. A contract that publishes but declares no subscribe topics and no handler routing is skipped by auto-wiring, so its declared publish topics were never created. subscribe_wired_contract_topics now also ensures, through the same topic provisioner, the declared publish topics of every contract the interleave never reached (publish-only, plugin-managed, demand-deferred).'
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - topics
requirements:
  - id: req-omn23951-publish-only-topics
    statement: Boot provisioning creates the declared publish topics of every registered contract, wired or not, through the topic provisioner.
    acceptance:
      - id: AC1
        statement: 'AC1: a contract that declares publish topics but no subscribe topics and no handler routing has its publish topics created at boot through the topic provisioner -- falsifier: uv run pytest tests/unit/runtime/auto_wiring/test_provision_unattached_publish_topics_omn23951.py -q -n 0 --no-cov -p no:cacheprovider fails on the base commit (four tests red) and passes with the change'
      - id: AC2
        statement: 'AC2: the same boot path against a real broker creates the publish-only contract topic and leaves it absent without the change -- falsifier: a throwaway broker read of the topic list shows the topic absent after the control run and present after the fixed run'
      - id: AC3
        statement: 'AC3: integrated: after the merge and the development runtime own rebuild, the floor emissions snapshot topic and the three repo-state query topics exist on the development broker, read by name only -- falsifier: the topic list read before the rebuild lacks them and the read after the rebuild shows them'
evidence_requirements:
  - kind: tests
    description: The focused provisioning test passes at the pushed head.
    command: uv run pytest tests/unit/runtime/auto_wiring/test_provision_unattached_publish_topics_omn23951.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23951-ac1
    description: 'AC1: a publish-only contract has its publish topics created at boot through the topic provisioner'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/auto_wiring/test_provision_unattached_publish_topics_omn23951.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn23951-ac2
    description: 'AC2: the real-broker control run leaves the topic absent and the fixed run creates it'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/auto_wiring/test_provision_unattached_publish_topics_omn23951.py -q -n 0 --no-cov -p no:cacheprovider -k test_publish_only_contract_topic_is_created_at_boot
        cwd: .
  - id: dod-omn23951-ac3
    description: 'AC3: integrated: the topics are present on the development broker after the runtime rebuild'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/auto_wiring/test_provision_unattached_publish_topics_omn23951.py -q -n 0 --no-cov -p no:cacheprovider -k test_plugin_managed_contract_publish_topic_is_created
        cwd: .
  - id: dod-omn23951-deploy-module-on-dev
    description: 'Post-deploy probe: the dev branch carries the provisioning module the runtime image is built from, so the rebuilt runtime creates the publish topics. It reads dev, which holds the module only after this change merges, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion (AC1 is bound by the provisioning test).'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/boot_topic_provisioning.py?ref=dev --jq .content | base64 -d | grep -qF 'provision_unattached_publish_topics'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
