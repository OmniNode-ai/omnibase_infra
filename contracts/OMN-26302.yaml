schema_version: 1.0.0
ticket_id: OMN-26302
title: The host job claim tick can publish its run record on the dev bus (broker grants)
summary: >-
  The developer principal wire bindings (deploy/lab/developer-principal-bindings.yaml) declare produce on the host job claim tick's one publish topic (onex.evt.omnimarket.host-job-claim-run-completed.v1, from the node's contract). On h053 the tick (onex-host-job-claim.service) read IN_SYNC and exited 3 with emitted=false at 03:52:38Z because the broker refused the publish with TopicAuthorizationFailedError. The derived grants file is regenerated from the derivation node, never typed, and gains two rows (WRITE and DESCRIBE); no READ is granted. The discovery test's row count moves from 212 to 214 as measured by running it. The grants take effect on the dev broker when the issuer's apply-grants runs the derived file; that step needs the operator's broker admin credential and is recorded in the pull request, not claimed here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26302-host-job-claim-grants
    statement: The dev lane principal's declared grants include produce on the host job claim run topic, and the derived grants file is the derivation node's output over the bindings.
    acceptance:
      - id: AC1
        statement: "AC1: the developer principal bindings in omnibase_infra declare produce on the host job claim run topic, the committed derived grants file is the derivation node's output, and the discovery test counts the rows the derivation gives (214, 212 before) -- falsifier: the grant derive tests with the bindings of the merge base"
evidence_requirements:
  - kind: tests
    description: The derivation and issuer tests over the host job claim binding.
    command: uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py tests/integration/nodes/test_broker_grant_derive_contract_discovery_omn19939.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26302-ac1-declared-grants
    description: >-
      The bindings declare the host job claim run topic for produce (WRITE, DESCRIBE); the committed derived grants JSON is byte-equal to the derivation node's output; no READ on the topic. With the merge base's bindings and derived file, the same tests fail (the derivation holds none of the two rows and the discovery count is 212).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py tests/integration/nodes/test_broker_grant_derive_contract_discovery_omn19939.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
