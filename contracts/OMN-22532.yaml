schema_version: 1.0.0
ticket_id: OMN-22532
title: Omnibase_infra refuses a public workflow selecting a lab runner
summary: The criteria of omnibase_infra#5706, moved unchanged from the shared contract of OMN-19998.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-fork-refusal
    statement: A fork's code never runs on a lab runner, whatever a workflow file says and whoever approved the run.
    acceptance:
      - id: AC46
        statement: 'AC46: The job-started hook exits non-zero before any job step on a pull request whose head repository is not the base repository, including a deleted fork and a workflow_run from a fork, and passes a same-repository pull request, a push, a schedule and a merge group. -- falsifier: uv run pytest tests/unit/scripts/test_runner_job_started_fork_refusal_omn19998.py -q --no-cov'
evidence_requirements:
  - kind: tests
    description: Omnibase_infra refuses a public workflow selecting a lab runner
    command: uv run pytest tests/unit/scripts/test_runner_job_started_fork_refusal_omn19998.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19998-fork-refusal
    description: The hook's fork refusal, run in bash from the hook file against real payload shapes.
    source: manual
    binds_ac:
      - AC46
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_runner_job_started_fork_refusal_omn19998.py -q --no-cov
        cwd: .
  - id: dod-omn22532-integration-proof
    description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22532 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/scripts/test_runner_job_started_fork_refusal_omn19998.py -q --no-cov
        cwd: .
