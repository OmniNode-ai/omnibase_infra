# OMN-21629 contract file for omnibase_infra: the runtime health monitor filters the discovered manifest once.
schema_version: "1.0.0"
ticket_id: "OMN-21629"
title: "the runtime health monitor stops failing a cleanly booted dev lane: one ownership filter, and deferred projections are not unattached"
summary: "The health monitor's discovery shim applied the runtime-profile ownership filter and _discover_contracts_for_runtime_profile applied it again. Since OMN-19513 the filter refuses an ONEX_RUNTIME_NODE_EXCLUSION that names a contract the manifest lacks, and the second pass always lacks the contract the first pass excluded. The dev lane's main runtime excludes projection_claude_hook_events, so every health check raised RuntimeHostError, discovery_errors read CRITICAL, /health answered unhealthy and every lane receipt failed its health_dimensions check. The shim now returns the unfiltered manifest and the one filter runs after it."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21629-health-monitor-single-filter
    statement: "The runtime health monitor applies the runtime-profile ownership filter to the discovered manifest exactly once, so a deployment node exclusion does not make its discovery check raise."
    acceptance:
      - id: AC1
        statement: "AC1: with ONEX_RUNTIME_NODE_EXCLUSION naming a discovered contract, _discover_contracts_for_runtime_profile returns the manifest without it and with no errors, and the discovery shim returns the unfiltered manifest -- falsifier: uv run pytest tests/unit/services/test_service_runtime_health_monitor.py -k TestDiscoverContractsHelper fails 3 of 3 at origin/dev 9de6fcbd3 with RuntimeHostError ONEX_RUNTIME_NODE_EXCLUSION names undiscovered contracts"
  - id: req-omn21629-demand-deferred-not-unattached
    statement: "A projection the runtime deferred to its first request (OMN-18087) is out of the projection_attachment scope until a record starts it, so a boot with idle projections does not read DEGRADED; once started it is judged by the live registry again."
    acceptance:
      - id: AC2
        statement: "AC2: the topic demand source reports a watched topic as idle until its first record and clears it on that record and on stop, and the health monitor reports projection_attachment HEALTHY for a projection whose topics are all idle-watched while the same projection off the idle set still degrades it -- falsifier: uv run pytest tests/unit/handlers/test_omn18087_handler_kafka_topic_demand_source.py tests/unit/runtime/health/test_omn16994_projection_liveness.py fails at origin/dev 9de6fcbd3, which has no idle_watched_topics"
  - id: req-omn21629-dev201-gateway-deploy-off
    statement: "The dev-201 deploy instance declares disabled_phases gateway-deploy in config/deploy_lane_routing.yaml, so the deploy agent skips the gateway phase and its gateway-forwarder service for that instance, while an instance that omits the entry still runs it."
    acceptance:
      - id: AC3
        statement: "AC3: the shipped routing table lists gateway-deploy in disabled_phases for the default dev instance and for no other, the executor never reaches the gateway script or the host for that instance, and an instance without the flag still runs the phase -- falsifier: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_201_gateway_off_omn21629.py -q fails at origin/dev 9de6fcbd3, which has no disabled_phases flag"
evidence_requirements:
  - kind: tests
    description: "The discovery shim returns the unfiltered manifest, the one filter runs once, and a real node exclusion over a real manifest does not raise."
    command: "uv run pytest tests/unit/services/test_service_runtime_health_monitor.py -q -p no:cacheprovider"
  - kind: tests
    description: "A projection whose topics all wait for a first record is out of the attachment scope, and the demand source keeps the idle set."
    command: "uv run pytest tests/unit/handlers/test_omn18087_handler_kafka_topic_demand_source.py tests/unit/runtime/health/test_omn16994_projection_liveness.py -q -p no:cacheprovider"
  - kind: tests
    description: "The dev-201 instance runs no gateway-deploy phase, the phase stays available to an instance without the flag, and the deploy-agent suite stays green."
    command: "uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_201_gateway_off_omn21629.py -q -p no:cacheprovider"
  - kind: manual
    description: "Deploy check: on the dev lane after a deploy at this head, the main runtime's /health reports the discovery_errors dimension HEALTHY rather than CRITICAL with RuntimeHostError."
    command: "deploy: curl -s http://host.docker.internal:8085/health | python3 -c 'import json,sys; d=json.load(sys.stdin); x=[v for v in d[\"details\"][\"runtime_health\"][\"dimensions\"] if v[\"name\"]==\"discovery_errors\"][0]; assert x[\"status\"]==\"HEALTHY\", x'"
dod_evidence:
  - id: dod-001
    description: "The discovery shim returns the unfiltered manifest and a node exclusion does not make the health check raise."
    source: generated
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/services/test_service_runtime_health_monitor.py tests/unit/services/test_runtime_health_monitor_profile_read.py -q -p no:cacheprovider'
  - id: dod-002
    description: "A projection whose topics all wait for a first record is out of the attachment scope, and the demand source keeps the idle set."
    source: generated
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit/handlers/test_omn18087_handler_kafka_topic_demand_source.py tests/unit/runtime/health/test_omn16994_projection_liveness.py -q -p no:cacheprovider'
  - id: dod-003
    description: "The default dev instance declares gateway-deploy off and the deploy agent skips that phase for it."
    source: generated
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: 'uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_201_gateway_off_omn21629.py -q -p no:cacheprovider'
  - id: dod-004
    description: >-
      Hosted deploy probe for AC1: start the real ServiceHealth HTTP server and ServiceRuntimeHealthMonitor over installed omnibase_infra contracts with node_architecture_validator excluded. Read /health over loopback and require a nonempty manifest and discovery_errors HEALTHY. The isolated process uses no broker and makes no claim about consumer coverage or the deployed lane. Before the single-filter fix the monitor reports discovery_errors CRITICAL because the second filter refuses the already-excluded contract.
    source: generated
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: |-
          set -eu;
          probe_dir=$(mktemp -d);
          probe_pid=;
          trap 'if [ -n "$probe_pid" ]; then kill "$probe_pid" 2>/dev/null || :; wait "$probe_pid" 2>/dev/null || :; fi; rm -rf "$probe_dir"' EXIT;
          env PYTHONDONTWRITEBYTECODE=1 ONEX_ACTIVE_RUNTIME_PACKAGES=omnibase_infra RUNTIME_PROFILE=main ONEX_RUNTIME_NODE_EXCLUSION=node_architecture_validator uv run --frozen python -c 'import asyncio
          import signal
          import sys
          from pathlib import Path
          from omnibase_infra.runtime import RuntimeHostProcess
          from omnibase_infra.services.health_checker import ServiceHealth
          from omnibase_infra.services.service_runtime_health_monitor import ServiceRuntimeHealthMonitor
          from omnibase_infra.runtime.auto_wiring.discovery import discover_contracts

          async def main():
              raw = discover_contracts()
              assert "node_architecture_validator" in {c.name for c in raw.contracts}
              monitor = ServiceRuntimeHealthMonitor(bootstrap_servers="")
              event = await monitor.run_once()
              runtime = RuntimeHostProcess(config={"service_name": "omnibase_infra", "node_name": "node_architecture_validator"})
              server = ServiceHealth(runtime=runtime, host="127.0.0.1", port=0)
              server.set_runtime_health_provider(lambda: event)
              stopped = asyncio.Event()
              asyncio.get_running_loop().add_signal_handler(signal.SIGTERM, stopped.set)
              try:
                  await server.start()
                  port = server._runner.addresses[0][1]
                  Path(sys.argv[1]).write_text(f"http://127.0.0.1:{port}/health")
                  await asyncio.wait_for(stopped.wait(), timeout=60)
              finally:
                  await server.stop()

          asyncio.run(main())' "$probe_dir/url" &
          probe_pid=$!;
          for attempt in $(seq 1 300); do
            if [ -s "$probe_dir/url" ]; then break; fi;
            kill -0 "$probe_pid";
            sleep 0.1;
          done;
          test -s "$probe_dir/url";
          curl --silent --show-error --max-time 10 "$(cat "$probe_dir/url")" > "$probe_dir/health.json";
          uv run --frozen python -c 'import json
          import sys
          from pathlib import Path
          health = json.loads(Path(sys.argv[1]).read_text())["details"]["runtime_health"]
          dimension = next(d for d in health["dimensions"] if d["name"] == "discovery_errors")
          assert dimension["status"] == "HEALTHY", dimension
          assert health["contract_count"] > 0, health
          assert health["discovery_error_count"] == 0, health
          print(json.dumps({"discovery_errors": dimension, "contract_count": health["contract_count"]}))' "$probe_dir/health.json"
