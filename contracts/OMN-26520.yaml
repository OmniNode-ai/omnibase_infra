schema_version: 1.0.0
ticket_id: OMN-26520
title: 'dev runtime unhealthy: DoneItemsProjectionWriter writes zero rows'
summary: 'The done-items writer legitimately writes nothing for a work-ledger TERMINAL whose outcome is not done, and the runtime health dimension projection_apply_divergence read twenty or more such events in a window as a writer that wrote nothing, which the container healthcheck turns into unhealthy. The writer now reports events_not_applicable and the health rule subtracts it before grading, so a silent zero-row writer is still DEGRADED.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26520-filter-is-not-a-silent-writer
    statement: A projection that reports an event as filtered by its own contract is not graded as a writer that wrote nothing, and a writer that errors or reports no filter still is.
    acceptance:
      - id: AC1
        statement: 'AC1: the cause is named in the PR body under a section headed Measured cause with log lines, offsets and a UTC read time -- falsifier: onex scm pr-view of the PR shows no such section'
      - id: AC2
        statement: 'AC2: the PR body answers whether zero written rows should make the runtime unhealthy under a section headed Unhealthy decision naming a file path and a line number -- falsifier: onex scm pr-view of the PR shows no such section'
      - id: AC3
        statement: 'AC3: a test built from the recorded dev event data fails at origin/dev and passes with the fix, and a writer that errors or reports no filter is still reported unhealthy by its own test -- falsifier: uv run pytest tests/unit/runtime/health/test_projection_not_applicable_omn26520.py tests/unit/runtime/health/test_projection_apply_flow_omn18910.py -q -n 0 --no-cov -p no:cacheprovider fails at origin/dev and passes with the fix'
      - id: AC4
        statement: 'AC4: the dispatch deadline, the boot guard and the broker health check are unchanged and no compose file is changed -- falsifier: git diff origin/dev --stat on the branch lists none of them'
      - id: AC5
        statement: 'AC5: on the running dev runtime after the deploy agent applies the change, docker inspect of omninode-runtime reads healthy and the done_items row count rises across two reads 10 minutes apart -- falsifier: the health reads unhealthy or the count is unchanged'
evidence_requirements:
  - kind: tests
    description: The OMN-26520 tests pass at the pushed head.
    command: uv run pytest tests/unit/runtime/health/test_projection_not_applicable_omn26520.py tests/unit/runtime/health/test_projection_apply_flow_omn18910.py -q -n 0 --no-cov -p no:cacheprovider
  - kind: tests
    description: The lazy-start projection boot and wake tests of OMN-26520 pass at the pushed head.
    command: uv run pytest tests/unit/runtime/test_lazy_start_projections_attach_omn26520.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26520-ac1
    description: 'AC1: the Measured cause section of the PR body; the recorded event fixture the tests read is the data it cites.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/health/test_projection_not_applicable_omn26520.py tests/unit/runtime/health/test_projection_apply_flow_omn18910.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26520-ac2
    description: 'AC2: the Unhealthy decision section of the PR body; the tests pin that a filter is not graded as a silent writer.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/health/test_projection_not_applicable_omn26520.py tests/unit/runtime/health/test_projection_apply_flow_omn18910.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26520-ac3
    description: 'AC3: filtered events are healthy, a silent zero and a partly filtered window below the floor stay DEGRADED, and the file tests/unit/runtime/health/test_projection_not_applicable_omn26520.py fails at origin/dev.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/health/test_projection_not_applicable_omn26520.py tests/unit/runtime/health/test_projection_apply_flow_omn18910.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26520-ac4
    description: 'AC4: no dispatch deadline, boot guard, broker health check or compose file is in the diff.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/health/test_projection_not_applicable_omn26520.py tests/unit/runtime/health/test_projection_apply_flow_omn18910.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26520-ac5-filter-grade
    description: 'AC5: the recorded dev window of 179 filtered TERMINAL events grades HEALTHY through the real counters and health rule, and DEGRADED when the filter is not declared; this test fails at the merge base, where the field does not exist.'
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/health/test_projection_not_applicable_omn26520.py tests/integration/runtime/test_projection_not_applicable_omn26520.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26520-ac5-integration-proof
    description: 'AC5: read on the dev runtime on omni-201 only after the deploy agent applies the merged change; hosted CI cannot reach it, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh omni-201 docker inspect --format '{{.State.Health.Status}}' omninode-runtime
        cwd: .
  - id: dod-omn26520-ac3-lazy-projections
    description: 'AC3: the dev boot of 2026-11-23T15:08Z left 77 of 103 declared projections dormant and 12 of 13 failed wakes refused db_io for a missing topology; tests/unit/runtime/test_lazy_start_projections_attach_omn26520.py fails at origin/dev on the boot split and on the wake topology and passes with the fix.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_lazy_start_projections_attach_omn26520.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26520-ac4-diff-scope
    description: 'AC4: the lazy-start boot split and transaction change; the dispatch deadline, the boot guard, the broker health check, the health thresholds and every compose file are untouched.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_lazy_start_projections_attach_omn26520.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26520-ac5-lazy-projections-integration
    description: 'AC5: read on the dev runtime on omni-201 only after the deploy agent applies the merged change, so hosted CI cannot reach it and only the local Done gate runs this unbound check: projection_attachment reads no unattached projection and the done-items consumer group has members.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh omni-201 docker inspect --format '{{.State.Health.Status}}' omninode-runtime
        cwd: .
  - id: dod-omn26520-ac3-lazy-projections-boot-real-manifest
    description: 'AC3: the real discovered manifest split keeps every contract and boots a declared projection; the file tests/integration/runtime/test_lazy_start_projections_boot_omn26520.py fails at origin/dev, where the projection lands dormant.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/runtime/test_lazy_start_projections_boot_omn26520.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
