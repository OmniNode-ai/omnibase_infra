schema_version: 1.0.0
ticket_id: OMN-24674
title: The h201 deploy agent's job-outcome alarm has a golden chain test and an error chain test that run the real path with no stand-in executable
summary: >-
  The failed-job alarm's integration test ran the reading handler against an append script the test wrote, so it passed whether or not the live alarm wrote a row. Two new chain tests under tests/integration/chain_canary run the chain on the real parts. The golden chain records the loaded code sha of a real git checkout through the agent's own loaded_code module, a new commit and a restart changing it, and reads the live agent's HTTP surface and the ledger rows its host wrote through the real append command. The error chain runs the real DeployAgent._run_deploy through the real DeployExecutor against a checkout with no origin, so the real preflight fails by design, and reads the real reading composition root's NOT_WORKING row; its live half reads the newest NOT_WORKING row the agent's host appended. Tests only: nothing under src/ changes and no test builds an executable.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24674-chain-tests
    statement: The deploy agent's job-outcome alarm has a golden chain test and an error chain test on the real path, with no stand-in executable for the part under test.
    acceptance:
      - id: AC1
        statement: "AC1: a GOLDEN chain test runs the success path on the real path (the real deploy agent code or installer, the real bus through the dev broker overlay and the in-memory bus, the real ledger append): a new commit on the agent's code changes its loaded code sha, a dev deploy job runs, and its terminal outcome lands as a reading row on the ledger -- falsifier: uv run pytest tests/integration/chain_canary -q -k \"deploy_job_reading and golden\" passes where the path runs and fails when the append command is removed"
      - id: AC2
        statement: "AC2: an ERROR chain test induces a failed job on the dev or stability lane (a preflight that fails by design, never prod) and finds a NOT_WORKING reading row carrying the job id and the failing phase within one tick, written through node_deploy_job_reading_effect's real append command -- falsifier: uv run pytest tests/integration/chain_canary -q -k \"deploy_job_reading and error\" passes where the path runs and fails when the row is not appended"
      - id: AC3
        statement: "AC3: neither test builds a stand-in executable or script for the part under test -- falsifier: grep -nE 'chmod|S_IEXEC|#!/bin/sh|write_text(.\\*.sh' over the two new test files prints no line"
      - id: AC4
        statement: "AC4: a receipt from the host where the path runs is recorded for each test, and a test that finds the live path broken is reported with its live reading and is marked xfail only with that reading cited in the reason -- falsifier: uv run pytest tests/integration/chain_canary -q -rx -k deploy_job_reading prints each xfail reason naming a live reading, or no xfail"
      - id: AC5
        statement: "AC5: one draft pull request carries the two tests, with a Lab comment on its head sha, and is not handed off -- falsifier: onex scm pr-view OmniNode-ai/omnibase_infra#<n> shows draft=true and a comment starting Lab: head= with the head sha"
evidence_requirements:
  - kind: tests
    description: The hermetic halves of the golden and error chain tests.
    command: uv run --frozen pytest tests/integration/chain_canary -q -m "not kafka" -k deploy_job_reading -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24674-ac1-golden-chain
    description: >-
      The golden chain test's hermetic half records the loaded code sha of a real git checkout through the agent's own loaded_code module and shows a new commit and a restart change it. Its live half (marker kafka, deselected from the PR test splits) reads the live agent and the ledger rows its host wrote; it is run on a lab host and its receipt is posted as a pull request comment naming the head.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/chain_canary -q -m "not kafka" -k "deploy_job_reading and golden" -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24674-ac2-error-chain
    description: >-
      The error chain test's hermetic half runs the real DeployAgent job flow through the real DeployExecutor against a checkout with no origin, so the real preflight fails, and finds the NOT_WORKING reading row with the job id and the failing phase preflight for a dev and a stability job. Its live half (marker kafka) reads the newest NOT_WORKING row the agent's host appended and is run on a lab host.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/chain_canary -q -m "not kafka" -k "deploy_job_reading and error" -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24674-ac3-no-stand-in
    description: >-
      The two new test files hold no chmod, S_IEXEC, shell shebang or written shell script.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: "! grep -nE 'chmod|S_IEXEC|#!/bin/sh|write_text\\(.*\\.sh' tests/integration/chain_canary/test_deploy_job_reading_golden_chain_omn24674.py tests/integration/chain_canary/test_deploy_job_reading_error_chain_omn24674.py"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24674-ac4-no-unreasoned-xfail
    description: >-
      Neither test is marked xfail. The receipts of the runs on the lab host, with the live readings, are posted as the pull request's Lab comment.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: "! grep -n xfail tests/integration/chain_canary/test_deploy_job_reading_golden_chain_omn24674.py tests/integration/chain_canary/test_deploy_job_reading_error_chain_omn24674.py"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24674-ac5-two-test-files
    description: >-
      The pull request carries the two test files; its draft state and Lab comment are read from the watcher state and are not claimed by this check.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: command
        check_value: test -f tests/integration/chain_canary/test_deploy_job_reading_golden_chain_omn24674.py && test -f tests/integration/chain_canary/test_deploy_job_reading_error_chain_omn24674.py
        cwd: ${OMNI_HOME}/omnibase_infra
