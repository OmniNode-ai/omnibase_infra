      - check_type: command
        check_value: "! git grep -nE '192[.]168[.]86[.]' -- src/omnibase_infra/cli/cli_env.py src/omnibase_infra/cli/cli_kafka.py src/omnibase_infra/cli/delegate_lane.py src/omnibase_infra/cli/prod_dispatch_locality_guard.py src/omnibase_infra/adapters/llm/model_llm_provider_config.py src/omnibase_infra/mixins/mixin_llm_http_transport.py src/omnibase_infra/nodes/node_llm_embedding_effect/__init__.py src/omnibase_infra/nodes/node_llm_embedding_effect/models/model_llm_embedding_request.py src/omnibase_infra/nodes/node_llm_inference_effect/handlers/bifrost/model_bifrost_config.py src/omnibase_infra/nodes/node_llm_inference_effect/models/model_llm_inference_request.py src/omnibase_infra/services/session_registry/decision_embedder.py src/omnibase_infra/services/session_registry/decision_search.py docker/catalog/services/redpanda.yaml scripts/push_lanes/deploy-push-lanes.sh"
