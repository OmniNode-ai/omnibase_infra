schema_version: "1.0.0"
ticket_id: OMN-21099
title: "Developer principals may read the compaction reply topics, and the dev lane gives runtime-effects the compaction pack-builder settings"
summary: >-
  Declares READ and DESCRIBE for a developer machine's lab dev-lane principal on the three compaction reply topics the Claude Code hook's compaction binding awaits and on the receipt-mode client's group prefix, in the developer-principal bindings, and regenerates the derived grants file from them. The declaration is delivered; applying the rows to the live dev broker is the lab principal issuer's apply step and is not part of this change. A second delivery under the same ticket gives the compose dev lane's runtime-effects service the settings omnimarket's compaction pack builder reads: ONEX_CONTEXT_SOURCE_TENANT_ID, defaulting to lab and overridable from the operator env as DEV_LANE_CONTEXT_SOURCE_TENANT_ID, and OMNINODE_INTERNAL_DB_URL, already provided by the base compose, which is also the live session source's dsn_env for the bus-resident session_content and work_ledger_rows projections (omnimarket#4383). The retired transcript and ledger file paths and their mounts are absent from the dev-lane and borrower stacks. The readers live in omnimarket, which this repository does not install; this change and its tests cover the shipped compose configuration and what compose renders from it. Delivering the values to the running dev lane is the deploy agent's converge step after merge, read on the lab afterwards, and is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21099-ac1-compaction-reply-read-grants
    statement: "The derived developer-principal grants carry READ and DESCRIBE on the three compaction reply topics and the receipt-mode-client. group prefix, and no WRITE on any of them; WRITE and DESCRIBE on the compaction request topic only."
    acceptance:
      - id: AC1
        statement: |-
          AC1: the derived developer-principal grants carry READ and DESCRIBE on exactly onex.cmd.omniintelligence.context-compaction-package.v1, onex.evt.omnimarket.context-compaction-prepared.v1, onex.evt.omnimarket.context-compaction-fallback.v1 and the group prefix receipt-mode-client., no WRITE on any of them, and WRITE and DESCRIBE on the compaction command topic onex.cmd.omniintelligence.context-compaction-requested.v1 only -- falsifier: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -q -k compaction_replies, which fails at the merge base where the bindings declare none of them
  - id: req-omn21099-ac2-derived-file
    statement: "The committed derived grants file deploy/lab/developer-principal-derived-grants.json contains the independently expected developer permissions, including the compaction replies and receipt-mode-client. group prefix, independently enumerated by TYPED_GRANTS, DECLARED_GRANTS and HOOK_EDGE_GRANTS in tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py, and is the derivation node's output for the shipped bindings."
    acceptance:
      - id: AC2
        statement: |-
          AC2: the committed deploy/lab/developer-principal-derived-grants.json contains the independently expected developer permissions, including the three compaction replies and receipt-mode-client. group prefix, and equals the output of node_broker_grant_derive_compute for the shipped bindings -- falsifier: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -q -k committed_derived
  - id: req-omn21099-ac3-runtime-effects-context-source-tenant
    statement: "The dev-lane compose file gives runtime-effects ONEX_CONTEXT_SOURCE_TENANT_ID as ${DEV_LANE_CONTEXT_SOURCE_TENANT_ID:-lab}, which compose renders as lab by default and as the operator value when DEV_LANE_CONTEXT_SOURCE_TENANT_ID is set."
    acceptance:
      - id: AC3
        statement: |-
          AC3: services.runtime-effects.environment.ONEX_CONTEXT_SOURCE_TENANT_ID in docker/docker-compose.dev-lane.yml equals ${DEV_LANE_CONTEXT_SOURCE_TENANT_ID:-lab}, and docker compose config over docker-compose.infra.yml and docker-compose.dev-lane.yml renders it as lab, or as the operator value when DEV_LANE_CONTEXT_SOURCE_TENANT_ID is set -- falsifier: uv run pytest tests/ci/test_dev_lane_context_source_tenant_omn21099.py -q -k "carries_the_context_source_tenant or renders_the_lab_tenant or operator_env_overrides", which fails at the merge base where the test file and the runtime-effects entry are absent
  - id: req-omn21099-ac4-lane-identity-untouched
    statement: "The context-source tenant does not reuse the lane identity ONEX_TENANT_ID."
    acceptance:
      - id: AC4
        statement: |-
          AC4: the runtime-effects ONEX_CONTEXT_SOURCE_TENANT_ID entry interpolates DEV_LANE_CONTEXT_SOURCE_TENANT_ID and no other variable, and still renders as lab when ONEX_TENANT_ID is set to a sentinel -- falsifier: uv run pytest tests/ci/test_dev_lane_context_source_tenant_omn21099.py -q -k lane_identity
  - id: req-omn21099-ac5-pack-builder-settings
    statement: "The dev-lane stack renders runtime-effects with ONEX_CONTEXT_SOURCE_TENANT_ID and OMNINODE_INTERNAL_DB_URL set, the two settings omnimarket's compaction pack builder and live session source read, and with neither retired session file path nor its mount."
    acceptance:
      - id: AC5
        statement: |-
          AC5: docker compose config over the dev-lane stack renders runtime-effects with ONEX_CONTEXT_SOURCE_TENANT_ID and OMNINODE_INTERNAL_DB_URL set, the two settings omnimarket's compaction pack builder and live session source (session_content and work_ledger_rows, omnimarket#4383) read, and with neither ONEX_SESSION_TRANSCRIPT_ROOT nor ONEX_LEDGER_PATH nor their bind mounts -- falsifier: uv run pytest tests/ci/test_dev_lane_pack_builder_settings_omn21099.py -q -k "every_pack_builder_setting or retired", which fails at the merge base 85493fd67 where the retired entries are present
  - id: req-omn21099-ac6-no-retired-file-paths
    statement: "No committed overlay and no rendered dev-lane or borrower stack gives any service ONEX_SESSION_TRANSCRIPT_ROOT, ONEX_LEDGER_PATH, or a bind mount at /etc/onex/session-transcripts or /etc/onex/work-ledger."
    acceptance:
      - id: AC6
        statement: |-
          AC6: no committed overlay and no rendered dev-lane or borrower stack gives any service ONEX_SESSION_TRANSCRIPT_ROOT, ONEX_LEDGER_PATH, or a bind mount at /etc/onex/session-transcripts or /etc/onex/work-ledger; at least one borrower overlay is found under docker/ (an overlay that redeclares a dev-lane-only service with no image, build or extends) -- falsifier: uv run pytest tests/ci/test_dev_lane_pack_builder_settings_omn21099.py -q -k "retired", which fails at fed6a03da where those entries are present
evidence_requirements:
  - kind: tests
    description: "The compaction reply rows are READ and DESCRIBE only, the committed derived grants are the node's output, and the discovery and issuer tests agree on the row count."
    command: |-
      uv run pytest tests/unit/nodes/node_broker_grant_derive_compute tests/integration/nodes/test_broker_grant_derive_contract_discovery_omn19939.py tests/scripts/test_lab_principal_issuer_omn20150.py -q
  - kind: manual
    description: "Deploy validation command for the existing caller-contract deploy gate: compare the shipped grant JSON with independently enumerated permissions and node output. Runnable on a hosted runner without broker access; this declares a probe, not a new workflow or a live broker apply."
    command: "deploy: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -q -k committed_derived"
  - kind: tests
    description: "The dev-lane compose bundle delivers the context-source tenant, separate from the lane identity tenant, and OMNINODE_INTERNAL_DB_URL to runtime-effects for the compaction pack builder and live session source's session_content and work_ledger_rows reads (omnimarket#4383); committed overlays and rendered dev-lane and borrower stacks carry no retired file paths or bind mounts."
    command: |-
      uv run pytest tests/ci/test_dev_lane_context_source_tenant_omn21099.py tests/ci/test_dev_lane_pack_builder_settings_omn21099.py -q
  - kind: manual
    description: "Deploy validation command for the existing caller-contract deploy gate: parse the shipped dev-lane compose file and assert the runtime-effects tenant entry. Runnable on a hosted runner without lab access; it reads the committed file only and touches no running lane."
    command: "deploy: uv run pytest tests/ci/test_dev_lane_context_source_tenant_omn21099.py -q -k carries_the_context_source_tenant"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21099-ac1-compaction-reply-read-grants
    description: >-
      Derive the grants from the shipped developer-principal bindings and assert READ and DESCRIBE on exactly the three compaction reply topics and the receipt-mode-client. group prefix, and no write. Reads the committed files only; no broker, credential or running lane is touched. Applying the rows to the live dev broker is the lab principal issuer's apply step and is not claimed.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -q -k compaction_replies
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn21099-ac2-derived-file
    description: >-
      Check the committed derived grants file against independently expected developer permissions, including the compaction replies and receipt-mode-client. group prefix, and compare it with the derivation node's output for the shipped bindings. Reads the committed files only; no broker or credential is touched.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -q -k committed_derived
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
  - id: dod-omn21099-ac3-context-source-tenant
    description: >-
      Read docker/docker-compose.dev-lane.yml and assert runtime-effects carries ONEX_CONTEXT_SOURCE_TENANT_ID as ${DEV_LANE_CONTEXT_SOURCE_TENANT_ID:-lab}, and that docker compose config renders it as lab by default and as the operator value when set. Reads and renders the committed files only; no running lane is touched. That the deployed dev lane then binds the compaction pack build is read after the deploy agent converges and is not claimed here.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_dev_lane_context_source_tenant_omn21099.py -q -k "carries_the_context_source_tenant or renders_the_lab_tenant or operator_env_overrides"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC3]
  - id: dod-omn21099-deploy-dev-compose-tenant
    description: >-
      Deploy configuration probe, runnable on a hosted runner: read docker/docker-compose.dev-lane.yml through the GitHub contents API at the commit checked out in the tree under test (git rev-parse HEAD), the file the deploy agent converges the dev lane from, and require the runtime-effects context-source tenant line. It goes red at the merge base, where that line is absent. That the running runtime-effects container carries the variable is read on the lab after the converge and is not claimed here.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.dev-lane.yml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'ONEX_CONTEXT_SOURCE_TENANT_ID: .{DEV_LANE_CONTEXT_SOURCE_TENANT_ID:-lab}'"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC3]
  - id: dod-omn21099-ac4-lane-identity-untouched
    description: >-
      Assert the runtime-effects context-source tenant entry interpolates only DEV_LANE_CONTEXT_SOURCE_TENANT_ID, and still renders as lab when ONEX_TENANT_ID is set. Reads and renders the committed files only.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_dev_lane_context_source_tenant_omn21099.py -q -k lane_identity
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC4]
  - id: dod-omn21099-ac5-pack-builder-settings
    description: >-
      Render the dev-lane compose bundle and assert runtime-effects has ONEX_CONTEXT_SOURCE_TENANT_ID and OMNINODE_INTERNAL_DB_URL set for the compaction pack builder and live session source, whose dsn_env reads session_content and work_ledger_rows (omnimarket#4383), and that no retired session file path or bind mount remains; it fails at the merge base, where they are present. No running lane is touched. The running container is read on the lab after the deploy agent converges and is not claimed here.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_dev_lane_pack_builder_settings_omn21099.py -q -k "every_pack_builder_setting or retired"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC5]
  - id: dod-omn21099-ac6-no-retired-file-paths
    description: >-
      Assert the committed dev-lane and borrower overlays carry neither retired file path, the dev-lane overlay mounts neither retired target, and no service in any rendered dev-lane or borrower stack carries either path or bind mount. Require at least one borrower overlay. These checks fail at fed6a03da where the retired entries are present. No running lane is touched.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_dev_lane_pack_builder_settings_omn21099.py -q -k "retired"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC6]
