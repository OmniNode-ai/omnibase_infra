# OMN-19513 contract file for omnibase_infra: the runtime-image services raise their open-file limit.
schema_version: "1.0.0"
ticket_id: "OMN-19513"
title: "the runtime-image services carry a nofile ulimit of 65535 instead of the container default of 1024"
summary: "The dev lane's omninode-runtime passed 1024 open files about four minutes after each start, failed every write with Errno 24, exited 0 and was restarted, leaving the claude hook-events projection 18-20 minutes behind. docker-compose.infra.yml's x-runtime-base anchor and the omninode-runtime, runtime-effects and runtime-worker catalog manifests now declare ulimits.nofile soft and hard 65535."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19513-merge-group-compose-selection
    statement: "A pull request that changes a compose recipe runs the tests that read it, so a stale expectation fails on the pull request and not in the merge-queue full suite."
    acceptance:
      - id: AC7
        statement: "AC7: the change-aware selector keeps tests/unit/ for a docker-compose recipe changed beside a tests/ci/ module, and the infra lane's hand-kept overlay-mount expectation names projection-claude-hook-events-writer -- falsifier: uv run pytest tests/unit/scripts/ci/test_detect_test_paths.py -k compose_recipe fails at origin/dev, and tests/unit/docker/test_lane_overlay_dir_resolution.py fails on the tree that mounts the overlay on the writer."
  - id: req-omn19513-runtime-nofile-ulimit
    statement: "Every runtime-image service declares an open-file limit above the 1024 container default."
    acceptance:
      - id: AC1
        statement: "AC1: The base compose x-runtime-base anchor and the omninode-runtime, runtime-effects and runtime-worker catalog manifests declare ulimits.nofile soft and hard 65535 -- falsifier: uv run pytest tests/ci/test_runtime_nofile_ulimit_omn19513.py fails at origin/dev, which declares none"
  - id: req-omn19513-emit-spool-on-volume
    statement: "The dev runtime and effects services keep owed-event spools on their own persistent data volumes."
    acceptance:
      - id: AC2
        statement: "AC2: The rendered dev-lane omninode-runtime and runtime-effects services set ONEX_EMIT_EFFECT_SPOOL_DIR under /app/data, mount a named volume there, and use distinct data volumes so no other service drains the same spool -- falsifier: uv run pytest tests/unit/infra/test_emit_spool_on_volume_omn19513.py -q -p no:cacheprovider fails with the merge-base dev-lane overlay."
  - id: req-omn19513-dev-lane-runtime-cpu-cap
    statement: "The dev lane's main runtime has CPU headroom to keep the claude hook-events projection current."
    acceptance:
      - id: AC3
        statement: "AC3: docker-compose.dev-lane.yml raises omninode-runtime's CPU limit to 2.0 while the base file keeps 1.0 and the memory limit stays 1536M -- falsifier: uv run pytest tests/unit/docker/test_omn19513_dev_lane_runtime_cpu_cap.py fails at origin/dev, which has no test file"
  - id: req-omn19513-consumer-rejoins-after-broker-restart
    statement: "A consumer whose replacement cannot start while the broker is down is retried until it rejoins, and meanwhile ConsumerRejoinSupervisor.sync_status() reports ready=False with last_rejoin_failed=True (the readiness dimension, OMN-18640)."
    acceptance:
      - id: AC4
        statement: "AC4: the rejoin supervisor replaces a consumer that raises on poll or whose replacement failed to start, retrying every 30 seconds, instead of polling the stopped handle -- falsifier: uv run pytest tests/unit/event_bus/test_consumer_rejoin_after_broker_restart.py -q -p no:cacheprovider fails 3 of 3 at origin/dev with ConsumerStoppedError out of next_batch"
  - id: req-omn19513-hook-events-own-writer
    statement: "The claude hook-events projection runs in its own dev-lane container, so a restart of omninode-runtime no longer leaves it unsubscribed while that runtime joins its other consumer groups."
    acceptance:
      - id: AC5
        statement: "AC5: with ONEX_RUNTIME_NODE_EXCLUSION naming projection_claude_hook_events, filter_manifest_for_runtime_profile leaves that contract unattached on main and a runtime selecting it attaches only it; the dev lane starts projection-claude-hook-events-writer with the main runtime's KAFKA_INSTANCE_ID so the consumer group keeps its committed offsets -- falsifier: uv run pytest tests/unit/runtime/auto_wiring/test_runtime_node_exclusion_omn19513.py tests/unit/docker/test_omn19513_hook_events_writer.py fails at origin/dev, which has neither file"
  - id: req-omn19513-hook-events-writer-lane-overlay
    statement: "The hook-events writer mounts the lane overlay that its inherited Bifrost preflight environment pins."
    acceptance:
      - id: AC6
        statement: "AC6: projection-claude-hook-events-writer binds the project-specific Bifrost overlay read-only at BIFROST_LANE_OVERLAY_PATH with create_host_path false; removing the writer's lane-overlay-mount makes the bound command fail."
evidence_requirements:
  - kind: tests
    description: "The selector keeps tests/unit/ for a compose recipe changed beside a tests/ci/ module, and the infra lane's overlay-mount expectation includes the hook-events writer."
    command: "uv run pytest tests/unit/scripts/ci/test_detect_test_paths.py tests/unit/docker/test_lane_overlay_dir_resolution.py tests/ci/test_bifrost_lane_overlay.py -q -p no:cacheprovider"
  - kind: manual
    description: "Hosted-runner deploy configuration check: resolve the writer's YAML anchors and assert its pinned overlay has one read-only project-specific bind that cannot create a missing host file. No live Docker daemon or private overlay is required."
    command: >-
      deploy: uv run python -c 'from pathlib import Path; import yaml; s = yaml.safe_load(Path("docker/docker-compose.infra.yml").read_text())["services"]["projection-claude-hook-events-writer"]; p = s["environment"]["BIFROST_LANE_OVERLAY_PATH"]; m = [v for v in s["volumes"] if isinstance(v, dict) and v.get("target") == p]; assert len(m) == 1; assert m[0]["source"].endswith("/${COMPOSE_PROJECT_NAME}.bifrost.yaml"); assert m[0]["read_only"] is True and m[0]["bind"]["create_host_path"] is False'
  - kind: tests
    description: "Render the base and dev-lane compose files and check both spool paths, their persistent mounts, and volume isolation."
    command: "uv run pytest tests/unit/infra/test_emit_spool_on_volume_omn19513.py -q -p no:cacheprovider"
  - kind: manual
    description: "Deploy check: a hosted runner renders the dev deployment configuration and refuses a spool outside either service's own named data volume; this checks configuration, not a live deployment."
    command: "deploy: uv run pytest tests/unit/infra/test_emit_spool_on_volume_omn19513.py -q -p no:cacheprovider"
  - kind: tests
    description: "Every service built from docker/Dockerfile.runtime in the base compose file, and the three runtime catalog manifests, declare nofile soft >= 65535."
    command: "uv run pytest tests/ci/test_runtime_nofile_ulimit_omn19513.py -q -p no:cacheprovider"
  - kind: manual
    description: "Deploy check: the compose file the dev lane deploys from carries the raised limit at this head."
    command: "deploy: gh api \"repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.infra.yml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'OMN-19513: the container default is 1024 open files' | grep -qx 1"
  - kind: tests
    description: "The dev lane overlay merges omninode-runtime limits to cpus 2.0 with memory 1536M, the base keeps 1.0, and the overlay sets no cap on runtime-effects or runtime-worker."
    command: "uv run pytest tests/unit/docker/test_omn19513_dev_lane_runtime_cpu_cap.py -q -p no:cacheprovider"
  - kind: manual
    description: "Deploy check: the dev lane overlay the lane deploys from carries the CPU-cap block at this head."
    command: "deploy: gh api \"repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.dev-lane.yml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c \"OMN-19513: dev lane's omninode-runtime at the base 1.0 CPU cap\" | grep -qx 1"
  - kind: tests
    description: "Replays the 2026-10-23T05:27Z broker segfault: the replacement consumer is refused twice and then served; the supervisor must deliver records from it and report readiness only once flow resumes."
    command: "uv run pytest tests/integration/event_bus/test_consumer_rejoin_recovery_omn19513.py tests/unit/event_bus/test_consumer_rejoin_after_broker_restart.py tests/unit/event_bus/test_consumer_sync_readiness_omn18640.py -q -p no:cacheprovider"
  - kind: manual
    description: "Hosted-runner deploy check: the consume loop delivers after two failed replacement starts, retries at 30 seconds, and recovers readiness after delivery."
    command: "deploy: uv run pytest tests/integration/event_bus/test_consumer_rejoin_recovery_omn19513.py -q -p no:cacheprovider"
  - kind: tests
    description: "The exclusion and selection partition the node between the main runtime and the writer, and the dev lane renders both halves with the shared instance id."
    command: "uv run pytest tests/unit/runtime/auto_wiring/test_runtime_node_exclusion_omn19513.py tests/unit/docker/test_omn19513_hook_events_writer.py -q -p no:cacheprovider"
  - kind: tests
    description: "Real contract discovery plus the profile filter, fed the environment the dev-lane and base compose files render, leave the projection with exactly one owner and the writer on the main runtime's instance id."
    command: "uv run pytest tests/integration/runtime/test_hook_events_writer_partition_omn19513.py -q -p no:cacheprovider"
  - kind: tests
    description: "Check every service that pins a Bifrost overlay, including the hook-events writer, has the corresponding mount."
    command: "uv run pytest tests/ci/test_bifrost_lane_overlay.py -k 'test_every_service_that_renders_bifrost_mounts_the_overlay_it_pins or test_compose_mounts_typed_overlay_without_model_endpoint_env_wiring' -q -p no:cacheprovider"
  - kind: manual
    description: "Hosted-runner deploy configuration check: resolve the writer's YAML anchors and assert its pinned overlay has one read-only project-specific bind that cannot create a missing host file. No live Docker daemon or private overlay is required."
    command: >-
      deploy: uv run python -c 'from pathlib import Path; import yaml; s = yaml.safe_load(Path("docker/docker-compose.infra.yml").read_text())["services"]["projection-claude-hook-events-writer"]; p = s["environment"]["BIFROST_LANE_OVERLAY_PATH"]; m = [v for v in s["volumes"] if isinstance(v, dict) and v.get("target") == p]; assert len(m) == 1; assert m[0]["source"].endswith("/${COMPOSE_PROJECT_NAME}.bifrost.yaml"); assert m[0]["read_only"] is True and m[0]["bind"]["create_host_path"] is False'
