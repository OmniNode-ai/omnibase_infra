# OMN-19513 contract file for omnibase_infra: the runtime-image services raise their open-file limit.
schema_version: "1.0.0"
ticket_id: "OMN-19513"
title: "the runtime-image services carry a nofile ulimit of 65535 instead of the container default of 1024"
summary: "The dev lane's omninode-runtime passed 1024 open files about four minutes after each start, failed every write with Errno 24, exited 0 and was restarted, leaving the claude hook-events projection 18-20 minutes behind. docker-compose.infra.yml's x-runtime-base anchor and the omninode-runtime, runtime-effects and runtime-worker catalog manifests now declare ulimits.nofile soft and hard 65535. This contract binds no acceptance criterion of the ticket: the ticket's own criteria concern the omnimarket work_events projection."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: "Every service built from docker/Dockerfile.runtime in the base compose file, and the three runtime catalog manifests, declare nofile soft >= 65535."
    command: "uv run pytest tests/ci/test_runtime_nofile_ulimit_omn19513.py -q -p no:cacheprovider"
  - kind: manual
    description: "Deploy check: the recreated dev-lane runtime container carries the raised limit."
    command: "deploy: docker inspect omninode-runtime --format '{{json .HostConfig.Ulimits}}' | grep -q 65535"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19513-runtime-nofile-ulimit"
    description: "The base compose runtime anchor and the runtime catalog manifests declare nofile 65535. 13 of the 14 tests fail against origin/dev b4b7c7f8c, which declares none."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/ci/test_runtime_nofile_ulimit_omn19513.py -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn19513-deploy-runtime-nofile"
    description: "Deploy probe: after the dev lane recreates omninode-runtime from this compose file, the container's HostConfig carries nofile 65535; before it, HostConfig.Ulimits is null and the grep exits 1."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "docker inspect omninode-runtime --format '{{json .HostConfig.Ulimits}}' | grep -q 65535"
        cwd: "${OMNI_HOME}/omnibase_infra"
