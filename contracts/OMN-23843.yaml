schema_version: 1.0.0
ticket_id: OMN-23843
title: Hold a2a-sdk below 1.0.0 for the next outside-user release
summary: >-
  The release train's dependency refresh moved a2a-sdk from 0.3.26 to 1.3.0, inside the declared range, and the one file that uses the SDK has not been checked against 1.x. The upper bound becomes below 1.0.0 with a one-line reason, the lock keeps a2a-sdk at 0.3.26 and changes no other package, and the pin-resolvability check passes on the built wheel.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23843-a2a-sdk-below-one
    statement: The published package declares and locks a2a-sdk below 1.0.0 until 1.x is checked against the remote-agent invoke handler.
    acceptance:
      - id: AC1
        statement: "AC1: pyproject.toml declares a2a-sdk with an upper bound of <1.0.0 and a one-line reason on the same line -- falsifier: uv run --frozen pytest tests/unit/ci/test_a2a_sdk_bound_omn23843.py fails when the bound is set back to <2.0.0"
      - id: AC2
        statement: "AC2: uv.lock resolves a2a-sdk to a 0.3.x version and no other package's locked version changes -- falsifier: git diff uv.lock against the base shows only the a2a-sdk specifier line; a locked a2a-sdk at 1.0.0 or above fails the same test file"
      - id: AC3
        statement: "AC3: the pin-resolvability check passes on the built wheel -- falsifier: python3 scripts/ci/verify_pypi_pin_resolvability.py on the wheel exits non-zero when a declared pin does not resolve from the public index"
      - id: AC4
        statement: "AC4: integrated: the release train's rebuilt release pull request for omnibase_infra carries a2a-sdk below 1.0.0 in its lock, read in the pull request diff after the train runs -- falsifier: the rebuilt pull request's lock names a2a-sdk 1.0.0 or above"
evidence_requirements:
  - kind: tests
    description: The a2a-sdk bound test file.
    command: uv run --frozen pytest tests/unit/ci/test_a2a_sdk_bound_omn23843.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23843-ac1-bound
    description: >-
      pyproject.toml holds a2a-sdk below 1.0.0 and the lock agrees; the bound test fails with the bound at <2.0.0 (2 of 3 tests red) and passes with it.
    source: manual
    binds_ac:
      - AC1
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/ci/test_a2a_sdk_bound_omn23843.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23843-ac3-resolvability
    description: >-
      The pin-resolvability gate is the pull request's own required check; the pyproject line carries the bound.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: grep -qE '"a2a-sdk>=0.3.4,<1.0.0"' pyproject.toml
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23843-ac4-integrated
    description: >-
      Deploy check the hosted runner can run: the lock's declared requirement for a2a-sdk is below 1.0.0 (the check fails at the merge base, where the requirement reads below 2.0.0). The read of the rebuilt release pull request after the train runs is posted as a pull request comment naming the head; it is not claimed by this check.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: grep -qF '{ name = "a2a-sdk", specifier = ">=0.3.4,<1.0.0" }' uv.lock
        cwd: ${OMNI_HOME}/omnibase_infra
