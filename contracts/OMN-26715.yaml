schema_version: 1.0.0
ticket_id: OMN-26715
title: A runtime integration branch carries every open launch change, builds one image, and runs on the stability lane for testing
summary: >-
  Operator RULING 2026-11-26T21:08:59Z made the stability lane the integration test runtime. This change adds the integration source of the stability refresh as a node: it takes the heads of integration/launch-YYYYMMDD in omnibase_core, omnibase_infra and omnimarket, builds the image with stage_workspace.sh, records the current stability images as the rollback target before any change, recreates the stability services on the build and restores the recorded images when /health is not 200 within 5 minutes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26715-stability-integration-source
    statement: The stability lane can run the launch integration branches through a declared, health-gated, rollback-capable path.
    acceptance:
      - id: AC3
        statement: "AC3: the image runs on the stability lane through its declared deploy path with the previous stability image recorded as the rollback target, and one delegation end to end through the stability gateway returns a receipt naming the answering model -- falsifier: the stability runtime's image digest equals the built one and the receipt reading; a failed health check rolls back to the recorded image"
evidence_requirements:
  - kind: tests
    description: The stability-integration audit context admits a deploy-* tag and no other context does.
    command: uv run --frozen pytest tests/unit/validation/test_first_party_deploy_tag_context_omn26715.py -q --no-cov -n 0 -p no:cacheprovider
  - kind: tests
    description: The refresh node's handler tests.
    command: uv run --frozen pytest tests/unit/handlers/test_handler_stability_integration_refresh_omn26715.py -q --no-cov -n 0 -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26715-ac3-refresh-node
    description: >-
      The integration refresh records the rollback target before any change, runs the services on the built image when /health reads 200, restores the recorded images when it does not within 300 seconds, leaves the lane untouched on a build failure and refuses when an integration branch is absent.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_stability_integration_refresh_omn26715.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26715-ac3-deploy-tag-audit
    description: >-
      A node-made deploy-* tag whose twelve hex digits are the staged commit is admitted for every first-party package in the stability-integration build context; the dev lane, pre-PR slot and open-PR contexts still refuse it, a deploy-* tag naming another commit is refused everywhere, and the refresh node cuts the tags and builds from them.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/test_first_party_deploy_tag_context_omn26715.py tests/unit/handlers/test_handler_stability_integration_refresh_omn26715.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26715-ac3-refused-recreate
    description: >-
      A recreate the host refuses (the lane compose guard refuses a landing worker on a declared lane) returns outcome refused with the built image and the recorded rollback target, and the host puts the lane's :latest tags back on the recorded images instead of leaving them on the new build.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_stability_integration_refresh_omn26715.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
