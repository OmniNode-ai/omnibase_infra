schema_version: 1.0.0
ticket_id: OMN-19521
title: The deploy agent crash-loops when a poll batch holds two copies of one rebuild command, because the coalescer records a command as superseded by itself
summary: A poll batch holding two copies of one correlation id made plan_coalesce record a command as superseded by itself, so ModelSupersession raised before the offset commit and the lab dev deploy agent crash-looped. omnibase_infra#4096 (d9f6674c28e72104c9246f603fd7bc4436c5a3dd) ends the group at a redelivered copy. This contract records the acceptance-criterion bindings a second lane accepted.
