    description: 'AC1: a duplicate copy directly behind the head, behind a folded member, and a copy of the head behind a folded member each end the group with DUPLICATE_COMMAND and raise nothing, before any ancestry question. All 4 fail with coalesce.py at the parent of omnibase_infra#4096.'
    command: env -u PYTHONPATH uv run pytest 'scripts/deploy-agent/tests/unit/test_deploy_agent_coalesce_omn18143.py::TestADuplicateCopyInTheBatch' -q -p no:cacheprovider
  - kind: tests
    description: 'AC2: poll_and_accept on [head@290, head@291] accepts the head once with reason None, writes no superseded record and commits [291] only. Fails with coalesce.py at the parent of omnibase_infra#4096.'
    command: env -u PYTHONPATH uv run pytest 'scripts/deploy-agent/tests/unit/test_deploy_agent_coalesce_omn18143.py::TestARedeliveredCopyAtTheConsumer::test_a_redelivered_copy_of_the_head_runs_the_head_once' -q -p no:cacheprovider
