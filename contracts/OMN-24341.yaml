schema_version: 1.0.0
ticket_id: OMN-24341
title: Let the development lane add the tenant column to the skill run table
summary: >-
  Child of OMN-19998. After the dev runtime rolled to omnimarket a379d63e35b6 (2026-11-14T00:29Z) the skill lifecycle writer was refused on every event with UndefinedColumnError (column tenant_id of relation skill_executions does not exist). The forward-migration job log read SKIP (operator-gated) for node:node_projection_skill_lifecycle:0002_grant_tenant_projection_writer_skill_executions.sql, the migration that adds the column and puts FORCE ROW LEVEL SECURITY and a tenant policy on the table. This change adds that id to the compose runner's dev arm release set (the baseline fence entry stays). Its authority is the OPERATOR-CONSENT row of 2026-09-14T12:11:31Z (tenant row-level security on TENANT-class migrations, lab first).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24341-release
    statement: The dev lane arm of the forward-migration runner releases the skill lifecycle tenant migration and no other lane does.
    acceptance:
      - id: AC1
        statement: "AC1: the forward-migration runner's dev lane arm releases node:node_projection_skill_lifecycle:0002_grant_tenant_projection_writer_skill_executions.sql in addition to its four existing ids, the baseline fence still lists it, and the test constant matches the script -- falsifier: uv run pytest tests/scripts/test_node_migration_fence_parity.py -q --no-cov"
      - id: AC2
        statement: "AC2: an unset or unknown lane value and every other lane keep that id skipped, and an id the fence does not cover is never released -- falsifier: uv run pytest tests/scripts/test_node_migration_fence_parity.py -q --no-cov -k \"fail_closed or unknown or released_subset\""
      - id: AC3
        statement: "AC3: with the id removed from the dev arm the parity test fails -- falsifier: the same test file run against the script at origin/dev, red on the extra id"
  - id: req-omn24341-integrated
    statement: The dev runtime stores skill lifecycle rows after the release is applied.
    acceptance:
      - id: AC4
        statement: "AC4: integrated: after the dev runtime rolls to the merged revision, the forward-migration job log on the dev host reads RELEASED for that id and applied, the skill run table holds the tenant column, the runtime log has no UndefinedColumnError from SkillLifecycleProjectionWriter in ten minutes, and the container health reads healthy -- falsifier: docker logs omnibase-infra-forward-migration and docker inspect of the runtime health on the dev host"
evidence_requirements:
  - kind: tests
    description: The fence parity tests pass at the pushed head and fail when the runner script is taken from the base commit.
    command: uv run --frozen pytest tests/scripts/test_node_migration_fence_parity.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
