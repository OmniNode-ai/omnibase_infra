    description: >-
      The dev arm of scripts/run-forward-migrations.sh lists the skill lifecycle 0002 id as its fifth released id, the baseline fence entry is unchanged, and LANE_RELEASED_IDS in the parity test names it. The parity test file passes at the head (56 passed on the lab host).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/scripts/test_node_migration_fence_parity.py -q --no-cov -p no:randomly
        cwd: .
  - id: dod-omn24341-ac2
    description: >-
      The parity tests that parse every case arm of the runner script pass at the head: the unset and unknown arms assign an empty release set and the released set is a strict subset of the baseline fence.
    source: manual
    binds_ac:
