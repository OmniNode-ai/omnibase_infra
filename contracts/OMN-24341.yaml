    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/scripts/test_node_migration_fence_parity.py -q --no-cov -p no:randomly
        cwd: .
  - id: dod-omn24341-ac3
    description: >-
      The failing control: the parity test file run against the runner script taken from the base commit fails on the extra id in the test constant. Shown in the pull request's Lab line.
    source: manual
