schema_version: "1.0.0"
ticket_id: OMN-23027
title: The CI Summary poll stops destroying its own job listing, and its deadline names the unreadable input instead of blaming healthy gates
summary: A bare "> jobs.json" truncates the file before the fetch pipeline runs, so a failed read of the run's own job listing left an empty listing that the gate reads as "no gate has reported". The deadline branch reported off exactly that file and printed 57 finished, green gates plus 34 contexts as missing/pending, in one sentence that also offered "the API unreachable" as an alternative without saying which held. Three pull requests failed this way inside one hour on 2026-11-07 behind one API outage. The listing is now written through a temporary file and moved into place only on success, the failed reads are counted, the gh error is captured beside the failure line, and the deadline distinguishes an unreadable input from genuinely pending gates. Fail-closed behaviour is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23027-honest-poll-inputs
    statement: The CI Summary poll never leaves its own job listing truncated by a failed read, and a deadline reached without one successful read reports the unreadable input rather than a gate list computed from it.
    acceptance:
      - id: AC1
        statement: "AC1: a failed read of the run's job listing leaves the previous listing byte-for-byte intact, invents none where there was none, and leaves no temporary file behind -- falsifier: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -k never_empties"
      - id: AC2
        statement: "AC2: a deadline reached with no successful read of the job listing exits non-zero, prints the count of failed reads and says the API was unreachable rather than that gating jobs are pending, and does not print a gate list -- falsifier: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -k unreadable_input"
      - id: AC3
        statement: "AC3: the gh error text, HTTP status included, is captured beside the failure line in the step log -- falsifier: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -k http_status"
      - id: AC4
        statement: "AC4: a deadline reached after one successful read followed by failed reads names the unreadable input, counts the failures since the last good read, and does not ask the gate script for a report of the stale listing, while a deadline whose newest read succeeded still reports the pending gates -- falsifier: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -k 'stale_listing or current_listing'"
      - id: AC5
        statement: "AC5: the unreadable-input test observes the gate script's calls, so a gate report added back to the no-success deadline branch fails it -- falsifier: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -k unreadable_input, with a --report-only call injected into that branch"
evidence_requirements:
  - kind: tests
    description: The CI Summary poll-input tests of this change, which drive the step's own shell with a failing gh and a controlled clock.
    command: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23027-ac1-listing-survives
    description: A failed read leaves a seeded listing unchanged and writes none when there was none. At the merge base both cases fail, because the redirection truncates the file before the pipeline runs.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -n 0 --no-cov -k never_empties
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23027-ac2-deadline-is-honest
    description: With the clock driven past the deadline after one failed read, the step names the unreadable job listing and omits the gate list. At the merge base it prints the conflated sentence instead, which is how run 42397877196 attempt 3 reported 91 green gates as pending.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -n 0 --no-cov -k unreadable_input
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23027-ac3-status-captured
    description: The gh error is captured beside the failure line rather than left to the runner's interleaving, so the HTTP status behind a failed read is readable at the point of failure. The 2026-11-07 logs carry 90 failure lines and no status.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -n 0 --no-cov -k http_status
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23027-fail-closed-invariant
    description: >-
      Every deadline branch exits non-zero and the verdict case keeps its single exit 0, so the honesty fix is not a fail-open loosening. This is an invariant guard, not evidence of a change, and it deliberately binds no AC: it passes at the merge base as well, because the merge base already fails closed. A control that FAILED here would mean the base had been fail-open, so there is no earlier behaviour to control and dod-verify's merge-base control cannot apply. It is deliberately NOT an acceptance criterion: the local mirror of this gate requires every AC to carry bound evidence, and this check can carry none, so an AC here would deadlock the two halves of the same gate against each other. The guarantee is carried by AC2 instead, whose test asserts the new branch's non-zero exit and does fail at the merge base.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -n 0 --no-cov -k fails_closed
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23027-ac4-stale-listing
    description: One good read then failed reads to the deadline names the unreadable input and makes no gate report. At the merge base it prints the pending-gates sentence over the retained snapshot.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -n 0 --no-cov -k "stale_listing or current_listing"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23027-ac5-gate-calls-observed
    description: The stub gate script records its calls, and the unreadable-input and stale-listing tests both assert on that record, so a gate report added back to the no-success deadline branch fails the first and the old report over a retained listing fails the second. At the merge base the stale-listing test fails because the recorder sees the --report-only call the old deadline branch makes over the retained snapshot, so this selection fails there and passes at the head.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/ci/test_ci_summary_jobs_listing_omn23027.py -q -n 0 --no-cov -k "unreadable_input or stale_listing"
        cwd: ${OMNI_HOME}/omnibase_infra
