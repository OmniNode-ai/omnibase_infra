schema_version: "1.0.0"
ticket_id: OMN-22131
title: HandlerRegistrationStoragePostgres takes only its container and resolves its settings from it; the five handler-di-gate findings and the baseline entry are gone
summary: The handler-di-gate check reported five findings in handlers/registration_storage/handler_registration_storage_postgres.py at dev 4d809a8 (two timeout literals, a twelve-parameter constructor, a port defaulted to None, an asyncio.Lock built in __init__). The handler now accepts (self, container) and resolves ModelRegistrationStoragePostgresConfig with get_service. Pool size, statement timeout, database, user and circuit breaker values live in models/registration_storage/registration_storage_postgres.yaml; the orchestrator plugin binds them with the deployment DSN or host. The file reports zero findings and its baseline line is deleted.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn22131-regstore-pg-di
    statement: HandlerRegistrationStoragePostgres takes its dependencies by constructor injection through the container, holds no timeout or connection literal, and its handler-di-gate baseline entry is deleted.
    acceptance:
      - id: AC1
        statement: 'AC1: the handler-di-gate check reports zero findings for handler_registration_storage_postgres.py with an empty baseline and the file has no line in .onex_ratchets/handler_di_baseline.txt -- falsifier: the check run with an empty baseline over the file'
      - id: AC2
        statement: 'AC2: the handler is built from a container holding ModelRegistrationStoragePostgresConfig, in an in-memory profile and a Redpanda-overlay profile, and opens the pool and applies the waits that config names -- falsifier: uv run pytest tests/unit/handlers/test_handler_registration_storage_postgres_di_omn22131.py'
evidence_requirements:
  - kind: tests
    description: The constructor accepts only the container; both profiles open the pool the bound config names; the declared file holds the previous defaults; a container without the config is refused.
    command: uv run --frozen pytest tests/unit/handlers/test_handler_registration_storage_postgres_di_omn22131.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22131-ac1-gate-zero
    description: The DI regression asserts the constructor signature is (self, container); at the merge base it fails because the constructor takes twelve parameters.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/handlers/test_handler_registration_storage_postgres_di_omn22131.py -q -k constructor_accepts_only_the_container"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn22131-ac2-two-profiles
    description: Both container profiles drive the pool arguments, timeout and circuit breaker of the handler; at the merge base the handler ignores the container and these cases fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/handlers/test_handler_registration_storage_postgres_di_omn22131.py tests/unit/handlers/test_registration_storage_protocol_compliance.py tests/unit/nodes/node_registration_orchestrator/test_plugin_registration_storage_wiring.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn22131-deploy-runtime-constructor
    description: Deploy half. It reads the runtime container after a dev image carrying this change is deployed, which a hosted runner does not have, so only the local Done gate runs it and it binds no acceptance criterion. It fails while the running image still has the twelve-parameter constructor.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "env docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'import inspect; from omnibase_infra.handlers.registration_storage.handler_registration_storage_postgres import HandlerRegistrationStoragePostgres as H; assert list(inspect.signature(H.__init__).parameters) == [\"self\", \"container\"]; print(\"DI-CTOR-OK\")' | grep -E '^DI-CTOR-OK$'"
