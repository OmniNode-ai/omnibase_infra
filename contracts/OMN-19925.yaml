# OMN-19925 contract file for omnibase_infra deploy-gate.
# The canonical ticket contract and PASS receipts live in onex_change_control.
schema_version: "1.0.0"
ticket_id: "OMN-19925"
title: "fix(OMN-19925): judge compose infra services render under the deploy default profile"
summary: >-
  docker-compose.judge.yml re-profiled postgres, redpanda, redpanda-partition-cap, valkey, forward-migration, migration-gate and intelligence-migration to ["judge"] only, while onex-runtime-deploy renders a lane with the single profile "runtime". The filtered project kept omninode-runtime, runtime-effects and projection-api (profiles runtime/full from the base file) but dropped the services they depend on, so the Build Images phase failed with 'depends on undefined service "redpanda"'. The seven infra services now carry ["judge", "runtime", "full"]; "judge" stays so the standalone judge render is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "Judge compose profile unit tests pass, including the new check that every judge infra service is active under the deploy script's default profile."
    command: "uv run pytest tests/unit/infra/test_judge_compose_profile.py -q -k judge_compose_profile"
  - kind: "tests"
    description: "Layered base+judge render under --profile runtime succeeds and holds the infra services."
    command: "uv run pytest tests/integration/infra/test_judge_compose_render.py -q -m integration"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-ac1-infra-profiles"
    description: "AC1: the judge infra services carry the runtime and full profiles; the layered render under --profile runtime exits 0 with redpanda, postgres and valkey present."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/integration/infra/test_judge_compose_render.py -q -m integration -k deploy_default"
  - id: "dod-ac3-profile-drift-test"
    description: "AC3: a focused pytest asserts every judge infra service profile set contains the deploy script's default COMPOSE_PROFILE; it fails against the unfixed compose file."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/infra/test_judge_compose_profile.py -q -k judge_compose_profile"
