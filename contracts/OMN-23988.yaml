schema_version: 1.0.0
ticket_id: OMN-23988
title: Remove the retired shared package from build, deploy and lab-proof inputs
summary: >-
  Candidate builds and scoped image proofs use the remaining staged siblings. The runtime image, deploy scripts and lab-proof registry keep their existing retirement guards. The deploy agent's lock still resolves the retired distribution through the published infrastructure package.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23988-no-compat-live-use
    statement: >-
      Runtime image, deploy, lab-proof and topic validation inputs exclude the retired package.
    acceptance:
      - id: AC1
        statement: No build, deployment, runtime or topic validation input names the retired package.
      - id: AC2
        statement: The focused and CI contract tests pass on the lab, with failing controls against the base for changed assertions.
      - id: AC3
        statement: >-
          The project dependency declarations and root lock omit the retired package. The deploy agent lock can retain its transitive entry until the dependency-free infrastructure release is published.
      - id: AC4
        statement: >-
          The candidate image probe works with the remaining siblings and the Dockerfile and workflow smoke checks import the active foundation packages. Required PR checks and the landing handoff identify the same head SHA.
evidence_requirements:
  - kind: tests
    description: Scoped candidate building, image provenance, deployment and topic validation.
    command: >-
      uv run --frozen pytest tests/scripts/test_build_effects_candidate.py tests/scripts/test_scoped_effects_plan.py tests/scripts/test_scoped_effects_deploy.py tests/unit/scripts/validation/test_lint_topic_names.py -q -n 0 --no-cov -p no:randomly
  - kind: tests
    description: Lab-proof registry, plan and deployment regression tests.
    command: >-
      uv run --frozen pytest tests/integration/lab_proof tests/unit/nodes/node_lab_proof_plan_compute tests/scripts/test_deploy_gateway.py tests/scripts/test_dockerfile_runtime_git_refresh.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23988-no-compat-live-use
    description: Scan production inputs and require no match for either spelling of the retired name.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: >-
          bash -c 'git grep -niIE "omnibase[_-]compat" -- .github .pre-commit-config.yaml CHANGELOG.md config docker scripts src ":(exclude)scripts/deploy-agent/tests" ":(exclude)scripts/deploy-agent/uv.lock"; test "$?" -eq 1'
        cwd: .
  - id: dod-omn23988-focused-regressions
    description: The typed plans, candidate manifest, executor, image probe and topic validator require the active inputs.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/scripts/test_build_effects_candidate.py tests/scripts/test_scoped_effects_plan.py tests/scripts/test_scoped_effects_deploy.py tests/unit/scripts/validation/test_lint_topic_names.py tests/ci/test_no_omnibase_compat_live_use.py -q -n 0 --no-cov -p no:randomly
        cwd: .
  - id: dod-omn23988-direct-pins-and-root-lock
    description: The root lock, both projects' direct declarations and the scoped source pins omit the retired distribution.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: >-
          bash -c 'git grep -niIE "omnibase[_-]compat" -- uv.lock pyproject.toml scripts/deploy-agent/pyproject.toml scripts/runtime_build/build_effects_candidate.py scripts/runtime_build/scoped_effects_plan.py; test "$?" -eq 1'
        cwd: .
  - id: dod-omn23988-deploy-readback
    description: Hosted evidence checks the image import smoke and the scoped probe over the remaining installed packages.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: >-
          docker --version && uv run --frozen pytest tests/unit/docker/test_delegation_import_smoke_guard.py tests/scripts/test_scoped_effects_plan.py -q -n 0 --no-cov -p no:randomly -k 'smoke or shared_evidence_reads_the_editable_project_contracts'
        cwd: .
  - id: dod-omn23988-integration-proof-dev
    description: The local Done gate checks the running dev image after deployment for absence of the retired module.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker ps --filter label=com.omninode.build_source --format '{{.Image}}' | head -1 | xargs -I{} docker run --rm --entrypoint /app/.venv/bin/python {} -c "import importlib.util as u; raise SystemExit(u.find_spec('omnibase_compat') is not None)"
        cwd: .
