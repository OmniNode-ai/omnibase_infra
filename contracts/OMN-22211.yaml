schema_version: "1.0.0"
ticket_id: OMN-22211
title: "A delegate send that ends while its command is still queued records a typed queued-not-started terminal"
summary: >
  A delegation whose command sat behind a backlog on the delegate-skill consumer ended with terminal_class timeout, no attempt and no rung, which a caller could not tell from a lost command. When the wait ends (the CLI hard timeout or the runtime's own timeout) and the observed queue depth shows records ahead of the command, the receipt now records terminal_class queued_not_started, names the depth in its failure reason and queue_depth block. A zero or unobserved depth stays a bare timeout.

is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22211-queued-not-started
    statement: A send that ends while its command is still queued behind the consumer records a typed queued-not-started terminal naming the backlog depth.
    acceptance:
      - id: AC1
        statement: "AC1: a send whose command is still queued behind the consumer when the caller wait ends records a typed queued-not-started terminal that names the backlog depth, not a bare timeout with no route -- falsifier: uv run pytest tests/unit/cli/test_delegate_backlog_receipt.py -q -k queued_not_started, a stub consumer with 50 records ahead, which records a bare timeout today"
      - id: AC2
        statement: "AC2: a regression test built from the recorded receipt of run 91fda261 (records_ahead 50, backlog_records 51, scrubbed) fails on the current code and passes on the fix -- falsifier: uv run pytest tests/unit/cli/test_delegate_backlog_receipt.py -q -k receipt_91fda261"
evidence_requirements:
  - kind: tests
    description: "The backlog receipt tests and the neighbouring delegate receipt tests pass"
    command: "uv run pytest tests/unit/cli/test_delegate_backlog_receipt.py tests/unit/cli/test_delegate_incomplete_receipt_omn17427.py tests/unit/cli/test_delegate_queue_depth_branches.py -q --no-cov -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22211-ac1-queued-not-started
    binds_ac: [AC1]
    description: A stub consumer with 50 records ahead ends the wait with terminal_class queued_not_started on both the hard-timeout and the runtime-timeout path; the receipt names records_ahead 50 and backlog_records 51; zero and unobserved depths stay timeout.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/cli/test_delegate_backlog_receipt.py -q --no-cov -k queued_not_started -p no:randomly"
  - id: dod-omn22211-ac2-receipt-91fda261
    binds_ac: [AC2]
    description: The scrubbed receipt of run 91fda261 (records_ahead 50, backlog_records 51) in tests/fixtures/omn22211 yields queued_not_started on both paths; the same tests fail on the code before the change with a bare timeout.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/cli/test_delegate_backlog_receipt.py -q --no-cov -k receipt_91fda261 -p no:randomly"
