schema_version: 1.0.0
ticket_id: OMN-18143
title: the dev runtime phase's convergence read names every profile its services need, so a profile-gated dev-lane service no longer aborts the deploy
summary: >-
  Lane dev-redeploy-window-1102. The deploy agent's rendered-hash read (`compose config --hash <services>`) ran under `--profile runtime` and named cost-estimator-web, whose compose profile is `cost-estimator`; compose enables the profile of a service named on an `up` command line but not on `config --hash`, so the read failed with `no such service: cost-estimator-web` and aborted dev deploy da6bc43b. An explicit service list is now rendered with every declared profile enabled; the `["*"]` form keeps exactly the requested profile. This pull request fixes that one failure only; it does not claim the ticket's own six criteria, which concern the redeploy effect's publish monitor.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18143-config-hash-enables-named-profiles
    statement: A rendered-hash read of an explicit service list asks compose to enable all declared profiles with its wildcard, so every named service can be resolved without maintaining a second profile list.
    acceptance:
      - id: AC7
        statement: 'AC7: `_rendered_config_hashes` for an explicit list that names cost-estimator-web returns real compose hashes, under profile runtime and under no profile; the `["*"]` form keeps exactly the requested profile and excludes cost-estimator-web. The test reads the profiles from this repository and invokes compose config without starting containers.'
evidence_requirements:
  - kind: "tests"
    description: "Compose returns hashes for named services across profiles and preserves the selected-profile service set."
    command: "uv run --frozen --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_config_hash_enables_named_profiles_omn18143.py -q -p no:cacheprovider"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn18143-ac7-config-hash-profiles
    description: >-
      AC7 only. The tests check the generated argv and run the executor against real compose config using a minimal model with service profiles read from this repository's dev-lane overlay. They require hashes for every explicitly named service, an unchanged runtime-service hash, and exclusion of cost-estimator-web from the runtime-only wildcard service set. Compose config runs without a daemon, image pulls, or container changes, so the check can run on a hosted runner with Docker Compose. This evidence does not cover AC1 through AC6 or a live redeploy.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_config_hash_enables_named_profiles_omn18143.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC7
