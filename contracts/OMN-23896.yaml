schema_version: "1.0.0"
ticket_id: "OMN-23896"
title: "The runtime account is granted the two host disk tables in the platform database settings"
summary: "omnibase_infra vendors omnimarket's node_projection_host_disk migrations and grants omninode_runtime SELECT, INSERT and UPDATE on host_disk_class and host_disk_volume in every shipped topology profile, ahead of the omnimarket pull request that adds the node. The grants are regenerated by scripts/generate_application_database_table_grants.py and the catalogs by its own render step. Without them the runtime refuses to prepare the node's writer and the omnimarket event chain gate fails at collection with a missing SELECT on host_disk_class."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-host-disk-runtime-grants"
    statement: "Every shipped topology profile grants the runtime role the two host disk tables, the grant derivation reports no drift against the node's contract, and both node migrations are vendored and declared."
    acceptance:
      - id: "AC1"
        statement: "AC1: the regenerated platform topology lists host_disk_class and host_disk_volume with select, insert and update for the runtime account in every instance that carries the others -- falsifier: uv run pytest tests/unit/topology/test_host_disk_runtime_grants_omn23896.py -q fails on dev, where declared_acl lists no grant for host_disk_class"
      - id: "AC2"
        statement: "AC2: the two migrations are vendored with their ledger rows and migration classes and the application migration manifest validator prints PASS -- falsifier: uv run python scripts/validation/validate_application_migration_manifest.py exits 1 when a ledger row's sha256 differs from the vendored file"
      - id: "AC3"
        statement: "AC3: failing control: a table no profile grants reads as an empty grant set and the grant test names the profile and table that lack the grant -- falsifier: the control case in tests/unit/topology/test_host_disk_runtime_grants_omn23896.py passes only while the check reports an ungranted table as empty"
      - id: "AC4"
        statement: "AC4: integrated: done only when running and observed where it runs: after the omnimarket lock takes the platform release that carries this grant, the Event Chain Gate of the disk-report pull request passes and the dev database holds both tables with the runtime account's rights, read back from the database's own grant table -- falsifier: the Event Chain Gate still names SELECT on host_disk_class as missing, or the grant read-back rows for the two tables are empty"
evidence_requirements:
  - kind: "tests"
    description: "The grant tests pass at the head; on the merge base no profile grants the two tables."
    command: "uv run pytest tests/unit/topology/test_host_disk_runtime_grants_omn23896.py tests/unit/topology/test_application_database_table_grants.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23896-ac1-topology-grants"
    description: "AC1 hosted probe. Every profile grants the runtime role the two host disk tables and both migrations are vendored."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_host_disk_runtime_grants_omn23896.py tests/unit/topology/test_application_database_table_grants.py -q"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn23896-ac2-vendored-migrations"
    description: "AC2 hosted probe. The two vendored migrations are present; the new test file is absent at the merge base, so the command fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_host_disk_runtime_grants_omn23896.py -k vendored -q"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn23896-ac3-control"
    description: "AC3 hosted probe. The control case reports an ungranted table as an empty grant set."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_host_disk_runtime_grants_omn23896.py -k control -q"
        cwd: "."
    binds_ac: ["AC3"]
  - id: "dod-omn23896-hosted-proxy-ac4"
    description: "Hosted proxy for AC4. The shipped topology grants the runtime role both tables in every profile the omnimarket gate and the dev lane read; the readings on the omnimarket branch and the dev lane are not reachable from a hosted runner."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_host_disk_runtime_grants_omn23896.py -q"
        cwd: "."
    binds_ac: ["AC4"]
  - id: "dod-omn23896-integration-proof-lab"
    description: "Runs this change's tests at the pushed head on a lab host through the lab work runner; hosted CI cannot reach the lab runner, so only the local Done gate runs this check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23896 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/topology/test_host_disk_runtime_grants_omn23896.py tests/unit/topology/test_application_database_table_grants.py -q --no-cov -n 0 -p no:randomly'
        cwd: "."
