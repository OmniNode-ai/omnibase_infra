  - id: dod-omn20935-deploy-probe-lane-table-reader
    description: 'Deploy probe for the reader change: read the delegate CLI lane resolver from GitHub at the evaluated checkout''s commit and require the workspace config root lookup. This does not deploy a service or claim that a runtime has been promoted. The probe fails on the merge-base resolver, which reads the lane table under the omnimarket checkout. The AC2 tests above exercise the config root, the environment override and the refusal.'
    source: manual
    checks:
