    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_ci_bus_lane_table_read_from_overlay_omn20935.py tests/ci/test_chain_canary_workflow.py tests/ci/test_dlq_and_baselines_lane_broker_omn17163.py tests/ci/test_omn18096_ci_bus_overlay_gate_wiring.py tests/ci/test_r1_front_door_probe_omn19445.py tests/unit/scripts/test_ci_bus_overlay_live_binding.py -q -p no:randomly --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn20935-ac2-cli-reads-the-config-root
    description: 'AC2: the delegate CLI resolves the lane declaration from the workspace config root.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_delegate_lane_broker.py tests/unit/cli/test_omn19193_workspace_tier1_transport.py tests/unit/cli/test_omn19212_materialised_workspace_transport.py -q -p no:randomly --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
