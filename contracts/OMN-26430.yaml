        cwd: .
  - id: dod-omn26430-ac2-boot-good-7dff-in-start-period
    description: "Boot-good image 7dff9d9f641f: container started 01:54:30Z, first healthy probe +101 s, /health 200 read +184 s, below the smallest dev-lane start_period (1200 s); a reading of 2000 s fails the same test."
    source: manual
