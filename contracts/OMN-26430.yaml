schema_version: 1.0.0
ticket_id: OMN-26430
title: The dev runtime process is not killed by two threads sharing one projection writer's database adapter, so a new build reaches healthy on the dev lane
summary: >-
  The dev lane rolled origin/dev at 0974c88a on 2026-11-23 and the new runtime container died 169 s after start with a segfault in the asyncpg protocol extension, then so did the container before it. The runtime dispatches a projection handler with asyncio.to_thread and admits up to PROJECTION_HANDLER_MAX_INFLIGHT threads at once. A handler that owns its adapter connects, uses and closes that one instance per message, so concurrent messages were one adapter shared across threads and loops. The dispatch callback now takes a per-handler lock, ahead of the runtime-wide inflight gate, for a handler that owns its database adapter. A handler handed its adapter per call keeps its parallelism. No health gate, start period, wait setting or compose file changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26430-one-message-at-a-time-per-adapter-owner
    statement: The runtime hands a projection handler that owns its database adapter one message at a time, and leaves the parallelism of every other projection handler alone.
    acceptance:
      - id: AC3
        statement: "AC3: with six concurrent messages through one dispatch callback, a handler that owns its adapter is never inside handle() on two threads at once and every message is still handled -- falsifier: uv run pytest tests/unit/runtime/auto_wiring/test_omn26430_db_owning_projection_serial_dispatch.py fails at origin/dev with six threads inside handle() together and passes on the PR branch"
      - id: AC4
        statement: "AC4: a handler that holds no adapter of its own still runs on several threads at once -- falsifier: the control test in the same file reads a peak of 1 thread, so the serialisation is not scoped to adapter owners"
evidence_requirements:
  - kind: tests
    description: The serial-dispatch regression and the existing projection-runner dispatch tests.
    command: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn26430_db_owning_projection_serial_dispatch.py tests/unit/runtime/auto_wiring/test_omn16874_projection_runner_dispatch.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26430-ac3-serial-dispatch
    description: "Six messages through one dispatch callback: a handler owning its adapter peaks at one thread inside handle(); at origin/dev the peak is six."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn26430_db_owning_projection_serial_dispatch.py -k never_inside_handle -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26430-ac4-injected-db-parallel
    description: "The positive control: a handler handed its adapter per call peaks above one thread, so the lock is scoped to adapter owners."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn26430_db_owning_projection_serial_dispatch.py -k keeps_its_parallelism -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26430-deploy-serial-dispatch-live
    description: >-
      Post-deploy probe: the rebuilt dev runtime container carries the per-handler lock in its dispatch callback. It reads the live container, which carries the change only after the deploy agent has rebuilt it, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: docker exec omninode-runtime grep -q serialize_owned_database /app/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py
