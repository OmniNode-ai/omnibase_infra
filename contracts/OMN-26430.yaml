  - id: dod-omn26430-deploy-owned-database-gate-live
    description: >-
      Post-deploy probe: the rebuilt dev runtime container carries the per-handler lock in its dispatch callback (the merged symbol is owned_database_gate, imported and entered in handler_wiring.py; the earlier probe grepped a name that never existed in source, so it could not pass on any build). It reads the live container, which carries the change only after the deploy agent has rebuilt it, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: docker exec omninode-runtime grep -q owned_database_gate /app/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py
