schema_version: "1.0.0"
ticket_id: "OMN-23072"
title: "T14 dev stack retires the infra routing decisions consumer container"
summary: >
  One-runtime plan T14, the retirement half. node_projection_infra_routing_decisions (omnimarket#4847) owns the infra_routing_decisions table and, with the handover OMN-23065 declares in its contract, takes over the retired consumer group infra-routing-decisions-postgres. This change removes the infra-routing-decisions-consumer container from the dev lane compose file, its two overlays and the pre-PR verify compose file, from the dev deploy sets (handler_runtime_deploy.sh, refresh_dev_lane.sh, deploy-agent events.py) and the stack shape baseline (two entries). It does not delete the consumer module, which omnimarket's parity tests still import, and it does not touch the lane manifest in the overlays repository or the lane boundary maps that mirror it.

is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn23072-retired"
    statement: "The dev stack no longer declares or deploys the consumer container."
    acceptance:
      - id: "AC1"
        statement: "AC1: no dev stack compose file declares infra-routing-decisions-consumer and neither the dev deploy sets nor the lane boundary maps name it -- falsifier: uv run pytest tests/unit/docker/test_dev_infra_routing_retire_omn21288.py -q, red on dev"
      - id: "AC2"
        statement: "AC2: the stack shape baseline holds no infra-routing-decisions-consumer entry and the stack shape check passes over the real compose files -- falsifier: uv run pytest tests/unit/validation/test_checker_stack_shape.py -q"
evidence_requirements:
  - kind: "tests"
    description: "The retirement test and the stack shape check pass over the real dev compose files."
    command: "uv run pytest tests/unit/docker/test_dev_infra_routing_retire_omn21288.py tests/unit/validation/test_checker_stack_shape.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23072-retired"
    description: "No dev stack compose file, dev deploy set or stack shape baseline names the consumer. Fails on dev, which declares it in four compose files. The lane boundary maps are not covered: they mirror the lane manifest in the overlays repository and move with it."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/docker/test_dev_infra_routing_retire_omn21288.py -q --no-cov"
        cwd: "."
  - id: "dod-omn23072-deploy-probe"
    description: "Hosted structural smoke needing no lab route: read the dev lane compose file at the checked-out PR head through the GitHub contents API and require that it holds content and declares no infra-routing-decisions-consumer service. Fails at the merge base, whose dev lane compose file declares it."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: |
          bash -o pipefail -c 'c=$(gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.dev-lane.yml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d) && test -n "$c" && ! printf "%s" "$c" | grep -qE "^  infra-routing-decisions-consumer:"'
  - id: "dod-omn23072-stack-shape"
    description: "The stack shape check passes over the real compose files with the two baseline entries removed; a stale entry would fail it."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/validation/test_checker_stack_shape.py -q --no-cov"
        cwd: "."
  - id: "dod-omn23072-integration-proof"
    description: "The pushed head ran the retirement test and the stack shape check on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnibase_infra --sha \"$(git rev-parse HEAD)\" --lane oneruntime-t14-c-fl0655 -- uv run --frozen pytest tests/unit/docker/test_dev_infra_routing_retire_omn21288.py tests/unit/validation/test_checker_stack_shape.py -q --no-cov"
        cwd: "."
