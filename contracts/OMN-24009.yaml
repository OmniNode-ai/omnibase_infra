schema_version: "1.0.0"
ticket_id: OMN-24009
title: "Make the unreachable-broker correlation tests independent of name-lookup speed"
summary: "The two unreachable-broker tests in the service-backed correlation suite pointed the event bus at a name that cannot resolve and expected a connection error. When the name lookup took longer than the 2 second connect bound, start() raised the timeout error instead and the circuit-open refusal test failed (omnibase_infra 5908, job 131334922629). The tests now aim at a loopback port that refuses at once, with no resolver involved; the 2 second bound and every assertion are unchanged, and a control class forces a 3 second name lookup and fails with the old address."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24009-lookup-independent-refusal
    statement: The unreachable-broker correlation tests get the connection error and the circuit-open refusal whatever the speed of a name lookup.
    acceptance:
      - id: AC1
        statement: 'AC1: the two unreachable-broker tests no longer depend on name-lookup speed: a test that forces every name lookup to take longer than the 2 second connect bound still gets the connection error, not the timeout -- falsifier: RUN_HEAVY_TESTS=1 KAFKA_BOOTSTRAP_SERVERS=localhost:1 uv run pytest tests/integration/correlation/test_correlation_propagation_heavy.py -q -k slow_name_lookup fails when the broker address is set back to the unresolvable name and passes at the head'
      - id: AC2
        statement: 'AC2: the 2 second bound and every assertion of the two existing tests are unchanged -- falsifier: git diff origin/dev -U0 -- tests/integration/correlation/test_correlation_propagation_heavy.py shows a removed line containing assert or timeout_seconds'
      - id: AC3
        statement: 'AC3: integrated: after this merges, the service-backed integration suite check on a dev-bound pull request reads the circuit-open refusal test as passed -- falsifier: that test fails again with the connect timeout against the unreachable broker on any later head'
evidence_requirements:
  - kind: tests
    description: The correlation failure tests and the slow-lookup control pass at the pushed head; the control fails with the connect timeout when the broker address is the unresolvable name.
    command: RUN_HEAVY_TESTS=1 KAFKA_BOOTSTRAP_SERVERS=localhost:1 uv run pytest tests/integration/correlation/test_correlation_propagation_heavy.py -q -k "RealFailures or slow_name_lookup"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24009-ac1
    description: 'AC1: the forced-slow-lookup control tests pass at the head and fail at the merge base'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: env RUN_HEAVY_TESTS=1 KAFKA_BOOTSTRAP_SERVERS=localhost:1 uv run pytest tests/integration/correlation/test_correlation_propagation_heavy.py -q -k slow_name_lookup -n 0 --no-cov
        cwd: .
  - id: dod-omn24009-ac2
    description: 'AC2: the two existing unreachable-broker tests, with their assertions and the 2 second bound unchanged, pass beside the control at the head'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: env RUN_HEAVY_TESTS=1 KAFKA_BOOTSTRAP_SERVERS=localhost:1 uv run pytest tests/integration/correlation/test_correlation_propagation_heavy.py -q -k "RealFailures or slow_name_lookup" -n 0 --no-cov
        cwd: .
  - id: dod-omn24009-ac2-diff
    description: 'AC2 falsifier read locally: no removed line of the test file contains assert or timeout_seconds'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: sh -c '! git diff origin/dev -U0 -- tests/integration/correlation/test_correlation_propagation_heavy.py | grep -E "^-.*(assert|timeout_seconds)"'
        cwd: .
  - id: dod-omn24009-ac3
    description: 'AC3: the circuit-open refusal test and the control pass at the head and the control fails at the merge base; the integrated reading is the next item'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: env RUN_HEAVY_TESTS=1 KAFKA_BOOTSTRAP_SERVERS=localhost:1 uv run pytest tests/integration/correlation/test_correlation_propagation_heavy.py -q -k "circuit_open_refusal or slow_name_lookup" -n 0 --no-cov
        cwd: .
  - id: dod-omn24009-ac3-integration-proof
    description: 'AC3 integrated reading: the service-backed suite check on a dev-bound pull request reads the circuit-open refusal test as passed. Hosted CI cannot read its own later runs, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex scm pr-checks OmniNode-ai/omnibase_infra
        cwd: .
