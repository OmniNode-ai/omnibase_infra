      A localhost-only, non-persistent process cannot back a LAN-routable
      contract slot, and the inventory's own follow-ups require explicit
      availability semantics + health checks before such endpoints enter typed
      routing catalogs. Promoting this slot is that scoped follow-on, not this
      reconcile.
