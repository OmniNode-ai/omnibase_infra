    role_env_alias: LLM_REASONING_URL
    model_hf_id: antirez/deepseek-v4-gguf
    role: reasoning
    status: running
    hardware: M2 Ultra (.200)
    context_window_budgeted: 65536
    launchd_unit_or_none: null
    notes: |
      Architecturally-different second opinion for math/algorithmic code.
      OMN-16442 reconcile (2026-08-28): the SLOT is still live at .200:8101, but
      it no longer serves the MLX DeepSeek-R1-Distill-Qwen-32B it was recorded
      with. Live readback, GET http://192.168.86.200:8101/v1/models: ids
      {"deepseek-v4-flash", "deepseek-v4-pro"} (two aliases for one model,
      display name "DeepSeek V4 Flash"), owned_by "ds4.c", context_length
