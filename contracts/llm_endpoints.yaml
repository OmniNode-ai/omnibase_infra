#
# Canonical topology contract for LLM inference endpoints.
# OMN-6931: contract-first. This contract is the convergence target for
# future consumer migration; current runtime consumers still read from
# .env / Infisical / adapter-local registries / docker/catalog/model_registry.yaml.
# See docs/plans/2026-04-18-llm-topology-sync.md Truth Boundary.
#
# Two field groups per entry:
#
# STABLE-CANONICAL (downstream code/tests may key on these):
#   slot_id         canonical identifier                          always non-null
#   host            IP address (never hostname)                   non-null when status=running
#   port            integer port                                  non-null when status=running
#   endpoint_url    resolved URL, convenience field               non-null when status=running
#   url_env_var     model-named env var (legacy, canonical read)  non-null when status=running *if the slot exposes an env var*; null for Docker-internal slots
#   role_env_alias  role-named env var (new alias)                non-null when status=running *if a role alias is defined*; null when not yet assigned
#   model_hf_id     exact HuggingFace id                         non-null when status=running
#   role            role taxonomy value (see below)               always non-null
#   status          running | disabled | on_demand | planned      always non-null
#   endpoint_from_overlay  address read from the llm_endpoints overlay at run time;
#                          when true, host/port/endpoint_url must be null
#                          (the public contract carries no address for the slot)
#
# url_env_var and role_env_alias may be null on running slots (e.g. Docker-internal
# embeddings with no external env-var exposure, or slots where the role alias has
# not yet been assigned). They may also be null on disabled, on_demand, and planned
# slots. Runtime consumers (service_kernel.py:1224-1260) must null-guard these fields.
#
# OPERATOR-ANNOTATION (may be null):
#   hardware                  human host description
#   context_window_budgeted   current max-tokens cap
#   launchd_unit_or_none      launchd label or null
#   notes                     free text
#
# Role taxonomy (closed set):
#   coder_slow, coder_fast, embedding, reasoning, reasoning_fast,
#   reasoning_lightweight, reasoning_transient, vision, stt, tts, reranker
endpoints:
  - slot_id: coder-5090
    host: 192.168.86.201
    port: 8000
    endpoint_url: http://192.168.86.201:8000
    url_env_var: LLM_CODER_URL
    role_env_alias: LLM_CODER_SLOW_URL
    model_hf_id: Qwen/Qwen3.8-27B
    role: coder_slow
    status: running
    hardware: RTX 5090 (.201)
    context_window_budgeted: 131072
    launchd_unit_or_none: null
    notes: |
      OMN-14379 reconcile (2026-09-03). This slot went DOWN entirely: nothing
      was listening on :8000, and `vllm-gpu0.service` was inactive+disabled and
      crash-looped on every start because its --gpu-memory-utilization 0.92 and
      vllm-embeddings.service's 0.08 sum to 1.00 on the ONE surviving GPU,
      leaving no room for either process's CUDA context. Fixed by sizing the
      unit to 0.86 (arithmetic in
      deploy/systemd/vllm-gpu0-qwen-coder.service, enforced by
      tests/ci/test_vllm_qwen_coder_service_unit.py); both services are now
      co-resident.
      The SGLang description below is RETIRED. Live readback 2026-09-03T16:07Z,
      GET http://192.168.86.201:8000/v1/models: id "Qwen3.6-35B-A3B",
      owned_by "vllm", root /data/inference/hf-cache/Qwen3.6-35B-A3B-GPTQ-Int4,
      max_model_len 131072; a chat completion returned HTTP 200. The served
      artifact is a locally-produced GPTQ-Int4 quantization (gptqmodel 6.0.3)
      with no upstream HF repo of its own; model_hf_id records the BASE model,
      Qwen/Qwen3.6-35B-A3B. context_window_budgeted 122880 -> 131072 to match
      the live max_model_len.
      MODEL-ID ENFORCEMENT CHANGED WITH THE BACKEND: SGLang echoed any `model`
      string back at HTTP 200; vLLM does NOT. Live-verified same session:
      POST /v1/chat/completions with model "qwen3.8" now returns HTTP 404
      "The model `qwen3.8` does not exist." Any consumer still pinned to the
      SGLang-era id is now hard-failing, not silently mis-attributing.
      CONCURRENCY: vLLM reports "Maximum concurrency for 131,072 tokens per
      request: 1.44x" (GPU KV cache 188,416 tokens / 3.71 GiB). Size callers
      against roughly one full-context request in flight.

      OMN-18626, live readback 2026-09-17T20:17Z: the slot moved AGAIN, and this
      is the third served id this one endpoint has carried. GET
      http://192.168.86.201:8000/v1/models now returns exactly one id,
      "Qwen3.8-27B", owned_by "vllm", root
      /data/inference/hf-cache/Qwen3.8-27B-NVFP4-RTX5090, max_model_len 131072,
      http=200 in 0.012s. Negative control the same session, same curl shape:
      :8001 returns curl exit 7 / http=000, so the 200 is that port answering
      rather than a proxy answering everything. The served artifact is again a
      locally-produced quantization -- NVFP4, built for this card, with no
      upstream HF repo of its own -- so model_hf_id records the BASE model,
      Qwen/Qwen3.8-27B, read from the weight directory's own README rather than
      guessed from the directory name. The 35B GPTQ-Int4 paragraph above is
      RETIRED and kept only as the record of what this slot used to serve.
      The vLLM-refuses-an-unknown-model note above is now load-bearing rather
      than illustrative: it is what made this flip a hard outage of the local
      delegation tier instead of a mis-attribution.
      --- superseded, kept for lineage ---
      OMN-16442 reconcile (2026-08-28) against the canonical inventory
      omni_home/docs/reference/AI_LAB_HARDWARE.md ("Last verified: 2026-08-28").
      The .201 reboot of 2026-08-23 replaced the vLLM Qwen3-Coder-30B stack with
      SGLang + a DSpark drafter. Live readback, GET http://192.168.86.201:8000
      /v1/models: id "qwen3.8", owned_by "sglang", max_model_len 122880.
      model_hf_id records the BASE model (Qwen/Qwen3.8-27B, per the served
      artifact's own card); the artifact actually loaded is a locally-produced
      NVFP4 quantization at /data/inference/hf-cache/Qwen3.8-27B-NVFP4-RTX5090
      with no upstream HF repo of its own. context_window_budgeted raised
      114688 -> 122880 to match the live max_model_len (the old value described
      the retired TurboQuant aither-kvcache setup).
      CONCURRENCY: the server currently admits ONE running generation request,
      so concurrency must be queued ABOVE the model server. Treat this slot as
      single-slot when sizing callers.
