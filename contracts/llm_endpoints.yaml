    role: embedding
    status: running
    hardware: null
    context_window_budgeted: 8192
    launchd_unit_or_none: null
    notes: |
      Canonical runtime embedding endpoint for LLM_EMBEDDING_URL; its address
      is the llm_endpoints overlay value (key embeddings-201), read by the
      deploy guard. Served by the second GPU's embedding server since
      2026-11-12 because the embedding server on the first GPU shared it with
      the 27B chat model and pushed it into CUDA out of memory. The served
      model is the one model_hf_id names, 1024-dimensional output, ctx 8192.
      OMN-16442 reconcile: model_hf_id was corrected from a stale id that is
      NOT what this endpoint serves.
      VECTOR DIMENSION: 1024 (config.json hidden_size). This is a HARD
      placement constraint: a consumer collection sized for any other width
      CANNOT be served by this endpoint.
