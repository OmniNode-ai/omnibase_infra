      LaunchAgent, NOT by the retired com.mlx.deepseek-reasoning MLX job — that
      launchd label is cleared here because it no longer owns this port.
      model_hf_id names the GGUF artifact repo actually loaded
      (antirez/deepseek-v4-gguf, from $HOME/Code/ds4/gguf/); the upstream base is
      deepseek-ai/DeepSeek-V4-Flash.
      context_window_budgeted 8192 -> 65536: a deliberate conservative budget
      matching omnimarket routing_tiers.yaml's max_context_tokens for this
      backend, still well inside the server's 131072 ceiling. It is a BUDGET,
      not the server limit.
      RESOLVED DRIFT: the old "KNOWN DRIFT" note said LLM_DEEPSEEK_R1_URL pointed
      at .201:8001 (14B) instead of this slot. That target no longer exists at
      all (GPU removed for RMA, OMN-16407), so the only correct value for
      LLM_DEEPSEEK_R1_URL is this slot.
