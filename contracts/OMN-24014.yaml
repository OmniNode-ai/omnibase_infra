schema_version: "1.0.0"
ticket_id: OMN-24014
title: "The dev image build gives the core library its version in the form the version tool reads"
summary: "docker/Dockerfile.runtime exported SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OMNIBASE_CORE before the staged core install, but omnibase_core builds with hatch-vcs, which calls setuptools_scm.get_version with no distribution name, so only the generic SETUPTOOLS_SCM_PRETEND_VERSION is honored. The staged tree has no .git, so the runtime image build failed at builder step 21/37 (deploy job 03c5d329). The same derived version taken from the staged pin comparison (the single version source of omnibase_infra#5908) is now exported under the generic name inside the core install subshell only."
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24014-generic-pretend-version
    statement: The image build installs the staged, git-less omnibase_core with the version the pin node derived, under the environment variable name that hatch-vcs honors, scoped to the core install only.
    acceptance:
      - id: AC1
        statement: 'AC1: the image build gives the core library''s version to the version tool in the form that tool reads when it is told no package name, scoped to the core install only -- falsifier: uv run pytest tests/scripts/test_stage_workspace_vcs_provenance.py -q -k derived_version fails at the base commit and passes at the head'
      - id: AC2
        statement: 'AC2: a package that takes its version from git, built from a copy with no git history, builds under the name the Dockerfile exports and fails under the per-package name -- falsifier: the integration test test_stage_derived_version_dockerfile_variable_builds_a_git_less_hatch_vcs_package fails at the base commit'
      - id: AC3
        statement: 'AC3: integrated: after this merges, the deploy agent''s next job passes its runtime image build phase and omninode-runtime on the first PC reports build provenance newer than the 07:06:34Z build and a healthy state -- falsifier: the job ends failed with runtime_image_build_errored, or the runtime provenance stays at the 07:06:34Z build'
evidence_requirements:
  - kind: tests
    description: The Dockerfile variable tests pass at the pushed head and fail at the base commit.
    command: uv run pytest tests/scripts/test_stage_workspace_vcs_provenance.py -q -k derived_version
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24014-ac1
    description: 'AC1: the Dockerfile exports the generic pretend-version variable before the core install'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_stage_workspace_vcs_provenance.py -q -k derived_version
        cwd: .
  - id: dod-omn24014-ac2
    description: 'AC2: a git-less hatch-vcs package builds under the Dockerfile variable and fails under the per-package form'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_stage_workspace_vcs_provenance.py -q -k derived_version_dockerfile_variable_builds
        cwd: .
  - id: dod-omn24014-ac3
    description: 'AC3: integrated: the real build of a git-less hatch-vcs package passes under the exported variable (the hosted-runner proof); the runtime reading follows the merge'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_stage_workspace_vcs_provenance.py -q -k derived_version_dockerfile_variable_builds
        cwd: .
  - id: dod-omn24014-ac3-integration-proof
    description: 'Run the git-less build test on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24014 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/scripts/test_stage_workspace_vcs_provenance.py -q -n 0 --no-cov -k derived_version
