schema_version: "1.0.0"
ticket_id: OMN-25660
title: Repo Evidence Gate caller runs on pull_request
summary: The caller uses pull_request with the existing activity types, target branches and required context.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25660-caller-trigger
    statement: Run the Repo Evidence Gate on pull_request and cover the caller and its verdict with focused tests.
    acceptance:
      - id: AC1
        statement: >-
          AC1: omnibase_infra's call-repo-evidence-gate.yml on its default branch triggers on pull_request with the same types and branches, keeps job id repo-evidence so the context name repo-evidence / dod-verify is unchanged, and no longer names pull_request_target -- falsifier: git grep -c pull_request_target origin/dev -- .github/workflows/call-repo-evidence-gate.yml returns 0 in omnibase_infra
      - id: AC2
        statement: >-
          AC2: the tests that pin the old trigger in omnibase_infra are rewritten to pin the new one with the same strictness, fail on the old workflow and pass on the new one -- falsifier: the repository's caller-trigger test run with pytest red on the base workflow and green on the head, receipt in the PR body
evidence_requirements:
  - kind: tests
    description: The workflow shape, routing audit and CI Summary's verdict are covered by focused tests.
    command: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow_omn20073.py tests/ci/test_repo_evidence_dod_verify_required_omn20074.py tests/ci/test_runner_routing_audit.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25660-caller-trigger
    description: The tracked caller declares pull_request and has zero occurrences of the old trigger.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: >-
          bash -c 'git grep -c pull_request_target -- .github/workflows/call-repo-evidence-gate.yml; test "$?" -eq 1 && git grep -q "^  pull_request:$" -- .github/workflows/call-repo-evidence-gate.yml'
        cwd: .
  - id: dod-omn25660-caller-tests
    description: The caller contract, unconditional trigger ban and required PR verdict tests pass.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow_omn20073.py tests/ci/test_repo_evidence_dod_verify_required_omn20074.py tests/ci/test_runner_routing_audit.py -q --no-cov
        cwd: .
