schema_version: 1.0.0
ticket_id: OMN-20079
title: Both contract hot-load paths are off unless the runtime config opts in
summary: 'This contract covers two halves of the interim hot-load gate (plan task H0). The runtime half: the listener on the node-registration topic and the baseline subscription on the contract-registered topic start only when the runtime config carries contract_hotload.enabled with a mode and a non-empty allowed_environments list; the switch on in an environment that list does not name (or with ONEX_ENVIRONMENT unset) is a boot error before architecture validation and the event bus start, and a malformed block is a boot error. The guard is a declared allowlist read from the runtime config or overlay, so it fails closed and the code holds no environment names. The runtime-boot half: the catalog-local step "Runtime dynamic contract listener has a live consumer group" read a group that no longer exists once the default turned the listener off, and the merge queue ejected the pull request that turned it off; the step now reads the opt-in from the runtime config in the running kernel''s container, asserts the live group when it is on, and fails an unreadable or malformed opt-in. It does not claim the deploy-repository policy test, the production promotion or the production listener log readback; those are the ticket''s own AC3 and AC4.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-hotload-gate-default-off
    statement: The runtime starts no contract hot-load subscription unless the runtime config opts in.
    acceptance:
      - id: AC1
        statement: With no contract_hotload block, with enabled false, and with enabled false plus a mode, a real host with handler_source.mode kafka_events and profile main subscribes to neither node-registration.v1 nor contract-registered.v1, and a generation-consumer registration plus two boot announcements (one parseable handler-shell contract, one ordinary node contract) materialize nothing.
      - id: AC2
        statement: With enabled true and a mode, the same host subscribes to both topics and the two handler-shell payloads each materialize, so the zero in AC1 is the gate's doing.
  - id: req-hotload-gate-environment
    statement: The switch on in an environment the declared allowlist does not name, or in an unset environment, or a malformed block, fails the boot.
    acceptance:
      - id: AC3
        statement: With enabled true and ONEX_ENVIRONMENT or the event bus environment set to prod-eu, onex-production or onex-prod (none on the allowlist), or ONEX_ENVIRONMENT unset, start raises ProtocolConfigurationError before architecture validation and the event bus start; an environment the allowlist names (the lab environment) passes; with the switch off the same environments boot.
      - id: AC4
        statement: A contract_hotload block that is not a mapping, that enables without a mode, that names an unknown mode or that carries an unknown field raises ProtocolConfigurationError.
  - id: req-listener-step-follows-the-opt-in
    statement: The catalog-local listener step asserts a live consumer group when the runtime config opts in, and does not when it does not.
    acceptance:
      - id: AC5
        statement: With the opt-in on and no group on the broker, or a group with no member, the step exits 1 with "no live dynamic-contract-listener consumer group"; with the opt-in on and a live group it passes.
      - id: AC6
        statement: With the opt-in absent or false and no group on the broker the step passes and names why; the same broker fixture with the opt-in on fails.
      - id: AC7
        statement: An opt-in that is not a boolean, a block that is not a mapping, or a runtime config the container cannot read fails the step and is never read as off.
evidence_requirements:
  - kind: tests
    description: Unit tests drive the real RuntimeHostProcess with a recording in-memory bus and a counting materializer; the pre-image runtime_host_process.py fails the gate-off tests.
    command: uv run pytest tests/unit/runtime/test_contract_hotload_interim_gate.py tests/unit/runtime/test_runtime_host_dynamic_registration.py tests/integration/test_runtime_host_dynamic_registration.py -q -p no:randomly
  - kind: tests
    description: The step's own run text executes against a stub broker and a config directory laid out as the kernel container has it.
    command: uv run --frozen pytest tests/ci/test_runtime_boot_catalog_local_probe_omn19496.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-hotload-gate-default-off-ac1
    description: The gate-off tests publish the three planted payloads through a started in-memory bus and count zero subscriptions and zero materializations for three off shapes.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_contract_hotload_interim_gate.py -q -p no:randomly -k TestDisabledByDefault
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-hotload-gate-control-ac2
    description: The control test enables the switch and requires both subscriptions and two materializations of the same fixtures.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_contract_hotload_interim_gate.py -q -p no:randomly -k TestControlGateOnMaterializes
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-hotload-gate-environment-ac3-ac4
    description: The allowlist check refuses unlisted production-like names and an unset environment, start refuses before validation and the bus starts, the lab environment passes, and each malformed block (including a missing or blank allowlist) is refused.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_contract_hotload_interim_gate.py -q -p no:randomly -k "TestGateResolution or TestModelContractHotloadConfig"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
      - AC4
  - id: dod-hotload-gate-merged-source
    description: Hermetic deployed-source readback of the runtime host at the evaluated commit; it requires the standalone start-time gate resolution and at least the two subscription call sites that test the gate's enabled flag, all absent at the merge base.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: bash -o pipefail -c 'src=$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/runtime_host_process.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d); test "$(printf %s "$src" | grep -cF "_resolve_contract_hotload_gate().enabled")" -ge 2 && printf %s "$src" | grep -E "^ +self\._resolve_contract_hotload_gate\(\)$" >/dev/null'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-listener-step-enabled-ac5
    description: With the opt-in on the step fails on no group and on a memberless group and passes on a live group, in the recorded real-broker replay as well.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_runtime_boot_catalog_local_probe_omn19496.py -q -n 0 --no-cov -p no:randomly -k "names_the_opt_in or live_group or no_group_owns or no_member or recorded_real_broker"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-listener-step-off-ac6
    description: With the opt-in absent or false and no group the step passes, and the same fixture with the opt-in on fails (the negative control).
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_runtime_boot_catalog_local_probe_omn19496.py -q -n 0 --no-cov -p no:randomly -k "does_not_opt_in or explicit_off_switch or red_once_the_runtime_config_opts_in"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC6
  - id: dod-listener-step-unreadable-ac7
    description: Each malformed opt-in and a missing runtime config fail the step.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_runtime_boot_catalog_local_probe_omn19496.py -q -n 0 --no-cov -p no:randomly -k "malformed_opt_in or runtime_config_is_unreadable"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC7
