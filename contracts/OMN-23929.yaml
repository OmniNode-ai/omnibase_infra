schema_version: "1.0.0"
ticket_id: "OMN-23929"
title: "The runtime hands the tenant read bus handlers their credential lookup"
summary: >
  The runtime kernel builds the omnimarket tenant savings and tenant delegations bus handlers with no constructor arguments, so each is built with no projection reader and answers not_configured at the top of every read. The kernel now builds a SecretResolver from the lane's rendered resolver config and hands it to both handlers as the secret_resolver argument, only on a lane whose config maps the logical name omnidash.analytics.db_url (config.analytics_dsn_secret of the two node contracts). A lane that maps nothing leaves both handlers unconfigured, which is the fail-closed state they answer today. The change follows the existing webhook ingress wiring in the same function. Each half is valid alone: the handlers in omnimarket take the new argument as optional.

is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn23929-tenant-read-resolver"
    statement: "The kernel gives HandlerTenantSavingsReadBus and HandlerTenantDelegationsReadBus a secret_resolver exactly when the lane's resolver config maps omnidash.analytics.db_url."
    acceptance:
      - id: "AC1"
        statement: "AC1: the runtime builds the tenant savings bus handler and the tenant delegations bus handler with a secret resolver when the lane maps the analytics database secret -- falsifier: uv run pytest tests/unit/runtime/test_tenant_read_bus_dependency_omn23929.py -q fails with KeyError on the dev profile when the kernel call is removed"
      - id: "AC2"
        statement: "AC2: each bus handler builds its projection reader from the resolver it is given, and answers a typed not_configured failure when it is given none -- falsifier: the omnimarket tests for the two bus handlers, delivered by the companion change in omnimarket"
      - id: "AC3"
        statement: "AC3: integrated: with both changes running in the dev runtime, the R8 unit on h053 reads the totals before the run and last-run.json shows no totals_read_before failure -- falsifier: last-run.json still reads not_configured after the runtime image revision includes both changes"
evidence_requirements:
  - kind: "tests"
    description: "The kernel dependency tests, and the existing webhook ingress dependency tests that share the builder."
    command: "uv run pytest tests/unit/runtime/test_tenant_read_bus_dependency_omn23929.py tests/unit/runtime/test_github_webhook_ingress_dependency_omn19492.py -q -p no:cacheprovider"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23929-kernel-tests"
    description: "The kernel hands both handlers a SecretResolver on the dev profile, hands them none on every profile that does not map the name, and logs why. With the kernel call removed the dev profile test fails with KeyError. AC2 is delivered by the companion change in omnimarket and AC3 is read live by the item below, which only the local Done gate runs; both are bound here as the other contracts bind a live criterion to the item that proves its mechanism."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/runtime/test_tenant_read_bus_dependency_omn23929.py tests/unit/runtime/test_github_webhook_ingress_dependency_omn19492.py -q -p no:cacheprovider"
        cwd: "."
  - id: "dod-omn23929-live-r8-proof"
    description: "After the dev runtime rebuilds from both changes, the R8 unit on h053 has run and last-run.json holds no totals_read_before failure. It needs the lab and the runtime rebuild, so only the local Done gate runs it."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "bash -c 'ssh h053 \"cat .local/state/omni/delegation-scenario-r8/last-run.json\" | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(1 if \\\"totals before\\\" in json.dumps(d) else 0)\"'"
        cwd: "."
