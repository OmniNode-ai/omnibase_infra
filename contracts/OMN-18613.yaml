schema_version: 1.0.0
ticket_id: OMN-18613
title: Deploy agent loses a rebuild command that shares a Kafka poll batch with an accepted one
summary: A bare commit() on the deploy agent's accept path committed the consumer position, past records still buffered behind the accepted one, so a post_terminal re-exec lost offset 263 behind accepted offset 262. omnibase_infra#3707 bounds every offset commit to the record it processed. This contract records the acceptance-criterion bindings a second lane accepted.
