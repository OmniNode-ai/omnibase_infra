schema_version: 1.0.0
ticket_id: OMN-25169
title: Review findings 1 to 7 on the OMN-25106 pull request are fixed or argued - the wedged restore replaces a running container and backs off, the DLQ close is bounded and drained, the contract binds AC2 to a reading
summary: >-
  The review of the OMN-25106 pull request at head 40212c10a0b6 asked for seven changes. The deploy agent's idle restore rebuilt a running unhealthy dev runtime with a rolling compose up that recreates only a service whose configuration or image moved, and the post-deploy verify declines to recreate a runtime that still answers /health degraded, so the agent looped; the roll step in the boot guard handler now restarts a container whose state is running and whose health probe failed 20 times in a row before compose waits on it, and RESTORE_RETRY_AFTER backs off a repeat wedge. The agent's read_lane_presence delegates to the handler, whose only caller outside tests is that agent function. DLQConsumer's detached member close is bounded by the engine config's member_close_timeout_seconds, logs a failed close from its done callback, and drain_member_closes waits for the closes in flight; the two untested branches have tests. The shutdown drain is not wired into the kernel's shutdown path: the canonical-file-shape and node-boundary gates refuse that edit. contracts/OMN-25106.yaml binds AC2 to a /ready read that compares the code to 200 and to a runtime boot-line read, binds the unit tests to AC3, and lists the agent restore test with its --project command. The pull request title and body describe both changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25169-review-findings
    statement: The blocking review findings on the OMN-25106 pull request are fixed, each by a change with a test that fails before it, or argued in a pull request comment.
    acceptance:
      - id: AC1
        statement: "AC1: the idle restore of a running unhealthy container recreates or restarts it and backs off on a repeat wedge, and read_lane_presence in the deploy agent delegates to the handler with every other caller of the handler function read -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_wedged_restore_omn25106.py -q fails on the head 40212c10a0b6 code and passes at the new head"
      - id: AC2
        statement: "AC2: engine_dlq_replay.py has a start-start-stop test asserting both fakes stopped, a test per arm of the CancelledError absorb and re-raise, and a bounded close with failure logging and a shutdown drain of _MEMBER_CLOSES, each test red before the change and green after -- falsifier: uv run pytest tests/unit -k dlq_consumer -q at the new head, with each new test shown red on the old code"
      - id: AC3
        statement: "AC3: the OMN-25106 contract binds AC2 to a check that reads the h201 node run line, the curl check cannot pass on any code under 400, and the description's agent restore test is in the command via --project scripts/deploy-agent -- falsifier: uv run pytest tests/ci -k contract -q plus a contract check that goes red when the node run line grep target is removed"
      - id: AC4
        statement: "AC4: the PR title and body describe the DLQ change or the PR is rebased onto omnibase_infra PR 6046, and the body carries a Lab: line -- falsifier: onex scm pr-view OmniNode-ai/omnibase_infra#6045 shows the head sha and a comment starting Lab: head=<full head sha>"
      - id: AC5
        statement: "AC5: each of the seven blocking findings is fixed or argued with evidence in a PR comment, and the required suites ran on the lab (in parts if a whole-suite run timed out, with the parts named) -- falsifier: onex scm pr-view OmniNode-ai/omnibase_infra#6045 lists a comment per finding at the new head"
evidence_requirements:
  - kind: tests
    description: The deploy agent's wedged restore test.
    command: uv run --project scripts/deploy-agent --extra dev --frozen pytest scripts/deploy-agent/tests/unit/test_wedged_restore_omn25106.py -q -p no:cacheprovider
  - kind: tests
    description: The DLQ consumer tests and the contract binding test.
    command: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect tests/ci/test_contract_omn25106_binding.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25169-ac1-wedged-restore
    description: >-
      The agent restore test restarts a running wedged container before the rebuild, leaves a paused or restarting container with a failing streak alone, backs off for RESTORE_RETRY_AFTER on a repeat wedge, and reads the presence through the handler. The file fails on the head 40212c10a0b6, where the roll has no restart and a paused unhealthy container reads down.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev --frozen pytest scripts/deploy-agent/tests/unit/test_wedged_restore_omn25106.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_dev_boot_guard_wedged_presence_omn25106.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25169-ac2-dlq-close
    description: >-
      The DLQ consumer tests assert the start-start-stop pair of members both stopped, each arm of the CancelledError absorb and re-raise, the bounded close, the logged close failure and the shutdown drain, awaiting the engine's own close tasks instead of sleeping.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect -k dlq_consumer -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25169-ac3-contract-binding
    description: >-
      The OMN-25106 contract binds AC2 to a /ready read that compares the code to 200 and a runtime boot-line read, the boot line is still logged by the kernel, and the agent restore test with its --project command is listed.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_contract_omn25106_binding.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25169-ac4-pr-describes-both
    description: >-
      The pull request title names both the wedged restore and the DLQ consumer change. The Lab comment naming the pushed head is posted on the pull request after the push.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: onex scm pr-view OmniNode-ai/omnibase_infra#6045 | grep -ci 'wedged'
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25169-ac5-suites
    description: >-
      The suites the pull request touches pass on a lab host: the DLQ replay node tests, the boot guard handler tests and the CI contract tests.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_dlq_replay_effect tests/unit/handlers/test_handler_dev_boot_guard_wedged_presence_omn25106.py tests/ci/test_contract_omn25106_binding.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25169-deploy
    description: Hosted-runner probe that reads the committed boot guard handler from GitHub at the checked-out commit and requires the wedged restart and its call in the restore's roll step. The live read on the h201 dev agent follows an install of this branch.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_dev_boot_guard.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; src = sys.stdin.read(); assert "def restart_if_wedged" in src; assert "restart_if_wedged(" in src.split("def run_runtime_roll_step")[1]'
        cwd: ${OMNI_HOME}/omnibase_infra
