schema_version: "1.0.0"
ticket_id: OMN-19991
title: Infra vendoring of the local_alerts node migrations
summary: >-
  Infra half only: vendors omnimarket node migrations 0000-0002 of node_projection_local_alerts byte for byte, with their ledger rows and classes, fences the FORCE step, and carries an interim grant declaration until omnimarket's node contract declares the relation. The fold, the writer and the page are the omnimarket and omnidash halves. This check proves deployment identity, not acceptance of the criterion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19991-ac1-infra-vendor
    statement: >-
      Migrations 0000-0002 of node_projection_local_alerts are deployed byte-identical to the omnimarket source they were copied from, each with one checksum-bound ledger row and the class the migration class checker reads from its statements, only the FORCE step is fenced, and an interim grant declaration names the vendored create.
    acceptance:
      - id: AC1
        statement: "AC1: Replaying the same input events produces the same alert rows (deterministic transition ids, UPSERT) -- falsifier: a replay test over a recorded hour run with uv run pytest finds a changed row"
  - id: req-omn19991-ac2-omnidash-pin-sees-the-reader
    statement: >-
      The omnidash sibling pin carries a commit whose page documents declare a reader for onex.snapshot.projection.local-alerts.v1, so exposure-reader-coverage reads the reader omnidash#498 wrote instead of the surface at the OMN-20331 pin of 2026-10-02, and the sha is the same in the pins file and in every inline omnidash checkout ref.
    acceptance:
      - id: AC2
        statement: "AC2: the omnidash sibling pin and every inline omnidash checkout ref carry 495717931612719c29d22cce5578a53e93441462 -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnidash_sibling_pin_advance_omn19991.py tests/ci/test_sibling_reads_pinned_omn20331.py -q"
evidence_requirements:
  - kind: tests
    description: Infra deployment half only; the vendored bytes, ledger checksums, classes, fence and interim declaration match the pinned omnimarket source.
    command: uv run pytest tests/unit/migrations/test_omn19986_omn19991_local_identity_alerts_vendor.py -q
  - kind: tests
    description: The omnidash sibling pin and every inline omnidash checkout ref carry 495717931612719c29d22cce5578a53e93441462.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnidash_sibling_pin_advance_omn19991.py tests/ci/test_sibling_reads_pinned_omn20331.py -q"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19991-ac1-infra-vendor-0000-0002
    description: Infra half only. Pins the source bytes of node_projection_local_alerts 0000-0002, their exact ledger checksums and classes, that only 0002 (FORCE ROW LEVEL SECURITY) is fenced, and the interim grant declaration. It fails at the merge base, where none of them exist. It does not prove the fold, the writer or the page.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn19986_omn19991_local_identity_alerts_vendor.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn19991-ac2-omnidash-pin-42e51834d000
    description: The omnidash sibling pin and every inline omnidash checkout ref carry 495717931612719c29d22cce5578a53e93441462, the commit whose Overview reads delegation.daily.v1 (OMN-21970), the reader the omnimarket pin's projection exposure needs. It does not prove the reader renders; that is omnidash's own contract.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnidash_sibling_pin_advance_omn19991.py tests/ci/test_sibling_reads_pinned_omn20331.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
