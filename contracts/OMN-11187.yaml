# OMN-11187 contract file for omnibase_infra.
schema_version: "1.0.0"
ticket_id: OMN-11187
title: "Emit terminal event from projection reducer after successful DB write"
summary: "Projection reducer emits a terminal event on onex.evt.omnimarket.projection-delegation-applied.v1 after a delegation event is written to the projection DB. The production emission merged earlier; this change makes the live terminal readback select the requested delegation's terminal record and refuse to substitute an unrelated newer one."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn11187
    statement: "After a successful projection write the reducer publishes a terminal event on the projection-delegation-applied topic, and a readback of that topic proves the terminal for the delegation it was asked about."
    acceptance:
      - id: AC1
        statement: "AC1: the projection reducer emits the terminal event on onex.evt.omnimarket.projection-delegation-applied.v1 after a successful DB write, none after a failed write, and the readback of that topic names the requested delegation's terminal rather than an unrelated newer record -- falsifier: a readback given a correlation id returns another delegation's terminal, or the emission tests fail"
evidence_requirements:
  - kind: tests
    description: "The readback selector returns the requested correlation's terminal and refuses when only an unrelated terminal exists; the in-process emission tests cover a terminal after a successful write and none after a failed write or with no event bus."
    command: "uv run pytest tests/integration/projectors/test_projection_terminal_event_emission.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn-11187-readback-selects-requested-terminal
    description: "The readback selector picks the requested delegation's terminal over a newer unrelated partition and refuses when only the unrelated terminal exists."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/integration/projectors/test_projection_terminal_event_emission.py -q -k readback_does_not_substitute_an_unrelated_terminal"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-11187-terminal-emission
    description: "In-process emission coverage: a terminal after a successful projection write, none after a write-path failure or without an event bus, and a content failure still quarantines."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/integration/projectors/test_projection_terminal_event_emission.py -q -k 'not readback_does_not_substitute_an_unrelated_terminal'"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
