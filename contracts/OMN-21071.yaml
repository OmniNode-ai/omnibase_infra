schema_version: "1.0.0"
ticket_id: OMN-21071
title: "Merge sweep into nodes WU7: one onex node call runs a whole bus-hop sweep to its terminal (falsify first)"
summary: The premise that RuntimeLocal, given an orchestrator contract, hosts the nodes its workflow_coordination.execution_graph names was false on dev at 1fc82aec7. RuntimeLocal hosts only the selected contract's handler_routing, so one `onex node <orchestrator> --input <file> --timeout <n>` call left every bus-hop stage command unanswered (the new CLI test's terminal read stage-terminal-missing:alpha,beta). `onex node`, in its default and receipt forms, now runs the contract on ExecutionGraphHostingRuntime, which resolves each execution-graph stage node through the CLI's registry and hosts that stage contract's routing on the run's in-memory bus before the orchestrator publishes, as `onex node <stage>` would host it. A stage with no bus surface is skipped by name, and a stage the registry cannot resolve fails the run before anything is published, naming the stage.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21071-hosting
    statement: One `onex node <orchestrator>` call on the in-memory bus hosts the stage nodes its execution graph names, so a bus-hop workflow reaches its own terminal with no consumer supplied by hand.
    acceptance:
      - id: AC1
        statement: 'AC1: a test orchestrator with two stage nodes in its execution graph, invoked through the CLI with --timeout 900, receives both correlated stage terminals and exits with its own terminal; an uncorrelated terminal is ignored, and a stage terminal that never arrives is a typed failure before the timeout -- falsifier: the new CLI test fails with the execution-graph hosting removed'
evidence_requirements:
  - kind: tests
    description: The caller's exact command shape, run through the CLI on the in-memory bus against stand-in orchestrators and stages advertised through the registry seam.
    command: uv run --frozen pytest tests/unit/cli/test_cli_node_execution_graph.py -q -p no:randomly -n 0 --no-cov -x
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21071-ac1
    description: Both correlated stage terminals reach the orchestrator through one CLI call with --timeout 900, an uncorrelated stage terminal is ignored, a stage terminal that never arrives is a typed failure well before the timeout, and the receipt form hosts the same stages; every case fails on dev without the hosting.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/cli/test_cli_node_execution_graph.py -q -p no:randomly -n 0 --no-cov -x
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn21071-deploy
    description: Post-merge deploy smoke -- the deployed runtime image imports the execution-graph hosting runtime that `onex node` now runs a contract on.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c \"from omnibase_infra.cli.receipt_mode import ExecutionGraphHostingRuntime; print('deploy smoke ok', ExecutionGraphHostingRuntime.__name__)\""
        cwd: ${OMNI_HOME}/omnibase_infra
