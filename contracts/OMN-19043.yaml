schema_version: "1.0.0"
ticket_id: "OMN-19043"
title: "A transport-class dispatch failure emits no typed terminal, so the caller gets an exception instead of a receipt"
summary: >-
  Coverage-only evidence for the merged fix (omnibase_infra#3934, 3d7c41f6). A delegate dispatch that cannot reach the broker writes a run directory whose receipt.json carries a typed transport refusal. Both Kafka connect surfaces retry with bounded backoff from one declared policy, and an unreachable broker is refused typed and inside the bound. Every bound check fails with the fix's source absent (its parent commit).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19043-typed-transport-terminal"
    statement: "A dispatch that never reaches the broker leaves a typed transport-class receipt on disk."
    acceptance:
      - id: "AC1"
        statement: >-
          AC-1: A dispatch that cannot reach the broker writes a run directory with a `receipt.json` carrying a typed transport-class terminal cause, distinguishable from "still running" and from a model-quality failure.
  - id: "req-omn19043-bounded-connect-retry"
    statement: "Both producer connect paths retry with bounded backoff from one declaration and fail fast when unreachable."
    acceptance:
      - id: "AC2"
        statement: >-
          AC-2: The producer connect path retries with bounded backoff across a stall at least as long as the measured 17.2 seconds, or refuses with a typed cause naming the deadline it exceeded.
      - id: "AC3"
        statement: >-
          AC-3: Retry, backoff and circuit-breaker settings for the DI producer surface and the event-bus producer surface resolve from one declaration so they cannot drift.
      - id: "AC4"
        statement: >-
          AC-4: A negative control proves the path still fails fast and typed against a genuinely unreachable broker.
evidence_requirements:
  - kind: "tests"
    description: "Transport terminal and connect retry tests pass"
    command: >-
      uv run pytest -q --no-cov tests/unit/cli/test_delegate_transport_terminal_omn18925.py tests/unit/event_bus/test_kafka_connect_retry_omn18925.py tests/unit/event_bus/test_connect_retry_one_declaration_omn19043.py
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19043-ac1-transport-receipt-on-disk"
    description: >-
      A transport-class receipt is written through the CLI run writer: receipt.json, run.json and result.txt exist, the cause names the transport (not a provider), and the record is distinguishable from a running and from a quality failure. A non-transport unresolvable terminal still raises. Fails at the fix's parent, which has no transport refusal model.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest -q --no-cov tests/unit/cli/test_delegate_transport_terminal_omn18925.py -k "TestTransportFailureWritesTypedTerminal or TestRefusalModelRefusesAnUntruthfulRecord"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn19043-ac2-connect-survives-a-stall"
    description: >-
      Both connect surfaces (ProviderKafkaProducer and EventBusKafka.start) connect on the second attempt after a first attempt outruns its deadline, and the default bound exceeds the measured 17.222 s stall. Exhaustion re-raises the original typed exception. Fails at the fix's parent, where connect was single-shot.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest -q --no-cov tests/unit/event_bus/test_kafka_connect_retry_omn18925.py -k "TestConnectRetriesAcrossAStall or survives_the_measured_stall or TestRetryHelperBoundaries"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn19043-ac3-one-retry-declaration"
    description: >-
      One KAFKA_MAX_RETRY_ATTEMPTS value drives both surfaces: against a broker that never answers, the DI producer and the event bus each make exactly 1 + the declared retries, and the policy model resolves the same dials for both. The circuit breaker counts one failure per exhausted start. At the fix's parent both surfaces make one attempt, so the new test fails.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest -q --no-cov tests/unit/event_bus/test_connect_retry_one_declaration_omn19043.py"
        cwd: "${OMNI_HOME}/omnibase_infra"
      - check_type: "test_passes"
        check_value: >-
          uv run pytest -q --no-cov tests/unit/event_bus/test_kafka_connect_retry_omn18925.py -k "TestBothSurfacesResolveOneRetryDeclaration or TestCircuitBreakerCountsStartsNotAttempts"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-omn19043-ac4-unreachable-broker-fails-fast"
    description: >-
      Against a real closed TCP port, EventBusKafka.start and ProviderKafkaProducer.create refuse with a typed error well inside the policy bound, and a locus-probe refusal still writes its receipt. A permanent (auth) failure is not retried. Fails at the fix's parent, which has neither the policy nor the refusal writer.
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest -q --no-cov tests/unit/event_bus/test_kafka_connect_retry_omn18925.py tests/unit/cli/test_delegate_transport_terminal_omn18925.py -k "TestUnreachableBrokerFailsFastAndTyped or TestAPermanentFailureIsNotRetried"
        cwd: "${OMNI_HOME}/omnibase_infra"
