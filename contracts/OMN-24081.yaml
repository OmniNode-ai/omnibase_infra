        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_dev_refresh_llm_endpoint_env_omn24081.py -q -p no:randomly --no-cov -k "scripts_own_python"
        cwd: .
  - id: dod-omn24081-ac3-integration-proof
    description: 'AC3 integrated reading: the running dev runtime carries the overlay address in LLM_EMBEDDING_URL after it rebuilds from the merge, and an embedding call from inside it returns 1024 numbers. Only the local Done gate runs this unbound check; it needs the dev host.'
    source: manual
