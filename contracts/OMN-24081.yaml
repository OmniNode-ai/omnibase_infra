    checks:
      - check_type: command
        check_value: uv run pytest tests/integration/scripts/test_refresh_dev_lane_overlay_embedding_omn24081.py -q -p no:randomly --no-cov -k "golden"
        cwd: .
  - id: dod-omn24081-ac2-script
    description: 'AC2: the real refresh script exits 64 with a named refusal when the overlay cannot be read or lacks the embedding slot'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: uv run pytest tests/integration/scripts/test_refresh_dev_lane_overlay_embedding_omn24081.py -q -p no:randomly --no-cov -k "error"
        cwd: .
  - id: dod-omn24081-ac3
