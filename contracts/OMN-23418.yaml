schema_version: 1.0.0
ticket_id: OMN-23418
title: The hourly message-bus health check tells a slow reply apart from no reply, and names where the delay is
summary: The developer principal wire bindings (deploy/lab/developer-principal-bindings.yaml) declare READ on the work-ledger query command topic for the query client's group prefix, so the seam deadline probe's login can read when a request reached the broker. DESCRIBE and WRITE were already granted on that topic. The derived grants file is regenerated from the derivation node, never typed, and gains exactly one row. The grants take effect on the dev broker when the issuer's apply-grants runs the derived file; that step needs the operator's broker admin credential and is recorded in the pull request, not claimed here.
