schema_version: "1.0.0"
ticket_id: OMN-19558
title: A delegate-skill command whose terminal never arrives is not dead-lettered and replayed as a new command
summary: The delegation dispatch port supplies the typed timeout cause when the Pattern B broker reports a timeout without one, so the consumer converts it into one typed timeout terminal instead of a provider_error. Supplied causes and other statuses are unchanged. AC1 and AC2 shipped in omnibase_infra#4289 and are not claimed here; the in-process part of AC3 shipped in omnibase_infra#4789. This change records the live dev-lane readback of AC3 (one delegate-skill-failed record and one delegation-request record for a command that outran its budget); the endpoint was not held, and the record says so.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19558
    statement: A delegate-skill command that waits past its budget yields one typed timeout terminal, and a dead-lettered replay is the same delivery rather than a new command.
    acceptance:
      - id: AC3
        statement: 'AC3: a delegate-skill command whose terminal never arrives yields exactly one typed timeout terminal and no replayed re-dispatch -- falsifier: onex delegate against a lab stack with the model endpoint held open past the budget, then count delegate-skill-failed and delegation-request records for the correlation with rpk topic consume'
evidence_requirements:
  - kind: tests
    description: The real Pattern B broker over an in-memory bus, with no terminal reply, publishes one command and returns one timeout result carrying the typed timeout cause; the port types a timeout that has no recorded cause.
    command: uv run pytest tests/integration/delegation/test_omn19558_broker_timeout_cause.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-19558-ac3-typed-timeout
    description: In-process evidence for AC3. With no terminal reply the real broker publishes one command and returns one timeout result whose terminal_failure_cause is timeout, and the port supplies that cause only when the result has none. The live held-model rpk count named in AC3's falsifier is pending and not claimed here.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/delegation/test_omn19558_broker_timeout_cause.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_service_delegation_dispatch_port.py -q -k timeout_without_recorded_cause_is_typed
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-19558-ac3-live-readback
    description: >-
      Live readback for AC3, lab dev lane, 2026-10-14, lane rem-19558, counted with rpk topic consume over the delegation topics for one correlation. Command: onex delegate with a long essay prompt, --task-type reasoning, --timeout 1, --bus kafka --lane dev --locus deployed-lane; run b5a8b3c6-634a-4f98-813b-7ade374de0f9, correlation c2ad6729-d2b6-4d5d-b71f-d2e5de023453, CLI exit 1 with cause timeout. Record: delegate_skill_command_records=1 delegation_request_records=1 delegate_skill_failed_records=1 delegate_skill_completed_records=0 terminal_failure_cause=timeout; the three request-side counts stayed at 1 across three reads in the 3 minutes after the run, and none of the first 20 DLQ topics held the correlation. Control: a short prompt on the same lane (run 3ac66bec-024b-47cd-ac67-aa51c33f9d8a) completed with 1 command, 1 delegation-request, 0 delegate-skill-failed and 1 delegate-skill-completed record. Limits: the model endpoint was not held open, because a pre-PR slot was not brought up (lab Docker host load 43.31 over 32 cores against a floor of 1.0 per core); the failed terminal came from the consumer's handler-budget cancel (OMN-15504), not from the dispatch port supplying the cause, which stays covered by the in-process test above.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          grep -q 'Record: delegate_skill_command_records=[1] delegation_request_records=[1] delegate_skill_failed_records=[1] delegate_skill_completed_records=[0] terminal_failure_cause=timeout' contracts/OMN-19558.yaml &&
          uv run pytest tests/unit/infra/test_omn19558_consume_deadline_covers_delegate_skill_budget.py tests/integration/event_bus/test_omn19558_dlq_replay_identity_roundtrip.py tests/unit/event_bus/test_kafka_subscribe_fetch_position_ready.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-19558-ac3-live-readback-full-budget
    description: >-
      Second live readback for AC3, lab dev lane, 2026-10-19, lane deleg-omn-19558-1005, counted with rpk topic consume (last 400 records per partition of the delegate-skill command, delegation-request, delegate-skill-failed and delegate-skill-completed topics, plus all 106 onex.dlq topics) on the dev Redpanda container, read at 05:21:59Z host time. Two commands from another lane (caller_lane worktree-triage, correlations d4f974e5-bf6b-43ae-98f0-5adda158fe63 and bc1bd174-f492-4543-aee0-dd3a2e7894fb), both published at 05:07:14Z, were left without a terminal because the dev runtime had restarted at 05:00Z and the delegation-request consumer group of node_delegation_orchestrator was not bound (onex delegate from this lane refused twice with the rebind-window probe, runs 2a639a2a-fc80-4279-9e63-fb6bb2e3b03f and 237b3549-f031-4b53-974d-c1a2eef82085, so the commands were not injected by this lane). Record, per correlation: delegate_skill_command_records=1 delegation_request_records=1 delegate_skill_failed_records=1 delegate_skill_completed_records=0 terminal_failure_cause=timeout. The failed terminals were published at 05:12:32Z and 05:12:38Z (318 s and 324 s after the commands), carrying the handler execution budget of 240s. The runtime-effects health read at the same time reported dispatch_deadline deadline_seconds 600.0, deadline_expiries_total 0 and orphaned_dispatches 0, and the counts above were unchanged 4 minutes 45 seconds after the 600 s deadline would have expired (05:17:14Z). No DLQ row for either correlation has the delegate-skill or delegation-request topic as its original topic. The only DLQ rows that contain the correlation text are claude-hook-event and session-content projection failures (handlers ClaudeHookEventsProjectionWriter and SessionContentProjectionWriter) that carry the prompt text. Limits: the model endpoint was not held open (the downstream consumer was unbound, so no inference leg ran) and the failed terminal came from the consumer's handler-budget cancel (OMN-15504), not from the dispatch port supplying the cause, which stays covered by the in-process test above; the commands were not issued by this lane, so the exercise is observation of a naturally occurring no-terminal condition, not a held-endpoint injection. In-process coverage uses the real broker and in-memory bus to time out one request, deliver its late success or failure while a second request is waiting, and require one command per correlation, a typed timeout for the first request, the second request's own completion, and cleanup of both terminal subscriptions. This coverage does not claim a held endpoint or a runtime rollout.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          grep -q 'Record, per correlation: delegate_skill_command_records=[1] delegation_request_records=[1] delegate_skill_failed_records=[1] delegate_skill_completed_records=[0] terminal_failure_cause=timeout' contracts/OMN-19558.yaml &&
          uv run pytest tests/integration/delegation/test_omn19558_broker_timeout_cause.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-19558-kafka-subscription-readiness
    description: Merge-queue repair for the AC3 carrier. Kafka subscription waits for the initial fetch positions so an immediate publication cannot be skipped by a late latest-offset reset. Focused regressions cover all assigned positions and timeout or cancellation cleanup. The registration E2E timeout reproduced with a half-second initial-offset delay on an isolated broker and passed with the product fix under the same delay.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/event_bus/test_kafka_subscribe_fetch_position_ready.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-19558-deploy-subscription-readiness
    description: Hosted-runner deploy source probe reads the product module at the pushed head and refuses a version missing the initial fetch-position wait. It does not claim a runtime rollout or the held-model AC3 exercise.
    source: manual
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/event_bus/event_bus_kafka.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F 'await consumer.position(partition)'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-19558-ac1-consume-deadline
    description: AC1 binding (accepted 2026-10-17T0645Z). For every catalog bundle and every consuming runtime service it ships (10 cases, local included; no bundle is skipped by the resolver), the rendered Kafka config gives effective_dispatch_deadline_seconds >= 300, the 240 s handler budget plus the 60 s margin. Against the parent of omnibase_infra#4289 all 10 cases fail with 255.0 >= 300.0.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/infra/test_omn19558_consume_deadline_covers_delegate_skill_budget.py -q -k test_effective_dispatch_deadline_covers_handler_budget_plus_margin
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-19558-ac2-replay-keeps-message-id
    description: AC2 binding (accepted 2026-10-17T0645Z). A delegate-skill command is dead-lettered through the real DLQ writer, read back as a ModelDlqMessage, and replayed by node_dlq_replay_effect's DLQProducer to the command topic with the same body and key; the consumer's header parser reads message_id equal to the original consumer message_id. Against the parent of omnibase_infra#4289 the same test fails.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/event_bus/test_omn19558_dlq_replay_identity_roundtrip.py -q -k test_dead_letter_replay_keeps_the_original_consumer_message_id
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
