schema_version: 1.0.0
ticket_id: OMN-26604
title: The staging Keycloak realm gets the staging redirect URIs from the client roster, so the seed job keeps them
summary: >-
  The staging seed job reconciles docker/keycloak/desired-clients.json on every staging sync and sets each client's redirect URIs and web origins to exactly the roster list, so the staging hosts added by hand with kcadm were wiped. The browser login client, onex-customer and omnidash-spa now declare a staging override with the staging hosts only, and the login client's staging sign-out URI. An override replaces a whole field, so each list is the full staging set and the login client's staging attributes repeat the PKCE method. onex-api keeps its base shape on staging because its only override is prod. The staging overlay in the deployment repository sets KC_ENVIRONMENT=staging in a separate PR.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26604-staging-hosts
    statement: The staging realm's browser clients accept the staging hosts and nothing else.
    acceptance:
      - id: AC1
        statement: "AC1: resolved for staging, the browser login client, onex-customer and omnidash-spa carry the staging redirect URIs, web origins and sign-out URI, and no prod, dev or localhost host"
  - id: req-omn26604-nothing-else-moves
    statement: The override changes only the named fields, and never drops a base attribute.
    acceptance:
      - id: AC2
        statement: "AC2: every attributes override keeps each base attribute key (the login client keeps PKCE S256), and only redirectUris, webOrigins and attributes differ from the base on staging"
  - id: req-omn26604-other-realms
    statement: onex-api, dev and prod are unchanged, and the seeder takes staging as an environment name.
    acceptance:
      - id: AC3
        statement: "AC3: onex-api resolves the same on staging as on dev, the three clients resolve to the base on dev and prod, and --environment staging is accepted"
evidence_requirements:
  - kind: tests
    description: The staging override tests and the existing roster and override tests.
    command: uv run --frozen pytest scripts/tests/test_seed_keycloak_staging_overrides_omn23298.py scripts/tests/test_seed_keycloak_environment_overrides.py tests/unit/scripts/test_desired_clients_introspection_not_bearer_only.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26604-ac1-staging-hosts
    description: "Staging resolves the three browser clients to the staging hosts and sign-out URI, with no prod, dev or localhost host. New test file."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/tests/test_seed_keycloak_staging_overrides_omn23298.py -k "staging_resolves or no_prod_dev_or_localhost" -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26604-ac2-nothing-else-moves
    description: "An attributes override keeps every base key, and only the named fields change on staging."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/tests/test_seed_keycloak_staging_overrides_omn23298.py -k "keeps_every_base_key or only_the_named_fields" -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26604-ac3-other-realms
    description: "onex-api keeps its base shape on staging, dev and prod are unchanged, and the seeder accepts staging."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/tests/test_seed_keycloak_staging_overrides_omn23298.py -k "onex_api_keeps or dev_and_prod_are_unchanged or accepted_as_an_environment" -q --no-cov -n 0 -p no:randomly
        cwd: .
