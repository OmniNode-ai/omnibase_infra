schema_version: 1.0.0
ticket_id: OMN-24127
title: Keep the readable lines of a failed dev update's log, removing only secret values
summary: >-
  Child of OMN-24071. The dev boot guard (merged in omnibase_infra#5919) keeps the last bytes of each not-healthy container's log in a per-incident artifact file. It cleaned the log with sanitize_error_string, which replaces the whole text with a 39-byte notice whenever the text contains any of its sensitive words (token, password, auth, redis:// and others); a real 8 MB boot log was kept as those 39 bytes, so the capture held no cause. The guard now uses redact_credential_spans, new in the guard module: it replaces only credential-shaped spans (the shared credential value shapes, PEM key material, URL userinfo, the value of a key=value pair whose key names a secret) and keeps every other line. The incident record keeps its shape: redacted is true when any span was replaced, complete is false then, and the byte counts and digest describe the kept text.
is_seam_ticket: true
interface_change: false
interfaces_touched:
  - public_api
requirements:
  - id: req-omn24127-span-redaction
    statement: The kept log of a failed dev update keeps its readable lines and loses only credential-shaped spans.
    acceptance:
      - id: AC1
        statement: "AC1: the dev boot guard's kept copy of a failed container's log replaces only credential-shaped spans (a planted fake token, URL credentials, key material) and keeps every other line, with redacted true and complete false in the incident record -- falsifier: a log holding a planted fake token plus ordinary lines is stored as a single short notice, or the surrounding lines are missing from the kept file"
      - id: AC2
        statement: "AC2: a log holding the words token or password with no credential-shaped value is kept whole and reads complete when within the byte cap -- falsifier: such a log is replaced or reads redacted"
      - id: AC3
        statement: "AC3: a planted fake token never appears in the kept file, the incident record or the artifact digest source -- falsifier: the fake token string is found in the kept file"
  - id: req-omn24127-integrated
    statement: The kept log of a failed roll is read as real lines from the running dev deploy agent.
    acceptance:
      - id: AC4
        statement: "AC4: integrated: after the deploy agent with this change runs on the dev runtime, a forced failing roll on a scratch state keeps a log with real lines and a byte count above the replacement notice's length -- falsifier: the kept log of a failed scratch roll is still only the replacement notice"
evidence_requirements:
  - kind: tests
    description: The guard capture tests and the span redaction unit tests pass at the pushed head; the guard tests fail when handler_dev_boot_guard.py is taken from the parent commit.
    command: uv run --frozen pytest tests/unit/handlers/test_handler_dev_boot_guard_span_redaction_omn24127.py tests/integration/handlers/test_handler_dev_boot_guard_incident_capture_omn24013.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24127-ac1
    description: >-
      A failed roll whose log holds ordinary lines and a planted fake token keeps the lines before and after the token in the artifact file, the token replaced by the marker, redacted true, complete false and more than 39 bytes kept. The unit tests cover URL userinfo, key=value pairs and PEM key material.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_dev_boot_guard_span_redaction_omn24127.py tests/integration/handlers/test_handler_dev_boot_guard_incident_capture_omn24013.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24127-ac2
    description: >-
      A log of plain prose that names a token and a password, with no credential-shaped value, is kept equal to its input with redacted false and complete true.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/handlers/test_handler_dev_boot_guard_incident_capture_omn24013.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24127-ac3
    description: >-
      The planted fake token is absent from the kept file, and from the whole incident record when the artifact cannot be written.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/handlers/test_handler_dev_boot_guard_incident_capture_omn24013.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24127-ac4
    description: >-
      The tests behind the integrated reading pass at the head; the reading itself (the kept log of a forced failing roll on a scratch state, read on the dev deploy agent host) needs the agent to load this revision and is the pull request's Lab line; hosted CI cannot reach it.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/handlers/test_handler_dev_boot_guard_incident_capture_omn24013.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24127-integration-proof
    description: >-
      Live probe of the dev deploy agent, whose health URL the lab environment supplies as DEPLOY_AGENT_HEALTH_URL: read the revision the running agent loaded from its health endpoint and require that revision to define redact_credential_spans. Fails while the agent runs a revision without the change. Reachable only from the lab network. It binds no criterion; the hosted proof is dod-omn24127-ac1.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          bash -c 'sha=$(curl -sf --max-time 10 "${DEPLOY_AGENT_HEALTH_URL:?set to the dev deploy agent health URL}" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"loaded_code_sha\"])") && git grep -q "def redact_credential_spans" "$sha" -- src/omnibase_infra/handlers/handler_dev_boot_guard.py'
        cwd: .
