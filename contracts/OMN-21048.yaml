schema_version: "1.0.0"
ticket_id: "OMN-21048"
title: "A developer principal may publish the DoD closeout decide command and read its decided event"
summary: "The developer principal's wire bindings declared no DoD closeout topic, so the derived grants gave the dev-lane bus principal no WRITE on onex.cmd.omnimarket.dod-closeout-sweep-decide-requested.v1 and no READ on onex.evt.omnimarket.dod-closeout-sweep-decided.v1, and the lab readback of the DoD closeout sweep was refused by the broker. This change declares those two bindings and one prefixed consumer group in deploy/lab/developer-principal-bindings.yaml and regenerates deploy/lab/developer-principal-derived-grants.json from node_broker_grant_derive_compute. The deriver itself is unchanged. Applying the grants on the dev lane broker and the live readback are not part of this change."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-dod-closeout-grants-declared"
    statement: "The developer principal's bindings declare the DoD closeout proof, and the grants the issuer applies are the derivation's output for them."
    acceptance:
      - id: "AC1"
        statement: "AC1: node_broker_grant_derive_compute derives from deploy/lab/developer-principal-bindings.yaml WRITE and DESCRIBE on onex.cmd.omnimarket.dod-closeout-sweep-decide-requested.v1, READ and DESCRIBE on onex.evt.omnimarket.dod-closeout-sweep-decided.v1, READ and DESCRIBE on the group prefix local.omnimarket.dod_closeout_probe.consume.v1., and no other dod-closeout topic, and the committed deploy/lab/developer-principal-derived-grants.json is that output -- falsifier: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -k 'dod_closeout or nodes_output or typed_by_hand' fails at the merge base and passes at the head"
evidence_requirements:
  - kind: "tests"
    description: "The derivation tests pin the DoD closeout rows, the committed derived file and the issuer's writable topic set."
    command: "uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21048-ac1-derived-dod-closeout-grants"
    description: "The derivation reproduces the DoD closeout rows from the bindings, and the committed derived file is its output."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -q -k 'dod_closeout or nodes_output or typed_by_hand'"
        cwd: "${OMNI_HOME}/omnibase_infra"
      - check_type: "command"
        check_value: "uv run pytest tests/integration/nodes/test_broker_grant_derive_contract_discovery_omn19939.py -q -k developer_principal_issuer"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
  - id: "dod-omn21048-ac1-deploy-derived-grants-shipped"
    description: "The derived grants the issuer image ships at the merged head carry the DoD closeout decide command topic; the deployed surface is the source at the merged head."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/deploy/lab/developer-principal-derived-grants.json?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'onex.cmd.omnimarket.dod-closeout-sweep-decide-requested.v1'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
