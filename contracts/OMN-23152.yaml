    description: 'This is the omnibase_infra half of OMN-23152 and carries only the prerequisite for AC2: the vendored work-ledger migrations 0009 and 0010 and the runtime''s SELECT, INSERT, UPDATE grant on omninode_internal.work_ledger_seq_conflicts, which omnimarket''s projection auto-wiring requires before it will wire. The proof of the unique index and the dedupe is in the omnimarket contract for this ticket.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/topology/test_omn23152_work_ledger_seq_conflicts_grant.py -q -n 0 --no-cov -p no:cacheprovider
  - id: dod-omn23152-infra-ac1
    description: 'This is the omnibase_infra half of OMN-23152 and carries only the prerequisite for AC1: the vendored work-ledger migrations 0009 and 0010 and the runtime''s SELECT, INSERT, UPDATE grant on omninode_internal.work_ledger_seq_conflicts, which omnimarket''s projection auto-wiring requires before it will wire. It adds no code for the emit gate and the naming of the emitter; the proof is in the omnimarket contract for this ticket.'
    source: manual
