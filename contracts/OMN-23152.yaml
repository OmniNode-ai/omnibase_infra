        check_value: uv run pytest tests/unit/topology/test_omn23152_work_ledger_seq_conflicts_grant.py -q -n 0 --no-cov -p no:cacheprovider
  - id: dod-omn23152-infra-ac3
    description: 'This is the omnibase_infra half of OMN-23152 and carries only the prerequisite for AC3: the vendored work-ledger migrations 0009 and 0010 and the runtime''s SELECT, INSERT, UPDATE grant on omninode_internal.work_ledger_seq_conflicts, which omnimarket''s projection auto-wiring requires before it will wire. It adds no code for the 24-hour unjudged-row reading; the proof is in the omnimarket contract for this ticket.'
