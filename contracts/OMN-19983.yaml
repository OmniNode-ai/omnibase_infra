schema_version: "1.0.0"
ticket_id: "OMN-19983"
title: "A developer overlay's lane mirror derives per-broker grants that read the laptop lane and write only the lab lane"
summary: "The lane mirror's lanes and topic sets already come from the deployment overlay. What no test pinned was the grant side: that a dev-local to dev overlay selecting the delegation topic set, built through build_gateway_transports and derived through HandlerBrokerGrantDerive, yields READ and DESCRIBE on the dev-local broker only, WRITE and DESCRIBE on the dev broker only, and no grant on any other lane broker or on a hook topic. This change adds that test and no production code. The lab readback of a laptop delegation under the developer's tenant is not part of this change."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-overlay-grants-per-lane-broker"
    statement: "The broker grants derived for a developer lane-mirror overlay are exactly the delegation topics, read on the source lane broker and written on the mirror lane broker."
    acceptance:
      - id: "AC1"
        statement: "AC1: for an overlay binding source dev-local, mirror dev and topic set delegation, HandlerBrokerGrantDerive over build_gateway_transports yields READ and DESCRIBE (never WRITE) on lane.dev-local.kafka.broker and WRITE and DESCRIBE (never READ) on lane.dev.kafka.broker for each delegation topic, and no grant on another lane broker -- falsifier: the same test with topic set hook_edge in the overlay fails on the missing delegation READ grant"
  - id: "req-local-lane-mirror-bundle"
    statement: "A laptop's compose stack can mirror its declared delegation topics to the lab lane its overlay names, as an opt-in bundle."
    acceptance:
      - id: "AC4"
        statement: "AC4: the `local-lane-mirror` bundle renders the laptop stack plus one mirror-only `lane-mirror-forwarder` (no cloud leg, operator overlay and credential map mounted read-only, started after the broker requires SASL), the shipped overlay and credential templates load through `load_gateway_forwarder_runtime_config` and select exactly the delegation topic set from dev-local to dev, and the `local` bundle renders without the forwarder -- falsifier: `uv run pytest tests/unit/infra/test_catalog_local_lane_mirror_omn19983.py -n 0 -q` fails on the pre-change bundle, or the overlay naming `hook_edge` still selects a delegation topic"
  - id: "req-issued-principal-writes-mirror-set"
    statement: "The principal the lab issues to a developer machine holds every dev-lane grant the laptop lane mirror derives, so the mirror's writes of the delegation topic set are authorized."
    acceptance:
      - id: "AC5"
        statement: "AC5: every grant the shipped laptop lane-mirror overlay derives on lane.dev.kafka.broker through build_gateway_transports and HandlerBrokerGrantDerive is in the grants node_broker_grant_derive_compute derives from deploy/lab/developer-principal-bindings.yaml, and those mirror grants are topic WRITE and DESCRIBE only -- falsifier: `uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -n 0 -q -k laptop_lane_mirror` fails on the pre-change bindings, naming WRITE on delegation-completed, delegation-failed and llm-call-completed"
evidence_requirements:
  - kind: "tests"
    description: "The overlay binding tests, including the per-lane-broker grant derivation."
    command: "uv run pytest tests/unit/nodes/node_bus_forwarder_effect/test_lane_mirror_overlay_binding_omn19983.py -n 0 -q"
  - kind: "tests"
    description: "The laptop lane-mirror bundle render and the shipped overlay templates."
    command: "uv run pytest tests/unit/infra/test_catalog_local_lane_mirror_omn19983.py tests/unit/infra/test_catalog_local_profile.py -n 0 -q"
  - kind: "tests"
    description: "The issued developer principal's derived grants cover the laptop lane mirror's dev-lane writes."
    command: "uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py -n 0 -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19983-ac1-overlay-grants"
    description: "The developer overlay's derived grants read the dev-local broker, write the dev broker and name nothing else."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_bus_forwarder_effect/test_lane_mirror_overlay_binding_omn19983.py -n 0 -q -k grants_are_derived"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
  - id: "dod-omn19983-ac4-local-lane-mirror-bundle"
    description: "The local-lane-mirror bundle adds one mirror-only forwarder to the laptop stack, and its shipped templates select the delegation topic set from dev-local to dev."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/infra/test_catalog_local_lane_mirror_omn19983.py -n 0 -q"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC4"]
  - id: "dod-omn19983-ac5-issued-principal-mirror-writes"
    description: "The developer principal's derived grants include every dev-lane write the laptop lane mirror derives, and the mirror derives only topic writes."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py -n 0 -q -k laptop_lane_mirror"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC5"]
