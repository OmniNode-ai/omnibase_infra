schema_version: "1.0.0"
ticket_id: "OMN-19314"
title: "the overlay apply record quotes the end of the failing stream, not the head of stdout"
summary: "Evidence-only contract for the merged fix omnibase_infra#4011 (00b37ae0719c65438dc5e9ed3c3ac61563a08514). A failed apply_lab_lane.sh run now records the tail of its stderr (where the FATAL line is) in the lab_overlay_applied evidence, and with empty stderr the tail of stdout. AC3 (a live failed apply on the lab host) is not bound here: no failed apply record exists yet."
