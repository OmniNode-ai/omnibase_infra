dod_evidence:
  - id: "dod-omn19314-ac1-failed-apply-records-stderr-tail"
    description: "AC1: a failed apply_lab_lane.sh run records the end of its stderr, where the FATAL line is, in the lab_overlay_applied evidence; a long stderr keeps its last line. Both tests fail against the pre-merge lab_overlay.py (6c408a370), which quoted the head of stdout."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "env -u PYTHONPATH uv run --frozen --project scripts/deploy-agent --extra dev pytest 'scripts/deploy-agent/tests/unit/test_lab_overlay_apply_evidence_omn19314.py::test_a_failed_apply_records_the_end_of_stderr' 'scripts/deploy-agent/tests/unit/test_lab_overlay_apply_evidence_omn19314.py::test_a_failed_apply_with_a_long_stderr_keeps_its_last_line' -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
  - id: "dod-omn19314-ac2-empty-stderr-records-stdout-tail"
    description: "AC2: when stderr is empty, the evidence carries the end of stdout rather than its beginning. Fails against the pre-merge lab_overlay.py (6c408a370)."
