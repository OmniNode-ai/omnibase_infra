evidence_requirements:
  - kind: "tests"
    description: "A failed apply records the end of stderr, including when stderr is long."
    command: "env -u PYTHONPATH uv run --frozen --project scripts/deploy-agent --extra dev pytest 'scripts/deploy-agent/tests/unit/test_lab_overlay_apply_evidence_omn19314.py::test_a_failed_apply_records_the_end_of_stderr' 'scripts/deploy-agent/tests/unit/test_lab_overlay_apply_evidence_omn19314.py::test_a_failed_apply_with_a_long_stderr_keeps_its_last_line' -q -p no:cacheprovider"
  - kind: "tests"
    description: "With empty stderr the evidence is the end of stdout, not its head."
    command: "env -u PYTHONPATH uv run --frozen --project scripts/deploy-agent --extra dev pytest 'scripts/deploy-agent/tests/unit/test_lab_overlay_apply_evidence_omn19314.py::test_without_stderr_the_evidence_is_the_end_of_stdout_not_its_head' -q -p no:cacheprovider"
