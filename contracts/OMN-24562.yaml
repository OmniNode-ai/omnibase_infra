schema_version: "1.0.0"
ticket_id: OMN-24562
title: "The stability follow retires the folded effects container so main can publish port 18086"
summary: >-
  The deploy agent's stability runtime phase now removes the runtime-effects container that an older compose file left behind once the lane's main runtime carries the effects role, and no longer asks compose to start that service. The retirement is limited to the services the lane's fold policy maps, so the stability lane's other containers are untouched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24562-stability-retire-folded
    statement: >-
      The stability lane retires the container of every role its main runtime folds, keeps volumes, and leaves prod and the other stability containers alone.
    acceptance:
      - id: AC1
        statement: >-
          AC1: for the stability lane the agent's lane configuration disables the runtime-effects service, the runtime phase removes its old container without touching volumes, and prod retires nothing -- falsifier: pytest scripts/deploy-agent/tests/unit/test_stability_retires_folded_effects_omn24562.py -q
      - id: AC2
        statement: >-
          AC2: the change is present on the pull request branch and absent at the merge base -- falsifier: the branch's executor.py has no _retired_folded_services function
      - id: AC3
        statement: >-
          AC3: integrated: one stability-follow job on h201 passes the runtime phase and the stability runtime and runtime-effects health targets read healthy -- falsifier: the job record shows phase_results.runtime other than success, or the stability runtime container is not healthy at the job's completion
evidence_requirements:
  - kind: tests
    description: >-
      Stability lane retirement of the folded effects container, with a positive control that the services the lane still runs stay requested.
    command: cd scripts/deploy-agent && uv run --frozen --extra dev python -m pytest tests/unit/test_stability_retires_folded_effects_omn24562.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24562-ac1-stability-retirement
    description: >-
      The stability lane disables runtime-effects, retires its old container with a stop and a remove that carry no volume flag, removes nothing when none exists, and the primary-dev tests still pass.
    source: manual
    checks:
      - check_type: test_passes
        check_value: cd scripts/deploy-agent && env PYTHONDONTWRITEBYTECODE=1 uv run --frozen --extra dev python -m pytest tests/unit/test_stability_retires_folded_effects_omn24562.py tests/unit/test_dev_tenant_projection_fold_omn21288.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn24562-ac2-deploy-probe
    description: >-
      Hosted stand-in for AC3, which is read on h201 after the agent is installed from this branch. The check reads the executor file GitHub serves on the pull request branch and fails at the merge base, where the function does not exist.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/scripts/deploy-agent/deploy_agent/executor.py?ref=omn-24562-stability-retire-folded-effects\" --jq .content | base64 -d | grep -q 'def _retired_folded_services'"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2, AC3]
  - id: dod-omn24562-integration-proof-fold-policy
    description: >-
      The committed runtime policy, read through the handler's own folded-service computation, retires runtime-effects for the stability lane and nothing for a lane that folds nothing.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/handlers/test_handler_dev_boot_guard_stability_fold_omn24562.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
