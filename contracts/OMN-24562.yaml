schema_version: "1.0.0"
ticket_id: OMN-24562
title: "The deploy agent's stability follow job takes the embedding address from the overlay"
summary: "Two stability follow jobs of the lab dev deploy agent (agent/stability-follow-tag, 2026-11-15T10:56Z and 11:41Z) failed the LLM endpoint env contract check: the operator settings store on the lab host still names the removed embedding server (port 8002) while the llm_endpoints overlay names the staying one (port 8100). OMN-24025 rendered the overlay address for the dev lane's jobs and OMN-24119 for the stability refresh script, but the agent's own stability job was left fenced out, so its compose environment and its guard read the store. The render now covers the stability job of a dev-fenced agent; a prod job still takes nothing from it."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24562-stability-job-renders-overlay-address
    statement: A stability job of a dev-fenced deploy agent takes LLM_EMBEDDING_URL, BIFROST_LOCAL_EMBEDDING_ENDPOINT_URL and the rewritten lane overlay directory from the llm_endpoints overlay, in its compose environment and in its env contract guard, and a prod job takes nothing from the render.
    acceptance:
      - id: AC1
        statement: 'AC1: the compose environment of a stability job of a dev-fenced agent carries the overlay address over the settings store''s -- falsifier: python -m pytest scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py -k "stability_job" -q fails at the merge base'
      - id: AC2
        statement: 'AC2: the env contract guard of a stability job checks the rendered environment and skips the store''s value for the rendered names -- falsifier: the guard test for a stability job passes with the render fence unchanged'
      - id: AC3
        statement: 'AC3: a prod job of a dev-fenced agent keeps the store''s address -- falsifier: the prod control test fails at the head'
  - id: req-omn24562-stability-retire-folded
    statement: The stability lane retires the container of every role its main runtime folds, keeps volumes, and leaves prod and the other stability containers alone. The old runtime-effects container an older compose file left behind is removed before main publishes port 18086, and compose is no longer asked to start that service.
    acceptance:
      - id: AC4
        statement: 'AC4: for the stability lane the agent''s lane configuration disables the runtime-effects service, the runtime phase retires its old container with a stop and a remove that carry no volume flag, removes nothing when none exists, and prod retires nothing -- falsifier: pytest scripts/deploy-agent/tests/unit/test_stability_retires_folded_effects_omn24562.py -q fails when the retirement call in the runtime phase or the census branch of _retire_folded_dev_services is deleted'
      - id: AC5
        statement: 'AC5: the retirement is present on the pull request branch and absent at the merge base -- falsifier: the branch''s executor.py has no _retire_folded_dev_services method'
      - id: AC6
        statement: 'AC6: integrated: one stability-follow job on h201 passes the runtime phase and the stability runtime and runtime-effects health targets read healthy -- falsifier: the job record shows phase_results.runtime other than success, or the stability runtime container is not healthy at the job''s completion'
  - id: req-omn24562-stability-start-wait
    statement: verify() waits out a stability runtime's declared start the way it does on dev, reading the budget from the container's own compose healthcheck, so a runtime that takes about five minutes to start is not failed on its first probe and rolled back. A spent budget still fails the job, no lane but dev may recreate, and dev and prod behave as before.
    acceptance:
      - id: AC7
        statement: 'AC7: a stability runtime that fails its first probe while Docker reports it starting is re-probed within its declared start budget and passes without a recreate -- falsifier: pytest scripts/deploy-agent/tests/unit/test_verify_stability_start_wait_omn24562.py -k "waited_for_and_passes" fails when VERIFY_START_WAIT_LANES in executor.py drops the stability lane'
      - id: AC8
        statement: 'AC8: a stability runtime still failing past its declared start budget fails the job, which the agent turns into the rollback, and nothing is recreated; a shorter declared budget gives fewer probes than a longer one, so the wait is read from the container and not from a constant -- falsifier: the outlives-its-budget and wait-length tests fail when the wait length is a fixed number or the failed job passes'
      - id: AC9
        statement: 'AC9: dev behaves as before (the same one service-label lookup, the same wait, the recreate allowlist still dev only) and prod gets neither the wait nor a recreate -- falsifier: the dev lookup, fence and prod tests of the same file fail when stability or prod joins VERIFY_RECREATE_LANES or prod joins VERIFY_START_WAIT_LANES'
      - id: AC10
        statement: 'AC10: integrated: a stability-follow job on h201 installed from this branch passes verify() for a runtime that needs minutes to start and is not rolled back -- falsifier: the job record shows verification other than success for a container that Docker later reports healthy, or a rollback restores the retained image'
  - id: req-omn24562-stability-build-project
    statement: The stability job of the dev-fenced deploy agent builds the runtime images under the stability compose project that its runtime up runs, and does not name autoheal, which the stability overlay disables.
    acceptance:
      - id: AC7
        statement: 'AC7: the build command of a stability job runs under the stability compose project and the stability lane configuration disables autoheal -- falsifier: scripts/deploy-agent/tests/unit/test_stability_build_project_omn24562.py fails at the merge base'
      - id: AC8
        statement: 'AC8: integrated: after the agent is installed from the integration branch, one stability-follow job on h201 builds the omninode-runtime image of the stability project at the job time and names no autoheal -- falsifier: the image list of h201 shows that image older than the job, or the job record errors name autoheal'
  - id: req-omn24562-stability-rollback-waiver
    statement: The deploy agent runs a stability runtime deploy that has no retained rollback point only when its own probe reads every runtime target of the lane down with no timeout, records on the job that it ran without one, and never applies the waiver to the prod lane.
    acceptance:
      - id: AC4
        statement: 'AC4: a stability runtime deploy with no retained rollback point runs when the guard probe reads the lane UNHEALTHY, and the job records it ran without one -- falsifier: python -m pytest scripts/deploy-agent/tests/unit/test_rollback_waiver_omn24562.py -k unhealthy_lane_without_point fails at the merge base'
      - id: AC5
        statement: 'AC5: a stability runtime deploy with no retained rollback point is refused when the probe reads the lane HEALTHY or UNKNOWN (a timeout or a probe error) -- falsifier: the healthy and unknown tests in the same file pass only with the refusal'
      - id: AC6
        statement: 'AC6: the waiver is never granted to the prod or dev lane and probes nothing for them -- falsifier: the prod and dev control test fails at the head'
evidence_requirements:
  - kind: tests
    description: The stability compose-environment and guard tests pass at the pushed head and fail at the merge base, where the render is fenced to the dev lane.
    command: uv run pytest scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py -q -p no:randomly --no-cov
  - kind: tests
    description: Stability lane retirement of the folded effects container and its runtime-phase call site, with a positive control that the services the lane still runs stay requested.
    command: cd scripts/deploy-agent && uv run --frozen --extra dev python -m pytest tests/unit/test_stability_retires_folded_effects_omn24562.py -q -p no:cacheprovider
  - kind: tests
    description: Stability start wait within and past the declared budget, with the dev lookup, the two fences and prod unchanged.
    command: cd scripts/deploy-agent && uv run --frozen --extra dev python -m pytest tests/unit/test_verify_stability_start_wait_omn24562.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24562-ac1
    description: 'AC1 and AC2 and AC3: the stability job compose environment, the stability guard and the prod control pass'
    source: manual
    binds_ac:
      - AC1
      - AC2
      - AC3
    checks:
      - check_type: command
        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_llm_endpoint_env_compose_omn24025.py -q -p no:randomly --no-cov
        cwd: .
  - id: dod-omn24562-integration-proof
    description: 'The real renderer reads the real contracts and a real git overlay: a stability job takes the overlay address and a prod job takes nothing. It binds no criterion; the hosted proof is dod-omn24562-ac1, this one is the local Done gate'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/ci/test_stability_job_overlay_render_integration_omn24562.py -q -p no:randomly --no-cov
        cwd: .
  - id: dod-omn24562-ac4-stability-retirement
    description: The stability lane disables runtime-effects, retires its old container with a stop and a remove that carry no volume flag, removes nothing when none exists, makes the retirement call in the runtime phase, fails loudly when the census or the stop fails, retires nothing on prod, and the primary-dev tests still pass.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: cd scripts/deploy-agent && env PYTHONDONTWRITEBYTECODE=1 uv run --frozen --extra dev python -m pytest tests/unit/test_stability_retires_folded_effects_omn24562.py tests/unit/test_dev_tenant_projection_fold_omn21288.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac5-ac6-retirement-probe
    description: Hosted stand-in for AC6, which is read on h201 after the agent is installed from this branch. The check reads the executor file GitHub serves on the pull request branch and fails at the merge base, where the _retire_folded_dev_services method does not exist.
    source: manual
    binds_ac:
      - AC5
      - AC6
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/scripts/deploy-agent/deploy_agent/executor.py?ref=omn-24562-stability-retire-folded-effects\" --jq .content | base64 -d | grep -q 'def _retire_folded_dev_services'"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-integration-proof-fold-policy
    description: The committed runtime policy, read through the handler's own folded-service computation, retires runtime-effects for the stability lane and nothing for a lane that folds nothing.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/handlers/test_handler_dev_boot_guard_stability_fold_omn24562.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac7-ac9-stability-start-wait
    description: A stability runtime is waited for within its declared start budget and passes, fails and is not recreated past it, and dev, the two fences and prod behave as before.
    source: manual
    binds_ac:
      - AC7
      - AC8
      - AC9
    checks:
      - check_type: test_passes
        check_value: cd scripts/deploy-agent && env PYTHONDONTWRITEBYTECODE=1 uv run --frozen --extra dev python -m pytest tests/unit/test_verify_stability_start_wait_omn24562.py tests/unit/test_verify_honours_declared_start_omn19374.py tests/unit/test_verify_force_recreate_omn18640.py tests/unit/test_auto_rollback.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac10-start-wait-probe
    description: Hosted stand-in for AC10, which is read on h201 after the agent is installed from this branch. The check reads the executor file GitHub serves on the pull request branch and fails at the merge base, where the stability lane is not in the start-wait fence.
    source: manual
    binds_ac:
      - AC10
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/scripts/deploy-agent/deploy_agent/executor.py?ref=omn-24562-stability-start-wait\" --jq .content | base64 -d | grep -q 'lane in VERIFY_START_WAIT_LANES'"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac7-stability-build-project
    description: The build command of a stability job runs under the stability compose project, dev still builds under its own, the stability lane disables autoheal and keeps the services it runs by name, and the executor builds under the lane's compose project.
    source: manual
    binds_ac:
      - AC7
    checks:
      - check_type: test_passes
        check_value: cd scripts/deploy-agent && env PYTHONDONTWRITEBYTECODE=1 uv run --frozen --extra dev python -m pytest tests/unit/test_stability_build_project_omn24562.py tests/unit/test_stability_retires_folded_effects_omn24562.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: grep -q 'lane_config_for(runtime_lane).compose_project,' scripts/deploy-agent/deploy_agent/executor.py
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac8-stability-follow-readback
    description: Hosted stand-in for AC8, which is read on h201 after the agent is installed from the integration branch. The executor on the branch disables autoheal for the stability lane; the merge base names it in the runtime up.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC8
    checks:
      - check_type: command
        check_value: grep -q 'disabled_services=frozenset({"autoheal"})' scripts/deploy-agent/deploy_agent/executor.py
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-rollback-waiver
    description: 'AC4, AC5 and AC6: UNHEALTHY allows and records, HEALTHY refuses, UNKNOWN refuses, prod and dev never waived; the existing rollback tests still pass'
    source: manual
    binds_ac:
      - AC4
      - AC5
      - AC6
    checks:
      - check_type: command
        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_rollback_waiver_omn24562.py scripts/deploy-agent/tests/unit/test_auto_rollback.py -q -p no:randomly --no-cov
        cwd: .
