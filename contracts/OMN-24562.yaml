schema_version: "1.0.0"
ticket_id: OMN-24562
title: "The stability lane retires the container of every role its main runtime folds"
summary: "The stability lane of the lab dev deploy agent folds runtime-effects into the main runtime but left the old runtime-effects container running, so it held port 18086. The lane now disables that service, and the runtime phase stops and removes the old container (no volume flag) before main publishes the port."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24562-stability-retire-folded
    statement: The stability lane retires the container of every role its main runtime folds, keeps volumes, and leaves prod and the other stability containers alone. The old runtime-effects container an older compose file left behind is removed before main publishes port 18086, and compose is no longer asked to start that service.
    acceptance:
      - id: AC4
        statement: 'AC4: for the stability lane the agent''s lane configuration disables the runtime-effects service, the runtime phase retires its old container with a stop and a remove that carry no volume flag, removes nothing when none exists, and prod retires nothing -- falsifier: pytest scripts/deploy-agent/tests/unit/test_stability_retires_folded_effects_omn24562.py -q fails when the retirement call in the runtime phase or the census branch of _retire_folded_dev_services is deleted'
      - id: AC5
        statement: 'AC5: the pull request branch''s executor.py carries the guard line `if "runtime-effects" in retired:` (in lane_config_for, where a lane that retires the effects role reads the effects health target from main), a line the merge base does not carry -- falsifier: that line is absent from the branch''s executor.py, or present at the merge base 6deccc76f9768b2be6b4ba8939eb0a9d52cd1082'
  - id: req-omn24562-stability-rollback-waiver
    statement: The deploy agent runs a stability runtime deploy that has no retained rollback point only when its own probe reads every runtime target of the lane failed with no timeout and Docker reads every target container unhealthy or gone after its declared start window, records that it ran without one, and never applies the waiver to the prod or dev lane.
    acceptance:
      - id: AC19
        statement: 'AC19: a stability runtime deploy with no retained rollback point runs when every runtime target fails the guard probe and Docker reads each target container unhealthy or absent, and the job records it ran without one -- falsifier: pytest scripts/deploy-agent/tests/unit/test_rollback_waiver_omn24562.py -k unhealthy_lane_without_point fails at the merge base'
      - id: AC20
        statement: 'AC20: the deploy is refused when the lane is degraded-serving (a target passes, or a failing target is Docker-healthy) or still starting (Docker reads a target starting inside its start period), or the probe times out or errors -- falsifier: the degraded_serving and still_starting tests in the same file fail when the waiver ignores the Docker state'
      - id: AC21
        statement: 'AC21: the waiver is never granted to the prod or dev lane and probes nothing for them -- falsifier: the prod and dev control test fails at the head'
evidence_requirements:
  - kind: tests
    description: Stability lane retirement of the folded effects container and its runtime-phase call site, with a positive control that the services the lane still runs stay requested.
    command: cd scripts/deploy-agent && uv run --frozen --extra dev python -m pytest tests/unit/test_stability_retires_folded_effects_omn24562.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24562-ac4-stability-retirement
    description: The stability lane disables runtime-effects, retires its old container with a stop and a remove that carry no volume flag, removes nothing when none exists, makes the retirement call in the runtime phase, fails loudly when the census or the stop fails, retires nothing on prod, and the primary-dev tests still pass.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: cd scripts/deploy-agent && env PYTHONDONTWRITEBYTECODE=1 uv run --frozen --extra dev python -m pytest tests/unit/test_stability_retires_folded_effects_omn24562.py tests/unit/test_dev_tenant_projection_fold_omn21288.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac5-guard-line-absent-at-merge-base
    description: 'AC5: greps the executor file in the checked-out tree for the guard line `if "runtime-effects" in retired:`. That line is absent at the merge base 6deccc76f and present at the head (executor.py line 1032), so the grep fails at the merge base and passes at the head.'
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: command
        check_value: grep -qF 'if "runtime-effects" in retired:' scripts/deploy-agent/deploy_agent/executor.py
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac6-h201-job-record-runtime-phase
    description: 'Unbound local Done gate (not a hosted criterion): reads the stability-follow job record on h201 (the deploy agent state file /data/omninode/deploy-agent/state/jobs-dev/<job id>*.json, field phase_results.runtime) and exits 0 only when exactly one record matches the job id prefix in STABILITY_FOLLOW_JOB_ID and its phase_results.runtime is success. It is read-only, prints no secret, needs no agent pin change, and exits non-zero when the variable is unset, no record matches, or the runtime phase is anything other than success. The hosted runner cannot reach h201, so the item is local_done_gate and runs on h201 after the agent is installed from this branch.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "ssh h201 \"python3 -c 'import glob, json, sys; hits = glob.glob(\\\"/data/omninode/deploy-agent/state/jobs-dev/\\\" + sys.argv[1] + \\\"*.json\\\"); sys.exit(0 if len(hits) == 1 and json.load(open(hits[0]))[\\\"phase_results\\\"][\\\"runtime\\\"] == \\\"success\\\" else 1)' ${STABILITY_FOLLOW_JOB_ID:?set STABILITY_FOLLOW_JOB_ID to the stability-follow job id}\""
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-integration-proof-fold-policy
    description: The committed runtime policy, read through the handler's own folded-service computation, retires runtime-effects for the stability lane and nothing for a lane that folds nothing.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/handlers/test_handler_dev_boot_guard_stability_fold_omn24562.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24562-ac19-ac21-rollback-waiver
    description: 'AC19, AC20 and AC21: an UNHEALTHY lane past its start window is waived and recorded; a degraded-serving, still-starting, HEALTHY or UNKNOWN lane is refused; prod and dev are never waived; the existing rollback tests still pass.'
    source: manual
    binds_ac:
      - AC19
      - AC20
      - AC21
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest scripts/deploy-agent/tests/unit/test_rollback_waiver_omn24562.py scripts/deploy-agent/tests/unit/test_auto_rollback.py -q -p no:randomly --no-cov -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
