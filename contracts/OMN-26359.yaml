schema_version: 1.0.0
ticket_id: OMN-26359
title: The omnibase_infra kernel startup reads and parses each contract file once per boot through a stat-keyed cache, so repeated parsing no longer holds the event loop before /health
summary: >-
  read_contract_yaml and the contract content hash are memoised on the file's path, modification time and size, and every read returns a private copy, so a contract file is parsed once per boot and a changed file is read again. The per-topic state_io and failure-terminal reads in _subscribe_contract_topics are hoisted above the topic loop, load_terminal_event_topics is computed once per contract and only for a handler whose constructor takes an event_publisher, and the kernel's one TopicProvisioner is reused by the topic-migration executor and by the auto-create pass instead of building more. The health gate, the boot guard, the compose wait and the compose start period are not changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26359-parse-once
    statement: A contract file is read and parsed once per boot, a changed file is read again, a caller that mutates a read changes no later read, the hoisted reads happen once per contract, and the kernel builds one TopicProvisioner that the migration executor reuses.
    acceptance:
      - id: AC1
        statement: "AC1: read_contract_yaml and the contract content hash are memoised on (path, st_mtime_ns, st_size) and return an immutable view or a deep copy, so a caller that mutates a result changes no later read and a changed file is re-read -- falsifier: uv run pytest tests -q -k contract_cache_isolation_and_invalidation fails at origin/dev and passes on the branch"
      - id: AC2
        statement: "AC2: on 10 contracts, yaml.safe_load is called at most once per path across discover_contracts, wire_from_manifest and subscribe_wired_contract_topics -- falsifier: uv run pytest tests -q -k contract_parse_once fails at origin/dev and passes on the branch"
      - id: AC3
        statement: "AC3: a contract with 5 subscribe topics reads state_io once and its failure terminal topics once, with both reads hoisted above the topic loop in _subscribe_contract_topics -- falsifier: uv run pytest tests -q -k state_io_read_once fails at origin/dev and passes on the branch"
      - id: AC4
        statement: "AC4: load_terminal_event_topics is computed once per contract and only when the handler constructor takes an event_publisher, so a handler without one causes zero calls -- falsifier: uv run pytest tests -q -k terminal_topics_computed_once fails at origin/dev and passes on the branch"
      - id: AC5
        statement: "AC5: the kernel builds one TopicProvisioner per boot and the migration executor dependencies reuse it, with the same topic set provisioned as before -- falsifier: uv run pytest tests -q -k topic_provisioner_built_once fails at origin/dev and passes on the branch"
      - id: AC6
        statement: "AC6: the boot on a lab host with the dev contract set reports the time to /health and the total yaml parse count before and after, in the PR body under a section headed Measured boot with the host, the source refs and a UTC read time, and in the lane STATUS row -- falsifier: onex scm pr-view of the PR shows no section headed Measured boot holding before and after seconds, before and after parse counts and a UTC read time"
      - id: AC7
        statement: "AC7: the health gate, the boot guard, the compose wait and the compose start period are unchanged, and no baselined file grows -- falsifier: git diff origin/dev --stat on the branch lists no health gate setting, no boot guard file, no compose file and no wait setting, and uv run pytest tests -q -k file_shape passes"
      - id: AC8
        statement: "AC8: the lane STATUS row names the pushed branch, its base, the path of the ready PR body, and the before and after boot measurements -- falsifier: grep of the rolling work ledger for lane=parseonce-1530 shows no STATUS row with the branch name and the before and after measurements"
evidence_requirements:
  - kind: tests
    description: The contract_cache_isolation_and_invalidation, contract_parse_once, state_io_read_once, terminal_topics_computed_once and topic_provisioner_built_once regressions.
    command: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_contract_parse_once_omn26359.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26359-ac1-cache-isolation-and-invalidation
    description: "Three reads of an unchanged file parse it once, a caller's mutation reaches no later read, and a changed file and its content hash are read again."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_contract_parse_once_omn26359.py -k contract_cache_isolation_and_invalidation -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26359-ac2-parse-once
    description: "Ten contracts are discovered, wired and subscribed; every YAML constructor run is counted and no contract is parsed more than once."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_contract_parse_once_omn26359.py -k contract_parse_once -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26359-ac3-state-io-read-once
    description: "A contract with five subscribe topics reads state_io once and its failure terminal topics once during the subscribe phase."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_contract_parse_once_omn26359.py -k state_io_read_once -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26359-ac4-terminal-topics-computed-once
    description: "A handler without an event_publisher causes zero load_terminal_event_topics calls; three entries of one contract whose handler takes an event_publisher cause one."
    source: manual
    binds_ac: [AC4]
    checks:
