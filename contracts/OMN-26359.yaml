        cwd: .
  - id: dod-omn26359-ac5-topic-provisioner-built-once
    description: "The runtime handler dependencies carry the kernel's provisioner to the topic-migration executor, wire_from_manifest builds no TopicProvisioner and runs no contract scan when it is given, the kernel's auto-create pass runs on that provisioner and builds none, and the kernel source holds one TopicProvisioner construction."
    source: manual
