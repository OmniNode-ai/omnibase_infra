    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_contract_parse_once_omn26359.py -k measured_boot_record_holds_before_and_after -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26359-ac7-gates-unchanged
    description: "The change edits no compose file, boot guard, healthcheck setting, start period or wait setting; the new cache module sits in a canonical location with no baseline line and the moved auto-create logic sits in handlers/boot_topic_provisioning.py."
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_contract_parse_once_omn26359.py -k file_shape_the_cache_module_has_a_canonical_home -q --no-cov -n 0 -p no:randomly
