schema_version: "1.0.0"
ticket_id: OMN-24429
title: "Stability host advertises its own broker address"
summary: >-
  The lab proof lane's overlay advertises the first host's broker addresses, so a client that bootstraps on a second host is redirected to the first host's broker. A compose layer, applied only by a host that serves the lane under its own address, replaces the advertised addresses with two values read from that host's environment; a host that does not apply it is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24429-host-advertised-address
    statement: >-
      A second host can serve the lab proof lane and hand its own clients its own broker address, with no address held in this repository.
    acceptance:
      - id: AC1
        statement: >-
          AC1: a host that sets its two advertised addresses and applies the host layer renders those addresses and no other host's, and the lane's own configuration differs from the layer in nothing else -- falsifier: pytest tests/unit/infra/test_stability_host_advertised_addr.py -q
      - id: AC2
        statement: >-
          AC2: a host that applies the layer without setting an address is refused naming the missing setting, and an unrelated shared name does not move the address -- falsifier: the error-chain cases in tests/unit/infra/test_stability_host_advertised_addr.py
      - id: AC3
        statement: >-
          AC3: integrated: on the second stability machine a client that bootstraps on its address is handed that address -- falsifier: integrated: the broker's own metadata read on the running second machine names that machine's address, not the first machine's
evidence_requirements:
  - kind: tests
    description: >-
      The layer renders a host's two addresses, differs from the lane's own command in the two values only, overrides only the redpanda command, refuses an unset value by name, ignores unrelated shared names, leaves the lane's own file unlayered, keeps the advertised external port equal to the published port and keeps the internal listener.
    command: uv run --frozen pytest tests/unit/infra/test_stability_host_advertised_addr.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24429-ac1-layer-renders-host-values
    description: >-
      The ticket's falsifier. With no layer file, or a layer whose command differs from the lane's own command in any argument other than the two advertised values, the layer tests fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/infra/test_stability_host_advertised_addr.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn24429-ac2-unset-refused-by-name
    description: >-
      A layer that falls back to a default for either value, instead of refusing the unset name, fails the refusal case.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/infra/test_stability_host_advertised_addr.py -q -n 0 -p no:cacheprovider -k "refused_by_name or unrelated_names"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
  - id: dod-omn24429-ac1-deploy-probe
    description: >-
      Deploy probe. The layer file at the checked-out commit carries both advertised arguments as required variables and no address, which is what a host applying it reads. The command counts the two required-variable references in the file and fails when either is missing.
    source: manual
    checks:
      - check_type: command
        check_value: "test \"$(grep -cE '^      - \\$\\{STABILITY_TEST_REDPANDA_ADVERTISED_(KAFKA|PANDAPROXY)_ADDR:\\?' docker/docker-compose.stability-host-broker.yml)\" = 2"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
