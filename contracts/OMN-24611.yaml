schema_version: "1.0.0"
ticket_id: OMN-24611
title: The dev deploy agent signs with its own dev-only key
summary: The dev deploy agent unit (deploy-agent-dev.service) reads its signing key from its own file, EnvironmentFile=%h/.omnibase/deploy-agent-dev-signing-key.env (one DEPLOY_AGENT_HMAC_SECRET line holding the secret store's DEPLOY_AGENT_DEV_HMAC_SECRET), and lists DEPLOY_AGENT_HMAC_SECRET in DEPLOY_AGENT_ENV_PROTECTED so the launcher's source of the operator store and the executor's store re-read never put the shared value back. The live agent's unit and drop-in are not touched; The dev unit also declares one ExecStartPre that reads the key file itself and refuses the start (exit 2, the name only, never a value) unless the file is exactly one DEPLOY_AGENT_HMAC_SECRET=<letters, digits, - and _> line that is not the template placeholder (every other line is refused, because systemd takes an indented later assignment, swallows a line after a comment ending in a backslash, and lets any extra name override the unit's Environment=), before the launcher sources the operator store, so a key file that is empty, whitespace-only, a placeholder, wrong-named, unparseable, or shaped to defeat a line grep no longer lets the dev agent start with an empty key, the placeholder or the shared key, even when the user manager already carries the name. Rollout order is the key file on h201 first and then the unit, because a unit installed before the file exists fails every start. The launcher (a baselined file that only shrinks), auth.py and the compose files do not change.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn24611-unit
    statement: The dev agent unit declares its own signing key file and protects the key name, and no other unit names that file.
    acceptance:
      - id: AC1
        statement: "AC1: the dev deploy agent's unit declares one EnvironmentFile for its own signing key file and lists the key name as protected, and no other unit names that file -- falsifier: pytest scripts/deploy-agent/tests/unit/test_dev_agent_own_signing_key_omn24565.py fails 28 of its 41 tests against the dev unit on origin/dev"
  - id: req-omn24611-store
    statement: The secret store's own node generates the dev-only entry the key file carries; the node and its test are the omnimarket pull request of this ticket, and this repository names the entry in its environment example.
    acceptance:
      - id: AC2
        statement: "AC2: the secret store's own node holds a generated dev-only entry DEPLOY_AGENT_DEV_HMAC_SECRET, created without the value being printed -- falsifier: the node's generate test fails on the contract without the entry, and the store's name list lacks DEPLOY_AGENT_DEV_HMAC_SECRET"
  - id: req-omn24611-check
    statement: The check value the dev agent serves is the check value of the store's entry.
    acceptance:
      - id: AC3
        statement: "AC3: the key check value the dev agent serves equals the key check value of the store's entry on the sending lab hosts -- falsifier: the key check node answers different check values for the agent and for the store entry"
  - id: req-omn24611-integrated
    statement: The dev agent on h201 accepts a signed no-op from h051 after the unit is installed, and the live agent's unit file is unchanged.
    acceptance:
      - id: AC4
        statement: "AC4: integrated: from h051 one signed no-op command is accepted by the dev agent on h201 after its unit is installed, and the live agent's unit file digest is identical before and after, read on h201 -- falsifier: the running dev agent on lab host h201 rejects the command as an invalid signature, or the live unit digest read back after the install differs from the one before"
evidence_requirements:
  - kind: tests
    description: The focused tests of the dev unit's own signing key and the launcher.
    command: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_agent_own_signing_key_omn24565.py scripts/deploy-agent/tests/unit/test_deploy_agent_launcher_omn18073.py -q
  - kind: tests
    description: The evidence checks of AC2, AC3 and AC4 read slots that exist in this contract and fail for what they bind.
    command: uv run pytest tests/ci/test_contract_omn24611_evidence_readings_omn25179.py -q
context:
  # Real readings only, each with the host it was read on, the command that read it and the UTC
  # time. They are recorded AFTER the install (key file on h201 first, then the unit, then a
  # signed no-op from h051), so every check below is red until then. Empty means not yet read.
  evidence_readings:
    ac3_agent_check_value: ''
    ac3_store_check_value: ''
    ac3_read_host: ''
    ac3_read_command: ''
    ac3_read_time: ''
    ac4_noop_result: ''
    ac4_live_unit_digest_before: ''
    ac4_live_unit_digest_after: ''
    ac4_read_host: ''
    ac4_read_command: ''
    ac4_read_time: ''
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24611-ac1-unit
    description: The dev unit declares the one signing key EnvironmentFile and protects DEPLOY_AGENT_HMAC_SECRET; the launcher keeps the dev value over the store's shared one; the executor overlay leaves the name out. The same test file fails 35 of its 64 tests with the dev unit from origin/dev (the file at the first head of this pull request failed 10 of its 15, and at the second head 28 of its 41).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_agent_own_signing_key_omn24565.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24611-ac1-start-check-refuses
    description: The unit's ExecStartPre reads the key file itself; a key file that is empty, zero-byte, whitespace-only, a placeholder, wrong-named or unparseable is refused with exit 2 before the launcher sources the store, also when the user manager already carries the name, and without the check the same files start the agent on an empty, placeholder or shared value (the failing controls).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_agent_own_signing_key_omn24565.py -k "start_check" -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24611-ac1-no-store-load-around-the-env
    description: The dev runtime's containers get the dev key because compose interpolates it from the agent's environment; no compose file declares an env_file naming the operator store and no deploy-agent compose argv passes --env-file (each scan has a failing control).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_agent_own_signing_key_omn24565.py -k "env_file" -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24611-ac2-store-entry-named
    description: The secret store's own node holds the generated dev-only entry and its generate test is on the omnimarket dev branch. This reads the sibling checkout of omnimarket at origin/dev, so it stays red while the omnimarket pull request of this ticket is unmerged (the criterion is open until then). The environment example of this repository also names the entry.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: |-
          set -eu;
          git show origin/dev:src/omnimarket/nodes/node_secret_store_effect/contract.yaml | grep -q 'key: DEPLOY_AGENT_DEV_HMAC_SECRET';
          git cat-file -e origin/dev:tests/unit/nodes/node_secret_store_effect/test_generate_deploy_agent_dev_key.py
        cwd: ${OMNI_HOME}/omnimarket
      - check_type: command
        check_value: grep -q 'DEPLOY_AGENT_DEV_HMAC_SECRET' docker/env-example-full.txt
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24611-ac3-same-key
    description: The key check value the dev agent serves equals the key check value of the store's entry on the sending lab hosts. Both readings are recorded under context.evidence_readings (16 hex characters each, from the key check node) with the host, the command and the UTC time they were read at; the check requires all of it, both values present and equal, so it is red while any is absent, red when they differ, and red for a pair typed without its host, command and time. The readings are recorded after the unit is installed. The unit-level behaviour (the agent environment carries the unit file's value under the name auth.py reads) is the first check.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_agent_own_signing_key_omn24565.py -k "launcher_keeps_the_dev_key" -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: |-
          python3 -c "import re,sys,yaml; r=(yaml.safe_load(open('contracts/OMN-24611.yaml')).get('context') or {}).get('evidence_readings') or {}; g=lambda k: str(r.get(k,'')); a=g('ac3_agent_check_value'); s=g('ac3_store_check_value'); ok=bool(re.fullmatch(r'[0-9a-f]{16}', a)) and a == s and bool(g('ac3_read_host')) and bool(g('ac3_read_command')) and bool(re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z', g('ac3_read_time'))); sys.exit(0 if ok else 1)"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24611-ac4-integrated
    description: The running reading is recorded under context.evidence_readings after the install (the no-op result read back from the dev agent on h201 and the live agent's unit digest, 64 hex characters, before and after the install), with the host, the command and the UTC time it was read at. The check requires the result to be accepted, the two digests present and equal, and the host, command and time, so it is red until the unit is installed and the no-op ran, red when the live unit changed, and red for readings typed without their provenance. Rollout order (the key file on h201 before the unit is installed) is in the unit header and the summary above. The deploy-probe check that read the unit from GitHub is dropped from this criterion because it passed with nothing installed.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: |-
          python3 -c "import re,sys,yaml; r=(yaml.safe_load(open('contracts/OMN-24611.yaml')).get('context') or {}).get('evidence_readings') or {}; g=lambda k: str(r.get(k,'')); b=g('ac4_live_unit_digest_before'); a=g('ac4_live_unit_digest_after'); ok=g('ac4_noop_result') == 'accepted' and bool(re.fullmatch(r'[0-9a-f]{64}', b)) and b == a and bool(g('ac4_read_host')) and bool(g('ac4_read_command')) and bool(re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z', g('ac4_read_time'))); sys.exit(0 if ok else 1)"
        cwd: ${OMNI_HOME}/omnibase_infra
