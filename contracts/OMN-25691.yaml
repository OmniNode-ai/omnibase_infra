schema_version: "1.0.0"
ticket_id: OMN-25691
title: Unblock CI Summary on omnibase_infra PR 6063
summary: Resolve the forwarder's frozen Core dependency and verify the new PR head.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25691-ci-summary
    statement: Prove the forwarder's frozen dependency and read the CI verdict for the new head.
    acceptance:
      - id: AC1
        statement: >-
          AC1: omnibase_infra PR 6063 reads a clean merge state against its base and the required check CI Summary reads success at its new head, with the new head named in a PR comment that starts `Lab: head=<full head sha>` -- falsifier: `onex scm pr-checks OmniNode-ai/omnibase_infra#6063` shows a required context not success at the head, or `onex scm pr-view OmniNode-ai/omnibase_infra#6063` shows a merge state other than clean, or no Lab comment names that head
      - id: AC2
        statement: >-
          AC2: when the cause lies outside the PR, a STATUS row reads cause=<one line> shared=yes with the evidence and the lane pushes nothing that widens or skips a check -- falsifier: `grep -F 'omnibase_infra#6063' "$ONEX_LEDGER_PATH" | grep -F 'shared=yes'` finds no STATUS row while the PR head is unchanged and still red or conflicting
evidence_requirements:
  - kind: tests
    description: Install the frozen dependencies and exercise the HTTPS forwarder's shared identity.
    command: uv run --frozen pytest tests/unit/nodes/node_bus_forwarder_effect/test_https_ingest_omn16459.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25691-deploy-forwarder-identity
    description: The frozen install supplies the shared Core implementation and the HTTPS forwarder identity tests pass.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_bus_forwarder_effect/test_https_ingest_omn16459.py -q -n 0 --no-cov
        cwd: .
  - id: dod-omn25691-shared-cause
    description: If the original red head remains, the private ledger records the shared cause for this PR.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -ec '
          head=$(onex scm pr-view OmniNode-ai/omnibase_infra#6063 --source local | jq -er ".result.head_sha");
          if [ "$head" = da6b9bee6b43d17684b0e45960ee6383251827ee ]; then
          grep -F " | STATUS | " "${ONEX_LEDGER_PATH:?}" |
          grep -F " | pr=omnibase_infra#6063 | " |
          grep -F " | shared=yes | " |
          grep -E " [|] cause=[^|]+";
          fi'
        cwd: .
