schema_version: "1.0.0"
ticket_id: OMN-15920
title: "Dev-lane branch install writes a declared entry point into the installed dist-info"
summary: "The dev runtime finds nodes through the onex.nodes entry points of the installed distributions. A file install copies source only, so a node a branch adds (omnimarket#6933 node_mcp_server_effect) is on disk and never discovered. A branch install can now declare entry points; the installer writes them into the container's dist-info entry_points.txt, reads them back, and reapplies them after a recreate."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn15920-entry-points
    statement: A dev-lane branch install can declare an entry point and the installer writes it into the installed dist-info, reads it back and reapplies it after a recreate.
    acceptance:
      - id: AC1
        statement: "AC1: a declared entry point is written into the installed entry_points.txt, listed by importlib.metadata, and other sections are untouched -- falsifier: pytest tests/unit/handlers/test_handler_dev_lane_branch_install_entry_points_omn15920.py -q"
      - id: AC2
        statement: "AC2: an install whose files are present but whose entry point is absent reads not whole, and a second apply writes nothing -- falsifier: pytest tests/unit/handlers/test_handler_dev_lane_branch_install_entry_points_omn15920.py -q"
evidence_requirements:
  - kind: tests
    description: The entry point tests pass at the pushed head.
    command: uv run pytest tests/unit/handlers/test_handler_dev_lane_branch_install_entry_points_omn15920.py tests/integration/handlers/test_handler_dev_lane_branch_install_entry_points_omn15920.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn15920-installer-ac1
    description: 'AC1: the declared entry point is written, listed by importlib.metadata, and other sections are kept.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_dev_lane_branch_install_entry_points_omn15920.py -q -k "written_and_read_back or register_flag"
        cwd: .
  - id: dod-omn15920-installer-ac2
    description: 'AC2: a missing entry point fails the install readback; a second apply writes nothing; a recreate is reapplied.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_dev_lane_branch_install_entry_points_omn15920.py tests/integration/handlers/test_handler_dev_lane_branch_install_entry_points_omn15920.py -q -k "missing_entry_point or second_apply or recreated_container"
        cwd: .
