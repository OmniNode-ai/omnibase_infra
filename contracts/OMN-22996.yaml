schema_version: "1.0.0"
ticket_id: OMN-22996
title: "A dev lane put on an unmerged branch for proof returns to dev through the deploy agent when that branch's pull request merges"
summary: "The return-to-dev node (node_dev_lane_return_to_dev_effect) reads the dev deploy agent's job records, records the build of an open pull request's branch (repository, pull request, branch, head, requester, job, expiry at most seven days out), and says when the lane is due to go back: the pull request merged to dev, its branch is gone from origin, or the record expired, while the lane still runs the branch. It then hands the agent the one runtime rebuild at the tracking ref, named agent/return-to-dev, at most once an hour and never under a hold. This change delivers the node; the agent calling it on its idle tick is the remaining step and is blocked by the canonical-file-shape ratchet, which refuses any growth of deploy_agent/agent.py."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22996-return-to-dev
    statement: A dev lane built from an unmerged pull request's branch goes back to dev's head through the deploy agent by itself once that pull request merges or closes.
    acceptance:
      - id: AC1
        statement: "AC1: every install of a branch on a dev lane records the branch and its pull request, and when that pull request merges or closes the lane is redeployed to dev's current head through the deploy agent with no person, with a failing control replaying tonight's case -- falsifier: uv run pytest of the return-to-dev node's tests plus a read of the lane's running revision after a merge"
evidence_requirements:
  - kind: tests
    description: The handler tests run over real git clones and the agent's job record shape and replay the 2026-11-07 case (a squash-merged pull request while the lane runs its branch head); the control with no declared build starts no return.
    command: uv run --frozen pytest tests/unit/handlers/test_handler_dev_lane_return_to_dev_omn22996.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22996-return-to-dev-tests
    description: The node's handler tests (job records, record, settle over real git, the hour between attempts, the command line) and its contract and command-line integration tests pass at the head. They replay the squash-merged pull request that left the lane on its branch and see one agent/return-to-dev rebuild command at the tracking ref; the control with no declared build, an open pull request, a lane already on dev, a hold and a second attempt inside the hour return no command. The agent's idle tick calling the node is not in this change.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_dev_lane_return_to_dev_omn22996.py tests/integration/handlers/test_handler_dev_lane_return_to_dev_omn22996.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22996-running-revision-after-merge
    description: After a branch build of a pull request on the dev lane and that pull request's merge, the dev runtime containers report an image revision that contains the merge commit and the agent journal names agent/return-to-dev for the job. The probe prints no secret.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" "journalctl --user -u deploy-agent-dev --since '-6 hours' --no-pager | grep -c 'as agent/return-to-dev'"
        cwd: ${OMNI_HOME}/omnibase_infra
