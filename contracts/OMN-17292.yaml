  - id: dod-omn-17292-ac4-auto-merge-skip-draft
    description: The Enable auto-merge step skips a draft PR before the arming call and still arms a ready PR; the merge base has no draft guard.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_auto_merge_skip_draft_omn17292.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC4]
  - id: dod-omn-17292-ac5-runtime-image-cve-floors
    description: The builder stage upgrades filelock to >=4.2.1 after the torch install and the npm bundle loop patches undici to 6.29.1; the merge base has no filelock upgrade and patches undici at 6.28.1.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_runtime_image_cve_floors_omn17292.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC5]
  - id: dod-omn-17292-ac5-deploy-runtime-image-cve-floors
    description: Deploy-scope DoD for docker/Dockerfile.runtime. Reads the content of docker/Dockerfile.runtime at commit 1e3541916b1814583f9031bdf9bec274c9af9c79 through the GitHub content API and asserts the undici@6.29.1 pack spec and the "filelock>=4.2.1" upgrade are both present; it exits nonzero on the merge base, which has neither.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/Dockerfile.runtime?ref=1e3541916b1814583f9031bdf9bec274c9af9c79" --jq .content | base64 -d | awk '/undici@6\.29\.1/{u=1} /"filelock>=4\.2\.1"/{f=1} END{exit !(u&&f)}'
    binds_ac: [AC5]
