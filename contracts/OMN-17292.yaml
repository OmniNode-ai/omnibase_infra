    statement: .github/omnimarket-contract-pin.yaml carries the value this refresh produced.
    acceptance:
      - id: AC1
        statement: "AC1: .github/omnimarket-contract-pin.yaml carries the refreshed value -- falsifier: grep -qF -- 'omnimarket_contract_ref: a80a980fe47398fb59df047f4f1fcd311626b185' .github/omnimarket-contract-pin.yaml"
  - id: req-pin-handoff
    statement: The pinned contracts must remain compatible with the reader-coverage gate.
    acceptance:
      - id: AC2
        statement: Reader coverage resolves placed local-page component bindings, refuses unreadable pages, and validates read_all_rows against the pinned boolean reader field.
      - id: AC3
        statement: The Credentials page captured at the pinned Omnidash revision counts as a reader of the tenant-credentials projection.
evidence_requirements:
