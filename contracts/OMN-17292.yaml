    binds_ac: [AC2]
  - id: dod-omn-17292-deploy
    description: The hosted runner reads the runtime port at the checked-out commit from GitHub; the source probe fails without the named_tests argument and refusal. This checks the published source, not a running lane deployment.
    source: manual
    checks:
