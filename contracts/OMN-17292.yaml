schema_version: "1.0.0"
ticket_id: OMN-17292
title: "The omnimarket contract pin advances to c7cd6a481acfe7e8c0821a5d5149d592efa556c0"
summary: The automated refresh moves .github/omnimarket-contract-pin.yaml to a value the merge base does not carry.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17292
    statement: .github/omnimarket-contract-pin.yaml carries the value this refresh produced.
    acceptance:
      - id: AC1
        statement: "AC1: the omnimarket contract pin, the omnimarket sibling pin and every inline omnimarket checkout ref carry c7cd6a481acfe7e8c0821a5d5149d592efa556c0 -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin_advance_omn17292.py -q"
  - id: req-omn17292-dashboard-owner-lane
    statement: The lane table generator declares a port row and a boundary row for the dashboard-owner lane the private lane census declares, so the lab-overlay parity job reads no undeclared lane.
    acceptance:
      - id: AC2
        statement: "AC2: the generator's port map marks the dashboard-owner lane's ports undeclared, its boundary rules the lane out as a proof lane and as a stability/prod grant source, and undeclared_lanes reports nothing for a manifest that declares it -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/unit/scripts/test_lane_block_dashboard_owner_omn17292.py -q"
  - id: req-omn17292-sustained-load-warmup
    statement: The sustained-load benchmark measures steady state, so a one-off stall before the first measured interval cannot red Performance Microbenchmarks and Nightly Summary on dev.
    acceptance:
      - id: AC3
        statement: "AC3: with a blocking 1.2s stall injected on the first publish, test_sustained_5_second_load passes because the stall lands in the discarded warm-up interval -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/performance/event_bus/test_event_bus_load_cold_stall_omn17292.py -m performance -n 0 -p no:randomly -q"
  - id: req-omn17292-auto-merge-skip-draft
    statement: The Auto-Merge workflow's Enable step returns before the arming call when the PR is a draft, so a draft's check_suite completion no longer fails the Enable Auto-Merge job red on dev.
    acceptance:
      - id: AC4
        statement: "AC4: the Enable auto-merge step reads isDraft before gh pr merge and exits 0 for a draft without calling gh pr merge, while a ready PR still reaches the arming call -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_auto_merge_skip_draft_omn17292.py -q"
  - id: req-omn17292-hostile-reviewer-lan-label
    statement: The Hostile Reviewer job's trusted fallback runner set requires arch-amd64, a label the LAN amd64 action pools carry and the off-LAN h203-light runners do not, so the job cannot land where the review voters are unreachable.
    acceptance:
      - id: AC5
        statement: "AC5: the hostile-review job's runs-on falls back to [self-hosted, omnibase-ci, arch-amd64], and that label set is not a subset of the h203-light runners' labels -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_hostile_review_runner_and_degraded_omn17492.py -q -n 0"
  - id: req-omn17292-runtime-image-cve-floors
    statement: The runtime image upgrades filelock and npm's bundled undici past their HIGH CVEs, so the Trivy scan in Build runtime stability-candidate no longer fails on dev.
    acceptance:
      - id: AC6
        statement: "AC6: the builder stage upgrades filelock to >=4.2.1 after the PyTorch-index torch install, and the npm bundle patch loop overwrites undici at a ^6 release >=6.29.1 -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_runtime_image_cve_floors_omn17292.py -q"
  - id: req-omn17292-lease-ratchet-reconciliation
    statement: The unmerged lease projection migration reconciles a pre-existing table before granting its writer access, without changing ratchet policy or its baseline.
    acceptance:
      - id: AC7
        statement: "AC7: the lease projection migration reconciles every declared column and preserves its primary key, fence/state checks and writer grants on fresh and drifted PostgreSQL tables; repeated apply preserves rows -- falsifier: ONEX_MIGRATION_PROOF_REQUIRE_PG=1 uv run --frozen pytest tests/integration/migrations/test_lease_projection_shape_omn17292.py -q -n 0 --no-cov"
  - id: req-omn17292-lease-acquire-cleanup
    statement: Failed acquire cleanup reports an unsuccessful revoke without replacing the original transaction error, and a refused acquire revokes its unused lease.
    acceptance:
      - id: AC8
        statement: "AC8: a transaction failure followed by revoke failure logs the remaining lease risk and raises the original transaction error; unsuccessful slot comparisons revoke the unused lease before refusal -- falsifier: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/lease/test_lease_store_acquire_omn21424.py -q"
evidence_requirements:
  - kind: tests
    description: The contract pin, sibling pin and every inline omnimarket checkout ref carry c7cd6a481acfe7e8c0821a5d5149d592efa556c0.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin_advance_omn17292.py -q"
  - kind: tests
    description: The lane table generator declares the dashboard-owner lane's port and boundary rows.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/unit/scripts/test_lane_block_dashboard_owner_omn17292.py -q"
  - kind: tests
    description: A first-publish stall lands in the sustained-load benchmark's discarded warm-up interval.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/performance/event_bus/test_event_bus_load_cold_stall_omn17292.py -m performance -n 0 -p no:randomly -q"
  - kind: tests
    description: The Enable auto-merge step skips a draft PR before the arming call and still arms a ready PR.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_auto_merge_skip_draft_omn17292.py -q"
  - kind: tests
    description: The hostile-review job's trusted fallback requires arch-amd64, which the h203-light runners lack.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_hostile_review_runner_and_degraded_omn17492.py -q -n 0"
  - kind: tests
    description: The runtime image upgrades filelock past CVE-2026-112940 and npm's bundled undici past CVE-2026-109869.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_runtime_image_cve_floors_omn17292.py -q"
  - kind: tests
    description: The existing column reconciliation gate accepts the lease projection migration, and real PostgreSQL fresh/drifted apply proofs preserve its constraints and writer access.
    command: "uv run --frozen pytest tests/ci/test_node_migration_shape_reconciliation.py tests/integration/migrations/test_lease_projection_shape_omn17292.py -q -n 0 --no-cov"
  - kind: manual
    description: Deploy check runs the existing lease migration reconciliation case on a hosted runner with no live runtime or database access.
    command: "deploy: uv run --frozen pytest 'tests/ci/test_node_migration_shape_reconciliation.py::test_guarded_create_table_reconciles_every_declared_column[node:node_projection_lease:0000_create_lease_projection.sql]' -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-17292-ac1
    description: The contract pin, sibling pin and every inline omnimarket checkout ref carry c7cd6a481acfe7e8c0821a5d5149d592efa556c0.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin_advance_omn17292.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn-17292-ac2-dashboard-owner-lane
    description: The lane table generator declares the dashboard-owner lane's port and boundary rows; the merge base has neither.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/unit/scripts/test_lane_block_dashboard_owner_omn17292.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
  - id: dod-omn-17292-ac3-sustained-load-warmup
    description: A first-publish stall lands in the sustained-load benchmark's discarded warm-up interval; at the merge base it lands in measured interval 1 and the variance assertion fails.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/performance/event_bus/test_event_bus_load_cold_stall_omn17292.py -m performance -n 0 -p no:randomly -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC3]
  - id: dod-omn-17292-ac4-auto-merge-skip-draft
    description: The Enable auto-merge step skips a draft PR before the arming call and still arms a ready PR; the merge base has no draft guard.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_auto_merge_skip_draft_omn17292.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC4]
  - id: dod-omn-17292-ac5-hostile-reviewer-lan-label
    description: The hostile-review job's trusted fallback requires arch-amd64, which the h203-light runners lack; at the merge base the fallback is [self-hosted, omnibase-ci], which an h203-light runner satisfies.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_hostile_review_runner_and_degraded_omn17492.py -q -n 0"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC5]
  - id: dod-omn-17292-ac6-runtime-image-cve-floors
    description: The builder stage upgrades filelock to >=4.2.1 after the torch install and the npm bundle loop patches undici to 6.29.1; the merge base has no filelock upgrade and patches undici at 6.28.1.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_runtime_image_cve_floors_omn17292.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC6]
  - id: dod-omn-17292-ac6-deploy-runtime-image-cve-floors
    description: Deploy-scope DoD for docker/Dockerfile.runtime. Reads the content of docker/Dockerfile.runtime at the checked-out commit of the tree under test through the GitHub content API and asserts the undici@6.29.1 pack spec and the "filelock>=4.2.1" upgrade are both present; it exits nonzero when run in the merge base's tree, which has neither.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/Dockerfile.runtime?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | awk '/undici@6\.29\.1/{u=1} /"filelock>=4\.2\.1"/{f=1} END{exit !(u&&f)}'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC6]
  - id: dod-omn17292-ac7-lease-ratchet
    description: Real PostgreSQL applies the lease projection migration twice on fresh and drifted tables, verifies its constraints and writer insert/upsert, and refuses invalid fences and states.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "ONEX_MIGRATION_PROOF_REQUIRE_PG=1 uv run --frozen pytest tests/integration/migrations/test_lease_projection_shape_omn17292.py -q -n 0 --no-cov"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC7]
  - id: dod-omn17292-ac7-deploy-lease-shape
    description: Hosted-runner deploy check for the new lease SQL runs the existing reconciliation gate's exact lease case. It fails on the original migration's seven missing reconciliations and on dev where that migration case is absent; no live lane or private network is needed.
    source: manual
    checks:
      - check_type: command
        check_value: "uv run --frozen pytest 'tests/ci/test_node_migration_shape_reconciliation.py::test_guarded_create_table_reconciles_every_declared_column[node:node_projection_lease:0000_create_lease_projection.sql]' -q -n 0 --no-cov"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC7]
  - id: dod-omn17292-ac8-acquire-cleanup
    description: Inject transaction and revoke HTTP failures and assert that cleanup logs the lease expiry risk while preserving the transaction error; refuse two occupied slots and assert one revoke before returning lease-refused.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/lease/test_lease_store_acquire_omn21424.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC8]
  - id: dod-omn17292-ac8-deploy-acquire-cleanup
    description: Hosted-runner deploy check exercises the lease acquire cleanup through an injected HTTP transport, without a container daemon or private network. It fails if revoke errors are silent or replace the transaction error.
    source: manual
    checks:
      - check_type: command
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/lease/test_lease_store_acquire_omn21424.py -q"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC8]
