schema_version: "1.0.0"
ticket_id: OMN-17292
title: "The omnimarket contract pin advances to v0.4.319"
summary: The automated refresh moves .github/omnimarket-contract-pin.yaml to a value the merge base does not carry.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17292
    statement: .github/omnimarket-contract-pin.yaml carries the value this refresh produced.
    acceptance:
      - id: AC1
        statement: "AC1: the omnimarket contract pin, the omnimarket sibling pin and every inline omnimarket checkout ref carry v0.4.319 -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin_advance_omn17292.py -q"
  - id: req-omn17292-dashboard-owner-lane
    statement: The lane table generator declares a port row and a boundary row for the dashboard-owner lane the private lane census declares, so the lab-overlay parity job reads no undeclared lane.
    acceptance:
      - id: AC2
        statement: "AC2: the generator's port map marks the dashboard-owner lane's ports undeclared, its boundary rules the lane out as a proof lane and as a stability/prod grant source, and undeclared_lanes reports nothing for a manifest that declares it -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/unit/scripts/test_lane_block_dashboard_owner_omn17292.py -q"
  - id: req-omn17292-predecessor-sha
    statement: The forward-only guard reads the base revision's commit-sha pin as the predecessor while the committed pin stays a release tag.
    acceptance:
      - id: AC3
        statement: "AC3: the resolver returns a base pin's commit sha for the predecessor read and still refuses a sha or a branch as the committed pin -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin.py -q -k predecessor"
evidence_requirements:
  - kind: tests
    description: The contract pin, sibling pin and every inline omnimarket checkout ref carry v0.4.319.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin_advance_omn17292.py -q"
  - kind: tests
    description: The lane table generator declares the dashboard-owner lane's port and boundary rows.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/unit/scripts/test_lane_block_dashboard_owner_omn17292.py -q"
  - kind: tests
    description: The resolver reads the base pin's commit sha as the predecessor and keeps the committed pin tag-only.
    command: "env -u PYTHONPATH uv run --frozen pytest tests/ci/test_omnimarket_contract_pin.py -q -k predecessor"
