      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_service_delegation_dispatch_port.py -q -k 'accepts_absent_optional_bus_features or rejects_unsupported_bus_features'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
