schema_version: 1.0.0
ticket_id: OMN-17292
title: Omnimarket contract pin handoff preserves dispatch and reader compatibility
summary: Advance the omnimarket contract pin with its database declaration handoff, optional dispatch keyword compatibility and the matching Omnidash reader surface.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-pin-handoff
    statement: The pinned contracts must remain compatible with the runtime dispatch port and reader-coverage gate.
    acceptance:
      - id: AC1
        statement: The runtime dispatch port accepts model=None and rejects explicit model overrides while its canonical request wire has no model field.
      - id: AC2
        statement: Reader coverage resolves placed local-page component bindings, refuses unreadable pages, and validates read_all_rows against the pinned boolean reader field.
      - id: AC3
        statement: The Credentials page captured at the pinned Omnidash revision counts as a reader of the tenant-credentials projection.
evidence_requirements:
  - kind: tests
    description: The runtime dispatch port accepts model=None and rejects explicit model overrides while its canonical request wire has no model field.
    command: uv run pytest tests/unit/runtime/test_service_delegation_dispatch_port.py -q -k 'accepts_absent_optional_bus_features or rejects_unsupported_bus_features'
  - kind: tests
    description: Reader coverage resolves placed local-page component bindings, refuses unreadable pages, and validates read_all_rows against the pinned boolean reader field.
    command: uv run pytest tests/unit/validators/test_omn17199_bus_backed_exposure_readers.py -q -k 'read_all_rows or local_pages'
  - kind: tests
    description: The Credentials page captured at the pinned Omnidash revision counts as a reader of the tenant-credentials projection.
    command: uv run pytest tests/ci/test_omnimarket_pin_handoff_omn17292.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
