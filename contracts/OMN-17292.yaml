      - check_type: test_passes
        check_value: uv run pytest tests/unit/validators/test_omn17199_bus_backed_exposure_readers.py -q -k 'read_all_rows or local_pages'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
