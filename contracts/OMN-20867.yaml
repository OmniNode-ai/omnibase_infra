schema_version: "1.0.0"
ticket_id: OMN-20867
title: The dev lane's main runtime publishes the runtime tick
summary: The dev lane compose overlay sets ONEX_RUNTIME_SCHEDULER_ENABLED to true on omninode-runtime only, so the tick producer starts on that lane; the wiring test now covers the dev lane overlay.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20867-dev-lane-tick
    statement: The dev lane's main runtime opts in to the runtime scheduler and no secondary role on that lane carries the switch.
    acceptance:
      - id: AC1
        statement: 'AC1: the dev lane overlay sets the flag on omninode-runtime only and joins the opted-in overlay set -- falsifier: uv run pytest tests/unit/runtime/test_runtime_scheduler_wiring.py -q'
  - id: req-omn20867-pr-status-poller
    statement: With the tick on, the GitHub PR poller publishes only PR status events to onex.evt.github.pr-status.v1, and a tick that polls nothing publishes nothing.
    acceptance:
      - id: AC4
        statement: 'AC4: the kernel-wired poller publishes no poll-cycle summary; an unconfigured or not-yet-due tick publishes nothing -- falsifier: uv run pytest tests/integration/runtime/test_github_pr_poller_publishes_only_status_events.py -q'
evidence_requirements:
  - kind: tests
    description: The scheduler wiring test covers the dev lane overlay.
    command: uv run pytest tests/unit/runtime/test_runtime_scheduler_wiring.py -q
  - kind: tests
    description: The kernel-wired poller publishes only PR status events.
    command: uv run pytest tests/integration/runtime/test_github_pr_poller_publishes_only_status_events.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20867-ac1
    description: The dev lane overlay sets ONEX_RUNTIME_SCHEDULER_ENABLED on omninode-runtime only.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_runtime_scheduler_wiring.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: grep -q 'ONEX_RUNTIME_SCHEDULER_ENABLED.*true' docker/docker-compose.dev-lane.yml
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-20867-ac4
    description: The kernel-wired GitHub PR poller publishes only PR status events, and nothing on a tick that polls nothing.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/runtime/test_github_pr_poller_publishes_only_status_events.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC4
  - id: dod-omn-20867-ac4-deploy
    description: The deployed dev lane runtime carries the poller fix, so it has the PR status poll event model and no longer has the poll-cycle summary model.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c "import importlib.util as u; from omnibase_infra.nodes.node_github_pr_poller_effect.models.model_github_pr_status_poll_event import ModelGitHubPrStatusPollEvent; assert u.find_spec('omnibase_infra.nodes.node_github_pr_poller_effect.models.model_github_poller_result') is None"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC4
