schema_version: "1.0.0"
ticket_id: OMN-20867
title: The dev lane's main runtime publishes the runtime tick
summary: The dev lane compose overlay sets ONEX_RUNTIME_SCHEDULER_ENABLED to true on omninode-runtime only, so the tick producer starts on that lane; the wiring test now covers the dev lane overlay.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20867-lane-env-fragment
    statement: The deploy agent's compose env and the dev lane's warm refresh overlay the operator env store with the per-lane env fragment read from the deployment overlay clone at origin/dev, and a process with no clone, no fragment, or a fence wider than the dev lane applies none, while a fragment outside the schema's allowlist is refused.
    acceptance:
      - id: AC3
        statement: 'AC3: the fragment reader allows exactly the six act switches, refuses a key outside the allowlist or a malformed fragment by name, reads the ref and not the working tree, and compose env overlays exactly the fragment keys for a dev-fenced agent only -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_lane_env_fragment_omn20867.py -q'
  - id: req-omn20867-dev-lane-tick
    statement: The dev lane's main runtime opts in to the runtime scheduler and no secondary role on that lane carries the switch.
    acceptance:
      - id: AC1
        statement: 'AC1: the dev lane overlay sets the flag on omninode-runtime only and joins the opted-in overlay set -- falsifier: uv run pytest tests/unit/runtime/test_runtime_scheduler_wiring.py -q'
  - id: req-omn20867-tick-slot
    statement: Each runtime tick carries the epoch-aligned slot it was due on as scheduled_at, and consecutive ticks tile the clock even when a publish runs late or fails.
    acceptance:
      - id: AC2
        statement: 'AC2: the tick loop stamps scheduled_at with the slot it was due on and schedules the next tick for the first slot after this tick''s now, so no schedule window is lost to a late tick -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/unit/runtime/test_runtime_scheduler.py tests/integration/runtime/test_runtime_tick_slot_alignment_omn20867.py -q'
evidence_requirements:
  - kind: tests
    description: The scheduler wiring test covers the dev lane overlay.
    command: uv run pytest tests/unit/runtime/test_runtime_scheduler_wiring.py -q
  - kind: tests
    description: The scheduler tests and the lane producer integration test prove each tick carries its slot and the ticks tile the clock under a slow or failed publish.
    command: env -u PYTHONPATH uv run --frozen pytest tests/unit/runtime/test_runtime_scheduler.py tests/integration/runtime/test_runtime_tick_slot_alignment_omn20867.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20867-lane-env-fragment
    description: The fragment tests fail on the merge base, which has no fragment reader in deploy_agent.instance_lanes, and pass at the pull request head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_lane_env_fragment_omn20867.py -q -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-20867-ac1
    description: The dev lane overlay sets ONEX_RUNTIME_SCHEDULER_ENABLED on omninode-runtime only.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_runtime_scheduler_wiring.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: grep -q 'ONEX_RUNTIME_SCHEDULER_ENABLED.*true' docker/docker-compose.dev-lane.yml
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-20867-ac2-tick-slot
    description: The runtime tick carries the slot it was due on; ticks tile the clock when a publish runs late or fails (omnibase_infra#4815).
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/unit/runtime/test_runtime_scheduler.py tests/integration/runtime/test_runtime_tick_slot_alignment_omn20867.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/runtime_scheduler.py?ref=b2a709fc04bddd6aea3cf134b870898ddb71f850' --jq .content | base64 -d | grep -F 'scheduled_at=scheduled_at or tick_time' >/dev/null
    binds_ac:
      - AC2
