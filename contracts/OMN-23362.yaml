schema_version: "1.0.0"
ticket_id: OMN-23362
title: "The lane-deploy preflight finds the prod-promotion grant registry in omnibase_infra, so a governed refresh is not refused as unreadable"
summary: >-
  scripts/preflight_lane_deploy_attribution.py reads the prod-promotion grant registry from this repository at config/prod_promotion_grants.yaml on origin/main. OMN-17427 (#5118) moved that read here and left the registry behind, so every governed-lane refresh failed closed with grant verdict UNREADABLE before it changed anything. This change restores the registry as the empty registry it replaced (entries: [], no grant and no approval), routes every change of the registry to the platform leads through .github/CODEOWNERS. The registry reaches origin/main, where the preflight reads it, with the next release.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23362-grant-registry-present
    statement: >-
      The grant registry the lane-deploy preflight reads exists in this repository, holds no grant and evaluates as CLEAR.
    acceptance:
      - id: AC1
        statement: >-
          AC1: omnibase_infra carries the prod-promotion grant registry at the path the preflight reads, with no entries, and the preflight evaluates it as readable with zero live grants -- falsifier: uv run pytest tests/unit/scripts/ -k grant_registry_present -q in omnibase_infra
      - id: AC2
        statement: >-
          AC2: once the registry reaches main through a release, a governed-lane dry-run refresh passes the attribution preflight without any grant acknowledgement -- falsifier: the dry run prints grant verdict CLEAR with 0 live grants and no REFUSED line
evidence_requirements:
  - kind: tests
    description: >-
      The registry is tracked at GRANTS_REPO_RELPATH, parses to exactly an empty entries list, evaluates as CLEAR with no live grant and no error through the preflight's own evaluate_grant_state, and changes to the registry route to code owners.
    command: uv run --frozen pytest tests/unit/scripts/test_grant_registry_present_omn23362.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23362-ac1-registry-present
    description: >-
      The ticket's falsifier. At the merge base there is no file at GRANTS_REPO_RELPATH and no code-owner rule for the registry, so all four tests fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/ -k grant_registry_present -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn23362-ac2-preflight-reads-clear
    description: >-
      Hosted stand-in for AC2: the preflight's own grant evaluator reads the tracked registry as CLEAR, which is the verdict the dry run prints once the file is on main. The governed-lane dry run is the lane proof and is not run by the hosted verifier. At the merge base the file does not exist, so the test fails.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/test_grant_registry_present_omn23362.py -q -n 0 -p no:cacheprovider -k reads_clear_in_the_preflight
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
