    description: >-
      Post-deploy probe: the rebuilt dev runtime container imports the overdue dev merge build handler this change adds. It reads the live container, which carries the module only after the deploy agent has rebuilt it from this change, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
