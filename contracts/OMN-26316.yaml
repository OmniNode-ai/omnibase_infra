        check_value: docker exec omninode-runtime python -c 'from omnibase_infra.handlers.handler_dev_merge_build_overdue import HandlerDevMergeBuildOverdue'
  - id: dod-omn26316-roll-proof-failure-names-exception
    description: "The recorded dev job errors of ae9ceb3d, 43b9fb72 and b571579b end at the runpy warning cut at unpredictabl; the same stderr shape, with the exception last, now yields a message that names the exception, inside the 240 character bound."
    source: manual
