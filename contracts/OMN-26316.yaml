schema_version: 1.0.0
ticket_id: OMN-26316
title: The dev runtime answers /health inside its compose start period on an image that carries the eval-results fixes, and a slow startup subsystem reports degraded instead of blocking the serve
summary: >-
  The runtime's /health server ran on the kernel's asyncio loop, so synchronous work on that loop left the probe with no answer and the container healthcheck read probe_unreachable. A new acceptor, HealthProbeAcceptor in handlers/http_mount, owns the health port and accepts on its own thread. It offers each connection to the loop. When the loop does not claim it within 4 s, the acceptor answers HTTP 503 with status degraded and the typed reason event_loop_unresponsive. The health gate, the boot guard, the compose wait and the start period are not changed, and the semantic healthcheck still fails that answer.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26316-health-answers-off-loop
    statement: The runtime answers /health within the probe timeout while its event loop is blocked, with a typed degraded reason, and no gate is weakened.
    acceptance:
      - id: AC1
        statement: "AC1: the call the runtime blocks on before it serves /health is measured from a reproduction on a lab host at omnimarket 9f421237 and named in the PR body under a section headed Measured startup block, with a stack or task-dump excerpt, the host and the UTC read time -- falsifier: onex scm pr-view of the PR shows no section headed Measured startup block holding a stack excerpt and a UTC read time"
      - id: AC2
        statement: "AC2: a regression test built from the recorded 09:10Z job record and agent journal excerpt (fixture path named in the PR) shows that a runtime whose slow startup subsystem never completes still serves /health inside the compose start period and reports degraded with a typed reason -- falsifier: uv run pytest tests -q -k startup_health_degraded fails at origin/main or origin/dev and passes on the PR branch"
      - id: AC3
        statement: "AC3: the health gate, the boot guard, the compose wait and the compose start period are unchanged by the PR -- falsifier: git diff origin/dev --stat on the PR branch lists no health gate setting, no boot guard file, no compose file and no wait setting, run with uv run pytest tests -q -k startup_health_degraded"
  - id: req-omn26316-lazy-start-serving-read
    statement: The runtime's ready answer reports the lazy-start front door's serving set and failed wakes without changing readiness.
    acceptance:
      - id: AC4
        statement: "AC4: the contract_attach readiness detail carries a lazy_start block with the serving set, serving_count and each failed wake's reason, and ready is unchanged -- falsifier: uv run pytest tests/unit/runtime/test_lazy_start_serving_read_omn26316.py -q fails at the merge base (StoreLazyStartDormant has no record_front_door) and passes on the branch"
  - id: req-omn26316-hotwake-first-request-wakes-dormant
    statement: A first request on a dormant contract's HTTP mount, and a first message a client writes straight to the broker to a dormant consumer's topic, wakes that contract through the lazy-start front door; a request for no dormant contract wakes nothing.
    acceptance:
      - id: AC5
        statement: "AC5: a request under the http_mount prefix of a contract the lane left dormant wakes that contract, mounts its app and is served, once, with no broker; a failed wake answers 503 and leaves the listener up -- falsifier: uv run pytest tests/integration/handlers/http_mount/test_dormant_http_wake_omn26316.py fails at origin/dev with 404 and passes on the PR branch"
      - id: AC6
        statement: "AC6: the first message to a topic a dormant contract subscribes to, written by a client straight to the broker, wakes that contract's consumers; the watch is group-less and reads from the end -- falsifier: uv run pytest tests/unit/handlers/test_lazy_start_bus_watch_omn26316.py fails at origin/dev (the watch module is absent) and passes on the PR branch"
  - id: req-omn26316-boot-failure-cause
    statement: A boot failure's recorded cause is the error that ended the kernel; a per-message dispatch error logged on the kernel's logger is set apart and never recorded as the cause.
    acceptance:
      - id: AC10
        statement: "AC10: a kernel that exits 1 after the dispatch engine logged Dispatch completed with errors records no kernel error was logged before the exit, naming that last dispatch error, as the boot failure cause, and a kernel error logged before that dispatch error stays the cause -- falsifier: uv run pytest tests/unit/runtime/test_boot_failure_cause_omn26316.py fails at origin/dev (the capture records the dispatch error as the cause) and passes on the PR branch"
  - id: req-omn26316-first-heartbeat-not-held-by-serial-wake
    statement: The runtime's first heartbeat is published within one lazy-start wake budget of the start reaching its introspection step, however many dormant consumers subscribe to the heartbeat topic, so /ready reports heartbeat ready without a minutes-long hold.
    acceptance:
      - id: AC9
        statement: "AC9: the lazy-start front door wakes every dormant consumer of a published topic at once and holds the message for at most one budget -- falsifier: uv run pytest tests/unit/handlers/test_lazy_start_heartbeat_wake_omn26316.py fails at origin/dev (7.2 s against a 2.5 s window for 20 dormant heartbeat consumers, 4 of which never wake) and passes on the PR branch"
  - id: req-omn26316-overdue-dev-merge-build
    statement: A dev runtime merge that has gone its window with no dev build is judged REQUEST with one request id per sha, and a merge a dev job carries, a job in flight, a failed head or a non-runtime merge never is.
    acceptance:
      - id: AC11
        statement: "AC11: the overdue dev merge build decision judges omnibase_infra#6191 (merged 17:46:52Z, next dev job accepted 19:00:23Z) WAIT until 18:46:52Z and REQUEST from then until a dev job carries it -- falsifier: uv run pytest tests/unit/handlers/test_dev_merge_build_overdue_omn26316.py fails at origin/dev (the handler module is absent) and passes on the PR branch"
  - id: req-omn26316-roll-proof-failure-names-exception
    statement: A failed post-roll ledger proof records the exception that ended it, so the deploy job record names the cause of a restored roll and no lane has to reproduce the proof by hand.
    acceptance:
      - id: AC14
        statement: "AC14: a ledger proof whose stderr opens with the runpy RuntimeWarning and ends with an exception, including a stack longer than 2000 characters, fails the roll with a message that names that exception -- falsifier: uv run pytest tests/unit/handlers/test_handler_dev_boot_guard_proof_failure_tail_omn26316.py fails at origin/dev (the message ends at the warning, cut at unpredictabl) and passes on the PR branch"
evidence_requirements:
  - kind: tests
    description: The startup_health_degraded regression built from the recorded dev roll 1e15179f.
    command: uv run --frozen pytest tests/unit/services/test_startup_health_degraded_omn26316.py -q --no-cov -n 0 -p no:randomly
  - kind: tests
    description: The dormant HTTP mount and dormant topic watch regressions of the lazy-start front door.
    command: uv run --frozen pytest tests/integration/handlers/http_mount/test_dormant_http_wake_omn26316.py tests/unit/handlers/test_lazy_start_bus_watch_omn26316.py -q --no-cov -n 0 -p no:randomly
  - kind: tests
    description: The boot failure cause regression built from the dev boot ledger event of the 2026-11-23T20:52Z exit.
    command: uv run --frozen pytest tests/unit/runtime/test_boot_failure_cause_omn26316.py -q --no-cov -n 0 -p no:randomly
  - kind: tests
    description: The overdue dev merge build decision driven by the real job records of omnibase_infra#6191.
    command: uv run --frozen pytest tests/unit/handlers/test_dev_merge_build_overdue_omn26316.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26316-ac1-measured-startup-block
    description: "The recorded fixture holds the reproduction's main-thread stack excerpt, its UTC read time and the lab host; the PR body quotes it under Measured startup block."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: uv run --frozen python -c "import json; r = json.load(open('tests/fixtures/omn26316/dev_roll_1e15179f_startup_block.json'))['reproduction']; assert r['host'] == 'h053' and r['main_thread_stack_utc'].endswith('Z') and any('in bootstrap' in line for line in r['main_thread_stack']); from omnibase_infra.handlers.http_mount import HealthProbeAcceptor"
        cwd: .
  - id: dod-omn26316-ac2-startup-health-degraded
    description: "With the loop blocked past the probe timeout, /health answers inside the timeout and the start period with status degraded and degraded_reason event_loop_unresponsive; the test fails at origin/dev with no answer."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/services/test_startup_health_degraded_omn26316.py -k startup_health_degraded -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-ac3-gate-unchanged
    description: "The semantic container healthcheck still returns FAIL for the stalled-loop answer, and the change edits no compose file, boot guard, healthcheck setting or wait setting."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/services/test_startup_health_degraded_omn26316.py -k answers_while_loop_is_blocked -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-deploy-acceptor-live
    description: >-
      Post-deploy probe: the rebuilt dev runtime container imports the health acceptor this change adds, and its /health answers within 5 s with a JSON status. It reads the live container, which carries the module only after the deploy agent has rebuilt it from this change, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: docker exec omninode-runtime python -c 'from omnibase_infra.handlers.http_mount import HealthProbeAcceptor'
      - check_type: command
        check_value: bash -c 'docker exec omninode-runtime curl -s -m 5 http://localhost:8085/health | grep -q "\"status\""'
  - id: dod-omn26316-lazy-start-serving-read
    description: >-
      The contract_attach readiness detail carries a lazy_start block: the front door's serving set, its count and every failed wake with its reason. A woken contract raises serving_count by one, a failed wake is listed by name, and ready is unchanged. The test fails at the merge base (StoreLazyStartDormant has no record_front_door) and passes on the branch.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_lazy_start_serving_read_omn26316.py tests/integration/runtime/test_lazy_start_serving_read_composed_omn26316.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-integration-proof-lazy-serving
    description: >-
      Post-deploy probe: the rebuilt dev runtime's /ready answer carries supplemental_readiness.contract_attach.lazy_start with a serving_count. It reads the live container, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: bash -c 'docker exec omninode-runtime curl -s -m 5 http://localhost:8085/ready | grep -q "\"serving_count\""'
  - id: dod-omn26316-hotwake-http
    description: "A request under a dormant contract's http_mount wakes it, mounts its app and is served once; the failing control is the 404 the dev runtime answered for /projection-api/health."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/handlers/http_mount/test_dormant_http_wake_omn26316.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-hotwake-bus
    description: "The first message to a dormant consumer's topic wakes its consumers through a group-less watch that reads from the end."
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_lazy_start_bus_watch_omn26316.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-hotwake-deploy-live
    description: >-
      Post-deploy probe on the dev runtime host: the projection-api mount of node_projection_query_api_effect answers 200 on the runtime's HTTP port after the deploy agent rebuilt the container from this change. It reads the live container, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: bash -c 'test "$(curl -s -o /dev/null -w "%{http_code}" -m 30 http://localhost:8085/projection-api/health)" = 200'
  - id: dod-omn26316-boot-failure-cause
    description: "The capture sets the dispatch engine's records apart: the real ledger cause of the 823 s exit is the engine's own message, an exit after it records that no kernel error was logged, and a kernel error stays the cause."
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_boot_failure_cause_omn26316.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-boot-failure-cause-live
    description: >-
      Post-deploy probe: the rebuilt dev runtime container carries the capture that sets dispatch errors apart. It reads the live container, which carries the change only after the deploy agent has rebuilt it from this change, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: docker exec omninode-runtime python -c 'from omnibase_infra.runtime.entrypoint_preflight import KernelErrorCapture; assert KernelErrorCapture().cause == ""'
  - id: dod-omn26316-first-heartbeat-not-held
    description: >-
      Twenty dormant consumers of the heartbeat topic, four of which never finish waking: the first heartbeat published through the publish gate returns inside 2.5 s (one 1.0 s budget plus margin), where the serial wake took 7.2 s. The test fails at origin/dev and passes on the branch.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_lazy_start_heartbeat_wake_omn26316.py tests/integration/handlers/test_lazy_start_heartbeat_wake_composed_omn26316.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-integration-proof-heartbeat-ready
    description: >-
      Post-deploy probe: the rebuilt dev runtime's /ready answer carries a heartbeat row that is ready. It reads the live container, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: bash -c 'docker exec omninode-runtime curl -s -m 5 http://localhost:8085/ready | python3 -c "import json,sys; assert json.load(sys.stdin)[\"details\"][\"supplemental_readiness\"][\"heartbeat\"][\"ready\"] is True"'
  - id: dod-omn26316-integration-proof-boot-failure-cause
    description: "A separate Python process whose kernel logs the dispatch engine's record and exits 1 publishes the boot-failed event, and the event's cause is the no-kernel-error wording; a kernel error logged first stays the cause."
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_boot_failure_cause_integration_omn26316.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-boot-failure-cause-process-exit
    description: "A separate Python process whose kernel logs the dispatch engine's record and exits 1 publishes the boot-failed event with the no-kernel-error cause; the hosted runner runs it at the head and at the merge base."
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/runtime/test_boot_failure_cause_integration_omn26316.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26316-overdue-dev-merge-build
    description: "The decision reads the agent's recorded dev jobs and the merge time of omnibase_infra#6191: WAIT one second before the hour ends, REQUEST with one id per sha at it, and SATISFIED once the 19:00:23Z job completes; the stability job, the job accepted before the merge, a superseded job and a job pinned to another sha carry nothing."
    source: manual
