schema_version: "1.0.0"
ticket_id: "OMN-25104"
title: "The runtime account is granted the done_items table in the platform database settings"
summary: "omnibase_infra vendors omnimarket's node_projection_done_items migrations (0000_create_done_items.sql, 0001_grant_omninode_runtime_done_items.sql) into docker/migrations/forward/nodes/node_projection_done_items/ and grants omninode_runtime SELECT, INSERT and UPDATE on omninode_internal.done_items in every shipped topology profile, ahead of the omnimarket pull request that adds the node (the dashboard's Done figure projection). The grants are regenerated by scripts/generate_application_database_table_grants.py, with a bridge entry in src/omnibase_infra/topology/vendored_table_bridges.yaml and an _INTERIM_ENTRIES entry in tests/ci/test_supplemental_declaration_expiry_omn18863.py. Without them the runtime auto-wiring refuses the writer: 'principal omninode_runtime lacks declared SELECT on omninode_internal.done_items'."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-done-items-runtime-grants"
    statement: "Every shipped topology profile grants the runtime role done_items, the grant derivation reports no drift against the node's contract, and both node migrations are vendored and declared."
    acceptance:
      - id: "AC1"
        statement: "AC1: the regenerated platform topology lists done_items with select, insert and update for the runtime account in every instance that carries the others -- falsifier: uv run pytest tests/unit/topology/test_omn25104_done_items_vendor.py -q fails on dev, where declared_acl lists no grant for done_items"
      - id: "AC2"
        statement: "AC2: the two migrations are vendored with their ledger rows and migration classes and the application migration manifest validator prints PASS -- falsifier: uv run python scripts/validation/validate_application_migration_manifest.py exits 1 when a ledger row's sha256 differs from the vendored file"
      - id: "AC3"
        statement: "AC3: failing control: with the done_items entries removed from a profile's declared grants, the runtime's read of done_items is an empty set -- falsifier: the control case in tests/unit/topology/test_omn25104_done_items_vendor.py first asserts every profile grants done_items, so it fails on dev where no profile does"
evidence_requirements:
  - kind: "tests"
    description: "The vendor tests pass at the head; on the merge base the test file is absent."
    command: "uv run pytest tests/unit/topology/test_omn25104_done_items_vendor.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25104-infra-ac1"
    description: "AC1 hosted probe. Every profile grants the runtime role the done_items table and both migrations are vendored."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_omn25104_done_items_vendor.py -k runtime_role_may_read -q"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn25104-infra-ac2"
    description: "AC2 hosted probe. The two vendored migrations are present; the new test file is absent at the merge base, so the command fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_omn25104_done_items_vendor.py -k 'vendored or match_omnimarket' -q"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn25104-infra-ac3"
    description: "AC3 hosted probe. Removing the done_items grant empties the runtime's read; the case fails at the merge base, where no profile grants done_items."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_omn25104_done_items_vendor.py -k control -q"
        cwd: "."
    binds_ac: ["AC3"]
