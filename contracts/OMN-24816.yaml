schema_version: 1.0.0
ticket_id: OMN-24816
title: Omnibase_infra pull request 5948 fixes every blocking finding of its review and reads green on repo-evidence / dod-verify at a new head
summary: >-
  The review of the OMN-23967 change (the Popen wrapper in tests/conftest.py that gives test children the session LD_LIBRARY_PATH) found two tests that could not fail, an unaudited spawn that turned Tests (Split 13/15) red, a function-scoped patch that missed session-scoped spawns, an unmarked async test, a regression test that read execution_scope at item level only, and a missing fail-at-base run. This ticket's evidence is the corrected test file, the session-wide patch and the audit that stays green.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24816-review-findings-fixed
    statement: The tests that pin the LD_LIBRARY_PATH wrapper can fail, the wrapper covers every spawn through subprocess.Popen in the session, and the repository's spawn audit stays green.
    acceptance:
      - id: AC1
        statement: 'AC1: the no-session and env=None tests probe what the child sees and cannot pass vacuously -- falsifier: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov passes at the pushed head'
      - id: AC2
        statement: 'AC2: the focused file passes at the pushed head -- falsifier: the hosted run of uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov exits non-zero'
      - id: AC3
        statement: 'AC3: the wrapper is installed for the whole pytest process and spawn APIs it cannot reach are guarded -- falsifier: tests/ci/test_child_env_ld_library_path_omn23967.py::test_no_test_spawns_outside_the_popen_wrapper fails when a test calls os.posix_spawn'
      - id: AC4
        statement: 'AC4: the async test carries the asyncio marker and execution_scope is read on items and on checks -- falsifier: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov -k "async or execution_scope" runs the tests and a per-check execution_scope fixture is flagged'
      - id: AC5
        statement: 'AC5: the spawn audit that turned Tests (Split 13/15) red passes with the corrected test file -- falsifier: uv run pytest tests/unit/scripts/test_spawn_grandchild_audit.py -q --no-cov exits non-zero'
evidence_requirements:
  - kind: tests
    description: The focused file and the spawn audit.
    command: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py tests/unit/scripts/test_spawn_grandchild_audit.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24816-focused-file
    description: The focused file passes at the pushed head, covering the vacuity fixes, the bytes-keyed and positional cases and the spawn-API guard.
    source: manual
    binds_ac:
      - AC1
      - AC2
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn24816-async-and-scope
    description: The async test runs (not skipped) and the execution_scope guard reads both levels.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_child_env_ld_library_path_omn23967.py -q --no-cov --tb=line -k "async or execution_scope"
        cwd: .
  - id: dod-omn24816-spawn-audit
    description: The repository's spawn-grandchild audit passes with the corrected test file.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_spawn_grandchild_audit.py -q --no-cov --tb=line
        cwd: .
