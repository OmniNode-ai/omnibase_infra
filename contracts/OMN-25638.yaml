    description: >-
      The 0.47.75 item's folded check block equals the hook's wanted text, pinned from the recorded diff of job 134644048365.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_release_notes_apply_effect/test_handler_release_notes_apply.py -q --no-cov -n 0 -p no:cacheprovider -k folds_the_way_the_yamlfmt_hook_does
        cwd: .
  - id: dod-omn25638-ac2-focused-suite
    description: The whole focused writer suite passes on the branch.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_release_notes_apply_effect/test_handler_release_notes_apply.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
