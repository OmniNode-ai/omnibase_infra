    description: 'AC26152004: read on the dev runtime on omni-201 only after the deploy agent applies the merged change; hosted CI cannot reach it, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          ssh omni-201 '! docker logs --since 15m omninode-runtime 2>&1 | grep -q "\[INFO\] omnibase_infra.runtime.[a-z_]*: Dispatch started"'
        cwd: .
