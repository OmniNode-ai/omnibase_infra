schema_version: 1.0.0
ticket_id: OMN-26152
title: 'the dispatch engine writes no INFO line and builds no log context for a successful dispatch'
summary: 'On the dev runtime booted 2026-11-24T06:15:25Z, the log read 404,208 lines in 3,098 s and the engine''s own "Dispatch started" and "Dispatch completed successfully" were 319,692 of them (79.1% of the lines, 39,297,357 of 72,275,128 bytes) at 52.0 dispatches per second; each dispatch also validated a pydantic ModelDispatchLogContext five times (start, routing, executing, executed, completed) before any line was filtered. The success pair now logs at DEBUG and the five contexts are built only when DEBUG is enabled; a failed dispatch still logs at ERROR. This is the infra-owned share of the CPU of OMN-26152 only: the criteria on the ticket itself (AC1 to AC5, a py-spy or runtime-metrics profile, the biggest holder fixed, the dev-window install, before and after gap counts) stay open and are not claimed by this contract.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26152-dispatch-log-volume
    statement: A successful dispatch through the engine costs no INFO line and no log-context validation at the runtime's INFO level, and a failed dispatch is still logged at ERROR.
    acceptance:
      - id: AC26152001
        statement: 'AC26152001: a test replays the recorded tick fan-out (65 dispatches per tick, from the recorded dev log sample) at INFO level and finds no engine success line and no _build_log_context call -- falsifier: uv run pytest tests/unit/runtime/test_message_dispatch_engine_log_volume_omn26152.py -q -n 0 --no-cov -p no:cacheprovider passes at the unfixed base or fails at the fixed head'
      - id: AC26152002
        statement: 'AC26152002: the success pair is still written at DEBUG and a failed dispatch is still logged at ERROR at INFO level -- falsifier: the same test file fails at the fixed head'
      - id: AC26152003
        statement: 'AC26152003: the existing dispatch engine tests still pass -- falsifier: uv run pytest tests/unit/runtime/test_message_dispatch_engine.py -q -n 0 --no-cov -p no:cacheprovider reports a failure at the fixed head'
      - id: AC26152004
        statement: 'AC26152004: on the running dev runtime after the deploy agent applies the change, the log of omninode-runtime holds no INFO "Dispatch started" line in a 15 minute window -- falsifier: the probe command exits non-zero'
  - id: req-omn26152-applier-log-volume
    statement: A successful result apply and a successful intent execution cost no INFO line at the runtime's INFO level.
    acceptance:
      - id: AC26152005
        statement: 'AC26152005: a test built from the recorded 30 minute dev log sample (fixtures/omn26152/dev_runtime_log_sample_20261126T0607Z.json, 9,894 of 36,161 lines) finds no applier "Published output event" or "Delegated" line and no executor "Intent executed" line at INFO, and finds them at DEBUG -- falsifier: uv run pytest tests/unit/runtime/test_result_applier_log_volume_omn26152.py -q -n 0 --no-cov -p no:cacheprovider passes at the unfixed base or fails at the fixed head'
evidence_requirements:
  - kind: tests
    description: The OMN-26152 log volume test and the existing dispatch engine tests pass at the pushed head.
    command: uv run pytest tests/unit/runtime/test_message_dispatch_engine_log_volume_omn26152.py tests/unit/runtime/test_message_dispatch_engine.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26152-ac26152001
    description: 'AC26152001: the recorded tick fan-out at INFO writes no engine success line and builds no log context; the test file is absent at the merge base so the check fails there (must-fail control).'
    source: manual
    binds_ac:
      - AC26152001
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_message_dispatch_engine_log_volume_omn26152.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26152-ac26152002
    description: 'AC26152002: DEBUG still writes the success pair and the ERROR line of a failed dispatch is kept; the test file is absent at the merge base so the check fails there (must-fail control).'
    source: manual
    binds_ac:
      - AC26152002
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_message_dispatch_engine_log_volume_omn26152.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26152-ac26152003
    description: 'AC26152003: the existing engine tests pass beside the new test, so the check fails at the merge base where the new test file is absent (must-fail control).'
    source: manual
    binds_ac:
      - AC26152003
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_message_dispatch_engine_log_volume_omn26152.py tests/unit/runtime/test_message_dispatch_engine.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26152-ac26152004
