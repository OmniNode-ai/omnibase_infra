schema_version: "1.0.0"
ticket_id: OMN-24308
title: "Stop the uv git checkout pile at the source: prune the installed ref after the venv rebuild"
summary: "The atomic in-place venv install records the git revision each staged requirement names and, in its finalize step (reached only after the install passed its checks), removes the uv git checkout folder (and its .ok marker) of exactly those revisions from the uv cache, in git-v0 or git-v1 layout. A dry run, a failed stage and a rolled back install remove nothing. On lab host h101 the uv cache held 725 such checkouts, about 159 GB of 252.9 GB, one per omnimarket merge. The baselined install script is unchanged: the ratchet refuses growth there, so the behaviour sits in the node engine the script already calls."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24308-prune-installed-ref-checkout
    statement: The atomic install engine prunes exactly the installed ref's uv git checkout when finalize runs after a verified install and never on a dry run or a failed install.
    acceptance:
      - id: AC1
        statement: 'AC1: after a successful node-skill install step the uv cache git checkout of the installed omnimarket ref is removed and no other cache entry is touched -- falsifier: pytest tests/scripts/test_install_node_skill_package_uv_checkout_prune.py -q -k removes_installed_ref_checkout, which fails with the prune step taken out'
      - id: AC2
        statement: 'AC2: a dry run and a failed install remove nothing from the uv cache -- falsifier: pytest tests/scripts/test_install_node_skill_package_uv_checkout_prune.py -q -k dry_run_or_failed'
      - id: AC3
        statement: 'AC3: integrated: on h101 after a venv rebuild run through the declared installer the git-v0/checkouts folder gains no new revision folder and the free space of the data volume does not fall over 30 minutes -- falsifier: ls of the h101 uv git-v0/checkouts before and after the rebuild, and two df readings 30 minutes apart'
evidence_requirements:
  - kind: tests
    description: The prune tests and the existing install script tests pass at the head.
    command: uv run pytest tests/scripts/test_install_node_skill_package_uv_checkout_prune.py tests/scripts/test_venv_atomic_install_omn22712.py tests/scripts/test_install_node_skill_package.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24308-ac1
    description: 'AC1: the prune tests pass at the head; at the merge base the engine has no record_git_revisions or prune_git_checkouts, so the tests fail on the missing names.'
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_install_node_skill_package_uv_checkout_prune.py -q -k removes_installed_ref_checkout
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24308-ac2
    description: 'AC2: a stage that fails at its plan and a rollback leave the seeded checkout in place; only finalize prunes, and the script reaches finalize only after the verified install.'
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_install_node_skill_package_uv_checkout_prune.py -q -k dry_run_or_failed
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24308-ac3
    description: 'hosted proxy for AC3: the prune and the existing install script tests pass here; the h101 readings are posted as a pull request comment naming the head.'
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_install_node_skill_package_uv_checkout_prune.py tests/scripts/test_venv_atomic_install_omn22712.py tests/scripts/test_install_node_skill_package.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24308-deploy-source-readback
    description: |-
      Hosted-runner source-artifact readback: fetch the atomic install engine at the evaluated published commit and confirm the
      finalize path calls the prune and the stage path records the revision first. A missing file or symbol fails the command.
      No lab service, credentials or broker is required. This checks the published source artifact and does not assert a live
      runtime rollout; the h101 reading is the integrated criterion AC3.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnibase_infra/$(git rev-parse HEAD)/src/omnibase_infra/handlers/venv_atomic_install/atomic_venv_install.py" | grep -c 'prune_git_checkouts(stage_dir)' >/dev/null
  - id: dod-omn24308-integration-proof
    description: the prune tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/scripts/test_install_node_skill_package_uv_checkout_prune.py -q'
        cwd: ${OMNI_HOME}/omnibase_infra
