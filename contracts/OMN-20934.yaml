schema_version: "1.0.0"
ticket_id: OMN-20934
title: omnibase_infra lab tables, lane manifests and lab defaults move to the private overlay
summary: The pre-merge runtime pool table (config/prepr_runtime_pool.yaml) leaves the shipped repository; scripts/runtime_build/prepr_runtime_pool.py reads config/lab/prepr_runtime_pool.yaml under the workspace config root (ONEX_WORKSPACE_CONFIG_ROOT, else the runtime's workspace config owner) and refuses with the way to supply one when no overlay is present. Its tests run on a synthetic RFC 5737 fixture. The scripts/runner_fleet_event.py docstring stops naming a lab host.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20934
    statement: A lab table read by a shipped tool is resolved from the workspace config root and never from the shipped repository; without an overlay the tool fails loud and names how to supply one.
    acceptance:
      - id: AC2
        statement: "AC2: each table's validator and reader reads the private copy and fails loud without it, and generate_claude_lane_block.py regenerates the lane block from the private manifest -- falsifier: pytest focused tests for each repointed reader with and without ONEX_WORKSPACE_CONFIG_ROOT"
evidence_requirements:
  - kind: tests
    description: The pre-merge runtime pool reader resolves its table under ONEX_WORKSPACE_CONFIG_ROOT or the runtime's workspace config owner, and refuses with no overlay.
    command: uv run pytest tests/unit/scripts/test_prepr_runtime_pool_omn18893.py tests/unit/scripts/test_prepr_pool_pr_head_receipt_omn19566.py -q -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
