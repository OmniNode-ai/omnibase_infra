    description: The pool reader's tests prove resolution under ONEX_WORKSPACE_CONFIG_ROOT, under the runtime's workspace config owner, and the loud refusal with neither.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_prepr_runtime_pool_omn18893.py tests/unit/scripts/test_prepr_pool_pr_head_receipt_omn19566.py -q -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
