  - id: dod-omn21288-t5-ac2-no-event-lost-across-the-swap
    description: >-
      T5 AC2, no event published during the swap is lost and each is projected once. The writer contracts declare the retired container's consumer under consumer_group_handover (omnimarket dev), and auto-wiring seeds the runtime's group from it (OMN-21753, merged to dev). The hosted check runs the in-process group-offset scenario. The Redpanda scenario, tests/integration/event_bus/test_consumer_group_handover_redpanda_omn21288.py, was run on h201 against the pre-PR slot's broker (the lab dev lane's Redpanda; unit lw-f25bc4569e5e4d65) and errored at setup with KafkaConnectionError, because that broker takes SCRAM-SHA-256 clients only (docker-compose.dev-lane.yml KAFKA_SASL_MECHANISM) and the test opens plaintext clients; it is not in the hosted service-integration-suites list. The broker run and the live row count on one projection are owed to the post-merge dev proof through the deploy agent.
