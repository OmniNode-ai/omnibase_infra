  - id: dod-omn21288-ac7-failing-mount-fails-boot
    description: >-
      Run the failing-mount tests: a planted factory error, a factory that returns a non-ASGI value, an unimportable factory, a malformed declaration, overlapping prefixes and a prefix that would shadow a runtime route each raise RuntimeHostError from attach_manifest (the kernel returns exit code 1 on that error) with nothing mounted; a lifespan that fails to start turns every request, /health included, into a 503. The tests fail at the merge base because the mount module is absent.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/http_mount/test_asgi_mounts_omn21288.py -k "fails_boot or out_of_service or may_not_shadow or malformed" -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/handlers/http_mount/test_asgi_mount_live_port_omn21288.py -k planted_factory_error -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC7]
  - id: dod-omn21288-ac8-resolver-mount-served
    description: >-
      Run the resolver mount tests: the bridge contract.yaml is loaded through discover_contracts_from_paths, its http_mount block is built by the runtime's aiohttp server, and real GET /api/nodes/health and POST /api/nodes/contract.resolve requests on the bound port are answered by the resolver (a bad body answers 422). The tests assert the http_mount declaration the merge-base contract lacks, so the run fails there. No container is created or restarted by this check.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/http_mount/test_contract_resolver_mount_omn21288.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC8]
  - id: dod-omn21288-ac9-mount-before-wiring
    description: >-
      Drive the real bootstrap() with a real ServiceHealth on a free port and a wiring engine that blocks: while it is blocked, the bridge mount answers its health and a resolution (and /health still answers 503 because the runtime is not attached); with a planted factory error bootstrap returns 1 and the wiring engine is never called, and nothing listens on the port. At the merge base the health server starts after wiring, so the request is refused and the wiring engine is reached; the run fails there.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_service_kernel_early_http_mount_omn21288.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC9]
  - id: dod-omn21288-receipt-mode-ungrouped
    description: "The receipt-mode handler subscribes through subscribe_ungrouped and the in-memory bus shows no named group from it. 14 of the 33 tests in the file fail at the merge base, whose handler joins a receipt-mode-client.<hex12> group."
