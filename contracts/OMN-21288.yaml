        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: uv run --frozen mypy src/omnibase_infra/handlers/handler_receipt_mode_publish_await.py
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21288-receipt-mode-ungrouped-deploy-probe
    description: "Hosted-runner deployment check: load the deployed handler by its adapter import spec and exchange real bus envelopes over the in-memory transport. A stale reply with the current invocation must not be replayed, the immediate progress and action must arrive, no named reply group may be active, and the client must close. The named-group assertion fails with the merge-base handler. No running lane, broker credentials or lab rollout is claimed by this hosted check; the Kafka variant is also run on the lab broker."
    source: manual
    binds_ac: [AC21288102]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/handlers/test_receipt_mode_exchange_omn21341.py -k inmemory -q --no-cov -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
context:
  remaining_after_this_change: "AC2 end state: thirteen dev-stack services still run outside the runtime container and are listed in SEPARATE_SERVICES in the test; each leaves the list when its node runs inside the runtime."
  tenant_fold_proof: "Pending governed pre-PR slot boot with docker-compose.dev-tenant-fold.yml. No lane was redeployed by this lane."
  worker_integration: "The independently owned worker fold must preserve both overlays and union main.folded_profiles to [workers, tenant-projection]; then remove runtime-worker from SEPARATE_SERVICES as well. This branch never changes the worker branch."
  http_mount_remaining: "T16 omnibase_infra half only. The resolver's compose service is NOT retired here. The runtime serves the resolver on its own HTTP port (ONEX_HTTP_PORT, 8085 on the dev lane) under /api/nodes, while the compose service keeps answering on 8091. Remaining: (1) the live early-serve request on a proving lane is owed until the prepr-slot hold is released (slot proof owed); (2) point the dashboard proxy at the runtime port and retire the omninode-contract-resolver service in a later deploy step; (3) the intelligence-api http_mount declaration (omniintelligence) and its container retirement."
