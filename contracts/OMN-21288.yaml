context:
  remaining_after_this_change: "AC2 end state: eight dev-stack services still run outside the runtime container and are listed in SEPARATE_SERVICES in the test (effects, worker, projection-api, four consumers, the delegation writer); each leaves the list when its node runs inside the runtime."
  tenant_fold_proof: "No pre-PR slot can boot docker-compose.dev-tenant-fold.yml: the slot entrypoint composes infra, dev-lane and prepr only, and its workspace build fails the first-party source audit. The fold readings are owed to the post-merge dev proof through the deploy agent. No lane was redeployed by this lane."
  worker_integration: "The independently owned worker fold must preserve both overlays and union main.folded_profiles to [workers, tenant-projection]; then remove runtime-worker from SEPARATE_SERVICES as well. This branch never changes the worker branch."
