schema_version: "1.0.0"
ticket_id: "OMN-25674"
title: "The runner deploy prepares the disk-admission pause directory as the runner user so the job-started hook can record its own backoff"
summary: >-
  The runner compose files bind a host directory at the runner home's .onex-disk-admission-pause. Docker creates a missing bind source as root, mode 755, and the job-started hook runs as runner, so on hp051 it could not write its pause marker (Permission denied on hp051-ci-runner-3.tmp, 12 consecutive admission failures against a threshold of 3). The deploy's contract-backed directory effect (node_deploy_runners, HandlerDeployRunners), which already prepares each runner's TMPDIR bind with sudo install and reads owner and mode back, now prepares this bind too: owner uid 1001 (the runner user), mode 755, with the same discovery from the rendered compose, readback and refusal before registration. A bind mount shows the host owner at once, so running containers need no restart. No hook, gate, floor or compose declaration changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn25674-pause-dir-owner"
    statement: "The declared runner installer leaves the disk-admission pause directory owned by the runner user of the runner image, on every host it installs to."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: the deploy of a secondary host prepares the pause bind source of the rendered compose as uid 1001 mode 755, leaves other binds alone, and refuses before registration when the readback differs -- falsifier: uv run pytest tests/unit/scripts/test_deploy_runners_tmp_dirs_omn19998.py, red on the unchanged handler and green on the change
evidence_requirements:
  - kind: "tests"
    description: "The shipped deploy path against a modeled host: the pause bind source goes from uid 0 mode 755 to uid 1001 mode 755, one install for it, no install for other binds, a VERIFY refusal before registration."
    command: "env -u OMNI_HOME uv run --frozen pytest tests/unit/scripts/test_deploy_runners_tmp_dirs_omn19998.py -q -n 0 --no-cov"
