schema_version: "1.0.0"
ticket_id: "OMN-20910"
title: "Review-voter models are declared in a contract overlay, not repo variables or workflow files"
summary: "docker/lane-overlays/hostile-review-voters.yaml declares every Hostile Reviewer voter (endpoint via a dev.bifrost.yaml backend, model selection, sampling, focus, timeout, required). This repository's hostile-reviewer.yml reads it from the pull request's own checkout through omniintelligence's cli_review --voters-overlay and names no voter endpoint, port, model flag or endpoint variable; omnimarket and omniclaude read the same file from dev. The quorum rule and the fail-closed gate are unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-overlay-declares-voters"
    statement: "One contract overlay declares every review voter, and the gate resolves voters only from it."
    acceptance:
      - id: "AC1"
        statement: "AC1: the overlay declares each voter and every backend it names is bound in dev.bifrost.yaml; the review and preflight read it from the pull request checkout -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'overlay_backend or this_pull_requests_checkout or reads_the_overlay or from_the_overlay'"
  - id: "req-no-voter-endpoint-in-workflows"
    statement: "No workflow file names a review voter endpoint, port, model flag or endpoint variable."
    acceptance:
      - id: "AC3"
        statement: "AC3: a ratchet over every reviewer workflow finds no voter endpoint, port, model flag or endpoint variable, and finds all five lines of a known-bad fixture -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or retired_endpoint'"
evidence_requirements:
  - kind: "tests"
    description: "The overlay and the workflow tests pass at the head."
    command: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20910-ac1-overlay-declares-voters"
    description: "The overlay's backends are bound and the review and preflight read it from the pull request checkout."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'overlay_backend or this_pull_requests_checkout or reads_the_overlay or from_the_overlay'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac3-no-voter-endpoint"
    description: "No reviewer workflow names a voter endpoint; the ratchet's positive control finds the known-bad lines."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or retired_endpoint'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC3"]
