schema_version: "1.0.0"
ticket_id: "OMN-20910"
title: "Review-voter models are declared in a contract overlay, not repo variables or workflow files"
summary: "A review voters overlay declares every Hostile Reviewer voter (endpoint, model selection, sampling, focus, timeout, required). Since OMN-20923 the overlay is a private CI overlay, not a file of this repository; hostile-reviewer.yml fetches it at run time and reads it through omniintelligence's cli_review --voters-overlay, and names no voter endpoint, port, model flag or endpoint variable. The quorum rule and the fail-closed gate are unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-overlay-declares-voters"
    statement: "One contract overlay declares every review voter, and the gate resolves voters only from it."
    acceptance:
      - id: "AC1"
        statement: "AC1 (amended by OMN-20923): the review and preflight read the overlay from the private CI overlay, outside the pull request checkout -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'outside_the_workspace or reads_the_overlay or from_the_overlay'"
  - id: "req-no-voter-endpoint-in-workflows"
    statement: "No workflow file names a review voter endpoint, port, model flag or endpoint variable."
    acceptance:
      - id: "AC3"
        statement: "AC3: a ratchet over every reviewer workflow finds no voter endpoint, port, model flag or endpoint variable, and finds all five lines of a known-bad fixture -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or retired_endpoint'"
  - id: "req-no-voter-model-in-workflows"
    statement: "No reviewer workflow names a review voter model: no vars.*MODEL* reference, no model id literal, no MODEL env key bound to a literal."
    acceptance:
      - id: "AC4"
        statement: "AC4: the ratchet refuses a vars.<anything>MODEL reference, a model id literal and a MODEL env key bound to a literal, finds all five lines of a known-bad model fixture, and the new cases fail on the merge base -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
      - id: "AC5"
        statement: "AC5: the ratchet's test file runs as a step of the lint job that the required CI Summary context covers and as a check-only pre-commit hook -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
evidence_requirements:
  - kind: "tests"
    description: "The overlay and the workflow tests pass at the head."
    command: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20910-ac1-overlay-declares-voters"
    description: "The review and preflight read the overlay from the private CI overlay, outside the pull request checkout (amended by OMN-20923)."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'outside_the_workspace or reads_the_overlay or from_the_overlay'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac3-no-voter-endpoint"
    description: "No reviewer workflow names a voter endpoint; the ratchet's positive control finds the known-bad lines."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or retired_endpoint'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC3"]
  - id: "dod-omn20910-ac4-no-voter-model"
    description: "The widened ratchet refuses a model variable, a model id literal and a MODEL env literal, and no reviewer workflow carries one."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC4"]
  - id: "dod-omn20910-ac5-ratchet-wired"
    description: "The test file is a step of the lint job (covered by the required CI Summary context) and a pre-commit hook entry."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC5"]
