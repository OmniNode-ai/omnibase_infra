schema_version: "1.0.0"
ticket_id: "OMN-20910"
title: "Review-voter models are declared in a contract overlay, not repo variables or workflow files"
summary: "A review voters overlay declares every Hostile Reviewer voter (endpoint, model selection, sampling, focus, timeout, required). Since OMN-20923 the overlay is a private CI overlay, not a file of this repository; hostile-reviewer.yml fetches it at run time and reads it through omniintelligence's cli_review --voters-overlay, and names no voter endpoint, port, model flag or endpoint variable. The quorum rule and the fail-closed gate are unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-overlay-declares-voters"
    statement: "One contract overlay declares every review voter, and the gate resolves voters only from it."
    acceptance:
      - id: "AC1"
        statement: "AC1 (amended by OMN-20923): the review and preflight read the overlay from the private CI overlay, outside the pull request checkout -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'outside_the_workspace or reads_the_overlay or from_the_overlay'"
  - id: "req-no-voter-endpoint-in-workflows"
    statement: "No workflow file names a review voter endpoint, port, model flag or endpoint variable."
    acceptance:
      - id: "AC3"
        statement: "AC3: a ratchet over every reviewer workflow finds no voter endpoint, port, model flag or endpoint variable, and finds all five lines of a known-bad fixture -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or retired_endpoint'"
  - id: "req-no-voter-model-in-workflows"
    statement: "No reviewer workflow names a review voter model: no vars.*MODEL* reference, no model id literal, no MODEL env key bound to a literal."
    acceptance:
      - id: "AC4"
        statement: "AC4: the ratchet refuses a vars.<anything>MODEL reference, a model id literal and a MODEL env key bound to a literal, finds all five lines of a known-bad model fixture, and the new cases fail on the merge base -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
      - id: "AC5"
        statement: "AC5: the ratchet's test file runs as a step of the lint job that the required CI Summary context covers and as a check-only pre-commit hook -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
  - id: "req-review-tooling-by-dev-tag"
    statement: "The Hostile Reviewer reads omniintelligence by its newest dev-* tag, resolved and logged at run time, and hands the Claude API voters' key to the review step alone."
    acceptance:
      - id: "AC6"
        statement: "AC6: the clone step resolves the newest refs/tags/dev-* of omniintelligence with git ls-remote, logs the tag and its commit, fails closed when none exists, and reads no branch tip or pinned sha -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_dev_tag_key_omn20910.py -q -k clone_step"
      - id: "AC7"
        statement: "AC7: secrets.HOSTILE_REVIEW_ANTHROPIC_API_KEY is exported to the review step alone as ANTHROPIC_API_KEY and REVIEW_ANTHROPIC_API_KEY, and the preflight holds neither -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_dev_tag_key_omn20910.py -q -k 'claude_key or secret_expression'"
  - id: "req-no-repost-on-unchanged-diff"
    statement: "The Hostile Reviewer posts no new finding threads when the pull request's own diff is unchanged since a review the reviewer bot already posted."
    acceptance:
      - id: "AC8"
        statement: "AC8: the thread poster digests the PR's own added and removed lines, records the digest in its review, posts nothing when a github-actions[bot] review already carries it, and ignores the marker in any other account's review -- falsifier: uv run pytest tests/ci/test_post_hostile_review_threads.py tests/ci/test_post_hostile_review_threads_merge_only_omn20910.py -q -n 0 --no-cov -k diff_digest"
  - id: "req-review-judge-on-default-branch"
    statement: "The hostile-review judge (a workflow_run workflow, which GitHub runs only from the default branch) and the thread script modes it calls are on dev, while dev's thread gate keeps clearing a rejection with a reason."
    acceptance:
      - id: "AC9"
        statement: "AC9: hostile-review-judge.yml runs --read-request, --pending and --post-verdicts from base-branch code, skips download and judging when the triggering run uploaded no hostile-review-judge-request artifact and fails closed when the artifact listing fails, and the gate still clears a rejection with a reason and no verdict -- falsifier: uv run pytest tests/ci/test_hostile_review_judge_omn17427.py tests/ci/test_hostile_review_judge_workflow_omn17427.py tests/ci/test_hostile_review_judge_secret_boundary_omn17427.py -q -n 0 --no-cov"
  - id: req-overlay-only-voter-swap-original-ac2
    statement: The overlay alone selects each resolved voter model and endpoint; changing a model does not require a workflow edit.
    acceptance:
      - id: AC2
        statement: "AC2: Adding or swapping a voter is an overlay-only diff, proven by a test that changes the overlay model and asserts the resolved call target changes with no workflow edit -- falsifier: pytest test over the resolver with two overlay fixtures"
  - id: "req-rung-eval-env-example-backend-pin"
    statement: "The rung-eval host env template names the variables the cloud-openrouter rung reads since OMN-20974 (RUNG_EVAL_CLOUD_OPENROUTER_BACKEND_ID and RUNG_EVAL_DOGFOOD_TENANT_ID), commented and empty, and no longer names the retired BASE_URL, MODEL and API_KEY variables of that rung."
    acceptance:
      - id: "AC10"
        statement: "AC10: the env example carries both backend-pin names commented with empty values and none of the three retired cloud rung names -- falsifier: uv run pytest tests/unit/scripts/test_rung_eval_timer_units.py -q -n 0 --no-cov -p no:randomly -k 'value_free_environment or retired_cloud_rung' fails at the merge base"
evidence_requirements:
  - kind: "tests"
    description: "The overlay and the workflow tests pass at the head."
    command: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20910-ac1-overlay-declares-voters"
    description: "The review and preflight read the overlay from the private CI overlay, outside the pull request checkout (amended by OMN-20923)."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'outside_the_workspace or reads_the_overlay or from_the_overlay'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac3-no-voter-endpoint"
    description: "No reviewer workflow names a voter endpoint; the ratchet's positive control finds the known-bad lines."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or retired_endpoint'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC3"]
  - id: "dod-omn20910-ac4-no-voter-model"
    description: "The widened ratchet refuses a model variable, a model id literal and a MODEL env literal, and no reviewer workflow carries one."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC4"]
  - id: "dod-omn20910-ac5-ratchet-wired"
    description: "The test file is a step of the lint job (covered by the required CI Summary context) and a pre-commit hook entry."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC5"]
  - id: "dod-omn20910-ac6-dev-tag-read"
    description: "AC6. The clone step is executed against a fake git: it picks the newest dev-<UTC>-<sha12> tag, logs it, fails closed with none, and carries no branch tip or sha."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_dev_tag_key_omn20910.py -q -k clone_step"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC6"]
  - id: "dod-omn20910-ac7-claude-key-to-review-step"
    description: "AC7. The org secret reaches the review step alone under both names the voter code can read."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_dev_tag_key_omn20910.py -q -k 'claude_key or secret_expression'"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC7"]
  - id: "dod-omn20910-ac8-no-repost-unchanged-diff"
    description: "AC8. The poster records the PR diff digest, skips unchanged diffs already reviewed by github-actions[bot], and ignores other accounts' markers."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_post_hostile_review_threads.py tests/ci/test_post_hostile_review_threads_merge_only_omn20910.py -q -n 0 --no-cov -k diff_digest"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC8"]
  - id: "dod-omn20910-ac9-review-judge-on-default-branch"
    description: "AC9. The judge workflow and the thread script's judge modes run from the default branch; with no request artifact the judge does nothing; dev's gate rule for a rejection is unchanged."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_review_judge_omn17427.py tests/ci/test_hostile_review_judge_workflow_omn17427.py tests/ci/test_hostile_review_judge_secret_boundary_omn17427.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC9"]
  - id: dod-omn20910-original-ac1-overlay-removal
    description: The upstream resolver's CLI regression removes a voter from the overlay and proves the gate no longer calls it. This is a local dependency proof in omniintelligence, not a hosted deployment check.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q -n 0 --no-cov -k a_voter_removed_from_the_overlay_is_not_called
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac: [AC1]
  - id: dod-omn20910-original-ac2-overlay-only-swap
    description: The upstream resolver loads before/after overlay fixtures and proves a backend or Anthropic model swap changes the resolved call target without a workflow edit. This is a local dependency proof in omniintelligence.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q -n 0 --no-cov -k 'changing_anthropic_model_is_an_overlay_only_swap or changing_the_backend_changes_the_model_and_nothing_else'
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac: [AC2]
  - id: dod-omn20910-hrtg-hosted-deploy-check
    description: Hosted-runner check replays the refresh workflow's actual guard against failed/cancelled/timed-out and successful scheduled train events, permitting explicit manual dispatch without a live service, credential or network.
    source: manual
    checks:
      - check_type: command
        check_value: uv run --frozen pytest tests/ci/test_omnimarket_contract_tag_follows_train_omn17292.py -q -n 0 --no-cov -k only_a_successful
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: "dod-omn20910-ac10-rung-env-backend-pin"
    description: "AC10. The rung-eval env example names the backend-pin variables of the cloud rung and none of its retired variables."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/scripts/test_rung_eval_timer_units.py -q -n 0 --no-cov -p no:randomly"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC10"]
  - id: "dod-omn20910-deploy-rung-eval-env-example"
    description: "The change is a host env template and its test; the installed unit files are unchanged. The check reads the template the installer copies and fails when it still names a retired cloud rung variable or lacks a backend-pin name."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q '^# RUNG_EVAL_CLOUD_OPENROUTER_BACKEND_ID=$' deploy/rung-eval/rung-eval.env.example && grep -q '^# RUNG_EVAL_DOGFOOD_TENANT_ID=$' deploy/rung-eval/rung-eval.env.example && ! grep -qE 'RUNG_EVAL_CLOUD_OPENROUTER_(BASE_URL|MODEL|API_KEY)' deploy/rung-eval/rung-eval.env.example"
        cwd: "${OMNI_HOME}/omnibase_infra"
