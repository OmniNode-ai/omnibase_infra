schema_version: 1.0.0
ticket_id: OMN-24447
title: Dev runtime joins the roll window gate in its first boot wave
summary: >-
  The dev roll window gate node (node_dev_roll_window_gate_effect, omnimarket#6201) holds every dev deploy command on one hold topic. A consumer group that joins after a command was sent skips it, and on 2026-11-14 consumers of nodes outside the boot priority list joined 141 s to 284 s after the dev container start. The dev main boot priority list in contracts/services/runtime_policy.contract.yaml now names the gate node and docker/runtime-policy.env is rendered from it. Same change as OMN-24426 made for six lab command nodes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24447-gate-boot-priority
    statement: The dev main runtime joins the roll window gate's consumer in the first wave of the boot, ahead of every non-priority contract.
    acceptance:
      - id: AC1
        statement: "AC1: the dev main runtime policy names the roll window gate node as a priority contract and the rendered runtime policy env carries the same name -- falsifier: the new policy test fails on origin/dev's copy of the policy and passes on the branch"
      - id: AC2
        statement: "AC2: in a boot where the gate node is discovered after a dozen other contracts, its command topic is joined in the first wave, ahead of every non-priority contract -- falsifier: the bounded contract attach test with the gate name removed from the priority list fails"
      - id: AC3
        statement: "AC3: integrated: after the dev runtime restarts on the merged revision, the gate node's command topic group has one member within 150 seconds of the container start and a hold command sent through the deploy effect is read by it -- falsifier: read the consumer group on the dev broker after the roll; a group with 0 members at 150 seconds fails it"
evidence_requirements:
  - kind: tests
    description: The boot policy and the bounded contract attach tests.
    command: uv run --frozen pytest tests/unit/runtime/test_omn18087_boot_bound_and_policy.py tests/unit/runtime/auto_wiring/test_omn18087_bounded_contract_attach.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24447-ac1-policy-names-the-gate
    description: >-
      The dev main boot priority list in contracts/services/runtime_policy.contract.yaml names node_dev_roll_window_gate_effect and the committed docker/runtime-policy.env renders from it. Parent OMN-19998; precedent OMN-24426. The policy test fails at the merge base, where the list does not name the gate.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_omn18087_boot_bound_and_policy.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24447-ac2-first-wave
    description: >-
      With the real dev main boot policy and the gate discovered after twelve fillers, its topic is inside the priority waves and ahead of every filler; the test fails at the merge base, where the gate is not on the list.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn18087_bounded_contract_attach.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24447-ac3-integrated
    description: >-
      Deploy check the hosted runner can run: the policy env the deploy reads names the gate node in the dev main boot priority list and equals the render of the policy contract. The runtime read of the consumer group after the next roll is posted as a pull request comment naming the head and the revision running; it is not claimed by this check.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: grep -qE '^DEV_RUNTIME_MAIN_BOOT_PRIORITY_CONTRACTS=.*,node_dev_roll_window_gate_effect$' docker/runtime-policy.env
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: uv run --frozen python scripts/render_runtime_policy_env.py --check-env-file docker/runtime-policy.env
        cwd: ${OMNI_HOME}/omnibase_infra
