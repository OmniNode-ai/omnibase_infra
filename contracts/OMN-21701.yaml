schema_version: "1.0.0"
ticket_id: OMN-21701
title: "delta, merge-gate, decision-store and chain-retrieval effects drop the second handle argument"
summary: >-
  The OMN-21536 slice of omnibase_infra#5503, carried onto current dev with its acceptance items in this ticket's own contract instead of the shared contracts/OMN-21536.yaml. Seven handlers in five effect nodes (delta metrics, delta bundle (two), decision store (two), merge gate and chain retrieval) take one typed request. The delta and decision-store handlers read the correlation id from their payload; the merge-gate handler keeps the payload correlation id, falls back to the dispatch envelope id, and generates one only when both are absent; the chain retrieval handler takes the new frozen ModelChainRetrievalRequest. The five nodes leave the canonical handler-shape baseline with an adequacy receipt and a hand-flip proof each, and core's handler-shape validator reports seven findings over the five node directories on dev and none on this change.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21701-effects-handle-shape
    statement: >-
      Every handler of node_delta_metrics_effect, node_merge_gate_effect, node_delta_bundle_effect, node_decision_store_effect and node_chain_retrieval_effect takes one typed request, and its acceptance items live in contracts/OMN-21701.yaml.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the delta, merge-gate, decision-store and chain-retrieval effect handlers of omnibase_infra#5503 drop the second handle argument and the handler-shape count over them drops as the PR states -- falsifier: uv run pytest tests/unit -q over the touched handlers plus the handler-shape checker re-run on the PR paths
      - id: AC2
        statement: >-
          AC2: the PR's acceptance items live in contracts/OMN-21701.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21701.yaml and not contracts/OMN-21536.yaml
evidence_requirements:
  - kind: tests
    description: The seven handlers answer typed requests and the node tests still hold.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_delta_metrics_effect tests/unit/nodes/node_merge_gate_effect tests/unit/nodes/node_delta_bundle_effect tests/unit/nodes/node_decision_store_effect tests/unit/nodes/node_chain_retrieval_effect tests/unit/nodes/node_chain_learning tests/integration/nodes/test_typed_request_handlers_effects_omn21536.py -q -n 0 -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21701-ac1-typed-request
    description: >-
      The seven handlers take one request and carry its correlation id, and core's handler-shape validator reports no finding under the five node directories (seven on dev).
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_delta_metrics_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_merge_gate_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_delta_bundle_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_decision_store_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_chain_retrieval_effect/test_handle_typed_request_omn21536.py tests/integration/nodes/test_typed_request_handlers_effects_omn21536.py -q -n 0 -p no:cacheprovider --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape src/omnibase_infra/nodes/node_delta_metrics_effect src/omnibase_infra/nodes/node_merge_gate_effect src/omnibase_infra/nodes/node_delta_bundle_effect src/omnibase_infra/nodes/node_decision_store_effect src/omnibase_infra/nodes/node_chain_retrieval_effect --report-json /tmp/omn21701-ac1-handler-shape.json
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21701-ac2-own-contract
    description: >-
      This contract carries the slice's acceptance items, the shared OMN-21536 contract names none of the five nodes, and the validator over the five node directories is clean.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: test -f contracts/OMN-21701.yaml && ! grep -q -E 'node_(delta_metrics|merge_gate|delta_bundle|decision_store|chain_retrieval)_effect' contracts/OMN-21536.yaml && env PYTHONDONTWRITEBYTECODE=1 uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape src/omnibase_infra/nodes/node_delta_metrics_effect src/omnibase_infra/nodes/node_merge_gate_effect src/omnibase_infra/nodes/node_delta_bundle_effect src/omnibase_infra/nodes/node_decision_store_effect src/omnibase_infra/nodes/node_chain_retrieval_effect --report-json /tmp/omn21701-ac2-handler-shape.json
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21701-deploy-handle-signature
    description: >-
      Post-deploy probe: the running runtime image carries the one-argument handle on the delta metrics and merge gate handlers. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: docker exec omninode-runtime python -c "import inspect; from omnibase_infra.nodes.node_delta_metrics_effect.handlers.handler_upsert_metrics import HandlerUpsertMetrics as M; from omnibase_infra.nodes.node_merge_gate_effect.handlers.handler_upsert_merge_gate import HandlerUpsertMergeGate as G; assert list(inspect.signature(M.handle).parameters) == ['self', 'payload']; assert list(inspect.signature(G.handle).parameters) == ['self', 'payload']"
        cwd: ${OMNI_HOME}/omnibase_infra
