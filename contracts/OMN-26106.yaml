schema_version: 1.0.0
ticket_id: OMN-26106
title: deploy-agent-dev.service stays running after omnibase_infra#6080 - every recreate window ask names its requester
summary: The deploy agent is its own installer (no separate dev installer exists). The deploy agent's stability follow and forward migration converge asked the dev recreate window with an empty requester, which the window's request model refuses, so the dev agent crash-looped on every idle tick. Each caller of the gate now names the requester of what it is about to run, and the gate takes it with no default.
