dod_evidence:
  - id: dod-omn26106-ac1-requester
    description: The stability follow and the migration converge each name their requester to the window, the gate takes it with no default, and the real window accepts every requester the idle paths name.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_recreate_window_requester_omn26106.py -q --no-cov -n 0 -p no:randomly
        cwd: .
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_idle_gate_requester_omn26106.py -q
        cwd: .
  - id: dod-omn26106-ac2-journal
    description: The stability follow, which raised the journal's ValidationError on the dev host, runs against a recreate window that refuses the input the journal recorded (fixture scripts/deploy-agent/tests/unit/fixtures/dev_agent_requested_by_crash_omn26106.txt); the real model's refusal reads as the journal recorded it.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_idle_gate_requester_omn26106.py -q -k stability_follow_names_its_requester
        cwd: .
  - id: dod-omn26106-ac3-wiring
    description: 'The hosted structural proof of AC3: the stability follow and the migration converge, the paths that raised on every idle tick on the dev host, run against a recreate window that refuses the recorded empty requester and complete. The integrated read of the unit on h201 is the local-gate entry below.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_idle_gate_requester_omn26106.py -q
        cwd: .
  - id: dod-omn26106-ac3-integrated
    description: The integrated read of the dev agent on h201 needs the host, so it binds no criterion and the local Done gate runs it.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh h201 'systemctl --user is-active deploy-agent-dev.service && curl -sS http://127.0.0.1:8098/health'
        cwd: .
  - id: dod-omn26106-ac4-prod-untouched
    description: 'The hosted structural proof of AC4: the tracked prod unit and its drop-in keep the prod port, name no dev signing key and match their recorded sha256 digests (ModelUnitFileDigest, added by this fix), and a copy with one byte changed reads as changed. At the merge base the digest model does not exist, so the control fails. The digest read of the prod unit file on h201 before and after the install is the local-gate entry below.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_recreate_window_requester_omn26106.py -q --no-cov -n 0 -p no:randomly -k prod_unit
        cwd: .
  - id: dod-omn26106-ac4-integrated
    description: The prod unit file digest on h201, read before and after a deploy-agent self-install on dev; the two reads are written in the lane's STATUS rows. No separate dev installer exists - the deploy agent is its own installer (unit_drift.sync_own_unit), so the install this read brackets is the agent's own.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh h201 'sha256sum ~/.config/systemd/user/deploy-agent.service'
        cwd: .
  - id: dod-omn26106-ac1-accepted-20261124t1345z
    description: 'AC1: the deploy agent gate takes its requester with no default, and the stability follow and the migration converge each name a requester the real window accepts. Three of its four tests fail with the product change of omnibase_infra#6100 reverted.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_idle_gate_requester_omn26106.py -q
        cwd: .
    binds_ac:
      - AC1
  - id: dod-omn26106-ac2-accepted-20261124t1345z
    description: 'AC2: the stability follow runs against a window that refuses the journal-recorded empty requester (fixture dev_agent_requested_by_crash_omn26106.txt) and completes. Fails with the product change of omnibase_infra#6100 reverted.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_idle_gate_requester_omn26106.py -q -k stability_follow_names_its_requester
        cwd: .
    binds_ac:
      - AC2
  - id: dod-omn26106-ac3-accepted-20261125t0545z
    description: 'AC3: on h201 deploy-agent-dev.service is active, has been active for at least 600 s (so NRestarts cannot have moved between two reads ten minutes apart), and the health port 8098 returns 200. Read live on the lab host, so the local Done gate runs it.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh omni-201 's=deploy-agent-dev.service; systemctl --user is-active $s && now=$(date +%s) && ent=$(date -d "$(systemctl --user show -p ActiveEnterTimestamp --value $s)" +%s) && echo active_for_s=$((now-ent)) nrestarts=$(systemctl --user show -p NRestarts --value $s) && test $((now-ent)) -ge 600 && curl -sS -m5 -o /dev/null -w '\''health_http=%{http_code}\n'\'' http://127.0.0.1:8098/health'
        cwd: .
  - id: dod-omn26106-ac3-accepted-hosted-20261125t0545z
    description: 'AC3, hosted structural proof: the stability follow, which raised the journal ValidationError on every idle tick on the dev host, names its requester to the real recreate window and completes without raising. Fails with the product change of omnibase_infra#6100 reverted. The live read on h201 is the local-gate item above.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_idle_gate_requester_omn26106.py -q -k stability_follow_names_its_requester
        cwd: .
    binds_ac:
      - AC3
  - id: dod-omn26106-ac4-self-install-prod-sha
    description: 'AC4, what holds: the deploy agent is its own installer (unit_drift.sync_own_unit replaces only its own drifting unit, reloads, never restarts; no declared dev installer exists). The test runs the real manifest dev entry over a home holding the prod unit and reads the prod unit sha256 before and after the self-install: unchanged. Control: installing the prod entry changes the sha256, so the read goes red on a known bad.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_self_install_prod_unit_omn26106.py -q
        cwd: .
  - id: dod-omn26106-autoclose-sweep-start-budget
    description: 'The evidence close sweep (dry run 45768504347, offer OMN-26106) read 0/0 ACs verified because hosted dod_verify refused to start without DOD_VERIFY_START_BUDGET_S (status unresolved, total_checks 0, cause dispatch_budget_not_declared). The sweep and diagnose steps now declare the budget, and a refused verifier is reported as skipped_dod_verify and never posted to Linear as an evidence gap. Both tests fail on the merge base. Binds no criterion of this ticket: it is evidence about the closer, not about the deploy agent.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_autoclose_sweep_dod_verify_budget_omn26106.py tests/ci/test_autoclose_sweep_budget_refusal_live_contact_omn26106.py tests/unit/nodes/node_evidence_autoclose_sweep_effect/test_omn_26106_budget_refusal.py -q --no-cov -n 0 -p no:randomly
        cwd: .
