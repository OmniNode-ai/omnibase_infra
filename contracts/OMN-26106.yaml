requirements:
  - id: req-omn26106-gate-requester
    statement: Every caller of the deploy agent's recreate window gate passes a non-empty requested_by, and a bare call cannot return.
    acceptance:
      - id: AC1
        statement: 'AC1: every caller of the dev recreate window gate in the deploy agent passes a non-empty requested_by, and a unit test added by the fix fails on omnibase_infra origin/dev at cb23b5f25 and passes at the fix head -- falsifier: uv run pytest <the test file the pull request adds under scripts/deploy-agent/tests/unit or tests/unit> exits non-zero on cb23b5f25 and zero on the fix head'
      - id: AC2
        statement: 'AC2: a regression test built from the recorded journal text of the crash (a fixture file holding the ValidationError lines read from deploy-agent-dev.service on h201, scrubbed of secrets) fails on the broken code and passes on the fix -- falsifier: uv run pytest <that test> exits zero on cb23b5f25'
      - id: AC3
        statement: 'AC3: integrated: after the fix is installed on h201 through the declared dev installer, deploy-agent-dev.service is active, its NRestarts reading is the same at two reads ten minutes apart, and the health port 8098 answers on h201 -- falsifier: systemctl show -p NRestarts --value deploy-agent-dev.service on h201 differs between the two reads, or curl -sS http://127.0.0.1:8098/health on h201 is refused'
      - id: AC4
        statement: 'AC4: the prod deploy agent''s unit file and its key are untouched -- falsifier: sha256sum of the prod deploy agent unit file on h201 read before and after the install differs'
evidence_requirements:
  - kind: tests
    description: The deploy agent gate-requester tests and the real recreate window requester tests.
    command: uv run --frozen pytest tests/unit/handlers/test_recreate_window_requester_omn26106.py -q --no-cov -n 0 -p no:randomly
