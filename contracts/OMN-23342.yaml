    description: The three registration tests pass on the branch; run against the Dockerfile and lock at the merge base, all three fail (no loader entry in the interpreter layer, no ldconfig, image version still 13).
    source: manual
    binds_ac:
      - AC2
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_runner_toolcache_libpython_omn23342.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn23342-dockerfile-registers
    description: The Dockerfile interpreter layer writes the ld.so.conf.d entry for the uv-managed CPython lib directory and runs ldconfig.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: grep -qF 'onex-uv-python-libpython.conf' docker/runners/Dockerfile
        cwd: .
  - id: dod-omn23342-integration-proof-runner-image
    description: After the installer rebuilds the image and recreates the runners, the pre-commit check of this change's pull request reads success on a job that ran on one of the rebuilt runners. Pending the roll; read from the PR watcher after it.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex scm pr-checks "OmniNode-ai/omnibase_infra#$PR_NUMBER" | grep -i 'pre-commit' | grep -i -E 'success|pass'
        cwd: .
