schema_version: "1.0.0"
ticket_id: "OMN-19404"
title: "A pre-PR slot reaches a ready runtime: slot principals get the migration grants, the intelligence migration runs, and slot topics are provisioned"
summary: "Evidence-only contract for OMN-19404, carrying the acceptance-criterion bindings proposed by lane=dod-closeout-bind-2026-10-19T0445Z-c3 and accepted by lane=dod-closeout-accept-2026-10-19T0445Z-c3 after a re-run at omnibase_infra origin/dev a8ab64c18 on lab host h203. Implementing change: omnibase_infra#4070 (squash 11aaaeff2). Bound here: AC1, AC2, AC3. Every other criterion carries no binding and stays unproven."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: "The acceptance criteria declared on the ticket body, transcribed verbatim. The ticket body is the source; each id is the label a binds_ac entry claims. Only bound criteria are transcribed."
    acceptance:
      - id: "AC1"
        statement: "AC1: Under ONEX_DB_SLOT the forward-migration runner rewrites every managed role name in an applied file to its slot principal, and datname and has_database_privilege database literals to the slot database, and applies files unchanged outside a slot -- falsifier: uv run pytest tests/unit/infra/test_forward_migration_slot_role_confinement.py, red against the pre-fix runner"
      - id: "AC2"
        statement: "AC2: Under ONEX_DB_SLOT the intelligence migration runner targets omniintelligence\\_<slot>, refuses to create it, and the slot overlay runs it as a prepr-migrate one-shot that the entrypoint invokes after the forward migration -- falsifier: uv run pytest tests/unit/scripts/test_prepr_slot_gaps_intelligence_migration.py, red against the pre-fix scripts"
      - id: "AC3"
        statement: "AC3: With KAFKA_TOPIC_NAMESPACE set, the topic provisioner creates, finds and confirms the namespaced physical names, and with it unset the names it sends to the broker are byte-identical to today -- falsifier: uv run pytest tests/unit/event_bus/test_topic_provisioner_namespace_omn18893.py, red against the pre-fix provisioner"
evidence_requirements:
  - kind: "tests"
    description: "AC1: slot role confinement"
    command: "uv run pytest tests/unit/infra/test_forward_migration_slot_role_confinement.py -q -p no:randomly -o addopts="
  - kind: "tests"
    description: "AC2: slot intelligence migration"
    command: "uv run pytest tests/unit/scripts/test_prepr_slot_gaps_intelligence_migration.py -q -p no:randomly -o addopts="
  - kind: "tests"
    description: "AC3: topic provisioner namespace"
    command: "uv run pytest tests/unit/event_bus/test_topic_provisioner_namespace_omn18893.py -q -p no:randomly -o addopts="
