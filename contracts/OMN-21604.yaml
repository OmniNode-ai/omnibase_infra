schema_version: "1.0.0"
ticket_id: OMN-21604
title: "The onex delegate CLI and dispatch port take a task class's time limit from the site overlay instead of 240 seconds"
summary: >-
  The delegate CLI's terminal model now reads the budget_source a delegation terminal names, which says where the run's execution budget came from: a task-class contract entry or a site overlay file. receipt.json records it beside the budget evidence or refusal it describes, and it is omitted when the terminal names none. This PR covers AC2's receipt side. The CLI's overlay-aware budget (AC1) arrives through the task-class authority omnimarket registers, and a test now pins the CLI's terminal wait to the budget that authority answers. The dispatch port's 240 s and 60 s defaults are removed in favour of the class's declared budget, and the port refuses at load a class whose ceiling plus margin passes the consumer dispatch deadline. AC3 stays unbound: a 240 literal remains in runtime/dogfood_delegation_fault_routes.py.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21604-receipt-budget-source
    statement: >-
      A run's receipt.json records the limit it ran under and where that limit came from.
    acceptance:
      - id: AC2
        statement: >-
          AC2: a run's receipt.json records the limit it ran under and a budget_source naming the contract or overlay it came from -- falsifier: uv run pytest asserting the receipt's budget_source names the overlay path when one is set and the contract otherwise
  - id: req-omn21604-cli-overlay-budget
    statement: >-
      The delegate CLI sizes its terminal wait from the budget the task-class authority answers, overlay included.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the delegate CLI resolves a class's budget through omnimarket's overlay-aware resolver, so with an overlay ceiling of 600 s a request for 300 s waits 300 s plus the delivery margin and is not refused -- falsifier: uv run pytest on a cli_delegate test that sets a 600 s delegation_budgets overlay and asserts the terminal wait and the absence of a ceiling refusal
evidence_requirements:
  - kind: tests
    description: >-
      The receipt budget block keeps the terminal's budget_source beside the budget evidence or refusal, and adds none when the terminal names none.
    command: uv run --frozen pytest tests/unit/cli/test_delegate_terminal_budget_contract.py -q -n 0
  - kind: tests
    description: >-
      With a 600 s overlay a 300 s request waits its remaining seconds plus the 60 s margin and is not clamped to 240 s; without the overlay the same request is clamped to the contract.
    command: uv run --frozen pytest tests/unit/cli/test_delegate_overlay_budget_omn21604.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21604-ac2-receipt-budget-source
    description: >-
      The receipt budget block keeps the terminal's budget_source beside the budget evidence (an overlay path) and beside a pre-dispatch refusal (a contract entry), and adds none when the terminal names none. At the merge base the terminal model drops the key, so the block has no budget_source and the two source cases fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/cli/test_delegate_terminal_budget_contract.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
  - id: dod-omn21604-receipt-deploy-probe
    description: >-
      Deploy probe. The delegate CLI GitHub serves at the checked-out commit copies budget_source into the receipt's budget block. The probe reads the file from GitHub at that commit and exits nonzero on a tree without that line, so it fails at the merge base.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/cli/cli_delegate.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'named = {\"budget_source\": result.budget_source} if result.budget_source else {}' | grep -qx 1"
  - id: dod-omn21604-ac1-overlay-terminal-wait
    description: >-
      A stand-in authority applies a 600 s delegation_budgets overlay; the CLI's terminal wait is the request's seconds plus the 60 s margin (above the contract's 240 s), the run exits 0, the receipt's budget evidence carries the raised 600 s ceiling and names no ceiling refusal, and the same request without the overlay waits 300 s. The check also runs the dispatch-port budget tests, which import the budget resolver this PR adds, so the whole command fails at the merge base. Mutation check: clamping the CLI's wait to 240 fails the first test.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/cli/test_delegate_overlay_budget_omn21604.py tests/unit/runtime/test_delegation_budget_deadline_check_omn21604.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn21604-policy-throughput-check-measurement
    description: >-
      The concurrent registry check waits for all ten workers before timing 1000 lookups against its unchanged 1000 ms threshold. Injecting 120 ms into each thread start must not fail fast registry lookups; injecting 12 ms into each lookup must still fail the throughput check. The delayed-start case fails with the original check because it charges worker bootstrap to registry work.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/test_policy_registry_performance.py -k concurrent_get -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
