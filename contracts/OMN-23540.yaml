schema_version: "1.0.0"
ticket_id: "OMN-23540"
title: "The update agent sends its liveness message in the background so a silent broker cannot stall it"
summary: >
  The deploy agent's idle tick published the dev-tag heartbeat (omnibase_infra#5028, OMN-19998) with a synchronous KafkaProducer send and flush, so a broker that accepts the connection and never answers held the tick for the producer's 60 second metadata wait. On h201, where the dev lane's broker listens on localhost:19092, the deploy-agent dependency convergence test timed out at its 10 second wait for that reason. DeployAgent._record_dev_tag_heartbeat now starts the publish on its own one-shot thread (threading.Timer of 0 seconds) and records the published time at once, so the tick returns and the 15 minute interval holds the next send back; one attempt, no retry, as the publisher documents. No timeout, topic or interval changed. The change is net zero in code lines in agent.py, a baselined file (canonical-file-shape ratchet): the dev-tag lag bookkeeping above it is two lines shorter.

is_seam_ticket: true
interface_change: false
interfaces_touched:
  - infrastructure
requirements:
  - id: "req-omn23540-heartbeat-off-the-tick"
    statement: "The deploy agent's idle tick returns while the dev-tag heartbeat publish is still blocked, and starts no second publish inside the interval."
    acceptance:
      - id: "AC1"
        statement: "AC1: the idle tick returns while the heartbeat publish is still blocked, and no second publish starts inside the interval -- falsifier: the new unit test in scripts/deploy-agent/tests/unit fails at the merge base (the call blocks for as long as the publish does)"
      - id: "AC2"
        statement: "AC2: a heartbeat the broker accepts is still published and recorded as published, and a send the broker refuses does not stop the tick and is sent again at the next interval -- falsifier: the same test file, its error test fails when the refused send raises into the tick"
      - id: "AC3"
        statement: "AC3: the deploy-agent dependency-convergence test that timed out on h201 passes there -- falsifier: lab-run on h201 of test_agent_deps_convergence_omn18692.py at the merge base fails with TimeoutError after 10 s"
      - id: "AC4"
        statement: "AC4: integrated: after a deploy agent job on dev finishes on a ref containing the change, the agent's health endpoint on h201 answers during an idle tick against a broker that does not answer, and its log shows the heartbeat publish returning off the tick -- falsifier: the agent's job record ref and its journal on h201"
evidence_requirements:
  - kind: "tests"
    description: "The off-tick heartbeat tests and the existing dev-tag heartbeat tests pass."
    command: "uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_tag_heartbeat_off_tick_omn23540.py scripts/deploy-agent/tests/unit/test_lab_follows_dev_tag_omn19998.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23540-off-tick-publish"
    description: "The new test file: with the publish blocked on an event the idle tick returns within 5 seconds (it fails at the merge base, where the tick is held by the publish; that hold is what timed out the dependency convergence test on h201), a second tick inside the interval starts no second publish, a published heartbeat is recorded, and a refused send does not stop the tick."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3", "AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_tag_heartbeat_off_tick_omn23540.py scripts/deploy-agent/tests/unit/test_lab_follows_dev_tag_omn19998.py -q"
        cwd: "."
  - id: "dod-omn23540-live-h201-proof"
    description: "On h201 the dependency convergence test passes at the pushed head and the agent runs the change after a dev roll. It needs the lab, which a hosted runner does not have, so only the local Done gate runs it and it binds no acceptance criterion."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_dev_tag_heartbeat_off_tick_omn23540.py -q"
        cwd: "."
