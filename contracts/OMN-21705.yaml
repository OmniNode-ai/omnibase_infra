schema_version: 1.0.0
ticket_id: OMN-21705
title: >-
  The infra-test CLI reads its broker, runtime URL, timeouts and waits from a declared settings file, not from literals
summary: >-
  The contracts_and_di check reported 34 findings in src/omnibase_infra/cli/infra_test (literal_timeout 29, literal_topic 3, literal_host 1, literal_url 1), among 2095 in src and scripts. This change declares the endpoints and waits in cli/infra_test/infra_test_settings.yaml, loads them through ModelInfraTestSettings (no field defaults, so an omitted value fails to load), and takes the introspection topic from DEFAULT_INTROSPECTION_TOPIC. The check reports zero findings over the CLI and the model.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21705-slice-infra-test-settings
    statement: >-
      The infra-test CLI takes its broker, runtime URL, subprocess timeouts and waits from the declared settings file, and a settings block that omits a value fails to load.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the infra-test CLI of omnibase_infra#5493 reads its broker, URL, timeouts and waits from a settings file and the contracts_and_di count drops as the PR states -- falsifier: uv run pytest tests/unit -q over the touched modules plus the contracts_and_di checker re-run on the PR paths
  - id: req-omn21705-contract-location
    statement: >-
      The acceptance items of omnibase_infra#5493 live in contracts/OMN-21705.yaml and the PR leaves contracts/OMN-21623.yaml as the base branch has it.
    acceptance:
      - id: AC2
        statement: >-
          AC2: the PR's acceptance items live in contracts/OMN-21705.yaml and the PR does not edit contracts/OMN-21623.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21705.yaml and not contracts/OMN-21623.yaml
evidence_requirements:
  - kind: tests
    description: >-
      The loaded settings equal the declared file, each omitted value fails to load, and every CLI command and suite carries the declared timeouts and waits.
    command: >-
      env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/models/infra_test/test_model_infra_test_settings.py tests/unit/cli/infra_test/test_cli_scaffold.py tests/unit/cli/infra_test/test_helpers.py tests/unit/cli/infra_test/test_introspect.py tests/unit/cli/infra_test/test_verify_topics.py tests/integration/test_infra_test_settings_cli_omn21623.py -q
  - kind: ci
    description: >-
      The contracts_and_di check exits 0 over the infra-test CLI and its settings model; at the merge base the same run reports 34 findings.
    command: >-
      uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/cli/infra_test src/omnibase_infra/models/infra_test
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21705-ac3-infra-test-settings
    description: >-
      The settings load from the declared file, an omitted value is refused, and the CLI calls carry the declared timeouts. Fails at the merge base, where the settings model does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/models/infra_test/test_model_infra_test_settings.py tests/unit/cli/infra_test/test_cli_scaffold.py tests/unit/cli/infra_test/test_helpers.py tests/unit/cli/infra_test/test_introspect.py tests/unit/cli/infra_test/test_verify_topics.py tests/integration/test_infra_test_settings_cli_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21705-ac4-check-clean
    description: >-
      The contracts_and_di check reports no finding over the infra-test CLI and its settings model. Fails at the merge base, where the CLI reports 34 findings.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/cli/infra_test src/omnibase_infra/models/infra_test
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21705-deploy-infra-test-settings
    description: >-
      Post-deploy probe: the runtime container loads the infra-test settings from the file it ships. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnibase_infra.models.infra_test import load_infra_test_settings; load_infra_test_settings()'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
  - id: dod-omn21705-hosted-cli-probe
    description: >-
      Post-deploy probe for hosted CI: the installed CLI imports without reading settings, renders help with unavailable settings, and each command uses values loaded from YAML. External subprocess and database boundaries are intercepted; no lane container is required.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/test_infra_test_settings_cli_omn21623.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21705-ac2-contract-location
    description: >-
      The PR diff against origin/dev lists contracts/OMN-21705.yaml and does not list contracts/OMN-21623.yaml.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          sh -c 'files=$(git diff --name-only origin/dev...HEAD) && printf "%s\n" "$files" | grep -Fx contracts/OMN-21705.yaml && ! printf "%s\n" "$files" | grep -Fx contracts/OMN-21623.yaml'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
