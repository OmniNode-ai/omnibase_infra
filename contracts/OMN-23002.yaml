schema_version: '1.0.0'
ticket_id: OMN-23002
title: 'the application database SQL gate accepts a state_io migration as owner of the objects it creates'
summary: 'The gate resolved supplemental ownership only for database_ref application declarations, so a new state_io table migration in the omnibase_infra service database (floor_fill_state, migration 113) was refused for lacking an ownership declaration.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23002-gate-state-io-ownership
    statement: A STATE_IO_TABLE_DECLARATIONS migration owns the table and the trigger function it creates in the omnibase_infra service database.
    acceptance:
      - id: AC1
        statement: 'AC1: _supplemental_ownership_identities resolves the table and its updated_at trigger function from a database_ref omnibase_infra declaration -- falsifier: uv run --frozen pytest tests/ci/test_application_database_sql_gate.py -k state_io_migration_owns -q --no-cov, with the omnibase_infra branch removed the resolved set is empty and the test fails'
evidence_requirements:
  - kind: tests
    description: The gate tests pass at the head.
    command: uv run --frozen pytest tests/ci/test_application_database_sql_gate.py -q --no-cov -k "state_io or infra_first or recorded"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23002-gate-state-io-ownership
    description: The gate resolves ownership of a state_io migration's table and trigger function.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_application_database_sql_gate.py -k state_io_migration_owns -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
