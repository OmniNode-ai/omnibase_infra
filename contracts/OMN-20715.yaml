schema_version: "1.0.0"
ticket_id: "OMN-20715"
title: "the release train decision surface is enforced in the PR gate and in a pre-commit hook"
summary: "The release-train-cuts-omnimarket ruling is carried by config/release_train_policy.yaml and tests/scripts/test_release_train_nightly.py, merged in omnibase_infra#4708. No workflow job named the tests and no pre-commit hook ran them, because the change-aware selector does not pick tests/scripts/ for a config or scripts change. A named test-parallel step in ci.yml, whose result feeds the required CI Summary context, and a check-only pre-commit hook now run the file, and three tests pin both."
