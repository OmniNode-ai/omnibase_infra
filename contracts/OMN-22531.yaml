schema_version: 1.0.0
ticket_id: OMN-22531
title: Keep teardown composition outside node internals
summary: The criteria of omnibase_infra#5695, moved unchanged from the shared contract of OMN-19998.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-prepr-offboard-retry
    statement: An interrupted slot teardown must finish after removing its gateway only when the saved offboard proof matches the slot credential and all slot containers are authoritatively absent; every other case retains the live authentication check or refuses cleanup, and only CLEAN teardown releases the resource lease.
    acceptance:
      - id: AC40
        statement: 'AC40: the expired standalone-1695065 case with no containers, nine databases, ten roles and staging remaining reaps through the teardown adapter using a matching saved 200-to-401/403 proof; missing or mismatched proof, unreadable container listings and remaining containers refuse the saved-proof path; incomplete teardown preserves the lease and reports its safe cause -- falsifier: uv run pytest tests/unit/scripts/test_prepr_tenant_lifecycle_omn18894.py -q'
evidence_requirements:
  - kind: tests
    description: The recorded expired standalone lease is exercised through the reaper and teardown adapter, including an immutable installer snapshot, with shared services faked and incomplete evidence retaining the lease.
    command: uv run pytest tests/unit/scripts/test_prepr_tenant_lifecycle_omn18894.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19998-ac40-prepr-offboard-retry
    description: AC40 replays the recorded post-gateway-removal state, checks the credential binding and positive authentication control, and retains leases on incomplete cleanup while exposing safe diagnostics.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_prepr_tenant_lifecycle_omn18894.py -q
        cwd: .
    binds_ac:
      - AC40
  - id: dod-omn19998-ac40-prepr-installer-probe
    description: Hosted-runner artifact probe installs this checkout through install_reaper with enable=False, verifies the copied helper bytes, and replays the recorded teardown through that installed helper against fake shared services. It requires neither systemd nor live Docker and does not claim a live slot cleanup.
    source: manual
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/scripts/test_prepr_tenant_lifecycle_omn18894.py -q -k recorded_standalone
        cwd: .
    binds_ac:
      - AC40
  - id: dod-omn22531-integration-proof
    description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22531 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/scripts/test_prepr_tenant_lifecycle_omn18894.py -q
        cwd: .
