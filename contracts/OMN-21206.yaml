context:
  vendor_provenance:
    repository: OmniNode-ai/omnimarket
    source_commit: 2d0d699487b3020191c7cd9a46f0e78d54a80611
    pull_request: 4262
    scope: "delivery only; runtime evidence and its limitations are tracked in source PR 4262"
