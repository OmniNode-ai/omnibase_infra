    description: "AC1 hosted probe. Every profile grants the tenant projection writer the eval results tables."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/integration/topology/test_eval_results_grants_omn24174.py tests/unit/topology/test_application_database_table_grants.py -q"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn24174-ac2-vendored-migrations"
    description: "AC2 hosted probe. The three vendored migrations are present; the new test file is absent at the merge base, so the command fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/integration/topology/test_eval_results_grants_omn24174.py -k vendored -q"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn24174-ac3-control"
    description: "AC3 hosted probe. The control case reports an ungranted table as an empty grant set."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/integration/topology/test_eval_results_grants_omn24174.py -k control -q"
