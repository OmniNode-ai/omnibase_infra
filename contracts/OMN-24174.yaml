schema_version: "1.0.0"
ticket_id: "OMN-24174"
title: "Grant the tenant projection writer the eval results tables in the platform topology"
summary: "omnibase_infra vendors omnimarket's node_projection_eval_results migrations and grants tenant_projection_writer SELECT, INSERT and UPDATE on the public eval results tables in every shipped topology profile, ahead of the omnimarket pull request that adds the node. The grants are regenerated by scripts/generate_application_database_table_grants.py, with a supplemental declaration that expires when the omnimarket contract reaches the pin, and the catalogs by its own render step. Without them the runtime refuses to prepare the node's writer and the omnimarket Sibling Release Compatibility Gate fails at collection with a sibling release compatibility gate failure naming the unvendored migrations."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-eval-results-writer-grants"
    statement: "Every shipped topology profile grants the tenant projection writer the eval results tables, the grant derivation reports no drift with or without the node's contract in the omnimarket tree, and the node's three migrations are vendored and declared, the row-security step fenced."
    acceptance:
      - id: "AC1"
        statement: "AC1: the topology instances for every shipped profile grant the tenant projection writer SELECT, INSERT and UPDATE on each of eval_item_scores, eval_item_traces, eval_run_closes and eval_run_rates table, derived by the grant generator from the omnimarket contract -- falsifier: scripts/generate_application_database_table_grants.py --check exits non-zero in omnibase_infra with the table removed from the instances"
      - id: "AC2"
        statement: "AC2: the table's creation, grant and row-security scripts are carried in the infrastructure migration tree and ledger, and the migration manifest validator prints PASS -- falsifier: scripts/validation/validate_application_migration_manifest.py fails with one script removed from the ledger"
      - id: "AC3"
        statement: "AC3: with the grants in place the projection binding check for the eval results projection passes for every supported profile -- falsifier: scripts/generate_application_database_table_grants.py --prove reports a FAIL for a profile whose grant is removed"
      - id: "AC4"
        statement: "AC4: integrated: the omnimarket pull request for the eval board compute node (omnimarket#6219) passes Sibling Release Compatibility Gate after taking the infrastructure release that carries these grants, read from its checks on the pull request -- falsifier: Sibling Release Compatibility Gate on that pull request fails collection with 'must vendor docker/migrations/forward/nodes/node_projection_eval_results/0000-0002'"
evidence_requirements:
  - kind: "tests"
    description: "The grant tests pass at the head; on the merge base no profile grants the table."
    command: "uv run pytest tests/integration/topology/test_eval_results_grants_omn24174.py tests/unit/topology/test_application_database_table_grants.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
