schema_version: "1.0.0"
ticket_id: OMN-22867
title: omnibase_infra's pull-request gate workflows run on a hosted runner
summary: Family 1 of the hosted-runner migration of this public repository. The 26 pull_request and merge_group gate workflows that touch no lab service select the literal ubuntu-latest in every job and are listed in the routing policy's hosted_runner_allowlist, so omnibase_core's check-public-runner-placement reports none of them.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22867-family1-hosted
    statement: Each gate workflow of the family selects only the GitHub-hosted label and is allowlisted with a reason.
    acceptance:
      - id: AC1
        statement: Every job of the 26 family workflows selects the literal ubuntu-latest and each file is in hosted_runner_allowlist with a reason.
      - id: AC2
        statement: The runner-routing audit and the public runner placement tests stay green with the family hosted.
evidence_requirements:
  - kind: tests
    description: Workflow shape test of the family and the routing audit tests.
    command: uv run pytest tests/ci/test_public_runner_family_gates_omn22867.py tests/ci/test_runner_routing_audit.py -q -o addopts=''
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22867-ac1-family-hosted
    description: Every job of each family workflow selects ubuntu-latest and each file is allowlisted with a reason.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_public_runner_family_gates_omn22867.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22867-ac2-routing-audit
    description: The routing audit controls and the public runner placement tests pass.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_runner_routing_audit.py tests/ci/test_public_runner_placement_omn19998.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_infra
