        statement: 'AC4: Every job of the 18 family workflows selects the literal ubuntu-latest and each file is in hosted_runner_allowlist with a reason -- falsifier: uv run pytest tests/ci/test_public_runner_family_sched_omn22867.py -q -o addopts='''''
      - id: AC5
        statement: 'AC5: The runner-routing audit and the workflow tests that read the family stay green with the family hosted -- falsifier: uv run pytest tests/ci/test_public_runner_family_sched_omn22867.py tests/ci/test_runner_routing_audit.py tests/ci/test_lockfile_cve_autobump.py -q -o addopts='''''
  - id: req-omn22867-family3-hosted
