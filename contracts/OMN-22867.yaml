schema_version: "1.0.0"
ticket_id: OMN-22867
title: omnibase_infra's workflows run on a hosted runner, families 1 to 3
summary: 'Family 1 of the hosted-runner migration of this public repository. The 26 pull_request and merge_group gate workflows that touch no lab service select the literal ubuntu-latest in every job and are listed in the routing policy''s hosted_runner_allowlist, so omnibase_core''s check-public-runner-placement reports none of them. Family 2 of the hosted-runner migration of this public repository. The 18 scheduled, dispatched and reusable workflows that touch no lab service select the literal ubuntu-latest in every job and are listed in the routing policy''s hosted_runner_allowlist, so omnibase_core''s check-public-runner-placement reports none of them. Family 3: the 9 static gate workflows (compose teardown, governed helper, duplication sweep, shell hygiene, dispatch parity, dispatcher route coverage, consumer kwarg parity, compose config lint, s6 runtime seam) select the literal ubuntu-latest and are allowlisted.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22867-family1-hosted
    statement: Each gate workflow of the family selects only the GitHub-hosted label and is allowlisted with a reason.
    acceptance:
      - id: AC2
        statement: 'AC2: Every job of the 26 family workflows selects the literal ubuntu-latest and each file is in hosted_runner_allowlist with a reason -- falsifier: uv run pytest tests/ci/test_public_runner_family_gates_omn22867.py -q -o addopts='''''
      - id: AC3
        statement: 'AC3: The runner-routing audit and the public runner placement tests stay green with the family hosted -- falsifier: uv run pytest tests/ci/test_public_runner_family_gates_omn22867.py tests/ci/test_runner_routing_audit.py tests/ci/test_public_runner_placement_omn19998.py -q -o addopts='''''
  - id: req-omn22867-family2-hosted
    statement: Each scheduled, dispatched or reusable workflow of the family selects only the GitHub-hosted label and is allowlisted with a reason.
    acceptance:
