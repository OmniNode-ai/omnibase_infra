    statement: The live deploy job reading tests fail only on a real defect, and the record of what is not met is complete.
    acceptance:
      - id: AC1
        statement: 'AC1: a correct dev-lane row published after a settle (completed_at before the settle and the repair build, published_at after them) passes the live golden and error assertions, bounded by the settle ceiling plus one tick, and a hermetic test covers it -- falsifier: uv run pytest tests/integration/chain_canary -q -k "deploy_job_reading and published_after_settle" fails on head 4ba6768c6077 and passes after the fix'
      - id: AC2
        statement: 'AC2: contracts/OMN-24695.yaml records the induced failed job and the lab wiring of the kafka tests as NOT MET, one open ticket is named for the append half, the induced job and the lab wiring in both contract files, and the OMN-24674 ticket text is amended to match -- falsifier: grep -c "NOT MET" contracts/OMN-24695.yaml returns at least 2 and grep -n "OMN-" contracts/OMN-24674.yaml names the open follow-up ticket'
      - id: AC4
        statement: 'AC4: the two late rows (a7b921db at 2876 s and 7179dcca at 347 s) are ticketed, the contract check at contracts/OMN-24695.yaml:40 no longer depends on OMN-24674 saying NOT MET, the live_assertions source-grep test at :276-290 is deleted or asserts behaviour, the :157 docstring matches handler_deploy_job_reading.py:103-116, and the window is parsed inside the fixture -- falsifier: uv run pytest tests/integration/chain_canary -q -k "deploy_job_reading and window_parse" fails on head 4ba6768c6077 with a non-numeric window and passes after the fix'
