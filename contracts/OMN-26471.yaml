schema_version: "1.0.0"
ticket_id: "OMN-26471"
title: "omnibase_infra: a least-grant tenant_identity_writer role and the omninode_cloud topology entry exist on the dev lane"
summary: >-
  Adds the login tenant_identity_writer on omninode_cloud: one seam, docker/migrations/seams/tenant_identity_writer_grants.sql, mints and re-asserts its credential from TENANT_IDENTITY_WRITER_PASSWORD and grants exactly the declared set (column-scoped UPDATE on tenants, tenant_api_keys and tenant_event_outbox, no DELETE and no TRUNCATE), then reads the effective privileges back, including every grant-option form, and fails the run on any difference. The dev overlay renders TENANT_IDENTITY_DATABASE_DSN and passes the password to the migration runner, both fail-closed. The omninode_cloud database entry (AC6) is declared in the three topology profiles with ledger shape version_checksum, the shape the dev lane's omninode_cloud public.schema_migrations (version, applied_at, checksum) was read to have.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26471-tenant-identity-writer"
    statement: "The dev lane holds a least-grant login role tenant_identity_writer on omninode_cloud, minted and bounded by one seam, with its DSN wired fail-closed."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: the role holds exactly the listed set -- falsifier: on omni-201 the effective-privilege readback the seam itself runs (has_table_privilege, has_column_privilege, has_sequence_privilege, has_database_privilege, has_schema_privilege, plus the WITH GRANT OPTION forms and a positive control that a grant with delegation rights makes it raise) differs from the list, or `select table_name, column_name, privilege_type from information_schema.role_column_grants where grantee='tenant_identity_writer' order by 1,2,3` prints a column not in the list (role_table_grants alone is not enough because it does not show column-scoped UPDATE)
      - id: "AC2"
        statement: >-
          AC2: the runtime connects as tenant_identity_writer on a fresh slot and on omni-201's warm volume -- falsifier: a `select session_user, current_user, current_database()` through the T3 node's DSN does not print `tenant_identity_writer, tenant_identity_writer, omninode_cloud` on either
      - id: "AC3"
        statement: >-
          AC3: the runner asserts the role's credential on omni-201 and does not skip it -- falsifier: the dev lane's forward-migration log for the run after deploy has a `skip` line for tenant_identity_writer or no credential line for it at all
      - id: "AC4"
        statement: >-
          AC4: gateway_runtime's nine grants are unchanged -- falsifier: the existing gateway_runtime_grants.sql readback raises on the next run, or its output on omni-201 is a `skip` line instead of `ok ... nine gateway grants`
      - id: "AC5"
        statement: >-
          AC5: the failing test is red before the seam and green after -- falsifier: `uv run pytest tests/unit/test_tenant_identity_writer_grants.py -q` exits non-zero after the change, or the PR's first commit shows it passing
  - id: "req-omn26471-cloud-topology-entry"
    statement: "Every shipped topology profile declares omninode_cloud with its migration ledger shape version_checksum and the tenant_identity_writer binding."
    acceptance:
      - id: "AC6"
        statement: >-
          AC6: the pinned topology resolves omninode_cloud after the core pin raise (omnibase_core#2378) -- falsifier: `uv run --frozen pytest tests/unit/topology/test_omninode_cloud_topology_omn26471.py -q -n 0 --no-cov` fails at the head, or passes at the base commit
  - id: "req-omn26471-bare-sequence-ownership"
    statement: "The application database SQL gate's ownership lookup resolves a sequence the manifest declares as a bare name under its domain, for the schema its table occupies."
    acceptance:
      - id: "AC8"
        statement: >-
          AC8: public.tenant_event_outbox_id_seq resolves to its declared owner through load_application_database_ownership_identities when the manifest lists it as a bare name (kind sequence, domain OMNINODE_INTERNAL, no schema), a sequence with no owning table in the manifest stays unowned, and a duplicate declaration still fails -- falsifier: `uv run pytest tests/unit/validation/test_bare_sequence_ownership_omn26471.py -q -n 0` fails at the head, or passes at the base commit
evidence_requirements:
  - kind: "tests"
    description: "The seam grants exactly the declared set, the readback raises on any difference, and the compose and runner wiring is pinned."
    command: "uv run --frozen pytest tests/unit/test_tenant_identity_writer_grants.py -q -n 0 --no-cov"
dod_evidence:
  - id: "dod-omn26471-ac1-grant-set"
    description: "The seam's GRANT statements and its readback literals each equal the one declared list in the test, the readback covers the table, column, sequence, schema and database functions and every WITH GRANT OPTION form, and the positive controls (a dropped grant, an extra grant, a widened literal) fire."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/test_tenant_identity_writer_grants.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26471-ac2-dsn-and-login"
    description: "The dev overlay renders TENANT_IDENTITY_DATABASE_DSN fail-closed as tenant_identity_writer on omninode_cloud, no base compose file names it, and the seam mints the role with LOGIN and no wider attribute (hosted part; the connection readback is the lab line in the PR)."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/test_tenant_identity_writer_grants.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26471-ac3-credential-asserted"
    description: "The runner applies the seam in the gateway grants psql run, the dev overlay's migration service receives TENANT_IDENTITY_WRITER_PASSWORD fail-closed, and the seam names its skip lines and its credential ok line (hosted part; the lane's forward-migration log is the lab line in the PR)."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/test_tenant_identity_writer_grants.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26471-ac4-gateway-unchanged"
    description: "The gateway_runtime grants file and its tests are unchanged and pass at the head."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/test_tenant_identity_writer_grants.py -k gateway_grants_psql_run -q -n 0 --no-cov"
        cwd: "."
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/infra/test_gateway_runtime_login_role_omn26151.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26471-ac5-red-then-green"
    description: "The focused test file passes at the head; it was red at the PR's first commit, which carries the test and no seam."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/test_tenant_identity_writer_grants.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26471-ac2-hosted-deploy-probe"
    description: "Deploy scope: the pushed head renders TENANT_IDENTITY_DATABASE_DSN as tenant_identity_writer in the dev-lane overlay and carries the grants seam the migration runner applies, read from GitHub at the checked-out revision so the hosted runner can run it."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.dev-lane.yml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"TENANT_IDENTITY_DATABASE_DSN: \\\"postgresql://tenant_identity_writer:\" >/dev/null'"
        cwd: "."
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnibase_infra/contents/docker/migrations/seams/tenant_identity_writer_grants.sql?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"GRANT UPDATE (is_active, revoked_at) ON public.tenant_api_keys\" >/dev/null'"
        cwd: "."
  - id: "dod-omn26471-ac8-bare-sequence-ownership"
    description: "AC8: the focused test file, which uses the exact sequence public.tenant_event_outbox_id_seq, passes at the head and fails at the base commit, where the lookup skips every database_objects entry that has no schema."
    source: "manual"
    binds_ac: ["AC8"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/validation/test_bare_sequence_ownership_omn26471.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26471-ac6-cloud-topology-entry"
    description: "AC6: all nine profiles resolve omninode_cloud with ledger shape version_checksum (relation public.schema_migrations, version and checksum columns, no stream or domain column) and the tenant_identity_writer LOGIN binding on TENANT_IDENTITY_DATABASE_DSN; the test cannot import at the base commit because the core pin there lacks the shape enum."
    source: "manual"
    binds_ac: ["AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/topology/test_omninode_cloud_topology_omn26471.py -q -n 0 --no-cov"
        cwd: "."
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
