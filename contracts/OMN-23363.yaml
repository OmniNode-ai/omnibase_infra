schema_version: "1.0.0"
ticket_id: OMN-23363
title: "The lab proof lane's compose enables SASL on its Redpanda and gives the runtime family SASL client settings, as the dev lane does"
summary: >-
  The lab proof lane's compose overlay had no SASL step for its Redpanda, so the lane could not require per-machine broker logins (OMN-21616). Modelled on the dev lane (OMN-18012), the overlay gains two one-shots, lane-redpanda-scram-user (creates the lane's runtime SCRAM principal) and lane-redpanda-sasl-enable (makes it the superuser, flips enable_sasl, and proves that an unauthenticated client is refused and an authenticated one accepted); redpanda-partition-cap waits for them. Every broker client the lane runs (the runtime family, projection-api, the seven projection writers) and redpanda-partition-cap read KAFKA_SECURITY_PROTOCOL, KAFKA_SASL_* and RPK_USER/RPK_PASS from one host-local env file named by LANE_BROKER_AUTH_ENV_FILE. The overlay is shared by every host that runs the lane, and an empty-string default is not inert (apply_environment_overrides takes any set variable), so the file defaults to /dev/null: a host that sets nothing gets no auth variable on any service, and both one-shots exit 0 before any rpk call. Both are in the lane refresh's build scope so every governed refresh re-asserts the flip, and both are allowlisted in config/validation/stack_shape.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23363-stability-sasl
    statement: >-
      A stability lane can require SASL on its broker, opt-in per host, with every broker client carrying the lane's SASL client settings.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the lab proof lane's compose declares a one-shot SASL enable service for its Redpanda and passes SASL client settings to every runtime and projection-writer service that connects to the broker, and a test fails on a compose without them -- falsifier: uv run pytest tests/unit/docker/ -k stability_sasl -q in omnibase_infra
evidence_requirements:
  - kind: tests
    description: >-
      Every broker client derived from the merged compose files reads the host auth env file (fail-closed: a set but missing path is refused), sets no literal auth variable in either compose file and waits for the flip; the two one-shots are ordered scram-user then sasl-enable after a healthy broker, and the refresh runs them in that order and fails on a nonzero deploy exit; the one-shot scripts, run against a stub rpk, exit 0 without an rpk call when the host has no auth file, set the superuser before enable_sasl, read enable_sasl back as true and refuse an unauthenticated client on each Kafka listener.
    command: uv run --frozen pytest tests/unit/docker/test_stability_sasl_omn23363.py tests/unit/docker/test_refresh_stability_sasl_omn23363.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23363-ac1-clients-and-one-shots
    description: >-
      The ticket's falsifier. At the merge base no proof-lane service reads the auth env file and neither one-shot exists, so the parametrised client cases and the one-shot cases fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/docker/ -k stability_sasl -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn23363-ac1-flip-behaviour
    description: >-
      The sasl-enable one-shot, run against a stub rpk, sets the superuser before enable_sasl, reads enable_sasl back as true, refuses when any of the three Kafka listeners (in-network, host-local, LAN-published) admits an unauthenticated client, accepts an authenticated one on each, and exits 0 without an rpk call when the host has no auth file. This is evidence for AC1 (the flip is declared and behaves as written). It is NOT evidence for AC2, which is a readback on the lab host's own stability broker.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/docker/test_stability_sasl_omn23363.py -q -n 0 -p no:cacheprovider -k "flips_the_broker or admits_an_unauthenticated or reads_back_true"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn23363-lab-readback
    description: >-
      The lab readback of the ticket's second criterion (on the lab host, after a refresh from a release that carries this change, the stability broker requires SASL): on the lab host that serves the stability lane, with LANE_BROKER_AUTH_ENV_FILE in place, the lane's broker reports enable_sasl true. It runs at the local done gate on that host, not on the hosted runner, so it binds no contract criterion: the hosted must-fail control cannot run a local_done_gate item. A unit test is not this readback (OMN-24819 finding 8), so the ticket's AC2 stays unmet, and OMN-23363 stays open, until the lab host reads true. The refresh has not run on the lane yet.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec "${LANE_REDPANDA_CONTAINER:?set it to the lane broker container}" rpk cluster config get enable_sasl | grep -qx true
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23363-ac1-deploy-probe
    description: >-
      Deploy probe. The proof lane's refresh script GitHub serves at the checked-out commit carries the SASL one-shots in its build scope, which is what makes a governed refresh run the flip. The probe reads the file from GitHub at that commit and exits nonzero on a tree without them, so it fails at the merge base.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/scripts/runtime_build/refresh_stability_lane.sh?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'lane-redpanda-scram-user lane-redpanda-sasl-enable' | grep -qx 1"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
