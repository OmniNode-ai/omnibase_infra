schema_version: "1.0.0"
ticket_id: OMN-18087
title: >-
  Runtime startup joins consumer groups serially, one per topic; join only the topics in use
summary: >
  The dev runtime joined 522 consumer groups at boot one at a time, about 3 s each, so plugin activation took 2207 s and delegation had no consumer for 37 minutes after each recreate. EventBusRecovering.subscribe held its transport lock across the group join; the join now runs outside it. The runtime config contract declares boot_subscriptions.policy=in_use, so only contracts whose topics hold a record on the broker join at boot and every other contract joins on its first request. Plugin consumers, delegation's among them, start before the auto-wired interleave.

is_seam_ticket: false
interface_change: true
interfaces_touched:
  - protocols
requirements:
  - id: req-omn18087-concurrent-joins
    statement: Concurrent subscribes on the runtime bus join the broker concurrently.
    acceptance:
      - id: AC1
        statement: >-
          AC1: three concurrent EventBusRecovering.subscribe calls are inside the broker join at once, and a join overtaken by the fallback or by close releases its stale consumer
  - id: req-omn18087-in-use-boot-set
    statement: The boot interleave joins only contracts whose topics are in use.
    acceptance:
      - id: AC2
        statement: >-
          AC2: with a demand source, a contract whose subscribe topics hold no record is not joined at boot and is reported DEMAND_DEFERRED
      - id: AC3
        statement: >-
          AC3: the first record on an idle topic attaches its contract, reading from earliest so that record is consumed
      - id: AC5
        statement: >-
          AC5: the reader measures the lane's physical (namespaced) topics, reports contract topic names, keeps a topic it cannot read on the boot path, and joins no consumer group
  - id: req-omn18087-plugin-consumers-first
    statement: Plugin consumers start before the auto-wired interleave.
    acceptance:
      - id: AC4
        statement: >-
          AC4: bootstrap starts plugin consumers before it calls subscribe_wired_contract_topics
  - id: req-omn18087-roster-partition
    statement: The boot interleave places every contract in the auto-wiring report exactly once.
    acceptance:
      - id: AC6
        statement: >-
          AC6: every contract in the auto-wiring report is attempted at boot or reported excluded (DEMAND_DEFERRED among them) exactly once, and a contract dropped from the deferred report, or reported in both sets, is named by the check
  - id: req-omn18087-bounded-boot
    statement: The boot-to-ready bound is declared in the runtime policy contract and a boot past it names its blockers.
    acceptance:
      - id: AC7
        statement: >-
          AC7: runtime_policy.contract.yaml declares main's boot-to-ready bound, the compose file renders it into the process, and a boot past it logs its blockers at ERROR without lowering the gate; failed probes are logged and retried, and late readiness is recorded with within_bound=False
      - id: AC8
        statement: >-
          AC8: a boot past the bound names each required topic that holds no partition, and a required topic with no partition is never dropped from the required set to make the check pass
  - id: req-omn18087-contract-owned-limits
    statement: The join limit, join priority and main's memory limit are declared in the runtime policy contract.
    acceptance:
      - id: AC9
        statement: >-
          AC9: the priority contracts declared in the runtime policy contract subscribe before every other contract, and a contract off the list never precedes one on it
      - id: AC10
        statement: >-
          AC10: main's join limit and memory limit are rendered from runtime_policy.contract.yaml, and no compose file carries a literal ONEX_MAX_CONCURRENT_CONTRACT_ATTACH or a 1536M memory limit on main
  - id: req-omn18087-runtime-http-provider
    statement: Runtime HTTP consumers materialize their transport through the runtime provider.
    acceptance:
      - id: AC11
        statement: >-
          AC11: the HTTP handler and tool adapter use ProviderHttpClient, complete requests over a real socket, close clients they own and leave a supplied adapter client open
  - id: req-omn18087-runtime-account-paths
    statement: Compose runtime account paths follow the configured runtime user.
    acceptance:
      - id: AC12
        statement: >-
          AC12: credential and workspace paths render under the same home for the default and an alternate runtime account, in the infra compose and service catalog
evidence_requirements:
  - kind: tests
    description: "Boot subscription tests pass"
    command: "uv run pytest tests/unit/runtime/test_omn18087_recovering_bus_concurrent_subscribe.py tests/unit/runtime/auto_wiring/test_omn18087_boot_subscribes_only_topics_in_use.py -q --no-cov"
  - kind: tests
    description: "Boot roster, priority, bound and policy tests pass"
    command: "uv run pytest tests/unit/runtime/auto_wiring/test_omn18087_boot_roster_and_priority.py tests/unit/runtime/test_omn18087_boot_bound_and_policy.py tests/unit/docker -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn18087-ac1-concurrent-joins
    description: >-
      Concurrent subscribes overlap inside the join, and a join overtaken by fallback or close is released. Fails at the merge base, where the lock serialises the joins.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/runtime/test_omn18087_recovering_bus_concurrent_subscribe.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-ac2-ac3-in-use-boot-set
    description: >-
      An idle contract is not joined at boot and its first request attaches it from earliest. Fails at the merge base, which has no demand source.
    source: manual
    binds_ac: [AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/runtime/auto_wiring/test_omn18087_boot_subscribes_only_topics_in_use.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-ac5-demand-reader
    description: >-
      The group-less reader splits and watches only empty readable topics on the lane's namespace. The module does not exist at the merge base.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_omn18087_handler_kafka_topic_demand_source.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-ac4-plugin-consumers-first
    description: >-
      Bootstrap starts plugin consumers before the auto-wired interleave. Fails at the merge base, which starts them after.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/runtime/test_kernel.py -q --no-cov -k plugin_consumers_before_auto_wired_joins"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-ac6-roster-partition
    description: >-
      The started and DEMAND_DEFERRED sets partition the roster. Fails at the merge base, which has no partition check; dropping one contract from the deferred report, or reporting one in both sets, fails the check and names it.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/runtime/auto_wiring/test_omn18087_boot_roster_and_priority.py -q --no-cov -k 'partition or roster or outside'"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-ac7-ac8-bounded-boot
    description: >-
      The bound is read from the rendered policy, and a planted required topic with no partition keeps the boot past the bound, is named in the log, and stays in the required set. Fails at the merge base, which has no bound and no explanation.
    source: manual
    binds_ac: [AC7, AC8]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/runtime/test_omn18087_boot_bound_and_policy.py -q --no-cov -k 'bound or unjoinable or partitions or required_set'"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-ac9-priority
    description: >-
      Priority contracts take the first join slots and an unlisted contract never precedes a listed one. Fails at the merge base, which has no priority list.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/runtime/auto_wiring/test_omn18087_boot_roster_and_priority.py -q --no-cov -k priority"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-ac10-contract-owned-limits
    description: >-
      Main's join limit, join priority, boot bound and memory limit render from the policy contract and the compose files hold no literal for them. Fails at the merge base, whose main memory limit is the literal 1536M.
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/runtime/test_omn18087_boot_bound_and_policy.py tests/unit/docker/test_omn19513_dev_lane_runtime_cpu_cap.py tests/unit/docker/test_docker_performance.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-deploy-probe
    description: >-
      Post-deploy probe: the running dev runtime imports the demand source and reports the in_use boot split in its log. It reads the runtime container after the deploy agent rolls it, which a hosted runner does not have, so only the local Done gate runs it and it binds no acceptance criterion; AC2 stays bound by dod-omn18087-ac2-ac3-in-use-boot-set.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'import omnibase_infra.handlers.handler_kafka_topic_demand_source'
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'docker logs ${RUNTIME_CONTAINER:-omninode-runtime} 2>&1 | grep -F "Boot subscription split:" > /dev/null'
  - id: dod-omn18087-deploy-readback
    description: >-
      Post-deploy readback on the running runtime after the deploy agent rolls it: the roster partition line is logged, the runtime reached ready inside the declared bound, and the container's memory limit is the contract's 3072M. It reads the runtime container, which a hosted runner does not have, so only the local Done gate runs it and it binds no acceptance criterion; AC6, AC7 and AC10 stay bound by their test entries.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'docker logs ${RUNTIME_CONTAINER:-omninode-runtime} 2>&1 | grep -F "Boot roster partition: roster=" > /dev/null'
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'docker logs ${RUNTIME_CONTAINER:-omninode-runtime} 2>&1 | grep -E "Runtime ready [0-9.]+ s after process start, bound=600 s within_bound=True" > /dev/null'
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'test "$(docker inspect -f "{{.HostConfig.Memory}}" ${RUNTIME_CONTAINER:-omninode-runtime})" = 3221225472'
  - id: dod-omn18087-deploy-http-provider-readback
    description: >-
      Hosted-runner deploy check: the runtime HTTP handler and tool adapter use the runtime HTTP provider over loopback sockets; owned clients close and supplied clients stay open. No lane container or credential is required. The fix parent constructs raw clients without calling the runtime provider.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/runtime/test_omn18087_runtime_http_readback.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-deploy-runtime-account-paths
    description: >-
      Hosted-runner deploy render check: the catalog generator and docker compose config render the real runtime account paths for the default and an alternate user, including main's credential HOME and workspace root. It starts no container and needs no daemon or lane credentials. The fix parent lacks main's account environment.
    source: manual
    binds_ac: [AC12]
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/docker/test_omn18087_runtime_user_home.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: dod-omn18087-deploy-boot-watch-readback
    description: >-
      Hosted-runner deploy check: start RuntimeHostProcess with the in-memory bus and HTTP handler, read its ServiceHealth endpoint over loopback, and hold a supplemental probe unready past the declared bound. The endpoint stays 503 until that probe becomes ready, then returns 200 while the watch records within_bound=False and exactly one bound error. The fix parent cannot observe late readiness after the bound. Unit checks also plant transient and persistent probe errors and verify cancellation and task failure observation.
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/runtime/test_omn18087_boot_watch_readback.py tests/unit/runtime/test_omn18087_boot_bound_and_policy.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
