schema_version: 1.0.0
ticket_id: OMN-23043
title: The dev stack retires the agent actions consumer container, so the runtime attaches the agent actions projection and stops reading DEGRADED
summary: node_projection_agent_actions (omnimarket) names the retired consumer's group agent-observability-postgres under consumer_group_handover. While omninode-agent-actions-consumer runs it keeps that group live, the runtime's attach of the node's own groups fails with ConsumerGroupFenceError, the health monitor reads DEGRADED projection_attachment 1/48, and the main container turns unhealthy and restarts. Each restart pauses every projection consumer in main, which is what moves the savings projection's lag on the hook-event topic past the lab alarm's growth rule. The runtime policy contract adds agent-actions-consumer to the dev main process's retired_services list (as context-audit-consumer was added), the rendered runtime-policy.env carries it, and the dev-lane stanza of the consumer starts under no profile a primary-dev bring-up requests. The deploy handler and the deploy agent retire a previous revision's container by name before main is recreated. Other dev instances, the stability lane and prod keep their consumer.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23043-agent-actions-consumer-retired-on-dev
    statement: Primary dev has no agent-actions-consumer container and its projection is a node in the main runtime; other lanes keep the consumer.
    acceptance:
      - id: AC1
        statement: 'AC1: the runtime policy retires agent-actions-consumer by name on primary dev and the rendered env file carries it -- falsifier: uv run pytest tests/unit/docker/test_dev_agent_actions_fold_omn23043.py, red when the retirement or the stanza gate is removed'
      - id: AC2
        statement: 'AC2: the deploy handler and the deploy agent census and retire the previous revision container before main is recreated, and no other lane retires it -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_dev_tenant_projection_fold_omn21288.py, red when the consumer is not in the retired set'
evidence_requirements:
  - kind: tests
    description: The agent actions fold test with its base-revision control, the hook events and tenant fold tests updated for the third retired service, and the deploy agent retirement tests.
    command: uv run pytest tests/unit/docker/test_dev_agent_actions_fold_omn23043.py tests/unit/docker/test_dev_hook_events_fold_omn21288.py tests/unit/docker/test_dev_tenant_projection_fold_omn21288.py tests/unit/validation/test_checker_stack_shape.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23043-policy-and-stanza
    description: The policy retires the consumer by name, the rendered env file carries it, the dev-lane stanza starts under the folded profile only, the fold overlay adds no declaration, the dev stack renders no consumer, and other dev instances keep theirs. Four of the six tests fail on the base revision.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_dev_agent_actions_fold_omn23043.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn23043-retirement-and-stack-shape
    description: The deploy agent censuses and retires the consumer container with the hook events writer, the context audit consumer and the folded writers, volumes kept, and the stack-shape check passes over the real compose files with the baseline count unchanged.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_dev_hook_events_fold_omn21288.py tests/unit/docker/test_dev_tenant_projection_fold_omn21288.py tests/unit/validation/test_checker_stack_shape.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn23043-deploy-probe
    description: After the deploy agent rolls primary dev with this change, no omninode-agent-actions-consumer container runs on the dev host. The probe fails while the container runs, so it reads the deployed system and not a file this pull request wrote.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" 'test -z "$(docker ps -q --filter name=^omninode-agent-actions-consumer$)"'
        cwd: .
