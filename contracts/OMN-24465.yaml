      - check_type: command
        check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/event_bus_recovering.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "recovery attempt" > /dev/null'
        cwd: .
  - id: dod-omn24465-integration-proof
    description: AC4 is read on the dev runtime on h201 after the declared deploy; the host, revision and observation are named in the pull request.
    source: manual
