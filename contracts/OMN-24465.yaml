schema_version: 1.0.0
ticket_id: OMN-24465
title: Shared runtime logs every broker reconnect attempt and restores each subscription on its own
summary: The runtime event bus's reconnect loop logs a numbered start line and an outcome line for every attempt, restores each subscription on its own so one slow join no longer fails the others, and logs an unexpected error then keeps retrying. The class moves to handlers/event_bus_recovering.py; no time bound changes.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24465-recovery
    statement: The runtime event bus's reconnect loop logs a numbered start line and an outcome line for every attempt, restores each subscription on its own so one slow join no longer fails the others, and logs an unexpected error then keeps retrying. The class moves to handlers/event_bus_recovering.py; no time bound changes.
    acceptance:
      - id: AC1
        statement: 'AC1: every recovery attempt logs a start line and an outcome line (failed with the error, or recovered with the count of attachments) -- falsifier: pytest tests/unit/runtime/test_runtime_bus_recovery_isolation.py -k logs_every_attempt -q'
      - id: AC2
        statement: 'AC2: one subscription join timing out leaves the other subscriptions attached and only the failed one is retried -- falsifier: pytest tests/unit/runtime/test_runtime_bus_recovery_isolation.py -k one_join_timeout -q'
      - id: AC3
        statement: 'AC3: an unexpected exception in an attempt is logged and the loop keeps retrying -- falsifier: pytest tests/unit/runtime/test_runtime_bus_recovery_isolation.py -k unexpected_error -q'
      - id: AC4
        statement: 'AC4: integrated: after the change is running in the dev runtime a broker loss shows numbered attempt lines in the runtime log -- falsifier: read the dev runtime log after a broker loss and find no attempt line'
evidence_requirements:
  - kind: tests
    description: The recovery tests pass at the pushed head.
    command: uv run pytest tests/unit/runtime/test_runtime_bus_recovery_isolation.py tests/unit/runtime/test_runtime_bus_recovery.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24465-tests
    description: AC1 to AC3 proven by the named tests; AC4 is read on the dev runtime after the deploy agent rolls the branch revision and named in the pull request.
    source: manual
    binds_ac:
      - AC1
      - AC2
      - AC3
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_runtime_bus_recovery_isolation.py tests/unit/runtime/test_runtime_bus_recovery.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24465-deploy-conditions
    description: 'Deploy probe the hosted runner can run: src/omnibase_infra/handlers/event_bus_recovering.py at the checked-out commit holds the string ''recovery attempt''; it does not exist at the merge base, so the probe fails there.'
    source: manual
