schema_version: "1.0.0"
ticket_id: OMN-22478
title: "Automated code review holds no merge in omnibase_infra"
summary: >-
  Operator RULING 2026-11-05T20:27:56Z takes the automated code review out of what holds a merge. CI Summary stops asserting the Hostile Review Thread Gate and its sweep stops judging the reviewer's rows, the manifest stops calling the context required, and the reviewer starts no run on a pull request. The workflows, scripts and their tests stay.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: CI Summary passes with the reviewer's rows red or absent, and the reviewer starts no run.
    command: uv run --frozen pytest tests/ci/test_review_gate_removed_omn22478.py -q --no-cov
  - kind: tests
    description: The two import paths omnibase_infra#5683 removed and installed consumers still load resolve to the moved models.
    command: uv run --frozen pytest tests/unit/handlers/test_moved_model_import_paths_omn22478.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22478-infra-review-holds-no-merge
    description: A head with the reviewer's rows red or absent passes CI Summary, and no pull request starts the reviewer.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_review_gate_removed_omn22478.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22478-infra-moved-model-import-paths
    description: The old Infisical config and retry state import paths resolve to the models at their new home, so a venv taking omnibase_infra from a moving clone imports the ledger append.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_moved_model_import_paths_omn22478.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22478-infra-moved-model-paths-in-runtime
    description: In the deployed dev runtime the old Infisical path is the moved model, which reads false on any image built before this change.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC6]
    checks:
      - check_type: command
        check_value: 'docker exec omninode-runtime python -c "from omnibase_infra.handlers.models.infisical import ModelInfisicalHandlerConfig as old; from omnibase_infra.models.security.model_infisical_config import ModelInfisicalConfig as new; assert old is new"'
