schema_version: "1.0.0"
ticket_id: OMN-23715
title: The lab proof runner applies the declared outside-the-runtime rule to the shard-crash fix
summary: >-
  The pool driver hands node_lab_proof_judge_compute the clone and probe phase text and applies its answer to changed_path_live; the rule it used to hold in its own code is deleted from the driver, so the driver shrinks. With no judge command the check stays absent and the receipt's verifier names it missing, never a pass.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23715-judge
    statement: The receipt verdict for changed_path_live comes from node_lab_proof_judge_compute, and a failure is never turned into a pass.
    acceptance:
      - id: AC1
        statement: 'AC1: with the judge command configured, the pool driver passes the changed paths to the declared judge and a NOT_APPLICABLE answer makes changed_path_live pass with the class and substitute proof in the receipt evidence, while a FAIL answer, an unavailable judge or an unset command never turns a failure into a pass -- falsifier: uv run --frozen pytest tests/unit/scripts/test_prepr_pool_declared_judge_omn23642.py -q --no-cov -n 0 -p no:randomly fails at the base'
      - id: AC2
        statement: 'AC2: the three timer nodes of the shard-crash fix are declared as running outside the runtime in the judge overlay and a substitute receipt is recorded for each at that revision -- falsifier: the judge reading on the lab host at that revision reads FAIL or names no substitute proof'
      - id: AC3
        statement: 'AC3: integrated: a lab proof run on the shard-crash fix''s exact revision, with the judge command installed on the pool driver''s host, posts a lab-proof-receipt check run of success with the not-applicable class in its evidence -- falsifier: the check run on that revision reads failure with token RESULT_NOT_PASS'
evidence_requirements:
  - kind: tests
    description: The focused tests of this change and the existing tests they extend.
    command: uv run --frozen pytest tests/unit/scripts/test_prepr_pool_declared_judge_omn23642.py tests/unit/scripts/test_prepr_pool_pr_head_receipt_omn19566.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23715-driver
    description: The driver hands the node the clone and probe text and applies its answer; an unset command, an error, an unreadable answer and a NO_CHECK answer leave the check absent, a FAIL answer fails it, a NOT_APPLICABLE answer puts its class and substitute proof in the receipt evidence. The test file is absent at the merge base, so the command fails there.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_prepr_pool_declared_judge_omn23642.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn23715-existing-driver-tests
    description: The pool driver tests that exercised the moved rule still pass, now over the node's recorded answers. Tests marked lab_overlay read the lab's private lane manifest, which a hosted runner does not carry, so they are deselected here.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_prepr_runtime_pool_omn18893.py tests/unit/scripts/test_prepr_pool_pr_head_receipt_omn19566.py tests/unit/scripts/test_prepr_pool_live_names_omn18893.py tests/unit/scripts/test_prepr_pool_composed_containers_omn21217.py -q -m 'not lab_overlay' --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn23715-declared-and-integrated
    description: The three timer nodes are declared in the judge overlay (the overlays repository) and a substitute receipt is recorded for each at the shard-crash fix's head; a lab proof run at that head, with the judge command installed on the pool driver's host, posts a lab-proof-receipt check run of success with the class in its evidence. A hosted runner cannot reach the lab host, so the reading is the lane's runtime report.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'test -s "$OMNI_HOME/.claude_scratch/reports/labproof-judge-4070/result.md"'
        cwd: .
  - id: dod-omn23715-hosted-proxy-declared-reading
    description: Hosted proxy for AC2 and AC3. Through the pool driver's path to the node, a declared node with its substitute receipt at the head reads NOT_APPLICABLE with its class and proof in the evidence, and the same change with no receipt or a runtime node no log mentions reads FAIL. The reading on the lab host at the shard-crash fix's head is the unbound local item above, because a hosted runner cannot reach a lab host.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_prepr_pool_declared_judge_omn23642.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn23715-integration-proof-lab
    description: Runs this change's tests at the pushed head on a lab host through the lab work runner; hosted CI cannot reach the lab runner, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23715 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/test_prepr_pool_declared_judge_omn23642.py tests/unit/scripts/test_prepr_pool_pr_head_receipt_omn19566.py -q --no-cov -n 0 -p no:randomly'
        cwd: .
