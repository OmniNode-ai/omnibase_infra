        check_value: >-
          gh api 'repos/OmniNode-ai/omnibase_infra/contents/.github/workflows/ci.yml?ref=dev' --jq .content | base64 -d | grep -q 'dependency-pins.yml@dev-20261103173624-74e0b0f12767'
