    description: "The dependency-pins job calls the core reusable workflow at dev-20261103173624-74e0b0f12767, ten of the eleven omnibase_core hook blocks use that tag, the public-runner-placement block retains its separately bounded revision, and CI Summary registers dependency-pins / Dependency Pins as a strict gate."
    source: generated
    binds_ac: [AC7]
    checks:
      - check_type: command
        check_value: 'uv run --frozen pytest tests/ci/test_dependency_pins_wired_omn22360.py tests/ci/test_ci_summary_gate.py -q -p no:cacheprovider'
  - id: dod-002
    description: "Pin findings fixed at their source: omnibase-spi is a range that admits the newest release in the project table and the uv override, uv.lock resolves it, the version-matrix fallback agrees, and the core validator run over this tree exits 0. The omnibase-compat dependency is deleted on dev by omnibase_infra#5648, so the validator reports nothing on this head."
    source: generated
    binds_ac: [AC8]
    checks:
      - check_type: command
        check_value: 'uv run --frozen check-dependency-pins .'
  - id: dod-003
    description: "Deploy-scope readback, bound to no criterion: the landing branch's ci.yml calls the dependency-pins reusable at the core dev-merge tag; read through the GitHub contents API on dev, it exits non-zero until this change has merged. Only the local Done gate runs it; a pull request runner cannot pass it before the merge."
    source: manual
