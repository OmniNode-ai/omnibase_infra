schema_version: "1.0.0"
ticket_id: OMN-20805
title: Every h201 cron entry records each run's completion
summary: The maintenance installer ships no /etc/cron.d unit; each former root schedule becomes a oneshot service with a timer on the same calendar whose exit reaches systemd, and the runner monitor and push-lane detector installers write user timers instead of crontab lines, so the journal records each run's start, end and exit. AC2's live timer and journal readback on the host is quoted in the PR body; the bound check is the activation test that drives the real sync.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20805
    statement: Every cron entry this repository installs on the lab host either declares a per-run completion line or is replaced by a systemd timer whose journal records each run's exit.
    acceptance:
      - id: AC1
        statement: 'AC1: every h201 cron entry either declares a per-run completion line or is replaced by a timer -- falsifier: `uv run pytest tests -q -k cron_entries_have_completion_evidence`'
      - id: AC2
        statement: 'AC2: on h201 each moved entry''s timer has run and its journal shows the exit -- falsifier: `systemctl list-timers` and `journalctl -u <unit> -n 3` per moved entry, quoted in the PR body'
evidence_requirements:
  - kind: tests
    description: The installers ship timers instead of cron files for every former root schedule, the services let the script's exit reach systemd, the host sync installs and enables the timers before retiring the cron files, the runner monitor and push-lane installers write user timers, and the scanner refuses a planted cron source.
    command: uv run pytest tests/ci/test_cron_entries_have_completion_evidence_omn20805.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20805-ac1
    description: The cron-entry completion tests pass at this head and fail with the merge base's installers, unit files and cron.d sources.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_cron_entries_have_completion_evidence_omn20805.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-20805-ac2
    description: The real maintenance sync, driven against a stub systemctl, enables each timer and confirms it active before it moves the legacy cron file aside, a failed enable leaves the cron file live and fails the run, and --check reddens on an inactive timer. The live h201 list-timers and journal readback is quoted in the PR body.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_maintenance_sync_timer_activation_omn20805.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
