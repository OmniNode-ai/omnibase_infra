schema_version: 1.0.0
ticket_id: OMN-26469
title: The omnibase_infra documentation no longer presents onex-api as a current service
summary: >-
  docs/env-example-full.txt named onex-api as a consumer of the Keycloak admin keys and as the holder of the Infisical path /services/onex-api/auth/. The comment block now states that onex-api is retired (RULING 2026-11-02T15:02:01Z D3, OMN-21288) and that the runtime is the one runtime, and the two key lines name the path as a legacy name. No code, workflow or config file changes; the remaining onex-api hits in this repository are code, tests, workflow comments and release history, outside this documentation change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
