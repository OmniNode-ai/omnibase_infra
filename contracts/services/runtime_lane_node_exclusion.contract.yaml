# The contracts a runtime lane does not attach, and the contracts it needs (OMN-26324).
#
# Read by ModelRuntimeNodeSelection.from_env (the one reader behind the
# auto-wiring ownership filter and the health monitor's expectations): the lane a
# runtime declares in ONEX_RUNTIME_LANE names a profile (the lane without its
# "compose-" prefix, the profile names of runtime_policy.contract.yaml), that
# profile's entry below is selected, and its excluded_contracts join
# ONEX_RUNTIME_NODE_EXCLUSION. A lane with no entry, and a runtime with no
# ONEX_CONTRACTS_DIR, attach exactly what they attached before.
# The file reaches the runtime through the image's contracts/ directory (and the
# ../contracts bind mount), so no compose file names a contract.
#
# Evidence for the dev profile (read 2026-11-21T13:57Z from the dev broker, SASL, read-only):
# a contract is listed only when it subscribes to at least one topic, every topic it
# subscribes to received no message in the broker's whole retention window of 7 days
# (1098 distinct topics read, 213 active, 884 idle, 1 absent), it declares no schedule
# or runtime tick, and it belongs to the lab factory's own tooling (sweeps, landing,
# review, retrospectives, hosts, seams, swarm). A contract with no subscription on the
# dev bus has no traffic to read, and a contract on the gateway, delegation, ledger,
# deploy, health, tenant or onboarding paths is never listed: unproven idle stays wired.
#
# required_contracts is what dev needs (gateway, delegation, ledger, deploy, health).
# tests/unit/runtime/auto_wiring/test_runtime_lane_node_exclusion_omn26324.py fails
# when one of them is also excluded, so the trim breaks a test and not dev.
