schema_version: "1.0.0"
ticket_id: OMN-21536
title: "Handler shape burn-down in omnibase_infra: the N to Z node handlers and two shared handlers take one typed request"
summary: >-
  Core's handler-shape validator (omnibase_core.validation.validator_handler_shape, plan task T2.4a) reported 13 noncanonical_handle findings in the handlers of node_onboarding_orchestrator, node_pattern_lifecycle_effect, node_rrh_emit_effect, node_rsd_data_fetch_effect, node_rsd_orchestrator, node_scope_file_read_effect, node_scope_manifest_write_effect, node_setup_orchestrator, node_validation_executor, node_validation_ledger_write_effect and node_validation_orchestrator, and in handlers/handler_projection_derived_write.py and handlers/handler_validation_adjudicate.py (origin/dev 65e3994c3). Each handle is now handle(request: <typed model>); the parameters it took are fields of the request, or a constructor argument where the value is a collaborator. Twelve nodes (the eleven above plus node_validation_adjudicator) flip to canonical shape for the legacy ratchet, each with an adequacy receipt and a hand-flip proof, and leave the baseline.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21536-nr-handle-shape
    statement: >-
      Every handler named in the summary takes one typed request, and core's handler-shape validator reports no finding for those thirteen handler files.
    acceptance:
      - id: AC8
        statement: >-
          AC8: each flipped handler's handle takes exactly one parameter named request whose annotation is a pydantic model -- falsifier: uv run pytest tests/unit/nodes/test_handler_shape_signatures_omn21536.py -q on a lab host; a handler restored to several parameters fails its test on its own assertion.
      - id: AC9
        statement: >-
          AC9: the validator reports no finding on the thirteen handler files -- falsifier: uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape <the thirteen files> exits 0; any restored multi-parameter handle makes it exit 1.
      - id: AC10
        statement: >-
          AC10: the handlers still do what their tests assert once their callers build the request -- falsifier: the unit tests of the thirteen handlers and their callers pass on a lab host; a caller still passing loose arguments fails with a TypeError.
evidence_requirements:
  - kind: tests
    description: The flipped handlers take one typed request and the node tests still hold.
    command: uv run pytest tests/unit/handlers/projection_derived_write/test_handle_typed_request_omn21536.py tests/unit/nodes/node_onboarding_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/node_onboarding_orchestrator/test_handler_onboarding_interactive.py tests/unit/nodes/node_pattern_lifecycle_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_rrh_emit_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_rsd_data_fetch_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_rsd_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/node_validation_adjudicator/test_handle_typed_request_omn21536.py tests/unit/nodes/node_validation_ledger_write_effect/handlers/test_handle_typed_request_omn21536.py tests/unit/nodes/node_validation_ledger_write_effect/handlers/test_handler_validation_ledger_append.py tests/unit/nodes/node_validation_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/test_handler_shape_signatures_omn21536.py tests/unit/nodes/test_node_rrh_emit_effect.py tests/unit/nodes/test_node_setup_orchestrator/test_cloud_gate.py tests/unit/nodes/test_node_setup_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/test_node_setup_orchestrator/test_handler_setup_orchestrator.py tests/unit/nodes/test_node_validation_executor/test_handle_typed_request_omn21536.py tests/unit/nodes/test_scope_canary/test_handler_scope_file_read.py tests/unit/nodes/test_scope_canary/test_handler_scope_manifest_write.py tests/unit/nodes/test_scope_canary/test_scope_file_read_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/test_scope_canary/test_scope_manifest_write_effect/test_handle_typed_request_omn21536.py tests/unit/test_pattern_lifecycle_effect.py tests/unit/test_validation_executor.py tests/unit/test_validation_orchestrator.py -q -n 0 -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21536-ac8-signature
    description: >-
      Each flipped handler's handle has the single parameter request annotated with a pydantic model.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/test_handler_shape_signatures_omn21536.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC8]
  - id: dod-omn21536-ac9-validator-clean
    description: >-
      Core's handler-shape validator reports nothing for the thirteen handler files.
    source: manual
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape src/omnibase_infra/handlers/handler_projection_derived_write.py src/omnibase_infra/handlers/handler_validation_adjudicate.py src/omnibase_infra/nodes/node_onboarding_orchestrator/handlers/handler_onboarding.py src/omnibase_infra/nodes/node_pattern_lifecycle_effect/handlers/handler_lifecycle_update.py src/omnibase_infra/nodes/node_rrh_emit_effect/handlers/handler_repo_state_collect.py src/omnibase_infra/nodes/node_rrh_emit_effect/handlers/handler_runtime_target_collect.py src/omnibase_infra/nodes/node_rrh_emit_effect/handlers/handler_toolchain_collect.py src/omnibase_infra/nodes/node_rsd_data_fetch_effect/handlers/handler_rsd_data_fetch.py src/omnibase_infra/nodes/node_rsd_orchestrator/handlers/handler_rsd_initiate.py src/omnibase_infra/nodes/node_scope_file_read_effect/handlers/handler_scope_file_read.py src/omnibase_infra/nodes/node_scope_manifest_write_effect/handlers/handler_scope_manifest_write.py src/omnibase_infra/nodes/node_setup_orchestrator/handlers/handler_setup_orchestrator.py src/omnibase_infra/nodes/node_validation_executor/handlers/handler_run_checks.py src/omnibase_infra/nodes/node_validation_ledger_write_effect/handlers/handler_validation_ledger_append.py src/omnibase_infra/nodes/node_validation_orchestrator/handlers/handler_build_plan.py --report-json /dev/null
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC9]
  - id: dod-omn21536-ac10-handler-tests
    description: >-
      The request-shape tests of each handler and the updated node and caller tests pass.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/handlers/projection_derived_write/test_handle_typed_request_omn21536.py tests/unit/nodes/node_onboarding_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/node_onboarding_orchestrator/test_handler_onboarding_interactive.py tests/unit/nodes/node_pattern_lifecycle_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_rrh_emit_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_rsd_data_fetch_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/node_rsd_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/node_validation_adjudicator/test_handle_typed_request_omn21536.py tests/unit/nodes/node_validation_ledger_write_effect/handlers/test_handle_typed_request_omn21536.py tests/unit/nodes/node_validation_ledger_write_effect/handlers/test_handler_validation_ledger_append.py tests/unit/nodes/node_validation_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/test_handler_shape_signatures_omn21536.py tests/unit/nodes/test_node_rrh_emit_effect.py tests/unit/nodes/test_node_setup_orchestrator/test_cloud_gate.py tests/unit/nodes/test_node_setup_orchestrator/test_handle_typed_request_omn21536.py tests/unit/nodes/test_node_setup_orchestrator/test_handler_setup_orchestrator.py tests/unit/nodes/test_node_validation_executor/test_handle_typed_request_omn21536.py tests/unit/nodes/test_scope_canary/test_handler_scope_file_read.py tests/unit/nodes/test_scope_canary/test_handler_scope_manifest_write.py tests/unit/nodes/test_scope_canary/test_scope_file_read_effect/test_handle_typed_request_omn21536.py tests/unit/nodes/test_scope_canary/test_scope_manifest_write_effect/test_handle_typed_request_omn21536.py tests/unit/test_pattern_lifecycle_effect.py tests/unit/test_validation_executor.py tests/unit/test_validation_orchestrator.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC10]
  - id: dod-omn21536-deploy-nr-handle-signature
    description: >-
      Post-deploy probe: the running runtime image carries the one-parameter handle on the setup orchestrator and repo-state handlers. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec omninode-runtime python -c "import inspect; from omnibase_infra.nodes.node_setup_orchestrator.handlers.handler_setup_orchestrator import HandlerSetupOrchestrator as S; from omnibase_infra.nodes.node_rrh_emit_effect.handlers.handler_repo_state_collect import HandlerRepoStateCollect as R; assert list(inspect.signature(S.handle).parameters) == ['self', 'request']; assert list(inspect.signature(R.handle).parameters) == ['self', 'request']"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
