schema_version: 1.0.0
ticket_id: OMN-26703
title: The dev deploy agent builds every runtime merge within an hour, because the guarded probe windows cannot defer a merge past a declared cap
summary: >-
  The idle converge refused probe_window for the whole length of the chained C15 and C16 exclusions even for a lane past its lag bound, so omnimarket 8a5a95e5 (merged 11:49Z on 2026-11-26) waited until 13:00Z. A routing-table flag, max_probe_deferral_minutes (45 on both dev instances), is the age past which a lane behind the dev head converges between the windows. Every other refusal still holds, and an instance with no flag is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26703-probe-deferral-cap
    statement: A runtime merge is never deferred by the probe windows for longer than a declared cap, read from the routing table.
    acceptance:
      - id: AC1
        statement: "AC1: a runtime merge older than the declared maximum deferral age (a setting, default 45 minutes) is built between probe windows instead of deferred again -- falsifier: a unit test replays the 2026-11-26 decision rows (8a5a95e5 deferred:probe_window at 11:49:56Z with chained windows) and asserts a build decision before 12:49Z"
      - id: AC2
        statement: "AC2: the cap is read from settings, never hard-coded -- falsifier: grep for a literal 45 or 2700 in the deploy agent decision code prints nothing"
      - id: AC3
        statement: "AC3: one dev merge after the change reaches a running dev build within 60 minutes -- falsifier: the deploy agent job record and the running image revision show the merge built within 60 minutes of its merge time"
evidence_requirements:
  - kind: tests
    description: The replay of the 2026-11-26 deferral and the existing idle converge suites.
    command: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_probe_deferral_cap_omn26703.py scripts/deploy-agent/tests/unit/test_dev_lane_lag_bound_omn21146.py scripts/deploy-agent/tests/unit/test_idle_converge_omn19509.py -q --no-cov -n 0 -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26703-ac1-replay
    description: >-
      The replay of omnimarket 8a5a95e5 seen behind at 11:49:56Z against the committed probe schedule: with the cap read from the routing table the first converge is before 12:49Z, inside the cap the window still refuses, a job in flight still refuses past it, and an instance with no cap is unchanged.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_probe_deferral_cap_omn26703.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26703-ac2-no-literal
    description: The decision code and the flag model hold no literal 45 or 2700; the value is in config/deploy_lane_routing.yaml.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_probe_deferral_cap_omn26703.py -k cap_is_read_from_settings -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26703-ac3-routing-flag
    description: The default instance declares the cap in the committed routing table.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: grep -c max_probe_deferral_minutes config/deploy_lane_routing.yaml
        cwd: .
