schema_version: "1.0.0"
ticket_id: OMN-22561
title: "The overlay store's table is vendored, ledgered and granted to the runtime"
summary: >-
  omnimarket's node_projection_overlay_store holds each loaded deployment overlay in omninode_internal.overlay_store. This repository vendors its two migrations byte for byte, ledgers and classes them, and declares the runtime's grant ahead of the omnimarket contract, the same bridge shape as its neighbours.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22561-overlay-store-migrations
    statement: The overlay store's table is vendored byte for byte from the omnimarket node, ledgered and granted to the runtime.
    acceptance:
      - id: AC1
        statement: 'AC1: the vendored bytes, ledger binding and classes are exact -- falsifier: uv run --frozen pytest tests/unit/migrations/test_omn22478_overlay_store_vendor.py -q --no-cov'
evidence_requirements:
  - kind: tests
    description: The vendor test.
    command: uv run --frozen pytest tests/unit/migrations/test_omn22478_overlay_store_vendor.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22561-overlay-store-vendor
    description: The vendored overlay store migrations match their pinned bytes and ledger binding, and the column keeps key order.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/migrations/test_omn22478_overlay_store_vendor.py -q --no-cov
        cwd: .
  - id: dod-omn22561-overlay-integration-proof
    description: >-
      The pushed head ran the vendor test on a lab host through the lab work runner. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22561 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/migrations/test_omn22478_overlay_store_vendor.py -q --no-cov
        cwd: .
