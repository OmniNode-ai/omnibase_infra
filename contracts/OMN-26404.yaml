schema_version: 1.0.0
ticket_id: OMN-26404
title: The dev runtime handlers that raise no delivery context from a runtime tick, a replayed message or a projection writer are named and fixed at the cause, and a fresh dev build logs none
summary: >-
  Since OMN-26250 every attached contract dispatcher is wrapped by measure_contract_dispatch, and the wrapper declared only the envelope. The dispatch engine inspects the registered callable to decide whether to pass the delivery coordinates, so it passed none, and every in-process projection writer logged "no delivery context" per message and published at a fixed offset. The wrapper now has the signature of the dispatcher it wraps and passes every argument through. The health gate, the boot guard, the compose file and the wait settings are not changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26404-wrapper-keeps-delivery
    statement: A contract dispatcher attached for cost measurement still receives the delivery coordinates of the consumed record, so a projection writer is not told it has no delivery context, and no gate is weakened.
    acceptance:
      - id: AC1
        statement: "AC1: the handlers that raise no delivery context on the dev log since 2026-11-21T20:24:04Z are named with a count per handler, the code path (runtime tick, replayed message or projection writer) is named with file:line, and the previous container's log is compared, all in the PR body under a section headed Measured source with the host and a UTC read time -- falsifier: onex scm pr-view of the PR shows no section headed Measured source holding a per-handler count and a UTC read time"
      - id: AC2
        statement: "AC2: a regression test built from the recorded dev log excerpt (fixture path named in the PR) fails at the merge base and passes on the PR branch -- falsifier: uv run pytest tests -q -k no_delivery_context_incident"
      - id: AC3
        statement: "AC3: the PR changes no health gate setting, no boot guard file, no compose file and no wait setting -- falsifier: git diff origin/dev --name-only on the PR branch piped through grep -E 'health|boot_guard|compose' prints a line, run after uv run pytest tests -q -k no_delivery_context_incident"
      - id: AC4
        statement: "AC4: after the deploy agent applies the branch on dev, the omninode-runtime log holds no no delivery context line in its first ten minutes -- falsifier: ssh omni-201 docker logs omninode-runtime piped through grep -c 'no delivery context' prints a number above 0 for that window"
evidence_requirements:
  - kind: tests
    description: The no_delivery_context_incident regression built from the recorded dev log a7474c42.
    command: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_no_delivery_context_incident_omn26404.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26404-ac1-fixture-is-the-measured-source
    description: "The recorded fixture holds 38 no delivery context lines for 12 handler and topic pairs and the traceback frame of the cost wrapper; the PR body quotes the per-handler counts under Measured source."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: bash -c 'test "$(grep -c "no delivery context" tests/fixtures/omn26404/dev_runtime_a7474c42_no_delivery_context.log)" = 38 && grep -q "contract_dispatch_cost.py" tests/fixtures/omn26404/dev_runtime_a7474c42_no_delivery_context.log'
        cwd: .
  - id: dod-omn26404-ac2-no-delivery-context-incident
    description: "Each handler and topic pair the incident recorded is dispatched through the real projection callback, the real registration function and the real engine; the writer receives its partition and offset and no error is logged. The test fails at origin/dev."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/auto_wiring/test_no_delivery_context_incident_omn26404.py -k no_delivery_context_incident -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26404-ac3-gate-unchanged
    description: "The change edits no health gate setting, boot guard file, compose file or wait setting."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: bash -c '! git diff origin/dev --name-only | grep -E "health|boot_guard|compose"'
        cwd: .
  - id: dod-omn26404-ac4-dev-log-clean
    description: "Post-deploy probe: the dev runtime log holds no no delivery context line. It reads the live container, which carries this change only after the deploy agent has rebuilt it, so a pull request runner cannot pass it; only the local Done gate runs it."
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: bash -c 'test "$(docker logs omninode-runtime 2>&1 | grep -c "no delivery context")" = 0'
