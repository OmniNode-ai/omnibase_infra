schema_version: "1.0.0"
ticket_id: OMN-19998
title: The broker-wedge rerun scan reads jobs only of runs that can hold a wedge job
summary: The completed-run scan skips job reads for runs whose conclusion is success, skipped or neutral. Runs concluding failure, cancelled or timed_out, and runs with no conclusion, still reach the existing job-signature detector and targeted rerun.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-run-conclusion-filter
    statement: The broker-dispatch-wedge scanner must avoid job-list reads for completed runs that cannot contain a wedge job while retaining reads and detection for candidate runs.
    acceptance:
      - id: AC1
        statement: 'AC1: success, skipped and neutral runs cause no job-list reads, while failure, cancelled, timed_out and missing conclusions retain wedge detection; the recorded 100-run list reads only candidate runs -- falsifier: uv run pytest tests/ci/test_runner_broker_dispatch_wedge_rerun.py -q -k "TestOnlyFailedRunsAreRead or test_recorded_runs_list_reads_only_runs_that_can_hold_a_wedge"'
  - id: req-omn19998-contracts-strict-load-precommit
    statement: A commit that touches a ticket contract under contracts/ must run the strict contract load test, so a merge that keeps two description and command pairs under one evidence item is refused at commit instead of in CI.
    acceptance:
      - id: AC20
        statement: 'AC20: the contracts-strict-load pre-commit hook runs tests/ci/test_contracts_strict_load_omn20945.py at the pre-commit stage and fires on contracts/*.yaml, and run against the OMN-19998 contract with an evidence item carrying two description and command pairs it fails -- falsifier: uv run pytest tests/ci/test_contracts_strict_load_precommit_omn19998.py -q -n 0 fails on the merge-base .pre-commit-config.yaml, which has no such hook'
  - id: req-omn19998-routing-audit-gateway-split
    statement: The runner routing audit's private-workflow batch read must read a batch again in halves when GitHub answers it with a gateway error (HTTP 502, 503 or 504), and must still raise when a single repository stays unread.
    acceptance:
      - id: AC2
        statement: 'AC2: a seventeen-repository batch answered HTTP 504 is read in smaller batches and returns every repository; one repository still answered HTTP 504 after its retry raises; a non-gateway failure raises after one read -- falsifier: uv run pytest tests/ci/test_runner_routing_audit.py -q -k "gateway"'
  - id: req-omn19998-pr-title-install-budget
    statement: The PR title node test module's published-release install fixture must have a time budget longer than the CI test splits' command-line --timeout, and must bound a stalled package-index read so uv retries it, so one slow PyPI read no longer fails dev's CI Summary.
    acceptance:
      - id: AC3
        statement: 'AC3: every test that takes the installed_node fixture carries a timeout marker above the install subprocess timeout, which is above the --timeout of the full-suite pytest step in ci.yml, and the fixture sets UV_HTTP_TIMEOUT below the install timeout -- falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0 --timeout=60 fails test_install_budget_outlasts_the_ci_test_timeout on the merge-base test module'
  - id: req-omn19998-lab-follows-dev-tag
    statement: A workspace build that stages omnimarket from its dev branch must stage the newest dev-* tag on its origin instead, the deploy agent must follow that tag as omnimarket's head, and every deploy-agent instance must publish a heartbeat against it that raises an alarm once its runtime runs behind the tag for more than two hours.
    acceptance:
      - id: AC4
        statement: 'AC4: RT-1 checkout with --follow-dev-tag builds the newest well-formed dev-* tag in place of origin/dev or its fallback, keeps explicit SHAs, builds the branch when origin has no dev tag, refuses a newest tag off the branch; the deploy agent follows the newest tag, beats on every instance and alarms past two hours behind -- falsifier: uv run pytest tests/scripts/test_deploy_source_ref_dev_tag_omn19998.py -q -n 0 fails against the merge-base deploy_source_ref.py'
  - id: req-omn19998-lab-alarm-dev-tag-heartbeat
    statement: 'Operator RULINGs 2026-10-16T07:34:18Z and 2026-10-16T09:35:49Z: the deploy agent publishes a dev-tag heartbeat on /dev-tag-heartbeat and nothing read it. The lab alarm must read it and raise when the beat of a followed repository has gone quiet, is missing, or reports the lane behind its newest dev tag, and must stay quiet on a fresh beat.'
    acceptance:
      - id: AC21
        statement: 'AC21: against a fresh heartbeat fixture the dev_tag_heartbeat condition reads OK; against the stale fixture, the same document with observed_at 3h50m before the read, it raises one alarm naming omnimarket; a missing beat and a beat reporting the lane behind its newest tag each raise one; an unreachable or malformed answer reads INDETERMINATE; through run_once a stale beat raises once across two runs and clears -- falsifier: uv run pytest tests/ci/test_lab_alarm_dev_tag_heartbeat_omn19998.py tests/ci/test_lab_alarm_omn18867.py -q -n 0 -k "dev_tag or heartbeat"'
  - id: req-omn19998-prepr-isolated-docker-auths
    statement: The pre-PR pool prover's isolated docker config must hold no credential store, no credential helper and no credential, and must keep a non-empty auths map so the docker CLI stays on the plain file store instead of detecting the macOS keychain again.
    acceptance:
      - id: AC5
        statement: 'AC5: the config snippet in prepr_pool_prove.sh, run against a keychain-backed config, writes one with no credsStore or credHelpers, a non-empty auths map and no auths entry holding a credential -- falsifier: uv run pytest tests/unit/scripts/test_prepr_runtime_pool_omn18893.py -q -k test_isolated_docker_config_pins_the_file_store_and_holds_no_credential fails on the merge-base prepr_pool_prove.sh'
  - id: req-omn19998-studio-multiarch-ci-pool
    statement: The runner fleet must declare an opt-in label omnibase-ci-multiarch carried by both amd64 action pools and by a capped, credential-free, socket-free arm64 pool on the Mac Studio host that never carries omnibase-ci, so arch-neutral private-repo jobs can run on that host and no existing omnibase-ci job can land on arm64.
    acceptance:
      - id: AC6
        statement: 'AC6: the Mac Studio host declares pool omninode-studio-ci-runner (4 runners, class action-multiarch); its compose services carry omnibase-ci-multiarch and arch-arm64, never omnibase-ci, x64, arch-amd64 or a host label, mount no docker socket or credential, and are capped at 1.5 CPU and 3g; both amd64 action pools carry omnibase-ci-multiarch; declared_total(action) stays 26 -- falsifier: uv run pytest tests/ci/test_studio_ci_runner_multiarch_omn19998.py -q -n 0 fails on the merge-base tree'
  - id: req-omn19998-dev-maintenance-check-fences
    statement: Dev maintenance checks must assert that fences naming prod or excluding dev suppress migration convergence and lane mirroring, and that lane mirroring never targets a governed lane even on a mixed lab fence.
    acceptance:
      - id: AC7
        statement: 'AC7: migration and mirror checks cover prod, dev plus prod, all lanes, and the stability lane alone as excluded fences; mirror checks reject every non-dev target with a dev or mixed lab fence.'
  - id: req-omn19998-memory-event-ci-runs-bound
    statement: The lane container memory event must stay publishable after a gap or a boot. An unfinished runner worker log that is not its runner's newest log must be bounded by that runner's next job start instead of overlapping every window, and a window longer than two hours must attribute only its last two hours of CI jobs and log a CI_RUNS_TRUNCATED notice, with the event schema unchanged.
    acceptance:
      - id: AC8
        statement: 'AC8: an abandoned unfinished run is not listed in a later window, the newest unfinished run of a runner is still listed, a window longer than two hours lists only its last two hours and yields the CI_RUNS_TRUNCATED notice while a one-hour window yields none, and a clean census pass still exits 0 and logs the notice -- falsifier: uv run pytest tests/unit/scripts/test_lane_container_memory_event.py -q -n 0 -k "abandoned or newest_unfinished or long_window or hourly_window or first_pass_after_a_boot or clean_pass" fails on the merge-base builder'
  - id: req-omn19998-stability-follows-dev-tag
    statement: A lab dev deploy agent whose fence admits the stability lane beside dev must keep the dev lane's own behaviour, and on its idle tick it must rebuild the stability lane, as its own job named agent/stability-follow-tag, onto the newest omnimarket dev tag once the dev lane runs that tag, so the stability lane never trails dev by more than one tag; the dev lane's env fragment must never reach a stability-lane job.
    acceptance:
      - id: AC9
        statement: 'AC9: an agent whose fence names dev and the stability lane runs one stability-lane rebuild requested by agent/stability-follow-tag when dev runs the newest tag and the stability lane does not, none while dev runs an older tag, none when the stability lane already runs it, none on a fence of dev alone or one naming prod, one attempt per tag; a stability-lane job takes no dev env fragment -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_stability_follows_dev_tag_omn19998.py scripts/deploy-agent/tests/unit/test_lane_env_fragment_omn20867.py -q -p no:randomly fails against the merge-base deploy_agent'
  - id: req-omn19998-infra-dev-merge-tag
    statement: 'Operator RULING 2026-10-16T09:35:49Z: in the lab, tags replace releases, made automatic. omnibase_infra, a sibling omnimarket pins, tags every push to dev with a lightweight dev-<UTC YYYYMMDDHHMMSS>-<sha12> tag on the pushed commit, idempotent per commit, with no tag on any other ref, so omnimarket can pin it.'
    acceptance:
      - id: AC10
        statement: 'AC10: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py -q -n 0 fails at the merge base, where the workflow does not exist'
  - id: req-omn19998-pr-merged-unique-key-vendor
    statement: Node migration 0003 of node_pr_merged_projection, which collapses duplicate pr_merged_events rows and adds UNIQUE (repo, pr_number), is deployed with only its two PostgreSQL catalog reads qualified as pg_catalog, with pinned source and deployment digests, one checksum-bound ledger row and the forward-only class the migration class checker reads from its statements.
    acceptance:
      - id: AC11
        statement: 'AC11: the deployment copy hashes to 2a1141966f9b9cdc83caf6e60d64cf866953312453d560f32efcd00a59651309, reversing only the two pg_catalog qualifications recovers source digest 68c4220235df46969883a9febc3887cc7b867a5d18b928aaeba6cc2c72be6634, its catalog reads pass application database domain enforcement, it deletes duplicates before adding UNIQUE (repo, pr_number), has exactly one ledger row carrying that checksum and is declared forward-only -- falsifier: uv run pytest tests/unit/migrations/test_omn19998_pr_merged_unique_key_vendor.py fails at the dev base, where the file is absent'
  - id: req-omn19998-ci-runner-uv-cache-hardlink
    statement: The second lab host's CI runners must keep their uv cache inside the job-workspace mount, with uv's default link mode, so a warm uv sync hardlinks wheel contents instead of copying them across two bind mounts.
    acceptance:
      - id: AC13
        statement: 'AC13: each of the sixteen services of the second-host CI runner pool sets UV_CACHE_DIR to a path under its _work mount, binds no separate uv cache mount and sets no UV_LINK_MODE -- falsifier: uv run pytest tests/ci/test_omnipc2_ci_runner_scratch_caches.py -q -n 0 -k uv_cache fails on the merge-base compose'
  - id: req-omn19998-runner-hook-dir-mount
    statement: A runner container must see a hook file that a deploy replaced, and a runner whose job-started hook is missing, empty or not a script must stop taking jobs instead of staying unhealthy while it runs them.
    acceptance:
      - id: AC12
        statement: 'AC12: no runner compose service bind-mounts docker/runners files singly; every hook service mounts ./runners read-only at /opt/onex-runner-hooks with the hook env var, entrypoint wrapper and healthcheck inside it; healthcheck.sh fails and, after its grace, runs docker stop on its own container when the hook is missing, empty or has no shebang; on a real docker daemon an rsync-replaced hook is seen through the directory mount and is not seen through a single-file mount -- falsifier: uv run pytest tests/ci/test_runner_hook_dir_mount_omn19998.py -q -n 0 fails on the merge-base compose and healthcheck'
  - id: req-omn19998-drain-then-relabel-roll
    statement: deploy-runners.sh must carry a drain-then-relabel roll that re-registers an online runner pool under its rendered label set, one runner at a time and only once the runner is idle on the container's own evidence, on the primary host and on a secondary host pool, at an unchanged runner count.
    acceptance:
      - id: AC14
        statement: 'AC14: --relabel leaves a busy runner untouched, stops and recreates each idle runner in turn under its own compose project with the registration token on stdin and never in argv or output, refuses a runner whose compose lacks the label or would drop a label it holds, halts at a runner that does not return healthy, caps registry reads, and reads the pool back with the same registered count -- falsifier: uv run pytest tests/unit/scripts/test_deploy_runners_relabel_roll_omn19998.py -q fails on the merge-base deploy-runners.sh'
  - id: req-omn19998-role-omnidash-projection-watermarks
    statement: The dev lane's live-events writer connects as role_omnidash and upserts omninode_internal.projection_watermarks after every batch; role_omnidash must hold schema USAGE and SELECT, INSERT and UPDATE on that one table and nothing else in the schema.
    acceptance:
      - id: AC22
        statement: 'AC22: node_projection_registration migration 0008 grants USAGE ON SCHEMA omninode_internal and SELECT, INSERT, UPDATE ON omninode_internal.projection_watermarks to role_omnidash, nothing more, with a manifest row binding its bytes; applied to a Postgres where 0005 created the table, the watermark upsert as role_omnidash fails with permission denied for schema omninode_internal before it and succeeds after -- falsifier: uv run pytest tests/unit/db/test_projection_watermarks_role_omnidash_grant_omn19998.py -q -n 0 fails at the merge base, where the migration file does not exist'
  - id: req-omn19998-infra-no-omnimarket-dependency
    statement: omnibase_infra must not declare omnimarket in pyproject.toml, lock it in uv.lock, or import it at module import time under src/omnibase_infra, enforced by a pre-commit hook and a step of the required Lint job.
    acceptance:
      - id: AC15
        statement: 'AC15: the guard passes on the tree and fails on a manifest, lock or module that names omnimarket, and fails the live tree with an omnimarket requirement in pyproject.toml or a module-scope import in src -- falsifier: uv run pytest tests/ci/test_no_omnimarket_dependency_omn19998.py -q -n 0 fails with "import omnimarket" appended to src/omnibase_infra/runtime/entrypoint_preflight.py'
  - id: req-omn19998-broker-profile-checks
    statement: Broker profile regressions require the five original settings by name while permitting additional settings, and the control-plane fake broker accepts group_offset_retention_sec without dropping any topic assertions.
    acceptance:
      - id: AC27
        statement: 'AC27: the disk profile positive control asserts all original keys by name, and the control-plane fake broker answers group_offset_retention_sec with 86400; the original topic creation, race and failure tests pass with the additional setting.'
  - id: req-omn19998-forwarder-inbound-survives-bad-record
    statement: The gateway forwarder inbound leg keeps delivering when one cloud record carries no event_type or a consumer start does not finish.
    acceptance:
      - id: AC17
        statement: 'AC17: an inbound envelope with no event_type is refused as a GatewayRecordRefusedError (quarantined, never republished), and a KafkaTransport whose consumer start raised or was cancelled holds no never-started consumer and builds a fresh one on the next poll -- falsifier: uv run pytest tests/unit/nodes/node_bus_forwarder_effect/test_gateway_inbound_untyped_envelope_omn19998.py tests/unit/event_bus/test_kafka_transport_failed_start_omn19998.py -q -n 0 fails on the merge-base tree'
  - id: req-omn19998-dev-lane-group-offset-retention
    statement: The dev lane's shared broker-profile one-shot must set the Redpanda cluster property group_offset_retention_sec to 86400 and read it back, so per-run consumer groups with no member for a day expire instead of accumulating for seven; a lane that declares no value keeps the cluster default.
    acceptance:
      - id: AC16
        statement: 'AC16: the dev lane renders REDPANDA_GROUP_OFFSET_RETENTION_SEC=86400 on redpanda-partition-cap and its script sets then reads back group_offset_retention_sec; the base infra file renders the value empty and its script never sets it -- falsifier: uv run pytest tests/unit/infra/test_dev_lane_group_offset_retention_omn19998.py -q -n 0 fails at the merge base, where the variable is not rendered'
  - id: req-omn19998-bump-regenerates-runner-lock
    statement: The release workflow's post-release dev version bump must regenerate docker/runners/runner-image.lock.json after it re-locks uv.lock and stage it in the bump commit, because uv.lock bytes feed the runner image identity and a bump PR with a stale lock fails tests/ci/test_runner_image_identity.py and runner-image-build-smoke.
    acceptance:
      - id: AC23
        statement: 'AC23: the post-release-dev-bump job runs scripts/ci/runner_image_identity.py --mode generate after uv lock and its git add names docker/runners/runner-image.lock.json -- falsifier: uv run pytest tests/ci/test_post_release_dev_bump_workflow.py -q -n 0 -k "runner_image_lock" fails against the merge-base release.yml'
  - id: req-omn19998-public-runner-placement
    statement: 'Operator RULING 2026-10-16T07:07:09Z: CI runners are for private repositories only. omnibase_infra is public, so no workflow routing fallback may name the self-hosted fleet except the two lab-broker carve-outs (runtime rebuild, hostile review), the nightly performance benchmarks and the dev merge tag run on a GitHub-hosted label, and omnibase_core''s check-public-runner-placement runs as a CI Summary registered job and as a pre-commit hook at one core pin.'
    acceptance:
      - id: AC28
        statement: 'AC28: no workflow line outside the two carve-outs carries the self-hosted fleet fallback, performance-tests and dev-merge-tag run on ubuntu-latest, the Public Runner Placement job is unconditional, hosted, carries a positive control and the same core pin as the hook, and CI Summary registers it -- falsifier: uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q -n 0 fails at the merge base, where 178 fallback lines name the fleet and neither the job nor the hook exists'
  - id: req-omn19998-routing-audit-quota-isolation
    statement: The routing audit must retain its live organization and private-repository assertions without GraphQL reads or a REST read per workflow file. Same-repository content uses the run token, while organization variable metadata and private sibling content retain the existing privileged reader. Unread state must fail separately from drift.
    acceptance:
      - id: AC24
        statement: 'AC24: repository discovery paginates REST across every visibility class and excludes archived repositories; workflow content comes from the default branch through sparse Git reads, including an empty directory positive control, with no GraphQL or per-file REST requests.'
      - id: AC25
        statement: 'AC25: the workflow binds GH_TOKEN and checkout to github.token, binds RUNNER_AUDIT_ORG_TOKEN to the existing org reader, and selects the run token for same-repository content while variable metadata and sibling content use the privileged reader.'
      - id: AC26
        statement: 'AC26: quota, transport and malformed-response failures produce a named infrastructure refusal and nonzero audit result; CI Summary reports the failed infrastructure marker separately and still fails, while real drift findings remain visible.'
evidence_requirements:
  - kind: tests
    description: The routing audit controls exercise paginated REST inventory, sparse default-branch Git reads, credential selection and fail-closed infrastructure reporting.
    command: uv run pytest tests/ci/test_runner_routing_audit.py -q -n 0 --no-cov
  - kind: tests
    description: The run-conclusion tests and recorded runs-list replay exercise the scanner against its HTTP endpoints and count job-list reads.
    command: uv run pytest tests/ci/test_runner_broker_dispatch_wedge_rerun.py -q -k "TestOnlyFailedRunsAreRead or test_recorded_runs_list_reads_only_runs_that_can_hold_a_wedge"
  - kind: tests
    description: The hook tests read .pre-commit-config.yaml for the contracts-strict-load hook, its stage, its entry and the paths its files pattern fires on.
    command: uv run pytest tests/ci/test_contracts_strict_load_precommit_omn19998.py tests/ci/test_contracts_strict_load_omn20945.py -q -n 0
  - kind: tests
    description: The gateway-split tests drive the batch reader with a fake gh that answers HTTP 504 and count the reads.
    command: uv run pytest tests/ci/test_runner_routing_audit.py -q -k "gateway"
  - kind: tests
    description: The structural budget test reads the full-suite step's --timeout from ci.yml and the three installed-node tests' timeout markers; the whole module passes under --timeout=60.
    command: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0 --timeout=60
  - kind: tests
    description: The checkout tests build tags against a local origin; the agent tests drive the heartbeat, the alarm and the followed head through the agent's seams.
    command: uv run pytest tests/scripts/test_deploy_source_ref_dev_tag_omn19998.py -q -n 0
  - kind: tests
    description: The heartbeat tests read a fresh and a stale recording-shaped fixture of /dev-tag-heartbeat through the condition, the shipped config and run_once.
    command: uv run pytest tests/ci/test_lab_alarm_dev_tag_heartbeat_omn19998.py tests/ci/test_lab_alarm_omn18867.py -q -n 0 -k "dev_tag or heartbeat"
  - kind: tests
    description: The isolated-config test runs the prover's own config snippet against a fake keychain-backed docker config and reads the written file.
    command: uv run pytest tests/unit/scripts/test_prepr_runtime_pool_omn18893.py -q -k test_isolated_docker_config_pins_the_file_store_and_holds_no_credential
  - kind: tests
    description: The structural tests read config/runner_fleet.yaml through the fleet model, the three runner compose files and the fleet panel's label classifier.
    command: uv run pytest tests/ci/test_studio_ci_runner_multiarch_omn19998.py -q -n 0
  - kind: tests
    description: The builder tests drive select_ci_runs and build_event over fixture worker runs; the census pass tests run lane-census-check.sh against a stubbed docker and broker.
    command: uv run pytest tests/unit/scripts/test_lane_container_memory_event.py -q -n 0
  - kind: tests
    description: The follow tests drive the decision table and the agent's idle tick through its seams with a lab fence, and the fragment test runs compose env inside a dev and a stability-lane job.
    command: uv run pytest scripts/deploy-agent/tests/unit/test_stability_follows_dev_tag_omn19998.py scripts/deploy-agent/tests/unit/test_lane_env_fragment_omn20867.py -q -p no:randomly
  - kind: tests
    description: The pr_merged_events 0003 deployment digest and source provenance, catalog qualification, ledger checksum and forward-only class are checked.
    command: uv run pytest tests/unit/migrations/test_omn19998_pr_merged_unique_key_vendor.py -q -n 0
  - kind: tests
    description: The structural test reads the sixteen services of the second-host CI runner pool and asserts the uv cache path lies under the work mount, no separate uv bind mount and no copy link mode.
    command: uv run pytest tests/ci/test_omnipc2_ci_runner_scratch_caches.py -q -n 0
  - kind: tests
    description: The relabel tests run the real script against a stubbed ssh, rsync, gh and docker over one state file and assert on the calls the script made.
    command: uv run pytest tests/unit/scripts/test_deploy_runners_relabel_roll_omn19998.py -q
  - kind: tests
    description: The grant tests read the migration statements, its assertions, its manifest row checksum and the live-events writer's compose binding.
    command: uv run pytest tests/unit/db/test_projection_watermarks_role_omnidash_grant_omn19998.py -q -n 0
  - kind: tests
    description: The topology tests read the three shipped instances for the role_omnidash declaration the live-ACL gate diffs the grant against, and the generator's retention of an unbound principal's TABLE grants.
    command: uv run pytest tests/unit/topology/test_role_omnidash_watermark_principal_omn19998.py -q -n 0
  - kind: tests
    description: The workflow wiring tests read the post-release-dev-bump job's own YAML slice from release.yml.
    command: uv run pytest tests/ci/test_post_release_dev_bump_workflow.py -q -n 0
  - kind: tests
    description: The guard reads the live pyproject.toml, uv.lock and src tree, and its negative controls feed it manifests, locks and modules that depend on omnimarket.
    command: uv run pytest tests/ci/test_no_omnimarket_dependency_omn19998.py -q -n 0
  - kind: tests
    description: The inbound refusal tests drive ServiceGatewayForwarder with a real ModelEventEnvelope; the transport tests replace aiokafka's consumer with one whose getmany fails like aiokafka 0.13.0 before start() finishes.
    command: uv run pytest tests/unit/nodes/node_bus_forwarder_effect/test_gateway_inbound_untyped_envelope_omn19998.py tests/unit/event_bus/test_kafka_transport_failed_start_omn19998.py -q -n 0
  - kind: tests
    description: The retention tests render the dev lane and the base infra file with docker compose config and run the rendered one-shot script against a stubbed rpk.
    command: uv run pytest tests/unit/infra/test_dev_lane_group_offset_retention_omn19998.py -q -n 0
  - kind: tests
    description: The placement tests read every workflow file for the fleet fallback, the ci.yml job, .pre-commit-config.yaml and the CI Summary gate list.
    command: uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19998-ac24-routing-audit-git-rest
    description: AC24 exercises the production sparse Git reader against a local repository default branch, the empty-workflows positive control and the paginated REST inventory.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_runner_routing_audit.py -q -n 0 --no-cov -k 'repository_inventory or sparse_default_branch or every_private_repository'
        cwd: .
    binds_ac:
      - AC24
  - id: dod-omn19998-ac25-routing-audit-token-scope
    description: AC25 checks the workflow token bindings and the run-token versus privileged-reader selection.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_runner_routing_audit.py -q -n 0 --no-cov -k 'workflow_uses_run_token or variable_reads_use_org_token'
        cwd: .
    binds_ac:
      - AC25
  - id: dod-omn19998-ac26-routing-audit-infrastructure
    description: AC26 exercises quota, transport and response refusals, retains drift findings and checks that CI Summary reports infrastructure separately while failing closed.
    source: manual
