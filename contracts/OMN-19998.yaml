  - id: dod-omn19998-studio-multiarch-deploy-config-probe
    description: Deploy configuration probe for AC6. Read the runner compose from GitHub at the checked-out commit and require exactly four opt-in arm64 runners with the declared CPU and memory caps and without a docker socket or lab credentials. The content endpoint is reachable from hosted CI and is absent at the merge base. This checks the published deployment configuration only; registering and activating the runners still requires an operator-minted registration token.
