schema_version: 1.0.0
ticket_id: OMN-24299
title: Runner action archive cache so jobs take helper programs from a local copy instead of GitHub
summary: A declared action archive cache (typed fleet config, a fill operation on the runner deploy node, runner env and read-only mounts on the h202, h053 and h051 action pools, and the deploy wiring) so a runner resolves the actions a job uses from a local archive keyed by the resolved sha before it downloads from GitHub.
is_seam_ticket: true
interface_change: true
interfaces_touched: [infrastructure]
requirements:
  - id: req-omn24299-action-archive-cache
    statement: Runner pools resolve `uses:` actions from a local archive cache keyed by owner_repo and the resolved commit sha, filled from the canonical clones and a once-per-ref source mirror, and fall back to GitHub when an archive is absent.
    acceptance:
      - id: AC1
        statement: 'AC1: config/runner_fleet.yaml declares an action_archive_cache block (cache root, in-container path, source repos, remote url template, refresh interval) read by a typed model that refuses a block with a relative path or an empty source list -- falsifier: uv run pytest tests/unit/observability/runner_health/test_action_archive_cache_config.py -q'
      - id: AC2
        statement: 'AC2: the fill node writes one archive per pinned action ref at <owner>_<repo>/<resolved sha>.tar.gz under the cache root, skips a file already present, and an unreachable source names the ref in a typed refusal while the other refs are still filled -- falsifier: uv run pytest tests/unit/handlers/test_handler_action_archive_cache_fill_omn24299.py -q'
      - id: AC3
        statement: 'AC3: every runner service of the h202, h053 and h051 action pools sets ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE to the declared in-container path and mounts the cache root read-only -- falsifier: uv run pytest tests/unit/observability/runner_health/test_action_archive_cache_compose.py -q'
      - id: AC4
        statement: 'AC4: integrated: after deploy-runners.sh recreates one h202 pool runner from the branch, a job on it logs that it found the action archive in the cache for checkout and setup-python and logs no download from GitHub for them -- falsifier: the job log on h202 holds no Download action repository line for a cached action and holds Found action archive'
evidence_requirements:
  - kind: tests
    description: Typed config, fill handler (real git fixtures, golden and error chains, seam to the runner's lookup path, wrong-layout failing control) and the compose and deploy-script declarations.
    command: uv run pytest tests/unit/observability/runner_health/test_action_archive_cache_config.py tests/unit/handlers/test_handler_action_archive_cache_fill_omn24299.py tests/unit/observability/runner_health/test_action_archive_cache_compose.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24299-config
    description: AC1 typed config and declaration.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/observability/runner_health/test_action_archive_cache_config.py -q
        cwd: .
    binds_ac:
      - AC1
  - id: dod-omn24299-fill
    description: AC2 fill operation over real git fixtures, with the error chain and the layout failing control.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_action_archive_cache_fill_omn24299.py -q
        cwd: .
    binds_ac:
      - AC2
      - AC4
  - id: dod-omn24299-compose
    description: AC3 runner declarations and deploy wiring.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/observability/runner_health/test_action_archive_cache_compose.py -q
        cwd: .
    binds_ac:
      - AC3
  - id: dod-omn24299-deploy-probe
    description: 'Deploy probe: the branch carries the fill handler, read from the repository through gh. This is a presence probe, not the runtime proof; AC4 is read in the running runtime (a job log on a recreated runner) and recorded in the pull request Lab comment, because hosted CI cannot reach the lab.'
    source: manual
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_action_archive_cache_fill.py?ref=omn-19998-ci-actions-cache" --jq .content | base64 -d | grep -q 'class HandlerActionArchiveCacheFill'
        cwd: .
    binds_ac:
      - AC2
      - AC4
