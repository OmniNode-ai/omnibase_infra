schema_version: 1.0.0
ticket_id: OMN-23333
title: The dev lane's lab-pass receipt writer reads the container that carries the folded effects role
summary: The dev lane's lab-pass receipt writer took its effects container from verify.effects_container of config/deploy_lane_routing.yaml, which still named the separate effects container after the dev lane folded effects into main. The converge step ended no such object and INDETERMINATE, so no merge after 2026-11-08T12:05Z got a PASS receipt and the reading of rebuild piece 11 read no PASS receipt. The row and the guard default now name the main runtime container, and a test ties the row to the fold policy.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23333-verify-reads-folded-effects
    statement: The dev lane's verify row names the container that runs the effects role according to docker/runtime-policy.env, and a row naming a container the policy folded away is refused by a test.
    acceptance:
      - id: AC1
        statement: 'AC1: the committed dev-201 verify row names the main runtime container as its effects container while the policy folds effects into main, and the same row with the separate effects container name or an unfolded policy is refused -- falsifier: uv run pytest tests/ci/test_dev_verify_effects_target_folded_omn23333.py -q, failing on the unfixed routing table'
      - id: AC2
        statement: 'AC2: after the change is on dev, the next dev lane verify job converge step reads the lane revision without a no such object error and the dev lane row of the lane-health projection carries a receipt newer than 2026-11-08T12:05Z -- falsifier: the projection row still carries receipt_observed_at 2026-11-08T12:05:16Z'
evidence_requirements:
  - kind: tests
    description: The verify route tests and the new folded effects target test pass
    command: uv run --frozen pytest tests/ci/test_dev_verify_effects_target_folded_omn23333.py tests/ci/test_deploy_lane_verify_route_omn19507.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23333-folded-effects-target
    description: The committed table's dev-201 row names the main runtime container as the effects container while docker/runtime-policy.env folds effects into main; the retired name and an unfolded policy are refused. With config/deploy_lane_routing.yaml taken from dev the first test fails.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_dev_verify_effects_target_folded_omn23333.py -q --no-cov -p no:randomly
        cwd: .
  - id: dod-omn23333-verify-route-regression
    description: The verify route tests, with the dev-201 expected row updated to the folded container. A regression check, not proof of a criterion.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_deploy_lane_verify_route_omn19507.py tests/ci/test_lane_sibling_revision_omn18268.py -q --no-cov -p no:randomly
        cwd: .
  - id: dod-omn23333-receipt-after-merge
    description: Reads the dev lane row of the lane-health projection on the lab runtime after the change is on dev and a runtime-affecting merge has been verified; it holds only on the lab host.
    source: manual
    binds_ac:
      - AC2
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          curl -s "$LAB_LANE_HEALTH_URL" | python3 -c 'import json,sys; r=json.load(sys.stdin)["rows"][0]; assert r["receipt_observed_at"] > "2026-11-08T12:05:16"'
        cwd: .
