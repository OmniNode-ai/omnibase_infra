schema_version: "1.0.0"
ticket_id: OMN-23659
title: Contract topic update database command fails with a syntax error
summary: >-
  SQL_UPSERT_TOPIC of node_contract_persistence_effect carried a Python-style marker comment inside the SQL text, so PostgreSQL answered every call with a syntax error at the hash sign (640 errors in six minutes on the dev runtime), and its parameter $3 was untyped in two places, which the server refuses once the comment is gone. The comment is removed and $3 is cast to text. A live test now drives all six handlers of the directory through a real asyncpg pool on an ephemeral PostgreSQL and a coverage test fails when a SQL constant has no live step. The node's contract declares its effect archetype so the no-I/O-outside-effects hook accepts edits of its handlers.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23659-topic-update-sql-runs
    statement: The topic update statement and every other SQL string of node_contract_persistence_effect handlers must run on a real PostgreSQL 16 through the handler's own handle().
    acceptance:
      - id: AC1
        statement: 'AC1: the topic update statement runs on a real PostgreSQL 16 and leaves the topic row with the contract ids merged -- falsifier: pytest tests/integration/migrations/test_contract_persistence_handlers_sql_live.py -k every_handler with the marker comment put back inside the statement fails on syntax error at the hash sign'
      - id: AC2
        statement: 'AC2: all six statements of node_contract_persistence_effect handlers run on a real PostgreSQL 16 and a new statement without a live step fails the coverage test -- falsifier: pytest tests/integration/migrations/test_contract_persistence_handlers_sql_live.py with a typo put into the heartbeat statement fails at the heartbeat step'
      - id: AC3
        statement: 'AC3: integrated: after the release carrying this change is rolled to the dev runtime, the dev database log shows no syntax error at the hash sign from the topic update statement over a ten minute window -- falsifier: a read of the dev PostgreSQL error log for that window that still shows the error'
evidence_requirements:
  - kind: tests
    description: The live handler SQL test and the unit tests of the same node, on a scratch PostgreSQL 16.
    command: uv run --frozen pytest tests/integration/migrations/test_contract_persistence_handlers_sql_live.py tests/unit/nodes/node_contract_persistence_effect -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23659-ac1-topic-update-runs
    description: The topic update handler's statement runs on PostgreSQL 16 and merges contract ids into one topic row. With the original statement the live test fails at the topic update step with syntax error at or near the hash sign; with only the comment removed it fails with could not determine data type of parameter $3.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/migrations/test_contract_persistence_handlers_sql_live.py -q -n 0 --no-cov -p no:randomly -k every_handler
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23659-ac2-all-six-statements
    description: Every SQL constant of the handlers directory has a live step, and a typo in the heartbeat statement or a hash comment in the cleanup statement fails the live test at that handler's own step.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/migrations/test_contract_persistence_handlers_sql_live.py -q -n 0 --no-cov -p no:randomly -k every_sql_constant
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23659-ac3-integrated-runtime
    description: After the omnibase_infra release train carries this change and the deploy agent rolls its tag, the dev PostgreSQL log over ten minutes shows no syntax error from the topic update statement. Not yet observable; named in the pull request as the open reading.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_contract_persistence_effect -q -n 0 --no-cov -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_infra
