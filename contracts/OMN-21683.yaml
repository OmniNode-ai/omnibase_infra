  - id: dod-004-deploy-artifact-readback
    description: >-
      Hosted-runner deploy artifact probe reads the registration wiring source from the local checked-out commit and requires exactly one shared topic store and one introspection construction. It also runs the real-container registration readback for both optional-projector paths, shared catalog topics and repeated heartbeat binding identity. The artifact assertion fails against the merge base, which constructs the store and introspection handler twice.
    source: manual
    binds_ac: [AC2, AC3]
    checks:
      - check_type: command
        check_value: |-
          set -eu;
          artifact="$(mktemp)";
          trap 'rm -f "$artifact"' EXIT;
          git show HEAD:src/omnibase_infra/nodes/node_registration_orchestrator/wiring.py > "$artifact";
          python3 - "$artifact" <<'PYPROBE'
          import ast
          import sys
          from pathlib import Path
          tree = ast.parse(Path(sys.argv[1]).read_text())
          wiring = next(node for node in tree.body if isinstance(node, ast.AsyncFunctionDef) and node.name == "wire_registration_handlers")
          calls = [node for node in ast.walk(wiring) if isinstance(node, ast.Call)]
          for name in ("ServiceIntrospectionTopicStore", "HandlerNodeIntrospected"):
              count = sum((call.func.id if isinstance(call.func, ast.Name) else getattr(call.func, "attr", None)) == name for call in calls)
              assert count == 1, (name, count)
          print("registration deploy artifact: one topic store and one introspection handler")
          PYPROBE
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/runtime/test_registration_wiring_identity_omn21683.py -q -p no:cacheprovider --no-cov
  - id: dod-005-deploy-probe
