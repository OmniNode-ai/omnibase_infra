schema_version: "1.0.0"
ticket_id: OMN-22052
title: >-
  omnibase_infra#5553 (runtime boot bounded by contract) is current with dev and every required check on its head passes
summary: >
  Fixes the root CI reds of the OMN-18087 boot-bound branch. Core Validators flagged the rendered DEV_RUNTIME_MAIN_MEMORY_LIMIT line (budget rule) and two attempt-count literals in handler_wiring.py that the branch is the first to touch since the ratchet landed. The rendered key is now DEV_RUNTIME_MAIN_MEMORY (value still declared in runtime_policy.contract.yaml) and both counts come from operational_timeouts.yaml. Test splits 1, 4 and 7 failed on the compose render helper's 'placeholder' memory size, the generated-compose manifest, the catalog home-path expectations and four bundle digests; each is updated for the branch's intended render.

is_seam_ticket: false
interface_change: false
interfaces_touched: []
