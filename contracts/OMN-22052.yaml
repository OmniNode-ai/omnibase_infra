    statement: The required check-runs on the PR head pass.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the required check-runs on the PR head after the lane's last push are all success or neutral, read from the check-run list and not the rollup
  - id: req-omn22052-fix-has-failing-test
    statement: Every fix to a failing test lands with a test that fails on the base and passes on the branch.
    acceptance:
      - id: AC2
        statement: >-
          AC2: every fix to a failing test lands with a test that fails on the base and passes on the branch
