schema_version: 1.0.0
ticket_id: OMN-23062
title: The one-runtime worker fold (T9) reaches a pull request on omnibase_infra with its contract
summary: Primary dev's worker role runs as nodes inside the main runtime. The runtime policy contract folds workers into dev main with a last_ran consumer-group handover from the retired runtime-worker instance and the three capabilities the worker declared, the dev lane compose takes the worker profiles from the policy, main mounts the worker logs read-only, the dev refresh installer leaves runtime-worker out of its core services when the policy folds workers, and the runtime-worker service is gated off every primary-dev bring-up by the rendered policy (the pre-fold revision restores it). Stacked on the dev effects fold (omnibase_infra#5772). Dev only; the stability lane and prod are untouched. Live delivery through the deploy agent and the consumer group lag read before and after are pending the merge and the pin of omnibase_infra#5786.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23062-worker-role-folded-into-dev-main
    statement: Primary dev's main runtime carries the worker role, with its secrets, capabilities, logs and consumer groups, and the separate runtime-worker service is absent from the dev compose.
    acceptance:
      - id: AC1
        statement: 'AC1: the branch is opened as a pull request with this ticket in the title and a contracts file, stacked on or rebased onto omnibase_infra#5772, and handed to the landing controller -- falsifier: uv run pytest of the fold tests, 12 red against the pre-fold files'
      - id: AC2
        statement: 'AC2: the dev compose file holds the worker fold and the stack shape check passes -- falsifier: uv run pytest of the compose render, deploy-agent guard and stack shape tests'
evidence_requirements:
  - kind: tests
    description: The worker fold tests with their failing controls (12 red, 4 green against the pre-fold policy, compose and installer files; 16 green after), the real docker compose render of primary dev folded and pre-fold, the deploy agent boot guard and fold tests, and the stack shape check.
    command: uv run pytest tests/unit/docker/test_dev_worker_fold_omn21288.py tests/integration/infra/test_dev_runtime_compose_render.py tests/unit/validation/test_checker_stack_shape.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23062-worker-fold-tests
    description: The sixteen worker fold tests pass on the branch. Against the pre-fold policy contract, dev lane compose, tenant fold compose, policy env and refresh installer, twelve of them fail and four pass, so the tests read the fold and not the surrounding files.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_dev_worker_fold_omn21288.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn23062-compose-render-guard-stack-shape
    description: The real docker compose render of primary dev has no runtime-worker service and the pre-fold profiles render it again; the deploy agent pre-pull boot guard names runtime-worker for a deploy that folds the worker and the post-roll read does not; the stack shape check passes over the dev compose.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/integration/infra/test_dev_runtime_compose_render.py tests/unit/docker/test_dev_tenant_projection_fold_omn21288.py -q --no-cov --tb=line
        cwd: .
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_stack_shape.py -q --no-cov --tb=line
        cwd: .
      - check_type: test_passes
        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_dev_boot_guard_omn21279.py scripts/deploy-agent/tests/unit/test_dev_tenant_projection_fold_omn21288.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn23062-fold-live-at-ref
    description: The runtime policy contract and the dev lane compose file in the checked-out head carry the workers handover from the runtime-worker instance and the policy-derived worker profile; the probes read the checked-out files, so they go red when the fold is removed (the pre-fold files hold neither string).
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: "grep -qF 'from_instance_id: runtime-worker' contracts/services/runtime_policy.contract.yaml"
        cwd: .
      - check_type: command
        check_value: grep -qF 'DEV_RUNTIME_MAIN_RUNTIME_WORKER_RUNTIME_PROFILE' docker/docker-compose.dev-lane.yml
        cwd: .
