    description: The launcher tests pass at the head.
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest scripts/deploy-agent/tests/unit/test_deploy_agent_launcher_omn18073.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
