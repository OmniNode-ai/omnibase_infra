schema_version: "1.0.0"
ticket_id: "OMN-21970"
title: "Vendor the per-day delegation view and the delegation_events walk cursor"
summary: >-
  Deployment component of AC1 and AC3: carry omnimarket's node_projection_delegation migrations 0065 (an integer walk cursor on delegation_events) and 0066 (projection_delegation_daily, every UTC day's runs, verdicts and token totals in one row per tenant) byte for byte, with their exact tenant ledger bindings, forward-only classes and the delegation writer's SELECT on the new view. This identity check does not prove the omnimarket exposures or the dashboard charts, which are omnimarket's and omnidash's own changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-delegation-daily-deployment"
    statement: "The deployment artifact must carry the same per-day view and walk cursor as the delegation projection writer, and let that writer read the view."
    acceptance:
      - id: "AC1"
        statement: "omnimarket serves per-day run and token totals for a requested UTC day range with no row cap, and for a range holding more than 500 runs the served run totals equal the full count -- falsifier: uv run pytest on a projection test that writes 600 runs over 20 days and asserts 20 served days whose run totals sum to 600"
evidence_requirements:
  - kind: "tests"
    description: "Exact migration source bytes, unique tenant ledger bindings, forward-only classes and the writer's SELECT on the view in every instance."
    command: "uv run pytest tests/unit/migrations/test_omn21970_daily_view_cursor_vendor.py -q -n 0 --no-cov"
dod_evidence:
  - id: "dod-omn21970-daily-view-cursor-vendor"
    description: "AC1 on a real Postgres: 0065 and 0066 applied with psql -f to a throwaway cluster serve 600 runs over 20 days as 20 days summing to 600, past the 500-row cap, with every day's passed and failed counts, on delegation_events built by the node's real chain 0007 to 0064; runs land on their UTC day of written_at or created_at; the dashboard role reads only its own tenant; a distinct cursor on every row, also from concurrent writer inserts, and one sequence after a second apply, beside a capped 500-row control that fails the same check; plus the deployment identity: a missing or altered 0065 or 0066, a wrong ledger binding, a wrong class or a missing view grant fails."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/integration/migrations/test_omn21970_daily_view_full_history.py tests/unit/migrations/test_omn21970_daily_view_cursor_vendor.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnibase_infra"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
