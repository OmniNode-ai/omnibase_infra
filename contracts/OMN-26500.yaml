schema_version: 1.0.0
ticket_id: OMN-26500
title: The release train stages the CHANGELOG.md entry for the version it cuts when the target repository's release-cut gate needs it
summary: The notes node stages a CHANGELOG.md entry for a repository whose own release-cut gate (the ticket-contract prerequisite) admits a cut only with CHANGELOG.md in its diff, so the cut of omnimarket 0.4.325 is no longer an empty diff; a repository with no such gate still stages nothing, and the repository's own post-release bump removes the file again.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26500-train-stages-changelog
    statement: The train stages a CHANGELOG.md entry for the version it cuts when the target repository's release-cut gate lists CHANGELOG.md among its cut paths, and nothing for a repository without such a gate.
    acceptance:
      - id: AC1
        statement: 'AC1: a regression test built from the recorded release PR facts (head e1fd1c07 against base 586bf466, empty diff, title shape `chore: release omnimarket 0.4.325 (OMN-18595)`, fixture path named in the PR) fails on the train code at origin/dev and passes on the fix, which stages a CHANGELOG.md entry for the version it cuts -- falsifier: uv run pytest on the named focused test file fails at the base branch and passes on the pushed branch'
      - id: AC2
        statement: 'AC2: the release-cut rule and the removed-prose test are unchanged by the pull request -- falsifier: git diff origin/dev --stat on the pushed branch lists no change to handler_ticket_contract_prerequisite.py or test_repository_prose_removed_omn17427.py, run with uv run pytest on the touched tests'
      - id: AC3
        statement: 'AC3: after the pull request merges and the omnimarket train is re-dispatched, the rebuilt release pull request reads lint success -- falsifier: onex scm commit-check-runs OmniNode-ai/omnimarket on the rebuilt head shows lint not success'
evidence_requirements:
  - kind: tests
    description: The notes node tests, the recorded-cut test file first.
    command: uv run pytest tests/unit/nodes/node_release_notes_apply_effect -q -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26500-ac1-recorded-cut
    description: 'AC1: the recorded 0.4.325 cut (fixture tests/fixtures/release_notes/cut_0_4_325.json, pull request head e1fd1c07, base 586bf466, no changed path) stages CHANGELOG.md, the staged cut passes the recorded gate rule, and a repository with no gate file, a gate that does not list CHANGELOG.md or a README-only policy is routed as before. At origin/dev the notes node answers release-pr-body and stages nothing.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_release_notes_apply_effect/test_release_cut_changelog_omn26500.py -q -p no:randomly
        cwd: .
  - id: dod-omn26500-ac2-gate-untouched
    description: 'AC2: the diff against origin/dev changes neither the marketplace repository''s release-cut gate nor its removed-prose test (neither file is in this repository), and the OMN-25958 tests of the notes node still pass.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: test -z "$(git diff --name-only origin/dev HEAD -- '*handler_ticket_contract_prerequisite.py' '*test_repository_prose_removed_omn17427.py')" && grep -q release_cut_gate_needs_changelog src/omnibase_infra/handlers/handler_release_notes_apply.py
        cwd: .
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_release_notes_apply_effect/test_release_notes_no_changelog_omn25958.py tests/unit/nodes/node_release_notes_apply_effect/test_handler_release_notes_apply.py tests/unit/nodes/node_release_notes_apply_effect/test_release_cut_changelog_omn26500.py -q -p no:randomly -k "not recorded_cut and not node_reports and not second_cut"
        cwd: .
  - id: dod-omn26500-ac3-before-merge
    description: 'AC3, before the merge: the cut of a gated repository carries CHANGELOG.md and stays inside the paths the gate admits (the recorded gate rule over the staged cut). The lint reading of the rebuilt release pull request is the post-merge entry below.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_release_notes_apply_effect/test_release_cut_changelog_omn26500.py -q -p no:randomly -k recorded_cut_stages_the_entry_the_gate_needs
        cwd: .
  - id: dod-omn26500-ac3-lint-success
    description: 'AC3, read after both pull requests of the ticket merged and the omnimarket train rebuilt the release pull request: the lint check-run of the rebuilt head reads success. It carries no hosted binding because that head does not exist when this contract is written.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex scm commit-check-runs OmniNode-ai/omnimarket --head-sha "$(git rev-parse origin/automation/release-0.4.325-omn-18595)" --check-name lint
        cwd: .
  - id: dod-omn26500-integration-proof
    description: 'Run the notes node on a lab host at the pushed revision over the recorded 0.4.325 cut. This local completion proof carries no hosted AC bindings.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26500 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_release_notes_apply_effect -q -n 0 -p no:randomly
        cwd: .
