schema_version: '1.0.0'
ticket_id: OMN-24118
title: "The branch deploy workflow keeps each deploy's progress in a new database table"
summary: 'Forward migration 116 creates public.branch_deploy_state keyed on correlation_id with the StateStoreAdapter column shape of migrations 102, 108 and 113, and STATE_IO_TABLE_DECLARATIONS declares it so every shipped topology instance and catalog grants it to the runtime role.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24118-branch-deploy-state-table
    statement: omnimarket's node_branch_deploy_orchestrator declares state_io on table branch_deploy_state keyed on correlation_id in the omnibase_infra database; the table exists with the adapter's columns, the runtime role is granted it in every shipped profile, the migration is idempotent, and the real StateStoreAdapter seeds, CAS-updates and reads a row of it.
    acceptance:
      - id: AC1
        statement: 'AC1: migration 116 creates public.branch_deploy_state with correlation_id as primary key and the columns the state store adapter reads and writes, plus its two adapter indexes and the updated_at trigger -- falsifier: uv run pytest tests/unit/db/test_migration_116_branch_deploy_state_omn24085.py -q'
      - id: AC2
        statement: 'AC2: the derived grants give the runtime account read and write on branch_deploy_state in every shipped topology profile, and the generator check passes -- falsifier: uv run pytest tests/integration/topology/test_branch_deploy_state_grant_omn24085.py -q'
      - id: AC3
        statement: 'AC3: integrated: on a real PostgreSQL the migration applies twice without error, the table exists, and the real StateStoreAdapter seeds, CAS-updates and reads a row of it -- falsifier: uv run pytest tests/integration/migrations/test_116_branch_deploy_state_omn24085.py -q'
evidence_requirements:
  - kind: tests
    description: The migration shape and grant tests pass at the head; with the STATE_IO_TABLE_DECLARATIONS entry removed the derivation grants nothing and the grant test fails.
    command: uv run --frozen pytest tests/unit/db/test_migration_116_branch_deploy_state_omn24085.py tests/integration/topology/test_branch_deploy_state_grant_omn24085.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24118-migration-shape
    description: Migration 116 is a CREATE TABLE IF NOT EXISTS on correlation_id with the adapter columns, the two partial indexes and the updated_at trigger; the file is absent at the merge base, so the test fails there.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/db/test_migration_116_branch_deploy_state_omn24085.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24118-runtime-grant
    description: The grant is derived for branch_deploy_state in the omnibase_infra database for the runtime role, and every shipped instance and rendered catalog carries it.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/topology/test_branch_deploy_state_grant_omn24085.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: grep -rlq branch_deploy_state src/omnibase_infra/topology/instances docker/catalog/database-topology
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24118-postgres-apply
    description: The migration applies idempotently on a real PostgreSQL and the adapter seeds, CAS-updates and reads a row; the migration file is absent at the merge base, so the test fails there.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/migrations/test_116_branch_deploy_state_omn24085.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
