schema_version: "1.0.0"
ticket_id: OMN-23055
title: "The gate store's four relations are vendored, ledgered and granted to the runtime"
summary: >-
  omnimarket's node_gate_store_effect holds the gate store in four omninode_internal relations. This repository vendors its two migrations byte for byte, ledgers and classes them, and declares the runtime's table grants ahead of the omnimarket contract, the same bridge shape as its neighbours.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23055-gate-store-migrations
    statement: The gate store's relations are vendored byte for byte from the omnimarket node, ledgered and granted to the runtime.
    acceptance:
      - id: AC1
        statement: 'AC1: the vendored bytes, ledger binding, classes and topology grants are exact -- falsifier: uv run --frozen pytest tests/unit/migrations/test_omn23055_gate_store_vendor.py -q --no-cov'
evidence_requirements:
  - kind: tests
    description: The vendor test.
    command: uv run --frozen pytest tests/unit/migrations/test_omn23055_gate_store_vendor.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23055-gate-store-vendor
    description: The vendored gate store migrations match their pinned bytes and ledger binding, and the four relations are granted in every instance and catalog.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/migrations/test_omn23055_gate_store_vendor.py -q --no-cov
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/db/test_omn23055_gate_store_migration_tree.py -q --no-cov
        cwd: .
  - id: dod-omn23055-gate-store-integration-proof
    description: >-
      The pushed head ran the vendor test on a lab host through the lab work runner. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23055 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/migrations/test_omn23055_gate_store_vendor.py -q --no-cov
        cwd: .
