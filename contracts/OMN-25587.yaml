schema_version: "1.0.0"
ticket_id: OMN-25587
title: omnibase_infra OpenTelemetry instrumentation ranges block the patched exporter
summary: >-
  Widen the six OpenTelemetry instrumentation ranges from >=0.48b0,<0.66 to >=0.48b0,<0.67 so the 0.66 beta family resolves beside the patched OTLP HTTP exporter 1.45.2. The hosted evidence reads the manifest, the lock and the synced environment through tests/ci/test_otel_instrumentation_ranges_omn25587.py, each of which fails on a tree that still holds the <0.66 cap. The lab full-suite and dependency-scan readings, the pull request state and the release tag the omnimarket floor needs are lane and pull request facts that no hosted check can read, so they are named in the pull request body and not bound here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25587-patched-exporter
    statement: Consumers can resolve the patched OTLP HTTP exporter together with the six OpenTelemetry instrumentation dependencies.
    acceptance:
      - id: AC1
        statement: 'AC1: in omnibase_infra the six instrumentation ranges read `>=0.48b0,<0.67`, uv.lock is re-locked, and the lock resolves opentelemetry-exporter-otlp-proto-http to 1.45.2 or newer -- falsifier: `git grep -n -F "<0.66" origin/dev -- pyproject.toml` prints a line for any of the six, or `grep -A1 ''name = "opentelemetry-exporter-otlp-proto-http"'' uv.lock` shows a version below 1.45.2'
      - id: AC2
        statement: 'AC2: the infra unit tests and the dependency security scan pass on a lab host with exporter 1.45.2 resolved -- falsifier: `uv run pytest tests/unit -q -m unit` exits non-zero on the lab, or `uv run safety scan` reports opentelemetry-exporter-otlp-proto-http'
      - id: AC3
        statement: 'AC3: the change touches only the six ranges and the lock, so the diff removes no assertion and adds no skip, xfail or ignored advisory -- falsifier: `git diff <base> <head> --stat` lists a file other than pyproject.toml and uv.lock'
evidence_requirements:
  - kind: tests
    description: The manifest, lock and environment tests pass at the head and fail at the merge base.
    command: uv run --frozen pytest tests/ci/test_otel_instrumentation_ranges_omn25587.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25587-ac1-ranges-and-lock
    description: The manifest admits the six 0.66 beta instrumentations and the frozen lock pairs them with the patched exporter. At the merge base the manifest still carries the <0.66 cap and the lock holds exporter 1.40.0, so these tests are red there.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_otel_instrumentation_ranges_omn25587.py -k "admits_the_066 or pairs_the_patched" -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25587-ac2-installed-exporter
    description: The environment synced from the frozen lock holds exporter 1.45.2 or newer and the five instrumentors import beside it. At the merge base the synced environment holds exporter 1.40.0, so this test is red there. The unit run and the Safety scan on a lab host are recorded in the pull request body.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_otel_instrumentation_ranges_omn25587.py -k installed_environment -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn25587-ac3-only-six-ranges
    description: The manifest's opentelemetry requirements equal the expected set exactly, so only the six instrumentation upper bounds moved. At the merge base those six read <0.66, so this test is red there. The path list of the diff is named in the pull request body.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_otel_instrumentation_ranges_omn25587.py -k changes_only_the_six -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
