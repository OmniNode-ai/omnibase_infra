schema_version: "1.0.0"
ticket_id: OMN-23067
title: Dev projection API is served by the main runtime and its container is retired (T17)
summary: The projection query node node_projection_query_api_effect (omnimarket) answers every route the projection-api service answered and is served through the runtime's contract-declared http_mount. This change folds the projection-api role into the primary dev main runtime through the runtime policy, the mapping the folded writers use, so the dev stack renders no projection-api container and the deploy handler and deploy agent retire the previous revision's container before main is recreated. Every other dev instance keeps its own container. The dev lab-pass and onex-api delivery probes read the API from main's port under the mount prefix. The live dev read follows the deploy agent's rebuild after the merge.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23067-fold
    statement: The runtime policy folds projection-api into primary dev main only, and the dev stack renders no projection-api container while the other dev instances keep theirs.
    acceptance:
      - id: AC1
        statement: "AC1: the policy folds projection-api into primary dev main only, the committed policy env equals its render, and the dev stack renders no projection-api container while other dev instances keep theirs -- falsifier: uv run pytest tests/unit/docker/test_dev_projection_api_fold_omn21288.py -q --no-cov, red against the pre-change policy, env and compose files"
  - id: req-omn23067-retire
    statement: The deploy handler and the deploy agent retire the previous projection-api container before main is recreated.
    acceptance:
      - id: AC2
        statement: "AC2: the deploy handler and the deploy agent stop and remove the previous projection-api container before main is recreated, and name it in no up or verify list -- falsifier: uv run pytest tests/scripts/test_deploy_runtime_folded_services_omn21288.py scripts/deploy-agent/tests/unit/test_dev_tenant_projection_fold_omn21288.py -q --no-cov, red against the pre-change policy and handler"
  - id: req-omn23067-probe
    statement: The dev lab pass reads the projection API from the mount on main's port.
    acceptance:
      - id: AC3
        statement: "AC3: the dev lab-pass projection URL is main's URL plus the mount prefix, in the routing table and in the onex-api delivery probe, and the projection_ready check passes against the mounted node -- falsifier: uv run pytest tests/ci/test_deploy_lane_verify_route_omn19507.py tests/unit/docker/test_dev_projection_api_fold_omn21288.py -q --no-cov, red with the URL put back to port 3002"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
