        check_value: uv run pytest tests/unit/cli/test_cli_registry_vocabulary.py -q -k an_unroutable_class_is_refused_in_the_contracts_words
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn-13966-ac3
    description: The CLI tests change the registry between invocations and assert the help and the flag follow it.
    source: manual
