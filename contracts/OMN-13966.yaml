    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_cli_registry_vocabulary.py -q -k "an_internal_class_is_admitted_by_explicit_name or help_lists_exactly_the_authoritys_classes"
        cwd: ${OMNI_HOME}/omnibase_infra
