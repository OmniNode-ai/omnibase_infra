schema_version: 1.0.0
ticket_id: OMN-23705
title: Carry the work ledger latest-state database change in the infrastructure migration tree
summary: 'omnibase_infra half of the work ledger latest-state change (omnimarket OMN-23694): vendors node_projection_work_ledger migrations 0011 (creates omninode_internal.work_ledger_latest and backfills it from work_ledger_rows) and 0012 (grants the runtime SELECT, INSERT, UPDATE, never DELETE) ahead of the omnimarket change, registers them in the migration ledger and class list, and bridges the relation in the table-grant derivation until the contract pin advances. The behavioural proof of the read and the projection is in the omnimarket contract for OMN-23694; this change makes that code wireable and applies the table with the next deploy-agent roll.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23705-infra-vendor
    statement: The runtime principal holds a declared grant on the latest-state table so the omnimarket projection wires, and the vendored migrations match the omnimarket source.
    acceptance:
      - id: AC1
        statement: 'AC1: the infrastructure copy of both files is byte-identical to the omnimarket files at the pending change''s head -- falsifier: run scripts/sync-node-migrations.sh --check in the infrastructure repository and find a difference'
      - id: AC2
        statement: 'AC2: the migration ledger, class list, topology instances and catalogs name the new table and both files -- falsifier: pytest tests/unit/topology/test_work_ledger_latest_vendored_grant.py -q'
      - id: AC3
        statement: 'AC3: the omnimarket node-migration-vendor-parity-gate check passes on the pending change after this merges -- falsifier: read that check on the pending change''s head and find it red'
      - id: AC4
        statement: 'AC4: integrated: after the deploy agent rolls the development runtime from the merged tag, the table omninode_internal.work_ledger_latest exists on the development lane database and the runtime role can read and write it -- falsifier: read the deploy agent''s job record for the roll and the table''s grants on the development lane and find the table or a grant missing'
evidence_requirements:
  - kind: tests
    description: The runtime grant on work_ledger_latest is present in every topology instance, and the vendored migrations are in sync with the omnimarket source.
    command: uv run pytest tests/unit/topology/test_work_ledger_latest_vendored_grant.py -q -n 0 --no-cov -p no:cacheprovider
