schema_version: "1.0.0"
ticket_id: OMN-21933
title: omnibase_infra grants tenant_projection_writer skill_executions for the skill lifecycle projection node
summary: >-
  Vendors the two node_projection_skill_lifecycle migrations (the skill_executions table definition and the tenant_projection_writer grant) with checksum-bound ledger rows and migration classes, and declares the grant in the local, dev and prod topology instances and every rendered catalog. The omnimarket node writes skill_executions through the tenant_projection binding and its auto-wiring refuses a principal with no declared privileges on the table.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21933-grants
    statement: >-
      The role the skill lifecycle node writes as, tenant_projection_writer, holds SELECT, INSERT and UPDATE on public.skill_executions in every shipped topology instance, and a migration delivers the grant.
    acceptance:
      - id: AC1
        statement: >-
          AC1: omnibase_infra topology grants tenant_projection_writer write on skill_executions in the local, dev and prod topology instances and a vendored migration delivers it -- falsifier: uv run pytest tests/unit/migrations/test_omn21933_skill_lifecycle_vendor.py -q --no-cov fails at the merge base
  - id: req-omn21933-consumer-retired-on-dev
    statement: >-
      Primary dev has no skill-lifecycle-consumer container and its projection is a node in the main runtime; other dev instances, the stability lane and prod keep the consumer.
    acceptance:
      - id: AC2
        statement: >-
          AC2: the runtime policy retires skill-lifecycle-consumer by name on primary dev, the rendered env file carries it, the dev-lane stanza starts under the folded profile only, and the deploy agent censuses and retires its container before main is recreated -- falsifier: uv run pytest tests/unit/docker/test_dev_skill_lifecycle_fold_omn21933.py -q --no-cov, red when the retirement or the stanza gate is removed
evidence_requirements:
  - kind: tests
    description: The vendored bytes, ledger rows, classes and grants in every topology instance and rendered catalog.
    command: uv run pytest tests/unit/migrations/test_omn21933_skill_lifecycle_vendor.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21933-ac1-grants
    description: The skill_executions grant is vendored with ledger rows and classes, declared for tenant_projection_writer in the local, dev and prod topology instances and delivered by migration 0002.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn21933_skill_lifecycle_vendor.py -q --no-cov
        cwd: .
  - id: dod-omn21933-ac1-deploy-migration-readback
    description: Apply the deploy migration chain on disposable PostgreSQL; read back writer privileges and exercise upsert, update, replay, search-path independence, missing-column reconciliation and enforced tenant isolation.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: ONEX_MIGRATION_PROOF_REQUIRE_PG=1 uv run pytest tests/integration/migrations/test_omn21933_skill_lifecycle_grant.py -q --no-cov
        cwd: .
  - id: dod-omn21933-ac1-populated-reconciliation
    description: Reconcile a populated incomplete table without changing event data; backfill received_at, enforce required columns, replay the migrations, and refuse invalid event types, statuses and duplicate event IDs without losing rows.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: ONEX_MIGRATION_PROOF_REQUIRE_PG=1 uv run pytest tests/integration/migrations/test_omn21933_skill_lifecycle_grant.py -k populated -q --no-cov
        cwd: .
  - id: dod-omn21933-ac2-policy-and-stanza
    description: The policy retires the consumer by name, the rendered env file carries it, the dev-lane stanza starts under the folded profile only, the fold overlay adds no declaration, the dev stack renders no consumer, and other dev instances keep theirs.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_dev_skill_lifecycle_fold_omn21933.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21933-ac2-retirement-and-stack-shape
    description: The deploy agent censuses and retires the consumer container with the other folded services, volumes kept, and the stack-shape check passes over the real compose files with the baseline count unchanged.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_dev_hook_events_fold_omn21288.py tests/unit/docker/test_dev_tenant_projection_fold_omn21288.py tests/unit/validation/test_checker_stack_shape.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21933-ac2-deploy-probe
    description: After the deploy agent rolls primary dev with this change, no omninode-skill-lifecycle-consumer container runs on the dev host. The probe fails while the container runs, so it reads the deployed system and not a file this pull request wrote.
    source: manual
    binds_ac:
      - AC2
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" 'test -z "$(docker ps -q --filter name=^omninode-skill-lifecycle-consumer$)"'
        cwd: .
