schema_version: 1.0.0
ticket_id: OMN-21324
title: Undecodable delegate-skill command bodies terminalize typed, array bodies keep the header correlation, non-retryable refusals are not replayed
summary: The boundary types the failure code of an undecodable body, adopts the ingress correlation for a body that states none, and the DLQ replay predicate reads the non-retryable class from the failure reason.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-undecodable-code
    statement: An empty or non-JSON command body terminalizes with a typed failure code.
    acceptance:
      - id: AC1
        statement: An empty or non-JSON delegate-skill command body terminalizes with a typed failure_code, not None.
  - id: req-header-correlation
    statement: A JSON-array command body terminalizes under its Kafka header correlation.
    acceptance:
      - id: AC2
        statement: A JSON-array command body terminalizes under the correlation_id of its Kafka header.
  - id: req-single-terminal
    statement: A non-retryable refusal is not replayed from the DLQ.
    acceptance:
      - id: AC3
        statement: A command refused with retryable false terminalizes once, with no further copy on the failed topic.
evidence_requirements:
  - kind: tests
    description: Typed code, header correlation and replay eligibility.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/runtime/auto_wiring/test_omn21324_delegate_skill_undecodable_body.py -q --no-cov
  - kind: manual
    description: The deployed runtime image carries the non-retryable text reader and the typed undecodable-body code.
    command: 'deploy: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c "from omnibase_infra.enums import EnumNonRetryableErrorCategory as E; assert E.is_non_retryable_text(''ProtocolConfigurationError: refused''); assert E.undecodable_body_code(ValueError()) is None"'
dod_evidence:
