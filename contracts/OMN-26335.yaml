  - id: dod-omn26335-deploy-ratchet-on-dev
    description: 'Deploy scope (compute-only, no live runtime change): the pushed branch source and the checked-out tree both define the ratchet handler class. Read from GitHub at the PR branch and from the checked-out tree, it fails at any tree that lacks the class, including the merge base.'
    source: manual
    checks:
      - check_type: command
        check_value: test "$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_wiring_report_ratchet/handler.py?ref=omn-26335-wiring-report-ratchet" --jq .content | base64 -d | grep -c 'class HandlerWiringReportRatchet')" -ge 1 && grep -q 'class HandlerWiringReportRatchet' src/omnibase_infra/handlers/handler_wiring_report_ratchet/handler.py
        cwd: .
