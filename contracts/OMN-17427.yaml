schema_version: "1.0.0"
ticket_id: OMN-17427
title: C28 counts the injected malformed marker on the seam's contract-declared DLQ
summary: The C28 consumer-flow probe (node_board_probe_effect consumer_flow handler and scripts/ci/c28_consumer_flow_probe.py) counted the injected marker on the generic onex.dlq.omnibase-infra.events.v1, while omnibase_infra#4720 routes a consume-callback failure to the subscriber contract's declared DLQ; both collectors now count it on onex.dlq.omnimarket.consumer-flow-stall-alert-malformed.v1.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17427-c28-seam-dlq
    statement: The C28 node and script collectors count the injected malformed marker on the seam DLQ and ignore unrelated messages on the generic DLQ.
    acceptance:
      - id: AC1
        statement: 'AC1: the node collector counts the marker on the seam DLQ when the generic DLQ also advances -- falsifier: uv run pytest tests/unit/nodes/node_board_probe_effect/test_handler_docker_consumer_flow_target.py -q -k seam_dlq'
      - id: AC2
        statement: 'AC2: the script collector counts the recorded dev-lane marker on the seam DLQ -- falsifier: uv run pytest tests/ci/test_c28_consumer_flow_probe.py -q -k seam'
  - id: req-omn17427-lag-stall-progress
    statement: The lab pass receipt consumer_group_lag check fails a lag that grew only when a partition committed none of its waiting work.
    acceptance:
      - id: AC3
        statement: 'AC3: a caught-up group with a heartbeat in flight passes and a frozen partition fails -- falsifier: uv run pytest tests/ci/test_lab_pass_receipt_lag_stall_omn17427.py -q'
  - id: req-omn17427-refresh-gate-waits
    statement: The dev refresh gates wait for a running one-shot and for a runtime that has not finished starting instead of rolling back.
    acceptance:
      - id: AC4
        statement: 'AC4: RT-6 waits for a one-shot that is mid-run and accepts it when it exits 0, and rejects one still running at the bound or exiting non-zero -- falsifier: uv run pytest tests/scripts/test_deploy_runtime_rt6_one_shot_omn16729.py -q'
      - id: AC5
        statement: 'AC5: the health verdict wait treats a startup-pending 503 as waitable until the runtime is healthy or the bound is reached, and keeps any other 503 terminal -- falsifier: uv run pytest scripts/runtime_build/tests -q -k omn17624'
  - id: req-omn17427-dev-effects-health
    statement: The dev refresh gate probes the runtime-effects /health under a bounded wait, and a lane whose effects runtime never answers does not pass.
    acceptance:
      - id: AC6
        statement: 'AC6: a healthy :8085 beside an unanswering :8086 fails the gate, a late-binding :8086 passes after a bounded wait, the effects URL is a required argument, and the rollback decision counts a dead effects runtime as not serving -- falsifier: uv run pytest scripts/runtime_build/tests/test_dev_effects_health_omn17427.py -q'
  - id: req-omn17427-dev-lane-skill-overlay
    statement: The dev lane's runtime-effects names its private skill overlay roots by an operator-supplied mount, and no lane layering the dev-lane file inherits a variable for a mount it drops.
    acceptance:
      - id: AC7
        statement: 'AC7: runtime-effects renders ONEX_SKILL_OVERLAY_ROOTS with one read-only mount from DEV_LANE_SKILL_OVERLAY_ROOTS_DIR, renders when it is unset, and the four borrower overlays blank it -- falsifier: uv run pytest tests/integration/infra/test_dev_runtime_compose_render.py -q -k skill_overlay'
  - id: req-omn17427-dev-lane-class-boot
    statement: The pre-merge laptop boot ends with a dev-lane class phase that recreates both kernels with the strict-wiring and secrets-store bindings read from the dev lane's compose files, on the current omnimarket release, and fails on any restart.
    acceptance:
      - id: AC8
        statement: 'AC8: the phase derives ONEX_WIRING_STRICT_MODE and a set INFISICAL_ADDR from docker-compose.dev-lane.yml and docker-compose.infra.yml, refuses when either binding is gone, and its gate fails a restarting or exited kernel -- falsifier: uv run pytest tests/ci/test_runtime_boot_dev_lane_class_omn17427.py -q'
  - id: req-omn17427-hotpatch-ledger-reconcile
    statement: A hot-patch ledger row whose fix commit is merged is retired by a refusing-by-default effect node, and the preflight prints the exact command.
    acceptance:
      - id: AC9
        statement: 'AC9: the reconcile handler retires a row only when its commit is an ancestor and no .prepatch remains, and refuses otherwise -- falsifier: uv run pytest tests/unit/handlers/test_handler_hotpatch_ledger_reconcile.py -q'
      - id: AC10
        statement: 'AC10: the preflight reports every unusable merge_commit row with its reconcile command, and onex node runs that command -- falsifier: uv run pytest tests/unit/scripts/test_preflight_hotpatch_ledger.py tests/integration/hotpatch/test_hotpatch_ledger_reconcile_integration_omn17427.py -q'
  - id: req-omn17427-boot-health-verdicts
    statement: A failed pre-merge laptop boot names each kernel's health verdict inside the end of its own job log.
    acceptance:
      - id: AC11
        statement: 'AC11: the laptop boot job prints the runner and, for each kernel, the Docker health state, the last healthcheck outputs and the /health body as the last step before teardown, always, and that step never fails the job -- falsifier: uv run pytest tests/ci/test_runtime_boot_catalog_local_health_verdicts_omn17427.py -q'
  - id: req-omn17427-main-target-guard
    statement: A pull request whose base is main is refused, the release workflow's own pull requests (which target dev) are not, and a push to main warns locally.
    acceptance:
      - id: AC12
        statement: "AC12: main-target-guard exits non-zero for a base-main PR from a feature head, a dev head with a promotion receipt, a hotfix head with evidence and the release workflows' own heads, and exits zero for those release heads onto dev -- falsifier: uv run pytest tests/ci/test_main_target_guard_omn17427.py -q -k 'refused or admitted or replays'"
      - id: AC13
        statement: "AC13: the pre-push hook main-target-guard prints a warning and exits zero for a push to refs/heads/main and prints nothing for dev or a feature branch, and the guard is registered in the CI Summary poller -- falsifier: uv run pytest tests/ci/test_main_target_guard_omn17427.py -q -k 'hook or push or poller'"
  - id: req-omn17427-precommit-commit-path
    statement: A commit no longer pays for whole-repo scans that CI runs on every pull request, and the staged-only hygiene scan returns the whole-tree verdict.
    acceptance:
      - id: AC14
        statement: "AC14: check-direct-model-call and check-node-boundary-imports run at the pre-push stage with --base taken from the merge base with origin/dev, and the CI jobs that back them run on every pull request -- falsifier: uv run pytest tests/ci/test_precommit_commit_path_omn17427.py -q"
      - id: AC15
        statement: "AC15: the commit-stage public-repo-hygiene hook is handed the staged paths, the merge-commit stage keeps the whole-tree run, and the config still enforces added lines -- falsifier: uv run pytest tests/ci/test_public_repo_hygiene_enforcement_omn20782.py -q -k same_revision"
  - id: req-omn17427-hostile-reviewer-retry-budget-pin
    statement: Every workflow site that clones omniintelligence names the revision whose retry of an unparseable review reply gets 8192 tokens instead of 4096.
    acceptance:
      - id: AC16
        statement: 'AC16: .github/sibling-pins.yaml names omniintelligence at 3fcbf795087a79081c0ceeb676216bf64c5d49ae, the merge commit of omniintelligence#1072, and every workflow clone names it -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py tests/ci/test_hostile_reviewer_omniintelligence_pin_omn20947.py -q fails over the merge base, which pins 64b950973a5686d33e0b439fb80749d66362d06d'
  - id: req-omn17427-rr-failure-reason
    statement: A request-response failure terminal raises its own failure_reason instead of a doubled generic message.
    acceptance:
      - id: AC17
        statement: "AC17: a failure terminal carrying failure_reason, flat or in its envelope payload, rejects the pending request with RuntimeError 'Request failed: <failure_reason>', and one without a reason says so instead of 'Request failed: Request failed' -- falsifier: uv run pytest tests/unit/runtime/test_request_response_wiring.py -q -k TestFailureTerminalReason fails at the merge base"
  - id: req-omn17427-runner-fleet-alerts
    statement: The runner-fleet snapshot reads each watched run's queued and in-progress jobs, and the health verdict carries typed alerts for a runner offline, a runner busy on one job past the job timeout, and a repo/labels queue whose oldest queued job is past the queue-age bound.
    acceptance:
      - id: AC18
        statement: "AC18: the replayed 2026-10-14 fixture (25 pool runners busy, none wedged, doc checks queued up to 44.9 minutes, two second-host runners offline) yields queue_age_exceeded for the three repos that queued past 30 minutes, runner_offline for the two offline runners, and no runner_stuck; a job running past 360 minutes yields runner_stuck -- falsifier: uv run pytest tests/unit/nodes/node_runner_fleet_maintain/test_runner_fleet_alerts_omn17427.py -q fails at the merge base, where the alert models do not exist"
  - id: req-omn17427-delegate-named-tests
    statement: onex delegate names the tests a code delegation is graded by, carries them in the request metadata under the keys omnimarket's delegation port reads, and carries them inline on the deployed lane's bus command.
    acceptance:
      - id: AC19
        statement: 'AC19: --test-file, --named-test and --answer-path write named_tests, named_tests_answer_path and named_tests_files into the request payload the run is handed, and a partial or unsafe naming is a usage error -- falsifier: uv run pytest tests/unit/cli/test_delegate_named_tests_omn17427.py -q -k "not deployed"'
      - id: AC20
        statement: 'AC20: a run that resolves to the deployed lane is handed its named tests like an in-process run, and the deployed dispatch port publishes them inline on the bus command and refuses, before publication, a spec that points at a caller workspace or carries no test sources -- falsifier: uv run pytest tests/unit/cli/test_delegate_named_tests_omn17427.py tests/integration/runtime/test_delegation_dispatch_port_named_tests.py -q -k "deployed or ride_the_bus or cannot_carry"'
  - id: req-omn17427-fleet-sweep-survives-oneshot
    statement: The fleet probe's detached scheduled-workflow sweep outlives the systemd oneshot tick of every unit that runs the Slack reporter, and an empty refresh log names the likely cause.
    acceptance:
      - id: AC21
        statement: 'AC21: the alert and digest units that run omninode-system-slack-report.sh declare KillMode=process, and the probe no-report message says the refresh log is empty and the sweep was killed -- falsifier: uv run pytest tests/unit/scripts/test_fleet_failure_sink_omn18942.py -q -k "detached_sweep_alive or empty_refresh_log_names"'
  - id: req-omn17427-c28-live-groups-index
    statement: The C28 live-groups read stays on the (consumer_group, window_end) index of omninode_internal.consumer_flow_windows instead of a whole-table scan, in the node and the script collector alike.
    acceptance:
      - id: AC22
        statement: 'AC22: LIVE_WINDOW_SQL walks the distinct groups with a recursive loose index scan and bounds each group on window_end and window_start, the node and script carry the same SQL, and live_groups runs it in omnibase-infra-postgres -- falsifier: uv run pytest tests/unit/nodes/node_board_probe_effect/test_consumer_flow_live_groups_query.py -q'
  - id: req-omn17427-fleet-lists-off-occ
    statement: omnibase_infra's fleet tooling repo lists and defaults (pull-all, merge sweep, merge-method and merge-queue audits, runner git mirror and uv rewrite default, lab tracked extras, enforcement parity manifest, version matrix) no longer name onex_change_control.
    acceptance:
      - id: AC23
        statement: 'AC23: none of the nine fleet repo lists or defaults names onex_change_control, and the runner uv mirror rewrite default (OMNI_GIT_MIRROR_REWRITE_REPOS unset) is empty -- falsifier: uv run pytest tests/ci/test_no_occ_fleet_lists_omn17427.py -q'
  - id: req-omn17427-rerun-scans-off-occ
    statement: The broker-wedge rerun scan (script default and workflow list) and the infra-signature rerun default scan (now the merge-sweep registry) no longer name onex_change_control.
    acceptance:
      - id: AC24
        statement: 'AC24: the wedge rerun script default and workflow REPOS_CSV are equal and omit onex_change_control, and the infra-signature default scan is the merge-sweep registry, which omits it -- falsifier: uv run pytest tests/ci/test_runner_broker_dispatch_wedge_rerun.py tests/ci/test_runner_disk_preflight.py -q -k "omits_retired_repo or omit_retired_repo"'
  - id: req-omn17427-probe-hygiene-off-occ
    statement: The scheduled in-progress probe hygiene sweep reads each fleet repository's own contracts/ directory instead of an onex_change_control checkout.
    acceptance:
      - id: AC25
        statement: 'AC25: the sweep workflow, skill mapping and node contract name no onex_change_control checkout or --occ-repo-dir argument, the request takes contract_roots, the checks a ticket declares are summed across the roots, and an unreadable root makes an absence unknown rather than a finding -- falsifier: uv run pytest tests/ci/test_probe_hygiene_off_occ_omn17427.py tests/unit/nodes/node_in_progress_probe_hygiene_effect -q'
  - id: req-omn17427-mac-deploy-agent-topics-declared
    statement: Every topic the deploy agent publishes is declared in a topics.yaml manifest or the omnimarket contract that owns it, so the provisioner creates it and a publish no longer fails with the topic absent from cluster metadata.
    acceptance:
      - id: AC26
        statement: 'AC26: dev-tag-heartbeat, dev-lane-drift and the deploy-command DLQ are declared in src/omnibase_infra/services/topics.yaml and every TOPIC_* constant in deploy_agent.events is declared for provisioning -- falsifier: uv run pytest tests/unit/scripts/test_deploy_agent_topics_declared_omn17427.py -q'
  - id: req-omn17427-autoclose-diagnose-off-occ
    statement: The evidence autoclose sweep's diagnose step probes read access to no change-control repository.
    acceptance:
      - id: AC27
        statement: 'AC27: the diagnose credential-capability list in evidence-autoclose-sweep.yml names four repositories, among them omnibase_infra, omnimarket and omnibase_core, and no change-control repository -- falsifier: uv run pytest tests/ci/test_autoclose_diagnose_probe_off_occ_omn17427.py -q'
  - id: req-omn17427-hook-push-rehearsal-caller
    statement: A pull request that changes a pre-push hook path runs the omnibase_core hook push rehearsal through a caller workflow pinned to a commit on omnibase_core dev.
    acceptance:
      - id: AC28
        statement: 'AC28: the caller workflow triggers on pull_request and merge_group, grants contents read with no runs-on, pins the reusable at a full sha that equals the recorded commit on origin/dev, its path-regex matches the hook paths and neither this caller nor README.md, and every input it passes is declared by the reusable -- falsifier: uv run pytest tests/ci/test_hook_push_rehearsal_caller_omn17427.py -q'
  - id: req-omn17427-core-pin-compat
    statement: The recorded downstream omnibase-core floor is checked against both the repository override and its resolved lock version, with the incident pair and a compatible pair as controls.
    acceptance:
      - id: AC29
        statement: 'AC29: the recorded omnimarket v0.4.316 floor of 0.47.46 is refused against the recorded 44542e2a0 pin of 0.47.44, and the recorded lock agrees with that pin -- falsifier: uv run pytest tests/unit/ci/test_core_pin_compat_omn17427.py -q -k recorded_incident'
      - id: AC30
        statement: 'AC30: downstream floors equal to or older than the pin are accepted -- falsifier: uv run pytest tests/unit/ci/test_core_pin_compat_omn17427.py -q -k equal_or_older'
      - id: AC31
        statement: 'AC31: the current override and resolved lock meet every recorded downstream floor and agree with each other -- falsifier: uv run pytest tests/unit/ci/test_core_pin_compat_omn17427.py -q -k "repo_pin or resolved_lock or lock_resolves"'
