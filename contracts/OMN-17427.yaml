        statement: 'AC37: node_projection_consumer_flow/0006 grants role_omnidash SELECT and DELETE on omninode_internal.consumer_flow_windows and nothing else, asserts both, is bound by the migration ledger checksum and classed expand-only, and the three topology instances and rendered catalogs declare exactly that grant -- falsifier: uv run pytest tests/unit/db/test_consumer_flow_windows_role_omnidash_retention_grant_omn17427.py tests/unit/topology/test_role_omnidash_watermark_principal_omn19998.py -q'
