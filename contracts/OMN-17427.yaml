  - id: req-omn17427-prepr-slot-isolation-readback
    statement: A pre-PR slot's pool run reads its own isolation (OMN-19064) - the host ports its project publishes against its reserved block, and every declared-lane container by id, start time and restart count before and after the run; and a slot run ships the slot's own lane overlay.
    acceptance:
      - id: AC49
        statement: 'AC49: the probe of a pre-PR slot prints every host port the slot project publishes and those outside its reserved block, and the judge fails a slot run that published a port outside the block, published none, or printed no line -- falsifier: uv run pytest tests/unit/scripts/test_prepr_slot_isolation_readback_omn19064.py -q -k "port or publishing"'
      - id: AC50
        statement: 'AC50: snap-pre and snap-post of a pre-PR slot read every container of the declared lanes by id, start time and restart count, and snap-post prints the count of changed lines over the count read and names each changed container; the slot''s own containers are not read -- falsifier: uv run pytest tests/unit/scripts/test_prepr_slot_isolation_readback_omn19064.py -q -k "neighbour or declared_lane"'
      - id: AC51
        statement: 'AC51: a pre-PR slot run with no --overlay ships the slot''s own Bifrost overlay, read from ONEX_LANE_OVERLAY_DIR or else the lane-overlays directory beside the pool table, and an isolated member or a slot with no overlay file ships none -- falsifier: uv run pytest tests/unit/scripts/test_prepr_runtime_pool_omn18893.py -q -k "lane_overlay or overlay_is_read"'
  - id: req-omn17427-cloud-migration-nonfatal
    statement: A failing dev-lane omninode_cloud migration one-shot in the deploy agent gates only onex-api, the runtime family still restarts and is verified, and the job then ends failed with the one-shot's error.
    acceptance:
      - id: AC48
        statement: 'AC48: with a failing cloud-migration fixture the preflight records the failure and stops onex-api, the runtime up names omninode-runtime and not onex-api, a lane-agnostic migration failure stays fatal, and the agent fails the job after verify with the repair build and no overlay apply -- falsifier: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_cloud_migration_nonfatal_omn18496.py -q'
  - id: req-omn17427-dod-evidence-id-fits-core
    statement: Every committed ticket contract's dod_evidence ids fit omnibase_core's ModelContractDodItem id limit, so contract-validation can load the contract of the ticket a pull request branch names.
    acceptance:
      - id: AC49
        statement: 'AC49: no contracts/*.yaml dod_evidence id is longer than the limit read from omnibase_core, and contracts/OMN-19812.yaml loads with ModelTicketContract -- falsifier: uv run pytest tests/ci/test_contract_dod_evidence_id_length_omn17427.py -q'
  - id: req-omn17427-cloud-oneshot-exit-report
    statement: A dev-lane cloud migration one-shot that exits non-zero after a detached compose up is reported at once with its exit code and its own last log lines, URL credentials redacted, instead of after the whole poll timeout.
    acceptance:
      - id: AC50
        statement: 'AC50: the exited-0 poll returns at once on a one-shot that exited non-zero and still waits for a running one, and the preflight failure names the exit code and the redacted log tail -- falsifier: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_cloud_oneshot_exit_report_omn18496.py -q'
  - id: req-omn17427-cve-autobump-keeps-contract
    statement: The lockfile CVE autobump refresh carries the open PR's contracts/<ticket>.yaml forward when it rebuilds the bot branch from the base, so a scheduled refresh no longer force-pushes the evidence contract away.
    acceptance:
      - id: AC60
        statement: 'AC60: a refresh of an open bump PR whose branch holds contracts/OMN-20174.yaml commits that file with the regenerated locks, a branch without it commits only the locks, and a new PR reads no branch contract -- falsifier: uv run pytest tests/ci/test_lockfile_cve_autobump.py -q -k "keeps_the_pr_evidence_contract or new_pr_reads_no_branch_contract"'
  - id: req-omn17427-prepr-slot-lease-model
    statement: The pre-PR slot lease has a TLA+ model whose TLC run passes with each mutation violating its named property, and release_lease runs under the break's guard directory, so an expired holder's release can no longer remove the lease a breaker has just written (OMN-20085 AC3).
    acceptance:
      - id: AC98
        statement: 'AC98: formal/prepr_slot_lease passes OneHolder and Terminates, mut_two_step_break, mut_no_reread, mut_unguarded_release and mut_break_live violate OneHolder, mut_leak_guard violates Terminates, and a release while the guard is held leaves the lease and the guard in place -- falsifier: uv run pytest tests/unit/formal/test_prepr_slot_lease_model.py tests/unit/scripts/test_prepr_slot_lease_omn18893.py -q'
