schema_version: "1.0.0"
ticket_id: OMN-17427
title: C28 counts the injected malformed marker on the seam's contract-declared DLQ
summary: The C28 consumer-flow probe (node_board_probe_effect consumer_flow handler and scripts/ci/c28_consumer_flow_probe.py) counted the injected marker on the generic onex.dlq.omnibase-infra.events.v1, while omnibase_infra#4720 routes a consume-callback failure to the subscriber contract's declared DLQ; both collectors now count it on onex.dlq.omnimarket.consumer-flow-stall-alert-malformed.v1.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17427-c28-seam-dlq
    statement: The C28 node and script collectors count the injected malformed marker on the seam DLQ and ignore unrelated messages on the generic DLQ.
    acceptance:
      - id: AC1
        statement: 'AC1: the node collector counts the marker on the seam DLQ when the generic DLQ also advances -- falsifier: uv run pytest tests/unit/nodes/node_board_probe_effect/test_handler_docker_consumer_flow_target.py -q -k seam_dlq'
      - id: AC2
        statement: 'AC2: the script collector counts the recorded dev-lane marker on the seam DLQ -- falsifier: uv run pytest tests/ci/test_c28_consumer_flow_probe.py -q -k seam'
  - id: req-omn17427-lag-stall-progress
    statement: The lab pass receipt consumer_group_lag check fails a lag that grew only when a partition committed none of its waiting work.
    acceptance:
      - id: AC3
        statement: 'AC3: a caught-up group with a heartbeat in flight passes and a frozen partition fails -- falsifier: uv run pytest tests/ci/test_lab_pass_receipt_lag_stall_omn17427.py -q'
  - id: req-omn17427-refresh-gate-waits
    statement: The dev refresh gates wait for a running one-shot and for a runtime that has not finished starting instead of rolling back.
    acceptance:
      - id: AC4
        statement: 'AC4: RT-6 waits for a one-shot that is mid-run and accepts it when it exits 0, and rejects one still running at the bound or exiting non-zero -- falsifier: uv run pytest tests/scripts/test_deploy_runtime_rt6_one_shot_omn16729.py -q'
      - id: AC5
        statement: 'AC5: the health verdict wait treats a startup-pending 503 as waitable until the runtime is healthy or the bound is reached, and keeps any other 503 terminal -- falsifier: uv run pytest scripts/runtime_build/tests -q -k omn17624'
  - id: req-omn17427-dev-effects-health
    statement: The dev refresh gate probes the runtime-effects /health under a bounded wait, and a lane whose effects runtime never answers does not pass.
    acceptance:
      - id: AC6
        statement: 'AC6: a healthy :8085 beside an unanswering :8086 fails the gate, a late-binding :8086 passes after a bounded wait, the effects URL is a required argument, and the rollback decision counts a dead effects runtime as not serving -- falsifier: uv run pytest scripts/runtime_build/tests/test_dev_effects_health_omn17427.py -q'
  - id: req-omn17427-dev-lane-skill-overlay
    statement: The dev lane's runtime-effects names its private skill overlay roots by an operator-supplied mount, and no lane layering the dev-lane file inherits a variable for a mount it drops.
    acceptance:
      - id: AC7
        statement: 'AC7: runtime-effects renders ONEX_SKILL_OVERLAY_ROOTS with one read-only mount from DEV_LANE_SKILL_OVERLAY_ROOTS_DIR, renders when it is unset, and the four borrower overlays blank it -- falsifier: uv run pytest tests/integration/infra/test_dev_runtime_compose_render.py -q -k skill_overlay'
  - id: req-omn17427-dev-lane-class-boot
    statement: The pre-merge laptop boot ends with a dev-lane class phase that recreates both kernels with the strict-wiring and secrets-store bindings read from the dev lane's compose files, on the current omnimarket release, and fails on any restart.
    acceptance:
      - id: AC8
        statement: 'AC8: the phase derives ONEX_WIRING_STRICT_MODE and a set INFISICAL_ADDR from docker-compose.dev-lane.yml and docker-compose.infra.yml, refuses when either binding is gone, and its gate fails a restarting or exited kernel -- falsifier: uv run pytest tests/ci/test_runtime_boot_dev_lane_class_omn17427.py -q'
  - id: req-omn17427-hotpatch-ledger-reconcile
    statement: A hot-patch ledger row whose fix commit is merged is retired by a refusing-by-default effect node, and the preflight prints the exact command.
    acceptance:
      - id: AC9
        statement: 'AC9: the reconcile handler retires a row only when its commit is an ancestor and no .prepatch remains, and refuses otherwise -- falsifier: uv run pytest tests/unit/handlers/test_handler_hotpatch_ledger_reconcile.py -q'
      - id: AC10
        statement: 'AC10: the preflight reports every unusable merge_commit row with its reconcile command, and onex node runs that command -- falsifier: uv run pytest tests/unit/scripts/test_preflight_hotpatch_ledger.py tests/integration/hotpatch/test_hotpatch_ledger_reconcile_integration_omn17427.py -q'
evidence_requirements:
  - kind: tests
    description: The node collector reads the marker on the seam DLQ.
    command: uv run pytest tests/unit/nodes/node_board_probe_effect/test_handler_docker_consumer_flow_target.py -q -k seam_dlq
  - kind: tests
    description: The script collector reads the recorded marker on the seam DLQ.
    command: uv run pytest tests/ci/test_c28_consumer_flow_probe.py -q -k seam
  - kind: tests
    description: The consumer_group_lag check judges a grown lag per partition.
    command: uv run pytest tests/ci/test_lab_pass_receipt_lag_stall_omn17427.py -q
  - kind: tests
    description: RT-6 reads a mid-run one-shot again until it settles.
    command: uv run pytest tests/scripts/test_deploy_runtime_rt6_one_shot_omn16729.py -q
  - kind: tests
    description: The health verdict wait waits on a starting runtime and keeps other 503s terminal.
    command: uv run pytest scripts/runtime_build/tests -q -k omn17624
  - kind: tests
    description: The dev gate probes the effects runtime and fails closed when it never answers.
    command: uv run pytest scripts/runtime_build/tests/test_dev_effects_health_omn17427.py -q
  - kind: tests
    description: The dev lane renders the operator-named skill overlay roots mount for runtime-effects only.
    command: uv run pytest tests/integration/infra/test_dev_runtime_compose_render.py -q -k skill_overlay
  - kind: tests
    description: The laptop boot's dev-lane class phase derives its bindings from the dev lane and fails on a restart.
    command: uv run pytest tests/ci/test_runtime_boot_dev_lane_class_omn17427.py -q
    description: The reconcile handler retires or refuses one ledger row.
    command: uv run pytest tests/unit/handlers/test_handler_hotpatch_ledger_reconcile.py -q
  - kind: tests
    description: The preflight prints the reconcile command and onex node runs it.
    command: uv run pytest tests/unit/scripts/test_preflight_hotpatch_ledger.py tests/integration/hotpatch/test_hotpatch_ledger_reconcile_integration_omn17427.py -q
