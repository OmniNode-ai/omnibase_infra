  - id: req-omn17427-prepr-pool-overlay-exercise
    statement: A pre-merge pool run can mount a named Bifrost overlay on its stack and run one command against the live stack, so a proof that needs a changed model endpoint is a pool run and not a hand-built slot.
    acceptance:
      - id: AC34
        statement: 'AC34: a pool run given an overlay copies it to the host and the build mounts it as the stack Bifrost overlay (a slot reads it as <project>.bifrost.yaml), and a post-up command runs once after the probe and fails the proof unless it printed exit code 0 -- falsifier: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_without_an_overlay_the_pool_refuses_and_names_how_to_supply_one tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_an_overlay_and_a_post_up_command_reach_the_host_and_run_after_probe tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_a_post_up_command_that_exits_non_zero_fails_the_proof tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_a_post_up_command_that_printed_no_exit_line_is_not_a_pass tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_a_run_without_a_post_up_command_runs_no_exercise_phase tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_a_missing_overlay_file_is_a_usage_error_before_any_host_is_touched tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_a_params_file_cannot_set_the_overlay_or_the_command tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_the_cli_takes_an_overlay_and_a_post_up_command tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_the_prove_script_mounts_the_overlay_on_a_slot_and_on_an_isolated_stack tests/unit/scripts/test_prepr_runtime_pool_omn18893.py::test_the_exercise_phase_runs_the_command_and_reports_its_exit_code -q'
  - id: req-omn17427-publisher-fixture-shapes
    statement: The publisher contract fixture resolves a topic through every publisher declaration shape the contract topic graph reads, so a golden chain over a topic published by a result topic, a produced event or a publication list is not refused as unpublished.
    acceptance:
      - id: AC35
        statement: 'AC35: PublisherContractCorpus resolves topics declared by event_bus.publish success and failure topics, produced_events, publications, topics.produces and runtime_dispatch.command_topic, still refuses a topic no contract publishes, and agrees with the topic graph parser -- falsifier: uv run pytest tests/unit/testing/test_publisher_contract_fixture_shapes.py -q'
  - id: req-omn17427-deploy-agent-topic-ensure
    statement: The deploy agent creates the topics only it publishes (dev-tag heartbeat and dev-lane drift) before its first publish to each, once per process, and leaves topics another node declares alone.
    acceptance:
      - id: AC36
        statement: 'AC36: each agent-owned topic is created before its first publish, an existing topic is created once and still published, an admin failure is retried on the next publish, and a topic another node declares is not created -- falsifier: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_publisher_creates_agent_topics_omn17427.py -q'
  - id: req-omn17427-consumer-flow-retention-grant
