schema_version: 1.0.0
ticket_id: OMN-22103
title: Compaction reply topics are per principal, and a developer principal reads only its own
summary: >-
  Lane cmod-reply-topic-1102, omnibase_infra half. The compaction hook edge awaited three shared reply topics (package, prepared, fallback) that every developer principal could read, so one machine could read another machine's compaction package. This change binds the three replies as principal-templated topics (the pattern of the ledger writer topic) in deploy/lab/developer-principal-bindings.yaml, regenerates the derived grants from the derivation node, makes the issuer create a templated topic its principal reads as well as one it writes (the broker does not auto-create topics), and lets the dispatch result applier publish an emitted topic that is a declared template with a well-formed principal in the slot. The three shared consume bindings stay until the omnimarket switch is proven live on the dev lane; removing them is the follow-up. AC1 (the live broker audit and the hook edge probe) and AC2 (the omnimarket contract change) are not claimed by this pull request; they are recorded in the lane report and in the omnimarket pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22103-reply-topic-bindings
    statement: The developer principal bindings grant read on principal-templated compaction reply topics, derived grants equal the derivation over them, and no principal's derived grants read another principal's reply topic.
    acceptance:
      - id: AC3
        statement: "AC3: developer-principal-bindings.yaml grants read on the principal-templated reply topics only for the principal itself and the derived grants JSON equals the derivation over the bindings -- falsifier: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute tests/scripts/test_lab_principal_issuer_omn20150.py in omnibase_infra, red before the change"
      - id: AC4
        statement: "AC4: a developer principal's derived grants contain no read on another principal's reply topic -- falsifier: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute -k reply_topic_isolation, red before the change"
evidence_requirements:
  - kind: tests
    description: The derivation, issuer and applier tests of the per-principal compaction reply topics.
    command: uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute tests/scripts/test_lab_principal_issuer_omn20150.py tests/unit/nodes/node_developer_principal_plan_compute tests/unit/runtime/test_dispatch_result_applier_principal_topic_omn22103.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22103-ac3-bindings-and-derived-grants
    description: >-
      The bindings declare the three templated reply topics as consume bindings (READ and DESCRIBE, the receipt-mode client group prefix already granted), the committed derived grants JSON is byte-equal to the derivation node's output over them, and the issuer resolves the templated topics per principal and creates them. On the parent commit the same tests fail because the bindings declare no templated reply topic.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22103-ac4-reply-topic-isolation
    description: >-
      For two principals, and for a principal whose name is the leading part of another's, the ACL rows the declaration derives hold READ on the principal's own three reply topics and on none of the other's, as literal topics. On the parent commit the principal holds no reply topic of its own, so the positive control fails.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute -k reply_topic_isolation -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22103-applier-principal-topic
    description: >-
      The dispatch result applier publishes an orchestrator-emitted envelope to its event_type topic when that topic is a contract-declared template with one well-formed principal in the slot, and falls back to the contract topic for an unfilled slot, an empty or malformed principal, a longer tail or an undeclared topic. This supports AC3: the topics are only useful if the runtime can answer on them.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_dispatch_result_applier_principal_topic_omn22103.py tests/unit/runtime/test_dispatch_result_applier_topic_routing.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22103-deploy-source
    description: >-
      Deploy probe. GitHub serves the checked-out commit with the applier's call to the declared-principal-topic match. The read fails on a tree without it, including origin/dev. This proves source identity only, not a running deployment.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: 'gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/service_dispatch_result_applier.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c "ModelPrincipalTopic.admits"'
