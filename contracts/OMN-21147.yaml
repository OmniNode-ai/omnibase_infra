schema_version: 1.0.0
ticket_id: OMN-21147
title: 'omnibase_infra: no retired lab value in the repository'
summary: Every retired lab value that omnibase_core's hardcoded-model-config guard reports as family R is removed from omnibase_infra, never replaced by another model name, host or port.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21147-infra-retired
    statement: The repository carries no retired lab value (family R), which can never be baselined.
    acceptance:
      - id: AC1
        statement: 'AC1: the whole-tree guard reports zero family R findings in omnibase_infra -- falsifier: uv run --with omnibase-core python -m omnibase_core.validation.hardcoded_model_config.runtime_hardcoded_model_config --all prints a line with "[R in".'
      - id: AC2
        statement: 'AC2: the tests that read the changed contracts, compose files, fixtures and the edge delegation worker pass without the retired values -- falsifier: uv run pytest tests/unit/contracts/test_llm_endpoints_contract.py tests/unit/runtime/test_render_bifrost_delegation_contract.py tests/unit/runtime/models/test_model_bifrost_lane_overlay.py tests/unit/infra/test_judge_compose_profile.py tests/scripts/test_check_llm_endpoint_env_contract.py tests/unit/scripts/edge_delegation_worker -q -n 0 fails.'
  - id: req-omn21147-catalog-checks
    statement: Checks cover the current registry without requiring a retired endpoint or silently skipping live calls.
    acceptance:
      - id: AC3
        statement: Every current local inference model has a health path, and the primary model remains required.
      - id: AC4
        statement: Measured-metric scoring selects a model that exists in the loaded registry.
      - id: AC5
        statement: Live adapter tests use marker selection and require an explicit reachable endpoint when selected.
evidence_requirements:
  - kind: tests
    description: Contract, bifrost render, compose profile and edge worker tests.
    command: uv run pytest tests/unit/contracts/test_llm_endpoints_contract.py tests/unit/runtime/test_render_bifrost_delegation_contract.py tests/unit/runtime/models/test_model_bifrost_lane_overlay.py tests/unit/infra/test_judge_compose_profile.py tests/scripts/test_check_llm_endpoint_env_contract.py tests/unit/scripts/edge_delegation_worker -q -n 0
  - kind: tests
    description: Focused catalog and environment-gated-skip checks.
    command: uv run pytest tests/ci/test_env_gated_skip_registry_omn18781.py tests/unit/docker/test_model_registry_health_paths.py tests/integration/test_model_router_registry_scoring_integration.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21147-infra-tests
    description: The tests that read the changed files pass.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/contracts/test_llm_endpoints_contract.py tests/unit/runtime/test_render_bifrost_delegation_contract.py tests/unit/runtime/models/test_model_bifrost_lane_overlay.py tests/unit/infra/test_judge_compose_profile.py tests/scripts/test_check_llm_endpoint_env_contract.py tests/unit/scripts/edge_delegation_worker -q -n 0
    binds_ac:
      - AC1
      - AC2
  - id: dod-omn21147-infra-deploy
    description: The deployed runtime image's packaged pricing manifest no longer carries the retired model rows. It reads the runtime container after the deploy agent rolls it, which a hosted runner does not have, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c "import importlib.resources as r; t=r.files('omnibase_infra.configs').joinpath('pricing_manifest.yaml').read_text(); raise SystemExit('deepseek-v4' in t)"
  - id: dod-omn21147-current-inference-health
    description: Every current inference row must declare the health path, the primary model remains required, and the retired reasoning route must be absent from the catalog.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_model_registry_health_paths.py -q --no-cov
      - check_type: command
        check_value: uv run python -c "from pathlib import Path; import yaml; models=yaml.safe_load(Path('docker/catalog/model_registry.yaml').read_text())['models']; assert models; assert all(m['model_key'] != 'deepseek-r1-32b' for m in models)"
    binds_ac:
      - AC3
  - id: dod-omn21147-registry-scoring-check
    description: Scoring reads a local candidate from the loaded registry and retains its measured-metric assertions; the production loader must no longer expose the retired reasoning route.
    source: manual
    checks:
      - check_type: command
        check_value: grep -q 'measured_model = local_coders\[0\]' tests/integration/test_model_router_registry_scoring_integration.py
      - check_type: test_passes
        check_value: uv run pytest tests/integration/test_model_router_registry_scoring_integration.py -q --no-cov
      - check_type: command
        check_value: uv run python -c "from omnibase_infra.services.routing_api import routes; entries=routes._load_registry(); assert entries; assert all(e.model_key != 'deepseek-r1-32b' for e in entries)"
    binds_ac:
      - AC4
  - id: dod-omn21147-live-adapter-fail-closed
    description: The live suite requires a configured endpoint and carries no environment-gated skip; the retired reasoning slot releases every deployment field so the topology cannot supply its former endpoint implicitly.
    source: manual
    checks:
      - check_type: command
        check_value: python3 -c "from pathlib import Path; s=Path('tests/integration/adapters/llm/test_adapter_documentation_generation_integration.py').read_text(); assert 'assert _ENDPOINT_HOST' in s; assert 'pytest.mark.skipif' not in s; assert 'pytest.mark.slow' in s"
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_env_gated_skip_registry_omn18781.py -q --no-cov
      - check_type: test_passes
        check_value: uv run pytest tests/unit/contracts/test_llm_endpoints_contract.py -k test_retired_reasoning_slot_releases_all_deployment_fields -q --no-cov
    binds_ac:
      - AC5
  - id: dod-omn21147-hosted-routing-readback
    description: Hosted-runner readback loads the real catalog through the installed routing loader and requires a local code-generation candidate. No private lane is needed.
    source: manual
    checks:
      - check_type: command
        check_value: uv run python -c "from omnibase_infra.services.routing_api import routes; entries=routes._load_registry(); assert any(e.tier == 'local' and 'code_generation' in e.capabilities for e in entries); print('routing catalog readback passed')"
  - id: dod-omn21147-hosted-pricing-deploy-readback
    description: Hosted-runner deploy readback rejects retired model rows in the packaged pricing manifest without a private runtime container.
    source: manual
    checks:
      - check_type: command
        check_value: uv run python -c "import importlib.resources as r; t=r.files('omnibase_infra.configs').joinpath('pricing_manifest.yaml').read_text(); assert 'deepseek-v4' not in t; print('packaged pricing readback passed')"
    binds_ac:
      - AC1
