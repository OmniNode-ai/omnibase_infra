schema_version: 1.0.0
ticket_id: OMN-26405
title: The runtime image's prebuilt manifest passes its boot stamp check on the image it was built in, so boot step 0 loads it and runs no contract discovery
summary: >-
  The dev image built at revision 8b76765e2fbb stamped its prebuilt node manifest with active_packages='' because the build RUN received no PREBUILT_ACTIVE_RUNTIME_PACKAGES argument, while the runtime compose gives the container ONEX_ACTIVE_RUNTIME_PACKAGES from docker/runtime-policy.env ('omnibase_infra,omnimarket'). Every boot of that image therefore read the file stale and fell back to announce and discover. The manifest build RUN now reads the same policy file when no build argument names the set (an argument still wins; a repeated key takes the last line as compose does), so the stamp records the value the container boots with. The read fails closed: a missing key, an empty value or a value that is not a plain comma list stops the build instead of stamping an empty set. A stamp input that changes after the build still reads stale. The health gate, the boot guard, the compose wait and the compose start period are not changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26405-manifest-not-stale
    statement: The prebuilt manifest built in the runtime image reads fresh at boot under the compose environment, and a changed stamp input still reads stale.
    acceptance:
      - id: AC1
        statement: "AC1: the stamp field or fields that differ between the build-time stamp and the boot-time read on the dev image are named in the PR body under a section headed Measured stale field, with the boot log line, the stamp value, the boot-time value and the UTC read time -- falsifier: onex scm pr-view of the PR shows no section headed Measured stale field holding both values and a UTC read time"
      - id: AC2
        statement: "AC2: a regression test that builds the image layers in order (the manifest step after the last step that changes any stamp input) and asserts the boot step loads the prebuilt manifest and runs no contract discovery fails at the merge base and passes on the PR branch -- falsifier: uv run pytest tests/unit/runtime -q -k prebuilt_manifest_boot_uses_manifest passes at the merge base of the PR or fails on the PR branch"
      - id: AC3
        statement: "AC3: the health gate, the boot guard, the compose wait and the compose start period are unchanged by the PR -- falsifier: git diff origin/dev --stat on the PR branch lists a health gate setting, a boot guard file, a compose file or a wait setting, checked with uv run pytest tests/unit/runtime -q -k prebuilt_manifest_boot_uses_manifest"
      - id: AC4
        statement: "AC4: after the deploy agent builds an image from the branch on dev, the boot log of omninode-runtime on omni-201 carries no line reading prebuilt manifest not used and the seconds from container start to /health 200 are recorded in the lane report -- falsifier: docker logs omninode-runtime on omni-201 holds a line matching prebuilt manifest not used for the new container, or the report carries no start-to-health seconds"
      - id: AC5
        statement: "AC5: one ledger MSG to lane m4dev3-2045 carries the stale field and the PR number -- falsifier: grep -F m4dev3-2045 over the ledger finds no MSG row from lane mfstale-2100 at or after the PR is opened"
evidence_requirements:
  - kind: tests
    description: The prebuilt manifest boot regressions in tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py and the earlier prebuilt manifest tests.
    command: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py tests/unit/runtime/test_prebuilt_manifest_omn26361.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26405-ac1-measured-stale-field
    description: The measured field (active_packages, stamp '' against boot 'omnibase_infra,omnimarket') is reproduced at the merge base by the boot regression, which fails there with the same differing-field text the boot log carries; the second check shows the field is named when a boot falls back. The PR body quotes the measurement under Measured stale field; no runner check reads a PR body.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py -k under_the_runtime_policy_environment -q --no-cov -n 0 -p no:randomly
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py -k names_the_stamp_field -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26405-ac2-boot-uses-manifest
    description: The test applies the Dockerfile's manifest RUN as written, boots under the compose environment and asserts the manifest loads with no announce call and no contract parse; it fails at the merge base, where the stamp reads active_packages '' against the policy value.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime -q -k prebuilt_manifest_boot_uses_manifest --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26405-ac2-negative-stale-still-stale
    description: A distribution version, a contract file or the cloud mirroring switch changed after the manifest step still reads stale and falls back, with the field named.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py -k negative_input_changed_after_the_build_reads_stale -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26405-ac2-build-set-equals-compose-set
    description: The set the build reads from docker/runtime-policy.env is the set every runtime compose file that declares it passes, because each declares the policy variable as an interpolation with no default; the build argument wins over the file and a repeated key takes the last line.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py -k "reads_the_set_every_compose_file_passes or build_argument_wins or last_repeated_key" -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26405-ac2-build-fails-closed
    description: With no build argument and a policy file whose key is absent, empty, quoted, commented, exported or whose file is empty, the manifest RUN exits non-zero before it calls python.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py -k fails_closed_without_a_usable_set -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26405-ac3-gates-unchanged
    description: The diff touches docker/Dockerfile.runtime, the new test and this contract; the HEALTHCHECK line and its start period are asserted unchanged, and no compose file, boot guard or wait setting is in the diff.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_omn26361.py -k prebuilt_manifest_gates_unchanged -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26405-ac4-boot-loads-manifest
    description: >-
      The unit-level half of AC4, which fails at the merge base. The boot under the compose environment loads the manifest and logs no line reading Prebuilt node manifest not used. The live read of the rebuilt dev container is the next entry.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py -k under_the_runtime_policy_environment -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26405-ac4-deploy-no-stale-line
    description: >-
      Post-deploy probe: the rebuilt dev runtime container's boot log holds no line reading Prebuilt node manifest not used. It reads the live container, which carries the fix only after the deploy agent has rebuilt it from this change, so a pull request runner cannot pass it; only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: "! docker logs omninode-runtime 2>&1 | grep -i 'prebuilt node manifest not used'"
  - id: dod-omn26405-ac5-msg-to-m4dev3
    description: The MSG row to lane m4dev3-2045 is a ledger row, read after the PR is opened; no runner check reads the ledger.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/runtime/test_prebuilt_manifest_boot_omn26405.py -k under_the_runtime_policy_environment -q --no-cov -n 0 -p no:randomly
        cwd: .
