schema_version: "1.0.0"
ticket_id: OMN-21334
title: Vendor the compaction barrier migrations ahead of omnimarket
summary: >-
  Vendors the session_content barrier stamps and claude_hook_events producer sequence migrations byte for byte from omnimarket. Adds checksum-bound ledger rows and migration classes. This is the infrastructure deployment half of OMN-21334.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21334-infra-vendor
    statement: >-
      The two vendored migrations retain the source bytes, each has exactly one checksum-bound ledger row and the correct class, and none is fenced.
    acceptance:
      - id: AC1
        statement: >-
          AC1: session_content/0002 and claude_hook_events/0008 match the measured omnimarket bytes, ledger checksums and classes without a FORCE fence -- falsifier: the vendor unit test fails any assertion.
  - id: req-omn21334-live-apply
    statement: >-
      The complete session_content and claude_hook_events migration chains apply to an ephemeral PostgreSQL database, reapply without changing populated rows, and deliver the required column types and nullability.
    acceptance:
      - id: AC2
        statement: >-
          AC2: the live-apply tests apply both chains through session_content/0002 and claude_hook_events/0008, preserve populated rows on a second apply, and assert the new column types and nullable declarations -- falsifier: test_second_apply_preserves_populated_rows or either test_column_types case fails.
evidence_requirements:
  - kind: tests
    description: Source byte pins, ledger checksums, classes and absence of fences.
    command: uv run pytest tests/unit/migrations/test_omn21334_compaction_vendor.py -q
  - kind: tests
    description: Real migration apply, replay, column types and nullability.
    command: ONEX_MIGRATION_PROOF_REQUIRE_PG=1 uv run pytest tests/integration/migrations/test_compaction_vendor_omn21334.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21334-infra-vendor
    description: Pins both source digests, their exact ledger rows and classes, and proves neither is fenced.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/migrations/test_omn21334_compaction_vendor.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC1]
  - id: dod-omn21334-live-apply
    description: Applies both chains twice around populated rows and proves column types and nullability.
    source: manual
    checks:
      - check_type: test_passes
        check_value: ONEX_MIGRATION_PROOF_REQUIRE_PG=1 uv run pytest tests/integration/migrations/test_compaction_vendor_omn21334.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: [AC2]
