schema_version: "1.0.0"
ticket_id: OMN-20422
title: A lab-host systemd timer runs the shadow reviewer experiment tick
summary: deploy/shadow-review carries a user systemd timer and oneshot service that run omnimarket's node_shadow_review_effect every 15 minutes on a lab host, fail a tick whose PR watcher state is missing or stale, and carry no addresses or values in the committed env template. Both units are in the unit drift manifest for omnipc2.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20422-shadow-timer
    statement: The shadow reviewer tick runs from a lab-host user timer, never from a CI runner, and a stale or missing PR watcher state fails the tick visibly instead of reading as a quiet day.
    acceptance:
      - id: AC2
        statement: 'AC2: the timer and service run node_shadow_review_effect on a 15-minute UTC schedule, the freshness gate exits 3 on a missing or stale watcher state and 0 on a fresh one, and the env template sets nothing -- falsifier: uv run pytest tests/unit/scripts/test_shadow_review_timer_units.py -q'
evidence_requirements:
  - kind: tests
    description: The unit tests read the timer, service, env template and drift manifest, and run the service's own freshness gate on a missing, a stale and a fresh watcher state.
    command: uv run pytest tests/unit/scripts/test_shadow_review_timer_units.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20422-shadow-timer-ac2
    description: The shadow-review timer unit tests pass at the head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_shadow_review_timer_units.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
