schema_version: "1.0.0"
ticket_id: OMN-20422
title: Use Qwen3.6-35B-A3B as the Hostile Reviewer's second voter
summary: Bind the second voter to the Studio's port 8131 while preserving the first voter and quorum keys, as ruled on 2026-10-09T04:15:56Z.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-distinct-hostile-review-voters
    statement: The Hostile Reviewer uses Qwen3.6-35B-A3B as its second voter alongside Qwen3.8-27B, with the existing review keys and quorum rule.
    acceptance:
      - id: AC1
        statement: 'AC1: the recorded second-voter response identifies Qwen3.8-27B, the one model the Studio serves, and a completed reply (the footer no longer names a model since OMN-20910) -- falsifier: uv run pytest tests/ci/test_hostile_review_second_voter_omn20422.py -q -k test_second_voter_endpoint_is_the_studio_single_served_model'
      - id: AC2
        statement: 'AC2 (superseded by OMN-20910): the review and preflight read one review voters overlay and name no voter URL -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k from_the_overlay'
      - id: AC3
        statement: 'AC3 (superseded by OMN-20910): the voters are the overlay entries and the quorum rule is unchanged -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k reads_the_overlay'
  - id: req-reviewer-pin-and-key
    statement: The Hostile Reviewer clones omniintelligence at the dev tip that carries the failed-vote parse fix and the registry key rename, and every roster site names the renamed second voter.
    acceptance:
      - id: AC4
        statement: 'AC4 (superseded by OMN-20910): sibling-pins.yaml and the hostile-reviewer clone name one full omniintelligence sha that carries the parse fix and the voters overlay reader, and no retired endpoint variable is read -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k "pinned or retired_endpoint"'
  - id: req-omn20422-shadow-timer
    statement: The shadow reviewer tick runs from a lab-host user timer, never from a CI runner, and a stale or missing PR watcher state fails the tick visibly instead of reading as a quiet day.
    acceptance:
      - id: AC5
        statement: 'AC5: the timer and service run node_shadow_review_effect on a 15-minute UTC schedule, the freshness gate exits 3 on a missing or stale watcher state and 0 on a fresh one, and the env template sets nothing -- falsifier: uv run pytest tests/unit/scripts/test_shadow_review_timer_units.py -q'
evidence_requirements:
  - kind: tests
    description: Recorded live-contact evidence and workflow checks cover the second voter's model, shared endpoint and quorum keys.
    command: uv run pytest tests/ci/test_hostile_review_second_voter_omn20422.py -q
  - kind: tests
    description: The unit tests read the timer, service, env template and drift manifest, and run the service's own freshness gate on a missing, a stale and a fresh watcher state.
    command: uv run pytest tests/unit/scripts/test_shadow_review_timer_units.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20422-ac1
    description: The recorded second-voter response identifies Qwen3.8-27B, the one model the Studio serves, and a completed reply, and the review comment footer names local-studio-planner with that model.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_hostile_review_second_voter_omn20422.py -q -k test_second_voter_endpoint_is_the_studio_single_served_model
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-20422-ac2
    description: The review and preflight steps read one job-level LLM_LOCAL_STUDIO_PLANNER_URL from the repository variable.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k from_the_overlay
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn-20422-ac3
    description: qwen3-review and local-studio-planner remain the quorum keys.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k reads_the_overlay
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn-20422-ac4
    description: Superseded by OMN-20910 -- the omniintelligence pin is one full sha carrying the parse fix and the voters overlay reader, and the workflow reads the voters from the overlay.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k pinned
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC4
  - id: dod-omn-20422-shadow-timer-ac5
    description: The shadow-review timer unit tests pass at the head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_shadow_review_timer_units.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
