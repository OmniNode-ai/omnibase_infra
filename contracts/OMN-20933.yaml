schema_version: "1.0.0"
ticket_id: OMN-20933
title: "omnibase_infra lab compose files and host units move to the private overlay (Infisical stability and DNS canary compose files, lane-census units)"
summary: docker/docker-compose.infisical-stability.yml, docker/docker-compose.dns-canary.yml and the three lane-census systemd units leave omnibase_infra. Their byte-identical copies live in the operator's private config root (ONEX_WORKSPACE_CONFIG_ROOT), the compose files under deploy/lab/compose/ and the units under systemd/lane-census/. deploy/lane-census/install-lane-census.sh stays and reads the units from that root, refusing with exit 2 when no root is configured or a unit is absent there. The runtime change classifier drops its dead infisical-stability entry. No installed unit and no running lane changes. The rest of the ticket's file set is later work under the same ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20933-lab-config-out
    statement: omnibase_infra must carry no copy of the moved lab compose files or lane-census units, and the lane-census installer must read its units from the private config root and fail loud without it.
    acceptance:
      - id: AC1
        statement: 'AC1: omnibase_infra tracks none of docker/docker-compose.infisical-stability.yml, docker/docker-compose.dns-canary.yml, deploy/lane-census/onex-disk-gc.service.d/20-lane-census.conf, deploy/lane-census/standalone/onex-lane-census.service or deploy/lane-census/standalone/onex-lane-census.timer -- falsifier: uv run pytest tests/ci/test_lab_config_out_omn20933.py -q fails'
      - id: AC2
        statement: 'AC2: deploy/lane-census/install-lane-census.sh installs units read from ONEX_WORKSPACE_CONFIG_ROOT/systemd/lane-census/ and exits 2 naming ONEX_WORKSPACE_CONFIG_ROOT when that variable is unset or a unit is absent there -- falsifier: uv run pytest tests/unit/scripts/test_lane_census_timer_dropin.py -q fails'
evidence_requirements:
  - kind: tests
    description: None of the five moved paths is present in the tree, against a positive control that the repository root resolved.
    command: uv run pytest tests/ci/test_lab_config_out_omn20933.py -q --no-cov
  - kind: tests
    description: The installer renders units read from a supplied private root, and refuses with no root and with a root that holds no units.
    command: uv run pytest tests/unit/scripts/test_lane_census_timer_dropin.py -q --no-cov
  - kind: manual
    description: On a lab host the installer's resolver reads the private copies, which are byte-identical to the removed ones, and with the config root unset it refuses; quoted on the Lab line of the PR body.
    command: bash deploy/lane-census/install-lane-census.sh --broker-container <container> (HOME pointed at a scratch directory, systemctl stubbed)
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20933-ac1
    description: The moved compose files and lane-census units are absent from the tree. Red at the merge base, where all five are tracked.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_lab_config_out_omn20933.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn-20933-ac2
    description: The installer reads its units from the private config root and refuses without one. Red at the merge base, where it reads the copies beside itself.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/test_lane_census_timer_dropin.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
