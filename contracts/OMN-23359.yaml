schema_version: "1.0.0"
ticket_id: OMN-23359
title: "h201's ten general CI runners come off the declared runner fleet, so its repair timer stops recreating them"
summary: "The declared runner fleet gives h201 zero general CI runners (expected_count and burst_count 10 to 0), the ten omninode-runner services and their volumes leave h201's compose file, and the fleet tests carry the new totals. h201's host-specific runners stay. After merge the Mac runs scripts/deploy-runners.sh --retire-surplus to retire the running containers."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23359-h201-general-runners-retired
    statement: h201 swaps under load and its repair timer recreates any missing general runner up to the declared count, so the declared count itself must reach zero before the containers can stay retired.
    acceptance:
      - id: AC1
        statement: "AC1: the declared runner fleet gives h201 zero general CI runners and keeps its host-specific runners, with the fleet tests updated to the new totals -- falsifier: uv run pytest -q -k runner_fleet in omnibase_infra"
      - id: AC2
        statement: "AC2: after the merged change is applied with deploy-runners.sh --retire-surplus, h201 runs no general CI runner for an hour and its swap use falls -- falsifier: docker ps on h201 and its swap reading before and after"
evidence_requirements:
  - kind: tests
    description: The fleet config and fleet hosts tests pin h201 at zero general runners with its host-specific runners kept, and the compose and relabel tests read the new totals.
    command: uv run pytest -q -k runner_fleet tests/unit/observability/runner_health
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23359-fleet-zero-general-runners
    description: The fleet config and fleet hosts tests pass at the head with h201 declared at zero general runners and its host-specific runners kept. With config/runner_fleet.yaml read from the base the same tests fail.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q -k runner_fleet tests/unit/observability/runner_health/test_runner_fleet_config.py tests/unit/observability/runner_health/test_runner_fleet_hosts.py
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23359-compose-and-roll-tests
    description: The runner compose, cache volume, relabel roll and registration preflight tests pass against the compose file without omninode-runner-1..10.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/ci/test_runner_cache_volumes.py tests/ci/test_deploy_runners_registration_preflight.py tests/unit/scripts/test_deploy_runners_relabel_roll_omn19998.py
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23359-h201-no-general-runner
    description: After deploy-runners.sh --retire-surplus has run on the Mac, docker ps on h201 lists no omninode-runner-N container. Read after the merge; the swap reading before and after is recorded beside it.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" "test \"$(docker ps --format '{{.Names}}' | grep -c -E '^omninode-runner-[0-9]+$')\" = 0"
        cwd: ${OMNI_HOME}/omnibase_infra
