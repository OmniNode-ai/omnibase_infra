schema_version: 1.0.0
ticket_id: OMN-23459
title: The landing decision failure mailbox is created on the dev message system and the dev lane account may use it
summary: >-
  The developer principal wire bindings (deploy/lab/developer-principal-bindings.yaml) declare the landing decision node's failure terminal (onex.evt.omnimarket.pr-landing-decision-failed.v1) as a produce and a consume binding, read under the existing landing-chain-controller- group prefix, so no new group prefix is added. The derived grants file is regenerated from the derivation node, never typed. The topic is created by the topic provisioner from the decision node's contract (a separate change in omnimarket). The grants take effect on the dev broker when the issuer's apply-grants runs the derived file; that step needs the operator's broker admin credential and is recorded in the pull request, not claimed here.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - topics
requirements:
  - id: req-omn23459-failure-terminal-grants
    statement: The dev lane principal's declared grants include the landing decision failure terminal, and the derived grants file is the derivation node's output over the bindings.
    acceptance:
      - id: AC2
        statement: "AC2: the dev-lane principal's declared grants include the failure terminal (produce and consume, no new group prefix), derived from the bindings through the derivation node, and the expected ACL row count in the issuer test moves in the same change -- falsifier: uv run pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/integration/nodes/test_broker_grant_derive_contract_discovery_omn19939.py fails against the bindings and derived grants at the merge base"
evidence_requirements:
  - kind: tests
    description: The derivation, issuer and row count tests over the landing decision bindings.
    command: uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py tests/integration/nodes/test_broker_grant_derive_contract_discovery_omn19939.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23459-ac2-failure-terminal-grants
    description: >-
      The bindings declare the landing decision failure terminal (READ, WRITE, DESCRIBE, three derived ACL rows) with no new group prefix; the committed derived grants JSON is byte-equal to the derivation node's output; the expected row count is 192. At the merge base bindings and derived grants five of the tests in these files fail.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py tests/integration/nodes/test_broker_grant_derive_contract_discovery_omn19939.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn23459-integration-proof-lab
    description: >-
      Runs the grant derivation, issuer and row count tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item. The audit-grants read on the dev broker after the apply is recorded on the ticket, not claimed here.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23459 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_broker_grant_derive_compute/test_developer_principal_grants_omn19975.py tests/scripts/test_lab_principal_issuer_omn20150.py -q -p no:cacheprovider'
        cwd: .
