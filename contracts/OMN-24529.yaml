schema_version: 1.0.0
ticket_id: OMN-24529
title: An announcement can name the runtime that vouches for it (new optional field)
summary: >-
  ModelNodeIntrospectionEvent gains runtime_id, a UUID or None (default None), with a validator that refuses a runtime_id equal to the event's own node_id. An older message without the field parses as before; the model keeps extra=forbid, so an unknown field is still refused. Nothing sets the field yet.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn24529-runtime-id
    statement: An introspection event can carry the id of the runtime that vouches for the node, validated, without changing how older messages parse.
    acceptance:
      - id: AC1
        statement: "AC1: an old-shape introspection message without the new field parses and is accepted as before -- falsifier: the compatibility test fails if the old shape is refused or changes value"
      - id: AC2
        statement: "AC2: a message whose runtime_id equals its own node_id is refused, and an unknown field is refused -- falsifier: removing the validator makes the self-parent test fail"
      - id: AC3
        statement: "AC3: integrated: after the dev runtime runs the merged revision, no live introspection message is refused for the new field over an interval -- falsifier: a parse refusal read on the running dev runtime"
evidence_requirements:
  - kind: tests
    description: The runtime_id model tests; the new-field tests fail at the merge base.
    command: uv run --frozen pytest tests/unit/models/registration/test_model_node_introspection_event_runtime_id.py tests/unit/models/registration/test_model_node_introspection_event.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24529-ac1
    description: 'AC1: an old-shape JSON message without runtime_id parses with runtime_id None and round-trips; fails at the merge base only for the new-field tests, the old-shape parse holds either way.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/registration/test_model_node_introspection_event_runtime_id.py tests/unit/models/registration/test_model_node_introspection_event.py tests/integration/registration/test_introspection_event_runtime_id_wire.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24529-ac2
    description: 'AC2: a self-parented message and an unknown field are refused; with the validator removed (control test) the self-parent is accepted.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/registration/test_model_node_introspection_event_runtime_id.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24529-ac3
    description: 'hosted proxy for AC3: the model tests pass here; the parse refusals of live introspection messages on the running dev runtime are read after the deploy and posted as a pull request comment naming the running revision.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/registration/test_model_node_introspection_event_runtime_id.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24529-integration-proof
    description: 'Run the model tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24529 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/models/registration/test_model_node_introspection_event_runtime_id.py -q -n 0 --no-cov
        cwd: .
