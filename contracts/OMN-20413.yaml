schema_version: "1.0.0"
ticket_id: OMN-20413
title: "OCC-writer refresh PRs carry a head-bound contract for the ticket they cite"
summary: The lane census and omnimarket contract-pin producer workflows render contracts/<ticket>.yaml inline, binding the value each refresh moves, so repo-evidence / dod-verify finds a contract at the bot PR head whose check fails at the merge base.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20413
    statement: Each in-repo OCC-writer refresh producer commits a contract for its cited ticket that binds the refreshed value.
    acceptance:
      - id: AC1
        statement: 'AC1: the contract check each producer workflow renders passes on the refreshed file and fails on the pre-refresh file, and the workflow commits the contract -- falsifier: uv run pytest tests/ci/test_render_bot_refresh_contract.py -q'
  - id: req-omn20413-routing-audit-batched-read
    statement: The routing audit's live private-repo pass reads the default-branch workflows of every private repository in batched GraphQL queries, so one CI run spends a few GraphQL points on CROSS_REPO_PAT instead of one per private repository, and an unread repository in a batch still raises instead of reading clean.
    acceptance:
      - id: AC2
        statement: 'AC2: 45 private repositories are read in three gh api graphql calls with every repository keyed to its own texts, a rate-limited batch raises GitHubRateLimitError, a null repository in a batch raises naming it, and the batched pass still reports a private bare hosted pin -- falsifier: uv run pytest tests/ci/test_runner_routing_audit.py -q -k batch'
  - id: req-omn20413-lane-census-refresh-push
    statement: The lane census refresh leg pushes its bump branch to the CI overlay with the App token and accepts drift whose event it did not publish, so the committed census stops aging past the Lane Census Staleness limit.
    acceptance:
      - id: AC3
        statement: 'AC3: the overlay checkout persists no credential, the bump push carries the App token in its URL, and the collect step accepts collector exits 0, 30 and 8 and refuses 2, 3, 4 and 5 -- falsifier: uv run pytest tests/ci/test_lane_census_refresh_push_omn20413.py -q'
  - id: req-omn20413-lane-census-pr-advisory
    statement: The Lane Census Staleness + E-5 Env Drift (OMN-13034) check reports the private overlay census's age as a warning on pull requests, because no pull request in this repository can move it, and still fails on push, workflow_dispatch, and a missing or malformed snapshot.
    acceptance:
      - id: AC4
        statement: 'AC4: check_lane_census_age.py --stale-advisory exits 0 with a warning on a stale snapshot and 1 on a missing or malformed one, exits 1 on a stale snapshot without the flag, and the staleness workflow passes the flag only when github.event_name is pull_request -- falsifier: uv run pytest tests/unit/scripts/test_check_lane_census_age.py tests/ci/test_lane_census_staleness_pr_advisory_omn20413.py -q'
  - id: req-omn20413-hook-push-rehearsal-siblings
    statement: The hook-push-rehearsal / rehearse check clones the omnibase_core and omniclaude siblings a worker's OMNI_HOME holds before it pushes the sample commit, so the architecture-layer and deploy-scope DoD pre-push hooks stop refusing every hook-changing pull request on a hosted runner.
    acceptance:
      - id: AC5
        statement: 'AC5: the rehearsal job keeps the hook-push-rehearsal / rehearse context, clones exactly the siblings the two pre-push hooks read and exports OMNI_HOME before the push step, and the deploy-scope hook resolves its validator from the OMNI_HOME the clone step lays out -- falsifier: uv run pytest tests/ci/test_hook_push_rehearsal_caller_omn17427.py -q'
  - id: req-omn20413-hook-push-rehearsal-enforcement
    statement: The retained rehearsal context is enforced by CI Summary after its sixteen-PR admission replay, so the inline verification job can block landing.
    acceptance:
      - id: AC6
        statement: 'AC6: CI Summary admits a successful rehearsal, refuses failure, skipped and neutral rehearsals, and waits on a missing rehearsal; the recorded watcher rows show the context reported before merge on sixteen recent dev PRs -- falsifier: uv run pytest tests/ci/test_hook_push_rehearsal_caller_omn17427.py -q'
evidence_requirements:
  - kind: tests
    description: The rendering lines of both producer workflows run as written against a refreshed and a pre-refresh file.
    command: uv run pytest tests/ci/test_render_bot_refresh_contract.py -q
  - kind: tests
    description: The batched workflow read counts gh graphql calls across many private repositories and replays the unread shapes.
    command: uv run pytest tests/ci/test_runner_routing_audit.py -q -k batch
  - kind: tests
    description: The refresh workflow's overlay checkout, bump push and collect-step exit handling are read from the workflow and the acceptance line is run in bash.
    command: uv run pytest tests/ci/test_lane_census_refresh_push_omn20413.py -q
  - kind: tests
    description: The age checker's advisory flag and the workflow's pull_request-only use of it.
    command: uv run pytest tests/unit/scripts/test_check_lane_census_age.py tests/ci/test_lane_census_staleness_pr_advisory_omn20413.py -q
  - kind: tests
    description: The rehearsal workflow's sibling clone step is read from the workflow and run in bash with a stub git, and the deploy-scope resolver is run against the OMNI_HOME it exports.
    command: uv run pytest tests/ci/test_hook_push_rehearsal_caller_omn17427.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20413-ac1
    description: The rendered contract binds the refreshed value and both producers commit it.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_render_bot_refresh_contract.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn20413-ac2-routing-audit-batched-read
    description: AC2 tests count the gh api graphql calls of the batched private-repo workflow read and replay its unread shapes.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_runner_routing_audit.py -q -k batch
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn20413-ac3-lane-census-refresh-push
    description: AC3 tests read lane-census-refresh.yml and run its collect-step acceptance line in bash; four of them fail at the merge base, where the push used the moved clone's missing credential and exit 8 was refused.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_lane_census_refresh_push_omn20413.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
  - id: dod-omn20413-ac4-lane-census-pr-advisory
    description: AC4 tests drive check_lane_census_age.py with and without --stale-advisory and read lane-census-staleness.yml; the advisory tests fail at the merge base, where the flag does not exist.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/unit/scripts/test_check_lane_census_age.py tests/ci/test_lane_census_staleness_pr_advisory_omn20413.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC4
  - id: dod-omn20413-ac5-hook-push-rehearsal-siblings
    description: AC5 tests read hook-push-rehearsal.yml and run its sibling clone step; they fail at the merge base, where the job called the omnibase_core reusable with no sibling clone step.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_hook_push_rehearsal_caller_omn17427.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC5
  - id: dod-omn20413-ac6-hook-push-rehearsal-enforcement
    description: AC6 controls fail before the rehearsal context is registered in CI Summary.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_hook_push_rehearsal_caller_omn17427.py -q -k 'ci_summary_requires or sixteen_recent'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC6
