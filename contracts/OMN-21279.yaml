      AC2, laptop boot. The catalog-local boot on head 17272c32b failed because the local bundle's kernels, on the infra image without omnimarket, read ONEX_ACTIVE_RUNTIME_PACKAGES=omnibase_infra,omnimarket from docker/runtime-policy.env and runtime_local_ingress imported omnimarket (ModuleNotFoundError, BOOT FAILED 5/5). The local bundle now renders ONEX_ACTIVE_RUNTIME_PACKAGES as ${ONEX_LOCAL_RUNTIME_PACKAGES:-omnibase_infra} and local-market restores omnibase_infra,omnimarket through env_default_overrides. These tests render both bundles and resolve the local value against the policy file; all three fail with the bundle file of 17272c32b.
