dod_evidence:
  - id: dod-omn-21279-ac2-pre-swap-boot-contract
    description: >-
      AC2, dev deployment safety. The 2026-10-25 scrubbed crash-loop reason BIFROST_BASE_CONTRACT_PATH unset is returned by a candidate-image probe. Runtime and full rebuilds must fail before any compose up, retain the running containers and persist the boot reason on a failed job. Positive controls permit a readable contract and preserve post-swap verification; timeout controls refuse the swap and clean only the disposable probe. Red first: the original four regressions failed at the base because no probe ran and the job was recorded successful. This hosted-runner check uses the repository lockfile and the verifier-prepared root environment, with the deploy-agent and runtime source paths from this head, and exercises the deploy agent without Docker or live runtime dependencies; it does not claim a full runtime boot or replace runtime-boot-smoke.
    source: generated
    checks:
      - check_type: command
        check_value: env PYTHONPATH=scripts/deploy-agent:src uv run --frozen python -m pytest -c scripts/deploy-agent/pyproject.toml scripts/deploy-agent/tests/unit/test_runtime_boot_gate_omn21279.py -q
    binds_ac:
      - "AC2"
  - id: dod-omn-21279-dev-boot-recovery
    description: >-
      Regression for job 3a55c329: RETRIES EXHAUSTED during the initial probe, declared-start wait or recreate wait fails promptly; transient failures retain their health checks. Verification failures and probe timeouts restore the job's own point before unlock, keep the failed verdict, and allow the next job. Before this change the exhausted-boot and timeout cases failed. This is recovery evidence, not a substitute for AC2's runtime-boot-smoke job or the layering evidence below.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev --frozen pytest scripts/deploy-agent/tests/unit/test_rollback_preempt_omn21279.py -q -k 'boot or failure_restores'
    binds_ac:
      - AC5
  - id: dod-omn-21279-dev-queue-priority
    description: >-
      Regression for rollback 70315f50 to dev-20261025120130-26d49cec3536: it runs before earlier forwards, Kafka commits retain the skipped frontier across restart and self-update, duplicate rollback delivery does not execute again, and other lanes, instances, unsigned requests and moving refs get no priority. The priority cases failed before the fix.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev --frozen pytest scripts/deploy-agent/tests/unit/test_rollback_preempt_omn21279.py -q -k 'priority or tag_rollback'
    binds_ac:
      - AC4
  - id: dod-omn-21279-deploy-agent-recovery-probe
    description: >-
      Deploy-scope source readback runnable on a hosted runner with no lab route, lab credentials, Docker daemon or live deploy. Reads the evaluated revision through GitHub and checks that each verifier wait invokes the exhausted-boot guard, and that the poll path selects priority work while preserving a replay frontier. The merge base lacks both methods. These source-wiring assertions supplement the behavioral regressions above; they do not claim that the live agent has been updated.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/scripts/deploy-agent/deploy_agent/executor.py?ref=$(git rev-parse HEAD)" --jq '.content | @base64d' | python3 -c 'import ast,sys; tree=ast.parse(sys.stdin.read()); cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=="DeployExecutor"); methods={n.name:n for n in cls.body if isinstance(n,ast.FunctionDef)}; guard=methods["_assert_boot_can_progress"]; assert any(isinstance(n,ast.Constant) and isinstance(n.value,str) and "RETRIES EXHAUSTED:" in n.value for n in ast.walk(guard)); assert all(any(isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=="_assert_boot_can_progress" for n in ast.walk(methods[name])) for name in ("verify","_await_declared_start","_force_recreate_and_reverify"))' &&
          gh api "repos/OmniNode-ai/omnibase_infra/contents/scripts/deploy-agent/deploy_agent/consumer.py?ref=$(git rev-parse HEAD)" --jq '.content | @base64d' | python3 -c 'import ast,sys; tree=ast.parse(sys.stdin.read()); cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=="DeployConsumer"); methods={n.name:n for n in cls.body if isinstance(n,ast.FunctionDef)}; assert "_priority_message" in methods; poll=methods["poll_and_accept"]; assert any(isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=="_priority_message" for n in ast.walk(poll)); assert any(isinstance(n,ast.keyword) and n.arg=="replay_from" for n in ast.walk(poll)); commit=methods["_commit_through"]; assert any(isinstance(n,ast.Attribute) and isinstance(n.value,ast.Name) and n.value.id=="replay_from" and n.attr=="offset" for n in ast.walk(commit))'
    binds_ac:
      - AC4
      - AC5
  - id: dod-omn-21279-ac1-layering-check-refuses-fixtures
    description: >-
      AC1. The negative controls of the layering module feed the Dockerfile, workflow and test-module checkers fixture lines that name omnimarket (an ARG, a pip install, a COPY from the wheel, an editable sibling install, a heredoc-continued install, a function-scope import, an importorskip) and assert each one fires; clean and look-alike lines pass. Red first: before the change the module held no such checker and the three live-tree tests it added failed against the base (the Dockerfile named omnimarket, ci.yml installed it as a sibling, five test modules imported it). The check also runs the live-tree Dockerfile and CI install-step tests, which fail at the merge base.
    source: generated
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_no_omnimarket_dependency_omn19998.py -q -n 0 --no-cov -p no:randomly -k "dockerfile_checker or workflow_checker or fixture_checker or runtime_dockerfile_names_no_omnimarket or ci_install_steps_install_no_omnimarket"
    binds_ac:
      - "AC1"
  - id: dod-omn-21279-ac2-dockerfile-no-omnimarket
    description: >-
      AC2, static half. The layering pytest reads the real docker/Dockerfile.runtime and finds no instruction line naming omnimarket, and the Dockerfile-derived tests agree: the foundation import smoke imports compat, core and infra, the routing ladder is COPYed from the tracked workspace/routing_tiers.yaml, and no git install of an ONEX package remains. The boot half of AC2 is the runtime-boot-smoke job on the pull request head, run by CI.
    source: generated
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_no_omnimarket_dependency_omn19998.py tests/unit/docker/test_delegation_import_smoke_guard.py tests/unit/docker/test_delegation_routing_tiers_path_binding_omn15645.py tests/scripts/test_dockerfile_runtime_git_refresh.py -q -n 0 --no-cov -p no:randomly
    binds_ac:
