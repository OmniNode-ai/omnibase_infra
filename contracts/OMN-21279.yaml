dod_evidence:
  - id: dod-omn-21279-ac1-layering-check-refuses-fixtures
    description: >-
      AC1. The negative controls of the layering module feed the Dockerfile, workflow and test-module checkers fixture lines that name omnimarket (an ARG, a pip install, a COPY from the wheel, an editable sibling install, a heredoc-continued install, a function-scope import, an importorskip) and assert each one fires; clean and look-alike lines pass. Red first: before the change the module held no such checker and the three live-tree tests it added failed against the base (the Dockerfile named omnimarket, ci.yml installed it as a sibling, five test modules imported it).
    source: generated
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_no_omnimarket_dependency_omn19998.py -q -n 0 --no-cov -p no:randomly -k "dockerfile_checker or workflow_checker or fixture_checker"
    binds_ac:
      - "AC1"
  - id: dod-omn-21279-ac2-dockerfile-no-omnimarket
    description: >-
      AC2, static half. The layering pytest reads the real docker/Dockerfile.runtime and finds no instruction line naming omnimarket, and the Dockerfile-derived tests agree: the foundation import smoke imports compat, core and infra, the routing ladder is COPYed from the tracked config/delegation file, and no git install of an ONEX package remains. The boot half of AC2 is the runtime-boot-smoke job on the pull request head, run by CI.
    source: generated
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_no_omnimarket_dependency_omn19998.py tests/unit/docker/test_delegation_import_smoke_guard.py tests/unit/docker/test_delegation_routing_tiers_path_binding_omn15645.py tests/scripts/test_dockerfile_runtime_git_refresh.py -q -n 0 --no-cov -p no:randomly
    binds_ac:
      - "AC2"
  - id: dod-omn-21279-ac2-deploy-probe-dockerfile
    description: >-
      AC2, deploy-scope probe. Reads docker/Dockerfile.runtime through the GitHub API at the commit that carries this contract and exits nonzero unless no instruction line outside a comment names omnimarket and the routing ladder is COPYed from the build context. At the merge base the file installs omnimarket and copies the ladder out of the wheel, so the probe prints false there; the runtime-boot-smoke job on the pull request head is the boot half of AC2 and runs on a hosted runner.
    source: generated
    checks:
      - check_type: command
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/Dockerfile.runtime?ref=$(git rev-parse HEAD)" --jq '.content | gsub("\n";"") | @base64d | split("\n") as $l | (($l | map(select(test("^\\s*#") | not) | select(test("omnimarket"; "i"))) | length) == 0) and ($l | map(contains("COPY --chown=omniinfra:omniinfra workspace/routing_tiers.yaml /app/config/delegation/routing_tiers.yaml")) | any)' | grep -qx true
    binds_ac:
      - "AC2"
