    description: >-
      AC2, dev-lane build. The deploy agent's lane-agnostic runtime build passes only docker-compose.infra.yml; its dev-lane build now names DEV_LANE_BUILD_SERVICES, the lane-only buildable services plus the base services the overlay composes, so they are rebuilt on the composed image. Fails at 03ea9377f, where DEV_LANE_BUILD_SERVICES does not exist.
