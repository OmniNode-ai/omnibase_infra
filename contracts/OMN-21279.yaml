schema_version: 1.0.0
ticket_id: OMN-21279
title: omnibase_infra's runtime image, CI and tests never install or import omnimarket
summary: >-
  The dev deploy agent now checks the candidate image's Bifrost boot-contract path and readability before any container replacement, refusing the candidate and recording a failed job while preserving the running containers. The post-swap health gate and rollback remain intact. Extends the omnibase_infra layering check (tests/ci/test_no_omnimarket_dependency_omn19998.py, run by the Lint job of ci.yml and by the no-omnimarket-dependency pre-commit hook) from pyproject, uv.lock and import-time imports to docker/Dockerfile.runtime, CI install steps and test modules, and removes the omnimarket install from docker/Dockerfile.runtime. The delegation routing ladder the image used to copy out of the omnimarket wheel is now COPYed from the repo-tracked workspace/routing_tiers.yaml, a committed empty-ladder placeholder that stage_workspace.sh overwrites from the omnimarket sibling. The runtime boot half of AC2 is the runtime-boot-smoke job on the pull request head, which a hosted runner runs and this contract does not restate; the live CI scan covers ci.yml and composite actions, and three other workflows that still install omnimarket are named in the pull request body as left.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: The acceptance criteria this ticket's author declared, transcribed from the ticket body. The ticket body is the source and this block is the copy.
    acceptance:
      - id: AC1
        statement: 'AC1: the layering check refuses omnimarket named in Dockerfile.runtime, any CI install step or any test fixture of omnibase_infra -- falsifier: pytest of the layering check over fixture Dockerfile and workflow lines'
      - id: AC2
        statement: 'AC2: Dockerfile.runtime installs no omnimarket and the runtime still boots -- falsifier: the runtime-boot-smoke job on the PR head, plus the layering pytest over the real file'
  - id: req-restore-point-protection
    statement: Restore-point protection for non-prod runtime rebuilds, declared by this pull request (OmniNode-ai/omnibase_infra#5360) under the same ticket; not transcribed from the ticket body.
    acceptance:
      - id: AC3
        statement: 'AC3: rollback capture resolves each runtime service to its container by compose project and service labels, refuses a missing, ambiguous or failed lookup, and a non-prod, non-dev runtime or full rebuild refuses to start without a retained point -- falsifier: test_auto_rollback.py capture and refusal cases'
  - id: req-deploy-agent-recovery-follow-up
    statement: >-
      Operational follow-up from lane proc-rollback-preempt-0055, separate from the ticket author's unchanged AC1 and AC2: the dev recovery command must not wait behind a boot that has already exhausted its retries.
    acceptance:
      - id: AC5
        statement: >-
          An exhausted dev boot ends verification without waiting out the remaining start or recreate budget; a runtime/full job restores its captured healthy images under the lane lock, remains failed, and releases the lock. Probe timeouts also attempt that restore.
      - id: AC4
        statement: >-
          A signed, declared rollback to a dev tag is selected ahead of queued forward jobs for the same lane and instance in the fetched partition; earlier forwards remain uncommitted for replay and the durable rollback job is deduplicated. Single-flight and acceptance checks stand.
  - id: req-boot-probe-no-rebuild
    statement: Boot probe follow-up from lane boot-probe-timeout-0710, separate from the ticket author's unchanged AC1 and AC2; not transcribed from the ticket body.
    acceptance:
      - id: AC8
        statement: >-
          Both dev candidate probes (the runtime boot probe and the image preflight) run the already-built candidate image through a temporary compose override that resets build and pins image <project>-<service>, so docker compose run never rebuilds the composed runtime image; the override is removed after each probe and the probe flags, scripts and timeouts are unchanged.
  - id: req-rebuild-trigger-lan-label
    statement: >-
      Declared by this pull request under the same ticket; not transcribed from the ticket body. The runtime-rebuild publishers' fallback runner set requires arch-amd64 so the job cannot land on h203-light runners that carry no uv.
    acceptance:
      - id: AC6
        statement: 'AC6: the trigger-rebuild jobs of runtime-rebuild-trigger.yml and runtime-rebuild-trigger-reusable.yml and the trigger-delivery job of onex-api-lab-delivery-reusable.yml fall back to [self-hosted, omnibase-ci, arch-amd64], a label set the h203-light runners do not satisfy -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_runtime_rebuild_runner_lan_label_omn21279.py -q -n 0'
  - id: req-dev-broker-memory-reservation
    statement: Memory protection for the dev Redpanda broker on the shared lab host, declared by this pull request under the same ticket; not transcribed from the ticket body.
    acceptance:
      - id: AC7
        statement: 'AC7: the dev lane renders a memory reservation of at least 4 GiB on its Redpanda broker, and the base docker-compose.infra.yml that every other lane merges carries none -- falsifier: test_dev_lane_memory_reservation_omn21279.py over the rendered dev and base compose'
  - id: req-dev-broker-hop-proof
    statement: Reproduction of the dev broker crash and measured logical versions of the declared upgrade hops from lane fill-defect-dev-broker-crash-cause-20261026T1538Z, declared by this pull request under the same ticket; not transcribed from the ticket body.
    acceptance:
      - id: AC11
        statement: 'AC11: docker/redpanda/dev_broker_upgrade_path.yaml records the measured logical version each image finalizes at and the oldest it starts on, and a declared chain from the catalog pin is refused when a hop needs a newer logical version than the previous image leaves -- falsifier: test_dev_broker_hop_logical_versions_omn21279.py, whose fixtures refuse v25.3.18 and v25.2.14 directly over v24.3.18'
  - id: req-dev-broker-upgrade-path
    statement: Dev broker crash cause and upgrade path from lane fill-defect-dev-broker-crash-cause-20261026T1235Z, declared by this pull request under the same ticket; not transcribed from the ticket body.
    acceptance:
      - id: AC9
        statement: 'AC9: docker/redpanda/dev_broker_upgrade_path.yaml declares the feature release the dev broker volume has run and a hop path to a Redpanda release carrying the ListGroups crash fix, and the dev pin is refused when it is more than one feature release past that volume -- falsifier: test_dev_broker_upgrade_path_omn21279.py, whose fixtures refuse v25.3.18 and v25.2.14 over a 24.3 volume'
  - id: req-dev-broker-memory-cap
    statement: >-
      Lane broker-cap-1600 implements OPERATOR-CONSENT 2026-10-25T17:53:44Z (called RULING in the brief): only h201 dev broker port 19092 may be recreated with a 2-4 GB cap. This is separate from the ticket author's unchanged layering criteria AC1 and AC2; rollout belongs to the deploy agent after merge, never a hand-edited live compose project.
    acceptance:
      - id: AC10
        statement: >-
          The dev overlay renders Redpanda --memory 3G and mem_limit 4g even with stale DEV_REDPANDA_MEMORY=12G; deploy preflight refuses a flag or limit outside 2-4 GiB or an arena larger than its limit.
  - id: req-pr-time-criterion-label-check
    statement: >-
      Declared by this pull request under the same ticket; not transcribed from the ticket body. Green omnibase_infra#5370 was removed from the merge queue three times because its AC7 repeated a label dev already held, which only the full suite checked.
    acceptance:
      - id: AC12
        statement: >-
          AC12: every pull request CI run executes the ticket-contract criterion-label check by name in one test split, whatever the change-aware selector picks -- falsifier: tests/ci/test_contract_criterion_labels_wired_omn21279.py over .github/workflows/ci.yml
  - id: req-dev-broker-arena-exhaustion
    statement: The dev broker's allocation-failure aborts after the 3G arena landed, from lane fill-defect-dev-broker-crash-cause-20261026T2139Z, declared by this pull request under the same ticket; not transcribed from the ticket body.
    acceptance:
      - id: AC13
        statement: 'AC13: docs/incidents/OMN-21279/dev-broker-crash-cause.json records the allocation-failure aborts since the 3G arena, with the load on the arena and the decision it leaves to the operator, and the record is internally consistent -- falsifier: test_dev_broker_arena_exhaustion_record_omn21279.py, which fails on an unordered abort list, a count that differs from the list, or a cited 12G floor that is no longer declared'
evidence_requirements:
  - kind: tests
    description: Exhausted-boot recovery, lane-lock release and signed tag rollback priority regressions.
    command: uv run --project scripts/deploy-agent --extra dev --frozen pytest scripts/deploy-agent/tests/unit/test_rollback_preempt_omn21279.py -q
  - kind: tests
    description: The layering pytest over fixture Dockerfile, workflow and test-module text refuses omnimarket, and over the real Dockerfile.runtime finds none.
    command: uv run --frozen pytest tests/ci/test_no_omnimarket_dependency_omn19998.py -q -n 0 --no-cov -p no:randomly
  - kind: tests
    description: The runtime-rebuild publishers' fallback requires arch-amd64, which the h203-light runners lack.
    command: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_runtime_rebuild_runner_lan_label_omn21279.py -q -n 0
