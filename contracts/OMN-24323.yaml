schema_version: "1.0.0"
ticket_id: "OMN-24323"
title: "Grant the tenant projection writer the experiment results table in the platform topology"
summary: "omnibase_infra vendors omnimarket's node_projection_experiment_result migrations and grants tenant_projection_writer SELECT, INSERT and UPDATE on public.experiment_arm_results in every shipped topology profile, ahead of the omnimarket pull request that adds the node. The grants are regenerated by scripts/generate_application_database_table_grants.py, with a supplemental declaration that expires when the omnimarket contract reaches the pin, and the catalogs by its own render step. Without them the runtime refuses to prepare the node's writer and the omnimarket Event Chain Gate fails at collection with a missing SELECT on public.experiment_arm_results."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-experiment-results-writer-grants"
    statement: "Every shipped topology profile grants the tenant projection writer the experiment results table, the grant derivation reports no drift with or without the node's contract in the omnimarket tree, and the node's three migrations are vendored and declared, the row-security step fenced."
    acceptance:
      - id: "AC1"
        statement: "AC1: the topology instances for every shipped profile grant the tenant projection writer SELECT, INSERT and UPDATE on the experiment_arm_results table, derived by the grant generator from the omnimarket contract -- falsifier: scripts/generate_application_database_table_grants.py --check exits non-zero in omnibase_infra with the table removed from the instances"
      - id: "AC2"
        statement: "AC2: the table's creation, grant and row-security scripts are carried in the infrastructure migration tree and ledger, and the migration manifest validator prints PASS -- falsifier: scripts/validation/validate_application_migration_manifest.py fails with one script removed from the ledger"
      - id: "AC3"
        statement: "AC3: with the grants in place the projection binding check for the experiment result projection passes for every supported profile -- falsifier: scripts/generate_application_database_table_grants.py --prove reports a FAIL for a profile whose grant is removed"
      - id: "AC4"
        statement: "AC4: integrated: the omnimarket pull request for the experiment result events passes Event Chain Gate after taking the infrastructure release that carries these grants, read from its checks on the pull request -- falsifier: Event Chain Gate on that pull request fails collection with 'lacks declared read privileges: SELECT on table public.experiment_arm_results'"
evidence_requirements:
  - kind: "tests"
    description: "The grant tests pass at the head; on the merge base no profile grants the table."
    command: "uv run pytest tests/integration/topology/test_experiment_results_grants_omn24323.py tests/unit/topology/test_application_database_table_grants.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn24323-ac1-topology-grants"
    description: "AC1 hosted probe. Every profile grants the tenant projection writer the experiment results table."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/integration/topology/test_experiment_results_grants_omn24323.py tests/unit/topology/test_application_database_table_grants.py -q"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn24323-ac2-vendored-migrations"
    description: "AC2 hosted probe. The three vendored migrations are present; the new test file is absent at the merge base, so the command fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/integration/topology/test_experiment_results_grants_omn24323.py -k vendored -q"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn24323-ac3-control"
    description: "AC3 hosted probe. The control case reports an ungranted table as an empty grant set."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/integration/topology/test_experiment_results_grants_omn24323.py -k control -q"
        cwd: "."
    binds_ac: ["AC3"]
  - id: "dod-omn24323-hosted-proxy-ac4"
    description: "Hosted proxy for AC4. The shipped topology grants the tenant projection writer the table in every profile the omnimarket gate and the dev lane read; the reading on the omnimarket pull request is not reachable from a hosted runner and is the step left."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/integration/topology/test_experiment_results_grants_omn24323.py -q"
        cwd: "."
    binds_ac: ["AC4"]
  - id: "dod-omn24323-integration-proof-lab"
    description: "Runs this change's tests at the pushed head on a lab host through the lab work runner; hosted CI cannot reach the lab runner, so only the local Done gate runs this check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24323 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/topology/test_experiment_results_grants_omn24323.py tests/unit/topology/test_application_database_table_grants.py -q --no-cov -n 0 -p no:randomly'
        cwd: "."
