schema_version: "1.0.0"
ticket_id: OMN-24819
title: "Review findings 1 to 8 on omnibase_infra PR 5855 are fixed or argued: the SASL stability compose tests can fail, with the lab readback on the new head"
summary: >-
  Fixes for the eight blocking review findings on omnibase_infra#5855 (OMN-23363, SASL on the stability lane's Redpanda). The clients are derived from the merged compose files, the host auth env file is fail-closed and no base or overlay environment can override it, every client waits for the sasl-enable one-shot, the refresh runs both one-shots in order and fails on a nonzero deploy exit (its rollback set excludes the two image-only one-shots), the sasl-enable one-shot probes every Kafka listener unauthenticated, the guard tests run the one-shot scripts against a stub rpk instead of grepping them, and the OMN-23363 contract no longer counts a unit test as its lab AC.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24819-review-findings
    statement: >-
      The blocking review findings on omnibase_infra#5855 are fixed in the diff or answered with evidence, and the tests that guard them fail on a fixture that breaks the behaviour they name.
    acceptance:
      - id: AC1
        statement: >-
          AC1: each of the eight blocking review findings on omnibase_infra#5855 (hard-coded client list, environment versus env_file precedence, client ordering behind the principal flip, the refresh script consuming both one-shots, the fail-open required:false env_file, the guard test that survives a deleted exit, the refusal probe on the LAN listener, and AC2 bound to a string test) is either fixed in the PR diff or answered by a PR comment that cites the evidence -- falsifier: `onex scm pr-view OmniNode-ai/omnibase_infra#5855` shows a blocking finding with neither a change in the diff nor an evidence comment
      - id: AC2
        statement: >-
          AC2: each new or changed test in tests/unit/docker/test_stability_sasl_omn23363.py is red on a fixture that breaks the behaviour it names and green on the PR head, including a client derived from the merged compose config, a refused guard without its exit, and the flip ordering -- falsifier: `uv run pytest tests/unit/docker/test_stability_sasl_omn23363.py` on the lab passes against the unfixed fixture
      - id: AC3
        statement: >-
          AC3: the refresh script runs both one-shots in order and fails the refresh on a nonzero exit, with a test that fails when either step is dropped -- falsifier: `uv run pytest tests/unit/docker -k refresh_stability` passes with the exit-code handling removed
      - id: AC4
        statement: >-
          AC4: the new head is on the PR as a comment starting `Lab: head=<new head>` that names the test ids collected, the h051 enable_sasl readback and the lab result, and the required suites ran on the lab with any timed-out suite run in parts -- falsifier: `onex scm pr-view OmniNode-ai/omnibase_infra#5855` shows no comment starting `Lab: head=` with the new head
      - id: AC5
        statement: >-
          AC5: the fix weakens no check or test, so the diff from head 418b2cf0cd5a to the new head removes no assertion, adds no skip, xfail or loosened threshold and edits no workflow gate -- falsifier: `git diff 418b2cf0cd5a <new head> -- tests/ .github/ scripts/ci/` shows a removed assert, a new skip or xfail marker or a widened check
evidence_requirements:
  - kind: tests
    description: The SASL stability compose tests and the refresh script tests.
    command: uv run --frozen pytest tests/unit/docker/test_stability_sasl_omn23363.py tests/unit/docker/test_refresh_stability_sasl_omn23363.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24819-ac1-findings-fixed
    description: >-
      The compose, refresh script and tests carry the fixes for the findings that are fixed (clients derived from the merged compose files, no literal auth key in either file, fail-closed env_file, every client behind lane-redpanda-sasl-enable, every Kafka listener probed unauthenticated, behavioural guard tests); the findings that are answered rather than changed are answered in a PR comment.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/docker/test_stability_sasl_omn23363.py tests/unit/docker/test_refresh_stability_sasl_omn23363.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24819-ac2-sasl-tests-red-on-fixtures
    description: >-
      Each SASL test carries its own broken fixture (a client without the auth file, a literal auth key, an optional env_file, a client that does not wait for the flip) or runs the one-shot script against a stub rpk with the guard exit, the refusal exit, the readback or the ordering removed; each is red there and green on the head.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/docker/test_stability_sasl_omn23363.py -q -n 0 --no-cov -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24819-ac3-refresh-scope
    description: >-
      The refresh script's build scope holds both one-shots with the principal first, the rollback set excludes them, and the deploy exit is captured, guarded and re-raised; each test fails when its step is dropped.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/docker -k refresh_stability -q -n 0 --no-cov -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24819-ac4-lab-comment
    description: >-
      The Lab comment on the pull request names the head, the test ids collected, the lab host's enable_sasl readback and the lab result. It is read from the pull request at the local done gate, not on the hosted runner.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: "onex scm pr-view OmniNode-ai/omnibase_infra#5855 | grep -qF \"Lab: head=$(git rev-parse HEAD)\""
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24819-ac5-no-weakened-check
    description: >-
      The diff from head 418b2cf0cd5a to the new head adds no skip or xfail marker to tests, edits no workflow and edits nothing under scripts/ci, and removes no assert line from the rollback-set test or the refresh-script test (OMN-24908). Read at the local done gate, where that head is in the clone.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: "! git diff 418b2cf0cd5a22d171021f78c56895e054aaa207 HEAD -- tests/ .github/ scripts/ci/ | grep -E '^\\+.*(pytest\\.mark\\.(skip|xfail)|pytest\\.skip|pytest\\.xfail)'"
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: command
        check_value: "! git diff 418b2cf0cd5a22d171021f78c56895e054aaa207 HEAD -- tests/scripts/test_stability_lane_rollback_omn18061.py tests/unit/docker/test_refresh_stability_sasl_omn23363.py | grep -E '^-[[:space:]]*assert '"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24819-ac3-deploy-probe
    description: >-
      Deploy probe. The proof lane's refresh script that GitHub serves at the checked-out commit declares both SASL one-shots in the order the principal then the flip. The probe reads the file from GitHub at that commit and exits nonzero on a tree without them.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/scripts/runtime_build/refresh_stability_lane.sh?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'lane-redpanda-scram-user lane-redpanda-sasl-enable' | grep -qx 1"
        cwd: ${OMNI_HOME}/omnibase_infra
