ticket_id: OMN-22617
title: "The validator-clean DoD check of OMN-21700 names the adjudicator handler file that exists"
summary: >-
  The validator-clean evidence item of contracts/OMN-21700.yaml passed a flat handler file that does not exist to core's handler-shape validator, which skips a path it cannot read and exits 0, so the check reported clean for a file it never read. The command now names the adjudicator's real handler file, and a test requires every src path the command names to exist.
