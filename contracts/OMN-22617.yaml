        statement: 'AC1: every src path the AC9 command of contracts/OMN-21700.yaml names exists in the tree -- falsifier: uv run pytest tests/unit/contracts/test_omn21700_ac9_paths_exist.py -q --no-cov'
      - id: AC2
        statement: 'AC2: the same test fails on the contract as it is on dev, naming the missing handler file -- falsifier: git checkout origin/dev -- contracts/OMN-21700.yaml then uv run pytest tests/unit/contracts/test_omn21700_ac9_paths_exist.py -q --no-cov'
