schema_version: 1.0.0
ticket_id: OMN-20464
title: The abandoned-dispatch readout names the consumer group that holds the dispatch
summary: >-
  On the dev runtime on 2026-11-16 one runtime-tick dispatch was abandoned at its deadline and the readings could not say which subscriber held it, because the orphan line carried only a per-process random subscription id and the abandon log line had rotated out. The orphan line now also carries the consumer group, which holds the node identity.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20464-orphan-names-group
    statement: Each abandoned dispatch the bus reports names the consumer group of the subscription that holds it, beside the topic, partition, offset and subscription id.
    acceptance:
      - id: AC1
        statement: "AC1: a subscriber callback that does not return past the dispatch deadline appears in dispatch_deadline_status().orphans with its consumer group -- falsifier: uv run pytest tests/unit/event_bus/test_omn20464_orphan_degraded_grace.py -q -k names_the_consumer fails on the fix branch, or passes on origin/dev without the fix"
      - id: AC2
        statement: "AC2: the grace and orphan-limit behaviour is unchanged, so an old orphan still stops degrading the bus after the grace and the limit still flips it unhealthy -- falsifier: uv run pytest tests/unit/event_bus/test_omn20464_orphan_degraded_grace.py tests/unit/event_bus/test_omn19355_dispatch_deadline.py -q fails on the fix branch"
evidence_requirements:
  - kind: tests
    description: The orphan readout tests.
    command: uv run --frozen pytest tests/unit/event_bus/test_omn20464_orphan_degraded_grace.py tests/unit/event_bus/test_omn19355_dispatch_deadline.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn20464-ac1-orphan-names-group
    description: >-
      The real consume loop over a partition log whose handler never returns reports one orphan whose line carries group=<consumer group> and the subscription id.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/event_bus/test_omn20464_orphan_degraded_grace.py -q -p no:cacheprovider -k names_the_consumer
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn20464-ac2-grace-unchanged
    description: >-
      The grace, the orphan limit and the to_thread accounting tests still pass.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/event_bus/test_omn20464_orphan_degraded_grace.py tests/unit/event_bus/test_omn19355_dispatch_deadline.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn20464-ac1-installed-and-read
    description: >-
      Deploy check the hosted runner can run: the orphan model names the consumer group. The runtime read (the dev runtime after a deploy-agent roll from the dev-merge tag, with its dispatch_deadline orphan line carrying group=) is taken by the deploy agent's roll and read from /health, not by this check.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: "docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c \"from omnibase_infra.models.event_bus.model_orphaned_dispatch import ModelOrphanedDispatch as M; import uuid; print('orphan group ok', 'group=g' in M(topic='t', consumer_group='g', subscription_key='s', correlation_id=uuid.uuid4(), record_coordinate=(0, 1), started_at=0.0, abandoned_at=0.0).describe(1.0))\""
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn20464-ac1-model-names-group
    description: >-
      The orphan model's describe method carries the consumer group (runs on the hosted runner).
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: grep -q 'group={self.consumer_group}' src/omnibase_infra/models/event_bus/model_orphaned_dispatch.py
        cwd: ${OMNI_HOME}/omnibase_infra
