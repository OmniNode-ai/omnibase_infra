# OMN-22359 contract file for omnibase_infra: the omnibase-spi pin moves from 0.23.7 to 0.23.11 through the normal pin route.
schema_version: "1.0.0"
ticket_id: "OMN-22359"
title: "omnibase_infra pins omnibase-spi==0.23.7 exactly while 0.23.11 is the newest release: bump the pin through the normal route"
summary: "omnibase_infra pyproject.toml pinned omnibase-spi==0.23.7 in the project dependencies and again in the uv override-dependencies, while 0.23.11 is the newest published release. The pin moves to 0.23.11 in both places, uv.lock is regenerated with an upgrade of omnibase-spi alone, and the version-matrix fallback is regenerated by scripts/update_version_matrix.py. No release is cut."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22359-spi-pin-0-23-11
    statement: "omnibase_infra carries omnibase-spi==0.23.11 in both pin places, uv.lock resolves it, the version-matrix fallback agrees, and the unit suite passes on the lab at the PR head."
    acceptance:
      - id: AC1
        statement: "AC1: omnibase_infra pyproject.toml carries the newest omnibase-spi release in both places (dependency and override) and uv.lock resolves it, with the version matrix and every pin test passing -- falsifier: cd omnibase_infra && uv lock --check && uv run python scripts/update_version_matrix.py --check && uv run pytest tests/ci -k pin -q"
      - id: AC2
        statement: "AC2: the unit-test suite of omnibase_infra passes on the lab at the PR head with the new spi, and nothing outside the pin files, the lock and the matrix changes -- falsifier: onex lab-run of uv run pytest tests/unit -m unit -q at the pushed head, exit 0"
evidence_requirements:
  - kind: tests
    description: "The lock, the version-matrix fallback and the pin tests agree on omnibase-spi 0.23.11."
    command: "uv lock --check && uv run python scripts/update_version_matrix.py --check && uv run pytest tests/unit/runtime/test_version_compatibility.py -q -p no:cacheprovider"
  - kind: manual
    description: "Deploy check: the landing branch's version-matrix fallback requires omnibase-spi 0.23.11."
    command: "deploy: gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/version_compatibility.py?ref=dev' --jq .content | base64 -d | grep -q 'min_version=\"0.23.11\"'"
dod_evidence:
  - id: dod-001
    description: "pyproject.toml carries omnibase-spi==0.23.11 in both places, uv.lock resolves it, the version-matrix fallback is current, and the CI pin tests pass."
    source: generated
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: 'uv lock --check && uv run python scripts/update_version_matrix.py --check && uv run pytest tests/ci -k pin -q -p no:cacheprovider'
      - check_type: command
        check_value: 'uv run python -c "import importlib.metadata as m; v = m.version(\"omnibase-spi\"); assert v == \"0.23.11\", v"'
  - id: dod-002
    description: "The unit suite passes at the PR head with the new omnibase-spi (run on the lab through onex lab-run; the PR body Lab line carries host, sha and exit code)."
    source: generated
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: 'uv run pytest tests/unit -m unit -q -p no:cacheprovider'
  - id: dod-003
    description: "Deploy-scope readback, bound to no criterion: the landing branch's runtime version-matrix fallback requires omnibase-spi 0.23.11; read through the GitHub contents API on dev, it exits non-zero until this change has merged. A hosted runner can run it."
    source: manual
    checks:
      - check_type: command
        check_value: >-
          gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/version_compatibility.py?ref=dev' --jq .content | base64 -d | grep -q 'min_version="0.23.11"'
