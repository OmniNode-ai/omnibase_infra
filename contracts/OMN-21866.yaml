schema_version: "1.0.0"
ticket_id: OMN-21866
title: "C16's deploy wait does not count a k3s lab-overlay settle as a compose deploy"
summary: C16 runs 41370897700 and 41383900853 ended RED at the 2400 s deploy wait because the dev-201 deploy agent read busy for the whole budget; between compose jobs its only not-deploying window is a settling / lab_overlay read with no active job, which the wait counted as a deploy.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21866-overlay-settle
    statement: When the C16 lane answers, the resolver's wait-while-busy path proceeds on a k3s lab_overlay settle with no compose job, and still waits out every compose deploy, every other settle stage and a queued command on an idle agent; a silent lane still waits out any settle.
    acceptance:
      - id: AC1
        statement: 'AC1: The cause of the missing terminal is named from a live readback of the dev lane bus and runtime logs for the failing correlation ids, and a regression test built from the recorded run data fails on the broken code and passes on the fix -- falsifier: uv run pytest on the named regression test in the owning repository, failing on origin/dev before the fix'
evidence_requirements:
  - kind: tests
    description: The resolver driven against the dev-201 agent bodies read live on 2026-11-02 (settling / lab_overlay, then the next compose job), with a fake clock and no network.
    command: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_resolve_lab_lane_overlay_settle_omn21866.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21866-ac1-overlay-settle
    description: AC1 regression drives the resolver with the recorded lab_overlay settle; at the merge base it waits the full 2400 s budget and exits 1 with state=settling, as C16 run 41370897700 did.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_resolve_lab_lane_overlay_settle_omn21866.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/integration/nodes/test_lab_lane_overlay_settle_omn21866.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-deploy
    description: Deploy-scope revision content readback is retained alongside an HTTP integration check through the shipped contract and handler, proving overlay settle proceeds while a compose deploy remains busy.
    source: manual
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/handlers/handler_lab_lane_compose_busy.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F 'class HandlerLabLaneComposeBusy' > /dev/null
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/integration/nodes/test_lab_lane_overlay_settle_omn21866.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn21866-ac1-one-flag-parse
    description: The resolve-lab-lane step is plain POSIX sh that always starts python3; resolve_lab_lane.py parses LANE_DEPLOY_WAIT_WHILE_BUSY once and re-execs itself under uv run only for wait-while-busy, so interpreter choice and wait mode share one parse. The step test runs the shipped run line under /bin/sh and bash and fails on the prior ${var,,} line.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_resolve_lab_lane_overlay_settle_omn21866.py -q -k "posix or one_flag_parse or reexec or follows_the_contract"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
