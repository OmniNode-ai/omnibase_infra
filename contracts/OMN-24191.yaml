schema_version: "1.0.0"
ticket_id: "OMN-24191"
title: "Declare the stability lane's proof list entry and hold the three proofs' required fields equal to it"
summary: "C15, C16 and C28 read the repository variable LAB_PROOF_LANES_JSON, which nothing declared (omnibase_infra#5643 moved them to it on 2026-11-06). The deployment overlay now declares the value (typed by omnimarket's ModelLabProofLanesOverlay). This change adds the seam test that holds that value against the lane resolver and the three workflows: the golden value parses under resolve_lab_lane, each workflow's resolver step requires the spelled fields, the declared lane satisfies exactly the proofs it can today (C28; C15 and C16 need a gateway_url the stability lane does not have until the runtime serves the tenant route), and controls refuse a loopback address, a host alias and an undeclared required field. It also pins the answer to the hourly publish question: the C28 probe's only lane write is one marked, deliberately malformed trigger on the applied topic (inject in node_board_probe_effect), read first from the lane's own broker, and nothing is published when the newest message is not an envelope. Not in this change: the overlay itself, the model (omnimarket), setting the variable (waits for the write node verb), a stability gateway (one-runtime plan T18) and the scheduled run reading the variable (AC3)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24191-stability-proof-lane-declaration
    statement: "The declared stability lane value is held against the lane resolver and the three proof workflows, and the C28 probe's single lane write is pinned."
    acceptance:
      - id: AC1
        statement: "AC1: the stability lane's list entry is declared once in the overlays repository and parses under the lane resolver's own rules, carrying every field the consumer flow check requires -- falsifier: uv run pytest tests -k lab_proof_lanes in overlays fails when a required field is dropped or an address is a loopback or host alias"
      - id: AC2
        statement: "AC2: the fields each of the three proof workflows requires and matches on equal the list the overlay test holds -- falsifier: uv run pytest tests/ci -k stability_proof_lane_declaration in omnibase_infra fails when a workflow adds a required field the declaration lacks"
      - id: AC3
        statement: "AC3: integrated: once the repository variable is set from the declaration, a scheduled consumer flow run resolves the stability lane in the running lab and grades its checks -- falsifier: a run log of the consumer flow check that ends at \"no lab lane declared\" or names a dev lane"
evidence_requirements:
  - kind: tests
    description: "The seam test and the inject publish-shape test pass at the pushed head."
    command: "uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py tests/unit/nodes/node_board_probe_effect/test_consumer_flow_inject_publish_shape_omn24191.py -q -p no:cacheprovider"
dod_evidence:
  - id: dod-omn24191-ac1-resolver-parse
    description: "AC1 (resolver half): the golden value of the declared entry parses under resolve_lab_lane and a loopback or host-alias address is refused; fails when the golden string is changed to a loopback address."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py -q -p no:cacheprovider -k 'golden_value_parses or loopback_or_host_alias'"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24191-ac2-workflow-fields
    description: "AC2: each proof workflow's resolver step requires exactly the spelled fields and matches lane_role=stability, and the declared lane satisfies exactly the proofs satisfied today. Fails when a workflow's require line gains a field."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py -q -p no:cacheprovider"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24191-ac3-hosted-proxy
    description: "hosted proxy for AC3: the seam and publish-shape tests pass; the scheduled consumer flow run after the variable is set from the declaration is read in the running lab and named in the pull request."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_board_probe_effect/test_consumer_flow_inject_publish_shape_omn24191.py -q -p no:cacheprovider"
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn24191-integration-proof
    description: "the seam and publish-shape tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check"
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-24191 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py -q --no-cov"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
