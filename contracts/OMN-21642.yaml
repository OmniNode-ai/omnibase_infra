    acceptance:
      - id: AC1
        statement: "AC1: the recorded OMN-21629 contract with its dod_evidence section removed is refused by the hook with the pr-create text, and it is passed at origin/dev 4284f5bf5 -- falsifier: uv run pytest tests/ci/test_ticket_contract_prerequisite_parity_omn21642.py -k no_dod_evidence fails at origin/dev 4284f5bf5"
      - id: AC2
