      - id: AC3
        statement: "AC3: pr-create's own module binding of contract_prerequisite is the function the hook runs, and the two give one verdict on every fixture -- falsifier: uv run pytest tests/ci/test_ticket_contract_prerequisite_parity_omn21642.py -k parity"
