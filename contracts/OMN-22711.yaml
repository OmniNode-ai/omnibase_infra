schema_version: "1.0.0"
ticket_id: OMN-22711
title: "The runner hook mount drift check is tracked in omnibase_infra and reads the hook path each runner executes, so only a runner on a changed hook alerts"
summary: "The host-only hook mount drift script hashed the image-baked /usr/local/bin hook copy in every runner container, a copy the runners never execute, and so alerted on eleven current containers. The tracked handler runner.hook-mount.check reads the hook path each container is configured to execute (job-started from ACTIONS_RUNNER_HOOK_JOB_STARTED, entrypoint and healthcheck from the container's own command and health check), hashes that file in the container and compares it with the host copy. A container declaring no path is reported not_checked, and a missing host file, no matching container or a docker failure is an error, never ok. It alerts only on a change of the finding count. No threshold or alert is muted."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22711-hook-mount-drift-check
    statement: The drift check must compare the file each runner executes with the host copy, report only real drift, and fail loud when it cannot read.
    acceptance:
      - id: AC1
        statement: 'AC1: on the recorded runner host state the check reports only the three real omninode-runner-18 findings while the retired rule gives the eleven false findings -- falsifier: uv run pytest tests/unit/handlers/test_handler_runner_hook_mount_drift_omn22478.py -q'
      - id: AC2
        statement: 'AC2: a changed host hook copy flags every container on the old copy, and a missing host file, no matching container and an unreadable docker are errors with a non-zero exit -- falsifier: uv run pytest tests/unit/handlers/test_handler_runner_hook_mount_drift_omn22478.py -q -k "injected_break or error"'
      - id: AC3
        statement: 'AC3: the check is routed as operation runner.hook-mount.check of node_deploy_runners and the declared host installer writes its 15 minute cron and drops the retired entry in one crontab write -- falsifier: uv run pytest tests/ci/test_deploy_runners_registration_preflight.py tests/ci/test_cron_entries_have_completion_evidence_omn20805.py -q'
evidence_requirements:
  - kind: tests
    description: The drift handler tests pass at the head, and the retired-rule control reproduces the false findings.
    command: uv run pytest tests/unit/handlers/test_handler_runner_hook_mount_drift_omn22478.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22711-drift-tests
    description: The drift handler tests pass at the head.
    source: manual
    binds_ac: [AC1, AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_runner_hook_mount_drift_omn22478.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn22711-live-read-clean
    description: After the declared host installer runs, the runner host crontab holds the drift check entry and no longer holds the retired hook-mount-drift entry. The probe prints no secret.
    source: manual
    execution_scope: local_done_gate
    binds_ac: []
    checks:
      - check_type: command
        check_value: ssh "$DEPLOY_PROBE_HOST" crontab -l | grep -q 'runner-host-hook-mount-drift'
        cwd: ${OMNI_HOME}/omnibase_infra
