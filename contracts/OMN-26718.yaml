schema_version: 1.0.0
ticket_id: OMN-26718
title: "The dev deploy agent's hourly window never drops an operator-path build as superseded"
summary: >-
  The dev lane's queue-supersede rule folded every older queued request into the newest, so an operator-path rebuild request queued ahead of an automatic overdue request was recorded superseded and never ran. node_queued_request_priority_compute now decides which queued requests fold and runs an operator-path request ahead of the automatic ones queued before it; each automatic request it replaces is recorded with the operator job id and the reason. The bus outcome of the operator request (AC3) is a lab step recorded on the ticket, not bound here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26718-operator-request-outranks-automatic
    statement: An operator-path request waiting with an automatic request for the same window is the admitted job, and a superseded request is recorded with the superseding job and the reason.
    acceptance:
      - id: AC1
        statement: "AC1: when an operator-path request and an automatic request wait for the same window, the operator-path request runs -- falsifier: a unit test queues both and asserts the operator request is the admitted job"
      - id: AC2
        statement: "AC2: a superseded request is recorded with the job that superseded it and the reason -- falsifier: the job record of a superseded request names the superseding job id"
evidence_requirements:
  - kind: tests
    description: The operator-path priority in the deploy agent coalescer and the job record of a superseded request.
    command: uv run --frozen pytest tests/unit/handlers/test_queued_request_priority_omn26718.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26718-ac1-operator-request-admitted
    description: Queued behind an automatic overdue request, the operator-path request is the runner; the node's own decision says so.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_operator_request_beats_overdue_omn26718.py -k "admitted_job or runs_alone or left_for_a_later_poll" -q -p no:cacheprovider
        cwd: .
  - id: dod-omn26718-ac2-superseded-record-names-job
    description: The job record of the superseded automatic request names the operator job id and an operator-path reason.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_operator_request_beats_overdue_omn26718.py -k names_the_operator_job -q -p no:cacheprovider
        cwd: .
