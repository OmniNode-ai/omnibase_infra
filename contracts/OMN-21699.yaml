schema_version: "1.0.0"
ticket_id: OMN-21699
title: >-
  Mock handlers hold state in an injected store (omnibase_infra#5499 contract split)
summary: >-
  omnibase_infra#5499 moved the registration-storage and service-discovery mock handlers onto an injected StoreKeyedMemory (handlers/store_keyed_memory.py) and deleted the unused HandlerResourceManager with its package, tests, validation exemptions and canonical-file-shape baseline entries. Its acceptance items were added to the shared contracts/OMN-21536.yaml. This child ticket holds those acceptance items in its own contract, adds a regression that the resource manager stays removed, and leaves contracts/OMN-21536.yaml as the base branch has it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21699-mock-handler-state-stores
    statement: >-
      The registration-storage and service-discovery mock handlers keep no mutable state on themselves, the unused resource manager is gone, and core's handler-shape validator reports nothing for the two mock handler directories.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the mock handlers of omnibase_infra#5499 hold state in an injected store and the unused resource manager is removed, as the PR states -- falsifier: uv run pytest tests/unit -q over the touched handlers plus the handler-shape checker re-run on the PR paths
  - id: req-omn21699-contract-location
    statement: >-
      The acceptance items of omnibase_infra#5499 live in contracts/OMN-21699.yaml and this change leaves contracts/OMN-21536.yaml as the base branch has it.
    acceptance:
      - id: AC2
        statement: >-
          AC2: the PR's acceptance items live in contracts/OMN-21699.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21699.yaml and not contracts/OMN-21536.yaml
evidence_requirements:
  - kind: tests
    description: The mock handlers write through an injected store and the resource manager stays removed.
    command: >-
      uv run pytest tests/unit/handlers/test_mock_handler_injected_stores.py tests/unit/handlers/test_mock_handler_shape_omn21536.py tests/unit/handlers/test_resource_manager_removed_omn21699.py -q -n 0 -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21699-ac1-injected-store
    description: >-
      Both mock handlers read and write through an injected StoreKeyedMemory, and handlers built without one keep separate default stores.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/handlers/test_mock_handler_injected_stores.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21699-ac1-validator-clean
    description: >-
      Core's handler-shape validator reports nothing for the two mock handler directories, and exits 1 when a temporary copy of either handler restores a self-assigning public method.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape src/omnibase_infra/handlers/registration_storage src/omnibase_infra/handlers/service_discovery
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/handlers/test_mock_handler_shape_omn21536.py -q -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21699-ac1-resource-manager-removed
    description: >-
      The omnibase_infra.resources package is not importable and no source or test file names HandlerResourceManager.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/handlers/test_resource_manager_removed_omn21699.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21699-ac2-contract-location
    description: >-
      The PR diff against origin/dev lists contracts/OMN-21699.yaml and does not list contracts/OMN-21536.yaml.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          sh -c 'files=$(git diff --name-only origin/dev...HEAD) && printf "%s\n" "$files" | grep -Fx contracts/OMN-21699.yaml && ! printf "%s\n" "$files" | grep -Fx contracts/OMN-21536.yaml'
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn21699-deploy-mock-handler-store-injection
    description: >-
      Post-deploy probe: the running runtime image carries the injected-store constructor on both mock handlers. Hosted CI has no runtime container, so only the local Done gate runs it and it binds no acceptance criterion.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          docker exec omninode-runtime python -c "import inspect; from omnibase_infra.handlers.registration_storage.handler_registration_storage_mock import HandlerRegistrationStorageMock as R; from omnibase_infra.handlers.service_discovery.handler_service_discovery_mock import HandlerServiceDiscoveryMock as S; assert list(inspect.signature(R.__init__).parameters) == ['self', 'store']; assert list(inspect.signature(S.__init__).parameters) == ['self', 'store']"
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac: []
