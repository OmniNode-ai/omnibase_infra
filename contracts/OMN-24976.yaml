schema_version: 1.0.0
ticket_id: OMN-24976
title: The compose dev lane establishes lane_sync for a release train candidate, so the train gets a lab PASS receipt or names a real failed check
summary: >-
  check_lane_sync in scripts/ci/lab_pass_receipt.py runs scripts/lane-census-check.sh report-only, with no broker container named. Since OMN-20798 the census exits 8 when it finds drift and does not publish the drift event (EXIT_DRIFT_UNPUBLISHED=8, scripts/lane-census-check.sh:153 and :506), so every census that found drift from the receipt job exited 8. The check accepted only 0 and 30 and recorded any other exit as lane_sync indeterminate, so the release train read real drift findings as lab_receipt_indeterminate and skipped run 43823852608's omnibase_infra candidate 0e5f656d and omnimarket candidate 0238884e. The check now takes 8 as the drift exit it is, with the same plan agreement rule as 30: a plan with findings and a non-zero drift exit is a failed lane_sync, and every other exit, or an exit that disagrees with its plan, stays indeterminate. The regression replays the census answer recorded on a lab host against the CI overlay revision the candidate's verify job read (tests/ci/fixtures/omn24976_lane_sync_unpublished_drift.json) through the check and through the train's receipt reader. The ticket's third criterion reads the next release train run after the fix is installed, and its first and fourth criteria are ticket comments; no check here can bind them, so this contract carries no entry for them and the ticket stays open until those reads are posted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24976-unpublished-drift-fails
    statement: A lane census drift that the receipt job does not publish is recorded as a failed lane_sync check, so the release train names it as a failed check instead of lab_receipt_indeterminate.
    acceptance:
      - id: AC2
        statement: "AC2: a regression test built from the recorded receipt or journal data of the skipped candidates (fixture path named in the PR) fails on the broken code and passes on the fix, both runs on the lab -- falsifier: `uv run pytest <the test path in the PR> -q` placed through /omni:lab-run, red on the base revision and green on the head"
evidence_requirements:
  - kind: tests
    description: The recorded-census replay through check_lane_sync and the train's receipt reader.
    command: uv run --frozen pytest tests/ci/test_lab_pass_lane_sync_unpublished_drift_omn24976.py -q --no-cov -n 0 -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24976-ac2-recorded-drift
    description: >-
      The recorded lab census answer (exit 8, four findings on one lab lane) replayed through check_lane_sync is a failed lane_sync, and the train's reader names lab_receipt_fail with lane_sync among the checks not passing. At the merge base the same replay is lane_sync indeterminate and the reader names lab_receipt_indeterminate. Controls keep exit 8 with no findings, exit 0 with findings and every other census exit indeterminate, a published drift (exit 30) failed and a clean census passing.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_lab_pass_lane_sync_unpublished_drift_omn24976.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_lab_pass_census_overlay_omn20934.py tests/ci/test_direct_lab_census_omn20008.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
