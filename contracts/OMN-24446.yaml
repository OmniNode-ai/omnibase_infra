schema_version: 1.0.0
ticket_id: OMN-24446
title: A scheduled job without its settings no longer floods the failure queue on every tick
summary: The failure queue replay node never re-sends a record of a broadcast topic (the runtime tick topic is declared one in the node's own contract) and quarantines it with a stated reason, and it caps the replays of one topic and listener group per window, with both values read from the contract. The scheduled-node half is the omnimarket pull request of the same ticket.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24446-replay-policy
    statement: The failure queue replay node does not re-send broadcast tick records and does not retry one failing listener without bound.
    acceptance:
      - id: AC3
        statement: "AC3: the failure queue never re-sends a record of a broadcast topic and sets it aside with a stated reason -- falsifier: pytest tests/unit/nodes/node_dlq_replay_effect/test_omn24177_broadcast_topic_not_replayed_and_replay_bound.py -k broadcast fails before the change"
      - id: AC4
        statement: "AC4: one listener that fails every record on a topic is retried at most the contract's cap per window and the rest are set aside -- falsifier: the same file with -k bound fails before the change"
      - id: AC5
        statement: "AC5: integrated: on the development system running both changes, the runtime log over five minutes holds no Skipping replayed record lines on the runtime tick topic -- falsifier: the same count over five minutes before the change read 12,540 lines in the first 3.5 minutes after the rebuild"
evidence_requirements:
  - kind: tests
    description: The replay node's tests pass at the pushed head.
    command: uv run pytest tests/unit/nodes/node_dlq_replay_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24446-ac3
    description: 'AC3: the broadcast tests pass with the change; before the change the config had no broadcast_topics field and a tick record was replayed.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_dlq_replay_effect/test_omn24177_broadcast_topic_not_replayed_and_replay_bound.py -q -n 0 --no-cov -p no:cacheprovider -k broadcast
        cwd: .
  - id: dod-omn24446-ac4
    description: 'AC4: the replay bound tests pass with the change; before the change every dead letter of the pair was replayed.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_dlq_replay_effect/test_omn24177_broadcast_topic_not_replayed_and_replay_bound.py -q -n 0 --no-cov -p no:cacheprovider -k "bound or admit or policy"
        cwd: .
  - id: dod-omn24446-integration-proof-ac5
    description: 'AC5: the dev runtime on h201 holds no Skipping replayed record line on the runtime tick topic over five minutes; run on h201 after the dev rebuild from the branch.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_infra --sha "$(git rev-parse HEAD)" --host h201 --lane dod-ac5-24446 --kind test -- bash -c 'test "$(docker logs --since 5m omninode-runtime 2>&1 | grep -c "Skipping replayed record on onex.intent.platform.runtime-tick.v1")" = 0'
        cwd: .
  - id: dod-omn24446-ac5-hosted-proxy
    description: 'hosted proxy for AC5: the replay node, given a tick dead letter and the contract-read policy, replays nothing and quarantines it, which is what stops the skip lines; the dev log read itself is the unbound integration proof item above.'
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_dlq_replay_effect/test_omn24177_broadcast_topic_not_replayed_and_replay_bound.py -q -n 0 --no-cov -p no:cacheprovider -k "broadcast or policy"
        cwd: .
