schema_version: 1.0.0
ticket_id: OMN-24526
title: Lab computers can reach the idle platform work steps
summary: >-
  The node broker resolver behind onex run-node reads one shared overlay (run_node_default) when a node's own overlay is missing or holds no event_bus key, and binds the node on the lane that overlay declares. A node's own event_bus wins, a malformed one never falls back, and with no default overlay the original refusal stands.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24526-default-bus-overlay
    statement: A deferred node with no overlay of its own is reached by onex run-node on the lane the shared default overlay declares.
    acceptance:
      - id: AC2
        statement: "AC2: a node with no overlay of its own is bound to the lane declared by the shared default overlay, its own overlay still wins and a malformed one never falls back -- falsifier: uv run pytest tests/unit/handlers/test_handler_node_broker_resolve_default_overlay.py -q"
evidence_requirements:
  - kind: tests
    description: The node broker resolver tests.
    command: uv run --frozen pytest tests/unit/handlers/test_handler_node_broker_resolve.py tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py tests/unit/handlers/test_handler_node_broker_resolve_default_overlay.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24526-ac2-default-overlay
    description: >-
      Golden: no node overlay and a default overlay binds the lane the default declares, through the workspace root and through the overlay roots; the node's own event_bus wins. Error chain: no default overlay raises the node's original refusal and a malformed node event_bus never falls back. Four of the eight tests fail on the unchanged handler.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_node_broker_resolve_default_overlay.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn24526-integration-proof
    description: >-
      The resolver tests run together with the existing resolver tests on a lab host at the pushed head. It binds no criterion; the hosted proof is the local Done gate.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_node_broker_resolve.py tests/unit/handlers/test_handler_node_broker_resolve_overlay_roots.py tests/unit/handlers/test_handler_node_broker_resolve_default_overlay.py -q --no-cov -p no:cacheprovider
        cwd: .
