schema_version: "1.0.0"
ticket_id: OMN-21799
title: "omnibase_infra contracts_and_di literal_path and literal_model_name burn-down, slice rf1540-c8"
summary: >-
  The scope-check workflow models (ModelScopeCheckCommand, ModelScopeFileReadRequest, ModelScopeFileReadResult, ModelScopeExtractInput, ModelScopeExtracted) and HandlerScopeFileRead.handle carried a home-relative manifest location as a code default, six literal_path findings of the contracts_and_di validator. The field is now required and non-empty on every hop: the command producer (node_scope_workflow_orchestrator/bin/scope_check.sh, from SCOPE_MANIFEST_PATH) supplies it and each handler carries it forward. No baseline entry or suppression is added. Repo literal_path count over src drops from 12 to 6; literal_model_name is unchanged at 36 (no model name was in the slice); total findings 1228 to 1222.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - events
  - public_api
requirements:
  - id: req-omn21799-scope-manifest-path-injected
    statement: The scope-check workflow holds no manifest location in code; the location arrives in the command and is carried through every hop.
    acceptance:
      - id: AC1
        statement: "AC1: the contracts_and_di count for literal_path and literal_model_name over the slice paths drops to zero and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over omnibase_infra src before and after, counts compared per rule"
      - id: AC2
        statement: "AC2: every path and model name comes from the owning node contract or overlay and is injected, none hard-coded in the touched code -- falsifier: the focused scope model and workflow tests plus the checker re-run on the slice paths"
      - id: AC3
        statement: "AC3: the slice lands as one PR titled with this ticket id and carries lab proof of the tests and the checker re-run -- falsifier: the focused scope tests and validator on the lab at the PR head, receipt path in the PR body"
evidence_requirements:
  - kind: tests
    description: The scope canary unit tests, including the required-output_path test that fails against the merge-base models.
    command: uv run --frozen pytest tests/unit/nodes/test_scope_canary/test_scope_models.py tests/unit/nodes/test_scope_canary/test_scope_workflow_integration.py tests/unit/nodes/test_scope_canary/test_handler_scope_file_read.py tests/unit/nodes/test_scope_canary/test_handler_scope_extract.py tests/unit/nodes/node_scope_extract_compute/test_scope_extract_dispatch_entrypoint_omn14832.py tests/unit/nodes/node_scope_extract_compute/test_node_scope_extract_compute_golden_equivalence.py -q
  - kind: manual
    description: The contracts_and_di validator over the three slice node directories reports no finding.
    command: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/nodes/node_scope_extract_compute src/omnibase_infra/nodes/node_scope_file_read_effect src/omnibase_infra/nodes/node_scope_workflow_orchestrator
  - kind: tests
    description: Deploy-scope filesystem readback through the scope handlers using the caller-selected destination; no broker or containers required.
    command: "deploy: uv run --frozen pytest tests/integration/nodes/test_scope_output_path_deploy_omn21799.py -q"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21799-ac1-slice-checker-clean
    description: The contracts_and_di validator over the slice node directories exits 0; at the merge base the same run reports six literal_path findings there.
    source: manual
    checks:
      - check_type: command
        check_value: uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_infra/nodes/node_scope_extract_compute src/omnibase_infra/nodes/node_scope_file_read_effect src/omnibase_infra/nodes/node_scope_workflow_orchestrator
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC1
  - id: dod-omn21799-ac2-output-path-required
    description: Every scope model refuses a missing or empty output_path and keeps a supplied one; the workflow test carries the command's path to the manifest writer. The required-field test fails against the merge-base models.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/test_scope_canary/test_scope_models.py tests/unit/nodes/test_scope_canary/test_scope_workflow_integration.py tests/unit/nodes/test_scope_canary/test_handler_scope_file_read.py tests/unit/nodes/test_scope_canary/test_handler_scope_extract.py tests/unit/nodes/node_scope_extract_compute/test_scope_extract_dispatch_entrypoint_omn14832.py tests/unit/nodes/node_scope_extract_compute/test_node_scope_extract_compute_golden_equivalence.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC2
  - id: dod-omn21799-ac3-cloud-ci
    description: The required-output_path test for all five scope models and the filesystem integration readback run from the checkout with no network access and no pushed-commit dependency, so they hold locally, on the lab and on a hosted runner.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/test_scope_canary/test_scope_models.py -q -k output_path_is_required
        cwd: ${OMNI_HOME}/omnibase_infra
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/nodes/test_scope_output_path_deploy_omn21799.py -q
        cwd: ${OMNI_HOME}/omnibase_infra
    binds_ac:
      - AC3
