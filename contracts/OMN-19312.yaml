schema_version: "1.0.0"
ticket_id: "OMN-19312"
title: "lab-pass gate all-of required lanes, bounded wait, runtime-ancestor subject, and a re-pinned staging receiver"
summary: "Evidence-only contract for the merged change omnibase_infra#4014 (44ff0303760df4c8d3940f0d685ae1717d4f158f). The gate's --require-lane is all-of, a required lane with no receipt after --wait-seconds is refused, --resolve-runtime-ancestor inherits only across non-runtime commits, and no new flag carries a force or skip. AC3, AC6 and AC7 are not bound here."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "The OMN-19312 gate classes in omnibase_infra pass at dev."
    command: "env -u PYTHONPATH uv run --frozen pytest 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestRequireLaneIsAllOf' 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestBoundedWait' 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestRuntimeAncestorSubject' 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestNoOverrideOnTheNewFlags' -q -p no:cacheprovider"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19312-ac1-require-lane-all-of"
    description: "AC1: under --require-lane, a sha whose required lane has a FAIL receipt beside a PASS on another lane is refused naming the sha, while the unchanged any-of call on the same inputs passes (positive control). The test class is absent at the merge parent 66ef36514."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "env -u PYTHONPATH uv run --frozen pytest 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestRequireLaneIsAllOf::test_require_lane_refuses_a_chain_fail_beside_an_onex_lab_pass' 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestRequireLaneIsAllOf::test_require_lane_positive_control_any_of_alone_passes_the_same_inputs' -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC1"]
    # Binding provenance (binds_ac above is the schema-owned binding):
    # - label: "AC1"
    #   criterion_hash: "31862b1d3e20db0c2f43249b8671c1eeeedb067a76ce2ebfbddbf43f86e38606"
