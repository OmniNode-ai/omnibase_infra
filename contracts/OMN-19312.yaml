    #   accepted_by: "lane=dod-closeout-accept-2026-10-19T0445Z-c0"
  - id: "dod-omn19312-ac2-bounded-wait-refuses-absent"
    description: "AC2: a required lane with no receipt after --wait-seconds is refused as no receipt, and a receipt that lands inside the bound is read and judged (a FAIL that lands inside the bound is refused)."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "env -u PYTHONPATH uv run --frozen pytest 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestBoundedWait::test_wait_expiry_on_an_absent_required_receipt_refuses' 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestBoundedWait::test_wait_reads_a_receipt_that_lands_inside_the_bound' 'tests/ci/test_lab_pass_receipt_gate_omn17530.py::TestBoundedWait::test_wait_refuses_a_fail_receipt_that_lands_inside_the_bound' -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC2"]
    # Binding provenance (binds_ac above is the schema-owned binding):
