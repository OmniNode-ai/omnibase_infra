schema_version: 1.0.0
ticket_id: OMN-23613
title: The CI lane model accepts an optional tenant key
summary: The publisher's lane model (ModelCiBusLane in scripts/trigger_rebuild_on_merge.py) learns one optional key, tenant_id, validated as a UUID, so the strict lane table keeps validating once omnimarket declares the key (step A1 of the HTTP API removal, parent OMN-23566). extra=forbid stays; nothing reads the key in this publisher.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - models
requirements:
  - id: req-omn23613-tenant-key
    statement: The lane model accepts an optional tenant_id on a lane, leaves its shape to the reader that acts on it, and still refuses every other unknown key.
    acceptance:
      - id: AC1
        statement: 'AC1: the publisher''s lane model accepts an optional tenant_id on a lane and still refuses an unknown key -- falsifier: `uv run pytest tests/unit/scripts/test_trigger_learns_tenant_key_omn23613.py -q` passes at the merge base'
      - id: AC2
        statement: 'AC2: the omnimarket parity gate accepts a lane table carrying tenant_id once this change is released and pinned -- falsifier: `check_ci_bus_overlay_parity.py` run against the released model and a table with tenant_id exits non-zero'
      - id: AC3
        statement: 'AC3: integrated: the cross-repository parity check runs green on the settings repository''s pull request that adds the key, in the running CI -- falsifier: that check on that pull request is anything other than success'
evidence_requirements:
  - kind: tests
    description: The tenant key tests and the neighbouring lane model tests at the pushed head. With scripts/trigger_rebuild_on_merge.py restored to origin/dev, the declared-tenant and malformed-tenant tests fail.
    command: env -u PYTHONPATH uv run pytest tests/unit/scripts/test_trigger_learns_tenant_key_omn23613.py tests/unit/scripts/test_trigger_learns_binding_fallback_omn20275.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23613-ac1-model
    description: The tenant key tests pass at the pushed head.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/scripts/test_trigger_learns_tenant_key_omn23613.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn23613-ac3-parity
    description: The parity gate in omnimarket reads this model from the pinned release. The read is the gate on the omnimarket pull request that adds the key after the release is pinned, so only the local Done gate runs this unbound check.
    source: manual
    binds_ac:
      - AC2
      - AC3
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'grep -q "tenant_id: str | None" scripts/trigger_rebuild_on_merge.py'
        cwd: .
