schema_version: 1.0.0
ticket_id: OMN-22604
title: deploy-runners.sh --add waits for an idle runner and takes a supplied registration token
summary: --add holds each existing target to the fail-closed idle check and mints no token through gh.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22604-add-idle-and-supplied-token
    statement: deploy-runners.sh --add never hands a busy or unreadable running target to compose, and takes its registration token from DEPLOY_RUNNER_TOKEN or --token-file instead of minting one through gh.
    acceptance:
      - id: AC1
        statement: 'AC1: a busy target, a target whose state cannot be read and a target with a job worker in its container are never handed to compose up -- falsifier: uv run pytest tests/ci/test_deploy_runners_add_idle_omn22478.py -q -n 0 --no-cov fails on the merge-base script, which runs compose up for each'
      - id: AC2
        statement: 'AC2: --add makes no gh api POST and refuses without a supplied token before any ssh or rsync -- falsifier: uv run pytest tests/ci/test_deploy_runners_add_idle_omn22478.py -q -n 0 --no-cov fails on the merge-base script, which calls gh api --method POST'
      - id: AC3
        statement: 'AC3: the existing rolling preflight tests still pass -- falsifier: uv run pytest tests/ci/test_deploy_runners_registration_preflight.py -q -n 0 --no-cov'
evidence_requirements:
  - kind: tests
    description: --add idle check and supplied token
    command: uv run pytest tests/ci/test_deploy_runners_add_idle_omn22478.py tests/ci/test_deploy_runners_registration_preflight.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22604-add-tests
    description: The --add tests run against recording ssh, gh and rsync boundaries; the same file fails on the merge-base script.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_deploy_runners_add_idle_omn22478.py -q -n 0 --no-cov
        cwd: .
    binds_ac:
      - AC1
      - AC2
  - id: dod-omn22604-rolling-unchanged
    description: The rolling preflight tests are unchanged and pass.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_deploy_runners_registration_preflight.py -q -n 0 --no-cov
        cwd: .
    binds_ac:
      - AC3
  - id: dod-omn22604-ac1-accepted-20261125t0545z
    description: 'AC1: a job-worker target, an unfinished job in the listener log, an unreadable docker top and an offline target with a worker each exit non-zero, never reach compose up, and report left running and untouched. Accepted by a second lane from a re-run at omnibase_infra origin/dev 3a527226a (4 passed); the same selector fails 4 of 4 against the parent script 43b288699 and with the fix reverted at dev.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest "tests/ci/test_deploy_runners_add_idle_omn22478.py::test_a_target_that_may_be_mid_job_is_left_running_and_untouched" -q -n 0 --no-cov
        cwd: .
    binds_ac:
      - AC1
  - id: dod-omn22604-ac2-accepted-20261125t0545z
    description: 'AC2: with no supplied token --add exits non-zero naming DEPLOY_RUNNER_TOKEN and registration-token before any ssh or rsync, and no gh call carries --method POST, in both the normal and the dry run. Accepted by a second lane from a re-run at omnibase_infra origin/dev 3a527226a (2 passed); the normal case fails against the parent script 43b288699, which fetches a registration token.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest "tests/ci/test_deploy_runners_add_idle_omn22478.py::test_no_supplied_token_refuses_before_any_remote_action_and_mints_nothing" -q -n 0 --no-cov
        cwd: .
    binds_ac:
      - AC2
  - id: dod-omn22604-ac3-accepted-20261125t0545z
    description: 'AC3: every rolling preflight test passes. Accepted by a second lane from a re-run at omnibase_infra origin/dev 3a527226a (15 passed); with the fix reverted at dev the file errors on the tokenless CLI refusal replay.'
    source: manual
    checks:
      - check_type: command
        check_value: uv run pytest tests/ci/test_deploy_runners_registration_preflight.py -q -n 0 --no-cov
        cwd: .
    binds_ac:
      - AC3
