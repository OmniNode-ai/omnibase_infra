schema_version: "1.0.0"
ticket_id: "OMN-23513"
title: "The dev lane check stops requiring containers that were folded into the one runtime on purpose"
summary: >
  The lane census planner (scripts/lane_census_plan.py) read the dev lane's runtime-effects, projection-api and projection-delegation-writer services as required because the private lane manifest still declares them kind service. The runtime policy (docker/runtime-policy.env, rendered from contracts/services/runtime_policy.contract.yaml) folds all three into the main runtime (DEV_RUNTIME_MAIN_FOLDED_PROFILES), under the one-runtime ruling of 2026-11-02T15:02:01Z, so the dev lane_sync check read DRIFT (container_absent) in the dev lab-pass receipts of 01:02Z, 05:07Z and 07:08Z on 2026-11-10. The planner now reads the folded profile list and the foldable service map from the policy and treats a lane service of that compose project, whose name ends with a folded service, as expected absent (the profile_gated reading: absent is clean, running is profile_gated_present). A policy that folds nothing, a lane of another compose project and a foldable service whose profile is not folded keep the required reading.

is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
  - infrastructure
requirements:
  - id: "req-omn23513-folded-services-expected-absent"
    statement: "The lane census treats services the runtime policy folds into the main runtime as expected absent on the lane of the policy's compose project, and still reports one that runs."
    acceptance:
      - id: "AC1"
        statement: "AC1: the lane census plan reads the runtime policy's folded-profile list and treats the dev lane's declared services that the policy folds into the main runtime (the effects container, the projection API and the delegation projection writer) as expected absent, so none is reported container_absent -- falsifier: uv run pytest tests/unit/scripts/test_lane_census_folded_services_omn23509.py fails on the unchanged planner with container_absent findings for the three"
      - id: "AC2"
        statement: "AC2: a folded container that is running anyway is reported as profile_gated_present, and a lane the policy does not fold keeps its required containers -- falsifier: the same test file, the running-folded and unfolded-lane cases, fail if the planner ignores the running container or applies the fold to other lanes"
      - id: "AC3"
        statement: "AC3: integrated: after the deploy agent rolls dev from a tag carrying the change, the dev lab-pass receipt's lane_sync check no longer names omnimarket-projection-api, omninode-runtime-effects or omnimarket-projection-delegation-writer -- falsifier: the receipt's lane_sync text read through the deploy agent still lists container_absent for any of the three"
evidence_requirements:
  - kind: "tests"
    description: "The folded-services planner tests and the existing planner tests pass."
    command: "uv run pytest tests/unit/scripts/test_lane_census_folded_services_omn23509.py tests/unit/scripts/test_lane_census_plan.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23513-ac1-folded-absent"
    description: "The folded dev services are not container_absent; the control with a policy that folds nothing reports all three. Fails on the unchanged planner (the planner has no fold reading)."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/scripts/test_lane_census_folded_services_omn23509.py -k 'folded_services_absent_is_not_drift or empty_policy or shipped_policy' -q --no-cov"
        cwd: "."
  - id: "dod-omn23513-ac2-running-and-scope"
    description: "A running folded container is profile_gated_present; another compose project and an unfolded foldable service keep container_absent."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/scripts/test_lane_census_folded_services_omn23509.py -k 'profile_gated_present or different_compose_project or not_folded' -q --no-cov"
        cwd: "."
  - id: "dod-omn23513-ac3-integration-proof"
    description: "The pushed head's planner, run against the live docker inventory of the dev host through the lab work runner, lists no container_absent for the three folded services. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnibase_infra --sha \"$(git rev-parse HEAD)\" --lane lsync-1440 -- uv run --frozen pytest tests/unit/scripts/test_lane_census_folded_services_omn23509.py -q --no-cov"
        cwd: "."
