schema_version: 1.0.0
ticket_id: OMN-26122
title: The M4 beta board check C16 (probe c16-receipt-identity) reads green against what exists now, or its real product defect is named with a ticket
summary: >-
  The C16 probe resolved the stability lane by gateway_url, the address of the separate HTTP API that the one-runtime rulings retired (RULING 2026-11-02T15:02:01Z moved the API inside the runtime; RULING 2026-11-10T13:26:22Z removed the separate service). No lane declares gateway_url, so every scheduled run since 2026-11-03 ended in the lane-resolve step with "does not declare gateway_url". The runtime's own ingress_url serves the tenant route POST /v1/workflows (the stability lane's ingress answers GET /health 200 and POST /v1/workflows 401 without a key), so the workflow now requires ingress_url and bus_lane and sends the probe there. Every clause of the probe script is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26122-c16-reads-the-runtime-front-door
    statement: The C16 probe grades the stability lane through the runtime's own ingress_url and keeps every clause it asserted.
    acceptance:
      - id: AC1
        statement: 'AC1: the cause of the red is named from the probe''s newest failure text, with the run id and the failure lines read -- falsifier: the lane report names a cause with no run id or no quoted failure line'
      - id: AC2
        statement: 'AC2: the probe''s next run reads green against what exists now, with no retired thing restored and no clause removed unless a ruling retired the fact it graded -- falsifier: the newest c16-receipt-identity run reads red, or the clause table in the report lists a removed assertion that no ruling retires'
      - id: AC3
        statement: 'AC3: the lane writes one STATUS row `crit=C16 probe=c16-receipt-identity verdict=<green|red> read_at=<UTC>` -- falsifier: a ledger grep for `crit=C16 probe=c16-receipt-identity` finds no STATUS row after this ticket''s creation'
evidence_requirements:
  - kind: tests
    description: The stability lane declaration seam test and the stability proofs workflow pins, including the control that a lane with no ingress_url is refused naming the field.
    command: uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py tests/ci/test_proofs_target_stability_lane_omn21485.py -q --no-cov -n 0 -p no:randomly
  - kind: tests
    description: The probe records the gateway's own refusal body when a submission is not accepted, and still records nothing of the request.
    command: uv run --frozen pytest tests/ci/test_c16_receipt_identity_probe_omn19181.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26122-ac1-cause-named
    description: >-
      The cause is a workflow requirement for a field the declared lane cannot carry: the C16 resolve step required gateway_url, which the stability lane's declaration omits because the separate HTTP API was retired. The failing run id and the quoted log lines are in the pull request body. The check holds the corrected requirement: C16 requires ingress_url and bus_lane and no longer requires gateway_url.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py -q --no-cov -n 0 -p no:randomly -k "each_workflow_requires_the_spelled_fields"
        cwd: .
  - id: dod-omn26122-ac2-resolves-and-keeps-clauses
    description: >-
      The declared stability lane satisfies the C16 resolver step, a lane without ingress_url is still refused naming the field, and the probe is driven from LANE_INGRESS_URL. The probe script is not edited, so every clause of R-DELEG-11, R-DELEG-12 and R-DELEG-26 is still asserted. The run id of the first run that reads green is posted as a pull request comment that names the head; no static check claims a run.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26122-ac3-status-row
    description: >-
      The STATUS row is written by the lane to the rolling ledger, which hosted CI cannot read. The check holds the workflow pin the row's verdict depends on.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_stability_proof_lane_declaration_omn24191.py -q --no-cov -n 0 -p no:randomly -k "c16"
        cwd: .
  - id: dod-omn26122-ac4-own-lane-wait
    description: >-
      Run 44919897557 (2026-11-21T15:34Z) spent its 2400 s lane-resolve budget behind a dev idle-restore job; the agent job store held fourteen jobs from 2026-11-20T15:21Z to 2026-11-21T18:15Z, all of the dev lane. The check holds that the resolver ignores another named lane's job, still waits for the graded lane's own job and for a job that names no lane, and that the agent's health names the lane of its active and last job.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_resolve_lab_lane_other_lane_job_omn26122.py tests/ci/test_resolve_lab_lane_deploy_wait_omn19811.py tests/ci/test_resolve_lab_lane_wait_while_busy_omn20410.py -q --no-cov -n 0 -p no:randomly
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest scripts/deploy-agent/tests/unit/test_health_active_job_runtime_lane_omn26122.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26122-ac1-probe-records-refusal-detail
    description: >-
      Runs 45129905267 (head 356fa65dc9a1, concluded 2026-11-23T07:17:19Z) and 45131998180 (head 356fa65dc9a1, concluded 07:34:29Z) both ended with the stability runtime answering the probe's submissions 503, and the probe's record said only "submit answered 503": the gateway's refusal text was read and thrown away, so the cause had to be dug out of a job log that the lane's read budget could not reach. The probe now appends the gateway's own refusal body (bounded to 200 characters, never the request or the credential) to that line, and every clause of R-DELEG-11, R-DELEG-12 and R-DELEG-26 is unchanged. The hosted check below reads the checked-out tree and fails on the merge base, where the bound is absent.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_c16_receipt_identity_probe_omn19181.py -q --no-cov -n 0 -p no:randomly -k "refused_submission or accepted_submission"
        cwd: .
      - check_type: command
        check_value: grep -F "str(body)[:200]" scripts/ci/c16_receipt_identity_probe.py
        cwd: .
  - id: dod-omn26122-ac2-c15-receipt-step-soft
    description: >-
      The sibling chain canary (C15) ended red at its own receipt step as well as its verdict step: run 45291437443 (dev head 09347b4ab987, concluded 2026-11-24T00:00:08Z) logged "the lane reported no code sha on its deploy agent or its /ready" and exit code 1 at the emit step, a step whose comment says it can never change the run's conclusion. The step runs under the runner's default bash -e, which the script's own set -uo pipefail does not clear. The step now clears errexit, and the check runs the step's real script under bash -e with a stand-in for uv, for a lane that reports no sha and for a failing emit. It touches no probe clause. The base workflow fails both tests.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_chain_lane_receipt_omn18866.py -q --no-cov -n 0 -p no:randomly -k "run_conclusion_alone"
        cwd: .
  - id: dod-omn26122-retire-deleted-ac4
    description: >-
      AC4 was deleted from OMN-26122; the ticket now carries AC1 to AC3 only. This item retires the claim the item that bound AC4 made on a deleted criterion. It binds AC2 with a check that fails on the merge base, where the AC4 requirement is still declared, and passes once the contract carries AC1 to AC3 only; its second check keeps the resolver and deploy-agent health tests that item ran, so they still run.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: "! grep -E 'req-omn26122-stability-probe-waits-for-its-own-lan[e]' contracts/OMN-26122.yaml"
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_resolve_lab_lane_other_lane_job_omn26122.py -q --no-cov -n 0 -p no:randomly
        cwd: .
    supersedes_ac_binding:
      - item: dod-omn26122-ac4-own-lane-wait
        label: AC4
        reason_kind: no_longer_applicable
        reason: AC4 was deleted from the ticket, so the item that bound it no longer proves a criterion the ticket carries.
        retired_by: q-close26122v-224500
        retired_at: '2026-11-28T15:30:00Z'
