  - id: dod-omn19655-core-patch-check-binding
    description: The three version-sensitive checks compare manifest, lock and installed core while retaining the compatibility floor and frozen symbol and type checks.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_contract_validation_core_validator_omn20074.py tests/integration/infra/test_omn_12765_release_backmerge_identity.py tests/unit/runtime/test_seam_released_core_pin.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_infra
