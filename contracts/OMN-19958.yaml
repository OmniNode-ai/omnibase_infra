    description: 'AC2: the monitor pass after an oom_kill rise reports delta 0 and logs no OOM_KILL line for the same runner. Absent before omnibase_infra#4264.'
    command: uv run pytest tests/unit/observability/runner_health/test_runner_monitor_oom_kill_delta.py -q -k "test_the_pass_after_a_kill_reports_delta_zero"
  - kind: tests
    description: 'AC3: with the fixture runner''s memory.events removed, the monitor reports an error for that runner. Absent before omnibase_infra#4264.'
    command: uv run pytest tests/unit/observability/runner_health/test_runner_monitor_oom_kill_delta.py -q -k "test_a_missing_memory_events_file_is_reported_for_that_runner"
