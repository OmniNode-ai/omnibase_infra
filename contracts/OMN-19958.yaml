title: Runner OOM kills alert in the pass that sees them, on every runner host
summary: omnibase_infra#4264 makes runner-monitor.sh read each runner's cgroup memory.events oom_kill counter, report a positive delta in the pass that sees it, stay quiet on a flat counter, and report an unreadable counter as an error. This contract records the acceptance-criterion bindings a second lane accepted.
