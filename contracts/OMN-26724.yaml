        cwd: .
  - id: dod-omn26724-ac1-dev-agent-loaded-merged-code
    description: "Live reading for AC1 on the lab agents: the dev agent's /health loaded_code_sha contains the merge of the build-ref fix and its uptime is shorter than the merge's age. Judged by node_deploy_agent_reading_compute; exits non-zero when that criterion is not met or an agent is unreachable."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          dev="$(ssh "$DEPLOY_PROBE_HOST" "curl -sf http://localhost:8098/health")" && stab="$(ssh "$STABILITY_PROBE_HOST" "curl -sf http://localhost:8098/health")" && prod="$(ssh "$PROD_PROBE_HOST" "curl -sf http://localhost:8098/health")" && DEV="$dev" STAB="$stab" PROD="$prod" PYTHONPATH=src uv run --frozen python -c 'import json,os,subprocess,sys,time;from omnibase_infra.handlers.deploy_agent_reading.handler_deploy_agent_reading import HandlerDeployAgentReading as H;from omnibase_infra.models.model_deploy_agent_reading_request import ModelDeployAgentReadingRequest as R;d,s,p=(json.loads(os.environ[k]) for k in ("DEV","STAB","PROD"));m=sys.argv[1];r=d.get("last_result") or {};sha=d.get("loaded_code_sha") or "";anc=bool(sha) and subprocess.run(["git","merge-base","--is-ancestor",m,sha]).returncode==0;t=int(subprocess.check_output(["git","show","-s","--format=%ct",m]));u=lambda h:None if h.get("uptime_seconds") is None else int(h["uptime_seconds"]);v=H().handle(R(dev_loaded_code_sha=sha,dev_uptime_seconds=u(d),dev_loaded_sha_has_merge=anc,merge_age_seconds=int(time.time())-t,dev_last_status=r.get("status") or "",dev_last_runtime_lane=r.get("runtime_lane") or "",dev_last_phase_result_count=len(r.get("phase_results") or []),stability_uptime_seconds=u(s),prod_uptime_seconds=u(p)));sys.exit(0 if v.ac1_met else 1)' 5b35e3658c6f3a6497913628f62ff908c05faff8
        cwd: .
