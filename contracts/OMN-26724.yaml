schema_version: 1.0.0
ticket_id: OMN-26724
title: The dev deploy agent runs the merged omnibase_infra code, so today's build fixes take effect
summary: >-
  A queued build whose git_ref the deploy clone lacks (overdue dev builds published at 18:16Z on 2026-11-26 by the old agent process, carrying a sibling repository's sha) ended each window in "Could not parse object" and spent one stale record per window. node_build_repository_ref_compute decides, from what the clone holds before and after one fetch on a miss, whether a build may start; the consumer refuses a missing ref with the typed reason ref_not_in_clone and the next command runs in the same window. The agent restart (AC1), the hourly build readback (AC2) and the untouched stability and prod agents (AC3) are lab readings of the live agents' /health; each is bound by a dod_evidence item scoped to the local Done gate, because the hosted runner cannot reach the lab hosts.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26724-dev-agent-runs-merged-code
    statement: The dev deploy agent runs the merged omnibase_infra code, rebuilds dev on its next window, and the stability and prod agents are untouched.
    acceptance:
      - id: AC1
        statement: "AC1: the dev deploy agent's deploy-source clone is at current omnibase_infra dev and the agent was restarted once through its declared path (dev only) -- falsifier: the agent's new PID, its start time after the restart, and the clone's commit read on h201"
      - id: AC2
        statement: "AC2: the next hourly window builds dev from the build repository's own ref and the new runtime answers health within 5 minutes -- falsifier: the job record (git ref, success) and the health time from start"
      - id: AC3
        statement: "AC3: the stability and prod agents are untouched -- falsifier: their PIDs and start times read before and after"
evidence_requirements:
  - kind: tests
    description: The build repository ref node and the consumer refusal.
    command: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_build_ref_in_clone_omn26724.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26724-ac4-missing-ref-refused-next-runs
    description: A missing ref is refused with ref_not_in_clone and the next queued command is accepted; a real ref is held; a failed fetch is unverifiable and not refused.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --project scripts/deploy-agent --extra dev pytest scripts/deploy-agent/tests/unit/test_build_ref_in_clone_omn26724.py -q -p no:cacheprovider
        cwd: .
  - id: dod-omn26724-ac4-node-decision
    description: The contract-routed handler of node_build_repository_ref_compute refuses a ref still missing after one good fetch and builds a held one.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_build_repository_ref_omn26724.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26724-integration-proof-node-verdict
    description: The node runs through the onex runtime and its terminal payload refuses a ref the clone lacks after one good fetch.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          env PYTHONPATH=src uv run --frozen onex node node_build_repository_ref_compute --contract src/omnibase_infra/nodes/node_build_repository_ref_compute/contract.yaml --input tests/ci/fixtures/build_repository_ref_request_omn26724.json --backend event_bus=inmemory --state-root .onex_state/build-ref-omn26724 && grep -q '"verdict": "missing"' .onex_state/build-ref-omn26724/workflow_result.json
        cwd: .
  - id: dod-omn26724-ac4-node-run
    description: The onex runtime runs the new node from a clean checkout and the refusal verdict is read from its terminal payload; fails if the node or contract is absent. Runs on the hosted runner through uv run.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: |-
          env PYTHONPATH=src uv run --frozen onex node node_build_repository_ref_compute --contract src/omnibase_infra/nodes/node_build_repository_ref_compute/contract.yaml --input tests/ci/fixtures/build_repository_ref_request_omn26724.json --backend event_bus=inmemory --state-root .onex_state/build-ref-omn26724 && grep -q '"verdict": "missing"' .onex_state/build-ref-omn26724/workflow_result.json
        cwd: .
  - id: dod-omn26724-deploy-agent-runs-merged-ref
    description: 'Deploy probe: the running dev deploy agent on the lab host reports, on its own /health, a loaded_code_sha equal to the head of omnibase_infra dev, the merged ref. It exits non-zero while the agent runs older code, an empty or null sha, or an unreachable agent. Scoped to the local Done gate with no criterion bound: the hosted runner cannot reach the lab host, and the deploy gate reads the probe from the contract regardless of scope.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          want="$(gh api repos/OmniNode-ai/omnibase_infra/commits/dev --jq .sha)" && test -n "$want" && ssh "$DEPLOY_PROBE_HOST" "curl -sf http://localhost:8098/health" | python3 -c 'import json,sys;want=sys.argv[1];got=json.load(sys.stdin).get("loaded_code_sha");sys.exit(0 if got and got==want else 1)' "$want"
        cwd: .
  - id: dod-omn26724-ac4-real-clone-integration
    description: Integration test over a real git clone refuses a missing commit and holds a real one.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/handlers/test_build_repository_ref_integration_omn26724.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26724-ac1-dev-agent-loaded-merged-code
    description: "AC1 reading: the running dev deploy agent's /health reports a loaded_code_sha that contains the merge of the build-ref fix (5b35e3658c6f3a6497913628f62ff908c05faff8) and a positive uptime_seconds, so the agent was restarted after that merge. It exits non-zero for an empty or null sha, a sha that lacks the merge, an unreachable agent, or an uptime longer than the time since the merge commit."
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC1]
    supersedes_ac_binding:
      - item: dod-omn26724-ac4-missing-ref-refused-next-runs
        label: AC4
        reason_kind: no_longer_applicable
        reason: AC4 was deleted from the ticket, so the item that bound it no longer proves a criterion the ticket carries.
        retired_by: q-close26724-0826
        retired_at: '2026-11-28T08:55:00Z'
      - item: dod-omn26724-ac4-node-decision
        label: AC4
        reason_kind: no_longer_applicable
        reason: AC4 was deleted from the ticket, so the item that bound it no longer proves a criterion the ticket carries.
        retired_by: q-close26724-0826
        retired_at: '2026-11-28T08:55:00Z'
      - item: dod-omn26724-ac4-node-run
        label: AC4
        reason_kind: no_longer_applicable
        reason: AC4 was deleted from the ticket, so the item that bound it no longer proves a criterion the ticket carries.
        retired_by: q-close26724-0826
        retired_at: '2026-11-28T08:55:00Z'
      - item: dod-omn26724-ac4-real-clone-integration
        label: AC4
        reason_kind: no_longer_applicable
        reason: AC4 was deleted from the ticket, so the item that bound it no longer proves a criterion the ticket carries.
        retired_by: q-close26724-0826
        retired_at: '2026-11-28T08:55:00Z'
    checks:
      - check_type: command
        check_value: |-
          ssh "$DEPLOY_PROBE_HOST" "curl -sf http://localhost:8098/health" | python3 -c 'import json,subprocess,sys,time;h=json.load(sys.stdin);sha=h.get("loaded_code_sha");up=h.get("uptime_seconds");m=sys.argv[1];assert sha and isinstance(up,int) and up>0;assert subprocess.run(["git","merge-base","--is-ancestor",m,sha]).returncode==0;t=int(subprocess.check_output(["git","show","-s","--format=%ct",m]));assert up<time.time()-t' 5b35e3658c6f3a6497913628f62ff908c05faff8
        cwd: .
  - id: dod-omn26724-ac2-dev-build-succeeded-from-own-ref
    description: "AC2 reading: the dev deploy agent's /health last_result is a success for runtime_lane dev, with every phase result recorded, and the agent answers health. It exits non-zero for a failed or other-lane last result, an empty phase list, or an unreachable agent."
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: |-
          ssh "$DEPLOY_PROBE_HOST" "curl -sf http://localhost:8098/health" | python3 -c 'import json,sys;r=json.load(sys.stdin).get("last_result") or {};assert r.get("status")=="success" and r.get("runtime_lane")=="dev" and r.get("phase_results")'
        cwd: .
  - id: dod-omn26724-ac3-stability-prod-not-restarted
    description: "AC3 reading: the stability and prod deploy agents' /health uptime_seconds is longer than the dev agent's, so neither was restarted at or after the dev restart. It exits non-zero when either agent is unreachable or reports a shorter uptime. Read-only."
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: |-
          dev="$(ssh "$DEPLOY_PROBE_HOST" "curl -sf http://localhost:8098/health" | python3 -c 'import json,sys;print(int(json.load(sys.stdin)["uptime_seconds"]))')" && for host in "$STABILITY_PROBE_HOST" "$PROD_PROBE_HOST"; do ssh "$host" "curl -sf http://localhost:8098/health" | python3 -c 'import json,sys;assert int(json.load(sys.stdin)["uptime_seconds"])>int(sys.argv[1])' "$dev" || exit 1; done
        cwd: .
