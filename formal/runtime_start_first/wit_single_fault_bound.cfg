\* Bounds as Install.cfg (MaxAgentCrash 2) but WBound 6, the design's one-fault formula: two faults breach it.
\* A finding on A2 (cumulative downtime): the bound is WMax + RB + RF + MaxAgentCrash * (W + G).
CONSTANTS
    Runtimes = {0, 1}
    HttpOn = FALSE
    BusOn = TRUE
    InstallOn = TRUE
    MaxRedeploy = 0
    LogLen = 2
    MaxCrash = 1
    MaxRevoke = 0
    MaxAgentCrash = 2
    WMax = 2
    RB = 1
    RF = 1
    W = 1
    G = 1
    WBound = 6
    ClockMax = 10
    MUT = "none"

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WindowBounded
    AtMostOneConsuming
    NoSkip
    ReplayOnlyX2
