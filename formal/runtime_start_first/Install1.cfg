\* Bounds: legacy and N, LogLen 3, MaxCrash 2, MaxAgentCrash 1; WMax 2, RB 1, RF 1, W 1, G 1.
\* WBound 6 = WMax + RB + RF + W + G: the design's bound for one agent fault.
\* One partition only: bounded evidence, no cutoff or multi-partition claim.
\* ClockMax 16 leaves the first possible bound breach (WBound + 1) reachable.
CONSTANTS
    Runtimes = {0, 1}
    HttpOn = FALSE
    BusOn = TRUE
    InstallOn = TRUE
    MaxRedeploy = 0
    LogLen = 3
    MaxCrash = 2
    MaxRevoke = 0
    MaxAgentCrash = 1
    WMax = 2
    RB = 1
    RF = 1
    W = 1
    G = 1
    WBound = 6
    ClockMax = 16
    MUT = "none"

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WindowBounded
    AtMostOneConsuming
    NoSkip
    ReplayOnlyX2
