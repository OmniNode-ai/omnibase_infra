\* OMN-19421 TLC configuration: MC_guard_in_callers_agent_only (safety; no hand writers, so only the deploy agent latency path remains)
\* One tick is 10 minutes. Probe window at tick 5; blackout [5 - Guard, 5 + ProbeDur].
CONSTANTS
    MaxT = 10
    Windows = {5}
    Guard = 1
    ProbeDur = 1
    Ceiling = 2
    MaxMut = 3
    MaxRel = 1
    MaxMerge = 1
    MaxHand = 1
    HandProjects = {}
    UseLock = TRUE
    GuardAtLock = FALSE
    Reaper = TRUE
    ReaperChecksReceipt = TRUE
    NoOpShortCircuit = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoOverlap
    NoWindowCollision
    AtMostOneReceipt
    RolledBackNeverGreen
