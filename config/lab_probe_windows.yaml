    repo: omnibase_infra
    workflow: .github/workflows/provider-rung-canary.yml
    cron: ['47 2,8,14,20 * * *']
    lane: dev
    lane_source: job_name
    max_duration_minutes: 10
  - id: C13
    name: customer-local delegation
    repo: omninode_infra
    workflow: .github/workflows/c13-customer-local-delegation.yml
    cron: ['29 4,16 * * *']
    lane: omnipc2-customer
    lane_source: runs_on
    max_duration_minutes: 45
  - id: C14
    name: customer-local routing
    repo: omninode_infra
    workflow: .github/workflows/c14-customer-local-routing.yml
    cron: ['41 5,17 * * *']
    lane: omnipc2-customer
    lane_source: runs_on
    max_duration_minutes: 30
  - id: C29
    name: customer own-key delegation
    repo: omninode_infra
    workflow: .github/workflows/c29-customer-byo-key-delegation.yml
    cron: ['53 4,16 * * *']
    lane: omnipc2-customer
    lane_source: runs_on
    max_duration_minutes: 30
  - id: C17
    name: customer-surface verdict
    repo: omninode_infra
    workflow: .github/workflows/m4-c17-customer-surface-verdict.yml
    cron: ['29 1,7,13,19 * * *']
    lane: none
    lane_source: none
    reads: >-
      the published packages and customer guides, installed into a fresh container on the trusted CI fleet; no lab lane
    max_duration_minutes: 30
  - id: D11
    name: delegation regression
    repo: omnimarket
    workflow: .github/workflows/delegation-regression-nightly.yml
    cron: ['30 7 * * *']
    lane: stability-test
    lane_source: run_name
    max_duration_minutes: 70
  - id: release-train
    name: release train
    repo: omnibase_infra
    workflow: .github/workflows/release-train-nightly.yml
    cron: ['11 7 * * *']
    lane: none
    lane_source: none
    reads: >-
      the lab-pass receipts config/release_train_policy.yaml names as each repository's cut premise (compose-dev for omnibase_infra and omnimarket); it touches no lane itself
    max_duration_minutes: 50
