#
# OMN-19451 -- the delegation-health check on runtime PRs.
#
# `sources` are the recurring measurements the check reads, each through the
# workflow-verdict reader in scripts/ci/lab_pass_receipt.py (OMN-18866).
# `repos` is the per-repository rollout state. A repository is in SHADOW while
# `required` is false: the check runs and reports but is registered nowhere as a
# required context. `required: true` is legal only once `shadow_started_at` is
# at least `shadow_days_required` days old (AC3), and only omnibase_infra's
# CI Summary registration can make it required;
# scripts/ci/delegation_health_check.py `validate_rollout` is the falsifier.
shadow_days_required: 7
sources:
  - name: delegation-regression-nightly
    repo: OmniNode-ai/omnimarket
    workflow: delegation-regression-nightly.yml
    branch: dev
    max_age_hours: 26
    events: [schedule, workflow_dispatch]
    dispatch_title_contains: "lane=stability-test"
  - name: m4-customer-pass-verdict
    repo: OmniNode-ai/omninode_infra
    workflow: m4-customer-pass-verdict.yml
    branch: dev
    max_age_hours: 8
    events: [schedule]
  - name: m4-c17-customer-surface-verdict
    repo: OmniNode-ai/omninode_infra
    workflow: m4-c17-customer-surface-verdict.yml
    branch: dev
    max_age_hours: 8
    events: [schedule]
repos:
  omnibase_infra:
    shadow_started_at: "2026-09-29"
    required: false
  omnimarket:
    shadow_started_at: "2026-09-29"
    required: false
