# OMN-21891 (one-runtime plan task T1): the services a compose stack may hold.
#
# Read by tests/unit/validation/test_checker_stack_shape.py, which hands it to omnibase_core's
# stack-shape validator. Every service of every compose file matched by compose_files is the
# runtime, a dependency, a one-shot or a baseline entry, and the runtime service runs one
# replica. Nothing else is allowed.
#
# No lane or compose file is named here. The compose files are found by the glob below, so a
# new docker/docker-compose*.yml is judged the day it appears; a file that is not a runtime
# stack is listed under not_a_stack. A '*' in one_shots or in a baseline service is a
# shell-style pattern over the service name (a one-shot pattern admits only a service that
# declares restart: no).
#
# The baseline holds the services that predate the check and only shrinks. An entry names a
# service and the number of compose files that declare it today, so a copy of the service in
# one more file is refused as well as a new service. Fold the service into the runtime (or
# declare it a dependency or one-shot), then lower the count or delete the entry. A count
# above or below what the files hold fails, an entry absent from the merge base fails, and a
# count above the merge base's fails, so a baseline cannot be grown to admit a service. Each
# entry names the ticket that removes it.
runtime:
  services:
    - omninode-runtime
  max_replicas: 1
dependencies:
  - infisical
  - keycloak
  - omnibase-infra-memgraph
  - phoenix
  - postgres
  - redpanda
  - valkey
one_shots:
  - cloud-migration
  - cloud-migration-files
  - forward-migration
  - intelligence-migration
  - migration-gate
  - redpanda-partition-cap
  - redpanda-sasl-enable
  - redpanda-scram-user
  - redpanda-settings
  - "*-labwork-user"
  - "*-sasl-enable"
  - "*-scram-user"
  - "*-topics"
compose_files: docker/docker-compose*.yml
not_a_stack:
  - docker/docker-compose.dns-cache.yml
  - docker/docker-compose.gate-runner.yml
  - docker/docker-compose.gateway-attach-test-lane.yml
  - docker/docker-compose.gateway.yml
  - docker/docker-compose.model-review-canary.yml
  - docker/docker-compose.principal-issuer.yml
  - docker/docker-compose.pypi-cache.yml
  - docker/docker-compose.pypi-canary.yml
  - docker/docker-compose.runners*.yml
# OMN-21924 (one-runtime plan task T27): the runtime image starts one command, and a console
# script is run by a lane, is developer-only, or is refused. image_commands lists the first
# token of every entrypoint or command a runtime service may set (a runtime service that sets
# neither starts the image's CMD, which docker/Dockerfile.runtime declares). A console script
# of console_scripts_file's [project.scripts] that is on neither list below fails the check, so
# a new `python -m` entry point cannot arrive beside the node that should carry it. Every reason
# names the compose file or lane that runs the command, or states that none does (grep over
# docker/, scripts/, the .github workflows, the lane-mirror deploy overlay and the lane census
# manifest; recorded in the pull request body).
image_commands:
  - command: onex-runtime
    reason: the image's start command (CMD in docker/Dockerfile.runtime); every omninode-runtime service of every lane runs it
console_scripts_file: pyproject.toml
console_scripts_allowed:
  - name: onex-runtime
    reason: run by every lane's omninode-runtime service (the image CMD in docker/Dockerfile.runtime)
  - name: onex-gateway-forwarder
    reason: T26 decides keep or fold; today the lane-mirror forwarder runs it (docker/docker-compose.gateway.yml and the lane-mirror deploy overlay)
  - name: onex-gateway-canary-probe
    reason: run by the lane-mirror forwarder's healthcheck (docker/docker-compose.gateway.yml); follows the forwarder's T26 decision
developer_only:
  - name: omni-infra
    reason: no compose file, Dockerfile, deploy overlay, workflow or lane manifest runs it
  - name: onex-action-authorization-claim
    reason: no compose file, Dockerfile, deploy overlay, workflow or lane manifest runs it
  - name: onex-git-hook-relay
    reason: installed into a developer clone's git hooks by scripts/install-git-hooks.sh; no lane runs it
  - name: onex-infra-test
    reason: entry point omnibase_infra.cli.infra_test; no compose file, Dockerfile, deploy overlay, workflow or lane manifest runs it
  - name: onex-linear-relay
    reason: no compose file, Dockerfile, deploy overlay, workflow or lane manifest runs it
  - name: onex-status
    reason: entry point omnibase_infra.tui; no compose file, Dockerfile, deploy overlay, workflow or lane manifest runs it
  - name: verify-container-manifest
    reason: no compose file, Dockerfile, deploy overlay, workflow or lane manifest runs it
