# OMN-21891 (one-runtime plan task T1): the services a compose stack may hold.
#
# Read by tests/unit/validation/test_checker_stack_shape.py, which hands it to omnibase_core's
# stack-shape validator. Every service of every compose file matched by compose_files is the
# runtime, a dependency, a one-shot or a baseline entry, and the runtime service runs one
# replica. Nothing else is allowed.
#
# The service-shape policy names no lane or compose file. The glob below finds them, so a
# new docker/docker-compose*.yml is judged the day it appears; a file that is not a runtime
# stack is listed under not_a_stack. Command-only sources are declared separately below.
# A '*' in one_shots or in a baseline service is a shell-style pattern over the service name (a one-shot pattern admits only a service that
# declares restart: no).
#
# The baseline holds the services that predate the check and only shrinks. An entry names a
# service and the number of compose files that declare it today, so a copy of the service in
# one more file is refused as well as a new service. Fold the service into the runtime (or
# declare it a dependency or one-shot), then lower the count or delete the entry. A count
# above or below what the files hold fails, an entry absent from the merge base fails, and a
# count above the merge base's fails, so a baseline cannot be grown to admit a service. Each
# entry names the ticket that removes it.
runtime:
  services:
    - omninode-runtime
  max_replicas: 1
dependencies:
  - infisical
  - keycloak
  - omnibase-infra-memgraph
  - phoenix
  - postgres
  - redpanda
  - valkey
# OMN-22393 (one-runtime plan task T26): a service the runtime cannot carry, kept outside it. An
# entry names the service, the compose files that may declare it (each must declare it, and the
# service is refused in any other judged file), the ticket and a non-empty reason that names the
# second bus connection or failure domain the runtime lacks. The entry only grows by an operator
# decision; folding the service into the runtime deletes it.
kept_outside_runtime:
  - service: gateway-forwarder
    files:
      - docker/docker-compose.gateway.yml
    ticket: OMN-22393
    reason: >-
      T26 decision: KEEP outside the runtime. onex-gateway-forwarder needs a second bus connection the runtime does not provide. The runtime's container resolves exactly one event bus (service_kernel registers one ProtocolEventBusPublisher and one ProtocolEventBusSubscriber), while the forwarder opens its own KafkaTransport to every other broker it bridges: the cloud MSK leg, authenticated with IAM credentials from a credential process behind a TPM-held key on the edge host, and the lane_mirror_buses legs, authenticated with the SASL principal of an operator-mounted lane-credential map. Only the lane-mirror source leg folds (OMN-21950 lets it read the container's bus); the destination legs do not. It is also a separate failure domain: docker-compose.gateway.yml holds the forwarder and its DNS sidecar beside no runtime, so a broker outage on a bridged leg ends this process and never stalls a runtime's own bus. The laptop catalog service lane-mirror-forwarder runs the same entry point for the same reason. Revisit when the runtime can bind named additional buses from a contract.
one_shots:
  - cloud-migration
  - cloud-migration-files
  - forward-migration
  - intelligence-migration
  - migration-gate
  - redpanda-partition-cap
  - redpanda-sasl-enable
  - redpanda-scram-user
  - redpanda-settings
  - "*-labwork-user"
  - "*-sasl-enable"
  - "*-scram-user"
  - "*-topics"
compose_files: docker/docker-compose*.yml
not_a_stack:
  # OMN-22162 (T18f): the cost estimator page on the .51 report host, one tailnet-bound container beside no
  # runtime, no broker and no database. The dev lane's own cost-estimator-web stays judged and baselined below
  # until it leaves docker/docker-compose.dev-lane.yml.
  - docker/docker-compose.cost-estimator-web.yml
  - docker/docker-compose.dns-cache.yml
  - docker/docker-compose.gate-runner.yml
  - docker/docker-compose.gateway-attach-test-lane.yml
  - docker/docker-compose.gateway.yml
  - docker/docker-compose.model-review-canary.yml
  - docker/docker-compose.principal-issuer.yml
  - docker/docker-compose.pypi-cache.yml
  - docker/docker-compose.pypi-canary.yml
  - docker/docker-compose.runners*.yml
# Commands extend the same gate. Exact argv fingerprints are SHA256 of compact,
# ASCII JSON argv arrays; the full command and entrypoint remain in compose.
# Service identities may use sha256:<SHA256 of the service name> to keep
# deployment identifiers out of public policy. Matching remains exact.
# Legacy command budgets share T1 service ownership and only shrink against base.
allowed_commands:
  - argv:
      - onex-runtime
    match: executable
    field: command
    services: []
    reason: The one-runtime kernel carries all in-process nodes.
  - argv:
      - onex-gateway-forwarder
    match: executable
    field: command
    services:
      - gateway-forwarder
    reason: T26 retains the standalone lane-mirror transport bridge between separately credentialed brokers.
  - match: exact
    field: command
    services:
      - omnibase-infra-memgraph
    reason: Declared dependency or one-shot command; this grants no runtime sidecar executable.
