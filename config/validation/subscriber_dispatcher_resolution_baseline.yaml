# OMN-16939 — frozen burn-down baseline for the subscriber-dispatcher-resolution ratchet.
#
# INVARIANT (omnibase_infra.validators.subscriber_dispatcher_resolution):
#   every declared event_bus.subscribe_topic MUST resolve to a REGISTERED DISPATCHER for
#   that topic's own real (category, message type). A topic that does not resolve is
#   consumed, DLQ'd and COMMITTED on every message — the consumer group reads Stable /
#   MEMBERS 1 / LAG 0 forever while 100% of the traffic is lost, because the offset
#   advances after DLQ-routing so lag can never rise.
#
#   Live-proven 2026-08-29 on the .201 dev lane: node_pr_lifecycle_state_reducer took
#   174 messages in and DLQ'd 174 over six hours on pr-lifecycle-fix-completed, and
#   delegation-escalation-triggered was DLQ'ing at 128 per 40 minutes.
#
# REASON CODES
#   no_route                 no handler_routing entry is assigned the topic by
#                            _topics_for_handler_entry, so zero routes exist for it.
#   category_mismatch        a route exists but was stamped with a category that differs
#                            from the topic's real one (the OMN-14605 mechanism: the
#                            category is derived ONCE per entry, falling back to
#                            subscribe_topics[0], then stamped on every route).
#   message_type_unindexed   category agrees but the dispatcher is not indexed under the
#                            topic's message type.
#
# THIS IS A RATCHET, NOT AN EXEMPTION. It is SHRINK-ONLY:
#   * a (contract, topic) NOT listed here that fails to resolve   -> FAIL (no new
#     instances, ever);
#   * a (contract, topic) listed here that now resolves           -> FAIL until removed
#     (a fixed entry still listed is STALE = FAIL, so the list cannot rot).
#
# FIX SHAPE: give the topic a per-topic `topic_match` entry carrying an explicit
# `message_category:` (plus an `event_model:` where several topics share one handler).
# Setting `topic:` ALONE IS NOT ENOUGH — the category still falls back to
# subscribe_topics[0]. node_swarm_subtask_state_reducer had the full per-topic split with
# per-topic event_models and was still 100% NO_DISPATCHER on all four of its event topics
# until the category was declared. `topic:` picks WHICH topic an entry owns;
# `message_category:` picks which category it registers under. They are independent.
#
# SCOPE: omnibase_infra (src/omnibase_infra). omnimarket carries its own baseline at the
# same path in that repo — the OMN-14605 mixed-category gate was omnibase_infra-scoped and
# its "Lane B" fan-out to the other repos never landed, which is exactly why both of the
# OMN-16939 live victims (omnimarket) went unseen. This ratchet ships in BOTH repos in the
# same change so that gap cannot reopen.
#
# Burn-down under OMN-16939. End state is an empty list.
