# Migration class declarations (OMN-19344; unified verification plan row R7, rule RB).
#
# One entry per forward migration the lane runners apply -- the flat stream
# (forward/*.sql), every vendored node stream (forward/nodes/<node>/*.sql) and
# the intelligence stream (intelligence/*.sql) -- keyed by its path relative to
# docker/migrations. Applied migration bytes are immutable (OMN-16705), so the
# class lives here, beside the SQL, never inside it.
#
#   expand-only   additive and backward-compatible with older code: new tables,
#                 nullable or defaulted columns, new indexes and views, grants,
#                 comments, seed inserts. Never a rollback barrier.
#   forward-only  anything else. A rollback barrier (rule RB-2) unless a PASS lab
#                 execution of its paired down-migration is recorded in
#                 config/migration_down_executions.yaml.
#   contract      the destructive half of an expand/contract pair. A barrier
#                 exactly like forward-only.
#
# scripts/validation/check_migration_class.py (CI: Node Migration Declaration
# Check; pre-commit: onex-check-migration-class) refuses an undeclared file, a
# stale entry, and a destructive statement declared expand-only. It is
# conservative: dynamic SQL, CREATE OR REPLACE, any UPDATE/DELETE, and any ALTER
# of a table the same file did not create are findings. Declaring forward-only
# for an additive file is always allowed and costs only rollback eligibility.
#
# The initial classification (2026-09-24) is the checker's own reading of each
# file; each forward-only entry's trailing comment names what it found.
# `check_migration_class.py --suggest` prints that reading for undeclared files.
