# OMN-18205, 2026-09-12: THE EXCLUSION ABOVE RESTS ON PRE-FIX EVIDENCE, and
# this entry is the correction. The 5-of-5 self-hosted failures of "Customer
# Path Boundary (OMN-18012)" recorded above all predate commit
# 761a786432a87872029519e6629103161fd35397 (#3286), which merged at
# 2026-09-07T15:03:14Z and taught the harness to resolve the Docker host
# address, to use it for BOTH the advertised broker address and the bootstrap
# string, and to prove readiness on the client path. This repository's shadow
# had already been reverted to hosted at 12:57:48Z that day -- two hours and
# six minutes earlier -- so the fixed harness has never once executed on a
# fleet runner. "The gate fails on the fleet" was true of the harness as it
# stood on the morning of 2026-09-07 and has been unverified since that
# afternoon.
#
# The containerized-runner premise itself is confirmed and unchanged: read
# live on 2026-09-12T00:5xZ, omninode-runner-1 is a Docker container with
# /var/run/docker.sock bind-mounted and NetworkMode docker_default. So a
# sibling broker container starts fine from a fleet runner; only the ADDRESS
# the test process used to reach it was ever wrong. That is also why the
# counter-case in the plan of record -- a broker-container test that ran to
# completion on runner 84 on 2026-09-07 -- is not a contradiction.
#
# What this ticket changes here, and what it deliberately does not. It does
# NOT flip a variable; it removes the reason a flip has to move a
# container-backed gate in the same write. The six docker-EXECUTING jobs in
# this repository that read the trusted seam were re-pointed at
# docker_ci_runner_variable below (five of them) or pinned hosted and
# allowlisted (the ECR push), so the trusted seam now governs a hermetic
# population only. Live census, 2026-09-12, of jobs whose steps actually
# invoke docker: 7 already on the docker seam, 6 on the trusted seam, 3
# pinned hosted. The six were customer-path-boundary and integration-guard in
# ci.yml, integration-tests in nightly-integration.yml, boot in
# reusable-runtime-boot.yml, runner-image-build-smoke.yml, and the ECR push
# in build-and-push-migrate-image.yml.
#
# PROOF OBLIGATION BEFORE THE DOCKER SEAM IS FLIPPED ON THIS REPOSITORY: a
# fleet run of the boundary gate with the fixed harness, green, on a named
# fleet runner. Until that exists the docker seam stays hosted, which is its
# value today, and the exclusion above stands -- on the new evidence rather
# than the stale evidence.

# OMN-18205: a THIRD routing scope, undeclared until now. Both of the variables
# below exist live and neither appeared in the rule-14 list, in the plan of
# record's eight-scope enumeration, or in any audit surface -- so an edit to
# either was invisible drift. Enumerated live 2026-09-12T01:0xZ across the org
# and all eleven repositories: OMNI_DOCKER_CI_RUNS_ON_JSON is set on
# omnibase_infra only; OMNI_SECURITY_SCAN_RUNS_ON_JSON is set on omnibase_infra
# and omniclaude. Neither exists at org scope, so on every other repository the
# expression falls through to the trusted seam, which is the intended state.
#
# The precedence is the point: a job reading `vars.OMNI_DOCKER_CI_RUNS_ON_JSON
# || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || <literal>` is governed by the narrower
# variable when it is set and by the seam when it is not. That is what lets a
# lane move the hermetic bulk of CI to the fleet in one write and leave every
# container-backed job where it is, instead of the all-or-nothing flip that was
# reverted twice.
docker_ci_runner_variable:
  name: OMNI_DOCKER_CI_RUNS_ON_JSON
  expected_json: '["ubuntu-latest"]'
  # Consumed by audit_scoped_variables. `repositories` is the closed set of repos
  # that MUST carry this shadow at expected_json; every other audited repo MUST
  # NOT carry it at all. That second half is the drift this pass exists to catch:
  # a new shadow appearing where none is declared is exactly the invisible edit
  # that had no surface before OMN-18205. `org_scope: absent` asserts there is no
  # organization-level value, so one appearing is also a finding.
  repositories:
    - omnibase_infra
  org_scope: absent
  revert_when: >-
    This value may go to '["self-hosted","omnibase-ci"]' only after a fleet run of "Customer Path Boundary (OMN-18012)" with the post-#3286 harness reports success on a named omninode-runner-*. Revert it if any docker-executing job reports a container it cannot reach from the test process, which is the 2026-09-07 signature, or if a registry push appears among the jobs it governs -- registry pushes are pinned hosted, not routed.
cloud_canary_runner_variable:
  name: OMNI_CLOUD_CANARY_RUNS_ON_JSON
  # OMN-18291, 2026-09-13. THE FIRST ROUTING VARIABLE IN THIS ESTATE THAT POINTS
  # AT THE AWS CLOUD FLEET, and the narrowest one: it governs exactly ONE job
  # class, `rebuilt-postgres16-proof` in
  # .github/workflows/application-acl-postgres16-proof.yml, and it is read
  # AHEAD of the docker seam so that flipping it moves that job and nothing
  # else.
  #
  # WHY NOT THE DOCKER SEAM, which is the surface a reader would reach for
  # first. That variable governs FIFTEEN job definitions in this repository,
  # measured from each job's parsed runs-on on dev rather than from a file
  # grep. Several of them run on every pull request and one, "Customer Path
  # Boundary (OMN-18012)", feeds the required CI Summary umbrella. The cloud
  # fleet's maximum is FOUR ephemeral instances, each of which runs exactly one
  # job and then terminates, and a boot costs minutes. Pointing fifteen job
  # definitions at four single-job instances is not a canary; it is the
  # saturation failure recorded in the trusted-seam entry above, repeated on a
  # twentieth of the capacity. So the docker seam is left exactly where it is
  # and the canary gets a variable of its own.
  #
  # WHY THIS JOB CLASS. It is a real job on a normal trigger, not a synthetic
  # probe: it runs `docker compose up --build` against PostgreSQL 16 and proves
  # an ACL matrix and its rollback. It is genuinely container-backed, which is
  # the one capability this fleet has that the lab fleet does not -- a lab
  # runner is itself a container reaching a shared daemon through a mounted
  # socket, so a published port lands on the Docker host rather than the
  # runner's own localhost. Its trigger is path-filtered rather than
  # every-pull-request, it appears in no required-context list and in no
  # EXPECTED_EXTERNAL_CONTEXTS tuple, and its fork guard already sends fork
  # pull requests to hosted runners.
  #
  # THE HONEST COST, stated rather than left for someone to discover. This
  # repository is PUBLIC, so its GitHub-hosted minutes are free and a cloud
  # instance is not. This flip therefore costs money where the omnibase_core
  # move recorded above saved it. That is accepted deliberately: the purpose is
  # to prove the scale-up trigger and the routing path end to end on a real job
  # with a small blast radius, not to save minutes on this particular job. The
  # repositories where the fleet would pay for itself are the PRIVATE ones the
  # runner group grants, and moving one of those is a separate claim with its
  # own capacity measurement.
  #
  # WHAT THE FIRST REAL ROUTED RUN FOUND, recorded here rather than only in the
  # ticket, because it is the second instance of a class that has now forced one
  # routing revert and nearly forced a second. Run 34750171624, instance
  # i-03f7450c38317c468: the job landed on the fleet correctly, proved its own
  # placement from the instance metadata service, ran `docker info` green
  # against a healthy LOCAL daemon -- and then exited 125 on `docker compose`,
  # because Amazon Linux 2023's `docker` package ships buildx as its only CLI
  # plugin and compose was simply not a command. Fifty milliseconds separate the
  # healthy daemon from the missing plugin in that log, and the CLI answers a
  # missing plugin by printing its usage text, so the failure reads as neither
  # "not found" nor a daemon error.
  #
  # THE GENERAL RULE, which is the part worth carrying forward: a routing change
  # is not finished when the variable is set and the job lands. It is finished
  # when a real job OF THAT CLASS has run to completion there. Placement and
  # capability are different claims, and a green placement proof next to a red
  # job is exactly what the difference looks like. Fixed by installing the
  # plugin in the fleet's own bootstrap, pinned by version and verified by
  # digest (omninode_infra, OMN-18291), not by narrowing this job.
  #
  # AND THEN THE SAME CLASS AGAIN, one line further on. Run 34750597454,
  # instance i-0b7b99b0fb129eb15: compose now existed and teardown passed, and
  # the build stopped with "compose build requires buildx 0.17.0 or later". The
  # distribution DOES ship a buildx plugin, so every presence check passes and
  # `docker info` lists one -- it is 0.12.1. A tool that is present and too old
  # is invisible to a check that asks whether the tool is there, which is why
  # the only check that found either gap was running the real job. Both plugins
  # are now installed from pinned, digest-verified release binaries and the boot
  # asserts both before the instance registers.
  #
  # AND A THIRD, which is the one worth reading if you only read one. Run
  # 34751054047, instance i-0298a739880307693: the image built, both containers
  # started, PostgreSQL 16 initialised cleanly -- and the seed failed with
  # "Permission denied" on a file the build had just copied in. Cause: the boot
  # script sets a restrictive umask for credential hygiene, a umask is
  # inherited, and it reached the runner process, so every checked-out file
  # landed mode 0600. `COPY` preserves that faithfully, and any image that drops
  # to a non-root user then cannot read what it was given. The official
  # PostgreSQL image does exactly that.
  #
  # Blast radius: every container-backed job that copies a checked-out file into
  # an image running as anything but root, which is most of them. Hosted runners
  # use the ordinary mask, so a job that has only ever run hosted cannot have
  # seen it. Fixed by running the job under the ordinary mask while the boot
  # script's own credential handling keeps the restrictive one.
  #
  # Three capability gaps, none visible offline, all found by one real job of
  # one real class. That is the argument for a canary of exactly this shape.
  expected_json: '["self-hosted","omni-cloud-ci"]'
  repositories:
    - omnibase_infra
  org_scope: absent
  revert_when: >-
    Revert to '["ubuntu-latest"]' if the routed job lands on the fleet and fails for a fleet-caused reason -- a container it cannot reach from the test process, a missing tool on the runner image, or a boot that never produces a runner -- or if the job is ever observed QUEUED rather than running, which means the capacity trigger did not fire. Revert also if this job class is ever added to a required-context list or to EXPECTED_EXTERNAL_CONTEXTS, because its blast radius is then no longer small. Widening this variable to a second job class is NOT a revert condition, it is a new claim: the group's maximum is four ephemeral single-job instances and a second class needs its own capacity measurement first.
security_scan_runner_variable:
  name: OMNI_SECURITY_SCAN_RUNS_ON_JSON
  expected_json: '["ubuntu-latest"]'
  repositories:
    - omnibase_infra
    - omniclaude
  org_scope: absent
  revert_when: >-
    Declared for visibility, not for movement. Nothing in OMN-18205 flips it. A security scan that resolves through the fleet shares fate with the host it scans, so it stays hosted until a separate claim argues otherwise.
omninode_infra_fleet_runner_variable:
  name: OMNI_INFRA_FLEET_RUNS_ON_JSON
  # OMN-18205 phase 3 (cloud-ci-phase3, 2026-09-12). omninode_infra#1390 moves
  # 40 of that repository's hardcoded-fleet job definitions onto this
  # DEDICATED variable rather than pointing them at OMNI_TRUSTED_CI_RUNS_ON_JSON
  # above. Standing up a repo-scoped trusted-seam shadow for these 40 jobs
  # would couple their placement to any future org- or repo-scope flip of that
  # seam -- including the two lab-kubeconfig-bound jobs and the
  # AWS-role-bearing jobs #1390 documents as never allowed to move
