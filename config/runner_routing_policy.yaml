trusted_runner_variable:
  name: OMNI_TRUSTED_CI_RUNS_ON_JSON
  # OMN-16682: the trusted-CI seam was deliberately re-flipped to GitHub-hosted
  # runners at org scope and at all five repo shadows on 2026-08-27T04:36:53-56Z.
  # This value is the ASSERTED intended state, so it must track that flip --
  # while it read '["self-hosted","omnibase-ci"]' the hourly audit reported six
  # drift findings (org + each repo) on every run. That is not a benign red: the
  # audit exits non-zero on the first finding set, so its OTHER surfaces --
  # notably the local-workflow hosted-runner allowlist that carries the
  # OMN-16683 fork-isolation entries -- were reported against a job that was
  # already failing, and real new drift there would not have changed the signal.
  #
  # Jobs that must NOT follow this seam onto hosted runners do not read this
  # variable at all: the OCC autobind/companion-effect publishers read the
  # dedicated OMNI_OCC_AUTOBIND_RUNS_ON_JSON knob with a literal
  # '["self-hosted","omnibase-ci"]' fallback (OMN-16691), because they publish to
  # the tailnet-only dev-lane broker that only the self-hosted fleet can reach.
  #
  # OMN-17888 adds the second such carve-out: runtime-rebuild-trigger.yml reads
  # OMNI_RUNTIME_REBUILD_RUNS_ON_JSON on the same terms. It publishes the
  # post-merge redeploy-start command to that same tailnet-only dev-lane broker,
  # and it had been reading the seam above -- so the 2026-08-26 flip relocated it
  # onto GitHub-hosted compute, where librdkafka cannot resolve the bootstrap
  # name. Every run since that had a runtime change to publish failed; dev-lane
  # auto-redeploy delivered nothing for ten days. BOTH dedicated knobs are meant
  # to stay UNSET so the self-hosted literal operates; neither is audited above,
  # because an unset variable is the intended state and a set one is the defect.
  expected_json: '["ubuntu-latest"]'
  # OMN-18031: expected_json above is the ORG assertion and the default for every
  # repo shadow. repository_overrides declares a shadow that is deliberately
  # different, so the hourly audit can tell an authorized per-repo divergence
  # from the silent drift it exists to catch. An override is not a hole: the
  # audit holds the repo to the override value, still judges the org value on
  # expected_json above, refuses an override with no revert_when, and reports a
  # repo that declares an override but carries no shadow at all (it would
  # silently inherit the org value -- the "the flip looked successful because the
  # org readback was correct" trap in rule 14).
  #
  # It is EMPTY today, deliberately. On 2026-09-07T12:04:30-31Z the omnimarket
  # and omnibase_infra shadows were flipped to '["self-hosted","omnibase-ci"]' as
  # authorized interim load-balancing relief (78 hosted runs queued across the two
  # repos while all 30 runners in the omnibase-ci group were online and zero were
  # busy). It was REVERTED 53 minutes later at 12:57:48Z on measured harm: the
  # required gate "Customer Path Boundary (OMN-18012)" cannot bootstrap its Kafka
  # testcontainer on the fleet -- the runners are themselves containers on a
  # shared Docker daemon, so a mapped container port is not reachable on the
  # runner's own localhost. Clean A/B on omnibase_infra ci.yml, same job: 5 of 5
  # pre-flip runs SUCCESS on ubuntu-latest, 5 of 5 post-flip runs FAILURE on
  # self-hosted, the first of them 71 seconds after the flip; reproduced on
  # omnimarket run 34122888401. Before any future flip of this seam, that gate
  # (and every other testcontainer-backed gate) needs a hosted class of its own.
  #
  # OMN-18031 phase 5, 2026-09-11T21:12:33Z: two shadows below are now DECLARED
  # divergences rather than drift. Authority is the operator ruling of
  # 2026-09-11 ~21:07Z, "Yes we should move things back to the lab as
  # necessary", and the phase-0 gate it answers is met. Measured immediately
  # before the write: 279 jobs sat queued across six repositories, every one of
  # them carrying `ubuntu-latest` with no runner assigned and the longest
  # waiting 18 minutes, while 70 of the 88 runners in this group were online
  # and idle. That is runner availability, not concurrency-group
  # serialisation -- a job blocked on `needs:` is not reported queued with a
  # started_at, and all 279 carried one.
  #
  # The exclusions are the substance of this entry. omnimarket and
  # omnibase_infra are deliberately NOT flipped: the required gate named in the
  # A/B above, "Customer Path Boundary (OMN-18012)", resolves its runs-on
  # through this very seam in BOTH repositories (omnimarket ci.yml, and this
  # repo's ci.yml) and docker-pulls redpandadata/redpanda with
  # OMN18012_REQUIRE_HARNESS=1 set so a missing daemon is red rather than a
  # green skip. Flipping either shadow re-runs the 2026-09-07 harm verbatim.
  # The org variable is not flipped either: it is inherited by omninode_infra --
  # private, carrying a live staging deploy path, and with only five
  # seam-driven job definitions, so almost no yield for a large blast radius --
  # and by omnimemory, omnidash, omnibase_spi and omnibase_compat, none of
  # which were enumerated for container exposure.
  #
  # Two shadows were flipped at 21:12:33Z. ONE WAS REVERTED 35 MINUTES LATER on
  # measured harm, and the reason is a finding worth more than the flip was.
  #
  # onex_change_control was flipped and reverted to '["ubuntu-latest"]' at
  # 2026-09-11T21:47:18Z. It is NOT in the override map below, so the audit
  # holds it to expected_json above, which is now correct again. The cause was
  # NOT the container defect and NOT runner contamination: the step "Verify
  # centralized runner routing standard", in that repo's
  # .github/workflows/omni-standards-compliance.yml, builds its forbidden-label
  # set FROM THE LIVE VALUES of OMNI_PUBLIC_PR_RUNS_ON_JSON and
  # OMNI_TRUSTED_CI_RUNS_ON_JSON, then greps .github/workflows for each label,
  # filtering out only lines that contain one of the two `fromJSON(vars...||`
  # fallback expressions. Flipping the trusted seam to self-hosted therefore
  # makes the gate hunt for the literal string "self-hosted" in its own
  # workflow directory -- and it hits exactly one line, a PROSE COMMENT at
  # release-staleness-gate.yml:52 reading "not contend for the same self-hosted
  # runners". The gate fails on a comment.
  #
  # So that repository is structurally unflippable until the gate's filter is
  # fixed, and the defect is invisible while the seam is hosted: the label set
  # is then just {ubuntu-latest}, every occurrence of which IS on a fallback
  # line. A gate that passes only because the value it guards has never been
  # exercised has not been tested. Clean A/B, same shape as the 2026-09-07
  # entry above: 59 of 59 conclusive pre-flip runs SUCCESS on hosted, 3 of 3
  # conclusive post-flip runs FAILURE on the fleet, zero fleet successes.
  #
  # omnibase_core does NOT carry that gate -- grep for its step name returns
  # nothing in that repo's workflow directory -- which is why it stays flipped
  # and is the one override declared below. It carries no `testcontainers`
  # dependency and no `docker` step in any workflow.
  #
  # RE-FLIPPED 2026-09-12T00:27:32Z, after the gate defect above was fixed.
  # onex_change_control#9140 (squash dbec685b7b0f4d0737db87c5a42a6e749f36492b)
  # moved that check out of a whole-file grep and into that repo's canonical
  # routing validator, reading the YAML-parsed runs-on value so comments, name:
  # fields and step bodies are structurally out of scope. The old error string
  # is gone from the workflow entirely; verified on origin/dev, not inferred
  # from the pull request.
  #
  # Proven before the write and again after it. BEFORE: a clean export of that
  # repo's dev tree was run through the new validator with the fleet label set
  # injected, which passed, and a POSITIVE CONTROL planting a folded-scalar
  # hard-coded self-hosted pin was caught by file, job and label -- so the pass
  # is a real gate result rather than a vacuous one. AFTER: the gate returned
  # two conclusive successes on fleet runners, runs 34662092826 on runner 82 and
  # 34661727557 on runner 68.
  #
  # One honest limit on that live proof, and its provenance corrected after a
  # peer challenged it. The matcher-fix pull request does NOT touch the workflow
  # carrying the prose comment the old check used to match: `git show --stat` on
  # that squash lists five files and that workflow is not among them. The reword
  # instead landed in an unrelated pull request at 2026-09-11T19:35Z, before this
  # flip, found with `git log -S` on the old wording.
  #
  # So the confound is real but differently sourced than first recorded, and it
  # does not disappear: replaying the OLD whole-file matcher against the current
  # integration tree flags ZERO lines for either fleet label, which means a green
  # gate there is consistent with both the fix and the reword. What the
  # correction removes is the wrong attribution, not the limit.
  #
  # The basis for confidence is therefore the injected-pin control rather than
  # the green gate: a folded-scalar hard-coded fleet label planted in a job's
  # runs-on was reported by file, job and label, which exercises the new logic
  # directly and cannot be satisfied by a reworded comment.
  #
  # THE COST, measured rather than estimated. Between 21:13:15Z and 21:49:29Z
  # that gate failed 5 runs across 5 branches -- 3 OCC companion branches and 2
  # product branches inside that repo -- and because it feeds the required
  # summary check, no companion could merge, which blocks product PRs
  # fleet-wide. Window from first failure start to first pass after the revert:
  # 36m14s. One of the blocked companions was this very pull request's, so the
  # flip blocked its own paperwork.
  #
  # omnibase_core was checked for the same gate rather than assumed safe, and
  # from origin/dev rather than from a local clone: its
  # omni-standards-compliance.yml contains ZERO occurrences of either the step
  # name or the error string, against exactly one of each in the other repo as
  # the positive control. It carries ~108 prose matches for the label, but
  # nothing in that repo greps for them, so they are inert. That is why it stays
  # flipped, and its jobs are executing and passing on named fleet runners.
  #
  # What the flip proved before the revert, and it is worth recording: queue
  # depth went from 279 queued jobs at 21:15Z to 0 at 21:42Z, with 76
  # onex_change_control jobs executing on named fleet runners, and fleet busy
  # count rising from 16 to 51 of 88. The mechanism works. One repository's
  # self-referential gate is what stopped it, not the fleet.
  repository_overrides:
    onex_change_control:
      expected_json: '["self-hosted","omnibase-ci"]'
      revert_when: >-
        Any job in this repository fails on the fleet for a fleet-specific reason -- a container it cannot bootstrap, a tool the runner image lacks, or disk exhaustion -- or the repository acquires a testcontainer-backed or image-building gate that reads this seam. Also revert once the hosted queue this relieves is gone: if a sustained sample shows no job-level queue wait attributable to runner availability, hosted is the cheaper default for a public repository, where hosted minutes are free.
    omnibase_core:
      expected_json: '["self-hosted","omnibase-ci"]'
      revert_when: >-
        The same three conditions as onex_change_control above. This repository additionally carries 20 job definitions pinned to a literal ubuntu-latest, which this override does not move and must not be assumed to have moved; if any of those is later switched to read the seam, re-check it for container exposure before leaving this override in place.
# OMN-18205, 2026-09-12: THE EXCLUSION ABOVE RESTS ON PRE-FIX EVIDENCE, and
# this entry is the correction. The 5-of-5 self-hosted failures of "Customer
# Path Boundary (OMN-18012)" recorded above all predate commit
# 761a786432a87872029519e6629103161fd35397 (#3286), which merged at
# 2026-09-07T15:03:14Z and taught the harness to resolve the Docker host
# address, to use it for BOTH the advertised broker address and the bootstrap
# string, and to prove readiness on the client path. This repository's shadow
# had already been reverted to hosted at 12:57:48Z that day -- two hours and
# six minutes earlier -- so the fixed harness has never once executed on a
# fleet runner. "The gate fails on the fleet" was true of the harness as it
# stood on the morning of 2026-09-07 and has been unverified since that
# afternoon.
#
# The containerized-runner premise itself is confirmed and unchanged: read
# live on 2026-09-12T00:5xZ, omninode-runner-1 is a Docker container with
# /var/run/docker.sock bind-mounted and NetworkMode docker_default. So a
# sibling broker container starts fine from a fleet runner; only the ADDRESS
# the test process used to reach it was ever wrong. That is also why the
# counter-case in the plan of record -- a broker-container test that ran to
# completion on runner 84 on 2026-09-07 -- is not a contradiction.
#
# What this ticket changes here, and what it deliberately does not. It does
# NOT flip a variable; it removes the reason a flip has to move a
# container-backed gate in the same write. The six docker-EXECUTING jobs in
# this repository that read the trusted seam were re-pointed at
# docker_ci_runner_variable below (five of them) or pinned hosted and
# allowlisted (the ECR push), so the trusted seam now governs a hermetic
# population only. Live census, 2026-09-12, of jobs whose steps actually
# invoke docker: 7 already on the docker seam, 6 on the trusted seam, 3
# pinned hosted. The six were customer-path-boundary and integration-guard in
# ci.yml, integration-tests in nightly-integration.yml, boot in
# reusable-runtime-boot.yml, runner-image-build-smoke.yml, and the ECR push
# in build-and-push-migrate-image.yml.
#
# PROOF OBLIGATION BEFORE THE DOCKER SEAM IS FLIPPED ON THIS REPOSITORY: a
# fleet run of the boundary gate with the fixed harness, green, on a named
# fleet runner. Until that exists the docker seam stays hosted, which is its
# value today, and the exclusion above stands -- on the new evidence rather
# than the stale evidence.

# OMN-18205: a THIRD routing scope, undeclared until now. Both of the variables
# below exist live and neither appeared in the rule-14 list, in the plan of
# record's eight-scope enumeration, or in any audit surface -- so an edit to
# either was invisible drift. Enumerated live 2026-09-12T01:0xZ across the org
# and all eleven repositories: OMNI_DOCKER_CI_RUNS_ON_JSON is set on
# omnibase_infra only; OMNI_SECURITY_SCAN_RUNS_ON_JSON is set on omnibase_infra
# and omniclaude. Neither exists at org scope, so on every other repository the
# expression falls through to the trusted seam, which is the intended state.
#
# The precedence is the point: a job reading `vars.OMNI_DOCKER_CI_RUNS_ON_JSON
# || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || <literal>` is governed by the narrower
# variable when it is set and by the seam when it is not. That is what lets a
# lane move the hermetic bulk of CI to the fleet in one write and leave every
# container-backed job where it is, instead of the all-or-nothing flip that was
# reverted twice.
docker_ci_runner_variable:
  name: OMNI_DOCKER_CI_RUNS_ON_JSON
  expected_json: '["ubuntu-latest"]'
  scope: omnibase_infra
  revert_when: >-
    This value may go to '["self-hosted","omnibase-ci"]' only after a fleet run of "Customer Path Boundary (OMN-18012)" with the post-#3286 harness reports success on a named omninode-runner-*. Revert it if any docker-executing job reports a container it cannot reach from the test process, which is the 2026-09-07 signature, or if a registry push appears among the jobs it governs -- registry pushes are pinned hosted, not routed.
security_scan_runner_variable:
  name: OMNI_SECURITY_SCAN_RUNS_ON_JSON
  expected_json: '["ubuntu-latest"]'
  scope: omnibase_infra, omniclaude
  revert_when: >-
    Declared for visibility, not for movement. Nothing in OMN-18205 flips it. A security scan that resolves through the fleet shares fate with the host it scans, so it stays hosted until a separate claim argues otherwise.
public_pr_runner_variable:
  name: OMNI_PUBLIC_PR_RUNS_ON_JSON
  expected_json: '["ubuntu-latest"]'
repositories:
  - omnibase_core
  - omnibase_infra
  - omniclaude
  - omnimarket
  - onex_change_control
hosted_runner_allowlist:
  - path: .github/workflows/ci.yml
    reason: "OMN-14127: CI Summary is a lightweight hosted fail-closed aggregator so required status always posts during self-hosted saturation."
  - path: .github/workflows/build-and-push-runtime.yml
    reason: "OMN-13747: ECR push remains hosted until the self-hosted egress failure is retired."
  - path: .github/workflows/build-workspace-candidate-runtime.yml
    reason: "OMN-14974: candidate runtime ECR push uses the same hosted clean-egress lane after the self-hosted daemon repeatedly stalled during upload."
  - path: .github/workflows/omnigate.yml
    reason: "Fork-only untrusted PR verification must not execute on self-hosted runners."
  - path: .github/workflows/runner-fleet-canary.yml
    reason: "OMN-13915: scheduled fleet canary must not share fate with the self-hosted runner fleet it monitors."
  - path: .github/workflows/model-review-capability-canary.yml
    reason: "OMN-17876: capability contract evidence must stay on hosted compute until separately authorized live runner selection."
  - path: .github/workflows/runner-broker-dispatch-wedge-rerun.yml
    reason: "OMN-15776: scheduled broker-dispatch-wedge rerun must not share fate with the self-hosted runner fleet it remediates -- same isolation rationale as runner-fleet-canary.yml above."
  - path: .github/workflows/pr-ci-zombie-detector.yml
    reason: "OMN-16494: scheduled PR-CI concurrency-group zombie detector -- one of its two target mechanisms is a self-hosted-runner job surviving a cancel signal, so it must not share fate with the self-hosted fleet it partly exists to unstick. Same isolation rationale as runner-fleet-canary.yml and runner-broker-dispatch-wedge-rerun.yml above."
  - path: .github/workflows/dev-candidate-delivery-liveness.yml
    reason: "OMN-16906: the dev-candidate delivery guard is a pure GitHub-REST probe that touches no lane and no tailnet host, and it must not share fate with the self-hosted fleet -- a delivery outage caused by fleet saturation is exactly the case where a self-hosted watcher would be queued behind the thing it reports on. Same isolation rationale as runner-fleet-canary.yml above."
  - path: .github/workflows/deliver-dev-candidate-to-staging.yml
    reason: "OMN-17534: the candidate-boot-gate job creates and destroys a kind cluster and side-loads a multi-gigabyte runtime image. The self-hosted omnibase-ci fleet on .201 runs the lab lanes off the same Docker daemon, so a per-candidate ephemeral cluster there would contend with -- and could disturb -- the lanes the lab depends on. The other three jobs in this workflow are unaffected: two are `uses:` calls into already-allowlisted workflows and the announce job routes through OMNI_TRUSTED_CI_RUNS_ON_JSON as before."
  - path: .github/workflows/runner-route-reusable.yml
    reason: "OMN-18031: the per-run routing decision job. It must not share fate with the fleet it routes onto -- a router queued behind a saturated fleet would decide, minutes late, that the fleet is saturated. Same isolation rationale as runner-fleet-canary.yml above. It is also the surface that enforces fork isolation (OMN-16683/16684) before any capacity signal is read, so it must be reachable on an untrusted PR, where self-hosted is prohibited outright."
  - path: .github/workflows/runner-route-probe.yml
    reason: "OMN-18031 gate P1: the live proof that `needs.<job>.outputs` resolves inside `runs-on`, for both a normal job and a reusable-workflow job. A survey of all five routing repos on 2026-09-07 found zero prior uses of that wiring (196 files carrying the seam selector were the positive control), so the assumption the whole design rests on is proven here rather than assumed. Its two `route-*` jobs and the proof gate are hosted; its two `consume-*` jobs resolve their runs-on FROM the route output and are hosted today only because the seam ceiling is hosted."
  - path: .github/workflows/dev-lane-liveness.yml
    reason: "OMN-18031: the saturation-record job is a bare ubuntu-latest by design -- the monitor must survive the saturation it reports on, the same fate-isolation rationale as runner-fleet-canary.yml above. Its sibling lab-load-probe job is deliberately self-hosted on a literal [self-hosted, omnibase-ci] and the pre-existing dev-lane-liveness job on [self-hosted, omnibase-deploy]; neither is a bare hosted runner, so this entry covers the ONE hosted job. These probes live here rather than in runner-fleet-canary.yml because tests/ci/test_dev_lane_liveness.py asserts the canary stays single-job and GitHub-hosted, and names this workflow as the home for lane/host-scoped probes."
  - path: .github/workflows/build-and-push-migrate-image.yml
    reason: "OMN-18205: the migration image build pushes to ECR, which is the workload OMN-13747 recorded as failing from the self-hosted fleet's egress path -- the same reason build-and-push-runtime.yml and build-workspace-candidate-runtime.yml above are pinned. It had been reading the trusted seam, so a routing flip would have moved a registry push onto the fleet as an unenumerated side effect. The workflow has no pull_request trigger, so its fork branch was decoration and was removed with the pin."
  - path: .github/workflows/shared-env-runner-parity.yml
    reason: "OMN-16555: the hosted half of the shared-env two-runner-class parity gate must be pinned to a literal ubuntu-latest -- routing it through OMNI_RUNNER_SELECTOR_V1 would let a var change move it back onto the fleet and void the ephemeral-runner proof. Its self-hosted half does use the standard selector."
# OMN-18031 — per-run routing thresholds for the hosted `route` job.
#
# The route job (scripts/ci/runner_route_decision.py) decides, once per run,
# between the lab fleet labels and GitHub-hosted, from live org-runner capacity
# and lab host load. The `trusted_runner_variable` above is read as a CEILING:
# routing may only ever DOWNGRADE from what the seam already allows, never
# widen. Nothing here writes any Actions variable (CLAUDE.md rule 14,
# single-owner).
#
# THE MECHANISM IS INERT AT THESE VALUES AND THAT IS DELIBERATE. With
# expected_json '["ubuntu-latest"]' the decision returns `seam_ceiling_hosted`
# on every run and placement is byte-identical to today. Flipping the seam is a
# separate single-owner claim (OMN-16682), not this ticket.
#
# Every key below is REQUIRED: the loader raises on a missing one rather than
# defaulting (CLAUDE.md rule 8), because a silently-defaulted threshold is how a
# routing gate quietly stops gating.
route:
  policy_version: 1
  runner_group: omnibase-ci
  lab_labels: ["self-hosted", "omnibase-ci"]
  hosted_labels: ["ubuntu-latest"]
  # Headroom FLOOR, not a capacity match. A measured CI fan-out in this repo is
  # ~47 jobs (run 34093238556 ran 47/47 hosted); 12 idle runners is the margin
  # below which routing stops adding load to the fleet.
  min_idle_runners: 12
  # Deliberately well below the observed peak: busy was measured swinging
  # 65 -> 42 -> 19 -> 13 -> 10 of 88 inside ~2 minutes on 2026-09-07
  # (10:22-10:24Z). A threshold near the peak would flap every run.
  max_busy_fraction: 0.80
  # A separate, LOWER trust floor than the fleet canary's own
  # RUNNER_CANARY_MAX_OFFLINE ("5" against expected_count 88): the canary asks
  # "is the fleet healthy", this asks "is it big enough to route onto at all".
  min_online_runners: 60
  # A hosted route job cannot reach the lab (the pre-push probe reaches it over
  # ssh to tailnet/RFC1918 addresses), so the lab record arrives asynchronously
  # from the saturation monitor and is freshness-bounded. Consequence, named
  # rather than hidden: the lab signal is up to 10 minutes old by construction.
  # Stale is unknown, and unknown routes hosted.
  lab_record_max_age_seconds: 600
  # COPIED VERBATIM from the pre-push picker's committed defaults --
  # PREPUSH_LOAD_THRESHOLD:-1.0 (scripts/hooks/prepush_smart_tests.sh) and
  # PREPUSH_MIN_FREE_MEM_MB:-4096 (scripts/hooks/prepush_dispatch.sh) -- so the
  # lab has ONE definition of "too loaded", shared by pre-push placement and CI
  # routing, rather than two that drift apart. Load ranks, memory ADMITS
  # (OMN-17392: a host at 0.10x load with 2.5 GiB free ranked FIRST under a
  # CPU-only picker and cost an OMN-17316 landing hours of OOM kills).
  max_lab_load_ratio: 1.0
  min_lab_free_mem_mib: 4096
  # MEASURED RESIDUAL, recorded rather than tuned away (2026-09-07, live).
  # Dry runs executed ON the lab host read it at load1 48.76 / 32 cores =
  # 1.524x with 58765 MiB free -- CPU-hot and memory-rich at the same time,
  # because that host IS the 88-container runner fleet. Four consecutive
  # samples over ~2 minutes all decided `lab_saturated` on the ratio alone.
  #
  # So the two consumers of this threshold are not asking the same question.
  # Pre-push asks "can I add a heavy test suite to this host", and 1.0x is the
  # right answer there. CI routing asks "can the fleet accept one more job",
  # and the fleet is DESIGNED to run hot -- a ratio floor calibrated for the
  # first question may refuse the lab almost always for the second.
  #
  # It is deliberately NOT loosened here. The value is copied verbatim so the
  # lab has one definition of "too loaded", and changing it is a placement
  # decision that can only be measured once the seam actually permits
  # self-hosted -- which is OMN-16682, not this ticket. Landing a looser number
  # now would be tuning against a mechanism that is inert, with no way to
  # observe whether the new value was right. Re-derive it with the seam flip,
  # against real placement, and if the two questions genuinely need two
  # numbers, split the key then rather than silently widening this one.
  # Workflows whose ROUTED jobs must stay hosted regardless of capacity.
  #
  # THIS IS DELIBERATELY NOT `hosted_runner_allowlist` ABOVE, and conflating the
  # two is a real defect that a dry run against live data caught before merge.
  # That list means "this FILE contains at least one job that is intentionally
  # bare `runs-on: ubuntu-latest`", which is why `.github/workflows/ci.yml` is
  # on it -- for the single lightweight CI Summary aggregator job. Reusing it
  # here would have pinned all 54 jobs of ci.yml hosted forever and made the
  # entire mechanism a no-op on its largest consumer, while every test still
  # passed. The two lists answer different questions and must stay separate.
  #
  # Membership here means: even once the seam permits self-hosted, this
  # workflow's routed jobs stay on GitHub-hosted compute, because something
  # other than capacity requires it -- fate-isolation from the fleet being
  # monitored, clean egress for an ECR push, or fork-only untrusted execution.
  hosted_workflows:
    - .github/workflows/runner-route-reusable.yml
    - .github/workflows/runner-route-probe.yml
    - .github/workflows/runner-fleet-canary.yml
    - .github/workflows/runner-broker-dispatch-wedge-rerun.yml
    - .github/workflows/pr-ci-zombie-detector.yml
    - .github/workflows/dev-candidate-delivery-liveness.yml
    - .github/workflows/model-review-capability-canary.yml
    - .github/workflows/omnigate.yml
    - .github/workflows/build-and-push-runtime.yml
    - .github/workflows/build-workspace-candidate-runtime.yml
