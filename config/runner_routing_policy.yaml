  # repo-scoped OMNI_TRUSTED_CI_RUNS_ON_JSON shadow on omninode_infra
  # relocated 13 already-seam-driven jobs onto the fleet mid-session, two of
  # which cannot run there (yq/kustomize absent from the fleet image), and CI
  # Summary -- a required check aggregating both -- blocked every open PR in
  # that repository for 41 minutes before the shadow's own owner reverted it
