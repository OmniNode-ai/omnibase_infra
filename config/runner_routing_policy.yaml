trusted_runner_variable:
  name: OMNI_TRUSTED_CI_RUNS_ON_JSON
  expected_json: '["self-hosted","omnibase-ci"]'
public_pr_runner_variable:
  name: OMNI_PUBLIC_PR_RUNS_ON_JSON
  expected_json: '["ubuntu-latest"]'
repositories:
  - omnibase_core
  - omnibase_infra
  - omniclaude
  - omnimarket
  - onex_change_control
hosted_runner_allowlist:
  - path: .github/workflows/ci.yml
    reason: "OMN-14127: CI Summary is a lightweight hosted fail-closed aggregator so required status always posts during self-hosted saturation."
  - path: .github/workflows/build-and-push-runtime.yml
    reason: "OMN-13747: ECR push remains hosted until the self-hosted egress failure is retired."
  - path: .github/workflows/build-workspace-candidate-runtime.yml
    reason: "OMN-14974: candidate runtime ECR push uses the same hosted clean-egress lane after the self-hosted daemon repeatedly stalled during upload."
  - path: .github/workflows/omnigate.yml
    reason: "Fork-only untrusted PR verification must not execute on self-hosted runners."
  - path: .github/workflows/runner-fleet-canary.yml
    reason: "OMN-13915: scheduled fleet canary must not share fate with the self-hosted runner fleet it monitors."
  - path: .github/workflows/runner-broker-dispatch-wedge-rerun.yml
    reason: "OMN-15776: scheduled broker-dispatch-wedge rerun must not share fate with the self-hosted runner fleet it remediates -- same isolation rationale as runner-fleet-canary.yml above."
  - path: .github/workflows/pr-ci-zombie-detector.yml
    reason: "OMN-16494: scheduled PR-CI concurrency-group zombie detector -- one of its two target mechanisms is a self-hosted-runner job surviving a cancel signal, so it must not share fate with the self-hosted fleet it partly exists to unstick. Same isolation rationale as runner-fleet-canary.yml and runner-broker-dispatch-wedge-rerun.yml above."
  - path: .github/workflows/shared-env-runner-parity.yml
    reason: "OMN-16555: the hosted half of the shared-env two-runner-class parity gate must be pinned to a literal ubuntu-latest -- routing it through OMNI_RUNNER_SELECTOR_V1 would let a var change move it back onto the fleet and void the ephemeral-runner proof. Its self-hosted half does use the standard selector."
