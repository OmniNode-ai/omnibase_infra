trusted_runner_variable:
  name: OMNI_TRUSTED_CI_RUNS_ON_JSON
  # OMN-16682: the trusted-CI seam was deliberately re-flipped to GitHub-hosted
  # runners at org scope and at all five repo shadows on 2026-08-27T04:36:53-56Z.
  # This value is the ASSERTED intended state, so it must track that flip --
  # while it read '["self-hosted","omnibase-ci"]' the hourly audit reported six
  # drift findings (org + each repo) on every run. That is not a benign red: the
  # audit exits non-zero on the first finding set, so its OTHER surfaces --
  # notably the local-workflow hosted-runner allowlist that carries the
  # OMN-16683 fork-isolation entries -- were reported against a job that was
  # already failing, and real new drift there would not have changed the signal.
  #
  # Jobs that must NOT follow this seam onto hosted runners do not read this
  # variable at all: the OCC autobind/companion-effect publishers read the
  # dedicated OMNI_OCC_AUTOBIND_RUNS_ON_JSON knob with a literal
  # '["self-hosted","omnibase-ci"]' fallback (OMN-16691), because they publish to
  # the tailnet-only dev-lane broker that only the self-hosted fleet can reach.
  #
  # OMN-17888 adds the second such carve-out: runtime-rebuild-trigger.yml reads
  # OMNI_RUNTIME_REBUILD_RUNS_ON_JSON on the same terms. It publishes the
  # post-merge redeploy-start command to that same tailnet-only dev-lane broker,
  # and it had been reading the seam above -- so the 2026-08-26 flip relocated it
  # onto GitHub-hosted compute, where librdkafka cannot resolve the bootstrap
  # name. Every run since that had a runtime change to publish failed; dev-lane
  # auto-redeploy delivered nothing for ten days. BOTH dedicated knobs are meant
  # to stay UNSET so the self-hosted literal operates; neither is audited above,
  # because an unset variable is the intended state and a set one is the defect.
  expected_json: '["ubuntu-latest"]'
  # OMN-18031: expected_json above is the ORG assertion and the default for every
  # repo shadow. repository_overrides declares a shadow that is deliberately
  # different, so the hourly audit can tell an authorized per-repo divergence
  # from the silent drift it exists to catch. An override is not a hole: the
  # audit holds the repo to the override value, still judges the org value on
  # expected_json above, refuses an override with no revert_when, and reports a
  # repo that declares an override but carries no shadow at all (it would
  # silently inherit the org value -- the "the flip looked successful because the
  # org readback was correct" trap in rule 14).
  #
  # It is EMPTY today, deliberately. On 2026-09-07T12:04:30-31Z the omnimarket
  # and omnibase_infra shadows were flipped to '["self-hosted","omnibase-ci"]' as
  # authorized interim load-balancing relief (78 hosted runs queued across the two
  # repos while all 30 runners in the omnibase-ci group were online and zero were
  # busy). It was REVERTED 53 minutes later at 12:57:48Z on measured harm: the
  # required gate "Customer Path Boundary (OMN-18012)" cannot bootstrap its Kafka
  # testcontainer on the fleet -- the runners are themselves containers on a
  # shared Docker daemon, so a mapped container port is not reachable on the
  # runner's own localhost. Clean A/B on omnibase_infra ci.yml, same job: 5 of 5
  # pre-flip runs SUCCESS on ubuntu-latest, 5 of 5 post-flip runs FAILURE on
  # self-hosted, the first of them 71 seconds after the flip; reproduced on
  # omnimarket run 34122888401.
  #
  # SUPERSEDED, 2026-09-12 (OMN-18205). The sentence that stood here claimed
  # this gate, and every other container-backed gate, required a runner class
  # of its own that the fleet could not provide. That is no longer true and it
  # is dropped rather than softened: the
  # runner-topology defect was fixed the same afternoon and the gate has since
  # been PROVEN green on a fleet runner. The A/B above is kept because it is an
  # accurate record of what was measured on the morning of 2026-09-07 -- it is
  # history, not a current constraint. Read it with the OMN-18205 entry below.
  #
  # OMN-18031 phase 5, 2026-09-11T21:12:33Z: two shadows below are now DECLARED
  # divergences rather than drift. Authority is the operator ruling of
  # 2026-09-11 ~21:07Z, "Yes we should move things back to the lab as
  # necessary", and the phase-0 gate it answers is met. Measured immediately
  # before the write: 279 jobs sat queued across six repositories, every one of
  # them carrying `ubuntu-latest` with no runner assigned and the longest
  # waiting 18 minutes, while 70 of the 88 runners in this group were online
  # and idle. That is runner availability, not concurrency-group
  # serialisation -- a job blocked on `needs:` is not reported queued with a
  # started_at, and all 279 carried one.
  #
  # The exclusions are the substance of this entry. omnimarket and
  # omnibase_infra are deliberately NOT flipped: the required gate named in the
  # A/B above, "Customer Path Boundary (OMN-18012)", resolves its runs-on
  # through this very seam in BOTH repositories (omnimarket ci.yml, and this
  # repo's ci.yml) and docker-pulls redpandadata/redpanda with
  # OMN18012_REQUIRE_HARNESS=1 set so a missing daemon is red rather than a
  # green skip.
  #
  # CORRECTED, 2026-09-12 (OMN-18205). This paragraph previously ended with a
  # sentence asserting that flipping either shadow would reproduce the
  # 2026-09-07 harm exactly. That claim was false when it was written and is
  # withdrawn at the request of its own author. The
  # harm it names was fixed before this text was committed, and the gate has
  # since run green on a fleet runner in both repositories. Neither repository is
  # excluded for that reason any more; the standing reason not to flip them is
  # CAPACITY, recorded in the OMN-18205 entry below. Both gates now resolve
  # through docker_ci_runner_variable, so a flip of THIS seam would not move them
  # in any case.
  # The org variable is not flipped either: it is inherited by omninode_infra --
  # private, carrying a live staging deploy path, and with only five
  # seam-driven job definitions, so almost no yield for a large blast radius --
  # and by omnimemory, omnidash, omnibase_spi and omnibase_compat, none of
  # which were enumerated for container exposure.
  #
  # Two shadows were flipped at 21:12:33Z. ONE WAS REVERTED 35 MINUTES LATER on
  # measured harm, and the reason is a finding worth more than the flip was.
  #
  # onex_change_control was flipped and reverted to '["ubuntu-latest"]' at
  # 2026-09-11T21:47:18Z. It is NOT in the override map below, so the audit
  # holds it to expected_json above, which is now correct again. The cause was
  # NOT the container defect and NOT runner contamination: the step "Verify
  # centralized runner routing standard", in that repo's
  # .github/workflows/omni-standards-compliance.yml, builds its forbidden-label
  # set FROM THE LIVE VALUES of OMNI_PUBLIC_PR_RUNS_ON_JSON and
  # OMNI_TRUSTED_CI_RUNS_ON_JSON, then greps .github/workflows for each label,
  # filtering out only lines that contain one of the two `fromJSON(vars...||`
  # fallback expressions. Flipping the trusted seam to self-hosted therefore
  # makes the gate hunt for the literal string "self-hosted" in its own
  # workflow directory -- and it hits exactly one line, a PROSE COMMENT at
  # release-staleness-gate.yml:52 reading "not contend for the same self-hosted
  # runners". The gate fails on a comment.
  #
  # So that repository is structurally unflippable until the gate's filter is
  # fixed, and the defect is invisible while the seam is hosted: the label set
  # is then just {ubuntu-latest}, every occurrence of which IS on a fallback
  # line. A gate that passes only because the value it guards has never been
  # exercised has not been tested. Clean A/B, same shape as the 2026-09-07
  # entry above: 59 of 59 conclusive pre-flip runs SUCCESS on hosted, 3 of 3
  # conclusive post-flip runs FAILURE on the fleet, zero fleet successes.
  #
  # omnibase_core does NOT carry that gate -- grep for its step name returns
  # nothing in that repo's workflow directory -- which is why it stays flipped
  # and is the one override declared below. It carries no `testcontainers`
  # dependency and no `docker` step in any workflow.
  #
  # RE-FLIPPED 2026-09-12T00:27:32Z and REVERTED AGAIN at 01:56:49Z, this time
  # because the fleet could not carry the load. That second revert is the more
  # important measurement in this whole entry, so it is recorded here rather
  # than only in a ticket.
  #
  # The gate defect that forced the FIRST revert was genuinely fixed
  # (onex_change_control#9140, squash dbec685b7b0f4d0737db87c5a42a6e749f36492b),
  # verified on that repo's integration branch, and proven on the fleet by two
  # conclusive gate successes plus an injected-pin control. None of that is
  # retracted. What failed is capacity.
  #
  # MEASURED, job level, six repositories:
  #
  #   pre-flip  21:15Z  279 queued jobs, max wait 18m, all hosted,
  #                     70 of 88 fleet runners idle
  #   +11min    00:38Z  0 queued, 97 jobs on fleet runners, 47 busy / 37 idle
  #   +86min    01:54Z  336 queued jobs, max wait 25m, 293 of them waiting on
  #                     FLEET labels, fleet 87 of 88 BUSY, 1 idle
  #
  # So routing was WORSE than the hosted baseline it replaced, on both queue
  # depth and tail latency, and 182 of those 336 queued jobs were the routed
  # repository's own. The +11min reading was a quiet-moment snapshot and was
  # wrongly reported as the outcome; the honest reading needs a sustained
  # sample, which is what the plan's phase 0 asked for and what a single
  # snapshot cannot give.
  #
  # The premise this refutes is specific and worth stating: the fleet being
  # near-unused at rest (~0.03 percent of available runner-minutes) does not
  # imply it can absorb one busy repository's CI. Eighty-eight runners against
  # that repository's fan-out is not spare capacity, it is a smaller bottleneck
  # than the hosted pool.
  #
  # Two further harms, either sufficient on its own. A concurrent fleet
  # maintenance roll could not converge, because its roller refuses to recreate
  # a BUSY runner and 87 of 88 were busy. And the routing starved the evidence
  # companion of the very pull request recording it.
  #
  # omnibase_core stayed on the fleet at the time this paragraph was written: it
  # was not the saturation source, and it had run clean since
  # 2026-09-11T21:12:33Z. SUPERSEDED 2026-09-12T14:01:27Z -- see the OMN-18205
  # cloud-migration entry at the end of this block. The sentence is kept in the
  # past tense because it is accurate history of the 2026-09-11 flip; it is no
  # longer the current state and must not be cited as one.
  #
  # THE COST, measured rather than estimated. Between 21:13:15Z and 21:49:29Z
  # that gate failed 5 runs across 5 branches -- 3 OCC companion branches and 2
  # product branches inside that repo -- and because it feeds the required
  # summary check, no companion could merge, which blocks product PRs
  # fleet-wide. Window from first failure start to first pass after the revert:
  # 36m14s. One of the blocked companions was this very pull request's, so the
  # flip blocked its own paperwork.
  #
  # omnibase_core was checked for the same gate rather than assumed safe, and
  # from origin/dev rather than from a local clone: its
  # omni-standards-compliance.yml contains ZERO occurrences of either the step
  # name or the error string, against exactly one of each in the other repo as
  # the positive control. It carries ~108 prose matches for the label, but
  # nothing in that repo greps for them, so they are inert. That is why it
  # stayed flipped through 2026-09-12T14:01:27Z, with its jobs executing and
  # passing on named fleet runners. That finding is unretracted and is the
  # reason the flip was safe; it is not a reason the repository must remain
  # there, and the cloud-migration entry below is what moved it.
  #
  # What the flip proved before the revert, and it is worth recording: queue
  # depth went from 279 queued jobs at 21:15Z to 0 at 21:42Z, with 76
  # onex_change_control jobs executing on named fleet runners, and fleet busy
  # count rising from 16 to 51 of 88. The mechanism works. One repository's
  # self-referential gate is what stopped it, not the fleet.
  #
  # OPERATIONAL GUARD ADDED AFTER HOSTILE REVIEW, 2026-09-12. A future
  # repository_override is no longer authorized by narrative alone:
  # scripts/audit-runner-routing.py rejects every override without an
  # activation_gate carrying sustained sampling, capacity budget,
  # maintenance-roll convergence, evidence-companion fate isolation, and
  # positive-control acceptance criteria. That is the policy guard that prevents
  # a repeat of the +11min quiet-snapshot mistake: the checked shape must exist
  # before the audit will accept any repo shadow divergence.
  #
  # OMN-18205 CLOUD MIGRATION, 2026-09-12T14:01:27Z. The last remaining override
  # is REMOVED and this map is empty again, which the shape test above calls the
  # correct steady state. omnibase_core's trusted-CI shadow was patched from the
  # fleet pair back to '["ubuntu-latest"]' at that timestamp, so every audited
  # scope in the organization now agrees with expected_json above and no
  # divergence is declared anywhere.
  #
  # AUTHORITY. The override's authority was the operator ruling of
  # 2026-09-11 ~21:07Z, which directed work back onto the lab as necessary. A
  # later operator ruling reverses that direction and names this shadow: the
  # OPERATOR-CONSENT row at docs/tracking/ROLLING_WORK_LEDGER.md:6999 in the
  # omni_home registry (2026-09-12T13:56:45Z), whose approved scope is to move
  # CI work off the lab hosts to cloud runners and lists the trusted-seam
  # shadow on this repository explicitly. A later ruling supersedes an earlier
  # one; that is the whole reason this entry is gone, and nothing in the
  # technical findings above is retracted to make room for it.
  #
  # WHAT WAS MEASURED BEFORE THE WRITE, since narrative is not authorization.
  # Read live across the seventeen hours the override was in force
  # (2026-09-11T21:12:33Z to 2026-09-12T14:01Z), job level, from the Actions
  # API: 299 omnibase_core jobs executed on the fleet for 2831 runner-minutes,
  # spread across 87 of the 88 runners in the group -- roughly 2.8 runners held
  # continuously, which made this repository the largest single lab CI consumer
  # measured anywhere in the estate. For comparison the plan of record's
  # previously-largest exception, the omninode_infra pull-request test job, is
  # 276 minutes over SEVEN DAYS. The activation_gate's capacity budget was not
  # breached at the moment of the write (46 of 88 busy, 42 idle), so this is a
  # deliberate policy change and NOT a capacity revert; recording which of the
  # two it is matters, because a future lane reading a bare removal would
  # reasonably infer the gate had fired.
  #
  # WHY THE MOVE COSTS NOTHING. omnibase_core is a PUBLIC repository, and
  # standard GitHub-hosted runner minutes are free in public repositories. The
  # nine-day billing read in the plan of record shows this repository at 65,800
  # minutes gross and $0.00 net billed. So the 2831 runner-minutes above leave
  # the lab and arrive somewhere they are not invoiced. That asymmetry is the
  # reason a public repository is the right first thing to move and a private
  # one is not.
  #
  # THE ONE SCOPE STILL ON THE FLEET, stated rather than left absent: omniweb's
  # trusted-CI shadow, set 2026-09-01T12:39:22Z, is the only remaining
  # self-hosted routing value at any scope in the organization. It is a private
  # repository, so its hosted minutes bill, and it is still not in the audited
  # `repositories` list below -- the hourly audit therefore never looks at it.
  # That is a known gap folded into the plan of record's phase 4; this entry
  # does not close it and does not flip that shadow.
  #
  # OMN-18205 PHASE 2, 2026-09-12: A SHADOW WAS SET ON omninode_infra AND
  # REVERTED 41 MINUTES LATER ON MEASURED HARM. The map stays EMPTY, which the
  # shape test above calls the correct steady state. This entry exists because
  # the attempt is the useful evidence, and a future lane that reads only
  # "empty" would try the same thing again.
  #
  # WHAT WAS TRIED, AND THE REASONING THAT LOOKED SOUND. omninode_infra pins 44
  # of its 101 job definitions to the fleet label directly in workflow files,
  # where no routing surface can see them. omninode_infra#1390 moves the
  # hermetic 40 of those onto the seam expression. Those rewired jobs read
  # fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]'),
  # and the literal fallback applies only when the variable is UNSET -- the org
  # value is set at visibility: all and therefore reaches this repository. So
  # merging that PR with no shadow would move 40 jobs of a PRIVATE repository
  # onto billed hosted runners, roughly $500/month, as a silent side effect of a
  # mechanical refactor. Setting the shadow to the fleet pair first was meant to
  # make the rewiring placement-neutral: change WHERE placement is decided and
  # nothing about where the jobs run.
  #
  # WHY IT WAS WRONG, and the half the reasoning missed. The shadow does not
  # only govern the 40 jobs that PR rewires. omninode_infra already had 13
  # seam-driven jobs on dev, rewired by earlier work from hardcoded
  # `ubuntu-latest` and resolving to the ORG value ever since -- ci.yml's own
  # comment beside one of them says so in as many words: "It carries no routing
  # shadow, so this expression resolves to the organization value." Setting the
  # shadow relocated all 13 from GitHub-hosted onto the fleet in one write,
  # which was neither intended nor anticipated, and two of them do not run
  # there: "Validate ONEX Manifest Hygiene" fails at its Install yq step, and
  # "Repo Scripts Tests" fails with `renderer 'kustomize' not found`. Both tools
  # are present on hosted images and absent from the fleet runner image.
  #
  # BLAST RADIUS, stated rather than softened: `CI Summary` is a required check
  # on that repository's dev branch and aggregates both, so for 41 minutes every
  # open pull request there was blocked, including PRs belonging to other lanes.
  #
  # THE EVIDENCE IS A CLEAN BEFORE/AFTER WITH A CONTROL, not an inference.
  # k8s-validate.yml succeeded on every run through 15:40:24Z and failed on
  # every run after the write at 15:55:54Z -- including run 34704455773 on an
  # unrelated branch, which is the control proving the cause was the variable
  # and not the PR under test. After the shadow was deleted at 16:36Z the same
  # job re-ran green on `GitHub Actions 1003094636`, a hosted runner, while the
  # fleet-literal job `Validate Manifest Hygiene` in the same run stayed on
  # `omninode-runner-15` and also passed -- so the fleet itself was healthy and
  # only the relocated jobs broke.
  #
  # WHAT THIS CHANGE STILL DOES. omninode_infra is added to the audited
  # `repositories` list below and KEPT there. With no shadow present the audit
  # records no finding, and if any shadow appears on that repository later it
  # becomes a reported drift instead of the invisible edit it was until today.
  # That is the durable half of this work and it is worth keeping on its own.
  #
  # WHAT A LATER LANE MUST DO FIRST. Re-setting this shadow is not blocked, it
  # is SEQUENCED: pin those 13 previously-hosted jobs to a hosted literal, or
  # install yq and kustomize in the fleet runner image, BEFORE the shadow goes
  # back. Enumerate the seam-driven jobs from each job's parsed `runs-on` on the
  # target repository's default branch -- never from whether a file mentions the
  # variable -- because that enumeration is exactly the step this attempt
  # skipped.
  # OMN-18205 PHASE 4, 2026-09-14. THE MAP IS NO LONGER EMPTY, AND THE REASON IS
  # NOT THAT THE ARGUMENT ABOVE WAS WRONG. Every measurement recorded above
  # stands. What changed is that GitHub-hosted compute STOPPED BEING AN
  # AVAILABLE PLACEMENT in the private repositories. Read live at
  # 2026-09-14T11:29:39Z, every `ubuntu-latest` job in omninode_infra completes
  # in about four seconds with no runner assigned and the annotation "The job
  # was not started because recent account payments have failed or your spending
  # limit needs to be increased". Public repositories are unaffected because
  # their hosted minutes are free. So the sequencing note that closes the phase-2
  # entry above -- "pin those 13 previously-hosted jobs to a hosted literal, OR
  # install yq and kustomize in the fleet runner image, BEFORE the shadow goes
  # back" -- now has only one live branch: a hosted pin is a pin to a placement
  # that cannot run at all.
  #
  # WHAT THE FLIP MOVES, enumerated from each job's parsed `runs-on` on
  # omninode_infra's default branch (`dev`), which is the step the phase-2
  # attempt skipped. 109 job definitions: 42 already read
  # OMNI_INFRA_FLEET_RUNS_ON_JSON (fleet default, unset everywhere, so already on
  # the fleet), 5 are fleet literals, 8 are reusable calls, 41 are hosted
  # literals, and THIRTEEN read this seam. Those 13 are exactly the population
  # this override governs:
  #   build-and-push-omniweb.yml::report-public-surface-drift
  #   ci.yml::repo_scripts_tests
  #   contract-validation.yml::contract-validation
  #   deploy-gate.yml::deploy-gate
  #   host-sysctls-gate.yml::host-sysctls
  #   infra-consistency-check.yml::infra-consistency
  #   k8s-validate.yml::validate-onex-manifest-hygiene
  #   lab-store-mirror-parity.yml::lab-store-mirror-parity
  #   main-target-guard.yml::main-target-guard
  #   stale-todo-gate.yml::stale-todo-gate
  #   test-composite-actions.yml::test-install-kubeconform
  #   test-composite-actions.yml::test-install-kustomize
  #   todo-audit-on-merge.yml::todo-audit
  #
  # CORRECTION, made against live placement rather than against the expression,
  # because the two disagree and the difference matters to anyone reading this
  # to predict what a flip does. Those 13 do NOT all move on a pull request.
  # Nine of them use the fork-guard shape (`head.repo != repository` chooses the
  # public class) or read the seam unconditionally, so on a same-repository pull
  # request they resolve to the seam and land on the fleet. The other FOUR --
  # contract-validation, deploy-gate, infra-consistency-check and
  # stale-todo-gate -- use the `github.event_name != 'pull_request'` shape, which
  # sends every pull-request event to the PUBLIC class by construction. Those
  # four move only on push and schedule events and stay hosted on pull requests.
  # Measured, not inferred: after the write, `main-target-guard` ran on
  # omninode-runner-74 and `lab-store-mirror-parity` on omninode-runner-2, while
  # re-runs of contract-validation, deploy-gate, infra-consistency and
  # stale-todo-gate in the same window all reported `labels=ubuntu-latest` with
  # no runner assigned.
  # It moves NOTHING ELSE. The 41 hosted literals stay hosted (they are AWS/ECR/
  # SSM/kubectl deploy paths and two service-container test jobs), and the seam
  # cannot reach them because a literal answers to no variable.
  #
  # THE TWO KNOWN FLEET BREAKS ARE NAMED RATHER THAN REDISCOVERED, and they are
  # the same two the phase-2 revert found. `validate-onex-manifest-hygiene`
  # installs yq with `sudo wget`; the fleet runner image has NEITHER -- probed
  # live in omninode-runner-9 and -56, /etc/sudoers.d grants `runner` exactly one
  # command (`rm -rf` of the work directory) and `wget` is absent. `repo_scripts_tests`
  # runs `pytest tests/ --ignore=tests/scripts`, whose tests/k8s modules shell out
  # to `kubectl kustomize`, and kubectl is on the hosted image and not on the
  # fleet image, which is where `renderer 'kustomize' not found` came from.
  # omninode_infra PR (OMN-18205) fixes both at cause -- a checksum-verified,
  # sudo-free, curl-based install-yq composite action modelled on the existing
  # install-kustomize, plus a pinned azure/setup-kubectl step -- and that PR is
  # open. It cannot merge until the billing block clears, which is why the
  # shadow is not sequenced behind it: leaving those two jobs on hosted is a
  # guaranteed failure, moving them is a failure that is no worse and that the
  # open PR converts into a pass. The other ELEVEN are checked and clean: none of
  # the ten remaining workflows contains `sudo`, `apt-get`, `wget` or any other
  # image-dependent install, and the two test-composite-actions jobs install
  # their tools through the fleet-proven composites.
  #
  # WHAT THIS FLIP DOES NOT FIX, stated rather than left for someone to discover.
  # THREE of the six required contexts on omninode_infra's `dev` branch --
  # `verify / verify`, `kb-doc-gate / kb-doc-gate` and
  # `call-reject-skip-token / scan / reject-skip-gate-token` -- route every
  # pull-request event to OMNI_PUBLIC_PR_RUNS_ON_JSON, the untrusted class, by
  # deliberate design in their reusable definitions. This seam cannot move them
  # and MUST NOT: flipping the public-PR variable would put untrusted pull-request
  # code on the lab fleet, which is the exact fork-isolation inversion OMN-16683
  # exists to prevent. So merges in that repository stay blocked until the
  # account-level billing failure is cleared by an operator. Routing reduces the
  # bill and unbreaks the thirteen; it is not a substitute for paying the bill.
  #
  # `vars` RESOLUTION IN REUSABLE WORKFLOWS IS PROVEN, NOT ASSUMED, because the
  # paragraph above depends on it. omniweb run 34780281040: `pr-title / check-title`,
  # whose definition lives in onex_change_control (whose own shadow is hosted),
  # executed on `omninode-runner-20` because the CALLER's shadow is the fleet
  # pair. The control is in the same repository minutes earlier: run 34780242070,
  # `kb-doc-gate / kb-doc-gate`, hosted on `GitHub Actions 1000000036`, because
  # that definition sends dev-targeting pull requests to the public class. Same
  # caller, same variables, opposite placements, explained entirely by the two
  # expressions.
  #
  # omniweb IS DECLARED HERE FOR THE FIRST TIME AND NOTHING ABOUT IT CHANGES.
  # Its shadow was set to the fleet pair on 2026-09-01T12:39:22Z and has been
  # live ever since; it was the "one scope still on the fleet" the cloud-migration
  # entry above records as a known gap folded into phase 4. This entry closes
  # that gap by DECLARING the value and adding the repository to the audited
  # `repositories` list below, so a future edit to it becomes a reported drift
  # instead of an invisible one. No variable is written for omniweb by this
  # change.
  repository_overrides:
    omninode_infra:
      expected_json: '["self-hosted","omnibase-ci"]'
      revert_when: >-
        Revert to '["ubuntu-latest"]' the moment GitHub-hosted compute is a working placement again AND any of the following is observed: the fleet busy fraction sustains above the saturation threshold in `route` below with omninode_infra jobs among the waiting set; a maintenance roll cannot converge because too few runners are idle to recreate; or any of the thirteen seam-driven jobs fails on a named fleet runner for a fleet-caused reason -- a missing tool on the runner image, a container it cannot reach from the test process, or a job that is QUEUED rather than running. A hosted pin is NOT a valid revert target while the billing annotation persists, because that placement does not execute.
      activation_gate:
