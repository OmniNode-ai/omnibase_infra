  # through this path.
  #
  # Fallback literal while unset: '["self-hosted","omnibase-ci"]' -- the exact
  # label these 40 jobs were hardcoded to before #1390, so leaving the
  # variable unset is placement-neutral by construction.
  #
  # NOTE FOR THE NEXT COMPANION PR ON THIS TICKET: do not hand-write a
  # companion-citation line into a PR body or commit message before the
  # OCC autobind effect mints one and PATCHes it on. A manually written
  # placeholder is indistinguishable, to the born-path consumer, from a
  # real citation, and it suppressed this PR's own mint the first time
  # (this PR's own history, corrected in a follow-up commit). Leave that
  # field blank and let the automated PATCH populate it.
  #
  # Deliberately UNSET everywhere, on the same terms as
  # OMNI_OCC_AUTOBIND_RUNS_ON_JSON and OMNI_RUNTIME_REBUILD_RUNS_ON_JSON
  # documented in trusted_runner_variable above: unset is the intended state
  # and a set one is the defect. NOT a member of SCOPED_VARIABLE_KEYS /
  # audit_scoped_variables below -- there is no live per-repo absence check
  # for it, the same honest limit those two knobs carry. Setting it is its own
  # single-owner claim under rule 14 (name every scope live before the first
  # PATCH) and must never be bundled with a write to
  # OMNI_TRUSTED_CI_RUNS_ON_JSON at any scope.
  fallback_json: '["self-hosted","omnibase-ci"]'
  owner: cloud-ci lane (OMN-18205)
  repositories:
    - omninode_infra
public_pr_runner_variable:
  name: OMNI_PUBLIC_PR_RUNS_ON_JSON
  expected_json: '["ubuntu-latest"]'
