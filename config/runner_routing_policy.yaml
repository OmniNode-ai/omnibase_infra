  - path: .github/workflows/ci.yml
    reason: "OMN-14127: CI Summary is a lightweight hosted fail-closed aggregator so required status always posts during self-hosted saturation."
  - path: .github/workflows/build-and-push-runtime.yml
    reason: "OMN-13747: ECR push remains hosted until the self-hosted egress failure is retired."
  - path: .github/workflows/build-workspace-candidate-runtime.yml
    reason: "OMN-14974: candidate runtime ECR push uses the same hosted clean-egress lane after the self-hosted daemon repeatedly stalled during upload."
  - path: .github/workflows/omnigate.yml
    reason: "Fork-only untrusted PR verification must not execute on self-hosted runners."
  - path: .github/workflows/runner-fleet-canary.yml
    reason: "OMN-13915: scheduled fleet canary must not share fate with the self-hosted runner fleet it monitors."
  - path: .github/workflows/model-review-capability-canary.yml
    reason: "OMN-17876: capability contract evidence must stay on hosted compute until separately authorized live runner selection."
  - path: .github/workflows/runner-broker-dispatch-wedge-rerun.yml
    reason: "OMN-15776: scheduled broker-dispatch-wedge rerun must not share fate with the self-hosted runner fleet it remediates -- same isolation rationale as runner-fleet-canary.yml above."
  - path: .github/workflows/pr-ci-zombie-detector.yml
    reason: "OMN-16494: scheduled PR-CI concurrency-group zombie detector -- one of its two target mechanisms is a self-hosted-runner job surviving a cancel signal, so it must not share fate with the self-hosted fleet it partly exists to unstick. Same isolation rationale as runner-fleet-canary.yml and runner-broker-dispatch-wedge-rerun.yml above."
  - path: .github/workflows/dev-candidate-delivery-liveness.yml
    reason: "OMN-16906: the dev-candidate delivery guard is a pure GitHub-REST probe that touches no lane and no tailnet host, and it must not share fate with the self-hosted fleet -- a delivery outage caused by fleet saturation is exactly the case where a self-hosted watcher would be queued behind the thing it reports on. Same isolation rationale as runner-fleet-canary.yml above."
  - path: .github/workflows/deliver-dev-candidate-to-staging.yml
    reason: "OMN-17534: the candidate-boot-gate job creates and destroys a kind cluster and side-loads a multi-gigabyte runtime image. The self-hosted omnibase-ci fleet on .201 runs the lab lanes off the same Docker daemon, so a per-candidate ephemeral cluster there would contend with -- and could disturb -- the lanes the lab depends on. The other three jobs in this workflow are unaffected: two are `uses:` calls into already-allowlisted workflows and the announce job routes through OMNI_TRUSTED_CI_RUNS_ON_JSON as before."
  - path: .github/workflows/runner-route-reusable.yml
    reason: "OMN-18031: the per-run routing decision job. It must not share fate with the fleet it routes onto -- a router queued behind a saturated fleet would decide, minutes late, that the fleet is saturated. Same isolation rationale as runner-fleet-canary.yml above. It is also the surface that enforces fork isolation (OMN-16683/16684) before any capacity signal is read, so it must be reachable on an untrusted PR, where self-hosted is prohibited outright."
  - path: .github/workflows/runner-route-probe.yml
    reason: "OMN-18031 gate P1: the live proof that `needs.<job>.outputs` resolves inside `runs-on`, for both a normal job and a reusable-workflow job. A survey of all five routing repos on 2026-09-07 found zero prior uses of that wiring (196 files carrying the seam selector were the positive control), so the assumption the whole design rests on is proven here rather than assumed. Its two `route-*` jobs and the proof gate are hosted; its two `consume-*` jobs resolve their runs-on FROM the route output and are hosted today only because the seam ceiling is hosted."
  - path: .github/workflows/dev-lane-liveness.yml
    reason: "OMN-18031: the saturation-record job is a bare ubuntu-latest by design -- the monitor must survive the saturation it reports on, the same fate-isolation rationale as runner-fleet-canary.yml above. Its sibling lab-load-probe job is deliberately self-hosted on a literal [self-hosted, omnibase-ci] and the pre-existing dev-lane-liveness job on [self-hosted, omnibase-verify] (it was [self-hosted, omnibase-deploy] until OMN-18408 moved it off the single deploy runner); neither is a bare hosted runner, so this entry covers the ONE hosted job. These probes live here rather than in runner-fleet-canary.yml because tests/ci/test_dev_lane_liveness.py asserts the canary stays single-job and GitHub-hosted, and names this workflow as the home for lane/host-scoped probes."
  - path: .github/workflows/build-and-push-migrate-image.yml
    reason: "OMN-18205: the migration image build pushes to ECR, which is the workload OMN-13747 recorded as failing from the self-hosted fleet's egress path -- the same reason build-and-push-runtime.yml and build-workspace-candidate-runtime.yml above are pinned. It had been reading the trusted seam, so a routing flip would have moved a registry push onto the fleet as an unenumerated side effect. The workflow has no pull_request trigger, so its fork branch was decoration and was removed with the pin."
  - path: .github/workflows/shared-env-runner-parity.yml
    reason: "OMN-16555: the hosted half of the shared-env two-runner-class parity gate must be pinned to a literal ubuntu-latest -- routing it through OMNI_RUNNER_SELECTOR_V1 would let a var change move it back onto the fleet and void the ephemeral-runner proof. Its self-hosted half does use the standard selector."
# OMN-18031 — per-run routing thresholds for the hosted `route` job.
#
# The route job (scripts/ci/runner_route_decision.py) decides, once per run,
# between the lab fleet labels and GitHub-hosted, from live org-runner capacity
# and lab host load. The `trusted_runner_variable` above is read as a CEILING:
# routing may only ever DOWNGRADE from what the seam already allows, never
# widen. Nothing here writes any Actions variable (CLAUDE.md rule 14,
# single-owner).
#
# THE MECHANISM IS INERT AT THESE VALUES AND THAT IS DELIBERATE. With
# expected_json '["ubuntu-latest"]' the decision returns `seam_ceiling_hosted`
# on every run and placement is byte-identical to today. Flipping the seam is a
# separate single-owner claim (OMN-16682), not this ticket.
#
# Every key below is REQUIRED: the loader raises on a missing one rather than
# defaulting (CLAUDE.md rule 8), because a silently-defaulted threshold is how a
# routing gate quietly stops gating.
route:
  # THE THRESHOLDS MOVED, they were not deleted. The labels, the idle and busy
  # floors, the fleet-size floor, the lab freshness bound and load/memory
  # floors, and the private-repository refusal are now declared in the routing
  # node's own contract:
  #
  #   src/omnibase_infra/nodes/node_ci_runner_route_compute/contract.yaml
  #
  # under its `config:` block, parsed into ModelCIRunnerRoutePolicy whose fields
  # are all required. They are not restated here: two copies of a threshold are
  # two policies that agree until the day they do not, and the one this file
  # kept would have been the one nobody was reading.
  #
  # What stays here is per-repository DATA rather than policy -- the workflows
  # this repository exempts, and the thresholds of the saturation monitor,
  # which is a different question from the placement decision and answers to a
  # different consumer.
  hosted_workflows:
    - .github/workflows/runner-route-reusable.yml
    - .github/workflows/runner-route-probe.yml
    - .github/workflows/runner-fleet-canary.yml
    - .github/workflows/runner-broker-dispatch-wedge-rerun.yml
    - .github/workflows/pr-ci-zombie-detector.yml
    - .github/workflows/dev-candidate-delivery-liveness.yml
    - .github/workflows/model-review-capability-canary.yml
    - .github/workflows/omnigate.yml
    - .github/workflows/build-and-push-runtime.yml
    - .github/workflows/build-workspace-candidate-runtime.yml
    - .github/workflows/shared-env-runner-parity.yml
  # OMN-18031 G7 — saturation monitor thresholds. Higher than the routing
  # thresholds above on purpose: routing reacts to a single instantaneous read
  # and biases toward the cheap error, while an ALERT must survive the
  # volatility that read has. sustained_samples: 4 at the canary's */5 cadence
  # is a 20-minute sustain.
  saturation_alert:
    busy_fraction_threshold: 0.85
    lab_load_ratio_threshold: 1.5
    min_lab_free_mem_mib: 4096
    sustained_samples: 4
    # CADENCE, STATED HONESTLY. The monitor rides dev-lane-liveness.yml
    # ("7,22,37,52 * * * *" -- every 15 minutes), not a */5 of its own. The
    # first build put it in runner-fleet-canary.yml and moved that cron */15 ->
    # */5 to make "4 samples" mean 20 minutes; that broke the codified
    # single-job/GitHub-hosted invariant on the canary
    # (tests/ci/test_dev_lane_liveness.py), whose own message names
    # dev-lane-liveness.yml as the home for lane/host-scoped probes. Riding the
    # correct existing scheduler costs resolution: four samples there is roughly
    # a 45-60 minute sustain, not 20. That is slower to notice a pile-up, and it
    # is the price of not adding a third scheduler (out of scope) and not
    # narrowing a fate-isolation guard. Re-derive the count against real
    # placement once the seam permits self-hosted; tuning it now would be tuning
    # against a mechanism with no consumers wired.
    #
    # THE SAMPLE COUNT ALONE DOES NOT MEAN A DURATION, and saying so would be
    # a soft claim. Measured 2026-09-07T11:0xZ: four consecutive canary runs
    # (queued 10:25, 10:34, 10:46, 11:02Z) were all still QUEUED behind the
    # GitHub-hosted backlog, so samples arrive at whatever rate that queue
    # drains, not at the */5 the cron requests. A count-only counter would
    # therefore alert on four samples that might span four minutes or four
    # hours. This floor makes the word "sustained" true: a breach must ALSO
    # span this much wall-clock, read from the records' own sampled_at.
    sustained_min_span_seconds: 900
  # OMN-18254 - non-required check failure-rate alert.
  #
  # WHY A THRESHOLD AND NOT "ANY FAILURE". A single red run on an unenforced
  # check is ordinary: a flake, a cancelled run, a fork PR without a secret.
  # What is worth a page is a check failing REPEATEDLY while nothing blocks,
  # which is what happened on the web repository's companion-effect job - 9 of
  # 10 recent pull-request runs on missing broker credentials, reported red on
  # three separate pull requests before anyone asked whether it meant companions
  # were never publishing.
  #
  # 3 of the last 10 heads is deliberately low. The cost of a false positive is
  # one person reading one annotation; the cost of a false negative is what this
  # ticket exists for. One head contributes at most one failure per check name,
  # so a storm of re-runs on a single pull request cannot reach the threshold
  # on its own.
  nonrequired_check_alert:
    failure_threshold: 3
    heads_observed: 10
    # OMN-18322: the pull-request reads above answer "is a check that fails
    # forever going unwatched". A scheduled workflow has no pull-request head at
    # all, so it needed its own threshold rather than reusing the count above --
    # a percentage over a trailing window, not a count over N heads, because a
    # scheduled workflow's run cadence varies by workflow (10-minute cron vs.
    # nightly) and a fixed head-count would either drown a fast cron in noise or
    # never accumulate for a slow one.
    #
    # THE NUMBER: the friction trend report (2026-09-13, kb-internal#406/#407)
    # measured scheduled workflow runs failing at 15.4% over 9,746 runs against
    # 2.9% on pull requests, and nothing triaged them. 10% sits below that
    # measured baseline (so the alert would have caught the condition the report
    # found) and above the failure rate of every routinely-green scheduled
    # workflow this alerter's own live read-only run observed (0-9.7% -- see
    # tests/ci/test_scheduled_run_failure_rate_omn18322.py for the captured
    # evidence), so a workflow that is merely occasionally flaky does not page.
    scheduled_failure_threshold_pct: 10.0
    # 7 days: long enough that a 10-minute cron (pr-ci-zombie-detector.yml
    # itself: ~1000 scheduled runs/week) and a nightly job (~7 runs/week) both
    # clear a sample size worth a percentage, short enough that the alert
    # reflects current behavior rather than an outage that was fixed weeks ago.
    scheduled_window_days: 7
    # THE FLEET REPOSITORY LIST, DECLARED ONCE (OMN-18942).
    #
    # Until this key existed the list was three repository names written as
    # literals into the run step of `.github/workflows/pr-ci-zombie-detector.yml`,
    # and the 2026-09-20 silent-gates review measured what that cost: the
    # registry repository's cross-repo drift detector had failed 12 of 12 daily
    # runs since 2026-09-09 and was outside the fleet's only alerter BY
    # CONSTRUCTION, so no amount of it being red could ever reach anybody.
    #
    # DERIVED, NOT HAND-LISTED. Every canonical-registry repository that
    # declares at least one scheduled workflow. Re-derive rather than edit from
    # memory, from a checkout of the registry:
    #
    #   for r in <registry repos>; do
    #     grep -rlE '^\s*schedule:' "$r/.github/workflows" | wc -l
    #   done
    #
    # Measured 2026-09-20: omnibase_infra 32, omninode_infra 14, omniclaude 7,
    # omnimarket 5, omnibase_core 4, omniweb 4, omni_home 3,
    # onex_change_control 3, omnibase_compat 2, omniintelligence 2,
    # omnimemory 2, omnibase_spi 1, omnidash 1. `knowledge-base` declares none
    # and is therefore absent -- absent because it has nothing to watch, not
    # because anybody decided not to watch it.
    #
    # Being in this list is what makes a repository's scheduled surface
    # governed, the same posture as the maintenance-sync MANIFEST and the
    # required-context probe's own repo set.
    fleet_repos:
      - omnibase_core
      - omnibase_compat
      - omnibase_infra
      - omnibase_spi
      - omniclaude
      - omnidash
      - omniintelligence
      - omnimarket
      - omnimemory
      - omni_home
      - omninode_infra
      - omniweb
      - onex_change_control
    # WHICH CALLER EVALUATES EACH FLEET REPOSITORY'S SCHEDULED RUNS (OMN-18942).
    #
    # The scheduled sweep has two callers, and every fleet repository belongs to
    # exactly one of them, so no scheduled run is evaluated or posted twice:
    #
    #   * the repositories listed here: the `nonrequired-check-failure-rate`
    #     job in `.github/workflows/pr-ci-zombie-detector.yml`, passed as
    #     `--scheduled-repo`, under the onexbot App token (installation
    #     repository_selection `all`);
    #   * every other entry of `fleet_repos`: the `.201` system reporter, whose
    #     `--repos-from-policy` selection is fleet_repos minus this list.
    #
    # WHY omni_home IS HERE. Measured 2026-09-23T17:45Z: the `.201` host token
    # returns HTTP 404 on omni_home, so the reporter rendered it as
    # `sched/omni_home/source-unreadable` and evaluated nothing, and the Actions
    # job ran `--no-scheduled`. The registry repository, the one this ticket
    # names, was watched by nobody. Under a token that reads it, two of its three
    # scheduled workflows were red on 8 of 8 runs. Moving it here needs no new
    # credential and no widened one: the App installation already reads it.
    #
    # A repository moves back to the host by deleting it here and removing its
    # `--scheduled-repo` line; the tests refuse a mismatch between the two.
    scheduled_actions_repos:
      - omni_home
    # ALERT DEDUP WINDOW (OMN-18942), in hours.
    #
    # Measured 2026-09-23: with the channel secrets set at 10:43Z, every
    # scheduled run of pr-ci-zombie-detector.yml re-posted the same unchanged
    # findings (runs 35850665037, 35851297482, 35852673260). A finding whose
    # failure count is unchanged or lower than the count last POSTED is
    # suppressed for this long after that post, and the suppression is written
    # to the run's report artifact and job summary. A new finding, a higher
    # count, or an expired window posts immediately.
    #
    # WHY 24: a standing, unchanged non-required-check failure is a triage
    # item, not a page. Once per day keeps it in front of a reader without the
    # ~144 posts a day a ten-minute cadence would otherwise produce, and any
    # deterioration re-posts at once, so the window never hides a worsening.
    # Shorter (the `.201` reporter re-surfaces its scheduled-workflow keys
    # every 6h) would put four copies of an unchanged finding in the channel
    # per day for a class that blocks nothing. The prior state lives in the
    # report artifact, whose 30-day retention comfortably covers the window.
    alert_dedup_window_hours: 24
    # ABSENT FROM required_status_checks IS NOT THE SAME AS UNENFORCED.
    # omnibase_infra requires exactly ONE context on dev - the CI Summary
    # umbrella - whose poller fails on any job in its own run that concludes
    # badly, so dozens of checks block a merge while appearing nowhere in branch
    # protection (OMN-4497 / OMN-14127). Reporting those as unwatched would bury
    # the real finding in noise, and an alerter nobody reads is the failure mode
    # OMN-16030 already paid for once on the canary this rides.
    #
    # Each entry is a context the repo enforces through a mechanism branch
    # protection cannot show. The honest limit: a context enforced by something
    # nobody wrote down still reads as non-required, and the fix is to write it
    # down here rather than to widen the threshold.
    umbrella_enforced_contexts:
      # DERIVED, NOT GUESSED. Every name below is one that the CI Summary poller
      # requires: its own required context, the strict and skippable aggregate
      # gates it resolves from this run, and the external contexts it resolves
      # from the pull-request head. Each of these DOES block a merge while
      # appearing nowhere in branch protection.
      #
      # A LIVE RUN IS WHY THIS LIST EXISTS RATHER THAN JUST THE UMBRELLA NAME.
      # With only the umbrella declared, the first read-only run raised on
      # verify / verify and occ-preflight / eligibility -- both enforced, one of
      # them the Receipt Gate. Four findings, two of them noise, on the very
      # first run. That is how an alerter gets muted before it ever catches
      # anything, which is the OMN-16030 failure mode this phase keeps citing.
      #
      # This is a dated snapshot of another module's constants and it WILL
      # drift. test_the_umbrella_list_matches_the_summary_gate reads those
      # constants live and fails when the two disagree, so drift is a red test
      # rather than a silent false positive.
      omnibase_infra:
        # OMN-18796: the no-new-advisory-job gate. Enforced by the CI Summary
        # poller via EXPECTED_EXTERNAL_CONTEXTS and absent from branch
        # protection, which is exactly the shape this list records.
        - advisory-job-gate / advisory-job-gate
        - Application Database Domain Enforcement (OMN-15361)
        - Arch Invariants (OMN-3343)
        - call-reject-skip-token / scan / reject-skip-gate-token
        - Canonical Inference Gate
        - CI Evidence Policy (OMN-18247)
        - CI Summary
        - CI Tests Gate
        - ci-bus-overlay-binding
        - CodeQL
        - Contract Compliance
        - Contract Compliance Check
        - Contract Sync Gate (Wave C) [OMN-8915]
        - contract-validation
        - Customer Path Boundary (OMN-18012)
        - Demo Loop Gate
        - Dep Provenance Gate
        - Dep Provenance Lineage Gate (OMN-15604)
        - Deploy Agent Tests (OMN-15378) / deploy-agent-tests
        - deploy-gate / deploy-gate
        - dispatcher-route-coverage
        # OMN-18938: the cross-repo dispatch keyword parity gate.
        - consumer-kwarg-parity
        - Duplication Sweep
        - Effect-Assertion Gate (RT-5)
        - Event Chain Gate
        - Exposed Identifier Gate (OMN-17320)
        - exposure-reader-coverage
        - Fingerprint Check
        - Governed helper primitive gate
        - imperative-contract-guard / Imperative Contract Guard
        - Infra Node Handler Ownership
        - Integration Silent-Skip Guard (OMN-14172)
        - Integration Test Removal Gate
        - Kafka Schema Handshake (OMN-3411)
        - kb-doc-gate / kb-doc-gate
        # OMN-19412: the lab-release-sync probe-window drift check, registered
        # STRICT in ci.yml's STRICT_GATE_JOBS and enforced by the CI Summary
        # poller; absent from branch protection, which is exactly the shape
        # this list records.
        - Lab Probe Windows (OMN-19412)
        - Lint
        - Lockfile CVE Scan (OMN-16228)
        - Lockfile Registry Allowlist (OMN-16516)
        - main-target-guard
        - merge-hold-gate / evaluate
        - Migration Freeze Check
        - Migration Integration Test
        - no-noncanonical-lifecycle-classes
        - Node Migration Declaration Check
        # OMN-19677: the five shared shrink-only callers are strict CI Summary
        # gates and therefore belong in this umbrella-enforced snapshot.
        - Noncanonical Class Allowlist One-way (OMN-19677) / anti-growth-baseline
        - non-dev-base-guard
        - OCC Companion Merged Gate (OMN-15214)
        - occ-preflight / eligibility
        - Omni Standards Gate
