#
# lab_pass_settle_budget.yaml -- the DECLARED settle budget for each lab lane
# the rule 24(a) lab-pass receipt probes (OMN-18436).
#
# WHAT A SETTLE BUDGET IS. `check_dev_lane_staleness.py --expect-revision`
# returns the moment the RUNNING container carries the expected revision label,
# and that label is stamped at container-create time, not when the runtime has
# bound its port. The settle budget is how long the receipt emitter waits, AFTER
# convergence returns, for the lane to answer its readiness endpoints.
#
# WHY IT IS DECLARED HERE RATHER THAN COMPUTED IN THE JOB. Until OMN-18436 the
# budget was `job ceiling - elapsed - reserved tail`, i.e. whatever the
# convergence wait happened to leave. That makes the lane's boot time a function
# of how busy the deploy agent was, which it is not. Worse, the three constants
# the job declared could not all hold at once: a 30-minute ceiling, a 25-minute
# convergence wait and a 120-second tail leave 180 seconds for a boot measured at
# 463-668 seconds, so every convergence slower than about 20 minutes produced a
# receipt that FAILED on timing alone -- on a healthy lane running the merged
# sha. Rule 24(b) fails closed on a FAIL receipt, so that receipt then refused
# the sha for staging delivery.
#
# The budget is declared here, the job ceiling is DERIVED from it
# (`converge_timeout + settle + reserved_tail`), and
# tests/ci/test_lab_pass_settle_budget.py asserts the arithmetic over both
# runtime-rebuild-trigger.yml and runtime-rebuild-trigger-reusable.yml. Raising
# the ceiling is therefore a consequence of a declared number rather than a
# knob, and lowering the declaration below the measurement is a red test rather
# than a review catch.
#
# HOW A VALUE IS SIZED. Bounded BELOW by the worst boot this lane has been
# OBSERVED to take (an observation is a floor on the real cost, never an
# estimate of it -- the same reasoning `test_rebuild_trigger_ceiling_omn18200.py`
# applies to the publisher's ceiling), and bounded ABOVE by the lane's own
# declared compose `start_period`, which is the point docker itself stops
# treating a slow boot as a boot. Both bounds are asserted mechanically against
# the parsed compose model; neither is a comment.
schema_version: 1
lanes:
  compose-dev:
    # Resolved to 900s: 1.35x the worst observation below, and half the 1800s
    # start_period `docker/docker-compose.infra.yml` declares on both
    # `omninode-runtime` and `runtime-effects`.
    settle_budget_seconds: 900
    # The compose model this lane's upper bound is read from, and the services
    # whose readiness the receipt actually waits on. The reader takes the MAX
    # declared `start_period` across them; a service naming none is a hard
    # failure, not a skipped row.
    compose_file: docker/docker-compose.infra.yml
    readiness_services:
      - omninode-runtime
      - runtime-effects
      - projection-api
    # Every observation is a `lane ready after Ns` line from a real emitted
    # compose-dev receipt, with the sha it was keyed by. The lower bound is the
    # MAX of these, so adding a slower observation without raising the budget
    # turns the test red.
    observed_boot_seconds:
      - seconds: 463
        sha: 9469bef3
        note: lab-pass receipt, "ready after 463s"
      - seconds: 488
        sha: 6c540f4e
        note: lab-pass receipt, "lane ready after 488s"
      - seconds: 526
        sha: 00926431e0185b674af1b9ea03aea7a3cf804f2c
        note: runtime-rebuild-trigger run 34835273599, "lane ready 526s of 960s"
      - seconds: 668
        sha: 732fd291a98afeac849a4904670b210096649529
        note: runtime-rebuild-trigger run 34825117758, "lane ready after 668s of an 837s settle budget"
# ---------------------------------------------------------------------------
# OMN-18276 -- the DELIVERY GATE's wait budget.
#
# WHAT IT IS. `lab-pass-gate` in deliver-dev-candidate-to-staging.yml asks the
# artifact surface for the PERSISTENT lab's receipt for the delivered sha. That
# receipt is emitted by a different workflow (runtime-rebuild-trigger.yml), in
# a different run, on the lab host, after the deploy agent has applied the
# k3s onex-lab overlay. It is therefore not there when the gate first looks,
# and a gate that does not wait asks a question the surface cannot yet answer.
#
# WHY IT IS DECLARED HERE. Same reason as the settle budgets above: so the
# job's ceiling is DERIVED from a declared number that observation bounds from
# below, rather than being a knob somebody lowers to make a red job green.
# `wait_budget_seconds + reserved_tail_seconds` IS the job's timeout-minutes,
# and tests/ci/test_lab_pass_receipt_persistent_lab_omn18276.py asserts the
# arithmetic against the workflow.
#
# WHY WAITING IS NOT A SOFTENING. The wait expiring is a refusal like any
# other: there is no --force, no skip input, and the expiry branch names both
# causes it could have (a slow apply, or a sha the rebuild trigger's
# runtime-path classifier never published a rebuild for).
delivery_gate:
  # 5400s = 1.23x the worst observation below. Bounded ABOVE by the practical
  # ceiling that a wait longer than the lab's own end-to-end pipeline stops
  # measuring the lab and starts measuring the queue in front of it.
  wait_budget_seconds: 5400
  # Checkout, uv install, the final summary, and the runner's own teardown.
  reserved_tail_seconds: 600
  # Every observation is (persistent-lab receipt artifact created_at) minus
  # (the moment this job could first have looked, i.e. the kind-smoke receipt's
  # created_at on the same delivered sha), read live from the Actions artifact
  # API on 2026-09-19. The lower bound is the MAX of these, so adding a slower
  # observation without raising the budget turns the test red.
  observed_wait_seconds:
    - seconds: 947
      sha: 999e8a499d40721a75fe9cf43c7be1ffe6ca61c2
      note: delivery run 35404318943; kind 23:21:19Z, persistent lab 23:37:06Z
    - seconds: 2647
      sha: 1f1a2ed9a743dfde2a22fcb5e4bb70180bf9d06e
      note: delivery run 35387019344; kind 19:52:22Z, persistent lab 20:36:29Z
    - seconds: 2676
      sha: 27bfe930ea5550dba104bf84204c87533948a507
      note: delivery run 35413940487; kind 02:06:42Z, persistent lab 02:51:18Z
    - seconds: 4373
      sha: b160b9be12f955a8f6296bbfe12a50bb448323df
      note: delivery run 35383855713; kind 19:19:02Z, persistent lab 20:31:55Z
