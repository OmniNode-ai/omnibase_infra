#
# OMN-18781 — every module-level, env-gated test skip, and where it runs.
#
# WHY THIS FILE EXISTS
# --------------------
# Two integration suites carried a module-level `pytest.mark.skipif` on an opt-in
# environment variable that no workflow in this repository set. They were
# collected on every pull request, skipped in full, and reported green. One of
# them was the event bus's own integration proof, and it had never executed in
# CI. Nothing surfaced it, because a skipped test and a deselected test look
# identical from outside the run.
#
# This file is the answer to "where does this suite actually run?", asked of
# every module-level skip whose condition reads an environment variable.
# `tests/ci/test_env_gated_skip_registry_omn18781.py` enforces it in both
# directions: an unregistered skip fails, and a stale entry fails.
#
# WHAT THE RATCHET PROVES, AND WHAT IT DOES NOT
# ---------------------------------------------
# For a `workflow:` entry the ratchet proves that the named workflow file
# PROVABLY SETS every variable the skip reads — a YAML env key, a `$GITHUB_ENV`
# write, or a `--env` on a container. That is a real, mechanical fact, and it is
# what caught the original defect.
#
# It does NOT prove that the workflow SELECTS the module: pytest selection is a
# command line, not a declaration, and reproducing pytest's marker algebra here
# would be a second implementation to keep in sync. The `job:` and `selected_by:`
# fields below are therefore documentation, verified by a human at the dates
# given, not by the test. An entry may be honest about the variable and wrong
# about the selection; the way to check the second is to read the run.
#
# `unprovisioned_ticket:` is not a suppression. It is a statement that a suite
# has NO execution path today, carrying the ticket that owns closing it. Adding
# one is a decision to leave a suite unrun; it is never a way to quiet the test.
suites:
  # ---------------------------------------------------------------------------
  # Suites with an execution path
  # ---------------------------------------------------------------------------
  tests/integration/event_bus/test_adapter_protocol_event_publisher_kafka.py:
    env_vars: [KAFKA_BOOTSTRAP_SERVERS]
    workflow: .github/workflows/nightly-integration.yml
    job: nightly-integration / "Run integration tests"
    selected_by: >-
      pytest tests/integration/ -m "integration and not bastion" — the module is kafka-marked and integration-marked, and the nightly filter selects both. The broker is the dockerized e2e stack's Redpanda; KAFKA_BOOTSTRAP_SERVERS is written to $GITHUB_ENV by the "Resolve reachable e2e connectivity host" step. Verified 2026-09-18.
  tests/integration/runtime/test_golden_chain_live_runtime.py:
    env_vars: [KAFKA_BOOTSTRAP_SERVERS]
    workflow: .github/workflows/nightly-integration.yml
    job: nightly-integration / "Run integration tests"
    selected_by: >-
      Same selection and same broker as the adapter suite above. Verified 2026-09-18.
  tests/integration/runtime/test_kafka_contract_source_integration.py:
    env_vars: [KAFKA_BOOTSTRAP_SERVERS]
    workflow: .github/workflows/nightly-integration.yml
    job: nightly-integration / "Run integration tests"
    selected_by: >-
      Same selection and same broker as the adapter suite above. Verified 2026-09-18.
  tests/integration/services/mcp/test_service_mcp_tool_sync.py:
    env_vars: [KAFKA_BOOTSTRAP_SERVERS]
    workflow: .github/workflows/nightly-integration.yml
    job: nightly-integration / "Run integration tests"
    selected_by: >-
      Same selection and same broker as the adapter suite above. Verified 2026-09-18.
  tests/integration/migrations/test_node_migration_shape_drift_omn15376.py:
    env_vars: [OMN15376_REQUIRE_PG]
    workflow: .github/workflows/ci.yml
    job: migration-integration
    selected_by: >-
      Named by path in that job's pytest invocation, which provisions Postgres and sets OMN15376_REQUIRE_PG=1 so a Postgres-absent run FAILS instead of skipping. This is the repository's existing idiom for a fail-closed service requirement, and OMN-18781 follows it. Verified 2026-09-18.
  tests/integration/migrations/test_omn17316_role_set_membership_guard.py:
    env_vars: [OMN17316_REQUIRE_PG]
    workflow: .github/workflows/ci.yml
    job: migration-integration
    selected_by: >-
      Named by path in that job's pytest invocation, same fail-closed idiom as the shape-drift proof above. Verified 2026-09-18.
  # ---------------------------------------------------------------------------
  # Suites with NO execution path — residuals, each one a real gap
  # ---------------------------------------------------------------------------
  #
  # Every entry below was surfaced by the OMN-18781 scan. They are the same
  # class as the two suites that ticket repaired, and they are recorded here
  # rather than repaired in the same change because each needs its own
  # provisioning decision. OMN-18775 is the epic that owns closing them.
  tests/integration/event_bus/test_dlq_integration.py:
    env_vars: [KAFKA_BOOTSTRAP_SERVERS, KAFKA_INTEGRATION_TESTS]
    unprovisioned_ticket: OMN-18775
    reason: >-
      Dead-letter-queue proofs against a real broker. KAFKA_INTEGRATION_TESTS is set only by the ci.yml service-integration-suites job, which selects the event-bus and Qdrant suites by path and not this one, so this module still skips everywhere. Cost of leaving it: the DLQ path has no executing integration proof. Closing it is a selection decision — add the module to that job once its runtime against a fresh broker is known.
  tests/integration/nodes/test_node_reward_binder_effect.py:
    env_vars: [KAFKA_BOOTSTRAP_SERVERS, KAFKA_INTEGRATION_TESTS]
    unprovisioned_ticket: OMN-18775
    reason: >-
      Reward-binder effect against a real broker; same KAFKA_INTEGRATION_TESTS gap as the DLQ suite. Cost: the reward-binder bus path is unproven in CI.
  tests/integration/registration/e2e/conftest.py:
    env_vars: [KAFKA_BOOTSTRAP_SERVERS, KAFKA_INTEGRATION_TESTS]
    unprovisioned_ticket: OMN-18775
    reason: >-
      The registration end-to-end conftest gates its whole directory on KAFKA_INTEGRATION_TESTS, which nothing that selects it sets. Cost: the registration E2E family does not execute anywhere.
  tests/integration/test_runtime_consumes_build_loop_terminal_event.py:
    env_vars: [INTEGRATION_POSTGRES_HOST, KAFKA_BOOTSTRAP_SERVERS, KAFKA_INTEGRATION_TESTS]
    unprovisioned_ticket: OMN-18775
    reason: >-
      Needs a broker, a Postgres and the opt-in together. The nightly provides the first two and not the third. Cost: the build-loop terminal-event consumption proof does not execute.
  tests/integration/registration/e2e/test_runtime_e2e.py:
    env_vars: [RUNTIME_HOST, RUNTIME_PORT]
    unprovisioned_ticket: OMN-18775
    reason: >-
      RUNTIME_PORT is set by no workflow in this repository, so the pair can never both be present in CI. Cost: the runtime end-to-end suite does not execute. Closing it means deciding which job owns a booted runtime — reusable-runtime-boot.yml already sets RUNTIME_HOST and is the candidate.
  tests/integration/migrations/test_omn15683_mixed_representation_conversion.py:
    env_vars: [OMN15683_REQUIRE_PG]
    unprovisioned_ticket: OMN-18775
    reason: >-
      Carries the same fail-closed REQUIRE_PG idiom as its two sibling migration proofs, but no workflow sets ITS flag, so it skips where they run. This is the idiom failing silently in exactly the way OMN-18781 is about: the variable name differs by ticket number, and one of the three was missed.
  tests/integration/handlers/test_handler_graph_integration.py:
    env_vars: [MEMGRAPH_BOLT_URL]
    unprovisioned_ticket: OMN-18775
    reason: >-
      Needs a Memgraph instance. No workflow provisions one and none is declared in any compose file CI uses. Cost: the graph handler has no executing integration proof.
  tests/integration/scripts/test_register_repo_omnimarket.py:
    env_vars: [INFISICAL_ADDR]
    unprovisioned_ticket: OMN-18775
    reason: >-
      Needs a reachable Infisical. CI has no instance and the credential posture for one is its own decision. Cost: repo registration against a real secret store is unproven in CI.
  tests/integration/correlation/test_correlation_propagation_heavy.py:
    env_vars: [RUN_HEAVY_TESTS]
    unprovisioned_ticket: OMN-18775
    reason: >-
      An explicit heavy-test opt-in that no workflow sets. Unlike the rows above this one may be a deliberate local-only affordance, but nothing said so, and an undocumented never-run suite is indistinguishable from an oversight. Closing it means either giving it a nightly home or deleting it with a written statement of the coverage given up.
