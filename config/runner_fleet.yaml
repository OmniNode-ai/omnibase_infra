# Authoritative GitHub Actions runner fleet config.
#
# This file is the source of truth for deploy-runners.sh, runner-monitor.sh,
# and the runner health CLI. Do not duplicate these values in scripts.
version: "1.0"
github_org: OmniNode-ai
# Use Tailscale MagicDNS so rebuild/deploy/monitor flows do not depend on the
# runner host's current LAN or Tailscale IP address.
runner_host: omninode-pc.tail75df5e.ts.net
runner_group: omnibase-ci
runner_name_prefix: omninode-runner
# Phase-A scale-up (OMN-14029), extended for saturation recovery (OMN-15978):
# 72 always-on steady-state runners. All 72 are steady (no burst
# profiles), so burst_count == expected_count (no separate burst tier).
expected_count: 72
burst_count: 72
# Docker subnet-pool alerting (OMN-12566). The runner host's default address
# pool can subnet a bounded number of networks before `docker network create`
# fails with "all predefined address pools have been fully subnetted". Alert at
# network_pool_warn_ratio of capacity so the janitor reclaims before exhaustion.
network_pool_capacity: 31
network_pool_warn_ratio: 0.8
# OMN-14027 C1 — PyPI pull-through cache (devpi) endpoint. Source of truth for the
# egress cache the fleet points at.
#
# STATUS 2026-08-14: cache SERVICE LIVE, canary WIRED, fleet NOT yet activated.
#   - devpi service is up and healthy on the runner host (container
#     omninode-pypi-cache, 22G warmed corpus, index HTTP 200).
#   - A 3-runner canary (omninode-runner-2/4/5) is wired via
#     docker/docker-compose.pypi-canary.yml and verified by container-env
#     readback. Runbook step 3 is DONE.
#   - `active` stays false because it means FLEET-ACTIVE. Runbook step 5 gates
#     the fleet on measured canary acceptance (hit rate >= target_hit_rate, p95
#     `uv sync` wall time, zero UV_HTTP_TIMEOUT failures under high-concurrency
#     load). The canary has proven the MECHANISM resolves through the cache but
#     has NOT yet accumulated a soak under the 64/64-busy load the acceptance
#     criteria are written against — the queue is serialized and the fleet is
#     lightly loaded. Flipping this to true on mechanism-proof alone would skip
#     the exact measurement the gate exists to take.
#   - The matching UV_DEFAULT_INDEX / PIP_INDEX_URL wiring therefore stays
#     commented in docker/docker-compose.runners.yml. Do not uncomment it here or
#     there as a shortcut; graduate via the runbook.
# Runbook: docs/runbooks/pypi-cache-egress-rollout.md.
pypi_cache:
  active: false
  # Runners currently wired at the cache via docker/docker-compose.pypi-canary.yml.
  # Empty once the canary graduates to the fleet or is rolled back.
  canary_runners:
    - omninode-runner-2
    - omninode-runner-4
    - omninode-runner-5
  # Tailscale MagicDNS host + published port, matching runner_host above so the
  # endpoint does not depend on the runner host's current LAN/Tailscale IP.
  host: omninode-pc.tail75df5e.ts.net
  port: 3141
  # devpi's built-in on-demand pull-through mirror index.
  simple_index_url: http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/+simple/
  # Keep PyPI as the fallback so a cache miss/outage degrades, not fails-closed.
  fallback_index_url: https://pypi.org/simple/
  # Acceptance target before fleet-wide rollout (OMN-14027 metrics).
  target_hit_rate: 0.90
