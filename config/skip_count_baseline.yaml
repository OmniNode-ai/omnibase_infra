# OMN-18776 — per-suite skip-count baseline (epic OMN-18775).
#
# Each entry records what a suite is ALLOWED to leave unexecuted, and how that
# number was measured. An entry with no provenance is refused by the gate: a
# baseline with no recorded measurement is a claim, not a measurement.
#
# Lowering a number here is the ONLY way to lower the bar. There is no flag and
# no environment variable on scripts/ci/skip_count_ratchet.py that does it, and
# tests/ci/test_skip_count_ratchet_omn18776.py reads the parser's own option
# strings to keep it that way.
#
# mode: count    — the collected set is identical every run; compare the number.
# mode: nodeids  — an impacted-test selector varies the collected set, so compare
#                  identities instead. A selector only ever narrows, so a narrowed
#                  run's skip set is a subset of a full-width baseline.
#
# Honest limit: this counts skips, it does not judge them. A structurally sound
# skip and one caused by an env var CI never sets look identical here. What the
# ratchet removes is the SILENT GROWTH of the set, not the set.
version: 1
suites:
  omnibase_infra/test-parallel:
    repo: omnibase_infra
    job: Tests (Split n/m)
    mode: nodeids
    max_skips: 552
    baseline_collected: 38874
    provenance:
      measured_at: '2026-09-18'
      measured_by: OMN-18776
      measurement_command: gh run download 35402899669 --repo OmniNode-ai/omnibase_infra --pattern 'test-results-*' --dir <dir> && uv run python scripts/ci/skip_count_ratchet.py --print-observed --suite omnibase_infra/test-parallel --junit <dir>/*/junit-*.xml
      source_runs:
        - '35402899669'
      corroborating_runs:
        - '35404351173'
        - '35400977169'
      notes: '35402899669 is a full-width run: 15 splits, 38874 collected, 547 unique skipped test ids (617 raw, because 5 module-level skips are re-reported by every split that collected the module). Mode is nodeids because this job sits behind the impacted-test selector and its raw count legitimately varies: the two corroborating runs collected 7719 and 4228 and skipped 45 and 95. Both of those sets are subsets of this baseline (0 ids outside it), which is why a narrowed run cannot false-fail. Positive control for that zero: injecting one synthetic id into the same comparison reports 1.'
      omn18693_addendum: 'OMN-18693 adds 3 node ids and 547 -> 550: test_owner_lineage_grant_migration_fails_when_a_grant_is_mutated_away and the two test_owner_lineage_grants_complete_the_real_forward_runner[fresh|legacy] parametrizations in tests/integration/migrations/test_102_tenant_projection_writer_role_omn15425.py. All three are @pytest.mark.integration @pytest.mark.postgres live-cluster proofs (EphemeralPostgres fixture), deselected by design on this job the same way every other postgres-marked test in this file already is -- they are collected-but-skipped, not broken.'
      omn18863_addendum: 'OMN-18863 adds 2 node ids and 550 -> 552, both in tests/ci/test_supplemental_declaration_expiry_omn18863.py. They assert the interim supplemental table-grant declarations against the PINNED omnimarket contract set, so they require the .proof-dependencies/omnimarket checkout that only the Application Database Domain Enforcement (OMN-15361) job provides; that job runs this module by name in its own pytest list, so the assertions DO execute on every pull request, just not in this job. Same structure and same reason as tests.ci.test_omnimarket_contract_pin::test_an_upstream_contract_addition_cannot_red_an_unrelated_infra_pr, already in this list. The module deliberately skips rather than passing when the checkout is absent, because a green meaning I could not look is the exact failure this ticket is about. An earlier revision of this change put 14 such tests in tests/integration/ and this ratchet refused them by name; they were rewritten to need no foreign tree and now run everywhere, which is why only 2 are recorded here rather than 16.'
