  host: "sha256:b055060ffc8f40853195fb97c9bfb54cb64b3013634e19894b08ffefa4c8c315"
  container: "omnibase-infra-redpanda"
  image: "redpandadata/redpanda:v25.2.14"
  cluster_version: 16
  node_latest_version: 16
  node_earliest_version: 15
  started_at: "2026-10-29T01:23:05.066033066Z"
  restart_count: 0
