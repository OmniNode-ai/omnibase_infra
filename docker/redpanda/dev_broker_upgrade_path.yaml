# Dev broker Redpanda upgrade path (OMN-21279).
#
# The dev broker (omnibase-infra-redpanda) crashes inside Kafka ListGroups on
# v24.3.18 (docs/incidents/OMN-21279/dev-broker-crash-cause.json). Upstream
# fixed the group erase race in PR redpanda-data/redpanda#31221 (CORE-16883),
# backported to v25.3.x in #31229 for v25.3.16; there is no v24.3.x backport
# and no v25.2.x release after the backport merged.
#
# OMN-20769, 2026-10-28: the first hop was read back live. The dev broker ran
# redpandadata/redpanda:v25.1.12 (docker inspect on h201, /v1/features
# cluster_version 15, node_latest_version 15), so deployed_feature_release became
# 25.1 and that hop left path. v25.1.12 does not carry the CORE-16883 fix: it
# crashed at kafka::group_manager::list_groups +0x1cb on 2026-10-28T08:35:30Z,
# the frame of the v24.3.18 crashes. The fix first ships in v25.3.16, two hops on.
#
# Redpanda upgrades one feature release at a time: v25.3.x declares
# earliest_version = v25_2_1 ("The earliest version we can upgrade from"), so a
# v25.3 broker does not start on the v24.3 data volume. The dev pin may move at
# most one feature release past deployed_feature_release, along path in order. Advance
# deployed_feature_release only after that hop is live on the dev broker and
# read back (docker inspect image plus /v1/features active version), and drop
# that hop from path in the same change.
#
# tests/unit/docker/test_dev_broker_upgrade_path_omn21279.py and
# test_dev_broker_hop_logical_versions_omn21279.py read this file.
deployed_feature_release: "25.2"
first_fixed_release: "25.3.16"
feature_releases: ["24.2", "24.3", "25.1", "25.2", "25.3", "26.1"]
path:
  - redpandadata/redpanda:v25.3.18
# Logical versions read from /v1/features on scratch brokers on 2026-10-26
# (docs/incidents/OMN-21279/dev-broker-crash-cause.json, fix_path.hop_proof):
# latest is node_latest_version, the cluster_version the image finalizes at;
# earliest is node_earliest_version, the oldest cluster_version it starts on.
# A synthetic v24.3.18 volume went 14 -> 15 -> 16 -> 17 through this path with
# topics, groups, committed offsets and the SCRAM user intact; v25.3.18 started
# directly on it asserted "incompatible logical version 14 to logical version 17".
logical_versions:
  redpandadata/redpanda:v24.3.18:
    latest: 14
    earliest: 11
  redpandadata/redpanda:v25.1.12:
    latest: 15
    earliest: 12
  redpandadata/redpanda:v25.2.14:
    latest: 16
    earliest: 15
  redpandadata/redpanda:v25.3.18:
    latest: 17
    earliest: 16
# Each hop was started in order on one scratch copy of the dev data volume and
# reached Healthy with cluster_version equal to node_latest_version. A dev pin
# past deployed_feature_release must be listed here (operator RULING
# 2026-10-20T17:35:21Z: the dev broker moves to a version proven on a data copy).
proven_on_data_copy:
  - image: redpandadata/redpanda:v25.1.12
    started_healthy_at: "2026-10-26T16:07Z"
    cluster_version: 15
  - image: redpandadata/redpanda:v25.2.14
    started_healthy_at: "2026-10-26T16:08Z"
    cluster_version: 16
  - image: redpandadata/redpanda:v25.3.18
    started_healthy_at: "2026-10-26T16:10Z"
    cluster_version: 17
# The second hop is now live on h201. Retain the already deployed v25.2.14
# pin; v25.3.18 remains a separate future upgrade. This snapshot records the
# plan's observation, not future health. Raw inspect output brackets the
# features GET in that container ID. Host identity is the SHA-256 of hostname
# output so this public evidence does not expose a private DNS name.
planned_at: "2026-10-29T02:40:13.932301+00:00"
readback_sha256: "48250fd78d910ef74cee5ddd07c3479df60fe17521ed94c3f72c688fcdf6cea3"
deployed_readback:
