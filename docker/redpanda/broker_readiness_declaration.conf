#
# Dev-lane broker readiness declaration (OMN-18789).
#
# This file is the SOURCE OF TRUTH for every bound the readiness probe applies.
# `broker_readiness_probe.sh` reads it and fails closed when it is unreadable or
# when a key below is absent. There is no `${VAR:-default}` anywhere in the
# probe and no environment fallback for any value here (Operating Rule 8): a
# silent default is how a wrong bound ships and is never seen again.
#
# WHY A `key=value` FILE AND NOT YAML. The probe runs INSIDE
# `redpandadata/redpanda:v24.2.7`, as that container's Docker healthcheck. That
# image carries bash, awk, sed, grep, curl and rpk. It carries NO python3 and no
# YAML parser -- measured in-container 2026-09-19. A YAML declaration would
# either need a second rendered artifact to stay in sync with, or a YAML parser
# written in awk. One file both the probe and its tests read is the smaller
# surface.
#
# Credentials are deliberately NOT here. They are secrets, they are resolved by
# `scripts/deploy-runtime.sh` from the operator env file, and they reach rpk
# through `RPK_USER` / `RPK_PASS` in the environment -- never through this file
# and never through argv (`ps` is readable by every process in the container).

# How long a consumer group that has committed before may sit at an unchanged
# committed offset, while it is behind, before the lane is NOT READY.
#
# 300s is chosen against measurement, not taste. Sampled live on the `.201` dev
# lane 2026-09-19 over a 180s interval: of ~899 consumer groups, 6-9 were
# Stable with a member and non-zero lag at any instant, and every one of them
# that had ever committed advanced its offset within the interval. The one
# group that did not is the `snapshot-cache` consumer, which has never
# committed at all and is structurally outside this check (see the probe).
#
# With the healthcheck's 30s interval and 5 retries, the window plus the
# consecutive-failure requirement puts `docker ps` at `unhealthy` roughly 7.5
# minutes into a wedge. The outage this ticket is about ran 97 minutes with
# every surface green.
sync_window_seconds=300

# The topic whose partition offsets are read to prove the data path answers.
# `__consumer_offsets` is the right target for three reasons: it exists on any
# cluster that has ever hosted a group, it is not lane-specific, and it is
# exactly what was stuck -- the 2026-09-18 outage logged 1500
# `controller_backend.cc:963 [{kafka/__consumer_offsets/N}] reconciliation
# seems stuck` lines. When it is absent (a fresh volume) the probe reads the
# first topic the broker lists instead, and a broker with no topics at all is
# READY because there is no partition to read.
probe_topic=__consumer_offsets

# The Kafka listener the probe reads through. The INTERNAL listener, by name on
# the compose network: the probe runs inside the broker container and must ask
# the same question a lane client asks, over the Kafka API, not the admin API.
broker=redpanda:9092

# The SASL mechanism used when credentials are present in the environment. The
# probe tries an authenticated read first and an unauthenticated one second, so
# it works both before and after the OMN-18012 `enable_sasl` flip; a broker that
# refuses both is NOT READY.
sasl_mechanism=SCRAM-SHA-256
