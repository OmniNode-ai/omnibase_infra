# unbound.conf — caching resolver for the OmniNode self-hosted runner fleet.
# Ticket: OMN-15736. Runbook: knowledge-base:runbooks/runner-dns-cache-rollout.md.
#
# Goal: absorb repeat DNS lookups for the same CI hostnames
# (files.pythonhosted.org, pypi.org, codeload.github.com, api.github.com, ...)
# across a 64+ concurrent runner cold-start burst, and absorb NXDOMAIN/SERVFAIL
# retry storms with a short negative-cache floor — without masking a real
# upstream outage for longer than that floor.

server:
    interface: 0.0.0.0@53
    access-control: 0.0.0.0/0 allow
    # Runner containers only ever query this resolver over the fleet's Docker
    # network; access-control is scoped in deployment via the compose network,
    # not relied on here as the sole boundary.

    # --- Logging ---
    verbosity: 1
    logfile: ""
    use-syslog: no
    log-queries: no

    # --- Caching, sized for 64+ concurrent runner containers ---
    # A few thousand distinct CI hostnames at most (PyPI, GitHub, Docker Hub,
    # Tailscale, apt/pkg mirrors); 64m/64m is generous headroom, not a tight fit.
    msg-cache-size: 64m
    rrset-cache-size: 64m
    cache-min-ttl: 0
    # Negative-caching (NXDOMAIN/SERVFAIL) tuned for CI: long enough to absorb a
    # retry-storm burst within one job's DNS calls, short enough that a real
    # upstream/registry outage is not silently extended past this floor.
    cache-max-negative-ttl: 30
    # Positive answers still honor the authoritative TTL up to this ceiling, so
    # a fast-rotating CDN record (GitHub/PyPI edge IPs) is not held stale.
    cache-max-ttl: 3600
    prefetch: yes
    prefetch-key: yes

    # --- Resilience ---
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    # Do not force DNSSEC validation — the point is caching/availability, not
    # adding a new validation-failure mode on top of the existing chokepoint.
    module-config: "iterator"
    num-threads: 2
    so-reuseport: yes

    # --- Stats (hit-rate metric, AC1) ---
    statistics-interval: 60
    statistics-cumulative: no
    extended-statistics: yes

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    # Loopback-only, unencrypted control channel is acceptable here: the
    # control port is not published to the host or the runner network (see
    # docker-compose.dns-cache.yml), so it is reachable only via
    # `docker exec` into this container.
    control-use-cert: no

# Forward everything to the existing LAN router first (matches current runner
# resolution path — this is additive caching, not a resolver replacement), then
# fall back to public resolvers if the router is unreachable. This is NOT a
# recursive resolver; it never queries the root zone directly.
forward-zone:
    name: "."
    forward-addr: 192.168.86.1        # LAN router (existing systemd-resolved upstream)
    forward-addr: 1.1.1.1             # Cloudflare fallback
    forward-addr: 8.8.8.8             # Google fallback (existing systemd-resolved fallback)
    forward-first: no
