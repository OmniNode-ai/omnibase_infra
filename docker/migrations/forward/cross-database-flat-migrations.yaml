#
# Single-sourced ledger of top-level (flat, `docker/migrations/forward/*.sql`,
# -maxdepth 1) migrations whose FIRST `\connect <db>` directive names a
# database OTHER than `omnibase_infra` -- the one database the k8s Job that
# applies this corpus (`omninode_infra` repo,
# `k8s/migrations/omnibase-infra-migrate.yaml`, `DB_NAME="omnibase_infra"`)
# ever connects to for the flat-loop `psql -f` apply.
#
# WHY THIS MATTERS (OMN-15819)
#   That Job's flat loop is gated `directive_db == "$DB_NAME"` before it ever
#   issues the `psql -f` apply -- a cross-DB file's apply step is
#   unreachable, in that loop or any other in the runner. Before OMN-15819
#   the skip branch UPSERTed a version/checksum row into `omnibase_infra`'s
#   OWN `schema_migrations` anyway, so every ledger read said "already
#   applied" for `098_create_omninode_internal_schema.sql` and
#   `099_create_omninode_internal_live_events.sql` while
#   `omnidash_analytics` (their real `\connect` target) never saw either
#   file. The runner fix (companion PR, `omninode_infra`) stopped writing
#   that false ledger row and now FATALs the Job for any cross-DB flat file
#   NOT on its own tombstone allowlist, seeded with exactly those two
#   entries.
#
# WHAT THIS FILE IS
#   The STATIC counterpart, enforced pre-merge in THIS repo (where the flat
#   SQL corpus actually lives and where a new file would be added):
#   `tests/ci/test_flat_migration_no_foreign_connect_gate.py` /
#   `scripts/ci/check_flat_migration_foreign_connect.py` reject any flat
#   migration whose \connect targets a foreign database UNLESS it is listed
#   here, by filename, with a citation. A file is added here in exactly two
#   circumstances:
#     * `disposition: undeliverable` -- OMN-15819-confirmed: no code path in
#       the k8s Job delivers this file to its declared target. Must name the
#       replacement (a node-owned migration under
#       `docker/migrations/forward/nodes/<node>/`, which connects directly to
#       the target database as its own role -- OMN-15819 step 2) if one
#       exists.
#     * `disposition: grandfathered` -- pre-existing at the moment this gate
#       was authored (this PR). Its k8s-Job delivery status was NOT
#       re-audited by this gate -- do not read a `grandfathered` entry as a
#       claim that the file is actually delivered anywhere. It is here so
#       the gate's introduction does not retroactively fail CI on migrations
#       this PR did not investigate.
#
#   A NEW cross-DB flat file is a hard reject. Do not add it here to make
#   the gate pass -- author a node-owned replacement instead (it is the only
#   path that actually connects to the target database on the managed/RDS
#   lane). Adding an entry here without a real citation defeats the point of
#   the gate.
#
# Both directions are enforced: a live cross-DB flat file missing from this
# manifest fails closed (AC2 -- cannot dodge review by omission), and a
# manifest entry whose file no longer exists, or no longer targets a foreign
# database, is a stale-entry failure (remove it).
entries:
  - file: 098_create_omninode_internal_schema.sql
    connect_target: omnidash_analytics
    disposition: undeliverable
    citation: >-
      OMN-15819 -- confirmed undeliverable via the k8s Job. Superseded by docker/migrations/forward/nodes/node_projection_live_events/ (creates the omninode_internal schema as a guarded precondition of the table it owns).
  - file: 099_create_omninode_internal_live_events.sql
    connect_target: omnidash_analytics
    disposition: undeliverable
    citation: >-
      OMN-15819 -- confirmed undeliverable via the k8s Job. Superseded by the node-owned replacement migration under docker/migrations/forward/nodes/node_projection_live_events/.
  - file: 083_create_log_entries.sql
    connect_target: omnidash_analytics
    disposition: grandfathered
    citation: >-
      OMN-12131 (#1743) -- predates the OMN-15819 gate. k8s-Job delivery status not re-audited by this gate; grandfathered so the gate's introduction does not retroactively fail CI on a file this PR did not investigate.
  - file: 096_grant_role_omnidash_omnidash_analytics.sql
    connect_target: omnidash_analytics
    disposition: grandfathered
    citation: >-
      OMN-15363 -- predates the OMN-15819 gate. k8s-Job delivery status not re-audited by this gate; grandfathered, not asserted delivered.
  - file: 097_grant_app_dashboard_connect_omnidash_analytics.sql
    connect_target: omnidash_analytics
    disposition: grandfathered
    citation: >-
      OMN-15297 -- predates the OMN-15819 gate. k8s-Job delivery status not re-audited by this gate; grandfathered, not asserted delivered.
