  - id: "node:node_projection_instruction_eval:0002_instruction_eval_aggregate_snapshots_tenant_id_and_rls.sql"
    ticket: "OMN-15336"
  - id: "node:node_projection_pattern_learning:0001_pattern_learning_artifacts_tenant_id_and_rls.sql"
    ticket: "OMN-15336"
  - id: "node:node_projection_routing_decision:0022_agent_routing_decisions_tenant_id_and_rls.sql"
