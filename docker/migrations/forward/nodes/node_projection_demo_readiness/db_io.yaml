#
# Relations this node's vendored migrations create, declared in the shape of the
# node contract's own ``db_io`` block (``ModelDbTableDeclaration``). The TABLE
# grant derivation (table_grant_derivation.load_vendored_declarations) reads this
# file exactly as it reads a contract's ``db_io.db_tables``; the principal comes
# from the schema's domain binding in the topology and the privileges from
# ``access``, so nothing here names a principal or a privilege.
#
# OMN-19861: vendored infra-first ahead of the omnimarket node package that
# declares the relation. The source contract declares access read_write, role
# demo_readiness; 0001 grants omninode_runtime SELECT, INSERT, UPDATE. Retired
# by omnimarket's node_projection_demo_readiness merging and the pin advancing
# past it; the expiry module names it.
db_io:
  db_tables:
    - name: demo_readiness_latest
      database_ref: application
      schema: omninode_internal
      migration: docker/migrations/forward/nodes/node_projection_demo_readiness/0000_create_demo_readiness_latest.sql
      access: read_write
      role: demo_readiness
