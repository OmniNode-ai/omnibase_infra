#
# Relations this node's vendored migrations create, declared in the shape of the
# node contract's own ``db_io`` block (``ModelDbTableDeclaration``). The TABLE
# grant derivation (table_grant_derivation.load_vendored_declarations) reads this
# file exactly as it reads a contract's ``db_io.db_tables``; the principal comes
# from the schema's domain binding in the topology and the privileges from
# ``access``, so nothing here names a principal or a privilege.
#
# OMN-20134: the receipt-gate pin friction rows, vendored ahead of omnimarket's
# node_projection_receipt_gate_pin_friction_rows (omnimarket stacked on #4633),
# whose contract declares the same relation. The source declares access
# read_write, role receipt_gate_pin_friction; 0001 grants omninode_runtime SELECT,
# INSERT, UPDATE plus cursor sequence USAGE. Retired when that contract is in the
# pinned omnimarket contracts; the expiry module names it.
db_io:
  db_tables:
    - name: receipt_gate_pin_friction
      database_ref: application
      schema: omninode_internal
      migration: docker/migrations/forward/nodes/node_projection_receipt_gate_pin_friction_rows/0000_create_receipt_gate_pin_friction.sql
      access: read_write
      role: receipt_gate_pin_friction
