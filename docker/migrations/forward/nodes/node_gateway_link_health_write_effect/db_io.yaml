#
# Relations this node's vendored migrations create, declared in the shape of the
# node contract's own ``db_io`` block (``ModelDbTableDeclaration``). The TABLE
# grant derivation (table_grant_derivation.load_vendored_declarations) reads this
# file exactly as it reads a contract's ``db_io.db_tables``; the principal comes
# from the schema's domain binding in the topology and the privileges from
# ``access``, so nothing here names a principal or a privilege.
#
# OMN-17886 AC2 step 2: HandlerGatewayLinkHealthUpsert runs INSERT ... ON
# CONFLICT (tenant_id) DO UPDATE, which needs SELECT, INSERT and UPDATE.
# Declared together with the migration that GRANTs it explicitly (0003), so the
# declaration never runs ahead of a migration that delivers it
# (check_topology_grant_delivery). The gateway_link_health_status VIEW is not
# declared: no runtime node reads or writes it.
db_io:
  db_tables:
    - name: gateway_link_health
      database_ref: application
      schema: omninode_internal
      migration: docker/migrations/forward/nodes/node_gateway_link_health_write_effect/0001_create_gateway_link_health.sql
      access: read_write
      role: gateway_link_health
