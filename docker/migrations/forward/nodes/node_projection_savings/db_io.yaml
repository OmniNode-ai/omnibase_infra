#
# Relations this node's vendored migrations create, declared in the shape of the
# node contract's own ``db_io`` block (``ModelDbTableDeclaration``). The TABLE
# grant derivation (table_grant_derivation.load_vendored_declarations) reads this
# file exactly as it reads a contract's ``db_io.db_tables``; the principal comes
# from the schema's domain binding in the topology and the privileges from
# ``access``, so nothing here names a principal or a privilege.
#
# OMN-17426 and OMN-18862: migration 089 grants BOTH savings read views to
# tenant_projection_writer on adjacent lines, so both are declared together (a
# test asserts the pairing). These are VIEWS: a view is never a db_io.db_tables
# entry of a handler, so no omnimarket contract will declare them and this
# declaration is steady state, not a bridge; it has no expiry.
db_io:
  db_tables:
    - name: projection_delegation_savings
      database_ref: application
      schema: public
      migration: docker/migrations/forward/nodes/node_projection_savings/089_savings_aggregate_views_per_tenant.sql
      access: read
      role: aggregate_delegation_savings
    - name: projection_cost_savings_overview
      database_ref: application
      schema: public
      migration: docker/migrations/forward/nodes/node_projection_savings/089_savings_aggregate_views_per_tenant.sql
      access: read
      role: aggregate_savings_overview
