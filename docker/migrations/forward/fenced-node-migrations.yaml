# fenced-node-migrations.yaml — Single source of truth for the node-migration
# operator fence (OMN-15349, Option 1)
#
# Ticket: OMN-15349 (single-source the fence across omnibase_infra +
#   omninode_infra — this file is that single source)
# Predecessor: OMN-15336 (parity port that first gave the compose runner a
#   fence at all; left the list duplicated in two repos, which this file
#   removes)
#
# PURPOSE
# This is the BASELINE operator fence over the shared node-migration id space
# (node:<node>:<filename>, minted identically by both runners over the same
# vendored docker/migrations/forward/nodes/ tree). It is consumed READ-ONLY by:
#
#   - omnibase_infra/scripts/run-forward-migrations.sh (every compose lane —
#     dev, stability-test, judge, prod). Reads this file directly via the
#     ${MIGRATIONS_DIR} bind mount (docker/docker-compose.infra.yml mounts
#     ../docker/migrations/forward:/migrations/forward:ro).
#   - omninode_infra/k8s/migrations/omnibase-infra-migrate.yaml (the k8s
#     Job). The Job's copy-migrations initContainer already copies this
#     entire directory (docker/Dockerfile.migrate: COPY docker/migrations/
#     forward/ /migrations/forward/, recursive) out of the
#     omnibase-infra-migrate image it pulls — no new image dependency, the
#     coupling already existed for the SQL tree this file sits next to.
#
# BASELINE, NOT PER-LANE EFFECTIVE FENCE
# This list is the maximal fence — every id both runners fence by default.
# Each runner separately layers its OWN, independently operator-ruled,
# lane-scoped RELEASE on top of this baseline (a strict subset carve-out,
# never a widening):
#
#   - compose: ONEX_MIGRATION_LANE=dev releases the registration trio on the
#     lab lane only (operator ruling 15, OMN-15379). Every other lane stays
#     fully fenced. See the "LANE-SCOPED FENCE RELEASE" block in
#     run-forward-migrations.sh.
#   - k8s: releases the registration trio unconditionally, because that Job
#     serves exactly one environment (staging/onex-dev) and operator ruling
#     21 (OMN-15332 comment 1a067542, 2026-07-31T14:05Z GO) authorized a
#     DURABLE release there, not an env-gated one. See the "k8s lane
#     release" block in omnibase-infra-migrate.yaml.
#
# The release policies are deliberately NOT expressed in this file: they are
# per-environment operator decisions, not shared fence DATA, and folding them
# in would turn one shared baseline back into two hand-reconciled effective
# lists. What this file guarantees is that both runners start from the same
# baseline before either applies its own release — the seam OMN-15349 exists
# to close.
#
# FORMAT
# A flat list under `fenced_node_migrations`, each entry an `id:` (mandatory,
# machine-parsed) plus a `ticket:` (advisory, for humans). Order is
# significant — both runners preserve it. Parsed with a portable
# sed one-liner (no yq/python dependency in either runner's shell):
#
#   sed -n 's/^[[:space:]]*-[[:space:]]*id:[[:space:]]*"\([^"]*\)".*/\1/p' \
#     fenced-node-migrations.yaml
#
# Mirrors the parsing style already used for docker/migrations/skip-manifest.yaml.
#
# CHANGING THIS LIST
# Editing this file changes the baseline for BOTH runners in one commit —
# that is the point of single-sourcing it. It does NOT by itself change
# either runner's effective (post-release) fence; a release policy change
# (e.g. widening ruling 21's scope, or adding a new ruling-15-style lane
# carve-out) is a separate, explicit edit to that runner's release block.
#
# A FENCE ENTRY MAY NOT GATE THE SOLE CREATE OF A GATE-REQUIRED TABLE
# (OMN-17150). This is a hard structural constraint on what may be added
# below, enforced by tests/scripts/test_gate_required_tables_are_creatable.py
# and not by review memory. The migration gate
# (scripts/check_migrations_complete.sh) refuses to report HEALTHY until every
# table in REQUIRED_PROJECTION_TABLES exists; the runtime tier is gated behind
# that healthcheck. So fencing the only migration that CREATEs one of those
# tables does not defer a decision — it deadlocks every cold boot of every
# lane that does not carry a release, permanently, with both halves behaving
# exactly as written. That is the shape this file shipped from 2026-07-29 to
# 2026-08-31 for node_service_registry; see the registration entry below.
# If a required table's CREATE genuinely must be held, the gate's required
# list must change in the SAME commit. The invariant is: every table named in
# REQUIRED_PROJECTION_TABLES is creatable by the BASELINE-unfenced set, with
# no lane release applied.
#
# WHY THESE ELEVEN IDS (verbatim rationale, unchanged from the pre-OMN-15349
# hand-maintained lists for the first seven, less the two registration ids
# OMN-17150 released; the eighth (node_pr_review_bot
# 001) was added under OMN-15717/OMN-15376, the ninth
# (delegation_inference_response 0003) under OMN-15336 item 4 / OMN-15656 —
# two independent PRs landing concurrently, both additive, not conflicting —
# the tenth (hook_event_capture 0002) under OMN-16090, the ELEVENTH
# (delegation 0031) under OMN-16493 / the 2026-08-28 "Fence 0031, HOLD the
# repin" operator ruling, and the TWELFTH (delegation 0032) under OMN-16930 /
# the 2026-08-29 "Hold + fix mechanism" ruling that replaced 0031's remedy.
# The ordinals are historical and are NOT renumbered when an id is released —
# they name the ruling that added the entry, not its index in the list):
#   delegation 0023, 0026 — OMN-14974 / OMN-15313. Tenant-isolation RLS on
#     live, actively-written delegation tables.
#
#     THIS ENTRY WAS THE QUARTET 0023-0026 until 2026-09-08. 0024 and 0025
#     left the baseline entirely under OMN-15683. 0023 and 0026 stay: 0023 as
#     a SUPERSEDED id rather than a pending ruling — its CREATE POLICY compares
#     TEXT to TEXT by construction and now aborts against the uuid column,
#     leaving the table FORCE-RLS with zero policies — and 0026 because
#     releasing it was MEASURED, on the .201 dev lane, to refuse every write
#     the lane's own async judge-verdict writer issues. Both arguments, with
#     the verbatim errors, are in the "2026-09-08" block at the end of this
#     header.
#   registration 0002 — OMN-15343 (introduced-by) / OMN-14894 (tranche 1).
#     FORCE ROW LEVEL SECURITY plus a tenant_id column on
#     node_service_registry. THIS is the id the hold was ever really about,
#     and it stays.
#
#     0000 (CREATE) AND 0001 (heartbeat columns) WERE RELEASED FROM THIS
#     BASELINE 2026-08-31 UNDER OMN-17150. Recorded in full because the
#     entry they replace claimed the opposite ("0000 and 0002 must move
#     together") and a future reader will otherwise re-derive it:
#
#     WHY THEY WERE HERE. Two reasons, both spent:
#       (a) OMN-15335 — on cloud RDS omnidash_analytics, node_service_registry
#           was owned by omninodeadmin while the node loop connects as
#           role_omnidash, so 0000's no-op CREATE was followed by an ALTER
#           that died with `must be owner of table node_service_registry`.
#           That is a CLOUD OWNERSHIP defect, never a property of the SQL.
#           OMN-15335 is Done (2026-08-29) and the ownership seam landed
#           (omninode_infra#738, #997, #1103); operator ruling 21 (OMN-15332
#           comment 1a067542, 2026-07-31) then DURABLY released the trio on
#           exactly the runner that hit it. The reason cannot outlive the
#           lane it was about.
#       (b) OMN-15379 ruling 15 / its postmortem — "a fence that gates one but
#           not the other is worse than no fence: a cold compose lane with
#           0000 fenced and 0002 NOT fenced died with `relation
#           node_service_registry does not exist`." That postmortem is about
#           ONE direction: the dependency fenced while the dependent runs.
#           The reverse — dependency released, dependent held — has no such
#           failure mode, and is the shape this file now carries. 0003 and
#           0004 already ship UNFENCED and are both written `IF
#           to_regclass(...) IS NOT NULL`, i.e. the corpus already assumes
#           the two halves can be at different fence states.
#
#     WHAT THE FENCE COST WHILE THEY WERE HERE (OMN-17150, found by the first
#     cold boot of a lane built AFTER ruling 15). 0000 is the ONLY migration
#     in this corpus that creates node_service_registry, and
#     scripts/check_migrations_complete.sh's REQUIRED_PROJECTION_TABLES
#     requires that table to exist before migration-gate reports HEALTHY. Any
#     lane without ONEX_MIGRATION_LANE=dev therefore cold-booted into a
#     permanent deadlock: forward-migration exits 0 and sets the sentinel
#     TRUE, migration-gate stays unhealthy forever, and the whole runtime
#     tier (omninode-runtime, runtime-effects, projection-api) never starts.
#     Reproduced live on the omnibase-infra-lakshman lane 2026-08-31, three
#     clean boots. It did not bite dev (released by ruling 15), staging (k8s,
#     released by ruling 21), or prod/stability-test/judge — those three
#     carry a node_service_registry that PREDATES this entry. Latent, not
#     absent: the next clean rebuild of any of them hit the same wall.
#
#     WHY RELEASING WAS THE FIX AND DROPPING THE TABLE FROM THE GATE WAS NOT.
#     node_service_registry has live readers beyond the gate — omnidash's
#     node-registry and mcp-tools panels
#     (omnidash/server/postgres-projection-reader.ts), omnimarket's
#     node_projection_registration writer and its heartbeat emitter. A lane
#     that boots without it starts a runtime whose registration chain is dead.
#     The gate was right; this entry was wrong.
#
#     WHY 0002 COULD NOT COME WITH THEM, mechanically and not merely by
#     preference: 0002 enables FORCE ROW LEVEL SECURITY and is not in
#     grandfathered-force-rls-migrations.yaml, so removing it from this list
#     hands it to the OMN-15336 item-4 guard
#     (migration_declares_unclassified_force_rls), which is FATAL for a
#     FORCE-enabling id that is neither fenced nor grandfathered and has
#     never applied on that database. On prod and judge — where 0002 has
#     never applied — unfencing it converts a hung gate into a hard
#     migration-run failure. It would also turn FORCE back ON there with no
#     path to reverse it: 0004 (the NO FORCE remedy) is UNFENCED and is
#     therefore already recorded as applied on those lanes, so it would be
#     skipped as already-applied and never run after 0002. Releasing 0002 is
#     a live operator decision about tenancy posture, and this is not it.
#
#     WHAT THIS LEAVES ON A COLD LANE: node_service_registry exists with its
#     heartbeat columns (0000 declares them; 0003 reconciles them unfenced),
#     no tenant_id column, RLS never enabled, FORCE never enabled. That is
#     the same posture prod and judge have carried since before this file
#     existed, and 0004's own header already names it as the correct one for
#     omninode_internal runtime state. Known residual, stated rather than
#     hidden: 0002 also carries `GRANT SELECT ... TO app_dashboard`, so a
#     cold lane gives app_dashboard no read on this table — identical to
#     prod/judge today, and not a new gap.
#
#     NO-OP ON EVERY WARM LANE, and this is why it could land without
#     touching one. 0000/0001 are already recorded on all four .201 lanes
#     (live readback 2026-07-28/29, quoted in
#     tests/scripts/test_node_migration_fence_parity.py's own docstring:
#     dev + stability-test carry all six gated ids and registration 0002;
#     prod + judge carry registration 0000/0001), so the ledger probe skips
#     them. Should any lane's canonical-ledger row be missing, both files are
#     idempotent (CREATE TABLE / INDEX / ADD COLUMN, all IF NOT EXISTS) and a
#     re-apply is a no-op except 0001's NULL-only heartbeat backfill.
#   node_pr_review_bot 001 — OMN-15717 / OMN-15376. The CREATE TABLE IF NOT
#     EXISTS for review_bot_bypass_log declares 7 columns with no ALTER TABLE
#     ADD COLUMN IF NOT EXISTS reconciliation, tripping the OMN-15376 static
#     shape-reconciliation gate (tests/ci/test_node_migration_shape_reconciliation.py).
#     Editing the SQL to add the missing ALTER statements is NOT the fix here:
#     it would change the file's content sha256 (currently
#     63e2646a7f8767fad9ec969b224982e00b83aacb665107ab5b103964d5616e00), and
#     that checksum is bound both by the application-migrations.tsv
#     declaration and by dev's already-applied
#     omnidash_analytics.platform_catalog.schema_migrations row
#     (content_sha256, applied_at 2026-08-06) — a changed checksum makes
#     scripts/run-forward-migrations.sh's migration_is_applied() check FATAL
#     ("conflicting migration checksum") on that lane, since the runner has
#     no path to reconcile a stored checksum against a changed file. Fencing
#     is safe today, not merely convenient: read-only .201 probes (2026-08-10)
#     confirm this migration is ALREADY applied on all four live lanes —
#     dev via the content_sha256 row above, and stability-test/judge/prod via
#     the legacy 'applied-by-runner' public.schema_migrations rows dated
#     2026-06-10/06-11 — and review_bot_bypass_log's live columns already
#     match the 7 declared columns exactly on every lane, so there is no
#     shape drift to reconcile anywhere that exists today. Residual, accepted
#     risk: a genuinely new future lane (never bootstrapped from any of the
#     four) would skip creating this table until an operator adds a lane
#     release, same accepted-tradeoff shape as the delegation ids above.
#   delegation_inference_response 0003 — OMN-15336 item 4 / OMN-15656. FORCE
#     ROW LEVEL SECURITY on projection_delegation_inference_response_text.
#     Contract-declared tenant domain (node_projection_delegation_inference_
#     response/contract.yaml db_io.schema), so the RLS posture itself is
#     correctly classified — unlike node_service_registry below, this is not
#     an internal-domain misclassification. It is held for the same reason
#     the delegation quartet above is held: OMN-15301 found the projection
#     writer never sets app.tenant_id per connection, so an un-gated FORCE
#     apply here reproduces the identical false-clean (zero rows, no error)
#     write-lockout hazard on a live, actively-written table. Was NEVER in
#     this list on any runner before this entry — it applied unattended on
#     the .201 dev lane (2026-07-31T06:44:32Z) purely because nothing here
#     named it. Un-gate only in a change that also proves the writer sets
#     app.tenant_id per connection, matching the delegation quartet's bar.
#   hook_event_capture 0002 — OMN-16090. FORCE ROW LEVEL SECURITY on
#     hook_events, a NEW table (nothing is live on any lane yet), split out of
#     its own CREATE migration precisely so the create can apply unfenced while
#     the RLS posture is held here. Fenced on ARRIVAL rather than after the
#     fact — the delegation_inference_response entry above records the opposite
#     history, where an unnamed FORCE applied unattended on the .201 dev lane
#     purely because nothing listed it.
#
#     WORTH KNOWING WHEN THIS IS RECONSIDERED: the OMN-15301 hazard quoted for
#     the entries above — "the projection writer never sets app.tenant_id per
#     connection" — does NOT apply to this node's writer. Its handler passes
#     `tenant=<row tenant>` explicitly to AsyncpgAdapter.execute(), which
#     issues set_config('app.tenant_id', ...) on the same connection inside the
#     same transaction as the INSERT, using the tenant the row itself carries
#     (the OMN-15919 shape, adopted to avoid exactly the read-path/write-path
#     resolver split that produced "new row violates row-level security policy"
#     on the delegation writes). That is the bar this file names for un-gating.
#     It is fenced anyway, because a fence RELEASE is a per-lane operator
#     decision with live-data consequences, not a call the change introducing
#     the table may take for itself — and because releasing it while every
#     sibling stays fenced would make this the only RLS-enforcing relation on
#     the surface, an inconsistency worth deciding deliberately rather than
#     inheriting from whichever change happened to land last.
#
#   delegation 0031 — OMN-16493, added under the 2026-08-28 operator ruling
#     "Fence 0031, HOLD the repin" (answer to the OMN-15954 comment 85b7ccab
#     decision brief, §6 option A). This is the ELEVENTH id and the first one
#     fenced for a reason that is neither an RLS posture nor a shape gate: it
#     is fenced because the migration ABORTS, and its abort takes an unrelated
#     team's migrations down with it.
#
#     WHAT ACTUALLY FAILS. 0031 converts delegation_events.tenant_id from the
#     legacy TEXT slug to the canonical UUID via
#     `ALTER COLUMN ... TYPE UUID USING (CASE tenant_id WHEN ... END)` with no
#     ELSE branch. The column has been NOT NULL since 0022 (applied
#     2026-07-28), so any slug outside 0031's closed 3-value map evaluates to
#     NULL and trips that pre-existing constraint:
#       ERROR: column "tenant_id" of relation "delegation_events"
#              contains null values
#     Re-measured live 2026-08-28: 165 rows, 9 of them under 5 slugs the map
#     does not know — and one of those belongs to a REAL, ACTIVE,
#     externally-owned customer provisioned 8 days after 0031 was authored.
#     That customer's slug was quoted here verbatim until OMN-17288 removed
#     it: this repository is PUBLIC and the identifier was a live one.
#     The data is not null; the mapping is incomplete, and it is incomplete
#     BY CONSTRUCTION because the writer keeps minting new slugs (OMN-16804).
#     That is 0031's second fail-closed guard firing exactly as designed. It
#     is NOT a defect in 0031 and this entry is NOT a workaround for one.
#
#     WHY 0031's OWN DIAGNOSTICS NEVER SAID SO. delegation_events carries
#     ENABLE+FORCE RLS with `tenant_isolation USING (tenant_id =
#     current_setting('app.tenant_id', true))`, and the migrate Job's identity
#     (role_omnidash) has rolbypassrls=f. With app.tenant_id unset the policy
#     matches nothing, so 0031's opening `DELETE ... WHERE correlation_id IN
#     (...)` is a silent zero-row no-op and its `IF EXISTS` pre-guard — the
#     one that would RAISE the useful "no canonical UUID mapping for tenant
#     value %" — sees nothing. Only the ALTER ... TYPE rewrite, which is not
#     RLS-filtered, sees the real rows. Every actionable diagnostic this
#     migration built for exactly this case is blinded; the uninformative
#     NOT-NULL error is all that survives, which is why this read as a
#     NULL-data problem for a week.
#
#     WHY THAT MAKES IT A FENCE AND NOT A FIX. 0031 cannot be edited in place:
#     it is already applied on the .201 dev compose lane, and
#     `_ledger/bootstrap.sql` raises `conflicting migration checksum` on any
#     byte change (the OMN-16705 class). The real fix is a new `0030a_`
#     pre-step (fully specified on OMN-16493) over a slug set that is finally
#     CLOSED, which needs OMN-16804 first (gateway stamps the verified UUID
#     rather than the slug, removing the map from the write path). Landing a
#     hardcoded `0030a_` map today ships something permanently immutable and
#     already known incomplete — and worth less every day the beta adds
#     tenants.
#
#     WHO WAS PAYING FOR IT. The node loop iterates node directories
#     LC_ALL=C-sorted; `node_projection_delegation` sorts before
#     `node_projection_tenant_credentials`; both runners are set -e with
#     `psql -v ON_ERROR_STOP=1`. So 0031's abort killed the WHOLE Job before
#     node_projection_tenant_credentials/0001_relax_name_provider_not_null and
#     0002_credential_identity_not_null were ever attempted — blocking a
#     beta-critical BYOK integration on a tenancy ruling it has nothing to do
#     with, purely by lexical sort order. The fenced-id skip runs AHEAD of the
#     ledger probe (run-forward-migrations.sh:1272-1289; the k8s Job's
#     equivalent block), so fencing lets the loop continue and those two
#     migrations apply on the next green deploy.
#
#     WHAT THIS FENCE KNOWINGLY COSTS, recorded so a future reader does not
#     re-derive it: 0031 stays unapplied, so OMN-15683's UUID-key defect stays
#     live — UUID-keyed dashboard reads of delegation_events keep returning
#     ZERO ROWS with no error for every real provisioned tenant — and
#     OMN-16493 stays open. That was ruled acceptable in exchange for
#     unblocking the BYOK lane; it is a deferral, not a resolution.
#
#     UN-GATE ONLY when OMN-16804 has removed the slug map from the write path
#     and a `0030a_` pre-step exists that defeats the RLS blindness described
#     above inside a single DO block. Do NOT un-gate by editing 0031's bytes.
#
#     SUPERSEDED 2026-08-29 (OMN-16930) — the `0030a_` pre-step named in the
#     paragraph above is CANCELLED and replaced. Operator ruling, verbatim:
#     "Hold + fix mechanism" — the 0031 fence STAYS until write-time stamping
#     deploys, and the permanent fix is green-lit as new scope: a
#     RUNTIME-POPULATED slug->UUID tenant relation in omnidash_analytics so
#     migration-time conversions resolve at apply time instead of hardcoded
#     maps. The pre-step's premise was that the slug set becomes closed and
#     enumerable once the writer stops emitting slugs; the ruling rejects
#     waiting for that, because a pre-step over an enumerated set is still a
#     hardcoded map with a timestamp on it. Everything ABOVE about 0031 itself
#     remains accurate — only the named remedy changed. See the TWELFTH id.
#
#   delegation 0032 — OMN-16930. The replacement conversion, and the TWELFTH
#     id. It is fenced for the same reason 0031 is: it can ABORT, and an abort
#     in this node directory takes an unrelated team's migrations down with it
#     by lexical sort order (see "WHO WAS PAYING FOR IT" above — that hazard
#     is a property of the position in the corpus, not of 0031's contents, so
#     it applies unchanged to its successor).
#
#     WHAT CHANGED. 0032 resolves each slug by JOINing `tenant_registry_mirror`
#     — a relation node_projection_tenant_registry (omnimarket) materializes
#     from `onex.tenant.events`, the durable outbox onex-api already writes in
#     the same transaction that creates the tenant row (OMN-16027). No literal
#     slug appears in its transform expression. Adding a tenant never requires
#     a code change again. It also defeats the RLS blindness described above
#     inside a single DO block before it inspects anything, so its guards see
#     the real rows; and its abort message names every unresolved slug and
#     states that THE PROJECTION HAS NOT CAUGHT UP, rather than surfacing the
#     symptom (`contains null values`) that cost a week of diagnosis.
#
#     0031's BYTES ARE UNTOUCHED. Re-proved against the live .201 dev lane
#     2026-08-29: platform_catalog.schema_migrations carries it with checksum
#     79ee3b021d0a04088b2f733fa0558ea110b2a6f75b4fb338abe9c5c123f74442, kind
#     content_sha256, byte-identical to both committed copies and to this
#     tree's own _ledger/application-migrations.tsv row. Recorded in
#     _ledger/migration-supersessions.tsv (0031 -> 0032). 0031 STAYS in this
#     list permanently: it is retired, not released.
#
#     WHY IT IS FENCED RATHER THAN SHIPPED HOT. The mirror must be POPULATED
#     before the conversion can resolve anything, and a projection that is
#     deployed is not the same as a projection that has caught up. Releasing
#     0032 before that holds would abort every deploy — correctly, and
#     uselessly. The fence is the interlock.
#
#     UN-GATE ORDERING — all three, in this order, and step 3 is an OPERATOR
#     action, never an agent's inference that the mirror "looks caught up":
#       1. node_projection_tenant_registry is DEPLOYED and CAUGHT UP —
#          tenant_registry_mirror holds a row for every distinct tenant_id in
#          delegation_events. Verify by running 0032's own pre-guard query,
#          not by inspecting pod status.
#       2. Write-time UUID stamping (OMN-16804) is LIVE, so no new slug is
#          ever written to the column after the conversion.
#       3. The operator releases 0034 — and ONLY 0034 — from this baseline
#          (OMN-17316 superseded 0033; see the 0034 entry below). 0031, 0032
#          and 0033 stay fenced permanently: all three are retired, and
#          leaving a retired id fenced is what keeps it retired. Steps 1 and 2
#          are independent and may proceed in parallel; step 3 requires both.
#     Recorded identically on OMN-16930, OMN-16804 and OMN-16493.
#
#   delegation 0033 — OMN-17288. THE OPERATIVE CONVERSION. 0032 is superseded
#     (docker/migrations/forward/_ledger/migration-supersessions.tsv), because
#     it placed DROP POLICY / CREATE POLICY / GRANT after its DO block, and two
#     defects follow from that single shape:
#
#       (a) its documented "nothing to convert" path ABORTED — RETURN exits the
#           DO block, not the file, so on a lane without delegation_events the
#           trailing CREATE POLICY and GRANT still ran and raised `relation
#           "delegation_events" does not exist`;
#       (b) END$$ COMMITTED with tenant_isolation dropped and the policy only
#           recreated afterwards. The runner is `psql -v ON_ERROR_STOP=1 -f`
#           with NO --single-transaction, so that window is real: an
#           interruption inside it leaves a FORCE-RLS table with ZERO policies,
#           denying every application read until someone re-runs.
#
#     Both are proven against 0032's real bytes on a scratch Postgres in
#     omnimarket tests/test_omn17288_migration_policy_atomicity.py — measured,
#     not argued. 0033 moves the policy recreate and the app_dashboard GRANT
#     inside the guarded DO block and lets the already-uuid branch fall through
#     to them; nothing follows END$$. The identity mechanism is unchanged, and
#     the entire OMN-16930 replay passes against it.
#
#     It is fenced on ARRIVAL, on exactly the same interlock as 0032: this file
#     is the conversion, and the mirror must be caught up before it can resolve
#     anything. Same three-step un-gate above.
#
#   delegation 0034 — OMN-17316. THE OPERATIVE CONVERSION; 0033 is superseded
#     in turn, for a defect in the very guard that was supposed to make this
#     chain's failures legible. 0033 tested `pg_has_role(current_user, v_owner,
#     'USAGE')` and then, two statements later, performed the role switch with
#     `set_config('role', v_owner::text, true)` — which is SET LOCAL ROLE.
#     Since PostgreSQL 16, INHERIT and SET are INDEPENDENT membership options
#     (`GRANT <owner> TO <identity> WITH INHERIT TRUE, SET FALSE`): USAGE tests
#     INHERITED PRIVILEGE, SET tests whether SET ROLE is PERMITTED. Measured on
#     postgres:16-alpine, 2026-08-31 — under SET FALSE the predicates read
#     USAGE=t, SET=f, MEMBER=t, and the switch raises a bare `permission denied
#     to set role "<owner>"`. So the guard PASSED and the migration aborted
#     opaquely just past it: the exact failure class the guard exists to
#     replace, emitted from inside the guard's own blind spot.
#
#     0034 tests BOTH predicates before the switch, each naming which one
#     failed and what it blocks — USAGE carries the RLS-blindness rationale
#     (OMN-16493), SET is what the role switch itself needs. Neither
#     substitutes for the other and MEMBER substitutes for neither. Everything
#     below the guard is 0033's body carried over VERBATIM. RED/GREEN proven by
#     execution in
#     tests/integration/migrations/test_omn17316_role_set_membership_guard.py,
#     against the real vendored bytes through the deploy-time `psql -v
#     ON_ERROR_STOP=1 -f` invocation.
#
#     Severity is LATENT, not live: the PG16 default GRANT confers both
#     options, so no lane carries a SET FALSE membership today and CI is green.
#     It is repaired now because 0033 is applied on no lane and repairing it
#     after the OMN-16804 staging repin would cost a further supersession.
#
#     Fenced on ARRIVAL, same interlock, same three-step un-gate above — except
#     that step 3 now releases 0034, and ONLY 0034. 0031, 0032 and 0033 stay
#     fenced permanently as retired ids.
#
#   tenant_registry 0000 — deliberately NOT fenced, and this absence is a
#     decision rather than an oversight. It creates tenant_registry_mirror and
#     nothing else: no conversion, no RLS posture to rule on, no abort path. It
#     is also the PRECONDITION for 0032, so fencing it would guarantee the
#     ordering violation 0032 is written to detect. Note that node directories
#     apply in sort order and node_projection_delegation sorts BEFORE
#     node_projection_tenant_registry — on a first-ever bootstrap 0032 runs
#     first, which 0032 handles explicitly (empty table: convert; rows present:
#     abort naming the violation).
#
# ===========================================================================
# 2026-09-08 — THE DELEGATION-PATH RELEASE (OMN-15683, lane
# delegation-fence-lift)
# ===========================================================================
# Operator ruling of 2026-09-08, recorded as the orchestrator RULING row in
# omni_home docs/tracking/ROLLING_WORK_LEDGER.md at 2026-09-08T12:32:13Z: a
# fence on a migration is a defect to close, not a state to maintain —
# migrations and deployment are one process. That ruling releases the
# delegation-path hold and supersedes the 2026-08-28 "Fence 0031, HOLD the
# repin" ruling for the ids below. Related: OMN-15583, OMN-15349, OMN-14974,
# OMN-16493, OMN-16930, OMN-17288, OMN-17316.
#
# The release lands in TWO PIECES, because this file is a baseline and the
# guard that sits next to it makes the two halves mechanically different:
#
#   BASELINE RELEASE (removed from the list below, every lane):
#     delegation 0024, 0025
#
#   LANE RELEASE (kept in the list below, un-gated on the compose dev/lab lane
#   by run-forward-migrations.sh's ONEX_MIGRATION_LANE=dev arm):
#     delegation 0034
#
#   STILL FULLY FENCED:
#     delegation 0023, 0026, 0031, 0032, 0033
#
# 0026 WAS RELEASED IN THIS CHANGE'S FIRST REVISION AND WAS TAKEN BACK OUT ON
# MEASUREMENT — see its own section below. The lab-first step is what caught
# it, which is the point of the lab-first step.
#
# ---------------------------------------------------------------------------
# WHY 0034 GETS A LANE RELEASE AND NOT A BASELINE REMOVAL
# ---------------------------------------------------------------------------
# This is mechanical, not a preference, and it is the SAME constraint the
# "registration 0002" rationale above already records. 0034 enables FORCE ROW
# LEVEL SECURITY (its conversion path toggles it off and back on) and is not in
# grandfathered-force-rls-migrations.yaml, so removing it from this list hands
# it to the OMN-15336 item-4 guard
# (migration_declares_unclassified_force_rls), which is FATAL for a
# FORCE-enabling id that is neither fenced nor grandfathered and has never
# applied on that database.
#
# MEASURED, not argued. A baseline removal of 0026 — the sibling that carries
# the identical shape — was executed against a virgin Postgres through the real
# runner in tests/scripts/test_node_migration_fence_parity.py and produced:
#
#   [forward-migration] FATAL:
#   node:node_projection_delegation:0026_delegation_judge_verdict_events_rls_
#   tenant_isolation.sql enables FORCE ROW LEVEL SECURITY but is not in the
#   operator fence manifest (...). This migration has never applied on this
#   database. Classify it before it may run ... NOTHING was applied by this
#   migration.
#
# The guard's own message names the remedy — "add a fence entry citing the
# owning ticket ... (with a lane release only if an operator ruling authorizes
# one)" — and that is exactly the shape taken here. 0024 and 0025 declare no
# FORCE at all, so they take the baseline removal cleanly; the guard predicate
# was run against all five candidate files individually to establish which is
# which (0023, 0026 and 0034 fire it; 0024 and 0025 do not).
# The grandfather snapshot is NOT the alternative: its own header states it
# does not grow, and a 2026-authored migration was never in the pre-guard tree
# it snapshots.
#
# THE LANE RELEASE IS ALSO THE SAFER OUTCOME, independently of the guard, and
# this is the second reason it is not a workaround. Read-only probes of the
# .201 lanes on 2026-09-08:
#   * dev (omnibase-infra-postgres): delegation_events.tenant_id is ALREADY
#     uuid (0031 recorded 2026-08-27) and delegation_judge_verdict_events holds
#     ZERO rows. 0034 takes its already-uuid branch — no conversion, no mirror
#     lookup — and restates the policy and the app_dashboard GRANT; 0026 locks
#     nothing out of an existing dataset.
#   * stability-test: tenant_id is still TEXT with 165 rows, and
#     tenant_registry_mirror EXISTS BUT HOLDS 0 ROWS — 0034's own pre-guard
#     query returns 11 unresolvable slugs there. A baseline release would make
#     0034 abort on that lane, correctly and uselessly, and by lexical sort
#     order would take every node directory after node_projection_delegation
#     down with it. That is the "WHO WAS PAYING FOR IT" hazard above, and step
#     1 of the un-gate ordering (the mirror is CAUGHT UP) is simply not
#     satisfied there yet.
#   * prod and judge: delegation_events exists but carries NO tenant_id column
#     at all and NO platform_catalog ledger — neither lane has ever run this
#     node corpus through this runner.
# The lane release un-gates exactly the lane where the preconditions hold and
# leaves every other lane at the full baseline, which is the property the
# ONEX_MIGRATION_LANE mechanism exists to provide (fail-closed by default; the
# release set is committed, never supplied).
#
# ONEX-DEV IS NOT COVERED BY THIS CHANGE, stated plainly rather than implied.
# The k8s Job (omninode_infra k8s/migrations/omnibase-infra-migrate.yaml) reads
# this same baseline and layers its OWN release, which today names only the
# registration trio. 0026 and 0034 therefore stay fenced on onex-dev until that
# Job's release block is extended in its own repo — a separate PR, tracked as a
# blocker on OMN-15683. Landing it there requires the same precondition: the
# tenant-registry projection caught up on that database.
#
# ---------------------------------------------------------------------------
# WHY 0026 IS NOT RELEASED — MEASURED ON THE LAB LANE, NOT INHERITED
# ---------------------------------------------------------------------------
# 0026 puts ENABLE + FORCE ROW LEVEL SECURITY and a TEXT-comparing
# tenant_isolation policy on delegation_judge_verdict_events. This file's own
# un-gate bar for the delegation quartet has always been "un-gate only in a
# change that also proves the writer sets app.tenant_id per connection". That
# bar is NOT met, and the reasoning that it was — "the table holds zero rows,
# so there is nothing to lock out" — was about READS. The hazard is on the
# WRITE path.
#
# It was released here in this change's first revision, applied on the .201 dev
# lane through the sanctioned one-shot, and then MEASURED. Two refusals, both
# quoted verbatim:
#
#   (1) NEGATIVE CONTROL, an unset GUC. As the lane's own non-superuser,
#       non-BYPASSRLS writer role, inside a rolled-back transaction:
#         ERROR:  new row violates row-level security policy for table
#         "delegation_judge_verdict_events"
#       Nothing was written; the transaction was rolled back.
#
#   (2) THE REAL WRITE PATH. The lane's async judge-verdict writer
#       (omnimarket node_projection_delegation handler_delegation
#       _project_judge_verdict) resolves tenant_id by correlation join against
#       delegation_events — which on this lane is now the canonical UUID — and
#       then issues its INSERT through AsyncpgAdapter.execute WITHOUT a
#       `tenant=` argument. The adapter therefore falls back to
#       resolve_read_tenant(None), whose table-less form is the house SLUG. So
#       the row carries a UUID and the GUC carries a slug, the WITH CHECK
#       predicate is false for EVERY row, and every judge-verdict write is
#       refused. That is precisely the two-divergent-resolvers shape OMN-15919
#       already documented for the delegation write path, reproduced here by
#       the fence release rather than by a code change. The sync twin
#       (PostgresSyncProjectionAdapter.upsert) is unaffected: it derives the GUC
#       from the row it is writing.
#
# The change was reverted on the lane in one transaction (policy dropped, NO
# FORCE, RLS disabled, the 0026 ledger row removed so the lane matches this
# file again) and 0026 was taken back out of the dev arm. RELEASE CONDITION,
# written so the next attempt does not re-derive it: the async judge-verdict
# writer must pass the row's own resolved tenant to the adapter (the
# `tenant=` argument the OMN-15919 seam exists for), so the GUC and the column
# agree by construction. That is an omnimarket change, not a fence edit.
#
# ---------------------------------------------------------------------------
# WHY 0025 IS RELEASED
# ---------------------------------------------------------------------------
# It was held for the OMN-15301 hazard the delegation quartet shares: a tenant
# posture applied to a live, actively-written table whose writer may not set
# app.tenant_id. delegation_judge_verdict_events holds ZERO rows on the .201
# dev lane, so its ADD COLUMN + correlation_id backfill lock nothing out of an
# existing dataset, and the file is internally idempotent (ADD COLUMN IF NOT
# EXISTS, CREATE INDEX IF NOT EXISTS). It declares no FORCE ROW LEVEL SECURITY,
# so the baseline removal is clean.
#
# ONE HONEST RESIDUAL, stated rather than discovered later: 0025's backfill
# joins delegation_events, which carries a tenant_isolation policy. Where the
# migrate identity is a non-superuser without BYPASSRLS and app.tenant_id is
# unset, that join sees zero rows and the backfill is a silent no-op — every
# unmatched row keeps the 'omninode' text default. That is a weaker outcome,
# not an abort, and it is the same RLS blindness OMN-16493 documented for 0031.
# The compose lanes connect as the postgres superuser and are unaffected.
#
# ---------------------------------------------------------------------------
# WHY 0024 IS RELEASED
# ---------------------------------------------------------------------------
# It drops routing_rule / routing_confidence / routing_candidates, which no
# live code reads. Re-verified 2026-09-08 across omnimarket, omnibase_infra and
# the omnidash server: the only occurrences anywhere are hardcoded NULL
# literals in jsonb_build_object inside the dashboard views
# (node_projection_delegation 0010 / 0021 / 0028) — those never SELECT the
# columns, so no view depends on them and no CASCADE is required. No writer,
# model or handler sets any of the three. `routing_rules` (plural, the Bifrost
# delegation config) is an unrelated identifier and is not this column. On the
# .201 dev lane the three columns do not exist at all (live catalog probe), so
# the release is a no-op there and a real drift cleanup where the columns were
# added out-of-band.
#
# ---------------------------------------------------------------------------
# WHY 0023 STAYS — SUPERSEDED IN PLACE BY THE CONVERSION CHAIN, WITH THE EXACT
# CONFLICTING STATEMENT
# ---------------------------------------------------------------------------
# 0023 is NOT idempotent against the state the conversion leaves. Its
# delegation_events half is:
#
#     ALTER TABLE delegation_events ENABLE ROW LEVEL SECURITY;
#     ALTER TABLE delegation_events FORCE ROW LEVEL SECURITY;
#     DROP POLICY IF EXISTS tenant_isolation ON delegation_events;
#     CREATE POLICY tenant_isolation ON delegation_events
#       FOR ALL
#       USING (tenant_id = current_setting('app.tenant_id', true))
#       WITH CHECK (tenant_id = current_setting('app.tenant_id', true));
#
# THE CONFLICTING STATEMENT is that CREATE POLICY. Its comparison is TEXT on
# both sides by construction — 0023's own "SEAM DECISION" says so explicitly,
# no ::uuid. Once tenant_id is uuid, which it IS on the .201 dev lane (live
# catalog readback 2026-09-08: `tenant_id | uuid | DEFAULT
# '820272f9-4aaf-5add-a2df-0af942852ab2'::uuid`), that predicate has no
# operator and PostgreSQL raises `operator does not exist: uuid = text`.
# Reproduced on that same server (PostgreSQL 16.15) this session by binding a
# text-OID parameter against that column, which returns the identical string.
#
# The failure is worse than an abort. The runner is `psql -v ON_ERROR_STOP=1
# -f <file>` with NO --single-transaction, so the two ALTERs and the DROP
# POLICY each COMMIT and only the CREATE POLICY fails — leaving
# delegation_events with ENABLE + FORCE ROW LEVEL SECURITY and ZERO POLICIES,
# denying every row to every non-owner, non-BYPASSRLS principal. That is the
# same defect class OMN-17288 and OMN-17298 already superseded two migrations
# for, and it would then take every later node's migrations down with it by
# lexical sort order.
#
# Nothing is lost by holding it: 0034 restates tenant_isolation WITH the
# ::uuid cast and restates the app_dashboard GRANT, inside one guarded DO
# block, on both its conversion and its already-uuid path. 0023 is therefore
# superseded in place exactly like 0031/0032/0033 and stays fenced for the
# same reason — leaving a retired id fenced is what keeps it retired. Its
# delegation_budget_state half is genuinely unapplied and is a separate
# follow-up (that column is still text); it is NOT a reason to release the
# file that carries the aborting statement above.
#
# ---------------------------------------------------------------------------
# WHY 0031, 0032 AND 0033 STAY — AND WHY THAT IS NOT A NARROWING OF THE RULING
# ---------------------------------------------------------------------------
# All three are RETIRED, recorded in _ledger/migration-supersessions.tsv, and
# every one of those rows already states the un-gate shape this change
# implements: un-gate 0034 and only 0034. The mechanical reason the
# predecessors cannot come with it is that NEITHER runner has any supersession
# awareness — grep scripts/run-forward-migrations.sh for "supersed" and it
# returns nothing. The fenced-id skip runs AHEAD of the ledger probe, so
# releasing an id is exactly "apply it on every lane that has not already
# recorded it". Applied to live state: 0031 is recorded only on the dev lane,
# so releasing it would run its closed three-value literal CASE with no ELSE
# against the stability-test lane's 165 TEXT rows and reproduce the
# `contains null values` abort this entry was created for. 0032 and 0033 carry
# defects proven by execution (omnimarket
# tests/test_omn17288_migration_policy_atomicity.py and
# tests/integration/migrations/test_omn17316_role_set_membership_guard.py
# here). Releasing the operative conversion is what the ruling asks for;
# releasing its three retired predecessors would apply three superseded
# conversions in sequence and re-open two closed defect classes.
#
