      - /data/scratch/cache/runners/mq-3/pre-commit:${RUNNER_USER_HOME:-/home/runner}/.cache/pre-commit
      - /data/scratch/cache/runners/mq-3/pnpm:${RUNNER_USER_HOME:-/home/runner}/.cache/pnpm
      - /data/scratch/cache/runners/mq-3/ms-playwright:${RUNNER_USER_HOME:-/home/runner}/.cache/ms-playwright
      - /data/scratch/cache/runners/mq-3/ci-envs:${RUNNER_USER_HOME:-/home/runner}/.cache/omni/ci-envs
      - /data/scratch/cache/runners/mq-3/npm:${RUNNER_USER_HOME:-/home/runner}/.npm
