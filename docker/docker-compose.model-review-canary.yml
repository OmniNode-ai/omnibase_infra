# OMN-17876 — one-runner model-review candidate overlay.
#
# This file is layered by docker/compose-overrides.list so monitor-driven
# recreates cannot silently remove the wiring. It is inactive by default:
# MODEL_REVIEW_CAPABILITY_ACTIVE and MODEL_REVIEW_CONFIG_ACTIVE must both be
# explicitly set to 1 by the separately authorized operator application.
# No secret values or endpoint/topology values belong in this file.
services:
  omninode-runner-1:
    environment:
      MODEL_REVIEW_CAPABILITY_ACTIVE: "${MODEL_REVIEW_CAPABILITY_ACTIVE:-0}"
      MODEL_REVIEW_CONFIG_ACTIVE: "${MODEL_REVIEW_CONFIG_ACTIVE:-0}"
      MODEL_REVIEW_MAX_OBSERVATION_AGE_SECONDS: "${MODEL_REVIEW_MAX_OBSERVATION_AGE_SECONDS:-300}"
      MODEL_REVIEW_OBSERVATION_PATH: /etc/omnibase/model-review-observation.json
      # The operator supplies the capability label only during the authorized
      # canary. The default preserves the generic runner labels.
      RUNNER_LABELS: "${MODEL_REVIEW_RUNNER_LABELS:-self-hosted,omnibase-ci,linux,x64}"
    volumes:
      - ./runners/model-review-healthcheck.sh:/usr/local/bin/model-review-healthcheck.sh:ro
      - ${MODEL_REVIEW_OBSERVATION_HOST_PATH:-model-review-observation}:/etc/omnibase/model-review-observation.json:ro
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh && /usr/local/bin/model-review-healthcheck.sh"]
volumes:
  model-review-observation:
