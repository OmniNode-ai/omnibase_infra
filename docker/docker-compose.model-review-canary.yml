# OMN-17876 — model-review runner overlay, currently naming no runner.
#
# This file is layered by docker/compose-overrides.list so monitor-driven
# recreates cannot silently remove the wiring, and the monitor refuses to
# repair while it is missing (REQUIRED_MODEL_REVIEW_OVERLAY). It was the
# one-runner model-review candidate overlay for omninode-runner-1, inactive by
# default: MODEL_REVIEW_CAPABILITY_ACTIVE and MODEL_REVIEW_CONFIG_ACTIVE must
# both be explicitly set to 1 by the separately authorized operator
# application, and config/runner_fleet.yaml model_review.active is false.
#
# OMN-22898 retired the primary host's general pool (omninode-runner-1..10), so
# the overlay has no service to merge into: a compose override that names a
# service the base file lacks renders a service with no image, and the monitor's
# `docker compose config` preflight would fail and block auto-repair on the
# whole host. The overlay therefore declares no service. The candidate's
# environment, volume and healthcheck wiring is kept in git history; when a
# model-review runner is designated again, name it here and restore that wiring
# for it, with no secret values or endpoint/topology values in this file.
services: {}
