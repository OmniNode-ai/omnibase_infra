# Laptop lane-credential map TEMPLATE (OMN-19983). Not mounted as-is.
#
# Copy this file, mode 0600, and name the copy by its ABSOLUTE path in
# ONEX_LOCAL_LANE_CREDENTIAL_MAP in your env file. Each key is the
# sasl_credential_ref the lane-mirror overlay names; the forwarder resolves it
# here at startup and refuses to start on a missing entry or an empty field.
# The values below are placeholders. This repo holds no credential.
lane.dev-local.kafka.scram:
  # The local superuser redpanda-local-sasl creates: username onex-local and the
  # REDPANDA_SUPERUSER_PASSWORD value from your env file.
  username: "onex-local"
  password: "REPLACE_WITH_REDPANDA_SUPERUSER_PASSWORD"
lane.dev.kafka.scram:
  # The principal the lab issued to your machine for the lab lane it writes.
  username: "REPLACE_WITH_YOUR_LAB_BUS_PRINCIPAL"
  password: "REPLACE_WITH_ITS_PASSWORD"
