# OMN-20910: the Hostile Reviewer gate's voters. THIS FILE IS THE ROSTER.
#
# Operator RULING 2026-10-10T18:17:37Z: "Changing the model for reviews should
# be a contract overlay. We should be able to create a new parameter and
# pointed directly at a different model so we don't get stuck in issues like
# this." Review-voter models are declared here, never in repository Actions
# variables or workflow files.
#
# Who reads it: omniintelligence's node_review_voters_overlay_compute, through
# cli_review --voters-overlay, its retry_budget check and the TCP preflight, in
# the hostile-reviewer.yml of omnibase_infra (from the pull request's own
# checkout), omnimarket and omniclaude (from omnibase_infra `dev` at run time).
# None of those workflows names an endpoint or a model.
#
# To change a voter's model: point its backend_id at another backend of
# dev.bifrost.yaml (or give it an endpoint_url). To add a voter: add an entry.
# The next gate run on any pull request uses the change; no workflow, variable
# or pin moves. An invalid entry, an unknown backend, or an unreachable or
# failing REQUIRED voter fails the gate naming the voter; nothing is
# substituted for it.
#
# What this file cannot change: how many voters must agree. The quorum
# (review_quorum.min_agreeing_models, bounded at >= 2) stays in
# omniintelligence's model_registry.yaml, and distinct voters are counted by
# endpoint plus model (reviewer_identity), so two entries on one endpoint
# serving one model count once.
#
# Fields per voter: voter_id (the name the result reports; names the role,
# not the model), backend_id or endpoint_url, model_id_source (served: the
# endpoint's one /v1/models id, read at call time; declared: api_model_id),
# required, timeout_seconds, max_retries, temperature, top_p, review_focus,
# enable_thinking, reasoning_effort, constrain_findings_schema.
#
# Sampling and focus: OMN-20422 (review-voter-diversity-9f8a). Both voters
# serve Qwen3.8-27B today, so with identical sampling and an identical prompt
# their agreement would be one model agreeing with itself; each gets its own
# sampling and its own emphasis.
schema_version: "review_voters_overlay.v1"
backend_overlay: dev.bifrost.yaml
voters:
  # The first lab delegation rung. Was the registry key qwen3-review.
  - voter_id: correctness
    backend_id: local-coder
    model_id_source: served
    required: true
    timeout_seconds: 120
    enable_thinking: false
    temperature: 0.3
    review_focus: >-
      Give extra scrutiny to correctness: logic errors, off-by-one and boundary conditions, wrong or missing error handling, state that is read before it is written, and tests that would pass whether or not the change worked. Keep reviewing the whole change for every other defect as well; this is added emphasis, not a narrower remit. Label each finding with the category that best describes the defect itself.
  # The Mac Studio delegation rung. Was the registry key local-studio-planner
  # plus LLM_LOCAL_STUDIO_PLANNER_URL (an Actions variable per repository) and a
  # retired Studio port written into three workflow files.
  - voter_id: security-contracts
    backend_id: local-studio-planner
    model_id_source: served
    required: true
    timeout_seconds: 300
    max_retries: 1
    enable_thinking: false
    reasoning_effort: medium
    constrain_findings_schema: true
    temperature: 0.7
    top_p: 0.8
    review_focus: >-
      Give extra scrutiny to security and contracts: untrusted input reaching a shell, query, path or template; secrets, tokens or credentials in code, logs or workflow files; permissions and trust boundaries; and any change to a public interface, schema, event shape or workflow contract that a caller depends on without the callers being updated. Keep reviewing the whole change for every other defect as well; this is added emphasis, not a narrower remit. Label each finding with the category that best describes the defect itself.
