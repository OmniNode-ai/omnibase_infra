# OMN-15807: Canonical local delegation contract overlay for the dev lab lane.
#
# This file is mounted directly by docker-compose.infra.yml and is deliberately
# not rendered through dotenv. It owns the exact authorized .201 lab binding,
# which the shared v2 parser enforces alongside port and URL shape.
# onex-allow-internal-ip OMN-15807 reason="typed dev-lane delegation contract"
# OMN-17502: `locale: lab` states what the schema used to assume — this lane's
# runtime sits on the lab network, so it declares the exact authorized local
# backend set. A lane that runs elsewhere declares `locale: cloud` and zero
# backends instead of mounting bindings it cannot reach.
schema_version: "bifrost_lane_overlay.v3"
lane: dev
locale: lab
backends:
  - backend_id: local-coder
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.6-35B-A3B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
  - backend_id: local-heavy-reasoning
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.6-35B-A3B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
  # OMN-16833: DS-V4-Flash on .200:8101 — previously absent from this overlay, so
  # the rendered contract carried endpoint_url: null, `_load_bifrost_endpoints`
  # dropped the backend, and `escalation`'s LARGE-window (65536) local rung was
  # unbindable on the dev lane; escalation fell through to the metered cheap_cloud
  # Gemini ceiling. Live readback 2026-08-28: GET .200:8101/v1/models -> id
  # "deepseek-v4-flash", context_length 131072; POST /v1/chat/completions -> HTTP
  # 200; reachable from inside `omninode-runtime` on .201.
  # onex-allow-internal-ip OMN-16833 reason="typed dev-lane delegation contract"
  # OMN-16999: DECLARED, NOT SERVING. Re-probed 2026-09-05: GET
  # .200:8101/v1/models -> curl exit 7, http=000. Controls proving the probe ran
  # and the host is healthy: ping .200 = 2/2 packets 0.0% loss; TCP 22 OPEN,
  # 8101 CLOSED; `ssh jonah@192.168.86.200 hostname` = "Stickybeatz-Studio.local"
  # (.200 IS the workstation) and no ds4/llama/vllm process is running there.
  # A stopped operator-started service, not retired hardware — so the row stays
  # and `serving: false` renders it as `endpoint_url: null`, the shape
  # `_load_bifrost_endpoints` skips. Restore by starting the ds4 server,
  # re-probing, updating tests/fixtures/bifrost_served_models_probe.json, and
  # flipping this flag.
  - backend_id: local-ds-v4-flash
    endpoint_url: "http://192.168.86.200:8101/v1/chat/completions"
    served_model_id: "deepseek-v4-flash"
    parameter_count: "284B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
    serving: false
