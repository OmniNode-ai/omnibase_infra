# OMN-15807: Canonical local delegation contract overlay for the dev lab lane.
#
# This file is mounted directly by docker-compose.infra.yml and is deliberately
# not rendered through dotenv. It IS the dev lane's lab binding (OMN-17099: the
# product ships no table of lab hosts); the shared parser enforces its shape,
# the renderer checks each served id against the base contract, and
# tests/fixtures/bifrost_served_models_probe.json pins each endpoint to a probe.
# onex-allow-internal-ip OMN-15807 reason="typed dev-lane delegation contract"
# OMN-17502: `locale: lab` states what the schema used to assume — this lane's
# runtime sits on the lab network, so it binds the lab's local backends. A lane that runs elsewhere declares `locale: cloud` and zero
# backends instead of mounting bindings it cannot reach.
schema_version: "bifrost_lane_overlay.v3"
lane: dev
locale: lab
backends:
  - backend_id: local-coder
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.8-27B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
  - backend_id: local-heavy-reasoning
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.8-27B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
  # OMN-17099: local-embedding was declared by the base contract with
  # endpoint_url: null and never bound by this overlay, so every render of
  # the dev lane shipped it dark even though the endpoint itself is live —
  # live probe 2026-09-27, GET http://192.168.86.201:8002/v1/models returns
  # 200, served id "text-embedding-qwen3", max_model_len 8192 (owned_by vllm,
  # root /data/inference/hf-cache/qwen3-embedding-0.6b — same host and note as
  # the base contract's OMN-16442 comment on this backend_id). The endpoint
  # is embeddings-only: :8002/v1/chat/completions 404s, :8002/v1/embeddings
  # serves real vectors, so the bound URL is the embeddings path, not the
  # chat-completions path every other local rung here uses. Probe recorded in
  # tests/fixtures/bifrost_served_models_probe.json.
  # onex-allow-internal-ip OMN-17099 reason="typed dev-lane delegation contract"
  - backend_id: local-embedding
    endpoint_url: "http://192.168.86.201:8002/v1/embeddings"
    served_model_id: "text-embedding-qwen3"
    parameter_count: "0.6B"
    context_window: 8192
    max_tokens: 1
    timeout_ms: 30000
  # OMN-19187: omnipc2, the second RTX 4090 host at .202, serving the same
  # Qwen3.8-27B as .201 under llama.cpp, keyless (operator ruling, ledger row
  # 5474). A NEW backend id, added by this lane overlay (OMN-17099) — the
  # deleted local-reasoner id is not revived (OMN-16442). Probe recorded in
  # tests/fixtures/bifrost_served_models_probe.json (2026-09-22T22:39:22Z, from
  # inside omninode-runtime-effects). context_window is the server's whole
  # shared token pool: under --kv-unified every slot reports the pool as its
  # n_ctx, so it is not one request's room. The per-slot fair share is
  # pool / slots, declared in `endpoint_capacity` below, and max_tokens is sized
  # against it (OMN-20490). Reachable today by a per-run backend_id pin; placing
  # it in the tier ladder so it takes unpinned traffic is OMN-19215.
  # onex-allow-internal-ip OMN-19187 reason="typed dev-lane delegation contract"
  - backend_id: local-omnipc2-chat
    endpoint_url: "http://192.168.86.202:8000/v1/chat/completions"
    served_model_id: "Qwen3.8-27B"
    parameter_count: "27B"
    context_window: 65536
    # OMN-20490: the share left after the prompt headroom, both from
    # `endpoint_capacity` below. 16384 here was the whole per-slot share, so one
    # request asking for it alongside any prompt could exhaust the pool.
    max_tokens: 4096
    timeout_ms: 300000
    provider: local
    tier: local
    credential:
      kind: none
    capabilities:
      - code_generation
      - refactoring
      - documentation
    # OMN-19215: placed in the local tier after the two .201 rungs it backs.
    # 65536 is llama.cpp's whole token pool (OMN-20240, re-probed 2026-10-01;
    # one KV pool shared by the four slots under --kv-unified), the ceiling the
    # router applies to a prompt, not one slot's share. `mode: spread` (AC4, RULING
    # ledger:4257) also gives it a share of those rungs' first-choice traffic:
    # the routing authority picks .201 or .202 per request by a stable hash of
    # the correlation id, and a transport failure on either retries the other.
    # A prompt larger than 65536 tokens always stays on .201. A prompt over the
    # per-slot share declared in `endpoint_capacity` still routes here, and fits
    # only while the other slots leave the pool free; narrowing this ceiling to
    # the share is a routing change this overlay does not make (OMN-20490). Each engine
    # enforces its own four-slot limit (.201 vLLM --max-num-seqs 4, .202
    # llama.cpp --parallel 4).
    placement:
      tier: local
      fallback_for:
        - local-coder
        - local-heavy-reasoning
      max_context_tokens: 65536
      mode: spread
  # OMN-17427: since 2026-10-08 this rung serves Qwen3.6-35B-A3B (Q8_0 GGUF,
  # ggml-org/Qwen3.6-35B-A3B-GGUF, alias qwen3.6-35b-a3b, 262144-token pool shared
  # by four slots), replacing gpt-oss-120b under operator RULING
  # 2026-10-08T17:38:56Z. The swap is the model only: placement, classes, weight
  # and the 8192-token routing window below are unchanged and stay as measured
  # for gpt-oss until the new model is measured on the same item sets. Its
  # request profile is `local-qwen3-6-35b-a3b-vendor-sampling` in omnimarket's
  # inference_protocols.v1.yaml (the card's non-thinking sampling).
  # The history below is the placement's, as set for gpt-oss-120b:
  # OMN-19432: gpt-oss-120b on the .200 Mac Studio (llama.cpp, MXFP4 GGUF, keyless,
  # 131072-token context pool shared by four slots). RULING 2026-09-30T15:07:51Z:
  # no model is a fallback-only rung, so it is a SPREAD peer of local-heavy-reasoning
  # and takes a share of that rung's first-choice traffic, a transport failure on
  # the member picked first still retrying the others. It serves only the classes
  # it was measured on, `use_for` below, never document or summarization, and never
  # the code rungs. Its `weight` is its share against the rung's 1.0, set from
  # measured capacity: the same 30 real tasks, two runs each, opus blind grade, in
  # one session, gave Qwen 30/60 and gpt-oss 29/60 at medium effort and 36/60 at
  # high, but p50 2.6 s against 16.9 s, about 2.5 times the tokens per answer, four
  # slots, and a server shared with the orchestrating sessions, so about a seventh
  # of a Qwen host's throughput per answer; 0.25 keeps it near a tenth of the group
  # until a week of receipts says otherwise. The routing window is the rung's own
  # 8192 tokens, not the 131072 the server holds: on ten real 9000 to 15500-token
  # plans it had unsupported claims in 65 of 177 claims against 33 of 185 for Qwen.
  # Report: reports/2026-09-30-gpt-oss-120b-delegation-placement.md in
  # knowledge-base-internal. Probe recorded in
  # tests/fixtures/bifrost_served_models_probe.json (2026-09-30T15:31:26Z, from
  # inside omninode-runtime-effects). `use_for` and `weight` need the renderer keys
  # of omnibase_infra#4358 and the engine of omnimarket#3120.
  # onex-allow-internal-ip OMN-19432 reason="typed dev-lane delegation contract"
  - backend_id: local-studio-planner
    endpoint_url: "http://192.168.86.200:8130/v1/chat/completions"
    served_model_id: "qwen3.6-35b-a3b"
    parameter_count: "35B-A3B"
    context_window: 262144
    max_tokens: 16384
    timeout_ms: 300000
    provider: local
    tier: local
    credential:
      kind: none
    capabilities:
      - deep_reasoning
      - reasoning
      - research
      - classification
      - documentation
    placement:
      tier: local
      fallback_for:
        - local-heavy-reasoning
      max_context_tokens: 8192
      mode: spread
      weight: 0.25
      use_for:
        - review
        - reasoning
        - complex_reasoning
        - planning
        - research
        - escalation
# OMN-20490: the token capacity of the one unified-pool endpoint this lane binds
# a backend to. llama.cpp on .202 runs `--kv-unified --parallel 4 -c 65536`
# (read back from /props and /slots, 2026-10-04): ONE 65536-token pool shared by
# four slots, and every slot reports that pool as its n_ctx. Under four
# concurrent requests the bound that holds is the fair share, pool / slots; a
# request past it exhausts the pool and the server answers HTTP 500 "Context
# size has been exceeded". `tests/ci/test_bifrost_endpoint_capacity.py` holds
# every binding on this endpoint, in every committed overlay, to
# max_tokens + prompt_headroom_tokens <= pool_tokens / parallel_slots.
#
# prompt_headroom_tokens is sized from delegation_events (real rows, attempts
# answered HTTP 200 by local-omnipc2-chat, 2026-09-28 to 2026-10-04, n=1882):
# prompt tokens p50 = 12301 and 68.6% of prompts are at most 12288; output
# tokens p99 = 3142, max 8478, and 3 of 1882 passed 4096. The share is spent
# on the prompt first, because the prompt is the large side: a 4096 headroom
# would leave 45.4% of the routed prompts outside the share, 12288 leaves
# 31.4%, and the output cap it costs (4096) is above the 99th percentile of what
# the rung answered.
endpoint_capacity:
  - endpoint: "192.168.86.202:8000"
    pool_tokens: 65536
    parallel_slots: 4
    prompt_headroom_tokens: 12288
