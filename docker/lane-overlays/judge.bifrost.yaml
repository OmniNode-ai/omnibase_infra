# OMN-17150: Typed Bifrost delegation overlay for the judge lane.
#
# The judge lane's runtime services set a non-empty BIFROST_CONTRACT_PATH, so
# entrypoint-runtime.sh renders the Bifrost delegation contract at boot — but
# docker-compose.judge.yml never mounted ANY overlay, and the renderer's old
# hardcoded dev.bifrost.yaml default meant the judge lane's next cold boot
# would have died exactly the way the collaborator lane's did (the latent
# same-class instance called out in OMN-17150). The renderer now fails fast
# without a lane pin, and this file is what the judge lane's
# BIFROST_LANE_OVERLAY_PATH pin names.
#
# OMN-17099: this file IS the binding. The product no longer ships a table of
# lab hosts to check it against; the renderer checks each served id against the
# base contract and requires every local rung the base contract routes to, and
# tests/fixtures/bifrost_served_models_probe.json pins every endpoint here to a
# recorded /v1/models readback. These are the lab's SHARED
# local inference servers, not services of any compose lane. The lane-scoped
# facts are the `lane:` attribution and which file the lane mounts.
# onex-allow-internal-ip OMN-17150 reason="typed judge-lane delegation contract; values pinned by the recorded lab probe fixture"
# OMN-17502: `locale: lab` states what the schema used to assume — this lane's
# runtime sits on the lab network, so it binds the lab's local backends. A lane that runs elsewhere declares `locale: cloud` and zero
# backends instead of mounting bindings it cannot reach.
schema_version: "bifrost_lane_overlay.v3"
lane: judge
locale: lab
backends:
  - backend_id: local-coder
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.8-27B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
  - backend_id: local-heavy-reasoning
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.8-27B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
  # onex-allow-internal-ip OMN-17150 reason="typed judge-lane delegation contract; values pinned by the recorded lab probe fixture"
  # OMN-16999: DECLARED, NOT SERVING. Re-probed 2026-09-05: GET
  # .200:8101/v1/models -> curl exit 7, http=000. Controls proving the probe ran
  # and the host is healthy: ping .200 = 2/2 packets 0.0% loss; TCP 22 OPEN,
  # 8101 CLOSED; `ssh jonah@192.168.86.200 hostname` = "Stickybeatz-Studio.local"
  # (.200 IS the workstation) and no ds4/llama/vllm process is running there.
  # A stopped operator-started service, not retired hardware — so the row stays
  # and `serving: false` renders it as `endpoint_url: null`, the shape
  # `_load_bifrost_endpoints` skips. Restore by starting the ds4 server,
  # re-probing, updating tests/fixtures/bifrost_served_models_probe.json, and
  # flipping this flag.
  - backend_id: local-ds-v4-flash
    endpoint_url: "http://192.168.86.200:8101/v1/chat/completions"
    served_model_id: "deepseek-v4-flash"
    parameter_count: "284B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
    serving: false
