# OMN-17150: Typed Bifrost delegation overlay for the Lakshman collaborator lane.
#
# This lane previously had NO overlay of its own and the renderer fell through
# to a hardcoded dev.bifrost.yaml path — every lane inherited the dev lane's
# routing config, silently when the file was present and with a dev-named
# crash-loop where it was not (this lane's first cold boot). The renderer now
# resolves the overlay from the lane's own BIFROST_LANE_OVERLAY_PATH pin, and
# this file is what that pin names for compose project omnibase-infra-lakshman.
#
# OMN-17099: this file IS the binding. The product no longer ships a table of
# lab hosts to check it against; the renderer checks each served id against the
# base contract and requires every local rung the base contract routes to, and
# tests/fixtures/bifrost_served_models_probe.json pins every endpoint here to a
# recorded /v1/models readback. These endpoints are the lab's SHARED local
# inference servers (host-level model servers, not services of any compose
# lane), so routing this lane at them does not couple it to the dev lane. The
# lane-scoped facts are the `lane:` attribution below and WHICH file the lane
# mounts — both now name this lane explicitly.
# onex-allow-internal-ip OMN-17150 reason="typed collaborator-lane delegation contract; values pinned by the recorded lab probe fixture"
# OMN-17502: `locale: lab` states what the schema used to assume — this lane's
# runtime sits on the lab network, so it binds the lab's local backends. A lane that runs elsewhere declares `locale: cloud` and zero
# backends instead of mounting bindings it cannot reach.
schema_version: "bifrost_lane_overlay.v3"
lane: lakshman
locale: lab
backends:
  - backend_id: local-coder
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.8-27B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
  - backend_id: local-heavy-reasoning
    endpoint_url: "http://192.168.86.201:8000/v1/chat/completions"
    served_model_id: "Qwen3.8-27B"
    parameter_count: "27B"
    context_window: 131072
    max_tokens: 65536
    timeout_ms: 300000
