# OMN-21288: primary dev only, after the shared dev-lane overlay. Other dev
# instances continue to use the shared overlay and carry their own roles.
services:
  omninode-runtime:
    environment:
      ONEX_RUNTIME_FOLDED_PROFILES: ${DEV_RUNTIME_MAIN_FOLDED_PROFILES:?runtime policy contract must set DEV_RUNTIME_MAIN_FOLDED_PROFILES}
      # OMN-23009: the per-profile consumer group handover the policy renders
      # (effects and workers resume from the commits of the retired service that
      # last ran). The runtime reads it as ONEX_RUNTIME_FOLD_HANDOVERS; without
      # this line the folded roles start at their auto_offset_reset and a queued
      # event is skipped. `:?` as on the folded profiles: a blank value is
      # refused at render, never read as "no handover".
      ONEX_RUNTIME_FOLD_HANDOVERS: ${DEV_RUNTIME_MAIN_FOLD_HANDOVERS:?runtime policy contract must set DEV_RUNTIME_MAIN_FOLD_HANDOVERS}
      #
      # -- Effects role (OMN-22930, T8) ---------------------------------------
      # The values below are the ones the retired runtime-effects service set
      # in docker-compose.infra.yml and docker-compose.dev-lane.yml, carried
      # over unchanged to the one process that now runs the effects nodes.
      #
      # Secret resolver: the rendered store-backed config (house mappings plus
      # the tenant_inference_credentials rule that main now owns) and the same
      # read-only Infisical identity the retired service used, resolved from
      # the same operator env names. `:-` as on the retired service: a blank
      # identity is refused loudly at wiring time naming each blank variable.
      ONEX_SECRET_RESOLVER_CONFIG_JSON: ${DEV_RUNTIME_MAIN_STORE_SECRET_RESOLVER_CONFIG_JSON:?runtime policy contract must set DEV_RUNTIME_MAIN_STORE_SECRET_RESOLVER_CONFIG_JSON}
      INFISICAL_ADDR: ${RUNTIME_EFFECTS_INFISICAL_ADDR:-}
      INFISICAL_PROJECT_ID: ${RUNTIME_EFFECTS_INFISICAL_PROJECT_ID:-}
      INFISICAL_CLIENT_ID: ${RUNTIME_EFFECTS_INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${RUNTIME_EFFECTS_INFISICAL_CLIENT_SECRET:-}
      INFISICAL_ENVIRONMENT_SLUG: "dev"
      # Coding-agent nodes, savings consumer and the projection read binding.
      CODING_AGENT_CRED_HOME: /home/${RUNTIME_USER_NAME:-omniinfra}
      ONEX_CODING_AGENT_WORKSPACE_ROOT: /home/${RUNTIME_USER_NAME:-omniinfra}/agent-workspaces
      OMNIBASE_INFRA_SAVINGS_KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      OMNIMARKET_PROJECTION_READ_BINDING_OVERLAY: /etc/onex/projection-read-binding.yaml
      # The store root (the host's clone of the overlays repository, its overlays/
      # folder) comes FIRST, so its copy of a document wins; the frozen root comes
      # second and still serves a document the store lacks (OMN-24077). The default
      # is relative to this docker/ directory, i.e. <registry root>/overlays/overlays
      # beside the omnibase_infra checkout, the clone the canonical-clone sync keeps
      # current; DEV_LANE_OVERLAY_STORE_ROOTS_DIR overrides it.
      # The branch root comes before both, so an overlay a lane installs from a branch
      # (the dev branch installer, OMN-25536) wins. It is a plain directory in the
      # container's writable layer, not a mount: both mounts below are read-only and
      # docker cp cannot write there. The installer's declared roots name it
      # (src/omnibase_infra/models/dev_lane_branch_install_roots.yaml); a recreate removes
      # it, and a reader skips a root that holds no <node>/overlay.yaml.
      ONEX_SKILL_OVERLAY_ROOTS: /etc/onex/skill-overlays-branch:/etc/onex/skill-overlays-store:/etc/onex/skill-overlays
      ONEX_CONTEXT_SOURCE_TENANT_ID: ${DEV_LANE_CONTEXT_SOURCE_TENANT_ID:-lab}
      ONEX_TICKET_GUARD_PATH: /etc/onex/ticket-guard/plugins/onex/hooks/lib/ticket_creation_guard.py
      #
      # -- Ledger source (OMN-24218) ---------------------------------------------
      # node_commitment_check_scheduled_effect reads and appends the ledger through
      # commands these variables name (ledger_read and ledger_append of the runner's
      # overlay), and node_work_state_projection_scheduled_effect reads it the same
      # way. Unset, every tick failed "the commitment ledger source is not bound in
      # the runtime" and the schedule verdict read the job failed. The read is the
      # ledger query command over the bus (the container's own SCRAM login carries
      # the identity); the append is the bus append command. Each command carries
      # the workspace config root and registry root as its own `env` prefix, so no
      # other reader in the container sees a config root it never had. The root
      # holds only config/lab, mounted read-only below, where the lane declaration
      # the broker address is resolved from lives.
      ONEX_LEDGER_BUS_READ_COMMAND: env ONEX_WORKSPACE_CONFIG_ROOT=/etc/onex/workspace-config OMNIBASE_PATH=/app python -m omnibase_core.cli.cli_commands ledger query --bus-lane dev --stdin
      ONEX_LEDGER_BUS_APPEND_COMMAND: env ONEX_WORKSPACE_CONFIG_ROOT=/etc/onex/workspace-config python -m omnimarket.work_ledger_bus.cli append --bus-lane dev --omnibase-path /app
      ONEX_LEDGER_HOST_NAME: ${DEV_LANE_LEDGER_HOST_NAME:-dev-runtime}
      # OMN-25901: the product clones below are read-only, so the verifier cannot fetch
      # into them to measure freshness. It reads each clone's boot revision from this
      # pin file instead, which the deploy agent writes from the clones' own HEAD at the
      # start of a dev job and mounts below. With no readable file, or a clone that no
      # longer contains its pin, a check run in the clone stays refused
      # PRODUCT_CLONE_NOT_FRESH.
      DOD_VERIFY_PRODUCT_CLONE_PIN_FILE: /etc/onex/product-clone-pin/pins.json
      # OMN-25856: total time limit, in seconds, for one hosted dod-verify-start command. omnimarket
      # has no code default and refuses to start a hosted run without it. Above 0 and below the 600 s
      # dispatch deadline, so the verdict is written and published inside it.
      DOD_VERIFY_START_BUDGET_S: "540"
      # OMN-26258: the scheduled ticket closer reads the PR watcher's state at
      # $OMNI_HOME/.claude_scratch/pr-watcher/state.json unless this names another
      # file, and with OMNI_HOME=/app nothing writes that path: the closer's bound
      # profile refused "the PR watcher state file is absent at its declared path" and
      # read no candidates. The file is the one the host's own read-only PR watcher
      # (the onex-pr-watcher-readonly user timer, a tick every 300 s) writes, mounted
      # below. Never a copy from another host.
      ONEX_PR_WATCHER_STATE: /etc/onex/pr-watcher-state/state.json
    # The effects health port keeps answering, now from main (plan T8: port
    # 8086 answers from main).
    ports:
      - "${DEV_RUNTIME_EFFECTS_PORT:?runtime policy contract must set DEV_RUNTIME_EFFECTS_PORT}:8085"
    networks:
      - omnibase-infra-network
      - omnimemory-network
    volumes:
      # Main keeps runtime_data at /app/data. Retain the carrier's historical
      # state and logs separately; no volume is removed during retirement.
      - tenant_projection_data:/app/tenant-projection-data
      - tenant_projection_logs:/app/tenant-projection-logs:ro
      # The retired effects service's state and logs stay in place and are
      # never removed; a rollback restores the service on the same volumes.
      - effects_data:/app/effects-data
      - effects_logs:/app/effects-logs:ro
      # OMN-21288 (T9): the retired worker's logs stay in place and are never
      # removed; a rollback restores the service on the same volume.
      - worker_logs:/app/worker-logs:ro
      - ./projection-runtime-binding/runtime-read.yaml:/etc/onex/projection-read-binding.yaml:ro
      - ${DEV_LANE_SKILL_OVERLAY_ROOTS_DIR:-./skill-overlay-roots}:/etc/onex/skill-overlays:ro
      # The store root (the host's clone of the overlays repository, its overlays/
      # folder) comes FIRST, so its copy of a document wins; the frozen root comes
      # second and still serves a document the store lacks (OMN-24077). The default
      # is relative to this docker/ directory, i.e. <registry root>/overlays/overlays
      # beside the omnibase_infra checkout, the clone the canonical-clone sync keeps
      # current; DEV_LANE_OVERLAY_STORE_ROOTS_DIR overrides it.
      - ${DEV_LANE_OVERLAY_STORE_ROOTS_DIR:-../../overlays/overlays}:/etc/onex/skill-overlays-store:ro
      - ${OMNICLAUDE_SKILLS_DIR:-./skills}/../../..:/etc/onex/ticket-guard:ro
      # The lane declaration folder (OMN-24218): the deploy agent sets
      # ONEX_LANE_DECLARATION_DIR to the real config/lab folder, because it points
      # ONEX_LANE_OVERLAY_DIR at a rendered copy under its state directory, so the
      # overlay directory's parent is not it. Required, never a nested default
      # (tests/ci/test_compose_no_nested_expansion.py); every caller of this file sets
      # it. Read-only.
      - ${ONEX_LANE_DECLARATION_DIR:?ONEX_LANE_DECLARATION_DIR must name the config/lab folder that holds ci_bus_lanes.yaml; the deploy agent, the warm refresh and the compose file helpers set it from ONEX_LANE_OVERLAY_DIR}:/etc/onex/workspace-config/config/lab:ro
      # Product clones (OMN-25709): the Done guard's dod_verify finds a ticket's contract only through
      # a canonical clone at $OMNI_HOME/<name> (OMNI_HOME=/app in the runtime image) and returned
      # CONTRACT_MISSING with product_clones=[] for every ticket while /app held none. Each product
      # clone is mounted read-only from the registry-root layout the canonical-clone sync keeps current
      # (the same layout the overlays store root above is derived from), so the lane host needs no new
      # operator variable and no credential. onex_change_control is the governance repository the
      # verifier never reads as a product clone and is not mounted.
      - ../../omnibase_core:/app/omnibase_core:ro
      - ../../omnibase_infra:/app/omnibase_infra:ro
      - ../../omnibase_spi:/app/omnibase_spi:ro
      - ../../omniclaude:/app/omniclaude:ro
      - ../../omnidash:/app/omnidash:ro
      - ../../omniintelligence:/app/omniintelligence:ro
      - ../../omnimarket:/app/omnimarket:ro
      - ../../omnimemory:/app/omnimemory:ro
      # OMN-25901: the pin file's directory, read-only, so a replaced file shows in a
      # running container. Relative to docker/ like the clones above: the registry root's
      # .onex_state, where the deploy agent writes it.
      - ../../.onex_state/product-clone-pin:/etc/onex/product-clone-pin:ro
      # OMN-26258: the read-only PR watcher's state directory on this host, read-only.
      # The directory, not the file: the watcher replaces state.json atomically, so a
      # file mount would keep the replaced inode. ${HOME} is the deploy agent user's
      # home, the user the watcher timer runs as (a user unit, installed by the host
      # installer node into .local/state/onex/pr-watcher-readonly).
      - ${HOME}/.local/state/onex/pr-watcher-readonly:/etc/onex/pr-watcher-state:ro
      - ${CODING_AGENT_CODEX_AUTH_HOST_FILE:-/dev/null}:/home/${RUNTIME_USER_NAME:-omniinfra}/.codex/auth.json:ro
      - ${CODING_AGENT_CLAUDE_CREDS_HOST_DIR:-/dev/null}:/home/${RUNTIME_USER_NAME:-omniinfra}/.claude:ro
  # The retired carrier starts under no profile a lane bring-up requests, as
  # the stability lane folds runtime-effects. A service-level `!reset` would
  # break every reader that loads the overlays with SafeLoader.
  tenant-projection-writer:
    profiles: !override ["folded-tenant-projection"]
  # OMN-21288: the claude hook-events projection runs inside main. Main no
  # longer excludes the node, and the writer, which shares main's
  # KAFKA_INSTANCE_ID (so the group id and committed offsets are unchanged),
  # starts under no profile a lane bring-up requests. The deploy handler retires
  # a container of the previous revision before main is recreated.
  projection-claude-hook-events-writer:
    profiles: !override ["folded-hook-events"]
