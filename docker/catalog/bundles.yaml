# Bundle definitions for ONEX infrastructure catalog.
# Each bundle groups entries that are deployed together.
# "includes" pulls in all entries from another bundle (transitive).
core:
  description: "Core infrastructure — always deployed"
  services:
    - postgres
    - redpanda
    - valkey
    - infisical
    - keycloak
  includes: []
  inject_env:
    INFISICAL_ADDR: "http://infisical:8080"
    # Allow a process-local dev override while keeping the default owned by
    # the rendered runtime policy contract (DEV_TOPIC_PROVISIONER_MAX_PARTITIONS).
    ONEX_TOPIC_PROVISIONER_MAX_PARTITIONS: "${ONEX_TOPIC_PROVISIONER_MAX_PARTITIONS:-${DEV_TOPIC_PROVISIONER_MAX_PARTITIONS:?runtime policy contract must set DEV_TOPIC_PROVISIONER_MAX_PARTITIONS}}"
  # Only vars an operator can supply BEFORE the first bring-up belong here
  # (OMN-16187). The Infisical machine identity is minted by
  # scripts/setup-infisical-identity.sh at step 4 of bootstrap-infisical.sh,
  # against the Infisical container these very services start — requiring it
  # here made local bring-up impossible for a self-hosting operator. It now
  # gates the runtime bundle, where its only consumer lives.
  inject_required_env:
    - INFISICAL_ENCRYPTION_KEY
    - INFISICAL_AUTH_SECRET
runtime-core:
  description: "ONEX runtime core — 7 services with no env requirements beyond the 0.34.0 baseline (OMN-9332). Use `onex up runtime-core` to redeploy correctness fixes without also enabling integrations that need new secrets."
  services:
    - omninode-runtime
    - runtime-effects
    - agent-actions-consumer
    - skill-lifecycle-consumer
    - context-audit-consumer
    - omninode-contract-resolver
    - intelligence-api
  includes: []
  inject_env: {}
  inject_required_env: []
runtime-integrations:
  description: "Runtime external-integration services — Linear, CI, Slack webhooks (OMN-9332)"
  services:
    - ci-relay
    - linear-relay
    - waitlist-signup-notifier
  includes: []
  inject_env: {}
  inject_required_env:
    - CI_CALLBACK_TOKEN
    - LINEAR_WEBHOOK_SECRET
    - WAITLIST_NOTIFIER_SLACK_BOT_TOKEN
    - WAITLIST_NOTIFIER_SLACK_CHANNEL_ID
runtime-observability-projections:
  description: "Runtime projection/observability consumers — postgres projections, cost aggregation, health projection, decision store (OMN-9332)"
  services:
    - injection-effectiveness-consumer
    - savings-estimation-consumer
    - llm-cost-aggregation-consumer
    - consumer-health-projection
    - decision-store-consumer
    - omnimarket-projection-delegation
    - infra-routing-decisions-consumer
    - projection-api
  includes: []
  inject_env: {}
  inject_required_env:
    - OMNIBASE_INFRA_INJECTION_EFFECTIVENESS_POSTGRES_DSN
runtime-infrastructure:
  description: "Runtime infrastructure glue — migrations, workers, autoheal, DLQ replay (OMN-9332, OMN-12619)"
  services:
    - forward-migration
    - migration-gate
    - intelligence-migration
    - runtime-worker
    - retry-worker
    - autoheal
    - dlq-replay-consumer
  includes: []
  inject_env: {}
  inject_required_env: []
runtime:
  description: "ONEX runtime platform — composed of runtime-core, runtime-integrations, runtime-observability-projections, runtime-infrastructure (OMN-9332). Preserves the `onex up runtime` operator contract."
  services: []
  includes:
    - core
    - tracing # OMN-8697: always wire Phoenix OTLP tracing with the runtime
    - runtime-core
    - runtime-integrations
    - runtime-observability-projections
    - runtime-infrastructure
  inject_env: {}
  # OMN-16187: the Infisical machine identity gates the runtime lane, not core.
  # runtime_host_process is its only consumer (config prefetch); requiring it
  # here keeps the operator contract that the runtime never starts with prefetch
  # silently skipped, while leaving `onex up core` bringable with local secrets.
  inject_required_env:
    - INFISICAL_CLIENT_ID
    - INFISICAL_CLIENT_SECRET
    - INFISICAL_PROJECT_ID
observability:
  description: "LLM observability — Phoenix traces and evals"
  services:
    - phoenix
  includes: []
memgraph:
  description: "Graph memory database for OmniMemory"
  services:
    - omnibase-infra-memgraph
  includes: []
  inject_env:
    OMNIMEMORY_ENABLED: "true"
    OMNIMEMORY_MEMGRAPH_HOST: "omnibase-infra-memgraph"
    OMNIMEMORY_MEMGRAPH_PORT: "7687"
  inject_required_env:
    - OMNIMEMORY_DB_URL
secrets:
  description: "Infisical secrets management (DEPRECATED — Infisical is now in core bundle)"
  services: []
  includes:
    - core
  inject_env: {}
  inject_required_env: []
auth:
  description: "Keycloak local OIDC/auth"
  services:
    - keycloak
  includes: []
  inject_required_env:
    - KEYCLOAK_ADMIN_PASSWORD
tracing:
  description: "OpenTelemetry tracing to Phoenix"
  services: []
  includes:
    - observability
  inject_env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://phoenix:6006"
    OTEL_TRACES_EXPORTER: "otlp"
omnimemory:
  description: "OmniMemory data layer — Qdrant, Memgraph, Valkey, Kreuzberg (OMN-8738)"
  services:
    - omnimemory-qdrant
    - omnimemory-memgraph
    - omnimemory-valkey
    - omnimemory-kreuzberg
  includes: []
  inject_env: {}
  inject_required_env: []
omnimarket-projections:
  description: "OmniMarket Kafka-to-DB projection consumers (OMN-7610 / OMN-8738)"
  services:
    - omnimarket-projection-session-outcome
    - omnimarket-projection-llm-cost
    - omnimarket-projection-cost-by-repo
    - omnimarket-projection-savings
    - omnimarket-projection-delegation
    - omnimarket-projection-baselines
    - omnimarket-projection-registration
    - omnimarket-projection-live-events
  includes:
    - core
  inject_required_env:
    - OMNIDASH_ANALYTICS_DB_URL
    # OMN-15425: the tenant-domain projection identity. Separate from the line
    # above because it resolves a DIFFERENT principal (tenant_projection_writer)
    # on the same database — see docker-compose.infra.yml's ONEX_TENANT_DB_URL.
    - ONEX_TENANT_DB_URL
omnidash:
  description: "OmniDash Next.js analytics dashboard (OMN-8738)"
  services:
    - omnidash
  includes:
    - core
  inject_required_env:
    - OMNIDASH_ANALYTICS_DB_URL
canary:
  description: "ONEX canary runtime — loads contracts with runtime_profiles=[canary] for ADR canary orchestrator demo path (OMN-10729). Use `onex up canary` to bring up alongside core."
  services:
    - runtime-canary
  includes:
    - core
  inject_env: {}
  inject_required_env: []
fault-injection:
  description: >
    Permanent DLQ fault-injection fixture (OMN-16265, OMN-14498 follow-on). Deliberately NOT included in the `runtime` bundle — this is an opt-in, on-demand deployment for driving primary-publish + DLQ-leg failures against node_fault_inject_fixture_compute's own private topics, never part of the always-on runtime surface. The service depends_on omninode-runtime + redpanda, which this bundle does not itself provide (only `core`) — bring it up alongside the `runtime` bundle (e.g. `onex up runtime fault-injection`) only when actively running a boundary-behavior regression check; see knowledge-base:runbooks/fault-inject-fixture-dlq-offset-withholding.md.

  services:
    - fault-inject-fixture
  includes:
    - core
  inject_env: {}
  inject_required_env: []
