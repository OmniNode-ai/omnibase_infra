name: postgres
description: Primary PostgreSQL data store for all ONEX platform databases
image: postgres:16-alpine
layer: infrastructure
container_name: omnibase-infra-postgres
required_env:
  - POSTGRES_PASSWORD
hardcoded_env:
  POSTGRES_DB: omnibase_infra
operational_defaults:
  POSTGRES_USER: postgres
  ROLE_OMNIBASE_PASSWORD: ''
  ROLE_OMNICLAUDE_PASSWORD: ''
  ROLE_OMNIDASH_PASSWORD: ''
  ROLE_OMNIINTELLIGENCE_PASSWORD: ''
  ROLE_OMNIMEMORY_PASSWORD: ''
  ROLE_OMNINODE_PASSWORD: ''
ports:
  external: 5436
  internal: 5432
healthcheck:
  # OMN-17150 defect 1: TCP via the compose service name, not the unix socket. The postgres image's
  # temporary initdb server listens on the socket only (listen_addresses=''),
  # so a socket probe reports HEALTHY before the real server exists and
  # releases every `service_healthy` dependent into a refused connection.
  # start_period covers a cold initdb (which also runs the whole
  # /docker-entrypoint-initdb.d forward-migration tree on this image). Kept in
  # step with the same block in docker/docker-compose.{infra,judge,lakshman}.yml.
  test: pg_isready -h postgres -p 5432 -U ${POSTGRES_USER:-postgres} -d omnibase_infra
  interval_s: 10
  timeout_s: 10
  retries: 5
  start_period_s: 180
volumes:
  - postgres_data:/var/lib/postgresql/data
  - ./migrations/forward:/docker-entrypoint-initdb.d:ro
depends_on: []
restart: unless-stopped
resources: null
labels:
  com.omninode.service: postgres
  com.omninode.layer: infrastructure
