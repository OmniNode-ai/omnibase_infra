name: fault-inject-fixture
description: >
  Permanent fault-injection fixture (OMN-16265, OMN-14498 follow-on). Runs NodeFaultInjectFixtureCompute in its own dedicated consumer group with a private, deliberately-unprovisioned dead_letter_topic override (onex.dlq.omnibase-infra.fault-inject-fixture.v1), so a caller can drive both the primary-publish failure AND the DLQ-leg failure on demand (BoundaryApplyPublishError / offset withholding) with zero effect on any other contract's traffic or DLQ topic. See knowledge-base:runbooks/fault-inject-fixture-dlq-offset-withholding.md.

image: runtime:latest
layer: runtime
container_name: omninode-fault-inject-fixture
required_env:
  - POSTGRES_PASSWORD
  - VALKEY_PASSWORD
  - KEYCLOAK_ADMIN_CLIENT_SECRET
  - ONEX_SERVICE_CLIENT_SECRET
  - ONEX_REGISTRATION_AUTO_ACK
  - LLM_CODER_URL
  - LLM_CODER_FAST_URL
  - LLM_EMBEDDING_URL
  - LLM_DEEPSEEK_R1_URL
  - LLM_ENDPOINT_CIDR_ALLOWLIST
  - LLM_CLOUD_ENDPOINT_HOST_ALLOWLIST
  - LOCAL_LLM_SHARED_SECRET
hardcoded_env:
  OMNIBASE_INFRA_DB_URL: 'postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/omnibase_infra'
  OMNIINTELLIGENCE_DB_URL: 'postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/omniintelligence'
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  KAFKA_BROKER_ALLOWLIST: 'redpanda:'
  # OMN-16265: private, deliberately-unprovisioned DLQ override. Never
  # provision this topic — its absence is what fails the DLQ leg on a
  # double-failure fault-injection run. Takes precedence over the
  # category-derived shared DLQ topic (mixin_kafka_dlq.py:264-265), so this
  # process's DLQ routing never touches onex.dlq.omnibase-infra.commands.v1
  # or any other contract's DLQ traffic.
  KAFKA_DEAD_LETTER_TOPIC: onex.dlq.omnibase-infra.fault-inject-fixture.v1
  BUS_ID: local
  ONEX_CONTRACTS_DIR: /app/contracts
  ONEX_STATE_ROOT: /app/data/.onex_state
  ONEX_ACTIVE_RUNTIME_PACKAGES: ${ONEX_ACTIVE_RUNTIME_PACKAGES:?runtime policy contract must set ONEX_ACTIVE_RUNTIME_PACKAGES}
  VALKEY_HOST: valkey
  VALKEY_PORT: '6379'
  ONEX_MARKETPLACE_SKILLS_ROOT: /app/skills
  USE_EVENT_ROUTING: 'true'
  KEYCLOAK_ADMIN_URL: http://keycloak:8080
  OTEL_SERVICE_NAME: omninode-fault-inject-fixture
  RUNTIME_PROFILE: effects
  ONEX_RUNTIME_CAPABILITIES: ${DEV_RUNTIME_EFFECTS_CAPABILITIES:?runtime policy contract must set DEV_RUNTIME_EFFECTS_CAPABILITIES}
  OMNIBASE_INFRA_SAVINGS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  POSTGRES_HOST: postgres
  ENABLE_RUNTIME_LOG_BRIDGE: 'true'
operational_defaults:
  POSTGRES_USER: postgres
  ONEX_LOG_LEVEL: INFO
  ONEX_ENVIRONMENT: local
  KEYCLOAK_REALM: omninode
  KEYCLOAK_ADMIN_CLIENT_ID: onex-admin
  KEYCLOAK_ISSUER: http://localhost:28080/realms/omninode
  ONEX_SERVICE_CLIENT_ID: onex-service
  # Dedicated consumer group — kept separate from every other consumer so
  # its offset is independently observable during a fault-injection run
  # (kernel reads ONEX_GROUP_ID; service_kernel.py:639).
  ONEX_GROUP_ID: onex-fault-inject-fixture
ports:
  external: 8099
  internal: 8085
healthcheck:
  # OMN-17883: the SEMANTIC probe, not `curl -sf`. `curl -sf` asserts only
  # "status code < 400", and /health returns 200 for a running-but-DEGRADED
  # runtime by design (ServiceHealth._handle_health), so the shallow check
  # cannot fail on the exact condition OMN-15217 was filed for. Worse, a
  # compose-level healthcheck OVERRIDES the image-level HEALTHCHECK, so this
  # entry was replacing the deep probe Dockerfile.runtime already bakes in.
  # List form renders as ["CMD", ...] and needs no shell.
  test:
    - python
    - /usr/local/bin/onex-container-healthcheck
    - --degraded-policy
    - fail
  interval_s: 45
  timeout_s: 10
  retries: 5
  start_period_s: 1800
volumes:
  - fault_inject_fixture_logs:/app/logs
  - fault_inject_fixture_data:/app/data
  - ../contracts:/app/contracts:ro
depends_on:
  - service: omninode-runtime
    condition: service_healthy
  - service: redpanda
    condition: service_healthy
restart: unless-stopped
resources:
  cpus: '0.25'
  memory: 512M
  cpus_reservation: '0.05'
  memory_reservation: 64M
stop_grace_period: 30s
labels:
  com.omninode.service: fault-inject-fixture
  com.omninode.layer: runtime
  com.omninode.version: ${RUNTIME_VERSION:-0.1.0}
  autoheal: 'true'
