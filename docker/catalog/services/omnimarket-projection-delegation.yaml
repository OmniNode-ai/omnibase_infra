name: omnimarket-projection-delegation
description: Kafka-to-DB projection consumer for delegation events (OMN-7610)
# OMN-19496: built from docker/Dockerfile.runtime, which installs omnimarket, as
# the dev lane's projection-delegation-writer is (docker-compose.dev-lane.yml).
# The former omnimarket-projection:latest image was built only in the
# omnimarket repo, so no catalog render could start this service.
image: runtime:latest
layer: runtime
container_name: omnimarket-projection-delegation
required_env:
  # OMN-15425: this service binds the `tenant_projection` topology binding,
  # whose principal is tenant_projection_writer. That binding has its own DSN
  # env because OMN-16911 attests current_user per binding and one DSN cannot
  # read back as two principals. OMNIDASH_ANALYTICS_DB_URL is retained for the
  # dashboard-facing settings fallback this change did not re-scope.
  - OMNIDASH_ANALYTICS_DB_URL
  - ONEX_TENANT_DB_URL
hardcoded_env:
  KAFKA_BROKERS: redpanda:9092
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  PYTHONUNBUFFERED: "1"
  # The runner's /ready server; 8099 as on the dev lane.
  PROJECTION_RUNNER_HEALTH_PORT: "8099"
operational_defaults:
  KAFKA_CONSUMER_GROUP: local.omnimarket-projections.delegation-writer.consume.v1
  ONEX_LOG_LEVEL: INFO
ports: null
healthcheck:
  test: curl -sf http://localhost:8099/ready
  interval_s: 30
  timeout_s: 10
  retries: 3
  start_period_s: 60
volumes: []
depends_on:
  - service: migration-gate
    condition: service_healthy
  - service: redpanda
    condition: service_healthy
  - service: postgres
    condition: service_healthy
restart: unless-stopped
resources:
  cpus: "0.5"
  memory: 1024M
  cpus_reservation: "0.1"
  memory_reservation: 64M
stop_grace_period: 30s
command:
  - python
  - -m
  - omnimarket.nodes.node_projection_delegation.handlers.handler_delegation
labels:
  com.omninode.service: omnimarket-projection-delegation
  com.omninode.layer: runtime
