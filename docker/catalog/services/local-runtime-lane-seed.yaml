# OMN-19747: a runtime resolves its lane from a typed overlay document and
# refuses to start without one. A laptop has no store and no operator home, so
# this one-shot writes the laptop's own local-home source into two named
# volumes that the local bundle mounts read-only into every runtime: the
# bootstrap file that selects the local-home source, and the `runtime.lane`
# document for the lane the bundle names in ONEX_RUNTIME_LANE. The reader
# refuses a document that is not mode 0600, so a bind-mounted repo file cannot
# serve; this seed owns the modes. Listed ONLY in the `local` bundle. Roles are
# empty: a laptop is a registered non-lab lane.
name: local-runtime-lane-seed
description: One-shot seed of the laptop's runtime lane overlay source
image: postgres:16-alpine
layer: infrastructure
container_name: omnibase-infra-local-runtime-lane-seed
hardcoded_env:
  ONEX_ENVIRONMENT: local
  ONEX_RUNTIME_LANE: dogfood
ports: null
healthcheck: null
volumes:
  - runtime_onex_home:/seed/onex
  - runtime_lane_config:/seed/config
depends_on: []
restart: 'no'
resources:
  cpus: '0.25'
  memory: 64M
  cpus_reservation: '0.1'
  memory_reservation: 32M
entrypoint:
  - /bin/sh
  - -c
# `$$` is compose's escape for a `$` the container's shell expands.
command:
  - |
    set -eu
    umask 077
    lane_dir="/seed/config/$${ONEX_ENVIRONMENT}/$${ONEX_RUNTIME_LANE}"
    mkdir -p "$$lane_dir"
    printf 'config_source: local-home\n' > /seed/onex/config.yaml
    printf '{"schema_version": "runtime_lane.v1", "lane_id": "%s", "roles": [], "description": "laptop profile runtime lane"}\n' "$$ONEX_RUNTIME_LANE" > "$$lane_dir/runtime.lane.json"
    chown -R 1000:1000 /seed/onex /seed/config
    chmod 600 /seed/onex/config.yaml "$$lane_dir/runtime.lane.json"
    echo "[local-runtime-lane-seed] lane $$ONEX_RUNTIME_LANE seeded at $$lane_dir"
labels:
  com.omninode.service: local-runtime-lane-seed
  com.omninode.layer: infrastructure
  com.omninode.ticket: OMN-19747
