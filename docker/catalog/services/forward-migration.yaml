name: forward-migration
description: One-shot runner for pending forward SQL migrations
image: postgres:16-alpine
layer: infrastructure
container_name: omnibase-infra-forward-migration
required_env:
  - POSTGRES_PASSWORD
hardcoded_env:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_DB: omnibase_infra
  NODE_POSTGRES_DB: omnidash_analytics
  MIGRATIONS_DIR: /migrations/forward
  # Login-only principal credentials, asserted by run-forward-migrations.sh
  # section 0 (OMN-16993). Empty skips the role, so a bundle whose env file
  # does not carry them is unchanged; the `local` bundle requires both.
  OMNINODE_RUNTIME_PASSWORD: ${OMNINODE_RUNTIME_PASSWORD:-}
  TENANT_PROJECTION_WRITER_PASSWORD: ${TENANT_PROJECTION_WRITER_PASSWORD:-}
operational_defaults:
  POSTGRES_USER: postgres
ports: null
healthcheck: null
volumes:
  - ../scripts/run-forward-migrations.sh:/run-forward-migrations.sh:ro
  - ../docker/migrations/forward:/migrations/forward:ro
depends_on:
  - service: postgres
    condition: service_healthy
restart: 'no'
resources:
  cpus: '0.25'
  memory: 128M
  cpus_reservation: '0.1'
  memory_reservation: 64M
command:
  - sh
  - /run-forward-migrations.sh
labels:
  com.omninode.service: forward-migration
  com.omninode.layer: infrastructure
  com.omninode.ticket: OMN-4175
