name: projection-claude-hook-events-writer
description: >-
  Dedicated carrier for node_projection_claude_hook_events (OMN-19513). The ONEX runtime kernel booted over a manifest of exactly that one contract (ONEX_RUNTIME_NODE_SELECTION), under the main role. The primary dev lane starts it and sets ONEX_RUNTIME_NODE_EXCLUSION on omninode-runtime, so the node has one consumer-group owner and a restart of the main runtime, which joins about 560 consumer groups one at a time, no longer leaves the hook-event projection unsubscribed for about 19 minutes.
image: runtime:latest
layer: runtime
# The lane overlays give this a lane-scoped name; the bare name here matches the
# base compose declaration for the dev lane.
container_name: omnimarket-projection-claude-hook-events-writer
required_env:
  - POSTGRES_PASSWORD
  - VALKEY_PASSWORD
  - KEYCLOAK_ADMIN_CLIENT_SECRET
  - ONEX_SERVICE_CLIENT_SECRET
hardcoded_env:
  OMNIBASE_INFRA_DB_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/omnibase_infra'
  OMNIINTELLIGENCE_DB_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/omniintelligence'
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  KAFKA_BROKER_ALLOWLIST: 'redpanda:'
  BUS_ID: local
  ONEX_CONTRACTS_DIR: /app/contracts
  ONEX_STATE_ROOT: /app/data/.onex_state
  ONEX_STATE_DIR: /app/data/.onex_state
  ONEX_ACTIVE_RUNTIME_PACKAGES: ${ONEX_ACTIVE_RUNTIME_PACKAGES:?runtime policy contract must set ONEX_ACTIVE_RUNTIME_PACKAGES}
  VALKEY_HOST: valkey
  VALKEY_PORT: '6379'
  ONEX_MARKETPLACE_SKILLS_ROOT: /app/skills
  USE_EVENT_ROUTING: 'true'
  KEYCLOAK_ADMIN_URL: http://keycloak:8080
  OTEL_SERVICE_NAME: omnimarket-projection-claude-hook-events-writer
  RUNTIME_PROFILE: main
  # The one contract this process loads. The main runtime names the same
  # contract in ONEX_RUNTIME_NODE_EXCLUSION where the lane starts this service.
  ONEX_RUNTIME_NODE_SELECTION: projection_claude_hook_events
  ONEX_RUNTIME_CAPABILITIES: projection.writer
  # Same instance discriminator as the main runtime, so the consumer group
  # (...consume.1.0.0.__i.runtime-main.__t.<topic>) and its committed offsets
  # carry over from the main runtime to this process.
  KAFKA_INSTANCE_ID: runtime-main
  OMNIINTELLIGENCE_PUBLISH_INTROSPECTION: 'false'
  POSTGRES_HOST: postgres
operational_defaults:
  POSTGRES_USER: postgres
  ONEX_LOG_LEVEL: INFO
  ONEX_ENVIRONMENT: local
  ONEX_DATABASE_TOPOLOGY_PROFILE: local
  KEYCLOAK_REALM: omninode
  KEYCLOAK_ADMIN_CLIENT_ID: onex-admin
  KEYCLOAK_ISSUER: http://localhost:28080/realms/omninode
  ONEX_SERVICE_CLIENT_ID: onex-service
  # A distinct group id keeps this process's own kernel consumers off the main
  # runtime's. The node's consumer group is derived from the node identity.
  ONEX_GROUP_ID: onex-runtime-claude-hook-events-writer
ports: null
healthcheck:
  test:
    - CMD
    - curl
    - -sf
    - http://localhost:8085/health
  interval_s: 30
  timeout_s: 10
  retries: 5
  start_period_s: 600
volumes:
  - ../contracts:/app/contracts:ro
depends_on:
  - service: migration-gate
    condition: service_healthy
  - service: redpanda
    condition: service_healthy
  - service: postgres
    condition: service_healthy
restart: unless-stopped
resources:
  cpus: '1.0'
  memory: 1536M
  cpus_reservation: '0.25'
  memory_reservation: 256M
stop_grace_period: 90s
labels:
  com.omninode.service: projection-claude-hook-events-writer
  com.omninode.layer: runtime
  com.omninode.ticket: OMN-19513
  com.omninode.version: ${RUNTIME_VERSION:-0.1.0}
  autoheal: 'true'
