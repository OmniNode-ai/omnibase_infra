name: omnimarket-projection-tenant-credentials
description: Kafka-to-DB projection consumer for tenant provider credential references (OMN-17099)
# Built from docker/Dockerfile.runtime, which installs omnimarket.
image: runtime:latest
layer: runtime
container_name: omnimarket-projection-tenant-credentials
required_env:
  # Match the dev lane's analytics, tenant and internal projection bindings.
  # The local bundle injects all three DSNs from its existing local passwords.
  - OMNIDASH_ANALYTICS_DB_URL
  - ONEX_TENANT_DB_URL
  - OMNINODE_INTERNAL_DB_URL
hardcoded_env:
  KAFKA_BROKERS: redpanda:9092
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  PYTHONUNBUFFERED: "1"
  PROJECTION_RUNNER_HEALTH_PORT: "8102"
operational_defaults:
  KAFKA_CONSUMER_GROUP: local.omnimarket-projections.tenant-credentials-writer.consume.v1
  ONEX_LOG_LEVEL: INFO
ports: null
healthcheck:
  test: curl -sf http://localhost:8102/ready
  interval_s: 30
  timeout_s: 10
  retries: 3
  start_period_s: 60
volumes: []
depends_on:
  - service: migration-gate
    condition: service_healthy
  - service: redpanda
    condition: service_healthy
  - service: postgres
    condition: service_healthy
restart: unless-stopped
resources:
  cpus: "0.5"
  memory: 1024M
  cpus_reservation: "0.1"
  memory_reservation: 64M
stop_grace_period: 30s
command:
  - python
  - -m
  - omnimarket.nodes.node_projection_tenant_credentials.handlers.handler_tenant_credentials_projection
labels:
  com.omninode.service: omnimarket-projection-tenant-credentials
  com.omninode.layer: runtime
