# Standalone operator-edge gateway overlay. This process connects outbound to
# staging MSK and to the .201 local Redpanda listener; it opens no inbound port.
services:
  gateway-forwarder:
    image: "${GATEWAY_IMAGE:?GATEWAY_IMAGE is required}"
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omninode-gateway-forwarder
    # Starting as the image's non-root runtime user avoids the generic
    # entrypoint's root-to-user transition dropping the TPM supplemental group.
    user: "${GATEWAY_CONTAINER_UID:?GATEWAY_CONTAINER_UID is required}:${GATEWAY_CONTAINER_GID:?GATEWAY_CONTAINER_GID is required}"
    group_add:
      - "${GATEWAY_TPM_GROUP_ID:?GATEWAY_TPM_GROUP_ID is required}"
    command:
      - onex-gateway-forwarder
      - --config
      - /app/config/gateway-forwarder.yaml
      - --ready-file
      - /tmp/gateway-forwarder-ready
      - --broker-ref-map
      - /run/gateway/broker-ref-map.yaml
    environment:
      AWS_PROFILE: "${GATEWAY_AWS_PROFILE:-gateway}"
      AWS_CONFIG_FILE: "/run/aws/config"
      AWS_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_SDK_LOAD_CONFIG: "1"
      ONEX_TOPIC_ENFORCEMENT_MODE: "reject"
    volumes:
      - ./gateway/beta-gateway-canary.yaml:/app/config/gateway-forwarder.yaml:ro
      # /app/data is created in the runtime image as omniinfra:omniinfra. A
      # fresh named volume inherits that ownership, which matters because this
      # service deliberately starts as the non-root runtime user.
      - gateway-delivery-state:/app/data
      # IAM Roles Anywhere supplies short-lived session credentials through
      # credential_process. No AWS access key is stored on the edge host.
      - ${GATEWAY_AWS_CONFIG_FILE:?GATEWAY_AWS_CONFIG_FILE is required}:/run/aws/config:ro
      - ${GATEWAY_AWS_CERTIFICATE_FILE:?GATEWAY_AWS_CERTIFICATE_FILE is required}:/run/aws/certificate.pem:ro
      - ${GATEWAY_AWS_PRIVATE_KEY_FILE:?GATEWAY_AWS_PRIVATE_KEY_FILE is required}:/run/aws/private-key.tss:ro
      - ${GATEWAY_AWS_SIGNING_HELPER_FILE:?GATEWAY_AWS_SIGNING_HELPER_FILE is required}:/usr/local/bin/aws_signing_helper:ro
      # OMN-15743: the cloud broker endpoint is resolved from the node
      # contract's cloud_broker_ref at the effect boundary (see
      # gateway_forwarder._materialize_cloud_broker_ref), not hardcoded into
      # this compose file. This map is an operator-supplied artifact --
      # today it carries the bastion-IP-derived FQDN mapping; once the
      # OMN-15739 §6.2 Route53 private-hosted-zone migration lands, this
      # same ref resolves to a plain DNS-resolvable bootstrap_servers value
      # and no per-host IP override is needed at all. No broker
      # address/IP is committed to this repo.
      - ${GATEWAY_BROKER_REF_MAP_FILE:?GATEWAY_BROKER_REF_MAP_FILE is required}:/run/gateway/broker-ref-map.yaml:ro
    devices:
      # The wrapped private key is usable only through the .201 TPM. The raw
      # signing key never exists in a host file or inside the container.
      - ${GATEWAY_TPM_DEVICE:?GATEWAY_TPM_DEVICE is required}:/dev/tpmrm0
    networks:
      - gateway-runtime
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # OMN-15741 (G1): path-verifying probe, not a sentinel-file check. Dials
      # both broker legs directly with the same transport/credentials as real
      # traffic and produces+reads-back a dedicated canary record; exits
      # non-zero when either leg's path is dead even though the process is
      # still up and `test -f` would have reported healthy (the exact failure
      # mode of the 2026-08-04 outage -- ready-file present, forwarding 0%
      # for 4 days). Real checks are cadence-bound (contract
      # `gateway_forwarder.canary.cadence_seconds`, default 30s) via
      # --state-file so this does not hit the brokers on every 15s tick.
      # --broker-ref-map (OMN-15743): the probe resolves cloud_bus.bootstrap_servers
      # the same fail-closed way the main process does, from the operator-supplied
      # map already mounted at /run/gateway/broker-ref-map.yaml above -- it does not
      # re-derive or hardcode a broker endpoint of its own.
      test: ["CMD", "onex-gateway-canary-probe", "--config", "/app/config/gateway-forwarder.yaml", "--state-file", "/tmp/gateway-canary-probe-state.json", "--broker-ref-map", "/run/gateway/broker-ref-map.yaml"]
      interval: 15s
      timeout: 25s
      retries: 4
      start_period: 90s
    labels:
      - "com.omninode.service=gateway-forwarder"
      - "com.omninode.layer=gateway"
      - "com.omninode.ticket=OMN-12912"
networks:
  gateway-runtime:
    external: true
    name: omnibase-infra-network
volumes:
  gateway-delivery-state:
    name: omninode-gateway-delivery-state
