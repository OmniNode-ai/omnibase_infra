      - /mnt/h051-nvme/runners/hp051-omnibase-ci-runner/1/cache/pre-commit:${RUNNER_USER_HOME:-/home/runner}/.cache/pre-commit
      - /mnt/h051-nvme/runners/hp051-omnibase-ci-runner/1/cache/pnpm:${RUNNER_USER_HOME:-/home/runner}/.cache/pnpm
