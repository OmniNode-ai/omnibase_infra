#
# OMN-25674 -- the general `omnibase-ci` pool on h051, the HP ProLiant DL560 Gen8 (80 threads, 377 GiB, NO AVX2).
#
# WHY IT EXISTS. Operator ruling 2026-11-19: CI runners leave the second amd64 host for the HP hosts. Measured on the second amd64 host the same day
# (2026-11-19T17:04Z, 16 runners busy at once): the pool's omnirunners.slice sat at its 20 GiB MemoryHigh (memory.current
# 21.45 GB against 21.47 GB, `high` events 545,431,572, `max` events 67,938), memory pressure `full` avg10 94.8 percent,
# host load 135, system CPU 92 percent, and the main `ci` jobs of two repositories hit their 10 minute step limit
# there while the same work finishes elsewhere. The cause is aggregate memory, not core speed: a fixed single-thread
# benchmark ran in 0.11 s on the second amd64 host (Ryzen 9 9950X), 0.42 s here and 0.37 s on h053. This pool is sized from the measured
# headroom of this host instead (below).
#
# THE LABEL. RUNNER_LABELS are the other amd64 general pools': `omnibase-ci` plus the opt-in `omnibase-ci-multiarch`
# (config/runner_fleet.yaml, classes `action` and `action-multiarch`), so every workflow label keeps resolving. The
# pool deliberately drops the sibling pool's `hp-canary` pin. THIS CPU HAS NO AVX2: a job that imports an AVX2 wheel
# died here with SIGILL (exit 132 on the `pedalboard` import, measured 2026-10-29), and the one repository whose unit suite
# does that is the one the host table lists under `unit_needs` with `needs: [avx2]`. That repository's job must ask for
# `omnibase-ci-avx2`, the label of the h053 pool declared beside this one (docker-compose.runners-hp053-avx2-ci-runner.yml),
# BEFORE this pool is registered; until its workflow names that label it can still be assigned here and die.
#
# SIZE, MEASURED. 16 runners (2.0 CPUs and 6 GiB each, memswap 12 GiB). On 2026-11-19T17:15Z this host showed load 14 to 20
# on 80 threads, 284 GiB available, memory pressure 0, and the shared omnirunners.slice (four hp051-ci-runner and four
# merge-queue runners) at memory.current 29.5 GB with a peak of 50.1 GB and no `high` or `max` event. The the second amd64 host pool measured
# about 2.1 GiB resident per busy job; 16 more jobs at a 3 GiB budget add 48 GiB to the 50.1 GiB peak, which is under the
# shared slice's new MemoryHigh of 128G. At most 16 times 2.0 = 32 of the 80 threads, and the 2026-10-11 measurement in
# config/runner_fleet.yaml (0 of 193 shards cancelled at under 20 busy jobs per 32 cores) puts 80 threads at about 50 busy
# jobs, of which this pool and the two others take 24 at most.
#
# DIRECTORIES. The job workspace, TMPDIR and the tool caches are bind mounts under /mnt/h051-nvme/runners/hp051-omnibase-ci-runner/<N>/ on the NVMe
# (/mnt/h051-nvme, ext4, 758 GiB free), not tmpfs and not the root volume, so a job's size is bounded by the disk and
# not charged to the runner's memory. The runner entrypoint chowns the work and cache directories at their top level; the
# TMPDIR directory is created owned by the runner user with mode 1777 by the declared installer's preparation effect
# (node_deploy_runners), which discovers it from this file.
#
# DEPLOYING. From a machine with ssh to the host (ssh alias h051) and org-admin gh:
#   scripts/deploy-runners.sh --host=h051 --pool=hp051-omnibase-ci-runner [--limit=N]
# It installs and reads back the pool's omnirunners.slice (the host's aggregate limits, shared with the two other h051
# pools through the same unit name), then brings up hp051-omnibase-ci-runner-1..N additively (a runner already online is not touched).
# OMN-18829: the same host-owned declaration is read by native jobs and CI.
# Refuse container creation when it is absent; never create an empty directory.
x-lab-host-table: &lab-host-table
  type: bind
  source: ${RUNNER_LAB_HOST_TABLE:?RUNNER_LAB_HOST_TABLE must name the host's lab host table file (runner host docker/.env)}
  target: /etc/onex/lab_run_hosts.yaml
  read_only: true
  bind:
    create_host_path: false
# Long-form bind mounts keep variable defaults out of Compose's short-volume parser.
# This also lets `compose config --no-interpolate` validate the shipped declaration.
x-runner-disk-admission-pause: &runner-disk-admission-pause
  type: bind
  source: ${RUNNER_DISK_ADMISSION_PAUSE_HOST_DIR:-./state/disk-admission-pause}
  target: ${RUNNER_USER_HOME:-/home/runner}/.onex-disk-admission-pause
  bind:
    create_host_path: true
x-runner-lab-credentials: &runner-lab-credentials
  type: bind
  source: ${RUNNER_LAB_CREDENTIALS_HOST_DIR:-~/.omnibase/runners/lab-credentials}
  target: ${RUNNER_USER_HOME:-/home/runner}/.lab-credentials
  read_only: true
  bind:
    create_host_path: true
x-runner-base: &runner-base
  image: omninode-runner:latest
  restart: unless-stopped
  mem_limit: 6g
  # This is a per-container upper bound (RAM plus swap). The parent slice's 2G swap cap is shared by every runner in it,
  # so aggregate swap can never reach the sum of this allowance. The slice's 128G/144G parent RAM bounds are the host's
  # aggregate for all three h051 pools (see the header); the sixteen runner containers themselves total at most 96G.
  memswap_limit: 12g
  cpus: "2.0"
  pids_limit: 4096
  cgroup_parent: omnirunners.slice
  environment: &runner-env
    # OMN-18829: the host row, not the container install identity, owns lab delegations.
    ONEX_LANE_HOST: h051
    ONEX_LAB_RUN_HOSTS: /etc/onex/lab_run_hosts.yaml
    RUNNER_LABELS: self-hosted,omnibase-ci,omnibase-ci-multiarch,linux,x64,arch-amd64
    GITHUB_ORG_URL: ${GITHUB_ORG_URL:?GITHUB_ORG_URL must be set (runner host docker/.env)}
    KUBECONFIG: ${RUNNER_USER_HOME:-/home/runner}/.lab-credentials/lab-ci-reader.kubeconfig
    LOCAL_LLM_SHARED_SECRET: ${LOCAL_LLM_SHARED_SECRET:?LOCAL_LLM_SHARED_SECRET must be set for the omnibase-ci fleet (runner host docker/.env, mode 600) - see scripts/deploy-runners.sh CONSOLIDATED REQUIRED ENV VARS}
    LLM_ENDPOINT_CIDR_ALLOWLIST: ${LLM_ENDPOINT_CIDR_ALLOWLIST:?LLM_ENDPOINT_CIDR_ALLOWLIST must be set for the omnibase-ci fleet (runner host docker/.env) - the LLM transport refuses to default its own trust boundary}
    RUNNER_TOKEN: ${RUNNER_TOKEN}
    RUNNER_GROUP: omnibase-ci
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /opt/onex-runner-hooks/runner-job-started.sh
    UV_CONCURRENT_DOWNLOADS: "1"
    UV_CONCURRENT_BUILDS: "1"
    UV_CONCURRENT_INSTALLS: "1"
    UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:?UV_HTTP_TIMEOUT must be set (runner host docker/.env)}
    # OMN-19998: the uv cache lives INSIDE the job-workspace mount (the per-runner _work directory),
    # so uv hardlinks wheel contents into a venv instead of copying them. See the header.
    UV_CACHE_DIR: ${RUNNER_USER_HOME:-/home/runner}/actions-runner/_work/.uv-cache
    TMPDIR: ${RUNNER_USER_HOME:-/home/runner}/tmp
    # OMN-24299: the runner reads this cache first and downloads an action
    # archive from GitHub only when it is absent here (fail-open).
    ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE: /opt/onex-action-archives
    # OMN-19998: the image's baked Actions tool cache (CPython preloaded), on a named volume per runner
    # so it is filled from the image on first start and survives a recreate. Same path as the Dockerfile's OMNI_TOOLCACHE_DIR.
    AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./runners:/opt/onex-runner-hooks:ro
    - *runner-disk-admission-pause
    - *runner-lab-credentials
    - *lab-host-table
    - /data/scratch/action-archives:/opt/onex-action-archives:ro
  group_add:
    - "988" # h051 docker group GID (getent group docker on the host, read 2026-10-29)
  healthcheck:
    test: ["CMD-SHELL", "/opt/onex-runner-hooks/healthcheck.sh"]
    interval: 30s
    timeout: 12s
    retries: 3
    start_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  hp051-omnibase-ci-runner-1:
    !!merge <<: *runner-base
    container_name: hp051-omnibase-ci-runner-1
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp051-omnibase-ci-runner-1
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
