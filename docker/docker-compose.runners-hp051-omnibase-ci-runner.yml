      - /mnt/h051-nvme/runners/hp051-omnibase-ci-runner/1/cache/ci-envs:${RUNNER_USER_HOME:-/home/runner}/.cache/omni/ci-envs
      - /mnt/h051-nvme/runners/hp051-omnibase-ci-runner/1/cache/npm:${RUNNER_USER_HOME:-/home/runner}/.npm
      - /mnt/h051-nvme/runners/hp051-omnibase-ci-runner/1/work:${RUNNER_USER_HOME:-/home/runner}/actions-runner/_work
      - /mnt/h051-nvme/runners/hp051-omnibase-ci-runner/1/tmp:${RUNNER_USER_HOME:-/home/runner}/tmp
