# OMN-21611: the h051 stability lane only, layered after the stability lane's base
# compose file. Any other lane of that profile does not layer this file and keeps
# the house-only secret resolver config, so it demands no store identity at boot.
#
# What it binds: the runtime that now carries the effects role resolves the
# shared GitHub, Linear, Gemini and Google keys by their path in the lab secret
# store (the rule in contracts/services/runtime_policy.contract.yaml, rendered
# as STABILITY_TEST_RUNTIME_MAIN_STORE_SECRET_RESOLVER_CONFIG_JSON), and reads
# the store as its own read-only identity. The identity names are the lane's
# (STABILITY_H051_RUNTIME_INFISICAL_*), resolved from the operator env file on
# the host, never from this file. `:-` as on the dev lane: a blank identity is
# refused at wiring time naming each blank variable, so a lane brought up
# without the identity fails loudly and does not run without the keys.
#
# The slug is pinned: its wrong answer is the dangerous one, and this lane
# reads environment dev only.
services:
  omninode-runtime:
    environment:
      ONEX_SECRET_RESOLVER_CONFIG_JSON: ${STABILITY_TEST_RUNTIME_MAIN_STORE_SECRET_RESOLVER_CONFIG_JSON:?runtime policy contract must set STABILITY_TEST_RUNTIME_MAIN_STORE_SECRET_RESOLVER_CONFIG_JSON}
      INFISICAL_ADDR: ${STABILITY_H051_RUNTIME_INFISICAL_ADDR:-}
      INFISICAL_PROJECT_ID: ${STABILITY_H051_RUNTIME_INFISICAL_PROJECT_ID:-}
      INFISICAL_CLIENT_ID: ${STABILITY_H051_RUNTIME_INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${STABILITY_H051_RUNTIME_INFISICAL_CLIENT_SECRET:-}
      INFISICAL_ENVIRONMENT_SLUG: "dev"
