#
# OMN-16449: scoped MSK-bastion DNS override for the .201 gateway-forwarder
# container ONLY. This sidecar is on the same Docker network as
# gateway-forwarder but is referenced exclusively via that ONE service's
# compose `dns:` key (see docker-compose.gateway.yml) -- no other container on
# the shared network is repointed at it, and the host's own DNS/resolv.conf is
# untouched.
#
# Operator ruling (2026-08-24, via team-lead, verbatim): "the gateway on the
# cloud should be configurable to point at whatever env we want. we can use
# the forwarder to accelerate moving our work to the cloud, but it should be
# replaced with the https doors as soon as possible." This sidecar is the
# INTERIM BRIDGE that ruling authorizes -- not a permanent fixture. Sunset
# condition (tracked on OMN-15692 + the HTTPS-ingest replacement ticket): once
# the forwarder's direct-MSK leg is replaced by an HTTPS ingest call to the
# cloud gateway, delete this sidecar and its compose wiring, not just disable
# it.
#
# Why this exists at all: .201 is not in the MSK cluster's VPC, so the real
# broker hostnames resolve (correct public DNS) to unroutable private VPC IPs.
# A live SNI-passthrough bastion (see the address literal below) proxies
# TCP:9098 to the real brokers based on the TLS ClientHello SNI -- reachable
# only if DNS for these exact hostnames resolves to the bastion's IP instead
# of the real (unroutable) VPC IPs. OMN-15743 removed the previous mechanism
# for this (`extra_hosts:` in docker-compose.gateway.yml) and its own
# regression test forbids the bastion IP appearing in that file or in
# beta-gateway-canary.yaml -- this sidecar's own config file is the
# operator-supplied artifact that mapping is meant to live in instead.

# Do not read the container's own /etc/resolv.conf for upstream servers --
# forward everything non-overridden to Docker's embedded DNS explicitly
# instead, so behavior doesn't silently change if the base image's default
# resolv.conf ever does.
no-resolv
server=127.0.0.11

# Never answer from a local /etc/hosts inside this container -- only the
# static entries declared here.
no-hosts

# The 6 MSK broker hostnames (b-1..b-6), pinned to the live SNI-routing
# bastion. Same set OMN-15744 pinned before OMN-15743 removed it. The IP
# itself is NOT a literal in this tracked file -- `entrypoint.sh` substitutes
# it from the operator-supplied `GATEWAY_BASTION_IP` environment variable
# (same operator-artifact pattern as `GATEWAY_BROKER_REF_MAP_FILE` in
# ../../gateway.env, never committed to the repo) at container start, into a
# runtime-only copy of this file. This file keeps the placeholder so
# `OMN-15743`'s own repo-literal guard (which forbids the bastion IP
# appearing anywhere in the tracked compose/config files) has nothing to
# ever find here -- deliberately not even quoted in this comment.
address=/b-1.omninodedevmsk.7ozyd3.c14.kafka.us-east-1.amazonaws.com/__GATEWAY_BASTION_IP__
address=/b-2.omninodedevmsk.7ozyd3.c14.kafka.us-east-1.amazonaws.com/__GATEWAY_BASTION_IP__
address=/b-3.omninodedevmsk.7ozyd3.c14.kafka.us-east-1.amazonaws.com/__GATEWAY_BASTION_IP__
address=/b-4.omninodedevmsk.7ozyd3.c14.kafka.us-east-1.amazonaws.com/__GATEWAY_BASTION_IP__
address=/b-5.omninodedevmsk.7ozyd3.c14.kafka.us-east-1.amazonaws.com/__GATEWAY_BASTION_IP__
address=/b-6.omninodedevmsk.7ozyd3.c14.kafka.us-east-1.amazonaws.com/__GATEWAY_BASTION_IP__

# Foreground mode is passed via the entrypoint's --keep-in-foreground flag,
# not duplicated here. Log queries to stdout for `docker logs` visibility --
# this container answers a handful of queries/minute, query logging is not a
# volume concern.
log-queries
