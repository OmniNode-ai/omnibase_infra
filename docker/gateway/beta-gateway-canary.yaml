# Resolved materialization of node_bus_forwarder_effect/contract.yaml for the
# one approved staging canary tenant. No secret values belong in this file.
forwarder:
  tenant_identity:
    tenant_id: "79afa726-3852-464f-b7a4-d4b8b9c75ee7"
    tenant_slug: "beta-gateway-canary-79afa7263852"
    principal_id: "t-79afa7263852464fb7a4d4b8b9c75ee7"
  cloud_bus:
    broker_provider_id: "22222222-2222-2222-2222-222222222222"
    cloud_broker_ref: "gateway.cloud.kafka.broker"
    cloud_auth_ref: "gateway.cloud.kafka.msk_iam"
    acl_provisioner_ref: "gateway.cloud.kafka.authorization"
    msk_region_ref: "gateway.cloud.kafka.msk_region"
    security_protocol: "SASL_SSL"
    sasl_mechanism: "AWS_MSK_IAM"
  local_transport_flavor: "containerized"
  mirror_topic_set: "node_bus_forwarder_effect"
  canary_topic_set: "node_bus_forwarder_effect"
  # OMN-17034: names the contract's lane_mirror block (source lane, mirror
  # lane set, topic set). The per-lane broker addresses are below, not here --
  # this file may not redeclare the block itself; the loader rejects that.
  lane_mirror_set: "node_bus_forwarder_effect"
  heartbeat_interval_seconds: 15
  max_silence_window_seconds: 60
  lag_threshold_messages: 500
  lag_threshold_seconds: 120
  drain_deadline_seconds: 30
  dedupe_store_path: "/app/data/gateway/delivery.sqlite3"
  dedupe_retention_hours: 24
  forward_retry_initial_seconds: 1
  forward_retry_max_seconds: 30
local_bus:
  bootstrap_servers: "redpanda:9092"
  environment: "beta-gateway-local"
  timeout_seconds: 30
  # OMN-15781: "latest" silently drops any backlog produced while the
  # consumer group was unjoined (crash/LeaveGroup/cold restart before
  # rejoin); enable_auto_commit=false alone does not protect against this
  # since it only preserves offsets already inside the read window. The
  # runtime-config model_validator (ModelGatewayForwarderRuntimeConfig)
  # fails closed on anything other than "earliest" on either leg.
  auto_offset_reset: "earliest"
  enable_auto_commit: false
  security_protocol: "PLAINTEXT"
cloud_bus:
  # bootstrap_servers is deliberately absent: OMN-15743 resolves it from the
  # node contract's gateway_forwarder.cloud_leg.cloud_broker_ref at the
  # effect boundary (gateway_forwarder._materialize_cloud_broker_ref), via
  # the operator-supplied broker-ref map mounted at
  # /run/gateway/broker-ref-map.yaml (GATEWAY_BROKER_REF_MAP_FILE). A
  # literal here is rejected fail-closed by the loader.
  environment: "beta-gateway-cloud"
  timeout_seconds: 60
  # OMN-15781: see local_bus.auto_offset_reset comment above -- same hazard,
  # both legs are pull-based at-least-once consumers.
  auto_offset_reset: "earliest"
  enable_auto_commit: false
  security_protocol: "SASL_SSL"
  sasl_mechanism: "AWS_MSK_IAM"
  msk_region: "us-east-1"
# ---------------------------------------------------------------------------
# OMN-17034 / OMN-17919: resolved broker legs for the contract-declared lane mirror.
# ---------------------------------------------------------------------------
# The contract NAMES lanes ("stability-test" -> ["dev"]); this is where THIS
# deployment says which broker each named lane is. Same authority split
# local_bus already uses.
#
# THE SOURCE LEG IS ADDRESSED ON THE STABILITY LANE'S *EXTERNAL* LISTENER, AND
# THAT IS THE WHOLE FIX (OMN-17919).
#
# A Kafka client does not keep talking to the endpoint it was configured with.
# It bootstraps there once, reads the cluster's ADVERTISED listener out of the
# metadata response, and every subsequent fetch / join / commit goes to that
# advertised address. Both lane brokers advertise their internal listener as
# the bare name `redpanda` -- each lane's compose file names the service
# `redpanda`, which also puts a `redpanda` network alias on both lane networks.
# This forwarder is joined to BOTH networks. Measured on .201 2026-09-05,
# read-only:
#
#   docker exec omninode-gateway-forwarder getent hosts redpanda -> 172.19.0.7
#   omnibase-infra-redpanda                aliases [omnibase-infra-redpanda, redpanda]
#   omnibase-infra-stability-test-redpanda aliases [omnibase-infra-stability-test-redpanda, redpanda]
#
# So the previous revision of this file -- which addressed BOTH legs by unique
# container name and said in this very comment that doing so removed the
# ambiguity -- bootstrapped correctly against stability (172.22.0.4), was handed
# `redpanda:9092` back, re-resolved it to 172.19.0.7, and ran the entire mirror
# against DEV. The consumer group came up Stable on dev with LAG 0 and Dead on
# stability, holding 1 partition where stability's topic has 6, and 0 records
# crossed. A unique container name fixes the BOOTSTRAP address; it cannot fix
# the ADVERTISED one, and aiokafka has no way to ignore an advertised listener.
#
# Redpanda advertises per-listener. A client that bootstraps on stability's
# external listener is handed the external advertised address, which this lane
# pins to a literal routable endpoint in its own compose contract
# (docker-compose.stability-test.yml, OMN-12832) -- a value that collides with
# nothing. Verified live before landing, read-only, no lane mutated:
#
#   docker exec omnibase-infra-redpanda rpk cluster metadata \
#     -X brokers=100.109.203.94:39092   -> BROKERS  ID 0*  HOST 100.109.203.94  PORT 39092
#   docker exec omninode-gateway-forwarder python3 -c 'socket.connect(...)'
#     -> CONNECT OK 100.109.203.94:39092
#
# This touches NOTHING on the stability lane: that advertised address is
# pre-existing committed lane-contract data, and the leg is a read.
#
# The DEV mirror target stays on its unique container name. It is the asymmetry
# the two lanes force: the dev lane interpolates its external advertised host
# from DEV_REDPANDA_ADVERTISE_HOST at deploy time (it currently renders a
# MagicDNS name), so there is no literal to pin, while its internal advertised
# `redpanda` re-resolves -- from this container -- to the dev broker, which is
# the correct destination. That leg is correct but relies on which network
# Docker answers the alias from; the durable fix is to stop both lanes sharing
# the name at all, recorded on OMN-17919 (needs a stability broker recreate).
lane_mirror_source_bus:
  bootstrap_servers: "100.109.203.94:39092" # onex-allow-kafka-broker
  environment: "beta-gateway-lane-mirror-source"
  timeout_seconds: 30
  # Same OMN-15781 hazard as both trust-boundary legs: "latest" would silently
  # drop every hook event produced while this consumer group was unjoined.
  # Load-bearing on this deploy specifically: the group has never committed an
  # offset on the stability broker (every commit it made went to dev), so
  # "earliest" is what makes the accumulated hook backlog cross.
  auto_offset_reset: "earliest"
  enable_auto_commit: false
  security_protocol: "PLAINTEXT"
lane_mirror_buses:
  dev:
    bootstrap_servers: "omnibase-infra-redpanda:9092" # onex-allow-kafka-broker
    environment: "beta-gateway-lane-mirror-dev"
    timeout_seconds: 30
    auto_offset_reset: "earliest"
    enable_auto_commit: false
    security_protocol: "PLAINTEXT"
