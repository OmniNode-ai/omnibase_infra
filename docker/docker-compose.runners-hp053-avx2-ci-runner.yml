      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/cache/pip:${RUNNER_USER_HOME:-/home/runner}/.cache/pip
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/cache/pre-commit:${RUNNER_USER_HOME:-/home/runner}/.cache/pre-commit
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/cache/pnpm:${RUNNER_USER_HOME:-/home/runner}/.cache/pnpm
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/cache/ms-playwright:${RUNNER_USER_HOME:-/home/runner}/.cache/ms-playwright
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/cache/ci-envs:${RUNNER_USER_HOME:-/home/runner}/.cache/omni/ci-envs
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/cache/npm:${RUNNER_USER_HOME:-/home/runner}/.npm
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/work:${RUNNER_USER_HOME:-/home/runner}/actions-runner/_work
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/2/tmp:${RUNNER_USER_HOME:-/home/runner}/tmp
      - hp053-avx2-ci-runner-2-creds:${RUNNER_USER_HOME:-/home/runner}/.runner-creds
