#
# OMN-25674 -- the `omnibase-ci-avx2` pool on h053, the HP ProLiant Gen9 (Xeon E5-2680 v4, 56 threads, 125 GiB, AVX2).
#
# WHY IT EXISTS. CI runners leave the second amd64 host for the HP hosts (operator ruling 2026-11-19), and h051, which takes the general
# `omnibase-ci` pool (docker-compose.runners-hp051-omnibase-ci-runner.yml), has no AVX2. A job that imports an AVX2
# wheel needs a runner that has it. The host table's `unit_needs` lists one repository whose unit suite does (its
# pedalboard 0.9.22 import dies with exit 132 on a CPU without AVX2, measured 2026-10-29); that job asks for the label
# below. h053 has avx and avx2 (/proc/cpuinfo, read 2026-11-02) and pedalboard imports and runs here (OMN-22111).
#
# THE LABEL. RUNNER_LABELS carry `omnibase-ci-avx2`, linux, x64 and arch-amd64, and NEVER `omnibase-ci` or
# `omnibase-ci-multiarch`: only a job that names the avx2 label can land here, so this pool adds no capacity claim to the
# general fleet (config/runner_fleet.yaml, class `action-avx2`, counted in no other class).
#
# SIZE, MEASURED 2026-11-19T17:15Z. h053 showed load 20 to 31 on 56 threads, 106 GiB available and memory pressure near 0,
# but its omnirunners.slice (five hp053-ci-runner and four merge-queue runners) had `max` events 2,029,063, a peak of
# 47.0 GB against a MemoryHigh of 45G, so the existing pools already run at that limit: this pool does not fit inside it.
# The slice unit is raised to MemoryHigh 64G and MemoryMax 68G (pool file below), which leaves at least 38 GiB of the
# 106 GiB available to the lab-work units. THREE runners at 8 GiB and 4 CPUs each, not more: the host has no CPU headroom to
# spare (load already near half its threads, with cores 3.4 times slower per thread than the second amd64 host), and one repository uses the
# label. Raise the count only after a queue age or a shard wait on this label is read.
#
# DIRECTORIES. The job workspace, TMPDIR and the tool caches are bind mounts under /mnt/h053-nvme/runners/hp053-avx2-ci-runner/<N>/ on the NVMe
# (/mnt/h053-nvme, 612 GiB free), not tmpfs: a job's size is bounded by the disk and not charged to the runner's memory,
# which is why 8 GiB is enough here where the tmpfs pool needs 9. The runner entrypoint chowns the work and cache directories
# at their top level; the TMPDIR directory is created by the declared installer's preparation effect (node_deploy_runners).
#
# DEPLOYING. From a machine with ssh to the host (ssh alias h053) and org-admin gh:
#   scripts/deploy-runners.sh --host=h053 --pool=hp053-avx2-ci-runner [--limit=N]
# OMN-18829: the same host-owned declaration is read by native jobs and CI.
# Two values the h051 file spells out are read from the host's docker/.env here, GITHUB_ORG_URL (the organisation URL
# the runners register against) and UV_HTTP_TIMEOUT (the h051 pool's value is 600 seconds), because the hardcoded-config
# ratchet refuses a new file that spells an organisation URL or an operational number.
# Container paths use ${RUNNER_USER_HOME:-<runner image home>}, as docker-compose.runners.yml does, so no
# machine path is spelled in this file (the local-path hook and the suppression ratchet both refuse one).
# Refuse container creation when it is absent; never create an empty directory.
x-runner-host-zoneinfo: &runner-host-zoneinfo
  type: bind
  source: /usr/share/zoneinfo
  target: /usr/share/zoneinfo
  read_only: true
  bind:
    create_host_path: false
x-lab-host-table: &lab-host-table
  type: bind
  source: ${RUNNER_LAB_HOST_TABLE:?RUNNER_LAB_HOST_TABLE must name the host's lab host table file (runner host docker/.env)}
  target: /etc/onex/lab_run_hosts.yaml
  read_only: true
  bind:
    create_host_path: false
# Long-form bind mounts keep variable defaults out of Compose's short-volume parser.
# This also lets `compose config --no-interpolate` validate the shipped declaration.
x-runner-disk-admission-pause: &runner-disk-admission-pause
  type: bind
  source: ${RUNNER_DISK_ADMISSION_PAUSE_HOST_DIR:-./state/disk-admission-pause}
  target: ${RUNNER_USER_HOME:-/home/runner}/.onex-disk-admission-pause
  bind:
    create_host_path: true
x-runner-lab-credentials: &runner-lab-credentials
  type: bind
  source: ${RUNNER_LAB_CREDENTIALS_HOST_DIR:-~/.omnibase/runners/lab-credentials}
  target: ${RUNNER_USER_HOME:-/home/runner}/.lab-credentials
  read_only: true
  bind:
    create_host_path: true
x-runner-base: &runner-base
  image: omninode-runner:latest
  restart: unless-stopped
  mem_limit: 8g
  # RAM plus swap, and equal to mem_limit, so the runner has no swap. The three runners together are at most 24 GiB.
  memswap_limit: 8g
  # Four CPUs, not the 2.0 of the the second amd64 host pool: the Xeon E5-2680 v4 here ran a fixed single-thread benchmark in 0.37 s against
  # 0.11 s on the second amd64 host (measured 2026-11-19T17:15Z). Three runners at 4.0 take 12 of the 56 threads.
  cpus: "4.0"
  pids_limit: 4096
  cgroup_parent: omnirunners.slice
  environment: &runner-env
    # OMN-18829: the host row, not the container install identity, owns lab delegations.
    ONEX_LANE_HOST: h053
    ONEX_LAB_RUN_HOSTS: /etc/onex/lab_run_hosts.yaml
    RUNNER_LABELS: self-hosted,omnibase-ci-avx2,linux,x64,arch-amd64
    GITHUB_ORG_URL: ${GITHUB_ORG_URL:?GITHUB_ORG_URL must be set (runner host docker/.env)}
    KUBECONFIG: ${RUNNER_USER_HOME:-/home/runner}/.lab-credentials/lab-ci-reader.kubeconfig
    LOCAL_LLM_SHARED_SECRET: ${LOCAL_LLM_SHARED_SECRET:?LOCAL_LLM_SHARED_SECRET must be set for the omnibase-ci fleet (runner host docker/.env, mode 600) - see scripts/deploy-runners.sh CONSOLIDATED REQUIRED ENV VARS}
    LLM_ENDPOINT_CIDR_ALLOWLIST: ${LLM_ENDPOINT_CIDR_ALLOWLIST:?LLM_ENDPOINT_CIDR_ALLOWLIST must be set for the omnibase-ci fleet (runner host docker/.env) - the LLM transport refuses to default its own trust boundary}
    RUNNER_TOKEN: ${RUNNER_TOKEN}
    RUNNER_GROUP: omnibase-ci
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /opt/onex-runner-hooks/runner-job-started.sh
    UV_CONCURRENT_DOWNLOADS: "1"
    UV_CONCURRENT_BUILDS: "1"
    UV_CONCURRENT_INSTALLS: "1"
    UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:?UV_HTTP_TIMEOUT must be set (runner host docker/.env)}
    # OMN-19998: the uv cache lives INSIDE the job-workspace mount (the per-runner _work directory),
    # so uv hardlinks wheel contents into a venv instead of copying them. See the header.
    UV_CACHE_DIR: ${RUNNER_USER_HOME:-/home/runner}/actions-runner/_work/.uv-cache
    TMPDIR: ${RUNNER_USER_HOME:-/home/runner}/tmp
    # OMN-24299: the runner reads this cache first and downloads an action
    # archive from GitHub only when it is absent here. Every service mounts
    # this host's cache directory at that path read-only (OMN-24299).
    ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE: /opt/onex-action-archives
    # OMN-19998: the image's baked Actions tool cache (CPython preloaded), on a named volume per runner
    # so it is filled from the image on first start and survives a recreate. Same path as the Dockerfile's OMNI_TOOLCACHE_DIR.
    AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./runners:/opt/onex-runner-hooks:ro
    - *runner-disk-admission-pause
    - *runner-lab-credentials
    - *lab-host-table
    # OMN-24299: pre-fetched action archives, filled by deploy-runners.sh on
    # the deploy host and read from /var/lib/onex/action-archives here. The
    # mount is read-only and nothing on this host writes to it: the job
    # directories above stay in memory, per the operator ruling in the header.
    - /var/lib/onex/action-archives:/opt/onex-action-archives:ro
  group_add:
    - "988" # h053 docker group GID (getent group docker on the host, read 2026-11-02)
  healthcheck:
    test: ["CMD-SHELL", "/opt/onex-runner-hooks/healthcheck.sh"]
    interval: 30s
    timeout: 12s
    retries: 3
    start_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  hp053-avx2-ci-runner-1:
    !!merge <<: *runner-base
    container_name: hp053-avx2-ci-runner-1
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp053-avx2-ci-runner-1
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - /var/lib/onex/action-archives:/opt/onex-action-archives:ro
      - *runner-host-zoneinfo
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/cache/pip:${RUNNER_USER_HOME:-/home/runner}/.cache/pip
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/cache/pre-commit:${RUNNER_USER_HOME:-/home/runner}/.cache/pre-commit
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/cache/pnpm:${RUNNER_USER_HOME:-/home/runner}/.cache/pnpm
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/cache/ms-playwright:${RUNNER_USER_HOME:-/home/runner}/.cache/ms-playwright
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/cache/ci-envs:${RUNNER_USER_HOME:-/home/runner}/.cache/omni/ci-envs
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/cache/npm:${RUNNER_USER_HOME:-/home/runner}/.npm
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/work:${RUNNER_USER_HOME:-/home/runner}/actions-runner/_work
      - /mnt/h053-nvme/runners/hp053-avx2-ci-runner/1/tmp:${RUNNER_USER_HOME:-/home/runner}/tmp
      - hp053-avx2-ci-runner-1-creds:${RUNNER_USER_HOME:-/home/runner}/.runner-creds
      - hp053-avx2-ci-runner-1-toolcache:/opt/hostedtoolcache
