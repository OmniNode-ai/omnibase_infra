# docker-compose.dev-lane.yml
# OMN-15379 — dev/lab lane overlay. Operator ruling 15 (2026-07-29).
#
# WHAT THIS IS FOR
# ----------------
# Everything the DEV/LAB LANE gets and no other lane may inherit. Three things
# as of OMN-17448, each with its own block below and each here for the same
# fail-closed reason:
#
#   1. OMN-15379 — the migration lane indicator (this block).
#   2. OMN-15363 — the lab-lane analytics connection identity (role_omnidash).
#   3. OMN-17448 — the standalone projection writer services.
#
# The header used to say "it carries exactly ONE thing". That stopped being
# true at (2) and is corrected here rather than left to mislead the next reader
# into thinking a second entry is a mistake.
#
# (1) The lane indicator that lets the compose
# forward-migration runner apply the node_projection_registration trio
# (0000 CREATE / 0001 heartbeat columns / 0002 ENABLE + FORCE ROW LEVEL
# SECURITY) on the lab lane, which operator ruling 15 designates as the FORCE
# proving ground. Every other fenced node migration stays fenced here too — the
# delegation 0023-0026 tenant-RLS hold is a different, still-pending ruling.
#
# WHY IT IS A SEPARATE FILE AND NOT A LINE IN docker-compose.infra.yml
# --------------------------------------------------------------------
# This is the whole fail-closed mechanism, so it is worth being explicit.
#
# docker-compose.infra.yml is the BASE that every lane merges: stability-test,
# prod and judge each layer their overlay ON TOP of it and override only what
# they need (stability-test's forward-migration override is a single
# `container_name:` line — it inherits the base `environment:` block wholesale).
# So `ONEX_MIGRATION_LANE: dev` written into the base would be INHERITED by
# stability-test, by prod, by judge, and — the part that matters — by any lane
# added in future by someone who has never heard of this fence. That is
# fail-OPEN, and silently so.
#
# Inverting it makes the default safe: the base says nothing, the runner treats
# "nothing" as the FULL fence, and the dev lane opts in by loading this file.
# A lane that does not load it (stability-test, prod, judge, CI, a raw
# `docker compose -f docker/docker-compose.infra.yml up` against a fresh volume,
# and every future lane) is fully fenced without having to know this file
# exists.
#
# WHO LOADS IT
# ------------
# The dev lane's `-f` list, in the two places that own lane -> compose-file
# mapping and are kept matched:
#   * scripts/deploy-runtime.sh          resolve_compose_file_args()
#   * scripts/deploy-agent/deploy_agent/executor.py  _LANE_CONFIGS[DEV]
# Manually:
#   docker compose -p omnibase-infra \
#     -f docker/docker-compose.infra.yml \
#     -f docker/docker-compose.dev-lane.yml \
#     --profile runtime up -d
#
# Deliberately NO `name:` key: the project comes from `-p omnibase-infra` (or
# from the base file), and pinning it here would make this overlay unusable in
# any context that names the project itself.
#
# Ticket: OMN-15379 (cold compose lane blocked by the registration trio)
# Ruling: operator ruling 15, 2026-07-29 — FORCE on node_service_registry is
#         lab-lane-only; the omninode_infra k8s fence is unchanged at 7 ids.
# =============================================================================
# (2) LAB-LANE ANALYTICS CONNECTION IDENTITY (OMN-15363)
# =============================================================================
# WHAT THIS IS FOR
# ----------------
# The base file gives every runtime service the same analytics DSN:
#
#   docker-compose.infra.yml:
#     OMNIDASH_ANALYTICS_DB_URL:
#       "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/omnidash_analytics"
#
# `postgres` is the table OWNER and carries `rolsuper`+`rolbypassrls`. Postgres
# exempts owners and BYPASSRLS roles from row-level security UNCONDITIONALLY —
# FORCE included. So while this lane connects as `postgres`, the FORCE ROW LEVEL
# SECURITY that operator ruling 15 designates this lane to prove is INERT against
# every connection the database actually sees, and any "no RLS errors" reading
# taken here is a false clean rather than evidence.
#
# Live readback that established this, .201 lab lane, 2026-07-31T03:33Z: 400
# consecutive pg_stat_activity samples on `omnidash_analytics` returned exactly
# one client — `postgres`, from the projection-api container. There was no
# non-exempt connection to enforce anything against.
#
# These overrides connect the lane's analytics consumers as `role_omnidash`
# instead: non-owner, NOSUPERUSER, NOBYPASSRLS. Authorization for that role is
# provisioned by docker/migrations/forward/096_grant_role_omnidash_omnidash_analytics.sql;
# its LOGIN + password stay deployment-owned (ROLE_OMNIDASH_PASSWORD, consumed by
# docker/migrations/forward/000_create_multiple_databases.sh — no credential
# material lives in a migration).
#
# WHY THE ROLE IS SPELLED OUT PER SERVICE INSTEAD OF PARAMETERISED IN THE BASE
# ---------------------------------------------------------------------------
# Same fail-closed inversion the lane indicator above uses, and for the same
# reason. A `${OMNIDASH_ANALYTICS_DB_USER:-postgres}` seam in the base would be
# resolved from the HOST environment — and `.201` runs the lab, stability-test,
# judge and prod lanes from one `~/.omnibase/.env`, so setting that variable
# would repoint every lane's analytics connection at the next recreate. Writing
# the identity here, in the file only the dev/lab project loads, makes leaking it
# to another lane structurally impossible rather than merely unlikely.
#
# It is also the readable form: an operator reading this deploy config sees WHICH
# ROLE CONNECTS, not a variable name that has to be resolved against a host env
# file to find out.
#
# `:?` and not `:-`: an unset ROLE_OMNIDASH_PASSWORD must fail at compose render,
# not silently fall back to a DSN with an empty password (or, worse, to the
# superuser). This lane is the proving ground; a silent fallback here is the
# false-clean this whole block exists to remove.
#
# SCOPE
# -----
# Every service in the base file that merges the `x-runtime-env` anchor, i.e.
# every service that carries OMNIDASH_ANALYTICS_DB_URL at all. Overriding only
# the one service observed connecting today would leave the other four able to
# open a BYPASSRLS session against the same tables the moment their dispatch path
# changes — a partial cutover proves nothing.
#
# Ticket: OMN-15363. Gate this enables: OMN-15416 (prove FORCE-RLS with real
# non-owner pools). Unchanged by this block: no FORCE/RLS state on any table, no
# migration fence, no other lane.
# YAML anchors do NOT cross compose files, so the writer services below cannot
# reference the base file's `x-logging-defaults`. Same values, declared locally.
x-dev-lane-logging: &dev_lane_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-dev-lane-analytics-env: &dev_lane_analytics_env
  OMNIDASH_ANALYTICS_DB_URL: "postgresql://role_omnidash:${ROLE_OMNIDASH_PASSWORD:?ROLE_OMNIDASH_PASSWORD must be set — the lab lane connects to omnidash_analytics as the non-BYPASSRLS role_omnidash (OMN-15363), never as the postgres superuser}@postgres:5432/omnidash_analytics"
# =============================================================================
# STRICT AUTO-WIRING (OMN-17531)
# =============================================================================
# `ONEX_WIRING_STRICT_MODE` is `${ONEX_WIRING_STRICT_MODE:-0}` in
# docker-compose.infra.yml, and until OMN-17531 NO lane overlay bound it. At `0`
# a handler the resolver cannot construct is quarantined and the runtime still
# reports healthy; at `1` it re-raises and kills boot. onex-dev (staging) binds
# `"1"` on all three runtime Deployments, so every lab lane was running the
# weaker of the two semantics and could not reproduce a staging boot failure.
#
# Three defects of exactly one class reached staging before anyone saw them for
# that reason -- OMN-15623, OMN-17502, OMN-17510 -- each then diagnosed from pod
# logs over an SSM port-forward, serialized on the one staging cluster.
#
# Literal `"1"`, NOT `${ONEX_WIRING_STRICT_MODE:-1}`: same reason as
# BIFROST_CONTRACT_PATH (OMN-12864). An interpolated form lets an operator who
# exported the variable in their shell silently return this lane to the
# quarantining semantics, which is the failure mode this binding exists to
# remove. Downgrading the flag, allowlisting a contract or widening a
# quarantine branch to make a lane green is explicitly forbidden by
# OMN-17531 AC-4 -- a lane that fails here has found a real defect and the
# failure is filed as its own ticket.
#
# WHY THE LANE OVERLAY AND NOT THE BASE
# -------------------------------------
# The base file's `:-0` stays as it is. prod and judge merge that base and are
# out of OMN-17531's scope (judge is declared read-only, prod is not touched),
# so flipping the base default would silently move two lanes this ticket has no
# mandate over. Each in-scope lane opts in explicitly, here.
#
# Bound on the runtime services only (main/effects/worker), mirroring onex-dev.
# projection-api and omninode-contract-resolver are uvicorn servers that never
# run the auto-wiring kernel, so the flag would be inert there.
x-dev-lane-strict-wiring-env: &dev_lane_strict_wiring_env
  ONEX_WIRING_STRICT_MODE: "1"
services:
  forward-migration:
    environment:
      # Consumed by scripts/run-forward-migrations.sh. `dev` is the only value
      # that releases anything; unset/unknown = full fence. The release SET is
      # committed in the runner, not supplied here — this names a policy, it
      # does not carry migration ids.
      ONEX_MIGRATION_LANE: dev
    labels:
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-15379"
  omninode-runtime:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_strict_wiring_env]
  runtime-effects:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_strict_wiring_env]
  projection-api:
    environment:
      !!merge <<: *dev_lane_analytics_env
  runtime-worker:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_strict_wiring_env]
  omninode-contract-resolver:
    environment:
      !!merge <<: *dev_lane_analytics_env
  # ===========================================================================
  # STANDALONE PROJECTION WRITERS (OMN-17448)
  # ===========================================================================
  # WHAT THESE ARE FOR
  # ------------------
  # A handler with the standalone-runner shape (its own `run()` consume loop,
  # its own `project_event`, its own topic set, its own DB adapter) is
  # deliberately NOT dispatched by the shared kernel. `handler_wiring.py`'s
  # auto-wired projection callback opens with:
  #
  #     if is_projection_runner:
  #         logger.debug("Projection runner skipped by DB-injection auto-wiring: ...")
  #         return None
  #
  # That skip is correct and load-bearing (OMN-15905 / OMN-16874): the runtime
  # cannot scope the lifetime of a pool it did not create, and a runner
  # dispatched in-process died `Event loop is closed` on every message. The
  # sanctioned way to run such a handler for real is a DEDICATED PROCESS
  # outside the kernel.
  #
  # WHAT WAS BROKEN
  # ---------------
  # The kernel still SUBSCRIBES these contracts' topics. So the consumer joins,
  # takes every message, and commits every offset while the callback returns
  # None before any handler runs: consume -> ack -> nothing written -> no DLQ
  # record -> no terminal event -> no ERROR log. Silent by construction, and
  # invisible to both OMN-16994 liveness masks (the topic IS attached, and
  # nothing raises so nothing is DLQ'd).
  #
  # OMN-15905 fixed this for onex-dev k8s by adding dedicated writer
  # Deployments under `omninode_infra/k8s/onex-dev/runtime/`. Nothing ever
  # mirrored that onto compose. Measured on the .201 dev lane 2026-09-01, after
  # the OMN-17374 lane-apply deploy: a well-formed TENANT_CREATED published to
  # `onex.tenant.events` (offset 37) moved the consumer group to LAG 0 and left
  # `tenant_registry_mirror` at 0 rows, the malformed-DLQ topic at HWM 0, and
  # zero log lines for that correlation id in any of the four runtime
  # containers. `node_projection_tenant_registry` additionally had no writer on
  # ANY lane -- it is absent from the onex-dev Deployment set too, which is why
  # its mirror was empty on both .201 and staging.
  #
  # WHY THIS FILE AND NOT docker-compose.infra.yml
  # ----------------------------------------------
  # Same fail-closed reasoning as the migration-lane indicator at the top of
  # this file, and it is the whole reason these services live here. The base
  # file is merged by EVERY lane: stability-test, prod and judge each layer
  # their own overlay on top of it. A service written into the base would be
  # inherited by all of them and by any lane added later. Only the dev lane
  # loads this file (`resolve_compose_file_args()` falls through to it for the
  # bare `omnibase-infra` project), so declaring the writers here changes the
  # dev lane and provably nothing else. Parity for the other lanes is separate,
  # deliberate work with its own approval -- not a side effect of this file.
  #
  # SCOPE, STATED HONESTLY
  # ----------------------
  # These two were the beta-critical pair -- the ones OMN-17298 AC3,
  # OMN-17374 AC3 and OMN-16804 AC5 were blocked behind. OMN-17562 landed the
  # remaining four of the ADOPT set in the block further down this file, by
  # copying this pattern verbatim; onex-dev runs six standalone writers
  # (delegation, live-events, registration, savings, tenant-credentials,
  # tenant-registry) and this lane now mirrors all six.
  #
  # NO ANCHOR REUSE
  # ---------------
  # `x-runtime-base` / `x-runtime-env` live in the base file and YAML anchors
  # do not cross compose files, so these two services spell out their own
  # config. They are deliberately MINIMAL: a BaseProjectionRunner subclass is a
  # bare Kafka consumer with a DB pool. It has no HTTP surface beyond its own
  # readiness server, no Bifrost rendering, no delegation routing, no contract
  # discovery, and no secret resolver -- so none of the runtime kernel's env is
  # wired here, and adding it would only create failure modes these processes
  # cannot have.
  #
  # DATABASE IDENTITY (see OMN-17448's grant-binding finding)
  # --------------------------------------------------------
  # `BaseProjectionRunner` resolves its own DSN through
  # `ModelProjectionRuntimeBinding.from_legacy_settings()`, which prefers
  # `OMNIDASH_ANALYTICS_DB_URL`. It is never handed the topology-resolved
  # binding: `bind_projection_database_url()` is called only on the in-process
  # dispatch path, and by construction the runtime does not dispatch these.
  # So a standalone writer connects as `role_omnidash` on this lane -- NOT as
  # `omninode_runtime`, which is the principal the topology declares for these
  # relations' `omninode_internal` domain and the one OMN-17374's migration
  # granted. Both writes land anyway, but by a DIFFERENT mechanism: flat
  # migration `096_grant_role_omnidash_omnidash_analytics.sql` issues
  # `GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO
  # role_omnidash`, which covers every relation in this schema including ones
  # added later. That blanket grant is what these writers actually rest on, and
  # `scripts/validation/check_topology_grant_delivery.py` cannot see it (it
  # matches named-relation GRANT statements, never `ON ALL TABLES`). Recorded
  # rather than silently relied on; the "should a standalone writer resolve the
  # topology binding" question is OMN-16911's residual, not this file's.
  #
  # Ticket: OMN-17448. Pattern source:
  #   omninode_infra/k8s/onex-dev/runtime/deployment-omnimarket-projection-*-writer.yaml
  projection-tenant-registry-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omnimarket-projection-tenant-registry-writer
    profiles: ["runtime", "full"]
    networks:
      - omnibase-infra-network
    restart: unless-stopped
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # The `if __name__ == "__main__"` entrypoint on the handler module, exactly
    # as the onex-dev Deployment invokes it. Same class, same code path, same
    # image contents -- the only difference between the two lanes is the
    # orchestrator that starts the process.
    command:
      - python
      - -m
      - omnimarket.nodes.node_projection_tenant_registry.handlers.handler_tenant_registry_projection
    environment:
      !!merge <<: *dev_lane_analytics_env
      # KAFKA_BROKERS is the env `BaseProjectionRunner.kafka_bootstrap_servers`
      # reads first (runner.py KAFKA_BROKERS_ENV). Docker-internal hostname, as
      # every other runtime service on this lane uses.
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      # Its OWN consumer group, distinct from the shared kernel's subscription
      # to the same topic and from the sibling writer's. Two processes reading
      # the same topic under one group would split the partitions between a
      # writer and a no-op consumer, so half the tenants would silently never
      # land -- a worse failure than the one this service fixes, because it
      # would look like it worked. Canonical
      # {env}.{service}.{node}.{purpose}.{version} shape, read via
      # ModelProjectionRuntimeBinding.from_legacy_settings()'s
      # KAFKA_CONSUMER_GROUP fallback.
      KAFKA_CONSUMER_GROUP: "local.omnimarket-projections.tenant-registry-writer.consume.v1"
      # Opt-in readiness/liveness HTTP server
      # (BaseProjectionRunner.PROJECTION_RUNNER_HEALTH_PORT_ENV). Container-
      # internal only: the healthcheck below curls localhost, and publishing a
      # host port would put this service into the lane port map for no reader.
      PROJECTION_RUNNER_HEALTH_PORT: "8098"
      ONEX_LOG_LEVEL: ${ONEX_LOG_LEVEL:-INFO}
      ONEX_ENVIRONMENT: ${ONEX_ENVIRONMENT:-local}
      PYTHONUNBUFFERED: "1"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8098/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *dev_lane_logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "com.omninode.service=projection-tenant-registry-writer"
      - "com.omninode.layer=runtime"
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-17448"
      - "autoheal=true"
  projection-delegation-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omnimarket-projection-delegation-writer
    profiles: ["runtime", "full"]
    networks:
      - omnibase-infra-network
    restart: unless-stopped
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - omnimarket.nodes.node_projection_delegation.handlers.handler_delegation
    environment:
      !!merge <<: *dev_lane_analytics_env
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_CONSUMER_GROUP: "local.omnimarket-projections.delegation-writer.consume.v1"
      # 8098 is the tenant-registry writer's. Distinct ports keep two unrelated
      # processes distinguishable in logs and metrics, the same reason the five
      # onex-dev writers hold 8093-8097.
      PROJECTION_RUNNER_HEALTH_PORT: "8099"
      ONEX_LOG_LEVEL: ${ONEX_LOG_LEVEL:-INFO}
      ONEX_ENVIRONMENT: ${ONEX_ENVIRONMENT:-local}
      PYTHONUNBUFFERED: "1"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8099/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *dev_lane_logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "com.omninode.service=projection-delegation-writer"
      - "com.omninode.layer=runtime"
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-17448"
      - "autoheal=true"
  # ---------------------------------------------------------------------------
  # OMN-17562: the remaining four of the ADOPT set
  # ---------------------------------------------------------------------------
  # The block above landed two writers and said so honestly: "Two writers, not
  # five ... The remaining three follow the same pattern and are ticketed
  # separately; the pattern is this block, copied." This is that copy, plus
  # `projection_tenant_registry`'s sibling on the proof lane.
  #
  # WHY THESE FOUR AND NOT ALL SIXTEEN WRITER-OWNED CONTRACTS
  # --------------------------------------------------------
  # Membership is not a judgement call. These are exactly the contracts with a
  # checked-in writer Deployment under `omninode_infra` `k8s/onex-dev/runtime/`
  # on origin/dev -- a runner already proven to run as its own process. Two
  # other runner-shaped contracts (`projection_pattern_learning`,
  # `projection_routing_decision`) deliberately get NO writer here:
  # `omninode_infra#1147` removed their Deployments on 2026-09-02 as a
  # prohibited rollout direction, and their in-process sibling entry is the one
  # raising `ValueError: Projection handler requires topology bindings with
  # configured DSNs: tenant_projection:ONEX_TENANT_DB_URL` -- store-resolved
  # credential work (OMN-17557 / OMN-17556), not a missing container.
  #
  # Four more contracts (`node_projection_cost_by_repo`,
  # `node_projection_instruction_eval`, `node_projection_skill_executions`,
  # `projection_llm_cost`) were RULED OUT of the served set entirely: no writer
  # exists on any lane and nothing reads their tables, so the kernel stops
  # subscribing them (omnibase_infra#3156) rather than four processes being
  # deployed to write rows no reader reads.
  #
  # tests/ci/test_lane_projection_writer_coverage_omn17562.py holds both sets
  # frozen and fails if this file drifts from either.
  #
  # Ticket: OMN-17562. Pattern source: the two services above, unchanged.
  projection-registration-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omnimarket-projection-registration-writer
    profiles: ["runtime", "full"]
    networks:
      - omnibase-infra-network
    restart: unless-stopped
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - omnimarket.nodes.node_projection_registration.handlers.handler_registration
    environment:
      !!merge <<: *dev_lane_analytics_env
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_CONSUMER_GROUP: "local.omnimarket-projections.registration-writer.consume.v1"
      PROJECTION_RUNNER_HEALTH_PORT: "8100"
      ONEX_LOG_LEVEL: ${ONEX_LOG_LEVEL:-INFO}
      ONEX_ENVIRONMENT: ${ONEX_ENVIRONMENT:-local}
      PYTHONUNBUFFERED: "1"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *dev_lane_logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "com.omninode.service=projection-registration-writer"
      - "com.omninode.layer=runtime"
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-17562"
      - "autoheal=true"
  projection-savings-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omnimarket-projection-savings-writer
    profiles: ["runtime", "full"]
    networks:
      - omnibase-infra-network
    restart: unless-stopped
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - omnimarket.nodes.node_projection_savings.handlers.handler_savings
    environment:
      !!merge <<: *dev_lane_analytics_env
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_CONSUMER_GROUP: "local.omnimarket-projections.savings-writer.consume.v1"
      PROJECTION_RUNNER_HEALTH_PORT: "8101"
      ONEX_LOG_LEVEL: ${ONEX_LOG_LEVEL:-INFO}
      ONEX_ENVIRONMENT: ${ONEX_ENVIRONMENT:-local}
      PYTHONUNBUFFERED: "1"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8101/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *dev_lane_logging
    deploy:
