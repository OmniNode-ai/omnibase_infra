# docker-compose.dev-lane.yml
# OMN-15379 — dev/lab lane overlay. Operator ruling 15 (2026-07-29).
#
# WHAT THIS IS FOR
# ----------------
# Everything the DEV/LAB LANE gets and no other lane may inherit. Six things
# as of OMN-16025, each with its own block below and each here for the same
# fail-closed reason:
#
#   1. OMN-15379 — the migration lane indicator (this block).
#   2. OMN-15363 — the lab-lane analytics connection identity (role_omnidash).
#   3. OMN-17531 — the strict auto-wiring binding on the three kernel services.
#   4. OMN-17448 / OMN-17562 — the standalone projection writer services.
#   5. OMN-17562 — the strict semantic container probe on those same three
#      kernel services, with autoheal disarmed in the same block.
#   6. OMN-16025 — the infra routing-decision projection consumer, which was
#      declared in docker/catalog and in no compose file, so it ran on no lane.
#
# The header used to say "it carries exactly ONE thing". That stopped being
# true at (2) and is corrected here rather than left to mislead the next reader
# into thinking a second entry is a mistake. (3) was landed by OMN-17531 and was
# never added to this list; it is added here rather than left to be rediscovered.
#
# Requires Docker Compose v2.24.4 or later for the `!override` merge semantics
# entry (5) depends on.
#
# (1) The lane indicator that lets the compose
# forward-migration runner apply the node_projection_registration trio
# (0000 CREATE / 0001 heartbeat columns / 0002 ENABLE + FORCE ROW LEVEL
# SECURITY) on the lab lane, which operator ruling 15 designates as the FORCE
# proving ground. As of OMN-15683 (2026-09-08) the same indicator ALSO releases
# delegation 0034 — the operative uuid conversion — under the operator ruling
# that closed the delegation-path fence; delegation 0024 and 0025 left the
# baseline entirely in that change, so nothing releases them anywhere. Every
# OTHER fenced node migration stays fenced here too — delegation 0023 is a
# superseded id, 0026 is a measured write lockout for this lane's own writer,
# and 0031/0032/0033 are retired conversions; none of them is releasable on any
# lane.
#
# WHY IT IS A SEPARATE FILE AND NOT A LINE IN docker-compose.infra.yml
# --------------------------------------------------------------------
# This is the whole fail-closed mechanism, so it is worth being explicit.
#
# docker-compose.infra.yml is the BASE that every lane merges: stability-test,
# prod and judge each layer their overlay ON TOP of it and override only what
# they need (stability-test's forward-migration override is a single
# `container_name:` line — it inherits the base `environment:` block wholesale).
# So `ONEX_MIGRATION_LANE: dev` written into the base would be INHERITED by
# stability-test, by prod, by judge, and — the part that matters — by any lane
# added in future by someone who has never heard of this fence. That is
# fail-OPEN, and silently so.
#
# Inverting it makes the default safe: the base says nothing, the runner treats
# "nothing" as the FULL fence, and the dev lane opts in by loading this file.
# A lane that does not load it (stability-test, prod, judge, CI, a raw
# `docker compose -f docker/docker-compose.infra.yml up` against a fresh volume,
# and every future lane) is fully fenced without having to know this file
# exists.
#
# WHO LOADS IT
# ------------
# The dev lane's `-f` list, in the two places that own lane -> compose-file
# mapping and are kept matched:
#   * scripts/deploy-runtime.sh          resolve_compose_file_args()
#   * scripts/deploy-agent/deploy_agent/executor.py  _LANE_CONFIGS[DEV]
# Manually:
#   docker compose -p omnibase-infra \
#     -f docker/docker-compose.infra.yml \
#     -f docker/docker-compose.dev-lane.yml \
#     --profile runtime up -d
#
# Deliberately NO `name:` key: the project comes from `-p omnibase-infra` (or
# from the base file), and pinning it here would make this overlay unusable in
# any context that names the project itself.
#
# Ticket: OMN-15379 (cold compose lane blocked by the registration trio)
# Ruling: operator ruling 15, 2026-07-29 — FORCE on node_service_registry is
#         lab-lane-only; the omninode_infra k8s fence is unchanged at 7 ids.
# =============================================================================
# (2) LAB-LANE ANALYTICS CONNECTION IDENTITY (OMN-15363)
# =============================================================================
# WHAT THIS IS FOR
# ----------------
# The base file gives every runtime service the same analytics DSN:
#
#   docker-compose.infra.yml:
#     OMNIDASH_ANALYTICS_DB_URL:
#       "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/omnidash_analytics"
#
# `postgres` is the table OWNER and carries `rolsuper`+`rolbypassrls`. Postgres
# exempts owners and BYPASSRLS roles from row-level security UNCONDITIONALLY —
# FORCE included. So while this lane connects as `postgres`, the FORCE ROW LEVEL
# SECURITY that operator ruling 15 designates this lane to prove is INERT against
# every connection the database actually sees, and any "no RLS errors" reading
# taken here is a false clean rather than evidence.
#
# Live readback that established this, .201 lab lane, 2026-07-31T03:33Z: 400
# consecutive pg_stat_activity samples on `omnidash_analytics` returned exactly
# one client — `postgres`, from the projection-api container. There was no
# non-exempt connection to enforce anything against.
#
# These overrides connect the lane's analytics consumers as `role_omnidash`
# instead: non-owner, NOSUPERUSER, NOBYPASSRLS. Authorization for that role is
# provisioned by docker/migrations/forward/096_grant_role_omnidash_omnidash_analytics.sql;
# its LOGIN + password stay deployment-owned (ROLE_OMNIDASH_PASSWORD, consumed by
# docker/migrations/forward/000_create_multiple_databases.sh — no credential
# material lives in a migration).
#
# WHY THE ROLE IS SPELLED OUT PER SERVICE INSTEAD OF PARAMETERISED IN THE BASE
# ---------------------------------------------------------------------------
# Same fail-closed inversion the lane indicator above uses, and for the same
# reason. A `${OMNIDASH_ANALYTICS_DB_USER:-postgres}` seam in the base would be
# resolved from the HOST environment — and `.201` runs the lab, stability-test,
# judge and prod lanes from one `~/.omnibase/.env`, so setting that variable
# would repoint every lane's analytics connection at the next recreate. Writing
# the identity here, in the file only the dev/lab project loads, makes leaking it
# to another lane structurally impossible rather than merely unlikely.
#
# It is also the readable form: an operator reading this deploy config sees WHICH
# ROLE CONNECTS, not a variable name that has to be resolved against a host env
# file to find out.
#
# `:?` and not `:-`: an unset ROLE_OMNIDASH_PASSWORD must fail at compose render,
# not silently fall back to a DSN with an empty password (or, worse, to the
# superuser). This lane is the proving ground; a silent fallback here is the
# false-clean this whole block exists to remove.
#
# SCOPE
# -----
# Every service in the base file that merges the `x-runtime-env` anchor, i.e.
# every service that carries OMNIDASH_ANALYTICS_DB_URL at all. Overriding only
# the one service observed connecting today would leave the other four able to
# open a BYPASSRLS session against the same tables the moment their dispatch path
# changes — a partial cutover proves nothing.
#
# Ticket: OMN-15363. Gate this enables: OMN-15416 (prove FORCE-RLS with real
# non-owner pools). Unchanged by this block: no FORCE/RLS state on any table, no
# migration fence, no other lane.
# YAML anchors do NOT cross compose files, so the writer services below cannot
# reference the base file's `x-logging-defaults`. Same values, declared locally.
x-dev-lane-logging: &dev_lane_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-dev-lane-analytics-env: &dev_lane_analytics_env
  OMNIDASH_ANALYTICS_DB_URL: "postgresql://role_omnidash:${ROLE_OMNIDASH_PASSWORD:?ROLE_OMNIDASH_PASSWORD must be set — the lab lane connects to omnidash_analytics as the non-BYPASSRLS role_omnidash (OMN-15363), never as the postgres superuser}@postgres:5432/omnidash_analytics"
# =============================================================================
# THE INTERNAL-PROJECTION CONNECTION IDENTITY (OMN-18109)
# =============================================================================
# The anchor above is the ANALYTICS identity. It is the wrong one for a
# standalone projection writer whose contract declares its relations in the
# `omninode_internal` domain, and the .201 dev lane proved it continuously:
# `omnimarket-projection-live-events-writer` and
# `omnimarket-projection-registration-writer` logged
#
#     Failed to update watermark: permission denied for schema omninode_internal
#
# 411 and 191 times in the thirty minutes to 2026-09-10T00:56:40Z, unbroken
# since 2026-09-08T23:22:56Z. `role_omnidash` holds no grant of any kind inside
# `omninode_internal` — read live, names only:
#
#     omninode_internal : postgres=UC, omninode_runtime=U, jake_ro=U
#
# and `projection_watermarks` lives there. Every writer's watermark write is
# refused; those two are simply the two receiving traffic. What is lost is the
# replay cursor and the staleness signal every projection-health surface reads,
# while Kafka offsets keep advancing — so the projection looks permanently
# stale to anything trusting watermarks and fine to anything trusting offsets.
#
# `omninode_runtime` is the principal the topology declares for that domain
# (`_EXPECTED_BINDING_PRINCIPALS["omninode_runtime_service"]`), and
# `OMNINODE_INTERNAL_DB_URL` is the env it declares for it
# (`_EXPECTED_BINDING_DSN_ENVS["local"]`). Both are asserted against this file
# by tests/ci/test_standalone_writer_declared_principal_omn18109.py.
#
# Byte-identical in form to the same variable in docker-compose.infra.yml,
# repeated because YAML anchors do not cross compose files. That base file
# already renders it with the same `${OMNINODE_RUNTIME_PASSWORD:?...}`, so this
# introduces NO new operator-supplied variable on any host — `:?` and not `:-`
# for the reason the analytics block above states: an empty password renders a
# non-empty DSN and moves the failure from compose render to first connect.
#
# ONLY the three writers whose declared relations resolve to ONE principal use
# this. The delegation, savings and tenant-credentials writers span two schema
# domains, no single DSN satisfies them, and they stay on the analytics anchor
# under OMN-17454 — which owns the multi-principal mechanism. Moving one of
# them here would trade a watermark refusal for a table refusal.
x-dev-lane-internal-projection-env: &dev_lane_internal_projection_env
  OMNINODE_INTERNAL_DB_URL: "postgresql://omninode_runtime:${OMNINODE_RUNTIME_PASSWORD:?OMNINODE_RUNTIME_PASSWORD must be set — a standalone internal-projection writer connects to omnidash_analytics as the non-BYPASSRLS omninode_runtime principal (OMN-18109), never as role_omnidash and never as the postgres superuser}@postgres:5432/omnidash_analytics"
# =============================================================================
# STRICT AUTO-WIRING (OMN-17531)
# =============================================================================
# `ONEX_WIRING_STRICT_MODE` is `${ONEX_WIRING_STRICT_MODE:-0}` in
# docker-compose.infra.yml, and until OMN-17531 NO lane overlay bound it. At `0`
# a handler the resolver cannot construct is quarantined and the runtime still
# reports healthy; at `1` it re-raises and kills boot. onex-dev (staging) binds
# `"1"` on all three runtime Deployments, so every lab lane was running the
# weaker of the two semantics and could not reproduce a staging boot failure.
#
# Three defects of exactly one class reached staging before anyone saw them for
# that reason -- OMN-15623, OMN-17502, OMN-17510 -- each then diagnosed from pod
# logs over an SSM port-forward, serialized on the one staging cluster.
#
# Literal `"1"`, NOT `${ONEX_WIRING_STRICT_MODE:-1}`: same reason as
# BIFROST_CONTRACT_PATH (OMN-12864). An interpolated form lets an operator who
# exported the variable in their shell silently return this lane to the
# quarantining semantics, which is the failure mode this binding exists to
# remove. Downgrading the flag, allowlisting a contract or widening a
# quarantine branch to make a lane green is explicitly forbidden by
# OMN-17531 AC-4 -- a lane that fails here has found a real defect and the
# failure is filed as its own ticket.
#
# WHY THE LANE OVERLAY AND NOT THE BASE
# -------------------------------------
# The base file's `:-0` stays as it is. prod and judge merge that base and are
# out of OMN-17531's scope (judge is declared read-only, prod is not touched),
# so flipping the base default would silently move two lanes this ticket has no
# mandate over. Each in-scope lane opts in explicitly, here.
#
# Bound on the runtime services only (main/effects/worker), mirroring onex-dev.
# projection-api and omninode-contract-resolver are uvicorn servers that never
# run the auto-wiring kernel, so the flag would be inert there.
x-dev-lane-strict-wiring-env: &dev_lane_strict_wiring_env
  ONEX_WIRING_STRICT_MODE: "1"
# =============================================================================
# DEV-LANE BROKER AUTHENTICATION -- phase B of OMN-18012
# =============================================================================
# Phase A (this file, `redpanda-scram-user`) created the lane's SCRAM principal
# and changed nothing else: the listener still accepted PLAINTEXT, so nothing
# was proven yet. Phase B is the half that makes the REFUSAL EXIST -- the
# `redpanda-sasl-enable` one-shot below flips the broker, and this anchor binds
# the credentials on every client that speaks to it.
#
# WHY THESE FOUR VARIABLE NAMES AND NO OTHERS
# -------------------------------------------
# Every Kafka client in this lane -- all 15 of them -- resolves transport auth
# through exactly one function, and it reads exactly these names:
#
#   ModelKafkaEventBusConfig.apply_environment_overrides()
#     KAFKA_SECURITY_PROTOCOL -> security_protocol
#     KAFKA_SASL_MECHANISM    -> sasl_mechanism
#     KAFKA_SASL_USERNAME     -> sasl_plain_username   (added by OMN-18012)
#     KAFKA_SASL_PASSWORD     -> sasl_plain_password   (added by OMN-18012)
#
# The runtime, effects, worker, projection-api, contract-resolver and the six
# projection writers construct that config directly. The four observability
# consumers look like an exception and are not: they resolve their BOOTSTRAP
# address from a service-prefixed variable
# (`OMNIBASE_INFRA_<SERVICE>_KAFKA_BOOTSTRAP_SERVERS`, their own pydantic
# settings class) but their AUTH through
# `build_aiokafka_auth_kwargs_from_env()` -> `ModelKafkaEventBusConfig.default()`
# -> the same `apply_environment_overrides()`. Verified by reading each
# consumer, not assumed from the prefix: the prefixed name governs WHERE, the
# unprefixed names govern HOW. That asymmetry is why phase B is not a
# search-and-replace on one variable.
#
# This mirrors onex-dev, which binds KAFKA_SECURITY_PROTOCOL / KAFKA_SASL_MECHANISM
# on the same code path through `k8s/onex-dev-overlay-dev` (omninode_infra).
# The MECHANISM differs -- staging is AWS_MSK_IAM over SASL_SSL, this lane is
# SCRAM-SHA-256 over SASL_PLAINTEXT -- but the CONFIG PATH is identical, which
# is the property that makes a dev-lane failure predictive of a staging one.
#
# WHY THE LANE OVERLAY AND NOT THE BASE (`x-common-env`, infra.yml:145)
# --------------------------------------------------------------------
# Same reason as `redpanda-scram-user` above, and the stakes are the same.
# `x-common-env` is merged by stability-test, prod, judge and lakshman. Binding
# KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT there would point four other lanes'
# clients at a SASL handshake their brokers do not offer, and the two `:?`
# variables would fail their compose render outright. Guarded in both
# directions by tests/integration/infra/test_omn18012_dev_lane_broker_auth_scope.py.
#
# CREDENTIAL HANDLING: reference, never a literal -- identical to phase A. Both
# values are resolved by scripts/deploy-runtime.sh from the operator env file
# (OMNIBASE_OPERATOR_ENV_FILE, default ${HOME}/.omnibase/.env). `:?` and not
# `:-`: a lane that silently falls back to an empty password is a lane whose
# refusal proves nothing. NOT A ROTATION (Operating Rule 22) -- this binds the
# principal phase A provisioned; nothing is rotated, re-issued or revoked.
x-dev-lane-broker-auth-env: &dev_lane_broker_auth_env
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  KAFKA_SASL_USERNAME: ${DEV_KAFKA_SASL_USERNAME:?DEV_KAFKA_SASL_USERNAME must be set - the dev lane authenticates to its own broker as the synthetic SCRAM principal provisioned by redpanda-scram-user (OMN-18012); resolved from the operator env file, never inlined here}
  KAFKA_SASL_PASSWORD: ${DEV_KAFKA_SASL_PASSWORD:?DEV_KAFKA_SASL_PASSWORD must be set - the dev lane authenticates to its own broker as the synthetic SCRAM principal provisioned by redpanda-scram-user (OMN-18012); resolved from the operator env file, never inlined here}
services:
  # ===========================================================================
  # (7) DEV-LANE BROKER PRINCIPAL -- phase A of OMN-18012
  # ===========================================================================
  # WHAT THIS IS FOR
  # ----------------
  # Every local proof lane in this org runs a NO-AUTH broker: this lane's
  # Redpanda, docker/docker-compose.e2e.yml, and every unit test's mock. Broker
  # authentication therefore exists only in staging and prod, so a client that
  # silently opens PLAINTEXT against an auth-required listener passes every
  # local check and fails in front of a customer. That is escape 1 of the
  # 2026-09-06 set: omnimarket's credential_publisher / generation_publisher
  # built their event bus without apply_environment_overrides(), produced a
  # PLAINTEXT client against the IAM-only MSK listener, and every BYOK
  # registration 503'd (fixed omnimarket#2350, 15afc64f). Nothing local could
  # have caught it, because there is no local listener that refuses.
  #
  # This one-shot creates the lane's SCRAM-SHA-256 principal. It is PHASE A and
  # by itself changes NO client and NO listener: the broker still accepts
  # PLAINTEXT after this lands. Phase B flips redpanda.enable_sasl on this lane
  # and binds the clients' KAFKA_SASL_* env.
  #
  # WHY THE ORDER IS LOAD-BEARING AND NOT A PREFERENCE
  # --------------------------------------------------
  # `rpk security user` talks to the ADMIN API (:9644). `redpanda.enable_sasl`
  # gates the KAFKA listener (:9092); the admin API is gated separately by
  # `admin_api_require_auth`, false on this lane. That split is the ONLY reason
  # a safe flip is possible at all -- the principal can be created while the
  # Kafka listener is still open, so phase B never lands on a broker that has
  # SASL required and no user, which is a lane locked out of its own broker
  # with no un-authenticated path back in.
  #
  # `RP_BOOTSTRAP_USER` is NOT usable here: Redpanda honours it only on FIRST
  # cluster formation, and this lane's `redpanda_data` volume already exists.
  # An operator who reads the upstream docs and reaches for it will get a
  # broker with SASL on and zero users.
  #
  # Idempotent by LIST-then-CREATE, deliberately not by `|| true`. A swallowed
  # exit code here means phase B flips SASL against a broker whose user
  # creation silently failed, which is the same class of invisible failure this
  # whole ticket is about. The trailing list is the readback.
  #
  # WHY THIS FILE AND NOT docker-compose.infra.yml
  # ----------------------------------------------
  # Same fail-closed inversion as every other block in this file, and here it
  # is the difference between a dev-lane change and a fleet change. The base
  # file is the BASE that stability-test, prod and judge each merge. A service
  # written there -- and in particular one carrying a `:?` required variable --
  # would be inherited by all three, and their next deploy would fail at
  # compose render on a variable that has nothing to do with them. Only the
  # bare `omnibase-infra` project loads this overlay
  # (`resolve_compose_file_args()` falls through to it), so this reaches the
  # dev lane and provably no other lane.
  #
  # CREDENTIAL HANDLING
  # -------------------
  # SYNTHETIC dev credential, referenced and never inlined. Both variables are
  # resolved by scripts/deploy-runtime.sh from the operator env file
  # (OMNIBASE_OPERATOR_ENV_FILE, default ${HOME}/.omnibase/.env, sourced under
  # `set -a`) exactly like POSTGRES_PASSWORD and ROLE_OMNIDASH_PASSWORD above.
  # The `$$` forms in the command are compose escapes: the shell inside the
  # container expands them from the container environment, so no value is
  # rendered into `docker compose config` output or into the container command
  # line.
  #
  # `:?` and not `:-`: an unset variable must fail at compose render. A `:-`
  # fallback would create a principal with an empty or guessable password on a
  # lane whose whole purpose here is to prove that a rejection exists.
  #
  # NOT A CREDENTIAL ROTATION (Operating Rule 22). This provisions a NEW
  # synthetic principal on a fully-mutable test lane. Nothing is rotated,
  # re-issued or revoked, and no existing credential is read or written.
  #
  # Ticket: OMN-18012. Gate this enables:
  #   tests/integration/customer_path/test_omn18012_plaintext_client_is_refused.py
  # RESIDUAL: this proves PLAINTEXT-vs-authenticated, not IAM. Staging and prod
  # are AWS_MSK_IAM over SASL_SSL; this lane is SCRAM-SHA-256 over
  # SASL_PLAINTEXT. The mechanism differs; the failure mode pinned -- a client
  # built with no credentials at all -- does not. The IAM leg stays a staging
  # concern.
  redpanda-scram-user:
    image: redpandadata/redpanda:v24.2.7
    container_name: omnibase-infra-redpanda-scram-user
    entrypoint: ["/bin/sh", "-c"]
    environment:
      DEV_KAFKA_SASL_USERNAME: ${DEV_KAFKA_SASL_USERNAME:?DEV_KAFKA_SASL_USERNAME must be set - the dev lane provisions a synthetic SCRAM principal (OMN-18012); it is resolved from the operator env file, never inlined here}
      DEV_KAFKA_SASL_PASSWORD: ${DEV_KAFKA_SASL_PASSWORD:?DEV_KAFKA_SASL_PASSWORD must be set - the dev lane provisions a synthetic SCRAM principal (OMN-18012); it is resolved from the operator env file, never inlined here}
    command:
      - |
        set -eu
        ADMIN="-X admin.hosts=redpanda:9644"
        if /usr/bin/rpk security user list $$ADMIN | awk '{print $$1}' | grep -qx "$$DEV_KAFKA_SASL_USERNAME"; then
          echo "OMN-18012: SCRAM principal already present"
        else
          /usr/bin/rpk security user create "$$DEV_KAFKA_SASL_USERNAME" -p "$$DEV_KAFKA_SASL_PASSWORD" --mechanism SCRAM-SHA-256 $$ADMIN
          echo "OMN-18012: SCRAM principal created"
        fi
        /usr/bin/rpk security user list $$ADMIN | awk '{print $$1}' | grep -qx "$$DEV_KAFKA_SASL_USERNAME"
        echo "OMN-18012: readback confirms the principal exists"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - omnibase-infra-network
    restart: "no"
    logging: *dev_lane_logging
    labels:
      - "com.omninode.service=redpanda-scram-user"
      - "com.omninode.layer=infrastructure"
      - "com.omninode.ticket=OMN-18012"
  # ===========================================================================
  # (8) DEV-LANE SASL FLIP -- phase B of OMN-18012
  # ===========================================================================
  # THIS IS THE SERVICE THAT MAKES THE REJECTION EXIST.
  #
  # Everything else in this ticket is preparation. Until `enable_sasl` is true
  # on this cluster, the dev lane's broker accepts a client built with no
  # credentials at all -- which is escape 1's exact shape, and the reason it
  # passed every local check before reaching a customer.
  #
  # WHY A CLUSTER-CONFIG ONE-SHOT AND NOT `--set` ON THE BROKER COMMAND
  # ------------------------------------------------------------------
  # `--set` is a NODE-STARTUP flag. Redpanda seeds cluster properties from
  # redpanda.yaml / .bootstrap.yaml only on FIRST cluster formation; after that
  # the controller log is the source of truth and a startup flag is ignored.
  # This lane's `redpanda_data` volume already exists (cluster config version 2
  # as of 2026-09-07), so a `--set` here would render, deploy, log nothing, and
  # leave the listener open -- a change that reads as landed and is not. The
  # base file already records the same lesson for topic_partitions_per_shard
  # (OMN-13469), and `redpanda-partition-cap` is the existing one-shot this
  # service is modelled on.
  #
  # It is ALSO the only form available: the `redpanda` service is declared in
  # docker-compose.infra.yml, the BASE that stability-test, prod, judge and
  # lakshman all merge. A `command:` override there would flip four other
  # lanes' brokers. A separate one-shot declared HERE reaches this lane and
  # provably no other.
  #
  # BOTH PROPERTIES ARE DYNAMIC -- measured, not assumed. Read live from this
  # lane's own broker on 2026-09-07 via the admin API cluster_config/schema:
  # `enable_sasl` needs_restart=False, `superusers` needs_restart=False. That
  # is the fact that makes a flip on a running lane safe; if either had needed
  # a restart this would have had to be a broker recreate.
  #
  # ORDER INSIDE THE SCRIPT IS LOAD-BEARING, AND IT IS SUPERUSER FIRST
  # ------------------------------------------------------------------
  # `kafka_enable_authorization` is null on this cluster, which in Redpanda
  # means "follow enable_sasl". So the instant SASL comes on, ACLs come on too,
  # and a principal that is not a superuser and holds no ACLs can authenticate
  # and then do nothing -- every client fails on authorization instead of
  # authentication, which looks identical in a client log and is a lane locked
  # out of its own broker. Granting the superuser BEFORE the flip closes that
  # window; the reverse order opens it.
  #
  # `service_completed_successfully` on the principal one-shot, not
  # `service_healthy` on the broker: flipping SASL on a cluster whose user
  # creation silently failed is the same invisible-failure class this whole
  # ticket exists to remove.
  #
  # The readback is the point of the service, not decoration. Three assertions,
  # in this order:
  #   1. the principal is in `superusers`      (the grant landed)
  #   2. `enable_sasl` reads true              (the flip landed)
  #   3. an UNAUTHENTICATED rpk against the Kafka listener FAILS, and an
  #      authenticated one SUCCEEDS               (the refusal is real)
  # (3) is the positive-control pair. Without the second half, a broker that is
  # simply down also refuses the anonymous client and this service would go
  # green on a dead lane.
  #
  # THE ADMIN API STAYS OPEN, DELIBERATELY. `admin_api_require_auth` is false
  # and this ticket does not change it. Two things depend on that and both were
  # checked before the flip: the `redpanda` healthcheck (`rpk cluster health`)
  # and scripts/deploy-runtime.sh's broker-reachability probe (line ~2791, the
  # same command) are ADMIN-API calls. Had SASL gated them, this change would
  # have made the lane undeployable by the only sanctioned path to it.
  #
  # Idempotent: re-running on an already-flipped cluster re-sets the same two
  # values and re-runs the readback. `set -eu` and no `|| true` anywhere -- a
  # swallowed exit code here is the failure this service is supposed to catch.
  #
  # Ticket: OMN-18012. Gate this enables:
  #   tests/integration/customer_path/test_omn18012_plaintext_client_is_refused.py
  # RESIDUAL: this proves PLAINTEXT-vs-authenticated, not IAM. Staging and prod
  # are AWS_MSK_IAM over SASL_SSL. The mechanism differs; the failure mode
  # pinned -- a client built with no credentials at all -- does not.
  redpanda-sasl-enable:
    image: redpandadata/redpanda:v24.2.7
    container_name: omnibase-infra-redpanda-sasl-enable
    entrypoint: ["/bin/sh", "-c"]
    environment:
      DEV_KAFKA_SASL_USERNAME: ${DEV_KAFKA_SASL_USERNAME:?DEV_KAFKA_SASL_USERNAME must be set - the dev lane flips its broker to SASL and grants the synthetic principal (OMN-18012); it is resolved from the operator env file, never inlined here}
      DEV_KAFKA_SASL_PASSWORD: ${DEV_KAFKA_SASL_PASSWORD:?DEV_KAFKA_SASL_PASSWORD must be set - the dev lane flips its broker to SASL and grants the synthetic principal (OMN-18012); it is resolved from the operator env file, never inlined here}
    command:
      - |
        set -eu
        ADMIN="-X admin.hosts=redpanda:9644"
        BROKER="-X brokers=redpanda:9092"
        AUTH="-X sasl.mechanism=SCRAM-SHA-256 -X user=$$DEV_KAFKA_SASL_USERNAME -X pass=$$DEV_KAFKA_SASL_PASSWORD"
        /usr/bin/rpk cluster config set superusers "['$$DEV_KAFKA_SASL_USERNAME']" $$ADMIN
        /usr/bin/rpk cluster config set enable_sasl true $$ADMIN
        /usr/bin/rpk cluster config get superusers $$ADMIN | grep -q "$$DEV_KAFKA_SASL_USERNAME"
        echo "OMN-18012: superuser grant confirmed"
        /usr/bin/rpk cluster config get enable_sasl $$ADMIN | grep -qx true
        echo "OMN-18012: enable_sasl confirmed true"
        if /usr/bin/rpk topic list $$BROKER >/dev/null 2>&1; then
          echo "OMN-18012 FAIL: an UNAUTHENTICATED client reached the Kafka listener" >&2
          exit 1
        fi
        echo "OMN-18012: unauthenticated client refused"
        /usr/bin/rpk topic list $$BROKER $$AUTH >/dev/null
        echo "OMN-18012: authenticated client accepted - positive control"
    depends_on:
      redpanda-scram-user:
        condition: service_completed_successfully
    networks:
      - omnibase-infra-network
    restart: "no"
    logging: *dev_lane_logging
    labels:
      - "com.omninode.service=redpanda-sasl-enable"
      - "com.omninode.layer=infrastructure"
      - "com.omninode.ticket=OMN-18012"
  forward-migration:
    environment:
      # Consumed by scripts/run-forward-migrations.sh. `dev` is the only value
      # that releases anything; unset/unknown = full fence. The release SET is
      # committed in the runner, not supplied here — this names a policy, it
      # does not carry migration ids.
      ONEX_MIGRATION_LANE: dev
    labels:
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-15379"
  # ===========================================================================
  # STRICT SEMANTIC CONTAINER PROBE, AUTOHEAL DISARMED (OMN-17562, ruling 4)
  # ===========================================================================
  # WHAT THIS CHANGES
  # -----------------
  # The base file gives all three kernel runtime services the same probe:
  #
  #   docker-compose.infra.yml:
  #     healthcheck:
  #       test: ["CMD", "curl", "-sf", "http://localhost:8085/health"]
  #
  # That asserts exactly one property — HTTP status < 400. `/health` returns 200
  # for a running-but-DEGRADED runtime BY DESIGN (a degraded container stays in
  # rotation rather than triggering cascading restarts), so the base probe is a
  # liveness check wearing a health check's name. OMN-15217 replaced it on the
  # stability lane after reading the mask live there, 2026-07-27: all three
  # runtime containers `Up 4 hours (healthy)` while their own monitors logged
  # `status=DEGRADED`.
  #
  # This lane kept the shallow probe, and that is exactly how it carried the
  # OMN-17448 silent-loss defect green for as long as it did —
  # tests/ci/test_lane_projection_writer_coverage_omn17562.py names the shallow
  # dev probe as the reason the defect was only ever caught on the lane that had
  # already been made honest. `--degraded-policy fail` is the load-bearing flag:
  # without it the check degrades to the same pass-on-DEGRADED semantics as
  # `curl -sf`.
  #
  # WHY THE PROBE AND THE LABEL BLOCK ARE ONE CHANGE
  # ------------------------------------------------
  # `autoheal` (docker-compose.infra.yml, service `autoheal`) restarts any
  # container labelled `autoheal=true` that Docker reports unhealthy. With the
  # strict probe above, "unhealthy" now means "semantically degraded", and
  # semantic degradation is typically restart-IMMUNE: four contracts that fail to
  # import will fail to import again. Leaving autoheal armed would therefore turn
  # an honest signal into a restart of all three runtime containers every 30s and
  # destroy the forensic state, which is the opposite of what the strict probe is
  # for. The stability lane made exactly this pairing for exactly this reason.
  #
  # `labels: !override` and not a plain `labels:` block: compose APPENDS label
  # sequences, so the base service's `autoheal=true` survives a plain block and
  # the parsed overlay looks identical either way. Only the resolved render can
  # tell the two apart, which is why the assertions live in
  # tests/integration/infra/test_dev_runtime_compose_render.py (a
  # `docker compose config` read) rather than in a file-parsing unit test.
  # `!override` replaces the whole sequence, so the base identity labels are
  # restated here verbatim — dropping them would silently strip the identity the
  # lane census and every `docker ps --filter label=` read depends on. Restore
  # autoheal by removing `!override`.
  #
  # Restated VERBATIM and NOTHING ELSE — deliberately no `com.omninode.lane=dev`
  # and no ticket label, unlike the writer services further down this file.
  # `scripts/lane_census_plan.py` treats any container carrying
  # `com.omninode.lane=<lane>` as claimed by that lane and raises
  # `unexpected_container` for one the lane manifest does not declare;
  # `deploy/lane-census/lane-manifest.yaml` declares omninode-runtime and
  # omninode-runtime-effects on this lane but not the worker, so a decorative
  # lane label here would manufacture a census finding. This block removes one
  # label and changes nothing else.
  #
  # WHY THIS FILE AND NOT docker-compose.infra.yml
  # ----------------------------------------------
  # Ruling item (4) pointed at the base file's three healthcheck blocks. It
  # cannot go there. `docker-compose.prod.yml` declares NO healthcheck override
  # for omninode-runtime / runtime-effects / runtime-worker and `autoheal=true`
  # is a base-file label, so editing the base would flip the PROD probe to the
  # strict semantic check AND disarm prod's self-recovery — two live-blast-radius
  # changes, made as a side effect, on a lane this ticket has no mandate over.
  # Judge is declared read-only. Only the bare `omnibase-infra` project loads
  # this overlay (`resolve_compose_file_args()` falls through to it), so the
  # change reaches the dev lane and provably no other; the RED-guard
  # test_the_base_file_probe_and_autoheal_are_unchanged_for_every_other_lane
  # fails if it ever leaks into the base.
  #
  # TIMINGS
  # -------
  # Inherited from each base service and restated so the flap budget is readable
  # at the strict call site: interval 30s / timeout 10s / retries 5, with
  # start_period 1800s for main and effects and 1200s for the worker (the base
  # worker window, which is genuinely shorter — not a typo). The monitor's first
  # verdict lands ~one RUNTIME_HEALTH_CHECK_INTERVAL (300s) after boot and an
  # absent verdict PASSES, so startup cannot flap on it.
  #
  # DEPLOY ORDERING — READ BEFORE APPLYING THIS TO THE LANE
  # -------------------------------------------------------
  # This is declarative until a deploy runs. Apply it only once the OMN-17562
  # kernel change (omnibase_infra#3156) and the writer services (#3163) are
  # deployed on this lane and
  #   docker exec omninode-runtime python \
  #     /usr/local/bin/onex-container-healthcheck --degraded-policy fail
  # exits 0. Flipping the probe while `projection_write_path` is still DEGRADED
  # makes all three containers unhealthy on the next 30s interval; before this
  # block that would have been an autoheal restart loop, and after it, it is
  # three permanently-unhealthy containers. Deploy through the sanctioned
  # attributed path (`scripts/deploy-runtime.sh --execute`) only.
  #
  # Ticket: OMN-17562 (operator ruling 2026-09-03, item 4). Pattern source:
  #   docker/docker-compose.stability-test.yml (OMN-15217).
  omninode-runtime:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_strict_wiring_env, *dev_lane_broker_auth_env]
    healthcheck:
      test:
        - CMD
        - python
        - /usr/local/bin/onex-container-healthcheck
        - --degraded-policy
        - fail
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s
    labels: !override
      - "com.omninode.service=runtime-main"
      - "com.omninode.layer=runtime"
      - "com.omninode.version=${RUNTIME_VERSION:-0.1.0}"
  runtime-effects:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_strict_wiring_env, *dev_lane_broker_auth_env]
    healthcheck:
      test:
        - CMD
        - python
        - /usr/local/bin/onex-container-healthcheck
        - --degraded-policy
        - fail
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s
    labels: !override
      - "com.omninode.service=runtime-effects"
      - "com.omninode.layer=runtime"
      - "com.omninode.version=${RUNTIME_VERSION:-0.1.0}"
  projection-api:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_broker_auth_env]
  runtime-worker:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_strict_wiring_env, *dev_lane_broker_auth_env]
    # Base runtime-worker inherits interval 30s / timeout 10s / retries 5 but
    # start_period 1200s, NOT 1800s. Restated rather than copied from the two
    # services above so the shorter window is a visible decision.
    healthcheck:
      test:
        - CMD
        - python
        - /usr/local/bin/onex-container-healthcheck
        - --degraded-policy
        - fail
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
    labels: !override
      - "com.omninode.service=runtime-worker"
      - "com.omninode.layer=runtime"
      - "com.omninode.version=${RUNTIME_VERSION:-0.1.0}"
  omninode-contract-resolver:
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_broker_auth_env]
  # ===========================================================================
  # THE THREE OBSERVABILITY CONSUMERS THE PREFIX HID (OMN-18012, phase B)
  # ===========================================================================
  # These three are declared in docker-compose.infra.yml, not here, and they
  # were the near-miss of this change. Each carries exactly ONE Kafka variable
  # in the base -- `OMNIBASE_INFRA_<SERVICE>_KAFKA_BOOTSTRAP_SERVERS` -- so an
  # inventory taken by grepping the compose files for `KAFKA_BOOTSTRAP_SERVERS`
  # finds them under a different name, and an inventory taken by binding
  # `x-common-env` misses them entirely.
  #
  # They resolve their bootstrap ADDRESS from that prefixed variable (their own
  # pydantic-settings class, e.g. ConfigContextAuditConsumer with
  # env_prefix=OMNIBASE_INFRA_CONTEXT_AUDIT_) and their AUTH from the
  # UNPREFIXED names, through
  # `build_aiokafka_auth_kwargs_from_env()` -> `ModelKafkaEventBusConfig.default()`
  # -> `apply_environment_overrides()`. Read in each consumer module before
  # writing this block, not inferred from the prefix.
  #
  # Left unbound, all three would have kept running as PLAINTEXT clients
  # against a listener that now refuses them -- which is escape 1's failure
  # mode reproduced by the very change meant to prevent it.
  #
  # A stanza here and not a base edit: the base is merged by four other lanes
  # whose brokers offer no SASL handshake.
  agent-actions-consumer:
    environment:
      !!merge <<: *dev_lane_broker_auth_env
  skill-lifecycle-consumer:
    environment:
      !!merge <<: *dev_lane_broker_auth_env
  # context-audit-consumer is additionally the one dev-lane Kafka client that NO
  # deploy path restarted: it is in neither RUNTIME_SERVICES nor
  # DEV_LANE_ONLY_RUNTIME_SERVICES in scripts/deploy-runtime.sh, so it had been
  # up 2 weeks across every intervening deploy. Binding the credential here is
  # inert on its own -- a container that is never recreated never reads a new
  # environment -- so the deploy script gains DEV_LANE_EXTRA_BROKER_CLIENTS in
  # the same change. Guarded by
  # tests/unit/scripts/test_omn18012_dev_lane_broker_client_restart_coverage.py.
  context-audit-consumer:
    environment:
      !!merge <<: *dev_lane_broker_auth_env
  # ===========================================================================
  # STANDALONE PROJECTION WRITERS (OMN-17448)
  # ===========================================================================
  # WHAT THESE ARE FOR
  # ------------------
  # A handler with the standalone-runner shape (its own `run()` consume loop,
  # its own `project_event`, its own topic set, its own DB adapter) is
  # deliberately NOT dispatched by the shared kernel. `handler_wiring.py`'s
  # auto-wired projection callback opens with:
  #
  #     if is_projection_runner:
  #         logger.debug("Projection runner skipped by DB-injection auto-wiring: ...")
  #         return None
  #
  # That skip is correct and load-bearing (OMN-15905 / OMN-16874): the runtime
  # cannot scope the lifetime of a pool it did not create, and a runner
  # dispatched in-process died `Event loop is closed` on every message. The
  # sanctioned way to run such a handler for real is a DEDICATED PROCESS
  # outside the kernel.
  #
  # WHAT WAS BROKEN
  # ---------------
  # The kernel still SUBSCRIBES these contracts' topics. So the consumer joins,
  # takes every message, and commits every offset while the callback returns
  # None before any handler runs: consume -> ack -> nothing written -> no DLQ
  # record -> no terminal event -> no ERROR log. Silent by construction, and
  # invisible to both OMN-16994 liveness masks (the topic IS attached, and
  # nothing raises so nothing is DLQ'd).
  #
  # OMN-15905 fixed this for onex-dev k8s by adding dedicated writer
  # Deployments under `omninode_infra/k8s/onex-dev/runtime/`. Nothing ever
  # mirrored that onto compose. Measured on the .201 dev lane 2026-09-01, after
  # the OMN-17374 lane-apply deploy: a well-formed TENANT_CREATED published to
  # `onex.tenant.events` (offset 37) moved the consumer group to LAG 0 and left
  # `tenant_registry_mirror` at 0 rows, the malformed-DLQ topic at HWM 0, and
  # zero log lines for that correlation id in any of the four runtime
  # containers. `node_projection_tenant_registry` additionally had no writer on
  # ANY lane -- it is absent from the onex-dev Deployment set too, which is why
  # its mirror was empty on both .201 and staging.
  #
  # WHY THIS FILE AND NOT docker-compose.infra.yml
  # ----------------------------------------------
  # Same fail-closed reasoning as the migration-lane indicator at the top of
  # this file, and it is the whole reason these services live here. The base
  # file is merged by EVERY lane: stability-test, prod and judge each layer
  # their own overlay on top of it. A service written into the base would be
  # inherited by all of them and by any lane added later. Only the dev lane
  # loads this file (`resolve_compose_file_args()` falls through to it for the
  # bare `omnibase-infra` project), so declaring the writers here changes the
  # dev lane and provably nothing else. Parity for the other lanes is separate,
  # deliberate work with its own approval -- not a side effect of this file.
  #
  # SCOPE, STATED HONESTLY
  # ----------------------
  # These two were the beta-critical pair -- the ones OMN-17298 AC3,
  # OMN-17374 AC3 and OMN-16804 AC5 were blocked behind. OMN-17562 landed the
  # remaining four of the ADOPT set in the block further down this file, by
  # copying this pattern verbatim; onex-dev runs six standalone writers
  # (delegation, live-events, registration, savings, tenant-credentials,
  # tenant-registry) and this lane now mirrors all six.
  #
  # NO ANCHOR REUSE
  # ---------------
  # `x-runtime-base` / `x-runtime-env` live in the base file and YAML anchors
  # do not cross compose files, so these two services spell out their own
  # config. They are deliberately MINIMAL: a BaseProjectionRunner subclass is a
  # bare Kafka consumer with a DB pool. It has no HTTP surface beyond its own
  # readiness server, no Bifrost rendering, no delegation routing, no contract
  # discovery, and no secret resolver -- so none of the runtime kernel's env is
  # wired here, and adding it would only create failure modes these processes
  # cannot have.
  #
  # DATABASE IDENTITY (see OMN-17448's grant-binding finding)
  # --------------------------------------------------------
  # `BaseProjectionRunner` resolves its own DSN through
  # `ModelProjectionRuntimeBinding.from_legacy_settings()`, which prefers
  # `OMNIDASH_ANALYTICS_DB_URL`. It is never handed the topology-resolved
  # binding: `bind_projection_database_url()` is called only on the in-process
  # dispatch path, and by construction the runtime does not dispatch these.
  # So a standalone writer connects as `role_omnidash` on this lane -- NOT as
  # `omninode_runtime`, which is the principal the topology declares for these
  # relations' `omninode_internal` domain and the one OMN-17374's migration
  # granted. Both writes land anyway, but by a DIFFERENT mechanism: flat
  # migration `096_grant_role_omnidash_omnidash_analytics.sql` issues
  # `GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO
  # role_omnidash`, which covers every relation in this schema including ones
  # added later. That blanket grant is what these writers actually rest on, and
  # `scripts/validation/check_topology_grant_delivery.py` cannot see it (it
  # matches named-relation GRANT statements, never `ON ALL TABLES`). Recorded
  # rather than silently relied on; the "should a standalone writer resolve the
  # topology binding" question is OMN-16911's residual, not this file's.
  #
  # Ticket: OMN-17448. Pattern source:
  #   omninode_infra/k8s/onex-dev/runtime/deployment-omnimarket-projection-*-writer.yaml
  projection-tenant-registry-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omnimarket-projection-tenant-registry-writer
    profiles: ["runtime", "full"]
    networks:
      - omnibase-infra-network
    restart: unless-stopped
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # The `if __name__ == "__main__"` entrypoint on the handler module, exactly
    # as the onex-dev Deployment invokes it. Same class, same code path, same
    # image contents -- the only difference between the two lanes is the
    # orchestrator that starts the process.
    command:
      - python
      - -m
      - omnimarket.nodes.node_projection_tenant_registry.handlers.handler_tenant_registry_projection
    environment:
      # OMN-18109: the INTERNAL-projection identity, not the analytics one.
      # The overlay below selects it by name; this renders the DSN it names.
      !!merge <<: [*dev_lane_internal_projection_env, *dev_lane_broker_auth_env]
      # KAFKA_BROKERS is the env `BaseProjectionRunner.kafka_bootstrap_servers`
      # reads first (runner.py KAFKA_BROKERS_ENV). Docker-internal hostname, as
      # every other runtime service on this lane uses.
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      # Its OWN consumer group, distinct from the shared kernel's subscription
      # to the same topic and from the sibling writer's. Two processes reading
      # the same topic under one group would split the partitions between a
      # writer and a no-op consumer, so half the tenants would silently never
      # land -- a worse failure than the one this service fixes, because it
      # would look like it worked. Canonical
      # {env}.{service}.{node}.{purpose}.{version} shape, read via
      # ModelProjectionRuntimeBinding.from_legacy_settings()'s
      # KAFKA_CONSUMER_GROUP fallback.
      KAFKA_CONSUMER_GROUP: "local.omnimarket-projections.tenant-registry-writer.consume.v1"
      # OMN-18109: the runner's OWN declared binding override, which takes
      # precedence over ModelProjectionRuntimeBinding.from_legacy_settings().
      # Without it the runner reads OMNIDASH_ANALYTICS_DB_URL and connects as
      # role_omnidash, whose every omninode_internal write is refused.
      OMNIMARKET_PROJECTION_RUNTIME_BINDING_OVERLAY: /etc/onex/projection-runtime-binding.yaml
      # Opt-in readiness/liveness HTTP server
      # (BaseProjectionRunner.PROJECTION_RUNNER_HEALTH_PORT_ENV). Container-
      # internal only: the healthcheck below curls localhost, and publishing a
      # host port would put this service into the lane port map for no reader.
      PROJECTION_RUNNER_HEALTH_PORT: "8098"
      ONEX_LOG_LEVEL: ${ONEX_LOG_LEVEL:-INFO}
      ONEX_ENVIRONMENT: ${ONEX_ENVIRONMENT:-local}
      PYTHONUNBUFFERED: "1"
    volumes:
      # Read-only. The file carries no credential material: it names the
      # DSN env var, which the environment block above renders from the
      # fail-closed ${OMNINODE_RUNTIME_PASSWORD:?...} reference.
      - ./projection-runtime-binding/tenant-registry-writer.yaml:/etc/onex/projection-runtime-binding.yaml:ro
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8098/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *dev_lane_logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "com.omninode.service=projection-tenant-registry-writer"
      - "com.omninode.layer=runtime"
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-17448"
      - "autoheal=true"
  projection-delegation-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omnimarket-projection-delegation-writer
    profiles: ["runtime", "full"]
    networks:
      - omnibase-infra-network
    restart: unless-stopped
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - omnimarket.nodes.node_projection_delegation.handlers.handler_delegation
    environment:
      !!merge <<: [*dev_lane_analytics_env, *dev_lane_broker_auth_env]
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_CONSUMER_GROUP: "local.omnimarket-projections.delegation-writer.consume.v1"
      # 8098 is the tenant-registry writer's. Distinct ports keep two unrelated
      # processes distinguishable in logs and metrics, the same reason the five
      # onex-dev writers hold 8093-8097.
      PROJECTION_RUNNER_HEALTH_PORT: "8099"
      ONEX_LOG_LEVEL: ${ONEX_LOG_LEVEL:-INFO}
      ONEX_ENVIRONMENT: ${ONEX_ENVIRONMENT:-local}
      PYTHONUNBUFFERED: "1"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8099/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *dev_lane_logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "com.omninode.service=projection-delegation-writer"
      - "com.omninode.layer=runtime"
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-17448"
      - "autoheal=true"
  # ---------------------------------------------------------------------------
  # OMN-17562: the remaining four of the ADOPT set
  # ---------------------------------------------------------------------------
  # The block above landed two writers and said so honestly: "Two writers, not
  # five ... The remaining three follow the same pattern and are ticketed
  # separately; the pattern is this block, copied." This is that copy, plus
  # `projection_tenant_registry`'s sibling on the proof lane.
  #
  # WHY THESE FOUR AND NOT ALL SIXTEEN WRITER-OWNED CONTRACTS
  # --------------------------------------------------------
  # Membership is not a judgement call. These are exactly the contracts with a
  # checked-in writer Deployment under `omninode_infra` `k8s/onex-dev/runtime/`
  # on origin/dev -- a runner already proven to run as its own process. Two
  # other runner-shaped contracts (`projection_pattern_learning`,
  # `projection_routing_decision`) deliberately get NO writer here:
  # `omninode_infra#1147` removed their Deployments on 2026-09-02 as a
  # prohibited rollout direction, and their in-process sibling entry is the one
  # raising `ValueError: Projection handler requires topology bindings with
  # configured DSNs: tenant_projection:ONEX_TENANT_DB_URL` -- store-resolved
  # credential work (OMN-17557 / OMN-17556), not a missing container.
  #
  # Four more contracts (`node_projection_cost_by_repo`,
  # `node_projection_instruction_eval`, `node_projection_skill_executions`,
  # `projection_llm_cost`) were RULED OUT of the served set entirely: no writer
  # exists on any lane and nothing reads their tables, so the kernel stops
  # subscribing them (omnibase_infra#3156) rather than four processes being
  # deployed to write rows no reader reads.
  #
  # tests/ci/test_lane_projection_writer_coverage_omn17562.py holds both sets
  # frozen and fails if this file drifts from either.
  #
  # Ticket: OMN-17562. Pattern source: the two services above, unchanged.
  projection-registration-writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args:
        BUILD_SOURCE: "${BUILD_SOURCE:-release}"
        EXPECTED_BUILD_SOURCE: "${EXPECTED_BUILD_SOURCE:-release}"
    container_name: omnimarket-projection-registration-writer
    profiles: ["runtime", "full"]
    networks:
      - omnibase-infra-network
    restart: unless-stopped
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - omnimarket.nodes.node_projection_registration.handlers.handler_registration
    environment:
      # OMN-18109: the INTERNAL-projection identity, not the analytics one.
      # The overlay below selects it by name; this renders the DSN it names.
      !!merge <<: [*dev_lane_internal_projection_env, *dev_lane_broker_auth_env]
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      KAFKA_CONSUMER_GROUP: "local.omnimarket-projections.registration-writer.consume.v1"
      # OMN-18109: the runner's OWN declared binding override, which takes
      # precedence over ModelProjectionRuntimeBinding.from_legacy_settings().
      # Without it the runner reads OMNIDASH_ANALYTICS_DB_URL and connects as
      # role_omnidash, whose every omninode_internal write is refused.
      OMNIMARKET_PROJECTION_RUNTIME_BINDING_OVERLAY: /etc/onex/projection-runtime-binding.yaml
      PROJECTION_RUNNER_HEALTH_PORT: "8100"
      ONEX_LOG_LEVEL: ${ONEX_LOG_LEVEL:-INFO}
      ONEX_ENVIRONMENT: ${ONEX_ENVIRONMENT:-local}
      PYTHONUNBUFFERED: "1"
    volumes:
      # Read-only. The file carries no credential material: it names the
      # DSN env var, which the environment block above renders from the
      # fail-closed ${OMNINODE_RUNTIME_PASSWORD:?...} reference.
      - ./projection-runtime-binding/registration-writer.yaml:/etc/onex/projection-runtime-binding.yaml:ro
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *dev_lane_logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "com.omninode.service=projection-registration-writer"
      - "com.omninode.layer=runtime"
      - "com.omninode.lane=dev"
      - "com.omninode.ticket=OMN-17562"
      - "autoheal=true"
