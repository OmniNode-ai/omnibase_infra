# nginx.conf for docker-compose.factory-floor-web.yml (OMN-21733).
# A read-only static server for one directory: the factory floor page and its JSON record. It runs as an
# unprivileged user on port 8080 inside the container, writes nothing but /tmp, and sends the record with
# no-store so a reload always sees the newest publish. The content security policy lets the page load only
# from this origin, so it cannot reach another host.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /srv/site;
        index index.html;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

        location ~ /\. {
            return 404;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/index.html =404;
        }
    }
}
