# nginx.conf for docker-compose.factory-floor-web.yml (OMN-21733).
# A read-only static server for one directory: the factory floor page and its JSON record, and the reports site under /reports/. It runs as an
# unprivileged user on port 8080 inside the container, writes nothing but /tmp, and sends the record with
# no-store so a reload always sees the newest publish. The content security policy lets the page load only
# from this origin, so it cannot reach another host.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    gzip on;
    gzip_types application/json text/html text/css application/javascript;
    gzip_min_length 1024;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /srv/site;
        index index.html;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

        location ~ /\. {
            return 404;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/index.html =404;
        }

        # The reports site (/reports/) is served by the same rules. Only the decision map draws its graph with
        # two scripts from public CDNs, so only its directory may load them: exactly those two files, each also
        # pinned by an integrity hash in the page. add_header in a location replaces the server-level headers, so
        # all three are repeated here. A plain prefix (not ^~) keeps the dot-file rule above in force for it.
        location /reports/decision-map/ {
            limit_except GET HEAD {
                deny all;
            }
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js https://cdn.jsdelivr.net/npm/elkjs@0.9.2/lib/elk.bundled.js; img-src 'self' data:" always;
            try_files $uri $uri/index.html =404;
        }
    }
}
