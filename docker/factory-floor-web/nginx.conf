# nginx.conf for docker-compose.factory-floor-web.yml (OMN-21733).
# A read-only static server for one directory: the factory floor page and its JSON record, and the operator-only
# report path behind the address gate below. It runs as an
# unprivileged user on port 8080 inside the container, writes nothing but /tmp, and sends the record with
# no-store so a reload always sees the newest publish. Inline scripts and styles support the generated
# page; fetched resources and script connections stay on this origin, and forms cannot be submitted.
# Only this origin may frame a page (frame-ancestors 'self'): the site's tab shell draws the floor, process and map tabs
# as same-origin frames, and 'none' left those three tabs blank (OMN-21733). Another origin still cannot frame any of it.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /srv/site;
        index index.html;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

        location ~ /\. {
            return 404;
        }

        # Liveness only: answers 200 without touching the serve directory, so a fresh deploy is healthy
        # before the publisher has written index.html. Locations declare no add_header: nginx drops every
        # inherited server-level header in a block that declares its own.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The operator-only report gate (OMN-22119): /reports/decision-quality and everything under it is answered
        # only to the source addresses in the generated include in /etc/nginx/access, the operator's own tailnet
        # devices that omnimarket's factory floor publish writes there on every run (the directory is mounted
        # read-only and is never inside the served directory). Every other address gets 403, and so does everyone
        # when no include exists: the deny follows the allow lines, so the gate fails closed. The publish checks
        # that this server's configuration carries the text "operator-only report gate" (the marker) before it writes
        # a private file and withdraws the private files when it does not. The location declares no add_header,
        # so the server-level headers apply to the 403 too.
        location ~ ^/reports/decision-quality(?:/|$) {
            include /etc/nginx/access/*.conf;
            deny all;
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/index.html =404;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/index.html =404;
        }

        # The reports site (/reports/) is served by the same rules. Only the decision map draws its graph with
        # two scripts from public CDNs, so only its directory may load them: exactly those two files. The CSP
        # keeps 'unsafe-inline' for the page's own inline script, so it limits which hosts load, not what runs; the
        # integrity hashes in the page (not the CSP) pin the file contents. add_header in a location replaces the
        # server-level headers, so all three are repeated here. nginx lets a regex location win over a prefix unless
        # the prefix is ^~, so this plain prefix keeps the dot-file rule in force for it.
        location /reports/decision-map/ {
            limit_except GET HEAD {
                deny all;
            }
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js https://cdn.jsdelivr.net/npm/elkjs@0.9.2/lib/elk.bundled.js; img-src 'self' data:" always;
            try_files $uri $uri/index.html =404;
        }
    }
}
