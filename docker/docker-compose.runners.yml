  # omninode-deploy-runner -- OMN-14889: dedicated runner for the
  # release-train-lab.yml tag-cut/deploy jobs (cut_release_train_tag.sh,
  # refresh_stability_lane.sh, refresh_dev_lane.sh). These scripts need real
  # host-path git access to OMNI_HOME sibling clones (they `git fetch`/
  # `checkout --detach`/tag the clones directly and run deploy-runtime.sh's
  # BUILD_SOURCE=workspace path against them) -- the shared 72-runner omnibase-ci
  # fleet above deliberately does NOT have this (docker.sock only, no
  # OMNI_HOME bind mount) so that a compromised/buggy CI job from the general
  # fleet cannot mutate host git state or lane containers. Fork 1 (OMN-14889
  # ticket): rejected SSH-hop from a shared runner (refresh_stability_lane.sh's
  # own docstring disallows it) and rejected mounting OMNI_HOME into the
  # WHOLE fleet (blast radius). This is the smallest incremental surface: ONE
  # runner with exactly the access the release-train jobs need.
  #
  # PRIVATE OMNI_HOME (OMN-14900). This runner does NOT mount the shared
  # /data/omninode/omni_home clones. Five release-train runs on 2026-07-21
  # all died on uid-mismatch against those shared clones (`detected dubious
  # ownership` 128, `cannot open .git/FETCH_HEAD: Permission denied` 255,
  # `'dev' is already checked out at .../runtime-sync-worktrees/...` 128) --
  # a write surface into clones the runner does not own, relieved only by
  # UNCOMMITTED live hand-edits (exec'd `git config --global`, a compose
  # hand-edit adding group_add 1000 + GIT_CONFIG_* env) that any
  # `--force-recreate` silently drops. The committed fix: a DEDICATED,
  # runner-uid-owned clone tree at DEPLOY_RUNNER_OMNI_HOME
  # (e.g. /data/omninode/runner_omni_home -- operator-chosen, host-side env),
  # bind-mounted at the IDENTICAL container path, with the shared mount
  # REMOVED so writes into the shared clones are structurally impossible.
  # The clones themselves are provisioned automatically by
  # scripts/runtime_build/ensure_runner_clones.sh at the top of every entry
  # script (all 5 repos are public; anonymous https clones, no creds).
  #
  # The IDENTICAL host:container bind path is load-bearing: this container
  # uses the HOST's docker.sock (docker-outside-of-docker), so a
  # `docker compose` invocation issued from inside this container resolves
  # volume paths to absolute paths that the DAEMON (running on the host)
  # then tries to bind -- that only works if the path exists on the host at
  # that exact location. A container-local alias (e.g. /workspace) would
  # resolve to a nonexistent host path and silently produce empty binds.
  #
  # DEPLOY_RUNNER_OMNI_HOME is REQUIRED (fail-fast `:?` interpolation): any
  # `docker compose -f docker-compose.runners.yml ...` against this file
  # needs it in the compose environment (export it, or put it in the .env
  # next to this file). No silent default -- an empty value would produce
  # broken binds (CLAUDE.md rule 8).
  #
  # OMN-15142: this service actually requires THREE DEPLOY_RUNNER_* vars
  # (DEPLOY_RUNNER_OMNI_HOME, DEPLOY_RUNNER_TOKEN, DEPLOY_RUNNER_OPERATOR_ENV_FILE)
  # -- not documented together anywhere before this. See the consolidated,
  # single-source list (with mint/export instructions for all three) in
  # scripts/deploy-runners.sh's top-of-file usage comment.
  #
  # REGISTRATION IS ORGANIZATION-SCOPED, in runner group `omnibase-deploy`
  # (OMN-18386; was repository-scoped on omnibase_infra until 2026-09-15).
  #
  # WHY IT MOVED. A reusable workflow's jobs run in the CALLER's repository.
  # runtime-rebuild-trigger-reusable.yml's `verify-sibling-converged` job is
  # pinned to `runs-on: [self-hosted, omnibase-deploy]` because the dev lane's
  # docker daemon is on the LAN and hosted compute cannot see it -- but with
  # the runner registered on omnibase_infra alone, no runner carrying that
  # label was visible to omnimarket, the one external caller. Its verify job
  # therefore queued forever with no runner (runs 34903286467 and 34908448152
  # sat queued for over an hour), no compose-dev lab-pass receipt was emitted
  # for any omnimarket merge, and CLAUDE.md rule 24(a) was silently false for
  # that repo. omnibase_infra's own runs scheduled the same job fine, which is
  # exactly why the gap went unnoticed.
  #
  # BLAST RADIUS. The group is `visibility: selected` over precisely the two
  # repositories that reference the label -- omnibase_infra and omnimarket.
  # That repository access list is the whole of the control. The group also
  # carries `allows_public_repositories: true`, which is NOT a widening and is
  # NOT optional: both repositories are PUBLIC, and a group with that flag
  # false refuses their jobs SILENTLY -- the job queues forever with no runner
  # and no error, which is the exact symptom this ticket exists to remove. It
  # was set false first, on the assumption that these repositories were
  # private, and a dispatched probe job sat queued against an online, idle
  # runner until the flag was corrected. The shared omnibase-ci group carries
  # the same flag for the same reason. omniclaude and omnibase_core were
  # checked on 2026-09-15 and have no runtime-rebuild-trigger workflow at all,
  # so they are deliberately NOT in the group; add a repository here only when
  # it actually calls the reusable. This DOES widen the surface: any workflow
  # in either repository can now target the label and reach this container's
  # docker.sock and private clone tree. The reusable's verify job itself runs
  # no caller-authored code (it checks out omnibase_infra@dev pinned), and a
  # fork PR cannot reach it (the trigger job routes forks to hosted compute and
  # the LAN publish is refused, so the verify job's `if:` is false).
  #
  # RUNNER_GROUP is `omnibase-deploy` and GITHUB_ORG_URL is the ORG. The
  # credential cache key is SHA256(labels + URL), so changing the URL orphans
  # the old repo-scoped cache and forces re-registration on the next recreate;
  # the orphaned entry is left in place deliberately, so reverting this file
  # restores the repo-scoped registration from cache. A recreate needs an ORG
  # registration token (`gh api -X POST
  # orgs/OmniNode-ai/actions/runners/registration-token`, valid 1h) exported as
  # DEPLOY_RUNNER_TOKEN before `up -d`. The group must exist before the
  # recreate: `config.sh --runnergroup` fails on an unknown group.
  # See knowledge-base-internal:runbooks/omnibase-infra-release-train-lab.md for the full recreate procedure.
  omninode-deploy-runner:
    image: omninode-runner:latest
    container_name: omninode-deploy-runner
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 8g
    cpus: "2.0"
    pids_limit: 4096
    # Root-phase init (OMN-14900): own the private OMNI_HOME bind for the
    # runner uid, then exec the stock entrypoint (which gosu-drops to
    # `runner`). Committed here so the ownership fix survives every
    # recreate -- the live container's equivalent wrapper was an uncommitted
    # host hand-edit. `$$` escapes keep these as RUNTIME shell vars (compose
    # must not interpolate them).
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        : "$${OMNI_HOME:?OMNI_HOME must reach the container env (from DEPLOY_RUNNER_OMNI_HOME)}"
        mkdir -p "$${OMNI_HOME}"
        runner_uid="$$(id -u runner)"
        runner_gid="$$(id -g runner)"
        if [ "$$(stat -c '%u' "$${OMNI_HOME}")" != "$${runner_uid}" ]; then
          chown "$${runner_uid}:$${runner_gid}" "$${OMNI_HOME}"
        fi
        # OMN-14983: the host operator env file is bind-mounted read-only at
        # /run/omnibase-operator.env, 0600 and owned by the HOST operator uid
        # (never the container `runner` uid -- it carries real secrets:
        # POSTGRES_PASSWORD, GH_PAT, LINEAR_API_KEY, KEYCLOAK_*, Infisical
        # creds). The `runner` job user (uid 1001, per docker/runners/
        # Dockerfile) that executes job steps cannot read it directly
        # (EACCES) once the entrypoint gosu-drops below. This root-phase
        # init still runs as root (CAP_DAC_OVERRIDE), so it CAN read the
        # 0600 mount; it copies the content into the already-runner-owned
        # deploy-runner-creds volume at 0400 runner:runner, and the scripts
        # are pointed at that copy (OMNIBASE_OPERATOR_ENV_FILE below) instead
        # of the raw mount. This is the least-privilege fix: it does not
        # relax the host file's 0600 perms (no world-readable regression),
        # does not chgrp it to the container runner gid (on the .201 host,
        # gid 1001 belongs to a DIFFERENT real user -- daniyal -- so that
        # would have handed him direct read access to operator secrets), and
        # does not touch the runner uid/Dockerfile shared with the other
        # 72-runner fleet. Re-copied on every container start/recreate, so a
        # host-side env rotation is picked up on next restart.
        mkdir -p /home/runner/.runner-creds
        chown "$${runner_uid}:$${runner_gid}" /home/runner/.runner-creds
        install -o "$${runner_uid}" -g "$${runner_gid}" -m 0400 \
          /run/omnibase-operator.env /home/runner/.runner-creds/operator.env
        exec /usr/local/bin/entrypoint.sh
    environment:
      RUNNER_LABELS: self-hosted,omnibase-deploy,linux,x64
      RUNNER_NAME: omninode-deploy-runner
      # Org-scoped (OMN-18386), matching the live registration + the creds
      # volume entry re-seeded at that scope.
      GITHUB_ORG_URL: https://github.com/OmniNode-ai
      RUNNER_TOKEN: ${DEPLOY_RUNNER_TOKEN}
      # Org-scoped registration DOES take --runnergroup; the entrypoint passes
      # the flag for any non-empty value (see docker/runners/entrypoint.sh).
      # The group scopes repository access -- see the block above.
      RUNNER_GROUP: omnibase-deploy
      ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/runner-job-started.sh
      OMNI_HOME: ${DEPLOY_RUNNER_OMNI_HOME:?DEPLOY_RUNNER_OMNI_HOME must be set (private deploy-runner clone tree, e.g. /data/omninode/runner_omni_home)}
      # OMN-14958: the runtime_build scripts + deploy-runtime.sh need the
      # operator env (POSTGRES_PASSWORD etc.) for compose interpolation, but
      # this container's $HOME carries no ~/.omnibase/.env -- deploy run
      # 29977968728 crashed on exactly that.
      # OMN-14983: point the scripts at the root-phase-init COPY in the
      # runner-owned deploy-runner-creds volume, NOT at the raw
      # /run/omnibase-operator.env read-only mount below -- that mount stays
      # 0600 owned by the host operator uid and is unreadable by the `runner`
      # job user (uid 1001) once the entrypoint drops privilege. See the
      # entrypoint block above for the copy step (never point this at
      # /home/runner/.omnibase either -- its state/ subtree must stay
      # runner-writable for refresh receipts).
      OMNIBASE_OPERATOR_ENV_FILE: /home/runner/.runner-creds/operator.env
      # OMN-14958: health-gate/rollback-gate probes. Inside this container
      # localhost is the container itself, so the refresh scripts' default
      # http://localhost:18085|8085 probes die ECONNREFUSED and report a
      # false "lane unhealthy" STOP. host.docker.internal resolves to the
      # host-gateway (extra_hosts below), where the lane ports are published.
      LANE_PROBE_HOST: host.docker.internal
      # Defense-in-depth safe.directory for the 5 PRIVATE clones. The
      # load-bearing exemption is the scoped `git -c safe.directory=<clone>`
      # committed in the runtime_build scripts themselves (OMN-14900); this
      # env only covers stray git invocations outside those scripts.
      GIT_CONFIG_COUNT: "5"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${DEPLOY_RUNNER_OMNI_HOME:?}/omnibase_infra
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: ${DEPLOY_RUNNER_OMNI_HOME:?}/omnibase_core
      GIT_CONFIG_KEY_2: safe.directory
      GIT_CONFIG_VALUE_2: ${DEPLOY_RUNNER_OMNI_HOME:?}/omnibase_compat
      GIT_CONFIG_KEY_3: safe.directory
      GIT_CONFIG_VALUE_3: ${DEPLOY_RUNNER_OMNI_HOME:?}/onex_change_control
      GIT_CONFIG_KEY_4: safe.directory
      GIT_CONFIG_VALUE_4: ${DEPLOY_RUNNER_OMNI_HOME:?}/omnimarket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # PRIVATE clone tree at the identical host:container path. The shared
      # ${OMNI_HOME} bind is deliberately ABSENT (OMN-14900) -- do not re-add
      # it; that reopens the uid-mismatch write surface into clones this
      # runner does not own.
      - ${DEPLOY_RUNNER_OMNI_HOME:?}:${DEPLOY_RUNNER_OMNI_HOME:?}
      # OMN-14958: host operator env file, read-only, at a NEUTRAL path.
      # REQUIRED (fail-fast `:?`, same policy as DEPLOY_RUNNER_OMNI_HOME):
      # a silent default would let docker create a DIRECTORY at a bogus host
      # path and the scripts would crash later with a misleading error. Do
      # NOT mount this at /home/runner/.omnibase/.env -- docker would create
      # root-owned intermediate dirs there and break the runner-writable
      # ~/.omnibase/state receipt tree.
      # OMN-14983: this mount stays as the host owner's original 0600 perms
      # (deliberately -- never chmod/chgrp the host file). Only the
      # root-phase entrypoint init (which still runs as root/CAP_DAC_OVERRIDE)
      # reads it directly, to copy it into the runner-owned
      # /home/runner/.runner-creds/operator.env consumed by
      # OMNIBASE_OPERATOR_ENV_FILE above. The `runner` job user never reads
      # this path.
      - ${DEPLOY_RUNNER_OPERATOR_ENV_FILE:?DEPLOY_RUNNER_OPERATOR_ENV_FILE must be set (host path of the operator env file, e.g. /home/<operator>/.omnibase/.env)}:/run/omnibase-operator.env:ro
      - ./runners/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./runners/runner-job-started.sh:/usr/local/bin/runner-job-started.sh:ro
      - ./runners/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - deploy-runner-creds:/home/runner/.runner-creds
    # OMN-14958: host-gateway alias so LANE_PROBE_HOST=host.docker.internal
    # reaches the lane ports published on the host (18085/8085 etc.).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "984" # Match host Docker socket GID for DinD access
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # omninode-verify-runner-1 -- OMN-18408: dedicated runner for the scheduled
  # and per-merge VERIFY/CRON probes that were sharing the single
  # omninode-deploy-runner slot with the release-train DEPLOY jobs
  # (cut_release_train_tag.sh, refresh_stability_lane.sh, refresh_dev_lane.sh).
  #
  # WHY THIS EXISTS. Both families need `host.docker.internal` + docker.sock
  # read access to probe the lab lane, so both were pinned to `omnibase-deploy`
  # -- but the VERIFY jobs (dev-lane-liveness, dev-lane-staleness, the Chain
  # Canary, the MSK bastion canary, the k3s onex-lab overlay verify) run on a
  # schedule or on every merge, and a single runner serializes them behind
  # whatever DEPLOY job happens to be running. Measured 2026-09-15T20:00Z: 12
  # queued + 1 in-progress run on `[self-hosted, omnibase-deploy]` at once,
  # against one online runner, while the 88-runner `omnibase-ci` fleet sat
  # idle. `verify-lane-converged`/`verify-lab-overlay-converged` carry finite
  # job ceilings (30/35 min) a busy deploy runner eats directly out of.
  #
  # WHAT MOVED HERE, and ONLY this (OMN-18408, by explicit operator scope --
  # see docs/tracking/ROLLING_WORK_LEDGER.md OPERATOR-CONSENT row,
  # lane=deploy-runner-split-2005): dev-lane-liveness.yml/dev-lane-liveness,
  # dev-lane-staleness.yml/dev-lane-staleness, chain-canary.yml/Chain Canary
  # (dev lane), msk-bastion-canary.yml/MSK bastion routing canary,
  # runtime-rebuild-trigger.yml/verify-lab-overlay-converged. Deliberately NOT
  # moved: release-train-lab.yml cut-tag/deploy (DEPLOY, stays serialized per
  # CLAUDE.md rule 2a/12 -- same-lane redeploys never get a second runner),
  # runtime-rebuild-trigger.yml/verify-lane-converged,
  # runtime-rebuild-trigger-reusable.yml/verify-sibling-converged (the latter
  # is also called by omnimarket -- widening it needs its own decision),
  # baselines-scheduler.yml and dlq-depth-monitor.yml (none named in the
  # approved scope).
  #
  # WHAT IS DELIBERATELY ABSENT relative to omninode-deploy-runner, each line
  # load-bearing: no ${DEPLOY_RUNNER_OMNI_HOME} bind (no write access to the
  # private OMNI_HOME clone tree the deploy scripts mutate), no
  # DEPLOY_RUNNER_TOKEN / release-train git-safe.directory wiring, no write
  # surface into any compose lane. Pinned by
  # tests/ci/test_verify_runner_credential_read_only_omn18408.py, which also
  # carries a positive control against omninode-deploy-runner so the absence
  # cannot pass vacuously.
  #
  # WHAT IS DELIBERATELY PRESENT, matching omninode-deploy-runner exactly by
  # the same operator-consent row: docker.sock (the VERIFY jobs read container
  # revision labels and health endpoints off the host daemon -- this is a read
  # usage, not a compose-lane mutation path), the host-gateway alias
  # (LANE_PROBE_HOST=host.docker.internal), and the operator credentials
  # directory mounted read-only via the identical root-phase copy-in pattern
  # (none of the five moved jobs consumes it today, but the mount is present
  # for parity with the deploy runner rather than gated on today's callers).
  #
  # REGISTRATION reuses the EXISTING `omnibase-deploy` GitHub runner group
  # (visibility already covers omnibase_infra + omnimarket) rather than
  # creating a new org runner group -- group membership grants repository
  # visibility, the LABEL decides job routing, and the customer-plane pair
  # above already established this same reuse pattern against `omnibase-ci`.
  # DEPLOYING THIS SERVICE. Use the sanctioned scoped mode, never a hand-typed
  # compose command on the host and never the default fleet path:
  #
  #   bash scripts/deploy-runners.sh --add=omninode-verify-runner-1
  #
  # That rsyncs this file to the host, then runs `up -d --no-deps` for THIS
  # service with neither --force-recreate nor --remove-orphans, and waits until
  # this runner alone is online. The default path force-recreates the whole
  # project -- ~3h serialised across the 88-runner fleet (OMN-18188), with the
  # monitor's auto-bounce cron racing anything offline past 300s. `--rolling
  # --only=` (OMN-18415) is the wrong verb here and refuses by design: it
  # enumerates only general-pool runners and requires its target to be online
  # and idle first, which a container that does not exist yet can never be.
  # `--add` also exports DEPLOY_RUNNER_TOKEN from the org registration token it
  # mints, which is what this service interpolates -- shared with
  # omninode-deploy-runner because both register into the same runner group.
  omninode-verify-runner-1:
    image: omninode-runner:latest
    container_name: omninode-verify-runner-1
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 4g
    cpus: "1.0"
    pids_limit: 2048
    # Root-phase init identical in shape to omninode-deploy-runner's, minus the
    # OMNI_HOME ownership step (there is no OMNI_HOME bind here to own).
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        runner_uid="$$(id -u runner)"
        runner_gid="$$(id -g runner)"
        mkdir -p /home/runner/.runner-creds
        chown "$${runner_uid}:$${runner_gid}" /home/runner/.runner-creds
        install -o "$${runner_uid}" -g "$${runner_gid}" -m 0400 \
          /run/omnibase-operator.env /home/runner/.runner-creds/operator.env
        exec /usr/local/bin/entrypoint.sh
    environment:
      # `host-201` is load-bearing, not decoration: `omnibase-verify` names a
      # runner CLASS and a second verify-class runner already exists on another
      # lab host (omninode-mini-runner-1, arch-arm64, online 2026-09-16). The
      # five moved jobs probe THIS host's docker daemon and lane ports, so they
      # require both labels; a bare class match would place them where they can
      # observe nothing and report the lane unreachable.
      RUNNER_LABELS: self-hosted,omnibase-verify,host-201,linux,x64
      RUNNER_NAME: omninode-verify-runner-1
      GITHUB_ORG_URL: https://github.com/OmniNode-ai
      RUNNER_TOKEN: ${DEPLOY_RUNNER_TOKEN}
      RUNNER_GROUP: omnibase-deploy
      ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/runner-job-started.sh
      # Same reasoning as omninode-deploy-runner: inside this container
      # `localhost` is the container itself, not the lab host.
      LANE_PROBE_HOST: host.docker.internal
      OMNIBASE_OPERATOR_ENV_FILE: /home/runner/.runner-creds/operator.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Deliberately NO ${DEPLOY_RUNNER_OMNI_HOME} bind -- see the block
      # comment above.
      - ${DEPLOY_RUNNER_OPERATOR_ENV_FILE:?DEPLOY_RUNNER_OPERATOR_ENV_FILE must be set (host path of the operator env file, e.g. /home/<operator>/.omnibase/.env)}:/run/omnibase-operator.env:ro
      - ./runners/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./runners/runner-job-started.sh:/usr/local/bin/runner-job-started.sh:ro
      - ./runners/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - verify-runner-1-creds:/home/runner/.runner-creds
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "984" # Match host Docker socket GID for DinD access
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # ---------------------------------------------------------------------------
  # omninode-customer-plane-runner-1/2 -- OMN-18392: the credential-free pair.
  #
  # These two exist for ONE property: a job that runs here holds no platform
  # credential of any kind, so its refusals mean something. They carry the
  # `omnibase-customer-plane` label family, which NOTHING else in the org
  # targets, and they are deliberately NOT labelled `omnibase-ci` -- a general
  # CI job landing here would find no kubeconfig and fail closed at preflight,
  # which is the OMN-18188 failure mode in reverse.
  #
  # WHY THEY ARE NEW CONTAINERS RATHER THAN A RELABEL. The customer-plane
  # reachability probe (omninode_infra .github/workflows/
  # customer-plane-reachability-probe.yml) asserts the absence of eight
  # credential env vars and of a kubeconfig, then measures which internal
  # surfaces refuse a TCP connect from a customer's vantage. It was pinned to a
  # GitHub-hosted runner for exactly that identity, and the 2026-09-14 operator
  # ruling that private repositories never run on hosted runners left it dark.
  # The lab vantage carries the NETWORK half of that proof -- the roster names
  # only public edges, the lab resolver and 1.1.1.1 agree, and an unmodified
  # run from this host classified every leg identically to the hosted record.
  # It could not carry the IDENTITY half: all 88 `omninode-runner-N` containers
  # mount the lab credentials directory and export KUBECONFIG (OMN-18188), and
  # the probe's own absence step fails on that, correctly. Clearing the
  # variable while the file stayed mounted would be the green-gate-
  # asserting-nothing outcome that workflow's header warns about, so the
  # honest fix is a vantage that genuinely holds nothing.
  #
  # NOT A CANDIDATE, checked rather than assumed: `omninode-deploy-runner`
  # bind-mounts the host operator env file (POSTGRES_PASSWORD, GH_PAT,
  # LINEAR_API_KEY, Keycloak and Infisical credentials) and the docker socket,
  # and `omninode-gate-runner` is not a GitHub Actions runner at all -- it is
  # the bounded pre-push gate target from OMN-16295 and holds no registration.
  #
  # WHAT IS DELIBERATELY ABSENT, each line load-bearing:
  #   - no ${RUNNER_LAB_CREDENTIALS_HOST_DIR} mount  (the k3s reader token)
  #   - no KUBECONFIG                                (the probe checks this var)
  #   - no /var/run/docker.sock                      (the host daemon is the
  #     largest platform capability a runner can hold; the entrypoint's
  #     _fix_docker_socket_gid already no-ops when the socket is absent, and
  #     the disk-admission self-pause degrades to a logged skip)
  #   - no group_add for the docker GID              (nothing to join)
  # Pinned by tests/ci/test_customer_plane_runner_credential_free_omn18392.py,
  # which asserts each absence against the resolved compose config AND carries
  # a positive control proving a fleet runner still has all of them, so a
  # parsing regression cannot report the absences vacuously.
  #
  # CAPACITY. Two, not one: the probe runs four times a day on a schedule with
  # `cancel-in-progress: false`, and a single runner makes a recreate or a host
  # restart a total outage of criterion C4 rather than a degraded one. Two, not
  # more: nothing else targets this label, so idle capacity here is pure cost
  # against the 88-runner fleet's share of the host.
  #
  # CREATION IS ADDITIVE. These join the existing compose project by name; they
  # are created with `docker compose up -d --no-deps` naming exactly these two
  # services. Never `--force-recreate` and never `--remove-orphans` against
  # this file: a fleet-wide recreate costs about three hours and cannot be
  # parallelised (see the OMN-18188 note on the lab-credentials mount above).
  #
  # MONITORING (OMN-18396). runner-monitor.sh's main detection loop scopes
  # every check to services matching `^omninode-runner-[0-9]+$`, so this pair
  # is invisible to it. A dedicated, alert-only block added by OMN-18396
  # checks Docker + GitHub-registration status for exactly these two names and
  # feeds an outage into the same Slack alert path -- an offline
  # customer-plane runner is now paged, not only noticed by the reachability
  # probe failing to schedule. AUTO-BOUNCE remains OUT of scope: that block
  # never adds either name to `collect_remediation_targets()`'s input lists,
  # and `collect_remediation_targets()` itself still hard-filters on
  # `^omninode-runner-[0-9]+$`, so this pair cannot become a bounce target
  # through this monitor. Building real auto-bounce for this family (its own
  # expected-count bound, offline-age state, crash-loop/stuck-Created
  # detection) is a separate, larger change. Do not widen the general-pool
  # prefix regex, which would also pull `omninode-deploy-runner` in.
  omninode-customer-plane-runner-1:
    image: omninode-runner:latest
    container_name: omninode-customer-plane-runner-1
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 4g
    cpus: "1.0"
    pids_limit: 2048
    environment:
      RUNNER_LABELS: self-hosted,omnibase-customer-plane,linux,x64
      RUNNER_NAME: omninode-customer-plane-runner-1
      GITHUB_ORG_URL: https://github.com/OmniNode-ai
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_GROUP: omnibase-ci
      ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/runner-job-started.sh
      UV_CONCURRENT_DOWNLOADS: "1"
      UV_CONCURRENT_BUILDS: "1"
      UV_CONCURRENT_INSTALLS: "1"
      UV_HTTP_TIMEOUT: "600"
    volumes:
      - ./runners/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./runners/runner-job-started.sh:/usr/local/bin/runner-job-started.sh:ro
      - ./runners/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ${RUNNER_DISK_ADMISSION_PAUSE_HOST_DIR:-./state/disk-admission-pause}:/home/runner/.onex-disk-admission-pause
      - customer-plane-runner-1-creds:/home/runner/.runner-creds
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  omninode-customer-plane-runner-2:
    image: omninode-runner:latest
    container_name: omninode-customer-plane-runner-2
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 4g
    cpus: "1.0"
