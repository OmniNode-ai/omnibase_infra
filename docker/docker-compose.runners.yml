# docker-compose.runners.yml
# OmniNode self-hosted GitHub Actions runners
# Ticket: OMN-3276 / Epic: OMN-3273 | Scaled: OMN-3714 | Reconciled to live 48: OMN-12582 | Phase-A scale to 64: OMN-14029 | Saturation scale to 72: OMN-15978 | Reconciled to live 88: OMN-15978
#
# Runs the full steady-state runner fleet. The fleet count is owned by
# config/runner_fleet.yaml (expected_count). Each runner registers with GitHub
# org OmniNode-ai in the 'omnibase-ci' runner group.
#
# Prerequisites:
#   - Build the runner image first (OMN-3275):
#       scripts/ci/build_runner_image.sh --tag omninode-runner:latest
#   - Set RUNNER_TOKEN in environment or .env file
#       Generate at: https://github.com/organizations/OmniNode-ai/settings/actions/runners/new
#       Token is valid for 1 hour. After registration, entrypoint.sh caches credentials.
#
# Usage:
#   docker compose -f docker/docker-compose.runners.yml up -d
#   docker compose -f docker/docker-compose.runners.yml down
#   docker compose -f docker/docker-compose.runners.yml ps
#
# Validate config (checks mem_limit/cpus/pids_limit not silently dropped):
#   docker compose -f docker/docker-compose.runners.yml config
#
# HOST SYSCTL REQUIREMENT (192.168.86.201 Linux host):
# Large Python test suites trigger inotify exhaustion without this setting.
#
#   sudo sysctl -w fs.inotify.max_user_watches=524288
#   sudo sysctl -w fs.inotify.max_user_instances=1024
#
# To persist across reboots, add to /etc/sysctl.d/99-omninode-runners.conf:
#   fs.inotify.max_user_watches = 524288
#   fs.inotify.max_user_instances = 1024
#
# Verify: cat /proc/sys/fs/inotify/max_user_watches
#
# Resource allocation per runner (RTX 5090 host with ample RAM):
#   mem_limit: 6g     - per-runner memory limit (not a reservation); 88 runners
#                       share the host's 91 GB, peak usage ~24 GB observed live
#                       at 72 runners -- re-measure at 88 (residual, not blocking)
#   memswap_limit: 12g - bounded swap headroom for large CI spikes
#   cpus: "2.0"       - per-runner CFS quota (not a reservation); 88 runners
#                       share the host's 32 vCPUs (over-subscription tolerated)
#   pids_limit: 4096  - prevents fork bombs from runaway test processes
#
# NOTE: mem_limit/cpus/pids_limit are Compose v2 top-level resource keys.
# Do NOT use deploy.resources - those are Swarm-only and silently ignored here.
x-runner-base: &runner-base
  image: omninode-runner:latest
  restart: unless-stopped
  mem_limit: 6g
  memswap_limit: 12g
  cpus: "2.0"
  pids_limit: 4096
  environment: &runner-env
    RUNNER_LABELS: self-hosted,omnibase-ci,linux,x64
    GITHUB_ORG_URL: https://github.com/OmniNode-ai
    # OMN-18188 — lab k3s reachability for every runner in the fleet.
    # Points kubectl at the read-only kubeconfig bind-mounted below. All 88
    # runners share one label set (`RUNNER_LABELS` above), so `runs-on`
    # cannot target a subset that needs lab access -- fleet-wide is the only
    # option (the OMN-18188 finding). Without this, kubectl silently falls
    # back to localhost:8080 and every lab-cluster workflow step fails
    # closed at preflight. Environment is frozen at container creation, same
    # as the healthcheck definition below -- a recreate of all 88 runner
    # containers is required for this to take effect; a bind-mounted file
    # update alone does not change a live container's env.
    KUBECONFIG: /home/runner/.lab-credentials/lab-ci-reader.kubeconfig
    # OMN-18415 — HMAC signing key for local LLM inference calls, fleet-wide.
    #
    # WHY IT IS HERE. omniintelligence's `cli_review` (the Hostile Review
    # Gate's reviewer) calls the .201 inference endpoint through
    # omnibase_infra's MixinLlmHttpTransport, which HMAC-signs every request
    # with this key and fails CLOSED per model when it is absent
    # (ONEX_CORE_041_INVALID_CONFIGURATION). Until this line existed the key
    # was on no runner in the fleet, so every model call failed and the gate
    # reported a review it had never performed. The key is a MAPPING entry on
    # `&runner-env`, so unlike the volume mounts below it reaches all 60
    # services through each one's `!!merge <<: *runner-env` -- YAML merge keys
    # merge mappings, and only mappings.
    #
    # SCOPE. Fleet services only. `omninode-deploy-runner` and the two
    # `omninode-customer-plane-runner-N` services define their own
    # `environment:` blocks and do NOT merge this anchor, so they stay
    # credential-free (OMN-18392) with no exclusion needed here.
    #
    # WHERE THE VALUE COMES FROM. `docker/.env` on the runner host, mode 600,
    # owned by the operator -- the compose PROJECT DIRECTORY is the directory
    # of the first `-f` file, so compose loads it for every invocation against
    # this file regardless of cwd, including the runner-monitor auto-bounce
    # cron that recreates individual runners. That file is host-generated and
    # is NEVER rsynced from this repo (it is absent from deploy-runners.sh's
    # SYNC_PATHS), exactly as the lab credentials directory is. The value
    # itself is the existing `/shared/llm/` key registered in
    # config/shared_key_registry.yaml -- this wiring places an existing
    # credential, it does not mint or rotate one.
    #
    # FAIL-CLOSED ON PURPOSE. `:?` and not `:-`. An empty value would still
    # satisfy the transport's "is it set" check and produce a wrong signature,
    # which is a 401 with no named cause -- the same class of silent failure
    # this ticket exists to remove. An unset value therefore stops compose at
    # interpolation time, where the monitor's own preflight
    # (`docker compose config -q`) already blocks auto-repair and logs it,
    # rather than producing a runner that looks healthy and reviews nothing.
    #
    # Environment is frozen at container creation (same as the healthcheck
    # definition below): a container RECREATE is required for a change here to
    # take effect, and that roll is serial and busy-checked -- never a
    # fleet-wide `--force-recreate`.
    LOCAL_LLM_SHARED_SECRET: ${LOCAL_LLM_SHARED_SECRET:?LOCAL_LLM_SHARED_SECRET must be set for the omnibase-ci fleet (runner host docker/.env, mode 600) - see scripts/deploy-runners.sh CONSOLIDATED REQUIRED ENV VARS}
    # OMN-18415 — the OTHER half of the same fail-closed contract.
    #
    # `MixinLlmHttpTransport` rejects an outbound local LLM call before any HTTP
    # is attempted unless the destination falls inside this allowlist, and it
    # REFUSES TO DEFAULT it (`_parse_cidr_allowlist` raises when the variable is
    # unset, by design: a trust boundary nobody declared is not a boundary).
    # Provisioning only the signing key left the fleet failing on this instead,
    # three seconds later in the same call path and with the same
    # nothing-in-the-log symptom -- measured by reproducing the runner's exact
    # environment, not inferred.
    #
    # Not a secret: a network boundary declaration. It is still `:?` rather than
    # a literal default, because the library's own refusal to default it is the
    # behaviour being mirrored, and a host whose trust boundary differs must say
    # so rather than inherit this lab's. Value lives beside the signing key in
    # `docker/.env` on the runner host.
    LLM_ENDPOINT_CIDR_ALLOWLIST: ${LLM_ENDPOINT_CIDR_ALLOWLIST:?LLM_ENDPOINT_CIDR_ALLOWLIST must be set for the omnibase-ci fleet (runner host docker/.env) - the LLM transport refuses to default its own trust boundary}
    RUNNER_TOKEN: ${RUNNER_TOKEN}
    RUNNER_GROUP: omnibase-ci
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /usr/local/bin/runner-job-started.sh
    # OMN-14027 C3 — fleet-wide uv download stampede cap.
    # 88 runners NAT through one home uplink and share one anonymous egress
    # budget. The hardened setup-python-uv composite serializes downloads to 1 in
    # its OWN step, but the 18 workflows that bypass it (OMN-14193) run raw
    # `uv sync` at uv's built-in concurrency default — 64x in parallel — and
    # stampede the shared uplink, tripping the `uv sync` download timeouts that
    # OMN-14017 band-aids per-workflow. These fleet defaults give EVERY job
    # (composite AND raw-uv) a conservative ceiling and the 600s HTTP timeout the
    # composite already applies, so raw-uv paths inherit the protection too.
    #
    # Value is 1 (not the ticket's tuning target of 2) as the deliberate
    # pre-cache fail-safe: the composite path already pins `${...:-1}` = 1, so a
    # fleet default of 1 keeps that proven-safe path UNCHANGED while capping the
    # currently-uncapped raw-uv paths DOWN from uv's default. A fleet default of
    # 2 would loosen the composite path (1 -> 2) and double its download fan
    # under the same saturated uplink — a regression in exactly the failure
    # window this fix targets. Raise to 2 only after the C1 PyPI cache (below) is
    # active and measured (OMN-14027 rollout step 2 / acceptance metrics).
    UV_CONCURRENT_DOWNLOADS: "1"
    UV_CONCURRENT_BUILDS: "1"
    UV_CONCURRENT_INSTALLS: "1"
    UV_HTTP_TIMEOUT: "600"
    # OMN-14027 C1 — PyPI pull-through cache wiring (INERT until rollout).
    # DO NOT uncomment here. This block is shovel-ready but deliberately inert:
    # activating it fleet-wide is a soak-gated rollout action, and pointing the
    # fleet at a cache host that is not yet up would force every runner onto the
    # PyPI fallback. Per the OMN-14027 rollout, devpi is stood up first
    # (docker/docker-compose.pypi-cache.yml) and ONE canary runner is wired via
    # its own container env, leaving the other 71 on direct egress until the
    # canary is measured green. PyPI stays as the fallback index so a cache
    # miss/outage degrades, not fails-closed. Cache endpoint + activation steps:
    # config/runner_fleet.yaml (pypi_cache:) and
    # knowledge-base:runbooks/pypi-cache-egress-rollout.md.
    # UV_DEFAULT_INDEX: "http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/+simple/"
    # UV_INDEX_STRATEGY: "unsafe-best-match"
    # PIP_INDEX_URL: "http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/+simple/"
    # PIP_EXTRA_INDEX_URL: "https://pypi.org/simple/"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./runners/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    - ./runners/runner-job-started.sh:/usr/local/bin/runner-job-started.sh:ro
    - ./runners/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
    # OMN-16363 — disk-admission self-pause marker dir (host-durable, read-write).
    # A SINGLE shared host directory across all 88 runners; each container only
    # ever writes its own ${RUNNER_NAME} marker file inside it, so one bind mount
    # suffices (no per-runner subdirectory needed). Requires a container recreate
    # to take effect — see knowledge-base:runbooks/runner-disk-admission-gate.md rollout
    # section. Until recreated, docker/runners/runner-job-started.sh's
    # disk_admission_self_pause() fails open (no-op) on the missing mount; the
    # primary per-job admission gate is unaffected and needs no recreate.
    - ${RUNNER_DISK_ADMISSION_PAUSE_HOST_DIR:-./state/disk-admission-pause}:/home/runner/.onex-disk-admission-pause
    # OMN-18188 — read-only LAB CREDENTIALS DIRECTORY, fleet-wide.
    #
    # A DIRECTORY, not the single kubeconfig file it started as, and that is
    # the whole point of this revision. Mounting one file meant that adding any
    # second lab credential required editing this compose and recreating all 88
    # containers, and a recreate of this fleet costs about THREE HOURS: docker
    # compose serialises container stop and start no matter how many services
    # you name, so it cannot be parallelised, and it must skip any runner
    # currently executing a job rather than killing another lane's work. That
    # cost was paid once to learn it. Mounting the parent directory means the
    # next credential is a file drop on the host and no fleet change at all.
    #
    # What is in it today is the least-privilege `lab-ci-reader` k3s
    # ServiceAccount token -- never the node admin kubeconfig, which is
    # cluster-admin on the lab cluster and would be handed to every job in the
    # org. KUBECONFIG above points INTO this directory.
    #
    # Contents are host-generated secrets, not build artifacts, and are
    # deliberately excluded from deploy-runners.sh SYNC_PATHS so an rsync can
    # never overwrite them. `:ro` is load-bearing: no runner job may mutate a
    # lab credential.
    #
    # Ownership is NOT incidental. A bind mount shares the kernel's uid space
    # with no translation, and job steps run as the runner image's `runner`
    # user, uid 1001 -- so files here must be owned by 1001, not by the
    # operator. A file written 0600 as uid 1000 is unreadable to every job
    # while still being perfectly readable to `docker exec`, which defaults to
    # root. That asymmetry produced a green verification and a fleet on which
    # every workflow failed; see k8s/onex-lab-ci-rbac/ in omninode_infra.
    #
    # NOTE: like the disk-admission mount above, volumes are NOT inherited
    # by the per-service blocks below via the YAML merge key -- lists don't
    # merge, only mappings do (see the OMN-16363 precedent, which is
    # duplicated the same way). This line documents the shared shape; the
    # per-service `volumes:` blocks below carry the actual effective copy.
    - ${RUNNER_LAB_CREDENTIALS_HOST_DIR:-/home/jonah/.omnibase/runners/lab-credentials}:/home/runner/.lab-credentials:ro
  group_add:
    - "984" # Match host Docker socket GID for DinD access
  # OMN-12433 / OMN-13915: healthcheck proves BOTH the listener is alive AND
  # github.com is reachable, with _diag heartbeat freshness to catch dead
  # Runner.Listener processes. Healthcheck definitions are frozen at container creation,
  # so changing docker/runners/healthcheck.sh requires recreating the runner
  # containers; a bind-mounted file update alone does not change the live
  # container healthcheck command.
  healthcheck:
    test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
    interval: 30s
    timeout: 12s
    retries: 3
    start_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  omninode-runner-1:
    !!merge <<: *runner-base
    container_name: omninode-runner-1
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: omninode-runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./runners/runner-job-started.sh:/usr/local/bin/runner-job-started.sh:ro
      - ./runners/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
      - ${RUNNER_DISK_ADMISSION_PAUSE_HOST_DIR:-./state/disk-admission-pause}:/home/runner/.onex-disk-admission-pause
      - ${RUNNER_LAB_CREDENTIALS_HOST_DIR:-/home/jonah/.omnibase/runners/lab-credentials}:/home/runner/.lab-credentials:ro
      - runner-1-creds:/home/runner/.runner-creds
