#
# OMN-17232 -- the arch-neutral CI pool on the HP ProLiant DL560 Gen8 (h051).
#
# WHY IT EXISTS. The primary-host offload plan (task T2) moves CI capacity off the primary host one measured step at a time.
# Operator RULING 2026-10-29T14:00:26Z: make before break, so nothing on the primary host is stopped until its copy on
# the HP runs and validates. The primary host keeps every one of its runners.
#
# THE LABEL. RUNNER_LABELS carry the opt-in `omnibase-ci-multiarch` (config/runner_fleet.yaml, class `action-multiarch`)
# and NEVER `omnibase-ci`. Only a job that moved to `runs-on: [self-hosted, omnibase-ci-multiarch]` -- arch-neutral
# pytest, mypy, lint, node scripts -- can land here. The opt-in is the guard: this CPU has no AVX2, and a job that imports
# a wheel built for it died here with SIGILL (exit 132 on the `pedalboard` import in a private repository's unit tests, measured
# 2026-10-29), so every such job stays on `[self-hosted, omnibase-ci]`. `hp-canary` stays as the pool's own pin label
# (the relabel roll is additive); it is not a production label and no workflow names it.
#
# SAME RUNNER, OTHER HOST. The anchors below are docker-compose.runners-omnipc2-ci-runner.yml's, with these changes,
# each deliberate:
#   - ONEX_LANE_HOST is h051 (the host's row of the lab host table), the docker GID is 988 (read on the host), and
#     the per-runner caches, job workspaces and TMPDIR sit under /data/scratch on the data logical volume (ext4
#     on the Smart Array RAID 5, mounted /data), so job IO stays off the boot volume.
#   - its own container, runner and volume names (hp051-ci-runner-N) and its own compose project
#     (`-p hp051-ci-runner`), so nothing collides with another host's runner and the fleet probe can tell the hosts
#     apart by prefix.
#   - the pool sits in omnirunners.slice, installed from docker/runners/systemd/pools/hp051-ci-runner/, sized from
#     the T0 reads (80 threads, 377 GiB, no AVX2) so CI yields to the OS and to the lanes that follow.
#   - the pool has its own git mirror (OMN-14027 C2 on this host). The runners' checkout pre-seed reads its default
#     mirror address, which is this compose project's bridge gateway on h051 (read 2026-10-30), so no env
#     changes; the daemon, the refresh service and its timer are the three units beside the slice, with the bare
#     mirrors under /data/scratch/git-mirror (off the boot volume) and the daemon's listen address in the host file
#     /etc/default/omninode-git-mirror. The pre-seed is fail-open: without the mirror a
#     job cold-clones from github.com and passes.
#
# DEPLOYING. From a machine with ssh to the host (ssh alias h051) and org-admin gh:
#   scripts/deploy-runners.sh --host=h051 [--limit=N]
# Runners already registered move to the label above with:
#   scripts/deploy-runners.sh --host=h051 --relabel
# The slice and mirror units are not installed by that script for a host row (only for a `pools:` entry), so install
# them once by hand and read them back:
#   scripts/deploy-runners.sh --host=h051 --skip-build
# (run the deploy first: it creates hp051-ci-runner_default before the gateway is read below).
#   sudo install -m 0644 docker/runners/systemd/pools/hp051-ci-runner/{omnirunners.slice,omninode-git-mirror-daemon.service,omninode-git-mirror-refresh.service,omninode-git-mirror-refresh.timer} /etc/systemd/system/
#   sudo install -d -o jonah -g jonah /data/scratch/git-mirror
#   echo "OMNI_GIT_MIRROR_LISTEN=$(docker network inspect hp051-ci-runner_default -f '{{(index .IPAM.Config 0).Gateway}}')" | sudo tee /etc/default/omninode-git-mirror
#   sudo systemctl daemon-reload && sudo systemctl enable --now omnirunners.slice omninode-git-mirror-refresh.timer omninode-git-mirror-daemon.service
# If the compose network is deleted and recreated, regenerate the environment file from network inspect above and
# restart the daemon. Its preflight refuses an unassigned old gateway and keeps retrying; it never falls back to a wildcard.
# (the refresh script is rsynced by deploy-runners.sh to ~/.omnibase/runners/docker/runners/git-mirror-refresh.sh).
# Before the first recreate, on the host: create /data/scratch/runners/<N>/{work,tmp} and
# /data/scratch/cache/runners/<N>/{pip,pre-commit,pnpm,ms-playwright,ci-envs,npm}, owned by uid 1001 (tmp mode 1777),
# and put LOCAL_LLM_SHARED_SECRET, LLM_ENDPOINT_CIDR_ALLOWLIST and RUNNER_LAB_HOST_TABLE in ~/.omnibase/runners/docker/.env (mode 600).
# OMN-18829: the same host-owned declaration is read by native jobs and CI.
# Refuse container creation when it is absent; never create an empty directory.
x-lab-host-table: &lab-host-table
  type: bind
  source: ${RUNNER_LAB_HOST_TABLE:?RUNNER_LAB_HOST_TABLE must name the host's lab host table file (runner host docker/.env)}
  target: /etc/onex/lab_run_hosts.yaml
  read_only: true
  bind:
    create_host_path: false
# Long-form bind mounts keep variable defaults out of Compose's short-volume parser.
# This also lets `compose config --no-interpolate` validate the shipped declaration.
x-runner-disk-admission-pause: &runner-disk-admission-pause
  type: bind
  source: ${RUNNER_DISK_ADMISSION_PAUSE_HOST_DIR:-./state/disk-admission-pause}
  target: /home/runner/.onex-disk-admission-pause
  bind:
    create_host_path: true
x-runner-lab-credentials: &runner-lab-credentials
  type: bind
  source: ${RUNNER_LAB_CREDENTIALS_HOST_DIR:-/home/jonah/.omnibase/runners/lab-credentials}
  target: /home/runner/.lab-credentials
  read_only: true
  bind:
    create_host_path: true
x-runner-base: &runner-base
  image: omninode-runner:latest
  restart: unless-stopped
  mem_limit: 6g
  # This is a per-container upper bound (RAM plus swap). The parent slice's 2G swap cap is shared by all four
  # runners, so aggregate swap can never reach four times this allowance. The 96G/112G parent RAM bounds leave
  # room for docker-socket job containers in the slice; the four runner containers themselves total at most 24G.
  memswap_limit: 12g
  cpus: "2.0"
  pids_limit: 4096
  cgroup_parent: omnirunners.slice
  environment: &runner-env
    # OMN-18829: the host row, not the container install identity, owns lab delegations.
    ONEX_LANE_HOST: h051
    ONEX_LAB_RUN_HOSTS: /etc/onex/lab_run_hosts.yaml
    RUNNER_LABELS: self-hosted,omnibase-ci-multiarch,hp-canary,linux,x64,arch-amd64
    GITHUB_ORG_URL: https://github.com/OmniNode-ai
    KUBECONFIG: /home/runner/.lab-credentials/lab-ci-reader.kubeconfig
    LOCAL_LLM_SHARED_SECRET: ${LOCAL_LLM_SHARED_SECRET:?LOCAL_LLM_SHARED_SECRET must be set for the omnibase-ci fleet (runner host docker/.env, mode 600) - see scripts/deploy-runners.sh CONSOLIDATED REQUIRED ENV VARS}
    LLM_ENDPOINT_CIDR_ALLOWLIST: ${LLM_ENDPOINT_CIDR_ALLOWLIST:?LLM_ENDPOINT_CIDR_ALLOWLIST must be set for the omnibase-ci fleet (runner host docker/.env) - the LLM transport refuses to default its own trust boundary}
    RUNNER_TOKEN: ${RUNNER_TOKEN}
    RUNNER_GROUP: omnibase-ci
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /opt/onex-runner-hooks/runner-job-started.sh
    UV_CONCURRENT_DOWNLOADS: "1"
    UV_CONCURRENT_BUILDS: "1"
    UV_CONCURRENT_INSTALLS: "1"
    UV_HTTP_TIMEOUT: "600"
    # OMN-19998: the uv cache lives INSIDE the job-workspace mount (/data/scratch/runners/<N>/work),
    # so uv hardlinks wheel contents into a venv instead of copying them. See the header.
    UV_CACHE_DIR: /home/runner/actions-runner/_work/.uv-cache
    TMPDIR: /home/runner/tmp
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./runners:/opt/onex-runner-hooks:ro
    - *runner-disk-admission-pause
    - *runner-lab-credentials
    - *lab-host-table
  group_add:
    - "988" # h051 docker group GID (getent group docker on the host, read 2026-10-29)
  healthcheck:
    test: ["CMD-SHELL", "/opt/onex-runner-hooks/healthcheck.sh"]
    interval: 30s
    timeout: 12s
    retries: 3
    start_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  hp051-ci-runner-1:
    !!merge <<: *runner-base
    container_name: hp051-ci-runner-1
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp051-ci-runner-1
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - /data/scratch/cache/runners/1/pip:/home/runner/.cache/pip
      - /data/scratch/cache/runners/1/pre-commit:/home/runner/.cache/pre-commit
      - /data/scratch/cache/runners/1/pnpm:/home/runner/.cache/pnpm
      - /data/scratch/cache/runners/1/ms-playwright:/home/runner/.cache/ms-playwright
      - /data/scratch/cache/runners/1/ci-envs:/home/runner/.cache/omni/ci-envs
      - /data/scratch/cache/runners/1/npm:/home/runner/.npm
      - /data/scratch/runners/1/work:/home/runner/actions-runner/_work
      - /data/scratch/runners/1/tmp:/home/runner/tmp
      - hp051-ci-runner-1-creds:/home/runner/.runner-creds
  hp051-ci-runner-2:
    !!merge <<: *runner-base
    container_name: hp051-ci-runner-2
    environment:
      !!merge <<: *runner-env
