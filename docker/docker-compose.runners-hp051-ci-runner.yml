      - *runner-lab-credentials
      - *lab-host-table
      - /data/scratch/cache/runners/2/pip:/home/runner/.cache/pip
      - /data/scratch/cache/runners/2/pre-commit:/home/runner/.cache/pre-commit
      - /data/scratch/cache/runners/2/pnpm:/home/runner/.cache/pnpm
      - /data/scratch/cache/runners/2/ms-playwright:/home/runner/.cache/ms-playwright
      - /data/scratch/cache/runners/2/ci-envs:/home/runner/.cache/omni/ci-envs
      - /data/scratch/cache/runners/2/npm:/home/runner/.npm
      - /data/scratch/runners/2/work:/home/runner/actions-runner/_work
      - /data/scratch/runners/2/tmp:/home/runner/tmp
      - hp051-ci-runner-2-creds:/home/runner/.runner-creds
  hp051-ci-runner-3:
    !!merge <<: *runner-base
    container_name: hp051-ci-runner-3
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp051-ci-runner-3
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - /data/scratch/cache/runners/3/pip:/home/runner/.cache/pip
      - /data/scratch/cache/runners/3/pre-commit:/home/runner/.cache/pre-commit
      - /data/scratch/cache/runners/3/pnpm:/home/runner/.cache/pnpm
      - /data/scratch/cache/runners/3/ms-playwright:/home/runner/.cache/ms-playwright
      - /data/scratch/cache/runners/3/ci-envs:/home/runner/.cache/omni/ci-envs
      - /data/scratch/cache/runners/3/npm:/home/runner/.npm
      - /data/scratch/runners/3/work:/home/runner/actions-runner/_work
      - /data/scratch/runners/3/tmp:/home/runner/tmp
      - hp051-ci-runner-3-creds:/home/runner/.runner-creds
  hp051-ci-runner-4:
    !!merge <<: *runner-base
    container_name: hp051-ci-runner-4
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp051-ci-runner-4
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - /data/scratch/cache/runners/4/pip:/home/runner/.cache/pip
      - /data/scratch/cache/runners/4/pre-commit:/home/runner/.cache/pre-commit
      - /data/scratch/cache/runners/4/pnpm:/home/runner/.cache/pnpm
      - /data/scratch/cache/runners/4/ms-playwright:/home/runner/.cache/ms-playwright
      - /data/scratch/cache/runners/4/ci-envs:/home/runner/.cache/omni/ci-envs
      - /data/scratch/cache/runners/4/npm:/home/runner/.npm
      - /data/scratch/runners/4/work:/home/runner/actions-runner/_work
      - /data/scratch/runners/4/tmp:/home/runner/tmp
      - hp051-ci-runner-4-creds:/home/runner/.runner-creds
volumes:
  hp051-ci-runner-1-creds:
    name: hp051-ci-runner-1-creds
  hp051-ci-runner-2-creds:
    name: hp051-ci-runner-2-creds
  hp051-ci-runner-3-creds:
    name: hp051-ci-runner-3-creds
  hp051-ci-runner-4-creds:
    name: hp051-ci-runner-4-creds
