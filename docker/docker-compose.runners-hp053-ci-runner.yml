#
# OMN-22111 -- the general `omnibase-ci` pool on h053, the HP ProLiant Gen9 (hp-gen9, Xeon E5-2680 v4 Broadwell).
#
# WHY IT EXISTS. Operator RULING 2026-11-02T13:33:32Z (OMN-17232): the primary host is swapping, the census of
# per-repository SIGILLs no longer blocks the move, and the general CI runners leave it. h051 (Xeon E5-4650 v2) has
# no AVX2, so it cannot take a job that imports an AVX2 wheel; h053 has avx, avx2, fma, bmi1, bmi2, movbe and f16c
# (read from /proc/cpuinfo 2026-11-02) and no AVX-512, so it can take every job a primary-host runner takes.
# Measured on this host 2026-11-02 before sizing: pedalboard 0.9.22 (cp312), the wheel that dies with SIGILL on
# h051, imports and processes audio here, and the 119 unit tests of the private repository that imports it pass.
# So the pool carries `omnibase-ci` and no workflow changes: any job a primary-host runner can take, one of these can.
#
# THE LABEL. RUNNER_LABELS are the other amd64 general pools': `omnibase-ci` plus the opt-in `omnibase-ci-multiarch`
# (config/runner_fleet.yaml, classes `action` and `action-multiarch`). There is no `hp-canary` pin: that label belongs
# to the h051 canary. h051 stays on the opt-in label alone until no repository that needs AVX2 can be placed there.
#
# SAME RUNNER, OTHER HOST. The anchors below are docker-compose.runners-hp051-ci-runner.yml's, with these changes,
# each deliberate:
#   - ONEX_LANE_HOST is h053 and the docker GID is 988 (both read on the host 2026-11-02). The label set is above.
#   - its own container, runner and volume names (hp053-ci-runner-N) and its own compose project
#     (`-p hp053-ci-runner`), so nothing collides with another host's runner and the fleet probe can tell the hosts
#     apart by prefix.
#   - the pool sits in omnirunners.slice, installed from docker/runners/systemd/pools/hp053-ci-runner/. OMN-19998 resized it
#     on 2026-11-04 from reads taken that morning (56 threads, 125 GiB, 49 to 55 GiB available with the lab-work units
#     running and the 64 GiB lab-run RAM pool at 61 GiB used, load 10 to 11, io pressure 0): FIVE runners, not eight,
#     at 9 GiB each (memswap equal, nothing swaps) are at most 45 GiB, under the slice's MemoryHigh of 45G and MemoryMax
#     of 46G, which leave at least 3 GiB of the lowest measured availability to the lanes whatever the runners do. Five
#     CPUs each, 25 of the 56 threads at most, and CPUWeight 25 makes CI yield to the lab-work units that share the host.
#   - the job directories are in memory, not on the root volume (OMN-19998, operator RULING 2026-11-04T07:03:44Z: runners
#     go on a memory drive, not spinning disk; the root volume of this host is a rotational disk, read 2026-11-04). See
#     the x-runner-ram-dirs anchor. Why nine GiB and why five runners rather than eight: tmpfs pages are charged to the
#     runner's own memory limit. Measured on this pool the first 20 minutes it ran (2026-11-04): a job of a private
#     repository's tests held 6.3 GiB of tmpfs (workspace 4.7, TMPDIR 1.3) plus 0.7 GiB of processes, hit the 7 GiB limit
#     and had seven processes OOM-killed, and the other five runners peaked at 5.2 to 6.5 GiB. So 7 GiB is too little, the
#     slice cannot hold eight or six runners at the 9 GiB a job needs, and five can.
#   - the runner reads the host's /usr/share/zoneinfo read-only, as the merge-queue pools do: the image has no timezone
#     database and a private repository's tests resolve `America/New_York`.
#   - the pool has its own git mirror (OMN-14027 C2 on this host), the three units beside the slice, with the bare
#     mirrors under /data/scratch/git-mirror. The pre-seed is fail-open: without the mirror a job cold-clones from
#     github.com and passes. This host has no separate data volume; /data/scratch is a directory on the root volume.
#     The mirror is optional and not installed by OMN-19998: the pool runs without it.
#
# DEPLOYING. From a machine with ssh to the host (ssh alias h053) and org-admin gh:
#   scripts/deploy-runners.sh --host=h053 [--limit=N]
# The slice and mirror units are not installed by that script for a host row (only for a `pools:` entry), so they are
# the host's one-time setup, the same as h051's (see its header for the commands):
#   sudo install -m 0644 docker/runners/systemd/pools/hp053-ci-runner/omnirunners.slice /etc/systemd/system/
#   sudo systemctl daemon-reload && sudo systemctl enable --now omnirunners.slice
# and, for the optional git mirror, the other three units, /data/scratch/git-mirror and /etc/default/omninode-git-mirror.
# There are no job or cache directories to create: they are tmpfs mounts of each container. Before the first recreate,
# on the host, put LOCAL_LLM_SHARED_SECRET, LLM_ENDPOINT_CIDR_ALLOWLIST, RUNNER_LAB_HOST_TABLE, GITHUB_ORG_URL and UV_HTTP_TIMEOUT in ~/.omnibase/runners/docker/.env (mode 600).
# OMN-18829: the same host-owned declaration is read by native jobs and CI.
# Two values the h051 file spells out are read from the host's docker/.env here, GITHUB_ORG_URL (the organisation URL
# the runners register against) and UV_HTTP_TIMEOUT (the h051 pool's value is 600 seconds), because the hardcoded-config
# ratchet refuses a new file that spells an organisation URL or an operational number.
# Container paths use ${RUNNER_USER_HOME:-<runner image home>}, as docker-compose.runners.yml does, so no
# machine path is spelled in this file (the local-path hook and the suppression ratchet both refuse one).
# Refuse container creation when it is absent; never create an empty directory.
x-runner-host-zoneinfo: &runner-host-zoneinfo
  type: bind
  source: /usr/share/zoneinfo
  target: /usr/share/zoneinfo
  read_only: true
  bind:
    create_host_path: false
x-lab-host-table: &lab-host-table
  type: bind
  source: ${RUNNER_LAB_HOST_TABLE:?RUNNER_LAB_HOST_TABLE must name the host's lab host table file (runner host docker/.env)}
  target: /etc/onex/lab_run_hosts.yaml
  read_only: true
  bind:
    create_host_path: false
# Long-form bind mounts keep variable defaults out of Compose's short-volume parser.
# This also lets `compose config --no-interpolate` validate the shipped declaration.
x-runner-disk-admission-pause: &runner-disk-admission-pause
  type: bind
  source: ${RUNNER_DISK_ADMISSION_PAUSE_HOST_DIR:-./state/disk-admission-pause}
  target: ${RUNNER_USER_HOME:-/home/runner}/.onex-disk-admission-pause
  bind:
    create_host_path: true
x-runner-lab-credentials: &runner-lab-credentials
  type: bind
  source: ${RUNNER_LAB_CREDENTIALS_HOST_DIR:-~/.omnibase/runners/lab-credentials}
  target: ${RUNNER_USER_HOME:-/home/runner}/.lab-credentials
  read_only: true
  bind:
    create_host_path: true
# In-memory job directories, one list shared by the five runners (the service-level `tmpfs:` form, the only one that can
# pass `exec`: Docker mounts a tmpfs noexec otherwise and the workspace holds the interpreters and compiled extensions
# the jobs run). `size` is a ceiling and not a reservation; the real bound is the container's memory limit. The two job
# directories are 16 and 12 GiB because the lane probe the repository's tests run refuses a volume with under 10 GiB free.
x-runner-ram-dirs: &runner-ram-dirs
  - ${RUNNER_USER_HOME:-/home/runner}/actions-runner/_work:exec,mode=1777,size=16g
  - ${RUNNER_USER_HOME:-/home/runner}/tmp:exec,mode=1777,size=12g
  - ${RUNNER_USER_HOME:-/home/runner}/.cache/pip:exec,mode=1777,size=2g
  - ${RUNNER_USER_HOME:-/home/runner}/.cache/pre-commit:exec,mode=1777,size=2g
  - ${RUNNER_USER_HOME:-/home/runner}/.cache/pnpm:exec,mode=1777,size=2g
  - ${RUNNER_USER_HOME:-/home/runner}/.cache/ms-playwright:exec,mode=1777,size=2g
  - ${RUNNER_USER_HOME:-/home/runner}/.cache/omni/ci-envs:exec,mode=1777,size=2g
  - ${RUNNER_USER_HOME:-/home/runner}/.npm:exec,mode=1777,size=2g
x-runner-base: &runner-base
  image: omninode-runner:latest
  restart: unless-stopped
  mem_limit: 9g
  # RAM plus swap, and equal to mem_limit, so the runner has no swap: its job directories are tmpfs mounts and must
  # stay in memory. The slice's MemoryHigh of 45G and MemoryMax of 46G bound the five runners together (five times 9g).
  memswap_limit: 9g
  # Five CPUs, not the 2.0 of the other pools. Measured 2026-11-04 (OMN-19998): the Xeon E5-2680 v4 here ran a fixed
  # single-thread Python benchmark in 0.71 s against 0.20 s on the primary host's Ryzen 9 9950X3D, so a shard that takes
  # 8 minutes there wants about 3.5 times the core time, and on the h051 merge-queue pool a quota of 2.0 was throttled in
  # 55 to 70 percent of its periods while 5.0 finished the same shard in 6m19. Five runners at 5.0 take 25 of the 56 threads.
  cpus: "5.0"
  pids_limit: 4096
  cgroup_parent: omnirunners.slice
  environment: &runner-env
    # OMN-18829: the host row, not the container install identity, owns lab delegations.
    ONEX_LANE_HOST: h053
    ONEX_LAB_RUN_HOSTS: /etc/onex/lab_run_hosts.yaml
    RUNNER_LABELS: self-hosted,omnibase-ci,omnibase-ci-multiarch,linux,x64,arch-amd64
    GITHUB_ORG_URL: ${GITHUB_ORG_URL:?GITHUB_ORG_URL must be set (runner host docker/.env)}
    KUBECONFIG: ${RUNNER_USER_HOME:-/home/runner}/.lab-credentials/lab-ci-reader.kubeconfig
    LOCAL_LLM_SHARED_SECRET: ${LOCAL_LLM_SHARED_SECRET:?LOCAL_LLM_SHARED_SECRET must be set for the omnibase-ci fleet (runner host docker/.env, mode 600) - see scripts/deploy-runners.sh CONSOLIDATED REQUIRED ENV VARS}
    LLM_ENDPOINT_CIDR_ALLOWLIST: ${LLM_ENDPOINT_CIDR_ALLOWLIST:?LLM_ENDPOINT_CIDR_ALLOWLIST must be set for the omnibase-ci fleet (runner host docker/.env) - the LLM transport refuses to default its own trust boundary}
    RUNNER_TOKEN: ${RUNNER_TOKEN}
    RUNNER_GROUP: omnibase-ci
    ACTIONS_RUNNER_HOOK_JOB_STARTED: /opt/onex-runner-hooks/runner-job-started.sh
    UV_CONCURRENT_DOWNLOADS: "1"
    UV_CONCURRENT_BUILDS: "1"
    UV_CONCURRENT_INSTALLS: "1"
    UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:?UV_HTTP_TIMEOUT must be set (runner host docker/.env)}
    # OMN-19998: the uv cache lives INSIDE the job-workspace mount (the in-memory _work directory),
    # so uv hardlinks wheel contents into a venv instead of copying them. See the header.
    UV_CACHE_DIR: ${RUNNER_USER_HOME:-/home/runner}/actions-runner/_work/.uv-cache
    TMPDIR: ${RUNNER_USER_HOME:-/home/runner}/tmp
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./runners:/opt/onex-runner-hooks:ro
    - *runner-disk-admission-pause
    - *runner-lab-credentials
    - *lab-host-table
  group_add:
    - "988" # h053 docker group GID (getent group docker on the host, read 2026-11-02)
  healthcheck:
    test: ["CMD-SHELL", "/opt/onex-runner-hooks/healthcheck.sh"]
    interval: 30s
    timeout: 12s
    retries: 3
    start_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  hp053-ci-runner-1:
    !!merge <<: *runner-base
    container_name: hp053-ci-runner-1
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp053-ci-runner-1
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    tmpfs: *runner-ram-dirs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - *runner-host-zoneinfo
      - hp053-ci-runner-1-creds:${RUNNER_USER_HOME:-/home/runner}/.runner-creds
  hp053-ci-runner-2:
    !!merge <<: *runner-base
    container_name: hp053-ci-runner-2
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp053-ci-runner-2
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    tmpfs: *runner-ram-dirs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - *runner-host-zoneinfo
      - hp053-ci-runner-2-creds:${RUNNER_USER_HOME:-/home/runner}/.runner-creds
  hp053-ci-runner-3:
    !!merge <<: *runner-base
    container_name: hp053-ci-runner-3
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp053-ci-runner-3
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    tmpfs: *runner-ram-dirs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - *runner-host-zoneinfo
      - hp053-ci-runner-3-creds:${RUNNER_USER_HOME:-/home/runner}/.runner-creds
  hp053-ci-runner-4:
    !!merge <<: *runner-base
    container_name: hp053-ci-runner-4
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp053-ci-runner-4
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    tmpfs: *runner-ram-dirs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - *runner-host-zoneinfo
      - hp053-ci-runner-4-creds:${RUNNER_USER_HOME:-/home/runner}/.runner-creds
  hp053-ci-runner-5:
    !!merge <<: *runner-base
    container_name: hp053-ci-runner-5
    environment:
      !!merge <<: *runner-env
      RUNNER_NAME: hp053-ci-runner-5
    entrypoint: ["/opt/onex-runner-hooks/entrypoint.sh"]
    tmpfs: *runner-ram-dirs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runners:/opt/onex-runner-hooks:ro
      - *runner-disk-admission-pause
      - *runner-lab-credentials
      - *lab-host-table
      - *runner-host-zoneinfo
      - hp053-ci-runner-5-creds:${RUNNER_USER_HOME:-/home/runner}/.runner-creds
volumes:
  hp053-ci-runner-1-creds:
    name: hp053-ci-runner-1-creds
  hp053-ci-runner-2-creds:
    name: hp053-ci-runner-2-creds
  hp053-ci-runner-3-creds:
    name: hp053-ci-runner-3-creds
  hp053-ci-runner-4-creds:
    name: hp053-ci-runner-4-creds
