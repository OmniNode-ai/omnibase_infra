      - /mnt/h053-nvme/runners/hp053-ci-runner/1/cache/pip:${RUNNER_USER_HOME:-/home/runner}/.cache/pip
      - /mnt/h053-nvme/runners/hp053-ci-runner/1/cache/pre-commit:${RUNNER_USER_HOME:-/home/runner}/.cache/pre-commit
