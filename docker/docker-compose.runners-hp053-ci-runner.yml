      - /data/scratch/cache/runners/1/pre-commit:${RUNNER_USER_HOME:-/home/runner}/.cache/pre-commit
      - /data/scratch/cache/runners/1/pnpm:${RUNNER_USER_HOME:-/home/runner}/.cache/pnpm
