  projection-api:
    !!merge <<: *runtime-base
    container_name: omnimarket-lakshman-projection-api
    command: ["omnimarket-projection-api"]
    depends_on:
      migration-gate:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      !!merge <<: *lakshman-runtime-env
      RUNTIME_PROFILE: projection-api
      OTEL_SERVICE_NAME: omnimarket-lakshman-projection-api
      BIFROST_CONTRACT_PATH: ""
      # Mirrors the BIFROST_CONTRACT_PATH opt-out: no render, no overlay pin.
      BIFROST_LANE_OVERLAY_PATH: ""
      # The projection API serves materialized read models and never invokes the
      # delegation routing reducer. Kept explicit so a layered render cannot
      # inherit the runtime anchor's routing-tiers path.
      DELEGATION_ROUTING_TIERS_PATH: ""
    ports: !override
      - "${LAKSHMAN_PROJECTION_API_PORT:-53002}:3002"
    volumes:
      - ../contracts:/app/contracts:ro
      - ${OMNICLAUDE_SKILLS_DIR:?OMNICLAUDE_SKILLS_DIR must point to the host skills directory}:/app/skills:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "com.omninode.lane=lakshman"
      - "com.omninode.ticket=OMN-17150"
      - "com.omninode.lane.class=collaborator"
      - "com.omninode.service=projection-api"
  # OMN-13772 / OMN-13581 defence-in-depth. This file is designed to be run
  # STANDALONE (`-f docker/docker-compose.lakshman.yml`), and no sanctioned tool
  # layers it — `scripts/deploy-runtime.sh` does not know this lane, deliberately
  # (see the governance note in this file's header). But the base infra compose
  # defines keycloak and infisical with NO compose profile, so if anyone ever
  # renders `-f docker-compose.infra.yml -f docker-compose.lakshman.yml` the two
  # would activate under THIS project name, attached to the DEV network with DEV
  # container names — the cross-lane displacement class OMN-13581 is named for.
  # Forcing them behind a never-enabled profile costs nothing (inactive-profile
  # stubs are dropped from a standalone render) and removes the foot-gun.
  keycloak:
    profiles: !override ["lakshman-disabled"]
  infisical:
    profiles: !override ["lakshman-disabled"]
networks:
  omnibase-infra-lakshman-network:
    name: omnibase-infra-lakshman-network
    driver: bridge
volumes:
  # Correction (a): every volume is namespaced to this lane, so a
  # profile-scoped teardown with volume removal wipes this lane's state and
  # nothing else on the host.
  lakshman_postgres_data:
    name: omnibase-infra-lakshman-postgres-data
  lakshman_redpanda_data:
    name: omnibase-infra-lakshman-redpanda-data
  lakshman_valkey_data:
    name: omnibase-infra-lakshman-valkey-data
  lakshman_runtime_logs:
    name: omninode-lakshman-runtime-logs
  lakshman_runtime_data:
    name: omninode-lakshman-runtime-data
  lakshman_effects_logs:
    name: omninode-lakshman-effects-logs
  lakshman_effects_data:
    name: omninode-lakshman-effects-data
