# ONEX Node Contract
# Node: NodeDlqReplayEffect
#
# Contract-native replacement for the manual DLQ replay CLI
# (scripts/dlq_replay.py). Consumes onex.dlq.omnibase-infra.<category>.v1 from a persistent
# consumer group (onex-dlq-replay), replays eligible messages to their original
# topic, and quarantines non-replayable messages to onex.dlq.omnibase-infra.quarantine.v1
# instead of the legacy skip-and-drop path that silently lost messages.
#
# Related Tickets:
#   - OMN-12619: contract-native DLQ replay node + quarantine
#   - OMN-12618: Divergent Transport & Runtime Convergence (epic)
#   - OMN-18084: the replay path never publishes onto a dead-letter topic --
#     nested dead letters are unwrapped to their innermost real original
#     topic and replayed once there, or terminalised to quarantine.
#   - OMN-18119: the node declared THREE subscribe topics and drained one --
#     the kernel keys dependencies by handler name, so all three per-topic
#     dispatcher entries shared one DLQConsumer bound to the events topic.
#   - OMN-18111: the node recorded ZERO terminal outcomes in dlq_replay_history
#     because the runtime never supplied the `tracking` dependency this
#     contract declares, and the unparseable-record path never called the
#     recorder at all.
#   - OMN-17896: the drain refuses a DLQ record whose original body cannot be
#     established rather than inventing an empty one (which was published back
#     to the original topic as a zero-byte record), classifies a JSON decode
#     failure as terminal, quarantines every record it cannot parse instead of
#     skipping it, and commits an explicit offset map of the records that
#     completed rather than the consumer's position.
name: "node_dlq_replay_effect"
contract_name: "node_dlq_replay_effect"
node_name: "node_dlq_replay_effect"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version:
  major: 1
  minor: 2
  patch: 0
node_type: "EFFECT_GENERIC"
description: >
  Effect node that drains a DLQ topic (onex.dlq.omnibase-infra.<category>.v1) from the persistent onex-dlq-replay consumer group, replays eligible messages back to their original topic exactly once, and quarantines non-replayable messages to onex.dlq.omnibase-infra.quarantine.v1 (never dropping them). Reuses should_replay() for eligibility and records every terminal outcome in dlq_replay_history. OMN-17896: a record whose original body cannot be established is refused at parse and quarantined with its RAW BYTES intact rather than replayed as a fabricated empty body; a record that cannot be JSON-decoded is quarantined rather than skipped; and the offset advances only on a CONFIRMED quarantine or replay publish, via an explicit per-partition offset map of the records that completed, never the consumer's bare position. OMN-18084: runs over ONE shared consumer are SERIALISED by a run mutex keyed on the consumer instance. The three per-topic dispatcher entries below all resolve to the same dependencies["HandlerDlqReplay"] mapping because the kernel keys dependencies by handler NAME, so a peer's teardown could stop a DLQConsumer another dispatcher was mid-drain on; every message then failed with 'Consumer not started' and the auto-wiring boundary answered each failure by writing the record back onto the DLQ topic it came from, at 193.8 records/s on the .201 dev lane. A dispatcher whose consumer nobody else holds never waits, and a run holds the mutex for at most max_run_duration_seconds. OMN-18084 (second pass): the drain UNWRAPS a nested dead letter before it decides anything about it. A record whose own original_topic is itself a dead-letter topic has another DLQ envelope for a body, so replaying it stripped exactly one layer and wrote the rest back onto the topic it was consumed from -- the fourth fixed point, left open by the first pass, measured at 34.4 records/s across ~1.67M retained records nested 8-9 deep on the .201 dev lane. unwrap_nested_dlq_record resolves such a record to the innermost envelope whose original_topic is a real source topic, bounded by MAX_DLQ_UNWRAP_DEPTH, carrying the OUTER dlq_offset/dlq_partition through so the committed offset still describes the topic being drained. Eligibility is then decided on that innermost record, so a nest that cannot be read to a real original topic is quarantined with a typed refusal rather than replayed, and should_replay plus DLQProducer.replay_message both refuse a dead-letter original_topic independently -- the predicate so a non-unwrapping caller takes the durable quarantine exit, the producer as a last-resort raise so no future caller can publish onto a dead-letter sink silently. OMN-18119: the node declared three subscribe topics and drained exactly ONE. The kernel keys dependencies by handler name, so the three per-topic dispatcher entries OMN-18013 split the routing into all resolved to a single DLQConsumer whose config named the events topic; live on the .201 dev lane the replay group held a committed offset for one topic-partition while 1,661 records sat unconsumed in the commands DLQ. The runtime now builds one consumer per topic declared above, read from this contract so the two cannot disagree, all on the same group because Kafka commits are per topic-partition. A run visits each in turn under THREE bounds: the wall clock is SHARED across topics so a run still returns inside max_run_duration_seconds however many topics are declared, which is what keeps OMN-17137 closed; the record budget is PER TOPIC, because a shared one would be spent entirely by the first topic in the order and on this lane that topic is a 700,000-record backlog; and a topic gets idle_probe_seconds to produce its FIRST record, so a declared-but-empty topic costs a short probe rather than the run's remaining budget. The start of the order rotates by one each run, because a topic whose predecessor can always fill its own budget would otherwise never be reached at all. OMN-18111: 'records every terminal outcome in dlq_replay_history' was false in two independent ways and had been since the node shipped -- the runtime's _build_runtime_handler_dependencies supplied consumer/producer/quarantine_producer and never the declared tracking service, so _record() returned at its first line on every call, and _quarantine_unparseable never called the recorder at all, so the OMN-17896 records whose original body could not be established were the ones the audit ledger was guaranteed to be silent about. Both are closed. An unparseable record's audit row is keyed by a UUIDv5 over its DLQ coordinate (topic/partition/offset) because it carries no correlation id, and names the DLQ topic it was read from as original_topic and the quarantine topic as target_topic rather than a replay target that never existed. The audit write is isolated from the outcome it describes: every caller reaches it only after the publish is CONFIRMED, so a tracking failure is logged at ERROR and the durable verdict and its committable offset both stand -- letting it propagate would turn a confirmed quarantine into a FAILED result, block the partition, and have the record redelivered and re-quarantined, reintroducing the amplification above with a database outage as its trigger.

# Event bus subscription/publication
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  subscribe_topics:
    - "onex.dlq.omnibase-infra.events.v1"
    - "onex.dlq.omnibase-infra.intents.v1"
    - "onex.dlq.omnibase-infra.commands.v1"
  publish_topics:
    - "onex.dlq.omnibase-infra.quarantine.v1"
# I/O models
input_model:
  name: "ModelDlqReplayCommand"
  module: "omnibase_infra.nodes.node_dlq_replay_effect.models.model_dlq_replay_command"
  description: "Typed command describing a single replay run."
output_model:
  name: "ModelDlqReplayRunResult"
  module: "omnibase_infra.nodes.node_dlq_replay_effect.models.model_dlq_replay_run_result"
  description: "Aggregate outcome of one replay run (counts + per-message results)."
# Handler routing
handler_routing:
  routing_strategy: "operation_match"
  # OMN-18013: split into per-topic `topic:`-scoped entries. Before the split
  # every entry here owned EVERY subscribe topic (operation_match with no topic
  # scoping), so one entry spanned more than one real message category and the
  # single category the wiring derived could not be true of all its topics.
  # Routing is per-topic since OMN-18013; the contract now says so too.
  handlers:
    - operation: "replay_dlq"
      topic: "onex.dlq.omnibase-infra.commands.v1"
      handler:
        name: "HandlerDlqReplay"
        module: "omnibase_infra.nodes.node_dlq_replay_effect.handlers.handler_dlq_replay"
      description: >
        Replay eligible DLQ messages from onex.dlq.omnibase-infra.commands.v1 to their original topic; quarantine non-replayable messages to onex.dlq.omnibase-infra.quarantine.v1.

      output_fields:
        - dlq_topic
        - topics_drained
        - total_processed
        - completed
        - quarantined
        - failed
        - pending
        - dry_run
    - operation: "replay_dlq"
      topic: "onex.dlq.omnibase-infra.events.v1"
      handler:
        name: "HandlerDlqReplay"
        module: "omnibase_infra.nodes.node_dlq_replay_effect.handlers.handler_dlq_replay"
      description: >
        Replay eligible DLQ messages from onex.dlq.omnibase-infra.events.v1 to their original topic; quarantine non-replayable messages to onex.dlq.omnibase-infra.quarantine.v1.

      output_fields:
        - dlq_topic
        - topics_drained
        - total_processed
        - completed
        - quarantined
        - failed
        - pending
        - dry_run
    - operation: "replay_dlq"
      topic: "onex.dlq.omnibase-infra.intents.v1"
      handler:
        name: "HandlerDlqReplay"
        module: "omnibase_infra.nodes.node_dlq_replay_effect.handlers.handler_dlq_replay"
      description: >
        Replay eligible DLQ messages from onex.dlq.omnibase-infra.intents.v1 to their original topic; quarantine non-replayable messages to onex.dlq.omnibase-infra.quarantine.v1.

      output_fields:
        - dlq_topic
        - topics_drained
        - total_processed
        - completed
        - quarantined
        - failed
        - pending
        - dry_run
# IO operations
io_operations:
  - operation: "replay_dlq"
    description: "Drain a DLQ topic, replaying or quarantining each message"
    input_fields:
      - dlq_topic
      - max_replay_count
      - rate_limit_per_second
      - dry_run
      - filter_type
      - limit
    output_fields:
      - dlq_topic
      - topics_drained
      - total_processed
      - completed
      - quarantined
      - failed
      - pending
      - dry_run
# Dependencies
dependencies:
  - name: "consumers"
    type: "service"
    description: >
      Runtime-materialized persistent DLQ consumers, ONE PER DECLARED SUBSCRIBE TOPIC above, keyed by topic and all on group onex-dlq-replay. Each is lazy-started by HandlerDlqReplay when that topic's turn in the run comes and stopped again after it, so a run holds one Kafka consumer at a time. OMN-18119: this was singular, and because the kernel keys dependencies by handler NAME every per-topic dispatcher entry resolved to that one consumer -- whose config named the events topic -- so the intents and commands DLQ topics were drained by nothing. The runtime reads the topic list from this contract, so a topic added above without a consumer is a failure rather than a silent omission.

    required: true
  - name: "producer"
    type: "service"
    description: "Runtime-materialized replay producer to original topics, lazy-started by HandlerDlqReplay when a replay run executes"
    required: true
  - name: "quarantine_producer"
    type: "service"
    description: "Runtime-materialized quarantine producer to onex.dlq.omnibase-infra.quarantine.v1, lazy-started by HandlerDlqReplay when a replay run executes"
    required: true
  - name: "tracking"
    type: "service"
    description: >
      ServiceDlqTracking for dlq_replay_history persistence. Supplied by the runtime from OMNIBASE_INFRA_DB_URL (service_kernel._build_dlq_replay_tracking). Stays required: false because a runtime with no database must still drain, but an absent entry now means the runtime genuinely had none rather than that nobody wired it: tests/integration/test_omn18111_dlq_tracking_dependency_wired.py discovers the names in this block and fails when the kernel omits one (OMN-18111).

    required: false
# Error handling
error_handling:
  error_types:
    - name: "REPLAY_PUBLISH_FAILED"
      description: "send_and_wait to the original topic failed"
      recoverable: true
      retry_strategy: "exponential_backoff"
    - name: "QUARANTINE_PUBLISH_FAILED"
      description: "send_and_wait to the quarantine topic failed"
      recoverable: true
      retry_strategy: "exponential_backoff"
# ============================================================================
# Quarantine ownership semantics (OMN-12619) — net-new, no prior pattern.
# These are authored here AND in knowledge-base:reference/omnibase-infra-dlq-quarantine-ownership.md.
# ============================================================================
quarantine:
  topic: "onex.dlq.omnibase-infra.quarantine.v1"
  purpose: >
    Durable terminal landing zone for DLQ messages the replay node classified as non-replayable (max-retry-exceeded, non-retryable error type, or out-of-filter). Quarantine exists to END SILENT MESSAGE LOSS: messages are retained for reclassification rather than dropped.

  ownership:
    retention_owner:
      role: "Platform infrastructure team"
      responsibility: >
        Owns the onex.dlq.omnibase-infra.quarantine.v1 topic retention policy. Quarantine is a long-retention topic; retention MUST exceed the replay topics so a message is never aged out before reclassification. Default retention: 90 days (set at topic-config time, not by this node).

    reclassification_owner:
      role: "Service team that owns the original_topic"
      responsibility: >
        Owns deciding whether a quarantined message is genuinely terminal (discard after audit) or was misclassified (e.g. a transient error was mis-tagged non-retryable). Reclassification is a human/automated review of the quarantine record, keyed by original_correlation_id.

    replay_eligibility_change_owner:
      role: "Service team that owns the original_topic, with platform review"
      responsibility: >
        Owns changes to what counts as replay-eligible — i.e. edits to EnumNonRetryableErrorCategory or max_replay_count. Such changes alter which messages quarantine vs replay and require platform review because they affect every DLQ consumer.

  re_entry_path:
    description: >
      A quarantined message re-enters replay by being republished to its source DLQ topic (source_dlq_topic in the quarantine record) with a retry_count reset below max_replay_count and/or after the offending error_type is removed from EnumNonRetryableErrorCategory. The replay node then treats it as a normal DLQ message; should_replay() decides afresh.

    steps:
      - "Audit the quarantine record (keyed by original_correlation_id)."
      - "Reclassify: confirm the message should be replayable now."
      - "Republish the original_payload to source_dlq_topic with retry_count reset."
      - "The persistent onex-dlq-replay group picks it up and replays it."
    invariant: >
      Re-entry is explicit and owner-driven. The replay node never auto-promotes quarantined messages back into replay.

# Metadata
metadata:
  description: >
    Contract-native DLQ replay + quarantine node. Persistent consumer group onex-dlq-replay; quarantine to onex.dlq.omnibase-infra.quarantine.v1 ends silent loss. OMN-15021 (node_version 1.0.1): HandlerDlqReplay.handle() dispatch-boundary id extraction hardened against the runtime auto-wiring materialized dispatch-dict shape (no behavior change to the DLQ drain itself). OMN-16422 (node_version 1.0.2): this node is auto-wired as a PER-MESSAGE trigger on the DLQ topic but HandlerDlqReplay.run() is a whole-topic batch drain -- a self-feeding DLQ topic never went idle, so a single invocation never committed and starved the outer trigger consumer's heartbeat, and every DLQ arrival independently piled another unbounded drain on top. Fixed by bounding every run() invocation by record count (max_records_per_run) and wall-clock (max_run_duration_seconds) and committing incrementally every commit_every_n_records instead of only after the loop goes idle. OMN-17137 (node_version 1.0.3): that wall-clock bound was unenforceable on an IDLE topic -- it was checked only inside the async-for body, and aiokafka's __anext__ blocks indefinitely in getone() (consumer_timeout_ms is the background fetcher's wait, not kafka-python's idle-iteration timeout), so a topic that went quiet mid-drain parked run() forever and held the outer trigger consumer's serial poll loop until aiokafka evicted it at max_poll_interval_ms -- leaving the trigger group at zero members (state Empty) and the stability lane's runtime health DEGRADED on both empty_consumer_groups and topic_coverage. The record acquisition is now driven through asyncio.wait_for with the run's remaining budget, and both bounds are checked before the next record is requested.

  author: "OmniNode Team"
  license: "MIT"
  created: "2026-06-02"
  updated: "2026-09-10"
  tags:
    - effect
    - dlq
    - replay
    - quarantine
    - kafka
