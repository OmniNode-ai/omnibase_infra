name: "node_contract_validate_compute"
contract_name: "node_contract_validate_compute"
node_name: "node_contract_validate_compute"
contract_version:
  major: 1
  minor: 1
  patch: 0
node_version:
  major: 1
  minor: 1
  patch: 0
node_type: "COMPUTE_GENERIC"
runtime_profiles: [main]
status: "active"
description: >
  Compute node for ONEX contract validation, model compliance scoring and consumer topic namespace validation. The topic naming CI gate invokes this contract over the event bus to refuse half-namespaced consumer declarations.

input_model:
  name: "ModelContractValidateInput"
  module: "omnibase_infra.nodes.node_contract_validate_compute.models"
  description: "Contract content/file path plus optional model code for compliance validation."
output_model:
  name: "ModelContractValidationResult"
  module: "omnibase_core.models.validation.model_contract_validation_result"
  description: "Validation result with validity, score, violations, warnings, and suggestions."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "validate_contract"
      handler:
        name: "HandlerContractValidate"
        module: "omnibase_infra.nodes.node_contract_validate_compute.handlers.handler_contract_validate"
      event_type: "omnibase-infra.contract-validation-requested"
      message_category: "command"
      description: "Validate contracts, model compliance or consumer namespaces."
terminal_event: "onex.evt.omnibase-infra.contract-validation-completed.v1"
event_bus:
  subscribe_topics:
    - "onex.cmd.omnibase-infra.contract-validation-requested.v1"
  # The existing CI caller publishes requests under this contract; the runtime
  # result applier publishes the terminal response. Both topics are owned here.
  publish_topics:
    - "onex.cmd.omnibase-infra.contract-validation-requested.v1"
    - "onex.evt.omnibase-infra.contract-validation-completed.v1"
  dlq_topics:
    - "onex.dlq.omnibase-infra.contract-validation-requested.v1"
io_operations:
  - operation: "validate_contract"
    description: "Run contract validation or model compliance scoring."
    input_model: "ModelContractValidateInput"
    output_model: "ModelContractValidationResult"
    input_fields:
      - contract_content
      - contract_type
      - model_code
      - file_path
      - base_dir
    output_fields:
      - is_valid
      - score
      - violations
      - warnings
      - suggestions
  - operation: "validate_consumer_topics"
    description: "Validate one topic set or statically resolvable Python consumer declarations."
    input_model: "ModelContractValidateInput"
    output_model: "ModelContractValidationResult"
    input_fields:
      - consumer_topics
      - consumer_source
    output_fields:
      - is_valid
      - violations
dependencies:
  - name: "contract_validator"
    type: "library"
    module: "omnibase_core.services.service_contract_validator"
    description: "Compatibility validator used until CI callers fully move to this node boundary."
    required: true
health_check:
  enabled: false
  description: "Pure compute node — no external health check required."
metadata:
  description: "Deterministic contract validation compute boundary for contract YAML, files, and model compliance scoring."
  ticket: "OMN-11550"
  author: "OmniNode Team"
  tags:
    - compute
    - contract-validation
    - ci
    - migration
