name: "node_check_delegation_identity_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
runtime_profiles: [main]
description: >
  EFFECT node that binds the delegation identity doctor diagnosis to its canonical infra handler. The handler agrees with onex local identity: no local identity means no identity.

input_model:
  name: ModelDelegationIdentityRequest
  module: omnibase_infra.models.delegation.model_delegation_identity_request
  description: "The onex home and local identity reading."
output_model:
  name: "ModelDelegationDiagnosis"
  module: "omnibase_infra.doctor.model_delegation_diagnosis"
  description: "The delegation identity diagnosis."
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnibase_infra.handlers.handler_check_delegation_identity:HandlerCheckDelegationIdentity"
  handlers:
    - operation: "delegation_identity.evaluate"
      handler:
        name: "HandlerCheckDelegationIdentity"
        module: "omnibase_infra.handlers.handler_check_delegation_identity"
capabilities:
  - "delegation_identity.evaluate"
descriptor:
  node_archetype: effect
  purity: side_effecting
  idempotent: true
  timeout_ms: 30000
metadata:
  description: "Contract home for OMN-26616 delegation identity doctor behavior"
  ticket: "OMN-26616"
