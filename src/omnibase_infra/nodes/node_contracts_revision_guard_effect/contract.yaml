name: node_contracts_revision_guard_effect
contract_name: node_contracts_revision_guard_effect
node_name: node_contracts_revision_guard_effect
node_type: EFFECT_GENERIC
descriptor:
  node_archetype: effect
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  Boot guard run by the runtime entrypoint before the kernel starts. It compares every file under the runtime contracts directory the container sees against the sha256 manifest the image stamped at build, and raises ContractsRevisionMismatchError (CONTRACTS_REVISION_MISMATCH) when a file differs from the manifest or is not listed in it, as when a host clone of another revision is bind-mounted over the image's contracts.
input_model:
  name: ModelContractsRevisionRequest
  module: omnibase_infra.models.runtime.model_contracts_revision_request
  description: The stamp path and the runtime contracts directory to judge.
output_model:
  name: ModelContractsRevisionResult
  module: omnibase_infra.models.runtime.model_contracts_revision_result
  description: How many mounted files were checked; a mismatch raises instead of returning.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: check
      handler: {name: HandlerContractsRevisionGuard, module: omnibase_infra.handlers.handler_contracts_revision_guard}
capabilities:
  - name: contracts.revision_guard
    description: Refuse to boot runtime contracts from another revision than the image.
metadata:
  ticket: OMN-25856
  author: OmniNode Team
  description: Boot-time effect run in the entrypoint process. No bus dependency.
  tags: [effect, boot, contracts]
