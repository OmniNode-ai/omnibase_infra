name: "node_bus_forwarder_effect"
contract_name: "node_bus_forwarder_effect"
node_name: "node_bus_forwarder_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 3
node_version:
  major: 0
  minor: 1
  patch: 3
description: >
  Trust-boundary effect node that mirrors contract-declared tenant gateway topics between a local runtime bus and the hosted cloud Kafka edge. The node owns all publishes; handlers only validate and return transformed envelopes. OMN-15792: the outbound handler resolves its physical wire topic through the single runtime topic resolver (resolve_physical_topic) instead of calling the prefix_topic primitive directly -- internal implementation change, wire format and behavior unchanged. OMN-16204: mirror_topics.outbound widened with the bare omniclaude session-started/session-ended.v1 lifecycle pair (content-free, per operator OD-9 ruling 2026-08-18) -- contract-armed only, actual cloud delivery still gated behind OMN-14323 gate 1 (MSK network/IAM).

runtime_profiles:
  - canary
input_model:
  name: "ModelGatewayEnvelope"
  module: "omnibase_infra.nodes.node_bus_forwarder_effect.models.model_gateway_envelope"
  description: >
    Canonical gateway envelope with tenant binding and topic transform fields. Runtime dispatch may wrap this payload in a ModelEventEnvelope instance or its serialized dict form; handlers normalize that outer envelope before reading payload.

output_model:
  name: "ModelGatewayEnvelope"
  module: "omnibase_infra.nodes.node_bus_forwarder_effect.models.model_gateway_envelope"
  description: "Validated gateway envelope after prefix add/strip transformation."
config:
  name: "ModelGatewayForwarderConfig"
  module: "omnibase_infra.nodes.node_bus_forwarder_effect.models.model_gateway_forwarder_config"
  description: "Frozen gateway forwarder configuration resolved from contract and secret refs."
  gateway_forwarder:
    cloud_leg:
      transport: "kafka"
      broker_provider_id: "22222222-2222-2222-2222-222222222222"
      cloud_broker_ref: "gateway.cloud.kafka.broker"
      cloud_auth_ref: "gateway.cloud.kafka.msk_iam"
      acl_provisioner_ref: "gateway.cloud.kafka.authorization"
      msk_region_ref: "gateway.cloud.kafka.msk_region"
      security_protocol: "SASL_SSL"
      sasl_mechanism: "AWS_MSK_IAM"
    local_leg:
      supported_flavors:
        - "containerized"
        - "lightweight"
    mirror_topics:
      inbound:
        - "onex.cmd.omnibase-infra.delegation-inference-request.v1"
        - "onex.cmd.omnibase-infra.delegation-request.v1"
        - "onex.evt.omnibase-infra.gateway-heartbeat.v1"
      outbound:
        - "onex.evt.omnibase-infra.inference-response.v1"
        - "onex.evt.omnibase-infra.delegation-completed.v1"
        - "onex.evt.omnibase-infra.delegation-failed.v1"
        - "onex.evt.omniintelligence.llm-call-completed.v1"
        - "onex.evt.omnibase-infra.llm-call-completed.v1"
        - "onex.evt.omnibase-infra.gateway-heartbeat.v1"
        # OMN-16204: bare session-lifecycle pair only (session id + timestamps,
        # content-free) -- operator OD-9 ruling 2026-08-18 ~12:40Z allows
        # exactly this pair to cross to cloud; all other omniclaude topics
        # (prompt-submitted, tool-executed, skill-started/completed,
        # tool-output-captured) remain DENIED pending the scrubbing layer
        # OMN-14323 still owns. Cloud delivery itself stays gated behind
        # OMN-14323 gate 1 (AWS lab->MSK network/IAM) until that lands
        # separately -- this only arms the contract-declared mirror set.
        - "onex.evt.omniclaude.session-started.v1"
        - "onex.evt.omniclaude.session-ended.v1"
    # ------------------------------------------------------------------
    # OMN-17034: the lane-mirror leg.
    # ------------------------------------------------------------------
    # Operator ruling 2026-09-04, paraphrased: BOTH lanes, not either. The
    # forwarder consumes the hook topics on the lane the hook edge actually
    # publishes to and mirrors them to the dev lane; nothing is repointed.
    #
    # The measured defect this closes: omniclaude's hook edge publishes to
    # the STABILITY lane (declared by
    # omniclaude/plugins/onex/hooks/contracts/hook_edge_lane.yaml, OMN-17204,
    # `lane: stability-test`), while `omninode-gateway-forwarder` was attached
    # only to `omnibase-infra-network` (dev). A container cannot see a record
    # on a lane network it is not joined to, so every hook event was invisible
    # to this node -- 16,616 hook rows on stability against 2 on dev
    # (measured 2026-09-04).
    #
    # WHY A THIRD LEG RATHER THAN REPOINTING `local_bus`:
    # `local_bus` is the trust-boundary leg. Its OUTBOUND direction carries
    # delegation/inference results to cloud and its INBOUND direction
    # republishes cloud delegation commands to the local runtime, whose
    # consumers live on DEV. Repointing it to stability would move those
    # commands off the lane their consumers run on -- a regression traded for
    # a fix. So `local_bus` stays on dev, unchanged, and this is an additive
    # leg with its own consumer group.
    #
    # HOW THE CLOUD ARM OF THE RULING IS SATISFIED WITH NO NEW CLOUD CODE:
    # this leg republishes each stability hook record onto the DEV broker
    # under the same canonical topic name. The pre-existing trust-boundary
    # outbound leg already consumes `mirror_topics.outbound` on dev, and that
    # set already contains the OD-9-approved session-started/session-ended
    # pair (OMN-16204). So the composed path is
    #   stability --(this leg)--> dev --(existing outbound leg)--> cloud
    # and the forwarder mirrors to dev AND onward to the cloud leg it already
    # has. `mirror_topics.outbound` is deliberately NOT widened here --
    # widening the cloud set to tool-executed/prompt-submitted is OMN-16979,
    # gated behind the OMN-17209 redaction contract, and actual cloud
    # delivery is still gated behind OMN-14323 gate 1 (MSK network/IAM) and
    # OMN-16459 (HTTPS ingest replacing the direct-MSK leg).
    #
    # `topics` is the four `governed_topics` of hook_edge_lane.yaml. This is
    # a LOCAL lane-to-lane mirror inside one trusted host, not a trust-boundary
    # crossing, so the OD-9 content restriction that scopes the cloud set does
    # not apply to it; the OD-9 scope is still enforced, unchanged, at the
    # cloud boundary by `mirror_topics.outbound`.
    #
    # Lanes are named, never addressed. The resolved deployment YAML supplies
    # the per-lane broker endpoint (`lane_mirror_source_bus` /
    # `lane_mirror_buses`), the same authority split `local_bus` already uses:
    # this contract owns the topic set and the lane names, the resolved tenant
    # file owns this deployment's broker addresses.
    lane_mirror:
      source_lane: "stability-test"
      mirror_lanes:
        - "dev"
      topics:
        - "onex.evt.omniclaude.session-started.v1"
        - "onex.evt.omniclaude.session-ended.v1"
        - "onex.evt.omniclaude.tool-executed.v1"
        - "onex.evt.omniclaude.prompt-submitted.v1"
      # Poll batch size and the source-commit deadline for one drain pass.
      max_messages_per_poll: 50
      poll_timeout_ms: 1000
    canary:
      # OMN-15741 (G1): dedicated topic for the path-verifying healthcheck probe.
      # Never mirrored, never carries tenant traffic -- the probe produces a tiny
      # record here and reads it back across each leg using the same transport
      # and credentials as real traffic, so the healthcheck can tell "connected
      # and forwarding" apart from "started once, now silently broken" (the
      # 2026-08-04 failure: ready-file present, forwarding 0% for 4 days).
      topic: "onex.evt.omnibase-infra.gateway-canary.v1"
      cadence_seconds: 30
      # OMN-16557: was 8s. check_canary_leg() spends this deadline TWICE in
      # sequence (connect via transport.start(), then produce via
      # transport.send()) before the separate readback wait below -- so the
      # real worst-case single-leg budget is 2x this value + readback, not
      # this value + readback (see ModelGatewayCanaryConfig.total_deadline_seconds).
      # A live manual run on .201 (2026-08-25T20:42Z) measured the cloud
      # leg's normal (non-wedged) cold-start OAUTHBEARER handshake landing
      # almost exactly on the old 8s connect deadline -- the wait_for lost
      # that race and raised an (empty-message) TimeoutError even though the
      # handshake was about to succeed a fraction of a second later. 15s
      # gives real margin over that measured ~8.1s. The Docker healthcheck
      # `timeout` in docker-compose.gateway.yml must stay >= this model's
      # total_deadline_seconds (2*15 + 12 = 42s); kept in manual sync there
      # since the compose YAML cannot reference this contract at build time
      # (see OMN-15762 for the broader numeric-config-triplication gap).
      produce_deadline_seconds: 15
      readback_deadline_seconds: 12
    liveness:
      heartbeat_interval_seconds: 15
      max_silence_window_seconds: 60
      lag_threshold_messages: 500
      lag_threshold_seconds: 120
      drain_deadline_seconds: 30
      reconnect_backoff_initial_seconds: 1
      reconnect_backoff_max_seconds: 30
      reconnect_backoff_jitter_seconds: 0.5
      degraded_after_seconds: 60
    dedupe:
      key: "envelope_id"
      store: "sqlite"
      store_path_required: true
      retention_hours: 24
    delivery:
      semantics: "at_least_once"
      source_offset_acknowledgement: "after_destination_ack_and_durable_marker"
      auto_commit: false
      retry_initial_seconds: 1
      retry_max_seconds: 30
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "gateway.forward_outbound"
      handler:
        name: "HandlerForwardOutbound"
        module: "omnibase_infra.nodes.node_bus_forwarder_effect.handlers.handler_forward_outbound"
        handler_type: "COMPUTE"
      description: >
        Pure transform entrypoint for validating a local canonical envelope and attaching the configured tenant wire prefix. The dedicated gateway process owns transport subscriptions and publishing.

    - operation: "gateway.consume_inbound"
      handler:
        name: "HandlerConsumeInbound"
        module: "omnibase_infra.nodes.node_bus_forwarder_effect.handlers.handler_consume_inbound"
        handler_type: "COMPUTE"
      description: >
        Pure transform entrypoint for validating an attached cloud tenant, stripping the wire prefix, and stamping the verified tenant slug. The dedicated gateway process owns transport subscriptions and publishing.

capabilities:
  - name: "tenant_prefix_transform"
    description: "Adds and strips tenant wire prefixes with envelope validation."
  - name: "contract_declared_mirror_topics_only"
    description: "Rejects any canonical topic not declared in mirror topic sets."
  - name: "node_owned_publish"
    description: "Handlers never publish; the effect node owns both bus legs."
  - name: "durable_source_acknowledgement"
    description: "Source offsets commit only after destination broker acknowledgement and a durable envelope_id marker; acknowledged redelivery is suppressed across restarts."
  - name: "raw_dispatch_envelope_normalization"
    description: "Handlers deserialize serialized outer event envelopes before reading payload."
  - name: "contract_declared_lane_mirror"
    description: "Mirrors the contract-declared hook topic set from the declared source lane's broker to every declared mirror lane's broker, at-least-once with a durable per-envelope marker, and never mirrors a topic outside that set."
  - name: "verified_inbound_payload_tenant_stamp"
    description: "Inbound gateway consumption overwrites payload[\"tenant_id\"] with the config-bound gateway tenant slug (canonical shared-helper shape; no separate tenant_slug key) before local republish."
metadata:
  description: "Hybrid gateway local runtime bus forwarder"
  author: "OmniNode Team"
  created: "2026-06-10"
  updated: "2026-09-04"
  tags:
    - gateway
    - event-bus
    - tenant-isolation
    - trust-boundary
