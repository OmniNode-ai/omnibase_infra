# ONEX Node Contract
# Node: NodeLaneEntryPointCensusEffect
#
# Records each runtime-image container of each lane with its entrypoint and cmd as
# run, and reports a command outside the declared allowed list as an entry point to
# remove. Read-only: it reads a recorded docker inspection or the daemon's read-only
# ps and inspect, and the policy data file (deploy/lane-census/runtime-entry-points.yaml).
#
# Related Tickets:
#   - OMN-21923: this node (one-runtime plan T24)
name: "node_lane_entry_point_census_effect"
contract_name: "node_lane_entry_point_census_effect"
node_name: "node_lane_entry_point_census_effect"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version:
  major: 1
  minor: 0
  patch: 0
node_type: "EFFECT_GENERIC"
description: >
  Record every runtime-image container of each lane with the command it runs and grade the command against the declared allowed list, read-only.

runtime_profiles:
  - local-dev
input: "omnibase_infra.models.lane_entry_point_census.model_lane_entry_point_census_request.ModelLaneEntryPointCensusRequest"
input_model:
  name: "ModelLaneEntryPointCensusRequest"
  module: "omnibase_infra.models.lane_entry_point_census.model_lane_entry_point_census_request"
  description: "The policy data file, the lane manifest, and a recorded inspection or the daemon address."
output_model:
  name: "ModelLaneEntryPointCensusResult"
  module: "omnibase_infra.models.lane_entry_point_census.model_lane_entry_point_census_result"
  description: "One typed census record per lane, and the table regenerated from them."
handler_routing:
  routing_strategy: "operation_match"
  # default_handler lets RuntimeLocal resolve the handler on its compute path, so the
  # node runs through onex node with no bus topic and no dispatcher.
  default_handler: "omnibase_infra.handlers.handler_lane_entry_point_census:HandlerLaneEntryPointCensus"
  handlers:
    - operation: "lane_entry_point_census.run"
      handler:
        name: "HandlerLaneEntryPointCensus"
        module: "omnibase_infra.handlers.handler_lane_entry_point_census"
      description: >
        Read container inspection, keep the runtime-image containers, record their commands and grade them against the allowed list.

      supported_operations:
        - "lane_entry_point_census.run"
      input_model:
        name: "ModelLaneEntryPointCensusRequest"
        module: "omnibase_infra.models.lane_entry_point_census.model_lane_entry_point_census_request"
        description: "Typed def-B request for one census run."
      output_fields:
        - success
        - error_message
        - censuses
        - table_markdown
io_operations:
  - operation: "lane_entry_point_census.run"
    description: "Census one docker daemon's runtime-image containers by command."
    input_fields:
      - policy_path
      - manifest_path
      - inspect_json_path
      - docker_host
    output_fields:
      - success
      - error_message
      - censuses
      - table_markdown
descriptor:
  node_archetype: effect
  purity: side_effect
  idempotent: true
capabilities:
  - name: "lane_entry_point_census.run"
    description: "Census runtime-image containers by command and flag entry points to remove."
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
  error_types: []
metadata:
  description: >
    Read-only census of the commands the runtime image is started with. Declares the local-dev runtime profile, which no deployed runtime carries, so it runs through onex node.

  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-01"
  updated: "2026-11-01"
  tags:
    - effect
    - census
    - entry-points
  related_tickets:
    - "OMN-21923"
