name: "node_setup_local_provision_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 1
  minor: 1
  patch: 1
node_version: "1.1.1"
description: >
  EFFECT node that provisions, tears down, and checks status of local Docker Compose services defined in a ModelDeploymentTopology. Runs docker compose up -d (provision, with an optional build first), docker compose down (teardown, optionally with its volumes), and docker compose ps (status), either for the topology's services or for the whole compose project. Deduplicates --profile flags across services sharing the same profile. Async-polls ports at the local_host declared in models/network_binding/network_binding_settings.yaml until healthy or max_wait_seconds is exceeded.

input_model:
  name: "ModelLocalProvisionEffectInput"
  module: "omnibase_infra.nodes.node_setup_local_provision_effect.models.model_local_provision_effect_input"
  description: "Input envelope for local provision effect operations."
output_model:
  name: "ModelLocalProvisionEffectOutput"
  module: "omnibase_infra.nodes.node_setup_local_provision_effect.models.model_local_provision_effect_output"
  description: "Result of local provision effect operations."
io_operations:
  - name: "provision_local"
    description: "Start local services via docker compose up -d and poll until healthy."
    input_fields: ["topology", "compose_file_path", "correlation_id", "max_wait_seconds", "whole_project", "env_files", "build", "build_args"]
    output_fields: ["success", "services_started", "error"]
  - name: "teardown_local"
    description: "Stop and remove local services via docker compose down; remove_volumes also deletes the project's volumes."
    input_fields: ["topology", "compose_file_path", "correlation_id", "whole_project", "env_files", "remove_volumes"]
    output_fields: ["success", "services_stopped", "error"]
  - name: "status_check"
    description: "Query which local services are currently running."
    input_fields: ["topology", "compose_file_path", "correlation_id", "whole_project", "env_files"]
    output_fields: ["success", "services_running", "error"]
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "provision_local"
      handler:
        name: "HandlerLocalProvision"
        module: "omnibase_infra.nodes.node_setup_local_provision_effect.handlers.handler_local_provision"
    - operation: "teardown_local"
      handler:
        name: "HandlerLocalTeardown"
        module: "omnibase_infra.nodes.node_setup_local_provision_effect.handlers.handler_local_teardown"
    - operation: "status_check"
      handler:
        name: "HandlerLocalStatus"
        module: "omnibase_infra.nodes.node_setup_local_provision_effect.handlers.handler_local_status"
    - operation: "build_estimator"
      handler:
        name: "HandlerCostEstimatorBuild"
        module: "omnibase_infra.handlers.handler_cost_estimator_build"
      description: "Build the dev estimator image before the deploy agent recreates it (OMN-21487)."
config:
  cost_estimator_build:
    input_model:
      name: ModelCostEstimatorBuildRequest
      module: omnibase_infra.models.model_cost_estimator_build_request
    output_model:
      name: ModelCostEstimatorBuildResult
      module: omnibase_infra.models.model_cost_estimator_build_result
    build:
      repository_env: COST_ESTIMATOR_WEB_SOURCE_REPOSITORY
      repository_url_env: COST_ESTIMATOR_WEB_SOURCE_URL
      branch: dev
      image: omnibase-infra-cost-estimator-web:dev-lane
      clone_timeout_seconds: 120
      read_timeout_seconds: 30
      build_timeout_seconds: 1800
    source_configuration:
      home: deployment-overlay
      fragment_schema: runtime_lane_env.v1
      fragment_directory: deploy-overlays/runtime-lane-env/local
      description: >-
        The lane fragment owns COST_ESTIMATOR_WEB_SOURCE_REPOSITORY and COST_ESTIMATOR_WEB_SOURCE_URL. Neither is a secret; neither has a code default. The existing compose environment reads the fragment before builds. Missing settings are named before any image build.
    gate:
      enabled_env: FEATURE_ESTIMATOR_GATE_ENABLED
      default_enabled: true
      password_env: ESTIMATOR_GATE_PASSWORD
    description: >-
      Invoked synchronously by the host deploy agent while its lane lock is held, within its existing rebuild command consumer. No second consumer, runtime dependency or prod admission. The web repository owns its merge publisher.
capabilities:
  - "local_provision.start"
  - "local_provision.stop"
  - "local_provision.status"
descriptor:
  node_archetype: effect
metadata:
  description: "Provisions, tears down, and checks status of local Docker Compose services defined in a ModelDeploymentTopology with async port health polling"
