name: node_queued_request_priority_compute
contract_name: node_queued_request_priority_compute
node_name: node_queued_request_priority_compute
node_type: COMPUTE_GENERIC
descriptor:
  node_archetype: compute
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  An operator-path rebuild request for dev (signed command c94ae2a7, 2026-11-26T18:38Z) was deferred to the 19:00Z recreate window, where the automatic overdue job was admitted instead and the operator request never ran. This node decides, from the queued requests of one window, which runs and which are superseded, with the reason: an operator-path request runs ahead of the automatic requests queued before it on the same lane, and each superseded request's reason names the request that runs in its place. Pure: no clock, no I/O.
input_model:
  name: ModelQueuedRequestPriorityRequest
  module: omnibase_infra.models.model_queued_request_priority_request
  description: The queued requests, head first, and the operator requester prefixes.
output_model:
  name: ModelQueuedRequestPriorityDecision
  module: omnibase_infra.models.model_queued_request_priority_decision
  description: The position that runs and one recorded reason per superseded request ahead of it.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: queued_request.prioritise
      handler:
        name: HandlerQueuedRequestPriority
        module: omnibase_infra.handlers.queued_request_priority.handler_queued_request_priority
      event_model:
        name: ModelQueuedRequestPriorityRequest
        module: omnibase_infra.models.model_queued_request_priority_request
capabilities:
  - name: queued_request.priority
    description: Run an operator-path request ahead of the automatic requests queued before it.
metadata:
  ticket: OMN-26718
  author: OmniNode Team
  description: Pure decision called by the deploy agent's queue coalescer.
  tags: [compute, deployment, dev]
