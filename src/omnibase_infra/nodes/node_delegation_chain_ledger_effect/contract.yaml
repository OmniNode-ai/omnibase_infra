# OMN-16964: caller/writer for chain-canary link 5.
name: "node_delegation_chain_ledger_effect"
node_type: "EFFECT_GENERIC"
runtime_profiles:
  - effects
contract_version:
  major: 1
  minor: 3
  patch: 0
node_version: "0.3.0"
description: >
  Records a correlation-scoped delegation chain after its terminal event. The handler reads envelope identity and parent identity from event_ledger, re-derives every causal edge against the parent this contract DECLARES for each hop (the chain is a tree, so a positional re-derivation grades a correct edge red -- OMN-18419), verifies the observed topics against this contract's declared topology, and idempotently writes public.ledger_chain. A write that cannot happen is a typed failure, never a success (OMN-18398): when the event_ledger read yields no hop at all on any topic in chain_topology, the handler refuses with a typed error naming the correlation id, the topics it looked for and the settle attempts it made, rather than reporting success having written nothing. A PARTIAL observation is still persisted as-is -- absence of a hop is honest evidence the canary reports as an incomplete chain, while absence of a whole chain is a success verdict resting on nothing. Each upsert is additionally required to affect a row: the statement always touches exactly one, so a zero count means the row this node claims to have recorded is not in the relation.

input_model:
  name: "ModelDelegationTerminalPayload"
  module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.models"
  description: "Permissive terminal payload; chain evidence comes from the enclosing envelope and event ledger."
event_bus:
  subscribe_topics:
    - "onex.evt.omnimarket.delegate-skill-completed.v1"
    # OMN-18937: the OTHER terminal. This writer is dispatched BY the terminal
    # event, so subscribed to the success terminal alone it never ran at all
    # for a FAILED delegation and public.ledger_chain held nothing for it --
    # not an incomplete chain, no chain. Paired with its handler_routing entry
    # below per the OMN-14594 rule, and declared as an ALTERNATIVE of the
    # terminal hop in chain_topology below rather than as a sixth hop.
    - "onex.evt.omnimarket.delegate-skill-failed.v1"
handler_routing:
  routing_strategy: "topic_match"
  handlers:
    - topic: "onex.evt.omnimarket.delegate-skill-completed.v1"
      operation: "delegation_chain.record"
      message_category: "event"
      handler_type: "delegation_chain_ledger"
      event_model:
        name: "ModelDelegationTerminalPayload"
        module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.models"
      handler:
        name: "HandlerDelegationChainLedger"
        module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.handlers.handler_delegation_chain_ledger"
      supported_operations:
        - "delegation_chain.record"
    # OMN-18937: the failure terminal, paired with its subscription above.
    # Same handler and same operation: the chain evidence comes from the
    # enclosing envelope and from event_ledger, never from the terminal
    # body, so a terminal carrying an error instead of a result needs no
    # separate path. ModelDelegationTerminalPayload is `extra="allow"` with
    # only `correlation_id` required, which a failed terminal carries.
    - topic: "onex.evt.omnimarket.delegate-skill-failed.v1"
      operation: "delegation_chain.record"
      message_category: "event"
      handler_type: "delegation_chain_ledger"
      event_model:
        name: "ModelDelegationTerminalPayload"
        module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.models"
      handler:
        name: "HandlerDelegationChainLedger"
        module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.handlers.handler_delegation_chain_ledger"
      supported_operations:
        - "delegation_chain.record"
# The declared authority for BOTH tiers. The handler reads this from this file;
# it does not infer the expected chain from the rows that happened to arrive.
#
# `parent` is the DECLARED TOPIC of the hop whose consumption causes this one,
# and it is what makes this a TREE rather than a line (OMN-18419). Tier 2 reads
# the ORDER of these entries; tier 1 reads the PARENT RELATION. Before the
# parent relation was declared, tier 1 re-derived each hop's expected parent
# from whatever sat at `index - 1`, which is correct only for a line -- and
# `delegate-skill-completed` branches off the head, because it is a consequence
# of consuming the delegate-skill COMMAND and not of the routing decision that
# preceded it in time. A correct chain therefore graded red.
#
# `parent: null` on the first entry is the checkable claim "this hop is the
# chain HEAD" -- the same claim an absent `parent_message_id` makes on the wire.
# The replay refuses a declared head that records a parent.
#
# The `delegation-request.v1` hop is DECLARED here rather than skipped over.
# It is the pattern-B worker command the runtime's delegation dispatch port
# publishes while consuming the delegate-skill command, and it is the real
# recorded parent of the routing request. Leaving it out would have forced the
# routing request to name a grandparent it never carried on the wire, which is
# a chain graded against a topology that did not happen. Its hop is projected
# into `event_ledger` by node_ledger_projection_compute's contract 1.4.0.
chain_topology:
  - topic: "onex.cmd.omnimarket.delegate-skill.v1"
    parent: null
  - topic: "onex.cmd.omnibase-infra.delegation-request.v1"
    parent: "onex.cmd.omnimarket.delegate-skill.v1"
  - topic: "onex.cmd.omnibase-infra.delegation-routing-request.v1"
    parent: "onex.cmd.omnibase-infra.delegation-request.v1"
    # OMN-18964: the RE-ROUTES. The delegation orchestrator issues another
    # routing request while consuming one of two events, and records that
    # event as the repeat's parent:
    #   quality-gate-result  the draft missed the quality bar (the OMN-14234
    #                        free-tier best-of-N path, and tier escalation on
    #                        a gate verdict)
    #   inference-response   the inference errored retryably (tier escalation,
    #                        sibling-backend and customer-route retries)
    # Both observed live on the .201 dev lane, each identified by re-deriving
    # uuid5(correlation, "<Class>:0"). Measured over 30 chains before this:
    # every re-routed chain replayed red and every other chain green, because
    # this hop could name only one cause. Parent EVIDENCE, not hops: read so
    # the edge can close, never graded or counted, so the declaration stays
    # five hops and EXPECTED_LEDGER_HOPS is unchanged. Only a REPEAT may cite
    # one; the first routing request closes against `parent` alone. Both are
    # projected into event_ledger by node_ledger_projection_compute's
    # contract 1.6.0.
    reroute_parents:
      - "onex.evt.omnibase-infra.quality-gate-result.v1"
      - "onex.evt.omnibase-infra.inference-response.v1"
  - topic: "onex.evt.omnibase-infra.routing-decision.v1"
    parent: "onex.cmd.omnibase-infra.delegation-routing-request.v1"
  # The branch. Observed last in time, caused by the head.
  #
  # OMN-18937: ONE hop, two possible topics. A delegation terminates as
  # either completed or failed and never both, so the failure terminal is an
  # ALTERNATIVE name for this hop rather than a sixth hop. A sixth entry was
  # rejected on two independent grounds: tier 2 grades positionally, so on a
  # failed delegation the terminal sits at index 4 and would be graded
  # against `...-completed`, failing the one row the canary reads its
  # chain-wide verdict from; and every count of declared hops -- the
  # chain-canary workflow's EXPECTED_LEDGER_HOPS among them -- would read
  # five-of-six on every successful run forever. The declaration stays FIVE
  # entries and `topic` stays the canonical name a `parent` citation and a
  # position count resolve against.
  - topic: "onex.evt.omnimarket.delegate-skill-completed.v1"
    parent: "onex.cmd.omnimarket.delegate-skill.v1"
    alternatives:
      - "onex.evt.omnimarket.delegate-skill-failed.v1"
writer:
  settle_attempts: 20
  settle_delay_ms: 250
node_capabilities:
  postgres: true
  read: true
  write: true
  database: true
dependencies:
  - name: "handler_delegation_chain_ledger"
    type: "handler"
    class_name: "HandlerDelegationChainLedger"
    module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.handlers.handler_delegation_chain_ledger"
    description: "Reads event evidence, derives verdicts, and writes ledger_chain."
  - name: "handler_db"
    type: "handler"
    class_name: "HandlerDb"
    module: "omnibase_infra.handlers.handler_db"
    description: "PostgreSQL transport composed by the writer handler."
metadata:
  description: "Evidence-derived writer for OMN-16025 chain-canary link 5."
  author: "OmniNode Team"
  created: "2026-09-13"
  updated: "2026-09-20"
  ticket: "OMN-16964"
  note: "OMN-18390: output_model dropped -- nothing consumed ModelLedgerChainWriteResult and the node has no publish_topics, so every declared output dead-lettered. OMN-18398: contract 1.0.1 records the refusal semantics above. The evidence this node reads is written only by node_ledger_projection_compute, whose subscription carried none of the four chain_topology topics below -- so the read was empty by construction and public.ledger_chain held zero rows on the .201 dev lane while this node reported success on every dispatch. That node's contract 1.3.0 now records and dispatches all four. OMN-18419: contract 1.1.0 turns chain_topology from an ordered list of topics into an ordered list of hops that each declare their parent topic, because the chain is a tree -- delegate-skill-completed branches off the head -- while the replay re-derived a line and graded the correct edge red. The same revision declares the delegation-request.v1 hop, which was always on the wire and never in the declaration. OMN-18937: contract 1.2.0 subscribes and dispatches the delegation FAILURE terminal and declares it as an ALTERNATIVE of the terminal hop. Subscribed to the success terminal only, this writer was never dispatched at all for a failed delegation, so ledger_chain held no chain for it rather than an incomplete one -- and node_ledger_projection_compute did not record that terminal either, so even a dispatched writer would have read an empty relation. Both halves are fixed together; a producer-derived gate (tests/unit/nodes/test_delegation_terminal_topics_projected_omn18937.py) now derives the terminal set from the OMN-13202 producer mirror and refuses a consumer that covers less than the producer emits."
  tags:
    - "effect"
    - "delegation"
    - "ledger"
    - "replay"
