# OMN-16964: caller/writer for chain-canary link 5.
name: "node_delegation_chain_ledger_effect"
node_type: "EFFECT_GENERIC"
runtime_profiles:
  - effects
contract_version:
  major: 1
  minor: 0
  patch: 1
node_version: "0.1.1"
description: >
  Records a correlation-scoped delegation chain after its terminal event. The handler reads envelope identity and parent identity from event_ledger, re-derives every causal edge, verifies the observed topics against this contract's declared topology, and idempotently writes public.ledger_chain. A write that cannot happen is a typed failure, never a success (OMN-18398): when the event_ledger read yields no hop at all on any topic in chain_topology, the handler refuses with a typed error naming the correlation id, the topics it looked for and the settle attempts it made, rather than reporting success having written nothing. A PARTIAL observation is still persisted as-is -- absence of a hop is honest evidence the canary reports as an incomplete chain, while absence of a whole chain is a success verdict resting on nothing. Each upsert is additionally required to affect a row: the statement always touches exactly one, so a zero count means the row this node claims to have recorded is not in the relation.

input_model:
  name: "ModelDelegationTerminalPayload"
  module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.models"
  description: "Permissive terminal payload; chain evidence comes from the enclosing envelope and event ledger."
event_bus:
  subscribe_topics:
    - "onex.evt.omnimarket.delegate-skill-completed.v1"
handler_routing:
  routing_strategy: "topic_match"
  handlers:
    - topic: "onex.evt.omnimarket.delegate-skill-completed.v1"
      operation: "delegation_chain.record"
      message_category: "event"
      handler_type: "delegation_chain_ledger"
      event_model:
        name: "ModelDelegationTerminalPayload"
        module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.models"
      handler:
        name: "HandlerDelegationChainLedger"
        module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.handlers.handler_delegation_chain_ledger"
      supported_operations:
        - "delegation_chain.record"
# Tier-2 authority. These are the ordered topics declared by the four
# participating node contracts. The handler reads this list from this file;
# it does not infer the expected chain from the rows that happened to arrive.
chain_topology:
  - "onex.cmd.omnimarket.delegate-skill.v1"
  - "onex.cmd.omnibase-infra.delegation-routing-request.v1"
  - "onex.evt.omnibase-infra.routing-decision.v1"
  - "onex.evt.omnimarket.delegate-skill-completed.v1"
writer:
  settle_attempts: 20
  settle_delay_ms: 250
node_capabilities:
  postgres: true
  read: true
  write: true
  database: true
dependencies:
  - name: "handler_delegation_chain_ledger"
    type: "handler"
    class_name: "HandlerDelegationChainLedger"
    module: "omnibase_infra.nodes.node_delegation_chain_ledger_effect.handlers.handler_delegation_chain_ledger"
    description: "Reads event evidence, derives verdicts, and writes ledger_chain."
  - name: "handler_db"
    type: "handler"
    class_name: "HandlerDb"
    module: "omnibase_infra.handlers.handler_db"
    description: "PostgreSQL transport composed by the writer handler."
metadata:
  description: "Evidence-derived writer for OMN-16025 chain-canary link 5."
  author: "OmniNode Team"
  created: "2026-09-13"
  updated: "2026-09-15"
  ticket: "OMN-16964"
  note: "OMN-18390: output_model dropped -- nothing consumed ModelLedgerChainWriteResult and the node has no publish_topics, so every declared output dead-lettered. OMN-18398: contract 1.0.1 records the refusal semantics above. The evidence this node reads is written only by node_ledger_projection_compute, whose subscription carried none of the four chain_topology topics below -- so the read was empty by construction and public.ledger_chain held zero rows on the .201 dev lane while this node reported success on every dispatch. That node's contract 1.3.0 now records and dispatches all four."
  tags:
    - "effect"
    - "delegation"
    - "ledger"
    - "replay"
