# ONEX Node Contract - Event Forward Effect
#
# Receives platform events (lifecycle, system, tool updates) from the event bus
# and forwards them to an HTTP backend.
# Ported from archive: omniarchon/python/src/server/nodes/handlers.
#
name: "node_event_forward_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: >
  Effect node that receives typed platform events (service lifecycle, system alerts, tool updates) and forwards them to a configurable HTTP backend endpoint.  Consolidates three archive handlers into one contract-driven node.

input_model:
  name: "ModelEventForwardRequest"
  module: "omnibase_infra.nodes.node_event_forward_effect.models.model_event_forward_request"
  description: "Typed platform event to forward."
output_model:
  name: "ModelEventForwardResult"
  module: "omnibase_infra.nodes.node_event_forward_effect.models.model_event_forward_result"
  description: "Forward confirmation with HTTP status."
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  # OMN-17427: all three subscribe topics DELETED (service-lifecycle.v1,
  # system-alert.v1, tool-update.v1, each under onex.evt.omnibase-infra). No
  # contract and no runtime path anywhere in the fleet publishes any of them
  # (grep of every omni_home clone, 2026-10-01; the producers named by the
  # archive port were never built), so each subscription only minted a
  # permanently empty consumer group (OMN-16795). The node keeps one unscoped
  # operation_match entry, the in-process shape of node_merge_sweep_pr_list_effect.
  # Re-add a subscription with its publisher and a topic-scoped handler entry, in
  # one diff (OMN-7897).
  publish_topics:
    - "onex.evt.omnibase-infra.event-forwarded.v1"
handler_routing:
  routing_strategy: "operation_match"
  # OMN-18013 split the single entry per topic because routing is per-topic.
  # OMN-17427 removed every subscribe topic, so the node is reached by operation
  # only and carries one unscoped entry again.
  handlers:
    - operation: "event.forward"
      handler:
        name: "HandlerEventForward"
        module: "omnibase_infra.nodes.node_event_forward_effect.handlers.handler_event_forward"
dependencies:
  - type: "environment"
    name: "EVENT_FORWARD_BACKEND_URL"
    description: "Base URL of the HTTP backend to forward events to"
descriptor:
  backend_url: "${env.EVENT_FORWARD_BACKEND_URL}"
error_handling:
  retry_policy:
    max_retries: 3
    initial_delay_ms: 200
    max_delay_ms: 5000
    exponential_base: 2
    retry_on:
      - "InfraConnectionError"
      - "InfraTimeoutError"
  circuit_breaker:
    enabled: true
    failure_threshold: 10
    reset_timeout_ms: 30000
metadata:
  description: "Platform event forwarding to HTTP backends"
  transport_type: "HTTP"
  author: "OmniNode Team"
  created: "2026-04-01"
  tags:
    - "effect"
    - "event-forwarding"
    - "lifecycle"
    - "system-events"
    - "webhook"
