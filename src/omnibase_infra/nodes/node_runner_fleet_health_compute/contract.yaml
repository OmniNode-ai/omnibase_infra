# ONEX Node Contract
# Node: NodeRunnerFleetHealthCompute
#
# Pure/deterministic classifier for the runner-fleet-maintain workflow
# (OMN-13942, Increment 1). Consumes a facts-only ModelRunnerFleetSnapshot
# (gathered upstream by node_runner_health_snapshot_effect) and produces a
# typed ModelRunnerFleetHealthVerdict. No I/O of any kind -- this node never
# calls gh, ssh, or docker. It only recommends actions; it never executes
# them.
#
# Related Tickets:
#   - OMN-13109 / OMN-13912 / OMN-13915: wedge/crash-loop/heartbeat heuristics
#     ported into this node's classification logic
#   - OMN-13932: motivating gap; this node adds BUILDX_UNAVAILABLE and
#     CODELOAD_THROTTLED, which close a live blind spot in the current
#     bash/CLI substrate
#   - OMN-14228 (Slice A): precondition fail-open -> fail-closed. The verdict now
#     threads the upstream source-determinacy facts (github_source_ok /
#     docker_source_ok, plus a per-runner is_determinate and a buildx_determinate
#     flag) so a probe-source outage is no longer silently classified as healthy;
#     the detail is annotated INDETERMINATE when a relevant source failed. Typed
#     re-arm signal fields (docker_restart_count, diag_heartbeat_age_seconds) are
#     surfaced on the assessment. Additive only -- no fleet mutation, no new state
#     member, no change to the input command or published topics.
#   - OMN-15255 (friction F-04): composite readiness. Per-runner `readiness`
#     (READY/NOT_READY/UNKNOWN) is a CONJUNCTION over six independently-probed
#     signals -- github_registration, docker_health, diag_heartbeat,
#     listener_topology, container_stability, disk_capacity -- evaluated in full
#     every tick, unlike `state`, which is a first-match-wins precedence pick that
#     never evaluates container health or listener topology at all. Adds the
#     quarantine set and its strictly narrower bounce-eligible subset, which is now
#     the ONLY producer of RESTART_RUNNER: the four state-keyed restart branches
#     (CRASH_LOOPING 0.9 / LISTENER_ZOMBIE 0.85 / OFFLINE_IDLE 0.6 / WEDGED 0.5) are
#     DELETED. Readiness fails CLOSED (UNKNOWN is not READY); the bounce gate fails
#     SAFE (no mutation on indeterminate sources, never a busy runner, never for a
#     cause a force-recreate cannot fix). The disk ceiling (90%) is a module
#     constant, NOT a new env read -- adding a fourth env-var name to this file
#     is exactly what scripts/check-env-reads.sh exists to stop (rule 10: narrow
#     the matcher, do not widen the allowlist; OMN-15234 owns that narrowing).
#     Still no mutation reachable from this node.
name: "node_runner_fleet_health_compute"
contract_version:
  major: 1
  minor: 1
  patch: 0
node_version: "1.1.0"
node_type: "COMPUTE_GENERIC"
description: >
  Pure, deterministic classifier of a runner-fleet snapshot into a typed health verdict: composite per-runner readiness over six signals, the quarantine set and its bounce-eligible subset, precedence health state, fleet aggregates, and recorded (never executed) recommended actions. Uses the canonical def-B typed ModelRunnerFleetHealthEvaluateCommand handler entrypoint. Heartbeat-staleness classification threshold (RUNNER_HEALTH_MAX_DIAG_AGE_SECONDS, env-overridable) defaults to 4500s as of OMN-15233 (1.0.2), raised from 900s. 900s sat below the ~50-minute IDLE _diag write cadence, so this classifier emitted LISTENER_ZOMBIE -> RESTART_RUNNER at confidence 0.85 for idle-but-healthy runners. The default is held identical to docker/runners/healthcheck.sh and runner-monitor.sh so all three surfaces agree on what "stale" means.

input_model:
  name: "ModelRunnerFleetHealthEvaluateCommand"
  module: "omnibase_infra.nodes.node_runner_fleet_health_compute.models.model_runner_fleet_health_evaluate_command"
  description: "Command carrying the snapshot to classify."
output_model:
  name: "ModelRunnerFleetHealthVerdict"
  module: "omnibase_infra.nodes.node_runner_fleet_health_compute.models.model_runner_fleet_health_verdict"
  description: >-
    Per-runner + fleet-level health verdict with recommended actions, carrying source-determinacy flags (github_source_ok / docker_source_ok / buildx_determinate) so a probe-source outage is distinguishable from a confirmed-healthy fleet (OMN-14228 Slice A), plus the OMN-15255 composite readiness surface: per-runner readiness + evaluated signals, ready/not_ready/unknown counts, fleet_ready, quarantined_runners, bounce_eligible_runners, and per-signal fleet rollups.
handler_routing:
  routing_strategy: "payload_type_match"
  handlers:
    - event_model:
        name: "ModelRunnerFleetHealthEvaluateCommand"
        module: "omnibase_infra.nodes.node_runner_fleet_health_compute.models.model_runner_fleet_health_evaluate_command"
      handler:
        name: "HandlerRunnerFleetHealthEvaluate"
        module: "omnibase_infra.nodes.node_runner_fleet_health_compute.handlers.handler_runner_fleet_health_evaluate"
      output_events:
        - "ModelRunnerFleetHealthVerdict"
runtime_profiles:
  - effects
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  subscribe_topics:
    - "onex.cmd.omnibase-infra.runner-fleet-health-evaluate.v1"
  publish_topics:
    - "onex.evt.omnibase-infra.runner-fleet-health-verdict.v1"
published_events:
  - topic: "onex.evt.omnibase-infra.runner-fleet-health-verdict.v1"
    event_type: "RunnerFleetHealthVerdictEvent"
    message_category: "EVENT"
    description: "Classified per-runner + fleet-level runner-fleet health verdict"
    topic_config:
      partitions: 1
      replication_factor: 1
      kafka_config:
        "retention.ms": "604800000"
        "cleanup.policy": "delete"
metadata:
  description: "Runner-fleet health classifier + composite readiness surface (OMN-13942 detection core, OMN-15255 readiness/quarantine) with canonical def-B typed handler entrypoint. Read-only: no mutation is reachable from this node."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-07-04"
  updated: "2026-07-27"
  ticket: "OMN-15255"
  tags:
    - compute
    - def-b
    - health
    - runner
    - fleet-maintain
    - readiness
