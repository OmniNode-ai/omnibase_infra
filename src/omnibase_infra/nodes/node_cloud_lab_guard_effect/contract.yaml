name: node_cloud_lab_guard_effect
contract_name: node_cloud_lab_guard_effect
node_name: node_cloud_lab_guard_effect
node_type: EFFECT_GENERIC
descriptor:
  node_archetype: effect
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  Boot guard run by the runtime entrypoint before the kernel starts. In cloud mode (a topology profile whose instance is not local) it raises CloudModeLabAddressError, naming the setting, when an LLM_*_URL variable, INFISICAL_ADDR or the file named by RUNNER_FLEET_CONFIG_PATH holds a lab address.
input_model:
  name: ModelCloudModeLabAddressRequest
  module: omnibase_infra.models.runtime.model_cloud_mode_lab_address_request
  description: The process environment to judge.
output_model:
  name: ModelCloudModeLabAddressResult
  module: omnibase_infra.models.runtime.model_cloud_mode_lab_address_result
  description: Whether the process is in cloud mode; a lab address raises instead of returning.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: check
      handler: {name: HandlerCloudLabGuard, module: omnibase_infra.handlers.handler_cloud_lab_guard}
capabilities:
  - name: cloud_mode.lab_address_guard
    description: Refuse to start in cloud mode while a setting holds a lab address.
metadata:
  ticket: OMN-26709
  author: OmniNode Team
  description: Boot-time effect run in the entrypoint process. No bus dependency.
  tags: [effect, boot, cloud]
