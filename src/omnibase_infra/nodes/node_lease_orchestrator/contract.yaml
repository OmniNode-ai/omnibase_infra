name: node_lease_orchestrator
contract_name: node_lease_orchestrator
node_name: node_lease_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: ORCHESTRATOR_GENERIC
description: >
  Acquire, renew and release a lease on one resource of a declared kind. A grant is one etcd transaction and its fence is the etcd revision of that transaction (OMN-21418 GenericLease model). No topic is declared yet: the lease command and event topics, and placing this node as a primary, wait on the contract placement read of OMN-21421.

input_model:
  name: ModelLeaseAcquireRequest
  module: omnibase_infra.models.lease.model_lease_acquire_request
  description: The kind, resource, holder and idempotency request_id of one acquire.
output_model:
  name: ModelLeaseReply
  module: omnibase_infra.models.lease.model_lease_reply
  description: lease-granted, lease-refused, lease-renewed, lease-released or lease-expired, with the fence.
capabilities:
  - name: lease.acquire
    description: Grant a free slot of the resource in one etcd transaction.
  - name: lease.renew
    description: Keep a grant alive at the same fence.
  - name: lease.release
    description: Give a grant back.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: lease.acquire
      handler:
        name: HandlerLeaseAcquire
        module: omnibase_infra.handlers.lease.handler_lease_orchestrator
      description: Grant a free slot of the resource in one etcd transaction, or refuse.
      supported_operations: [lease.acquire]
      input_model:
        name: ModelLeaseAcquireRequest
        module: omnibase_infra.models.lease.model_lease_acquire_request
        description: Grant a free slot of the resource in one etcd transaction, or refuse.
    - operation: lease.renew
      handler:
        name: HandlerLeaseRenew
        module: omnibase_infra.handlers.lease.handler_lease_orchestrator
      description: Keep a grant alive at the same fence.
      supported_operations: [lease.renew]
      input_model:
        name: ModelLeaseRenewRequest
        module: omnibase_infra.models.lease.model_lease_renew_request
        description: Keep a grant alive at the same fence.
    - operation: lease.release
      handler:
        name: HandlerLeaseRelease
        module: omnibase_infra.handlers.lease.handler_lease_orchestrator
      description: Give a grant back.
      supported_operations: [lease.release]
      input_model:
        name: ModelLeaseReleaseRequest
        module: omnibase_infra.models.lease.model_lease_release_request
        description: Give a grant back.
metadata:
  description: Generic lease orchestrator over etcd.
  author: OmniNode Team
  license: MIT
  tags: [orchestrator, lease, etcd, fence]
  related_tickets: [OMN-21424, OMN-21418, OMN-21421]
