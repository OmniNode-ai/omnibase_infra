name: "node_migration_append_only_check_compute"
contract_name: "node_migration_append_only_check_compute"
node_name: "node_migration_append_only_check_compute"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
node_type: "COMPUTE_GENERIC"
description: >
  Enforce append-only immutability for migrations declared at the integration base. Modifying, deleting or renaming an applied migration requires a valid supersession whose higher-ordinal successor is added by the same diff. Pure: all git, manifest and path-existence inputs arrive on the request.

input_model:
  name: "ModelMigrationAppendOnlyCheckInput"
  module: "omnibase_infra.nodes.node_migration_append_only_check_compute.models.model_migration_append_only_check_input"
  description: "Parsed diff statuses, base and current ledger texts, and current existing paths."
output_model:
  name: "ModelValidationReport"
  module: "omnibase_core.models.validation.model_validation_report"
  description: "The canonical OMN-2362 validation report."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "migration_append_only.check"
      handler_type: "migration_append_only_check"
      handler:
        name: "NodeMigrationAppendOnlyCheckCompute"
        module: "omnibase_infra.nodes.node_migration_append_only_check_compute.handler"
      supported_operations:
        - "migration_append_only.check"
descriptor:
  node_archetype: "compute"
  purity: "pure"
  idempotent: true
  timeout_ms: 30000
metadata:
  description: "Pure COMPUTE node preserving the OMN-16705 append-only migration guard."
