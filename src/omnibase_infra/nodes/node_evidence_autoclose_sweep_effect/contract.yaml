# ONEX Node Contract - Evidence Autoclose Sweep Effect
#
# OMN-16106 first slice: companion-merge -> dod_verify -> governed Done flip.
#
# Enumerates onex_change_control PRs merged in a lookback window, extracts
# each merged companion's Evidence-Ticket binding, re-runs the EXISTING
# `onex skill dod_verify <ticket>` verifier exactly as the controller does
# for governed flips, and either flips the bound Linear ticket Done (all
# ACs receipt-proven, zero failed) or posts the honest gap as a comment
# (never flips on any gap). DRY-RUN by default (apply=false); ANY ambiguity
# (missing binding, ambiguous multi-ticket companion, dod_verify non-zero
# exit, Linear API error) fails closed.
#
# Related Tickets:
#   - OMN-16106: this ticket (first slice)
#   - OMN-13856: dod_verify / DurableEvidenceGate mechanical no-fake-Done guard
#   - OMN-16736: the changed-file listing was read with the wrong GitHub key
#     (`path` instead of `filename`), so it was empty for every PR ever
#     scanned and the contracts/<ticket>.yaml binding signal below was dead
#     code — every binding came from the PR title alone. An unreadable files
#     payload now fails closed as an error rather than as an empty list.
#   - OMN-16736 (contract 1.1.0): two further corrections to the verdict path,
#     both found by the first live run in which `node_dod_verify` actually
#     resolved.
#       (a) The dod_verify counts were read from `result.total_checks`. The
#           capture this was corrected against nested every count under
#           `result.terminal_payload`, with `result` carrying only the
#           DISPATCH outcome. The reader therefore saw 0/0 on every run and
#           no flip was reachable at all. The verdict must now also agree
#           with dod_verify's own terminal `status: verified` — counts alone
#           do not authorize a flip. (That correction was right for the arm
#           it was measured on and WRONG as a universal rule; see OMN-16961
#           below, which is the same defect one turn later.)
#       (b) `onex skill dod_verify` exits 1 on every genuine evidence GAP
#           while still printing a complete ModelSkillResult. stdout is now
#           parsed regardless of exit code, so a gap is recorded as a gap
#           instead of ERROR_VERIFY_NONZERO_EXIT ("the verifier crashed").
#           JSON with no verdict in it still fails closed as an error.
#   - OMN-16736 / OMN-14362 (contract 1.1.0): AC-COVERAGE GUARD. dod_verify
#     verifies the checks declared in the OCC contract, so an acceptance
#     criterion that lives only in the ticket's Linear description is
#     structurally invisible to it — "3/3 verified, 0 failed" says nothing
#     about a fourth criterion nobody encoded. Before any flip the description
#     is re-read; an unchecked markdown checkbox, or an acceptance-criteria
#     section listing more items than dod_verify had checks, WITHHOLDS the
#     flip and posts GAP_AC_COVERAGE naming them.
#   - OMN-15911 (contract 1.2.0): PROOF-CLASS GUARD. A green tally does not
#     say what the green legs PROVED. Before OMN-15911 a `gh pr view --json
#     state` read and an executed test suite both terminated in the same
#     `verified`, so `verified_count == total_checks` was satisfiable
#     entirely by "the PR merged" — and this node then wrote into Linear that
#     the ticket's acceptance criteria were receipt-proven. dod_verify now
#     classifies every check verdict and reports
#     `behavior_proving_count` on its verdict (checks that both
#     PASSED and executed the claimed behavior). A flip requires it to be
#     >= 1; zero on an otherwise-clean run WITHHOLDS the flip and posts
#     GAP_NO_BEHAVIOR_PROOF. A verdict carrying no such field at all (an
#     omnimarket predating OMN-15911 — i.e. every historical receipt) is
#     ERROR_VERIFY_UNPARSEABLE, never an inference in either direction.
#   - OMN-16821 (contract 1.3.0): VERDICT-BEARING DENOMINATOR. The flip
#     equality was `verified_count == total_checks` and it was unsatisfiable
#     for most of the corpus, which is why the flip path had never fired
#     once. `total_checks` counts every check carrying a verdict, and
#     `non_probative` (OMN-15391 — executed, exited 0, and its exit status
#     cannot depend on the product change) IS one of those verdicts, so a
#     non-probative entry counted in the denominator and never in the
#     numerator. One of them held a ticket forever regardless of the rest of
#     the evidence, and the ticket was then classified GAP_POSTED and told
#     under --apply that "not all ACs are receipt-proven" by a verifier that
#     had just returned `verified` with zero failures. Measured: OMN-16260
#     reads verified / 12 total / 6 verified / 0 failed / 1 behavior-proving
#     and could not flip. The equality is now
#     `verified_count + non_probative_count == total_checks` — the OMN-15390
#     precedent applied one axis over, since `total_checks` already excludes
#     superseded entries upstream on exactly that reasoning. Strictness is
#     unchanged elsewhere: a real `failed` still gaps, a `skipped` check
#     still gaps (neither verified nor non-probative), and an
#     ALL-non-probative contract still gaps twice over — dod_verify's own
#     status is `skipped` for that shape, and `verified_count > 0` is a
#     conjunct so the merge-state-only corpus can never satisfy the equality
#     by arithmetic. The OMN-15911 behavior conjunct and the OMN-16736
#     AC-coverage guard run after this and are untouched. A verdict omitting
#     `non_probative_count` contributes 0 and collapses back to the older,
#     stricter rule — a fallback that can only withhold a flip. Gap comment
#     wording now names the shortfall actually found instead of asserting the
#     ACs are unproven, and `non_probative_count` joins the OMN-16808 dedup
#     fingerprint because the statement varies with it.
#   - OMN-16905 (contract 1.3.1): REPORT WHAT YOU MEASURED. The outcome row
#     read `behavior_proving_count` off the verdict only inside the
#     `all_verified` branch; every other exit built its outcome without the
#     field and took the model's `default=0`. A gap-path row therefore
#     published a structural 0 that had never been read from the verdict,
#     indistinguishable in the emitted JSON from a measured zero. That is
#     what made this node's own OUTCOME row disagree 1-vs-0 with dod_verify's
#     dump for OMN-16803 in run 33210163405 while the other four counters
#     matched exactly — the other four are read unconditionally, above the
#     branch — and the split was misread as an omnimarket classifier
#     regression between the gate venv and the OMN-16846 dispatch venv. There
#     was no such regression. The read now sits with the other counters and
#     every verdict-bearing exit publishes it; the one branch where 0 does
#     NOT mean "measured zero" (ERROR_VERIFY_UNPARSEABLE, key genuinely
#     absent) states its 0 explicitly. NO DECISION CHANGES: the flip
#     predicate reads the verdict directly and always did, so no ticket's
#     flippability moves. This is reporting fidelity — the row is the
#     machine-readable record the fleet is triaged from, and a counter that
#     reads 0 whenever a ticket is not already flippable cannot distinguish
#     "no behavior proof was declared" from "behavior proof ran, passed, and
#     something else held the flip".
#   - OMN-16961 (contract 1.3.2): READ THE ARM THE RECEIPT DECLARES. OMN-16736
#     (a) above fixed the verdict path against ONE live capture and stated the
#     result as universal: "the live CLI nests every count under
#     `result.terminal_payload`". It does not. `receipt_mode._run_and_emit`
#     emits one of TWO receipts, branching on the run's own outcome:
#       success-like + a handler result -> `result` IS the handler model,
#           FLAT (`ModelDodVerifyState`); NO `terminal_payload` key exists.
#       anything else -> `result` is a `ModelReceiptRuntimeSummary` and the
#           verdict is nested at `result.terminal_payload`.
#     The OMN-16736 capture happened to be a `status: failed` run — the
#     nested arm — so the constant derived from it was correct for that arm
#     and wrong for the other. And dod_verify's workflow result is
#     success-like EXACTLY when its verdict is `verified`, so the arm the
#     reader could not parse was precisely the FLIP-ELIGIBLE one:
#     `tickets_flipped` was not stuck at 0, it was UNREACHABLE by
#     construction for every ticket that satisfied the predicate. Run
#     33258391128 scored 10 of 19 verdict-eligible tickets
#     ERROR_VERIFY_UNPARSEABLE at `exit_code=0` while the diagnose step in
#     the SAME job printed full verdicts from the same bytes — that step's
#     `terminal_payload or envelope` fallback absorbed both arms by accident,
#     so the run contained its own contradiction with the cause invisible in
#     it. The reader now dispatches on `result_model`, the receipt's own
#     declared type tag, and on nothing else. It is deliberately NOT a
#     parser that accepts both shapes by sniffing whichever key is present:
#     an absent or drifted `result_model` is REFUSED BY NAME, because a wrong
#     guess here is a Done flip on evidence nobody read. Strictness is
#     unchanged (OMN-15715): a declared arm carrying no `total_checks` is
#     still an error and never a 0/0 "gap", and no count is ever coerced.
#     What changes is that a refusal now names its own cause — undeclared
#     shape, drifted `result_model`, or a genuinely unreached verdict —
#     instead of the generic "no verdict was reached". Both arms are captured
#     verbatim at tests/fixtures/omn16961/. The diagnose step is fixed the
#     same way: a diagnostic that reads the receipt differently from the
#     reader it is diagnosing cannot diagnose that reader.
#
#   - OMN-16106 (contract 1.4.0), class (c): A READBACK AGAINST A DEAD SURFACE
#     IS HELD, NOT JUDGED. Fourteen tickets in the 2026-08-31 sprint have
#     acceptance criteria that are live readbacks against onex-dev, which has
#     been in CrashLoopBackOff since 2026-09-02. Their dod_verify checks fail,
#     and this node reported that failure as GAP_POSTED -- whose comment
#     asserts "your acceptance criterion is not met". That is a false
#     statement: the check learned NOTHING about the criterion, because the
#     thing under test was down, and the backfill rotation accrued one such
#     comment per turn.
#
#     The per-check records were already on the dod_verify terminal payload
#     (evidence_id / status / message) and this node read only the counters
#     beside them. It now reads the records: a FAILED or UNVERIFIABLE check
#     whose own message carries a surface-unreachable signal
#     (CrashLoopBackOff, connection refused, dial tcp, no such host, i/o
#     timeout, ...) terminates the candidate SKIPPED_LIVE_SURFACE_UNAVAILABLE.
#     Nothing written, nothing judged, candidate re-offered next tick -- so
#     when staging returns the ticket flips with zero human launch.
#
#     Per-check attribution rather than a run-level health flag, deliberately:
#     only some candidates in a run read a live surface at all, and a "staging
#     is down" flag would hold candidates whose evidence is entirely local --
#     a hold nobody can clear.
#
#     The classifier is a message-shape match and its safety argument is
#     DIRECTION, not accuracy: its single call site sits after every flip path
#     has already returned, so the hold is structurally unreachable from a
#     write and can only convert a decision already made to REFUSE. A false
#     positive costs a gap comment that does not get written; it cannot cost a
#     flip. Pinned by a test that reads the source, not by this paragraph.
#
# OMN-16106 D1/D2 — two conjuncts added to the FLIP branch, both narrowings,
# neither of them a change to what counts as proof:
#
#   * the CITED-PR MERGE conjunct replicates the OMN-13856 done-flip guard's
#     `pr_not_merged` refusal inside the closer. That guard sits on the Linear
#     MCP tool seam; the closer writes through the Linear HTTP API from an
#     Actions runner and never crosses it, so on 2026-09-05 the guard refused
#     OMN-17957's flip at 17:21:23Z and the closer wrote it anyway at 17:35Z
#     and again at 19:36Z. A ticket citing a product PR that has not merged is
#     now HELD (`skipped_referenced_pr_unmerged`), never flipped over.
#   * the PRIOR-REVERT fence now anchors on the closer's OWN audit-comment
#     marker and verdict fingerprint. Its previous `actorId`-null discriminator
#     rests on a false premise, measured live: `LINEAR_API_KEY` is a personal
#     key, so the sweep's own flips carry a real `actorId` and the fence could
#     never see one of its own closes being reverted.
#
# Both are HOLDS: nothing is written, nothing is judged, and the candidate is
# re-offered on the next tick.
name: "node_evidence_autoclose_sweep_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 1
  minor: 5
  patch: 0
node_version: "1.6.0"
description: >
  Scheduled sweep wiring companion-merge -> dod_verify -> governed Done flip. Enumerates merged onex_change_control evidence companions, extracts their Evidence-Ticket binding, re-runs dod_verify, and flips Done or posts a gap comment via the Linear API. DRY-RUN by default; ONEX_AUTOCLOSE_DISABLED kill switch checked first.

input_model:
  name: "ModelEvidenceAutocloseSweepRequest"
  module: "omnibase_infra.nodes.node_evidence_autoclose_sweep_effect.models.model_evidence_autoclose_sweep_request"
  description: "Sweep configuration: repo, lookback window, apply flag, safety caps."
output_model:
  name: "ModelEvidenceAutocloseSweepResult"
  module: "omnibase_infra.nodes.node_evidence_autoclose_sweep_effect.models.model_evidence_autoclose_sweep_result"
  description: "Per-ticket outcomes (flipped/gap/skipped/errored) and run-level counts."
# Top-level handler block: RuntimeLocal's single-shot "compute execution path"
# (no terminal_event / no event bus, mirrors node_dod_verify's own contract
# shape) resolves the handler + its input model from THIS block, not from
# handler_routing below. Without it `onex node`/`onex skill` dispatch fails
# closed with "Workflow contract missing 'terminal_event' topic and no
# handler spec found" (RuntimeLocal._resolve_handler_spec /_run_compute).
handler:
  module: "omnibase_infra.nodes.node_evidence_autoclose_sweep_effect.handlers.handler_evidence_autoclose_sweep"
  class: "HandlerEvidenceAutocloseSweep"
  input_model: "omnibase_infra.nodes.node_evidence_autoclose_sweep_effect.models.model_evidence_autoclose_sweep_request.ModelEvidenceAutocloseSweepRequest"
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "sweep_evidence_autoclose"
      handler:
        name: "HandlerEvidenceAutocloseSweep"
        module: "omnibase_infra.nodes.node_evidence_autoclose_sweep_effect.handlers.handler_evidence_autoclose_sweep"
      description: "gh api enumerate -> extract binding -> dod_verify -> Linear flip/comment"
      output_fields:
        - mode
        - disarm_triggered_by
        - flip_budget_remaining
        - companions_scanned
        - backfill_pool_size
        - backfill_candidates_selected
        - bindings_extracted
        - tickets_flipped
        - tickets_gap_posted
        - tickets_skipped
        - tickets_errored
        - outcomes
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
  error_types:
    - name: "GITHUB_ENUMERATION_FAILED"
      description: "gh api PR enumeration failed — sweep-level failure, no tickets processed."
      recoverable: true
      retry_strategy: "none"
    - name: "LINEAR_NOT_CONFIGURED"
      description: "LINEAR_API_KEY not set — every ticket fails closed as ERROR_LINEAR_API."
      recoverable: false
      retry_strategy: "none"
    - name: "DOD_VERIFY_NONZERO_EXIT"
      description: >
        `onex skill dod_verify <ticket>` exited non-zero AND printed no usable verdict (no `total_checks` in the receipt arm its own `result_model` declares — OMN-16961) — fail closed, never flip. A non-zero exit ALONE is not this failure: the CLI exits 1 on every genuine evidence gap while still printing a complete ModelSkillResult, and that case is a gap, not an error (OMN-16736).

      recoverable: true
      retry_strategy: "none"
    - name: "AC_COVERAGE_GAP"
      description: >
        dod_verify was fully green, but the bound ticket's Linear description carries acceptance criteria its checks structurally cannot see — an unchecked markdown checkbox, or an acceptance-criteria section listing more items than dod_verify had checks. The flip is WITHHELD and the uncovered criteria are named in the comment (OMN-16736; the OMN-14362 lesson). Recorded as GAP_AC_COVERAGE and counted under tickets_gap_posted: nothing failed, the evidence base was incomplete. Conservative in exactly one direction — a false hold costs a comment, a false flip writes an unearned Done.

      recoverable: false
      retry_strategy: "none"
    - name: "NO_BEHAVIOR_PROOF"
      description: >
        dod_verify was fully green AND its checks covered the ticket's criteria, but not one passing check executed the claimed behavior — every green leg bound merge state (a PR is merged) or was a surrogate (a file exists, a generic ticket-independent suite ran). That is evidence the code landed, not evidence the system does the thing, so the flip is WITHHELD (OMN-15911). Recorded as GAP_NO_BEHAVIOR_PROOF and counted under tickets_gap_posted for the same reason AC_COVERAGE_GAP is: the mechanism worked, the evidence was not strong enough to close on.

      recoverable: false
      retry_strategy: "none"
    - name: "LIVE_SURFACE_UNAVAILABLE"
      description: >
        A dod_verify per-check verdict failed or became unverifiable because the live surface it reads could not be reached (for example CrashLoopBackOff, connection refused, no such host, i/o timeout, or gateway/service unavailable). The sweep records SKIPPED_LIVE_SURFACE_UNAVAILABLE and withholds both Done flips and evidence-gap comments: the run learned nothing about the acceptance criterion, so the candidate is re-offered on the next tick rather than judged (OMN-16106 class c).

      recoverable: true
      retry_strategy: "none"
    - name: "DOD_VERIFY_PROOF_CLASS_UNREPORTED"
      description: >
        The verdict carried no `behavior_proving_count` — the verifier predates OMN-15911 and cannot say whether any green check proved behavior. Fails closed as ERROR_VERIFY_UNPARSEABLE rather than inferring a value: reading the absence as "zero behavior proof" would post a Linear comment stating a finding the run never made, and reading it as satisfied would flip on exactly the arithmetic the guard exists to stop.

      recoverable: true
      retry_strategy: "none"
    - name: "DUPLICATE_SWEEP_COMMENT"
      description: >
        The sweep reached a gap verdict it has ALREADY posted on this ticket and did not repeat it (OMN-16808). Enumeration is a bare `now - lookback_hours` window with no cursor, so one merged companion sits inside several consecutive scheduled windows; before this guard every one of them posted an identical comment. Every sweep comment now carries a stable marker keyed on (gap class, verdict fingerprint) — NOT on the companion PR, because the same verdict re-derived from a later companion is the same statement — and the ticket's existing comments are read before any write. Recorded as SKIPPED_DUPLICATE_COMMENT and counted under tickets_skipped: the gap is real and still open, but this run added no information, and counting it under tickets_gap_posted would report comments that were never written. A CHANGED verdict has a different fingerprint and IS posted.

      recoverable: false
      retry_strategy: "none"
    - name: "COMMENT_HISTORY_UNREADABLE"
      description: >
        The ticket's existing comments could not be read (Linear API failure, an uninterpretable payload, or a history longer than the paginated read cap), so the sweep cannot establish whether it has already made this statement. Fails closed as ERROR_LINEAR_API and writes nothing (OMN-16808): "I could not check" must never resolve to "so I will post". The flip is withheld on this path regardless — it is only ever reached from a gap classification.

      recoverable: true
      retry_strategy: "none"
    - name: "CALLER_EXCLUDED_TICKET"
      description: >
        The ticket was named in `exclude_tickets` on the request, so the sweep refused it BEFORE its first Linear read — no issue fetch, no dod_verify subprocess, no verdict (OMN-17891). Recorded as SKIPPED_EXCLUDED and counted under tickets_skipped. Ordering is the property being asserted: an excluded candidate that had already been read could still surface as ERROR_LINEAR_API on a transport failure, which reads as "the fence did not apply" rather than "the fence applied". Deliberately distinct from SKIPPED_LABEL — a label is a fact this node observed in Linear, whereas this is an assertion the DISPATCHER made from evidence the node cannot see (an open ledger CLAIM, a red gate, a concurrent controller's ownership), and only one of the two is falsifiable from the ticket itself. It does not weaken the kill switch: ONEX_AUTOCLOSE_DISABLED halts the run before any candidate is enumerated, so an exclusion list can never opt one ticket back into a halted sweep.

      recoverable: false
      retry_strategy: "none"
    - name: "PARENT_HAS_OPEN_CHILDREN"
      description: >
        The ticket is a parent with at least one child not in a completed/canceled state, read live from Linear on this tick (OMN-17658 F-R5-7). Recorded as SKIPPED_HAS_CHILDREN and counted under tickets_skipped. A parent is not done while its own decomposition is open, and dod_verify structurally cannot know that — it verifies the checks in the PARENT's OCC contract, and a child ticket carries its own separate acceptance criteria that never appear there. A `children` connection that cannot be interpreted (absent, malformed, or a full first page that may be truncated) is ERROR_LINEAR_API, never "no children".

      recoverable: true
      retry_strategy: "none"
    - name: "RECURRING_BOT_COMPANION"
      description: >
        The bound companion is the evidence companion of a recurring bot product PR — a standing refresh emission — rather than of a PR that did the ticket's work (OMN-17934). Recorded as SKIPPED_RECURRING_COMPANION. The discriminator is a conjunction of the product PR's author being a GitHub App/Bot AND its title matching the measured pin-bump shape, derived from omnibase_infra#3192 and #3199 and positive-controlled over 300 PRs (16 matches, all bot-authored, zero human). A fetch failure on the product PR is ERROR_GITHUB_API, never a flip: "I could not check" must not resolve to "so I will write".

      recoverable: true
      retry_strategy: "none"
    - name: "PRIOR_CLOSER_FLIP_REVERTED"
      description: >
        The ticket's Linear state history shows a completed segment opened by an integration (actorId null — the shape this sweep's own issueUpdate has) and closed by a real actor (OMN-17934). Somebody has already disagreed with an automated close, and re-closing from the same mechanism would overrule that disagreement with a cron tick. Recorded as SKIPPED_PRIOR_REVERT, and it also DISARMS the rest of the run (see AUTOCLOSE_DISARMED).

      recoverable: true
      retry_strategy: "none"
    - name: "FLIP_BUDGET_EXHAUSTED"
      description: >
        max_flips_per_run was already spent by earlier candidates in this run (OMN-17658). Recorded as SKIPPED_FLIP_BUDGET_EXHAUSTED. A truncation, never a verdict: the evidence cleared every conjunct and the next run offers the candidate again. Checked at the write point rather than at intake, so a candidate that would only have gapped still gets its gap comment.

      recoverable: true
      retry_strategy: "none"
    - name: "AUTOCLOSE_DISARMED"
      description: >
        The run refused to write (OMN-17658). Either the caller handed in `disarmed_by_ticket` from the persisted ONEX_AUTOCLOSE_DISARMED marker, or a candidate mid-run proved a closer flip had already been undone by a person. Every remaining candidate is recorded SKIPPED_DISARMED and the result reports mode=disarmed naming the trigger. Weaker than the kill switch on purpose: a halted run does zero I/O and produces no receipt, and an operator deciding whether to re-arm needs one.

      recoverable: true
      retry_strategy: "none"
    - name: "FLIP_READBACK_UNCONFIRMED"
      description: >
        issueUpdate(stateId) reported success but no completed state-history segment newer than the pre-write head appeared within readback_max_attempts reads (OMN-17658). Recorded as ERROR_READBACK_UNCONFIRMED and counted under tickets_errored, never as a flip: the API agreeing to a request is not evidence the board moved. The outcome still carries applied=true and still posts the audit comment with the class=flipped marker and an explicit UNCONFIRMED line, because the state change WAS written -- measured on run 33958237006, where recording applied=false on a ticket the run had just moved to Done left a receipt that disagreed with the board in the direction nobody checks.

      recoverable: true
      retry_strategy: "none"
    - name: "GITHUB_FILES_PAYLOAD_UNREADABLE"
      # OMN-16736. The changed-file listing is a binding input, not a
      # decoration: `contracts/<ticket>.yaml` entries are what disambiguate a
      # companion whose title names a different (or an additional) ticket. A
      # payload this node cannot interpret is therefore a FETCH FAILURE, and
      # must never be read as "this companion touched zero files" — that
      # reading silently demotes the file signal and lets a title-only match
      # bind a ticket the real listing would have refused as ambiguous.
      description: "`pulls/{n}/files` returned entries carrying no usable `filename` key — treated as ERROR_GITHUB_API, never as an empty changed-file list."
      recoverable: true
      retry_strategy: "none"
io_operations:
  - operation: "sweep_evidence_autoclose"
    description: "Enumerate merged companions, verify, flip Done or post gap comments."
    input_fields:
      - occ_repo
      - lookback_hours
      - backfill_lookback_hours
      - backfill_max_candidates
      - backfill_pool_size
      - backfill_rotation_minutes
      # OMN-17658. `scheduled_apply` is THE arming authority for unattended
      # runs and it is declared HERE, in the contract, rather than in the
      # workflow expression that armed the closer at #3195. `trigger` carries
      # only the fact of what launched the run. `apply` is unchanged and
      # remains the dispatch-time write request.
      - trigger
      - scheduled_apply
      - max_flips_per_run
      - disarmed_by_ticket
      - history_page_size
      - history_max_pages
      - readback_max_attempts
      - readback_delay_seconds
      # OMN-16106: bounded retry for the sweep's own Linear reads. A lost
      # HTTP call ended a candidate's run as ERROR_LINEAR_API with no verdict.
      - linear_retry_max_attempts
      - linear_retry_base_delay_seconds
      - apply
      - max_companions
      - dispatch_cwd
      - dod_verify_timeout_seconds
      - gh_timeout_seconds
      - close_if_done_label
      - exclude_tickets
    output_fields:
      - mode
      - disarm_triggered_by
      - disarm_reason
      - flip_budget_remaining
      - companions_scanned
      - backfill_pool_size
      - backfill_candidates_selected
      - bindings_extracted
      - tickets_flipped
      - tickets_gap_posted
      - tickets_skipped
      - tickets_errored
      - outcomes
      - correlation_id
# Dependencies
# NOTE: the dependency schema's `type` enum (environment/library/service/...)
# has no "external CLI tool" member, so the two runtime tool requirements are
# documented here in prose rather than as invalid schema entries:
#   - `gh` (GitHub CLI), authenticated — paginated PR/file enumeration.
#   - `onex skill dod_verify <ticket>` — the EXISTING verifier, invoked from
#     the sweep interpreter's OWN `onex` binary (OMN-16846: not `uv run`,
#     which would re-resolve the project venv at the cwd and so tie the
#     verifier's environment to the product clone the behaviour checks must
#     run pytest in). The sweep must therefore be launched from an
#     environment where node_dod_verify resolves — the co-installed
#     omnimarket (see omnimarket_drift_guard /
#     scripts/install-node-skill-package.sh).
dependencies:
  - name: "linear_api_key"
    type: "environment"
    env_var: "LINEAR_API_KEY"
    description: "Linear API key for issue read + issueUpdate/commentCreate mutations."
    required: true
  - name: "autoclose_kill_switch"
    type: "environment"
    env_var: "ONEX_AUTOCLOSE_DISABLED"
    description: "Checked first, unconditionally. When set (any non-empty value), the sweep performs zero I/O."
    required: false
  - name: "httpx"
    type: "library"
    library: "httpx"
    description: "Async HTTP client for the Linear GraphQL API."
# Health check
health_check:
  enabled: true
  endpoint: "/health"
  interval_seconds: 300
  checks:
    - name: "linear_configured"
      check_type: "environment"
      env_var: "LINEAR_API_KEY"
      description: "Verify LINEAR_API_KEY is set."
metadata:
  description: "Evidence autoclose sweep: companion-merge -> dod_verify -> governed Done flip (OMN-16106 first slice)"
  author: "OmniNode Team"
  transport_type: "http"
  created: "2026-08-17"
  updated: "2026-09-05"
  tags:
    - "effect"
    - "linear"
    - "github"
    - "dod-verify"
    - "evidence-autoclose"
    - "scheduled-sweep"
