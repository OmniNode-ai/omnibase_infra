name: node_event_provenance_stamp_compute
contract_name: node_event_provenance_stamp_compute
node_name: node_event_provenance_stamp_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: COMPUTE_GENERIC
descriptor:
  node_archetype: compute
description: Stamp an envelope about to be published with the provenance its deployment's overlay declares, and stamp nothing when the overlay is absent, partial or invalid, without I/O.
input_model:
  name: ModelEventProvenanceStampRequest
  module: omnibase_infra.models.event_bus.model_event_provenance_stamp_request
  description: The envelope about to be published and the overlay of the publishing process.
output_model:
  name: ModelEventProvenanceStampResult
  module: omnibase_infra.models.event_bus.model_event_provenance_stamp_result
  description: The envelope to publish, whether it was stamped, and the reason.
capabilities:
  - name: events.provenance.stamp
    description: Stamp where an event came from, or leave it reading unknown.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: events.provenance.stamp
      handler:
        name: HandlerEventProvenanceStamp
        module: omnibase_infra.handlers.handler_event_provenance_stamp.handler
      description: Validate the overlay into the core provenance model and stamp an envelope that has none.
      supported_operations: [events.provenance.stamp]
      input_model:
        name: ModelEventProvenanceStampRequest
        module: omnibase_infra.models.event_bus.model_event_provenance_stamp_request
        description: Envelope and overlay.
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
metadata:
  description: Stamp the provenance a deployment declares on the envelopes its runtime publishes.
  author: OmniNode Team
  license: MIT
  tags: [compute, provenance, events]
  related_tickets: [OMN-23981]
