# ONEX Node Contract
# Node: NodeLedgerProjectionCompute
#
# COMPUTE node that subscribes to 26 topics (7 platform-lifecycle topics plus
# 18 business command/completion/DLQ topics — OMN-15006 — plus 1 external
# steel_onslaught terminal-event topic — OMN-15168) for event ledger
# persistence. This node projects events from the platform event bus into
# the audit ledger for complete traceability and debugging support.
#
# The node subscribes with consumer_purpose="audit" and auto_offset_reset="earliest"
# to ensure no events are missed and all historical events are captured.
#
# Related Tickets:
#   - OMN-1646: Event Ledger Schema and Models
#   - OMN-1647: Ledger Write Effect Node
#   - OMN-1648: Ledger Projection Compute Node
#   - OMN-14823: HandlerLedgerProjection exposes the canonical def-B handle()
#     dispatch entrypoint while preserving ledger.append intent routing.
#   - OMN-15006: widen subscribe_topics from 7 platform-lifecycle topics to
#     25 by adding build_loop (3) + OCC governance (6) + DLQ (9) business
#     topics whose silent loss OMN-15002 documented. The handler
#     (HandlerLedgerProjection) and write-effect (node_ledger_write_effect)
#     are TYPE-AGNOSTIC and required no change — the blindness was a
#     subscription-scoping gap, not a handler bug.
#   - OMN-15168 (epic OMN-15154): widen subscribe_topics from 25 to 26 by
#     adding steel_onslaught's forwarded terminal-match topic
#     (onex.evt.steel-onslaught.match-terminal.v1, OMN-15167). Landed as a
#     PAIRED diff with its handler_routing entry per the OMN-14594 pattern
#     documented below — a bare subscribe_topics addition is "subscribed but
#     never dispatched" (NO_DISPATCHER class); see this ticket's
#     tests/unit/nodes/test_contract_subscription_audit.py pairing-count gate.
#   - OMN-18398: widen subscribe_topics from 26 to 30 by adding the four
#     delegation-chain topics declared as `chain_topology` by
#     node_delegation_chain_ledger_effect. That node reads public.event_ledger
#     for exactly those topics; this node is its only writer, so their absence
#     here made the chain writer's read empty by construction and left
#     public.ledger_chain at zero rows on the .201 dev lane while the writer
#     reported success. Paired subscribe_topics+handler_routing diff, same
#     OMN-14594 pattern as OMN-15168. This change also corrects the declared
#     topic COUNT in the prose above, which still said 26 after OMN-18013
#     deleted six category-less DLQ subscriptions and left 20 in the list.
#     The list is the authority; the count now matches it at 24.
#   - OMN-18419: widen subscribe_topics from 24 to 25 by adding the FIFTH
#     delegation-chain hop, onex.cmd.omnibase-infra.delegation-request.v1 --
#     the pattern-B worker command the runtime's delegation dispatch port
#     publishes while consuming the delegate-skill command. It was on the wire
#     and not in the ledger, so the routing request's recorded parent named an
#     envelope no correlation-scoped read could resolve and chain-canary link 5
#     graded a correct edge red. Paired subscribe_topics+handler_routing diff,
#     same OMN-14594 pattern.
#   - OMN-18964: widen subscribe_topics from 26 to 28 by adding
#     onex.evt.omnibase-infra.quality-gate-result.v1 and
#     onex.evt.omnibase-infra.inference-response.v1, the two recorded parents
#     of a RE-ROUTED delegation's repeat routing request. Third instance of
#     the OMN-18419 class: on the wire, never projected, so every re-routed
#     chain replayed red. Paired subscribe_topics+handler_routing diff, same
#     OMN-14594 pattern.
# Contract identifiers
name: "node_ledger_projection_compute"
contract_name: "node_ledger_projection_compute"
node_name: "node_ledger_projection_compute"
contract_version:
  major: 1
  minor: 6
  patch: 0
node_version: "0.6.0"
# Node type - COMPUTE for event projection logic
node_type: "COMPUTE_GENERIC"
# Description
description: >
  COMPUTE node that subscribes to 28 topics (7 platform-lifecycle + 12 business command/completion/DLQ topics remaining from OMN-15006 after OMN-18013 deleted six category-less DLQ subscriptions + 1 external steel_onslaught terminal-event topic, OMN-15168 + 5 delegation-chain topics, OMN-18398 and OMN-18419 + the second delegation terminal, OMN-18937 + the two delegation re-route parents, OMN-18964) for event ledger persistence. Projects events from the platform event bus into the audit ledger, enabling complete traceability and debugging support. Uses consumer_purpose="audit" to indicate non-processing read-only consumption and auto_offset_reset="earliest" to capture all historical events. Contract 1.6.0 (OMN-18964) adds quality-gate-result.v1 and inference-response.v1, the recorded parents of a re-routed delegation's repeat routing request, without which every re-routed chain replayed red; contract 1.5.0 (OMN-18937) adds the delegation FAILURE terminal, without which a delegation that failed left no trace in event_ledger at all and the chain writer's read was empty by construction; contract 1.4.0 (OMN-18419) adds the fifth delegation-chain hop, delegation-request.v1, without which the routing request's recorded causal parent resolved to nothing; contract 1.3.0 (OMN-18398) adds the four delegation-chain topics the chain-canary link-5 writer reads back out of public.event_ledger; contract 1.2.0 (OMN-15168) adds the steel_onslaught terminal-match topic as a paired subscribe_topics+handler_routing diff; contract 1.1.0 (OMN-15006) widened the truth surface to build_loop + OCC governance + DLQ topics whose silent loss OMN-15002 documented; contract patch 2 (1.0.2) recorded the OMN-14823 canonical def-B handler entrypoint flip.

# Event bus configuration
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  # Subscribe to 28 topics for complete audit coverage: 7 platform-lifecycle
  # topics, plus the 12 business command/completion/DLQ topics that remain from
  # OMN-15006 after OMN-18013 deleted six category-less DLQ subscriptions, plus 1
  # external steel_onslaught terminal-event topic (OMN-15168), plus the 4
  # delegation-chain topics (OMN-18398) plus the fifth (OMN-18419), plus the
  # second terminal (OMN-18937) and the two re-route parents (OMN-18964). Counted
  # from the list below, which is
  # the only authority -- the prose said 26 for as long as the list said 20.
  subscribe_topics:
    # Node lifecycle events
    - "onex.evt.platform.node-registration.v1"
    - "onex.evt.platform.node-introspection.v1"
    - "onex.evt.platform.node-heartbeat.v1"
    # Introspection commands
    - "onex.cmd.platform.request-introspection.v1"
    # FSM state tracking
    - "onex.evt.platform.fsm-state-transitions.v1"
    # Runtime coordination
    - "onex.intent.platform.runtime-tick.v1"
    # State snapshots
    - "onex.evt.platform.registration-snapshots.v1"
    # --- OMN-15006: business command/completion/DLQ topics ---
    # build_loop (3) — EnumOmnibaseInfraTopic.CMD_BUILD_LOOP_APPEND_V1,
    # .EVT_BUILD_LOOP_APPENDED_V1; the completion event is owned by
    # omnimarket's node_build_loop_orchestrator (terminal_event) — literal
    # here because infra ↛ market forbids importing EnumOmnimarketTopic.
    - "onex.cmd.omnibase-infra.build-loop-append.v1"
    - "onex.evt.omnibase-infra.build-loop-appended.v1"
    - "onex.evt.omnimarket.build-loop-orchestrator-completed.v1"
    # OCC governance (6) — onex_change_control.kafka.topics.GovernanceTopic;
    # literals here because infra cannot import onex_change_control's enum.
    - "onex.evt.occ.nightly-promotion.v1"
    - "onex.evt.onex-change-control.governance-check-completed.v1"
    - "onex.evt.onex-change-control.contract-drift-detected.v1"
    - "onex.evt.onex-change-control.cosmetic-compliance-scored.v1"
    - "onex.cmd.omnimarket.redeploy-start.v1"
    - "onex.evt.omnimarket.runtime-deployment-proof.v1"
    # DLQ (9) — EnumOmnibaseInfraTopic.DLQ_*_V1. No evt/cmd/intent segment;
    # message_category is "event" per the source-derived fallback documented
    # on each handler_routing entry below.
    - "onex.dlq.omnibase-infra.commands.v1"
    - "onex.dlq.omnibase-infra.events.v1"
    - "onex.dlq.omnibase-infra.intents.v1"
    # --- OMN-15168 (epic OMN-15154): steel_onslaught terminal-event topic ---
    # ONE shared topic carrying 4 terminal match-lifecycle event classes
    # (MATCH_STARTED/MATCH_ENDED/MATCH_SCORED/VICTORY_DECLARED),
    # discriminated by the payload's own event_type field (plan §4b gate
    # ruling — one topic keeps the allowlist diff, consumer wiring, and
    # ledger legibility to a single surface for 4 low-volume event classes).
    # Literal owned by steel_onslaught (private personal repo, infra ↛ steel
    # forbids importing its code) — cited here byte-for-byte as declared at
    # STEEL_MATCH_TERMINAL_TOPIC in
    # steel_onslaught/src/steel_onslaught/bus/kafka_forwarder.py (OMN-15167,
    # merged f378cd48), same external-literal pattern as the OCC/omnimarket
    # topics above.
    - "onex.evt.steel-onslaught.match-terminal.v1"
    # --- OMN-18398: the four delegation-chain topics ---
    # These are the ordered `chain_topology` declared by
    # node_delegation_chain_ledger_effect's contract. That node reads
    # public.event_ledger for exactly these topics and writes one
    # public.ledger_chain row per observed hop (chain-canary link 5). This node
    # is the ONLY writer of public.event_ledger, so while these four were
    # absent here the chain writer's read was empty BY CONSTRUCTION and
    # ledger_chain held zero rows on the .201 dev lane no matter how the writer
    # behaved. Two literals are owned by omnimarket (infra >/> market forbids
    # importing EnumOmnimarketTopic), same external-literal pattern as the
    # OMN-15006 OCC/omnimarket topics above; two are
    # EnumOmnibaseInfraTopic members. Paired with handler_routing entries below
    # per the OMN-14594 rule -- a bare subscribe_topics addition is
    # subscribed-but-never-dispatched.
    - "onex.cmd.omnimarket.delegate-skill.v1"
    - "onex.cmd.omnibase-infra.delegation-routing-request.v1"
    - "onex.evt.omnibase-infra.routing-decision.v1"
    - "onex.evt.omnimarket.delegate-skill-completed.v1"
    # --- OMN-18937: the OTHER terminal ---
    # A delegation has TWO terminals, not one. The producer declares both
    # (omnimarket node_delegate_skill_orchestrator, `runtime_dispatch.
    # terminal_events` success/failure) and publishes both; the in-repo
    # producer mirror is `src/omnibase_infra/runtime/topics.yaml` (OMN-13202).
    # This node is the ONLY writer of public.event_ledger, so while the
    # failure terminal was absent here a FAILED delegation left zero rows in
    # event_ledger, zero in ledger_chain, and nothing detected it: the
    # contract was internally consistent (one subscription, one paired
    # routing entry), and the chain writer's read came back empty BY
    # CONSTRUCTION rather than erroneously. Measured on chain-canary run
    # 35533286353, correlation b267d3bd-0f60-466e-8c8a-e7c60446e1f0: terminal
    # confirmed on the dev-lane broker, absent from all three tables.
    # Paired with its handler_routing entry below per the OMN-14594 rule.
    - "onex.evt.omnimarket.delegate-skill-failed.v1"
    # --- OMN-18419: the fifth delegation-chain hop ---
    # The pattern-B worker command the runtime's delegation dispatch port
    # publishes while consuming the delegate-skill command. It was always on
    # the wire and never projected, so the routing request's recorded parent
    # pointed at an envelope no chain read could resolve and the edge could
    # not close. node_delegation_chain_ledger_effect's contract 1.1.0 declares
    # it as a hop with delegate-skill as its parent.
    - "onex.cmd.omnibase-infra.delegation-request.v1"
    # --- OMN-18964: the delegation RE-ROUTE's parents ---
    # A delegation is re-routed when a draft misses the quality bar or an
    # inference errors retryably: the orchestrator issues another routing
    # request while consuming the quality-gate-result or the
    # inference-response, and records that envelope as its parent. Neither was
    # projected, so node_delegation_chain_ledger_effect could not observe the
    # parent and every re-routed chain replayed red (12 of 12 over 30 chains
    # on the .201 dev lane). That contract declares both as the routing
    # request's `reroute_parents`.
    - "onex.evt.omnibase-infra.quality-gate-result.v1"
    - "onex.evt.omnibase-infra.inference-response.v1"
  # Audit consumer - read-only, non-processing consumption for ledger persistence
  consumer_purpose: "audit"
  # Start from earliest offset to capture all historical events
  auto_offset_reset: "earliest"
  # Consumer group for ledger projection
  consumer_group: "onex-ledger-projection-compute"
# Strongly typed I/O models
input_model:
  name: "ModelEventMessage"
  module: "omnibase_infra.event_bus.models.model_event_message"
  description: >
    Kafka event message containing raw bytes payload and headers. The compute node processes events from all 25 subscribed topics.

output_model:
  name: "ModelIntent"
  module: "omnibase_core.models.reducer.model_intent"
  description: >
    ModelIntent wrapping ModelPayloadLedgerAppend to be passed to NodeLedgerWriteEffect. Contains the event data with Kafka position for idempotent writes.

# Handler routing - delegates compute logic to handler
#
# OMN-14594: one entry PER topic (topic_match), not one operation_match entry
# spanning all 7. Two compounding defects on the single-entry shape:
#
# 1. No event_model -> no payload_type_matcher (OMN-12416). This dispatcher's
#    7 topics are ALSO subscribed by other nodes (e.g.
#    node_registration_orchestrator); MessageDispatchEngine is a single
#    process-wide engine and dispatch() fans out to EVERY registered route
#    for a topic regardless of which subscriber's own Kafka consume loop
#    triggered the call. Without type-scoping, this dispatcher got invoked
#    for every sibling's domain-shaped envelope too, crashing with
#    ValidationError trying to coerce a domain event dict into
#    ModelEventMessage (the raw kafka wrapper this handler actually needs).
# 2. A SINGLE entry/dispatcher spanning topics of MIXED category (5 .evt +
#    1 .cmd + 1 .intent) can only ever be registered under ONE category
#    (handler_wiring derives it once, from either an explicit
#    message_category or the contract's FIRST subscribe_topic) — so 2 of
#    the 7 topics (request-introspection.v1 = command,
#    runtime-tick.v1 = intent) were silently registered under the wrong
#    category and could never route at all (no error — permanent
#    NO_DISPATCHER, same "quiet" symptom class as OMN-14517).
#
# The fix for both: 7 topic_match entries, each single-topic/single-category,
# sharing the same operation + handler class (safe: OMN-14580 folds topic
# into the dispatcher-ID digest, so same-operation/same-handler/different-
# topic entries get distinct dispatcher IDs instead of colliding) and each
# declaring event_model so OMN-12416 type-scoping applies per topic.
handler_routing:
  routing_strategy: "topic_match"
  handlers:
    - topic: "onex.evt.platform.node-registration.v1"
      operation: ledger.project
      message_category: "event"
      handler_type: "ledger_projection"
      event_model:
        name: "ModelEventMessage"
        module: "omnibase_infra.event_bus.models.model_event_message"
      handler:
        name: "HandlerLedgerProjection"
        module: "omnibase_infra.nodes.node_ledger_projection_compute.handlers.handler_ledger_projection"
      supported_operations:
        - "ledger.project"
    - topic: "onex.evt.platform.node-introspection.v1"
      operation: ledger.project
      message_category: "event"
      handler_type: "ledger_projection"
      event_model:
        name: "ModelEventMessage"
        module: "omnibase_infra.event_bus.models.model_event_message"
      handler:
        name: "HandlerLedgerProjection"
        module: "omnibase_infra.nodes.node_ledger_projection_compute.handlers.handler_ledger_projection"
      supported_operations:
        - "ledger.project"
    - topic: "onex.evt.platform.node-heartbeat.v1"
      operation: ledger.project
      message_category: "event"
      handler_type: "ledger_projection"
      event_model:
        name: "ModelEventMessage"
        module: "omnibase_infra.event_bus.models.model_event_message"
      handler:
        name: "HandlerLedgerProjection"
        module: "omnibase_infra.nodes.node_ledger_projection_compute.handlers.handler_ledger_projection"
      supported_operations:
        - "ledger.project"
    - topic: "onex.cmd.platform.request-introspection.v1"
      operation: ledger.project
      message_category: "command"
      handler_type: "ledger_projection"
      event_model:
        name: "ModelEventMessage"
        module: "omnibase_infra.event_bus.models.model_event_message"
      handler:
        name: "HandlerLedgerProjection"
        module: "omnibase_infra.nodes.node_ledger_projection_compute.handlers.handler_ledger_projection"
      supported_operations:
        - "ledger.project"
    - topic: "onex.evt.platform.fsm-state-transitions.v1"
      operation: ledger.project
      message_category: "event"
      handler_type: "ledger_projection"
      event_model:
        name: "ModelEventMessage"
        module: "omnibase_infra.event_bus.models.model_event_message"
      handler:
        name: "HandlerLedgerProjection"
        module: "omnibase_infra.nodes.node_ledger_projection_compute.handlers.handler_ledger_projection"
      supported_operations:
        - "ledger.project"
    - topic: "onex.intent.platform.runtime-tick.v1"
      operation: ledger.project
      message_category: "intent"
      handler_type: "ledger_projection"
      event_model:
        name: "ModelEventMessage"
        module: "omnibase_infra.event_bus.models.model_event_message"
      handler:
        name: "HandlerLedgerProjection"
        module: "omnibase_infra.nodes.node_ledger_projection_compute.handlers.handler_ledger_projection"
      supported_operations:
        - "ledger.project"
    - topic: "onex.evt.platform.registration-snapshots.v1"
      operation: ledger.project
