        module: "omnibase_infra.nodes.node_ledger_projection_compute.handlers.handler_ledger_projection"
      supported_operations:
        - "ledger.project"
    # --- OMN-15006: business command/completion/DLQ topics (18 entries) ---
    # Same OMN-14594 pattern as above: one topic_match entry PER topic,
