name: "node_build_clock_compute"
contract_name: "node_build_clock_compute"
node_name: "node_build_clock_compute"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version:
  major: 1
  minor: 0
  patch: 0
node_type: "COMPUTE_GENERIC"
runtime_profiles: [main]
descriptor:
  node_archetype: compute
description: >
  Judges a runtime /health reading (the reason it is not a pass, any degraded monitor). Takes a runtime container's start stamp and the time of its first passing /health and returns the minutes between, the limit and a pass or fail verdict. The deploy agent reads the two stamps per build and fails a dev build past 5 minutes (OMN-26316).

input_model:
  name: "ModelBuildClockRequest"
  module: "omnibase_infra.models.model_build_clock_request"
  description: "Docker State.StartedAt, first healthy time and the limit in minutes."
output_model:
  name: "ModelBuildClock"
  module: "omnibase_infra.models.model_build_clock"
  description: "Minutes to healthy, the limit, and the verdict."
capabilities:
  - name: "build.clock.measure"
    description: "Measure container start to first healthy /health and judge it against the limit"
  - name: "runtime.health.judge"
    description: "Judge one /health reading: why it is not a pass, and any degraded monitor"
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "build.clock.measure"
      handler:
        name: "HandlerBuildClock"
        module: "omnibase_infra.handlers.handler_build_clock"
      description: "Compute the build clock and verdict"
      supported_operations:
        - "build.clock.measure"
      input_model:
        name: "ModelBuildClockRequest"
        module: "omnibase_infra.models.model_build_clock_request"
        description: "Start and first healthy readings."
    - operation: "runtime.health.judge"
      handler:
        name: "HandlerRuntimeHealthReading"
        module: "omnibase_infra.handlers.handler_runtime_health_reading"
      description: "Judge one runtime /health reading"
      supported_operations:
        - "runtime.health.judge"
      input_model:
        name: "ModelRuntimeHealthReading"
        module: "omnibase_infra.models.model_runtime_health_reading"
        description: "Exit code and output of one /health probe."
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
  error_types:
    - name: "ValueError"
      description: "container_started_at is not a Docker time stamp"
      recoverable: false
health_check:
  enabled: true
  endpoint: "/health"
  interval_seconds: 60
  checks:
    - name: "build_clock_handler_loaded"
      type: "handler"
      critical: true
metadata:
  description: "Per-build container start to first healthy clock (OMN-26316)"
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-26"
  tags:
    - compute
    - deploy
    - health
  related_tickets:
    - "OMN-26316"
