# ONEX Node Contract - Scope File Read Effect
#
name: "node_scope_file_read_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 1
  minor: 1
  patch: 1
node_version: "1.1.1"
description: "Reads a plan file from the filesystem and emits its content."
input_model:
  name: "ModelScopeFileReadRequest"
  module: "omnibase_infra.nodes.node_scope_file_read_effect.models.model_scope_file_read_request"
  description: "Request containing the file path to read. output_path is required and non-empty; the caller supplies the write destination, with no default location (OMN-21799)."
output_model:
  name: "ModelScopeFileReadResult"
  module: "omnibase_infra.nodes.node_scope_file_read_effect.models.model_scope_file_read_result"
  description: "Result containing the file content or error. The required non-empty output_path is carried unchanged to downstream handlers (OMN-21799)."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "read_plan_file"
      handler:
        name: "HandlerScopeFileRead"
        module: "omnibase_infra.nodes.node_scope_file_read_effect.handlers.handler_scope_file_read"
      input_model:
        name: "ModelScopeFileReadRequest"
        module: "omnibase_infra.nodes.node_scope_file_read_effect.models.model_scope_file_read_request"
descriptor:
  node_archetype: effect
  purity: side_effect
  idempotent: true
  timeout_ms: 30000
metadata:
  description: "Filesystem read effect for scope-check workflow"
  author: "OmniNode Team"
  created: "2026-04-01"
  tags:
    - "effect"
    - "filesystem"
    - "scope-check"
    - "canary"
