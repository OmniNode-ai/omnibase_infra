name: node_ci_live_contact_effect
contract_name: node_ci_live_contact_effect
node_name: node_ci_live_contact_effect
node_type: EFFECT_GENERIC
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: "OMN-18648: admit CI-tooling PRs only with recorded contact or an explicit explanation."
input_model:
  name: ModelCILiveContactRequest
  module: omnibase_infra.models.model_ci_live_contact_request
  description: "Inspected repository, base/head revisions and actual PR body; no base means index."
output_model:
  name: ModelCILiveContactResult
  module: omnibase_infra.models.model_ci_live_contact_result
  description: "Admission verdict and the changed tests carrying recorded evidence."
event_bus:
  subscribe_topics: ["onex.cmd.platform.ci-live-contact-check.v1"]
  publish_topics: ["onex.evt.platform.ci-live-contact-checked.v1"]
terminal_event: "onex.evt.platform.ci-live-contact-checked.v1"
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: ci_live_contact.check
      handler:
        name: HandlerCILiveContact
        module: omnibase_infra.handlers.handler_ci_live_contact
      event_model:
        name: ModelCILiveContactRequest
        module: omnibase_infra.models.model_ci_live_contact_request
      output_events: [ModelCILiveContactResult]
capabilities:
  - name: ci_live_contact.check
    description: "Refuse CI-tooling changes whose only evidence injects the seam."
metadata:
  ticket: OMN-18648
  author: OmniNode Team
  description: "Recorded-response or replay admission for CI-tooling changes."
  tags: [effect, ci, admission]
