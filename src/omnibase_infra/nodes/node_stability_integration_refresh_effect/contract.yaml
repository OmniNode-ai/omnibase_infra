name: node_stability_integration_refresh_effect
contract_name: node_stability_integration_refresh_effect
node_name: node_stability_integration_refresh_effect
node_type: EFFECT_GENERIC
descriptor:
  node_archetype: effect
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  Integration source of the stability refresh (OMN-26715, operator RULING 2026-11-26T21:08:59Z: the stability lane is the integration test runtime, so release-tag-only no longer binds it). Takes the heads of integration/launch-YYYYMMDD in omnibase_core, omnibase_infra and omnimarket, builds the runtime image locally with stage_workspace.sh, records the current stability image of every core service as the rollback target before any change, recreates those services on the built image keeping every stability volume, and restores the recorded images when /health is not 200 within the declared window.
input_model:
  name: ModelStabilityIntegrationRefreshRequest
  module: omnibase_infra.models.model_stability_integration_refresh_request
  description: The integration date, the compose project and services, the health window and the directory that holds the rollback record.
output_model:
  name: ModelStabilityIntegrationRefreshResult
  module: omnibase_infra.models.model_stability_integration_refresh_result
  description: The outcome (refreshed, rolled_back, build_failed or refused), the heads, the built image, the rollback target and the health reading.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: refresh_stability_integration
      handler: {name: HandlerStabilityIntegrationRefresh, module: omnibase_infra.handlers.handler_stability_integration_refresh}
capabilities:
  - name: stability_lane.integration_refresh
    description: Run the launch integration branches on the stability lane with a recorded rollback target and a health-gated rollback.
metadata:
  ticket: OMN-26715
  author: OmniNode Team
  description: Host-local effect run on the stability host. No runtime bus dependency; never prod, dev or cloud.
  tags: [effect, deployment, stability, integration]
