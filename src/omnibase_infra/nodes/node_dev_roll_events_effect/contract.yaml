name: node_dev_roll_events_effect
contract_name: node_dev_roll_events_effect
node_name: node_dev_roll_events_effect
node_type: EFFECT_GENERIC
descriptor:
  node_archetype: effect
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  Five whys plan roots R1 and R2 on the dev runtime dropouts of 2026-11-10. Host-local effect of the deploy agent, which cannot import omnimarket: publishes the typed dev_runtime_started, dev_roll_manifest (the command id and its issuer) and dev_roll_incident (health probes and the failed container's captured log) events that omnimarket's node_dev_roll_verify_compute and node_dev_roll_failure_capture_effect read. Evidence only: a failed publication is logged and never fails or delays a deploy.
input_model:
  name: ModelDevRuntimeStarted
  module: omnibase_infra.models.model_dev_runtime_started
  description: The start event, the one the start-count node pins; the manifest and incident models sit beside it.
output_model:
  name: ModelDevRuntimeStarted
  module: omnibase_infra.models.model_dev_runtime_started
  description: The published event; the effect returns nothing to its caller.
# The topics by role; contracts/dev_roll_event_topics.py holds the same values (a test pins them).
topics:
  dev_runtime_started: onex.evt.omnimarket.dev-runtime-started.v1
  dev_roll_manifest: onex.evt.omnimarket.dev-roll-manifest.v1
  dev_roll_incident: onex.evt.omnimarket.dev-roll-incident.v1
  # OMN-25912: published before each dev recreate, naming the next recreate time and the reason.
  dev_recreate_announced: onex.evt.omnimarket.dev-recreate-announced.v1
  # OMN-25912: the reader publishes one event per start that broke the one-recreate-a-window rule.
  dev_recreate_violation: onex.evt.omnimarket.dev-recreate-violation.v1
# One incident event carries each failing container's log tail, and a broker message must stay
# under its size limit.
settings:
  log_byte_cap: 262144
  # OMN-25912: the reader (dev_recreate_audit.py) consumes dev_runtime_started, dev_roll_manifest
  # and dev_recreate_announced. An announcement counts for a start when it was published no
  # more than this long before it; a container start counts as a job's start when its
  # StartedAt is within this many seconds of a dev_runtime_started event's.
  audit_announcement_lookback_seconds: 1800
  audit_start_match_tolerance_seconds: 120
  # OMN-26494: the deploy agent adopts a code ref only after its one-shot self-check exits 0, and
  # returns to the previous ref after this many restarts inside this many seconds. The agent
  # keeps its adoption record (current ref, previous ref, start times, refused refs) in its
  # state directory under this name.
  adoption_restart_limit: 5
  adoption_storm_window_seconds: 600
  adoption_state_file: agent-adoption.json
  adoption_self_check_timeout_seconds: 300
  adoption_git_timeout_seconds: 60
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: dev_roll.announce_start
      handler:
        name: DevRollEventsPublisher
        module: omnibase_infra.nodes.node_dev_roll_events_effect.dev_roll_events
      event_model:
        name: ModelDevRuntimeStarted
        module: omnibase_infra.models.model_dev_runtime_started
    - operation: dev_roll.announce_recreate
      handler:
        name: DevRollEventsPublisher
        module: omnibase_infra.nodes.node_dev_roll_events_effect.dev_roll_events
      event_model:
        name: ModelDevRecreateAnnouncement
        module: omnibase_infra.models.model_dev_recreate_announcement
    - operation: dev_roll.audit_recreates
      handler:
        name: DevRecreateAuditReader
        module: omnibase_infra.nodes.node_dev_roll_events_effect.dev_recreate_audit
      event_model:
        name: ModelDevRecreateAuditRequest
        module: omnibase_infra.models.model_dev_recreate_audit_request
capabilities:
  - name: dev_roll.audit
    description: Read the dev start, manifest and recreate announcement events with the container's own start readings and publish one violation event per start that broke the one-recreate-a-window rule.
  - name: dev_roll.announce
    description: Announce each dev runtime start, each accepted dev roll with its issuer, and each failed roll with its evidence.
metadata:
  ticket: OMN-24013
  author: OmniNode Team
  description: Host-local effect called by the dev boot guard inside the deploy agent. Publishes through the agent's own producer.
  tags: [effect, deployment, dev]
