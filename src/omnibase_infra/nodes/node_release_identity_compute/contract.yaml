# ONEX Node Contract
# Node: NodeReleaseIdentityCompute
#
# Pure COMPUTE node for the fresh-deploy fitness "release identity" gate. Receives
# pre-collected inputs (pyproject version, published tags, changed files) and
# returns an exit-code/message decision enforcing that packaged source may not
# merge onto an already-published version without a version bump. No I/O, no side
# effects.
#
# Related Tickets:
#   - OMN-14471: Refactor legacy scripts/check_release_identity.py -> canonical node
#   - OMN-13412: Fresh-deploy fitness gates (original release-identity invariant)
#   - OMN-12515: Imperative-contract guard (scan_freestanding_imperative_io) context
#   - OMN-17240: An EMPTY published-tag set is a PASS only when it is CREDIBLE.
#       The pre-push remote leg transplanted the tree as a `git bundle create ...
#       HEAD` bundle, which carries no refs/tags/ ref, so every lab host evaluated
#       this gate against zero tags and it passed silently. The request now also
#       carries two git-derived provenance markers (repo_is_shallow,
#       repo_origin_is_bundle) and the handler refuses (exit 2,
#       reason_code=tag_state_unavailable) instead of reading a lost tag set as
#       "nothing has been published yet".
# Contract identifiers
name: "node_release_identity_compute"
contract_name: "node_release_identity_compute"
node_name: "node_release_identity_compute"
contract_version:
  major: 1
  minor: 1
  patch: 0
node_version: "0.1.0"
# Node type - COMPUTE for the pure version-ahead / src-change fitness logic
node_type: "COMPUTE_GENERIC"
# Description
description: >
  Pure COMPUTE node for the fresh-deploy fitness release-identity gate. Given the declared pyproject version, the published git tags, the changed-file set, and the checkout's git-derived tag-state provenance, it decides whether packaged source (src/**) is merging onto an already-published version without a bump. An empty published-tag set is a pass only when it is credible: a bundle-cloned or shallow tree, or a declared version with a non-zero patch component, is refused as "tag state unavailable" rather than read as "nothing published yet" (OMN-17240). Returns an exit-code (0/1/2), the target stream, a human-readable message, and a machine-readable reason code. No I/O, no side effects.

# Strongly typed I/O models
input_model:
  name: "ModelReleaseIdentityRequest"
  module: "omnibase_infra.nodes.node_release_identity_compute.models.model_release_identity_request"
  description: >
    Pre-collected gate inputs: raw pyproject.toml project.version string and its path, the raw `git tag --list` lines, the changed-file set (or None when the source-change set is undeterminable and the invariant must be enforced), and the tag-state provenance markers repo_is_shallow / repo_origin_is_bundle. Both markers are read by the collector from the repository's own git state (`git rev-parse --is-shallow-repository`, `git config --get remote.origin.url`), never from a caller-written file, flag or environment variable.

output_model:
  name: "ModelReleaseIdentityDecision"
  module: "omnibase_infra.nodes.node_release_identity_compute.models.model_release_identity_decision"
  description: >
    Gate decision: process exit_code (0 pass/exempt, 1 not-ahead, 2 config error or tag_state_unavailable), the target stream (stdout/stderr), the full message text, and a reason_code (version_ahead | no_packaged_change | no_published_tag | tag_state_unavailable | version_not_ahead | no_pyproject_version | malformed_pyproject_version).

# Handler routing - delegates the pure decision to the handler
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "release_identity.evaluate"
      handler_type: "release_identity"
      handler:
        name: "HandlerReleaseIdentity"
        module: "omnibase_infra.nodes.node_release_identity_compute.handlers.handler_release_identity"
      supported_operations:
        - "release_identity.evaluate"
# Capabilities provided by this node
capabilities:
  - name: "release_identity.evaluate"
    description: "Evaluate the release-identity version-ahead invariant for a diff, refusing when the published-tag state is not credible."
    version: "0.2.0"
# Metadata
metadata:
  description: "Pure COMPUTE node for the fresh-deploy fitness release-identity gate. Enforces that packaged source (src/**) cannot merge onto an already-published version without a version bump, and refuses rather than passing when the published-tag state is not credible (OMN-17240). No I/O, no side effects."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-07-12"
  ticket: "OMN-14471"
  related_tickets:
    - "OMN-17240"
  tags:
    - compute
    - release-identity
    - fresh-deploy-fitness
    - fitness-gate
    - pure-function
    - fail-closed
