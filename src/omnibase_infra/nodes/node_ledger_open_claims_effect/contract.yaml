name: node_ledger_open_claims_effect
contract_name: node_ledger_open_claims_effect
node_name: node_ledger_open_claims_effect
node_type: EFFECT_GENERIC
descriptor:
  node_archetype: effect
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  Host-side reading taken by scripts/git-maintenance.sh (an open CLAIM keeps a worktree and a remote branch) and scripts/reconcile_verify_movement.py (the lane that owns a refused clone's dirty paths). It asks omnimarket's node_work_ledger_reader_effect for the open-claims and the CLAIM rows of one window and joins them by stamp and lane, so a branch name or a path in the claim's text can be matched. A reader that exits 3, 1 or 69 is a refusal, never an empty answer and never a read of the ledger file.
input_model:
  name: ModelLedgerOpenClaimsRequest
  module: omnibase_infra.models.model_ledger_open_claims_request
  description: The command that runs the reader node (interpreter and module), the reader's name in the overlays' moved_readers, and the window in hours; none has a default.
output_model:
  name: ModelLedgerOpenClaimsResult
  module: omnibase_infra.models.model_ledger_open_claims_result
  description: The claims open in the window, oldest first, each with the text of its CLAIM row. A reader that could not answer raises LedgerReadRefusedError instead.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: ledger_open_claims.read
      handler: {name: HandlerLedgerOpenClaims, module: omnibase_infra.handlers.handler_ledger_open_claims}
    - operation: ledger_rows.read
      handler: {name: HandlerLedgerRows, module: omnibase_infra.handlers.handler_ledger_rows}
capabilities:
  - name: ledger.open_claims
    description: Open CLAIMs of a window from the ledger reader node, joined to their CLAIM rows.
  - name: ledger.rows
    description: The rows of named kinds of a window from the ledger reader node (OMN-26507, the pre-PR pool driver's HOLD and RELEASE read); its input is ModelLedgerRowsRequest and its output ModelLedgerRowsResult.
metadata:
  ticket: OMN-20547
  author: OmniNode Team
  description: Host-local effect. No runtime bus dependency of its own; the reader node owns the bus read.
  tags: [effect, ledger]
