# Ticket: OMN-26616
name: "node_check_delegation_local_model_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
runtime_profiles: [main]
description: >
  EFFECT node that binds the delegation local-model doctor diagnosis for an install with no local chat model to its canonical infra handler. A local model is optional: the diagnosis fails only when no model at all is set up, local or hosted.

input_model:
  name: ModelDelegationLocalModelRequest
  module: omnibase_infra.models.delegation.model_delegation_local_model_request
  description: "The hosted providers set up on this machine, or none when the list could not be read."
output_model:
  name: "ModelDelegationDiagnosis"
  module: "omnibase_infra.doctor.model_delegation_diagnosis"
  description: "The delegation local-model diagnosis."
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnibase_infra.handlers.handler_check_delegation_local_model:HandlerCheckDelegationLocalModel"
  handlers:
    - operation: "delegation_local_model.evaluate"
      handler:
        name: "HandlerCheckDelegationLocalModel"
        module: "omnibase_infra.handlers.handler_check_delegation_local_model"
capabilities:
  - "delegation_local_model.evaluate"
descriptor:
  node_archetype: effect
  purity: side_effecting
  idempotent: true
  timeout_ms: 30000
metadata:
  description: "Contract home for OMN-26616 delegation local-model doctor behavior"
  ticket: "OMN-26616"
