name: node_broker_grant_derive_compute
contract_name: node_broker_grant_derive_compute
node_name: node_broker_grant_derive_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: COMPUTE_GENERIC
description: Derive broker grants from a principal's resolved wire bindings, without I/O.
input_model:
  name: ModelBrokerGrantBindings
  module: omnibase_infra.nodes.node_broker_grant_derive_compute.models.model_broker_grant_bindings
  description: Physical topic bindings, explicitly inspected consumer groups and the consumer group prefixes read under.
output_model:
  name: ModelBrokerGrantDerivation
  module: omnibase_infra.nodes.node_broker_grant_derive_compute.models.model_broker_grant_derivation
  description: Sorted topic and group permissions per logical broker; exact unless marked prefixed, and the describe-only wildcard group.
capabilities:
  - name: broker.grant.derive
    description: Derive desired permissions from resolved bus operations.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: broker.grant.derive
      handler:
        name: HandlerBrokerGrantDerive
        module: omnibase_infra.handlers.handler_broker_grant_derive
      description: Pure READ, WRITE and DESCRIBE grant derivation, with prefixed group grants.
      supported_operations: [broker.grant.derive]
      input_model:
        name: ModelBrokerGrantBindings
        module: omnibase_infra.nodes.node_broker_grant_derive_compute.models.model_broker_grant_bindings
        description: Resolved wire operations and group prefixes for one principal.
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
metadata:
  description: Derive broker topic and group grants, prefixed group grants and the describe-only wildcard included, from a principal's resolved wire bindings, without I/O.
  author: OmniNode Team
  license: MIT
  tags: [compute, broker, grants]
  related_tickets: [OMN-19939, OMN-17427, OMN-19975]
