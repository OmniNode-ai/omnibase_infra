name: node_broker_grant_derive_compute
contract_name: node_broker_grant_derive_compute
node_name: node_broker_grant_derive_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: COMPUTE_GENERIC
description: Derive exact broker grants from a principal's resolved wire bindings, without I/O.
input_model:
  name: ModelResolvedBusBindings
  module: omnibase_core.models.event_bus.model_resolved_bus_bindings
  description: Physical topic bindings and explicitly inspected consumer groups.
output_model:
  name: ModelBrokerGrantDerivation
  module: omnibase_infra.nodes.node_broker_grant_derive_compute.models.model_broker_grant_derivation
  description: Sorted exact topic and group permissions per logical broker.
capabilities:
  - name: broker.grant.derive
    description: Derive desired permissions from resolved bus operations.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: broker.grant.derive
      handler:
        name: HandlerBrokerGrantDerive
        module: omnibase_infra.handlers.handler_broker_grant_derive
      description: Pure READ, WRITE and DESCRIBE grant derivation.
      supported_operations: [broker.grant.derive]
      input_model:
        name: ModelResolvedBusBindings
        module: omnibase_core.models.event_bus.model_resolved_bus_bindings
        description: Resolved wire operations for one principal.
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
metadata:
  description: Derive exact broker topic and group grants from a principal's resolved wire bindings, without I/O.
  author: OmniNode Team
  license: MIT
  tags: [compute, broker, grants]
  related_tickets: [OMN-19939, OMN-17427]
