name: node_dev_boot_guard_effect
contract_name: node_dev_boot_guard_effect
node_name: node_dev_boot_guard_effect
node_type: EFFECT_GENERIC
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: Dev-only host boot supervision; invoked locally by the deploy agent outside the runtime it recovers.
input_model:
  name: ModelDevBootRequest
  module: omnibase_infra.models.model_dev_boot_request
  description: Local boot operation.
output_model:
  name: ModelDevBootResult
  module: omnibase_infra.models.model_dev_boot_result
  description: Successful operation; boot failures raise and retain the failed deploy verdict.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: prepare
      handler: {name: HandlerDevBootGuard, module: omnibase_infra.handlers.handler_dev_boot_guard}
    - operation: wait
      handler: {name: HandlerDevBootGuard, module: omnibase_infra.handlers.handler_dev_boot_guard}
    - operation: preflight
      handler: {name: HandlerDevBootGuard, module: omnibase_infra.handlers.handler_dev_boot_guard}
    - operation: report
      handler: {name: HandlerDevBootGuard, module: omnibase_infra.handlers.handler_dev_boot_guard}
capabilities:
  - name: dev_boot.supervise
    description: Retain healthy dev images and settings and supervise boot before accepting a deploy.
metadata:
  ticket: OMN-21279
  author: OmniNode Team
  description: Host-local effect. No runtime bus dependency and no prod or customer runner admission.
  tags: [effect, deployment, dev]
