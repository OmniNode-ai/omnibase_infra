# ONEX Node Contract - Runtime Manifest Reducer Node (OMN-11197)
#
# OMN-15512 (contract_version 1.1.0): the emitted intent payload
#   ModelPayloadInsertRuntimeManifest gained one optional field,
#   `attach_readiness: ModelRuntimeAttachReadiness | None` (default None),
#   carrying the boot attach-readiness blocker set on the SAME
#   runtime-manifest-published envelope this node already subscribes to.
#   HandlerPostgresRuntimeManifestInsert flattens it across four new
#   runtime_manifests columns (attach_state, attach_required_contracts,
#   attach_attached_contracts, attach_not_ready_contracts) added by forward
#   migration 095. Additive and backward-compatible: the field is optional and
#   a payload omitting it writes attach_state='unknown' (never 'ready'). No
#   change to subscribe_topics, handler routing, or the target table. (2026-07-30)
#
# OMN-17296 (contract_version 1.2.0): the handler entry now declares its
#   `event_model` (ModelRuntimeManifestPublished), and
#   HandlerPostgresRuntimeManifestInsert.handle() takes the single event
#   envelope the auto-wiring adapter actually passes instead of the
#   (payload, correlation_id) pair no dispatch path ever supplied. Before this,
#   every event on the subscribed topic dead-lettered with
#   `TypeError: handle() missing 1 required positional argument:
#   'correlation_id'` — 455 of the newest 600 records on the dev lane's
#   onex.dlq.omnibase-infra.events.v1, measured 2026-09-16. The `intent_emission`
#   block below remains a declaration with no runtime consumer; the fold it
#   describes is now performed by
#   ModelPayloadInsertRuntimeManifest.from_manifest_event. Minor, not major:
#   subscribe_topics, the operation name, the intent payload shape and the target
#   table are all unchanged. (2026-09-16)
contract_version:
  major: 1
  minor: 2
  patch: 0
node_version: "1.2.0"
name: "node_runtime_manifest_reducer"
node_type: "REDUCER_GENERIC"
description: "Append-only reducer that persists runtime manifests to PostgreSQL. Receives runtime-manifest-published events and inserts one row per startup into runtime_manifests, including the boot attach-readiness blocker set (OMN-15512)."
input_model:
  name: "ModelReducerInput"
  module: "omnibase_core.models.reducer.model_reducer_input"
  description: "Reducer input containing runtime manifest event and trigger."
output_model:
  name: "ModelReducerOutput"
  module: "omnibase_core.models.reducer.model_reducer_output"
  description: "Reducer output containing projection intents."
event_bus:
  subscribe_topics:
    - "onex.evt.omnibase-infra.runtime-manifest-published.v1"
  publish_topics: []
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "postgres.insert_runtime_manifest"
      handler:
        name: "HandlerPostgresRuntimeManifestInsert"
        module: "omnibase_infra.nodes.node_runtime_manifest_reducer.handlers.handler_postgres_runtime_manifest_insert"
      # OMN-17296 fix 2: without this declaration the dispatch adapter takes its
      # event_model-is-None branch, never validates the wire payload into the
      # published event model, and hands the handler an object it cannot fold.
      # With it, the adapter coerces the payload and materializes a typed
      # envelope, which is also how the handler reads the boot correlation id.
      event_model:
        name: "ModelRuntimeManifestPublished"
        module: "omnibase_infra.runtime.models.model_runtime_manifest_published"
        description: "Boot runtime manifest snapshot carried on the subscribed topic, folded into the INSERT payload by ModelPayloadInsertRuntimeManifest.from_manifest_event."
intent_emission:
  enabled: true
  intents:
    - intent_type: "postgres.insert_runtime_manifest"
      target_pattern: "postgres://runtime_manifests/{runtime_profile}"
      payload_model: "ModelPayloadInsertRuntimeManifest"
      payload_module: "omnibase_infra.nodes.node_runtime_manifest_reducer.models.model_payload_insert_runtime_manifest"
      description: "INSERT runtime manifest row into PostgreSQL runtime_manifests table (append-only, never UPDATE). Writes 17 columns: the 13 base manifest columns plus the four OMN-15512 attach-readiness columns flattened from the payload's optional attach_readiness field — attach_state (EnumRuntimeReadinessState value — ready/degraded/failed — or 'unknown' when the aggregate is absent), attach_required_contracts and attach_attached_contracts (counts), and attach_not_ready_contracts (JSON array of the blocker-set results). Dedup key (runtime_profile, topology_hash, started_at) is unchanged."
node_capabilities:
  processing: true
dependencies:
  - name: "container"
    type: "ModelONEXContainer"
    module: "omnibase_core.models.container.model_onex_container"
    description: "ONEX dependency injection container"
health_check:
  enabled: true
  endpoint: "/health"
  interval_seconds: 30
metadata:
  description: "Append-only reducer persisting runtime startup manifests to PostgreSQL. OMN-15512 (contract_version 1.1.0): the intent payload carries an optional attach_readiness aggregate that the handler flattens into four runtime_manifests columns, making the boot NOT-READY blocker set durably queryable instead of log-only."
  author: "OmniNode Team"
  created: "2026-05-17"
  updated: "2026-07-30"
  tags:
    - "reducer"
    - "runtime-manifest"
    - "projection"
    - "append-only"
    - "attach-readiness"
  related_tickets:
    - "OMN-11197"
    - "OMN-11188"
    - "OMN-15512"
    - "OMN-15508"
