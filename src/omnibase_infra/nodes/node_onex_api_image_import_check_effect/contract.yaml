#
# ONEX Node Contract
# Node: NodeOnexApiImageImportCheckEffect
#
# Decides whether a candidate onex-api image may keep the advanced
# ONEX_API_IMAGE pin: one throwaway container finds every module-level
# omnimarket import the application names, and a missing one puts the previous
# pin back before anything is recreated.
#
# Related Tickets:
#   - OMN-23039
name: "node_onex_api_image_import_check_effect"
contract_name: "node_onex_api_image_import_check_effect"
node_name: "node_onex_api_image_import_check_effect"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
node_type: "EFFECT_GENERIC"
# Only node_archetype: the check-no-io-outside-effects hook keys its I/O rule on it.
descriptor:
  node_archetype: effect
description: >
  Import-checks a candidate onex-api image through an injected command runner and, when it cannot import what the application imports at module level (or the check cannot run), writes the previous pin back and reports the refusal. The deploy agent calls it between the repoint and the recreate.

input_model:
  name: "ModelOnexApiImageImportRequest"
  module: "omnibase_infra.models.model_onex_api_image_import_request"
  description: "The candidate image, the env file holding the pin, and the pin to restore."
output_model:
  name: "ModelOnexApiImageImportVerdict"
  module: "omnibase_infra.models.model_onex_api_image_import_verdict"
  description: "Whether the image imports, whether the pin was rolled back, and why."
capabilities:
  - name: "onex_api.image_import_check"
    description: "Import-check a candidate onex-api image and roll the pin back on failure"
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "onex_api.image_import_check"
      handler:
        name: "HandlerOnexApiImageImportCheck"
        module: "omnibase_infra.handlers.handler_onex_api_image_import_check"
      description: "Run the import check in a throwaway container; restore the previous pin on failure"
      input_model:
        name: "ModelOnexApiImageImportRequest"
        module: "omnibase_infra.models.model_onex_api_image_import_request"
        description: "The candidate image and the pin to restore."
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
  error_types:
    - name: "ImportCheckCouldNotRun"
      description: "The check could not run, which is reported as a failure and keeps the previous pin"
      recoverable: false
health_check:
  enabled: true
  endpoint: "/health"
  interval_seconds: 30
  checks:
    - name: "import_check_handler_loaded"
      type: "handler"
      critical: true
metadata:
  description: "Gate for the dev onex-api pin delivery"
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-09"
  tags:
    - effect
    - onex-api
    - deploy-agent
  related_tickets:
    - "OMN-23039"
