name: node_stability_rollback_waiver_effect
contract_name: node_stability_rollback_waiver_effect
node_name: node_stability_rollback_waiver_effect
node_type: EFFECT_GENERIC
descriptor:
  node_archetype: effect
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  Stability-only decision taken by the lab deploy agent when a runtime or full deploy has no retained rollback point. The deploy runs only when the agent's own probe of every runtime target reads the lane down with no timeout; a lane that reads healthy or unknown is refused, and prod and dev are never waived.
input_model:
  name: ModelStabilityRollbackWaiverRequest
  module: omnibase_infra.models.model_stability_rollback_waiver_request
  description: The lane, the deploy scope, whether a point was retained and the guard probe's reading of each runtime target.
output_model:
  name: ModelStabilityRollbackWaiverResult
  module: omnibase_infra.models.model_stability_rollback_waiver_result
  description: Whether the deploy is admitted, the lane reading and, when refused, the refusal text.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: decide_waiver
      handler: {name: HandlerStabilityRollbackWaiver, module: omnibase_infra.handlers.handler_stability_rollback_waiver}
capabilities:
  - name: stability_lane.rollback_waiver
    description: Let the deploy that recovers a stability lane read down by the agent's own probe run with no retained rollback point, and record that it did.
metadata:
  ticket: OMN-24562
  author: OmniNode Team
  description: Host-local effect. No runtime bus dependency and no prod or customer runner admission.
  tags: [effect, deployment, stability]
