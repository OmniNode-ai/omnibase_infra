name: node_declared_state_diff_compute
contract_name: node_declared_state_diff_compute
node_name: node_declared_state_diff_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: COMPUTE_GENERIC
description: Plan the operations that move one surface's observed items to its declared items, without I/O.
input_model:
  name: ModelDeclaredStateDiffRequest
  module: omnibase_infra.models.declared_state.model_declared_state_diff_request
  description: The declared items and one round's observations of one surface.
output_model:
  name: ModelDeclaredStateDiff
  module: omnibase_infra.models.declared_state.model_declared_state_diff
  description: Create, update and delete operations, or the reason the surface was unobservable.
capabilities:
  - name: declared_state.diff
    description: Diff declared state against observed state.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: declared_state.diff
      handler:
        name: HandlerDeclaredStateDiff
        module: omnibase_infra.handlers.handler_declared_state_diff
      description: Pure diff; an unreadable or unreached item makes the surface unobservable.
      supported_operations: [declared_state.diff]
      input_model:
        name: ModelDeclaredStateDiffRequest
        module: omnibase_infra.models.declared_state.model_declared_state_diff_request
        description: Declaration and observations of one surface.
error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
metadata:
  description: Plan declared-state operations from one round's observations, without I/O.
  author: OmniNode Team
  license: MIT
  tags: [compute, declared-state, reconcile]
  related_tickets: [OMN-19944, OMN-17427]
