# NOTE (OMN-17792): this file is MACHINE-RENDERED by
# scripts/generate_application_database_table_grants.py, which re-serialises the
# whole document and keeps only column-0 `#` lines like these. An indented
# comment inside a principals block does not survive, and its loss reads as
# derivation drift on the next --check. Rationale for a principal therefore goes
# in the migration that provisions it and in its test module, not here.
# `validator_ro` (read-only validation identity, CONNECT + schema USAGE, no
# binding): tests/unit/topology/test_validator_ro_principal_omn17792.py. Its
# migration (104, OMN-17792) is RETIRED until OMN-17923 carries this principal
