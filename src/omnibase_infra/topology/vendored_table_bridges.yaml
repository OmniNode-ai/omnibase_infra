#
# Vendored node-migration tables bridged ahead of their omnimarket contracts.
# Read by table_grant_derivation.LEGACY_MIGRATION_TABLE_DECLARATIONS. Each entry
# names the vendored create migration under
# docker/migrations/forward/nodes/<node>/<create>; a later migration in that
# directory grants omninode_runtime SELECT, INSERT, UPDATE. A relation is
# <prefix><table>. Each bridge expires when the omnimarket node contract
# reaches the pin (tests/ci/test_supplemental_declaration_expiry_omn18863.py).
# opts: optional schema (default omninode_internal) and access (default
# read_write) for the declaration.
- ticket: OMN-23055 # the store opens its own connection, so no db_io binding
  node: node_gate_store_effect
  create: 0000_create_gate_store.sql
  prefix: gate_store_
  opts: {}
  tables: [state, reservations, safety, steps]
- ticket: OMN-23341
  node: node_projection_goal_trace
  create: 0000_create_goal_trace_events.sql
  prefix: ""
  opts: {}
  tables: [goal_trace_events, goal_traces]
# OMN-24323: infra vendors experiment_arm_results (node_projection_experiment_result
# 0000-0002) ahead of the omnimarket node contract. The node writes through the
# tenant_projection binding; 0001 grants tenant_projection_writer SELECT, INSERT,
# UPDATE and the FORCE RLS step (0002) is fenced for the operator release.
- ticket: OMN-24323 # omnimarket OMN-24286
  node: node_projection_experiment_result
  create: 0000_create_experiment_arm_results.sql
  prefix: ""
  opts: {schema: public}
  tables: [experiment_arm_results]
