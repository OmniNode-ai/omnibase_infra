#
# Vendored node-migration tables bridged ahead of their omnimarket contracts.
# Read by table_grant_derivation.LEGACY_MIGRATION_TABLE_DECLARATIONS. Each entry
# names the vendored create migration under
# docker/migrations/forward/nodes/<node>/<create>; a later migration in that
# directory grants omninode_runtime SELECT, INSERT, UPDATE. A relation is
# <prefix><table>. Each bridge expires when the omnimarket node contract
# reaches the pin (tests/ci/test_supplemental_declaration_expiry_omn18863.py).
# opts: optional schema (default omninode_internal) and access (default
# read_write) for the declaration.
- ticket: OMN-23055 # the store opens its own connection, so no db_io binding
  node: node_gate_store_effect
  create: 0000_create_gate_store.sql
  prefix: gate_store_
  opts: {}
  tables: [state, reservations, safety, steps]
# OMN-24323: infra vendors experiment_arm_results (node_projection_experiment_result
# 0000-0002) ahead of the omnimarket node contract. The node writes through the
# tenant_projection binding; 0001 grants tenant_projection_writer SELECT, INSERT,
# UPDATE and the FORCE RLS step (0002) is fenced for the operator release.
- ticket: OMN-24323 # omnimarket OMN-24286
  node: node_projection_experiment_result
  create: 0000_create_experiment_arm_results.sql
  prefix: ""
  opts: {schema: public}
  tables: [experiment_arm_results]
# OMN-26663: infra vendors lab_alerts (node_projection_lab_alerts 0000-0001) ahead
# of the omnimarket node contract (omnimarket#6788); 0001 grants omninode_runtime
# SELECT, INSERT, UPDATE and no DELETE: a cleared alert stays as a cleared row.
# Retired when the omnimarket pin carries the node.
- ticket: OMN-26663 # omnimarket#6788
  node: node_projection_lab_alerts
  create: 0000_create_lab_alerts.sql
  prefix: ""
  opts: {}
  tables: [lab_alerts]
# OMN-26708: infra vendors lane_work_workflow (node_projection_lane_work 0000-0001) ahead
# of the omnimarket node contract (omnimarket#6964's projection node); 0001 grants
# omninode_runtime SELECT, INSERT, UPDATE and no DELETE: a workflow's row is never removed.
# Retired when the omnimarket pin carries the node.
- ticket: OMN-26708
  node: node_projection_lane_work
  create: 0000_create_lane_work_workflow.sql
  prefix: ""
  opts: {}
  tables: [lane_work_workflow]
# OMN-26635: infra vendors the overlay store write tables (node_projection_overlay_store
# 0003-0004) ahead of the omnimarket node contract; 0004 grants omninode_runtime
# SELECT, INSERT, UPDATE. Retired when omnimarket#6761 reaches the pin.
- ticket: OMN-26635 # omnimarket#6761
  node: node_projection_overlay_store
  create: 0003_overlay_store_revision_provenance_audit.sql
  prefix: overlay_store_
  opts: {}
  tables: [revision, write, provenance, audit]
