description: >-
  I/O ownership for the shared collector adapter used by HandlerCensusOneshot. This package reads the node policy and completion plans, owns temporary sample workspaces, invokes the existing collector, and provides the clock. Grading and bounded follow-up decisions remain in HandlerCensusOneshot, dispatched by node_census_oneshot_effect.
