name: work_ledger_query_client
description: Dev-lane client of omnimarket node_work_ledger_query_effect (OMN-20740).
event_bus:
  publish_topics: [onex.cmd.omnimarket.work-ledger-query-requested.v1]
  subscribe_topics: [onex.evt.omnimarket.work-ledger-query-completed.v1]
client:
  lane: dev
  consumer_group_prefix: local.omnimarket.work_ledger_query_client.consume.v1.
  queries: [rows, open-claims, holds, inbox, newest-per-lane, rulings, open-rulings]
  # Answered from work_ledger_state with a status, a page size and a watermark
  # (omnimarket OMN-21948); they carry no freshness or parity.
  point_queries: [open-claims, holds, inbox, open-rulings]
# The proof the dev deploy agent takes after every dev runtime recreate (OMN-25942):
# one bounded read through the lab read node, run from the agent's own lab host. The
# roll reports failed, and the previous image is kept, unless it answers in time.
# ``argv`` is the ``onex`` command line and ``timeout_s`` its bound in seconds.
post_roll_proof:
  argv: [ledger, query, --query, rows, --limit, "1"]
  timeout_s: 10
