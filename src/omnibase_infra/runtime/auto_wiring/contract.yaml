# ONEX Archetype Declaration -- src/omnibase_infra/runtime/auto_wiring/
#
# This directory is not a node. It is the runtime's handler auto-wiring package:
# it reads the process environment, the clock, contract files and the database
# catalog in order to bind handlers to their node contracts at boot. That is
# effect work by nature, and nothing here is a compute half.
#
# The check-no-io-outside-effects hook (OMN-21532, K4) judges a module against the
# NEAREST contract.yaml above it. With no contract above this directory, its
# package_scope.nodeless_module_patterns row ('^(?!(?:.*/)?tests/)(?:.*/)?handler_[^/]*\.py$')
# judged handler_wiring.py as non-EFFECT, so every PR that touched the file failed on
# the module's own environment, clock and database surfaces. This file supplies the
# missing declaration. Same approach as src/omnibase_infra/handlers/contract.yaml.
#
# Only the archetype: K4 reads node_type, then descriptor.node_archetype, and
# exempts 'effect' alone.
#
# Related tickets:
#   - OMN-21532: K4, the no_io_outside_effects rule
#   - OMN-17427: epic
node_type: "EFFECT_GENERIC"
descriptor:
  node_archetype: effect
