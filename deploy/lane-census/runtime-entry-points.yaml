# OMN-21923 (one-runtime plan T24): the entry-point policy the lane census grades
# runtime-image containers against. T27 owns the final allowed list; until it lands
# the image runs one command, `onex-runtime`, and every other command reads as an
# entry point to remove.
schema_version: "1.0.0"
# An image reference matching any of these is a runtime-image container: compose
# builds every service that runs the runtime image under <project>-<service>.
runtime_image_patterns:
  - '-(omninode-runtime|runtime-effects|runtime-worker|runtime-canary|omninode-contract-resolver|projection-[a-z-]+|[a-z-]+-consumer|[a-z-]+-forwarder)$'
# The image entrypoint's wrapper tokens, stripped before the command is graded.
launcher_prefix: [/usr/bin/tini, "--", /app/entrypoint-runtime.sh]
# A container started through the launcher is a runtime-image container whatever its image
# reference reads: the gateway forwarder runs the runtime image under an env-supplied tag.
launcher_marks_runtime_image: true
allowed_commands:
  - onex-runtime
# Entry points the table reports as one row.
entry_point_families:
  - label: "python -m ...consumer"
    pattern: '^python -m .*\.consumer$'
  - label: "python -m omnimarket...handler_*"
    pattern: '^python -m omnimarket\..*\.handler_[a-z_]+$'
