        replicas: 1
      - name: omnimarket-prepr-1-projection-live-events-writer
        kind: service
        replicas: 1
      - name: omnimarket-prepr-1-tenant-projection-writer
        kind: service
        replicas: 1
      # The slot's own gateway API, on the slot's port. The dev lane's is the
      # unprefixed `onex-api`, which is why this one carries the slot infix: two
      # containers cannot share a name on one host.
      - name: onex-api-prepr-1
        kind: service
        replicas: 1
  prepr-2:
    hosts: [lab-201]
    compose_file: docker/docker-compose.prepr.yml
    compose_project: omnibase-infra-prepr-2
    network: omnibase-infra-network
    image_tag_pattern: '.+'
    optional: true
    services:
      - name: omninode-prepr-2-runtime
        kind: service
        replicas: 1
      - name: omninode-prepr-2-runtime-effects
        kind: service
        replicas: 1
      - name: omninode-prepr-2-runtime-worker
        kind: service
        replicas: 1
      - name: omnimarket-prepr-2-projection-api
        kind: service
        replicas: 1
      - name: omnimarket-prepr-2-projection-tenant-registry-writer
        kind: service
        replicas: 1
      - name: omnimarket-prepr-2-projection-delegation-writer
        kind: service
        replicas: 1
      - name: omnimarket-prepr-2-projection-registration-writer
        kind: service
        replicas: 1
      - name: omnimarket-prepr-2-projection-savings-writer
        kind: service
