  # ci-bus — the fleet's DEDICATED CI bus broker (OMN-18691)
  # ---------------------------------------------------------------------------
  # NOT A RUNTIME LANE, and declared here anyway. It runs no runtime, no
  # Postgres and no Valkey; it is one Redpanda and the three one-shots that make
  # it usable. It is in this file for the one reason this file exists: a
  # running-but-UNDECLARED container is invisible, and that is the dangerous
  # direction. The `judge` lane was absent from the CLAUDE.md table while running
  # (retro B-6 / OMN-13034) and that is exactly the shape being avoided.
  #
  # WHAT IT IS FOR. The thin CI publishers used to publish to the DEV lane's
  # Redpanda. The dev lane is a fully mutable test platform that the deploy agent
  # rebuilds on every runtime-affecting merge, so every rebuild window was a
  # window in which fleet CI could not publish. On 2026-09-18 a watchdog kill
  # mid-recreate left that broker REMOVED and every Receipt Gate on the fleet was
  # red for ~35 minutes. A separate compose project is immune by construction:
  # `docker compose -p omnibase-infra …` cannot reach another project's
  # containers, volumes or network.
  #
  # `optional: false` AS OF PHASE 2 (2026-09-18). The entry shipped `optional: true`
  # deliberately and temporarily: it was declared BEFORE the project was built,
  # following the `lakshman` reservation precedent above, because bring-up needed a
  # SCRAM principal and minting a credential needs its own OPERATOR-CONSENT row
  # under Operating Rule 22 — a wait that lane could not bound. A non-optional
  # entry would have failed the census hard on every tick, for an unknown number
  # of days, on a project nobody had yet been authorised to build. That is noise,
  # not signal, and it trains a reader to ignore the census.
  #
  # That wait is over. The consent row exists
  # (`docs/tracking/ROLLING_WORK_LEDGER.md:4524`, approved_by=operator, naming the
  # credential `ci-bus-publisher`), the project is up, and this change is the one
  # that records the bring-up. Once this broker exists it must ALWAYS be up: it is
  # the durability the whole design rests on, and a CI bus that is down is a CI bus
  # that is silently queueing nothing. Leaving it optional after bring-up would be
  # the defect this file exists to catch, one level up.
  #
  # WHAT THE FLIP CHANGES, STATED PRECISELY RATHER THAN OVERSOLD. `optional` is
  # read at `scripts/lane_census_plan.py:149`, and its only effect is at `:157`: an
  # optional lane with NONE of its declared service containers running returns no
  # findings at all. This lane has one declared service container and it is running,
  # so the census already reconciles it fully today and reports zero findings either
  # way — the flip is behaviourally inert at this instant. What it buys is the case
  # this entry exists for: from here on, a ci-bus broker that has GONE AWAY is
  # `container_absent` drift rather than a silently-skipped lane. The three one-shots
  # are `kind: oneshot` and their absence after a clean exit is correct by
  # construction, so the flip does not make them noisy.
  #
  # verified: 2026-09-18T20:17Z via `ssh jonah@192.168.86.201`, POST-BRING-UP:
  #   `docker inspect -f '{{.Id}} {{.State.Status}} {{.State.Health.Status}}'
  #     omninode-ci-bus-redpanda` -> e8e29f49ba70… running healthy
  #   `ss -ltn` -> listeners now on BOTH 21092 and 21644 (neither had one before)
  #   `docker network ls --filter name=omninode-ci-bus-network … | wc -l`  -> 1
  #   `docker volume  ls --filter name=omninode-ci-bus-redpanda-data … | wc -l` -> 1
  #   `docker inspect -f '{{.State.ExitCode}}'` on omninode-ci-bus-{topics,
  #     scram-user,sasl-enable} -> 0, 0, 0
  #   `bash scripts/lane-census-check.sh --json` -> `ci-bus` present in
  #     `lanes_checked` with zero findings attributed to it
  # And OFF-HOST, from a Mac over the tailnet as the `ci-bus-publisher` principal
  # (which is how every client of this broker reaches it — they are all Actions
  # runners, none of them on this host): `rpk topic list` returns all five CI topics
  # at 6 partitions / RF 1, `rpk topic describe -c` returns retention.ms=604800000,
  # cleanup.policy=delete, segment.bytes=134217728. Both halves of the control pair
  # were taken and BOTH are load-bearing: an unauthenticated client is refused, and
  # a WRONG-PASSWORD client is refused with SASL_AUTHENTICATION_FAILED — without
  # that second refusal the successful read would not prove authentication happened
  # rather than the listener being open. A query for a topic that must not exist
  # returns UNKNOWN_TOPIC_OR_PARTITION, which is the positive control proving the
  # topic query can return a negative at all.
  # So: the project exists, its network exists, both ports it claims are now held by
  # it, and the credential works from where it will actually be used.
  ci-bus:
    hosts: [lab-201]
    compose_file: docker/docker-compose.ci-bus.yml
    compose_project: omninode-ci-bus
    network: omninode-ci-bus-network
    image_tag_pattern: '.+'
    optional: false
    services:
      - name: omninode-ci-bus-redpanda
        kind: service
        replicas: 1
      - name: omninode-ci-bus-topics
        kind: oneshot
      - name: omninode-ci-bus-scram-user
        kind: oneshot
      - name: omninode-ci-bus-sasl-enable
        kind: oneshot
# ---------------------------------------------------------------------------
# hook_edge — which lane the Claude Code hook edge publishes to (OMN-17204)
# ---------------------------------------------------------------------------
# NOT read by lane_census_plan.py (which consumes `lanes:` and
# `default_image_tag_pattern:` only). This block exists so an audit reads the
# hook edge's lane FROM THE LANE MAP instead of re-deriving it from the
# sourcing order of ~/.omnibase/.env against ~/.claude/settings.json — which is
# how it was previously "known", and which produced three separate wrong
# conclusions from one undeclared fact: OMN-16162 was flipped Done -> Backlog
# on a probe against the wrong lane, OMN-16996 was filed ("hooks report publish
# SUCCESS while zero events reach the broker") and later falsified for the same
# reason, and beta/GOAL.md row 0's hook clause named a lane that could never
# have produced a row.
#
# Authority is the omniclaude contract named below, not this block: duplicating
# the endpoint here would recreate the two-sources-one-fact problem this closes.
# This is a pointer plus the one thing the lane map is uniquely able to state —
# which lane network the relay must be attached to for the pairing to close.
#
# verified: 2026-08-30 via read-only ssh jonah@192.168.86.201
#   `docker inspect omninode-gateway-forwarder --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'`
#   -> `omnibase-infra-network` (dev lane) only, and
#   `docker network ls --format '{{.Name}}' | grep omnibase-infra`
#   -> confirms `omnibase-infra-stability-test-network` exists and is distinct.
#   Publisher side proven the same session, 2026-08-30T15:50:34Z: the shipped
#   session_start_bus_mirror.sh was invoked with KAFKA_BOOTSTRAP_SERVERS
#   deliberately preset to the DEV lane (192.168.86.201:19092) and still landed  # onex-allow-internal-ip: forensic quote of the env value the contract overrode; not a configurable endpoint
#   its record on the STABILITY lane -- marker `OMN17204LaneProof-1788105033`
#   read back via `rpk topic consume onex.evt.omniclaude.session-started.v1
#   -o -20 -n 100` inside each lane's redpanda container: 8 hits on
#   omnibase-infra-stability-test-redpanda, 0 on omnibase-infra-redpanda.
#   That is the contract beating the env var, measured rather than asserted.
hook_edge:
  # The single authority for this fact. Read it, do not re-derive it.
  contract: omniclaude/plugins/onex/hooks/contracts/hook_edge_lane.yaml
  publish_lane: stability-test
  # The relay that bridges a local .201 broker to the cloud MSK relay must be
  # attached to the publish lane's network, or nothing the hook edge writes can
  # ever reach the cloud gateway.
  relay_container: omninode-gateway-forwarder
  relay_required_network: omnibase-infra-stability-test-network
  # OPEN, and deliberately not closed here: the live forwarder is attached to
  # `omnibase-infra-network` (dev). That is the INSTANCE defect, owned by
  # OMN-17034 — either the forwarder gains a stability-lane leg with its own
  # tenant identity, or the publish lane is repointed. OMN-17204 is the RULE:
  # it makes the mismatch a check failure with a named cause instead of a zero
  # row count someone has to interpret. Repointing the publisher silently would
  # also move hook rows off the lane the .201 projection (OMN-16994/16993)
  # reads, which is a behaviour ruling OMN-17034 has to make explicitly.
  live_state: mismatch
  live_state_owner: OMN-17034
