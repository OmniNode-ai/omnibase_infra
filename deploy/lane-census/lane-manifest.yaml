# verified: 2026-09-03T12:56Z via read-only ssh jonah@192.168.86.201 `docker ps -a --filter
#   label=com.docker.compose.project=<project> --format '{{.Names}}\t{{.Status}}'` for both
#   `omnibase-infra-stability-test` and `omnibase-infra` — OMN-17562, the attestation for the
#   ten projection-writer service entries this PR adds below.
