        replicas: 1
      # The seven projection carriers the dev lane runs, mirrored per slot. A
      # slot that omitted them would consume its own prefixed topics to lag zero
      # and write nothing, with no DLQ record and no ERROR log (OMN-15905 /
      # OMN-16874) — a verification lane that silently proves nothing is worse
      # than no verification lane.
      - name: omnimarket-prepr-1-projection-tenant-registry-writer
        kind: service
        replicas: 1
      - name: omnimarket-prepr-1-projection-delegation-writer
        kind: service
        replicas: 1
      - name: omnimarket-prepr-1-projection-registration-writer
