#
# What a developer machine's principal may do on the broker the developer runs
# (OMN-20821).
#
# OMN-20825 local grant declaration
# The base grants below permit one delegation on the developer-run broker.
# They produce the delegate command, read and write its terminals, read the CLI
# terminal group prefix and describe groups.
# The adjacent machine supplement adds the lab machine ledger produce set for
# broker local at mint time (OMN-20825), preserving every base grant.
# Each base grant stays a subset of its lab counterpart; the machine supplement is
# checked separately for exact parity with the lab machine bindings and canonical
# derivation.
schema: developer-principal-grants.v1
lane: local
principal_prefix: dev-
max_devices_per_login: 5
allowed_login_domains: []
machine_grants_from: machine-principal-derived-grants.json
grants:
  - resource: topic
    name: onex.cmd.omnimarket.delegate-skill.v1
    pattern: literal
    operations: [describe, write]
  - resource: topic
    name: onex.evt.omnimarket.delegate-skill-completed.v1
    pattern: literal
    operations: [describe, read, write]
  - resource: topic
    name: onex.evt.omnimarket.delegate-skill-failed.v1
    pattern: literal
    operations: [describe, read, write]
  - resource: group
    name: local.omnibase_core.runtime_local_
    pattern: prefixed
    operations: [describe, read]
  - resource: group
    name: "*"
    pattern: literal
    operations: [describe]
