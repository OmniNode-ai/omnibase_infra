#
# onex-lane-tmp.tmpfiles.conf — age-bound retired pytest scratch (OMN-22123).
#
# pytest renames a numbered run directory to garbage-<uuid> only after acquiring
# its cleanup lock. These are retired trees whose deletion was interrupted;
# a running session continues to use its numbered pytest-<n> directory.
#
# Age alone is not a liveness check. Never age-clean the enclosing pytest-of-*
# tree, claude-* trees, or arbitrary service directories through a catch-all.
# A live run can still need an old fixture even when no file timestamp changes.
# Other lane scratch needs a lifecycle-aware owner before it can be swept.
#
# The x rules shield every name except garbage-*, including dot entries. Each
# pair excludes a shorter prefix and names differing at the next character.
# This also protects numbered pytest runs, pytest-current, locks and stray files.
# The e rule ages only retired garbage-* trees and their empty directories.
# (An e rule on garbage-* alone would empty those trees but keep the directories.)
# The e rule does not create paths and never ages the pytest-of-* directory itself.
# systemd-tmpfiles judges age per entry, using atime, mtime and file ctime.
# The regression runs these rules against a private root and checks both sides
# of the age boundary, retired directory removal and live/unrelated preservation.
# Scope is the host's /tmp only. A custom TMPDIR, --basetemp or PrivateTmp namespace
# needs its owner's cleanup policy; these rules neither inspect nor bound it.
#
# INSTALL. The host installer owns /etc/tmpfiles.d/onex-lane-tmp.conf; the distro's
# systemd-tmpfiles-clean.timer applies it daily. Replace any earlier broad rules
# with this file rather than installing both versions under different names.
#
# Type Path                         Mode UID GID Age
x /tmp/pytest-of-*/.*                 -    -   -   -
x /tmp/pytest-of-*/[!g]*              -    -   -   -
x /tmp/pytest-of-*/g                  -    -   -   -
x /tmp/pytest-of-*/g[!a]*             -    -   -   -
x /tmp/pytest-of-*/ga                 -    -   -   -
x /tmp/pytest-of-*/ga[!r]*            -    -   -   -
x /tmp/pytest-of-*/gar                -    -   -   -
x /tmp/pytest-of-*/gar[!b]*           -    -   -   -
x /tmp/pytest-of-*/garb               -    -   -   -
x /tmp/pytest-of-*/garb[!a]*          -    -   -   -
x /tmp/pytest-of-*/garba              -    -   -   -
x /tmp/pytest-of-*/garba[!g]*         -    -   -   -
x /tmp/pytest-of-*/garbag             -    -   -   -
x /tmp/pytest-of-*/garbag[!e]*        -    -   -   -
x /tmp/pytest-of-*/garbage            -    -   -   -
x /tmp/pytest-of-*/garbage[!-]*       -    -   -   -
e /tmp/pytest-of-*                    -    -   -   12h
