#
# onex-lane-tmp.tmpfiles.conf — age-bound the lane scratch under /tmp (OMN-22123).
#
# WHY. Lane and test scratch on a lab host lands in /tmp, on the root filesystem, and
# nothing removed it. On a 98 GB root filesystem one pass measured 22.7 GB of it (10.9 GB in
# pytest basetemp trees, about 12 GB in finished lane scratch directories, all untouched for
# hours to days) and the root filesystem sat at 7.1 GB free, under the 10 GB floor of the
# lane admission probe, so the host took no lane with 214 GB of memory free. The previous hand
# sweep freed 62.7 GB on 2026-11-03 and the space was gone again in about 28 hours: a recurring
# fill with no bound is a defect of the host, not a one-off.
#
# HOW. Three `e` rules, each applied on its own by systemd-tmpfiles. An `e` line matches
# the directories directly under /tmp that its glob names and removes the files inside them
# that nothing has touched for the age (the newest of atime, mtime and ctime of each file).
# Checked on h053 (systemd 255) with the same three rules scaled to seconds:
#  - Overlap is harmless. /tmp/pytest-of-* is also matched by /tmp/*, and a pytest file idle
#    past the pytest age was removed although it was far younger than the catch-all age; each
#    rule acts on its own, so the tighter bound is the one that bites and none overrides another.
#  - Age is judged per file, not per tree. In a tree a running job still writes to, a file idle
#    past the age is removed and a freshly written one stays, so a run must not depend on a
#    scratch file it has not touched for the age (12h for pytest trees, 2d for claude-*, 3d
#    for the rest).
#  - Only directories directly under /tmp are cleaned: a loose file in /tmp, a dot directory
#    such as /tmp/.X11-unix (a glob star does not match a leading dot) and a socket, wherever it
#    sits, were all left alone. The distro default for /tmp is 30 days and stays in force for
#    everything these rules do not match, and its `x` lines still protect the private service
#    directories.
#
# INSTALL. Copy to /etc/tmpfiles.d/onex-lane-tmp.conf on a lane host (root); the distro's
# systemd-tmpfiles-clean.timer applies it daily. Checked on h051 and h053 (systemd 255) against
# a scratch tree: an idle file is removed, a fresh file in the same tree is kept.
#
# Type Path                Mode UID GID Age
e /tmp/pytest-of-*          -    -   -   12h
e /tmp/claude-*             -    -   -   2d
e /tmp/*                    -    -   -   3d
