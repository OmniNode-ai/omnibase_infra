# onex-lane-tmp.tmpfiles.conf — age-bound retired pytest scratch (OMN-22123).
#
# pytest renames a numbered run directory to garbage-<uuid> only after acquiring
# its cleanup lock. These are retired trees whose deletion was interrupted;
# a running session continues to use its numbered pytest-<n> directory.
#
# Age alone is not a liveness check. Never age-clean the enclosing pytest-of-*
# tree, claude-* trees, or arbitrary service directories through a catch-all.
# A live run can still need an old fixture even when no file timestamp changes.
# Other lane scratch needs a lifecycle-aware owner before it can be swept.
#
# An e rule removes aged contents of a retired tree; it does not create paths.
# systemd-tmpfiles judges age per entry, using atime, mtime and file ctime.
# The regression runs this rule with a seconds-scale age against a private root
# and checks that retired contents disappear while live and unrelated files stay.
#
# INSTALL. The host installer owns /etc/tmpfiles.d/onex-lane-tmp.conf; the distro's
# systemd-tmpfiles-clean.timer applies it daily. Replace any earlier broad rules
# with this file rather than installing both versions under different names.
#
# Type Path                         Mode UID GID Age
e /tmp/pytest-of-*/garbage-*          -    -   -   12h
