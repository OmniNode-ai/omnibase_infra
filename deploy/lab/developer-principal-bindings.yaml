  - {broker: dev, physical_topic: onex.evt.omniclaude.hook-event.v1, direction: produce}
  - {broker: dev, physical_topic: onex.evt.omniclaude.hook-health-error.v1, direction: produce}
  - {broker: dev, physical_topic: onex.evt.omniclaude.intent-commit-bound.v1, direction: produce}
