#
# What a developer machine's lab bus principal may do (OMN-20150).
#
# This file is the declaration. `scripts/lab_principal_issuer.py` applies exactly
# these grants to every principal it issues and refuses to start if the file asks
# for more than the rules below allow. Until OMN-19799 derives broker grants for
# the whole lane, a developer principal's grants live here and nowhere else: a
# grant typed by hand on the broker is drift.
#
# THE LEDGER WRITE PATH: see the four grants after the delegation ones below.
#
# THE MINIMUM FOR ONE LANE DELEGATION (`onex delegate --bus kafka --lane dev`):
#   * produce the delegate command;
#   * read the two terminal events it waits for;
#   * write those same two terminals: a machine that runs a harness task
#     (`/omni:harness-delegate`) publishes its own delegate-skill terminal event to
#     the lane, so it must not relay the emit through the lane runtime over ssh.
#     Literal names only, never a prefix or `*`;
#   * describe consumer groups, because the CLI refuses to publish unless a live
#     lab consumer is bound to the command topic (delegate_locus.live_consumer_groups);
#   * read under the CLI's own terminal consumer group. That group is
#     `<env>.omnibase_core.runtime_local_terminal...` (omnibase_core
#     runtime_local.derive_runtime_local_group_id); a developer machine's env
#     token is `local`, the core default. The lab's kernels subscribe as
#     `local.omnimarket.*` / `local.omnibase_infra.*` groups, never under
#     `local.omnibase_core.runtime_local_`, so this prefix cannot join one of
#     their groups and take its partitions.
#
# RULES the issuer enforces on this file:
#   * operations are only read, write and describe;
#   * `*` (every resource) may carry describe only;
#   * a prefixed group grant with read must be at least 16 characters long.
#   * `{principal}` is the only placeholder, exactly once in a literal topic;
#   * `create_topic` is a bool, allowed only on a templated topic grant;
schema: developer-principal-grants.v1
lane: dev
# Principals are named <principal_prefix><login>-<device>, lower-case, [a-z0-9-].
principal_prefix: dev-
# A tailnet login may hold at most this many machine principals.
max_devices_per_login: 5
# Empty admits every user-owned device on the tailnet. Tagged devices never carry
# a user identity and are always refused.
allowed_login_domains: []
grants:
  - resource: topic
    name: onex.cmd.omnimarket.delegate-skill.v1
    pattern: literal
    operations: [write, describe]
  - resource: topic
    name: onex.evt.omnimarket.delegate-skill-completed.v1
    pattern: literal
    operations: [read, write, describe]
  - resource: topic
    name: onex.evt.omnimarket.delegate-skill-failed.v1
    pattern: literal
    operations: [read, write, describe]
  - resource: group
    name: local.omnibase_core.runtime_local_
    pattern: prefixed
    operations: [read, describe]
  # THE LEDGER WRITE PATH (OMN-20275). A machine writes a ledger row by publishing
  # the append command on its own writer topic. Only its principal may write that
  # topic, so the ledger host attributes the row to the principal named by the
  # topic: the topic WRITE ACL is the attestation, since Redpanda does not stamp
  # the producer principal on records. The shared requested.v1 topic is no longer
  # granted; the ledger host refuses anything on it as unattributed. No signing
  # key exists. The ledger host's own read grants are declared with its login in
  # the deployment's broker ACL declaration, not here. The one serve process
  # appends the row and answers on the two terminals, which the caller reads
  # under its own group (omnimarket work_ledger_bus
  # WorkLedgerAppendCaller: `local.omnimarket.work_ledger_append_client.consume.v1.`
  # plus a per-call suffix). The serve group,
  # `local.omnimarket.node_work_ledger_append_effect.consume.v1`, does not start
  # with that prefix, so a developer principal cannot join it and take commands.
  - resource: topic
    name: onex.cmd.omnimarket.work-ledger-append-from-{principal}.v1
    pattern: literal
    operations: [write, describe]
    create_topic: true
  - resource: topic
    name: onex.evt.omnimarket.work-ledger-append-completed.v1
    pattern: literal
    operations: [read, describe]
  - resource: topic
    name: onex.evt.omnimarket.work-ledger-append-failed.v1
    pattern: literal
    operations: [read, describe]
  - resource: group
    name: local.omnimarket.work_ledger_append_client.consume.v1.
    pattern: prefixed
    operations: [read, describe]
  # PR HANDOFF (OMN-17427): `onex work-ledger handoff` publishes one request
  # and reads acceptance or a terminal. Only the runtime writes these replies.
  # Its per-call group is `pr-handoff-request.<correlation_id prefix>`;
  # this prefix cannot join the orchestrator or ledger effect's runtime groups.
  - resource: topic
    name: onex.cmd.omnimarket.pr-handoff-requested.v1
    pattern: literal
    operations: [write, describe]
  - resource: topic
    name: onex.evt.omnimarket.pr-handoff-accepted.v1
    pattern: literal
    operations: [read, describe]
  - resource: topic
    name: onex.evt.omnimarket.pr-handoff-handed-off.v1
    pattern: literal
    operations: [read, describe]
  - resource: topic
    name: onex.evt.omnimarket.pr-handoff-failed.v1
    pattern: literal
    operations: [read, describe]
  - resource: group
    name: pr-handoff-request.
    pattern: prefixed
    operations: [read, describe]
  # SOURCE-CONTROL READS (OMN-21000): `onex scm <read verb>` (job-log, run-view,
  # pr-checks and the rest) publishes one github-repo-gateway read command and
  # reads its one terminal, which only the gateway node writes. The caller reads
  # under `local.omnimarket.scm_command_client.consume.v1.` plus a per-call suffix
  # (omnimarket handlers/scm ScmBusCaller); the node's serve group,
  # `local.omnimarket.node_github_repo_gateway_effect.consume...`, does not start
  # with that prefix. The write node's topics are deliberately not granted: a
  # developer machine does not mutate GitHub through the lab runtime.
  - resource: topic
    name: onex.cmd.omnimarket.github-repo-gateway-read-requested.v1
    pattern: literal
    operations: [write, describe]
  - resource: topic
    name: onex.evt.omnimarket.github-repo-gateway-read-completed.v1
    pattern: literal
    operations: [read, describe]
  - resource: group
    name: local.omnimarket.scm_command_client.consume.v1.
    pattern: prefixed
    operations: [read, describe]
  - resource: group
    name: "*"
    pattern: literal
    operations: [describe]
