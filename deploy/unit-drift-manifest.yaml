# OMN-20037: declare installed copies so a tracked fix cannot hide stale units.
# dev-200 health port 42098 was read from the installed LaunchAgent plist.
units:
  - name: deploy-agent-dev.service
    tracked: scripts/deploy-agent/deploy/deploy-agent-dev.service
    installed: ~/.config/systemd/user/deploy-agent-dev.service
    hosts:
      - omninode-pc
