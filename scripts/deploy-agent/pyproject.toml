[project]
name = "deploy-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kafka-python>=2.0.2",
    "pydantic>=2.0",
    "aiohttp>=3.14.3",
    # OMN-18057: the Phase.RUNTIME compose-up ceiling is READ from the lane's
    # compose files (deploy_agent.compose_budget) instead of being a constant,
    # so the compose model is a runtime input to the agent, not test-only data.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests in isolation",
    "promotion_guard: test controls the prod promotion-lineage guard stub itself (OMN-12626)",
    "gateway_lane: test controls the gateway-lane deploy stub itself (OMN-18134)",
]

[tool.setuptools.packages.find]
include = ["deploy_agent*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
