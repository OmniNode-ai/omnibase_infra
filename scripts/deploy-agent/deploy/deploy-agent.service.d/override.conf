#
# systemd drop-in override for deploy-agent.service on the .201 host
# (omninode-pc). Install: copy to
#   ~/.config/systemd/user/deploy-agent.service.d/override.conf
# then `systemctl --user daemon-reload && systemctl --user restart deploy-agent`.
#
# Why this file is tracked (OMN-13760): the live .201 override was previously an
# untracked, hand-edited drop-in — a durable-evidence gap. This captures the
# deployed state so the running unit matches a source-of-truth file.
#
# WatchdogSec=0 explicitly disables the systemd liveness watchdog even if an
# older base unit that still carries WatchdogSec=30 is installed. See
# deploy/deploy-agent.service for the full rationale (minutes-long synchronous
# rebuilds block the event loop; a liveness watchdog cannot distinguish a healthy
# in-progress rebuild from a hang, and Restart=on-failure recovers real crashes).
#
# NOTE (residual drift, tracked under OMN-13810): the ExecStart below runs code
# from the omni_home canonical clone (via PYTHONPATH) using the legacy standalone
# venv at /data/omninode/deploy-agent/venv. Reconciling the three divergent code
# copies + venv onto a single canonical path is OMN-13810, out of scope here.
#
# KAFKA_BOOTSTRAP_SERVERS / KAFKA_ENVIRONMENT (OMN-15181 Finding 3): this is the
# ONLY live deploy-agent process on omninode-pc. It was previously wired to the
# stability-test broker only (127.0.0.1:39092), so the prod broker's
# onex.cmd.deploy.rebuild-requested.v1 topic had zero live consumer -- a real
# gated prod redeploy command would sit unconsumed even after the network and
# resolver gaps (Findings 1-2) are fixed. Repointed here to the prod broker's
# host-mapped port (docker/docker-compose.prod.yml publishes
# ${PROD_REDPANDA_EXTERNAL_PORT:-49092}:19092 on the same host this unit runs
# on; the advertised external listener 192.168.86.201:49092 was live-verified
# reachable FROM omninode-pc itself in this session). deploy-agent carries zero
# grant-verification logic of its own (that lives upstream in
# node_redeploy_deploy_effect / the prod-promotion gate) -- it only executes
# commands that already passed the gate, matching the sanctioned "gated effect
# of an authorized dispatch" exception.
#
# TRADEOFF (single-bus instance, no multiplexing): this process cannot serve
# both lanes at once, so pointing it at prod disarms its stability-test
# rebuild capability until OMN-13810 lands a per-lane instance (or config
# knob). Disclosed, not hidden.

[Service]
WatchdogSec=0
WorkingDirectory=/data/omninode/omni_home/omnibase_infra/scripts/deploy-agent
Environment=PATH=/home/jonah/.local/bin:/usr/local/bin:/usr/bin:/bin
Environment=PYTHONPATH=/data/omninode/omni_home/omnibase_infra/scripts/deploy-agent
Environment=KAFKA_ENVIRONMENT=prod
ExecStart=
ExecStart=/usr/bin/env PATH=/home/jonah/.local/bin:/usr/local/bin:/usr/bin:/bin PYTHONPATH=/data/omninode/omni_home/omnibase_infra/scripts/deploy-agent KAFKA_BOOTSTRAP_SERVERS=192.168.86.201:49092 KAFKA_ENVIRONMENT=prod /data/omninode/deploy-agent/venv/bin/python -m deploy_agent
